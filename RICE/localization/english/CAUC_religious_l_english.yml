l_english:
 CAUC_derbent_guards_decision:0 "Recruit Rus Guards at $c_derbent$"
 CAUC_derbent_guards_decision_desc:0 "A Rus retinue offers its service at the gate. Their captain promises loyalty, but the town’s preachers object to placing men of another religion beside my household. I will hear both sides before settling the guards’ position."
 CAUC_derbent_guards_decision_tooltip:0 "Meet a Slavic Rus captain and recruit 500 event troops. Hire him as an Excellent bodyguard if a position is available, or retain only the company."
 CAUC_derbent_guards_decision_context:0 "In 989–990, the preacher Musa al-Tusi demanded that Maymun of Derbent surrender his Rus guards for conversion or death. Maymun refused; a siege and his departure followed. This story adapts the dispute without recreating its participants."
 CAUC_derbent_guards_decision_confirm:0 "Convene the meeting"
 CAUC.0100.t:0 "An Oath at the Gate"
 CAUC.0100.desc:0 "[CAUC_rus_speaker.GetFirstName] sets a scarred shield at my feet. Five hundred Rus have followed this captain down the Caspian routes. He still swears by the Slavic gods: “My spear will guard your door if your coin feeds my men.” I can take him into my household, or contract his company without giving him a place beside my bedchamber."
 CAUC.0100.a:0 "You will be my bodyguard. Your men will join my army."
 CAUC.0101.t:0 "The Preacher’s Demand"
 CAUC.0101.desc:0 "A preacher has gathered a crowd outside the barracks. “Will an unbeliever stand closer to our ruler than we do?” [CAUC_rus_speaker.GetFirstName] refuses to renounce his faith at swordpoint. His soldiers are already under contract; the quarrel now concerns his oath and his access to my household."
 CAUC.0101.a:0 "I will answer for his oath."
 CAUC.0101.b:0 "Let him hear our teachers freely, without a forced conversion."
 CAUC.0101.c:0 "The company keeps its contract; the captain gets no special privilege."
 CAUC.0102.t:0 "The Town’s Answer"
 CAUC.0102.desc:0 "The watch has been posted, but the captain waits for a public answer. The men will remember whether I stood beside them when the crowd shouted. A personal welcome will cost provisions; a curt order costs nothing, and promises little."
 CAUC.0102.a:0 "Share my table; there will be no doubt about my word."
 CAUC.0102.b:0 "Your company has its orders."
 CAUC_rus_protected:0 "Protected Rus Retinue"
 CAUC_rus_protected_desc:0 "The ruler protects foreign guards despite local religious objections."
 CAUC_rus_instructed:0 "Instruction for the Retinue"
 CAUC_rus_instructed_desc:0 "Religious instruction and new service terms retain part of the foreign retinue."
 CAUC_rus_dismissed:0 "Restricted Rus Privileges"
 CAUC_rus_dismissed_desc:0 "The company keeps its military contract, but its captain receives no guarantee of separate religious privileges."
 CAUC_lori_council_decision:0 "Hear the Churches of $c_lori$"
 CAUC_lori_council_decision_desc:0 "The monasteries disagree over proposals for closer relations with neighboring churches. Some fear that agreement will cost them their liturgy and authority over their houses. I can host a discussion and decide what protection or support to offer."
 CAUC_lori_council_decision_tooltip:0 "Choose between monastic autonomy, ecclesiastical dialogue and guarantees for both sides. A three-stage discussion produces a five-year policy."
 CAUC_lori_council_decision_context:0 "During the Armenian–Byzantine union negotiations of the 1170s, the leaders of Sanahin and Haghpat opposed concessions and did not attend the Hromkla council, dated to 1178 or 1179. This local dispute is a fictional adaptation, not the council itself."
 CAUC_lori_council_decision_confirm:0 "Convene the meeting"
 CAUC.0110.t:0 "The Abbots’ Conditions"
 CAUC.0110.desc:0 "[CAUC_abbot_speaker.GetFirstName] pushes the proposed agreement back across my table. Beside him, [CAUC_envoy_speaker.GetFirstName] opens a Greek manuscript. The abbot will not let a translator bargain away the prayers of his community. The envoy asks who will read the disputed words with him."
 CAUC.0110.a:0 "Abbot, remain here and defend your community’s prayers."
 CAUC.0110.b:0 "The envoy will teach my scholars to read the original."
 CAUC.0110.c:0 "Both shall be heard; I will pay for an independent translation."
 CAUC.0111.t:0 "Words in the Margin"
 CAUC.0111.desc:0 "The second manuscript arrives with an angry note in the margin. A word rendered as “agreement” can also imply submission. [CAUC_abbot_speaker.GetFirstName] asks me to read the passage aloud. [CAUC_envoy_speaker.GetFirstName] offers lessons, but withdrawing the proposal would spare them both a humiliating signature."
 CAUC.0111.a:0 "Teach me the words before I put my seal beneath them."
 CAUC.0111.b:0 "Withdraw this wording. No one will sign under duress."
 CAUC.0112.t:0 "A Record of the Discussion"
 CAUC.0112.desc:0 "The disputants have kept their own churches. Their arguments, however, fill a new volume. [CAUC_abbot_speaker.GetFirstName] brings it wrapped in linen. I may take this record into my library, or give its makers a permanent place among my household scholars."
 CAUC.0112.a:0 "Bind the disputation for my library."
 CAUC.0112.b:0 "The abbot will remain as my teacher."
 CAUC_lori_autonomy:0 "Monastic Autonomy"
 CAUC_lori_autonomy_desc:0 "Local monasteries retain authority over their liturgy and houses."
 CAUC_lori_rapprochement:0 "Ecclesiastical Dialogue"
 CAUC_lori_rapprochement_desc:0 "Translations and discussions encourage learning, but local opponents distrust the proposals."
 CAUC_lori_guarantees:0 "Guaranteed Local Rites"
 CAUC_lori_guarantees_desc:0 "A funded agreement safeguards local practice while allowing dialogue."
 CAUC_ani_sanctuary_decision:0 "Settle the Use of Ani’s Cathedral"
 CAUC_ani_sanctuary_decision_desc:0 "The cathedral has changed hands, and its present congregation fears another change. Petitioners bring deeds, memories and claims of conquest. I can settle the building’s use and decide what protection its displaced congregation will receive."
 CAUC_ani_sanctuary_decision_tooltip:0 "Record the sanctuary’s use, settle rival claims and protect another place of worship. The county’s faith will not change."
 CAUC_ani_sanctuary_decision_context:0 "Ani’s cathedral became a mosque following the conquest of 1064 and returned to church use in 1124. The initial use follows those dates; subsequent choices persist in this save. The petitions and settlement are fictional."
 CAUC_ani_sanctuary_decision_confirm:0 "Convene the meeting"
 CAUC_ani_church_use:0 "The cathedral is recorded as a church."
 CAUC_ani_mosque_use:0 "The cathedral is recorded as a mosque."
 CAUC.0120.t:0 "One Building, Two Claims"
 CAUC.0120.desc:0 "[CAUC_warden_speaker.GetFirstName] lays the cathedral keys beside a worn dedication. [CAUC_imam_speaker.GetFirstName] produces the deed granted to the mosque. Both have worshippers waiting outside. Whoever loses the building will need a home for their prayers, and both men demand a judgment they can carry back to the street."
 CAUC.0120.a:0 "Return the cathedral keys to its Christian keeper."
 CAUC.0120.b:0 "Confirm the mosque’s deed and its endowment."
 CAUC.0120.c:0 "The present congregation keeps the keys; neither side may expel the other."
 CAUC.0121.t:0 "The Keys and the Deeds"
 CAUC.0121.desc:0 "The judgment has divided the street. [CAUC_warden_speaker.GetFirstName] and [CAUC_imam_speaker.GetFirstName] ask who will guarantee safe passage to prayer. I can bring both men to my court to negotiate, or post a watch while their followers find separate rooms."
 CAUC.0121.a:0 "Both spokesmen will negotiate under my roof."
 CAUC.0121.b:0 "Pay a watch to protect the congregations."
 CAUC.0122.t:0 "A Place to Pray"
 CAUC.0122.desc:0 "The keys have found their keeper. The other community has cleared an empty room, but its roof leaks. [CAUC_warden_speaker.GetFirstName] and [CAUC_imam_speaker.GetFirstName] return together: one carrying his deed, the other a list of timber. My judgment can leave a usable place to pray, or merely a locked door."
 CAUC.0122.a:0 "Repair the displaced congregation’s roof."
 CAUC.0122.b:0 "Let the two keepers administer these promises together."
 CAUC_ani_church_restored:0 "Restored Cathedral"
 CAUC_ani_church_restored_desc:0 "The cathedral has been restored to Christian worship, despite rival claims."
 CAUC_ani_mosque_endowed:0 "Endowed Mosque"
 CAUC_ani_mosque_endowed_desc:0 "An endowment supports the mosque, despite rival claims to the building."
 CAUC_ani_existing_use:0 "Protected Places of Worship"
 CAUC_ani_existing_use_desc:0 "The sanctuary retains its present use and other congregations receive protection."
 CAUC_alan_mission_decision:0 "Receive Missionaries in Alania"
 CAUC_alan_mission_decision_desc:0 "Christian envoys ask for land and safe passage. Local elders fear for the sanctuaries where their families have long gathered. I will hear the envoys and decide whether their mission should receive support, limits or an order to leave."
 CAUC_alan_mission_decision_tooltip:0 "Meet an Orthodox missionary and an Alan elder. Recruit a teacher or northern riders, resolve their boundary dispute, and choose whether to accept baptism personally."
 CAUC_alan_mission_decision_context:0 "Al-Masudi reported an expulsion of Christian clergy from Alania in 932. The extent of that reversal remains uncertain, and conversion proceeded gradually. This story uses local sanctuaries without projecting modern Ossetian divine names back into the ninth century."
 CAUC_alan_mission_decision_confirm:0 "Convene the meeting"
 CAUC.0130.t:0 "The Mission’s Request"
 CAUC.0130.desc:0 "[CAUC_missionary_speaker.GetFirstName] opens a gospel before the elders. [CAUC_elder_speaker.GetFirstName] stops him before he names a site for his church: “That ground holds the oaths of our families.” The missionary offers a teacher for my household; the elder offers riders who know every northern pass."
 CAUC.0130.a:0 "The missionary will teach at my court, on land I grant."
 CAUC.0130.b:0 "Both will remain and answer to one another."
 CAUC.0130.c:0 "Elder, bring your riders. The mission has no grant."
 CAUC.0131.t:0 "An Oath at the Sanctuary"
 CAUC.0131.desc:0 "[CAUC_elder_speaker.GetFirstName] brings a broken boundary stake. Someone has moved it overnight; the missionary’s pupils were seen nearby. [CAUC_missionary_speaker.GetFirstName] denies ordering it. A feud may begin over a few paces of earth. I must demand restitution or insist that my earlier grant stands."
 CAUC.0131.a:0 "Restore the marker at my expense."
 CAUC.0131.b:0 "The mission must yield the disputed ground."
 CAUC.0132.t:0 "What the Families Remember"
 CAUC.0132.desc:0 "The boundary has been settled. [CAUC_missionary_speaker.GetFirstName] asks for my own answer to his teaching. [CAUC_elder_speaker.GetFirstName] waits at the doorway, unwilling to offer a prayer on my behalf. If I accept baptism, this will be my choice, not a decree converting every family in Alania."
 CAUC.0132.a:0 "I will receive baptism into the missionary’s faith."
 CAUC.0132.b:0 "Stay as a teacher; belief cannot be commanded."
 CAUC_alan_mission_supported:0 "Supported Christian Mission"
 CAUC_alan_mission_supported_desc:0 "The mission receives land and protection, while local families dispute its influence."
 CAUC_alan_old_rites_protected:0 "Protected Local Sanctuaries"
 CAUC_alan_old_rites_protected_desc:0 "Local rites retain protection while missionaries may teach within agreed limits."
 CAUC_alan_mission_dismissed:0 "Missionaries Sent Away"
 CAUC_alan_mission_dismissed_desc:0 "The mission has departed, strengthening the elders’ position but ending its patronage."
 CAUC_tondrakian_inquiry_decision:0 "Hear the Tondrakian Preachers"
 CAUC_tondrakian_inquiry_decision_desc:0 "Reports from the villages speak of assemblies that reject holy images and question the clergy’s rights to rents and tithes. Churchmen demand an inquiry. I will hear the preachers, examine the property claims and decide whether to shelter, suppress or join their movement."
 CAUC_tondrakian_inquiry_decision_tooltip:0 "Begin a five-stage inquiry into Smbat Zarehavantsi’s rite. Armenian Apostolic rulers may join for 500 Piety, adopting it alongside Apahunik. Later inquiries hear a surviving follower if the founder has died."
 CAUC_tondrakian_inquiry_decision_context:0 "Tondrakian communities are attested in ninth- to eleventh-century Armenia. Much of the evidence comes from hostile church writers, including Grigor Magistros. The rite’s $tenet_aniconism_name$, $tenet_communal_possessions_name$, $tenet_unrelenting_faith_zandik_name$ and gender equality are a gameplay interpretation chosen for this expansion."
 CAUC_tondrakian_inquiry_decision_confirm:0 "Convene the meeting"
 CAUC.0140.t:0 "A Gathering without Images"
 CAUC.0140.desc:0 "[CAUC_tondrakian_speaker.GetFullName] speaks for the assemblies. The visitors describe a meeting without holy images. Men and women speak in turn; no hereditary priest claims authority over them. A church envoy calls this disorder and asks me to close the assembly. Before judging, I must decide how the inquiry will be conducted."
 CAUC.0140.a:0 "Hear the villagers under my protection."
 CAUC.0140.b:0 "Let the church present its accusations first."
 CAUC.0140.c:0 "Pay clerks to record both accounts."
 CAUC.0141.t:0 "Whose Voice May Be Heard?"
 CAUC.0141.desc:0 "[CAUC_representative_speaker.GetFirstName] steps out from behind Smbat’s followers. The envoy orders her to be silent, but she puts the rent accounts on my table herself. “If I can keep these fields alive, I can speak for those who work them.” Letting her answer gives the assemblies a representative in my household."
 CAUC.0141.a:0 "She will speak before my court."
 CAUC.0141.b:0 "Follow the church’s procedure for this hearing."
 CAUC.0142.t:0 "Fields Held in Common"
 CAUC.0142.desc:0 "[CAUC_tondrakian_speaker.GetFullName] speaks for the assemblies. The assembly’s account turns to land. Several families cultivate fields together and ask that the harvest support their households before any lord takes a rent. The church presents a deed claiming those fields. The dispute is no longer confined to worship: someone must decide who may collect the grain."
 CAUC.0142.a:0 "Commission a survey before rents are collected."
 CAUC.0142.b:0 "Suspend the disputed rents until my judgment."
 CAUC.0142.c:0 "Keep the existing collections during the inquiry."
 CAUC.0143.t:0 "The Ruler’s Judgment"
 CAUC.0143.desc:0 "[CAUC_tondrakian_speaker.GetFullName] speaks for the assemblies. I have heard the accusations and the villagers’ replies. They ask for assemblies without images, common property and the right to resist those who oppress them. Their spokespeople insist that men and women must stand as equals. I can shelter the community, enforce the church’s prohibition, or adopt their rite myself."
 CAUC.0143.a:0 "Protect their assemblies without adopting the rite."
 CAUC.0143.b:0 "Close the assemblies and uphold the prohibition."
 CAUC.0143.c:0 "I will stand with them as a Tondrakian."
 CAUC.0144.t:0 "After the Judgment"
 CAUC.0144.desc:0 "[CAUC_tondrakian_speaker.GetFullName] speaks for the assemblies. My judgment has reached the villages. The decision over assemblies, rents and religious authority will shape their dealings with my officers. A clerk offers to record the terms and the testimony heard, so that the next dispute cannot erase what was promised."
 CAUC.0144.a:0 "Record the equal standing of women and men."
 CAUC.0144.b:0 "Put the settlement and its testimony in writing."
 CAUC.0144.c:0 "My officers will uphold the judgment."
 CAUC_tondrakian_refuge:0 "Sheltered Tondrakian Assemblies"
 CAUC_tondrakian_refuge_desc:0 "The ruler shelters the community, while opponents dispute its assemblies and common property."
 CAUC_tondrakian_suppressed:0 "Tondrakian Assemblies Suppressed"
 CAUC_tondrakian_suppressed_desc:0 "Religious authorities welcome the prohibition, but enforcement unsettles the villages."
 CAUC_tondrakian_assembly:0 "Tondrakian Common Assembly"
 CAUC_tondrakian_assembly_desc:0 "The ruler and county adopt the Tondrakian rite, supporting equal participation and common holdings."
 CAUC_tondrakian_rite:0 "Tondrakian Rite"
 CAUC_tondrakian_rite_adj:0 "Tondrakian"
 CAUC_tondrakian_rite_adherent:0 "Tondrakian"
 CAUC_tondrakian_rite_adherent_plural:0 "Tondrakians"
 CAUC_smbat_zarehavantsi_name:0 "Smbat Zarehavantsi"
 CAUC_tondrakian_rite_desc:0 "An Armenian Apostolic branch rite associated with the assemblies of Tondrak. $generic_rite_focus_tenet_aniconism$"
 CAUC_tondrakian_rite_founded_desc:0 "[ROOT.Rite.GetNameNoTooltip] was founded by [GetGlobalVariable('CAUC_tondrakian_founder').Char.GetFullName] in [GetGlobalVariable('CAUC_tondrakian_origin').Title.GetNameNoTier] in [GetGlobalVariable('CAUC_tondrakian_founding_year').GetValue|0], as a rite within the [ROOT.Rite.GetFaith.GetAdjective] faith. [ROOT.Rite.Custom('GetGenericRiteTenetSentence')]"
 CAUC_rus_event_army:0 "Rus Company"
 CAUC_scholarly_book_modifier:0 "Scholarly Manuscript"
 CAUC_scholarly_book_modifier_desc:0 "The work of a Caucasian scholar."
 CAUC_lori_book:0 "The Lori Disputation"
 CAUC_lori_book_desc:0 "Arguments and translations from the churches of Lori, preserved at the patron’s expense."
 CAUC_gelati_book:0 "Studies at Kutaisi"
 CAUC_gelati_book_desc:0 "A bound volume prepared by the teachers near Kutaisi."
 CAUC_tondrakian_book:0 "Testimony of the Assemblies"
 CAUC_tondrakian_book_desc:0 "The testimony of Smbat’s followers, including the women who spoke at the hearing."
 CAUC.0100.b:0 "I need the five hundred soldiers, not a household guard."
 CAUC.0121.c:0 "Their elders must keep the peace."
 CAUC.0131.c:0 "My grant stands. Take this grievance to my officers."
 CAUC.0132.c:0 "I will ride with the elders and keep my own worship."
 CAUC_alan_event_army:0 "Riders of the Northern Passes"
 CAUC.0150.t:0 "A New Rite at Tondrak"
 CAUC.0150.desc:0 "[CAUC_tondrakian_speaker.GetFullName] has begun preaching among the Armenian villages near Tondrak. His followers gather without holy images, hold property in common and deny that men and women stand differently before God. Churchmen demand his silence. His rite now has a name; rulers in Apahunik may hear his followers and decide whether to protect, imprison or join them."
 CAUC.0150.b:0 "I will join this Armenian rite."
 CAUC.0150.a:0 "Word of these assemblies will spread."
 CAUC.0001.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. My overseer lays out the accounts for the repaired road and walls. Merchants want more room for their caravans. The garrison asks for stores, while the nearby settlements want me to settle their obligations. I have enough funds to support one proposal for the coming years."
 CAUC.0001.d:0 "Offer this skilled representative a place at my court."
 CAUC.0002.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. The monks bring a list of their needs: parchment for copying, support for pupils and repairs to rooms where they work. My grant will cover one undertaking. They ask me to name my preference before they commit the funds."
 CAUC.0002.d:0 "Commission a bound manuscript for my library."
 CAUC.0003.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. The households have sent representatives to discuss repairs. Some can supply labor; others would rather provide grain or stone. My steward wants one rule for everyone, but the representatives ask me to account for what each household can spare."
 CAUC.0003.d:0 "Offer this skilled representative a place at my court."
 CAUC.0004.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. The teachers ask for funds to acquire books and keep their pupils at study. A copyist has also proposed a volume bearing my name as patron. I must decide how much of the grant should serve my reputation."
 CAUC.0004.d:0 "Commission a bound manuscript for my library."
 CAUC.0010.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. My overseer has found damage to a retaining wall beside the approach to $c_derbent$. The workers can repair it now, but they need another payment. Delaying the work would spare my treasury and leave the nearby households to cope with the damage."
 CAUC.0010.d:0 "Offer this skilled representative a place at my court."
 CAUC.0011.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. A caravan has reached $c_derbent$, and its merchants complain that the space allotted to their animals is too cramped. They offer to pay for more room. My steward warns that granting their request will inconvenience the residents who use the same ground."
 CAUC.0011.d:0 "Offer this skilled representative a place at my court."
 CAUC.0012.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. The officer responsible for the passage shows me the remaining stores. There is enough for the current watch, but little to cover a longer posting. I can purchase supplies or shorten the men's duties."
 CAUC.0012.d:0 "Offer this skilled representative a place at my court."
 CAUC.0013.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. Two settlements disagree over the maintenance of a stretch of road near $c_derbent$. Each claims that the other benefited more from last year's repairs. Their representatives have brought me their accounts and ask me to settle the division of work."
 CAUC.0013.d:0 "Offer this skilled representative a place at my court."
 CAUC.0014.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. My officials report a small party of visitors seeking passage through $c_derbent$. They carry letters of introduction and ask for help finding an escort. I can meet their needs through my household or leave them to make arrangements in the town."
 CAUC.0014.d:0 "Offer this skilled representative a place at my court."
 CAUC.0015.desc:0 "[CAUC_overseer_speaker.GetFirstName] brings this matter before me. Falling stone has obstructed part of the approach to $c_derbent$. Travelers can pass, but carts must wait while laborers clear a track. The overseer wants funds to complete the work before the next caravan arrives."
 CAUC.0015.d:0 "Offer this skilled representative a place at my court."
 CAUC.0020.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. The copyists in $c_lori$ have used more parchment than their grant allowed. They ask me to pay for another supply or permit them to postpone part of their work."
 CAUC.0020.d:0 "Commission a bound manuscript for my library."
 CAUC.0021.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. A teacher in $c_lori$ writes on behalf of a pupil whose household cannot afford further study. The teacher considers the pupil able and asks me to cover the cost."
 CAUC.0021.d:0 "Commission a bound manuscript for my library."
 CAUC.0022.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. A scholar from $c_lori$ has sent me two readings of a passage in a theological work. The copyists disagree over which reading belongs in their new volume. The scholar invites me to hear the evidence."
 CAUC.0022.d:0 "Commission a bound manuscript for my library."
 CAUC.0023.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. A copyist offers to name my house in the dedication of a new book. The other patrons have already paid for much of the work. I can claim the place of honor or ask the copyist to record their contributions alongside mine."
 CAUC.0023.d:0 "Commission a bound manuscript for my library."
 CAUC.0024.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. A damaged roof has let rain into a workroom in $c_lori$. The scholars have moved the books, but they need help repairing the room before they can resume copying there."
 CAUC.0024.d:0 "Commission a bound manuscript for my library."
 CAUC.0025.desc:0 "[CAUC_scholar_speaker.GetFirstName] brings this matter before me. A scholar brings a completed volume from $c_lori$ and offers to explain it at my table. My attendants have other business waiting. I can postpone it and spend the afternoon reading."
 CAUC.0025.d:0 "Commission a bound manuscript for my library."
 CAUC.0030.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. Representatives from $c_svaneti$ disagree over which households should provide workers for the next repairs. One household has supplied labor twice; another argues that it contributed stone in place of workers."
 CAUC.0030.d:0 "Offer this skilled representative a place at my court."
 CAUC.0031.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. A mason in $c_svaneti$ has proposed repairs to a tower's upper floor. The household can supply materials, but it asks me to pay for the mason's work."
 CAUC.0031.d:0 "Offer this skilled representative a place at my court."
 CAUC.0032.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. The overseer in $c_svaneti$ wants to summon workers for repairs. Several households ask him to wait until they have brought in their harvest. I must choose between finishing the work and leaving them time in their fields."
 CAUC.0032.d:0 "Offer this skilled representative a place at my court."
 CAUC.0033.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. The representatives of $c_svaneti$ have gathered to compare their contributions to the repairs. They invite me to hear the accounts and confirm the duties they propose for the coming year."
 CAUC.0033.d:0 "Offer this skilled representative a place at my court."
 CAUC.0034.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. Travelers have asked a household in $c_svaneti$ for shelter while they wait for better weather. The household has little to spare and requests provisions from my stores."
 CAUC.0034.d:0 "Offer this skilled representative a place at my court."
 CAUC.0035.desc:0 "[CAUC_mason_speaker.GetFirstName] brings this matter before me. The men keeping watch near the towers in $c_svaneti$ ask for repairs to their shelter and a supply of grain. Their spokesman presents the request as part of the maintenance I promised to support."
 CAUC.0035.d:0 "Offer this skilled representative a place at my court."
