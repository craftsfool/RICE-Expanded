l_french:
 CAUC_derbent_guards_decision:0 "Recruter une garde rus’ à $c_derbent$"
 CAUC_derbent_guards_decision_desc:0 "Une troupe rus’ propose ses services à la porte. Son capitaine promet sa fidélité, mais les prédicateurs de la ville s’opposent à ce que des hommes d’une autre religion gardent ma maisonnée. J’entendrai les deux parties avant de fixer la place de ces gardes."
 CAUC_derbent_guards_decision_tooltip:0 "Recruter une troupe et régler les objections religieuses dans un récit en trois étapes. La politique finale dure cinq ans."
 CAUC_derbent_guards_decision_context:0 "En 989–990, le prédicateur Musa al-Tusi exigea que Maymun de Derbent livre ses gardes rus’ pour qu’ils se convertissent ou soient mis à mort. Maymun refusa ; un siège et son départ suivirent. Ce récit adapte le différend sans recréer ses protagonistes."
 CAUC_derbent_guards_decision_confirm:0 "Réunir les parties"
 CAUC.0100.t:0 "Un serment à la porte"
 CAUC.0100.desc:0 "Le capitaine rus’ prête serment de service. Ses hommes obéiront à mes officiers et recevront leur solde de mon trésor. Un prédicateur demande si ce serment peut lier des hommes qui ne partagent pas notre culte. J’ai promis de les entendre avant toute exigence envers la troupe."
 CAUC.0100.a:0 "Consigner le serment et convoquer le prédicateur."
 CAUC.0101.t:0 "L’exigence du prédicateur"
 CAUC.0101.desc:0 "Le prédicateur exige que les gardes soient instruits et adoptent notre foi. Le capitaine répond que ses hommes sont venus servir, non abandonner leurs croyances. Les anciens de la ville avertissent que la querelle attire une foule. Je dois décider quel engagement sera garanti par mon autorité."
 CAUC.0101.a:0 "Leur service leur vaut ma protection."
 CAUC.0101.b:0 "Offrir une instruction et une solde à ceux qui l’acceptent."
 CAUC.0101.c:0 "Payer leur départ et congédier la troupe."
 CAUC.0102.t:0 "La réponse de la ville"
 CAUC.0102.desc:0 "Les anciens apportent des requêtes au sujet de ma décision. Certains saluent un règlement clair ; d’autres demandent que je le revoie. Mes officiers réclament des fonds pour ravitailler la garde pendant que la ville s’adapte. Je peux financer cette assurance ou leur demander de respecter les arrangements déjà pris."
 CAUC.0102.a:0 "Fournir les fonds et confirmer le règlement."
 CAUC.0102.b:0 "Le règlement tient ; il n’y aura pas de nouveau don."
 CAUC_rus_protected:0 "Troupe rus’ protégée"
 CAUC_rus_protected_desc:0 "Le dirigeant protège les gardes étrangers malgré les objections religieuses locales."
 CAUC_rus_instructed:0 "Instruction de la troupe"
 CAUC_rus_instructed_desc:0 "Une instruction religieuse et de nouvelles conditions de service retiennent une partie de la troupe étrangère."
 CAUC_rus_dismissed:0 "Gardes étrangers congédiés"
 CAUC_rus_dismissed_desc:0 "La troupe est partie ; les autorités religieuses locales saluent la décision."
 CAUC_lori_council_decision:0 "Entendre les Églises de $c_lori$"
 CAUC_lori_council_decision_desc:0 "Les monastères ne s’accordent pas sur les propositions de rapprochement avec les Églises voisines. Certains craignent d’y perdre leur liturgie et l’autorité sur leurs maisons. Je peux accueillir une discussion et décider des garanties ou du soutien à offrir."
 CAUC_lori_council_decision_tooltip:0 "Choisir entre l’autonomie monastique, le dialogue ecclésiastique et des garanties pour les deux parties. Une discussion en trois étapes aboutit à une politique de cinq ans."
 CAUC_lori_council_decision_context:0 "Lors des négociations d’union arméno-byzantines des années 1170, les responsables de Sanahin et de Haghpat s’opposèrent aux concessions et n’assistèrent pas au concile de Hromkla, daté de 1178 ou 1179. Ce différend local est une adaptation fictive, non le concile lui-même."
 CAUC_lori_council_decision_confirm:0 "Réunir les parties"
 CAUC.0110.t:0 "Les conditions des abbés"
 CAUC.0110.desc:0 "Les abbés acceptent de discuter d’un rapprochement, mais demandent qu’aucun accord ne leur soit imposé avant leur examen. Un envoyé affirme que tout retard offensera l’Église voisine. Je peux protéger l’indépendance des monastères, soutenir le rapprochement ou exiger des garanties avant de poursuivre."
 CAUC.0110.a:0 "Leurs maisons jugeront elles-mêmes de leur liturgie."
 CAUC.0110.b:0 "Financer le dialogue et la traduction des propositions."
 CAUC.0110.c:0 "Garantir les rites locaux avant de discuter d’un accord."
 CAUC.0111.t:0 "Des mots dans la marge"
 CAUC.0111.desc:0 "Une proposition traduite est parvenue aux copistes. Un lecteur estime qu’elle préserve les usages locaux ; un autre trouve une concession dissimulée dans la marge. Les abbés demandent une seconde traduction avant de poursuivre. Ce travail exigera des fonds et du temps."
 CAUC.0111.a:0 "Payer une seconde lecture."
 CAUC.0111.b:0 "Suspendre cette proposition et maintenir les garanties."
 CAUC.0112.t:0 "Le compte rendu de la discussion"
 CAUC.0112.desc:0 "La discussion s’est achevée sans réunir les Églises en une seule institution. Les copistes ont consigné les arguments et mes promesses aux monastères restent en vigueur. Ils me demandent si je financerai la diffusion du compte rendu ou le laisserai dans leurs bibliothèques."
 CAUC.0112.a:0 "Que d’autres savants puissent lire ces échanges."
 CAUC.0112.b:0 "Conserver le compte rendu dans les monastères."
 CAUC_lori_autonomy:0 "Autonomie monastique"
 CAUC_lori_autonomy_desc:0 "Les monastères locaux conservent l’autorité sur leur liturgie et leurs maisons."
 CAUC_lori_rapprochement:0 "Dialogue ecclésiastique"
 CAUC_lori_rapprochement_desc:0 "Les traductions et les discussions favorisent les études, mais les opposants locaux se méfient des propositions."
 CAUC_lori_guarantees:0 "Rites locaux garantis"
 CAUC_lori_guarantees_desc:0 "Un accord financé protège les usages locaux tout en permettant le dialogue."
 CAUC_ani_sanctuary_decision:0 "Régler l’usage de la cathédrale d’Ani"
 CAUC_ani_sanctuary_decision_desc:0 "La cathédrale a changé de mains et sa communauté actuelle redoute un nouveau changement. Les requérants apportent des actes, des souvenirs et des droits issus de la conquête. Je peux fixer l’usage du bâtiment et décider de la protection accordée à la communauté déplacée."
 CAUC_ani_sanctuary_decision_tooltip:0 "Consigner l’usage du sanctuaire, régler les revendications et protéger un autre lieu de culte. La foi du comté restera inchangée."
 CAUC_ani_sanctuary_decision_context:0 "La cathédrale d’Ani fut transformée en mosquée après la conquête de 1064, puis rendue au culte chrétien en 1124. Son usage initial suit ces dates ; les choix ultérieurs restent enregistrés dans cette partie. Les requêtes et le règlement sont fictifs."
 CAUC_ani_sanctuary_decision_confirm:0 "Réunir les parties"
 CAUC_ani_church_use:0 "La cathédrale est enregistrée comme église."
 CAUC_ani_mosque_use:0 "La cathédrale est enregistrée comme mosquée."
 CAUC.0120.t:0 "Un bâtiment, deux revendications"
 CAUC.0120.desc:0 "Les requérants étalent leurs documents devant moi. Une communauté rappelle la consécration de la cathédrale ; l’autre invoque les droits accordés après la conquête. Un changement d’usage exigera des réparations et une nouvelle dotation. Quelle que soit ma décision, la communauté déplacée demande un lieu où pratiquer son culte sans entrave."
 CAUC.0120.a:0 "Rendre la cathédrale au culte chrétien."
 CAUC.0120.b:0 "Doter le bâtiment en tant que mosquée."
 CAUC.0120.c:0 "Confirmer son usage actuel et protéger les autres cultes."
 CAUC.0121.t:0 "Les clefs et les actes"
 CAUC.0121.desc:0 "L’usage du bâtiment a été inscrit au registre. Les clercs doivent désormais régler sa dotation et trouver un autre lieu pour la communauté dont la revendication a été rejetée. Les requérants disputent les loyers et les accès. Une enquête coûterait de l’argent ; faire appliquer les actes existants serait plus rapide, mais moins bien accueilli."
 CAUC.0121.a:0 "Payer les arpenteurs pour établir les limites."
 CAUC.0121.b:0 "Faire appliquer les actes existants."
 CAUC.0122.t:0 "Un lieu pour prier"
 CAUC.0122.desc:0 "Les deux communautés ont reçu une copie de mon jugement. L’usage attribué à la cathédrale reste enregistré, et l’autre communauté bénéficie d’une promesse de protection pour son propre lieu de culte. Les clercs me demandent si je financerai les réparations ou en laisserai l’entretien aux fidèles."
 CAUC.0122.a:0 "Accorder un don à l’autre communauté."
 CAUC.0122.b:0 "Leur protection est garantie ; ils assureront l’entretien."
 CAUC_ani_church_restored:0 "Cathédrale restaurée"
 CAUC_ani_church_restored_desc:0 "La cathédrale a été rendue au culte chrétien malgré les revendications concurrentes."
 CAUC_ani_mosque_endowed:0 "Mosquée dotée"
 CAUC_ani_mosque_endowed_desc:0 "Une dotation soutient la mosquée malgré les revendications concurrentes sur le bâtiment."
 CAUC_ani_existing_use:0 "Lieux de culte protégés"
 CAUC_ani_existing_use_desc:0 "Le sanctuaire conserve son usage actuel et les autres communautés bénéficient d’une protection."
 CAUC_alan_mission_decision:0 "Recevoir des missionnaires en Alanie"
 CAUC_alan_mission_decision_desc:0 "Des envoyés chrétiens demandent des terres et un passage sûr. Les anciens craignent pour les sanctuaires où leurs familles se réunissent depuis longtemps. J’entendrai les envoyés et déciderai de soutenir leur mission, de la limiter ou de leur ordonner de partir."
 CAUC_alan_mission_decision_tooltip:0 "Régler un différend en trois étapes entre les missionnaires et les rites locaux. La politique dure cinq ans, sans conversion collective imposée."
 CAUC_alan_mission_decision_context:0 "Al-Masudi rapporte l’expulsion de clercs chrétiens d’Alanie en 932. L’ampleur de ce recul reste incertaine et la conversion fut progressive. Ce récit évoque les sanctuaires locaux sans projeter les noms divins de l’Ossétie moderne dans le IXe siècle."
 CAUC_alan_mission_decision_confirm:0 "Réunir les parties"
 CAUC.0130.t:0 "La demande de la mission"
 CAUC.0130.desc:0 "Les envoyés apportent des livres et demandent une maison pour enseigner. Un ancien répond que les familles possèdent déjà leurs lieux de réunion et leurs serments. Il craint qu’une nouvelle église ne réclame des terres et le droit d’interdire ces rites. Je dois donner une réponse claire aux envoyés."
 CAUC.0130.a:0 "Fournir des terres et un abri pour leur enseignement."
 CAUC.0130.b:0 "Ils peuvent enseigner, mais les sanctuaires locaux sont protégés."
 CAUC.0130.c:0 "Escorter les missionnaires hors de mes terres."
 CAUC.0131.t:0 "Un serment au sanctuaire"
 CAUC.0131.desc:0 "Une querelle a éclaté à propos d’une réunion dans un sanctuaire local. Les anciens exigent le respect de leurs serments. Les partisans de la mission doutent que ces assemblées puissent coexister avec l’enseignement chrétien. Mes officiers demandent une audience publique avant que le différend ne devienne une vendetta."
 CAUC.0131.a:0 "Financer une audience et en consigner les limites."
 CAUC.0131.b:0 "Ma décision précédente suffit."
 CAUC.0132.t:0 "Ce que les familles retiennent"
 CAUC.0132.desc:0 "Les anciens et les partisans de la mission ont reçu mes conditions. Aucun n’a oublié la querelle. Un clerc propose de consigner les accords locaux afin qu’une autre requête ne commence pas par des souvenirs contestés. Je peux financer son travail ou laisser chaque famille conserver son récit."
 CAUC.0132.a:0 "Consigner les accords par écrit."
 CAUC.0132.b:0 "Leurs témoins en garderont le souvenir."
 CAUC_alan_mission_supported:0 "Mission chrétienne soutenue"
 CAUC_alan_mission_supported_desc:0 "La mission reçoit des terres et une protection, mais les familles locales contestent son influence."
 CAUC_alan_old_rites_protected:0 "Sanctuaires locaux protégés"
 CAUC_alan_old_rites_protected_desc:0 "Les rites locaux restent protégés et les missionnaires peuvent enseigner dans les limites convenues."
 CAUC_alan_mission_dismissed:0 "Missionnaires renvoyés"
 CAUC_alan_mission_dismissed_desc:0 "Le départ de la mission renforce la position des anciens, mais met fin à son soutien."
 CAUC_tondrakian_inquiry_decision:0 "Entendre les prédicateurs tondrakiens"
 CAUC_tondrakian_inquiry_decision_desc:0 "Les villages signalent des assemblées qui rejettent les images saintes et contestent les droits du clergé aux loyers et aux dîmes. Les autorités ecclésiastiques exigent une enquête. J’entendrai les prédicateurs, examinerai les revendications foncières et déciderai de les protéger, de les réprimer ou de les rejoindre."
 CAUC_tondrakian_inquiry_decision_tooltip:0 "Commencer une enquête en cinq étapes sur le rite de Smbat Zarehavantsi. Les dirigeants apostoliques arméniens peuvent le rejoindre pour 500 Piété, avec Apahunik. Les enquêtes ultérieures entendent un disciple vivant si le fondateur est mort."
 CAUC_tondrakian_inquiry_decision_context:0 "Des communautés tondrakiennes sont attestées en Arménie du IXe au XIe siècle. Une grande partie des témoignages vient d’auteurs ecclésiastiques hostiles, dont Grigor Magistros. Les principes $tenet_aniconism_name$, $tenet_communal_possessions_name$ et $tenet_unrelenting_faith_zandik_name$, ainsi que l’égalité des sexes du rite, constituent une interprétation choisie pour cette extension."
 CAUC_tondrakian_inquiry_decision_confirm:0 "Réunir les parties"
 CAUC.0140.t:0 "Une assemblée sans images"
 CAUC.0140.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Les visiteurs décrivent une assemblée sans images saintes. Hommes et femmes prennent la parole à tour de rôle ; aucun prêtre héréditaire ne revendique d’autorité sur eux. Un envoyé de l’Église y voit du désordre et me demande de fermer l’assemblée. Avant de juger, je dois fixer les conditions de l’enquête."
 CAUC.0140.a:0 "Entendre les villageois sous ma protection."
 CAUC.0140.b:0 "Laisser d’abord l’Église présenter ses accusations."
 CAUC.0140.c:0 "Payer des clercs pour consigner les deux récits."
 CAUC.0141.t:0 "Qui a le droit de parler ?"
 CAUC.0141.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Une femme de l’assemblée demande à répondre elle-même aux accusations. L’envoyé insiste : seul un homme ordonné peut parler de doctrine. Les villageois répliquent que la foi ne donne pas une valeur différente aux hommes et aux femmes. Mon audience admettra son témoignage ou suivra la procédure de l’envoyé."
 CAUC.0141.a:0 "Elle parlera devant ma cour."
 CAUC.0141.b:0 "Suivre la procédure de l’Église pour cette audience."
 CAUC.0142.t:0 "Des champs détenus en commun"
 CAUC.0142.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Le récit de l’assemblée se tourne vers la terre. Plusieurs familles cultivent ensemble des champs et demandent que la récolte nourrisse leurs foyers avant qu’un seigneur n’en prélève le loyer. L’Église présente un acte de propriété. Le différend dépasse désormais le culte : il faut décider qui peut percevoir le grain."
 CAUC.0142.a:0 "Faire arpenter les terres avant de percevoir les loyers."
 CAUC.0142.b:0 "Suspendre les loyers contestés jusqu’à mon jugement."
 CAUC.0142.c:0 "Maintenir les perceptions pendant l’enquête."
 CAUC.0143.t:0 "Le jugement du dirigeant"
 CAUC.0143.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. J’ai entendu les accusations et les réponses des villageois. Ils demandent des assemblées sans images, des biens communs et le droit de résister à ceux qui les oppriment. Leurs porte-parole insistent sur l’égalité des hommes et des femmes. Je peux protéger la communauté, appliquer l’interdiction de l’Église ou adopter moi-même leur rite."
 CAUC.0143.a:0 "Protéger leurs assemblées sans adopter le rite."
 CAUC.0143.b:0 "Fermer les assemblées et maintenir l’interdiction."
 CAUC.0143.c:0 "Je me tiendrai à leurs côtés comme tondrakien."
 CAUC.0144.t:0 "Après le jugement"
 CAUC.0144.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Mon jugement est parvenu aux villages. La décision sur les assemblées, les loyers et l’autorité religieuse déterminera leurs relations avec mes officiers. Un clerc propose de consigner les conditions et les témoignages afin qu’un prochain différend n’efface pas les promesses."
 CAUC.0144.a:0 "Consigner l’égalité des femmes et des hommes."
 CAUC.0144.b:0 "Consigner le règlement et les témoignages."
 CAUC.0144.c:0 "Mes officiers feront respecter le jugement."
 CAUC_tondrakian_refuge:0 "Assemblées tondrakiennes protégées"
 CAUC_tondrakian_refuge_desc:0 "Le dirigeant protège la communauté, mais ses opposants contestent ses assemblées et ses biens communs."
 CAUC_tondrakian_suppressed:0 "Assemblées tondrakiennes réprimées"
 CAUC_tondrakian_suppressed_desc:0 "Les autorités religieuses saluent l’interdiction, mais son application trouble les villages."
 CAUC_tondrakian_assembly:0 "Assemblée commune tondrakienne"
 CAUC_tondrakian_assembly_desc:0 "Le dirigeant et le comté adoptent le rite tondrakien, soutenant la participation égale et les biens communs."
 CAUC_tondrakian_rite:0 "Rite tondrakien"
 CAUC_tondrakian_rite_adj:0 "tondrakienne"
 CAUC_tondrakian_rite_adherent:0 "tondrakien"
 CAUC_tondrakian_rite_adherent_plural:0 "tondrakiens"
 CAUC_smbat_zarehavantsi_name:0 "Smbat Zarehavantsi"
 CAUC_tondrakian_rite_desc:0 "Un rite apostolique arménien associé aux assemblées de Tondrak. $generic_rite_focus_tenet_aniconism$"
 CAUC_tondrakian_rite_founded_desc:0 "[ROOT.Rite.GetNameNoTooltip] a été fondé par [GetGlobalVariable('CAUC_tondrakian_founder').Char.GetFullName] à [GetGlobalVariable('CAUC_tondrakian_origin').Title.GetNameNoTier] en [GetGlobalVariable('CAUC_tondrakian_founding_year').GetValue|0], au sein de la foi [ROOT.Rite.GetFaith.GetAdjective]. [ROOT.Rite.Custom('GetGenericRiteTenetSentence')]"
