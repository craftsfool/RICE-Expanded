 sardinian_pagan_old:0 "Old Nuragism"
 sardinian_pagan_old_adherent:0 "Old Nuragic"
 sardinian_pagan_old_adj:0 "Old Nuragic"
 sardinian_pagan_old_plural:0 "Old Nuragics"
 sardinian_religion:0 "Sardinian"
 sardinian_religion_adherent:0 "Sardinian"
 sardinian_religion_adherents_plural:0 "Sardinians"
 sardinian_religion_adj:0 "Sardinian"
 sardinian_religion_desc:0 "The indigenous inhabitants of Sardinia worship gods who are often associated with various animals and symbols of nature, in particular the fertility deities of the male Bull-Sun and the female Water-Moon. Traditionally, islanders would gather throughout the year in holy places like sacred wells to worship."
 sarvastivada:0 "Sarvastivada"
 sarvastivada_adherent:0 "Sarvastivadan"
 sarvastivada_adherent_plural:0 "Sarvastivadans"
 sarvastivada_adj:0 "Sarvastivada"
 sarvastivada_desc:0 "\"Sarvastivada\" means the \"theory that all exists,\" based on the argument that all dharmas, or phenomena, exist in the past, present, and future. This school has a strong Abhidharma (or scholastic) tradition, with seven unique Abhidharma works, and over the course of its history has exerted a significant influence on the development of Indian Buddhist philosophy and theology."
 select_personal_deity_buddhist_decision_desc:0 "Many [GetReligionByKey('buddhism_religion').GetAdherentNamePlural] devote themselves to a #bold meditation Deity, Buddha, or Boddhisattva#! to help them reach enlightenment. By devoting myself to one of them, they can help me on my path to become a fully enlightened being. \n\nI should decide which divine being calls to me the most."
 select_personal_deity_buddhist_decision_tooltip:0 "Think about who your meditation Deity should be."
 select_personal_deity_tibet_decision_desc:0 "A [Glossary( 'Yidam', 'YIDAM_GLOSS' )] is a meditational deity who helps one reach spiritual enlightenment in [GetReligionByKey('bon_religion').GetAdjective] and $heritage_tibetan_name$ [GetReligionByKey('buddhism_religion').GetAdjective] belief. By focusing on a particular [Glossary( 'Yidam', 'YIDAM_GLOSS' )], they can help me on my path to become a fully enlightened being.\n\nI should decide which enlightened being calls to me the most."
 select_personal_meditional_deity_decision_tt:0 "Gain a #P positive#! [modifier|E] associated with your selected meditation Deity"
 select_personal_nat_decision_desc:0 "A #bold Nat#! is a spirit in [GetReligionByKey('burmic_religion').GetAdjective] belief that can help one reach spiritual enlightenment or protect one from harm. By focusing on a particular Nat, they can help me on my path to become a fully enlightened being. \n\nI should decide which enlightened being calls to me the most."
 select_personal_nat_decision_tooltip:0 "Think about who your Nat should be."
 select_personal_nat_decision_tt:0 "Gain a #P positive#! [modifier|E] associated with your selected Nat"
 select_personal_yidam_decision_tooltip:0 "Think about who your [Glossary( 'Yidam', 'YIDAM_GLOSS' )] should be."
 select_personal_yidam_decision_tt:0 "Gain a #P positive#! [modifier|E] associated with your selected [Glossary( 'Yidam', 'YIDAM_GLOSS' )]"
 tenet_rice_all_dharmas_exist_desc:0 "All phenomena, or dharmas, such as one's karma, exist in the “three times:” the past, present, and future. This nuanced philosophical approach provides a systematic framework that ties together many different aspects of the Buddha's teaching, from meditation practices to scriptural interpretation."
 tenet_rice_all_dharmas_exist_name:0 "All Dharmas Exist"
 tenet_rice_flawed_arhats_desc:0 "Though [Glossary( 'Arhats', 'ARHATS_GLOSS' )] are beings of great spiritual development, they are still fallible and capable of moral failings. We thus reject others' aspirations to become like Arhats – incomplete enlightenment is #italic not#! enlightenment, and Buddhahood should be everyone's ultimate goal!"
 tenet_rice_flawed_arhats_name:0 "Flawed Arhats"
 tenet_rice_meritorious_merchant_donors_desc:0 "Merchants are an important part of our religious community, as they use their wealth to spread the true teachings of [ROOT.Faith.HighGodName]. In turn, temples and monasteries help virtuous merchants by providing loans, storage of goods, and resting facilities."
 tenet_rice_meritorious_merchant_donors_name:0 "Meritorious Merchant Donors"
 tenet_rice_personalism_desc:0 "Some deluded Buddhists have taken the Buddha's doctrine of “no self” to the extreme. We understand his true teaching: while there is no self, there is a #italic pudgala#!, a person, who carries the burdens of karma from one life to another, like a fire sustained by fuel. Reaching enlightenment is thus like extinguishing this fire."
 tenet_rice_personalism_name:0 "Pudgala"
 tenet_rice_sanctity_of_labor_desc:0 "Churches, Temples, and Sacrifices to the Divine may have some spiritual worth, but no activity is more sacred than a hard day's labor performed in the fields."
 tenet_rice_sanctity_of_labor_name:0 "Sanctity of Labor"
 tradition_RICE_biak_adventurers_desc:0 "Many in this culture will brave the high seas to seek food, trade, slaves, resources, allies, the thrill of battle, lands to settle, and cultural and technological ideas from afar. Swashbucklers who succeed in these adventures earn great prestige and honor."
 tradition_RICE_biak_adventurers_name:0 "Papuan Adventurers"
 tradition_RICE_biak_songs_desc:0 "Singing and dancing plays such an important role in the customs and worldview of this people that there is a popular saying: “If you can't sing or dance, you aren't alive.” To sing and to dance is what it means to be human."
 tradition_RICE_biak_songs_name:0 "Sing and Dance or Die"
 tradition_RICE_kava_culture_desc:0 "#F Kava plays an important role in this culture and is seen as an expression of goodwill and sociability. It is frequently drunk during religious rituals, when socializing with others or debating political issues, and even with meals.#!"
 tradition_RICE_kava_culture_name:0 "Kava Ceremonies"
 tradition_RICE_living_for_ghosts_desc:0 "This culture believes that ghosts are powerful beings, and it is imperative for the living to live a moral life if they want to have a productive relationship with the spirits. Through prayer and virtuous behavior, one can even asks ghosts to aid in everything, from everyday tasks in daily life to summoning terrifying [Glossary( 'warrior ghosts', 'KWARAAE_WARRIOR_GHOSTS_GLOSS' )] to destroy one's enemies."
 tradition_RICE_living_for_ghosts_name:0 "Living for Ghosts"
 tradition_RICE_oceanic_voyagers_desc:0 "#F This culture has a history of exploring strange new worlds, seeking out new life and islands, and going boldly where no one has gone before across the vast oceans, the final frontier of humankind.#!"
 tradition_RICE_oceanic_voyagers_name:0 "Pacific Voyagers"
 tradition_RICE_palau_clubs_desc:0 "People in this culture are assigned to be part in formal clubs called [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] based on gender, age, as well as social rank, in line with the principle of [Glossary( 'bitang me a bitang', 'BITANG_ME_A_BITANG_GLOSS' )]. These clubs manage important tasks and activities, educate members on useful skills, oral traditions, and their roles in society, and regulate relationships within the community. They often meet at the #italic Bai#!, an all-purpose meeting hall."
 tradition_RICE_palau_clubs_name:0 "Ranked Clubs"
 tradition_RICE_yap_stone_money_desc:0 "In this culture, [Glossary( 'large stones', 'YAP_STONE_MONEY_GLOSS' )] carved into the shape of disk with a hole in the center play an important role as a form of currency. Sailing across the seas to acquire these stones, despite the dangers and the risk of death, is highly regarded.."
 tradition_RICE_yap_stone_money_name:0 "Stone Money"
 trait_RICE_khat_addict:0 "Khat Addict"
 trait_RICE_khat_addict_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is constantly found chewing on khat leaves. While it can be a stimulating plant, [ROOT.GetCharacter.GetSheHe] takes it too far, and [ROOT.GetCharacter.GetHerHis] health is suffering because of it."
 trait_RICE_khat_addict_desc:0 "This character is constantly found chewing on khat leaves. While it can be a stimulating plant, this character takes it too far, and their health is suffering because of it."
 vatsiputriya:0 "Vatsiputriya"
 vatsiputriya_adherent:0 "Vatsiputriyan"
 vatsiputriya_adherent_plural:0 "Vatsiputriyans"
 vatsiputriya_adj:0 "Vatsiputriya"
 vatsiputriya_desc:0 "The Vatsiputriya are the original school that taught the doctrine of the pudgala: while there is no self, there is a person who carries the burden of karma from one life to the next until enlightenment."
 vibhajjavada:0 "Vibhajjavada"
 vibhajjavada_adherent:0 "Vibhajjavadan"
 vibhajjavada_adherent_plural:0 "Vibhajjavadans"
 vibhajjavada_adj:0 "Vibhajjavada"
 vibhajjavada_desc:0 "The distinctionists are known as such because they distinguish between phenomena that exist in the present and the past, and dhammas that do not exist in the past and the future. Having rejected the Pudgalavada and Sthavira doctrines, they are a group of schools that see themselves as upholders of the true Buddhist teachings."
