 fur_pagan_adj:0 "Moluist"
 fur_pagan_desc:0 "The Fur-speaking peoples believe that the supreme god Molu lives in the sky, and that the righteous will join him in the afterlife, while the wicked are condemned to the fiery pits of Uddu."
