 activity_RICE_hot_springs_visit_hedionda_province_desc:0 "\n#P +++ The Hedionda Baths are [hot_springs|E] between [GetTitleByKey('b_algeciras').GetNameNoTier] and [GetTitleByKey('b_malaga').GetNameNoTier] which even Julius Caesar visited in local legend due to the springs' fame in healing skin ailments.#!\n\n#italic This will lead to gaining the [GetModifier('RICE_granada_hedionda_baths_modifier').GetNameWithTooltip] [character_modifier|E]. However, there is also a chance of gaining an upgraded version of this [modifier|E] instead, [GetModifier('RICE_granada_hedionda_baths_julius_caesar_modifier').GetNameWithTooltip].#!"
 activity_RICE_hot_springs_visit_ourense_province_desc:0 "\n#P +++ The [hot_springs|E] of [GetTitleByKey('b_ourense').GetNameNoTier] have been renowned since Roman times, if not before, especially #italic As Burgas#!.#!\n\n#italic This will lead to gaining the [GetModifier('RICE_galicia_ourense_as_burgas_non_christian_modifier').GetNameWithTooltip] [character_modifier|E]. If you follow a [GetReligionByKey('christianity_religion').GetAdjective] [faith|E], you will get the [GetModifier('RICE_galicia_ourense_as_burgas_christian_modifier').GetNameWithTooltip] [modifier|E] instead, and will also get some bonus [piety_i|E] [piety|E].#!"
