 RICE_yorkshire_crowland_pilgrims_desc:0 "The shrine of Saint Guthlac of Crowland at Crowland Abbey has been attracting more visitors than usual as of late."
 SAINT_CATHERINE_ASHITINAME_OF_MUHAMMAD:0 "The #bold Ashitiname of Muhammad#!, also known as the Convenant or Testament of Muhammad, is a charter granting protection and other privileges to the Christian monks at Saint Catherine's Monastery in the Sinai. The original version of the document was supposedly seized by the Ottomans for safekeeping when they conquered Egypt, though a copy was made to the monks of Saint Catherine's Monastery as compensation, and the Ottomans nonetheless upheld the charter's provisions."
 SAINT_CATHERINE_BEDOUIN_GUARDS:0 "The Christian Monastery of Saint Catherine in the Sinai has historically relied on #bold Bedouin guards#! for protection. Over the centuries, while the monastery was often raided and pillaged by Muslim forces, some of the monastery's fiercest guardians were also Muslim as well."
 SAINT_CATHERINE_BURNING_BUSH:0 "The #bold Burning Bush#! was, in Jewish, Christian, and Muslim tradition, the location in the Sinai Peninsula, where Moses was appointed by God to lead the Israelites out of Egypt and into the Promised Land. During Late Antiquity, the famed Monastery of Saint Catherine was built around a bush that is purportedly the same as the Biblical burning bush."
 SAINT_CATHERINE_LIBRARY:0 "The #bold library#! of Saint Catherine's Monastery in Sinai was built during the reign of Byzantine Emperor Justinian, sometime between 527 and 565 CE, and is recognized as one of the world's oldest continuously operating libraries. Over the centuries, it accumulated a vast collection of manuscripts and books in a variety of languages, including but not limited to Greek, Aramaic, Syriac, Latin, Arabic, Armenian, Ge'ez, Church Slavonic, Georgian, Hebrew, and Coptic."
 SAINT_CATHERINE_PATH_OF_MOSES:0 "Next to Saint Catherine's Monastery in Sinai is a route known as the #bold Path of Moses#!, that goes up a mountain where it is believed that the Biblical Moses received the Ten Commandments."
 SAINT_CATHERINE_RELICS:0 "Saint Catherine's Monastery in Sinai is associated with Saint Catherine because her purported #bold relics#! were discovered close to the monastery and brought there for safekeeping, turning it into a popular pilgrimage site as a result. In traditional hagiography, she was a young scholarly woman who converted many to Christianity, before being martyred around 305 CE."
 SAINT_CATHERINE_WELL_OF_MOSES:0 "Saint Catherine's Monastery in Sinai encloses the purported #bold Well of Moses#!, where the Biblical Moses is said to have met his future wife, Zipporah, the daughter of the Jethro, the priest and prince of Midian. Even into the modern day, the well is the monastery's main source of water."
 SAINT_EPIMACHOS_GLOSS:0 "While there are different saints named #bold Epimachos#!, or #bold Epimachus#!, the one popularly revered in medieval Nubia was Epimachos of Pelusium, a weaver who was, in hagiographical accounts, martyred at some unknown point during a period of Christian persecution in Roman Egypt. Although his original story had little connection to the military, in Nubia, he was portrayed as a warrior-saint. It is unknown whether he acquired this aspect due to his name including the Greek word for battle, #italic mákhē#!, or because of some local miracle that is lost to us. The cult of Epimachos, as a warrior, was fairly widespread in medieval Nubia, possibly reflecting worries about military threats to Nubia, or political instability."
 SAINT_HILARIA_GLOSS:0 "The #bold Legend of Saint Hilaria#! was Coptic text that tells of a legend about the elder daughter of Zeno, a 5th century Emperor of the Eastern Roman Empire. According to the legend, Hilaria was greatly inspired by the monks in the Egyptian valley of Scetis (modern-day $b_wadi_natrun$), so to join them she pretended to be an eunuch named Hilarion. Later, Hilaria’s younger sister, Theopiste, fell ill after being possessed by a demon and went to Egypt for treatment, where she was healed by the still disguised Hilaria. When Hilaria took care of her sister, the two women shared the same bed, and Emperor Zeno, scandalized that a “monk” would sleep with his daughter, demanded an explanation, and Hilaria had to reveal her true identity. Zeno, however, was touched deeply by his elder daughter’s spiritual devotion, and allowed her to return to Scetis as a “monk.” Despite the doubtful historicity of the legend, Hilaria became a saint in several eastern churches centuries after her purported death."
 SAQIA_GLOSS:0 "#bold Saqia#! (also spelled #bold Saqiya#! or #bold Sakia#!) is a mechanical water lifting device that consists of buckets or jars fastened to a vertical wheel or a rope belt about the wheel, which in turn is attached by a shaft to a horizontal wheel turned by horses, oxen, or donkeys. This form of irrigation has been in use in the Middle East, India, and North Africa for centuries. In many places, the saqia are supported by several different local shareholders, who agree to equally contribute the necessary materials or perform repairs on the saqia, and in turn each shareholder receives an equal period of irrigation for their own field."
 SAYINGS_OF_THE_DESERT_FATHERS_GLOSS:0 "The #bold Sayings of the Desert Fathers#!, dating to around the 5th century, are various textual collections of anecdotes and sayings of the Desert Fathers of Egypt, who were a number of influential hermits and ascetics who played a major role in the development of Christianity. These collections were popular among medieval Coptic monks as a source of spiritual guidance."
 SHOUNG_GLOSS:0 "The #bold Keeper of Granaries#!, or #bold Shoung#! in medieval Nubian, was a title attested for some high-ranking Makurian officials in medieval Nubia. Scholars are unsure about the duties or functions associated with the title, or if it was a ceremonial one. Curiously, one Makurian king from the late 12th century, Basil, is attested as holding this title, while he was #italic also#! king, unlike other holders of this title who were non-royal officials."
 SOULOU_GLOSS:0 "The meaning of the word #bold soulou#!, which appears in a few medieval Nubian documents, has baffled Nubianologists for years. It is an excellent example of the difficulty in translating many of these texts which we often don't have the context of. The #italic Soulou#! appear to have worked for officials to deliver messages, but it is unknown if they were an actual job title, a social class, an ethnic group employed for this purpose, or something else. #italic Soulou#! might correspond to the word #italic sulu#! in the modern Nubian languages, which refers to shoemakers who are mobile workers. However, a recent scholarly paper by Petra Weschenfelder on the term #italic Soulou#! recommends it is best we leave it untranslated for now until further information is found."
 SUNT_GLOSS:0 "#bold Sunt#! is the Arabic word for the flowering tree species #italic Vachellia nilotica#! or #italic Acacia nilotica#!, known by the vernacular names of the #italic gum arabic tree#!, #italic babul#!, #italic thorn mimosa#!, #italic Egyptian acacia#!, and #italic thorny acacia#!. It was traditionally used to build ships throughout the Nile river, thanks to the relative impenetrability of its wood, and how a body of the boat could be quickly and easily built using smaller #italic sunt#! pieces."
 TEBELDI_TREES_GLOSS:0 "#bold Tebeldi#! is the name used in parts of Sudan to refer to #italic Adansonia digitata#!, the most widespread species of baobab trees, which are native to much of Africa and parts of Yemen and Oman. Traditionally, it was valued as a source of food, water, and medicine. In Darfur, local rulers had a sacred obligation to protect these trees, as they were considered a crucial source of water, since the trees are useful for water storage."
 XENODOCHIUM_GLOSS:0 "A #bold Xenodochium#! or #bold Xenodocheion#! (plural #italic xenoocheia#!) was a hostel for travelers, particularly pilgrims, in the medieval period. The term, originating from Greek, is used for such hostels originating from the Byzantine Empire or Christian regions influenced by it like Nubia."
 YIDAM_GLOSS:0 "The #bold Yidam#! is a meditational deity who helps one reach spiritual enlightenment in the [GetReligionByKey('bon_religion').GetAdjective] religion and Tibetan [GetReligionByKey('buddhism_religion').GetName]. They are an important part of these religions' spiritual practices, particularly #italic deity yoga#! (devatayoga), which involves recitation of prayers and mantras, or visualization of the deity."
 ZINDIQ_GLOSS:0 "Though later used to indicate heretics in general, medieval Muslims originally used the term #bold Zindiq#! to  refer to followers of the Manichean religion."
