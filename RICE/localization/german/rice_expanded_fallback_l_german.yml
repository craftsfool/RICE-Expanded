 pudgalavada:0 "Sammitiya"
 pudgalavada_adherent:0 "Sammitiyan"
 pudgalavada_adherent_plural:0 "Sammitiyans"
 pudgalavada_adj:0 "Sammitiya"
 pudgalavada_desc:0 "The Sammitiya are the most successful and widespread of the schools that branched off from the Vatsiputriyans. Their chief difference from other major Buddhist sects is their staunch belief in the concept of a person that carries the burdens of karma, which they argue does not contradict, but in fact adds much needed nuance to the Buddha's profound teaching of no self."
 pudgalavada_faith:0 "Pudgalavada"
 pudgalavada_faith_adherent:0 "Pudgalavadan"
 pudgalavada_faith_adherent_plural:0 "Pudgalavadans"
 pudgalavada_faith_adj:0 "Pudgalavada"
 pudgalavada_faith_desc:0 "While there is no atman, there is a pudgala (person), which is neither a conditioned dharma nor an unconditioned dharma. The path to enlightenment involves understanding this pudagala through personal experience, reflection and reasoning."
 rais_mulaib:0 "Rais Mula'ib"
 red_sea.0006.liege.message:0 "$red_sea.0006.t$"
 red_sea.0050.info:0 "#emphasis Historical Context:#! Yemen's Najahid Dynasty was founded by Najah, who was initially an Ethiopian slave soldier of the Ziyadid Dynasty that had ruled western Yemen until 1018 CE. Najah put an end to the subsequent political disorder, and ruled until he was assassinated around 1060 by his Sulayhid rivals, who were Shiite in contrast to Najah's Sunnism. After Najah's eldest son Mu'arik committed suicide, two of Najah’s other sons, Sa’id and Jayyash, fled and took refuge under in Dahlak, an archipelago off the coast of modern Eritrea, that was once under the suzerainty of their father."
 red_sea.0051.b:0 "[jayyash.GetFirstNameNoTooltip] reluctantly agreed to support me."
 red_sea.0051.info:0 "#emphasis Historical Context:#! Despite the hospitality shown to them by the Sultan of Dahlak, Sa'id treacherously tried to seize control of Dahlak. However, he was prevented from doing so by his brother Jayyash, who was known for having a humbler and more honorable disposition than Sa'id. The hot-headed, arrogant Sa'id would leave for Yemen in anger."
 sardinian_pagan:0 "Nuragism"
 sardinian_pagan_adherent:0 "Nuragic"
 sardinian_pagan_adherent_plural:0 "Nuragics"
 sardinian_pagan_adj:0 "Nuragic"
