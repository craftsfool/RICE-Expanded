l_german:
 # English fallback only; not counted as translated text.
 ABBA_POEMEN_GLOSS:0 "#bold Abba Poemen#! (c. 340-450 CE) was a Christian monk, Desert Father, and saint from Egypt. He is the most quoted Abba, or Father, in the #italic Sayings of the Desert Fathers#!, a collection of anecdotes and sayings of the Desert Fathers."
 ABLEMBA_GLOSS:0 "In Sudanese folklore, #bold ablemba#! refers to supernatural mirages in the form of lights or lamps at night, that draw people away from their homes or safe roads. They are part of a broader umbrella of several kinds of supernatural phenomena or beings such as female spectres, jinn, and light-emitting snakes, that are believed to frequent around ancient or medieval Nubian ruins. These spirits, who in modern Sudan are believed to be of Christian origin, are seen as guarding the secrets of their domains from robbers and intruders, reflecting the locals’ views of their historical heritage."
 ARCHANGEL_RAPHAEL_GLOSS:0 "#bold Raphael#! is one of the most esteemed archangels in Judaism, Christianity, and Islam. Originally mentioned in the #italic Book of Tobit#! and the #italic Book of Enoch#!, Raphael is unnamed in the New Testament and Quran. However, later Christian tradition identified him with healing, and in Islam, he is believed to be the unnamed angel who stands eternally with a trumpet to his lips, ready to announce the Day of Judgment."
 ATARAZANA_GLOSS:0 "#bold Atarazana#! is the Iberian term for shipyard or dockyard, borrowed from Arabic. During the medieval period, the reality of political instability and economic opportunity encouraged Muslim and Christian to subsidize the shipbuilding industry here, paving way for Iberia's future naval dominance in the early modern era."
 Abd_al-Wahid:0 "Abd al-Wahid"
 BUDDHIST_SUTRAS_GLOSS:0 "#bold Buddhist Sutras#! are canonical scriptures that are considered to be the spoken word of the Buddha. Because early Buddhism was an orally transmitted tradition, there is lively debate about the authenticity of many of the sutras; some of these sutras are believed to have been composed by later authors, as the earliest surviving Buddhist texts date to around the 1st century BCE."
 DINAVARIYA_GLOSS:0 "The #bold dinavariya#! was a Persian term, derived from the Middle Persian word 'denawar,' originally used by the Manicheans to refer to the Elect, members of the Manichean clergy. Over time, however, the Manicheans of the Iranian world and Central Asia began to use the word to self-identify themselves, as opposed to their western Manichean brethren. There was even a 6th or 7th century schism within the Manichean Church where schismastics in Transoxania, known as dinavariya, disputed the authority of the Manichean religious leadership in Babylon and criticized western Manicheans for their religious laxity. It would be incorrect to assume that dinavariya itself was an actual heresy, however, as the term likely predated the schism, and continued to be used for many more centuries.."
 ELECT_GLOSS:0 "The #bold Elect#! were members of the Manichean Church who functioned as clergy, having taken strict vows to eschew sinful acts, and to dedicate their lives to liberating the Light through prayer, ritual, and other religious actions. They were not allowed to harvest or prepare their own food, and could only eat one meal a day; this meal was an important ceremony where, through the act of consuming vegetarian meals, they could free the Light from the dark world of Matter. Although Manicheism probably did not have a monastic tradition initially, Manichean members of the Elect in eastern regions like Central Asia and China likely adopted a monastic lifestyle due to the influence of Buddhism."
 ERA_OF_THE_HEGIRA_GLOSS:0 "The #bold Era of the Hegira#! (in Greek/Latin) or #bold Hijri#! (in the original Arabic) is the calendar era used for recording dates in the Islamic world. It begins in the year when the Prophet Muhammad migrated from Mecca to Medina in an event known as the Hijri, corresponding to 622 CE. At times, its use spread to non-Muslim communities who were ruled or influenced by Islamic states, or had economic and cultural connections with Muslims."
 ERA_OF_THE_MARTYRS_GLOSS:0 "The #bold Era of the Martyrs#!, also known as the #bold Diocletian Era#!, is the calendar era used for recording dates used by some early Christians. It starts on the reign of the Roman Emperor Diocletian in 284 CE, who initiated the last major persecution of Christians in the Roman Empire. Though it was abandoned in favor of the #italic Anno Domini#! era in much of the Christian world by the Middle Ages, it continued to be used by the Coptic Church based in Egypt to this day."
 FUL_MEDAMES_GLOSS:0 "#bold Ful Medames#!, or simply #bold Ful#!, is a stew made of fava beans mixed with various spices and herbs, that is often eaten for breakfast that is popular in Egypt and Sudan, where it is considered a national dish. Consumption of fava beans in this region dates back to Pharaonic Egypt, so the dish may have ancient origins. Less dubious records of the dish come from the medieval period; in medieval Cairo, for example, the making of #italic ful#! was monopolized by the inhabitants living near the Princess Baths, a public bath, as they took advantage of the fires used to keep the bathwaters warm. Huge cauldrons of #italic ful#! were kept simmering all day and night by the bathhouse to maintain a continuous supply of breakfast for Cairo’s population."
 GOVERNOR_OF_ASWAN_GLOSS:0 "Historically, in medieval Egypt, the #bold Governors of Aswan#! had a major responsibility in managing the frontier between Nubia and Egypt, and carrying out the provisions of the Baqt treaty on the Egyptian side, as the counterpart of the Nubian Eparch of Nobatia."
 HAFIR_GLOSS:0 "#bold Hafirs#! are a kind of artificially constructed water reservoir first built by the Kingdom of Kush in ancient Nubia, that are still used to this day. Many of the earlier hafirs were built next to Kushite temples, and may have been associated with religious and royal authority and power."
 HEARER_GLOSS:0 "The #bold Hearers#! were the lay members of the Manichean Church. Though they did not have to follow the strict vows of the Elect, the Manichean clergy, they still had their own set of vows to follow to avoid sin. They were also required to engage in various fasting days and in a weekly ceremony to confess their sins. Additionally, they were encouraged to do 'soul-service' by supporting the Elect through alms and other forms of donations."
 HERMES_TRISMEGISTUS_GLOSS:0 "#bold Hermes Trismegistus#!, meaning #italic Hermes the Thrice-Greatest#!, is a legendary scholar, magician, and teacher who originated through syncretism of the Greek god Hermes and the Egyptian god Thoth. He was said to have composed the #italic Hermetica#!, a group of texts that laid the foundation for the #italic Hermetic#! philosophical tradition, which deeply influenced Hellenistic, Christian, Jewish, and Muslim thought into the early modern period."
 JATAKA_GLOSS:0 "The #bold Jataka#! are a body of Buddhist tales originating from India that tell of various stories, mostly relating to the Buddha's previous lives, where he could be anything from a powerful god or king to a lowly animal like a monkey or insect. In these stories, the Buddha's previous self resolves the problems facing the characters to bring a happy ending, imparting some sort of moral lesson or aesop relating to Buddhist doctrine, particularly in regards to karma, the cycle of suffering, and rebirth. The jataka stories have been popular subjects of art and other literature throughout the centuries in Buddhist societies."
 Jayyash:0 "Jayyash"
 KANDAKE_GLOSS:0 "#bold Kandake#! or #bold Candace#! was the title of the queen mothers or queen regnants of the Kingdom of Kush, in ancient Nubia, particularly during the Meroitic period (542 BCE - c. 350 CE) when the capital of Kush was at Meroe. The term survived in the Bible to refer to a purported queen of the so-called Aethiopians, and in medieval legends of Alexander the Great as the name of a queen he fought against in Nubia. As a result, it has survived nowadays as a common name in the West."
 KARKADE_GLOSS:0 "#bold Karkade#!, also spelled #italic karkadeh#! or #italic karkadey#!, is a Middle Eastern and North African drink made from the dried petals of a type of hibiscus called the roselle plant (#italic Hibiscus sabdariffa#!). It is traditionally popular in Egypt and Sudan, particularly during Ramadan and on festive occasions like weddings, as the drink is believed to have health benefits. A typically way of preparing the drink is by soaking dried roselle petals into water, then boiling it, before mixing it other flavors as desired."
 KITAB_AJA_IB_AL_HIND_GLOSS:0 "The #bold Kitāb ʿajāʾib al-Hind#!, or #italic \"The Book of the Marvels of India\"#!, is a tenth century collection of the adventurous tales of merchants, sailors, and travelers written by Buzurg ibn Shahriyār, an Arab sea captain. It was dedicated to an Ikhishidid governor of Egypt, Abu al-Misk Kafur (905 - 968 CE), who was originally an African slave serving the Ikhshidids but rose through the ranks to become #italic de facto#! ruler of Egypt as vizier before becoming sole ruler in 966."
 LORD_OF_THE_MOUNTAIN_GLOSS:0 "The #bold Lord of the Mountain#! (#italic Migin Soñoj#! in medieval Nubian) or #bold Eparch of Nobatia#! was arguably the highest-ranking official in Makuria, the northern kingdom of medieval Nubia. His chief responsibility was managing the frontier between Nubia and Egypt, and carrying out the provisions of the Baqt treaty on the Nubian side as the counterpart of the Egyptian Governor of Aswan. Currently, scholars are unsure whether the office was hereditary, appointed, or a combination of both, and whether the Eparchs had any connections with the rulers of the earlier kingdom of Nobatia that was absorbed into Makuria at some point by the 7th century."
 MANICHEAN_PARINIRVANA_GLOSS:0 "In Manicheism, #bold Parinirvana#! has a different meaning than in Buddhism, which the term was derived from, due to Manicheans' propensity to assimilate other religions' vocabulary to spread their teachings. Buddhist parinirvana refers to the final passing away of a Buddha or other being who has attained nirvana, whereupon their physical existence ends and they have liberated themselves from the cycle of birth and rebirth. Manichean parinirvana, however, refers to the death and martyrdom of the Prophet Mani, which also is compared to the Passion of Jesus."
 Mu_arik:0 "Mu'arik"
 NAT_GLOSS:0 "The #bold Nats#! are deities traditionally worshipped in [GetGeographicalRegion('world_burma').GetName]. Worship of these deities, and Burmese folk religion in general, has blended together strongly with [GetReligionByKey('buddhism_religion').GetAdjective] religious practices."
 NOTARIOS_GLOSS:0 "In ancient Rome and Byzantium, #bold notarios#! was typically a title given to low-ranking officials or scribes with clerical or secretarial duties. The title spread throughout regions influenced by Rome and Byzantium, such as western Europe and Nubia, where the term retained a similar meaning."
 NOT_RICE_guanche_levada_disabled:0 "The [decision|E] to #V Introduce Sugarcane to Madeira#! needs to be taken"
 NUBIA_COLD_SEASON_2_GLOSS:0 "A common means of travel for merchants traveling up and down the Nile during the medieval era was via boat. At times, the navigation of the river could be impeded in the cold season due to the wind, so merchants had to time their business carefully based on the time of year."
 NUBIA_COLD_SEASON_GLOSS:0 "A common means of travel for merchants traveling up and down the Nile during the medieval era was via boat. At times, the navigation of the river could be impeded in the cold season due to the wind, so as this excerpt from a letter by a Muslim merchant to the Eparch of Nobatia implies, these merchants had to time their business carefully based on the time of year."
 NUBIA_IN_THE_PRESENCE_OF_GLOSS:0 "This excerpt comes from a letter from a Muslim person to the Eparch of Nobatia in Makuria. The use of 'in the presence of the Bishop' (in the original version) is intended to give whatever is happening legal sanction, based on the practice of legal acts being done in the presence of witnesses or a judge in medieval Islamic law. Similarly, in medieval Nubia, legal documents were often signed in the presence of various secular and ecclesiastical officials, too. This passage also suggests that obligations between two parties in this frontier context could be between individual parties, and wasn't just only between two governments, i.e. the kingdoms of Egypt and Makuria."
 NUBIA_KISSES_THE_GROUND:0 "This excerpt comes from a letter from a Muslim person to the Eparch of Nobatia, and makes use of the obeisance formula “the slave kisses the ground” that is commonly found in these kinds of letters sent to certain officials or rulers in Nubia and Egypt. This formula obviously does not literally mean the writer is a slave of the addressee; it was a formulaic show of respect initially introduced in Egypt that reflected a development in Fatimid court protocol, where someone would kiss the ground in the presence of the Fatimid Caliph."
 NUBIA_RELEASED_THE_BOATS_GLOSS:0 "Traffic traveling to and from Nubia and Egypt was carefully monitored by officials from both sides during this period. This excerpt comes from a letter involving the Eparch of Nobatia in Nubia, reflecting how merchants' ships, for instance, needed his permission to operate in Nubia and travel back and forth."
 NUBIA_RISING_OF_PRICES_GLOSS:0 "This excerpt comes from a letter alluding to the Eparch of Nobatia's apparent intervention in some sort of economic crisis by granting permission for the shipment of supplies."
 NUBIA_THE_KING_GLOSS:0 "The excerpt comes from a letter where one Muslim merchant, Lami' ibn Hasan al-Kanzi, complains to the Eparch of Nobatia that his slave boy, who he perhaps used as a messenger or to take care of some sort of business related to the Makurian king, was impeded in some way by a rival Muslim merchant, Ibn al-'Asqalani. Both men appear to have had connections with the Makurian king."
 Najah:0 "Najah"
 OIKONOMOS_GLOSS:0 "The title of #bold oikonomos#! originates from the ancient Greek world, and evolved over the centuries to have different meanings, though it was always connected with the administration of something – whether a private house, an estate, a temple, a political state, and so on – in a Mediterranean context. By Late Antiquity, in the Mediterranean, it typically meant the steward of a church or monastery. The title even spread as far as Nubia, due to Byzantine influence; though most scholars are unsure of the duties of various Nubian administrative titles, it is likely that the Nubian oikonomos was also some sort of ecclesiastical steward."
 PHARAOH_GLOSS:0 "The term #bold Pharaoh#! originally referred to Ancient Egypt's royal palace, but during the New Kingdom (c. 16th-11th centuries BCE), the word came to be metonymically used to refer to the rulers of Egypt. It was never used as a formal title for Egypt's monarchs, and such usage derives from the Hebrew Bible. In reality, the Pharaohs were typically given five names by the Middle Kingdom: the Horus name, Nebty name, Golden Horus name, nomen, and prenomen."
 QORE_GLOSS:0 "#bold Qore#! or #bold Kore#! was the title of the rulers of the Kingdom of Kush, in ancient Nubia, particularly during the Meroitic period (542 BCE - c. 350 CE) when the capital of Kush was at Meroe. The title could be held by both male and female rulers."
 RICE_all_khat_courtiers_and_guests:0 "All [courtiers|E] and [guests|E] who would enjoy chewing khat"
 RICE_atarazanas_decision:0 "Subsidize the Atarazanas"
 RICE_atarazanas_decision_confirm:0 "Those ships will sail, sail away!"
 RICE_atarazanas_decision_context_tooltip:0 "#emphasis Historical Context:#! $ATARAZANA_GLOSS$"
 RICE_atarazanas_decision_desc:0 "Over centuries, due to the instability in [GetGeographicalRegion('world_europe_west_iberia').GetName] and the region's strategic location, [Glossary( 'atarazanas', 'ATARAZANA_GLOSS' )] have grown in importance for any [ruler|E] seeking a political and economic edge in the western Mediterranean. It should support the ones in my [realm|E]."
 RICE_atarazanas_decision_effect_tooltip_1:0 "The [gold|E] and [prestige|E] cost of this [decision|E] depends on how many coastal [counties|E] you own"
 RICE_atarazanas_decision_tooltip:0 "The [Glossary( 'shipyards', 'ATARAZANA_GLOSS' )] of [GetGeographicalRegion('world_europe_west_iberia').GetName] are some of the most important in the Mediterranean"
 RICE_atarazanas_modifier:0 "Subsidized Atarazanas"
 RICE_atarazanas_modifier_desc:0 "Rulers have subsidized [Glossary( 'atarazanas', 'ATARAZANA_GLOSS' )] in this region. These shipywards will continue producing trade ships to grow the economy and war ships to defend the coasts."
 RICE_dynn_khaulanite:0 "Khawlan"
 RICE_dynn_najahid:0 "Najahid"
 RICE_galicia_geographical_domicile_req:0 "Your [domicile|E] is in [GetGeographicalRegion('RICE_galicia_region').GetName]"
 RICE_galicia_ourense_as_burgas_christian_modifier:0 "$RICE_galicia_ourense_as_burgas_non_christian_modifier$ as a Christian"
 RICE_galicia_ourense_as_burgas_christian_modifier_desc:0 "$RICE_galicia_ourense_as_burgas_non_christian_modifier_desc$ The site is also a popular place to rest for Christian pilgrims traveling the Way of Saint James."
 RICE_galicia_ourense_as_burgas_non_christian_modifier:0 "Visited As Burgas"
 RICE_galicia_ourense_as_burgas_non_christian_modifier_desc:0 "This character recently went to $b_ourense$ to relax at the thermal springs there, especially the famed #italic As Burgas#!."
 RICE_galicia_pico_sacro_chapel_decision:0 "Consecrate Chapel on Pico Sacro"
 RICE_galicia_pico_sacro_chapel_decision_confirm:0 "This mountain belongs to [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
 RICE_galicia_pico_sacro_chapel_decision_context_tooltip:0 "$RICE_galicia_pico_sacro_decision_context_tooltip$"
 RICE_galicia_pico_sacro_chapel_decision_desc:0 "Some locals in [GetGeographicalRegion('RICE_galicia_region').GetName] believe that praying to Pico Sacro near [GetTitleByKey('c_santiago').GetNameNoTier] will heal one of any ailment. Some [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] are suspicious of what they see as false superstitions. Building a chapel on the mountain, associated with proper [ROOT.Char.GetFaith.GetAdjective] worship, will make it more palatable to these types."
 RICE_galicia_pico_sacro_chapel_decision_effect_tooltip_1:0 "Followers of [GetReligionFamily('rf_abrahamic').GetName] [faiths|E] will no longer have to pay more [gold_i|E] [gold|E], lose [piety_i|E] [piety|E], and get reduced [court_chaplain|E] [opinion_i|E] [opinion|E] when taking the [decision|E] to #V $RICE_galicia_pico_sacro_decision$#!"
 RICE_galicia_pico_sacro_chapel_decision_tooltip:0 "They say the sacred mountain of Pico Sacro can heal people!"
 RICE_galicia_pico_sacro_decision:0 "Pray to Pico Sacro"
 RICE_galicia_pico_sacro_decision_confirm:0 "Heal me, great mountain!"
 RICE_galicia_pico_sacro_decision_context_tooltip:0 "#emphasis Historical Context:#! Northwest Iberia is home to several mountains associated with various superstitions, though their relation to pre-Christian practice is uncertain. Pico Sacro, one of the more prominent of these mountains, is known for the legends surrounding Apostle James and the mythological Lupa, a pagan queen who initially caused trouble for James' disciples but later converted to Christianity. The mountain's connection to Saint James developed during the medieval period, when a chapel dedicated to him was constructed there by Bishop Sisnando in 899."
 RICE_galicia_pico_sacro_decision_desc:0 "Those who live around [GetGeographicalRegion('RICE_galicia_region').GetName] often believe that praying to the mountain known as Pico Sacro near [GetTitleByKey('c_santiago').GetNameNoTier] can heal one of any ailment, based on the many legends surrounding this site."
 RICE_galicia_pico_sacro_decision_effect_tooltip_1:0 "The [decision|E] requires more [gold_i|E] [gold|E], costs [piety_i|E] [piety|E], and reduces [court_chaplain|E] [opinion_i|E] [opinion|E] for followers of [GetReligionFamily('rf_abrahamic').GetName] [faiths|E] if the [decision|E] to #V $RICE_galicia_pico_sacro_chapel_decision$#! has not been taken yet"
 RICE_galicia_pico_sacro_decision_tooltip:0 "They say the sacred mountain of Pico Sacro can heal people!"
 RICE_galicia_pico_sacro_modifier:0 "Prayed to Pico Sacro"
 RICE_granada_hedionda_baths_julius_caesar_modifier:0 "Inspired by the Hedionda Baths"
 RICE_granada_hedionda_baths_julius_caesar_modifier_desc:0 "$RICE_granada_hedionda_baths_modifier_desc$ In fact, thanks to this experience, they were inspired by Julius Caesar's famous deeds."
 RICE_granada_hedionda_baths_modifier:0 "Visited the Hedionda Baths"
 RICE_granada_hedionda_baths_modifier_desc:0 "This character recently went to the hot springs of Hedionda in Andalusia, which according to legend was visited by Julius Caesar, to cure himself of a skin condition."
 RICE_opinion_aborted_coup:0 "Aborted Coup"
 RICE_opinion_chewed_khat_together:0 "Chewed khat together"
 RICE_opinion_prevented_coup:0 "Prevented Coup"
 RICE_opinion_successful_coup:0 "Successful Coup"
 RICE_red_sea_aspiration_avenge_najah:0 "[RICE_aspiration|E]: Avenge Najah $nick_me_al_muayyid$"
 RICE_red_sea_aspiration_avenge_najah_desc:0 "#italic Najah, a former Ethiopian slave, once ruled much of Yemen, was assassinated by a slave girl of the rapacious Sulayhid clan. Though his surviving children have fled in exile, they hope to avenge our father one day, and reclaim their birthright.#!$RICE_red_sea_aspiration_said_jayyash_desc$\n\n"
 RICE_red_sea_aspiration_said_jayyash_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[GetTitleByKey('d_taizz').GetNameNoTier] and [GetTitleByKey('d_sanaa').GetNameNoTier] is [completely_controlled|E] by you or one of your siblings as an [independent|E] [ruler|E]\n$EFFECT_LIST_BULLET$Ensure your [nemesis|E] Ali of the Sulayhids is either dead, holds no [titles|E], or is [imprisoned|E]\n$EFFECT_LIST_BULLET$Ensure all your siblings have #bold at least#! [opinion_i|E] #P 25#! [opinion|E] of you\n\n#bold Rewards#!\n$EFFECT_LIST_BULLET$Gain @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [dynasty_prestige|E] for each surviving sibling\n$EFFECT_LIST_BULLET$Gain @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! [legitimacy|E] if [landed|E]\n$EFFECT_LIST_BULLET$You and your surviving siblings gain the [GetModifier('RICE_red_sea_heirs_of_najah_modifier').GetNameWithTooltip] [character_modifier|E]\n$EFFECT_LIST_BULLET$Receive #V 1000#! [special_troops|E], including some [men_at_arms|E], if [landed|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!)\n$EFFECT_LIST_BULLET$Ensure Ali of the Sulayhids and all of his children are dead (Reward: Gain an [intrigue_lifestyle|E] [perk|E] and @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! [prestige|E])\n$EFFECT_LIST_BULLET$Own [GetTitleByKey('c_dahlak').GetNameNoTier] directly (Reward: Gain @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [gold|E]) (Mutually exclusive with the bonus reward below)\n$EFFECT_LIST_BULLET$Have [GetTitleByKey('c_dahlak').GetNameNoTier] as your [vassal|E] or [tributary|E] (Reward: Every [county|E] in [GetTitleByKey('d_taizz').GetNameNoTier] and [GetTitleByKey('d_sanaa').GetNameNoTier] gains @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! [development|E]) (Mutually exclusive with the bonus reward above)"
 RICE_red_sea_chew_khat:0 "Chew Khat"
 RICE_red_sea_chew_khat_confirm:0 "I need this in my life!"
 RICE_red_sea_chew_khat_context_tooltip:0 "#emphasis Historical Context:#! Khat (or qat) is a leaf which is chewed as a stimulant in parts of East Africa and Yemen where the plant is native. It has played an important role in the social culture of the region for centuries, and was first attested during the medieval period. However, it is addictive and is classified as a \"drug of abuse\" by the World Health Organization."
 RICE_red_sea_chew_khat_desc:0 "Chewing khat leaves while enjoying good company is quite stimulating."
 RICE_red_sea_chew_khat_effect_tooltip_1:0 "There is a small chance you'll gain the [GetTrait('RICE_khat_addict').GetName( GetNullCharacter )|U] [trait|E]. This amount increases each time you take this [decision|E]."
 RICE_red_sea_chew_khat_tooltip:0 "Chewing khat is one way to lose [stress|E]...."
 RICE_red_sea_heirs_of_najah_modifier:0 "Heirs of Najah"
 RICE_red_sea_heirs_of_najah_modifier_desc:0 "Though their journey was dangerous and full of challenges, the children of the slave-turned-ruler Najah $nick_al_ahwal$ succeeded in avenging the death of their father, and reclaiming much of his power and influence in Yemen."
 RICE_red_sea_historical_aspiration_action_said_jayyash:0 "#italic Our father, Najah, who once ruled much of Yemen, was assassinated by a slave girl of the rapacious Sulayhid clan. Though we have fled in exile, my siblings and I will avenge our father one day, and reclaim our birthright. #!$RICE_red_sea_aspiration_said_jayyash_desc$"
