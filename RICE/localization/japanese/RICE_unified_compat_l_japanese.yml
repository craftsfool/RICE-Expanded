 innovation_komnenian_army:0 "Komnenian Army"
 innovation_komnenian_army_desc:0 "The Byzantine army of the Komnenian era, or the Komnenian army, was the force established by Byzantine emperor Alexios I Komnenos during the late 11th/early 12th century, and perfected by his successors John II Komnenos and Manuel I Komnenos during the 12th century. From necessity, following extensive territorial loss and a near disastrous defeat by the Normans of southern Italy at Dyrrachion in 1081, Alexios constructed a new army from the ground up. This new army was significantly different from previous forms of the Byzantine army, especially in the methods used for the recruitment and maintenance of soldiers. The army was characterised by an increased reliance on the military capabilities of the immediate imperial household, the relatives of the ruling dynasty, and the provincial Byzantine aristocracy. Another distinctive element of the new army was an expansion of the employment of foreign mercenary troops and their organisation into more permanent units. However, continuity in equipment, unit organisation, tactics and strategy from earlier times is evident. The Komnenian army was instrumental in creating the territorial integrity and stability that allowed the Komnenian restoration of the Byzantine Empire. It was deployed in the Balkans, Italy, Hungary, Russia, Anatolia, Syria, the Holy Land and Egypt."
