 game_concept_anglo_saxon:0 "Anglo-Saxons"
 game_concept_anglo_saxon_desc:0 "The Anglo-Saxons were a collection of Ænglisċ speaking peoples that inhabited Britain since the Sub-Roman Period from 5th century onward. \n\nDescending from the assimilated [romano_briton|E] and various Germanic [mercenaries|E] groups, they were never a truly unified force. However, due to the efforts of writers like Bede, the ænglisc speaking inhabitants of the many Germanic [kingdoms|E] would gradually develop a common Angelcynn identity that distinguished itself from the Franks on the mainland and Brittonic speaking [romano_briton|E] of Wales and Cornwall."
 game_concept_anglosaxon:0 "Anglo-Saxon"
 game_concept_arab:0 "Arab"
 game_concept_arabic:0 "Arabic"
 game_concept_arabicized:0 "Arabicized"
 game_concept_arabs:0 "Arabs"
 game_concept_arabs_desc:0 "The Arabs are the descendants of various Arabian peoples who were most recently united under the banner of Islam.\n\nWhile they were disunited for much of their history, their recently achieved unification in the 7th century under the banner of the Rashidun Caliphate allowed them to conquer much of the known world. Over the course of a mere century, the Arabs had managed to assert their rule over lands as far west as Hispania and as far east as Khorasan. With the spread of the new religion, the Arabic language and culture, reinforced by migration and assimilation, began to spread and diverge across the vast Islamic Empires, eventually giving rise to various new cultures in the process.\n\nCharacterized by their Arabic [language|E] and their Arabic [heritage|E], the Arabs exist primarily within the Arabian Peninsula but can also be found in substantial numbers in Mesopotamia, the Levante and the Maghreb."
 game_concept_aramean:0 "Aramean"
 game_concept_arameans:0 "Arameans"
 game_concept_arameans_desc:0 "The Arameans, also known as Syrians or Chaldeans, were an ancient people hailing from Aram located in the Levant. During the time of the Assyrian Empire, the Aramaic language would gradually spread into Mesopotamia, replacing the old Akkadian languages once spoken there.\n\nThroughout the post-Assyrian period, the various Aramaic speaking peoples would gradually fall under the influence of neighboring empires, namely those of the Iranians and Romans, causing them to gradually diverge in culture.\n\nCharacterized by their Aramean [heritage|E] and shared Aramaic [language|E], the descendants of the Arameans continue to live on in form of the Syriacs, Assyrians, as well as in the Mandean Community."
 game_concept_aryan:0 "Aryan"
 game_concept_aryans:0 "Aryans"
 game_concept_athoraya:0 "Asorian"
 game_concept_bedouin:0 "Bedouin"
 game_concept_bedouins:0 "Bedouins"
 game_concept_berber:0 "Berber"
 game_concept_berbers:0 "Amazighs"
 game_concept_berbers_desc:0 "Berbers"
 game_concept_briton:0 "Briton"
 game_concept_cadusi:0 "Cadusi"
 game_concept_celtiberian:0 "Iberian Celt"
 game_concept_celtiberians:0 "Iberian Celts"
 game_concept_celtiberians_desc:0 "The Celtic Iberians were the ancient inhabitants of the northern and western regions of the Iberian Peninsula. While most of them were conquered and assimilated in time, the old Callaeci, Astures and Cantabri managed to resist the Romans until the Augustan era, only being subjugated around the late 1st century BCE. Despite this however, they managed to preserve their language and culture way into the early medieval period during which they would briefly reassert their independence.\n\nThough they would finally be conquered and [romanized|E] for good by the Visigoths, they would still play a vital role in the future of Iberia: After the Muslim Conquest of the peninsula, parts of the Visigothic nobility would flee to the mountainous regions where they would ally with the locals to form the Kingdom of Asturias, the predecessor to later kingdoms such as León, Castile and Galicia."
 game_concept_chaldean:0 "Chaldean"
 game_concept_chorasmian:0 "Chorasmian"
 game_concept_chorasmians:0 "Chorasmians"
 game_concept_coptic:0 "Coptic"
 game_concept_daylamite:0 "Daylamite"
 game_concept_east_frankish:0 "East Frankish"
 game_concept_east_slavs:0 "East Slavs"
 game_concept_east_slavs_desc:0 "The East Slavs, also known as the Rus or Ruthenians, are the descendants of the [old_slavs|E] who migrated east from their ancestral homeland of Podlasia.\n\nSettling in the Pontic Steppe and the formerly Baltic and Finno-Ugric lands to the north, these East Slavs would gradually fall under the influence of North Germanic, Varangian raiders, as well as under Byzantine influence that gradually spread northwards from the Black Sea. By the 9th century, the Eastern Slavs were divided into various tribes who were varyingly influenced by their many neighbours before the eventual rise of the Kievan Rus.\n\nCharacterized by Byzantine and North Germanic influenced [culture|E] and their East Slavic [heritage|E], the East Slavs form the link between the [west_slavs|E] and [south_slavs|E]."
 game_concept_eastslavic:0 "East Slavic"
 game_concept_eastslavs:0 "East Slavs"
 game_concept_egyptian:0 "Egyptian"
 game_concept_egyptians:0 "Egyptians"
 game_concept_egyptians_desc:0 "The Egyptians were the ancient inhabitants of the Nile Valley stretching from Aswad all the way to the Nile Delta. Though they have never disappeared, the Egyptians have undergone multiple stages of development since the first dynasties arose in the 4th millennium BCE.\n\nThe conquest of Egypt by Alexander the Great has opened the way for the gradual Hellenization of the native Egyptians who adopted the Greek alphabet for their own language while also converting to Christianity starting in the 1st century CE while under Roman rule, gradually evolving into the early Copts. In most recent history, Egypt fell under the control of the Islamic Caliphates, marking the beginning of the gradual Arabization and Islamization of the local Coptic populace. \n\nCharacterized by their Egyptian [heritage|E] and Coptic [language|E], the descendants of the ancient Egyptians continue to inhabit the lands along the Nile despite the gradual linguistic and religious shift that has been occurring since the 7th century CE."
 game_concept_german:0 "German"
 game_concept_germans:0 "Germans"
 game_concept_germans_desc:0 "The Germans are the descendants of various old Germanic tribes that inhabited the eastern territories of Francia such as the Rhineland, Saxony or Franconia.\n\nWhile originally divided between their tribal components such as the Franks, Saxons, Alemannics and Bavarians, these tribes shared a series of similar Germanic dialects that separated them from the gradually romanised Franks to the west. This shared Diutsc language would then go on to form the basis for a shared identity that made these central Europeans different from their Romance and Slavic neighbours, although it wouldn’t be until the modern period that a true sense of a shared national identity would emerge. Nevertheless, these central European Diutsc speakers would still, in spite of changing and evolving tribal identities that usually served as an umbrella term for this group, become known as a more or less single coherent people and play a crucial role in European dynastic and political history for centuries to come.\n\nCharacterized by their Frankish influenced [culture|E] and their Central Germanic [heritage|E], the Germans exist primarily within Central Europe in the territories that made up East Francia."
 game_concept_iranian:0 "Ērānian"
 game_concept_iranianized:0 "Ērānianized"
 game_concept_iranians:0 "Ērānians"
 game_concept_iranians_desc:0 "The Ērānians, colloquially also known as the Sasanians, or sometimes simply and mistakenly known as 'Persians', were the inhabitants of the Sassanid Empire that dominated Iran from the 3rd century until the 7th century.\n\nThe House of Sasan arose from the historical province of Pars and would, in the 3rd century AD, overthrow the Arsacid Parthians that had ruled Iran up until that point, thus giving rise to the Sasanian Empire that would come to dominate the plateau for the next four centuries. Styling itself as a restored Achaemenid Empire, even coming close to re-establishing the historical boundaries during final the Sassanid-Byzantine war, the Sassanid Empire was eventually left weakened after decades of war and thus became an easy target for the early Islamic Caliphate.\n\nIn the aftermath of the Islamic Conquest of Iran, the many peoples of the former empire began to slowly convert to the new religion, giving rise to new native Iranian dynasties such as the Saffarids or Samanids during the Iranian Intermezzo. Apart from being the main force behind the integration of Khwarazm and Sogdiana into the Ērānian sphere, these dynasties were also patrons of the culture and arts that gave rise to the Islamic-Persian cultural fusion.\n\nCharacterized by their Iranian [heritage|E] and various Iranian [languages|E] such as Persian, Khwarazmian or Caspian, the many descendants of the Ērānians still form the dominant group on the Iranian plateau and in Central Asia."
 game_concept_norse:0 "Norse"
 game_concept_norse_desc:0 "Nordics"
 game_concept_norseman:0 "Norseman"
 game_concept_norsemen:0 "Norsemen"
 game_concept_north_germanic:0 "North Germanic"
 game_concept_north_germanics:0 "North Germanics"
 game_concept_old_asturian:0 "Asturian"
 game_concept_old_briton:0 "Pritanīans"
 game_concept_old_briton_desc:0 "The Pritanīans were the original inhabitants of the island of Britain prior to the Roman conquest. \n\nAfter Claudius’ Invasion, the island was gradually integrated into the wider Roman world, leading to the steady Romanization of the Pritanīans within the province while those beyond the walls to the north would eventually evolve into the ancestors of the Picts. \n\nWhile the original Pritanīans are long gone, their language, as well as aspects of their culture, survive in the later [romanobrit|E] and Pictish traditions."
 game_concept_old_cantabrian:0 "Cantabrian"
 game_concept_old_galician:0 "Callaecian"
 game_concept_old_slavs:0 "Slavs"
 game_concept_old_slavs_desc:0 "The Slavs are the ancestors of the many Slavic peoples that came to inhabit much of Eastern Europe starting in the 6th century AD.\n\nWhile the exact origin and ethnogenesis of the Slavs remains a mystery even to the present day, a likely homeland for these Old Slavs rests within the Podlasia region between Ukraine and Belarus from where these Slavs would start to migrate East, South and West into Ruthenia, Poland, Eastern Germany, Pannonia and the Balkans. While it is most likely that many Slavic peoples can trace their origin to pre-existing peoples that would come to be assimilated because of these Slavic migrations, they nevertheless considered themselves, and were considered by their neighbours, to, more or less, constitute a single people even up until the early modern period.\n\nIn the game, the Slavs are the ancestral culture of the various East, West and South and Pannonian Slavic peoples."
 game_concept_oldbrit:0 "Pritanī"
 game_concept_oldslavic:0 "Slavic"
 game_concept_pactyran:0 "Pactyan"
 game_concept_pactyrans:0 "Pactyans"
 game_concept_pannonian_slavs:0 "Pannonian Slavs"
 game_concept_pannonian_slavs_desc:0 "The Pannonian Slavs are the descendants of the [old_slavs|E] who lived under Avar rule from the 6th to 9th centuries.\n\nFollowing the disintegration of the Avar Khaganate in the late 8th century, the Pannonian Slavs utilized the power-vacuum left behind to establish a series of their own principalities such as Savia, Balaton and Carantania, all of which would all gradually fall into the Frankish orbit during the 9th century to varying degrees.\n\nCharacterized by their Frankish influenced [culture|E] and mixed South- and West Slavic [heritage|E], the Pannonian Slavs form the link between the [south_slavs|E] and [west_slavs|E]."
 game_concept_pannonianslavic:0 "Pannonian Slavic"
 game_concept_parni:0 "Parni"
 game_concept_roman:0 "Roman"
 game_concept_romance:0 "Romance"
 game_concept_romanized:0 "Romanized"
 game_concept_romano_briton:0 "Romano-Britons"
 game_concept_romano_briton_desc:0 "The Romano-Britons, or simply Britons, were the varyingly Romanized [oldbrit|E] who inhabited Britannia until the 5th century AD when the province gradually fell into a military anarchy due to Pictish, Irish and Saxon [raids|E].\n\nWhen Rome finally gave up Britain around the year 440 AD, opportunistic British warlords established their own [kingdoms|E] utilizing Germanic [mercenaries|E] who often tended to usurp leadership for themselves. \nIn some cases however, the ruling elite seems to have maintained itself and simply got assimilated by their retinues over the centuries.\n\nBy the 7th century, the Britons have either been culturally assimilated into new [anglosaxon|E] groups, or have gradually evolved into the various Brythonic peoples."
 game_concept_romanobrit:0 "Romano-Briton"
 game_concept_romanobrittonic:0 "Romano-Briton"
 game_concept_romans:0 "Romans"
 game_concept_romans_desc:0 "The Romans were an originally Latin people that inhabited the city of Rome but who’s name and identity came to be adopted by much of the Mediterranean world over the course of the Roman Empire’s history.\n\nWhile originally, in its narrowest sense, the term Roman denoted an inhabitant of the city of Rome, or a descendant of a Roman citizen, the very idea of what it meant to be Roman became progressively more generalized until in circa 212 CE, Roman citizenship was finally granted to all inhabitants of the Empire. Over the course of Rome's history, the label came to denote more so a cultural lifestyle and legal status, rather than an actual ethnic identity, though more often than not it did take on such a form as well.\n\nCharacterized by their Greek or Latin derived [languages|E], as well as their Latin, Frankish, Iberian, Vlach, Rhaetic or (Eastern) Roman [heritages|E], the descendants of the Romans continue to constitute the majority population across much of the mediterranean."
 game_concept_rus:0 "Rus'"
 game_concept_saka:0 "Saka"
 game_concept_sakans:0 "Sakans"
 game_concept_sarmatian:0 "Sarmatian"
 game_concept_sarmatians:0 "Sarmatians"
 game_concept_scandinavian:0 "Scandinavian"
 game_concept_scandinavians:0 "Scandinavians"
 game_concept_scythian:0 "Scythian"
 game_concept_scythians:0 "Scythians"
 game_concept_scytho_sarmatian:0 "Eastern Iranian"
 game_concept_scytho_sarmatians:0 "Eastern Iranians"
 game_concept_scytho_sarmatians_desc:0 "The Eastern Iranians, also known as Scythians, Sarmatians or Saka, are an ancient people who historically inhabited the steppes of Eurasia, living as far west as Pannonia and as far east as Zhetysu. During the migration age, many tribes such as the Taifals or Alans moved into the Roman Empire, setting up their own kingdoms along with Germanic groups such as the Vandals in North Africa.\n\nIn the aftermath of these migrations, those Eastern Iranians who were left behind gradually assimilated into new emergent groups such as the various Turkic or [oldslavic|E] peoples, though some remain such as the Alans of the Caucasus or the Saka of the Tarim Basin.\n\nCharacterized by their Serindian and Sarmatian [heritage|E], as well as their various Iranian [languages|E] such as Alanian, Sogdian or Saka, the Eastern Iranians are primarily found in Alania, Kashgar, Khotan, as well as in various pockets throughout India."
 game_concept_south_slavs:0 "South Slavs"
 game_concept_south_slavs_desc:0 "The South Slavs, colloquially also known as the Sclavenians or Illyrians, are the descendants of the [old_slavs|E] who fled the advance of the Avars by crossing into Byzantine territory over the course of the 6th and 7th centuries.\n\nRapidly settling the territories stretching from the Black Sea to the Dinaric Alps, the South Slavs became the dominant ethno-linguistic group in the Balkans by the 9th century, having assimilated most of the local Greek, Romance and old Illyrian peoples who resided there.\n\nCharacterized by their Byzantine and Frankish influenced [culture|E] and their South Slavic [heritage|E], the South Slavs form the southern link between the [east_slavs|E] and [pannonian_slavs|E]."
 game_concept_southslavic:0 "South Slavic"
 game_concept_visigoth:0 "Goth"
 game_concept_visigothic:0 "Gothic"
 game_concept_visigoths:0 "Goths"
 game_concept_visigoths_desc:0 "The Goths, colloquially also known as the Visigoths, Ostrogoths and Crimean Goths, are an East Germanic people that hailed from the northern shores of the Black Sea.\n\nWhile their origin can probably be traced back to the Vistula and possibly even Scandinavia, concrete evidence of a distinct Gothic people only emerges after the Tervingi and Greuthungi crossed the Danube into Roman territory during the 4th century CE. Following a series of conflicts between the Romans and Huns, and amidst various Roman Civil Wars, the Goths established their own kingdoms in Gaul, later Iberia, and Italy. While the Goths assimilated into wider Roman culture for the most part, they nevertheless left their mark on the mediterranean landscape for centuries, especially so in Iberia and Southern France where Visigothic Laws persisted way into the 10th century CE and beyond.\n\nCharacterized by their East Germanic [language|E] and their East Germanic [heritage|E], the Goths have long been assimilated and can now only be found in Crimea."
 game_concept_west_slavs:0 "West Slavs"
 game_concept_west_slavs_desc:0 "The West Slavs, colloquially also known as the Wends or Lechites, are the descendants of the [old_slavs|E] who migrated west into the formerly Germanic lands of the Lugians, Gothones and Warini.\n\nSettling along the Vistula, Oder and Elbe rivers, the various West Slavic tribes would gradually repopulate these lands after the departure of its previous inhabitants while simultaneously assimilating the few groups who stayed behind. By the 9th century, most of these Lechitic tribes have established themselves in the western section of the Northern European Plain and became ever more entangled with the Frankish and Bulgarian states that surrounded them which contributed to the rise of native principalities such as Moravia or Poland.\n\nCharacterized by their Frankish influenced [culture|E] and their West Slavic [heritage|E], the West Slavs form the northern link between the [east_slavs|E] and [pannonian_slavs|E]."
 game_concept_westslavic:0 "West Slavic"
