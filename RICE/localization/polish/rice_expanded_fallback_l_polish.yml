l_polish:
 # English fallback only; not counted as translated text.
 ATARAZANA_GLOSS:0 "#bold Atarazana#! is the Iberian term for shipyard or dockyard, borrowed from Arabic. During the medieval period, the reality of political instability and economic opportunity encouraged Muslim and Christian to subsidize the shipbuilding industry here, paving way for Iberia's future naval dominance in the early modern era."
 RICE_atarazanas_decision:0 "Subsidize the Atarazanas"
 RICE_atarazanas_decision_confirm:0 "Those ships will sail, sail away!"
 RICE_atarazanas_decision_context_tooltip:0 "#emphasis Historical Context:#! $ATARAZANA_GLOSS$"
 RICE_atarazanas_decision_desc:0 "Over centuries, due to the instability in [GetGeographicalRegion('world_europe_west_iberia').GetName] and the region's strategic location, [Glossary( 'atarazanas', 'ATARAZANA_GLOSS' )] have grown in importance for any [ruler|E] seeking a political and economic edge in the western Mediterranean. It should support the ones in my [realm|E]."
 RICE_atarazanas_decision_effect_tooltip_1:0 "The [gold|E] and [prestige|E] cost of this [decision|E] depends on how many coastal [counties|E] you own"
 RICE_atarazanas_decision_tooltip:0 "The [Glossary( 'shipyards', 'ATARAZANA_GLOSS' )] of [GetGeographicalRegion('world_europe_west_iberia').GetName] are some of the most important in the Mediterranean"
 RICE_atarazanas_modifier:0 "Subsidized Atarazanas"
 RICE_atarazanas_modifier_desc:0 "Rulers have subsidized [Glossary( 'atarazanas', 'ATARAZANA_GLOSS' )] in this region. These shipywards will continue producing trade ships to grow the economy and war ships to defend the coasts."
 RICE_galicia_geographical_domicile_req:0 "Your [domicile|E] is in [GetGeographicalRegion('RICE_galicia_region').GetName]"
 RICE_galicia_ourense_as_burgas_christian_modifier:0 "$RICE_galicia_ourense_as_burgas_non_christian_modifier$ as a Christian"
 RICE_galicia_ourense_as_burgas_christian_modifier_desc:0 "$RICE_galicia_ourense_as_burgas_non_christian_modifier_desc$ The site is also a popular place to rest for Christian pilgrims traveling the Way of Saint James."
 RICE_galicia_ourense_as_burgas_non_christian_modifier:0 "Visited As Burgas"
 RICE_galicia_ourense_as_burgas_non_christian_modifier_desc:0 "This character recently went to $b_ourense$ to relax at the thermal springs there, especially the famed #italic As Burgas#!."
 RICE_galicia_pico_sacro_chapel_decision:0 "Consecrate Chapel on Pico Sacro"
 RICE_galicia_pico_sacro_chapel_decision_confirm:0 "This mountain belongs to [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
 RICE_galicia_pico_sacro_chapel_decision_context_tooltip:0 "$RICE_galicia_pico_sacro_decision_context_tooltip$"
 RICE_galicia_pico_sacro_chapel_decision_desc:0 "Some locals in [GetGeographicalRegion('RICE_galicia_region').GetName] believe that praying to Pico Sacro near [GetTitleByKey('c_santiago').GetNameNoTier] will heal one of any ailment. Some [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] are suspicious of what they see as false superstitions. Building a chapel on the mountain, associated with proper [ROOT.Char.GetFaith.GetAdjective] worship, will make it more palatable to these types."
 RICE_galicia_pico_sacro_chapel_decision_effect_tooltip_1:0 "Followers of [GetReligionFamily('rf_abrahamic').GetName] [faiths|E] will no longer have to pay more [gold_i|E] [gold|E], lose [piety_i|E] [piety|E], and get reduced [court_chaplain|E] [opinion_i|E] [opinion|E] when taking the [decision|E] to #V $RICE_galicia_pico_sacro_decision$#!"
 RICE_galicia_pico_sacro_chapel_decision_tooltip:0 "They say the sacred mountain of Pico Sacro can heal people!"
 RICE_galicia_pico_sacro_decision:0 "Pray to Pico Sacro"
 RICE_galicia_pico_sacro_decision_confirm:0 "Heal me, great mountain!"
 RICE_galicia_pico_sacro_decision_context_tooltip:0 "#emphasis Historical Context:#! Northwest Iberia is home to several mountains associated with various superstitions, though their relation to pre-Christian practice is uncertain. Pico Sacro, one of the more prominent of these mountains, is known for the legends surrounding Apostle James and the mythological Lupa, a pagan queen who initially caused trouble for James' disciples but later converted to Christianity. The mountain's connection to Saint James developed during the medieval period, when a chapel dedicated to him was constructed there by Bishop Sisnando in 899."
 RICE_galicia_pico_sacro_decision_desc:0 "Those who live around [GetGeographicalRegion('RICE_galicia_region').GetName] often believe that praying to the mountain known as Pico Sacro near [GetTitleByKey('c_santiago').GetNameNoTier] can heal one of any ailment, based on the many legends surrounding this site."
 RICE_galicia_pico_sacro_decision_effect_tooltip_1:0 "The [decision|E] requires more [gold_i|E] [gold|E], costs [piety_i|E] [piety|E], and reduces [court_chaplain|E] [opinion_i|E] [opinion|E] for followers of [GetReligionFamily('rf_abrahamic').GetName] [faiths|E] if the [decision|E] to #V $RICE_galicia_pico_sacro_chapel_decision$#! has not been taken yet"
 RICE_galicia_pico_sacro_decision_tooltip:0 "They say the sacred mountain of Pico Sacro can heal people!"
 RICE_galicia_pico_sacro_modifier:0 "Prayed to Pico Sacro"
 RICE_granada_hedionda_baths_julius_caesar_modifier:0 "Inspired by the Hedionda Baths"
 RICE_granada_hedionda_baths_julius_caesar_modifier_desc:0 "$RICE_granada_hedionda_baths_modifier_desc$ In fact, thanks to this experience, they were inspired by Julius Caesar's famous deeds."
 RICE_granada_hedionda_baths_modifier:0 "Visited the Hedionda Baths"
 RICE_granada_hedionda_baths_modifier_desc:0 "This character recently went to the hot springs of Hedionda in Andalusia, which according to legend was visited by Julius Caesar, to cure himself of a skin condition."
 RICE_santiago_county_faith_req:0 "The [county|E] of [GetTitleByKey('c_santiago').GetNameNoTier] follows your [faith|E]"
 RICE_unlocked_atarazanas_decision_desc:0 "Enables the [decision|E] to $RICE_atarazanas_decision$"
 activity_RICE_hot_springs_visit_hedionda_province_desc:0 "\n#P +++ The Hedionda Baths are [hot_springs|E] between [GetTitleByKey('b_algeciras').GetNameNoTier] and [GetTitleByKey('b_malaga').GetNameNoTier] which even Julius Caesar visited in local legend due to the springs' fame in healing skin ailments.#!\n\n#italic This will lead to gaining the [GetModifier('RICE_granada_hedionda_baths_modifier').GetNameWithTooltip] [character_modifier|E]. However, there is also a chance of gaining an upgraded version of this [modifier|E] instead, [GetModifier('RICE_granada_hedionda_baths_julius_caesar_modifier').GetNameWithTooltip].#!"
 activity_RICE_hot_springs_visit_ourense_province_desc:0 "\n#P +++ The [hot_springs|E] of [GetTitleByKey('b_ourense').GetNameNoTier] have been renowned since Roman times, if not before, especially #italic As Burgas#!.#!\n\n#italic This will lead to gaining the [GetModifier('RICE_galicia_ourense_as_burgas_non_christian_modifier').GetNameWithTooltip] [character_modifier|E]. If you follow a [GetReligionByKey('christianity_religion').GetAdjective] [faith|E], you will get the [GetModifier('RICE_galicia_ourense_as_burgas_christian_modifier').GetNameWithTooltip] [modifier|E] instead, and will also get some bonus [piety_i|E] [piety|E].#!"
 ammon_pagan:0 "Ammonism"
 ammon_pagan_adherent:0 "Ammonite"
 ammon_pagan_adherent_plural:0 "Ammonites"
 ammon_pagan_adj:0 "Ammon"
 ammon_pagan_desc:0 "A syncretic religion centered around the Oracle at Siwa that mixed Hellenic, Berber, and Kemetic practices"
 ammon_pagan_old:0 "Old Ammonism"
 ammon_pagan_old_adherent:0 "Old Ammonite"
 ammon_pagan_old_adj:0 "Old Ammon"
 ammon_pagan_old_plural:0 "Old Ammonites"
 beja_creator_god_name:0 "$beja_high_god_name$"
 beja_creator_god_name_possessive:0 "$beja_high_god_name_possessive$"
 beja_death_deity_name:0 "Osiris"
 beja_death_deity_name_possessive:0 "Osiris's"
 beja_fate_god_name:0 "$beja_health_god_name$"
 beja_fate_god_name_possessive:0 "$beja_health_god_name_possessive$"
 beja_fertility_god_name:0 "Priapus"
 beja_fertility_god_name_possessive:0 "Priapus's"
 beja_good_god_abene:0 "Abene"
 beja_good_god_khopan:0 "Khopan"
 beja_health_god_name:0 "Amati"
 beja_health_god_name_possessive:0 "Amati's"
 beja_high_god_name:0 "Mandulis"
 beja_high_god_name_alternate:0 "Mandulis"
 beja_high_god_name_alternate_possessive:0 "Mandulis's"
 beja_high_god_name_possessive:0 "Mandulis's"
 beja_night_god_name:0 "$beja_health_god_name$"
 beja_night_god_name_possessive:0 "$beja_health_god_name_possessive$"
 beja_pagan:0 "Mandulism"
 beja_pagan_adherent:0 "Mandulist"
 beja_pagan_adherent_plural:0 "Mandulists"
 beja_pagan_adj:0 "Mandulist"
 beja_pagan_desc:0 "'Sun, The great god, lord of Kalabsha, the all-seeing master, king of all,'\n\nMandulis (or Merwel in Old Nubian) is the great sun god of Lower Nubia. Though he was worshipped by Egyptians and Kushites, the centre of a cult was amongst the Blemmeyes of the Eastern Desert. Mandulis, usually shown as a falcon with the head of a man, is the Kushite form of the Egyptian god Horus, who was the god of the sky and the son of Isis and Osiris. His main temple in Philae served as the chief site of pilgrimage."
 beja_pagan_old:0 "Old Mandulism"
 beja_pagan_old_adherent:0 "Old Mandulist"
 beja_pagan_old_adherent_plural:0 "Old Mandulists"
 beja_pagan_old_adj:0 "Old Mandulist"
 dharmaguptaka:0 "Dharmaguptaka"
 dharmaguptaka_adherent:0 "Dharmaguptakan"
 dharmaguptaka_adherent_plural:0 "Dharmaguptakans"
 dharmaguptaka_adj:0 "Dharmaguptaka"
 dharmaguptaka_desc:0 "The Dharmaguptaka sect traces its heritage to the legendary Dharmagupta, a fervent follower of Buddha's disciple Maudgalyayana. They are based in Gandhara, but have had an impact across Central Asia and beyond. Their teachings include the belief that the Four Noble Truths are to be observed simultaneously, and that the path of a sravaka and of a Boddhisattva are separate."
 egyptian_pagan:0 "Kemetism"
 egyptian_pagan_adherent:0 "Kemite"
 egyptian_pagan_adherent_plural:0 "Kemites"
 egyptian_pagan_adj:0 "Kemetic"
 egyptian_pagan_desc:0 "The religion of the Pharaohs stretches back thousands of years. An innumerable group of deities are present in the world and daily life, which they control without question. Ritual prayers, offerings, celebrations, and construction of elaborate temples and monuments are needed to gain their favor and maintain Ma'at, the cosmic order."
 egyptian_pagan_old:0 "Old Kemetism"
 egyptian_pagan_old_adherent:0 "Old Kemite"
 egyptian_pagan_old_adherent_plural:0 "Old Kemites"
 egyptian_pagan_old_adj:0 "Old Kemetic"
 galicia.0001.desc.christian:0 "Greatest of these legends are those related to Saint James, his disciples, and the once pagan Queen Lupa.\n\nRegardless, I turn to face the direction of the mountain, and I begin my prayers to Saint James by reciting:"
 galicia.0001.desc.conclusion:0 "\n\n#EMP “Pico Sacro, Pico Sacro, cure me of this sickness that I bear!”#!"
 galicia.0001.desc.other:0 "Its spiritual qualities are unquestionable.\n\nRegardless, I turn to face the direction of the mountain, and I begin my prayers to [ROOT.Char.GetFaith.HighGodName] by reciting:"
 galicia.0002.desc.christian:0 "Among [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], there are many stories connecting the mountain to Saint James the Apostle and Queen Lupa, for instance."
 galicia.0002.desc.conclusion:0 "This chapel will undoubtedly tie these stories to more orthodox forms of [ROOT.Char.GetFaith.GetAdjective] worship.\n\nIn doing so, the “superstitions” surrounding Pico Sacro will become even more acceptable to devotees of various [GetReligionFamily('rf_abrahamic').GetName] religions."
 galicia.0002.desc.non_christian:0 "Even [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] living there have several legends about why the mountain is sacred."
 galicia.0017.desc.christian:0 "\n\nThe springs are also located on the #italic Camino Sanabrés#! route of the Way of St James, so it is a popular resting place for pilgrims. Perhaps seeing some will inspire me...."
 galicia.0018.desc.christian:0 "\n\nI do, of course, notice the number of [GetReligionByKey('christianity_religion').GetAdjective] pilgrims using the thermal springs as well. Most are likely traveling the Way of Saint James, and their presence is an inspiration to the devout."
 granada.0006.a.julius_caesar:0 "You are inspired by Julius Caesar"
 granada.0006.a.normal:0 "You relax normally"
 holy_site_cagliari_effect_name:0 "From [holy_site|E] #weak ($holy_site_cagliari_name$)#!"
 holy_site_cagliari_name:0 "Caralis"
 innovation_RICE_placeholder_01:0 "Atarazanas"
 innovation_RICE_placeholder_01_desc:0 "Shipyards are found around the world wherever there is water, but due to Iberia's unique strategic location and political struggle, rulers have found ways to support the growth of the shipwright industry in the peninsula's own shipyards, or [Glossary( 'atarazanas', 'ATARAZANA_GLOSS' )], for economic and military reasons."
 karen_pagan:0 "K'larism"
 karen_pagan_adherent:0 "K'larist"
 karen_pagan_adherent_plural:0 "K'larists"
 karen_pagan_adj:0 "K'larist"
 karen_pagan_desc:0 "The traditional beliefs of the Karen peoples revolves around maintaining balance with the spirits of the world, and each person, when alive, is embodied by thirty-seven of these spirits, known as the K'lar."
 karen_pagan_old:0 "Old K'larism"
 karen_pagan_old_adherent:0 "Old K'larist"
 karen_pagan_old_adherent_plural:0 "Old K'larists"
 karen_pagan_old_adj:0 "Old K'larist"
 karen_pagan_old_desc:0 "$karen_pagan_desc$"
 kushitism_pagan_desc:0 "Though connected to the ancient polythestic cults of Egypt and Meroe, the Northeast Sudanic peoples like the Nubians have rejected the Meroitic priestly traditions in favor of their own forms of worship, influenced somewhat by the Abrahamic religions to the north."
 kushitism_pagan_old_desc:0 "$kushitism_pagan_desc$"
 mahasanghika:0 "Mahasanghika"
 mahasanghika_adherent:0 "Mahasanghikan"
 mahasanghika_adherent_plural:0 "Mahasanghikans"
 mahasanghika_adj:0 "Mahasanghika"
 mahasanghika_desc:0 "At the Second Buddhist Council, the Mahasanghika were the majority faction who refused to adopt additional rules for the Buddhist monastic community (as opposed to the Sthaviras). They believe in the transcendental, supramundane nature of Buddhas and Bodhisattvas, the fallibility of arhats, and that the historical Buddha never had a true physical form, merely manifesting as an illusion to help sentient beings."
 marcionite:0 "Marcionism"
 marcionite_adherent:0 "Marcionite"
 marcionite_adherent_plural:0 "Marcionites"
 marcionite_adj:0 "Marcionite"
 marcionite_desc:0 "Marcionites follow the teachings of Marcion of Sinope, an early Christian theologian who taught that the benevolent God of the Gospel, the true Supreme Being, was different than the malevolent Demiurge or Creator of the Hebrew Old Testament. According to Marcion, Paul the Apostle was the only true apostle of Jesus Christ."
 meroitic_creator_god_name:0 "Amun"
 meroitic_creator_god_name_possessive:0 "Amun's"
 meroitic_death_deity_name:0 "Osiris"
 meroitic_death_deity_name_possessive:0 "Osiris's"
 meroitic_fate_god_name:0 "Thoth"
 meroitic_fate_god_name_possessive:0 "Thoth's"
 meroitic_fertility_god_name:0 "Sebiumeker"
 meroitic_fertility_god_name_possessive:0 "Sebiumeker's"
 meroitic_good_god_anuket:0 "Anuket"
 meroitic_good_god_arensenuphis:0 "Arensenuphis"
 meroitic_good_god_mahes:0 "Mahes"
 meroitic_good_god_mash:0 "Mash"
 meroitic_good_god_sekhmet:0 "Sekhmet"
 meroitic_good_god_shebo:0 "Shebo"
 meroitic_good_god_wepset:0 "Wepset"
 meroitic_health_god_name:0 "Isis"
 meroitic_health_god_name_possessive:0 "Isis'"
 meroitic_high_god_name:0 "Apedemak"
 meroitic_high_god_name_alternate:0 "Apedemak"
 meroitic_high_god_name_alternate_possessive:0 "Apedemak's"
 meroitic_high_god_name_possessive:0 "Apedemak's"
 meroitic_household_god_name:0 "Bes"
 meroitic_household_god_name_possessive:0 "Bes'"
 meroitic_knowledge_god_name:0 "Thoth"
 meroitic_knowledge_god_name_possessive:0 "Thoth's"
 meroitic_night_god_name:0 "Amesemi"
 meroitic_night_god_name_possessive:0 "Amesemi's"
 meroitic_pagan:0 "Apedemakism"
 meroitic_pagan_adherent:0 "Apedemakist"
 meroitic_pagan_adherent_plural:0 "Apedemakists"
 meroitic_pagan_adj:0 "Apedemakist"
 meroitic_pagan_desc:0 "The religion of the Kingdom of Meroe reflects centuries of syncretism between the ancient Egyptian pantheon and local Sudanic beliefs; it is a distinct, vibrant tradition, supported by a strong priestly class and monarchial institutions. Prominent cults include that of Apedemak, the lion-headed god of war, and the Egyptian deities Isis and Osiris."
 meroitic_pagan_old:0 "Old Apedemakism"
 meroitic_pagan_old_adherent:0 "Old Apedemakist"
 meroitic_pagan_old_adherent_plural:0 "Old Apedemakists"
 meroitic_pagan_old_adj:0 "Old Apedemakist"
 meroitic_pagan_old_desc:0 "$meroitic_pagan_desc$"
 nubian_rite:0 "Nubian Rite"
 nubian_rite_adherent:0 "Nubian Christian"
 nubian_rite_adherent_plural:0 "Nubian Christians"
 nubian_rite_adj:0 "Nubian"
 nubian_rite_desc:0 "Though strongly associated with the Coptic Church, Christianity in Nubia has taken on its own unique traits, such as veneration of dead rulers, bishops, and local saints, as well as an embrace of indigenous African customs. The Church in Nubia has staunchly protected itself and the Coptic Church over the centuries."
 pudgalavada:0 "Sammitiya"
 pudgalavada_adherent:0 "Sammitiyan"
 pudgalavada_adherent_plural:0 "Sammitiyans"
 pudgalavada_adj:0 "Sammitiya"
 pudgalavada_desc:0 "The Sammitiya are the most successful and widespread of the schools that branched off from the Vatsiputriyans. Their chief difference from other major Buddhist sects is their staunch belief in the concept of a person that carries the burdens of karma, which they argue does not contradict, but in fact adds much needed nuance to the Buddha's profound teaching of no self."
 pudgalavada_faith:0 "Pudgalavada"
 pudgalavada_faith_adherent:0 "Pudgalavadan"
 pudgalavada_faith_adherent_plural:0 "Pudgalavadans"
 pudgalavada_faith_adj:0 "Pudgalavada"
 pudgalavada_faith_desc:0 "While there is no atman, there is a pudgala (person), which is neither a conditioned dharma nor an unconditioned dharma. The path to enlightenment involves understanding this pudagala through personal experience, reflection and reasoning."
 sardinian_pagan:0 "Nuragism"
 sardinian_pagan_adherent:0 "Nuragic"
 sardinian_pagan_adherent_plural:0 "Nuragics"
 sardinian_pagan_adj:0 "Nuragic"
 sardinian_pagan_desc:0 "$sardinian_religion_desc$"
 sardinian_pagan_old:0 "Old Nuragism"
 sardinian_pagan_old_adherent:0 "Old Nuragic"
 sardinian_pagan_old_adj:0 "Old Nuragic"
 sardinian_pagan_old_plural:0 "Old Nuragics"
 sardinian_religion:0 "Sardinian"
 sardinian_religion_adherent:0 "Sardinian"
 sardinian_religion_adherents_plural:0 "Sardinians"
 sardinian_religion_adj:0 "Sardinian"
 sardinian_religion_desc:0 "The indigenous inhabitants of Sardinia worship gods who are often associated with various animals and symbols of nature, in particular the fertility deities of the male Bull-Sun and the female Water-Moon. Traditionally, islanders would gather throughout the year in holy places like sacred wells to worship."
 sarvastivada:0 "Sarvastivada"
 sarvastivada_adherent:0 "Sarvastivadan"
 sarvastivada_adherent_plural:0 "Sarvastivadans"
 sarvastivada_adj:0 "Sarvastivada"
 sarvastivada_desc:0 "\"Sarvastivada\" means the \"theory that all exists,\" based on the argument that all dharmas, or phenomena, exist in the past, present, and future. This school has a strong Abhidharma (or scholastic) tradition, with seven unique Abhidharma works, and over the course of its history has exerted a significant influence on the development of Indian Buddhist philosophy and theology."
 tenet_rice_all_dharmas_exist_desc:0 "All phenomena, or dharmas, such as one's karma, exist in the “three times:” the past, present, and future. This nuanced philosophical approach provides a systematic framework that ties together many different aspects of the Buddha's teaching, from meditation practices to scriptural interpretation."
 tenet_rice_all_dharmas_exist_name:0 "All Dharmas Exist"
 tenet_rice_flawed_arhats_desc:0 "Though [Glossary( 'Arhats', 'ARHATS_GLOSS' )] are beings of great spiritual development, they are still fallible and capable of moral failings. We thus reject others' aspirations to become like Arhats – incomplete enlightenment is #italic not#! enlightenment, and Buddhahood should be everyone's ultimate goal!"
 tenet_rice_flawed_arhats_name:0 "Flawed Arhats"
 tenet_rice_meritorious_merchant_donors_desc:0 "Merchants are an important part of our religious community, as they use their wealth to spread the true teachings of [ROOT.Faith.HighGodName]. In turn, temples and monasteries help virtuous merchants by providing loans, storage of goods, and resting facilities."
 tenet_rice_meritorious_merchant_donors_name:0 "Meritorious Merchant Donors"
 tenet_rice_personalism_desc:0 "Some deluded Buddhists have taken the Buddha's doctrine of “no self” to the extreme. We understand his true teaching: while there is no self, there is a #italic pudgala#!, a person, who carries the burdens of karma from one life to another, like a fire sustained by fuel. Reaching enlightenment is thus like extinguishing this fire."
 tenet_rice_personalism_name:0 "Pudgala"
 tenet_rice_sanctity_of_labor_desc:0 "Churches, Temples, and Sacrifices to the Divine may have some spiritual worth, but no activity is more sacred than a hard day's labor performed in the fields."
 tenet_rice_sanctity_of_labor_name:0 "Sanctity of Labor"
 vatsiputriya:0 "Vatsiputriya"
 vatsiputriya_adherent:0 "Vatsiputriyan"
 vatsiputriya_adherent_plural:0 "Vatsiputriyans"
 vatsiputriya_adj:0 "Vatsiputriya"
 vatsiputriya_desc:0 "The Vatsiputriya are the original school that taught the doctrine of the pudgala: while there is no self, there is a person who carries the burden of karma from one life to the next until enlightenment."
 vibhajjavada:0 "Vibhajjavada"
 vibhajjavada_adherent:0 "Vibhajjavadan"
 vibhajjavada_adherent_plural:0 "Vibhajjavadans"
 vibhajjavada_adj:0 "Vibhajjavada"
 vibhajjavada_desc:0 "The distinctionists are known as such because they distinguish between phenomena that exist in the present and the past, and dhammas that do not exist in the past and the future. Having rejected the Pudgalavada and Sthavira doctrines, they are a group of schools that see themselves as upholders of the true Buddhist teachings."
