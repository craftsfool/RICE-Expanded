 meshefares_desc:0 "“人皆兄弟之民”，又称阿赫莱·哈克（“遵真理者”）。该群体认为，真主在世间的每个时代都有一个主要化身和七个次要化身。这七个化身被称为#Italic 哈夫坦#!。当前第四个纪元的主要化身是苏丹萨哈克。"
