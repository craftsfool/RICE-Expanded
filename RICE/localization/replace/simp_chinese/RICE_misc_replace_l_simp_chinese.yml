 yazidi_religion_desc:0 "美索不达米亚北部和伊朗西部山区是讲伊朗语的民族（尤其是库尔德人）的家园，几个世纪以来，库尔德人将祆教、伊斯兰教和诺斯替主义等多种宗教传统的思想融合在一起，从而加强了他们现有的信仰。"
