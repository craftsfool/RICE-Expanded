 kitebacilweism_adherent_plural:0 "迈赫尔派信徒"
 kitebacilweism_desc:0 "西北伊朗人的古老宗教信仰与正统祆教有关，但又有所不同，在萨珊王朝鼎盛时期，它可能与正统祆教并存。这一宗教对大自然的崇敬十分突出，古老的伊朗神祇密特拉被作为半神和共同的崇拜对象，并在宇宙论中扮演着重要的角色——这一角色可能是几个世纪前罗马密特拉崇拜的灵感来源。"
