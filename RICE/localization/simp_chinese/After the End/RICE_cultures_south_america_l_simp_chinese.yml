 innovation_RICE_quipu:0 "结绳文字"
 innovation_RICE_quipu_desc:0 "安第斯山脉高地的某些文明普遍使用一种结绳记录系统。这些绳索根据颜色、顺序以及绳结数量等多种因素对信息进行分类。"
 innovation_RICE_andean_roads:0 "安第斯道路"
 innovation_RICE_andean_roads_desc:0 "崎岖的安第斯山脉并非无法逾越的屏障——只要愿意投入时间和资源，建立起一个由道路、驿站和信使构成的复杂网络。"
 tradition_RICE_andean_hydraulic_engineering_name:0 "安第斯水利工程"
 tradition_RICE_andean_hydraulic_engineering_desc:0 "该文化生活在安第斯山脉片，历经从热带湿润气候到干旱荒芜地区的变迁，精通利用灌溉渠、蓄水池、融雪等多种方式将水引入崎岖地形中最需要之处。"
