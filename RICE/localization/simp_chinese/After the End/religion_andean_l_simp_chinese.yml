 embera_religion_desc:0 "世间遍布着贾伊，它们并非虚无缥缈的存在，而是深深植根于物质世界——火、水、气、土、石、草木之中皆有祂们栖身。而贾伊巴纳是懂得与这些精魂沟通的专家，以此治愈和保护人类。在此宗教中树木尤为具有灵性意义，因其漫长生命见证诸多世事，被视为先祖智慧的宝库；而河流，则因人逝后常被安葬于独木舟中，与水相契，故亦备受尊崇。"
