 manteno_religion_adherent:0 "乌米娜教信徒"
 manteno_religion_adherent_plural:0 "乌米娜教信徒"
 manteno_religion_desc:0 "女神乌米娜曾是一位凡人女子，后因种种原因死于非命，一说其是为丰饶之神而献身，但乌米娜伤口中流出的并非鲜血，取而代之的是无数蝴蝶自其躯体中翩然飞出；她心脏原本所在之处，竟现出一枚翡翠。这枚鸵鸟蛋大小的翡翠蕴藏着无上神力，人们为供奉乌米娜建起众多庙宇。她的信徒狂热守护着这枚翡翠，因为太阳神曾昭示：若翡翠落入邪恶之手，天地必将毁灭。"
