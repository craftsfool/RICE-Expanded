 andean_religion:0 "安第斯宗教"
 andean_religion_adj:0 "安第斯宗教"
 andean_religion_adherent:0 "安第斯宗教教徒"
 andean_religion_adherent_plural:0 "安第斯宗教教徒"
 andean_religion_desc:0 "安第斯宗教的信徒崇拜自古帝国时代流传下来的古老神灵和安第斯人民的信仰，他们认为自然界及其各种元素是神圣的，是人类无法创造的。只有将宗教生活与世俗生活完美结合，对大自然赐予的一切充满感激之情，人类才能找到和平与和谐。通过坚持这一真理，人类加强了彼此之间关系的纽带，同时也是对其尊贵神灵的尊重。"
 pachamama_religion:0 "帕查玛玛教"
 pachamama_religion_adj:0 "帕查玛玛教"
 pachamama_religion_adherent:0 "帕查玛玛教徒"
 pachamama_religion_adherent_plural:0 "帕查玛玛教徒"
 pachamama_religion_desc:0 "安第斯原住民古老的精神信仰，与传统的处女奉献和保护安第斯山脉自然美景的愿望相融合，最终形成了对帕查玛玛这一人物的崇敬。她的信徒认为，包括人类在内的所有大自然都是她的孩子，靠她的慷慨和牺牲而生存。然而，人类是贪婪的，他们的傲慢导致她在大约7个世纪前濒临死亡。从那时起，信徒们就发誓一定要实现平衡；人类必须像她一直照顾他们一样照顾她。"
