 chiminigagua_desc:0 "博兹卡之道（Bozic Ie）是穆伊斯卡人的传统信仰。在很久以前，穆伊斯卡人崇拜奇米尼加瓜和他的万神殿，其中最主要的是太阳神和月亮神——苏阿和奇耶。现在，古老的穆伊斯卡神和祖先传说仍作为文化暗流在哥伦比亚高原地区流传。"
