 inti_religion_desc:0 "根据现存的民间信仰和[Concept('the_event_ate','末日')|E]前古代印加宗教的编年史重建的因蒂崇拜，是重建的塔万廷苏尤的正式宗教。因蒂神与其他许多神一起受到崇拜，这些神掌管着宇宙的各个方面和机制。据说，以太阳为代表的因蒂本人是萨帕·印卡的祖先，也是他统治下的许多人的保护神。"
