 inkarri_religion_desc:0 "印卡里预言的信徒们声称[Concept('the_event_ate','末日')|E]前的塔万廷苏尤之王，阿塔瓦尔帕立誓在死后复归，毁灭大地上的僭主，重建当下在人民与帕查玛玛间断绝的联系。为了确保这条誓愿永不成真，⌈征服者⌋们将他分尸，掩埋在他的宫殿与城市的废墟之下。然而，他身躯的碎片化为魔金，虽然分隔，却得以永存。自[Concept('the_event_ate','末日')|E]以来，在印卡里教徒中，搜索废墟变得普遍起来，他们相信如果能找到并重组末代萨帕·印加的躯体，他就会醒来，永生不朽，宛若天神，永久净化大地之上的一切邪恶。"
