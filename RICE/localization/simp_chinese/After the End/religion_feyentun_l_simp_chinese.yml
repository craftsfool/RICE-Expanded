 mapuche_religion_desc:0 "作为马普切人和马普宗贡语民族的传统信仰——费延吞（意为“信仰”），其世界观旨在与物质世界和平相处，以作为自然循环的一部分。通过对统治世界的诸灵——恩根的崇敬和尊重，将带来繁荣。虽然最初是多神论和万物有灵论，但恩根如今扮演了更次要的角色，因为几个世纪以来与亚伯拉罕信仰的接触使该宗教成为一神论。"
