 nguillatun_desc:0 "作为马普切人的传统信仰，他们相信在世界形成之前，被称为恩根、皮兰和旺古伦的不同原初神灵从宇宙灵魂普阿姆中诞生，并通过各自的冲突和故事创造了万物。现在，神灵们休息了，但仍在影响着世界，人类的主宰神灵恩根辰会在恩吉拉顿或“请愿”仪式上祝福那些用供品来满足他们的人，并惩罚那些没有提供有价值供品的人。恩吉拉顿信徒由大多为女性的玛奇领导，玛奇是睿智的精神领袖，在恩吉拉顿和玛奇顿仪式中提供建议并主持仪式。大多数祈祷祭仪信徒认为末日只是世界另一个周期的结束，随着它的到来，恩根再次复活，将世界带回到新的起点。"
