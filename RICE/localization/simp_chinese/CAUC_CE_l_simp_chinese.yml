 CAUC_CE.0025.a:0 "让邻国承认这顶新冠冕。"
 CAUC_CE.0025.desc:0 "世世代代，群山之外的统治者争夺着黑海与里海之间的土地。如今，我已将外高加索的腹地统一于我的统治之下。我的继承人将接掌一个拥有自身冠冕与责任的帝国，也将面对边境列强的注视。"
 CAUC_CE.0025.t:0 "自己的帝国"
 CAUC_establish_transcaucasia_decision:0 "建立外高加索"
 CAUC_establish_transcaucasia_decision_confirm:0 "设立帝国冠冕"
 CAUC_establish_transcaucasia_decision_desc:0 "我控制着外高加索的腹地，可以设立属于自己的帝国冠冕。那些帝国的统治者曾争夺这片土地，如今我的领国也将与他们并立。新冠冕将为继承人带来责任，也会在边境招来对手。"
 CAUC_establish_transcaucasia_decision_tooltip:0 "外高加索成为一个[de_jure|E][empire|E]"
