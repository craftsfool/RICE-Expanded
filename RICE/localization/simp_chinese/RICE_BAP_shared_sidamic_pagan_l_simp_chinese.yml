 sidama_pagan_adherent_plural:0 "马加诺教信徒"
 sidama_pagan_desc:0 "马加诺（Magano）是创世的天神，人们可以通过祖灵阿卡科（Akaako）与他联系。人们必须遵守严格的道德规范，尊重长辈、崇拜祖先，否则就会遭到马加诺的愤怒。"
