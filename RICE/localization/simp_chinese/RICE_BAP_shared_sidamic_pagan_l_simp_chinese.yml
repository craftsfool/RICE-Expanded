 damot_pagan_adherent:1 "德斯克教徒"
 damot_pagan_adherent_plural:0 "德斯克教徒"
 damot_pagan_desc:0 "无论我们贫贱还是富贵，也无论我们使用哪种语言，我们都遵奉德斯克神，向祂献上牺牲、辣食乃至人祭。如果德斯克神喜悦，祂就会附身在祂选中的占卜士或者巫师上，赐予他们预知未来的能力以及控制元素的力量。"
