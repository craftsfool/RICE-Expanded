 fandaanano_desc:0 "瓦亚（Waaýa）是唯一的创世真神；不过，人类的命运主要还是操于精灵与恶魔之手，我们必须崇拜精灵、躲避恶魔。我们的宗教与亚伯拉罕诸教一样，都是正教，亚伯拉罕诸教的信徒虽对此持怀疑态度，但我们并不应被视作异教徒。"
