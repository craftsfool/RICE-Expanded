l_simp_chinese:
 YIDAM_GLOSS:0 "在[GetReligionByKey('bon_religion').GetAdjective]和藏传[GetReligionByKey('buddhism_religion').GetName]中，#bold 本尊#!是帮助人们学法修行的成就根本，这些是宗教修行的重要组成部分，其中包括念诵祈祷文咒语、观想神祇，以及更重要的#italic 本尊瑜伽#!。"
 NAT_GLOSS:0 "#bold 纳#!是[GetGeographicalRegion('world_burma').GetName]自古传承的崇拜神祇们，祂们与[GetReligionByKey('buddhism_religion').GetAdjective]宗教习俗和缅甸民间宗教紧密相融。"
 RICE_select_personal_deity_tibet_decision:0 "择决本尊"
 select_personal_deity_tibet_decision_desc:0 "[Glossary( '本尊', 'YIDAM_GLOSS' )]是帮助[GetReligionByKey('bon_religion').GetAdjective]和$heritage_tibetan_name$[GetReligionByKey('buddhism_religion').GetAdjective]追随者学法修行的成就根本，我通过选择一位[Glossary( '本尊', 'YIDAM_GLOSS' )]作为修持对象。\n\n如今我该选择谁好呢？"
 RICE_select_personal_deity_tibet_decision_confirm:0 "观想本尊"
 select_personal_yidam_decision_tooltip:0 "你将选择一位[Glossary( '本尊', 'YIDAM_GLOSS' )]作为修持对象"
 select_personal_yidam_decision_tt:0 "你将获得一个与你选择修持[Glossary( '本尊', 'YIDAM_GLOSS' )]所相应的#P 正面#![modifier|E]"
 RICE_select_personal_nat_decision:0 "选择供奉之纳"
 select_personal_nat_decision_desc:0 "#bold 纳#!是[GetReligionByKey('burmic_religion').GetAdjective]信仰中的神祇，可以帮助人们获得启蒙或庇护信徒。通过修持特定的纳，我可以走上成为完全开悟之路。\n\n如今我该选择哪位开明善良的纳呢？"
 RICE_select_personal_nat_decision_confirm:0 "观想纳神"
 select_personal_nat_decision_tooltip:0 "你将选择一位纳作为修持对象"
 select_personal_nat_decision_tt:0 "你将获得一个与你选择修持纳所相应的#P 正面#![modifier|E]"
 RICE_select_personal_deity_buddhist_decision:0 "观想神佛"
 select_personal_deity_buddhist_decision_desc:0 "许多[GetReligionByKey('buddhism_religion').GetAdherentNamePlural]都尊崇修持和冥想#bold 神，佛以及菩萨#!来帮助修行者开悟。通过修持其中一位，我可以走上成为完全开悟之路。\n\n如今我该选择哪一位神佛好呢？"
 RICE_select_personal_deity_buddhist_decision_confirm:0 "选择观想神佛"
 select_personal_deity_buddhist_decision_tooltip:0 "你将选择一位观想之神作为修持对象"
 select_personal_meditional_deity_decision_tt:0 "你将获得一个与你选择修持观想之神所相应的#P 正面#![modifier|E]"
 dharma_buddhism.200.t:0 "自所持之尊"
 dharma_buddhism.200.desc:0 "[Glossary( '本尊', 'YIDAM_GLOSS' )]是帮助追随者学法修行的成就根本，我通过选择一位作为修持对象，从而更好的开悟。\n\n我希望集中精力修持[ROOT.Char.GetFaith.GetAdjective]神佛……"
 dharma_buddhism.200.gyalmo:0 "四部如来之一智慧佛母，斯巴嘉母"
 dharma_buddhism.200.shenlha:0 "四部如来之一慈悲佛，辛拉悟噶"
 dharma_buddhism.200.shenrab:0 "辛饶佛陀兼苯教开创者，顿巴辛饶"
 dharma_buddhism.200.yeshe:0 "智慧怒母兼大圆满护法神，益西瓦姆"
 dharma_buddhism.200.takla:0 "炽盛虎神，达拉麦巴"
 dharma_buddhism.200.zhambala:0 "黄财神，占巴拉"
 dharma_buddhism.200.chamma:0 "慈悲与智慧之母，希绕强玛"
 dharma_buddhism.200.palden:0 "吉祥天母，班达拉姆"
 dharma_buddhism.200.tara:0 "圣救度佛母，多罗菩萨"
 dharma_buddhism.200.avalokitesvara:0 "一切诸佛菩萨之慈悲，观世音菩萨"
 dharma_buddhism.200.yamantaka:0 "胜伏阎魔，阎魔德迦"
 dharma_buddhism.200.hevajra:0 "密宗无上瑜伽部主尊，喜金刚"
 dharma_buddhism.200.vajrayogini:0 "空行之首，金刚亥母"
 dharma_buddhism.200.optout:0 "我还没有想好。"
 dharma_buddhism.201.t:0 "自所持之[Glossary( '纳', 'NAT_GLOSS' )]"
 dharma_buddhism.201.desc:0 "[Glossary( '纳', 'NAT_GLOSS' )]是帮助追随者开悟的缅甸神祇，我通过选择一位作为修持对象，从而更好的开悟。\n\n我希望集中精力修持[ROOT.Char.GetFaith.GetAdjective][Glossary( '纳', 'NAT_GLOSS' )]……"
 dharma_buddhism.201.thagyamin:0 "天王，达雅明"
 dharma_buddhism.201.mahagiri:0 "大山之主，玛哈吉里"
 dharma_buddhism.201.hnamadawgyi:0 "太公国王女，纳玛道吉"
 dharma_buddhism.201.ponmagyi:0 "蓬马吉，水稻与生育纳"
 dharma_buddhism.201.sivalia:0 "保护旅人与家园罗汉，尸婆罗"
 dharma_buddhism.201.nabay:0 "美丽之纳，瑞娜拜"
 dharma_buddhism.201.thurathadi:0 "雄辩之纳，图拉塔迪"
 dharma_buddhism.201.panhtwar:0 "守邦之纳，班图瓦"
 dharma_buddhism.201.lokanat:0 "一切诸佛慈悲菩萨，路迦"
 dharma_buddhism.201.shin:0 "护佑人们远离危险的罗汉，善优波毱多"
 dharma_buddhism.201.manimekhala:0 "海洋守护女神，玛尼媚卡拉"
 dharma_buddhism.201.optout:0 "我还没有想好。"
 dharma_buddhism.202.t:0 "自所观想之神"
 dharma_buddhism.202.desc:0 "观想神佛是帮助追随者学法修行的成就根本，我通过选择一位作为修持对象，从而更好的开悟。\n\n我希望集中精力修持[ROOT.Char.GetFaith.GetAdjective]神佛……"
 dharma_buddhism.202.guanyin:0 "一切诸佛菩萨之慈悲，观世音菩萨"
 dharma_buddhism.202.mahasthamaprapta:0 "智慧威德之觉者，大势至菩萨"
 dharma_buddhism.202.ksitigarbha:0 "普渡教化六道众生，地藏菩萨"
 dharma_buddhism.202.bhaisajyaguru:0 "疗愈苦痛的药师佛，药师琉璃光如来"
 dharma_buddhism.202.vasudhara:0 "财富、繁荣与丰饶的化身，持世菩萨"
 dharma_buddhism.202.vajrapani:0 "侍卫佛陀接引众生，金刚手菩萨"
 dharma_buddhism.202.manjushri:0 "诸佛智慧的化现，文殊菩萨"
 dharma_buddhism.202.samantabhadra:0 "六度化身，普贤菩萨"
 dharma_buddhism.202.tara:0 "悲悯与践行的化身，度母菩萨"
 dharma_buddhism.202.avalokitesvara:0 "一切诸佛菩萨之慈悲，观世音菩萨"
 dharma_buddhism.202.Ratnasambhava:0 "五方佛之一，破除嫉妒与悭贪之如来，宝生佛"
 dharma_buddhism.202.vajrasattva:0 "释迦牟尼佛的守护与引导者，金刚手菩萨"
 buddhist_deity_sipe_gyalmo:0 "供养斯巴嘉母"
 buddhist_deity_sipe_gyalmo_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是世间胜母——斯巴嘉母。"
 buddhist_deity_shenlha_okar:0 "供养辛拉悟噶"
 buddhist_deity_shenlha_okar_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是四部如来之一慈悲佛，辛拉悟噶"
 buddhist_deity_tonpa_shenrab:0 "供养敦巴辛饶"
 buddhist_deity_tonpa_shenrab_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是辛饶佛陀兼苯教开创者，顿巴辛饶"
 buddhist_deity_yeshe_walmo:0 "供养益西旺母"
 buddhist_deity_yeshe_walmo_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是智慧怒母兼大圆满护法神，益西瓦姆"
 buddhist_deity_takla_mebar:0 "供养达拉麦巴"
 buddhist_deity_takla_mebar_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是炽盛虎神，达拉麦巴"
 buddhist_deity_Zhambala:0 "供养布禄金刚"
 buddhist_deity_Zhambala_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是布禄金刚黄财神，占巴拉"
 buddhist_deity_sherab_chamma:0 "供养希绕强玛"
 buddhist_deity_sherab_chamma_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是慈悲与智慧之母，希绕强玛"
 buddhist_deity_palden_lhamo:0 "供养吉祥天母"
 buddhist_deity_palden_lhamo_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是吉祥天母，班达拉姆"
 buddhist_deity_tara:0 "供养度母"
 buddhist_deity_tara_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是圣救度佛母，多罗菩萨"
 buddhist_deity_avalokitesvara:0 "供养观世音菩萨"
 buddhist_deity_avalokitesvara_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是一切诸佛菩萨之慈悲，观世音菩萨"
 buddhist_deity_yamantaka:0 "供养大威德金刚"
 buddhist_deity_yamantaka_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是胜伏阎魔，阎魔德迦"
 buddhist_deity_hevajra:0 "供养喜金刚"
 buddhist_deity_hevajra_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是密宗无上瑜伽部主尊，喜金刚"
 buddhist_deity_vajrayogini:0 "供养金刚亥母"
 buddhist_deity_vajrayogini_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是空行之首，金刚亥母"
 nat_ari_thagyamin:0 "供养天王，达雅明"
 nat_ari_thagyamin_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是天王，达雅明。"
 nat_ari_mahagiri:0 "供养玛哈吉里"
 nat_ari_mahagiri_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是大山之主，玛哈吉里。"
 nat_ari_hnamadawgyi:0 "供养纳玛道吉"
 nat_ari_hnamadawgyi_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是太公国王女，纳玛道吉。"
 nat_ari_ponmagyi:0 "供养纳蓬马吉"
 nat_ari_ponmagyi_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是水稻与生育纳，蓬马吉。"
 nat_ari_sivali:0 "供养尸婆梨"
 nat_ari_sivali_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是保护旅人与家园罗汉，尸婆罗。"
 nat_ari_shwe_nabay:0 "供养瑞娜拜"
 nat_ari_shwe_nabay_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是美丽之纳，瑞娜拜。"
 nat_therevada_thurathadi:0 "供养图拉塔迪"
 nat_therevada_thurathadi_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是雄辩之纳，图拉塔迪。"
 nat_therevada_lokanat:0 "供养班图瓦"
 nat_therevada_lokanat_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是守邦之纳，班图瓦。"
 nat_therevada_panhtwar:0 "供养路迦"
 nat_therevada_panhtwar_desc:0 "该角色的[Glossary( '本尊', 'YIDAM_GLOSS' )]是一切诸佛慈悲菩萨，路迦。"
 nat_therevada_shin_upagutta:0 "供养善优波毱多"
 nat_therevada_shin_upagutta_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是护佑人们远离危险的罗汉，善优波毱多。"
 nat_therevada_manimekhala:0 "供养玛尼媚卡拉"
 nat_therevada_manimekhala_desc:0 "该角色所持之[Glossary( '纳', 'NAT_GLOSS' )]是海洋守护女神，玛尼媚卡拉。"
 buddhist_deity_guanyin:0 "供养观世音菩萨"
 buddhist_deity_guanyin_desc:0 "该角色观想一切诸佛菩萨之慈悲，观世音菩萨。"
 buddhist_deity_mahasthamaprapta:0 "供养大势至菩萨"
 buddhist_deity_mahasthamaprapta_desc:0 "该角色观想智慧威德之觉者，大势至菩萨。"
 buddhist_deity_ksitigarbha:0 "供养地藏菩萨"
 buddhist_deity_ksitigarbha_desc:0 "该角色观想普渡教化六道众生，地藏菩萨。"
 buddhist_deity_vasudhara:0 "供养持世菩萨"
 buddhist_deity_vasudhara_desc:0 "该角色观想财富、繁荣与丰饶的化身，持世菩萨。"
 buddhist_deity_bhaisajyaguru:0 "供养药师佛"
 buddhist_deity_bhaisajyaguru_desc:0 "该角色观想疗愈苦痛的药师佛"
 buddhist_deity_manjushri:0 "供养文殊菩萨"
 buddhist_deity_manjushri_desc:0 "该角色观想诸佛智慧的化现，文殊菩萨。"
 buddhist_deity_vajrapani:0 "供养金刚手菩萨"
 buddhist_deity_vajrapani_desc:0 "该角色观想侍卫佛陀接引众生，金刚手菩萨"
 buddhist_deity_samantabhadra:0 "供养普贤菩萨"
 buddhist_deity_samantabhadra_desc:0 "该角色观想六度化身，普贤菩萨。"
 buddhist_deity_ratnasambhava:0 "供养宝生佛"
 buddhist_deity_ratnasambhava_desc:0 "该角色是宝生佛的供养者，这位佛陀是为佛教五方佛中之南方如来。"
