 innovation_RICE_songlines:0 "歌之路"
 innovation_RICE_songlines_desc:0 "歌之路是澳大利亚原住民传统知识中不可或缺的一部分，通过组歌、故事、舞蹈、艺术和宗教仪式等形式展现，犹如一部口耳相传的实用知识百科全书。它们往往描绘了祖先神灵创造大地、动植物及人类的旅程，而歌之版图的不同段落甚至可能使用不同的语言，将各异的族群联结在一起。"
 innovation_RICE_fire_stick_farming:0 "烧荒农业"
 innovation_RICE_fire_stick_farming_desc:0 "将火仅仅视为一种破坏力量是狭隘的。通过巧妙地运用受控焚烧，澳大利亚原住民能够促进狩猎活动、减少安全隐患，甚至改变一个地区生态系统中的动植物构成。"
