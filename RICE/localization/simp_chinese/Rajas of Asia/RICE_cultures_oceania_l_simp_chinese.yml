 name_list_yap:0 "雅浦"
 innovation_RICE_sasi:0 "萨西仪式"
 innovation_RICE_sasi_desc:0 "萨西仪式是指在特定时期内对某个区域或某种资源实行封闭管理，以防止过度开发，保护环境。"
 innovation_RICE_pacific_navigation:0 "太平洋航行"
 innovation_RICE_pacific_navigation_desc:0 "在太平洋上进行远距离航行困难重重，但并非不可能。在这片广阔海洋上航行，不仅需要勇气、意志力和运气，还需要丰富的星辰、海浪、风与天气模式知识，以及对鸟类和鱼类等动物的观察。"
 innovation_RICE_sweet_potato_cultivation:0 "甘薯种植"
 innovation_RICE_sweet_potato_cultivation_desc:0 "这种富含淀粉的甜味根茎类蔬菜是良好的营养来源和高效的主食作物，遍布南美洲和大洋洲。"
 culture_parameter_rice_rename_meeting_houses:0 "无论[heritage|E]如何，均可执行#V $RICE_oceania_meeting_houses_decision$#![decision|E]，且该决议更名为#V $RICE_oceania_meeting_houses_decision_palauan$#!"
 culture_parameter_rice_better_meeting_houses:0 "使用#V $RICE_oceania_meeting_houses_decision_palauan$#![decision|E]可获得更好的结果，且无需额外支付[gold_i|E][gold|E]，同时为男女[Glossary( '结社', 'CHELDEBECHEL_GLOSS' )]提供不同的选项。"
 culture_parameter_unlock_rice_biak_mechanics:0 "#V 与比亚克冒险者建立联系#![decision|E]提供更好的加成，且可在任意地点执行。"
 culture_parameter_rice_kava_bonus_culture:0 "[GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )][trait|E]提供额外的加成"
 culture_parameter_unlock_rice_kava_decision:0 "解锁#V 饮用卡瓦醉椒汁#![decision|E]，且不受[heritage|E]或[religion|E]限制"
 culture_parameter_rice_kava_decision_bonuses:0 "#V 饮用卡瓦醉椒汁#![decision|E]会提供更好的加成"
 culture_parameter_unlock_rice_pacific_navigation:0 "解锁$innovation_RICE_pacific_navigation$[innovation|E]"
 culture_parameter_unlock_rice_yap_stone_money_mechanic:0 "解锁#V $RICE_oceania_quarry_stone_money$#![decision|E]和[GetTrait('RICE_stone_money').GetName( GetNullCharacter )][trait|E]"
 tradition_RICE_kava_culture_name:0 "卡瓦醉椒汁仪式"
 tradition_RICE_kava_culture_desc:0 "#F 在该文化中，卡瓦醉椒汁扮演着重要角色，被视为表达善意与社交性的一种方式。人们经常在宗教仪式、社交聚会、政治议题辩论乃至用餐时饮用它。#!"
 tradition_RICE_oceanic_voyagers_name:0 "太平洋航海者"
 tradition_RICE_oceanic_voyagers_desc:0 "#F 该文化拥有探索陌生新世界、寻找新生命和新岛屿的传统，更曾无畏地跨越浩瀚汪洋，前往从未有人涉足之地也是最后边疆。#!"
 tradition_RICE_palau_clubs_name:0 "社会结社"
 tradition_RICE_palau_clubs_desc:0 "该文化中的民众按性别、年龄及社会等级被编入[Glossary( '结社', 'CHELDEBECHEL_GLOSS' )]中。这些结社遵循[Glossary( '二分', 'BITANG_ME_A_BITANG_GLOSS' )]原则，负责统筹各项重要事务与活动，向成员传授实用技能、口述传统及其在社会中的角色定位，并规范社区内部的人际关系。他们经常#italic 拜（帕劳语：Bai，一个多用途会议厅）#!举行聚会。"
 tradition_RICE_biak_adventurers_name:0 "巴布亚冒险者"
 tradition_RICE_biak_adventurers_desc:0 "该文化中许多人不惜冒险远航，寻求食物、贸易、奴隶、资源、盟友、战斗、土地以及来自远方的文化和技术理念。在这些冒险中成功的海上豪杰，将赢得巨大的威望与荣誉。"
 tradition_RICE_biak_songs_name:0 "无歌舞，毋宁死"
 tradition_RICE_biak_songs_desc:0 "歌舞在这一民族的风俗与世界观中占据着举足轻重的地位，民间甚至有谚语道：“不会唱歌也不会跳舞，就不算活着。”，于他们而言，正是生而为人的意义。"
 tradition_RICE_yap_stone_money_name:0 "石币"
 tradition_RICE_yap_stone_money_desc:0 "该文化中许多人不惜冒险远航获得中间有孔的圆盘[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]，这些石币扮演着重要的货币角色。哪怕旅程充满了危险和死亡，但航行穿越大海去获取这些但航行穿越大海去获取这些石头的行为仍然备受推崇。"
 culture_parameter_unlock_rice_biak_mambri:0 "可以招募[GetMaA('RICE_mambri').GetName][men_at_arms|E]"
 culture_parameter_unlock_rice_kwaraae_ramo:0 "可以招募[GetMaA('RICE_kwaraae_ramo').GetName][men_at_arms|E]"
 tradition_RICE_living_for_ghosts_name:0 "此生侍鬼"
 tradition_RICE_living_for_ghosts_desc:0 "该文化认为鬼神是强大的存在，生者若想与鬼神建立互动，就必须恪守道德。通过虔诚的祈祷与善行，人们甚至可以祈请鬼魂助其万事——从日常琐事，到[Glossary( '请鬼附身', 'KWARAAE_WARRIOR_GHOSTS_GLOSS' )]，诛灭仇敌。"
