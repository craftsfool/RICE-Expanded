 australian_religion_desc:0 "澳大利亚原住民的宗教信仰和实践具有极大的多样性，但仍有一些共同的元素，例如常被称为“彩虹蛇”的造物神，以及“梦创时代”或“永恒时刻”的概念。"
 yolngu_pagan:0 "旺嘉尔教"
