 yolngu_pagan_desc:0 "在梦创时代（或称旺嘉尔）中，金星（或称巴农比尔）引导了第一批人类——詹加乌尔姐妹——来到雍古族人的祖地。此后，巴农比尔腾空飞翔，唱响一条歌之版图，以歌声命名并创造了其他动物、植物及地理特征。她的歌之版图也成为神圣律法的基础。"
