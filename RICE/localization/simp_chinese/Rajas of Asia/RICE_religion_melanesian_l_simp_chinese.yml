 manus_pagan_desc:0 "在马努斯岛上人群中，宗教崇拜主要围绕对已故父系祖先的祭拜，尤以对父亲的尊崇为甚，其尊称为#italic 祖先神灵#!，人们会将父亲（或祖先）的头骨保存在家中安全的地方，以祈求建议、好运，以及免受伤害和疾病的侵扰。"
