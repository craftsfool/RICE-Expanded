 tolai_pagan_desc:0 "杜克-杜克秘密社团举行精神舞蹈，他们穿戴与男主神#italic 杜克杜克#!和女主神#italic 图布安#!相关的服装和面具，以执行正义和管理社区。一个人的人生目标就是积累尽可能多的财富，那些能在去世时大量分配财富的人将拥有美好的来世，而那些无法给继承人留下任何东西的人则注定永远在痛苦中游荡。"
