 vanuatu_pagan_desc:0 "与许多大洋洲社会一样，瓦努阿图的原住民遵循禁忌（神圣的律法与戒规），并相信玛纳（弥漫于宇宙的超自然生命力）。其信仰的核心是对祖先的崇拜，这些祖先被称为#italic 塔玛特#!。"
