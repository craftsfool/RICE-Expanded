 biak_pagan_desc:0 "很久以前，救主马纳马克里与其子——母诞生的和平之王科诺·马纳尔贝乌从比亚克人的岛屿离去，为民众留下神圣律法以避免灾祸，并等待世代之后祂归来开启乐土黄金时代。此信仰的追随者亦相信#italic 祖灵#!的力量，他们会通过#italic 沃尔#!仪式协助信徒完成壮举，如远航至异域以获取名望、荣耀与财富。"
