 tehit_pagan_desc:0 "巫恩，既是一个行善的秘密教派名称，也指他们带给人类的有益知识。该教派由一批精挑细选、受过秘传启蒙的男性组成，彼此交换仪式圣物，代代传承着关于世界起源、如何与苍穹之灵沟通，以及如何对抗其邪恶对立面——莱特的秘法。与沃恩的知识截然相反，莱特的知识是邪恶的：它要求以活人献祭与杀戮，其修习者往往是蒙昧无知的女性。必须不惜一切代价，避免被莱特所玷污。"
