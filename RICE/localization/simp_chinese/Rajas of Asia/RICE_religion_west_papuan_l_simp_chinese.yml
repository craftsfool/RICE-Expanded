 abui_pagan_desc:0 "众多的神祇与祖灵大多侍奉两位主神：拉莫灵与拉哈塔拉。拉莫灵居于众神之首，是创造万物的原初之神，常化身为动物或人的形象以介入物质世界，但有时也会扮演捣蛋鬼的角色。拉哈塔拉则是一位较新的神，居于天界，极少显现实体；他通过进入人体、附身其上的方式与人沟通。"
