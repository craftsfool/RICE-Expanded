 aslian_religion_desc:0 "马来西亚的亚斯里部落的世界观中，世界充斥大量黑暗而危险的灵魂。在这样一个危险的世界之中，嘲笑或对任何事物使用武力，甚至即使渺小如昆虫，都有可能招致不幸和伤害。"
