 semang_pagan_desc:0 "为数众多的可怖神灵遍布世间，但最强大的是雷神卡雷，残忍而可怖。卡雷将会惩处那些触犯禁忌或不道之行之人，为他们送上死亡，伤害，疾病，甚至雷暴和洪水。"
