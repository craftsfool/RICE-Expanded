 senoi_pagan_adherent:0 "涅囊教徒"
 senoi_pagan_adherent_plural:0 "涅囊信徒"
 senoi_pagan_desc:0 "无尽的原始力量——伊囊——创造了世界，以及其中所有的人类和神灵。我们必须避免冒犯或伤害任何人或任何事物，尤其是这个世界的诸灵，以免遭受愚钝却破坏力高强的雷神恩库报复，而他只能以血祭安抚。然而，友好的灵魂却能够被转变为有益的灵魂伙伴，即[Glossary( '古尼格', 'GUNIG_GLOSS' )]。"
