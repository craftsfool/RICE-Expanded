 nias_animism_adherent:0 "祖像教徒"
 nias_animism_adherent_plural:0 "祖像教徒"
 nias_animism_desc:0 "法讷姆巴·阿杜（Fanömba Adu）是尼亚斯岛居民的传统宗教习俗。它字面意思是崇拜“阿杜”（Adu），即代表祖先灵魂的木制人偶。他们相信，人死后，“气息”（noso）会回到祖先之地——灵界泰泰霍利·阿纳（Teteholi Ana'a），而“影子”则会留在人间，化作“贝库”（Bekhu），也就是灵魂。猎头在他们的社会中扮演着重要的角色，祭祀用的头颅用于许多仪式，而且建造新建筑前也必须有头颅作为祭品。男孩只有在猎到第一个头颅后才能被视为成年男子。"
