 yaambism_adherent_plural:0 "雅姆布教信徒"
 yaambism_desc:0 "塞皮克地区的人们相信生命有两条道路——或者说两条“雅姆布”（Ya'amb）。一条道路通往人间，另一条道路通往神灵。塞皮克人相信，诸神灵来自肉眼无法看到的神秘村落，居住在通往灵界的道路上。"
 bis:0 "比瑟教"
 bis_adj:0 "比瑟教"
 bis_adherent:0 "比瑟教信徒"
 bis_adherent_plural:0 "比瑟教信徒"
 bis_desc:0 "在阿斯马特人看来，精神世界与物质世界密不可分，甚至在日常生活中也如此——因为人们可以通过世俗的方式来安抚或驱散神灵。阿斯马特人相信神灵无处不在，并非局限于村庄的狭小空间，而是延伸至山川河流和海洋。这种信仰体系在阿斯马特部落的习俗中孕育出一种宏大的互惠与更新的主题。"
