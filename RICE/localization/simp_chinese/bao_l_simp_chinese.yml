 building_type_bao_free_range_01:0 "自由放牧的牧场"
 building_type_bao_free_range_01_desc:0 "$building_bao_free_range_01_desc$"
 building_bao_free_range_01:0 "野生牧场"
 building_bao_free_range_02:0 "半野牧场"
 building_bao_free_range_03:0 "集中式半野生牧场"
 building_bao_free_range_01_desc:0 "饲养布雷顿马的野生牧场。这些马自古就是在布列塔尼的部分地区如#italic 阿雷山脈#!或洛汗森林中饲养的，因其结实和坚韧而非常有名。"
 building_bao_free_range_02_desc:0 "这是一个半野生的牧场，布雷顿马在这里被露天饲养。然而，鉴于这些著名马匹的需求的不断增加，当地也建立了一些设施来帮助它们繁殖和训练。"
 building_bao_free_range_03_desc:0 "这是一个被当地贵族家庭集中起来广泛开发的半野生的牧场，以便从利润丰厚的布雷顿马贸易中获利。"
 bao_free_range_requirement_desc:0 "需要$bao_tradition_free_range_name$[tradition|E]"
 bao_gift_breton_horses:0 "赠送一匹布列塔尼马"
 bao_gift_breton_horses_desc:0 "赠送布列塔尼马作为礼物"
 bao_gift_breton_horses_self: "买一匹布列塔尼马"
 marc_hegion:0 "布列塔尼骑兵"
 marc_hegion_flavor:0 "布列塔尼骑兵是法兰克骑士的变种，这些战士都是能征善战的熟练的骑手。"
 culture_parameter_unlock_maa_marc_hegion:0 "可以招募[GetMaA('marc_hegion').GetName][men_at_arms|E]"
 bao_sonerien_du_punished:0 "黑衣吟游诗人的惩罚"
 bao_sonerien_du_saved:0 "拯救黑衣吟游诗人"
 bao_reaved:0 "被维京人洗劫一空"
 bao_secured:0 "突袭后派出民兵"
 bao_sonerien_du_befriended:0 "结识了黑衣吟游诗人"
 bao_tossed_a_coin:0 "将一枚钱币扔进井里"
 bao_healthy_mushrooms:0 "吃了看起来很好的蘑菇"
 bao_run:0 "逃离矮人之域的人"
 bao_stay:0 "愿意与矮人进行狂欢"
 bao_vex:0 "不会冒犯矮人"
 bao_character_breton_horses:0 "骑着强健的布列塔尼马"
 bao_opinion_gifted_breton_horse:0 "赠予我一匹布列塔尼马"
 bao_tradition_breizh_laid_name: "不列颠之事"
 bao_tradition_breizh_laid_desc: "诗歌、讲故事、侮辱和幽默在布立吞社会中非常受重视。受到凯尔特吟游诗人传统与法兰西文学影响的《不列颠之事》是《亚瑟王传说》和其中世纪的重新诠释之间的缺失环节。"
 bao_tradition_breizh_collective_lands_name: "凯威兹"
 bao_tradition_breizh_collective_lands_desc: "凯威兹（或现代法语中的quévaise）是布列塔尼某些教会领地的继承实践，其建立是为了促进清理，从而促进农业发展和定居，旨在保护农民（尽管是有限度的）。这一制度的实施是为了帮助布列塔尼在中世纪的和平时期进行土地管理。"
 bao_tradition_free_range_name: "布列塔尼自由牧场"
 bao_tradition_free_range_desc: "布列塔尼的马在中世纪时期非常有名。它们在Peurajoù Libr或自由牧场（即半野生或完全野生的牧场）饲养，并受到整个西欧贵族的珍视，例如著名的伯特兰·杜·盖斯克林带着他的战马一直游击。到15世纪末，所有牧场都被一个家族所垄断。"
 culture_parameter_bao_free_ranges: "统治者可以建造#high $building_type_bao_free_range_01$#![building|E]在[GetGeographicalRegion('RICE_brittany_horse_region').GetName]"
 culture_parameter_bao_horse_gift: "解锁$bao_gift_breton_horses$[interaction|E]"
 bao.0001.t:0 "黑衣吟游诗人"
 bao.0001.desc:0 "我的士兵带来了两名身着黑衣的青年，他们是在我府外被捕的。\n\n“[ROOT.Char.GetLadyLord]，这些低贱之辈是在一条干涸的沟里睡觉时被我们发现的，”一名士兵回答我问他们是谁的问题时说道，“他们自称是教堂的乐师，但他们举止可疑，显然是个借口。”\n\n另一名士兵插话说：“我同意他们有些可疑，但我们不应该轻易下结论。\n\n第一名士兵不理会他的话，继续说：“他们就是强盗，信不信由你，所以我建议迅速惩罚他们，让他们知道侵犯你的领地的代价。”"
 bao.0001.a:0 "抓住他们，财产充公！"
 bao.0001.b:0 "把这两人送回他们的家。"
 bao.0001.c:0 "他们看起来是好小伙子，让我招募他们!"
 bao.0001.info:0 "#emphasis 历史背景：#!在20世纪中叶之前，服装是区分陌生人社会地位的最有效的方式，而在布列塔尼，没有刺绣的黑色服装是穷苦人的标志。黑衣打钟人是靠食物和饮料为酬劳的流浪歌手和音乐家，他们四处奔波，从一座教堂到另一座教堂，从一场弥撒到另一场弥撒，从一场婚礼到另一场婚礼，以此谋生。他们有着“不规矩”或者“不安分”的名声，据当地的迷信说，只有当音乐家喝得烂醉如泥，无法演奏的时候，一场布列塔尼的婚礼才能结束。他们经常被宪兵和布列塔尼社会的上层阶级视为捣蛋鬼。\n\n真实的黑衣打钟人传说是这次事件的依据，这个传说发生在布罗·维古登（肯佩尔男爵领地），那里有两个穿着黑色外套的音乐家在1790年左右在庞特拉巴德（法语中称庞特拉贝）被不公正地惩罚，因为他们在路边醉得不省人事，或者是被误认为是路边强盗，或者是因为当地贵族的腐败。他们的尸体被钉在尖刺上，展示给所有人看。因为这件事与（未经证实的）瘟疫爆发同时发生，人们把他们当作殉道者，会去触摸他们的尸体，相信这样可以获得瘟疫的免疫力。"
 bao.0002.t:0 "圣人之井"
 bao.0002.desc:0 "在我的两个城堡之间穿梭时，我偶然发现了一口供奉着当地一位圣人的新井。附近的村民说，我可以在井里扔一枚钱币，以求得好运气！"
 bao.0002.a:0 "把一枚钱币扔进井里！"
 bao.0002.b:0 "还是算了吧……"
 bao.0002.info:0 "#emphasis 历史背景：#!在布列塔尼，井水往往是供奉给当地的或者真正的圣人。当然，首先被选中的是有治愈和神迹能力的圣人，人们相信井水可以帮助他们获得健康。"
 bao.0050.t:0 "矮人盗窃！"
 bao.0050.desc:0 "我的库房里有一些金币不见了。我的仆人说，这又是调皮的矮人干的！也许我应该善待他们……"
 bao.0050.a:0 "唉，该死！"
 bao.0050.info:0 "#emphasis 历史背景：#!Korrigan是布列塔尼当地调皮的小矮人，与妖精非常相似。他们有很多名字，如Poulpiqué、Bouffon Noz和Kereore；据说他们还有很多种类，如Kerion、Ozegan、Korrig和Pixies。人们常说，如果他们受到不公正的对待，他们会偷走人们的珍贵杂物，比如手表，袜子，勺子或者盘子，所以人们应该时刻小心他们，对他们表示尊重。"
 bao.0051.t:0 "仙环蘑菇"
 bao.0051.desc:0 "我在住所附近徘徊时发现了一个“仙环”，里面有漂亮的、纯净的鸡油菌。矮人肯定会奖励我的勤奋! 我应该如何处理这些蘑菇？"
 bao.0051.a:0 "晒干后卖掉"
 bao.0051.b:0 "请我的厨师们举办特别的感谢餐会"
 bao.0051.info:0 "$bao.0050.info$"
 bao.0052.t:0 "邂逅矮人？"
 bao.0052.desc:0 "晚上吃饭时，我的监护人[ward.GetFirstName]问我一个相当棘手的问题。如果我遇到矮人，我应该怎么做？"
 bao.0052.a:0 "润！"
 bao.0052.b:0 "与他们一起跳舞和唱歌！"
 bao.0052.c:0 "绝不要跟着他们走！"
 bao.0052.d:0 "不要惹怒他们！"
 bao.0052.e:0 "在他们身边要慷慨。"
 bao.0052.a.info:0 "矮人可能很小，但他们很有魔力，而且可能很冷酷无情！我应该永远小心。正如他们所说，应该把麦子或钱币扔给他们，他们会一直数到天亮。"
 bao.0052.b.info:0 "矮人并不冷酷无情，只是调皮捣蛋！如果我和他们一起玩，他们就会奖励我！"
 bao.0052.c.info:0 "矮人可能太调皮了。他们说如果你是一个年轻的父亲，你不应该跟随他们，否则你可能再也见不到你的孩子了，如果你是一个女人，你永远不应该接受他们的栗子。"
 bao.0052.d.info:0 "据说矮人很容易被冒犯。他们不喜欢讽刺，甚至会惩罚任何轻微惹恼他们的人，所以在他们身边应该始终以诚实的态度行事。"
 bao.0052.e.info:0 "矮人慷慨大方。他们会帮助需要帮助的人，给予需要给予的人。"
 bao.0200.t:0 "布列塔尼马"
 bao.0200.desc:0 "[brittany_duchy.GetName]是著名布列塔尼马的故乡，它们在自由或半野生牧场中饲养。这给公国带来了财富和名声，对于我需要劝说的人，如[recipient.GetTitledFirstName]，赠送一些布列塔尼马肯定是一笔不可思议的财富。"
 bao.0200.a:0 "我希望[recipient.GetFirstName]能驾驭地迅速骑行！"
 bao.0201.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 bao.0201.desc:0 "作为[brittany_duchy.GetName]的统治者，西欧最好马匹的故乡，我在此信中随后赠送一匹华丽的马匹供你私人使用，以示友好。"
 bao.0201.a:0 "一匹不可思议的种马！"
 bao_gift_breton_horses_self_desc: "为自己买一匹布列塔尼马"
