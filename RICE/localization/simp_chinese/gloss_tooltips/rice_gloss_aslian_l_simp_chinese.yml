l_simp_chinese:
 SEA_NOMADS_GLOSS:0 "#bold 海上游牧民族#!是指代东南亚部分海域的各种族群的术语。他们在传统上不同程度地以船为家，随船漂泊，生计高度依赖于海洋。这些族群包括马来西亚和苏门答腊的奥朗劳特人、泰国和马来西亚边境的莫肯人以及印度尼西亚东部和菲律宾南部的萨马‑巴瑶人。并非所有这些族群都是完全游牧或以海为生的；有些只是居住在海边，高度依赖海洋。尽管如此，历史上，这些族群与该地区的各个王国关系密切；他们的技能备受青睐，因此常担任雇佣兵、海盗、商人和旅行向导。"
 GUNIG_GLOSS:0 "在塞诺伊人（#italic 亚斯里语系#!的一支）的传统信仰中，#bold 古尼格#!是帮助人们的魂灵。通常，他们会找到一个#italic 哈拉(halaaq，一种类似于萨满的祭祀者)#!，他们在梦中建立联结。通过这种通常被视为相当亲密的关系，#italic 古尼格#!可以被召唤来保护或治愈人们、提供建议并协助日常生活。"
 BAH_MALAYSIA_GLOSS:0 "在马来西亚的阿斯利语使用者中，#bold 巴#!通常是针对男性，尤其是年轻男子的称呼。至少在现今，它可能略带贬义色彩，因为年轻人常被视为不负责任且缺乏自制力。"
 ORANG_ASLI_GLOSS:0 "#bold 奥朗阿斯利#!（原住民）是马来西亚半岛18个土著族群的现代标签。这18个族群通常进一步分为三个亚群：\n\n$BULLET_WITH_TAB$#bold 塞诺伊人：#!主要以刀耕火种农业为生，是三个亚群中人口最多的\n$BULLET_WITH_TAB$#bold 塞芒人：#!游牧民族，属于“尼格利陀人”（该术语用于指代东南亚多个表面上类似非洲人外貌的族群）\n$BULLET_WITH_TAB$#bold 原始马来人：#!定居农民，被认为与马来人主体相似，可能是更早一波南岛语系移民的后裔\n\n尽管这些分类以及奥朗阿斯利的整体概念本身模糊不清且存在争议，但这些群体确实共享一些特征，例如著名的和平主义世界观。"
 AUSTROASIATIC_GLOSS:0 "#bold 南亚语系#!是世界上最主要的语系之一。该语系语言广泛分布于东南亚大陆的大部分地区，以及部分中国和南亚地区；历史上，在后来一波波南岛语系和侗台语系使用者到来之前，南亚语系可能在该地区更为强势。使用人数最多的南亚语系语言是越南语，其母语者数量远超所有其他南亚语系语言的总和——截至2023年已超过8600万人。其他拥有丰富文字传统和历史记录的主要南亚语系语言还包括高棉语（1900万母语者）和孟语（110万母语者）。其余南亚语系语言则由该地区的各少数民族群体使用。"
 GARUDA_GLOSS:0 "#bold 迦楼罗#!是一种神话生物，常被描绘为鹰头人身的形象，见于印度教、佛教和耆那教神话，以及受这些宗教影响的文化的神话体系中。"
 SLAMAD_GLOSS:0 "#bold 撒麻打#!，是马来西亚半岛一些原住民塞诺人的核心价值观。该术语大致可译为和平、满足与公共安全，以及不挫败或阻挠他人或生物（如神灵）意愿的方式行事。"
 ADE_GLOSS:0 "#bold “阿德”#!是一个统称，指代一套不成文的法则，规范着东南亚各民族生活的方方面面。不同文化对此传统生活方式各有称谓。其内容既包括极为细致的礼俗，例如倒酒时应面向何方、依年龄与性别而定的行止坐立次序，以及允许留何种胡须，甚至涵盖更为宏大的价值观念，如尊敬长辈、勇气和诚实。若有人违背这一准则，不仅本人会遭到排斥，与其有牵连之人亦难逃被孤立的命运。尽管“阿德”常与当地传统信仰相联系，但即使在改信亚伯拉罕宗教之后，人们仍将其视为世俗准则来遵守，在这些宗教中，它被看作指引人如何进入天堂的补充指南。"
