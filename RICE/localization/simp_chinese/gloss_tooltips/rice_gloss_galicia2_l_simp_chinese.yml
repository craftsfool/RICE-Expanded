l_simp_chinese:
 COCHINEAL_GLOSS:0 "在现代，#bold 胭脂虫#!通常指原产于美洲的介壳虫，其幼虫被用于提取红色染料，该术语也指代这种红色染料本身。然而在哥伦布大交换之前，波兰胭脂虫和亚美尼亚胭脂虫是两种重要的红色染料来源昆虫，它们分别原产于东欧部分地区与亚美尼亚高地。就波兰胭脂虫而言，当古代斯拉夫人开发出提取其染料的方法后，这种昆虫便成为东欧主要出口商品，直至16世纪被更廉价的美洲胭脂虫所取代。"
 FERN_FLOWER_GLOSS:0 "#bold 蕨花#!是一种在波罗的海和斯拉夫神话中出现的神奇花朵，然而现实中，蕨类植物并不会开花，因此蕨类花并不存在。不过有些开花植物与蕨类植物相似，而且据说这种花在夏至期间会短暂开花，此外它受到花灵守护，因此谁能发现它们谁将获得赐福。"
