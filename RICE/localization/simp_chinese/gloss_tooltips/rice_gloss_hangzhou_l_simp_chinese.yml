l_simp_chinese:
 SHEN_GARDEN_GLOSS: "#bold 沈园#!是浙江东北部绍兴市（古称会稽）最著名的地标之一。这座园林至少可追溯至宋代，因与诗人陆游及唐婉的凄美爱情故事而闻名。在离异八年后，二人在园中不期而遇，互赠诗词，随后唐琬在一年内去世。五十多年后，在陆游生命的最后一年，陆游重访沈园，写下了另一组著名的诗篇，哀伤地反思了爱情和时间的流逝。"
 LU_YOU_SHEN_GARDEN_TWO_POEMS_GLOSS: "#bold 《沈园二首》#!\n\n#italic 城上斜阳画角哀，\n沈园非复旧池台。\n伤心桥下春波绿，\n曾是惊鸿照影来。\n\n梦断香消四十年，\n沈园柳老不吹绵。\n此身行作稽山土，\n犹吊遗踪一泫然。#!"
 LU_YOU_PHOENIX_HAIRPIN_GLOSS: "#bold 《钗头凤·红酥手》#!——陆游\n\n#italic \n红酥手，黄縢酒，满城春色宫墙柳。东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。\n春如旧，人空瘦，泪痕红浥鲛绡透。桃花落，闲池阁。山盟虽在，锦书难托。莫、莫、莫！\n#!"
 TANG_WAN_PHOENIX_HAIRPIN_GLOSS: "#bold 《钗头凤·世情薄》#!——唐婉\n\n#italic \n世情薄，人情恶，雨送黄昏花易落。晓风干，泪痕残。欲笺心事，独语斜阑。难，难，难！\n人成各，今非昨，病魂常似秋千索。角声寒，夜阑珊。怕人寻问，咽泪装欢。瞒，瞒，瞒！\n#!"
 YOU_SHOU_GLOSS: "#bold 游手#!一词在中国历史上常被用来指代某种类型的城市闲散人员。例如在宋代，随着城市化进程加快，城市中出现了越来越多的无业游民和闲逛者。十三世纪的作家周密在其追忆杭州往事的《武林旧事》中记载：“浩穰之区，人物盛夥，游手奸黠，实繁有徒。”中国历代文献记载了官员们处理“游手”问题的不同方式。"
 WO_YOU_GLOSS: "#bold 卧游#!，意为安逸地躺着旅行，是中国历史上一种悠闲的活动，专为那些无法亲临名胜或旅游景点的人们而设，尤其是因疾病或年老等身体原因无法出行的人。例如，描绘[RICE_ten_scenes_of_west_lake|E]的绘画自宋代起便广受欢迎，作为一种向那些无法或未曾亲临西湖的人们展示其美景的方式。"
 GLOSS_DING_SHENG_GAO: "#bold 定胜糕#!是一种由糯米、白糖和甜红豆沙制成的甜点，风味偏粉红色，原产于杭州周边地区。传说在宋朝时期，这些糕点上会印有“定胜”二字，意为胜利，并在战前赠予士兵以祝愿他们好运。"
 WINDING_STREAM_PARTY_GLOSS: "#bold 曲水流觞#!是中国古代一种传统的聚会形式。参与者会坐在蜿蜒的溪流旁，等待他人将盛有米酒的杯子顺流而下，诗人须在酒杯漂到自己面前前即兴赋诗。后来，这一习俗传播到受中国文化影响的其他亚洲地区，如韩国和日本。"
 FOUR_BEAUTIES_GLOSS: "#bold 四大美女#!不仅以美貌闻名，更因其在中国历史上的影响而著称。传统上，公认的四大美女为西施、王昭君、貂蝉和杨玉环，尽管历史上这一名单曾有过其他版本。每位美女都对应着一个成语典故：\n\n西施沉鱼\n貂蝉闭月\n王昭君落雁\n杨玉环羞花\n\n这些成语合并起来便是#italic 沉鱼落雁，闭月羞花#!。"
 DEATH_POEM_GLOSS: "#bold 辞世诗#!是中华文化圈（即中国、日本、朝鲜和越南）的一种诗歌体裁，通常创作于作者临终之前——无论是自然死亡还是非自然死亡（例如行刑前）——用以反思人生与即将到来的死亡。日本僧人松尾芭蕉的绝笔诗便是著名范例，普遍被视为一首告别诗：\n#italic 病卧旅途中，恍然一梦枯野上，就当去过了。#!\n\n尽管多数辞世诗风格庄重，但偶尔也会出现蕴含讽刺或喜剧元素的作品，例如日本僧人东皋心越（1710‑1795）的这首辞世诗，便讽刺了某些辞世诗的矫饰之风：\n\n#italic 辞世之诗皆妄念，\n生死本来无遮掩。#!"
 BUDDHIST_SUTRAS_GLOSS: "#bold 佛经#!是佛陀亲口宣说汇总的典籍。但由于早期佛教以口传方式传承，关于许多佛经的真实性一直存在激烈争论；其中一些佛经被认为是由后世作者编纂而成，因为现存最早的佛教文献只能追溯到公元前1世纪左右。"
