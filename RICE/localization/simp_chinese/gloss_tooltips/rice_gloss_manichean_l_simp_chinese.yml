l_simp_chinese:
 ELECT_GLOSS:0 "#bold 阿罗缓#!是摩尼教会的成员，他们担任神职人员的角色，立下五净戒和十戒，并通过祈祷、仪式和其他宗教活动将一生奉献于解救光明。此外他们不得别立私室厨库，每日斋食，俨然待施；若无施者，乞丐以充，并通过素食达到“明既归于大明，暗亦归于积暗”。\n\n不过摩尼教最初可能并无修道传统，但在中亚和中国等东方地区，摩尼教的选民很可能因佛教影响而采用了修道生活方式。"
 HEARER_GLOSS:0 "#bold 耨沙喭#!是摩尼教会的普通信徒。虽然他们无需像选民那样严守戒律，但仍坚持七印。他们必须遵守各种斋戒日，并每周参与忏悔仪式。此外，信徒被鼓励通过布施和其他捐赠形式以支持阿罗缓，以此宽恕“罪恶”。"
 ZINDIQ_GLOSS:0 "中世纪穆斯林最初使用#bold 精底格#!来指代二元教徒或假装信教者，不过后来被用来泛指异端。"
 DINAVARIYA_GLOSS:0 "#bold 电那勿(dinavariya)#!是一个波斯词，源自中古波斯语“Dēnāvar”（《大唐西域记》中作提那跋），摩尼教徒最初用它来指代“僧侣”和“宣教者”。然而，随着时间的推移，伊朗世界和中亚的摩尼教徒开始用这个词来自我标识，以区别于西方的摩尼教徒。甚至在6或7世纪时，摩尼教会内部发生过一次分裂，河中地区的分裂派别被称为电那勿派，他们质疑巴比伦摩尼教领袖的权威。不过“dinavariya”一词代指异端邪说是不正确的，因为这个词很可能早于分裂时期出现，并且持续使用了多个世纪。"
 MANICHEAN_PARINIRVANA_GLOSS:0 "在摩尼教中，#bold 圆寂#!这一源自佛教的术语具有不同的含义，主要是摩尼教徒倾向于吸收其他宗教的词汇来传播其教义。佛教的圆寂指的是佛陀或其他已证入涅槃者的最终离世，此时他们的肉身存在终结，并从生死轮回中解脱。而摩尼教的圆寂则指的是先知摩尼的死亡与殉道，这也被比作耶稣的受难。"
