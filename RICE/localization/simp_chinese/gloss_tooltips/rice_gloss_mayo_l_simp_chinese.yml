l_simp_chinese:
 SCOTTI_GLOSS:0 "在古典时代晚期和中世纪早期，讲盖尔语的民族，包括现代爱尔兰人的祖先，被称为#bold 斯科提人（Scotia）#!。这一时期，爱尔兰被称为#italic 大斯科提#!，而苏格兰则被称为#italic 小斯科提#!。后来到了中世纪，“斯科提（Scotia）”一词才逐渐与苏格兰（Scotland）关联，而不再泛指盖尔人或爱尔兰人。"
 PERIPHYSEON_GLOSS:0 "#bold 《论自然的区分》#!被誉为“古典哲学的最终成就”，是9世纪最杰出的基督教知识分子之一约翰内斯·司各特·爱留根纳的代表作。该书在基督教框架下融合并发展了多种古代思想流派，以至于后来被一些基督教神学权威谴责为宣扬过度泛神论和新柏拉图主义理念——尽管爱留根纳自认为是正统教义的捍卫者。"
 PANTHEISM_GLOSS:0 "#bold 泛神论#!是一种哲学宗教理论，其将整个现实或宇宙等同于神或至高实体。泛神论包含多种不同形式，彼此对现实与神性的关系有不同的理解和诠释。持有泛神论的观点的人被称为泛神论者，这些人认为世界上每一事物共同构成了统一的整体，而这个整体即是神，一个包罗万物、显化的神。在此观点下，一切天体都被视为神的一部分。"
 LORDS_OF_THE_WOOD_GLOSS:0 "在中世纪早期的爱尔兰，岛上生长的二十八种树木根据其经济与文化价值被依法划分为四组，每组七种。其中#bold 树中之王#!被视为这四组中最重要的七种树木，包括橡树、榛树、冬青、紫杉、白蜡树、欧洲赤松和野生苹果树。"
 NISI_FORTE_GLOSS:0 "#bold Nisi forte#!是一个拉丁语短语，意为“除非，或许”，但中世纪哲学和神学文本中，表达一种假设性或可能性的让步。\n\n这个短语的一个著名用法出自罗马政治家兼律师西塞罗；在为被指控选举贿赂而受审的执政官卢基乌斯·李锡尼·穆雷纳辩护时，西塞罗在他的演讲中说：“Nemo enim fere saltat sobrius, #italic nisi forte#! insanit。”（“没有人清醒时跳舞，除非他可能疯了”）"
 SAINT_PATRICKS_CHAIR_GLOSS:0 "#bold 圣巴特利爵之椅#!，亦称博赫石，是一块位于爱尔兰巴特利爵山与朝圣地附近的大型岩石，表面刻有各种岩画与人造符号。其雕刻年代可能追溯至新石器时代，是散落在这座山脉周边的史前或古代遗迹中尤为引人注目的例证，印证了该地区早在爱尔兰基督教化之前便已具备重要的精神意义。每年有两次，若有人立于圣巴特利爵之椅旁，会目睹夕阳西沉时仿佛沿山脊滚落而下的奇观，这或许正是此石最初被雕刻并安置于现址的原因。"
 SAINT_PATRICKS_BREASTPLATE_GLOSS:0 "#bold 圣巴特利爵的护甲#!是一首爱尔兰祷文，祷文作者通常归功于圣巴特利爵，尽管其首次有记载的出现时间已是他去世数百年之后。祷文中一个著名的部分是反复呼求耶稣基督：\n\n#italic 基督与我同在，基督在我前方，\n基督在我身后，基督在我心中，\n基督在我之下，基督在我之上，\n基督在我右边，基督在我左边。#!"
