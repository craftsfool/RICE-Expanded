l_simp_chinese:
 VIETNAMESE_GLOSS: "#bold 越南人#!是越南本土民族。在CK3时间线中，生活在红河平原一带的现代越南人祖先经常称自己为#bold 京人#!。京人起源于使用越语的民族，这些民族在过去几个世纪中被大量汉化，而使用汉语的越南民族也同化为京人。京族与其他越南民族——例如生活在越南北部高地，汉化程度较低的芒族——之间存在鲜明的对比。"
 DORSET_GLOSS: "#bold 多塞特人#!是一种古爱斯基摩民族，从公元前500年左右开始，一直居住在加拿大北部和格陵兰岛的部分地区，直到公元1000年至1500年之间。他们似乎与图勒民族（现代因纽特人的祖先）没有任何遗传上的联系。在因纽特人的传说中，他们遇到了所谓的#bold 图尼特人#!，这些高大之人害怕与诺斯人打交道，也不敢与北欧人作战，因此图尼特人可能是多塞特人，而多塞特人与格陵兰岛上的北欧定居者之间可能也有过一些接触，不过存在争议。"
 INUIT_GLOSS: "#bold 现代因纽特人#!的祖先被称为#bold 图勒人#!，于公元1000年左右在阿拉斯加出现，并在13世纪向东扩展至加拿大和格陵兰岛，取代了之前的多塞特人，后者可能与因纽特人传说中的巨人族图尼特相对应。图勒人与格陵兰岛的挪威定居者之间有接触的证据有限，且有争议。例如因纽特人有关于挪威人的传说，但这些故事是在19世纪晚些时候才记录下来的，可能也反映了当时因纽特人对欧洲殖民者的态度。"
 LAURENTIAN_GLOSS: "#bold $laurentian_collective_noun$#!人是圣劳伦斯的易洛魁语系一支，他们分布于圣劳伦斯湾到安大略湖内陆之间。欧洲人在1500年代偶尔与之有交集。例如，法国探险家雅克·卡蒂亚拜访过两个圣劳伦斯易洛魁人的村落，分别是#italic 斯塔达科纳#!和#italic 奥什拉加#!，不过他们很快消失且原因尚不确定，也存在争议。由于我们不知道他们如何称呼自己，因此他们在游戏中被称为$laurentian$，因为在$mikmaq$人的传说中，他们有时会与一个被称为$laurentian_collective_noun$的族群发生冲突，而这个族群似乎与圣劳伦斯易洛魁人相对应。"
 INNU_GLOSS: "#bold $innu_collective_noun$#!人分布于今纽芬兰与拉布拉多省和魁北克省，是一支讲阿尔冈昆语的游牧狩猎和捕鱼民族。过去，欧洲人称他们为#bold 山地人#!，但他们自称为$innu$（意为人类）。"
 EAST_CREE_GLOSS: "#bold $east_cree_collective_noun$#!人（#bold 内希纳瓦人#!）是加拿大最东部一支讲阿尔冈昆语的原住民（欧洲殖民者称他们为#bold 克里人#!），他们是北美毛皮贸易中的重要参与者。"
 MIKMAQ_GLOSS: "#bold $mikmaq_collective_noun$#!人是一支讲阿尔冈昆语的原住民部族，主要分布于现代加拿大的大西洋诸省（新斯科舍、新不伦瑞克、爱德华王子岛和纽芬兰）。他们属于#italic 日出联盟#!的一部分，日出联盟由五支阿尔冈昆语民族组成，成立于17世纪，其成员包括$mikmaq$、$maliseet$、$passamaquoddy$、$penobscot$和$abenaki$。"
 MALISEET_GLOSS: "#bold $maliseet_collective_noun$#!人是一支讲阿尔冈昆语的原住民部族，分布于现今的新不伦瑞克省，魁北克省、新不伦瑞克省和缅因州。欧洲人过去称他们为#bold 马力希特人#!（基于$mikmaq$人对$maliseet_collective_noun$人称呼的音译，意为“说话慢的人”），而$maliseet_collective_noun$人更倾向于自称$maliseet$人，意为“光明之河的人”。他们是#italic 日出联盟#!的一部分，这是一个在17世纪形成的五大阿尔冈昆语族的重要联盟，包括$maliseet$、$mikmaq$、$passamaquoddy$、$penobscot$和$abenaki$。"
 PASSAMAQUODDY_GLOSS: "#bold $passamaquoddy_collective_noun$#!人是一支讲阿尔冈昆语的原住民（分布于今新不伦瑞克省、魁北克省和缅因州），欧洲人称他们为#bold 帕萨马科迪人#!，这个词意为“鳕鱼丰富之地的居民”，这反映了鱼类在他们文化中的重要性。他们是#italic 日出联盟#!的一部分，这是一个在17世纪形成的五大阿尔冈昆语族的重要联盟，包括$passamaquoddy$、$maliseet$、$mikmaq$、$passamaquoddy$、$penobscot$和$abenaki$。"
 PENOBSCOT_GLOSS: "#bold $penobscot_collective_noun$#!人是一支讲阿尔冈昆语的原住民，分布于现今的新不伦瑞克省、魁北克省和缅因州。过去，欧洲人根据对他们族名的误听，称其为#bold 潘瓦希斯克人#!，这个名称源自他们的自称$penobscot$，意为“白岩延伸之地的人民”。他们是#italic 日出联盟#!的一部分，这是一个在17世纪形成的五大阿尔冈昆语族的重要联盟，包括$maliseet$、$mikmaq$、$passamaquoddy$、$penobscot$和$abenaki$。"
 ABENAKI_GLOSS: "#bold $abenaki_collective_noun$#!人是一支讲阿尔冈昆语的原住民，分布于现今的新不伦瑞克省、魁北克省和缅因州。$abenaki$意为“真正的人”，尽管他们也被称为#bold 阿布纳基#!，这个名字源自他们所属的#italic 日出联盟#!。#italic 日出联盟#!是一个在17世纪形成的五大阿尔冈昆语族的重要联盟，包括$maliseet$、$mikmaq$、$passamaquoddy$、$penobscot$和$abenaki$。"
 BEOTHUK_GLOSS: "#bold $beothuk_collective_noun$#!人曾是纽芬兰岛上的原住民。他们的语言在19世纪不幸消亡，尽管可能与阿尔冈昆语族有着某种联系，但由于资料匮乏，这一点至今仍未得到确证。大约在公元1000年左右，诺斯探险家可能已经与他们或他们的先祖有过接触，但其与欧洲人的明确首次接触则是在16世纪。由于欧洲人的入侵、屠杀以及他们无法抵御的疾病，$beothuk$人在与外界接触后迅速衰落。据记载，最后一位纯正血统的$beothuk$人，一位名叫肖娜迪蒂的女性，死于1829年。然而，可能仍有一些$beothuk_collective_noun$人在与其他邻近的土著群体，如$mikmaq$中寻求庇护后得以幸存。"
 MAITREYA_GLOSS: "在佛教宇宙观中，#bold 弥勒#!是未来将出现的下一尊佛，接替历史上的释迦牟尼佛；预言中他将出现于佛法衰微之时。数个世纪以来，曾有许多宗教人物自称是弥勒佛。例如，在亚洲许多地区，尤其是那些来自千禧年教派的历史反叛者，都曾宣称自己是弥勒佛的化身。"
 SINOSPHERE_GLOSS: "#bold 中华文化圈#!涵盖东亚及受中华文化深刻影响的部分东南亚地区。现代中华文化圈的四大主要国家包括中国、日本、韩国和越南，历史上还包括该地区的其他政权，如契丹和琉球国。中华文化圈各国过去乃至现今仍共享诸多文化元素与影响，例如建筑风格、饮食文化；根植于儒家思想、道教和大乘佛教的意识形态；受理学影响的官僚治理体系，常辅以理论上任人唯贤的科举制度；以及将文言文作为行政管理和文学创作的通用书面语。"
 NAM_QUOC_SON_HA_GLOSS: "#bold 《南国山河》#!是一首据称出自11世纪越南将领李常杰之手的诗作，尽管其最早的记载可追溯至14世纪。这首诗主张越南作为南方国家的独立主权，与作为北方的中国形成对比。全诗如下：\n\n#italic 南国山河南帝居，\n截然定分在天书。\n如何逆虏来侵犯？\n汝等行看取败虚。#!"
 SHINGON_GLOSS: "#bold 真言宗#!是日本佛教的主要流派之一，也是现存少数金刚乘或密宗传承之一。真言宗源自中世纪中国的金刚乘传承，最初在日本兴盛得益于空海法师（774‑835年）的努力，他曾前往中国学习密宗佛教。尽管大多数日本佛教流派是非密宗教派，但真言宗对日本佛教的发展和实践产生了巨大影响。"
 WATER_MARGIN_GLOSS: "#bold 《水浒传》#!是中国古典文学四大名著之一。故事背景设定在宋朝，讲述了以宋江为首的108位好汉聚义梁山的故事。他们最初是反抗政府的贼军，后来获得朝廷赦免，并被皇帝招安，前往征讨辽国及其他叛军。书中许多主要人物原型源自11至12世纪活跃于中国历史的真实人物。"
 FOUR_GREAT_CLASSIC_NOVELS_GLOSS: "#bold 四大名著#!被视为中国古典文学的巅峰之作。这些作品创作于明清时期，至今仍对亚洲文学和流行文化产生着深远影响。公认的四部经典小说包括：\n\n$BULLET_WITH_TAB$#italic 《三国演义》#!：描写的是从东汉末年到西晋初年近百年间的历史。\n$BULLET_WITH_TAB$#italic 《水浒传》#!：讲述以宋江为首的108位好汉聚义梁山的故事。\n$BULLET_WITH_TAB$#italic 《西游记》#!：以玄奘法师西行取经为蓝本的神话题材作品，塑造了孙悟空等经典形象。\n$BULLET_WITH_TAB$#italic 《红楼梦》#!：这是一部悲壮且深刻的家族史诗，以爱情纠葛和贾府兴衰为主线，展现家族命运的悲剧性长篇巨著。"
