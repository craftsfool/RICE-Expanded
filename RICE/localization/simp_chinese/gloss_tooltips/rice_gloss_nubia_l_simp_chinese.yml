l_simp_chinese:
 LORD_OF_THE_MOUNTAIN_GLOSS:0 "#bold 诺巴提亚都长#!也叫#bold 山之主#!（中世纪努比亚语：#italic Migin Soñoj#!），是中世纪马库里亚的最高级别官员。其主要职责是管理努比亚与埃及的边境，并作为埃及的阿斯旺总督对接方，负责执行易货条约中努比亚方面的条款。目前学者们尚不确定该职位是世袭制、任命制还是二者结合，也不确定都长们与早期诺巴提亚王国的统治者是否存在关联（毕竟诺巴提亚在7世纪某个时期被并入马库里亚）。"
 GOVERNOR_OF_ASWAN_GLOSS:0 "在中世纪的埃及，#bold 阿斯旺总督#!负责管理努比亚与埃及边境，作为努比亚诺巴提亚都长的对接方，并负责执行易货条约中埃及方面的条款。"
 PHARAOH_GLOSS:0 "#bold 法老#!是古埃及君主的尊称。是希腊语“pharaoh”（直译为“大宫殿”）的音译，在古王国时代仅指王宫，从新王国第十八王朝图特摩斯三世起作为颂词开始用于国王自身，并逐渐演变成对国王的一种尊称。在埃及第五王朝中期后，法老一般有五个称谓，分别是荷鲁斯名、两女神名、金荷鲁斯名、登基名和原名。"
 QORE_GLOSS:0 "#bold 至尊#!是古代努比亚的库施王国统治者的称号，尤其是在麦罗埃时期（公元前542年‑约公元350年,当时库施的首都位于麦罗埃）。"
 KANDAKE_GLOSS:0 "#bold 女王母亲#!（罗马化:Kandake，拉丁化:Candace），是古代努比亚库施王国中太后或执政女王的称号，尤其是在麦罗埃时期（公元前542年‑约公元350年，当时王国首都位于麦罗埃）。该称谓在《圣经》中被用来指称所谓的埃塞俄比亚女王，并在中世纪亚历山大大帝的传说中作为他在努比亚对抗的女王之名流传。因此，该名称如今在西方仍作为常见人名沿用。"
 HAFIR_GLOSS:0 "#bold 哈菲尔水库#!是一种人造的水库，最初由古努比亚的库施王国建造，至今仍在使用。许多早期的哈菲尔水库建在神庙旁，可能曾与宗教和王权相关联。"
 ARCHANGEL_RAPHAEL_GLOSS:0 "#bold 拉斐尔#!是犹太教、基督教和伊斯兰教中最受尊崇的大天使之一，祂最初出现在《多俾亚传》和《以诺书》中，但在《新约》与《古兰经》里并未提及姓名。不过后来的基督教将祂与治愈联系起来，而在伊斯兰教中，祂是吹响末日号角的天使。"
 XENODOCHIUM_GLOSS:0 "#bold 接待客栈#!（Xenodochium#!），是中世纪时期为旅行者，尤其是朝圣者提供住宿的旅舍。该词源于希腊语，指源自拜占庭帝国或受其影响的基督教地区（如努比亚）的旅舍。"
 SAINT_CATHERINE_ASHITINAME_OF_MUHAMMAD:0 "#bold 《圣约》#!，又称 《穆罕默德的圣约》或《遗嘱》，是一份授予西奈半岛圣凯瑟琳修道院基督教修士保护及其他特权的条约。据说该文件的原始版本在奥斯曼人征服埃及时被其为了安全保管而没收，但作为补偿，奥斯曼人给圣凯瑟琳修道院的修士们制作了一份副本，并且奥斯曼人仍然遵守了条约中的条款。"
 SAINT_CATHERINE_BEDOUIN_GUARDS:0 "位于西奈的圣凯瑟琳基督教修道院历来依赖#bold 贝都因卫队#!的保护。虽然几个世纪以来，修道院经常遭到穆斯林军队的袭击和掠夺，但修道院的卫兵也同样是穆斯林。"
 SAINT_CATHERINE_BURNING_BUSH:0 "在犹太教、基督教和伊斯兰教中，#bold 燃烧的荆棘丛#!是在西奈半岛的一处，摩西在此被上帝指派率领以色列人离开埃及前往应许之地。古典晚期，著名的圣凯瑟琳修道院正是围绕着一丛据称与《圣经》中记载的燃烧的荆棘丛相同的灌木而修建。"
 SAINT_CATHERINE_LIBRARY:0 "位于西奈半岛的圣凯瑟琳修道院#bold 图书馆#!建于拜占庭查士丁尼皇帝统治时期（约527‑565年间），被公认为世界上持续运行最古老的图书馆之一。数个世纪以来，馆内汇集了各类语言的手稿与典籍，涵盖希腊语、阿拉米语、叙利亚语、拉丁语、阿拉伯语、亚美尼亚语、吉兹语、教会斯拉夫语、格鲁吉亚语、希伯来语、科普特语等众多语种。"
 SAINT_CATHERINE_PATH_OF_MOSES:0 "位于西奈半岛的圣凯瑟琳修道院旁有一条被称为#bold 摩西之路#!的路线，通往一座高山，相传圣经中的摩西曾在此领受十诫。"
 SAINT_CATHERINE_RELICS:0 "位于西奈半岛的圣凯瑟琳修道院与圣凯瑟琳息息相关，据称她的#bold 圣髑#!在修道院附近被发现并运回保管，使之成为著名的朝圣地。根据传统圣徒传记记载，她是一位博学的年轻女性，曾使许多人皈依基督教，约在公元305年殉道。"
 SAINT_CATHERINE_WELL_OF_MOSES:0 "位于西奈半岛的圣凯瑟琳修道院内，有一处据称是#bold 摩西之井#!的遗迹，相传《圣经》中的摩西就是在此遇见他未来的妻子西坡拉，即米甸祭司兼族长叶忒罗的女儿。直至今日，这口井仍是该修道院的主要水源。"
 SAQIA_GLOSS:0 "#bold 波斯轮（罗马化：Saqiya）#!，一种机械提水装置，由固定于垂直水轮或绕轮绳带上的水桶或水罐构成，该装置通过轴杆与由马、牛或驴驱动转轮相连。这种灌溉装置已在中东、印度和北非地区沿用数世纪。许多地方的波斯轮由多位当地头人共同维护，他们协议平等提供必要材料或进行设备修缮，每位头人相应获得相等的农田灌溉时长。"
 TEBELDI_TREES_GLOSS:0 "#bold 苏丹猴面包树（Tebeldi）#!原产于非洲大部分地区以及也门和阿曼的部分地区，它被珍视为食物、水源和药物的来源。在达尔富尔，当地统治者负有保护这些树木的神圣义务，因为这些树木可用于储水。"
 NOTARIOS_GLOSS:0 "在古罗马和拜占庭，#bold 公证人#!通常是授予承担文书或秘书职责的头衔。这一头衔传播至受罗马和拜占庭影响的地区，如西欧和努比亚，并在这些地区保留了相似的含义。"
 SHOUNG_GLOSS:0 "#bold 粮仓守护者#!，在中世纪努比亚语中称作#bold “Shoung”#!，是中世纪努比亚马库里安王国一些高级官员的称号。学者们对该称号的具体职责或职能尚不明确，亦不确定是否为礼仪性头衔。值得注意的是，12世纪末的马库里亚国王巴西尔是唯一被记载拥有此称号的君主，与其他非王室出身的称号持有者不同，他#italic 同时#!兼任国王。"
 NUBIA_RELEASED_THE_BOATS_GLOSS:0 "这一时期，往来于努比亚和埃及的交通受到双方官员的严密监控。这段文字摘录自一份涉及努比亚诺巴提亚都长的信函，反映出例如商船在努比亚活动及往返两地均须经其许可。"
 NUBIA_THE_KING_GLOSS:0 "这段节选出自一封书信，穆斯林商人拉米·本·哈桑·坎兹向诺巴提亚都长投诉：他的奴仆（可能曾担任信使或处理与马库里亚国王相关事务）遭到竞争对手穆斯林商人伊本·阿斯卡拉尼的阻挠。两人似乎都与马库里亚国王有所关联。"
 NUBIA_COLD_SEASON_GLOSS:0 "中世纪时期，商人往来尼罗河上下游常用的交通方式是乘船。寒冷季节里，河上航行有时会因强风受阻，正如一位穆斯林商人致诺巴提亚都长书信节选所表明的那样，这些商人必须根据时节精心安排生意时机。"
 NUBIA_COLD_SEASON_2_GLOSS:0 "在中世纪时期，商人沿尼罗河往来旅行的一种常见方式是乘船。有时，在寒冷季节，风向会阻碍航行，因此商人必须根据一年中的时节来仔细安排他们的行程。"
 NUBIA_IN_THE_PRESENCE_OF_GLOSS:0 "这段文字摘录自一位穆斯林人士写给马库里亚诺巴提亚都长的信件。原文中使用“在主教面前”的表述，旨在借助中世纪伊斯兰法律中在证人或法官面前完成法律行为的惯例，赋予相关事件法律认可。同样，在中世纪努比亚，法律文件也常常需要在多位世俗及教会官员面前签署。这段记载还表明，在此边境地区情境下，缔约双方的责任关系可能存在于个体缔约方之间，而不仅限于埃及与马库里亚这两个王国政府之间。"
 NUBIA_KISSES_THE_GROUND:0 "这段文字摘录自一位穆斯林人士写给马库里亚诺巴提亚都长的信件。其中使用了\"奴隶亲吻地面\"这一叩拜套语。此类套语常见于努比亚和埃及地区呈递给特定官员或统治者的信函，其含义并非指写信人真是收信者的奴隶，而是最初源于埃及的一种公式化致敬方式，反映了法蒂玛宫廷礼仪发展的体现——即在哈里发面前行吻地礼的仪式。"
 NUBIA_RISING_OF_PRICES_GLOSS:0 "这段文字节录自一封信件，提及诺巴提亚都长似乎通过批准运送补给物资的方式介入了某类经济危机。"
 SUNT_GLOSS:0 "#bold “松特”#!是阿拉伯语中对开花树种#italic 阿拉伯金合欢#!的称谓，其俗名包括#italic 阿拉伯胶树#!、#italic 巴布尔树#!、#italic 刺含羞树#!、#italic 埃及金合欢#!与#italic 多刺金合欢#!。因其木质致密不易渗透，且能用较小的#italic 松特木料快速简易地构建船体，历史上尼罗河流域常采用此木材造船。"
 ERA_OF_THE_HEGIRA_GLOSS:0 "#bold 希吉拉纪元#!或#bold 徙志#!（拉丁语：Hijri）是伊斯兰世界用于记录年代的历法纪元。该纪元始于先知穆罕默德从麦加迁徙至麦地那的那一年（公元622年）。其使用范围曾延伸至受伊斯兰政权统治或影响、或与穆斯林存在经济文化联系的非穆斯林群体。"
 ERA_OF_THE_MARTYRS_GLOSS:0 "#bold 殉道者纪年#!是早期部分基督徒用于记录日期的历法纪元。该纪元始于罗马皇帝戴克里先于公元284年登基，他在罗马帝国发动了最后一次针对基督徒的大规模迫害。尽管中世纪时基督教世界大多已弃用此纪元而改用#italic 基督纪年#!，但埃及的科普特教会至今仍沿用这一纪年方式。"
 SAYINGS_OF_THE_DESERT_FATHERS_GLOSS:0 "#bold 《沙漠之父箴言》#!成书约在公元5世纪，通常以年轻僧侣与其导师的对话形式出现，或以给访客的建议形式出现。其在中世纪科普特教会信徒中广为流传，成为精神指引的重要源泉。"
 ABBA_POEMEN_GLOSS:0 "#bold 阿巴·波门#!（约公元340-450年），是来自埃及的基督教僧侣、沙漠修士及圣人。在记录沙漠修士轶事与箴言的#italic 《沙漠之父箴言》#!中，他是被引用次数最多的阿巴（即教父）。"
 OIKONOMOS_GLOSS:0 "#bold 掌财官（希腊语：oikonomos）#!这一头衔源自古希腊世界，几个世纪以来逐渐演变出不同的含义，但始终与管理相关联——无论是在地中海背景下管理私人住宅、庄园、神殿，还是国家等等，在古典时代晚期地中海，这一头衔通常指教会或修道院的管家。由于拜占庭的影响，这一称谓甚至传播到了努比亚地区；尽管大多数学者对努比亚各种行政头衔的具体职责尚不明确，但可以推测，努比亚的掌财官也应是一种教会管家的角色。"
 SAINT_EPIMACHOS_GLOSS:0 "虽然存在多位名为#bold 依皮马卓斯（Epimachos）#!的圣徒，但在中世纪努比亚广受崇敬的是佩鲁西姆的依皮马卓斯。根据圣徒传记记载，这位织布匠在罗马埃及迫害基督徒时期的某个未知时间点殉道。尽管其原始故事与军事并无关联，但在努比亚，他被塑造成一位战士形象的圣徒。\n\n目前无法确定这一形象的来源，究竟是因其名字包含希腊语“战斗”一词#italic mákhē#!，还是由于某些已失传的地方神迹。不过依皮马卓斯当场战士的崇拜在中世纪努比亚相当普及，这可能反映了当地对军事威胁或政治动荡的忧虑。"
 SOULOU_GLOSS:0 "多年来，努比亚学研究者一直对中世纪努比亚文献中出现的#bold “索卢”（Soulou）#!一词的含义困惑不解。这个词汇充分体现了翻译这类文献的难点——我们往往缺乏足够的背景信息。文献中的#italic  “索卢”（Soulou）#!似乎是为官员传递消息的差役，但无法确定这究竟是具体职务名称、社会阶层、受雇从事该工作的族群，还是其他身份。现代努比亚语言中的#italic “苏鲁”（sulu）#!指代流动工匠鞋匠，或与#italic  “索卢”（Soulou）#!存在关联。不过佩特拉·韦申费尔德最近针对该术语的学术论文建议，在获得进一步资料前，暂不对其进行翻译更为妥当。"
 KITAB_AJA_IB_AL_HIND_GLOSS:0 "#bold 《印度奇闻录》#!是十世纪阿拉伯船长布祖尔格·伊本·沙赫里亚尔编纂的商贾、水手与旅行者冒险故事集。该书献给伊赫昔德王朝的埃及总督阿布·米斯克·卡富尔（905‑968年），这位原为非洲奴隶的将领侍奉伊赫昔德王室期间屡获擢升，先以维齐尔身份成为埃及#italic 实际#!统治者，最终于966年独揽大权。"
 SAINT_HILARIA_GLOSS:0 "#bold 《圣希拉里亚传奇》#!是一部科普特文献，记载了关于5世纪东罗马帝国皇帝芝诺长女的传说。据传，希拉里亚深受埃及塞底斯谷（今$b_wadi_natrun$）修士们的感召，为加入修道院而伪装成名为希拉里翁的宦官。后来，希拉里亚的妹妹狄奥庇斯忒遭恶魔附身而患病，前往埃及求治时，被仍未暴露身份的希拉里亚治愈。希拉里亚照料妹妹期间，两人同榻而眠。皇帝芝诺听闻“修士”与女儿共寝后震怒，希拉里亚只得坦白真实身份。芝诺被长女的虔诚信仰深深触动，允准她以“修士”身份重返塞底斯。尽管传说真实性存疑，但在其假定逝世数世纪后，希拉里亚仍被多个东方教会奉为圣人。"
 FUL_MEDAMES_GLOSS:0 "#bold 埃及焖蚕豆#!（Ful Medames），是一种由蚕豆混合各种香料和香草制成的炖菜，是埃及传统早餐代表，被视为国民菜肴。该地区食用蚕豆的历史可追溯至法老时代的埃及，因此这道菜可能拥有古老的起源。关于此菜更确切的记载来自中世纪时期；例如在中世纪开罗，#bold 埃及焖蚕豆#!的制作被居住在公主浴场（一座公共浴场）附近的居民垄断，因为他们利用了用于保持浴池水温的炉火，日夜不停地用大锅慢焖，以确保开罗居民的早餐供应。"
 HERMES_TRISMEGISTUS_GLOSS:0 "#bold 赫耳墨斯·特里斯墨吉斯忒斯#!（意为#italic 三重伟大的赫耳墨斯#!）是一位传奇性的学者、魔法师与导师，其形象源于希腊神祇赫耳墨斯与埃及神祇托特的融合。据传他编纂的#italic 《赫耳墨提卡》#!奠定了#italic 赫耳墨斯主义#!哲学传统的基础，该思想体系深远影响了希腊化时期乃至近代早期的基督教、犹太教与伊斯兰教思想。"
 ABLEMBA_GLOSS:0 "在苏丹民间传说中，#bold 阿勒姆巴#!指的是夜晚以灯光或灯笼形式出现的超自然幻影，它们会将人们从家园或安全道路上引开。这类现象属于一个更广泛的超自然现象或存在范畴，其中包括女鬼、精怪以及发光蛇等，人们相信这些现象或生物经常出现在古代或中世纪的努比亚遗址周围。在现代苏丹，人们认为这些神灵起源于基督教，守护着领地的秘密，免受强盗和入侵者的侵害，这反映了当地人对其历史遗产的看法。"
 KARKADE_GLOSS:0 "#bold 洛神花茶#!，是一种中东和北非地区的饮品，由一种名为#italic 洛神花#!的干燥花瓣制成。该饮品在埃及和苏丹备受喜爱，尤其在斋月和婚礼等节庆场合，因为人们相信这种饮品具有保健功效。典型的制备方式是将干燥的洛神花瓣浸泡于水中，煮沸后根据个人喜好混合其他风味。"
