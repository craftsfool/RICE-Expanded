l_simp_chinese:
 CHELDEBECHEL_GLOSS:0 "在帕劳人观念中，#bold 结社（Cheldebechel）#!是一些发挥着重要社会作用的正式社团。它们按年龄和性别组织，具有多种功能，例如教育年轻一代了解社会角色、为公共工程项目征集劳力、执行法律以及保护社区的经济和军事利益等等。"
 BITANG_ME_A_BITANG_GLOSS:0 "二分原则（#bold 帕劳语：bitang me a bitang#!），是帕劳的一个二元性概念，每个实体在概念上都在两个对立但互补、相连的方面之间保持平衡。例如，一个人既不被认为是好或坏，而是两者兼具。在实际层面上，这一原则以多种方式影响了帕劳的传统文化：氏族世系被分为两组，村庄在地理上被划分为两部分，政治互动也基于这一原则。"
 KWARAAE_WARRIOR_GHOSTS_GLOSS:0 "夸拉埃族（Kwaraʼae）是所罗门群岛马莱塔岛上最大的土著群体，自古就对鬼神极为敬仰。那些遵循『此生侍鬼』传统的角色可以祈求鬼神支持，战士们可以祈求#italic 战鬼#!（夸拉埃语：akalo ramo’a）附身来与敌人继续斗争，这些战鬼曾是著名战士，而且人们相信，在使用这些力量时，男性必须避开女性，因为女性能够中和这些力量。"
 SASI_GLOSS:0 "在印度尼西亚东部和巴布亚的部分地区，有一种名为#bold 萨西#!的保护资源习俗（尽管它在不同语言中有不同名称，但人们通常为了方便使用来自文老古群岛的萨西一词）。某一片区域或某类资源会被“封闭”一段时间，例如一年，在此期间，人们被禁止采集受禁令影响的资源。例如，如果一片海岸区域被封闭，则禁止捕鱼；或者可能禁止采集某些植物。违抗萨西将带来严重后果，因为人们相信这会激怒神灵或祖先。时间过后，萨西会通过一场仪式重新开放。"
 MEGAPODE_GLOSS:0 "#bold 冢雉#!是由数种具有亲缘关系的鸟类物种组成的统称。它们外表形似野鸡，原生于西太平洋、澳大利亚、新几内亚、印度尼西亚东部，以及安达曼和尼科巴群岛。这些鸟类有在集中而狭小的巢冢中孵卵的习性。对于该地区的数个原住民群体而言，冢雉蛋是其赖以生存的重要食物来源，也常常作为效忠、友谊和敬意的象征彼此馈赠。传统上，当地的仪式惯例会对采集这些鸟蛋的行为做出严格的限制。"
 YAP_STONE_MONEY_GLOSS:0 "直至20世纪，雅浦人仍会远航至帕劳岛，获取被制成中间有孔的圆盘状石灰岩（他们称为#bold 石币#!），这些圆盘直径从几英寸到几英尺不等，而且旅途可能充满危险，有些人甚至因此丧生，因此这些石头被用作货币，其价值不仅来自大小或形状，更与石头的口述历史相关，比如曾归谁所有，或有多少人因试图将其运回雅浦而丧命。这类故事代代相传，确认了石头的价值；由于人人都知晓每块石头的主人，偷盗它们几乎不可能。"
 POLYNESIA_HISTORY_GLOSS:0 "在中世纪时期，波利尼西亚社群的影响力已遍布太平洋，远及美拉尼西亚和密克罗尼西亚，尽管这些区域并不在当前地图的边界之内。一些波利尼西亚政权，如萨摩亚和汤加，曾在太平洋辽阔海域上取得巨大的政治权力，其影响力甚至覆盖了斐济等非波利尼西亚地区。"
 SOUTH_AMERICA_HISTORY_GLOSS:0 "越来越多的证据表明，波利尼西亚人与某些南美洲原住民可能在中世纪时期有过接触，但这种接触的性质仍不确定，且目前尚未发现类似“兰塞奥兹牧草地”之于北欧文兰那样的决定性铁证（至少目前还没有）。其中较有前景的线索之一来自DNA证据，显示波利尼西亚人群与一支约在公元1200年左右、与今哥伦比亚塞努人密切相关的南美原住民群体有过接触。"
