l_simp_chinese:
 YAKHCHAL_GLOSS: "#bold 冰窖（波斯语：یخچال，英语：yakhchāl）#!，是[GetGeographicalRegion('world_middle_east_persia').GetName]地区用于储存冰雪的传统建筑。样式从最简单的挖掘地下储藏坑，到建在地面上的圆顶塔不等，通过利用蒸发冷却和热传导物理原理来保持低温。伊朗社会所有阶层都频繁使用冰窖，特别是在更干旱的地区。\n到了20世纪，则进一步提供冷食和冷料，如冰沙和冰镇葡萄酒。在19世纪的德国旅行家恩斯特·黑尔策就提到，即使是穷人也使用冰窖来储存水，人们可以在集市上或直接从冰窖购买冰。"
