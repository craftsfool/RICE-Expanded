l_simp_chinese:
 TERTON_GLOSS: "在[GetFaithByKey('lamaism').GetName]及[GetFaithByKey('bon').GetName]中，发现#bold 伏藏#!的#bold 宝藏揭示者#!称为#bold 伏藏师#!。相传当时人们既不能领悟密法也不能保护它们不受邪魔侵害，因此密法被得道高僧隐藏起来。他们中以佛教莲花生大师和苯教敦巴辛饶大师为佼佼者。伏藏通常是典籍，但也会以雕像、圣物等形式出现；伏藏可以在洞穴、岩石或水下，也或在梦境、前世记忆中。虽然伏藏师与宁玛派和苯教有着密切的联系，但其他藏传佛教派别也有伏藏师。"
 TERMA_GLOSS: "在[GetFaithByKey('lamaism').GetName]或[GetFaithByKey('bon').GetName]中，#bold 伏藏#!乃技艺高超的#italic 伏藏师#!揭示的各式密法，以经文的形式为最。相传当时人们既不能领悟密法也不能保护它们不受邪魔侵害，因此密法被得道高僧隐藏起来。他们中以佛教莲花生大师和苯教敦巴辛饶大师为佼佼者。伏藏通常是典籍，但也会以雕像、圣物等形式出现；伏藏可以在洞穴、岩石或水下，也或在梦境、前世记忆中。虽然伏藏师与宁玛派和苯教有着密切的联系，但其他藏传佛教派别也有伏藏师。"
 GUTHUK_GLOSS: "#bold 古突#!是$heritage_tibetan_name$饮食中的一种炖汤，由豆类、蔬菜、肉类及剩谷熬制而成，人们通常在藏历新年前两天食用这道菜肴。"
 DRESI_GLOSS: "#bold 麻森#!是$heritage_tibetan_name$美食中的一道甜食，用黄油煮熟的米饭和葡萄干、#italic 红薯块茎#!、枣和坚果混合而成。"
 THUKPA_GLOSS: "#bold 苏卡帕汤面#!是$heritage_tibetan_name$美食中所有面汤的统称。这类面汤其中食谱小料多种多样，包括素菜和荤菜。"
 MOMO_GLOSS: "#bold 馍馍#!是一种蒸制、带馅的饺子类食物，源于$heritage_tibetan_name$饮食文化。其馅料既可以是肉类，也可以是蔬菜，通常搭配多种酱料和佐料食用，例如辣蒜酱、腌萝卜等。有时也会将馍馍加入汤中食用。"
 DROKPA_GLOSS: "被称为#bold 卓巴人#!的游牧民占吐蕃人口很大一部分。[GetGeographicalRegion('RICE_upper_tibet').GetName]的高地名为羌塘，那里是吐蕃尤其崎岖严酷的一个地区。居住在那里的#italic 卓巴人#!则以特别坚韧顽强而闻名。"
 MANI_STONE_GLOSS: "在喜马拉雅地区，#bold 玛尼石#!是刻有六字真言、慧眼、神像造像、各种吉祥图案的石块和石板，上面图案大都与佛教有关。工匠制作玛尼石的过程也被认为是一种冥想和宗教行为。有时人们甚至会用漂亮的石头来代替刻有图案的石头来做玛尼石。"
 LOTSAWA_GLOSS: "#bold 译师#!（lotsawa）是授予某些与印度上师合作、将重要[GetReligionByKey('buddhism_religion').GetAdjective]经典翻译为藏文的藏族学者与僧侣的头衔。仁钦桑布与玛尔巴等译师在中世纪佛教传入吐蕃的过程中发挥了重要作用。该术语可能源自梵文#italic locchava#!，意为“双语者”或“世界之眼”。"
 KARMIC_CONDITIONS_GLOSS: "[GetReligionByKey('buddhism_religion').GetName]认为，#italic 业#!是能够解释人生的苦乐、世运的盛衰等一切现象的根源，凡做一件事、说一句话，甚至动一个念头都会产生#bold 因缘#!，随着前者善恶的性质和份量，导致相应的结果，则是#bold 因果#!。"
 DAKINI_GLOSS: "#bold 空行母#!是[GetReligionByKey('buddhism_religion').GetName]和[GetReligionByKey('hinduism_religion').GetName]中的一类天神，具体身份和行为因教派而异。某些教派认为祂们是食肉天魔。然而藏传佛教认为空行母是代表智慧与慈悲的女神。"
 BRUSHA_GLOSS: "吐蕃史料中的#bold 勃律#!，即小钵露罗、小巴洛尔，是中世纪喜马拉雅地区以西的某个地区，唐朝多称小勃律。勃律可能位于吉尔吉特，或与说一种孤立的罕萨语的罕萨人有关。勃律可能是吐蕃帝国甚至其分裂后的古格王国的西部边境。"
 TSAW_BVI_NANG_SKYID_GLOSS: "在吐蕃采盐历来都是一项高度仪式化的活动，采盐的#italic 卓巴人#!必须遵守严格的行为准则，在旅途中举行各种宗教仪式，采盐队的成员在带着盐回家后会参加#bold 喜迎盐队宴会#!。"
 THANGKA_GLOSS: "#bold 唐卡#!是在喇嘛教即[GetFaithByKey('lamaism').GetName]，以及[GetFaithByKey('bon').GetName]非常流行的棉布或丝绸卷轴画。唐卡描绘佛陀、菩萨、护法神、历史或传说中的精神人物，以及其他宗教神祇或人物。一幅唐卡上通常会有许多人物围绕着作为绘画焦点的中心人物。唐卡通常被悬挂起来，用于辅助冥想和其他宗教仪式。过去由于制作唐卡非常困难，所以它们是备受珍视的物品。"
 VAJRA_GLOSS: "#bold 金刚杵#!是[GetReligionByKey('buddhism_religion').GetName]和[GetReligionByKey('hinduism_religion').GetName]中的宗教象征和法器。金刚杵通常是五股的仪式法器，广泛用于密宗仪式中。在梵语中，可以指代#italic 霹雳#!或#italic 金刚石#!，因为它象征着摧毁无知。"
 SATER_GLOSS: "#bold 地伏藏#!是伏藏的一类，其具有物质性质，例如雕像、文物和卷轴，可通过寻找其隐藏位置来发现。它们与#italic 意伏藏#!互为对比，后者将法门或经典埋藏在修行者的意识深处。‌"
 GONGTER_GLOSS: "#bold 意伏藏#!是是伏藏的一类，它通过发愿力将经典、咒文等埋藏在证悟心性的中，待时机成熟找到了一些能触发他们在前世学到这些知识的记忆。它们与#italic 地伏藏#!互为对比，后者将物品隐藏在岩石、湖泊等自然环境中"
 PRAYER_WHEEL_GLOSS: "#bold 转经筒#!是藏传佛教宗教文化中不可或缺的组成部分。是安装在轴心之上、可以旋转的轮状物，材质包括木头、石头、金属、皮革甚至棉布。转经筒上通常都装饰有经文，最常见的便是 著名的六字真言#italic 唵嘛呢叭咪吽#!。较大的转经筒常见于寺庙和寺院之中，而较小的手持转经筒，则成为个人宗教修行的一部分。"
