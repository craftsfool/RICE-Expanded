 RICE_ancestor_worship.0001.t:0 "先祖"
 RICE_ancestor_worship.0002.t:0 "$RICE_ancestor_worship.0001.t$"
 RICE_ancestor_worship.0002.desc.culture:0 "今天，我召集了家族成员，在一个祭典上向我们的祖先致敬和追悼。我们进行传统的[ROOT.Char.GetCulture.GetName]仪式、祈祷、祭祀时，我们思考祖先，及他们所经历的斗争，至今仍为我们提供的智慧和帮助。\n\n祭典结束后，我们一同在一起吃家族聚餐，彼此共度时光。我们在心中重申，对祖先的记忆不能被遗忘，我们必须尽最大努力以正义的行为来纪念他们的遗产。我们只能希望，如果他们在远方看着我们，他们会为[ROOT.Char.GetDynasty.GetNameNoTooltip]家族最新一代人所取得的成就感到骄傲。"
 RICE_ancestor_worship.0002.desc.religion:0 "今天，我召集了家族成员，在一个祭典上向我们的祖先致敬和追悼。我们进行传统的[ROOT.Char.GetFaith.GetAdjective]仪式、祈祷、祭祀时，我们思考祖先，及他们所经历的斗争，至今仍为我们提供的智慧和帮助。\n\n祭典结束后，我们一同在一起吃家族聚餐，彼此共度时光。我们在心中重申，对祖先的记忆不能被遗忘，我们必须尽最大努力以正义的行为来纪念他们的遗产。我们只能希望，如果他们在远方看着我们，他们会为[ROOT.Char.GetDynasty.GetNameNoTooltip]家族最新一代人所取得的成就感到骄傲。"
 RICE_ancestor_worship.0002.a:0 "拜祭祖先永远是正确的"
 RICE_ancestor_worship.0002.tooltip:0 "所有参加活动的[family_members|E]根据他们的[virtues|E]和[sins|E]，以及你的[dynasty|E][dynasty_prestige_level|E]，随机获得一定的[piety|E]和[prestige|E]。"
 RICE_ancestor_worship.0004.t:0 "为了列祖先尊！"
 RICE_ancestor_worship.0004.desc:0 "我决定组织一次[ROOT.Char.GetInvolvedActivity.GetShortName]的活动，规模比我们平时要大。它将在[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]举行，因为我觉得那里的条件很适合这个场合。\n\n总之，我已经向[ROOT.Char.GetDynasty.GetName]宗族的其他成员发出消息，让他们在这个重要场合与我一起在我的领土上相聚。"
 RICE_ancestor_worship.0004.a:0 "先祖将会十分欣慰"
