l_simp_chinese:
 RICE_all_in_attendance:0 "所有参加仪式的人"
 activity_venerate_ancestors:0 "祭祀祖先的仪式"
 activity_venerate_ancestors_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]祭祀祖先的仪式"
 activity_venerate_ancestors_owner:0 "组织者"
 RICE_misc_venerate_ancestors:0 "与家人一起祭拜祖先"
 RICE_misc_venerate_ancestors_tooltip:0 "在与你的[close_family|E]举行的仪式中向你的先祖拜祭。"
 RICE_misc_venerate_ancestors_desc.religion:0 "我希望表达我对祖先的缅怀和尊重，并加强家族纽带。我应该以传统的[ROOT.Char.GetFaith.GetAdjective]方式，在一个冗长的仪式上对他们表示敬意和崇敬。"
 RICE_misc_venerate_ancestors_desc.culture:0 "我希望表达我对祖先的缅怀和尊重，并加强家族纽带。我应该以传统的[ROOT.Char.GetCulture.GetName]方式，在一个冗长的仪式上对他们表示敬意和崇敬。"
 RICE_misc_venerate_ancestors_effect_tooltip_1:0 "你将获得随机数量的[piety|E]、[prestige|E]和[dynasty_prestige|E]（最多可以获得#V [piety_i][GetPlayer.MakeScope.ScriptValue('RICE_ancestor_max_bonus_value')]#!，#V [prestige_i][GetPlayer.MakeScope.ScriptValue('RICE_ancestor_max_bonus_value')]#!，和#V [dynasty_prestige_i][GetPlayer.MakeScope.ScriptValue('RICE_ancestor_max_dynasty_prestige_value')]#!）"
 RICE_misc_venerate_ancestors_effect_tooltip_2:0 "你能获得的奖励最大数量取决于你的[dynasty_prestige_level|E]、[virtues|E]和[sins|E]"
 RICE_misc_venerate_ancestors_effect_tooltip_3:0 "你的[realm|E]中的[family_members|E]将加入你的仪式，也可能获得少量的[piety|E]和[prestige|E]。"
 RICE_misc_venerate_ancestors_confirm:0 "让我们向祖先致敬！"
 RICE_misc_venerate_ancestors_context_tooltip:0 "#emphasis 历史背景：#!祭祀祖先是世界上许多文化的重要组成部分。通过参与纪念和缅怀祖先的仪式和礼节，人们可以向他们祈求祝福、建议或帮助，同时加强与家庭成员的联系，表现出自己的孝道。"
 activity_RICE_venerate_ancestors:0 "祭祖仪式"
 activity_RICE_venerate_ancestors_desc:0 "通过向先祖表示缅怀和尊重，可以加强家族纽带，而且先祖值得在漫长的仪式中得到尊重和敬仰。"
 activity_RICE_venerate_ancestors_selection_tooltip:0 "与任何属于你的[dynasty_members|E]的[court|E]一起祭拜祖先。\n\n$RICE_misc_venerate_ancestors_context_tooltip$"
 activity_RICE_venerate_ancestors_host_desc:0 "\n$BULLET_WITH_TAB$获得随机数量的[piety_i|E][piety|E]、[prestige_i|E][prestige|E]和[dynasty_prestige_i|E][dynasty_prestige|E]\n$BULLET_WITH_TAB$你能获得加成的最大值取决于你的[dynasty_prestige_level|E]、[virtues|E]和[sins|E]"
 activity_RICE_venerate_ancestors_guest_desc:0 "\n$BULLET_WITH_TAB$获得随机的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]"
 activity_RICE_venerate_ancestors_province_desc:0 ""
 activity_RICE_venerate_ancestors_temple_holding_desc:0 "\n#P ++[church_holding|E]#!\n#weak 将减少[activity|E]的[gold|E]花费#!"
 activity_RICE_venerate_ancestors_temple_holding_reduced_cost:0 "[church_holding|E]"
 activity_RICE_venerate_ancestors_destination_selection:0 ""
 activity_RICE_venerate_ancestors_guest_help_text:0 "$activity_RICE_venerate_ancestors$"
 activity_RICE_venerate_ancestors_predicted_cost:0 "祭祖仪式的成本取决于你选择的[activity_options|E]。"
 activity_RICE_venerate_ancestors_conclusion_desc:0 "[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName]已经结束。希望祖先们对我们的供品感到满意！"
 RICE_venerate_ancestors_type_secular:0 "世俗之祭"
 RICE_venerate_ancestors_type_secular_desc:0 "$EFFECT_LIST_BULLET$祭祀重点是拜祭先祖，[GetPlayer.GetFaith.GetAdjective][GetPlayer.Custom('DefaultPriestTitlePlural')]参与较少。\n$EFFECT_LIST_BULLET$与#bold 神圣之祭#!相比，获得更多的[prestige_i|E][prestige|E]\n\n#weak 否认先祖超脱凡世是愚不可及，但在我们纪念和追悼他们的时候，让我们首先关注他们生前情况！#!"
 RICE_venerate_ancestors_type_religious:0 "神圣之祭"
 RICE_venerate_ancestors_type_religious_desc:0 "$EFFECT_LIST_BULLET$祭祀重点涉及[GetPlayer.GetFaith.GetAdjective][GetPlayer.Custom('DefaultPriestTitlePlural')]，因为我们不仅向祖先致敬，也向伟大的[GetPlayer.GetFaith.PantheonTerm]致敬！\n$EFFECT_LIST_BULLET$与#bold 世俗之祭#!相比，获得更多的[piety_i|E][piety|E]\n\n#weak 通过对祖先的追悼，我们不仅在彼此之间，还与神祇之间建立了联系！#!"
 RICE_venerate_ancestors_cost_type:0 "祭品类型"
 RICE_venerate_ancestors_cost_type_small:0 "寻常"
 RICE_venerate_ancestors_cost_type_small_desc:0 "$EFFECT_LIST_BULLET$献上寻常且不失礼数的祭品。\n$EFFECT_LIST_BULLET$你的[dynasty|E]最多只能获得#V [dynasty_prestige_i][GetPlayer.MakeScope.ScriptValue('RICE_ancestor_max_dynasty_prestige_small_value')]#!。\n\n#weak 与其用奢侈且轻浮的礼物来炫耀拜祭，我们更应该专注于诚心实意，向他们献上适度且精心选择和周到的礼物才是上策#!"
 RICE_venerate_ancestors_cost_type_large:0 "盛大"
 RICE_venerate_ancestors_cost_type_large_desc:0 "$EFFECT_LIST_BULLET$献上大量且盛大的祭品\n$EFFECT_LIST_BULLET$你的[dynasty|E]将获得#V [dynasty_prestige_i][GetPlayer.MakeScope.ScriptValue('RICE_ancestor_max_dynasty_prestige_large_value')]#!\n\n#weak 我们来到这里是因为祖先，他们配得上最好的祭品！毕竟没有他们我们无法有如此成就！#!"
 RICE_venerate_ancestors_veneration_phase:0 "追悼"
 RICE_venerate_ancestors_veneration_phase_desc:0 "没有祖先，我们什么都不是。"
 RICE_venerate_ancestors_respect_intent_header:0 "追悼："
 RICE_venerate_ancestors_respect_intent:0 "追悼"
 RICE_venerate_ancestors_respect_intent_desc:0 "通过追悼祖先，从而肯定自己。"
 RICE_venerate_ancestors_completed_log_title:0 "完成了祭奠先祖"
 RICE_venerate_ancestors_completed_log:0 "[CHARACTER.GetShortUIName|U][CHARACTER.GetHerHis]完成了祭奠先祖"
 RICE_venerate_ancestors_offering_amount:0 "祭品规模"
 TRAVEL_NAME_FOR_activity_RICE_venerate_ancestors:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_venerate_ancestors$"
