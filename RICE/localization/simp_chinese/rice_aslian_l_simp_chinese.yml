 RICE_aslian_performed_siwaac_blood_sacrifice:0 "亚斯里血祭（Siwaac）"
 RICE_aslian_performed_siwaac_blood_sacrifice_desc:0 "这个角色最近因为雷暴举行了一场血祭，以安抚雷神。"
 RICE_austroasiatic_wise_tiger_modifier:0 "向智慧虎灵献祭"
 RICE_austroasiatic_majestic_tiger_modifier:0 "向英武虎灵献祭"
 rice_austroasiatic_retributive_tiger_modifier:0 "向施惩虎灵献祭"
 RICE_austroasiatic_savage_tiger_modifier:0 "向凶残虎灵献祭"
 RICE_SEA_tropical_good_modifier:0 "被收获的雨林产品"
 RICE_SEA_tropical_good_modifier_desc:0 "这一角色收集了大量只在东南亚雨林之中才有的珍稀货物，供其社区使用。\n\n#weak 解锁[interaction|E]与#!其他[rulers|E]#!#V 交易珍稀热带产品"
 RICE_SEA_tropical_good_trade_modifier:0 "获得了雨林产品"
 RICE_SEA_tropical_good_trade_modifier_desc:0 "该角色通过与居住在雨林的人贸易，得到了大量只在东南亚雨林之中才有的珍稀货物。"
 RICE_opinion_southeast_asian_rare_goods_trade:0 "被交易的雨林产品"
 RICE_southeast_asian_local_trade_networks:0 "扩展本地东南亚商业网络"
 RICE_aslian_bah_lud:0 "巴卢"
 RICE_aslian_bah_lud_desc:0 "尽管[Glossary( '巴', 'BAH_MALAYSIA_GLOSS' )]卢外表上看体弱多病，但传言称这只是伪装以欺骗其敌人。更有传言称他得到了强大到[Glossary( '古尼格', 'GUNIG_GLOSS' )]精魂的保护。"
 RICE_aslian_siwang_ritual_halaa_modifier:0 "作为哈拉准备通灵仪式"
 RICE_SEA_sea_nomads_modifier:0 "海上游民之潮"
 RICE_SEA_sea_nomads_modifier_desc:0 "这一角色与东南亚的海上游民氏族有政治和经济联系。\n\n#weak 解锁[decision|E]以#bold $RICE_SEA_manage_sea_lanes$#!"
 RICE_SEA_manage_sea_lanes_modifier:0 "批准海上游民存在"
 RICE_SEA_manage_sea_lanes_modifier_desc:0 "本地统治者雇佣海上游民氏族以鼓励贸易和抑制这一区域的海上敌人攻击。"
 RICE_aslian_blood_sacrifice_decision:0 "准备血祭"
 RICE_aslian_blood_sacrifice_decision_tooltip:0 "当雷声落下，我们都无比恐惧"
 RICE_aslian_blood_sacrifice_decision_desc:0 "雷声临近意味着雷神因我们破坏禁忌或不道德的行为而愤怒，但是用我自己鲜血的简单血祭可能足够平息它们了。"
 RICE_aslian_blood_sacrifice_decision_effect_tooltip_1:1 "如果你是处于月经周期（#V 45#!岁以下）的成年#V 女性#!，这一[decision|E]减少更多[stress_loss_i|E][stress|E]并给予更多[piety_i|E][piety|E]。"
 RICE_aslian_blood_sacrifice_decision_confirm:0 "干吧！"
 RICE_aslian_blood_sacrifice_decision_context_tooltip:0 "#emphasis 历史背景：#!许多[Glossary( '亚斯里人', 'ORANG_ASLI_GLOSS' )]传统上认为雷暴是愤怒的神灵意图惩罚其道德过错而导致的，只能由小型血祭来安抚。不过有趣的是，对于一些亚斯里人来说雷神令人畏惧但是也被轻视——毕竟只要用仪式略施小计就能获得宽恕，那不是很容易被捉弄的二傻子嘛。"
 RICE_austroasiatic_tiger_god_decision:0 "向虎灵献祭"
 RICE_austroasiatic_tiger_god_decision_tooltip:0 "老虎必须被尊重，无论它以何种形态现身"
 RICE_austroasiatic_tiger_god_decision_desc:0 "虎灵是[ROOT.Char.GetFaith.GetName]世界观的组成部分。无论因为恐惧，尊敬，奉献或是其他什么原因，定期献祭给虎灵是必要的。"
 RICE_austroasiatic_tiger_god_decision_effect_tooltip_1:1 "从[decision|E]里获得的[character_modifier|E]取决于你的[faith|E]是否有#V $rice_doctrine_austroasiatic_tiger_god_name$#![doctrine|E]"
 RICE_austroasiatic_tiger_god_decision_confirm:0 "准备献祭！"
 RICE_austroasiatic_tiger_god_decision_context_tooltip:0 "#emphasis 历史背景：#!世界各地对老虎的崇拜并不罕见，但在不少[Glossary( '南亚语系', 'AUSTROASIATIC_GLOSS' )]人群中，虎是许多传统习俗中的核心。有理论认为南亚其他民族（如侗台或南岛语民族）的虎崇拜来自于南亚语人群的影响。"
 RICE_SEA_harvest_rare_tropical_goods_decision:0 "收获热带珍货"
 RICE_SEA_harvest_rare_tropical_goods_decision_tooltip:0 "我们需要努力收集与外乡人交易的货物"
 RICE_SEA_harvest_rare_tropical_goods_decision_desc:0 "[GetGeographicalRegion('world_asia_southeast').GetName]充满丰富物资，我们和祖先世代都在利用这些资源。我们可以通过可持续的方式收获它们，以造福我们自己的社区。"
 RICE_SEA_harvest_rare_tropical_goods_decision_effect_tooltip_1:1 "当[GetModifier('RICE_SEA_tropical_good_modifier').GetNameWithTooltip][modifier|E]生效时，你将能够与其他[rulers|E]使用#V 交易热带珍货#![interaction|E]"
 RICE_SEA_harvest_rare_tropical_goods_decision_confirm:0 "丰收吧！"
 RICE_SEA_harvest_rare_tropical_goods_decision_context_tooltip:0 "#emphasis 历史背景：#!数千年间，东南亚一直是许多备受追捧的奢侈品（如香料、香木和极乐鸟）的来源地。在很多地方，某些族群专门采集这些资源，并将其与来自更城市化国家的人进行交易，后者再将这些资源出口到外国市场。例如，生活在现代柬埔寨和泰国边境的色玛族历史上就是采集豆蔻的专家。"
 RICE_SEA_manage_sea_lanes_sea_nomad:0 "管理附近海域"
 RICE_SEA_manage_sea_lanes:0 "引导海上游民管理邻近海域"
 RICE_SEA_manage_sea_lanes_tooltip:0 "东南亚的海上游民深知水性，鲜有人能及。"
 RICE_SEA_manage_sea_lanes_desc_sea_nomad:0 "我们这些来自[GetGeographicalRegion('world_asia_southeast').GetName]的[Glossary( '海上游民', 'SEA_NOMADS_GLOSS' )]，一生中大部分时间都在海上度过。加强对附近海域的控制，对于维护我们的繁荣至关重要。"
 RICE_SEA_manage_sea_lanes_desc:0 "来自[GetGeographicalRegion('world_asia_southeast').GetName]的[Glossary( '海上游民', 'SEA_NOMADS_GLOSS' )]一生中大部分时间都在海上度过，我们可以利用与他们来维持我们海域的繁荣。"
 RICE_SEA_manage_sea_lanes_effect_tooltip_1:1 "该[decision|E]的[gold_i|E][gold|E]花费取决于你在拥有多少个沿海[counties|E]。"
 RICE_SEA_manage_sea_lanes_confirm:0 "丰收吧！"
 RICE_SEA_manage_sea_lanes_context_tooltip:0 "#emphasis 历史背景：#!尽管在现代社会遭受歧视与边缘化，东南亚的[Glossary( '海上游民', 'SEA_NOMADS_GLOSS' )]历史上却是该地区政治与经济的重要参与者。例如，统治者常会有意识地与不同的海上游民群体合作以保护贸易路线、协助商人，或雇佣他们充当海盗与佣兵。"
