 RICE_aslian_aspiration_bah_lud_desc: "#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持#V 塞诺#!或#V 塞芒#![culture|E]（或作为其分支[culture|E]）\n$EFFECT_LIST_BULLET$保持#V 亚斯里#![faith|E]\n$EFFECT_LIST_BULLET$在[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )][trait|E]道路上获得#V 100#!点[trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$拥有至少[gold_i|E]#V [EmptyScope.ScriptValue('RICE_aspiration_tiny_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$[prestige_level|E]不低于[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]且[piety_level|E]不低于[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$至少完成一次#bold $activity_RICE_aslian_siwang_ritual$#![activity|E]\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$升级你的[education_trait|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$至少采用一次#bold $RICE_aslian_blood_sacrifice_decision$#![decision|E]（完成奖励：获得一个[intrigue_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$至少采用一次#bold $RICE_austroasiatic_tiger_god_decision$#![decision|E]（完成奖励：获得一个[martial_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$至少完成两次#bold $activity_RICE_aslian_siwang_ritual$#![activity|E]（完成奖励：获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]）\n$EFFECT_LIST_BULLET$成功对其他[ruler|E]使用一次#bold $RICE_southeast_asian_tropical_goods_interaction$#![interaction|E]（完成奖励：获得一个[stewardship_lifestyle|E][perk|E]）"
