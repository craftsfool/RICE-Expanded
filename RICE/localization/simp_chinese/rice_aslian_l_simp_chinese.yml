 building_type_RICE_aslian_gunung_mulu_caves_desc:0 "这片地区的山脉中隐藏着庞大的洞穴系统，人在其中极易迷失方向，这里被石灰岩地貌与看似无边无际的丛林环绕，展现出无与伦比的自然之美。"
