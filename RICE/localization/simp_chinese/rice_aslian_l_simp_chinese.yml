 aslian.0080.t:0 "关于乱伦的噩梦"
 aslian.0080.desc:0 "昨夜我做了个可怕的梦，不过好在有惊无险……\n\n当时我和我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('relative'))][relative.GetTitledFirstName]正在家中，突然看见一条巨蟒凭空出现！我吓得大叫，幸好[relative.GetFirstNameNoTooltip]反应迅速，赤手空拳与它搏斗，就在[relative.GetSheHe]杀死它时，我惊醒了，浑身是汗。\n\n精通[ROOT.Char.GetFaith.GetAdjective]传统的长者常说，梦中出现的蟒蛇是#italic 梦魂#!所暗示的乱伦。若梦见此物，必须立即将其斩杀，因为乱伦之梦乃是最凶险的噩梦之一，往往预示着灾祸，甚至可能是死亡的先兆。\n\n幸好，我没有与我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('relative'))]有过这种行为。"
 aslian.0080.a:0 "[relative.GetSheHe|U]和我暂时避开了灾祸。"
 aslian.0081.t:0 "模仿鸟叫"
 aslian.0081.desc:0 "我和[courtier.GetTitledFirstName]在外面躺着任由阳光洒在我们身上，附近的鸟儿欢快地鸣叫着。这时，我听到[courtier.GetFirstNameNoTooltip]开始自娱自乐地哼起旋律……\n\n那调子听起来简直像极了鸟鸣，我直接愣住了……\n\n“你在想什么？”我厉声问着[courtier.GetFirstNameNoTooltip]，[courtier.GetSheHe]困惑地看着我，不明白我为何生气，我提醒[courtier.GetHerHim]：\"难道你不知道[ROOT.Char.GetFaith.GetAdjective]的传说吗？你小时候没听过吗？我们不可侮辱鸟类。杀害鸟儿固然可怕，但就连模仿它们的歌声也很危险——你想招来恶灵和[ROOT.Char.GetFaith.HighGodName]惩罚我们吗？\"\n\n“我没有模仿鸟儿！”[courtier.GetFirstNameNoTooltip]抗议道，“我只是随便哼了个调子！”"
 aslian.0081.a:0 "真的？既然你这么说。"
 aslian.0082.t:0 "更多暴力？"
 aslian.0082.desc:0 "我吃饭时一分心把一盘肉和另一盘蘑菇混在了一起，我马上下意识地将它们分开了。\n\n现在我该怎么办？我们[ROOT.Char.GetFaith.GetAdherentNamePlural]必须避免肉盒鱼或蘑菇混在一起，因为这种行为本身就充满暴力，可能给我们招来灾祸！"
 aslian.0082.a:0 "赶紧把肉吃掉，希望没人注意到。"
 aslian.0083.t:0 "竹制设备"
 aslian.0083.desc:0 "最近我住处周围多了各种危险和恼人的动物，鸟类、蛇类，甚至更大的动物都被人目击到了。幸运的是，我们[ROOT.Char.GetCulture.GetCollectiveNoun]对此类问题有一个很好的解决方案。\n\n因此，我今天将和一些人一起外出，竖立一些木桩，然后在上面挂上空心的竹筒。竹筒敲击木桩发出的响亮声音通常能吓跑大多数动物。"
 aslian.0083.a:0 "多亏了祖先们传授给我们的智慧。"
 aslian.0084.t:0 "丛林向导"
 aslian.0084.desc:0 "在[county.GetNameNoTier]有一片区域，旅人常常在那里遇到危险。\n\n不过，我听说当地一些原住民知晓能避开这些危险的古老小路。或许只要我出价够高，就能说服一些原住民引导人们穿梭那片区域，这样商人、士兵、信使和仆从都可以使用。"
 aslian.0084.a:0 "我们应该找一些愿意带路的向导。"
