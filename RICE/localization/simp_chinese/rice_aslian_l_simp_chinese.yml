 aslian.0002.t:0 "xxxx[courtier.GetCulture.GetNameNoTooltip]人"
 aslian.0002.desc:0 "[Glossary( '亚斯里人', 'ORANG_ASLI_GLOSS' )]世代以来一直生活在[GetGeographicalRegion('world_asia_malaysia').GetName]的丛林与山丘深处。\n\n该地区的统治者们常年与他们互相合作，因为他们知晓当地资源分布。如今，这样的机会也摆在了我的面前。\n\n一个名叫[courtier.GetFirstName]的[courtier.GetCulture.GetName]族中的重要人物主动找上我，希望我能与[courtier.GetCulture.GetCollectiveNounNoTooltip]建立良好关系。我们可以共同保护当地，进行贸易往来，并加强我们的政治联系。"
 aslian.0002.a:0 "$aslian.0005.a$"
 aslian.0003.t:0 "xxxx"
 aslian.0003.desc:0 "xxxx"
 aslian.0003.a:0 "xxxx"
 aslian.0004.t:0 "xxxx"
 aslian.0004.desc:0 "xxxx"
 aslian.0004.a:0 "xxxx"
 aslian.0005.t:0 "[courtier.GetCulture.GetNameNoTooltip]海上游民"
 aslian.0005.desc:0 "居住在[GetGeographicalRegion('world_asia_southeast').GetName]的[Glossary( '海上游民', 'SEA_NOMADS_GLOSS' )]的一生与大海习惯，这令世界各地经验最丰富的水手都相形见绌。\n\n多年来，该地区的统治者始终明智地与他们保持合作。而今，我也有这样的机会。\n\n一个名叫[courtier.GetFirstName]的[courtier.GetCulture.GetName]族中的重要人物主动找上我，希望我能与途经或邻近我领地的[courtier.GetCulture.GetCollectiveNounNoTooltip]建立良好关系。我们可以共同保护海域，开展贸易，并加强政治联系。"
 aslian.0005.a:0 "我欢迎与你们建立友谊！"
 aslian.0005.b:0 "留在我的宫廷，让我们关系更进一步！"
 aslian.0005.c:0 "我对你们这类人不感兴趣。"
 aslian.0006.t:0 "xxxx"
 aslian.0006.desc:0 "xxxx"
 aslian.0006.a:0 "xxxx"
 aslian.0007.t:0 "xxxx"
 aslian.0007.desc:0 "xxxx"
 aslian.0007.a:0 "xxxx"
