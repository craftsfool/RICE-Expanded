 activity_RICE_aslian_siwang_ritual:0 "通灵仪式"
 activity_RICE_aslian_siwang_ritual_desc:0 "通灵仪式能帮助我们治愈身体和灵魂的疾病，而这需要[Glossary( '古尼格', 'GUNIG_GLOSS' )]精魂的协助，他们因为胆小，只应在夜晚沟通。"
 activity_RICE_aslian_siwang_ritual_selection_tooltip: "组织一场通灵仪式\n\n$RICE_aslian_siwang_ritual_context_tooltip$"
 activity_RICE_aslian_siwang_ritual_host_desc: "\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress|E] 失去\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$获得#P 正面#![modifier|E]\n对任何满足条件的参与者，在[GetTrait('lifestyle_mystic').GetName(GetNullCharacter)] [trait|E]的$BULLET_WITH_TAB$[trait_level_track_xp|E]"
 activity_RICE_aslian_siwang_ritual_guest_desc: "$activity_RICE_aslian_siwang_ritual_host_desc$"
 activity_RICE_aslian_siwang_ritual_province_desc: "通灵仪式将在此举行。"
