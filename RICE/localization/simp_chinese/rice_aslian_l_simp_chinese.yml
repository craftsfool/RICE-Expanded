 aslian.0040.t:0 "着手准备"
 aslian.0040.desc:0 "我们将很快举行一场#italic 通灵仪式#!，以召唤仁慈的灵怪来帮助我们繁荣。\n\n在开始之前，重要的是要决定谁将成为[ROOT.Char.GetFaith.GetAdjective]$senoi_pagan_priest$，这位精神导师将带领我们完成仪式。按照惯例，他们将不允许参与仪式的准备工作。"
 aslian.0040.a:0 "我将作为$senoi_pagan_priest$主持这个仪式"
 aslian.0040.a.tooltip:0 "你将作为$senoi_pagan_priest$主持仪式，在[activity|E]结束时获得额外的[prestige_i|E][prestige|E]与[piety_i|E][piety|E]，并在[GetTrait('lifestyle_mystic').GetName(GetNullCharacter)][trait|E]中获得[trait_level_track_xp|E]（前提是你拥有此特质），且同时会增加[stress_gain_i|E][stress|E]。"
 aslian.0040.b:0 "[candidate.GetFirstNameNoTooltip]可以作为$senoi_pagan_priest$领导这个仪式"
 aslian.0040.b.tooltip:0 "作为主持仪式的$senoi_pagan_priest$，[candidate.GetFirstName]将在[activity|E]结束时获得额外的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]，并在[GetTrait('lifestyle_mystic').GetName(GetNullCharacter)][trait|E]中获得[trait_level_track_xp|E]（前提是拥有此特质），且会增加[stress_gain_i|E][stress|E]。"
 aslian.0040.c:0 "我们可以请当地的$senoi_pagan_priest$来主持这个仪式。"
 aslian.0041.t:0 "舞蹈与歌唱"
 aslian.0041.desc:0 "夜幕降临，我们围聚一堂，#italic 通灵仪式#!即将开始。由于魂灵害怕光明且十分怯懦，因此仪式必须在夜间进行。\n\n我们准备好鼓和长芦等乐器然后聚在一起，准备起舞并吟唱古老的歌谣。我们将治愈疾病、迎接宾客、家人与朋友，召唤善灵，并驱除恶灵……"
 aslian.0041.a:0 "让我们开始吧!"
 aslian.0042.t:0 "日出"
 aslian.0042.desc:0 "太阳开始在[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]上方升起，#Italic 通灵仪式#!也接近尾声。\n\n我们虽然疲惫，但每次仪式后都感到精神焕发，显然善良魂灵已前来相助，而恶灵则被驱逐。"
 aslian.0042.a:0 "愿我们共同健康，繁盛成长。"
