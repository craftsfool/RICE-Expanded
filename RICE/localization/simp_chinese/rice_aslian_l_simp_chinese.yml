 activity_RICE_aslian_siwang_ritual_guest_help_text: "$activity_RICE_aslian_siwang_ritual$"
 activity_RICE_aslian_siwang_ritual_predicted_cost: "旅行的费用主要取决于你的[income|E]。"
 activity_RICE_aslian_siwang_ritual_conclusion_desc: "[GetActivityType( 'activity_RICE_aslian_siwang_ritual' ).GetName]已经结束，我们在[Glossary( '古尼格', 'GUNIG_GLOSS' )]的帮助下再次焕发活力。"
 RICE_aslian_siwang_ritual_healing_phase: "庆典"
 RICE_aslian_siwang_ritual_healing_phase_desc: "$senoi_pagan_priest$将召唤其[Glossary( '古尼格', 'GUNIG_GLOSS' )]治愈并使我们重现活力。"
 RICE_aslian_siwang_ritual_healing_intent_header: "祭祀："
 RICE_aslian_siwang_ritual_healing_intent: "祭祀"
 RICE_aslian_siwang_ritual_healing_intent_desc: "这是一个治愈、享受生活、向我们的祖先和善灵祈祷的时段。"
