 RICE_aslian_orang_asli_guides:0 "马来西亚原住民丛林向导"
 RICE_aslian_orang_asli_guides_desc:0 "统治者招募了马来西亚半岛的原住民来帮助引导旅行者穿越这个地区的危险地带。这些当地人知道安全的小径，可以避开大部分危险。"
 aslian.0002.b:0 "$aslian.0005.b$"
 aslian.0002.c:0 "$aslian.0005.c$"
 aslian.0010.info:0 "#emphasis 历史背景：#!塞迈人是[Glossary( '亚斯里语系', 'ORANG_ASLI_GLOSS' )]中最大的群体。许多塞迈的传说都涉及一个名叫卢的人，他表面上看起来身体虚弱，但其实拥有多种才能，全拜[Glossary( '古尼格', 'GUNIG_GLOSS' )]护身灵所赐。在一个冒险故事中，他从怪物手中救出了马来国王的女儿，并因此获准娶她为妻。"
 aslian.0031.desc.actor:0 "[recipient.GetTitledFirstName]已与我们联系，希望协商一项对双方都有利的贸易协议。因为我们[actor.GetCulture.GetName]人在收集特殊热带珍货方面是专家，然后他们可以通过与国内外商人将这些商品以高价出售。\n\n这都我们有利，我们已经同意暂时与他们合作。"
 aslian.0031.desc.recipient:0 "我已联系附近的[actor.GetCulture.GetName]部落，希望能达成对双方都有利的贸易协议。这些部族擅长采集特殊的热带珍货，而我们有商人贸易网络联系，能在海外市场高价出售这些货物。\n\n所以他们的首领[actor.GetTitledFirstName]已同意暂时与我们合作。"
 aslian.0080.info:0 "#emphasis 历史背景：#!从20世纪60年代开始，关于塞诺人的文化和信仰（特别是在梦和清醒梦方面），出现了一些争议性说法。一些学者认为这些说法是西方想象和对塞诺族误解的产物。但不管怎么说，梦在塞诺伊文化中占有重要地位。[Glossary( '古尼格', 'GUNIG_GLOSS' )]在其梦中的显现，会让哈拉（大致相当于萨满）成为仪式执行者，而且梦见乱伦等特定事物被视为危险临近的征兆，因此必须阻止此类噩梦发生，例如在梦中杀死“承载”噩梦的蛇。"
 aslian.0081.b:0 "你的谎言会害了你自己。"
 aslian.0081.info:0 "#emphasis 历史背景：#!在塞诺人观念里，伤害或嘲弄某些动物（如鸟类）被认为是禁忌。这样做被认为会招致灾难，甚至死亡。"
 aslian.0082.b:0 "处理掉这个，祈求神灵宽恕我。"
 aslian.0082.info:0 "#emphasis 历史背景：#!在许多原住民中，将肉类与某些食物（如鱼或蘑菇）混合被认为是禁忌。这样做被认为是不尊重死去的动物，在某种意义上是对肉的进一步侮辱。"
 aslian.0083.info:0 "#emphasis 历史背景：#![Glossary( '亚斯里人', 'ORANG_ASLI_GLOSS' )]在日常生活中广泛使用竹子，从驱赶动物到乐器，再到吹箭武器，他们发现了许多利用竹子的方法。"
 aslian.0084.b:0 "我们没有时间和资源做这件事。"
 aslian.0084.info:0 "#emphasis 历史背景：#!在马来半岛内陆的许多地区的[Glossary( '亚斯里原住民', 'ORANG_ASLI_GLOSS' )]自古以来一直广泛使用各种丛林小径。其中一些小径沿着山脊顶部或跟随野生大象留下的足迹，那些希望穿越这些地区的外来者都会带着原住民作为向导。"
 building_type_RICE_aslian_mount_kinabalu:0 "京那巴鲁山"
 building_type_RICE_aslian_mount_kinabalu_desc:0 "京那巴鲁山长期以来深受周边居民敬仰，被视为人们逝去后灵魂栖息之地，同时它也是婆罗洲的最高的山峰，巍然屹立于岛上的丘陵与密林之上，气势恢宏。"
 building_RICE_aslian_mount_kinabalu:0 "$building_type_RICE_aslian_mount_kinabalu$"
