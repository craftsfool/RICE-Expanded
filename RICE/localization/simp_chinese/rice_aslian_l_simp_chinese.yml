 aslian.0020.t:0 "血祭"
 aslian.0020.desc:0 "大雨倾盆而下，雷声震地。我们都知道这场雷雨是为什么而来——雷神[ROOT.Char.GetFaith.HighGodName]正在惩罚我们。\n\n我们中有人触犯了禁忌，行了恶事却不知悔改，强迫他人违背意愿行事，或是做了许多不道德的事情都有可能导致这种大雨出现。\n\n当其他人尖叫着四处逃窜时，我们几个人抓起附近的竹片，在小腿上划出浅浅的伤口。随着雨水和雷声继续，我们急忙用勺子接住流下的血，然后泼向天空。\n\n“原谅我们吧，[ROOT.Char.GetFaith.HighGodName]！我们不是故意作恶的！”我们呼喊着，希望在#italic 血祭#!仪式中表现得真诚，让这个愚蠢的神明相信并放过我们。"
 aslian.0020.a:0 "暴雨最终停了，我们松了一口气。"
 aslian.0021.t:0 "虎灵"
 aslian.0021.desc:0 "在[ROOT.Char.GetFaith.GetAdjective]传说中，虎灵拥有强大的超自然力量，而且这些灵体会惩罚那些未能坚守我们价值观和生活方式的人，必须通过频繁的供奉来安抚。"
 aslian.0021.a:0 "虎灵啊，接受这些祭献吧！"
