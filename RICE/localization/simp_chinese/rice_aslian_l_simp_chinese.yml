 aslian.0010.t:0 "英雄的诞生"
 aslian.0010.desc:0 "在我的一生中，许多人都认为我是个弱者，毕竟我的身体看起来孱弱，面也如土色。\n\n但有些人不知道的是，我有强大的朋友们——[Glossary( '古尼格', 'GUNIG_GLOSS' )]护身灵，它们多年来一直庇佑着我。在它们的帮助下，我隐藏了自己的真实力量。\n\n如果一个\"弱者\"救下了像[inak.GetFirstName]这样美丽的公主，并赢得了她的芳心，他真的是弱者吗？如果一个\"弱者\"保护了众多人免受土匪、海盗和恶灵的侵害，他真的是弱者吗？\n\n英雄有各种形态与大小，而凭借[Glossary( '古尼格', 'GUNIG_GLOSS' )]护身灵的帮助，我将成为一位让[ROOT.Char.GetCulture.GetCollectiveNoun]人民世代铭记的英雄！"
 aslian.0010.a:0 "英雄时造，而非天生。"
 aslian.0011.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 aslian.0011.desc:0 "只有蠢货才会因我“柔弱”的外表而轻视我。历经无数次冒险，通过以各种方式帮助当地的[ROOT.Char.GetCulture.GetCollectiveNoun]人，我已成长为族人中伟大的英雄。\n\n关于我事迹的传说正在流传，其中不乏夸大之处——但我又怎能忍心剥夺人们讲述精彩故事的权利呢？\n\n然而我始终铭记，是[Glossary( '古尼格', 'GUNIG_GLOSS' )]护身灵给予我的帮助，它们助我在敌人面前隐藏能力，在无数次梦境相会中赐予我克敌制胜的智慧与学识，我将在余生中永远铭记并感激他们。"
 aslian.0011.a:0 "这仅仅是我冒险的开始！"
