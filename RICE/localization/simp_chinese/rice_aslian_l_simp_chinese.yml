 RICE_aslian_aspiration_become_semai_hero_desc: "#italic 在他的[Glossary( '古尼格', 'GUNIG_GLOSS' )]指引下，利德击退了他的敌人，帮助了他的部民，成为了传奇英雄。#!$RICE_aslian_aspiration_bah_lud_desc$"
