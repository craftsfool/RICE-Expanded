 aslian.0030.t:0 "稀有热带珍货"
 aslian.0030.desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]人比任何人都更了解这片土地，我们知道在哪里能找到那些外人难以寻觅的稀有物品，从珍贵的宝贝、药用植物，再到新奇异兽。\n\n我已派社区成员去寻找其中一些物品。这些产品中有许多对我们的日常生活非常有用，我们可以留出一部分卖给过往的商人，因为外国人常常渴望这些“异域”商品。"
 aslian.0030.a:0 "我们对这片土地的了解鲜有人能及。"
 aslian.0030.tooltip:0 "只要[GetModifier('RICE_SEA_tropical_good_modifier').GetNameWithTooltip][modifier|E]处于激活状态，即可使用#V $RICE_southeast_asian_tropical_goods_interaction$#![interaction|E]"
 aslian.0031.t:0 "$aslian.0030.t$"
 aslian.0031.desc:0 "这样一来，我们还将建立更紧密的政治与个人联系！"
 aslian.0031.a:0 "我们双方都将从中受益！"
