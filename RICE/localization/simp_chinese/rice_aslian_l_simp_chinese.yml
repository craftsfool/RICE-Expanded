 RICE_aslian_siwang_ritual_context_tooltip: "#emphasis 历史背景：#!通灵仪式是塞诺文化（即最大的[Glossary( '原住亚斯里人群', 'ORANG_ASLI_GLOSS' )]）中的各类仪式。在仪式期间，一位名为“哈拉”的仪式专家会与[Glossary( '魂灵', 'GUNIG_GLOSS' )]沟通，以通过治疗、保护人们免受伤害、驱除邪灵等方式来帮助人们。"
