 aslian.0050.t:0 "与海上游民合作"
 aslian.0050.desc:0 "我与一些居住或途经我统治水域的[Glossary( '海上游民', 'SEA_NOMADS_GLOSS' )]保持着良好关系。最近，我会见了他们的一些首领，从而促进我们共同的经济和政治利益。\n\n一如既往，作为贸易和政治特权的交换，这些游民将竭尽全力保护这些水域免受敌人侵犯，并协助途经此地且受我庇护的旅行者和商人。"
 aslian.0050.a:0 "我很高兴我们有如此富有成效的合作！"
