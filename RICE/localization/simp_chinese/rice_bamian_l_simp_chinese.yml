 bamian.0040.t:0 "红城"
 bamian.0040.desc:0 "在[GetTitleByKey('c_bamian').GetNameNoTier]山谷的东侧，有一个古老的堡垒群。有人称之为#italic 红城#!，或#italic 佐哈克#!之城。\n\n根据伊朗传说，#italic 佐哈克#!是英雄时代的传奇中最邪恶，最残忍的巫师王。没人知道这座城堡为何会与#italic 佐哈克#!相联系，但这个名字确实令人生畏。\n\n无论如何，几个世纪以来，历代国王和军阀都在不断翻修和改造这座堡垒。它占据着山谷最东端的战略要地，可以轻松控制军队和贸易的流动。我需要对这座要塞进行修缮，但我愿意在这个项目上花费多少钱呢？"
 bamian.0040.a:0 "小修小补是目前所需要的"
 bamian.0040.b:0 "不多不少的钱财恰好够"
 bamian.0040.c:0 "是时候花上大笔钱来改造了"
