 RICE_bamian_siman_tov_modifier: "梵衍那的犹太显贵"
 RICE_bamian_siman_tov_modifier_desc: "西满·托夫的父亲耶胡达·本·丹尼尔是阿薄健当地城市精英的一员。与该地区其他不经常从事农业的犹太人不同，他的父亲产业跨越多个行业，同时是地主、商人、放债人，甚至税官的身份。因此，西满·托夫继承了父亲的地位和事业。"
 RICE_bamian_shahr_e_zohak_recently_repaired_small:0 "近期对红城进行的小规模维修"
 RICE_bamian_shahr_e_zohak_recently_repaired_medium:0 "近期对红城进行的一般维修"
 RICE_bamian_shahr_e_zohak_recently_repaired_large:0 "近期对红城进行的大规模维修"
 RICE_bamian_offerings_siddhartha_modifier:0 "梵衍那悉达多佛像的额外供品"
 RICE_bamian_offerings_vairocana_modifier:0 "向梵衍那的毗卢遮那佛像供奉的额外供品"
 RICE_bamian_visit_sightseeing_intent_modifier:0 "欣赏梵衍那佛像附近景点"
 RICE_bamian_visit_inspired_intent_modifier:0 "参观梵衍那佛像后的启发"
 RICE_bamian_visit_examination_intent_modifier:0 "对梵衍那佛像的研究和思考"
 RICE_bamian_visit_romantic_intent_modifier:0 "欣赏关于梵衍那佛像的传说"
 RICE_bamian_visit_understanding_intent_modifier:0 "与佛教徒交谈"
 RICE_bamian_hiwi_al_balkhi_modifier:0 "饱受争议的学者"
 RICE_bamian_hiwi_al_balkhi_modifier_desc:0 "很少有人能像犹太学者海崴·巴勒希一样引发如此多的争议，这位怀疑者最著名的作品是他的#italic 《二百个问题》#!。让许多犹太人谴责他是异端，甚至是无神论者。然而，可能有更多的人认为他是一位激进的思想家，他并不想废除宗教，而是希望不受圣经的束缚，更好地理解上帝的真实本质。"
 RICE_bamian_muslim_understanding_buddhists:0 "思考穆斯林与佛教徒的相似之处"
 RICE_bamian_cliche_poetry:0 "书写关于佛像面孔的老套诗歌"
 RICE_bamian_supported_buddhist_translators:0 "受资助的远东佛教译者"
 RICE_bamian_trapusa_and_bhallika_modifier:0 "受帝履富娑与婆梨迦启发"
 RICE_bamian_repair_shahr_e_zohak:0 "修复红城"
 RICE_bamian_repair_shahr_e_zohak_tooltip:0 "这些保卫[GetTitleByKey('c_bamian').GetNameNoTier]的防御工事正需修复"
 RICE_bamian_repair_shahr_e_zohak_desc:0 "坐落于[GetTitleByKey('c_bamian').GetNameNoTier]山谷战略要冲的红城（佐哈克城堡）是呼罗珊最令人印象深刻的堡垒之一。通过修复这座要塞城市，我们可以确保这一地区免遭外来威胁，为商贾和旅人提供安全保障。"
 RICE_bamian_repair_shahr_e_zohak_confirm:0 "发送修缮物资！"
 RICE_bamian_repair_shahr_e_zohak_effect_tooltip_1:0 "根据你提供的修缮资金多少，你将获得[prestige_i|E][prestige|E]和[dynasty_prestige_i|E][dynasty_prestige|E]"
 RICE_bamian_repair_shahr_e_zohak_effect_tooltip_2:0 "[GetTitleByKey('c_bamian').GetNameNoTier]将获得#P 正面的#![county_modifier|E]以提升[fort_level_i|E][fort_level|E|E]，[development_i|E][development|E]，@garrison_icon![garrison|E]规模，和[control_i|E][control|E]"
 RICE_bamian_repair_shahr_e_zohak_effect_tooltip_3:0 "[modifier|E]的强度取决于提供多少资金在修缮上#weak （最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')]）#!"
 RICE_bamian_repair_shahr_e_zohak_context_tooltip:0 "#emphasis 历史背景：#!红城（亦称为佐哈克城堡）是阿富汗有史以来最令人印象深刻的防御工事之一，一位学者甚至称其为“阿富汗的骑士堡”。该要塞曾先后被嚈哒人、伽色尼王朝、古尔王朝和帖木儿帝国占领。佐哈克是波斯神话中的邪恶人物，虽然不清楚为什么要塞以他的名字命名，但据说他是附近的古尔王朝的祖先。传说成吉思汗摧毁了这座要塞，并屠杀了城中所有居民，以报复他的孙子在被围困时的死亡。"
 RICE_bamian_shahr_e_zohak_recently_repaired_req:0 "红城近期没有进行过维修"
