 activity_RICE_bamian_buddhas_non_buddhist_visit:0 "$c_bamian$参观之旅"
 activity_RICE_bamian_buddhas_non_buddhist_visit_desc:0 "伊斯兰世界的学者与诗人将$c_bamian$的雕像称作#italic 奇迹#!，我应该去这些雕像所在的瑰丽山谷游览，欣赏[GetPlayer.GetFaith.CreatorNamePossessive]的伟大作品。"
 activity_RICE_bamian_buddhas_non_buddhist_visit_selection_tooltip: "参观$c_bamian$的著名雕像\n\n$activity_RICE_bamian_buddhas_non_buddhist_visit_context_tooltip$"
 activity_RICE_bamian_buddhas_non_buddhist_visit_context_tooltip:0 "#emphasis 历史背景：#!即使阿富汗已经伊斯兰化，穆斯林对巴米扬大佛的态度也随着时间和地点而有所不同，与塔利班政府在2001年摧毁这些佛像的行为形成了鲜明的对比。例如，当地的民间传说认为这两尊佛像是被变成石头的命运多舛的恋人；这些故事在生活在巴米扬数百年的哈扎拉人中有着深远的影响，以至于一些学者推测塔利班摧毁这些佛像是他们对哈扎拉人持续压迫的一部分。中世纪的伊斯兰学者和诗人将这些佛像归类，甚至赞美它们的美丽为#italic 'aja'ib#!，即令人惊叹的奇迹。例如，莫卧儿帝国的创始人巴布尔的弟弟贾汉吉尔·米尔扎在1506年进行军事远征时，特意绕道去巴米扬观光。"
 activity_RICE_bamian_buddhas_non_buddhist_visit_host_desc: "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]，以及基于[intent|E]决定是否获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$基于[intent|E]获得#P 正面#![character_modifier|E]\n$BULLET_WITH_TAB$获得[lifestyle|E][experience|E]"
 activity_RICE_bamian_buddhas_non_buddhist_visit_guest_desc: "$activity_RICE_bamian_buddhas_non_buddhist_visit_host_desc$"
 activity_RICE_bamian_buddhas_non_buddhist_visit_province_desc: ""
 activity_RICE_bamian_buddhas_non_buddhist_visit_destination_selection: "$activity_RICE_bamian_buddhas_non_buddhist_visit_province_desc$"
 activity_RICE_bamian_buddhas_non_buddhist_visit_guest_help_text: "$activity_RICE_bamian_buddhas_non_buddhist_visit$"
 activity_RICE_bamian_buddhas_non_buddhist_visit_predicted_cost: "旅行的费用主要取决于你的[income|E]。"
 activity_RICE_bamian_buddhas_non_buddhist_visit_conclusion_desc: "我们的[GetActivityType( 'activity_RICE_bamian_buddhas_non_buddhist_visit' ).GetName]已经结束。这是一次多么鼓舞人心的旅行啊！"
 RICE_bamian_buddhas_non_buddhist_visit_wonder_phase: "惊异"
 RICE_bamian_buddhas_non_buddhist_visit_wonder_phase_desc: "凝视宏伟的建筑，欣赏造物的奇迹。"
 RICE_bamian_buddhas_non_buddhist_visit_sightseeing_intent_header: "观光："
 RICE_bamian_buddhas_non_buddhist_visit_sightseeing_intent: "观光"
 RICE_bamian_buddhas_non_buddhist_visit_sightseeing_intent_desc: "欣赏大佛和附近景观的壮丽景色。获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_bamian_non_buddhist_visit_resource_value')]#![prestige|E]和[GetModifier('RICE_bamian_visit_sightseeing_intent_modifier').GetNameWithTooltip][modifier|E]，如果你有[GetTrait('content').GetName( GetNullCharacter )|U]或[GetTrait('patient').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]"
 RICE_bamian_buddhas_non_buddhist_visit_inspiration_intent_header: "启迪："
 RICE_bamian_buddhas_non_buddhist_visit_inspiration_intent: "启迪"
 RICE_bamian_buddhas_non_buddhist_visit_inspiration_intent_desc: "让这些神奇美丽的雕像激发灵魂深处的灵感。获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_bamian_non_buddhist_visit_resource_value')]#![piety|E]和[GetModifier('RICE_bamian_visit_inspired_intent_modifier').GetNameWithTooltip][modifier|E]，如果你有[GetTrait('ambitious').GetName( GetNullCharacter )|U]或[GetTrait('diligent').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]"
 RICE_bamian_buddhas_non_buddhist_visit_examination_intent_header: "调查："
 RICE_bamian_buddhas_non_buddhist_visit_examination_intent: "调查"
 RICE_bamian_buddhas_non_buddhist_visit_examination_intent_desc: "研究围绕这些雕像的艺术和传说，以便更好地深入了解它们。\n获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_bamian_non_buddhist_visit_resource_value')]#![piety|E]和[GetModifier('RICE_bamian_visit_examination_intent_modifier').GetNameWithTooltip][modifier|E]。如果你有[GetTrait('shy').GetName( GetNullCharacter )|U]或[GetTrait('zealous').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]"
 RICE_bamian_buddhas_non_buddhist_visit_romantic_intent_header: "浪漫："
 RICE_bamian_buddhas_non_buddhist_visit_romantic_intent: "浪漫"
 RICE_bamian_buddhas_non_buddhist_visit_romantic_intent_desc: "思考关于这两座雕像的民间传说，这些传说常常与不幸的恋人有关。\n获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_bamian_non_buddhist_visit_resource_value')]#![prestige|E]和[GetModifier('RICE_bamian_visit_romantic_intent_modifier').GetNameWithTooltip][modifier|E]，如果你有[GetTrait('lustful').GetName( GetNullCharacter )|U]或[GetTrait('gregarious').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]"
 RICE_bamian_buddhas_non_buddhist_visit_understanding_intent_header: "感悟："
 RICE_bamian_buddhas_non_buddhist_visit_understanding_intent: "感悟"
 RICE_bamian_buddhas_non_buddhist_visit_understanding_intent_desc: "与前来崇拜这些雕像的异教徒朝圣者交谈，以更好地了解它们。\n获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_bamian_non_buddhist_visit_resource_value')]#![prestige|E]和[GetModifier('RICE_bamian_visit_understanding_intent_modifier').GetNameWithTooltip][modifier|E]，如果你有[GetTrait('humble').GetName( GetNullCharacter )|U]或[GetTrait('compassionate').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]"
