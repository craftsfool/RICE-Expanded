 bamian.0050.t:0 "相似的仪式"
 bamian.0050.desc:0 "虽然我信奉[ROOT.Char.GetFaith.GetAdjective]的教义，但我的领地里也有一些人信仰[buddhist.GetAdjective]。\n\n我们中的许多人注意到了这些异教徒的奇怪习俗，他们在进行各种仪式时，要绕着他们的圣地走一圈。我请教了一些[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]学者和[ROOT.Char.Custom('DefaultPriestTitlePlural')]，想让他们给我解释这些人为什么要这样做，因为这让我很想起了每个虔诚的穆斯林都应该履行的朝觐。\n\n一些博学之士告诉我，我的怀疑是正确的。他们说这些做法是受到了麦加和朝觐的启发，是他们曾经信奉真主时的模糊记忆。但也有些人不同意，他们说这些做法显然是不同的。"
 bamian.0050.a:0 "或许，我们与他们并没有什么不同。"
 bamian.0050.b:0 "这些愚蠢的异教徒竟敢拒绝真信！"
 bamian.0051.t:0 "老套诗歌"
 bamian.0051.desc:0 "我正尝试写些[ROOT.Char.GetCulture.GetName]的诗篇。身为上流社会，诗歌是必须通晓的，否则会被视为无知的庸人。\n\n今夜，我苦思诗歌的主题。绞尽脑汁，我终于有了灵感：那就是佛像！\n\n在[ROOT.Char.GetFaith.GetReligion.GetAdjective]世界的学者群体中，将恋人的容颜比作#italic 佛像#!，或以对#italic 佛像#!的敬仰来隐喻爱情，是老生常谈的。但是，面对我现在的创作障碍，也只能将就着这么写。\n\n我便写下了这样的诗句：#italic 吾所爱者，容颜似佛。吾则如僧，一心礼拜……"
 bamian.0051.a:0 "虽然很老套，但我才思泉涌！"
 bamian.0052.t:0 "来自远东的瞻礼者"
 bamian.0052.desc:0 "一位名唤[monk.GetFirstName]的[buddhist.GetAdjective]僧侣自东土而来，途径我的领地，[monk.GetSheHe]宣称自己此行乃是往[GetGeographicalRegion('world_india').GetName]取经，精进[monk.GetFaith.GetAdjective]之义。\n\n如此一位博学贵客实属罕有，我将[monk.GetHerHim]引入宫中，许[monk.GetHerHim]长住直至愿离之时。[monk.GetFirstNameNoTooltip]甚至告诉我，当[monk.GetSheHe]返回故土之后，将向他人宣扬你和你那好客的国度。"
 bamian.0052.desc.buddhist:0 "作为[ROOT.Char.GetFaith.HighGodName]教导的忠实信者，我欢喜于宫中有如此一位诚心修行三宝的明睿[monk.GetWomanMan]。虽然我希望能多留[monk.GetHerHim]一些时日，但我明白[monk.GetHerHis]业力将把[monk.GetHerHim]引向[GetGeographicalRegion('world_india').GetNameNoTooltip]，以使[monk.GetSheHe]得度一切苦厄。"
 bamian.0052.desc.non_buddhist:0 "尽管我礼赞[ROOT.Char.GetFaith.HighGodName]，但我认为即使是个异教徒，像[monk.GetFirstNameNoTooltip]对[monk.GetHerHis]信仰所持的如此献身精神也值得敬佩。话又说回来了，对[monk.GetWomanMan]的殷勤接待能够让我对商贾和旅人的友善传扬于四境，这将有助于我的外交和领地的经济。"
 bamian.0052.a:0 "一路顺风！"
 bamian.0052.toast:0 "[monk.GetFullName]对你的好客印象深刻！"
 bamian.0053.t:0 "译者"
 bamian.0053.desc:0 "在我的领地中，有一些才华横溢、博学多识的[ROOT.Char.GetCulture.GetName][ROOT.Char.Custom('DefaultPriestTitlePlural')]，因为他们对哲学和宗教的精通，以及他们学习各种语言的能力而声名鹊起。他们中的一些人想要前去远东，那里据说[ROOT.Char.GetFaith.GetReligion.GetName]的影响力在不断增长，但是却没有多少[ROOT.Char.Custom('DefaultPriestTitlePlural')]精通[ROOT.Char.GetFaith.GetReligion.GetAdjective]的经典。\n\n无论如何，这些雄辩的[ROOT.Char.Custom('DefaultPriestTitlePlural')]打算通过东行传播佛法，担任渴望学习但尚无知之徒的翻译和导师，并寻求我的帮助。如果我能赞助他们的旅行，为他们提供旅行证件，甚至一些护卫。他们说，我将为帮助众生而积攒很多功德。"
 bamian.0053.a:0 "我会帮助你们完成崇高的使命。"
 bamian.0053.b:0 "我没有多余的资金来帮助你。"
 bamian.0054.t:0 "帝履富娑与婆梨迦"
 bamian.0054.desc:0 "今日我聆听[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]讲经。他们向我们具陈了佛陀的头两个弟子——#bold 帝履富娑#!与#bold 婆梨迦#!的故事。\n\n传说他们是[GetTitleByKey('c_balkh').GetNameNoTier]城的一对商人兄弟，佛陀开悟时他们恰巧路过，并献上了第一份供养。后来，为了给得到的佛陀发舍利寻得一处供奉之所，他们建立了最早的#italic 佛塔#!。\n\n无疑，这地的人民有着深厚的[ROOT.Char.GetFaith.GetReligion.GetName]历史渊源。我们必须将这两兄弟作为效法的典范。"
 bamian.0054.a:0 "他们的事迹令人感动。"
