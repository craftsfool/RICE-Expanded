 bamian.0030.t:0 "$RICEmisc.0011.t$"
 bamian.0030.desc:0 "信奉[buddhist.GetAdjective]的人都知道[GetTitleByKey('c_bamian').GetNameNoTier]的大山谷。那里有两尊雄观的发光佛像雕刻在悬崖上，分别代表了我们这个时代的古佛——悉达多（释迦牟尼）和本初佛毗卢遮那。\n\n世世代代，人们都会前往这些佛像朝圣，我也打算这样做。我已经完成了朝圣的准备工作，不久就会出发去见佛像。"
 bamian.0030.a:0 "愿佛祖保佑我们一路顺风！"
 bamian.0031.t:0 "$bamian.0021.t$"
 bamian.0031.desc:0 "当我们到达[GetTitleByKey('c_bamian').GetNameNoTier]的山谷时，所有人都欢欣鼓舞，因为山谷里的两尊巨大的佛像映入我们的眼帘。这意味着一件事情。\n\n我们立刻开始向佛像缓缓走去，一边进行宗教仪式：念诵、顶礼、焚香等等。\n\n这里的传统是，一旦看到佛像，就必须开始做这些仪式。仪式必须持续进行，直到到达佛像为止。我只希望佛陀能帮助我保持专注，不要弄错这些仪式。如果我弄错了，就要回到我第一次看到佛像的地方，重新开始。"
 bamian.0031.a:0 "我相信我一定能集中精力。"
 bamian.0031.b:0 "我必须集中精力，绝不懈怠！"
 bamian.0031.info:0 "#emphasis 历史背景：#!#italic 《群书目录》#!是10世纪伊斯兰波斯学者伊本·纳迪姆所著的一部知识汇编，书中记载了关于巴米扬佛像的一些风俗习惯。据说，朝圣者如果在前往佛像的路上没有完成必要的宗教仪式，就要回到最初看到佛像的地方，重新开始。伊本·纳迪姆之所以能知道这些信息，可能是因为巴米扬人及其部分王室成员在10世纪时仍信奉佛教。"
 bamian.0031.success:0 "你专心致志地向佛像行礼。"
 bamian.0031.failure:0 "当你走近佛像时分了神"
 bamian.0032.t:0 "倒霉的分神"
 bamian.0032.desc:0 "真倒霉！我在走向佛像的路上心神不宁，也许是被[GetTitleByKey('c_bamian').GetNameNoTier]的美景迷住了，或者是在担心家里的重要事务，又或者是在想着俗世的纷扰。\n\n不管怎样，我弄错了一些在去佛像的途中所做的[ROOT.Char.GetFaith.GetAdjective]仪式。通常，这意味着我必须回到最初看到佛像的地方，重新开始这一切……"
 bamian.0032.a:0 "这次我会更加专注！"
 bamian.0032.b:0 "我乃[ROOT.Char.GetTitleAsNameNoTooltip]，才不管这些！"
 bamian.0033.t:0 "伫立佛像前"
 bamian.0033.desc:0 "我终于到达了位于[GetTitleByKey('c_bamian').GetNameNoTier]的壮观佛像！两尊佛像高耸入云，令我和在场的所有人都感到敬畏。\n\n较大的佛像是毗卢遮那，他是代表了终极智慧和觉悟的本初佛，所有的佛陀都从祂而来。较小的佛像是悉达多，他是我们这个时代的古佛。\n\n我在走向佛像的路上已经做了许多仪式，但还有更多的事情要做，比如焚香、立誓、供养等。也许我可以多做一些供养，以表达我对[ROOT.Char.GetFaith.GetAdherentName]的虔诚。"
 bamian.0033.a:0 "只做恰好的供奉"
 bamian.0033.b:0 "向悉达多供奉"
 bamian.0033.c:0 "向毗卢遮那供奉"
 bamian.0033.d:0 "供奉两尊佛像"
 RICE_bamian_no_offerings_tooltip:0 "不给任何一尊佛像作额外的供奉"
 bamian.0034.t:0 "结束"
 bamian.0034.desc:0 "在我朝拜完[GetTitleByKey('c_bamian').GetNameNoTier]佛像并进行所有必要宗教仪式后，我可以花时间探索并更好地欣赏了这些佛像所在的地方。\n\n两座雕像周围有许多洞穴和地面，上面壁画描绘了从强大的国王到太阳神等各种主题。虽然油漆已经褪色，也不像[buddhist.GetName]信徒最初创建这个地方时那样生机勃勃，但它仍然是一个令人叹为观止的景象。\n\n虽然一个人可以花上好几天的时间仔细观察每一个洞穴，但我在这里的时间不多了，现在该回家了。"
 bamian.0034.a:0 "为了佛门三宝！"
