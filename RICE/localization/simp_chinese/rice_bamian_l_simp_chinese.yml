 activity_RICE_bamian_pilgrimage:0 "$c_bamian$大佛朝拜"
 activity_RICE_bamian_pilgrimage_desc:0 "$c_bamian$长期以来一直是佛教徒朝圣之地，宏伟的$building_type_buddhas_of_bamian_01$开凿于山间，描绘着令人尊敬的乔达摩佛与本初佛毗卢遮那佛。"
 activity_RICE_bamian_pilgrimage_selection_tooltip: "前往[GetTitleByKey('c_bamian').GetNameNoTier]进行[local_pilgrimage|E]\n\n$activity_RICE_bamian_pilgrimage_context_tooltip$"
 activity_RICE_bamian_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!在古典晚期和中世纪早期，巴米扬是大众部佛教的信仰中心，其与日后的大乘佛教有着紧密联系。著名的巴米扬大佛很可能是由突厥治下的当地嚈哒权贵主持修建的，它是后期犍陀罗艺术风格的代表之作，融合了伊朗和印度的样式与图像——例如较小的那尊佛像就有着太阳神的特征，有可能参考了伊朗的密特拉神。此外，在7世纪时的中国高僧玄奘、8世纪时的新罗高僧慧超，以及10世纪时的伊斯兰学者伊本·纳迪姆等人留下的原始资料中，都提到了络绎不绝的瞻礼者，以及与当地相联系的各种宗教仪式。"
 activity_RICE_bamian_pilgrimage_host_desc: "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$根据供奉的佛像，获得#P 加成的#![character_modifier|E]"
 activity_RICE_bamian_pilgrimage_guest_desc: "$activity_RICE_bamian_pilgrimage_host_desc$"
 activity_RICE_bamian_pilgrimage_province_desc: "[GetTitleByKey('c_bamian').GetNameNoTier]是[GetReligionByKey('buddhism_religion').GetName]信徒的重要宗教圣地。"
 activity_RICE_bamian_pilgrimage_destination_selection: "$activity_RICE_bamian_pilgrimage_province_desc$"
 activity_RICE_bamian_pilgrimage_guest_help_text: "$activity_RICE_bamian_pilgrimage$"
 activity_RICE_bamian_pilgrimage_predicted_cost: "前往[GetTitleByKey('c_bamian').GetNameNoTier][local_pilgrimage|E]费用取决于你选择的[activity_options|E]。"
 activity_RICE_bamian_pilgrimage_conclusion_desc: "我们的[GetActivityType( 'activity_RICE_bamian_pilgrimage' ).GetName]之旅终于结束，能够近距离看到$c_bamian$佛像，真是令人震撼！"
