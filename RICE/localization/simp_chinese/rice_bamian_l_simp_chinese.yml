 building_type_RICE_bamian_nowbahar_desc:0 "在古代，耨惟诃罗（源自梵语#italic nava‑vihara#!，意为“新寺院”）曾是重要的佛教学习与礼拜中心，其管理者对该地区拥有巨大的政治影响力。虽然如今它已不如往昔显赫，但无论当地居民信仰何种宗教，耨惟诃罗及其附近的土墩和废墟仍保留着一定的祭祀意义，而那些废弃建筑的残骸也可用作建筑材料。"
