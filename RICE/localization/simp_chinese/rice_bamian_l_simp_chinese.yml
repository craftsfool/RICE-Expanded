 bamian.0001.t:0 "$c_bamian$之王"
 bamian.0001.desc:0 "吾族世代统治着[GetTitleByKey('c_bamian').GetNameNoTier]。尽管全呼罗珊的宗主[caliph.GetHouse.GetName]家族信奉[islam.GetName]，但我族并未全员皈依他们的信仰，家族中坚定的[buddhist.GetName]徒比比皆是，比如我的[ROOT.Char.Custom2('RelationToMeShort', harthamah)][harthamah.GetFullName]，他曾担任哈里发的将军和总督。\n\n无论如何，[caliph.GetHouse.GetNameNoTooltip]哈里发如今已日薄西山。在这动荡不安的时代，我们必须谨慎行事。无论我们是忠于旧传统还是接受新传统，麻烦都可能在适当的时候找上门来。"
 bamian.0001.a:0 "我会像父亲一样，忠心耿耿地为[caliph.GetHouse.GetNameNoTooltip]效力。"
 bamian.0001.b:0 "如果我沿袭祖先的方式，就必须小心谨慎。"
 bamian.0001.c:0 "世事难料，愿[mahayana.HighGodName]保佑我们！"
 bamian.0001.d:0 "政治上行权宜之计，但心中则遵从佛法。"
 bamian.0001.e:0 "先知的话是正确的，我应该听从其教诲。"
 bamian.0001.stay_faith:0 "你继续信奉[GetPlayer.GetFaith.GetAdjective][faith|E]"
 bamian.0001.fake_faith:0 "你将公开信奉[ashari.GetName]，但秘密信奉[mahayana.GetAdjective][faith|E]"
