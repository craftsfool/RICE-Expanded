 bamian.0020.t:0 "$RICEmisc.0011.t$"
 bamian.0020.desc:0 "许多人都听说过[GetTitleByKey('c_bamian').GetNameNoTier]山谷的宏伟，以及雕刻在悬崖边上的巨型雕像。这些神像来历不明，但有传言说异教徒会来膜拜它们，或者说他们在过去曾经朝拜过它们。\n\n无论如何，我都计划穿越山谷，去拜访这些著名的神像，欣赏它们的美丽。"
 bamian.0020.desc.islam:0 "\n\n[ROOT.Char.GetFaith.GetReligion.GetAdjective]学者和诗人将这些雕像归类为世界奇观，毕竟没有人会抱怨[ROOT.Char.GetFaith.HighGodName]的杰作呢？"
 bamian.0020.a:0 "我等不及要看佛像了！"
 bamian.0021.t:0 "观佛"
 bamian.0021.desc:0 "我们来到了[GetTitleByKey('c_bamian').GetNameNoTier]大佛前，它们的宏伟正如诗人所描述的一般；“王城东北山阿有石佛立像，高百四五十尺，金色晃曜，宝饰焕烂”。我和我的随从都惊叹于两尊大佛的光辉，其中较大的一尊被称作“红像”，而较小的一尊被称作“白像”。\n\n"
 bamian.0021.desc.sightseeing:0 "我们慢慢游览，绕着两座佛像走了一圈，并去了附近一些洞穴，洞穴里有着五颜六色的壁画，有些令人赏心悦目，有些则阴森恐怖。\n\n除此之外，我们还花时间在周围的村落放松身心，欣赏山谷和周围群山的美景。"
 bamian.0021.desc.inspiration:0 "无论是[ROOT.Char.GetFaith.HighGodName][ROOT.Char.GetFaith.HighGodHerselfHimself]建造的还是人类建造的，这些宏伟的佛像能矗立在这里如此之久，让我感慨万分，沉思许久……\n\n我想要成就一番伟业，在某种程度上成为不朽，就像这些佛像一样。"
 bamian.0021.desc.examination:0 "和我的随从漫不经心地欣赏佛像和壁画相比，我却花时间仔细研究这些佛像，思考它们的艺术和设计。\n\n这些佛像和壁画拥有完美无瑕的艺术，即使是如此破败，也能让人看到神话时代的种种生物。这非常吸引人，让我更加好奇自己作为一个普通[ROOT.Char.GetTitleAsNameNoTooltip]在宇宙中的位置。"
 bamian.0021.desc.romantic:0 "我花时间与导游讨论佛像，其说根据当地的传说，曾经有一对王子和公主来自不同的国度并相爱了，却无法结婚。有人说他们分别来自埃及和中国，还有人说他们是两个敌对国家的孩子。\n\n不管是哪种说法，他们都被变成了这些石像，永远相望相思。"
 bamian.0021.desc.understanding:0 "这里还有一些人信奉[buddhist.GetAdjective]，崇拜这些佛像。我对这些异教徒很感兴趣，决定和他们讨论一下他们的宗教仪式，以及他们为什么要崇拜这些佛像。\n\n我不确定这些高谈阔论是否正确，但这确实有助于我更好地了解这些异教徒的思维。"
 bamian.0021.a:0 "这真是一次美妙的观光。"
 bamian.0022.t:0 "结束"
 bamian.0022.desc:0 "在[GetTitleByKey('c_bamian').GetNameNoTier]逗留了一段时间，参观了那里壮观的佛像之后，我该回家了。\n\n不用说，这些佛像是名副其实的世界奇观，我很荣幸能亲眼见到它们。"
 bamian.0022.a:0 "也许我之后还会去参观。"
