 bm_867_rice_2:0 "RICE（中东）"
 bm_867_rice_2_desc:0 "西方中世纪世界在九世纪开始初具规模，这不是停滞不前的“黑暗时代”，而是动荡不安的“黄金时代”。整个世界在不断发展，各种英雄人物接连登场。\n\nRICEmod将目光放在世界各地的人民与文化，这个剧本只介绍了867年许多潜在玩法中的几个，这些玩法充分展示RICE的内容。\n\n#Bold 古典晚期已经结束，一个新的历史时代正在被书写，而你正在卷前执笔。是成为一代仁君还是征服之王？#!"
 bm_867_rice_1:0 "RICE（欧洲）"
 bm_867_rice_1_desc:0 "$bm_867_rice_2_desc$"
 bm_1066_rice_2:0 "RICE（中东）"
 bm_1066_rice_2_desc:0 "十一世纪是一个转型、发展与冲突的时代。这不是停滞不前的“黑暗时代”，而是动荡不安的“黄金时代”。整个世界是在不断发展，各种英雄人物接连登场。\n\nRICEmod将目光放在世界各地的人民与文化，这个剧本只介绍了1066年许多潜在玩法中的几个，这些玩法充分展示RICE的内容。\n\n#Bold 中世纪已经开始迈入顶峰，一段新的历史正在被书写，而你正在卷前执笔。是成为一代仁君还是征服之王？#!"
 bm_1066_rice_1:0 "RICE（欧洲）"
 bm_1066_rice_1_desc:0 "$bm_1066_rice_2_desc$"
 bookmark_RICE_867_azur_jamshid:0 "阿苏尔·贾姆希德"
 bookmark_RICE_867_azur_jamshid_desc:0 "据传，吉尔吉特中世纪的统治者是一位名叫阿苏尔·贾姆希德的波斯精灵的后代。他在暴君的女儿，努尔·巴赫特的帮助下，杀死了一个名叫室利巴达特的暴虐食人暴君。在作为新国王统治了若干年后，他退位给他的妻子，后来他的妻子又退位给他们的儿子加格。\n\n#Bold 无论阿苏尔·贾姆希德在现实生活中是否存在，你能否确保这位精灵王子的传说将持续下去，并在未来几个世纪内激励该地区的人民？#!\n\n#italic 此剧本可以游玩【帕米尔与尊日教：世界屋脊】、【亚兹德：礼拜厅】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_867_azur_jamshid_alt_nur_bakht:0 "努尔·巴赫特"
 bookmark_RICE_867_cao_yijin:0 "曹议金"
 bookmark_RICE_867_cao_yijin_desc:0 "张议潮出身沙州豪族，自少有大志。大中二年（848年），他乘吐蕃内乱之机，率众驱逐沙州的吐蕃镇将，自摄州事。大中三年（849年），秦、原、安乐三州和石门关等七关人民，在唐军的配合下，也摆脱吐蕃统治，以其地归唐。随后张议潮遣使向唐廷告捷，唐宣宗授张议潮为沙州防御使。此后逐步收复河西各州之地，宣宗于沙州置归义军，授张议潮为归义军节度使。咸通二年（861年），张议潮率蕃汉军收复凉州。随后数年征战，使吐蕃势力被彻底逐出河西、陇右之地，此后“西尽伊吾，东接灵武；六郡山河，宛然而归”。而一旦张议潮去世，敦煌世家则在阴谋和外部袭扰下衰弱。随后曹议金将在未来执掌归义军，让汉家文化在西域再次闪耀。\n\n#bold 河西沦落百余年，路阻萧关雁信稀。赖得将军开旧路，一振雄名天下知。#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_867_cao_yijin_alt_zhang_yichao:0 "张议潮"
 bookmark_RICE_867_last_zunbil:0 "菲鲁兹·伊本·卡博克"
 bookmark_RICE_867_last_zunbil_desc:0 "呼罗珊崎岖不平的山区是诸多古老文化的家园，其中包括樽比勒人，他们是尊的信徒，一个神秘的嚈哒神。公元865年，萨法尔王朝开国君王叶尔孤白率军击败樽比勒人，并杀死锡吉斯坦国王卡博克。此后一个不知名的樽比勒人被萨法尔王朝任命为总督，此人在867年试图造反失败。卡博克之子菲鲁兹随后领导了推翻萨法尔统治的最后一次起义，不过在870年被击败。\n\n#bold 身为最后的樽比勒人，尊之神选，你能排除万难，为父报仇，重建樽比勒王国吗？#!\n\n#italic 此剧本可以游玩【帕米尔与尊日教：世界屋脊】、【塔里木盆地：丝路之人】、【亚兹德：礼拜厅】风味包#!"
 bookmark_RICE_867_last_zunbil_alt_cousin:0 "萨法尔总督"
 bookmark_RICE_867_last_zunbil_alt_yaqub_saffarid:0 "雅各布·伊本·莱斯"
 bookmark_RICE_867_helgi_eyvindarson:0 "海尔吉·艾温德松"
 bookmark_RICE_867_helgi_eyvindarson_desc:0 "在冰岛的第一批定居者有基督教徒也有异教徒，从丹族人到凯尔特人，其中包括了传奇海盗海尔吉·伊文达松，这些移民体现了这种多样性。比如海尔吉·伊文达松曾经说过，他在陆地上信仰的是耶稣，但航行在大海上时他相信的是雷神索尔。同时他拥有斯堪的纳维亚和爱尔兰的血统，后者来自他的母亲，一位爱尔兰公主。而且海尔吉的姐姐$BjO_rg$也是著名的北欧探险家莱弗·艾瑞克森（发现文兰第一人）的曾祖母。\n\n#bold 基督教会成功在冰岛上传播吗？在大海的另一边是否还有更多的土地有待发现？#!\n\n#italic 此剧本可以游玩【北大西洋：北海争霸】风味包#!"
 bookmark_RICE_867_helgi_eyvindarson_alt_bjorg:0 "$BjO_rg$·伊文达松"
 bookmark_RICE_867_helgi_eyvindarson_alt_rafarta:0 "拉弗塔赫"
 bookmark_RICE_867_maymun_ibn_rustumiyya:0 "迈蒙·伊本·鲁斯塔米亚"
 bookmark_RICE_867_maymun_ibn_rustumiyya_desc:0 "锡吉勒马萨是一个多元化城市，对待宗教和种族上都是如此。无情但有能力的阿布·蒙塔塞尔利用这种多元化将这里变成马格里布西部的繁荣且富裕的中心。然而自蒙塔塞尔死后，锡吉勒马萨饱经动荡，这导致其在10世纪的衰退。\n\n#bold 蒙塔塞尔的继承人米德拉尔家族能否重新稳定撒哈拉的门户，还是曾经繁荣的锡吉勒马萨再也不复？#!\n\n#italic 此剧本可以游玩【苏斯：撒哈拉之门】风味包#!"
 bookmark_RICE_867_al_umari:0 "欧麦尔"
 bookmark_RICE_867_al_umari_desc:0 "阿拔斯王朝正在衰落，在权力真空中，像欧麦尔这样野心勃勃的当地军阀正在崛起。他因集学者、冒险家和商人诸多身份为一体及其残忍的性格而闻名，他有很多敌人，如突伦王朝，他是伊本·突伦的眼中钉，还有努比亚统治者，他经常用奴隶兵攻势来突袭。不过他的残暴导致他的死亡，最后他被自己的手下杀害了……\n\n#bold 你能避免欧麦尔的悲惨命运，并用东部沙漠中的宝藏装满你的金库吗？#!\n\n#italic 此剧本可以游玩【红海：东方沙漠之宝】、【锡瓦：西沙漠绿洲】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_867_al_umari_alt_ahmad_ibn_tulun:0 "伊本·突伦"
 bookmark_RICE_867_al_umari_alt_zakharias:0 "扎卡利亚斯"
 bookmark_RICE_1066_al_kashgari:0 "马哈茂德"
 bookmark_RICE_1066_al_kashgari_desc:0 "马哈茂德·喀什噶里出身于喀喇汗王朝的皇室，喀喇汗王朝是一个统治中亚大部分地区的突厥王朝。喀什噶里是一位游历广泛的学者，并且为自己的突厥血统感到自豪，他在公元1072至1074年编纂了#italic 《突厥语大词典》#!，这是第一部全面的突厥语字典，也是关于中世纪突厥人的重要史料。\n\n#bold 随着中亚波云诡谲的发展，喀什噶里将如何记录不断变化的中亚地区？#!\n\n#italic 此剧本可以游玩【塔里木盆地：丝路之人】、【亚兹德：礼拜厅】风味包#!\n\n#warning @warning_icon!如果你没有@roadstopower_icon!权力之路dlc，你将会是[landed|E]角色。#!"
 bookmark_RICE_1066_isleifur:0 "伊斯莱弗·吉苏拉松"
 bookmark_RICE_1066_isleifur_desc:0 "德意志地区接受教育的冰岛酋长埃尔斯佛·吉苏拉松于1056年被不来梅总主教阿达尔贝特任命为冰岛的第一位主教。不过基督教和欧洲主流文化对冰岛的影响极其有限，例如埃尔斯佛·吉苏拉松虽是一位主教，但他却已成婚，而且还会信奉阿萨神族。不过在埃尔斯佛和他两个儿子祭苏儿和特尔托的教导下，冰岛慢慢成为基督教在北大西洋的一个重要地点。\n\n#bold 你能将冰岛、格陵兰乃至更远的土地融入欧亚大陆的经济、政治和文化网络中吗？#!\n\n#italic 此剧本可以游玩【北大西洋：从冰岛到文兰】风味包#!"
 bookmark_RICE_1066_isleifur_alt_teitur:0 "特尔托·埃尔斯佛松"
 bookmark_RICE_1066_isleifur_alt_gissur:0 "祭苏儿·埃尔斯佛松"
 bookmark_RICE_867_abu_bakr_al_madharai:0 "艾哈迈德"
 bookmark_RICE_867_abu_bakr_al_madharai_desc:0 "马扎赖是埃及和叙利亚的一个著名官僚世家，在不同时期担任并几乎垄断了穆瓦希德王朝、阿拔斯哈里发国和伊赫什德王朝和叙利亚的财政大臣（'āmil）。艾哈迈德积累了足够的权力和财富，使他的儿子阿里和侯赛因分别在埃及和叙利亚获得重要的政治地位，马扎赖家族将在该地区保持数十年影响力！\n\n#bold 作为马扎赖家族的一份子，你是否可以#italic 权倾朝野#!，取代阿拔斯王朝或突伦王朝呢？#!\n\n#italic 此剧本可以游玩【红海：东方沙漠之宝】、【锡瓦：西沙漠绿洲】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_867_abu_bakr_alt_ali:0 "阿里·伊本·艾哈迈德"
 bookmark_RICE_867_abu_bakr_alt_al_husayn:0 "侯赛因·伊本·艾哈迈德"
 bookmark_RICE_1066_badis_ibn_habus:0 "巴迪斯·伊本·哈布斯"
 bookmark_RICE_1066_badis_ibn_habus_desc:0 "巴迪斯·伊本·哈布斯统治的格拉纳达，其权力基础归功于格拉纳达的犹太社区，特别是依靠犹太学者兼大臣约瑟夫·伊本·纳格瑞拉。虽然约瑟夫继承其父亲的大臣地位和智慧，但没有继承他的谦逊。现在随着反犹情绪在格拉纳达的高涨，约瑟夫被诬陷与敌对统治者$al-Mu_tasim$共谋。\n\n#bold 你能否与约瑟夫建立友谊，并保护格拉纳达的犹太社区远离仇恨和战争呢？#!\n\n#italic 此剧本可以游玩【格拉纳达：阿尔罕布拉宫的回忆】、【加里西亚：圣雅各之路】风味包#!"
 bookmark_RICE_1066_badis_ibn_habus_alt_yosef:0 "优素福"
 bookmark_RICE_1066_badis_ibn_habus_alt_al_mu_tasim:0 "$al-Mu_tasim$"
 bookmark_RICE_1066_pithipati:0 "筏罗婆罗阇"
 bookmark_RICE_1066_pithipati_desc:0 "支拘荔王朝是一个佛教王朝，他们统治并保护佛教最神圣的地方之一——菩提迦耶。他们会以“Pithipati”（金刚座之主）为头衔，“金刚座”指的是菩提伽耶的一个确切地点，据说佛祖就是在那里开悟的。\n\n#bold 万事皆无常，凡事皆可修，你能让佛教在这个日益堕落的时代传播发展吗？#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【帕米尔与尊日教：世界屋脊】风味包#!"
 bookmark_RICE_1066_pithipati_alt_vigrahapala:0 "筏罗婆罗阇·波罗三世"
 bookmark_RICE_1066_faramurz_kakuyid:0 "法拉穆尔兹"
 bookmark_RICE_1066_faramurz_kakuyid_desc:0 "法拉穆尔兹从他那强大的父亲——博学的军阀穆罕默德那继承了一块庞大的领土，不过法拉穆尔兹被塞尔柱人征服了，随后塞尔柱人把法拉穆尔兹贬到了沙漠城镇亚兹德。法拉穆尔兹不再为统治一个大领地而感到劳累，可能这是唯一的幸运了，不过哪怕在贫瘠的沙漠，法拉穆尔兹也将把亚兹德成为文化和财富的绿洲。\n\n#bold 你是否仍然渴望夺回家族的领土，还是会专注于发展亚兹德，使其成为一座繁荣的城市？#!\n\n#italic 此剧本可以游玩【亚兹德：礼拜厅】风味包#!"
 bookmark_RICE_1066_faramurz_kakuyid_alt_alp_arslan:0 "阿尔普·阿尔斯兰"
 bookmark_RICE_1066_ali_ibn_asad:0 "阿里·伊本·阿萨德"
 bookmark_RICE_1066_ali_ibn_asad_desc:0 "阿里·伊本·阿萨德是著名的什叶派穆斯林学者纳西尔·霍斯劳的赞助人。他是一个思想开放、聪明的统治者，欣赏纳西尔·霍斯劳的智慧和口才。据传说正是由于纳西尔·霍斯劳，波多叉拿才得以成为伊斯玛仪派的堡垒。\n\n#bold 在你的带领下，伊斯兰教在帕米尔高原人民中的传播将走向何方？#!\n\n#italic 此剧本可以游玩【帕米尔与尊日教：世界屋脊】、【亚兹德：礼拜厅】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1066_ali_ibn_asad_alt_nasir_khusraw:0 "纳西尔·霍斯劳"
 bookmark_RICE_1066_manuel_angelos:0 "曼努埃尔"
 bookmark_RICE_1066_manuel_angelos_desc:0 "在罗马帝国有许多小贵族家族，他们通常寻求更进一步。安杰洛斯家族就是其中之一，他们于12世纪在君士坦丁·安杰洛斯的带领下崭露头角，并在接下来的几个世纪里，培养出了几位皇帝以及其他著名的官员和将军。君士坦丁的父亲可能是一个不起眼的小贵族，名叫曼努埃尔。\n\n#bold 你能把安杰洛斯家族变成东罗马历史上最强大的家族之一吗？#!\n\n#italic 此剧本可以游玩【希俄斯：乳香之岛】、【莱斯沃斯：诗人之岛】、【罗得岛：巨像之影】风味包#!"
 bookmark_RICE_867_hafsunid:0 "亚法尔·伊本·萨利姆"
 bookmark_RICE_867_hafsunid_desc:0 "贾法尔是马拉加周围的一个小贵族，他的孙子奥马尔·伊本·哈夫松逊领导了安达卢西亚地区反对倭马亚统治的起义（最持久和最广泛的一次起义）。欧麦尔·伊本·哈夫松脾气暴躁，在公元879年开始他历史上波澜壮阔的一生，当时他杀了一个偷他祖父牛的人。为了避免被捕，他成为一名逃犯，并最终成为一名叛军领袖。\n\n#bold 哈夫松能否推翻倭马亚统治，还是会找到一个更平静的命运？#!\n\n#italic 此剧本可以游玩【加里西亚：圣雅各伯之路】、【格拉纳达：阿尔罕布拉宫的记忆】风味包#!"
 bookmark_RICE_867_hafsunid_alt_ibn_hafsun:0 "奥马尔·伊本·哈夫松"
 bookmark_RICE_1066_morcar:0 "莫卡伯爵"
 bookmark_RICE_1066_morcar_desc:0 "莫卡是传奇女子戈黛娃夫人之孙，最近被诺森布里安人选为新的约克伯爵。不过他和他兄长埃德温与戈德温家族关系不佳，拒绝协助其姐夫哈罗德国王对抗征服者威廉。在屈服于诺曼人之后，他们俩两次反叛，最后被囚。\n\n#bold 你和哥哥会与哈罗德冰释前嫌，帮助他对抗英格兰的侵略者吗？还是等尘埃落定后，再看看会发生什么？#!\n\n#italic 此剧本可以游玩【北大西洋：北海争霸】、【约克郡：前往斯卡伯勒集市】风味包#!"
 bookmark_RICE_1066_morcar_alt_ealdgyth:0 "$E_ldgyth$"
 bookmark_RICE_1066_morcar_alt_eadwin:0 "埃德温"
 bookmark_RICE_1066_fernan_mendez:0 "费尔南"
 bookmark_RICE_1066_fernan_mendez_desc:0 "费尔南宣称他的祖先非常奇特，且令人难以置信：他的父亲门多是布列塔尼公爵的后裔，而他的母亲是著名的阿尔茨鲁尼家族的亚美尼亚公主。不管真与假，费尔南和他的后代将把布拉干萨建成伊比利亚的一个重要的城市。\n\n#bold 诚然你的家谱很牵强，但你能无愧于你所谓的杰出祖先吗？#!\n\n#italic 此剧本可以游玩【加里西亚：圣雅各伯之路】、【格拉纳达：阿尔罕布拉宫的记忆】风味包#!"
 bookmark_RICE_1066_fernan_mendez_alt_mendo:0 "门多"
 bookmark_RICE_1066_fernan_mendez_alt_arcruni:0 "玛丽亚"
 BOOKMARK_RELATION_RICE_NEIGHBOR:0 "（临近领主）"
 bookmark_RICE_867_socotra:0 "登哈"
 bookmark_RICE_867_socotra_desc:0 "#warning @warning_icon!该统治者是虚构角色#!\n索科特拉岛以乳香和龙血等奇异商品而闻名，其多元化的城市里面有可怕的信德海盗和非洲逃亡奴隶。9世纪是该岛的一个紧张时刻，穆斯林少数民族感到被执政的基督教徒压迫，想向阿曼的统治者寻求援助。\n\n#bold 你统治着一个充满机遇和危险的传奇岛屿，且在富饶的印度洋上，属于你的将是什么？#!\n\n#italic 此剧本可以游玩【红海：东部沙漠之宝】、【索科特拉：龙血岛】风味包#!"
 bookmark_RICE_867_al_baridi:0 "穆罕默德"
 bookmark_RICE_867_al_baridi_desc:0 "巴士拉的阿拔斯巴里德——穆罕默德·巴里迪是臭名昭著的巴里迪兄弟的父亲，巴里迪家族在10世纪初通过税收农业中获得的巨额财富变成当地军阀甚至一度冲击哈里发之位。他最有成就的儿子阿布·阿卜杜拉是阿拔斯王朝的维齐尔，也是白益王朝的劲敌，无情的阿布·阿卜杜拉甚至为了夺取财富而弑杀手足。\n\n#bold 阿布·阿卜杜拉的女婿说阿布·阿卜杜拉的头巾“遮盖的并不是人的头，而是魔鬼的头”，你能逆转这一可怕的声望还是成为其口中的“易卜劣斯”？#!\n\n#italic 此剧本可以游玩【胡齐斯坦：甘蔗之地】、【亚兹德：礼拜厅】风味包#!"
 bookmark_RICE_867_khwarezm:0 "俄拉克·伊本·曼苏尔"
 bookmark_RICE_867_khwarezm_desc:0 "俄拉克在花剌子模继承了一个微妙的局面，他的祖先在几代人之前就皈依了伊斯兰教，但他们与穆斯林邻居的关系仍然很紧张，例如他们后来成为萨曼王朝的附庸。同时当地的花剌子模领主在他们强大的#italic 风中堡垒#!中进行统治，试图扩大自己的权力。\n\n#bold 花剌子模诞生于波斯和图兰的边境地区，几个世纪以来一直是丝绸之路的学习和贸易中心，你能确保它保持这种繁荣吗？#!\n\n#italic 此剧本可以游玩【花剌子模：乌浒河】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_867_khwarezm_alt_samanid:0 "纳斯尔"
 bookmark_RICE_1066_bursuq:0 "布尔速赤"
 bookmark_RICE_1066_bursuq_desc:0 "塞尔柱人有许多忠诚的#italic 古拉姆#!奴隶士兵。布尔速赤就是这样一个卑微的#italic 古拉姆#!。在他得到胡齐斯坦和洛雷斯坦的部分地区后，于阿尔普·阿尔斯兰和马立克沙一世的统治时期在塞尔柱宫廷中获得了很高的地位。虽然他在公元1097年被#italic 阿萨辛#!暗杀，但他的孩子也在塞尔柱帝国发挥重要作用。\n\n#bold 你只是众多雄心勃勃的#italic 古拉姆#!之一，你凭什么能在阿尔普·阿尔斯兰手下成为塞尔柱人最重要的将军之一呢？#!\n\n#italic 此剧本可以游玩【花剌子模：乌浒河】、【亚兹德：礼拜厅】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1066_bursuq_alt_bursuq:0 "布尔速赤"
 bookmark_RICE_867_normandy_hrolfr:0 "赫罗尔夫（罗洛）"
 bookmark_RICE_867_normandy_hrolfr_desc:0 "诺曼底第一位统治者——罗洛，其一生被笼罩在神秘之中。一些资料称他被迫从斯堪的纳维亚流亡，尽管他是位异教徒，但上帝告诉他要去诺曼底的应许之地，类似于特洛伊的埃涅阿斯传说，他的后裔威廉后在公元1066年征服了英格兰。\n\n#bold 你可能（也可能没有）收到了基督教上帝的神谕，前往诺曼底建立一个强大的新王朝，而你会听从这冒险的召唤吗？#!\n\n#italic 此剧本可以游玩【诺曼底：征服者】、【北大西洋：北海争霸】风味包#!\n@warning_icon!#X 请确保罗洛的游戏规则设置正确。#!"
 bookmark_RICE_1066_tunka_menin:0 "通卡·马宁"
 bookmark_RICE_1066_tunka_menin_desc:0 "几个世纪以来，通卡·马宁的祖先一直统治着加纳帝国，帝国通过主导跨撒哈拉贸易而繁荣起来。然而，虽然他的统治标志着加纳权力的巅峰，但这也是加纳衰落的开始，因为北方的穆拉比特王朝正虎视眈眈。\n\n#bold 你在加纳历史的关键时刻统治该国。你能抵抗穆拉比特王朝，阻止加纳的衰落和解体吗？#!\n\n#italic 此剧本可以游玩【博佐：河流之主】、【苏斯：撒哈拉之门】风味包#!"
 bookmark_RICE_1066_tunka_menin_alt_almoravid:0 "阿布‑贝克尔"
 BOOKMARK_RELATION_VASSAL:0 "（封臣）"
 bookmark_RICE_1066_vijayabahu:0 "毗阇耶婆呼"
 bookmark_RICE_1066_vijayabahu_desc:0 "珠利耶大军与僧伽罗军阀兵革不休，让室利楞伽旧都成为一片废墟，而天降王子毗阇耶婆呼脱颖而出，驱逐珠利耶入侵者，建立了布烂那卢婆王国。他和继任者们花了数十年时间团结并改革岛上因古念分歧而争斗并分裂的佛派。\n\n#bold 除恶务尽易，拨乱反治难。昔日佛国而今一片狼藉，如今岛中佛派各执所见，施主此番能否重建佛国弥合佛派？#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_1066_vijayabahu_alt_chola:0 "$VI_rarA_cE_ntira$"
 bookmark_RICE_1066_vijayabahu_alt_budal:0 "部荼"
 bookmark_RICE_867_slavibor:0 "斯拉维博尔"
 bookmark_RICE_867_slavibor_desc:0 "斯拉维博尔是索布人的王子且并不信仰基督教，但他的两个后代后来成为著名的基督教圣人。他的女儿卢德米拉皈依了基督教，于公元921年殉道，而她的孙子波希米亚公爵圣瓦茨拉夫一世于公元935年殉道。事实上，圣瓦茨拉夫正是著名圣诞颂歌《好王瓦茨拉夫》中的那位。\n\n#bold 你是皈依基督教还是坚定原有的信仰，你和你的家人们将如何摆脱德意志和波希米亚王公的政治阴谋并从中幸存下来呢？#!\n\n#italic 此剧本可以游玩【亚琛：查理曼之都】、【波拉比亚：斯韦托维德之盾】风味包#!"
 bookmark_RICE_867_slavibor_alt_ludmila:0 "卢德米拉"
 bookmark_RICE_1066_budivoj:0 "伯爵 布迪沃伊"
 bookmark_RICE_1066_budivoj_desc:0 "奥博特里特邦联王公古茨卡尔克试图将易北河畔的斯拉夫部落统一成一个伟大的基督教王国，但他在异教起义中被杀，随后克鲁托伊上位，而古茨卡尔克的两个儿子布迪沃伊和亨里克流亡在外，但布迪沃伊在公元1075年被克鲁托伊杀死，亨里克在公元1093年杀死克鲁托伊并掌控了奥博特里特，为他的父亲和兄弟报了仇。\n\n#bold 狡猾、危险的克鲁托伊违逆神意，但你和你的兄弟比他更聪明，你们能在异教徒的阴谋中幸存下来，并为殉道的父亲报仇吗？#!\n\n#italic 此剧本可以游玩【波拉比亚：斯韦托维德之盾】风味包#!"
 bookmark_RICE_1066_budivoj_alt_henrik:0 "亨里克"
 bookmark_RICE_1066_krutoj:0 "公爵 克鲁托伊"
 bookmark_RICE_1066_krutoj_desc:0 "当奥博特里特邦联的贵族反抗基督异教领主古茨卡尔克并杀死他后，他们推举了克鲁托伊作为新王公。几十年来，克鲁托伊巧妙地应付一切政敌，并设法在公元1075年杀死了古茨卡尔克的长子布迪沃伊。然而，他在公元1093年试图暗杀古茨卡尔克的另一个儿子亨里克时被反杀。\n\n#bold 伪神信徒余孽至今仍然在外，你将如何消灭他们，并能让奥博特里特成为对抗基督异教的桥头堡吗？#!\n\n#italic 此剧本可以游玩【波拉比亚：斯韦托维德之盾】风味包#!"
 bookmark_RICE_1066_damot:0 "贝克勒"
 bookmark_RICE_1066_damot_desc:0 "#warning @warning_icon!该统治者是虚构角色。#!\n\n达莫特王国在13世纪达到顶峰，当时的统治者只知道他的头衔——莫托洛米，他征服了基督徒和穆斯林。在埃塞俄比亚传说中，他信仰德斯克教，直到僧侣泰克勒·海马诺特劝服让他皈依了基督教。\n\n#bold 能否复现达莫特王国事迹，让埃塞俄比亚世世代代传颂您的名！#!\n\n#italic 此剧本可以游玩【红海：东部沙漠之宝】、【索科特拉：龙血岛】、【南埃塞俄比亚：高地王国】风味包#!"
 bookmark_RICE_1066_damot_alt_abyssinia:0 "$Yemrehana_Krestos$"
 bookmark_RICE_1066_damot_alt_vassal:0 "武罗"
 bookmark_RICE_867_sawdan:0 "索丹"
 bookmark_RICE_867_sawdan_desc:0 "公元847年，穆斯林冒险家征服南意大利，建立了巴里埃米尔国。虽然伊斯兰世界的大部分人都将巴里视为落后地区，但索丹还是在864年从阿拔斯帝国中获得了总督头衔，但这并非幸事，意大利国王路易二世率领的基督徒依旧虎视眈眈，并于871年击败并推翻索丹。\n\n#Bold 残忍？诡诈？公正？睿智？如何治理方能保卫伊斯兰世界的边疆？我们不得而知，但你能万载千秋并在意大利播下#italic 伊斯兰教#!的种子吗？#!\n\n#italic 此剧本可以游玩【撒丁岛：法官之治】、【西西里：三个世界交汇处】风味包#!"
 bookmark_RICE_867_sawdan_alt_louis:0 "$bookmark_carolingians_king_louis$"
 bookmark_RICE_867_sawdan_alt_abu_aaron:0 "阿布·亚伦"
 bookmark_RICE_1066_roger:0 "罗杰"
 bookmark_RICE_1066_roger_desc:0 "西西里埃米尔国覆灭之时，当地穆斯林军阀伊本·提姆纳求助于诺曼冒险者罗杰兄弟，共抗强敌。诺曼人则趁势而动，席卷全岛，尽管遭遇贝纳韦尔特等人的顽强抵抗，最终仍一统西西里。罗杰之子罗杰二世继承大业，创建西西里王国，荣耀万世。\n\n#Bold 再现罗杰家族的辉煌崛起，将西西里从烽火孤岛化为地中海的繁荣中心！#!\n\n#italic 此剧本可以游玩【撒丁岛：法官之治】、【西西里：三个世界交汇处】风味包#!"
 bookmark_RICE_1066_roger_alt_benavert:0 "贝纳韦尔特"
 bm_867_rice_3:0 "RICE（东亚）"
 bm_867_rice_3_desc:0 "$bm_867_rice_2_desc$"
 bm_1066_rice_3:0 "RICE（东亚）"
 bm_1066_rice_3_desc:0 "$bm_1066_rice_2_desc$"
 bm_1178_rice_1:0 "RICE（欧洲）"
 bm_1178_rice_1_desc:0 "十二世纪，中世纪的辉煌顶点，战争与十字军东征的硝烟弥漫，文化成就与经济繁荣交相辉映。放眼世界，各民族及其领袖的故事如同不断编织的精美织锦，展现出历史的丰富多彩。\n\nRICEmod为这个世界的民族和地域增添了新的风味，而该剧本专注于1178年，利用RICE的内容丰富游戏进程。\n\n#Bold 十二世纪，一个机遇满溢的时代。历史的新篇章正在被书写，而你，将成为这位历史的记录者。未来的模样，世界的命运——这一切，是否将由你来执笔决定？#!"
 bm_1178_rice_2:0 "RICE（中东）"
 bm_1178_rice_2_desc:0 "$bm_1178_rice_1_desc$"
 bm_1178_rice_3:0 "RICE（东亚）"
 bm_1178_rice_3_desc:0 "$bm_1178_rice_1_desc$"
 bm_1178_rice_4:0 "RICE（西方无地者）"
 bm_1178_rice_4_desc:0 "$bm_1178_rice_1_desc$"
 bookmark_RICE_1178_constance:0 "康斯坦莎"
 bookmark_RICE_1178_constance_desc:0 "康斯坦莎的父亲，布列塔尼公爵，在面临贵族的叛乱时，寻求英格兰的亨利二世支持；国王同意了，但有一个附加条件——康斯坦莎要与他的儿子杰弗里订婚。而在后来，亨利又强迫孔南让位于康斯坦莎，女公爵所继承的地缘政治形势可谓岌岌可危。\n\n#Bold 你能抵御英格兰人与法兰西人的明枪暗箭，保卫你家族的布列塔尼遗产么？#!\n\n#italic 此剧本可以游玩【布列塔尼：西部公国】、【诺曼底：冒险者与贵族】风味包#!"
 bookmark_RICE_1178_margaritus:0 "马加利托"
 bookmark_RICE_1178_margaritus_desc:0 "像#italic 众埃米尔之埃米尔#!、西西里王国舰队统帅这样的高位，唯布林迪西的马加利托这位前希腊海盗才能爬上！作为这职位上的最后一位杰出者，他领导西西里舰队南征北战，但最终在1197年败于神圣罗马帝国之手，被刺瞎双眼后了却残生。\n\n#Bold 尽管你的过去并不光彩，但你已经证明了自己是西西里诸王的忠实仆人——至少目前为止是如此。你将继续以他们的名义统帅海军，还是在这变幻莫测的西西里国度追随自己的天命？#!\n\n#italic 此剧本可以游玩【西西里：三个世界交汇处】风味包#!"
 bookmark_RICE_1178_margaritus_alt_william_ii:0 "西西里的威廉二世"
 bookmark_RICE_1178_parakramabahu:0 "波罗羯罗摩婆呼"
 bookmark_RICE_1178_parakramabahu_desc:0 "伟大的建设者、赞助者和统帅——波罗羯罗摩婆呼，在他的统治下，室利楞伽迎来了和平与繁荣。他的改革也让大寺派赢得僧伽论道，而铺张浪费的背后，如何顺利接班，这将是问题……\n\n#Bold 建设方得易，守成万万难，你能确保统治千秋万代吗？#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【索科特拉：龙血岛】、【室利楞迦：僧伽论道】风味包#!"
 bookmark_RICE_1178_parakramabahu_alt_lilavati:0 "梨罗伐底"
 bookmark_RICE_1178_yelu_zhilugu:0 "$dynn_Kara-Khitai$$Zhilugu_76F4_9B6F_53E4$"
 bookmark_RICE_1178_yelu_zhilugu_desc:0 "契丹先于女真一统中国北方多年，而后向西让诸多穆斯林臣服，也不强迫当地改信，然而直鲁古时秋出猎，乃蛮王屈出律以伏兵八千擒之，而据其位。遂袭辽衣冠，尊直鲁古为太上皇，皇后为皇太后，朝夕问起居，以侍终焉。\n\n屈出律皈依三宝，并迫令居民弃伊斯兰教，改宗佛教，引起伊斯兰教徒愤怒。\n\n最终亡于成吉思汗之手。\n\n#Bold 契丹将亡，大王可能否狂澜于既倒？建华夏于西方？#!\n\n#italic 此剧本可以游玩【花赖子模：乌浒河】、【西伯利亚：驯鹿人】、【塔里木盆地:丝路之人】风味包#!"
 bookmark_RICE_1178_trapelicino:0 "特拉佩利西诺"
 bookmark_RICE_1178_trapelicino_desc:0 "你永远可以相信像特拉佩利西诺这样的不诚实之人会继续他的狡诈行径。他曾是一名臭名昭著的商人兼海盗，服务于比萨共和国。在引发比萨与埃及之间的一场外交风波后，他转而投奔了热那亚。其最后的雇主是阿拉贡的阿方索二世国王，国王雇佣他护送外交使节前往君士坦丁堡。\n\n#Bold 虽然特拉佩利西诺在1170年代末就从历史记载中消失了，但这并不意味着他的故事就此终结，或许还有更加宏伟的冒险在等待着你——带领着你的海盗团，航行在充满激情的地中海之上！#!\n\n#italic 此剧本可以游玩【撒丁岛：法官之治】、【西西里：三个世界交汇处】风味包#!"
 bookmark_RICE_1178_trapelicino_alt_alfonso:0 "阿方索二世"
 bookmark_RICE_1178_damot:0 "莫托洛米"
 bookmark_RICE_1178_damot_desc:0 "达莫特王国在13世纪达到顶峰，当时的统治者只知道他的头衔——莫托洛米，他征服了基督徒和穆斯林。在埃塞俄比亚传说中，他信仰德斯克教，直到僧侣泰克勒·海马诺特劝服让他皈依了基督教。\n\n#bold 能否复现达莫特王国事迹，让埃塞俄比亚世世代代传颂你的威名！#!\n\n#italic 此剧本可以游玩【红海：东部沙漠之宝】、【索科特拉：龙血岛】、【南埃塞俄比亚：高地王国】风味包#!"
 bookmark_RICE_1066_al_wuhsha:0 "$nick_RICE_al_dallala$"
 bookmark_RICE_1066_al_wuhsha_desc:0 "在历史的长河中，总有一些人敢于打破社会陈规，不屑他人嘲笑，并走出自己的道路。她这样的奇女子被称为“经纪人”，作为亚历山大犹太裔，她过着一种非传统的生活，甚至因为与爱人未婚同居并生下私生子而被禁止进入犹太会堂。尽管她的生活方式与传统背道而驰，她却成为了埃及最成功、最富有的女商人之一。\n\n#bold 你能在一个由男性主导的世界中，坚守自己独特而自豪的灵魂，同时让自己的名字流传千古吗？#!\n\n#italic 此剧本可以游玩【红海：东部沙漠之宝】、【锡瓦：西部沙漠绿洲】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_1178_li_shichang:0 "李世昌"
 bookmark_RICE_1178_li_shichang_desc:0 "耶律楚材虽出身契丹，但却是成吉思汗最亲信的顾问。有人曾说他的契丹语乃是一位名为李世昌的西辽官员所教授，而他甚至是一位汉人。尽管远离衣冠祖地，也依然饱读华夏诗书。\n\n#bold 男儿若欲树功名，须向前头。#!\n\n#italic 此剧本可以游玩【梵衍那：光照之地】、【花剌子模：乌浒河】、【帕米尔与尊日教：世界屋脊】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1178_wo_daochong:0 "斡道冲"
 bookmark_RICE_1178_wo_daochong_desc:0 "多年前，夏仁宗的权相任得敬专权跋扈，滥用职权，军备废弛，屡战屡败，后竟妄想分国，此间唯有斡道冲敢于斗争，任得敬篡权之事暴露，为仁宗诛杀，斡道冲后为国相直至劳累而死，史载“家无私蓄，仅有书籍数床而已”。\n\n#bold 乃有儒臣，早究典谟。通经同文，教其国都。遂相其君，作服施采。#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1178_wo_daochong_alt_zhakui:0 "斡扎箦"
 bookmark_RICE_1178_wo_daochong_alt_renxiao:0 "嵬名仁孝"
 bookmark_RICE_1178_michael_scot:0 "迈克尔·斯科特"
 bookmark_RICE_1178_michael_scot_desc:0 "在中世纪的传说里，迈克尔·斯科特以其魔法师和占星家的身份而闻名，因为他是唯一在但丁《神曲》中露面的苏格兰人。然而在现实中，他是一位成就斐然的多语种学者，其足迹遍布欧洲，服务于包括神圣罗马帝国皇帝腓特烈二世在内的多位君主。\n\n#bold 常言道，未抓住的机会即是错过。你是否具备把握机遇的能力，成为世界上最杰出的旅行学者？#!\n\n#italic 此剧本可以游玩【北大西洋：北海争霸】、【约克郡：前往斯卡伯勒集市】风味包#!"
 bookmark_RICE_1178_oranmiyan:0 "奥兰米扬"
 bookmark_RICE_1178_oranmiyan_desc:0 "相传，尼日利亚的若干王国是由神王奥杜杜瓦的后裔所建立，其中包括奥杜杜瓦的勇猛孙子——奥兰米扬，他先是在贝宁和奥约建立了自己的王国，随后成为伊莱‑伊费的大欧尼。但奥兰米扬的真实身份至今存疑，他是否确有其人，亦或乃多人集合；他究竟生活在哪个时代；甚至他与神话中数个世纪之前存活奥杜杜瓦之间的血缘关系是否真实？一切不得而知。\n\n#bold 从传说的迷雾中现身，成为约鲁巴和贝宁民族的英雄吧！#!\n\n#italic 此剧本可以游玩【博佐：河流之主】、【尼日尔河三角洲：奥杜杜瓦传人】风味包#!"
 bookmark_RICE_1066_tzachas:0 "恰卡"
 bookmark_RICE_1066_tzachas_desc:0 "在东罗马帝国的历史中，皇帝尼基弗鲁斯三世曾俘虏了一名突厥掠夺者，名为恰卡。恰卡后来加入了东罗马的行列。然而，当尼基弗鲁斯在1081年被阿莱克修斯·科穆宁一世推翻后，恰卡便自立为王，征服了伊奥尼亚的部分地区以及邻近的岛屿，如莱斯沃斯岛。他不仅投身海盗行径，甚至自封为帝国皇帝，直到他被罗姆苏丹与拜占庭人合谋暗杀。\n\n#bold 匪徒身坐皇帝位，他人嗤笑觉怪诞。可是世间无常事，你可将其成现实？#!\n\n#italic 此剧本可以游玩【希俄斯：乳香之岛】、【莱斯沃斯：诗人之岛】、【罗得岛：巨像之影】风味包#!"
 bookmark_RICE_867_thabit_ibn_qurra:0 "萨比特·伊本·库拉"
 bookmark_RICE_867_thabit_ibn_qurra_desc:0 "伊斯兰黄金时代最伟大的学者——萨比特·伊本·库拉，他对星座的了解无人能及更是托勒密体系的第一批改革者之一，被穆斯林们称赞乃古代遗产的捍卫者，他将美索不达米亚多神教与新柏拉图主义结合在一起，不过无人知晓他乃一位哈兰多神教徒。\n\n#bold 人言命乃天定，而你是选择执掌星图，还是自己抒写命运？#!\n\n#italic 此剧本可以游玩【哈兰：最后的希腊多神教信徒】、【胡齐斯坦：甘蔗之地】风味包#!\n\n#warning @warning_icon!如果你没有@roadstopower_icon!《权力之路》DLC，你将成为[landed|E]角色。#!"
 bookmark_RICE_867_ibn_wahshiyya:0 "伊本·瓦赫西亚"
 bookmark_RICE_867_ibn_wahshiyya_desc:0 "在外人眼中，伊拉克的纳巴泰人就是乡巴佬！伊本·瓦赫西亚清楚地认识这一点，但伊本·瓦赫西亚何其人也？他是西拿基立的后裔！古美索不达米亚人后代！只因阿拉伯哈里发的出现，昔日荣耀慢慢暗淡，古老生活方式正在消失，如何重振？唯有著书……撰写巨著弘扬文化。\n\n#bold 身负千年传承，数代知识，如何传承？该你抉择。#!\n\n#italic 此剧本可以游玩【哈兰：最后的希腊多神教信徒】、【胡齐斯坦：甘蔗之地】风味包#!"
 bookmark_RICE_1178_hafsa:0 "哈芙莎·鲁库尼亚"
 bookmark_RICE_1178_hafsa_desc:0 "哈芙莎，安达卢斯最负盛名的女诗人之一，此生作诗仅给爱人阿布·贾法尔。\n\n阿布·贾法尔，格拉纳达官员，诗人，此生定与挚爱哈芙莎共度余生，何奈格拉纳达的总督奥斯曼对哈芙莎心生贪念而惨死。\n\n失去爱人的哈芙莎从此退出了格拉纳达的宫廷生活，尽管后来她在摩洛哥成为了几位穆瓦希德王子的宫廷教师，但她的余生都在深切地哀悼着阿布·贾法尔……\n\n#bold 在你游历世界的旅途中，你的心是否能够找到愈合之日，还是说，悲伤与哀愁将永远伴随着你？#!\n\n#italic 此剧本可以游玩【加利西亚：圣雅各伯之路】、【格拉纳达：阿尔罕布拉宫的回忆】、【苏斯：撒哈拉之门】风味包#!"
 bookmark_RICE_1178_hafsa_alt_abu_said_uthman:0 "奥斯曼"
 bookmark_RICE_1178_ikhtiyar_al_din:0 "$nick_ikhtiyar_al_din$"
 bookmark_RICE_1178_ikhtiyar_al_din_desc:0 "$nick_ikhtiyar_al_din$，一位出身哈尔吉部落的古尔王朝将领，曾在北印度指挥着一系列战役和突袭。在古尔王朝的穆罕默德遇刺之后，像伊赫提亚尔这样的古尔将领们纷纷效仿继业者们，在古尔王朝的版图中裂土称王。尽管伊赫提亚尔本人在1206年遭到了暗杀，但他所建立的哈尔吉王朝却成为了孟加拉地区第一个重要的穆斯林王朝。\n\n#bold 在印度与伊朗的边境上，你将成为一名怎样的战士？是勇猛无畏的征服者，还是智勇双全的守护者？#!\n\n#italic 此剧本可以游玩【梵衍那：光照之地】、【摩揭陀：佛怒金刚座】、【帕米尔与尊日教：世界屋脊】风味包#! "
 bookmark_RICE_1178_ikhtiyar_al_din_alt_muhammad_of_ghor:0 "穆罕默德"
 bookmark_RICE_1178_ikhtiyar_al_din_alt_laksmana:0 "罗叉摩那"
 bookmark_RICE_1178_al_nasir:0 "纳西尔"
 bookmark_RICE_1178_al_nasir_desc:0 "伊斯兰世界分崩离析之际，阿拔斯王朝暗淡之时，最后一位真正有实权的阿拔斯哈里发——纳西尔此生都在重振阿拔斯王朝，西拒基督徒，东征花赖子模，暮年更是警觉并忧虑蒙古之威胁，奈何此后不久身死回归真主，其重孙穆斯台绥木无力抗拒蒙古大军，最终与巴格达一同付之一炬。\n\n#bold 你是否有能力挽狂澜于既倒，扶阿拔斯之将倾？#!\n\n#italic 此剧本可以游玩【胡齐斯坦：甘蔗之乡】、【红海：东部沙漠之宝】、【索科特拉：龙血岛】风味包#!"
 bookmark_RICE_1178_al_nasir_alt_al_mustadi:0 "穆斯塔迪"
 bookmark_RICE_1178_genghis_khan:0 "铁木真"
 bookmark_RICE_1178_genghis_khan_desc:0 "昔铁木真，乃蒙古部族之子也。其父也速该，为部族之长，后遭仇敌所害。铁木真幼年失怙，其族弃之，无依无靠，与母弟流落荒原，艰难度日。其后，历经战阵，立志统一蒙古诸部，征服四海。\n\n#bold 混沌草原闻鹫鸣，翱翔天际世皆惊。纵横捭阖平欧亚，大略雄才傲杰英。#!\n\n#italic 此剧本可以游玩【西伯利亚：驯鹿人】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1178_genghis_khan_alt_borte:0 "孛儿帖"
 bookmark_RICE_1178_genghis_khan_alt_hoelun:0 "诃额伦"
 bookmark_RICE_867_zhai_xin:0 "翟信"
 bookmark_RICE_867_zhai_xin_desc:0 "敦煌翟氏，显贵至今百年。翟信虽是个小官吏，但其伯父法荣则是受人尊敬的医师和敦煌高僧，未来其子奉达更是敦煌最著名的学者之一，专攻天文学和历法。\n\n#bold 三端俱全大丈夫，六艺堂堂世上无。男儿不学读诗赋，恰似肥菜根尽枯。#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_867_zhai_xin_alt_farong:0 "法荣"
 BOOKMARK_RELATION_RICE_TOP_LIEGE:0 "（最高领主）"
 BOOKMARK_RELATION_RICE_FELLOW_VASSAL:0 "（同僚封臣）"
 bookmark_RICE_1066_dpal_dus_sgra:0 "$dpal_dus_sgra$"
 bookmark_RICE_1066_dpal_dus_sgra_desc:0 "在拉达克地区发现了11世纪的铭文，赞扬一位名叫$dpal_dus_sgra$的$k_guge$官员。他曾治理古格的边境省份#italic 勃律#! (可能指帕米尔地区的$burusho$)，但$k_guge$后来失去了这片土地。尽管如此，像$ChE_chentsa_TsE_dE_$这样的$k_guge$国王仍然拥有强大的力量，古老的吐蕃帝国崩溃后，古格王室对藏传佛教的复兴产生了深远的影响。\n\n#bold 在曾经被传奇象雄王国统治的历史中，你将扮演什么角色？#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【帕米尔与尊日教：世界屋脊】、【塔里木盆地：丝路之人】、【象雄：琼鸟之地】风味包#!"
 bookmark_RICE_1066_dpal_dus_sgra_alt_liege:0 "$ChE_chentsa_TsE_dE_$"
 bookmark_RICE_1066_dpal_dus_sgra_alt_hrugs_wer:0 "$chakchang_lhadok$"
 bookmark_RICE_1178_roman_mtislavich:0 "罗曼·姆斯季斯拉维奇"
 bookmark_RICE_1178_roman_mtislavich_desc:0 "罗曼·姆斯季斯拉维奇，世人皆称为罗曼大帝，他与拜占庭帝国建立了联系，与库曼人交战，一统加利西亚和沃利尼亚公国，成为当代最强大的留里克王朝王公，1205年，他与波兰人断绝联盟，而后与波兰人的扎维霍斯特战役中，战死疆场，这让加利西亚-沃利尼亚陷入继承权战争以及直面蒙古入侵。\n\n#bold 留里克王朝同室操戈已久，你能团结起来，并在东欧边境建立一个新的繁荣王国吗？#!\n\n#italic 此剧本可以游玩【加利西亚‑沃利尼亚：红罗斯边疆】、【莫尔多瓦：伏尔加河畔】、【波拉比亚：斯维托维德之盾】风味包#!"
 bookmark_RICE_1178_roman_alt_konchek:0 "$KO_nC_ek$"
 bookmark_RICE_1178_roman_alt_casimir:0 "$Kazimierz$"
 bookmark_RICE_1178_oleg:0 "奥列格·雅罗斯拉维奇"
 bookmark_RICE_1178_oleg_desc:0 "奥列格是哈利奇“大智者”雅罗斯拉夫和阿纳塔西娅私通之子，不过哈利奇的波雅尔们指控她为女巫，声称她用巫术蛊惑了“大智者”雅罗斯拉夫，最终将她处以火刑。哪怕如此，雅罗斯拉夫还是打算将奥列格立为继承人，来取代弗拉基米尔，但奥列格被波雅尔们推翻，奥列格历经千辛重登公位，可惜不久就被毒死。\n\n#bold 你那荒淫无道的同父异母兄弟，在弑母贼臣的波雅尔们支持下，占据属于你的遗产，而你能在这前狼后虎的环绕下生存下来吗？#!\n\n#italic 此剧本可以游玩【加利西亚‑沃利尼亚：红罗斯边疆】、【莫尔多瓦：伏尔加河畔】、【波拉比亚：斯维托维德之盾】风味包#!"
 bookmark_RICE_1178_oleg_alt_vladimir:0 "弗拉迪米尔·雅罗斯拉维奇"
 bookmark_RICE_1178_oleg_alt_yaroslav:0 "雅罗斯拉夫·奥斯莫梅斯尔"
 bookmark_RICE_1178_margaret_of_beverley:0 "玛格丽特"
 bookmark_RICE_1178_margaret_of_beverley_desc:0 "玛格丽特出生于耶路撒冷，当时她的父母正在那里朝圣。父母去世后，她抚养了弟弟托马斯，后来这位托马斯将成为修士并记载她的生平。第三次十字军东征期间她重返耶路撒冷，成为极少数有史料记载的女性十字军战士，参与过许多战役。\n\n#bold 在这个女性参军被当作怪胎嘲笑的年代，你能战胜心中恐惧，为全主基督而战吗？#!\n\n#italic 此剧本可以游玩【约克郡：前往斯卡伯勒集市】风味包#!"
 bookmark_RICE_1178_margaret_of_beverley_alt_thomas:0 "托马斯"
 bookmark_RICE_867_azjur_al_turki:0 "阿居尔·图尔基"
 bookmark_RICE_867_azjur_al_turki_desc:0 "阿居尔·图尔基是一位试图严格执行伊斯兰教法的总督，阿拔斯哈里发短暂任命他为埃及总督之前就已不得人心，他很快被突厥奴隶兵出身的暴发户艾哈迈德·伊本·突伦取代了。\n\n#bold 真主安排玄妙莫测，或许这是人生重来的机会：是另寻更光明的仕途，还是转而追求灵魂的升华？#!\n\n#italic 此剧本可以游玩【红海：东部沙漠之宝】、【锡瓦：西部沙漠绿洲】、【上埃及：尼罗河之子】风味包#!"
