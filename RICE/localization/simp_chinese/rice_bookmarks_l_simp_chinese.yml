 bookmark_RICE_1066_chen_pingshan:0 "$dynn_Chen_9673$$pingshan_5E73_5C71$"
 bookmark_RICE_1066_chen_pingshan_desc:0 "11世纪时$manichean$已走向衰落，若非贞明内院立正林瞪真君授侣三山，使这一信仰得以延续数百年，恐怕当时便会消亡。林瞪仙逝后，其弟子陈平山尊者接续了守护与传播光明佛摩尼教义的艰巨使命。\n\n#bold 光明信仰，系于君掌。尘寰晦暗，可否拯苍生于浊世？#!\n\n#italic 此剧本可以游玩【摩尼教：光明之教】、【塔里木盆地：丝路之人】风味包#! "
 bookmark_RICE_1066_chen_pingshan_alt_lin_deng:0 "林瞪"
 bookmark_RICE_867_bokut:0 "仆固俊"
 bookmark_RICE_867_bokut_desc:0 "回鹘汗国的覆灭对回鹘人及其支持的摩尼教无疑是黑暗的一天。尽管在怀建可汗带领下，一迁塔里木盆地再建高昌回鹘，但外有汉人归义军虎视眈眈，内有[Glossary( '阿罗缓', 'ELECT_GLOSS' )]堕落腐朽传闻\n\n#bold 此等危机是接纳新信仰的前奏还是革新摩尼教的变奏？#!\n\n#italic 此剧本可以游玩【摩尼教：光明之教】、【塔里木盆地：丝路之人】风味包#! "
 bookmark_RICE_867_bokut_alt_zhang_yichao:0 "张议潮"
 bookmark_RICE_867_bokut_alt_mi_huaiyu:0 "米怀玉"
 bookmark_RICE_1066_yelu_yixin:0 "$dynn_YelU_$乙辛"
 bookmark_RICE_1066_yelu_yixin_desc:0 "耶律乙辛出身贫寒，却一路擢升成为辽道宗宠信的权臣。其贪腐行径与道宗贤后萧观音产生冲突，遂蛊惑君主处决皇后与太子。1083年阴谋败露后企图投奔宋朝，事败伏诛。\n\n#bold 你对权势财富的追逐会从内部瓦解辽帝国吗？#!\n\n#italic 此剧本可以游玩【西伯利亚：驯鹿人】、【塔里木盆地：丝路之人】#!"
 bookmark_RICE_1066_yelu_yixin_alt_xiao_guanyin:0 "萧观音"
 bookmark_RICE_1066_yelu_yixin_alt_hongji:0 "$dynn_YelU_$洪基"
 bookmark_RICE_1178_moses_georgios:0 "$Moses_Georgios$"
 bookmark_RICE_1178_moses_georgios_desc:0 "$Moses_Georgios$统治着阿洛迪亚和马库里亚，这是基督教在努比亚的#italic 堡垒#!。1172年埃及入侵时，$Moses_Georgios$对萨拉丁派来要求他改信伊斯兰教的使者报以嘲笑，他用烙铁在使者手上烙下了一个十字架。虽然努比亚幸存，但并非毫发无损，两个王国在内斗、经济危机以及阿拉伯和非洲异教部落的袭击下延续了一个世纪就走向衰落。\n\n#bold 埃及人暂时撤退了，但你能在下次来犯之前再建努比亚吗？#!\n\n#italic 此剧本可以游玩【努比亚：库施继承者】、【红海：东部沙漠之宝】、【锡瓦：西部沙漠绿洲】、【南埃塞俄比亚：高地王国】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_1178_moses_georgios_alt_saladin:0 "$bookmark_swords_of_faith_saladin$"
 bookmark_RICE_1178_moses_georgios_alt_maria:0 "$Maria_Iesousikol$"
 bookmark_RICE_1178_moses_georgios_alt_adam:0 "亚当"
 bookmark_RICE_1066_kusbur:0 "库斯布尔"
 bookmark_RICE_1066_kusbur_desc:0 "达朱人流传着许多传说，解释他们如何在12世纪从努比亚迁徙至达尔富尔，接管了传说中托拉巨人曾经统治的土地。带领这次迁徙的国王身份各异：在某些传说中，他们是阿拔斯王朝的王子；在另一些传说中，则是亚历山大大帝的副手。某则传说中，一位名叫库斯布尔的尊贵领袖成为达朱族首任国王，他在杰贝尔多巴山丘建造宫殿，最终坐在武器旁长眠于此。\n\n#bold 尽管只会在口口相传中隐约留存关于你的故事，但你在此地的所作所为将决定达尔富尔未来数百年之命运！#!\n\n#italic 此剧本可以游玩【努比亚：库施的继承者】风味包#!"
 bookmark_RICE_1066_marianos:0 "马里亚诺斯"
 bookmark_RICE_1066_marianos_desc:0 "几个世纪以来，诺巴提亚都长作为马库里亚的最高级别官员，一直掌管着努比亚与埃及接壤的北部边境。新任总督马里亚诺斯上任之际，正值埃及法蒂玛王朝陷入混乱，与此同时，马库里亚王室成员、具有远见的主教乔治斯正在倡导努比亚社会回归本土传统。\n\n#bold 尼罗河沿岸风云变幻——作为边疆守护者，你将如何应对？#!\n\n#italic 此剧本可以游玩【努比亚：库施的继承者】、【红海：东部沙漠之宝】、【锡瓦：西部沙漠绿洲】、【南埃塞俄比亚：高地王国】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_1066_marianos_alt_mena:0 "梅纳"
 bookmark_RICE_1066_marianos_alt_georgios:0 "乔治斯"
 bookmark_RICE_867_georgios:0 "乔治斯"
 bookmark_RICE_867_georgios_desc:0 "乔治斯作为王储时功绩卓著，甚至曾亲赴巴格达与阿拔斯王朝成功重订《易货条约》；然而继任国王后，他的权威正面临严峻挑战。近期他派遣侄儿尼迪前去征讨同时与埃及、努比亚为敌的阿拉伯军阀欧麦尔，不料纽蒂竟擅自与欧麦尔达成停战协议，更有传闻称，他正在密谋叛变！\n\n#bold 在这充满背叛与权谋的危局中，乔治斯毕生的经验能否助他为马库里亚带来和平？#!\n\n#italic 此剧本可以游玩【努比亚：库施的继承者】、【红海：东部沙漠之宝】、【锡瓦：西部沙漠绿洲】、【南埃塞俄比亚：高地王国】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_867_georgios_alt_niuty:0 "尼迪"
 bookmark_RICE_867_georgios_alt_merki:0 "梅尔基"
 bookmark_RICE_867_eldad_ha_dani:0 "“但人”伊利达"
 bookmark_RICE_867_eldad_ha_dani_desc:0 "公元9世纪，一位名叫伊利达的神秘犹太人来到北非和伊比利亚，向人们讲述他周游世界的奇幻经历。最令人称奇的是他声称自己的族人乃是流散的以色列但支派后裔，最终在非洲定居。有人说他是江湖骗子，但也有人相信他的故事蕴含真相……\n\n#bold 当你用这些记述令其他犹太人沉醉并深受鼓舞时，你会揭示关于你自己和犹太民族的哪些真相？#!\n\n#italic 此剧本可以游玩【努比亚：库施的继承者】、【红海：东部沙漠之宝】、【索科特拉：龙血岛】风味包#!"
 bookmark_RICE_1066_nasir_al_dawla:0 "纳西尔·道莱"
 bookmark_RICE_1066_nasir_al_dawla_desc:0 "纳西尔·道莱是一位法蒂玛帝国将领，出身曾统治叙利亚大部分地区的哈姆丹宗族。如今非洲、突厥和柏柏尔军团内斗并在尼罗河沿岸劫掠，尼罗河水患肆虐，洪水泛滥，饿殍遍地。让法蒂玛帝国四分五裂。作为突厥军团统帅的纳西尔·道拉击败非洲军团，以埃及独裁者身份夺取大权，但期间暴虐无道，最终死于刺杀，而后亚美尼亚将领巴德尔·贾迈利恢复了埃及秩序。\n\n#bold 你将在埃及的高压统治下，还会招致覆亡？#!\n\n#italic 此剧本可以游玩【努比亚：库施的继承者】、【红海：东部沙漠之宝】、【索科特拉：龙血岛】风味包#!"
