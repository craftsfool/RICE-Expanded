 bookmark_RICE_867_balaputradewa:0 "波梨补陀罗提婆"
 bookmark_RICE_867_balaputradewa_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_867_balaputradewa_desc:0 "尽管波梨补陀罗提婆统治着强大的海上帝国室利佛逝，但他的权力曾经更为显赫。作为势连陀罗宗族的成员，他曾统治中爪哇的马塔兰王国，却因卑鄙的表亲珊阇耶家族而被迫离开。室利佛逝与马塔兰世代为敌，直到波梨补陀罗提婆的后裔最终通过协助叛乱者倾覆马塔兰，完成了复仇。\n\n#bold 你会为波梨补陀罗提婆的耻辱复仇，还是专注于建设室利佛逝的经济和政治影响力？#!\n\n#italic 此剧本可以游玩【亚斯里人：林中和睦】、【室利楞伽：僧伽论道】风味包#! "
 bookmark_RICE_867_ngo_man:0 "吴旻"
 bookmark_RICE_867_ngo_man_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_867_ngo_man_desc:0 "越南脱离中原统治的过程，并不像旧史书描绘的那般界限分明。这一进程始于唐朝衰微之际，朝野动荡为野心家们创造了建立新秩序的机会，例如官吏吴旻之子吴权，他建立了吴朝，成为数百年来首位独立的越南统治者。\n\n#bold 大唐式微，吴旻及其后人等越南权贵，将把越南带往何方？#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【塔里木盆地：丝路之人】、【杭州：临安风华】风味包#! "
 bookmark_RICE_1066_anawrahta:0 "阿奴律陀"
 bookmark_RICE_1066_anawrahta_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_1066_anawrahta_desc:0 "缅甸的传统编年史将蒲甘帝国的建立定于1044年，即阿奴律陀登上蒲甘王位之时。他随后通过历史上首次统一伊洛瓦底江流域、确立上座部佛教为国教，并遏制了强大的高棉帝国的扩张，为缅甸民族认同奠定了基础。\n\n#bold 作为缅甸最伟大的国王之一，你已成就斐然：能否再创更辉煌的功业？#!\n\n#italic 此剧本可以游玩【摩揭陀：佛怒金刚座】、【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_1066_anawrahta_alt_kyansittha:0 "江喜陀"
 bookmark_RICE_1066_anawrahta_alt_manisanda:0 "玛尼山达"
 bookmark_RICE_1066_ly_thuong_kiet:0 "李常杰"
 bookmark_RICE_1066_ly_thuong_kiet_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_RICE_1066_ly_thuong_kiet_desc:0 "李常杰，原名吴俊，后改姓李，字常杰。他既是宦官，也是越南历史上最伟大的军事统帅之一，曾率领大越军队击退宋朝的入侵，并据传创作了著名诗篇[Glossary( '《南国山河》', 'NAM_QUOC_SON_HA_GLOSS' )]，以宣示大越的主权。\n\n#bold 随着中华与大越朝廷之间的紧张局势升级，南帝乃至整个南国大越，可能很快将召唤你去引领祖国，走向胜利。#!\n\n#italic 此剧本可以游玩【杭州：临安风华】、【摩揭陀：佛怒金刚座】、【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_1066_ly_thuong_kiet_alt_ly_thuong_hien:0 "李常宪"
 bookmark_RICE_1066_ly_thuong_kiet_alt_than_canh_phuc:0 "申景福"
 bookmark_RICE_1066_song_jiang:0 "宋江"
 bookmark_RICE_1066_song_jiang_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_RICE_1066_song_jiang_desc:0 "[Glossary( '《水浒传》', 'WATER_MARGIN_GLOSS' )]是中国[Glossary( '四大名著', 'FOUR_GREAT_CLASSIC_NOVELS_GLOSS' )]之一，讲述了以宋江为首的108位好汉聚义梁山的故事。历史上，宋江本为反抗朝廷的起义军首领，后接受招安为宋朝效力，逐渐演变为民间传颂的英雄人物。\n\n#bold 四海之内皆兄弟：聚义英雄，替天行道，成就东亚最伟大的传奇之一！#!\n\n#italic 此剧本可以游玩【杭州：临安风华】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1178_jayavarman_vii:0 "阇耶跋摩七世"
 bookmark_RICE_1178_jayavarman_vii_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_1178_jayavarman_vii_desc:0 "高棉僭主帝利部婆那迭多的统治最终被占婆王阇耶·因陀罗跋摩四世率领的入侵所终结。高棉帝国仅在阇耶跋摩七世的统治下得以保全，他驱逐了占人，重建了吴哥城，改善民生，在其领地内弘扬佛法，成为了历史上最伟大的高棉君主。\n\n#bold 吴哥窟仍然处于被占族强盗毁灭的废墟中，现在是行侠并以此成帝业之时，更是一位有才干的君主拯救高棉的时刻了！#!\n\n#italic 此剧本可以游玩：【亚斯里人：林中和睦】，【摩揭陀：佛怒金刚座】，【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_1178_jayavarman_vii_alt_jayarajadevi:0 "阇耶罗阇提毗"
 bookmark_RICE_1178_jayavarman_vii_alt_jaya_indravarman_iv:0 "阇耶因陀罗跋摩四世"
 bookmark_RICE_1178_lu_you:0 "陆游"
 bookmark_RICE_1178_lu_you_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_1178_lu_you_desc:0 "诗人兼官员的陆游一生都伴随着悲剧与失意。年轻时，母亲强迫他与挚爱——发妻唐琬分离；晚年，他又徒劳地试图说服宋朝皇帝北伐女真，收复北方失地。\n\n#bold 朝廷充斥着目光短浅、自私自利的官员。是时候辞官归隐，潜心文学，以伟大爱国诗人的身份青史留名了吗？#!\n\n#italic 此剧本可以游玩【杭州：临安风华】、【塔里木盆地：丝路之人】风味包#! "
 bookmark_RICE_1178_lu_you_alt_tang_wan:0 "唐婉"
 bookmark_RICE_867_bah_lud:0 "巴卢"
 bookmark_RICE_867_bah_lud_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_867_bah_lud_desc:0 "马来西亚原住民#italic 亚斯里#!族之中最大的塞迈族颂着一位叫巴卢的英雄，他孱弱的外表掩盖了他与生俱来的天赋和超自然的力量。在得到了[Glossary( '古尼格', 'GUNIG_GLOSS' )]的帮助后，他完成了许多壮举，诸如从七首恶鹏的手中救出一位马来王的女儿，此后娶了这位公主。\n\n#bold 你会完成什么功业，让塞迈人累世不忘你的功业呢？#!\n\n#italic 此剧本可以游玩【亚斯里人：林中和睦】、【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_867_bah_lud_alt_inak:0 "伊纳"
 bookmark_RICE_867_gung_ye:0 "$Gung_ye$"
 bookmark_RICE_867_gung_ye_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_RICE_867_gung_ye_desc:0 "当$Gung_ye$王子出生时，一位星官警告说他将导致新罗的灭亡，因此国王下令杀掉这个孩子。尽管被一位侍女所救，但他也因此瞎了一只眼。作为僧人在寺院度过了早年时光后，他领导了一次成功的反新罗起义，自为后高句丽王。在后世可能带有偏见的史料中，他被描绘为一个残忍好杀，自称[Glossary( '弥勒', 'MAITREYA_GLOSS' )]下生的暴君。\n\n#bold 让你家族被他们自己避免预言的尝试毁灭：弥勒啊，成为未来佛摧毁新罗的工具吧！#!\n\n#italic 此剧本可以游玩【塔里木盆地：丝路之人】风味包#! "
 bookmark_RICE_867_gung_ye_alt_eung_ryeom:0 "$Eung_ryeom$"
 bookmark_RICE_867_shinnyo:0 "$Shin_nyo$"
 bookmark_RICE_867_shinnyo_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_RICE_867_shinnyo_desc:0 "年幼时，$Shin_nyo$曾是日本的皇太子，但宫廷阴谋迫使他放弃了这一头衔。青年时期，他的头衔与荣誉得以恢复，但他摒弃了世俗颓废的宫廷生活，选择皈依佛门。他成为日本[Glossary( '真言', 'SHINGON_GLOSS' )]宗创始人空海的首席弟子。晚年，他启程前往印度朝圣，但在公元881年，于中国求学的日本僧人得知消息：$Shin_nyo$可能已在今马来西亚境内圆寂。\n\n#bold $Shin_nyo$能否实现抵达印度的夙愿？#!\n\n#italic 此剧本可以游玩【亚斯里人：林中和睦】、【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_867_pei_toutuo:0 "$dynn_Pei_88F4$$Toutuo_982D_9640$"
 bookmark_RICE_867_pei_toutuo_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_RICE_867_pei_toutuo_desc:0 "《白蛇传》作为中国最受欢迎的民间传说之一，讲述了一段关于白蛇精白素贞与其夫许仙的爱情故事，他们遭到反派角色——一位狂热过头的僧人与卫道士法海的阻挠。法海这一形象很可能是历史上同名僧人与晚唐时期一位名叫$dynn_Pei_88F4$$Toutuo_982D_9640$的僧人融合而成，后者是一位德行高尚的苦修者，据传曾驱走一条危害人畜的白色巨蟒。\n\n#bold 身为隐士，你不在意他人如何看待你，无论好坏；当大唐日渐衰微，你将如何践行佛陀的教诲？#!\n\n#italic 此剧本可以游玩【杭州：临安风华】、【塔里木盆地：丝路之人】风味包#!"
 bookmark_RICE_1066_kong_zongyuan:0 "$dynn_Kong_5B54$$Zongyuan_5B97_613F$"
 bookmark_RICE_1066_kong_zongyuan_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_RICE_1066_kong_zongyuan_desc:0 "身为至圣先师孔子的后裔，是莫大的荣耀。如今，$dynn_Kong_5B54$$Zongyuan_5B97_613F$更赢得了进一步的尊荣：作为孔子的重要后裔之一，宋朝皇帝恩赐他衍圣公的封号。近千年来，他的子孙将继承这一爵位，直至二十世纪。\n\n#bold 既然你已被正式确认为孔子的重要后裔，你将如何延续这一显赫家族的传承？#!\n\n#italic 此剧本可以游玩【杭州：临安风华】、【塔里木盆地：丝路之人】#!"
 bookmark_RICE_1066_kong_zongyuan_alt_kong_ruomeng:0 "$dynn_Kong_5B54$$Ruomeng_82E5_8499$"
 bookmark_RICE_1066_kong_zongyuan_alt_kong_ruoxu:0 "$dynn_Kong_5B54$$Ruoxu_82E5_865A$"
 bookmark_RICE_1178_wo_daochong_alt_wotela:0 "斡特剌"
 BOOKMARK_RELATION_PUPIL:0 "（学生）"
 bookmark_RICE_1178_ruaidri:0 "$RuaidrI_$·乌·$dynn_Conchobair$"
 bookmark_RICE_1178_ruaidri_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_1178_ruaidri_desc:0 "罗里耗费数十年，通过战争、外交与谋略，确立了自己作为爱尔兰至高王的统治地位。然而他的敌人于1169年引来盎格鲁‑诺曼人来对抗他时，他战败了，被迫放弃至高王位，但他注定成为爱尔兰历史上最后一位毫无争议的至高王。\n\n#bold 当诺曼人入侵时，一切皆变或并非如此？这些强大且危险的新来者，是敌是友皆待你来定夺，你仍有时间改变爱尔兰历史的进程！#!\n\n#italic 此剧本可以游玩【梅奥：石楠与紫衫】、【约克郡：前往斯卡伯勒集市】、【北大西洋：北海争霸】风味包#!"
 bookmark_RICE_1178_ruaidri_alt_henry:0 "亨利二世"
 bookmark_RICE_1178_ruaidri_alt_aoife:0 "$AI_fe$"
 bookmark_RICE_1066_constantine_the_african:0 "康斯坦丁"
 bookmark_RICE_1066_constantine_the_african_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_RICE_1066_constantine_the_african_desc:0 "北非商人康斯坦丁抵达意大利时，他对当地医学知识的匮乏感到不安——即便在萨莱诺这座著名的医学院也是如此。凭借熟悉多种语言与广博的医学造诣，他将传授希腊与伊斯兰医学视为毕生使命，最终以修士身份定居于著名的卡西诺山修道院，并在此完成了不朽巨著#italic 《医学全书》#!。#!\n\n#bold 舍弃逐利的世俗生活，去履行你作为译者、医者与导师的宿命吧！#!\n\n#italic 此剧本可以游玩【撒丁岛：法官之治】、【西西里：三个世界交汇处】风味包#!"
 bookmark_RICE_1066_constantine_the_african_alt_johannes:0 "叶海亚"
 bookmark_RICE_1066_constantine_the_african_alt_atto:0 "阿托"
 bookmark_RICE_1066_said_ibn_najah:0 "赛义德·伊本·纳贾"
 bookmark_RICE_1066_said_ibn_najah_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_RICE_1066_said_ibn_najah_desc:0 "纳贾是一位埃塞俄比亚奴隶，在也门建立起强大的宗族，引来了诸如苏莱赫氏族等嫉妒的对手。在苏莱赫氏族派遣美貌女奴毒杀纳贾并夺取其领地后，他的幼子赛义德与贾亚什逃往达赫拉克。在这座偏远的岛屿上，他们计划为亡父复仇。\n\n#bold 傲慢狡诈的赛义德与正直隐忍的贾亚什，能否搁置分歧，联手击败苏莱赫家族？#!\n\n#italic 此剧本可以游玩【努比亚：库施继承者】、【红海：东部沙漠之宝】、【索科特拉：龙血岛】、【南埃塞俄比亚：高地王国】、【上埃及：尼罗河之子】风味包#!"
 bookmark_RICE_1066_said_ibn_najah_alt_jayyash:0 "贾亚什"
 bookmark_RICE_1066_said_ibn_najah_alt_sulayhid:0 "阿里"
 bookmark_RICE_1178_rahabhan:0 "拉赫班"
 bookmark_RICE_1178_rahabhan_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_1178_rahabhan_desc:0 "传说在很久以前，当欧洲人入侵时，一位名叫拉赫班的狡猾索科特拉酋长绑架了他们中的一名女子，并假装吃掉她，惊恐的侵略者便逃之夭夭。后来他娶了这名女子——一位成为他信赖伴侣的女巫。虽然这个传说的早期版本可能涉及不同来源的入侵者，但它反映了索科特拉人民令人畏惧的超自然力量。\n\n#bold 据说拉赫班死于与敌对索科特拉部族的战斗中；借助你外来妻子的帮助，你能避免这种命运，并将索科特拉变成令七海中众生闻风丧胆的岛屿吗？#!\n\n#italic 此剧本可以游玩【红海：东部沙漠之宝】、【索科特拉：龙血岛】、【南埃塞俄比亚：高地王国】、【室利楞伽：僧伽论道】风味包#!"
 bookmark_RICE_1178_rahabhan_alt_wife:0 "玛丽亚"
 bookmark_RICE_1178_rahabhan_alt_hege:0 "赫格"
 BOOKMARK_RELATION_RICE_ADVENTURER:0 "（冒险者）"
 bookmark_RICE_1066_tidore:0 "萨贾蒂"
 bookmark_RICE_1066_tidore_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_RICE_1066_tidore_desc:0 "在1081年，一位名为萨贾蒂的统治者建立了蒂多雷苏丹国，其征程甚至早于人民皈依伊斯兰教之前，并在数个世纪与其对手特尔纳特苏丹国争夺东南亚的海上贸易路线，最终在文老古和巴布亚大部分地区成为主导力量\n\n#bold 这是文老古历史的序幕，你能将蒂多雷打造成一个富裕的海洋霸权吗？#!\n\n#italic 此剧本可以游玩【亚斯里人：林中和睦】、【大洋洲：最终边疆】风味包#! "
 bookmark_RICE_1066_tidore_alt_ternate:0 "萨班"
 bookmark_RICE_1066_tidore_alt_biak:0 "拉基"
