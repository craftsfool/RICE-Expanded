 building_type_RICE_bozo_bandiagara_escarpment:0 "邦贾加拉悬崖"
 building_type_RICE_bozo_bandiagara_escarpment_desc:0 "在班迪亚加拉地区，沙质高原、悬崖与平原交织的地带散布着无数村落，尤其在那拔地而起高达数百米的邦贾加拉悬崖处，人们依崖而建房屋、谷仓、集会厅与瞭望塔。这里地处险峻荒僻之境，易守难攻，承载着极其重要的文化与宗教意义。"
