 bozo.0050.t:0 "泥瓦匠"
 bozo.0050.desc:0 "我宅中有处地方已经摇摇欲坠，急需修理。它是典型的[ROOT.Char.GetCulture.GetName]风格，用传统的泥砖建造。\n\n无论如何，我已经联系了当地的泥瓦匠行会来维修。一位泥瓦匠师傅检查完这处结构后，说加固现存的泥浆砌筑应该不难，但在咨询了一些[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]后，他说显然这里有[ROOT.Char.GetFaith.DevilName]的邪恶力量存在。\n\n开始维修的那一天，那位泥瓦匠师傅和几位同事学徒一起，将几件受祝福的圣物埋在这处泥浆砌筑旁，然后念叨着各种咒语和祷词。“祝福和泥砖本身一样重要。”泥瓦匠事后告诉我。"
 bozo.0050.a:0 "不管怎样，还是要谢谢你的辛勤工作。"
 bozo.0051.t:0 "泥瓦匠的秘密"
 bozo.0051.desc:0 "泥瓦匠是[ROOT.Char.GetCulture.GetName]社会无处不在的一部分。他们建造和维护了许多我们日常使用的建筑。\n\n今天，我路过遇见了一些泥瓦匠，他们正在为当地人建一座大房子。他们正在进行每日的祷告。于是我观察了他们许久。\n\n我忍不住想偷听他们[ROOT.Char.GetFaith.GetAdjective]的诵读和祈祷，但什么都听不清。唉，泥瓦匠们对其秘密知识是出了名的保护，从不向外人透露。我听说有些泥瓦匠甚至向同伴们隐瞒他们从师傅那里学到的独家秘方！"
 bozo.0051.a:0 "他们的秘密一定很厉害！"
 bozo.0051.b:0 "也许这些仪式都是在做秀。"
 bozo.0052.t:0 "泥浆砌筑的新合约"
 bozo.0052.desc:0 "大多数[ROOT.Char.GetCulture.GetName]家庭都与泥瓦匠师傅签订了合约，由其负责泥浆砌筑的定期维护。\n\n唉，我家承包多年的泥瓦匠师傅最近去世了。按照传统，合约会传给其学徒——通常是泥瓦匠师傅的亲人。\n\n事实上，我认识这位新师傅，我曾观察过他工作。我对他的能力抱有信心，他也向我保证，他会尊重亲人的遗产，努力维护我家的建筑。"
 bozo.0052.a:0 "我相信你会做得很好。"
 bozo.0053.t:0 "维护泥瓦建筑"
 bozo.0053.desc:0 "我需要在我的住宅区建造一个小结构，并雇用一些[ROOT.Char.GetCulture.GetName]的瓦匠来做这项工作。正如预期的那样，他们在开始之前会进行一些牺牲、祈祷以及其他仪式。\n\n然而，瓦匠工头告诉我，该站点可以使用善者的灵魂来获得一些额外的护佑。假设这对我来说没问题的话，那么我将需要获得一些谷物和动物骨头，让泥瓦匠将它们埋在未来建筑物的角落里。"
 bozo.0053.a:0 "我们已经有足够的护佑了。"
 bozo.0053.b:0 "格外小心也无妨。"
 bozo.0053.c:0 "我决不容忍非[ROOT.Char.GetFaith.GetReligion.GetAdjective]的异教徒的做派！"
