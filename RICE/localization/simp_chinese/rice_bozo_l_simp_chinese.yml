 activity_RICE_bozo_tapama_djenepo_tomb_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_bozo_tapama_djenepo_tomb' ).GetName]已经结束。能够来到她的墓前是我莫大的荣幸。"
 RICE_bozo_tapama_djenepo_tomb_type:0 "访墓类型"
 RICE_bozo_tapama_djenepo_tomb_type_devotion:0 "奉献之行"
 RICE_bozo_tapama_djenepo_tomb_type_devotion_desc:0 "\n$EFFECT_LIST_BULLET$在其他[piety|E]收益上额外获得#V 100#![piety_i|E]\n$EFFECT_LIST_BULLET$与其他选项相比，[GetTrait('pilgrim').GetName( GetNullCharacter )][trait|E]获得双倍的[trait_level_track_xp|E]。\n\n#weak 虽然我们不一定是去一个重要的圣地旅行，但我们仍然是在朝圣，心之所向，诚之所至。#!"
 RICE_bozo_tapama_djenepo_tomb_type_observance:0 "民俗之途"
 RICE_bozo_tapama_djenepo_tomb_type_observance_desc:0 "\n$EFFECT_LIST_BULLET$在其他[prestige|E]收益上额外获得#V 100#![prestige_i|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_bozo_engaged_with_local_religious_practices').GetNameWithTooltip][character_modifier|E]。\n\n#weak 通过依照当地习俗，尊重[GetPlayer.GetFaith.PantheonTerm]，你可以证明不管如何皆是你的子民。#!"
 RICE_bozo_tapama_djenepo_tomb_type_vacation:0 "精神之旅"
 RICE_bozo_tapama_djenepo_tomb_type_vacation_desc:0 "\n$EFFECT_LIST_BULLET$与其他选项相比，失去更多的[stress_loss_i|E][stress|E]。\n\n#weak 宗教经历和精神之旅可以抚慰身体与精神，并使人更接近[GetPlayer.GetFaith.PantheonTerm]#!"
 RICE_bozo_tapama_djenepo_tomb_pilgrimage_phase:0 "$pilgrimage_phase_solo$"
 RICE_bozo_tapama_djenepo_tomb_pilgrimage_phase_desc:0 "$pilgrimage_phase_solo_desc$"
 RICE_bozo_tapama_djenepo_tomb_worship_intent_header:0 "朝拜："
 RICE_bozo_tapama_djenepo_tomb_worship_intent:0 "朝拜"
 RICE_bozo_tapama_djenepo_tomb_worship_intent_desc:0 "你希望专注于[local_pilgrimage|E]的宗教方面。此选项在其他收益的基础上，获得更多的[piety_i|E][piety|E]。如果你拥有[GetTrait('zealous').GetName( GetNullCharacter )]或[GetTrait('calm').GetName( GetNullCharacter )]，会失去额外的[stress_loss_i|E][stress|E]。"
 RICE_bozo_tapama_djenepo_tomb_model_intent_header:0 "范世："
 RICE_bozo_tapama_djenepo_tomb_model_intent:0 "范世"
 RICE_bozo_tapama_djenepo_tomb_model_intent_desc:0 "你将以身作则，向该地区所有[GetPlayer.GetFaith.GetAdherentNamePlural]进行这次[local_pilgrimage|E]。此选项在其他收益的基础上，获得更多的[prestige_i|E][prestige|E]。如果你拥有[GetTrait('ambitious').GetName( GetNullCharacter )]或[GetTrait('diligent').GetName( GetNullCharacter )]，会失去额外的[stress_loss_i|E][stress|E]。"
 RICE_bozo_tapama_djenepo_tomb_curiosity_intent_header:0 "视察："
 RICE_bozo_tapama_djenepo_tomb_curiosity_intent:0 "视察"
 RICE_bozo_tapama_djenepo_tomb_curiosity_intent_desc:0 "你想更好地了解当地居民，和他们的问题，以及他们如何践行[GetPlayer.GetFaith.GetName]，同时去参加[local_pilgrimage|E]，此选项会在你选择的[lifestyle|E]中获得[experience|E]。如果你拥有[GetTrait('humble').GetName( GetNullCharacter )]或[GetTrait('just').GetName( GetNullCharacter )]，会失去额外的[stress_loss_i|E][stress|E]。"
