 bozo.0020.t:0 "万加腊人崛起"
 bozo.0020.desc:0 "多年来，一群讲曼德语的商人被称为#italic 万加腊#!一直在参与西非的黄金贸易，近年来他们在马里矿区的影响力越来越大。\n\n[wangara_founder.GetTitledFirstName]达成了协议统治着这些矿区的大部分，而万加腊商人们为了完全垄断对这些黄金的控制权，他们与其签订协议\n\n现在，#italic 万加腊商人#!正在成为该地区最有影响力的集体之一，这要归功于他们对黄金贸易的掌握，再加上他们不同的民族血缘，使他们在与他人打交道时有很多灵活性。现在，万加腊领导人甚至开始把目光投向黄金贸易以外的领域，通过在非洲各民族的社区中定居，寻求扩大其政治、商业和文化网络。"
 bozo.0020.a:0 "我们会对此保持密切关注。"
 bozo.0020.tooltip:0 "在[GetGeographicalRegion('world_africa_west').GetName]中的[cultures|E]现在可以解锁$innovation_RICE_wangara$[innovation|E]，如果其中的[culture_head|E]或一个强大的[ruler|E]采取$RICE_bozo_bring_in_wangara$[decision|E]。该[innovation|E]反过来解锁$RICE_bozo_wangara_synergy_decision$[decision|E]以及其他奖励。"
 bozo.0021.t:0 "万加腊商人抵达[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
 bozo.0021.desc:0 "万加腊商人是一群讲曼德语的商人，他们最初控制着马里的金矿，但多年来，万加腊业务已经扩展到非洲其他地区，并且贩卖盐、奴隶、可乐果等。\n\n直到最近，万加腊贸易网络与[ROOT.Char.GetCulture.GetName]社区的联系有限。由于[wangara_inviter.GetFirstName]，一个突出的[wangara_inviter.GetCulture.GetNameNoTooltip][wangara_inviter.GetTitleAsNameNoTooltip]，这种情况不再出现了。\n\n[wangara_inviter.GetFirstNameNoTooltip]已经向万加腊商人伸出橄榄枝，邀请他们在[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]中定居。这样一来，[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]将更好地融入万加腊商人现有的政治、商业和文化网络，从而更好地立足[GetGeographicalRegion('world_africa_west').GetName]地区。"
 bozo.0021.a:0 "我们双方都将从中受益。"
 bozo.0021.tooltip:0 "随着[wangara|E]群体融入社区，[GetPlayer.GetCulture.GetName][rulers|E]现在可以采取$RICE_bozo_wangara_synergy_decision$[decision|E]"
