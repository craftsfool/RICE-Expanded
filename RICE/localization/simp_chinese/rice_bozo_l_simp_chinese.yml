 bozo.0030.t:0 "献祭"
 bozo.0030.desc:0 "许多人认为[GetTitleByKey('c_jenne').GetNameNoTier]城目前的位置不再像祖先的时代那样繁荣昌盛。有些人担心频繁的洪水和自然灾害会摧毁这里，据说这些都是由邪恶的[ROOT.Char.GetFaith.DevilName]造成的，有些人声称这个地方不利于贸易，还有人说需要一个更好的地方来定居。"
 bozo.0030.desc.pagan:0 "以前迁都的尝试都失败了，据说是由于[ROOT.Char.GetFaith.DevilNamePossessive]的干扰。城市的神谕结果表明[ROOT.Char.GetFaith.PantheonTerm]需要一个年轻的处女灵魂才会帮助我们，现在当地名士之女塔帕玛·杰内颇，她将被活埋在新城墙之下。\n\n英勇无畏的塔帕玛·杰内颇说她会为我们族群的未来欣然赴死，并敦促我们努力工作，生活在和谐孝悌的氛围中，这样她的牺牲才不是徒劳的。"
 bozo.0030.desc.non_pagan:0 "相传，很久以前，这座城市就被灾难所困扰。一位当地名士之女——塔帕玛·杰内颇，被活埋在城墙上后这座城市的繁荣才能得以恢复。她勇敢地走向了自己的命运，为她的人民欣然赴死。\n\n有趣的是，当地人声称在新地点发现了女孩的坟墓！许多人说这是一个好兆头，并且塔帕玛·杰内颇的灵魂将护佑新城市。"
 bozo.0030.a:0 "我们为塔帕玛·杰内颇的牺牲而欠她许许多多。"
 bozo.0031.t:0 "[GetTitleByKey('c_jenne').GetNameNoTierNoTooltip]更改了位置"
 bozo.0031.desc:0 "[GetTitleByKey('c_jenne').GetNameNoTier]的定居点作为[GetGeographicalRegion('world_africa_west').GetName]的主要城市中心屹立无数代。最近，由于各种原因，当地人发现旧位置已经不太适宜居住了，而城市的统治者[jenne_mover.GetTitledFirstName]，也同意地认为有必要将城市搬到一个更为有利的地点。\n\n"
 bozo.0031.desc.pagan:0 "然而，早期迁都尝试失败了；该城的[ROOT.Char.GetFaith.GetAdjective]神谕指示当地人若想成功则必须牺牲一个年轻的处女，即塔帕玛·杰内颇。这位女孩心甘情愿地为了帮助她的人民而赴死。"
 bozo.0031.desc.non_pagan:0 "当他们搬到该城的新地点时，当地人发现了塔帕玛·杰内颇的坟墓。传说她是一位年轻的处女，多年前为了拯救这座城市幸免于难而心甘情愿地牺牲自我。"
 bozo.0031.desc.conclusion:0 "\n\n由于搬迁，贸易繁荣兴盛，人民安居乐业，杰内正处在一个崭新的且更具地理优势的区位。塔帕玛·杰内颇的坟墓俨然成为当地人的崇拜之所，他们希望向这位高尚且勇敢的女孩致敬。"
 bozo.0031.a:0 "杰内的历史翻开了新的篇章。"
 bozo.0031.tooltip:0 "[GetTitleByKey('c_jenne').GetNameNoTier]的[rulers|E]，或是有临近它的[capital|E]的统治者，现在可以[GetActivityType( 'activity_RICE_bozo_tapama_djenepo_tomb' ).GetName]"
 bozo.0032.t:0 "塔帕玛·杰内颇之墓"
 bozo.0032.desc:0 "我从行程中抽出时间，拜访了[GetTitleByKey('c_jenne').GetNameNoTier]的传奇人物塔帕玛·杰内颇的坟墓。在当地的传说中，她在危难之际听从了神谕，自愿牺牲，以寻求神助对抗邪魔的阴谋。少女欣然地接受了自己的死亡，她知道她的牺牲将确保这座城市的世世代代的繁荣昌盛。\n\n这些天来，当地人经常来到她的墓前，据说她就被活埋在这城墙之间。在那里，我做了一些[ROOT.Char.GetFaith.GetAdjective]的祈祷，她的灵魂肯定在守护着这座城市，希望也能给我一些祝福。"
 bozo.0032.a:0 "她的牺牲永不会被遗忘。"
