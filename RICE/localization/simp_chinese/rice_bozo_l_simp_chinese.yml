 RICE_bozo_mud_masons_castle_modifier_jenne_desc:0 "该角色与当地的杰内著名的[mud_masons|E]行会签订合约，涉及[castle_holdings|E]里的各种[buildings|E]建设和维护。"
 RICE_bozo_mud_masons_city_modifier_jenne:0 "雇用杰内的泥瓦匠（$game_concept_city_holdings$）"
 RICE_bozo_mud_masons_city_modifier_jenne_desc:0 "该角色与当地的杰内著名的[mud_masons|E]行会签订合约，负责[city_holdings|E]里的各种[buildings|E]建设和维护。"
 RICE_bozo_mud_masons_church_modifier_jenne:0 "雇用杰内的泥瓦匠（$game_concept_church_holdings$）"
 RICE_bozo_mud_masons_church_modifier_jenne_desc:0 "该角色与当地的杰内著名的[mud_masons|E]行会签订合约，负责[church_holdings|E]的各种[buildings|E]建设和维护。"
 RICE_bozo_recently_moved_Jenne:0 "杰内城新选址"
 RICE_bozo_recently_moved_Jenne_desc:0 "旧的杰内城已经被遗弃，在离旧址不远的地方重建了一个新的城市。这使该地区的经济和与其他贸易转口港的联系重新焕发了活力。"
 RICE_bozo_visited_tapama_djenepo_tomb:0 "拜访塔帕玛·杰内颇之墓"
 RICE_bozo_visited_tapama_djenepo_tomb_desc:0 "该角色最近拜访了塔帕玛·杰内颇之墓。相传她是为了这座城市得以建成而牺牲的。"
 RICE_bozo_wangara_political_synergy:0 "万加腊官僚吏员"
 RICE_bozo_wangara_political_synergy_desc:0 "该角色最近招揽了一些[wangara|E]作为官僚吏员"
 RICE_bozo_wangara_political_synergy_county:0 "万加腊政治协调"
 RICE_bozo_wangara_political_synergy_county_desc:0 "该地领主最近采取措施，将更多的[wangara|E]纳入地方社区的地方行政和政治网络。"
 RICE_bozo_wangara_commercial_synergy:0 "万加腊商业"
 RICE_bozo_wangara_commercial_synergy_desc:0 "该角色最近与[wangara|E]合作，鼓励在领土上进行贸易。"
 RICE_bozo_wangara_commercial_synergy_county:0 "万加腊商业协助"
 RICE_bozo_wangara_commercial_synergy_county_desc:0 "当地领主最近采取措施，协助[wangara|E]在该地区的社区扩大其商业网络。"
 RICE_bozo_wangara_cultural_synergy:0 "万加腊学者"
 RICE_bozo_wangara_cultural_synergy_desc:0 "该角色最近与领土中学富五车的[wangara|E]学者有联系。"
 RICE_bozo_wangara_cultural_synergy_county:0 "万加腊文化协调"
 RICE_bozo_wangara_cultural_synergy_county_desc:0 "当地领主最近采取措施，赞助[wangara|E]学者，改善这一地区社区的学习、宗教和艺术状况。"
 RICE_bozo_new_mud_mason_contract:0 "新的泥瓦匠合约"
 RICE_bozo_extra_protection_mud_masons:0 "额外保护泥瓦匠免受仪式之害"
 tradition_RICE_masters_of_the_river_name:0 "河流之主"
 tradition_RICE_masters_of_the_river_desc:0 "该文化被外界称为“河流之主”，因为他们擅长在尼日尔河及其支流上捕鱼和航行。据说，他们天生对尼日尔河拥有的亲和感和独特理解，而外界很少有人能做到。"
 tradition_RICE_african_mud_masons_name:0 "泥瓦匠"
 tradition_RICE_african_mud_masons_desc:0 "该文化的泥瓦匠用泥土烧制泥砖并建造精致的建筑而闻名。泥瓦匠们被组织成一个有复杂等级结构的行会，执行与工作相关的宗教仪式，并确保他们古老的泥瓦匠技艺以适当的方式代代相传。"
 culture_parameter_unlock_rice_sogo_ba_masquerade:0 "解锁举行“索歌芭”兽灵面具之舞[decision|E]"
 culture_parameter_unlock_rice_african_mud_mason_decision:0 "为那些属于该[culture|E]或统治该[culture|E][counties|E]的领主，解锁雇用非洲[mud_masons|E]的[decision|E]，进一步减少建造[buildings|E]的成本和时间。"
 culture_parameter_unlock_rice_trans_saharan_merchant_decision:0 "$RICE_trans_saharan_decision_unlocked_desc$"
 culture_parameter_unlock_rice_trans_saharan_merchant_better_chances:0 "$RICE_trans_saharan_trade_legacy_1_effect$"
 culture_parameter_unlock_rice_wangara_era_early:0 "将在$culture_era_early_medieval$而非$culture_era_high_medieval$[era|E]，解锁整合[wangara|E]社区的[decision|E]，从而获得$innovation_RICE_wangara$[innovation|E]和使用[wangara|E]机制。"
 tradition_RICE_gold_dust_traders_name:0 "金砂商人"
 tradition_RICE_gold_dust_traders_desc:0 "该文化的人民在西非参与黄金的生产、运输或贸易。无论他们在黄金贸易中扮演什么角色，他们都是跨撒哈拉商业、政治和文化网络的主要参与者，也以盐、奴隶和其他产品的贸易而闻名。"
 RICE_bozo_mud_masons_decision:0 "雇用非洲泥瓦匠"
 RICE_bozo_mud_masons_decision_tooltip:0 "我们[realm|E]上的[mud_masons|E]可以帮助我们进行建设项目"
 RICE_bozo_mud_masons_decision_desc:0 "[GetPlayer.GetCulture.GetName]群体有着悠久的[mud_masonry|E]传统。我想我也应该召集领地内的[mud_masons|E]行会来协助我完成各种建筑项目，他们的学识将确保我们的建筑经得起时间的考验！"
 RICE_bozo_mud_masons_decision_desc_not_culture:0 "我的[realm|E]上一些居民来自一个具有悠久[mud_masonry|E]传统的[culture|E]。我应该请他们的[mud_masons|E]行会协助我完成各种建筑项目，他们的学识将确保我们的建筑经得起时间的考验！"
 RICE_bozo_mud_masons_decision_effect_tooltip_1:1 "你获得[character_modifier|E]以减少[buildings|E]成本和建造时间"
 RICE_bozo_mud_masons_decision_effect_tooltip_2:1 "根据你[realm|E]中的[holdings|E]，你可以选择这些加成适用于哪些[holdings|E]"
 RICE_bozo_mud_masons_decision_effect_tooltip_3:1 "因为你拥有[GetTitleByKey('c_jenne').GetNameNoTier]，你将获得更强的[modifiers|E]"
 RICE_bozo_mud_masons_decision_confirm:0 "传唤泥瓦匠！"
 RICE_bozo_mud_masons_decision_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，泥砖一直是西非建筑的重要材料，杰内清真寺可能是这种建筑风格的集大成例子。泥瓦匠因世俗知识和神学知识而在整个地区受到尊重，因为在建造时不仅需要搭建建筑，还需要使用法术和咒语来保佑场地和驱除恶灵。例如杰内的许多泥瓦匠都是博若人，他们精通伊斯兰教的古兰经和他们所说的#italic bai bibi（非洲的秘密）#!，而且很少向外人透露其中的细节。"
