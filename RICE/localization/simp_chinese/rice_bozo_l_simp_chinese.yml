 bozo.0010.t:0 "泥瓦匠"
 bozo.0010.desc:0 "我已经联系了我领地内的泥瓦匠公会，通知他们我希望他们参与的各种建筑项目。作为神圣知识的守护者，[ROOT.Char.GetFaith.GetAdjective]仪式也会祝福我们的建筑并保佑其免受邪灵伤害。\n\n"
 bozo.0010.desc.culture:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]人对泥砌体有着与生俱来的理解，这是外人根本无法涉足的领域。我相信这些泥瓦匠驾驭[ROOT.Char.GetCulture.GetNameNoTooltip]的智慧将代代相传。\n\n"
 bozo.0010.desc.castle:0 "无论如何，我想要泥瓦匠能够专注于建造新建筑，或者维护我现存的[castle_holdings|E]。我们需要确保我们的城墙与防御是坚不可摧的！"
 bozo.0010.desc.city:0 "无论如何，我希望泥瓦匠能够专注于建造新建筑，或者维护我现存的[city_holdings|E]。他们的辛勤工作将确保我们的定居点持续繁荣下去。"
 bozo.0010.desc.church:0 "无论如何，我向泥瓦匠们表示，我希望他们能够专注于建造新建筑，或者维护我现存的[church_holdings|E]。[ROOT.Char.GetFaith.HighGodName]一定会对此感到满意！"
 bozo.0010.desc.general:0 "总之，我指示泥瓦匠们集中建造新建筑，或维护现存的各种[holdings|E]。在我的领地中还有许多工作要做。"
 bozo.0010.a:0 "他们的辛勤工作对我们的部族至关重要。"
 bozo.0011.t:0 "xxxxx"
 bozo.0011.desc:0 "xxxxx"
 bozo.0011.a:0 "xxxxx"
 bozo.0012.t:0 "埋葬我挚爱的[ROOT.Char.Custom2('RelationToMe', ROOT.Var('RICE_ghana_burial_ancestor').Char)|U]"
 bozo.0012.desc:0 "正如我们[ROOT.Char.GetCulture.GetName]的传统那样，我下令建造一个用金合欢木制成的大圆顶来埋葬[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstName]。结构已接近完成，因此我正在为葬礼做准备。\n\n通常，我们会牺牲仆人与奴隶，将他们与[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]一同安置在圆顶中。[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.PriestNeuterPlural]为我提供了一份为此场合献祭的仆人和奴隶的名单。"
 bozo.0012.desc.sacrifice:0 "\n\n但是，[ROOT.Char.GetFaith.PriestNeuterPlural]以他们的智慧，也向我建议，说我宫廷中的一些成员也可被牺牲。他们谈论道，如此便会取悦[ROOT.Char.GetFaith.PantheonTerm]。"
 bozo.0012.a:0 "[candidate_1.GetFirstName]将成为[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]的重要祭品。"
 bozo.0012.b:0 "[candidate_2.GetFirstName]的牺牲将会取悦[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]。"
 bozo.0012.c:0 "让我们献祭[candidate_3.GetFirstName]来表达对[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]的崇高敬意。"
 bozo.0012.d:0 "我希望献祭的仆人和奴隶将去侍奉[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]！"
 bozo.0012.sacrifice_tooltip:0 "代替默认的[piety_i|E]#P [GetPlayer.MakeScope.ScriptValue('major_piety_value')|0]#!，你将获得双倍的收益。"
 bozo.0013.t:0 "$bozo.0012.t$"
 bozo.0013.desc:0 "今天是[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNamePossessive]下葬的日子。我和整个宫廷陪同[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetHerHis]遗体走完最后一回，把它带到金合欢木圆顶里。我们放在有垫子的床上，有陪葬品、武器和器皿围绕着它，愿[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]来世可以大吃大喝。\n\n在这之后，我们将许多奴隶和仆人留在里面，然后我们用垫子和窗帘盖住穹顶，在墓顶上放置尽可能多的土，使其成为一个被壕沟包围的小山。\n\n在这之后，我们献祭并向[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetFirstNameNoTooltip]和其他祖先撒上美酒。"
 bozo.0013.desc.sacrifice:0 "祭品中有[sacrificial_victim.GetFirstName]，我和[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.PriestNeuterPlural]认为这将是个好人选。"
 bozo.0013.a:0 "愿你安息，亲爱的[ROOT.Char.Custom2('RelationToMe', ROOT.Var('RICE_ghana_burial_ancestor').Char)]。"
