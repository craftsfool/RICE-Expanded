 building_type_RICE_bozo_dia_mounds:0 "迪亚土丘"
 building_type_RICE_bozo_dia_mounds_desc:0 "迪亚的古老定居点土丘据说是西非许多不同民族和社会群体的发源地。除了拥有该地区较大的墓地之一外，它还是贸易、精神和文化交流的中心，是不同非洲民族的熔炉。"
 building_RICE_bozo_dia_mounds:0 "$building_type_RICE_bozo_dia_mounds$"
 building_RICE_bozo_dia_mounds_desc:0 "$building_type_RICE_bozo_dia_mounds_desc$"
 building_type_RICE_bozo_loropeni_fortress:0 "洛罗佩尼堡垒"
 building_type_RICE_bozo_loropeni_fortress_desc:0 "洛罗佩尼定居点附近宏伟的城墙与防御工事，是为了保障连接北非与南方金矿及林地王国的利润丰厚的跨撒哈拉贸易路线而建造的。"
