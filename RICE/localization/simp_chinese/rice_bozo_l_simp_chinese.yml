 RICE_bozo_establish_wangara_decision:0 "建立万加腊黄金垄断"
 RICE_bozo_establish_wangara_decision_tooltip:0 "允许[wangara|E]垄断马里金矿以实现利润最大化。"
 RICE_bozo_establish_wangara_decision_desc:0 "一群名为[wangara|E]的曼德语商人群体对[GetGeographicalRegion('world_africa_west').GetName]金矿的影响力越来越大。如果我们帮助他们建立对金矿的垄断地位，他们也在寻求在其他地方扩大业务并会为此回报我们，我们可以相互受益。"
 RICE_bozo_establish_wangara_decision_effect_tooltip_1:1 "如果该[culture_head|E]或强大的[ruler|E]采取$RICE_bozo_bring_in_wangara$[decision|E]，那么[GetGeographicalRegion('world_africa_west').GetName]中的其他[cultures|E]现在可以解锁$innovation_RICE_wangara$[innovation|E]，"
 RICE_bozo_establish_wangara_decision_effect_tooltip_2:1 "$innovation_RICE_wangara$[innovation|E]可以解锁$RICE_bozo_wangara_synergy_decision$[decision|E]"
 RICE_bozo_establish_wangara_decision_confirm:0 "黄金必须流动！"
 RICE_bozo_establish_wangara_decision_context_tooltip:0 "#emphasis 历史背景：#!在早期，黄金生产者本人也不愿意跟当地商人进行面对面的交易，而是以原始的以物易物，双方互不见面的“哑贸易”方式进行交易。早期阿拉伯商人和地理学家把苏丹产金地和从事苏丹长途贸易，特别是黄金贸易的商人统称为“万加腊人”。万加腊人由于经常往返于黄金产地与昆比等商埠之间，与阿拉伯和柏柏尔商人之间联系密切，所以较多地接受了伊斯兰教。"
 RICE_bozo_wangara_mine_req:0 "你拥有#V 两个#![GetBuilding('mali_mines_01').GetName][building|E]或其升级版[building|E]在[counties|E]中"
 RICE_bozo_bring_in_wangara:0 "把万加腊群体[ROOT.Char.GetCulture.GetNameNoTooltip]化"
 RICE_bozo_bring_in_wangara_tooltip:0 "[wangara|E]可以有效的帮助我们的社区"
 RICE_bozo_bring_in_wangara_desc:0 "[wangara|E]商人最初控制着马里的金矿，但多年来，他们不断扩张，实现商业业务的多样化，现在进行黄金以外的商品交易，我们应该主动让他们把[ROOT.Char.GetCulture.GetName]社区纳入他们的贸易网络。"
 RICE_bozo_bring_in_wangara_effect_tooltip_1:1 "[THIS.Char.GetCulture.GetName][rulers|E]现在将能够使用其他[wangara|E]机制，比如$RICE_bozo_wangara_synergy_decision$[decision|E]"
 RICE_bozo_bring_in_wangara_confirm:0 "在[ROOT.Char.GetCulture.GetNameNoTooltip]的土地欢迎万加腊群体！"
 RICE_bozo_bring_in_wangara_context_tooltip:0 "$RICE_bozo_establish_wangara_decision_context_tooltip$"
 RICE_bozo_wangara_synergy_decision:0 "万加腊协同"
 RICE_bozo_wangara_synergy_decision_tooltip:0 "[wangara|E]群体可以为我们的文明做出很多贡献。"
 RICE_bozo_wangara_synergy_decision_desc:0 "[wangara|E]融入在[ROOT.Char.GetCulture.GetName]社区已经有一段时间了。[ROOT.Char.GetPrimaryTitle.GetNameNoTier]从贸易网络中获益良多，但如果我们能找到其他机会与[wangara|E]群体合作，我们会受益更多"
