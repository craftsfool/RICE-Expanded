 RICE_bozo_move_jenne:0 "杰内迁址"
 RICE_bozo_move_jenne_tooltip:0 "杰内城应该被转移到一个新的地点。"
 RICE_bozo_move_jenne_desc:0 "虽然杰内是一座古城，但大臣们向我建议，如果我们把杰内搬到附近的地方可以进一步激发其商业潜力"
 RICE_bozo_move_jenne_desc_pagan:0 "虽然杰内是一座古城，但[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]告诉我，我们需要搬迁，因为当地人会受到盘踞在那里的邪恶的[ROOT.Char.GetFaith.DevilName]的重重困扰。然而，根据神谕，我们需要牺牲一位处女，然后才能将城市重新安置在新的地方。"
 RICE_bozo_move_jenne_effect_tooltip_1:1 "[GetTitleByKey('c_jenne').GetName]和其附近的[counties|E]的[rulers|E]现在可使用[GetActivityType( 'activity_RICE_bozo_tapama_djenepo_tomb' ).GetName][activity|E]"
 RICE_bozo_move_jenne_confirm:0 "是时候大迁移了！"
 RICE_bozo_move_jenne_context_tooltip:0 "#emphasis 历史背景：#!杰内‑杰诺（“老杰内”）是杰内的原址，也是当今马里的主要城市中心，但在中世纪的某个时候被遗弃。根据传说，这一举动发生在索宁克人迁移到该地区时，他们试图在最初于博佐定居的地点附近建立一个城镇，但遇到了各种自然灾害。随后神谕告诉他们需要牺牲一位处女，将她活埋在城墙上后，才得以建造这座城市。这个女孩的坟墓，被称为塔帕玛·杰内颇（即“塔帕玛，杰内的殉道者”），仍然矗立在现代杰内城里。"
 RICE_bozo_tapama_djenepo_decision:0 "拜访塔帕玛·杰内颇之墓"
 RICE_bozo_tapama_djenepo_decision_tooltip:0 "塔帕玛·杰内颇的牺牲不应被遗忘。"
 RICE_bozo_tapama_djenepo_decision_desc:0 "根据杰内的传说，今天城市能够成功建设要全部归功于一个名叫塔帕玛·杰内颇的少女的牺牲，我应该在她的坟墓前敬拜她。"
 RICE_bozo_tapama_djenepo_decision_confirm:0 "让我们去她的坟墓吧！"
 RICE_bozo_tapama_djenepo_decision_context_tooltip:0 "$RICE_bozo_move_jenne_context_tooltip$"
 RICE_bozo_ghana_funeral_decision:0 "将我挚爱的[ROOT.Char.Custom2('RelationToMe', ROOT.Var('RICE_ghana_burial_ancestor').Char)|U]埋葬在金合欢木圆顶里"
 RICE_bozo_ghana_funeral_decision_tooltip:0 "让你的祖先安息并获得[piety|E]和[vassal|E][opinion|E]"
 RICE_bozo_ghana_funeral_decision_desc:0 "我挚爱的[ROOT.Var('RICE_ghana_burial_ancestor').Char.Custom2('RelationToMeAddress', ROOT.Char)]，[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetTitledFirstName]，已经去世。按照[ROOT.Char.GetCulture.GetName]的葬礼传统规定，[ROOT.Var('RICE_ghana_burial_ancestor').Char.GetSheHe]应该被埋葬在一个金合欢木的大圆顶中，并提供人祭。"
 RICE_bozo_ghana_funeral_decision_confirm:0 "准备好葬礼和祭祀！"
 RICE_bozo_ghana_funeral_decision_effect_tooltip_1:0 "此[decision|E]将在亲属去世后5年内有效"
 RICE_bozo_ghana_funeral_decision_effect_tooltip_2:0 "如果你花费额外的[gold_i|E]#V[GetPlayer.MakeScope.ScriptValue('RICE_activity_cost')|0]#!，那么你将也有机会牺牲一个[courtier|E]来获得额外的[piety_i|E]#P[GetPlayer.MakeScope.ScriptValue('major_piety_value')|0]#!"
 RICE_bozo_ghana_funeral_decision_context_tooltip:0 "#emphasis 历史背景：#!根据安达卢西亚地理学家和学者巴克里（约公元1040‑1094年）的说法，在伊斯兰之前时代的加纳帝国的原始教徒们是偶像崇拜者，他们向祖先提供令人陶醉的饮料，并依据传统将他们的统治者埋葬在木制圆顶中。在人们牺牲以待来世陪伴国王之后，泥土将被堆积在圆顶上，直到它像一座小山为止。"
 RICE_ghana_burial_vassals:0 "所有[culture|E]和[faith|E]的[vassal|E]"
 RICE_ghana_burial_vassals_bad:0 "所有信仰非原始宗教的[faith|E]的[vassal|E]"
