 RICE_trans_saharan_trade_region:0 "跨撒哈拉贸易区"
 innovation_RICE_wangara:0 "万加腊贸易网"
 innovation_RICE_wangara_desc:0 "在早期，黄金生产者本人不愿意跟当地商人进行面对面的交易，而是采用原始的以物易物，双方互不见面的“哑贸易”方式进行交易。早期阿拉伯商人和地理学家把苏丹产金地和从事苏丹长途贸易，特别是黄金贸易的商人统称为“万加腊人”，因此万加腊商人在西非有很强的影响力，他们可以促进领地里的贸易流动，并与遥远的地方建立贸易联系。"
 RICE_trans_saharan_decision_unlocked_desc:0 "解锁与[trans_saharan_merchants|E]建立网络的[decision|E]"
 RICE_wangara_decision_desc:0 "解锁与[wangara|E]协作[decision|E]"
 RICE_wangara_decision_done_req_text:0 "$RICE_bozo_establish_wangara_decision$[decision|E]必须由控制$building_type_mali_mines_01$的人来决定"
 death_sacrificed_to_ancestor:0 "在一位祖先的葬礼上被献祭"
 death_sacrificed_to_ancestor_killer:1 "在[TARGET_CHARACTER.GetUINamePossessive]祖先的葬礼上被献祭"
 RICE_you_are_culture_head_req:1 "你是[culture_head|E]"
 tapama_djenepo:1 "塔帕玛·杰内颇"
 ghw_region_the_sahel:1 "萨赫勒"
 RICE_culture_in_niger_river_basin_desc:1 "该[culture|E]至少有#V 4个#![counties|E]在[GetGeographicalRegion('ghw_region_the_sahel').GetName][region|E]"
 game_concept_wangara:1 "万加腊"
 game_concept_wangara_desc:2 "万加腊人是一个西非商人群体，在中世纪和近代早期非洲经济史上发挥了重要作用。他们由多个说曼德语的民族组成，在不同的语境中，这个词有不同的含义。\n\n一旦控制西非金矿[ruler|E]采取$RICE_bozo_establish_wangara_decision$[decision|E]，万加腊人机制将通过$innovation_RICE_wangara$[innovation|E]。获得该[innovation|E]有几种方式：通过正常过程自然获得；通过$RICE_bozo_establish_wangara_decision$[decision|E]获得；或者通过将万加腊融入你的[culture|E]社区[decision|E]获得。后两种方法可以让你提前一个[era|E]获得[innovation|E]。\n\n除了基本加成外，[innovation|E]还有其他奖励，例如可以解锁$RICE_bozo_wangara_synergy_decision$[decision|E]，从而为你的[counties|E]提供增益。"
 game_concept_mud_masonry:1 "泥浆砌筑"
 game_concept_mud_mason:1 "泥瓦匠"
 game_concept_mud_masons:1 "泥瓦匠"
 game_concept_mud_masons_desc:2 "西非的一些[cultures|E]拥有$tradition_RICE_african_mud_masons_name$[tradition|E]，这使该文化统治者可使用$RICE_bozo_mud_masons_decision$[decision|E]以获得减少建造[buildings|E]时间及花费的[character_modifier|E]。\n\n如果你持有$c_jenne$的[county|E]，无需该[tradition|E]即可使用该[decision|E]，且可通过该[decision|E]获得加强版的[modifiers|E]"
 activity_visit_tapama_djenepo_tomb:0 "拜访塔帕玛·杰内颇之墓"
 activity_visit_tapama_djenepo_tomb_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]拜访塔帕玛·杰内颇之墓"
 RICE_bozo_mud_masons_jenne:0 "杰内的泥瓦匠"
 RICE_bozo_mud_masons_jenne_desc:0 "#italic barey ton#!是杰内当地的著名泥瓦石匠行会，其以[mud_masonry|E]方面的技能而闻名，经过多代人的磨练而臻于完善。他们的学识对当地来说具有神圣的意义，因此在整个地区受到极大的尊重。\n\n#italic 该[county|E]的[rulers|E]会自动获取$RICE_bozo_mud_masons_decision$[decision|E]，哪怕其[culture|E]没有$tradition_RICE_african_mud_masons_name$[tradition|E]。反之如果#italic 有该[tradition|E]#!，其将从[decision|E]中获得更多奖励"
 RICE_bozo_mud_masons_general_modifier:0 "雇用泥瓦匠（所有$game_concept_holdings$）"
 RICE_bozo_mud_masons_general_modifier_desc:0 "该角色与当地的非洲[mud_masons|E]行会签订合约，涉及所有[holding_types|E]的各种[buildings|E]建设和维护。"
 RICE_bozo_mud_masons_castle_modifier:0 "雇用泥瓦匠（$game_concept_castle_holdings$）"
 RICE_bozo_mud_masons_castle_modifier_desc:0 "该角色与当地的非洲[mud_masons|E]行会签订合约，从事与[castle_holdings|E]有关的各种[buildings|E]建设和维护。"
