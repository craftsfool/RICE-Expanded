 bozo.0014.desc:0 "xxxxx"
 bozo.0014.a:0 "xxxxx"
 bozo.0015.t:0 "与万加腊人合作"
 bozo.0015.desc:0 "万加腊商人的势力范围遍布[GetGeographicalRegion('world_africa_west').GetName]，多年来他们已经融入[ROOT.Char.GetCulture.GetName]社区，将我们与该地其他民族联系起来。我们习惯了每天与万加腊人打交道，尤其是在商业事务上，但我发现了与他们进一步合作互利的机会。\n\n"
 bozo.0015.desc.political:0 "万加腊群体精于管理和写作，可以为我所用。我已经聘请了一些人担任书吏，并将利用他们的贸易网来更有效地管理领土，确保法律得以执行。"
 bozo.0015.desc.commercial:0 "当然，万加腊人最著名的是其广泛的贸易网，已经给我的领地带来了许多财富。通过合作，我们可以进一步鼓励贸易，让这里#italic 财源滚滚#!。"
 bozo.0015.desc.cultural:0 "万加腊群体一般都受过良好的教育（毕竟要成为一个优秀的商人，就必须精明能干），我在学识方面寻求他们的帮助。万加腊人在法律、语言和各种学问的知识，有利于促进我治下的文化。"
 bozo.0015.a:0 "我非常感谢他们的贡献。"
