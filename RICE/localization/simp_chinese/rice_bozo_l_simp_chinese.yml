 activity_RICE_bozo_tapama_djenepo_tomb_desc:0 "根据杰内的传说，今天城市能够成功建设要全部归功于一个名叫塔帕玛·杰内颇的少女的牺牲。她的坟墓至今仍伫立于此。"
