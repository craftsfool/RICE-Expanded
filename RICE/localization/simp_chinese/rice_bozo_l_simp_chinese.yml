 RICE_bozo_mud_masons_city_modifier_desc:0 "该角色与当地的非洲[mud_masons|E]行会签订合约，负责[city_holdings|E]里的各种[buildings|E]建设和维护。"
 RICE_bozo_mud_masons_church_modifier:0 "雇用泥瓦匠（$game_concept_church_holdings$）"
 RICE_bozo_mud_masons_church_modifier_desc:0 "该角色与当地的非洲[mud_masons|E]行会签订合约，负责[church_holdings|E]的各种[buildings|E]建设和维护。"
