 chios.0010.t:0 "一个新的乳香村"
 chios.0010.desc:0 "我与希俄斯当地的几位知名人士会面，如小贵族、村里的长老、商人和各种公会的负责人。经过大量的讨论，我们将新的乳香村的潜在选择缩小到三个。\n\n—一个城堡定居点，以保护乳香树林不受强盗侵扰\n—一个沿海贸易港口，以增加利润\n—一个具有良好生活质量的城镇，以发展该岛的基础设施。\n\n作为希俄斯的领主，我对该村的落地点有最终决定权。"
 chios.0010.a:0 "捍卫乳香树林，抵御强盗和海盗的袭击"
 chios.0010.b:0 "扩大乳香贸易的商业机会"
 chios.0010.c:0 "改善乳香生产的基础设施！"
 chios.0011.t:0 "一个新的乳香村"
 chios.0011.desc:0 "现在我们已经决定了一个计划，下一件事就是决定在哪里建造这个乳香村，以及它将有多大。在花了一些时间对希俄斯岛上的潜在地点进行调查后，我们找到了一个好地方，我们将在那里建造一个新的村庄。"
 chios.0011.a:0 "小型乳香村"
 chios.0011.b:0 "中型乳香村"
 chios.0011.c:0 "大型乳香村"
 chios.0012.t:0 "一个新的乳香村"
 chios.0012.desc:0 "随着新乳香村计划的最终确定，建设将很快开始。建筑材料已经被运走，并且正在从希俄斯岛的其他定居点和该地区的其他城镇招募未来的定居者。"
 chios.0012.a:0 "不错。"
