 chios.0020.t:0 "着手准备"
 chios.0020.desc:0 "爱琴海各地传统上有许多不同的节日，但很少有节日能与希俄斯岛上的蒂米亚纳狂欢节的魅力相媲美。\n\n许多年前，蒂米亚纳的居民在举行狂欢节时，得知海盗即将来袭。凭借狡猾和热情，镇民们伏击了海盗，赢得了惊人的胜利。他们把抓到的海盗钉在镇中心的十字架上，让全镇人都能沐浴在他们光荣的胜利中。\n\n从那时起，每年春天，该镇都会举行庆祝活动来纪念这一时刻，当然，我打算参加今年的庆祝活动。"
 chios.0020.a:0 "启程！蒂米亚纳！"
 chios.0021.t:0 "蒂米亚纳"
 chios.0021.desc:0 "我已经到达了蒂米亚纳。它是希俄斯岛上较大的定居点之一，和爱琴海的许多地方一样，充满了风景如画的海滩和迷人的崎岖山丘。当我进城时，我不禁赞叹这些迷人的建筑，它们是由该地区特有的、来自附近采石场的红褐色石头建成。\n\n我已经看到许多镇民在为狂欢节做准备，到处乱窜。"
 chios.0021.a:0 "我已经等不及狂欢节的开始了。"
 chios.0022.t:0 "蒂米亚纳狂欢节开始了"
 chios.0022.desc:0 "周五晚上，蒂米亚纳狂欢节已经开始。人群在欢快的气氛中聚集在蒂米亚纳的街道上。一些年轻的村民身着传统服装，戴着面具，在人群中跳舞，挑逗和开玩笑，向大家传播欢乐。"
 chios.0022.a:0 "加入群众的狂欢吧！"
 chios.0022.b:0 "坐下来，欣赏一下风景。"
 chios.0023.t:0 "庄严的纪念活动"
 chios.0023.desc:0 "现在是星期天，今天早上开始，所有人都聚集在蒂米亚纳的墓地，为逝者祈祷。我们必须记住，毕竟这个庆祝活动能够发生，要感谢很久以前勇敢的村民们的努力和牺牲，当时他们保卫了蒂米亚纳对抗海盗。"
 chios.0023.a:0 "我和当地人一起祈祷。"
 chios.0024.t:0 "战斗阅兵"
 chios.0024.desc:0 "在这一庄严的活动之后，我们进入了蒂米亚纳战斗重现场面，我们要重演以前的那场战斗，以此来纪念。\n\n两组当地人聚集在蒂米亚纳镇的广场上：一组穿上镇上的传统服装，代表他们对抗海盗的祖先；另一组则打扮成海盗的样子。在音乐的伴奏下，双方面对面地围绕对方旋转和移动，古典战斗方式复述很久以前那场致命的战斗。\n\n一旦完成重演，一个强大的游行队伍就会穿过小镇，一场盛大的盛宴就会在小镇广场上开始。"
 chios.0024.a:0 "每个人都过得很开心。"
 chios.0025.t:0 "狂欢节结束"
 chios.0025.desc:0 "庆祝活动结束了，我在蒂米亚纳度过了一段美好的时光后，所有美好的事情都要有结局。这段经历相当吸引人，访问该镇并认识一些当地人和参加他们的传统庆祝活动是一件很愉快的事。"
 chios.0025.a:0 "总有一天我再来的。"
