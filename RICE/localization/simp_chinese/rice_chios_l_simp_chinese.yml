l_simp_chinese:
 RICE_found_mastic_village_context_tooltip:0 "#emphasis 历史背景：#!自古以来，乳香一直是希俄斯岛的主要经济来源。几个世纪以来，从罗马皇帝到奥斯曼帝国苏丹的各种统治者都试图垄断这一产业，并将支持乳香村庄作为其战略的一部分。"
 RICE_erect_homer_monument_context_tooltip:0 "#emphasis 历史背景：#!古代诗人荷马是否真实存在尚存疑问，但希俄斯岛却被认为是他可能的出生地，这一说法在历史上一直流传。"
 RICE_attend_mostra_of_thymiana_context_tooltip:0 "#emphasis 历史背景：#!关于蒂米亚纳的传说中与海盗的战斗是否发生过以及何时发生的，目前尚无定论。但如果真的发生过，那么应该是在中世纪末期或文艺复兴初期的某个时候。无论如何，蒂米亚纳的狂欢节在现实生活中已经举办了数个世纪。"
 RICE_chios_mastic_groves:0 "乳香树林"
 RICE_chios_mastic_groves_desc:0 "几个世纪以来，希俄斯岛一直是世界上乳香的主要产地，乳香是一种来自乳香树的特殊乳香。自古以来，乳香对希俄斯的经济至关重要，以至于乳香本身常常被称为“希俄斯之泪”。"
 RICE_homer_monument_built:0 "荷马纪念碑"
 RICE_homer_monument_built_desc:0 "在希俄斯岛的东侧，在“达斯卡洛佩特拉”（也称教师岩）附近，有一个小而简陋的纪念碑群，传说中的诗人荷马曾在这里教书育人，吟诗作对。少量的朝圣者和旅行者时常在这里停留，为当地的经济和文化做出了贡献。"
 RICE_reveres_homer:0 "荷马牧师"
 RICE_reveres_homer_desc:0 "这个人非常尊重和推崇古希腊诗人荷马，以至于收集资源在希俄斯为荷马建造了一座小型纪念碑。"
 RICE_chios_attended_mostra_of_thymiana:0 "最近参加了希俄斯的蒂米亚纳狂欢节"
 RICE_chios_chian_cheese_from_mostra:0 "带回来的希俄斯奶酪"
 RICE_chios_mastic_village_small_fort:0 "小型乳香堡"
 RICE_chios_mastic_village_small_fort_desc:0 "最近在希俄斯岛建立了一个新的乳香村。该村规模不大，是一个堡垒式的居住区，目的是保护岛上的乳香树林不受敌方袭击者和强盗的袭扰。"
 RICE_chios_mastic_village_medium_fort:0 "中型乳香堡"
 RICE_chios_mastic_village_medium_fort_desc:0 "最近在希俄斯岛建立了一个新的乳香村。该村规模中等，是一个堡垒式的居住区，目的是保护岛上的乳香树林不受敌方袭击者和强盗的侵害。"
 RICE_chios_mastic_village_large_fort:0 "大型乳香堡"
 RICE_chios_mastic_village_large_fort_desc:0 "最近在希俄斯岛建立了一个新的乳香村。它的面积很大，是一个堡垒式的居住区，目的是保护岛上的乳香树林不受敌方袭击者和强盗的侵害。"
 RICE_chios_mastic_village_small_port:0 "小型乳香口岸"
 RICE_chios_mastic_village_small_port_desc:0 "最近在希俄斯岛建立了一个新的乳香村。该村规模不大，是一个贸易港，其建立的目的是为了促进岛上的乳香工业，增加利润。"
 RICE_chios_mastic_village_medium_port:0 "中型乳香口岸"
 RICE_chios_mastic_village_medium_port_desc:0 "最近在希俄斯岛建立了一个新的乳香村。该村规模中等，是一个贸易港，其建立的目的是为了促进岛上的乳香工业，增加利润。"
 RICE_chios_mastic_village_large_port:0 "大型乳香口岸"
 RICE_chios_mastic_village_large_port_desc:0 "最近在希俄斯岛建立了一个新的乳香村。它的规模很大，是一个贸易港，建立的目的是为了促进岛上的乳香工业，增加利润。"
 RICE_chios_mastic_village_small_town:0 "小型乳香城镇"
 RICE_chios_mastic_village_small_town_desc:0 "最近在希俄斯岛上建立了一个新的乳香村。它规模较小其建立的目的是在支持当地乳香经济并提供基础设施。"
 RICE_chios_mastic_village_medium_town:0 "中型乳香城镇"
 RICE_chios_mastic_village_medium_town_desc:0 "最近在希俄斯岛上建立了一个新的乳香村。它规模较中等或其建立的目的是在支持当地乳香经济，并提供基础设施。"
 RICE_chios_mastic_village_large_town:0 "大型乳香城镇"
 RICE_chios_mastic_village_large_town_desc:0 "最近在希俄斯岛上建立了一个新的乳香村。它规模较庞大或其建立的目的是在支持当地乳香经济，并提供基础设施。"
 RICE_chios_heard_thymiana_story:0 "听过蒂米亚纳的防守故事吗？"
 RICE_chios_heard_thymiana_story_desc:0 "很久以前，希俄斯的蒂米亚纳镇受到海盗的袭击。村民们通过狡猾和勇气，对海盗进行了伏击，并取得了巨大的胜利。从那时起，他们每年都会举行名为“蒂米亚纳狂欢节”的庆祝活动来庆祝这一伟大的壮举。"
 RICE_chios_visited_thymiana_watchtower:0 "参观了蒂米亚纳的瞭望塔"
 RICE_chios_mastic_demand_increase:0 "乳香需求增加"
 RICE_chios_mastic_demand_decrease:0 "乳香需求减少"
 RICE_chios_recent_piracy:0 "最近在希俄斯的海盗行为"
 RICE_chios_recent_piracy_desc:0 "由于希俄斯岛是世界上利润丰厚的乳香的主要生产地，因此经常成为海盗的热门目标。"
 RICE_chios_ariousian_wine:0 "来自库鲁尼亚的阿利乌西亚葡萄酒"
 RICE_chios_ariousian_wine_desc:0 "这个人最近收到了一份礼物，来自库鲁尼亚村的阿利乌斯葡萄酒。阿利乌斯葡萄酒是古希腊流传至今的葡萄酒，而位于希俄斯岛的库鲁尼亚村尤其以这种酒的品种而闻名。据说，连伟大的诗人荷马都喝过这种酒来激励自己。"
 RICE_chios_inspired_by_homers_wine:0 "受荷马的葡萄酒启发"
 RICE_chios_antimony_boon:0 "有利可图的锑矿"
 RICE_chios_lithi_fish:0 "来自利蒂的鱼宴"
 RICE_found_mastic_village:0 "建立新乳香村庄"
 RICE_found_mastic_village_tooltip:0 "你将与当地村民一起为希俄斯的新乳香村打下基础。"
 RICE_found_mastic_village_desc:0 "作为希俄斯经济的基石，乳香通常生长在乳香堡或乳香村庄。我觉得是时候建立一个新的乳香村庄，以增加岛上的乳香产量。"
 RICE_found_mastic_village_effect_tooltip:0 "你将与当地村民合作，决定建设什么样的乳香村。#emphasis 这个决议一生仅能使用一次！#!"
 RICE_found_mastic_village_confirm:0 "让我们开始建造吧！"
 RICE_found_mastic_village_extra_cost_tooltip:0 "较大的村庄开发成本会更高#weak （最低花费：@gold_icon!50）#!"
 RICE_erect_homer_monument:0 "树立荷马纪念碑"
 RICE_erect_homer_monument_tooltip:0 "你要为荷马立一个小纪念碑，以示纪念。"
 RICE_erect_homer_monument_desc:0 "在希俄斯岛上有一块大石头，据说是伟大诗人荷马曾经教书的地方。该地方目前没有得到维护，也许我可以改变这种状况。"
 RICE_erect_homer_monument_effect_tooltip:0 "你将和当地人一起为荷马竖立纪念碑。"
 RICE_erect_homer_monument_confirm:0 "缪斯女神，对我歌唱吧！"
 RICE_attend_mostra_of_thymiana:0 "参加蒂米亚纳狂欢节"
 RICE_attend_mostra_of_thymiana_tooltip:0 "你将前往蒂米亚纳见证其传统的春季庆典和狂欢节。"
 RICE_attend_mostra_of_thymiana_desc:0 "我将参加蒂米亚纳狂欢节，以此来纪念多年前蒂米亚纳的镇民在希俄斯成功抵御海盗袭击。"
 RICE_attend_mostra_of_thymiana_effect_tooltip:0 "你将前往蒂米亚纳见证其传统的春季庆典和狂欢节。"
 RICE_attend_mostra_of_thymiana_confirm:0 "让我们前往蒂米亚纳！"
 RICE_decision_mostra_month_requirement:0 "月份必须在2月至5月之间"
 building_type_RICE_mastic_industry_01:1 "乳香行业"
 building_type_RICE_mastic_industry_01_desc:1 "几个世纪以来，希俄斯岛一直是世界上乳香的主要产地，乳香是一种来自乳香树的特殊乳香。自古以来，乳香对希俄斯的经济至关重要，以至于乳香本身常常被称为“希俄斯之泪”。"
 building_RICE_mastic_industry_01:0 "乳香树"
 building_RICE_mastic_industry_01_desc:1 "目前，各种乳香树分布在希俄斯岛上，杂乱无章，不发达，降低了乳香生产的效率。"
 building_RICE_mastic_industry_02:0 "乳香农场"
 building_RICE_mastic_industry_02_desc:1 "专门划出土地用于种植和收割乳香树，这有助于增加希俄斯的乳香产量。"
 building_RICE_mastic_industry_03:0 "乳香树林"
 building_RICE_mastic_industry_03_desc:1 "在某些村旁将消散的乳香场合并成大树林，提高了乳香生产率。"
 building_RICE_mastic_industry_04:0 "乳香花园"
 building_RICE_mastic_industry_04_desc:1 "现在，乳香树林已经发展得很好了，全岛到处都是乳香树，甚至在私人住宅和各种不专门生产乳香树的居民点，也经常能看到乳香树。"
 building_RICE_mastic_industry_05:0 "乳香种植园"
 building_RICE_mastic_industry_05_desc:1 "现在整个希俄斯岛都有大型的乳香种植园，给岛上带来了很多利润。"
 activity_attend_mostra_of_thymiana:0 "庆祝蒂米亚纳狂欢节之旅"
 activity_attend_mostra_of_thymiana_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]庆祝蒂米亚纳狂欢节之旅"
 building_type_RICE_chios_heraion_of_samos:0 "赫拉神庙"
 building_type_RICE_chios_heraion_of_samos_desc:0 "萨摩斯岛上的赫拉圣殿是献给女神的最古老的寺庙建筑群之一。它被古希腊人和罗马人使用了一千多年，现在已经重建。"
 building_RICE_chios_heraion_of_samos:0 "$building_type_RICE_chios_heraion_of_samos$"
 building_RICE_chios_heraion_of_samos_desc:0 "$building_type_RICE_chios_heraion_of_samos_desc$"
 RICE_chios_repopulate_patmos_with_monastics:0 "让神职人员重新回到拔摩岛"
 RICE_chios_repopulate_patmos_with_monastics_tooltip:0 "拔摩岛是一个神圣的地方，但没有适当的宗教存在。"
 RICE_chios_repopulate_patmos_with_monastics_desc:0 "虽然拔摩岛上有拔摩的约翰曾经写过《启示录》的洞穴，但目前那里没有礼拜堂或修道院。该地区的几位僧侣希望纠正这一点，并要求像我这样的官员提供资源来帮助这项工作。"
 RICE_chios_repopulate_patmos_with_monastics_effect_tooltip:0 "临近[GetTitleByKey('c_chios').GetNameNoTier]的[GetPlayer.GetFaith.GetReligion.GetAdjective][rulers|E]可以进行[patmos_pilgrimage|E]"
 RICE_chios_repopulate_patmos_with_monastics_confirm:0 "让我们开始动工吧！"
 RICE_chios_repopulate_patmos_with_monastics_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，拔摩岛（位于萨摩斯岛的稍南）一直被认为是拔摩岛的约翰（通常被认为是福音书作者约翰，也即使徒约翰）写启示录的地方。然而，直到公元1088年，才在罗马皇帝阿莱克修斯一世的帮助下，在该岛建立了一座由圣克里斯托多洛斯·拉特里诺斯创建的修道院。从那时起，拔摩岛就成为了一个当地的朝圣地。"
 RICE_chios_go_on_a_pilgrimage_to_patmos:0 "去拔摩岛朝圣"
 RICE_chios_go_on_a_pilgrimage_to_patmos_tooltip:0 "天启之洞等着我！"
 RICE_chios_go_on_a_pilgrimage_to_patmos_desc:0 "我希望可以去[patmos_pilgrimage]。这那个岛上，我将参观拔摩岛的约翰写《启示录》的洞穴。"
 RICE_chios_go_on_a_pilgrimage_to_patmos_effect_tooltip:0 "在你来访期间你#italic 可能#!获得#V 神启#!怒嚎末日"
 RICE_chios_go_on_a_pilgrimage_to_patmos_confirm:0 "我等不及了！"
 RICE_chios_go_on_a_pilgrimage_to_patmos_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，拔摩岛（位于萨摩斯岛的稍南）一直被认为是拔摩岛的约翰（通常被认为是福音书作者约翰，也即使徒约翰）写启示录的地方。然而，直到公元1088年，才在罗马皇帝阿列克修斯一世的帮助下，在该岛建立了一座由圣克里斯托多洛斯·拉特里诺斯创建的修道院。从那时起，拔摩岛就成为了一个当地的朝圣地。"
 RICE_chios_near_chios_req:0 "你的[capital|E]靠近[GetTitleByKey('c_chios').GetNameNoTier]"
 activity_chios_patmos_pilgrimage:0 "天启洞朝圣"
 activity_chios_patmos_pilgrimage_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]天启之洞朝圣"
 game_concept_patmos_pilgrimage:0 "拔摩岛朝圣"
 game_concept_patmos_pilgrimage_desc:0 "一旦#V 希俄斯#!的[county|E]的[ruler|E]采用#V 开启拔摩岛修道院#!的[decision|E]，附近基督徒角色可以参加[GetActivityType( 'activity_RICE_chios_patmos_pilgrimage' ).GetName]，特别是那里的#V 天启洞#!，除了提供其他[local_pilgrimages|E]通常的收益，如[piety|E]，还有机会获得某些#V 异象#!。"
 RICE_chios_sponsored_patmos_monastics:0 "在拔摩岛赞助建造圣约翰修道院"
 RICE_chios_monastery_of_saint_john:0 "圣约翰修道院"
 RICE_chios_monastery_of_saint_john_desc:0 "据说拔摩岛（位于萨摩斯岛南部一点）上面有一个山洞，据说是使徒圣约翰撰写《启示录》的地方。在这个被称为“天启洞”的洞穴附近有一个修道者社区和一些基础设施，供任何希望前往该岛的朝圣者使用。"
 RICE_chios_white_horse_vision:0 "看到异象——白马骑士"
 RICE_chios_white_horse_vision_desc:0 "“我就观看，见有一匹白马，骑在马上的拿着弓，并有冠冕赐给他。他便出来，胜了又要胜。”"
 RICE_chios_red_horse_vision:0 "看到异象——红马骑士"
 RICE_chios_red_horse_vision_desc:0 "“就另有一匹马出来，是红的。有权柄给了那骑马的，可以从地上夺去太平，使人彼此相杀，又有一把大刀赐给他。”"
 RICE_chios_black_horse_vision:0 "看到异象——黑马骑士"
 RICE_chios_black_horse_vision_desc:0 "“我就观看，见有一匹黑马．骑在马上的手里拿着天平。”"
 RICE_chios_pale_horse_vision:0 "看到异象——灰马骑士"
 RICE_chios_pale_horse_vision_desc:0 "“我就观看，见有一匹灰色马。骑在马上的，名字叫作死，阴府也随着他，有权柄赐给他们，可以用刀剑、饥荒、瘟疫、野兽，杀害地上四分之一的人。”"
 RICE_chios_thyme_gift:0 "西迈纳岛的百里香礼品"
 RICE_chios_petrokopio_quarry:0 "来自彼得罗科皮奥采石场的多余的大理石"
 RICE_chios_explored_kamari:0 "探寻卡马里的遗址"
 RICE_chios_ikaria_houses:0 "学习伊卡利亚岛的建筑技术"
 RICE_chios_ikaria_houses_desc:0 "在萨摩斯岛西部的伊卡里亚岛上发现的房屋采用了不同寻常的建筑风格，即有序地排列石块来模仿巨大的岩石。该角色目前正在试图研究，这些被认为可以有效保护伊卡里亚免受海盗侵害的技术是否可以应用于其他地方。"
 RICE_chios_samos_muscat_wine:0 "萨摩斯岛的麝香葡萄酒"
 RICE_chios_pharmakonisi_herbs:0 "法尔马科尼西岛上的著名药材"
 RICE_chios_inspired_by_pythagoras:0 "受毕达哥拉斯启发"
 RICE_chios_inspired_by_pythagoras_desc:0 "“理性是不朽的，其他皆会消逝。”"
