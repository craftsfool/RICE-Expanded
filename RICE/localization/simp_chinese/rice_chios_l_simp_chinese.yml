 chios.0005.t:0 "诗人荷马"
 chios.0005.desc.start:0 "传说中伟大的诗人荷马出生在希俄斯岛，并在岛上生活了一辈子。希俄斯岛东侧有一块大石头，被称为“Daskalopetra”或教师石，据说荷马就是在这里教书和朗诵诗歌的。令人遗憾的是，一个享誉全世界著名思想家和诗人，却没有人为他建立纪念碑。"
 chios.0005.desc.mid.pagan:0 "\n\n作为古老信仰的追随者，我有责任向荷马表示适当的敬意，他通过自己的智慧和雄辩让我们所有人思考关于人性和神性。"
 chios.0005.desc.mid:0 "\n\n虽然我不崇拜古希腊的异教之神，但向荷马表示敬意是很重要的，他通过自己的智慧和雄辩让我们所有人思考关于人性和神性。"
 chios.0005.desc.end:0 "即使是一座不大的荷马纪念碑，也一定会吸引远道而来的游客，他们希望向《伊利亚特》和《奥德赛》的作者，以及被柏拉图本人誉为“悲剧之美的启蒙者和初学者”的人表示敬意。"
 chios.0005.a:0 "现在是我们纪念荷马的时候了。"
