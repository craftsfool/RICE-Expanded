 chios.0100.t:0 "拔摩岛"
 chios.0100.desc:0 "与修士们的会面进行得足够顺利。他们要求提供合理的资源，帮助他们在拔摩岛上的天启洞旁建造一个小型的修道院，据说圣约翰在那里写下了《启示录》。\n\n最后我同意了，我们崇敬这样一位重要人物是非常合适的，即使是在一个荒凉的小岛上。因此我提供了必要的资金和资源来帮助这项崇高的工作。这座修道院将被恰当地称为圣约翰修道院。"
 chios.0100.a:0 "我很高兴我们解决了这一切。"
 chios.0100.tooltip:0 "临近[GetTitleByKey('c_chios').GetNameNoTier]的[GetPlayer.GetFaith.GetReligion.GetAdjective][rulers|E]可以前往[patmos_pilgrimage|E]"
 chios.0101.t:0 "拔摩岛"
 chios.0101.desc:0 "有关[patmos_repopulator.GetTitledFirstName]将赞助在拔摩岛建造一个名为圣约翰修道院的消息正在广为传播。\n\n拔摩岛位于[chios_county.GetNameNoTier]和萨摩斯岛的南部，据说是圣约翰写下《启示录》的地方。现在这个圣地有了一些基础设施，很快会有朝圣者蜂拥而至。"
 chios.0101.a:0 "事实也是如此。"
 chios.0101.tooltip:0 "临近[GetTitleByKey('c_chios').GetNameNoTier]的[GetPlayer.GetFaith.GetReligion.GetAdjective][rulers|E]可以前往[patmos_pilgrimage|E]"
 chios.0102.t:0 "着手准备"
 chios.0102.desc:0 "我决定前往拔摩岛，参观天启洞，圣约翰在那里写下了《启示录》。我希望在拔摩岛能更接近[ROOT.Char.GetFaith.HighGodName]，并得到启发和治愈。"
 chios.0102.a:0 "该做准备了。"
 chios.0103.t:0 "离开"
 chios.0103.desc:0 "我已经完成了前往拔摩岛的准备工作。因为它是爱琴海中的一个小岛，我将不得不乘船前往。我们只能希望在旅途中不要发生什么意外！"
 chios.0103.a:0 "让我们去拔摩岛！"
 chios.0104.t:0 "海上风暴！"
 chios.0104.desc:0 "风暴来袭！在航行去拔摩岛时，我们在附近的一个小岛上遇到了风暴。我们的船长和水手尽最大努力确保我们的船能够在海上继续航行。"
 chios.0104.a:0 "保佑我们，[ROOT.Char.GetFaith.WaterGodName]！"
 chios.0104.toast:0 "你在海上受伤了"
 chios.0105.t:0 "爱琴海海盗！"
 chios.0105.desc:0 "我们在接近拔摩岛时遇到了一艘海盗船，海盗们要求我们付钱，否则就进攻我们。爱琴海这一带的小岛是当地海盗喜欢藏身的地方，他们喜欢狩猎在这一带旅行的朝圣者和商人。作为船上级别最高的人，要由我来决定如何处理这些海盗。"
 chios.0105.a:0 "付钱吧，让我们在这次朝圣中避免出现流血事件。"
 chios.0105.b:0 "他们怎么敢！？反击！[ROOT.Char.GetFaith.WarGodName]保护我们！"
 chios.0105.c:0 "当然，我可以说服他们放过我们这些虔诚的朝圣者。"
 chios.0105.b.toast:0 "你在与海盗的战斗中受伤"
 chios.0106.t:0 "是陆地！"
 chios.0106.desc:0 "最后，我们终于到达拔摩岛。与爱琴海的其他岛屿相比，它很小且崎岖，但这并不影响它那自然之美。很快我们将到达我们朝圣的目的地。"
 chios.0106.a:0 "现在先休息一下吧！"
 chios.0107.t:0 "天启之洞"
 chios.0107.desc:0 "今天我来到了圣约翰的修道院。僧侣们急忙迎接我，因为像我这样的领主来到这里是一种荣誉。我们简单地聊了几句，然后他们带我去了天启洞。\n\n这个洞穴并不令人生畏，但我感到有一种比自己更伟大的东西存在。我观察这一切：岩石的质地、潮湿空气的气味、外面的一丝微风。我思考着《启示录》中恐怖的文字是以何种心情书写的。\n\n#italic 耶稣基督的启示，就是神赐给祂，叫祂将必要快成的事指示祂的众仆人。祂就差遣使者晓谕祂的仆人约翰。约翰便将神的道和耶稣基督的见证：#!\n#italic 凡自己所看见的都证明出来。念这书上预言的和那些听见又遵守其中所记载的，都是有福的，因为日期近了。#!"
 chios.0107.a:0 "令人瞩目的。"
 chios.0107.toast:0 "你已经看到了启示录的异象！"
 chios.0108.t:0 "回到修道院"
 chios.0108.desc:0 "在山洞里呆了一段时间后，我回到修道院，修士们接待了我。这是一次美妙的、富有启迪的经历，无论是肉体还是精神上。可惜。我只能在这里呆这么久，很快我就必须回去。"
 chios.0108.a:0 "不过我很高兴能来这里。"
 chios.0109.t:0 "返程"
 chios.0109.desc:0 "我已经从天启洞朝圣归来，这是一次很好的精神之旅，也许有一天我可以再来天启洞旅行。"
 chios.0109.a:0 "在那之前，我的生活又恢复和往常一样。"
