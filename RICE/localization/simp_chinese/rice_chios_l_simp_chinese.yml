 chios.0050.t:0 "乳香走私犯"
 chios.0050.desc:0 "我的卫兵与当地人一起合作逮捕了一些参与向希俄斯以外非法走私乳香的商人和强盗。作为希俄斯的领主，我有权从古代的乳香贸易中获得一部分利润，所有的乳香贸易都在我的管辖范围内，所以这是一个严重的罪行。"
 chios.0050.a:0 "我今天仁慈一把，所以让他们走吧，他们不会再这样做了。"
 chios.0050.b:0 "监禁他们，并没收他们的所有的乳香。"
 chios.0050.c:0 "根据古老传统，处决他们吧。"
 chios.0051.t:0 "乳香贸易有所改善"
 chios.0051.desc:0 "最近，全球对乳香的需求一直在增加。这对我来说应该是好事，因为这意味着以希俄斯为中心的乳香贸易的收益会更大。"
 chios.0051.a:0 "太好了！"
 chios.0052.t:0 "乳香贸易下降"
 chios.0052.desc:0 "最近，全球对乳香的需求一直在减少。这可能是一个问题，因为这意味着以希俄斯为中心的乳香贸易的利润将减少。"
 chios.0052.a:0 "这不妙。"
 chios.0053.t:0 "希俄斯海盗"
 chios.0053.desc:0 "海盗一直是爱琴海的一个大问题，尤其是在希俄斯，因为它是乳香贸易的中心。最近希俄斯岛发生了几起海盗袭击事件，虽然我们设法击退了他们，但对我们当地的基础设施造成了一些损害。"
 chios.0053.a:0 "让我们确保那些海盗不会造成任何进一步的损害！"
 chios.0054.t:0 "阿吉斯马塔"
 chios.0054.desc:0 "今天，我将前往希俄斯岛的阿吉斯马塔温泉旅行。由于它的水富含各种矿物质，几个世纪以来人们一直到这里来作为一种物理治疗和疗养的方式，我也不例外。"
 chios.0054.a:0 "我绝对需要休息一下！"
 chios.0055.t:0 "罗马沉船"
 chios.0055.desc:0 "在通往希俄斯岛阿纳瓦托斯村的路上，村外有一条路，通向埃林塔的壮丽海岸。我今天沿着这条路旅行，观察风景。这里有一个深深的海湾，海滩上满是卵石，两边是深蓝色的大海。在附近，据说有一艘罗马船的残骸躺在海底。"
 chios.0055.a:0 "无法想象那艘沉船里有什么宝藏！"
 chios.0056.t:0 "恩波里奥斯"
 chios.0056.desc:0 "今天我前往希俄斯岛的恩波里奥斯村。当我靠近村庄时，我向附近的海滩望去，那里布满了黑色的小鹅卵石，恩波里奥斯因此而闻名。"
 chios.0056.a:0 "一个美丽的场景！"
 chios.0057.t:0 "希俄斯的松树林"
 chios.0057.desc:0 "我在希俄斯岛的阿夫戈尼玛旅行时，在附近的松树林里迷路了，事实上这是岛上最大的松树林。我花了几个小时才找到出路，但幸运的是我没有受到伤害。"
 chios.0057.a:0 "我下次要小心地穿过那片森林。"
 chios.0058.t:0 "希俄斯迷宫"
 chios.0058.desc:0 "我在希俄斯岛领地巡察时，我访问了其中一个乳香村。一位村里的长老带我参观了当地人在村子周围建造的防御设施，用来保护利润丰厚的乳香免受海盗和土匪的威胁。房屋的排列方式使它们本身成为城墙的一部分，街道被设计得像一个迷宫，蜿蜒曲折，走向各种方向，使任何敢于来攻击这个地方的人感到困惑。"
 chios.0058.a:0 "希望我们永远不需要担心受到攻击。"
 chios.0059.t:0 "一个艺术之村"
 chios.0059.desc:0 "我正在巡察皮尔吉，这是希俄斯的一个村庄。与岛上的其他村庄相比，它十分独一无二，因为皮尔吉的传统是墙壁需要被装饰成各种几何图案和纹饰。对许多人来说，这使整个村庄变成了一件艺术品。"
 chios.0059.a:0 "非常有创意 这个传统挺不错的。"
 chios.0059.b:0 "这很好，但我见过更多令人印象深刻的作品。"
 chios.0060.t:0 "阿利乌斯葡萄酒"
 chios.0060.desc:0 "希俄斯岛的库鲁尼亚村以生产一种特殊的当地葡萄酒而闻名，据说是古希腊流传至今的葡萄酒，称为阿利乌斯葡萄酒。像古代一样，岛上的葡萄酒很有名，销往整个地中海地区，而阿利乌斯葡萄酒更是如此。\n\n今天一个来自库鲁尼亚的小型使节团正在拜访我的宫廷，他们向我提供了一些他们本地著名的阿利乌斯葡萄酒。这样一份好的礼物在我将来接待任何其他客人或宴会时都可以用的上，毕竟谁不想喝上一口这样的酒？"
 chios.0060.a:0 "谢谢，你可以把它放在那里。"
 chios.0061.t:0 "荷马的葡萄酒"
 chios.0061.desc:0 "几世纪以来，希俄斯岛以其葡萄酒而闻名，特别是所谓的阿利乌斯葡萄酒，其中最著名的品种来自库鲁尼亚村。古代作家甚至称它为众神的甘露。\n\n因为创作《伊利亚特》和《奥德赛》的伟大诗人荷马被认为一生都生活在希俄斯，甚至有人说荷马的才华和口才部分归功于他常年饮用这个酒。这种说法是真的吗？如果是的话，也许我应该每天喝点……"
 chios.0061.a:0 "简直就是无稽之谈，酒就是酒。"
 chios.0061.b:0 "我试试也无妨！让我们买一些酒。"
 chios.0061.toast.success:0 "你从阿利乌斯葡萄酒中获得灵感"
 chios.0061.toast.failure:0 "你无法从阿利乌斯葡萄酒中获得灵感"
 chios.0062.t:0 "锑矿"
 chios.0062.desc:0 "在希俄斯岛的主要贸易港口之一的阿希亚斯马塔附近，有凯拉莫斯的锑矿。锑有多种用途，从医药到化妆品，即使在古代，锑矿也是这个地区的主要收入来源。最近从这个地区锑矿业蓬勃发展。"
 chios.0062.a:0 "听到这消息真是高兴。"
 chios.0063.t:0 "纳戈斯海滨"
 chios.0063.desc:0 "今天我去了希俄斯上的纳戈斯海滩旅行。这是一个风景优美的海滩，也是一个放松的好地方。它的两侧是一排排美丽的枫树和茂密的植被以及潺潺流水的泉水，而海滩上遍布绚丽多彩的卵石。"
 chios.0063.a:0 "我很高兴我能来这里。"
 chios.0064.t:0 "利蒂"
 chios.0064.desc:0 "我正在访问希俄斯上的利蒂村。它有一个漂亮浅滩，而且它因是希俄斯岛上的一个重要渔镇。在那里，我受到了一场盛宴的款待，其中有当地渔民捕获的各种鱼类。"
 chios.0064.a:0 "它作为一个重要捕鱼镇是当之无愧的！它是一个非常好的地方！"
 chios.0065.t:0 "荷马的灵感？"
 chios.0065.desc:0 "我在希俄斯的一个熟人把我带到岛上的一个悬崖上，因为她想让我看看岛上的一些风景。悬崖下面是一个美丽的海滩，湛蓝的海水，还有一些散落的树木。总之她声称，根据家族的传说，这个地方是古代诗人荷马有时会来的地方，这里常常让他获得灵感。巧合的是，现在这个地方正好是她家的祖传土地。"
 chios.0065.a:0 "我确信荷马确实曾经来过这里。"
 chios.0065.b:0 "我们无法确定荷马是否曾经来过这里。"
 chios.0066.t:0 "坎博斯"
 chios.0066.desc:0 "希俄斯岛的坎博斯山谷以其郁郁葱葱的肥沃土地而闻名，因此吸引了许多想开发其农业潜力的贵族们。现在山谷中点缀着几座属于这种精英家庭的豪宅。\n\n今天，我拜访的就是这样一个小贵族，他正在向我解释他们的家族是如何充分利用这一地区土地种植并丰收的。"
 chios.0066.a:0 "这是很有用的信息，值得了解。"
 chios.0067.t:0 "迷失！"
 chios.0067.desc:0 "在我视察其中一个乳香村时，我和我的卫兵在蜿蜒狭窄的街道和混乱的建筑中迷失了方向。虽然村庄的布局是为了迷惑任何会来这里的强盗和海盗，以保护岛上宝贵的乳香。不过令人尴尬的是我们也迷失了！"
 chios.0067.a:0 "至少它按当初预想的一样成功了"
 chios.0068.t:0 "西迈纳"
 chios.0068.desc:0 "我正在巡察西迈纳，一个我统治的萨摩斯附近的小岛。虽然这只是一次短暂的访问，但我还是向那里村庄的长老们致意。他们向我赠送了一些百里香的礼物，这些百里香是从全岛不同地方采摘的。"
 chios.0068.a:0 "一份很好的礼物，非常感谢。"
 chios.0069.t:0 "彼得罗科皮奥"
 chios.0069.desc:0 "在萨摩斯岛和伊卡利亚岛之间的富尔尼群岛上，有一个古老的大理石采石场，被称为彼得罗科皮奥。虽然现在不怎么使用了，但每隔一段时间，当地人就会开采相当数量的大理石，并运往附近的其他岛屿。最近该采石场大理石业繁荣发展。"
 chios.0069.a:0 "我想知道我们可以用大理石做什么？"
 chios.0070.t:0 "危险水域"
 chios.0070.desc:0 "萨摩斯岛和伊卡利亚岛之间的水域充满了许多较小的小岛，这意味着这样的地方对于没有来过这里的船只非常危险。最近我收到消息说，有一艘这样的贸易船从远处被卷入当地的风暴中而沉没。然而一些水手和商人设法活了下来，最后在我领土上的海滩上发现了他们。"
 chios.0070.a:0 "我祝愿他们一切顺利。"
 chios.0070.b:0 "他们可以在我的庄园休息。"
 chios.0071.t:0 "卡马里的废墟"
 chios.0071.desc:0 "我正在访问位于萨摩斯以西、伊卡利亚以东的福尼岛，当我路过当地人称之为卡马里海滩的一段海岸时。在那蔚蓝的海水下，我发誓我可以看到一个城镇的废墟。陪同我的当地人向我证实，我的眼睛没有欺骗我。在海滩附近有一个古老聚居地，但是现在已经被淹没了。它离我们如此之近，人们甚至可以在它附近游泳，从更近的角度观察它。"
 chios.0071.a:0 "人们只能想知道那个镇子发生了什么。"
 chios.0071.b:0 "我有的是时间，为什么不在那游泳和探险？"
 chios.0072.t:0 "伊卡洛斯"
 chios.0072.desc:0 "人向我讲述了一个关于伊卡利亚岛上的神话，伊卡利亚岛位于萨摩斯岛的西部。据说它是古希腊人命名的，因为他们认为这是传说中的伊卡洛斯在飞得太高、太接近太阳后坠落并死亡的地方。"
 chios.0072.a:0 "无论真假，伊卡洛斯的故事告诉我们骄傲的代价。"
 chios.0072.b:0 "真是个荒谬的故事，显然是一些异教徒的哗众取宠。"
 chios.0072.c:0 "一个古老的故事，先人们借伊卡洛斯之事暗指傲慢的危害。"
 chios.0073.t:0 "伊卡利亚的房子"
 chios.0073.desc:0 "我正在视察伊卡利亚岛的领地，该岛位于萨摩斯岛西部。一段时间以来，我注意到那里的房子建得很奇怪，首先它们没有烟囱，天花板很低，而且大多是由坚固的石块制成。据当地人说，这样的措施有助于保护他们，因为这样可以迷惑海盗，使他们误以为这些房子是大石头。"
 chios.0073.a:0 "嗯......一个可以理解的奇怪习俗。"
 chios.0073.b:0 "我们可以在建立防线时学习他们的智慧。"
 chios.0074.t:0 "麝香葡萄酒"
 chios.0074.desc:0 "一些来自萨摩斯的知名人士今天来拜访我，讨论一些与他们岛有关的问题。在我们开始交谈之前，他们给我送来了岛上著名的麝香葡萄酒作为礼物。"
 chios.0074.a:0 "谢谢！现在，谈正事……"
 chios.0075.t:0 "萨摩斯岛的海难"
 chios.0075.desc:0 "我正在萨摩斯旅行，特别是它的一个翡翠海滩。当我举目远眺时，我可以看到不远处安纳托利亚的突起的山脉和地形，但奇怪的是这个岛实际上离安纳托利亚很近"
 chios.0075.a:0 "这就是大自然的奇妙之处。"
 chios.0076.t:0 "历史之父"
 chios.0076.desc:0 "据说著名的古代历史学家希罗多德年轻时曾在萨摩斯岛生活过，虽然他没有出生于在岛上，但我一想到这位饱学之士曾在我的领土上是如何姗姗学步和玩耍的，就不由得感到趣味十足。"
 chios.0076.a:0 "也许是萨摩斯岛所见的启发他成为历史之父。"
 chios.0076.b:0 "有人说希罗多德的《历史》是胡编乱造的，我认为他是不可靠的"
 chios.0077.t:0 "渔夫"
 chios.0077.desc:0 "我听说过普萨拉的居民，一个位于希俄斯西部的荒凉小岛，他们的生活非常贫穷和艰苦，数个世纪以来一直如此，以至于古希腊人也用传说中的方式谈论该岛的贫穷。例如古希腊有一句话，“普萨拉怀念酒神狄俄尼索斯”，表示贫穷，因为人们认为岛上的居民非常贫穷，甚至在重要的节日里都喝不起一点酒。从那时起，该岛就没有什么变化。"
 chios.0077.a:0 "这些贫穷的故事只是点缀乐子罢了"
 chios.0077.b:0 "该岛被诅咒了这样一个命运，真是可悲。"
 chios.0077.c:0 "我想做一些慈善，以帮助岛民。"
 chios.0078.t:0 "法尔马科尼西岛"
 chios.0078.desc:0 "法尔马科尼西岛位于爱琴海中萨摩斯岛的南部。尽管它看起来并不重要，但岛上因为有许多药物草药而闻名，它的名字也由此而来。总之这个岛在我的管辖范围内，我已经考虑派我的一些下属为我取一些那些著名的草药。"
 chios.0078.a:0 "话又说回来，这是一种浪费时间行为。"
 chios.0078.b:0 "这对我的健康有好处。"
 chios.0079.t:0 "毕达哥拉斯"
 chios.0079.desc:0 "萨摩斯岛在我的领土内，我最近一直在思考岛上最著名的人物之一，哲学家毕达哥拉斯。即使是现在他也被尊称为数学和音乐导师。在岛上，有一个洞穴，据说是他在流亡到意大利之前，为了躲避萨摩斯暴君波利克拉特斯，并在私下里教导他人的地方。这个山洞很难到达，所以很少有人走这条路。尽管如此，我对毕达哥拉斯曾经住在这里的事实感觉敬畏，他在洞穴中艰苦生活给了我启发。"
 chios.0079.a:0 "正如他所说，数学主宰宇宙"
