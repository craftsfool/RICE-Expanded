 chios.0030.t:0 "希俄斯奶酪"
 chios.0030.desc:0 "“啊！[ROOT.Char.GetLadyLord]，很高兴在这里见到你，”老农妇在我走近桌子时说，“你想吃点希俄斯最好的山羊奶酪吗？”\n\n我慢慢地咀嚼着奶酪，品尝着它的咸味和奶味。它是相当美味的!\n\n“你想带一些回去吗？”那女人看到我的良好反应后询问道，“这些都是免费献给你的。”"
 chios.0030.a:0 "没错，这听起来是个好主意。"
 chios.0030.b:0 "不，我不能这样。但谢谢你的提议。"
 chios.0031.t:0 "塔姆布拉琴"
 chios.0031.desc:0 "当每个人都在狂欢节吃饭、跳舞或聊天时，我看着一些当地音乐家用塔姆布拉琴弹唱，这是一种在希腊地区常见的古老的乐器。与我在宫廷里听的音乐相比，这些音乐质朴而简单，但它别有一番风味。"
 chios.0031.a:0 "天籁之音不过如此吧。"
 chios.0032.t:0 "石灰岩颜色"
 chios.0032.desc:0 "我决定从狂欢节的所有庆祝活动中休息一下，和几个熟人坐在小镇旁边的草地上。当我们讨论各种话题时，我的目光转向了蒂米亚纳镇里的各种建筑。我注意到建筑物的石头常常带有棕色和红色，是蒂米亚纳附近的石灰岩的常见颜色。"
 chios.0032.a:0 "哦！我应该将注意力转回谈话中。"
 chios.0033.t:0 "舞蹈，舞蹈"
 chios.0033.desc:0 "在狂欢节的庆典中，我看到一群村民自发地跳起舞来，在镇上的广场上欢笑着，他们边唱边动起手来，互相旋转着。"
 chios.0033.a:0 "我应该加入他们！"
 chios.0033.b:0 "我在一旁看着就好了。"
 chios.0034.t:0 "蒂米亚纳的故事"
 chios.0034.desc:0 "在狂欢节，一群人围绕着一位坐在木凳上的老人。老人俯下身子，用夸张的手势和有力的声音，详细地复述了他们的祖先如何通过智慧和决心，在蒂米亚纳击退海盗的故事。"
 chios.0034.a:0 "真是一个有趣的故事。"
 chios.0035.t:0 "木剑"
 chios.0035.desc:0 "在狂欢节庆典中，我与参加重演战斗的一个年轻人交谈，该战斗再现了几代人以前的真实战斗。他自豪地向我展示了他在重演战斗中舞动的木剑。\n\n“[ROOT.Char.GetLadyLord]，如果你有兴趣，我可以展示我的舞剑技巧给你。”他告诉我。"
 chios.0035.a:0 "好，把你的技艺展现出来吧。"
 chios.0035.b:0 "算了吧，这不是一把真正的剑！我们去找点吃的吧。"
 chios.0035.c:0 "不如让我指导你几招剑术吧，恰好我略知一二。"
 chios.0036.t:0 "希俄斯食物"
 chios.0036.desc:0 "在宴席上，我看到几盘食物排列在我面前。有许多美味的菜肴可供选择，但有几道菜吸引了我的目光。我现在应该吃什么？"
 chios.0036.a:0 "Avgokalamara —— 内含洋葱炒肉的鸡蛋饼"
 chios.0036.b:0 "卡卡维亚汤——由洋葱和黑胡椒烹饪的鱼汤"
 chios.0036.c:0 "Melitzanopilafo—— 加入茄子、蔬菜、香料的炒饭"
 chios.0037.t:0 "希俄斯葡萄酒"
 chios.0037.desc:0 "“[ROOT.Char.GetLadyLord]，您想试试我们的酒吗？”当我回去拿下一轮食物的时候，一位农妇问我。“去吧，我们把它和一点乳香混在一起，它们非常适合这个庆典。”"
 chios.0037.a:0 "谢谢，我会品尝一点的。"
 chios.0037.b:0 "不，谢谢"
 chios.0038.t:0 "蒂米亚纳的瞭望塔"
 chios.0038.desc:0 "我和一群村民一起，从庆典中抽身出来，参观位于蒂米亚纳边缘的一座古老瞭望塔。传说这个特别瞭望塔是在多年前那场高潮迭起的战斗之前，发现了海盗。"
 chios.0038.a:0 "令人着迷的是，这座瞭望塔似乎仍然如此坚固。"
 chios.0039.t:0 "面具"
 chios.0039.desc:0 "蒂米亚纳的一位村民正在向我展示他在早些时候为庆典仪式上所戴的面具。\n\n“相当可怕，不是吗？”他笑着说，“当我戴上它时，我感觉自己变成了另一个人！”\n\n然后他向我解释了当地人在庆典期间戴的不同种类的面具，它们的含义，以及它们是如何制作的。"
 chios.0039.a:0 "这些面具肯定能让人感到害怕！"
 chios.0039.b:0 "这些面具并不可怕，而且看起来很有趣。"
