l_simp_chinese:
 # Additions for CK3 1.20; existing Milk localization remains credited separately.
 damot_high_god_name_possessive:0 "$damot_high_god_name$"
 karen_pagan_desc:0 "克伦诸族的传统信仰重视与世间诸灵维持平衡。每个人在世时，都由三十七个称为“克拉”的灵构成。"
 karen_pagan_old_desc:0 "$karen_pagan_desc$"
 karen_pagan:0 "克拉教"
 pudgalavada_faith:0 "补特伽罗派"
 pudgalavada_faith_desc:0 "虽然不存在恒常的自我，却存在补特伽罗，也就是既非有为法、亦非无为法的“人”。通往觉悟的道路，需要借助亲身体验、思辨和推理来理解这一补特伽罗。"
 pudgalavada:0 "正量部"
 pudgalavada_desc:0 "正量部是犊子部分出的诸部中最兴盛、流传最广的一支。它与其他主要佛教宗派的关键区别，在于坚信有一个承担业报的“人”。他们认为，这并不违背佛陀深奥的无我教义，反而使其含义更为精确。"
 vatsiputriya:0 "犊子部"
 vatsiputriya_desc:0 "犊子部最早宣讲补特伽罗之说：虽然没有恒常的自我，却有一个承担业报的“人”，从一世延续至下一世，直至获得觉悟。"
 dharmaguptaka:0 "法藏部"
 dharmaguptaka_desc:0 "法藏部将其传承追溯至传说中的达摩笈多，他是佛陀弟子目犍连的虔诚信众。这一宗派以犍陀罗为中心，却对中亚乃至更远地区产生了影响。他们认为四圣谛应当同时证知，声闻道与菩萨道则各不相同。"
 sarvastivada:0 "说一切有部"
 sarvastivada_desc:0 "“说一切有部”意为主张一切皆有，认为所有法，也就是一切现象，在过去、现在与未来三世中都存在。这一宗派有深厚的阿毗达磨论学传统，形成了七部独有的论书，并在其历史中深刻影响了印度佛教哲学与义理的发展。"
 vibhajjavada:0 "分别说部"
 vibhajjavada_desc:0 "分别说部因辨析现象是否存在于现在与过去，以及哪些法不存于过去与未来而得名。他们拒绝补特伽罗派和上座部的教说，由多个自认维护佛陀真正教义的宗派组成。"
 mahasanghika:0 "大众部"
 mahasanghika_desc:0 "在第二次佛教结集中，大众部是拒绝为僧团增订戒律的多数派，与主张增订的上座部相对。他们认为佛与菩萨具有超越世间的本性，阿罗汉仍会犯错，而历史上的佛陀从未拥有真正的肉身，只是为了救度众生而示现幻身。"
 marcionite:0 "马吉安派"
 marcionite_desc:0 "马吉安派追随早期基督教神学家、锡诺普的马吉安。他宣称，福音书中仁慈的上帝才是真正的至高者，与希伯来《旧约》中恶意的造物主截然不同。在他看来，使徒保罗是耶稣基督唯一真正的使徒。"
 nubian_rite:0 "努比亚礼"
 nubian_rite_desc:0 "尽管与科普特教会关系密切，努比亚的基督教仍形成了独有的传统，例如敬奉已故君主、主教和地方圣徒，以及接纳非洲本土习俗。数百年来，努比亚教会始终坚定地维护自身与科普特教会。"
 egyptian_pagan:0 "凯米特教"
 egyptian_pagan_desc:0 "法老的宗教绵延数千年。无数神祇存在于世界与日常生活之中，对其拥有不容置疑的支配权。人们必须通过祈祷、献祭、庆典，以及修建宏伟的神庙和纪念碑，赢得诸神的眷顾，并维系宇宙秩序——玛阿特。"
 meroitic_pagan:0 "阿佩德马克教"
 meroitic_pagan_desc:0 "麦罗埃王国的宗教，融合了古埃及神系与苏丹地区本土信仰数百年的传统。在强大的祭司阶层和王权支持下，它发展为独特而富有活力的信仰。狮首战神阿佩德马克，以及埃及神祇伊西斯与奥西里斯，都是重要的崇拜对象。"
 meroitic_pagan_old_desc:0 "$meroitic_pagan_desc$"
 ammon_pagan:0 "阿蒙教"
 ammon_pagan_desc:0 "以锡瓦神谕所为中心，融合希腊、柏柏尔与凯米特习俗的混融宗教。"
 beja_pagan:0 "曼杜利斯教"
 beja_pagan_desc:0 "“太阳，伟大的神，卡拉布沙之主，洞察一切的主人，万物之王。”\n\n曼杜利斯在古努比亚语中也称梅尔韦尔，是下努比亚伟大的太阳神。埃及人与库施人虽然也崇拜他，但这一信仰的中心位于东部沙漠的布莱米人之中。曼杜利斯通常被描绘为人首鹰身，是埃及天空之神、伊西斯与奥西里斯之子荷鲁斯的库施形态。他在菲莱的主神庙是最重要的朝圣地。"
 kushitism_pagan:0 "埃贝雷教"
 kushitism_pagan_desc:0 "尽管与埃及和麦罗埃的古老多神崇拜有关，努比亚人等东北苏丹诸族却舍弃了麦罗埃的祭司传统，转而发展自己的崇拜形式，并受到北方亚伯拉罕诸教的一些影响。"
 kushitism_pagan_old_desc:0 "$kushitism_pagan_desc$"
 sardinian_religion:0 "撒丁宗教"
 sardinian_religion_desc:0 "撒丁岛原住民崇拜的神祇常与动物和自然象征相联系，尤以男性的公牛与太阳、女性的水与月亮所代表的生育神祇为重。按照传统，岛民会在一年中的不同时节聚集于圣井等圣地举行祭拜。"
 sardinian_pagan:0 "努拉吉教"
 sardinian_pagan_desc:0 "$sardinian_religion_desc$"
