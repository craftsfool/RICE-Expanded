 RICE_every_courtier_prefers_indigenous_clothing:0 "每位偏好非洲本土风格服饰的[courtier|E]"
 RICE_baqt_frontier_decision_desc_alt:0 "按照[RICE_baqt_treaty|E]的条款，第一瀑布的边境官员需不断处理各种事务，维持埃及与努比亚之间的边界。"
