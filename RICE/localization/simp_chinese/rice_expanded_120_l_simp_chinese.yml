 setting_RICE_yarsani_emergence_vanilla_desc:0 "雅尔桑[faith|E]会像原版一样在开局时存在。[characters|E]不会自动改信$kitebacilweism$。"
 MODERN_SOUTH_ARABIAN_LANGUAGES_GLOSS:0 "#Bold 现代南阿拉伯诸语言#!是闪米特语族中一个濒危的分支，原生于也门和阿曼，包括迈赫里语、索科特拉语等。它们与古代也门所使用的古南阿拉伯诸语言属于不同分支，既不能混为一谈，也不存在承继关系。"
 OLD_SOUTH_ARABIAN_LANGUAGES_GLOSS:0 "#Bold 古南阿拉伯诸语言#!是闪米特语族的一个分支，曾用于伊斯兰教兴起前的南阿拉伯古国，如示巴与哈德拉毛。它们与现代南阿拉伯诸语言属于不同分支，既不能混为一谈，也不是后者的祖先。也门西部山区使用的拉齐希语、法伊菲语和里贾勒阿尔玛语等现代语言，保留了一些古南阿拉伯语的特征，但是否可视为其遗存，仍有争议。"
 tenet_rice_personalism_name:0 "补特伽罗"
 tenet_rice_personalism_desc:0 "一些受蒙蔽的佛教徒将佛陀的“无我”教义推向了极端。我们理解他的真正教导：虽然没有恒常的自我，却有一个#italic 补特伽罗#!，也就是承担业报、从一世延续至下一世的“人”，如同靠燃料延续的火。获得觉悟，正如熄灭这团火。"
 tenet_rice_flawed_arhats_name:0 "阿罗汉有失"
 tenet_rice_flawed_arhats_desc:0 "[Glossary( '阿罗汉', 'ARHATS_GLOSS' )]虽然修行深厚，却仍会犯错，也可能失德。因此，我们不赞同他人以成为阿罗汉为志向：不完全的觉悟#italic 并非#!真正的觉悟，成佛才应是所有人的最终目标！"
 tenet_rice_meritorious_merchant_donors_name:0 "商贾功德"
 tenet_rice_meritorious_merchant_donors_desc:0 "商人是我们宗教团体的重要成员，他们用财富传播[ROOT.Faith.HighGodName]的真正教诲。作为回报，寺庙与修院为有德行的商人提供借贷、货物储藏与歇息之所。"
 tenet_rice_all_dharmas_exist_name:0 "三世实有"
 tenet_rice_all_dharmas_exist_desc:0 "一切现象，也就是诸法，包括业在内，皆存在于过去、现在和未来“三世”之中。这一精细的哲学观点形成了系统的解释框架，将佛陀教义的多个层面联系起来，从禅修实践一直延伸到经典诠释。"
 tenet_rice_sanctity_of_labor_name:0 "劳作神圣"
 tenet_rice_sanctity_of_labor_desc:0 "教堂、寺庙以及献给神明的祭品或许具有灵性价值，但没有任何事比在田间辛勤劳作一整日更为神圣。"
