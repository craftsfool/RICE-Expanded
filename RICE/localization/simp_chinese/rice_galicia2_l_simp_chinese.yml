 galicia2.0040.t:0 "两兄弟，一遗产"
 galicia2.0040.desc:0 "我的父亲[yaroslav.GetTitledFirstName]去世了，许多人称赞他是一位伟大的统治者，并给他[yaroslav.GetNickname]这样一个称号。\n\n但如今他走了，我和哥哥的冲突不可避免了。"
 galicia2.0040.desc.vladimir:0 "那个女巫[anastasia.GetFirstName]的孩子——[oleg.GetFirstName]，他竟然继承了父亲的头衔，本属于我的！显然父亲是个傻瓜，竟然迷上了那个情妇，而不是他真正的妻子，我那母亲。\n\n如今很多波雅尔都承诺，如果我坚持宣称，他们会支持我。但我知道他们不能完全信任，我可能不得不在其他地方寻找盟友，比如远亲[vladimir.GetDynasty.GetName]宗族？外国统治者也好，但我都要保留如今的生活——这本是我应得的，而不是[oleg.GetFirstNameNoTooltip]的！"
 galicia2.0040.desc.oleg:0 "沉溺酒色、挥霍无度的蠢材——[vladimir.GetFirstName]！显然父亲预见到[vladimir.GetFirstNameNoTooltip]会成为一个无能的统治者，很容易被那些残忍杀害我母亲的贵族控制。\n\n如今这些贵族们会尽一切努力让[vladimir.GetFirstNameNoTooltip]登上王位。我可能不得不在其他地方寻找盟友，比如远亲[vladimir.GetDynasty.GetName]宗族？外国统治者也好，来夷灭这些麻烦的贵族们，再杀了[vladimir.GetFirstNameNoTooltip]，然后生存下去，我父亲知道我是更好的继承人，我不会让他失望的！"
 galicia2.0040.a:0 "亲爱的兄弟，你应该就此#italic 停下来#!了！"
