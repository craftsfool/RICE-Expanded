 galicia2.0000.t:0 "$galicia2.0002.t$"
 galicia2.0000.desc:0 "[rus_culture.GetCollectiveNoun]人逐渐在东欧定居点和部族中涌现，我的领土内已经有一些人将自己归属于这种新的身份。\n\n通过采用[rus_culture.GetCollectiveNounNoTooltip]的风俗习惯，以及[rus_culture.GetLanguage.GetName]语言，可以与邻国建立更紧密的联系，扩大我的政治和经济影响力。"
 galicia2.0000.a:0 "xxxxx"
 galicia2.0001.t:0 "$galicia2.0002.t$"
 galicia2.0001.desc:0 "东欧很多民族逐渐习惯了森林、丘陵、沼泽和河岸地区，随着贸易和各种定居点出现，这里出现一种新的身份认同——[rus_culture.GetCollectiveNoun]。\n\n而我是[rus_culture.GetNameNoTooltip]领主中最强大的一位，这些[rus_culture.GetHeritage.GetNameNoTooltip]部落构成了这一新身份的核心，但其他[rus_culture.GetCollectiveNounNoTooltip]人则有不同的起源。\n\n我们应该鼓励使用一种语言来维持凝聚力，但[old_rus_culture.GetLanguage.GetName]多年来一直是该地区的通用语言。"
 galicia2.0001.desc.east_slavic:0 "我认为没有理由改变，因为很多人知晓这一语言。"
 galicia2.0001.desc.non_east_slavic:0 "但我明白推广[original_culture.GetLanguage.GetName]背后的逻辑。"
 galicia2.0001.a:0 "[old_rus_culture.GetLanguage.GetNameNoTooltip]应该继续成为通用语。"
 galicia2.0001.b:0 "[original_culture.GetLanguage.GetNameNoTooltip]将会是一种更好的通用语言。"
 galicia2.0002.t:0 "[rus_culture.GetCollectiveNounNoTooltip]人的崛起"
 galicia2.0002.desc:0 "几个世纪以来，许多民族和部落都居住在东欧的森林、丘陵、沼泽和河岸边。随着伏尔加河、顿河和第聂伯河等河流沿岸定居点的贸易增长和政治变革，他们相互影响、交流和同化，慢慢地在#italic 城镇之国#!中崛起成为[rus_culture.GetCollectiveNoun]人。\n\n来自[original_culture.GetName]的传奇的[rus_founder.GetTitledFirstName]，[rus_founder.GetSheHe]用铁腕与智慧把出身各异的民族融合成为[rus_culture.GetCollectiveNoun]人，更是建立[ROOT.Char.GetPrimaryTitle.GetBaseName]，让其成为地区的政治、文化和经济中心。\n\n此外还把旧的[rus_culture.GetHeritage.GetNameNoTooltip]文化习俗确立为[rus_culture.GetName]文化核心。"
 galicia2.0002.desc.east_slavic:0 "[rus_culture.GetLanguage.GetName]语言多年来一直是该地区的通用语，而[rus_culture.GetNameNoTooltip]的主导地位将确保它在未来保持主导。"
 galicia2.0002.desc.non_east_slavic:0 "尽管[old_rus_culture.GetLanguage.GetName]曾经是该地区的通用语，但由于最近的文化和政治变化，[rus_culture.GetLanguage.GetName]已成为新的主导语言。"
 galicia2.0002.a:0 "城镇之地的有趣发展！"
 galicia2.0003.t:0 "$galicia2.0002.t$"
 galicia2.0003.desc:0 "[rus_culture.GetCollectiveNoun]人逐渐在东欧定居点和部族中涌现，我的领土内已经有一些人将自己归属于这种新的身份。\n\n通过采用[rus_culture.GetCollectiveNounNoTooltip]的风俗习惯，以及[rus_culture.GetLanguage.GetName]语言，可以与邻国建立更紧密的联系，扩大我的政治和经济影响力。"
 galicia2.0003.a:0 "我们如今是[rus_culture.GetNameNoTooltip]。"
 galicia2.0003.b:0 "吾永是[ROOT.Char.GetCulture.GetNameNoTooltip]人！"
