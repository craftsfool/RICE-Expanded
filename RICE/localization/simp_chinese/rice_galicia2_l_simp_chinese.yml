 RICE_nick_osmomysl_desc:0 "正是[CHARACTER.GetShortUINameNoTooltipNoFormat]那著名的智慧，因此[CharYourHerHis(CHARACTER)]赢得#italic 奥斯莫梅斯尔#!的绰号，意为智慧胜过八个人。"
 RICE_volga_dnieper_merchants_option:0 "伏尔加‑第聂伯商人"
 RICE_volga_dnieper_merchants_option_desc:0 "虽然与大型商队一起旅行可能会拖慢行程，但人多力量大，也很安全。这些商人在穿越东欧区域很有经验，与他们一起旅行可能会获得商业订单！"
 RICE_volga_dnieper_merchant_recruited_tt:0 "[RICE_merchant.GetNamePossessive]商队已作为随行人员加入。"
 RICE_volga_dnieper_merchants_option_effect_1:0 "每次你进入一个[barony|E]，都有#V [GetPlayer.MakeScope.ScriptValue('RICE_volga_dnieper_merchant_travel_option_event_chance')]%#!概率从贸易交易中获得少量[gold_i|E][gold|E]，这取决于你的[diplomacy|E]和[stewardship|E]。"
 RICE_galicia2_boyar_event_troops:0 "波雅尔卫队"
 RICE_rival_galicia2_brotherly_competition:0 "雅罗斯拉夫·奥索穆斯尔去世后，[CHARACTER.GetShortUINamePossessive|U]和[TARGET_CHARACTER.GetShortUIName]就围绕[GetTitleByKey('d_halych').GetNameNoTier]明争暗斗。"
 dynn_bernatovich:0 "贝尔纳托维奇"
 slavic_religion_opinion:0 "$slavic_religion_adherent$人好感"
 game_concept_volga_dnieper_merchants:0 "伏尔加‑第聂伯商人"
 game_concept_volga_dnieper_merchant:0 "伏尔加‑第聂伯商人"
 game_concept_volga_dnieper_merchant_desc:0 "如果你在[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]拥有领土，将会有带$trait_RICE_volga_dnieper_merchant$[trait|E]的$game_concept_volga_dnieper_merchant$时不时地在你的[court|E]出现。你可以选择利用他们的关系，这将为你提供一个[character_modifier|E]，并提高你的[income|E]，并根据他们擅长的贸易商品，给予其他奖励。即使你没有邀请他们进入你的宫廷，你也可以获得这些奖励。\n\n你还可以使用$RICE_develop_portage_routes$[decision|E]，其中有与该地区贸易相关的各种选项。\n\n你也可以尝试在[traveling|E]时选择$RICE_volga_dnieper_merchants_option$[travel_option|E]，其中偶尔会触发事件让你获得$trait_RICE_volga_dnieper_merchant$[trait|E]，或增加你在该[trait|E]中的[trait_level_track_xp|E]。"
 building_type_RICE_kamianets_podilskyi_castle_01:0 "卡緬涅茨-波多利斯基要塞"
 building_type_RICE_kamianets_podilskyi_castle_01_desc:0 "卡緬涅茨-波多利斯基要塞虽小但意义重大，是波多利亚地区的战略要地，贸易和军队经常经过这里。"
 building_RICE_kamianets_podilskyi_castle_01:0 "卡緬涅茨-波多利斯基堡垒"
 building_RICE_kamianets_podilskyi_castle_01_desc:0 "$building_type_RICE_kamianets_podilskyi_castle_01_desc$"
 building_RICE_kamianets_podilskyi_castle_02:0 "卡缅涅茨-波多利斯基城堡"
 building_RICE_kamianets_podilskyi_castle_02_desc:0 "波多利亚地区的战略中心插着卡緬涅茨-波多利斯基要塞，商人和军队经常经过这里。历代统治者都为这座要塞增添了自己独特的元素，使得其防御工事可以轻松抵御大多数攻击者。"
 building_type_RICE_galicia2_cochineal_industry_01:0 "胭脂虫红染坊"
 building_type_RICE_galicia2_cochineal_industry_01_desc:0 "[Glossary( '胭脂虫', 'COCHINEAL_GLOSS' )]养殖园中会产生胭脂虫红染料，这种昆虫遍布于各个[GetGeographicalRegion('RICE_european_cochineal_region').GetName]，在海外市场上溢价颇高。"
 building_RICE_galicia2_cochineal_industry_01:0 "小型胭脂虫养殖园"
 building_RICE_galicia2_cochineal_industry_01_desc:0 "在养殖园中组织化方式收获[Glossary( '胭脂虫', 'COCHINEAL_GLOSS' )]，让胭脂虫生产的胭脂虫红染料显著增加。"
 building_RICE_galicia2_cochineal_industry_02:0 "大型胭脂虫养殖园"
 building_RICE_galicia2_cochineal_industry_02_desc:0 "随着该地区的[Glossary( '胭脂虫', 'COCHINEAL_GLOSS' )]养殖园扩大经营，得以与外国商人建立了更紧密的联系，使得胭脂虫红染料能够销往更多市场。"
 building_RICE_galicia2_cochineal_industry_03:0 "巨型胭脂虫养殖园"
 building_RICE_galicia2_cochineal_industry_03_desc:0 "该地区坐拥全世界最大的[Glossary( '胭脂虫', 'COCHINEAL_GLOSS' )]养殖园。生产胭脂虫红染料在海外市场上溢价颇高。"
 trait_RICE_volga_dnieper_merchant:0 "伏尔加‑第聂伯商人"
 trait_RICE_volga_dnieper_merchant_desc:0 "该角色是伏尔加河和第聂伯河及周边地区贸易路线上的著名商人，其在贸易、旅行和谈判方面有丰富的经验。"
 trait_RICE_volga_dnieper_merchant_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是伏尔加河和第聂伯河及周边地区贸易路线上的著名商人，[ROOT.GetCharacter.GetSheHe|U]在贸易、旅行和谈判方面有丰富的经验。"
 trait_RICE_volga_dnieper_merchant_2:0 "著名的伏尔加‑第聂伯商人"
 trait_RICE_volga_dnieper_merchant_2_desc:0 "$trait_RICE_volga_dnieper_merchant_desc$"
 trait_RICE_volga_dnieper_merchant_2_character_desc:0 "$trait_RICE_volga_dnieper_merchant_character_desc$"
 trait_RICE_volga_dnieper_merchant_3:0 "伏尔加‑第聂伯传奇商人"
 trait_RICE_volga_dnieper_merchant_3_desc:0 "$trait_RICE_volga_dnieper_merchant_desc$"
 trait_RICE_volga_dnieper_merchant_3_character_desc:0 "$trait_RICE_volga_dnieper_merchant_character_desc$"
 trait_track_RICE_volga_dnieper_merchant:0 "$trait_RICE_volga_dnieper_merchant$"
 trait_track_RICE_volga_dnieper_merchant_desc:0 "在外人看来，东欧是一片荒凉而险恶的土地，但四通八达的河道及森林带来许多贸易机会，里面有着销往世界各地的奢侈品。"
 RICE_galicia2_aspiration_roman_desc: "\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_galicia-volhynia').GetNameNoTier][independent|E][ruler|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_halych').GetNameNoTier]、[GetTitleByKey('d_volhynia').GetNameNoTier]和[GetTitleByKey('d_cherven_cities').GetNameNoTier]\n$EFFECT_LIST_BULLET$达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L][piety_level|E]或更高\n$EFFECT_LIST_BULLET$达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L][prestige_level|E]或更高\n$EFFECT_LIST_BULLET$[GetTitleByKey('e_byzantium').GetNameNoTier]仍然存在\n$EFFECT_LIST_BULLET$与 [GetTitleByKey('e_byzantium').GetNameNoTier][ruler|E]信仰同一[religion|E]\n$EFFECT_LIST_BULLET$不与[GetTitleByKey('e_byzantium').GetNameNoTier]处于[war|E]\n$EFFECT_LIST_BULLET$与[GetTitleByKey('e_byzantium').GetNameNoTier][ruler|E]建立[alliance|E]（前提是其存在）\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]\n$EFFECT_LIST_BULLET$获得一个[diplomacy_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$获得#V 1000#!名[special_troops|E]（包括[men_at_arms|E]）\n$EFFECT_LIST_BULLET$如果[GetTitleByKey('e_byzantium').GetNameNoTier]仍然存在，则与符合条件的拜占庭皇室或贵族[marriage|E]，从而进一步获得@legitimacy_icon![legitimacy|E]和[prestige_i|E][prestige|E]（你需与你的任一[spouse|E][divorce|E]）\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$控制[GetTitleByKey('c_kiev').GetNameNoTier][county|E]（奖励：获得[martial_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$[legitimacy_i|E][legitimacy_level|E]达到五级（奖励：#V 1000#!名[special_troops|E]（包括[men_at_arms|E]））\n"
 RICE_galicia2_historical_aspiration_action_roman: "#italic 当留里克王朝同室操戈时，正是你在东欧建立新权力并赢得罗斯母亲[GetTitleByKey('e_byzantium').GetNameNoTier]青睐的时刻。#!$RICE_galicia2_aspiration_roman_desc$"
 RICE_galicia2_historical_aspiration_modifier_desc_roman: "[GetModifier('RICE_galicia2_aspiration_unify_galicia_and_volhynia').GetNameWithTooltip]"
 RICE_galicia2_aspiration_oleg_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E]且是有着[GetTitleByKey('d_halych').GetNameNoTier][title|E]的[independent|E][ruler|E]\n$EFFECT_LIST_BULLET$弗拉迪米尔·雅罗斯拉维奇（你的同父异母哥哥）去世\n$EFFECT_LIST_BULLET$每位直属[vassal|E]处于[intimidated|E]你或者[cowed|E]你状态，至少对你有#P 25#![opinion|E]\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得一个[intrigue_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$失去[GetModifier('RICE_galicia2_oleg_negative_modifier').GetNameWithTooltip][modifier|E]并改为一个#P 正面#!修正来替代\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L][piety_level|E]或更高（奖励：一个[diplomacy_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$达到[legitimacy_i|E][legitimacy_level|E]五级（奖励：#V 1000#!名[special_troops|E]（包括[men_at_arms|E]）"
 RICE_galicia2_historical_aspiration_action_oleg: "#italic 哪怕父亲遗志让你继承了[GetTitleByKey('d_halych').GetNameNoTier]，但那些渴望权力的哈利奇波雅尔蠢蠢欲动，他们甚至敢于残忍地谋杀你的母亲，你需用尽手段解决他们。#!$RICE_galicia2_aspiration_oleg_desc$"
 RICE_galicia2_historical_aspiration_modifier_desc_oleg: "[GetModifier('RICE_galicia2_aspiration_secure_rule_against_galician_boyars').GetNameWithTooltip]"
 RICE_galicia2_aspiration_unify_galicia_and_volhynia: "[RICE_aspiration|E]：统一$d_halych$和$d_volhynia$"
 RICE_galicia2_aspiration_unify_galicia_and_volhynia_desc: "#italic 当留里克王朝同室操戈时，正是东欧建立新权力并赢得罗斯母亲[GetTitleByKey('e_byzantium').GetNameNoTier]青睐的时刻。#!$RICE_galicia2_aspiration_roman_desc$\n\n"
 RICE_galicia2_aspiration_secure_rule_against_galician_boyars: "[RICE_aspiration|E]：巩固对加利奇波雅尔的统治"
 RICE_galicia2_aspiration_secure_rule_against_galician_boyars_desc: "#italic 哪怕父亲遗志让奥列格继承了[GetTitleByKey('d_halych').GetNameNoTier]，但那些渴望权力的哈利奇波雅尔蠢蠢欲动，他们甚至敢于残忍地谋杀奥列格的母亲，他需用尽手段解决他们。#!$RICE_galicia2_aspiration_oleg_desc$\n\n"
 activity_RICE_galicia2_kupala_night_host_an_a:0 "$host_activity_a$"
 activity_RICE_galicia2_kupala_night:0 "库帕拉之夜"
 activity_RICE_galicia2_kupala_night_desc:0 "对于许多斯拉夫民族来说，夏至是一个具有重要仪式意义和喜庆的时刻。"
 activity_RICE_galicia2_kupala_night_selection_tooltip: "庆祝库帕拉之夜。\n\n$activity_RICE_galicia2_kupala_night_context_tooltip$"
 activity_RICE_galicia2_kupala_night_context_tooltip:0 "#emphasis 历史背景：#!伊万·库帕拉节是斯拉夫民族（尤其是东西斯拉夫人）的夏至节日，这节日自中世纪以来就一直存在，不过几个世纪以来，基督教一直试图压制库帕拉节，因为他们认为这是一种异教习俗。游戏中库帕拉节大致基于斯拉夫各国现代习俗的融合，因此可能并不反映中世纪时期实际的历史庆祝。"
 activity_RICE_galicia2_kupala_night_host_desc: "\n$BULLET_WITH_TAB$#P 获得#![prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$有概率获得#P 正面#![character_modifiers|E]\n$BULLET_WITH_TAB$有概率获得#P 正面#![county_modifiers|E]\n$BULLET_WITH_TAB$如果你信奉非异教[faith|E]，且没有[GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName] [doctrine|E]或$tenet_unreformed_syncretism_name$[core_tenet|E]，则#N 失去#![piety_i|E][piety|E]"
 activity_RICE_galicia2_kupala_night_guest_desc: "$activity_RICE_galicia2_kupala_night_host_desc$"
 activity_RICE_galicia2_kupala_night_province_desc: ""
 activity_RICE_galicia2_kupala_night_destination_selection: "$activity_RICE_galicia2_kupala_night_province_desc$"
 activity_RICE_galicia2_kupala_night_guest_help_text: "$activity_RICE_galicia2_kupala_night$"
 activity_RICE_galicia2_kupala_night_predicted_cost: "[activity|E]的费用主要取决于你的[income|E]。"
 activity_RICE_galicia2_kupala_night_conclusion_desc: "[GetActivityType( 'activity_RICE_galicia2_kupala_night' ).GetName]已经结束了，夏天也到来了!"
 RICE_galicia2_kupala_night_celebration_phase: "庆祝"
 RICE_galicia2_kupala_night_celebration_phase_desc: "夏日将至！"
 RICE_galicia2_kupala_night_fun_intent_header: "享乐："
 RICE_galicia2_kupala_night_fun_intent: "享乐"
 RICE_galicia2_kupala_night_fun_intent_desc: "你专注于享乐，将失去[stress_loss_i|E][stress|E]，若你拥有[GetTrait('gregarious').GetName( GetNullCharacter )]或[GetTrait('lustful').GetName( GetNullCharacter )]特质则会失去更多。"
 RICE_galicia2_kupala_night_lavation_intent_header: "净化："
 RICE_galicia2_kupala_night_lavation_intent: "净化"
 RICE_galicia2_kupala_night_lavation_intent_desc: "你将专注于节日仪式和净化自己。你若是异教徒则获得[piety_i|E][piety|E]，若是非异教徒则获得[prestige_i|E][prestige|E]，若你拥有[GetTrait('diligent').GetName( GetNullCharacter )]或[GetTrait('paranoid').GetName( GetNullCharacter )]特质，则额外失去[stress_loss_i|E][stress|E]。"
 RICE_galicia2_kupala_night_herb_gathering_intent_header: "寻药："
 RICE_galicia2_kupala_night_herb_gathering_intent: "寻药"
 RICE_galicia2_kupala_night_herb_gathering_intent_desc: "你将专注于寻药，你会经历一些有关草药的事件，从而获得#P 正面#![modifier|E]并增加找到[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]的概率，此外还有可能从此活动获得[prestige_i|E][prestige|E]。如果你拥有[GetTrait('patient').GetName( GetNullCharacter )]或[GetTrait('humble').GetName( GetNullCharacter )]特质，你也还额外失去[stress_loss_i|E][stress|E]。"
