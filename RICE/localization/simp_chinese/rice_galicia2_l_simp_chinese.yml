 RICE_galicia2_cochineal_modifier_1:1 "小笔胭脂虫红染坊投资"
 RICE_galicia2_cochineal_modifier_1_desc:1 "这里生产的红色染料来自养殖园中的[Glossary( '胭脂虫', 'COCHINEAL_GLOSS' )]的幼虫，它们是炙手可热的商品。当地统治者正在尽最大努力支持这些染料的收获和出口。\n\n#EMP 该[modifier|E]的强度取决于$RICE_galicia2_support_cochineal_industry$[decision|E]时的选择，以及[duchy|E][county|E]是否有$building_type_RICE_galicia2_cochineal_industry_01$[duchy_building|E]#!"
 RICE_galicia2_cochineal_modifier_2:1 "正常投资胭脂虫红染坊投资"
 RICE_galicia2_cochineal_modifier_2_desc:1 "$RICE_galicia2_cochineal_modifier_1_desc$"
 RICE_galicia2_cochineal_modifier_3:1 "大笔胭脂虫红染坊投资"
 RICE_galicia2_cochineal_modifier_3_desc:1 "$RICE_galicia2_cochineal_modifier_1_desc$"
 RICE_galicia2_cochineal_modifier_4:1 "巨额胭脂虫红染坊投资"
 RICE_galicia2_cochineal_modifier_4_desc:1 "$RICE_galicia2_cochineal_modifier_1_desc$"
 RICE_galicia2_oleg_negative_modifier:1 "女巫之子"
 RICE_galicia2_oleg_negative_modifier_desc:1 "奥列格的母亲阿纳塔西娅曾被哈利奇的波雅尔们指控为女巫——他们声称她用巫术蛊惑了加利西亚统治者“大智者”雅罗斯拉夫，最终将她处以火刑。\n\n#EMP 如果奥列格完成[GetModifier('RICE_galicia2_aspiration_secure_rule_against_galician_boyars').GetNameWithTooltip]，那么该[modifier|E]将被移除。#!"
 RICE_galicia2_oleg_positive_modifier_1:1 "女巫的冷酷之子"
 RICE_galicia2_oleg_positive_modifier_1_desc:1 "奥列格的母亲阿纳塔西娅曾被哈利奇的波雅尔们指控为女巫——他们声称她用巫术蛊惑了其统治者“大智者”雅罗斯拉夫，最终将她处以火刑。\n\n奥列格最终成为受人尊敬的统治者，但他仍未摆脱身为女巫之子的污名，人们既畏惧他的权势，又有人怀疑其继承了母亲所谓的巫术能力。"
 RICE_galicia2_oleg_positive_modifier_2:1 "女巫的受人尊敬之子"
 RICE_galicia2_oleg_positive_modifier_2_desc:1 "奥列格的母亲阿纳塔西娅曾被哈利奇的波雅尔们指控为女巫——他们声称她用巫术蛊惑了其统治者“大智者”雅罗斯拉夫，最终将她处以火刑。\n\n奥列格最终成为受人尊敬的统治者，但他仍未摆脱身为女巫之子的污名，不过许多民众认为他是一位受人喜爱的领导者，可以制衡贵族的权力。"
 RICE_galicia2_oleg_positive_modifier_3:1 "女巫的博学之子"
 RICE_galicia2_oleg_positive_modifier_3_desc:1 "奥列格的母亲阿纳塔西娅曾被哈利奇的波雅尔们指控为女巫——他们声称她用巫术蛊惑了其统治者“大智者”雅罗斯拉夫，最终将她处以火刑。\n\n奥列格克最终成为受人尊敬的统治者，但他仍未摆脱身为女巫之子的污名，不过许多人敬佩其的坚韧辛勤。"
 RICE_portage_erect_stones_nonchristian_modifier:1 "引路岩"
 RICE_portage_erect_stones_nonchristian_modifier_desc:1 "当地统治者最近在位于重要贸易路线沿线的搬运点附近竖立了新的或翻新了现有的引路岩，这些石头可以帮助旅行者了解他们身在何处以及他们要去哪里。"
 RICE_portage_erect_stones_christian_modifier:1 "引路十字架"
 RICE_portage_erect_stones_christian_modifier_desc:1 "当地统治者最近在位于重要贸易路线沿线的搬运点附近竖立了新的或翻新了现有的引路十字架，这些石头可以帮助旅行者了解他们身在何处以及他们要去哪里。"
 RICE_portage_levy_boat_builders_modifier:1 "征召船工"
 RICE_portage_levy_boat_builders_modifier_desc:1 "该角色征召了居住在[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]领土内的农民为其建造和修理船只。"
 RICE_portage_maintain_hauling_sites_modifier:1 "维护基建"
 RICE_portage_maintain_hauling_sites_modifier_desc:1 "当地统治者最近已采取措施改善该地区基础运输设施。"
 RICE_portage_promote_merchants_modifier:1 "促进[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetNameNoTooltip]贸易"
 RICE_portage_promote_merchants_modifier_desc:1 "该角色已支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的贸易，此外也在扩大自己的商业网络。"
 RICE_portage_reinforce_river_forts_modifier:1 "加固河堡"
 RICE_portage_reinforce_river_forts_modifier_desc:1 "当地统治者最近在战略要地，特别是对[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]贸易至关重要的地方，加固、修复并新建了城堡。"
 RICE_portage_encourage_settlement_modifier:1 "定居点增长"
 RICE_portage_encourage_settlement_modifier_desc:1 "最近，远方定居者前往[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]加入或新建定居点，这些定居点位于重要的贸易路线上。"
 RICE_volga_dnieper_trade_amber_modifier:1 "支持伏尔加-第聂伯河的琥珀贸易"
 RICE_volga_dnieper_trade_amber_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的琥珀贸易，这些琥珀产自波罗的海，可用于制作珠宝和药物。"
 RICE_volga_dnieper_trade_honey_modifier:1 "支持伏尔加-第聂伯河的蜂蜜和蜂蜡贸易"
 RICE_volga_dnieper_trade_honey_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的蜂蜜和蜂蜡贸易，这些商品是东欧河流域的重要出口产品。"
 RICE_volga_dnieper_trade_slaves_modifier:1 "支持伏尔加-第聂伯河的奴隶贸易"
 RICE_volga_dnieper_trade_slaves_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的奴隶贸易，在北欧、东欧和西部草原劫掠而来的奴隶经常被卖到欧亚奴隶市场。"
 RICE_volga_dnieper_trade_furs_modifier:1 "支持伏尔加-第聂伯河的皮草贸易"
 RICE_volga_dnieper_trade_furs_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的皮草贸易，这些毛皮大部分来自北欧的各种动物。"
 RICE_volga_dnieper_trade_weapons_modifier:1 "支持伏尔加-第聂伯河的武器贸易"
 RICE_volga_dnieper_trade_weapons_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的武器贸易，尽管精工制作的铁制武器沿着贸易路线双向流通，但许多武器来自斯堪的纳维亚半岛。"
 RICE_volga_dnieper_trade_ivory_modifier:1 "支持伏尔加-第聂伯河的海象牙贸易"
 RICE_volga_dnieper_trade_ivory_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的海象牙贸易，虽然大部分产自[greenland|E]，但是北海也有来源。"
 RICE_volga_dnieper_trade_textiles_modifier:1 "伏尔加-第聂伯河的纺织品"
 RICE_volga_dnieper_trade_textiles_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的纺织品贸易。这些纺织品包括亚麻和羊毛，但最赚钱的是丝绸，来自产自地中海、中东和中国各地。"
 RICE_volga_dnieper_trade_coins_modifier:1 "支持伏尔加-第聂伯河的钱币贸易"
 RICE_volga_dnieper_trade_coins_modifier_desc:1 "该角色支持 [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]地区的钱币贸易。尽管远离故土，但如银迪拉姆在当地中广泛流通。"
 RICE_volga_dnieper_trade_spices_modifier:1 "支持伏尔加-第聂伯河的香料贸易"
 RICE_volga_dnieper_trade_spices_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的香料贸易，市场上的许多香料来自世界各地，每个人都知道这是一项暴利的行业。"
 RICE_volga_dnieper_trade_wines_modifier:1 "支持伏尔加-第聂伯河的葡萄酒贸易"
 RICE_volga_dnieper_trade_wines_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的葡萄酒贸易。地中海生产的葡萄酒在北欧等许多地方都很受欢迎，尤其是在精英阶层中。"
 RICE_volga_dnieper_trade_art_modifier:1 "支持伏尔加-第聂伯河的艺术品贸易"
 RICE_volga_dnieper_trade_art_modifier_desc:1 "该角色支持[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的艺术品贸易。从拜占庭的宗教偶像，到中东和东亚瓷器等华丽装饰品，这些艺术品都是那些富人的修养和象征。"
 RICE_galicia2_found_fern_flower:1 "发现蕨花"
 RICE_galicia2_found_fern_flower_desc:1 "该角色据说在库帕拉之夜发现了一朵[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]，并因此获得了神奇的力量。"
 RICE_kupala_night_herbs_modifier:1 "库帕拉之夜采集草药"
 RICE_kupala_night_county_modifier:1 "库帕拉庆典圆满成功"
 RICE_rus_founder_modifier:1 "大$russian$族长"
 RICE_rus_founder_modifier_desc:1 "该角色为$russian$人在东欧的崛起中发挥了重要作用。"
 RICE_galicia2_cremation_crackdown:1 "严厉打击异教火葬习俗"
 RICE_galicia2_cremation_continued:1 "容忍异教火葬习俗"
 RICE_galicia2_cochineal_explainer:1 "胭脂虫红贸易知识"
 RICE_galicia2_suspicious_of_cochineal_merchants:1 "对胭脂虫红商人持怀疑态度"
 RICE_galicia2_galicia_volhynia_architecture_modifier:1 "加利西亚-沃利尼亚建筑业繁荣"
 bhakti_slavic_perun:0 "尊崇佩伦"
 bhakti_slavic_perun_desc:0 "该统治者为佩伦树立了一座神像，佩伦是斯拉夫人的至高神，掌管风暴、雷电和金属武器。"
 bhakti_slavic_veles:0 "尊崇韦列斯"
 bhakti_slavic_veles_desc:0 "该统治者为韦列斯树立了一座神像，韦列斯是水下冥界的统治者，也是牛群、诗歌和巫术之神。"
 bhakti_slavic_stribog:0 "尊崇斯特利博格"
 bhakti_slavic_stribog_desc:0 "该统治者为斯特利伯格竖立了一座神像，斯特利伯格是掌管风与财富传播的神明。"
 bhakti_slavic_mokosh:0 "尊崇莫科什"
 bhakti_slavic_mokosh_desc:0 "该统治者的守护女神是湿地之母莫科什，女性的保护者，掌管编织、绵羊、丰收和分娩的女神。"
 bhakti_slavic_simargl:0 "尊崇斯玛格尔"
 bhakti_slavic_simargl_desc:0 "该统治者为生翼之犬斯玛格尔树立了一座神像，祂是天与地的中介，种子、新芽和人类的保护者。"
 bhakti_slavic_khors_dazhbog:0 "尊崇霍尔斯和达日博格"
 bhakti_slavic_khors_dazhbog_desc:0 "该统治者为霍尔斯和达日博格树立了一个偶像，霍尔斯和达日博格是斯拉夫人的日神和月神，掌管财富与良知。"
 RICE_galicia2_support_cochineal_industry:0 "支持胭脂虫红染坊"
 RICE_galicia2_support_cochineal_industry_tooltip:1 "[Glossary( '胭脂虫红', 'COCHINEAL_GLOSS' )]是一项有利可图的出口产品！"
 RICE_galicia2_support_cochineal_industry_desc:0 "我们的部分领土位于[GetGeographicalRegion('RICE_european_cochineal_region').GetName]内，这里生产的[Glossary( '胭脂虫红染料', 'COCHINEAL_GLOSS' )]是一种销往世界各地且利润丰厚的产品，如果我们支持这个行业，商人就可以继续大量出口这些染料。"
 RICE_galicia2_support_cochineal_industry_effect_tooltip_1:1 "若[duchy|E][counties|e]中拥有$building_type_RICE_galicia2_cochineal_industry_01$[duchy_building|E]，则此[modifier|E]加成会增加"
 RICE_galicia2_support_cochineal_industry_confirm:0 "这些胭脂虫将带给我们巨额财富。"
 RICE_galicia2_support_cochineal_industry_context_tooltip:0 "#emphasis 历史背景：#!#italic 波兰胭脂虫#!和#italic 亚美尼亚胭脂虫#!分别原产于东欧部分地区和亚美尼亚高地，其幼虫数百年来一直被用来生产红色染料，这些红色染料是一种稀有且备受追捧的奢侈品，一度成为波兰立陶宛联邦的主要出口产品之一，直到16世纪被用#italic 美洲胭脂虫#!制成的红色染料所取代。"
 RICE_develop_portage_routes:0 "开发伏尔加河和第聂伯河贸易路线"
 RICE_develop_portage_routes_tooltip:1 "开发[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]的贸易路线"
 RICE_develop_portage_routes_desc:0 "多年来，[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]贸易往来不断，只有愚蠢的[ruler|E]才会忽视其对[realm|E]经济的影响，我应该支持并鼓励贸易路线沿线领土的贸易。"
 RICE_develop_portage_routes_effect_tooltip_1:1 "xxxxxxxxxxxxxxxxxxxxxxxxx"
 RICE_develop_portage_routes_confirm:0 "商队将源源不断来往这里！"
 RICE_develop_portage_routes_context_tooltip:0 "#emphasis 历史背景：#!在中世纪东欧的历史中贸易一直很重要，穿越该地区的贸易路线有时被称为从“自瓦良格至希腊之路”，途径许多不同的民族和地区，将欧洲部分地区与欧亚草原、拜占庭和中东连接起来。这些贸易路线的一个显着特点是广泛使用陆地运输船只。"
 RICE_PORTAGE_PICK_ACTION_TYPE:0 "$RICE_develop_portage_routes_confirm$"
