 galicia2.0028.desc:0 "xxxxx"
 galicia2.0028.a:0 "xxxxx"
 galicia2.0029.t:0 "xxxxx"
 galicia2.0029.desc:0 "xxxxx"
 galicia2.0029.a:0 "xxxxx"
 galicia2.0030.t:0 "[yaroslav.GetTitledFirstNamePossessiveNoTooltip]继承人"
 galicia2.0030.desc:0 "我毫不意外父王[yaroslav.GetTitledFirstName]为何选择我作为[GetTitleByKey('d_halych').GetNameNoTier]的继承人，我那异母兄长[vladimir.GetFirstName]虽年长且嫡出，却是个沉溺酒色、挥霍无度的蠢材，终日被那些野心勃勃的波雅尔们牵着鼻子走，与他相比，我虽未成年，但显然卓尔不群。\n\n那些该死的波雅尔！当年正是他们污蔑我无辜的母亲是女巫，然后将她绑上火刑柱活活烧死。\n\n我恨不得将斩草除根，但终究不遂人愿。若真继承父亲爵位，这群贵族必将作乱，他们会以“女巫之子”否定我的合法性，并扶植[vladimir.GetFirstNameNoTooltip]攫取权力，我若想活命，我需步步为营。"
 galicia2.0030.a:0 "“亲爱的母亲，希望你在天之灵能保佑我……”"
 galicia2.0031.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 galicia2.0031.desc:0 "终于……终于……漫长隐忍得到回报……\n\n我不懈努力，把[GetTitleByKey('d_halych').GetNameNoTier]完全掌控。我那堕落的异母兄弟[vladimir.GetFirstNameNoTooltip]已死，波雅尔再无法扶持他作为傀儡对抗我的统治，母亲，愿您那在天之灵得以安息。\n\n至于那些懦弱的波雅尔们？他们学会了选择，要么臣服，要么永远离开这片土地。从今往后，无人能违逆父亲的遗志——更不可能忤逆我的意志。\n\n仍有人称我为女巫之子，但如今他们颤抖的声线里掺杂着敬畏，#italic 我#!是[GetTitleByKey('d_halych').GetNameNoTier]唯一的主宰。"
 galicia2.0031.a:0 "他们说我也知晓黑魔法？那就让他们惧怕吧！"
 galicia2.0031.b:0 "“我得到人民的支持，这才是#italic 真正的力量#!！”"
 galicia2.0031.c:0 "通过辛勤治理，我成为一位受人尊重的领主。"
 galicia2.0032.t:0 "[GetTitleByKey('d_volhynia').GetNameNoTierNoTooltip]大公"
 galicia2.0032.desc:0 "[ROOT.Char.GetDynasty.GetName]的大公们几十年在[ROOT.Char.GetCulture.GetCollectiveNoun]领地上，与自己人、与外来军阀、贪婪贵族和平民之间不断争执。\n\n[GetTitleByKey('d_novgorod').GetNameNoTier]的人民曾经邀请我统治他们，然后又强行要求我离开，哪怕我做了许多，但时代就是这样。\n\n几年前，我继承了父亲的王位，成为[GetTitleByKey('d_volhynia').GetNameNoTier]的统治者，我必须在[ROOT.Char.GetDynasty.GetNameNoTooltip]的土地上建立根基，军队虽然很重要，但不足以支持我，我必须找到强大的盟友。\n\n虽然我与[GetTitleByKey('k_poland').GetNameNoTier]的统治者有血缘关系，但他们，我并不放心。我听说[GetTitleByKey('e_byzantium').GetNameNoTier][ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]渴望在这个困难时期拥有一个可以依靠的强大盟友。"
 galicia2.0032.a:0 "也许我可以证明自己有资格成为罗马人的盟友……"
 galicia2.0033.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 galicia2.0033.desc:0 "毫无疑问，我已成为[ROOT.Char.GetDynasty.GetName]宗族内最强大的大公之一，我控制着一个听令于我的强大王国——[GetTitleByKey('k_galicia-volhynia').GetNameNoTier]，其他同室操戈的大公们也不得不在一定程度上接受我的权威。\n\n甚至[GetTitleByKey('e_byzantium').GetNameNoTier]皇帝[emperor.GetTitledFirstName]也知晓我的威名，还派出使者寻求与我结盟，想想看成为罗马人的坚定捍卫者和朋友，这多么荣耀啊！\n\n[emperor.GetFirstNameNoTooltip]甚至想和我联姻，与[wife.GetDynasty.GetName]的[wife.GetFirstName]结婚。"
 galicia2.0033.desc.princess:0 "向[emperor.GetHerHis]自己家族的人提亲可不是件小事——看来[emperor.GetSheHe]迫切希望结盟。"
 galicia2.0033.desc.noble:0 "[wife.GetSheHe|U]来自一个著名的拜占庭贵族家庭，可以为我提供与帝国的联系。"
 galicia2.0033.a:0 "我会迎娶[wife.GetFirstNameNoTooltip]作为我的地位和事迹的象征！"
 galicia2.0033.b:0 "我现在的婚姻很好，但联盟会让我事业更进一步……"
 galicia2.0033.c:0 "我不需要婚姻，他们也可以相信我是他们的盟友。"
 galicia2.0034.t:0 "[roman.GetTitledFirstNameNoTooltip]：潜在的盟友？"
 galicia2.0034.desc:0 "群雄环绕的北方土地上，出现了一位新的强大统治者——[roman.GetDynasty.GetName]的[roman.GetTitledFirstName]，[roman.GetSheHe]最近巩固了对[GetTitleByKey('k_galicia-volhynia').GetNameNoTier]的统治，[roman.GetFirstName]还向我们示好，也愿意与我结盟，如果我们想保卫北方边境的话，[roman.GetSheHe|U]可能是一个不错的盟友。\n\n虽然[roman.GetFirstNameNoTooltip]并没有要求，但[roman.GetHerHim]与一位拜占庭贵族联姻可以加强联盟，[noble.GetFullName]一直被是很好的人选。"
 galicia2.0034.desc.princess:0 "我也考虑结婚，内阁成员说[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('princess'))][princess.GetFirstName]可能是很好的人选。"
 galicia2.0034.a:0 "向[princess.GetFullNamePossessive]提出婚约。"
 galicia2.0034.b:0 "向[noble.GetFullNamePossessive]提出婚约。"
 galicia2.0034.c:0 "不一定要通过婚姻来巩固联盟。"
 galicia2.0034.tooltip:0 "[roman.GetFirstNameNoTooltip]可能会拒绝联姻（前提是[roman.GetSheHe]已婚且不愿意[divorce|E]），但[alliance|E]仍缔结。"
 galicia2.0035.t:0 "[roman.GetTitledFirstNameNoTooltip]：新盟友？"
 galicia2.0035.desc:0 "我获悉[roman.GetFullName]已接受与[wife.GetDynasty.GetName]宗族的[wife.GetFirstName]联姻提议，这样更好的巩固我们的联盟，双方都有好处，愿[roman.GetFirstNameNoTooltip]帮助我们保卫北部边境！\n\n希望[wife.GetFirstNameNoTooltip]能够通联盟向北方上扩散[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]的影响。"
 galicia2.0035.a:0 "愿[ROOT.Char.GetFaith.HighGodName]保佑联盟长久。"
 galicia2.0036.t:0 "$galicia2.0035.t$"
 galicia2.0036.desc:0 "我获悉[roman.GetFullName]拒绝[wife.GetFirstName]的联姻提议。看来[roman.GetSheHe]认为婚姻对于巩固联盟并不必要。"
 galicia2.0036.desc.wife:0 "我听说[roman.GetFirstNameNoTooltip]对[roman.GetHerHis]目前的婚姻生活很满意……不知是否属实。"
 galicia2.0036.desc.conclusion:0 "\n\n我不确定这是好事还是坏事，但我想我们必须尊重[roman.GetHerHis]的决定，以免侮辱我们的盟友。希望我们仍然能够在这些北方土地上传播[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]的影响力。"
 galicia2.0036.a:0 "$galicia2.0035.a$"
