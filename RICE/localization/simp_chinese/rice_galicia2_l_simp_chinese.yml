 galicia2.0080.t:0 "[county.GetNameNoTierNoTooltip]火葬"
 galicia2.0080.desc:0 "[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]传来消息，[county.GetNameNoTier]周围村庄里，[ROOT.Char.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip]仍然实行古老的[GetReligionByKey('slavic_religion').GetName]火葬习俗。\n\n[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]坚持认为必须杜绝这种现象，要用适当的[ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]葬礼仪式，哪怕火葬习俗已经逐渐减少，但[chaplain.GetSheHe]认为它消亡得不够快。"
 galicia2.0080.a:0 "“这种异教习俗必须禁止。”"
 galicia2.0080.b:0 "“强迫农民改变习惯并不值得的。”"
 galicia2.0080.info:0 "#emphasis 历史背景：#!许多基督教派直到近代都对火葬有负面看法，认为火葬是对上帝造人的不尊重，不过许多斯拉夫民族在基督教化之后仍然实行火葬，有时火葬与基督教葬礼一起实行。例如，在[GetTitleByKey('d_mazovia').GetAdjectiveNoTooltip]和罗斯的边境，东西斯拉夫人混居地的考古证据表明，火葬和土葬在13世纪都很盛行，此后越来越多的土葬证据被推测与来自其他地方的基督教人口移民有关。"
 galicia2.0081.t:0 "[GetGeographicalRegion('RICE_galicia_volhynia_region').GetNameNoTooltip]建筑学"
 galicia2.0081.desc:0 "[GetGeographicalRegion('RICE_galicia_volhynia_region').GetName]地理导致建筑风格长期以来一直融合中欧、东欧和拜占庭艺术。\n\n一些官员最近与[county.GetNameNoTier]的[culture.GetName]工匠取得了联系，他们善于建造这种混合艺术风格的纪念碑和建筑。如果我给他们丰厚的报酬，他们可以在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]定居并从事各种项目。\n\n毫无疑问，他们将为[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的建筑做出了巨大贡献！"
 galicia2.0081.a:0 "“欢迎他们前来[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]！”"
 galicia2.0081.b:0 "“我不需要他们的能力。”"
 galicia2.0081.info:0 "#emphasis 历史背景：#!大约从12和13世纪开始，[GetGeographicalRegion('RICE_galicia_volhynia_region').GetName]出现了一种独特的建筑形式，它融合了古老的罗斯建筑风格和在欧洲大部分地区占主导地位的罗马建筑风格。据推测，来自波兰、匈牙利和捷克的建筑师和工匠得到了当地权贵的赞助，并在这一融合中发挥了重要作用。例如，这种传统的一些最早的已知建筑是[GetTitleByKey('c_halych').GetNameNoTier]中的救世主四柱教堂（建于1140年代后半期）和圣母升天大教堂（大约在1140至1150年代之交），其功劳可能归功于波兰工匠。"
 galicia2.0082.t:0 "胭脂虫红商人"
 galicia2.0082.desc:0 "虽然[Glossary( '胭脂虫', 'COCHINEAL_GLOSS' )]是领地利润最高的出口产品之一，但它有一个问题——只能在夏季的一段很短的时间内收获胭脂虫的幼虫。因此胭脂虫的数量从来都不是很多，这导致它的价格很高。\n\n显然今天来访的外国使节却不理解这一点，在谈话转到了胭脂虫的话题上，这位使节虽然没有把责任归咎于胭脂虫养户，但还是嘲笑那些胭脂虫的商人，说他们是一群狡猾的人，因为很难得到好的胭脂虫，必须给他们特殊待遇才行。"
 galicia2.0082.a:0 "我应该向使节解释一下胭脂虫红贸易是如何运作的。"
 galicia2.0082.b:0 "这位使者说得没错，商人确实是一群卑鄙的人。"
 galicia2.0083.t:0 "旅行者对我们祖先的描述"
 galicia2.0083.desc:0 "今天，我从一位博览群书的学者那里听到了一个有趣而又好笑的故事，据说其偶然发现了一位很久以前的外国旅行者文章，这位旅行者曾路过我们[ROOT.Char.GetCulture.GetCollectiveNoun]祖先居住的土地。\n\n这位旅行者显然这样评价我们的祖先——“他们身体健壮，个高，有着金黄色的头发和润红色的皮肤，身上布满了树和其他图案的刺青。”\n\n另一方面，这位旅行者也相当偏执，认为我们的祖先是他见过的“最肮脏”的人，喜欢滥交、不清洁自己，所以他们“就像野驴一样”。"
 galicia2.0083.a:0 "我确信好和坏都有一定道理。"
 galicia2.0083.b:0 "“关于我们的祖先的故事真是可笑，明显是编造出来的！”"
 galicia2.0083.c:0 "“呸！这个旅行者是个自鸣得意、充满偏见的白痴！”"
 galicia2.0083.info:0 "#emphasis 历史背景：#!伊本·法德兰是10世纪探险家，他作为阿拔斯帝国派往伏尔加保加利亚国王的使团成员，游历了东欧部分地区。此事件中的引述来自他对罗斯人的描述。在部分描述中，他详细描述亲眼目睹的罗斯酋长葬礼，包括火葬以及让酋长女奴陪葬。据说，在葬礼期间，伊本·法德兰的罗斯翻译笑着告诉他“你们阿拉伯人是傻瓜”，因为“你们把你们最亲爱、最尊敬的人埋到地里，让昆虫和蠕虫吞食他们，我们会立刻把他烧死，这样他就可以立刻进入天堂。”"
 galicia2.0084.t:0 "猪草汤"
 galicia2.0084.desc:0 "在[ROOT.Char.GetCurrentLocation.GetName]旅行时，我们前往[culture.GetName]农民的家中借宿一晚。虽然这不是舒适的睡眠场所，但总比在外面睡觉要好，而且主人也相当热情好客。\n\n次日晚上，我们喝了#italic 猪草汤#!，它是用猪草汤的茎、叶和花腌制而成的。这可能是一种普通的农民食物，但它味道相当鲜美，又酸又辣！"
 galicia2.0084.a:0 "“感谢您的热情款待和美味的汤。”"
 galicia2.0084.b:0 "该死……我真怀念美味的食物……"
 galicia2.0084.info:0 "#emphasis 历史背景：#!#italic 罗宋汤#!是乌克兰、波兰和俄罗斯等多个斯拉夫国家美食中的一道菜，它是一种用红甜菜制成的汤。它的历史前身是用#italic 猪草#!制成的酸汤。人们将猪草各个部分切碎，然后腌制，最后用发酵产物来做汤。"
