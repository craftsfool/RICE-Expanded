 galicia2.0020.t:0 "胭脂虫红"
 galicia2.0020.desc:0 "我有部分领土位于[GetGeographicalRegion('RICE_european_cochineal_region').GetName]，恰好那里盛产的[Glossary( '胭脂虫染料', 'COCHINEAL_GLOSS' )]在海外市场售价极其高昂。\n\n我这种智者定然不会忽视胭脂虫产业，我正打算投资扶持胭脂虫养殖园，鼓励商人收购并转售它们，这样既能促进当地经济发展，也能从中贸易收获颇丰。"
 galicia2.0020.a:0 "这种红色染料将给我们丰厚利润。"
 galicia2.portage.decision.intro:0 "我的领地位于[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]，若不投入资源充分开发此地，实属不智。\n\n"
 galicia2.0021.t:0 "引路岩"
 galicia2.0021.desc:0 "$galicia2.portage.decision.intro$其中引路岩是交通要道的重要组成部分——这些精雕细琢的石头可以给旅人传递地理信息与指引方向，标定疆界，昭示当地统治者的权威。\n\n因此我已下令划拨资源维护境内现存引路岩，并在必要处增刻。无论是商人、朝圣者、冒险者，还是士兵，每位行经此地之人都应明晰所处方位与前路所向。"
 galicia2.0021.a:0 "“知晓前方是件好事！”"
 galicia2.0022.t:0 "引路十字架"
 galicia2.0022.desc:0 "$galicia2.portage.decision.intro$其中引路十字架是交通要道的重要组成部分——这些精雕细琢的十字架可以给旅人传递地理信息与指引方向，标定疆界，昭示当地统治者的权威。\n\n因此我已下令划拨资源维护境内现存引路十字架，并在必要处增刻。无论是商人、朝圣者、冒险者，还是士兵，每位行经此地之人都应明晰所处方位与前路所向。"
 galicia2.0022.a:0 "$galicia2.0021.a$"
 galicia2.0023.t:0 "征召船工"
 galicia2.0023.desc:0 "$galicia2.portage.decision.intro$此地自古，任何[ROOT.Char.GetTitleAsNameNoTooltip]都有征召农户建造船只供领主使用的例子。这些船只在穿越这些土地上纵横交错的河陆都尤为有用。\n\n我们需要这些船旅行、贸易或军事，而农民有责任和义务为我服务，我只能希望我要求的船质量不错。"
 galicia2.0023.a:0 "“我们可以启航，远航，破浪前行！”"
 galicia2.0024.t:0 "维护运输基建"
 galicia2.0024.desc:0 "$galicia2.portage.decision.intro$这里许多路线都依赖于人力或借助驮畜将船只运送到陆地上，以便人们可以在该地区遍布的无数河流和湖泊之间旅行。\n\n而某些地点往往是更受欢迎的搬运地点，如果我们可以派人去修复或新建轨道，清除周围障碍物，并提供其他便利设施来供船只休息或供旅行者露营的地方，这将获益匪浅。"
 galicia2.0024.a:0 "“这肯定让搬运工更轻松。”"
 galicia2.0025.t:0 "贸易品"
 galicia2.0025.desc:0 "$galicia2.portage.decision.intro$该地区流经各种贸易商品，其中一些来自鲜为人知的遥远异国他乡。这些商品既有精英阶层渴望的奢侈品，也有日常用品。\n\n我打算支持这些商品贸易，让商人做生意更加容易，从而让领地更加繁荣。"
 galicia2.0025.a:0 "“贸易必须流通！”"
 galicia2.0026.t:0 "加固河堡"
 galicia2.0026.desc:0 "$galicia2.portage.decision.intro$这里各处哨站和堡垒占据着贸易路线上的战略要地，特别是船只经常在陆地上运输的搬运点。\n\n我打算下令对我领土内现有堡垒进行必要的加固和修复，并在合理的地点建造新的堡垒。"
 galicia2.0026.a:0 "这些路线对于守法的旅行者来说是安全的！"
 galicia2.0027.t:0 "鼓励定居"
 galicia2.0027.desc:0 "$galicia2.portage.decision.intro$在这些贸易路线上的战略要地散布各种定居点，他们承担驿站责任，方便陆地上运载船只的地方，此外这些地方往往是不同部落和民族、文化和宗教的交汇地。\n\n我已指示官员从领地内其他地方重新安置一些人，沿着这些路线建立新的定居点，或加入现有定居点。这将促进这些地方的发展，并刺激当地经济。"
 galicia2.0027.a:0 "“我们希望这些定居点能够繁荣昌盛。”"
