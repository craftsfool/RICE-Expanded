 galicia2.0010.t:0 "伏尔加河和第聂伯河地区的贸易"
 galicia2.0010.desc:0 "对于一些旅行者来说，穿越[GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]是件难事，但五湖四海的商人经常穿越这里河流、森林、山丘和沼泽，寻找利润和冒险。\n\n恰好我最近结识这样的商人[RICE_volga_dnieper_merchant_spawn.GetFirstName]，[RICE_volga_dnieper_merchant_spawn.GetSheHe|U]出身于[culture.GetName]并信奉[faith.GetAdjective]，常年在这个地区的贸易路线上旅行，还特别擅长[GetPlayer.Custom('RICE_volga_dnieper_good_type_loc')]的贸易。\n\n与[RICE_volga_dnieper_merchant_spawn.GetFirstNameNoTooltip]结交显然对我有利，还能促进领地贸易，也许我该邀请[RICE_volga_dnieper_merchant_spawn.GetHerHim]加入我的宫廷。"
 galicia2.0010.a:0 "“[RICE_volga_dnieper_merchant_spawn.GetFirstNameNoTooltip]愿为我效劳吗？”"
 galicia2.0010.b:0 "“做笔生意吧，[RICE_volga_dnieper_merchant_spawn.GetFirstNameNoTooltip]！”"
 galicia2.0010.c:0 "“我没有兴趣和这种行商合作。”"
