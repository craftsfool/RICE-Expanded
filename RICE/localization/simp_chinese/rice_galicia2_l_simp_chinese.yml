 galicia2.0050.t:0 "着手准备"
 galicia2.0050.desc:0 "夏至将至，这意味着又到了庆祝库帕拉之夜的时候！自古以来，我们一直是这样过。\n\n我准备去附近的村庄参加庆典。"
 galicia2.0050.desc.non_pagan:0 "一些狂热的[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]不赞成这种习俗，还说参加庆典的人是被[ROOT.Char.GetFaith.DevilName]蛊惑，崇拜黑暗，但很多人都无视他们的胡言乱语。"
 galicia2.0050.a:0 "夏至马上就要到了！"
 galicia2.0051.t:0 "洗礼"
 galicia2.0051.desc:0 "今天是库帕拉之夜！\n\n净化一直是这个庆典重要组成部分，通过火和水进行净化。不过篝火要等到晚些时候才会燃起，因此我们用水来净化自己。\n\n参加庆典的人们前往在村子周围的河流、湖泊、泉水和任何水源处，还有些村民去寻找草药和植物，作为庆典一部分，而我则花时间泡在水里，疗养和净化自己。"
 galicia2.0051.a:0 "“我身心感到进化了。”"
 galicia2.0052.t:0 "篝火"
 galicia2.0052.desc:0 "夜幕时分，库帕拉之夜的篝火是壮丽的场景，年轻的未婚男女用木头、旧衣服、破烂物品以及当天早些时候采摘的鲜花和草药编成的花环堆成的一个稻草人，然后扔进火中，作为净化的一部分。\n\n然后戴着花环的男女围着篝火跳舞，按照仪式唱着歌曲，虽然有些比较淫秽，然后还有一些在场的年轻夫妇则试图跳过篝火，据说成功跳过篝火的人会拥有好运和财富。"
 galicia2.0052.desc.lover:0 "[jumper.GetFirstName]意味深长地看了我一眼，也许我们可以一起试着跳过篝火？"
 galicia2.0052.a:0 "“真有节日气氛。”"
 galicia2.0052.b:0 "“[jumper.GetFirstNameNoTooltip]，让我们跳过篝火吧！”"
 galicia2.0053.t:0 "寻找蕨花？"
 galicia2.0053.desc:0 "夜幕降临，一些人走进荒野寻找珍贵的药草和植物，据说少数幸运儿能找到最著名和最难得的宝藏——[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]\n\n蕨类通常不会开花，但传说库帕拉之夜会绽放，任何人只要找到这种花，并躲开花灵，就能获得神奇的力量。"
 galicia2.0053.a:0 "“我更喜欢在这里享受陪伴。”"
 galicia2.0053.b:0 "“寻找蕨花听起来很有趣！”"
 galicia2.0053.b.tooltip:0 "你前往搜索并有小概率找到的传奇[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]。"
 galicia2.0054.t:0 "结束"
 galicia2.0054.desc:0 "许多个小时过去了，库帕拉之夜上火堆们终于准备熄灭，我和其他所有人依照习俗，都轮流跳过阴燃着的火堆以求好运。\n\n这的确是种有趣的体验，考虑到我们必须完成的那么多重要仪式，显然也是一种圣洁体验，现在，夏天终于真正来临了。"
 galicia2.0054.a:0 "显然夏日已至！"
 galicia2.0055.t:0 "采集植物"
 galicia2.0055.desc:0 "在库帕拉之夜期间，采集各类草药、鲜花和植物乃是一种重要习俗。今年，我也被说服参加这一活动。\n\n据说现在是采集这些植物的理想季节，或者我后面甚至能找到一株[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]来获得强大的力量？"
 galicia2.0055.a:0 "我会放轻松，享受这一活动。"
 galicia2.0055.b:0 "我必须专注于这个重要的任务！"
 galicia2.0055.b.tooltip:0 "如果你决定搜寻[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]，则略微#P 提升#!找到的概率。"
 galicia2.0056.t:0 "蕨花"
 galicia2.0056.desc:0 "简直不敢相信！但眼前此物绝非虚假！\n\n是了！这一定是[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]。不错，花朵是鲜红色的，正如传说中的一样……\n\n在花灵发现我之前，我必须采摘它，然后带在身上。"
 galicia2.0056.a:0 "好！好！赞美[ROOT.Char.GetFaith.HighGodName]让我找到了这东西！"
 galicia2.0057.t:0 "恋爱邂逅？"
 galicia2.0057.desc:0 "“能在这里遇到你真巧，[ROOT.Char.Custom('RomanticComplimentAdjective')][ROOT.Char.Custom('RomanticComplimentNoun')]大人……”\n\n我转过头，看见了[lover.GetFirstName]，[lover.GetHerHis]的脸上带着一丝笑容。\n\n我本应该像所有人一样，在库帕拉之夜搜寻[Glossary( '蕨花', 'FERN_FLOWER_GLOSS' )]或其他植物，草药，但所有人都在荒野中搜索时，人们会碰到彼此，会有人，尤其是年轻的情侣，在“搜索”时冒险幽会。"
 galicia2.0057.a:0 "在这里遇见实在是太巧了。让我们来好好“协助”一下彼此..."
 galicia2.0057.a.tooltip:0 "#weak 你们在大自然之中一起找了点乐子。#!"
 galicia2.0057.b:0 "你在这儿真是太好了，你能帮我找点植物吗？"
