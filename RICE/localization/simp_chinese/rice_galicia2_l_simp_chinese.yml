 RICE_rus_culture_decision:0 "建立$russian$文化"
 RICE_rus_culture_decision_tooltip:1 "一个新民族正在东欧兴起！"
 RICE_rus_culture_decision_desc:0 "许多[cultures|E]慢慢地在东欧大河间内相互融合和影响，也许如果这些争执不休的部族联合起来，他们就能控制贸易路线，成为一支不容小觑的力量……"
 RICE_rus_culture_decision_effect_tooltip_1:1 "[rus_culture.GetName][culture|E]的[heritage|E]将转为你的[capital|E][culture|E]——[capital_culture.GetName]，当前为[capital_culture.GetHeritage.GetName]。"
 RICE_rus_culture_decision_effect_tooltip_2:1 "你需决定[rus_culture.GetCollectiveNoun]的官方[language|E]是维持现行的[rus_culture.GetLanguage.GetName]通用语，还是采用你的[language|E]，亦或采用[capital|E][culture|E]的[language|E]（若三者存在差异）"
 RICE_rus_culture_decision_effect_tooltip_3:1 "[rus_culture.GetName][culture|E]将获得一到两个随机[traditions|E]"
 RICE_rus_culture_decision_effect_tooltip_4:1 "你的几个[counties|E]将随机转为[rus_culture.GetName][culture|E]"
 RICE_rus_culture_decision_effect_tooltip_5:1 "罗斯[region|E]中的[rulers|E]和[counties|E]（特别是你的[vassals|E]以及沿主要河流和城市的[vassals|E]），可能会转变为[rus_culture.GetName][culture|E]"
 RICE_rus_culture_decision_confirm:0 "$russian_collective_noun$将统治这片土地！"
 RICE_rus_culture_decision_context_tooltip:0 "#emphasis 历史背景：#!罗斯人起源仍有争议，但人们相信，在斯堪的纳维亚的影响下，早期的罗斯人在历史上不仅统治过斯拉夫民族，还统治过芬兰和波罗的海等其他民族，这些人最终在留里克王朝的统治下融合成为东斯拉夫人。罗斯人最终成为现代俄罗斯人、乌克兰人和白俄罗斯人的祖先。"
 select_personal_deity_slavic_decision:0 "为斯拉夫神祇供奉神像"
 select_personal_deity_slavic_decision_tooltip:0 "考虑[ROOT.Char.GetFaith.PantheonTerm]"
 select_personal_deity_slavic_decision_desc:1 "#F 作为一位斯拉夫统治者，我有责任尊奉人民的众神，以确保并展示我们的繁荣。我应当选择一位与我心意相通的神明，并为我的子民竖立一座神像以供瞻仰。#!"
 select_personal_deity_slavic_decision_confirm:0 "供奉一座神像给特定的神明"
 select_personal_deity_slavic_decision_tt:1 "你竖立了一座神像并进行敬奉。"
