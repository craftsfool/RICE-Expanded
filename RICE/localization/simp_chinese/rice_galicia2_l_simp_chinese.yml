 galicia2.0012.t:0 "敬奉一位神祇"
 galicia2.0012.desc:0 "作为一位斯拉夫统治者，我的职责是尊奉人民的众神，获取他们的祝福，并向我们的人民和其他人展示我们的繁荣。通过选择一位特定的神明来供奉神像，我无疑将获得神圣庇佑，同时向人民彰显我作为统治者所秉持的价值观和优先事项。"
 galicia2.0012.perun:0 "佩伦，雷霆之神"
 galicia2.0012.perun.tt:0 "佩伦是风暴、雷霆和金属武器的掌控者，是众神之首。\n\n崇敬佩伦是一位高贵而威严的统治者的自然选择。\n"
 galicia2.0012.veles:0 "韦列斯，冥界的统治者。"
 galicia2.0012.veles.tt:0 "韦列斯是佩伦的对应神，统治着水下冥界，掌管牧群、诗歌和巫术。\n\n尊崇韦列斯肯定会让所有反对我的人感到恐惧。\n"
 galicia2.0012.stribog:0 "斯特利博格，不息之风"
 galicia2.0012.stribog.tt:0 "斯特利伯格，风之父，象征着春天的降临和财富的传播。\n\n尊崇斯特利伯格将为我们的商人、农民和使者带来好运。\n"
 galicia2.0012.khors_dazhbog:0 "霍尔斯·达日伯格，日月之神"
 galicia2.0012.khors_dazhbog.tt:0 "霍尔斯与达日伯格分别象征太阳和月亮，掌管着财富与良知。\n\n尊崇霍尔斯和达日伯格将向人民展示我对繁荣和正义的承诺。\n"
 galicia2.0012.mokosh:0 "莫科什，母神"
 galicia2.0012.mokosh.tt:0 "母神莫科什，是女性的保护者，掌管绵羊、编织和分娩。\n\n尊崇莫科什将确保谷物丰收和社区繁荣。\n"
 galicia2.0012.simargl:0 "斯玛格尔，生翼之犬"
 galicia2.0012.simargl.tt:0 "生翼之犬斯玛格尔是种子、新芽和人类的保护者，也是天与地的中介。\n\n尊崇斯玛格尔将保护收成并使人民免受邪恶势力的侵害。\n"
 galicia2.0012.optout:0 "现在不是时候。"
 galicia2.0012.flavor:0 "$religious_decision.0101.flavor$"
