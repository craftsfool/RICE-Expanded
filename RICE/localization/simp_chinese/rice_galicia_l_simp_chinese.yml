 RICE_galicia_alter_saint_james_tomb:0 "改造圣地亚哥的神祠"
 RICE_galicia_alter_saint_james_tomb_tooltip:0 "我们必须满足日益增多的朝圣者需求。"
 RICE_galicia_alter_saint_james_tomb_desc:0 "目前的圣地亚哥神祠由于面积小、设计粗糙，根本无法容纳每天前来朝圣的人群。教会主教们对朝圣者感到同情并建议我们应该翻修甚至摧毁圣雅各的坟墓，如果需要的话可以重建一个新的坟墓。他们说我们可以不理会当地人和低级别的神职人员的抗议，因为他们迷信且害怕对祭坛进行任何改动。"
 RICE_galicia_alter_saint_james_tomb_effect_tooltip_1:0 "为所有[GetGeographicalRegion('world_europe_west_iberia').GetName]中符合要求的[THIS.Char.GetFaith.GetReligion.GetAdjective][rulers|E]解锁$RICE_galicia_pray_to_santiago$[decision|E]"
 RICE_galicia_alter_saint_james_tomb_effect_tooltip_2:0 "$RICE_galicia_saint_james_routes_decision$和$RICE_galicia_saint_james_levy_extra_tolls$的[decisions|E]将给予更好的奖励并且冷却时间更短。"
 RICE_galicia_alter_saint_james_tomb_effect_tooltip_3:0 "许多当地人和少数的神职人员对拟议的改建感到不满，但他们肯定会接受的。"
 RICE_galicia_alter_saint_james_tomb_confirm:0 "通往圣地亚哥的神殿将更加美好！"
 RICE_galicia_alter_saint_james_tomb_context_tooltip:0 "#emphasis 历史背景：#!圣地亚哥作为一座圣城，在12世纪因为它的首任大主教迭戈·赫尔米雷斯（约1069年‑1140年）而声名远扬。他不仅集中了教会的权力，还大力推广了朝圣之路，更有甚者，他毁掉了旧的圣殿——据说是圣雅各伯的门徒所建——并用一座更为宏伟的建筑取而代之，以迎合外来朝圣者的需求和欲望，却忽视了当地人的喜好和传统。"
 RICE_galicia_unearth_saint_james_tomb:0 "挖掘圣雅各伯的坟墓"
 RICE_galicia_unearth_saint_james_tomb_tooltip:0 "有传言说圣雅各伯被埋在这里......但这是真的吗？"
 RICE_galicia_unearth_saint_james_tomb_desc:0 "根据[GetGeographicalRegion('world_europe_west_iberia').GetName]的当地民间传说，使徒圣雅各在许多世纪前曾前往那里传播福音。有传言说在他殉教后，他被埋葬在伊比利亚半岛的西北部......即在我统治的领土上。如果传说是真的话，我不去寻找他的坟墓就是失职。"
 RICE_galicia_unearth_saint_james_tomb_effect_tooltip_1:0 "为所有[GetGeographicalRegion('RICE_galicia_region').GetName]中符合要求的[THIS.Char.GetFaith.GetReligion.GetAdjective][rulers|E]解锁$RICE_galicia_pray_to_santiago$[decision|E]"
 RICE_galicia_unearth_saint_james_tomb_effect_tooltip_2:0 "对[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]中的所有[rulers|E]解锁$RICE_galicia_saint_james_routes_decision$和$RICE_galicia_saint_james_levy_extra_tolls$[decisions|E]"
 RICE_galicia_unearth_saint_james_tomb_confirm:0 "我们应该调查这些传说是否属实。"
 RICE_galicia_unearth_saint_james_tomb_context_tooltip:0 "#emphasis 历史背景：#!在公元820年代或830年代，一位名叫佩拉约的隐居者或修道士在圣地亚哥发现了一处传说中的圣雅各伯之墓。他曾在山上见证了奇迹般的灵光，便将此事报告给了当地的主教西奥多米尔。经过进一步的调查，这里被认为是圣雅各伯的埋葬之所。于是，阿斯图里亚斯的国王阿方索二世在此修建了一座小教堂，并开辟了后世闻名的圣地亚哥朝圣之路。"
 RICE_galicia_unearth_saint_james_tomb_date_req:0 "日期是公元500年以后"
 RICE_galicia_pray_to_santiago:0 "为圣地亚哥的代祷祷告"
 RICE_galicia_pray_to_santiago_tooltip:0 "愿圣雅各伯在这动荡的时代指引我们。"
 RICE_galicia_pray_to_santiago_desc:0 "愿耶稣基督的使徒、[GetGeographicalRegion('world_europe_west_iberia').GetName]捍卫者圣雅各伯在这动荡的时代指引我们。我应该祈求他的代祷，以便我的土地、我的家庭和在[GetGeographicalRegion('world_europe_west_iberia').GetName]的[ROOT.Char.GetFaith.GetReligion.GetAdjective]社区能够承受任何威胁并茁壮成长。"
 RICE_galicia_pray_to_santiago_effect_tooltip_1:0 "你#italic 可能#!获得一个[santiago_modifier|E]，其效果取决于[iberian_struggle|E]的[struggle_phase|E]阶段或采取[decision|E]而结束斗争。"
 RICE_galicia_pray_to_santiago_confirm:0 "愿主和圣雅各帮助我们！"
 RICE_galicia_pray_to_santiago_context_tooltip:0 "#emphasis 历史背景：#!作为中世纪伊比利亚基督教的重要圣徒，圣雅各伯（或圣地亚哥）根据当时政治和文化象征着不同的东西。例如他早期作为圣者圣雅各而闻名，在中世纪晚期他的形象越来越多地被作为战士或摩尔人克星而取代。在新航路开启后，他最初是征服美洲时的“印第安人克星”，但后来成为19世纪拉丁美洲反抗西班牙统治的革命者的“西班牙人克星”。"
 RICE_galicia_promote_cantiga:0 "传阅你的加利西亚抒情诗"
 RICE_galicia_promote_cantiga_tooltip:0 "为什么别人不应该听到你的[cantiga|E]？"
 RICE_galicia_promote_cantiga_desc.courtly_love:0 "许多人看过我最近创作的#italic 加利西亚抒情诗#!都说它的[cantiga_quality|E]令人拍案叫绝。我应该广泛宣传我的[cantiga|E]，鼓励别人抄写并传阅它。"
 RICE_galicia_promote_cantiga_desc.romantic_love:0 "许多人看过我最近创作的#italic 加利西亚抒情诗#!都说它的[cantiga_quality|E]令人拍案叫绝。我应该广泛宣传我的[cantiga|E]，鼓励别人抄写并传阅它。"
 RICE_galicia_promote_cantiga_desc.satire:0 "许多人看过我最近创作的#italic 加利西亚抒情诗#!都说它的[cantiga_quality|E]令人拍案叫绝。我应该广泛宣传我的[cantiga|E]，鼓励别人抄写并传阅它。"
 RICE_galicia_promote_cantiga_effect_tooltip_1:0 "你将获得一个永久的[cantiga|E][artifact|E]来取代原有的[character_modifier|E]"
 RICE_galicia_promote_cantiga_effect_tooltip_2:0 "这个[artifact|E]将拥有与[character_modifier|E]相同的奖励，并根据[cantiga|E]的体裁和主题获得进一步的奖励。"
 RICE_galicia_promote_cantiga_effect_tooltip_3:0 "你将获得一些[piety|E]和[prestige|E]，这取决于[cantiga|E]的体裁。"
 RICE_galicia_promote_cantiga_effect_tooltip_4:0 "根据[cantiga|E]流派，你将获得一些[piety|E]和[prestige|E]（与正常相比更多，因为[THIS.Char.GetCulture.GetName][culture|E]具有$tradition_RICE_galician_portuguese_poetry_name$[tradition|E]）。"
 RICE_galicia_promote_cantiga_confirm:0 "让我们开始吧！"
 RICE_galicia_promote_cantiga_context_tooltip:0 "#emphasis 历史背景：#!$RICE_galicia_cantiga_decision_context_tooltip$"
 RICE_galicia_recently_composed_excellent_cantiga_req:0 "你最近创作了一首#V 拍案叫绝#![cantiga_quality|E]的[cantiga|E]"
 RICE_galicia_not_recently_composed_excellent_cantiga_req:0 "你最近没有创作过[cantiga|E]"
 RICE_galicia_compile_CSM_decision:0 "编纂《圣母玛利亚颂歌集》"
 RICE_galicia_compile_CSM_decision_tooltip:0 "赞美圣母玛利亚，上帝之母！"
 RICE_galicia_compile_CSM_decision_desc:0 "我已经创作了[ROOT.Char.MakeScope.Var('RICE_num_of_cantigas_written').GetValue]引人注目的[cantigas|E]，但我渴望的不仅仅是为琐碎的世俗事务创作歌曲。作为一个[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我应该召集我国度的诗人，编纂一部关于圣母玛利亚的抒情诗大集，称为#V 圣母玛利亚颂歌集#!"
 RICE_galicia_compile_CSM_decision_effect_tooltip_1:0 "#italic 《圣母玛利亚颂歌集》#!大约需要五年或更长时间才能完成。"
 RICE_galicia_compile_CSM_decision_effect_tooltip_2:0 "一旦完成，你将获得一件[artifact|E]，它可以提高[prestige|E]、[piety|E]、[grandeur|E]、[learning_skill|E]和[lifestyle_experience|E]。"
 RICE_galicia_compile_CSM_decision_confirm:0 "让我们开始吧！"
 RICE_galicia_compile_CSM_decision_context_tooltip:0 "#emphasis 历史背景：#!加利西亚抒情诗（cantiga）最著名的是与#italic 《圣母玛利亚颂歌集》（Cantigas de Santa Maria）#!有关，这是一部13世纪的歌曲集，歌颂了圣母玛利亚和她的奇迹，传统上被认为是卡斯蒂利亚国王阿方索十世的作品。虽然他可能写了其中的一些歌曲，但他主要负责指导这个项目。如今，这些歌曲经常被早期音乐团体演奏。"
 RICE_CSM_3_cantigas_written_req:0 "你之前至少创作过#V 三首#![cantigas|E]"
 RICE_no_one_working_on_CSM_req:0 "没有人采取 $RICE_galicia_compile_CSM_decision$[decision|E]"
 RICE_galicia_expand_CSM_decision:0 "扩充圣母玛利亚颂歌集"
 RICE_galicia_expand_CSM_decision_tooltip:0 "$RICE_galicia_compile_CSM_decision_tooltip$"
 RICE_galicia_expand_CSM_decision_desc:0 "我为我在编撰#italic 《圣母玛利亚颂歌集》#!方面所取得的成就感到自豪！但是总是有改进的余地！我和国内一些诗人相信，我们可以收集和创作一些额外的诗歌加入到这个集合中。"
 RICE_galicia_expand_CSM_decision_effect_tooltip_1:0 "扩充#italic 《圣母玛利亚颂歌集》#!大约需要三年或更长时间才能完成。"
 RICE_galicia_expand_CSM_decision_effect_tooltip_2:0 "一旦完成，你将获得一个[artifact|E]，每一个都比之前的#italic 《圣母玛利亚颂歌集》#!版本更好"
 RICE_galicia_expand_CSM_decision_effect_tooltip_3:0 "你只能将圣母玛利亚颂歌集扩充三次"
 RICE_galicia_expand_CSM_decision_effect_tooltip_4:0 "你只能将#italic 《圣母玛利亚颂歌集》#!扩充#V 3次#!，而你之前总共做了#V [THIS.Char.MakeScope.Var('RICE_num_of_CSM_expansions').GetValue]#!次。"
 RICE_galicia_expand_CSM_decision_confirm:0 "为了圣母玛利亚！"
 RICE_galicia_expand_CSM_decision_context_tooltip:0 "$RICE_galicia_compile_CSM_decision_context_tooltip$"
 RICE_CSM_compiler_req:0 "你完成了#italic 《圣母玛利亚颂歌集》#!最初版的编纂工作"
 RICE_galicia_fortify_galician_coast:0 "加强加利西亚沿海地区的防御"
 RICE_galicia_fortify_galician_coast_tooltip:0 "该地区很容易受到来自海上的攻击——我们必须保护它！"
 RICE_galicia_fortify_galician_coast_nonchristian_desc:0 "我担心我在[GetGeographicalRegion('RICE_galicia_region').GetName]的领土容易受到来自海上的袭扰。我应该建造各种塔楼和前哨来保护该地区并重建或翻新现有的防御结构。"
 RICE_galicia_fortify_galician_coast_christian_desc:0 "我担心我在[GetGeographicalRegion('RICE_galicia_region').GetName]的领土容易受到来自海上的袭扰。我应该建造各种塔楼和前哨来保护该地区并重建或翻新现有的防御结构，这样我们可以保护圣地亚哥的圣地和众多的朝圣者。"
 RICE_galicia_fortify_galician_coast_effect_tooltip_1:0 "该[decision|E]的[gold|E]和[prestige|E]花费取决于你在[GetGeographicalRegion('RICE_galicia_region').GetName]中拥有多少个沿海[counties|E]。"
 RICE_galicia_fortify_galician_coast_confirm:0 "安全总比后悔好！"
 RICE_galicia_fortify_galician_coast_context_tooltip:0 "#emphasis 历史背景：#!加利西亚沿海地区拥有许多古老的防御工事。例如，卡托伊拉的奥埃斯特塔最初是由阿斯图里亚斯国王阿方索三世建造的，目的是抵御维京人的袭击，后来又被其他统治者和主教扩建，以保护圣地圣地亚哥。"
 galicia.0001.t:0 "萨克罗峰"
 galicia.0001.desc:0 "人人都知晓萨克罗峰的传说，这座圣山坐落于[GetTitleByKey('c_santiago').GetNameNoTier]附近，相传它能疗愈伤痛，治愈百病。"
 galicia.0001.a:0 "萨克罗峰，治愈我吧！"
 galicia.0002.t:0 "萨克罗峰上的小教堂"
 galicia.0002.desc:0 "[GetTitleByKey('c_santiago').GetNameNoTier]的萨克罗峰世代以来一直受到当地人的崇敬，人们相信向此山祈祷能治愈百病。然而，更为虔诚博学的[GetReligionFamily('rf_abrahamic').GetName]信徒却对这种“迷信”做法的有效性提出了质疑。\n\n为此，[chapel_builder.GetTitledFirstName]与[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]在山上修建了一座小教堂。"
 galicia.0002.a:0 "听起来倒是有趣……"
