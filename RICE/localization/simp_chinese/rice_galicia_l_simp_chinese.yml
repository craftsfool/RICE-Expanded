 RICE_galicia_artifact_cantiga_placeholder_name:0 "加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_placeholder_desc:0 "一首用加利西亚‑葡萄牙语写的加利西亚抒情诗，或歌曲。(你不应该看到这个，因为这是一个占位符。)"
 RICE_galicia_cantigas_de_santa_maria_version_0_name:0 "圣母玛利亚颂歌集（第一版手抄本）"
 RICE_galicia_cantigas_de_santa_maria_version_0_desc:0 "一部充满加利西亚风格‑伊比利亚浪漫主义的变体抒情诗集。采用的是#italic 加利西亚抒情诗#!音乐形式，每首歌曲都与圣母玛利亚一丝联系。该诗集是在[alfonso_x.GetFullName]的指导下完成的，他召集了来自[alfonso_x.GetHerHis]领域的诗人和学者汇聚到一起，一同参与完成这项伟大的计划。"
 RICE_galicia_cantigas_de_santa_maria_version_1_name:0 "圣母玛利亚颂歌集（第二版手抄本）"
 RICE_galicia_cantigas_de_santa_maria_version_1_desc:0 "一部充满加利西亚风格的伊比利亚浪漫主义变体抒情诗集。采用的是#italic 加利西亚抒情诗#!音乐形式，而且每首抒情诗都与圣母玛利亚有千丝万缕的关系。该诗集是在[alfonso_x.GetFullName]的指导下完成的，他召集了来自[alfonso_x.GetHerHis]领域的诗人和学者汇聚到一起参与这项伟大的计划。\n \n 在初版完成后，[alfonso_x.GetFirstName]又赞助了第二部诗集的编辑，又有许多抒情诗被创作、编入、收集到#italic 圣母玛利亚颂歌集#!。"
 RICE_galicia_cantigas_de_santa_maria_version_2_name:0 "圣母玛利亚颂歌集（第三版手抄本）"
 RICE_galicia_cantigas_de_santa_maria_version_2_desc:0 "一部充满加利西亚风格的伊比利亚浪漫主义变体抒情诗集集。采用的是#italic 加利西亚抒情诗#!音乐形式，每首抒情诗都与圣母玛利亚有千丝万缕的关系。该诗集是在[alfonso_x.GetFullName]的指导下完成的，他召集了来自[alfonso_x.GetHerHis]领域的诗人和学者汇聚到一起参与这项伟大的计划。\n \n 在第二版完成后，[alfonso_x.GetFirstName]又赞助第三部诗集的编辑，又有许多抒情诗被创作、编入、收集到#italic 圣母玛利亚颂歌集#!。"
 RICE_galicia_cantigas_de_santa_maria_version_3_name:0 "圣母玛利亚颂歌集（第四版手抄本）"
 RICE_galicia_cantigas_de_santa_maria_version_3_desc:0 "一部充满加利西亚风格的伊比利亚浪漫主义变体抒情诗集集。采用的是#italic 加利西亚抒情诗#!音乐形式，每首抒情诗都与圣母玛利亚有千丝万缕的关系。该诗集是在[alfonso_x.GetFullName]的指导下完成的，他召集了来自[alfonso_x.GetHerHis]领域的诗人和学者汇聚到一起参与这项伟大的计划。\n\n在第三版完成后，[alfonso_x.GetFirstName]马不停蹄的赞助第四部诗集的编辑，又有许多抒情诗被创作、编入、收集到#italic 圣母玛利亚颂歌集#!。"
 RICE_galicia_artifact_cantiga_courtly_love_desc:0 "由[cantiga_composer.GetFullName]创作精美的[cantiga|E]手稿，属于#italic 加利西亚情诗#!流派，这种体裁侧重于宫廷爱情的悲欢离合。\n\n[RICE_cantiga.GetDesc]"
 RICE_galicia_artifact_cantiga_romantic_love_desc:0 "由[cantiga_composer.GetFullName]创作精美的[cantiga|E]手稿，属于#italic 加利西亚情诗#!流派，这种体裁侧重于从女人的角度讲述浪漫爱情。\n\n[RICE_cantiga.GetDesc]"
 RICE_galicia_artifact_cantiga_satire_desc:0 "由[cantiga_composer.GetFullName]创作精美的[cantiga|E]手稿，属于#italic 加利西亚讥讽诗#!流派，这种体裁侧重讽刺社会的方方面面。\n\n[RICE_cantiga.GetDesc]"
 RICE_galicia_artifact_cantiga_music_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于音乐的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_music_desc:0 "这首[cantiga|E]巧妙地包含音乐及表演，描绘了音乐家试图通过技艺和作曲来追求美丽的少女。"
 RICE_galicia_artifact_cantiga_female_dialogue_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于女性对话的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_female_dialogue_desc:0 "这首[cantiga|E]巧妙地整合叙事元素，以女性对话为主要部分，里面含有大量女性朋友之间相互鼓励或相互调侃的场景"
 RICE_galicia_artifact_cantiga_beauty_lady_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于女性之美的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_beauty_lady_desc:0 "这首[cantiga|E]着重描绘了女主角的美貌，诗曲中用了一些隐喻来描述她美丽的面容，以及别人看到她美貌后的反应。，"
 RICE_galicia_artifact_cantiga_joy_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于愉悦的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_joy_desc:0 "这首[cantiga|E]里面探讨了各种形式的幸福和欢乐情感，从爱人久别重逢的欢欣，到刚刚坠入爱河的天真青年的甜美妄想。"
 RICE_galicia_artifact_cantiga_sad_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于悲伤的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_sad_desc:0 "这首[cantiga|E]里面充满了各种悲剧元素，从被爱慕之人拒绝后的抑郁到高贵敌人死亡的苦乐参半情绪。"
 RICE_galicia_artifact_cantiga_war_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于战争的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_war_desc:0 "这首[cantiga|E]里面包涵英勇骑士之间的战斗、与心爱女人分开的焦虑之情还有行军中的日常生活等元素。"
 RICE_galicia_artifact_cantiga_anger_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于探究愤怒的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_anger_desc:0 "这首[cantiga|E]里面探讨了愤怒的各种表现形式，从夫妇之间的争吵，再到嫉妒之怒。"
 RICE_galicia_artifact_cantiga_feudalism_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于封建阶级关系的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_feudalism_desc:0 "这首[cantiga|E]里面探讨了封建阶级的尊卑，比如什么是好的领导者，或者恋爱中的男人如何像个封臣一样，尽其所能取悦所爱之人。"
 RICE_galicia_artifact_cantiga_dying_for_love_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于殉情的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_dying_for_love_desc:0 "这首[cantiga|E]其中融入殉情叙事元素，比如饱受单相思之苦的男人如何解脱，以及一个女人在爱人出海后等待他回家的时间过长而老去。"
 RICE_galicia_artifact_cantiga_holy_land_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于圣地的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_holy_land_desc:0 "这首[cantiga|E]里面描述了与圣地有关的元素，例如一个参加十字军的骑士与爱人告别场景或耶路撒冷的故事 "
 RICE_galicia_artifact_cantiga_sea_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于海的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_sea_desc:0 "这首[cantiga|E]里面描绘女人在海岸边苦苦等待她的爱人回来的场景，并且还有渔民和水手的生活元素，甚至将爱情比喻为大海 "
 RICE_galicia_artifact_cantiga_pastoral_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于田园风光的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_pastoral_desc:0 "这首[cantiga|E]里面以自然之美来隐喻某些情感，里面包涵野生动物、宁静的远方、漂亮的牧羊青年等元素"
 RICE_galicia_artifact_cantiga_trade_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于商人与贸易的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_trade_desc:0 "这首[cantiga|E]融入了与贸易有关的叙事元素，比如背景在繁忙的市场上讲述着繁华的商品以及情侣间讨论流行的奢侈品的场景"
 RICE_galicia_artifact_cantiga_springs_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于自然之泉的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_springs_desc:0 "这首[cantiga|E]探讨了户外之美，尤其着重于温泉，描述这些宁静的地方盛产什么样的动植物，或者人们可能会做什么样的活动，并介绍活动方式。"
 RICE_galicia_artifact_cantiga_urban_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首以城市为背景的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_urban_desc:0 "这首[cantiga|E]融入了与繁华城市元素，比如在街道上男人对女人一见钟情的场景，以及城市人的日常生活描述。"
 RICE_galicia_artifact_cantiga_erotic_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于探讨情欲的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_erotic_desc:0 "这首[cantiga|E]里面着重讨论了性与爱，用浮华的词语来描述某人的美丽体态，并隐约提到性爱。"
 RICE_galicia_artifact_cantiga_cheating_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于不忠的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_cheating_desc:0 "这首[cantiga|E]描述各种形式的不忠元素，从抓奸，再到背叛爱人或违背自己的领地承诺。"
 RICE_galicia_artifact_cantiga_rendezvous_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于幽会的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_rendezvous_desc:0 "这首[cantiga|E]里面描绘了两个恋人试图找到一个合适时间和地点来见面，享受彼此的陪伴的场景。"
 RICE_galicia_artifact_cantiga_jealousy_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于关于探讨嫉妒与毫无安全感的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_jealousy_desc:0 "这首[cantiga|E]描述对情敌在爱慕之人旁的嫉妒之情，或担心爱人离去的不安全感场景。"
 RICE_galicia_artifact_cantiga_court_politics_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于宫廷政治的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_court_politics_desc:0 "这首[cantiga|E]融入各种宫廷政治斗争元素，从介绍宫廷礼仪到描述阴暗的宫廷阴谋。"
 RICE_galicia_artifact_cantiga_pilgrimage_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于朝圣的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_pilgrimage_desc:0 "这首[cantiga|E]包涵各种有关朝圣的话题，比如远行寻找救赎的艰辛、或者在异国他乡偶遇知己或收获爱情的故事。"
 RICE_galicia_artifact_cantiga_piety_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]一首关于探讨虔诚的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_piety_desc:0 "这首[cantiga|E]包涵各种有关宗教的话题，如宫廷爱情的宗教性质、或一个发生在礼拜堂的场景，或探讨各种宗教优劣、或圣地亚哥知名人物。"
 RICE_galicia_artifact_cantiga_loneliness_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]关于孤独的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_loneliness_desc:0 "这首[cantiga|E]以巧妙地探索孤独而闻名，描绘与所爱之人分离时的孤独或独处时反思人生奥秘的感受。"
 RICE_galicia_artifact_cantiga_travel_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]关于旅行的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_travel_desc:0 "这首[cantiga|E]以巧妙地与旅行相结合而闻名，如前往战争、与爱人私奔、或抱怨旅行的艰辛、或描述迷人的异国他乡，这些话题让人沉迷。"
 RICE_galicia_artifact_cantiga_values_name:0 "[cantiga_composer.GetFirstNamePossessiveNoTooltip]关于道德价值观的加利西亚抒情诗"
 RICE_galicia_artifact_cantiga_values_desc:0 "这首[cantiga|E]巧妙地探讨了道德观念而闻名，里面讲述了什么是美德什么是罪恶。"
 RICE_galicia_cantiga_decision:0 "创作加利西亚抒情诗"
 RICE_galicia_cantiga_decision_tooltip:0 "我想谱写一首让人沉迷的加利西亚抒情诗！"
 RICE_galicia_cantiga_decision_desc:0 "我们伊比利亚人有自己独特的抒情方式，用加利西亚‑葡萄牙语吟唱非常流行的[cantiga|E]。我想以我的文学素养水平我应该自己创作一首让大家诵读！"
 RICE_galicia_cantiga_decision_effect_tooltip_1:0 "你会得到[piety|E]、[prestige|E]，可能还有[character_modifier|E]（随机奖励），这取决于你[cantiga|E]的[cantiga_quality|E]，它受你的[skills|E]、[traits|E]和[cantigas|E]创作经验影响。"
 RICE_galicia_cantiga_decision_effect_tooltip_2:0 "如果你的[cantiga|E]的[cantiga_quality|E]令人拍案叫绝，你也可以在你的宫廷中推广它，并获得一个[artifact|E]。"
 RICE_galicia_cantiga_decision_effect_tooltip_3:0 "由于[THIS.Char.GetCulture.GetName][culture|E]有$tradition_RICE_galician_portuguese_poetry_name$[tradition|E]，所以你的[cantiga|E]将有更高几率获得高[cantiga_quality|E]"
 RICE_galicia_cantiga_pick_a_genre_type:0 "选择一种流派的加利西亚抒情诗"
 RICE_galicia_cantiga_pick_a_genre_type_gui:0 "选择即将创作[cantiga|E]的体裁"
 RICE_galicia_cantiga_decision_confirm:0 "是时候开始了！"
 RICE_galicia_cantiga_decision_context_tooltip:0 "#emphasis 历史背景：#!在中世纪后期，一种被称为#italic 加利西亚‑葡萄牙抒情诗#!（因为诗歌主要用加利西亚‑葡萄牙语写成）在伊比利亚的基督教贵族中流行。虽然最初受到奥克西塔尼亚著名的吟游诗人传统的影响，但这种风格有其自己独特的特点。坎蒂加（Cantigas ）是这类诗歌的代表性主要体裁。"
 RICE_cantiga_courtly_love_option:0 "#Bold 加利西亚情诗#!\n#weak 一首关于高尚宫廷爱情的诗歌#!"
 RICE_cantiga_courtly_love_option_desc:0 "高贵之爱"
 RICE_cantiga_courtly_love_option_tooltip:0 "一首以宫廷爱情为主题的歌曲，从男性的角度讲述。在这种体裁中高[cantiga_quality|E]的[cantigas|E]也会比其他体裁获得更多的[piety|E]。"
 RICE_cantiga_romantic_love_option:0 "#Bold 加利西亚情诗#!\n#weak 一首关于激情浪漫的诗歌#!"
 RICE_cantiga_romantic_love_option_desc:0 "歌颂热情的爱，无拘无束的爱"
 RICE_cantiga_romantic_love_option_tooltip:0 "一首以浪漫，稍微轻浮的爱情为主题的诗歌，高[cantiga_quality|E]的[cantigas|E]可以让你获得更多的[prestige|E]"
 RICE_cantiga_satire_option:0 "#Bold 讥讽与挖苦之歌#!\n#weak 一首关于讽刺和挖苦的诗歌#!"
 RICE_cantiga_satire_option_desc:0 "一个尖锐、挖苦的故事"
 RICE_cantiga_satire_option_tooltip:0 "一首专注于讽刺社会方方面面的诗歌，无论是取笑他人、还是寓教于诗。与其他流派相比，这个流派高[cantiga_quality|E]的[cantigas|E]会让你获得相等的[piety|E]和[prestige|E]。"
 RICE_galicia_saint_james_routes_decision:0 "支持圣雅各伯之路"
 RICE_galicia_saint_james_routes_decision_tooltip:0 "圣雅各伯之路穿过我的土地......我可以做一些事情来改善它吗？"
 RICE_galicia_saint_james_routes_decision_desc:0 "通往圣地亚哥[ROOT.Char.GetFaith.GetReligion.GetAdjective]圣地的圣雅各伯之路经过我的土地。我可以改善一下当地的基础设施，如可以资助道路修缮让朝圣者有效地旅行，或者建造旅馆为他们提供住所。"
 RICE_galicia_saint_james_routes_decision_nonchristian_desc:0 "圣雅各伯之路是基督信徒使用的朝圣路线，包括那些生活在我领土上的人民。虽然我不认可他们的信仰，但我想改善一下沿途的基础设施。例如，我可以资助道路修缮使朝圣者更方便的前往，或建造旅馆为他们提供住所。"
 RICE_galicia_saint_james_routes_decision_effect_tooltip_1:0 "你获得多少[piety|E]和[decision|E]的花费取决于你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]拥有多少个[counties|E]以及它们的[control|E]程度"
 RICE_galicia_saint_james_routes_decision_effect_tooltip_2:0 "你获得多少[prestige|E]和[decision|E]的花费取决于你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]拥有多少个[counties|E]以及它们的[control|E]程度"
 RICE_galicia_saint_james_routes_decision_confirm:0 "让我看看我们能为朝圣者做些什么。"
 RICE_galicia_saint_james_routes_decision_context_tooltip:0 "#emphasis 历史背景：#!在中世纪的西欧，圣地亚哥‑德孔波斯特拉成为仅次于耶路撒冷和罗马的重要朝圣地。由于旅行非常危险，疾病、抢劫甚至死亡是朝圣者不断面临的威胁，通往圣地亚哥的各条路线——称为圣雅各伯之路，得到了道路、旅馆等网络的支持，这些为朝圣者在跋涉伊比利亚半岛时提供了必要的安全和舒适保障。"
 RICE_galicia_saint_james_routes_decision_tt:0 "你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]拥有的[counties|E]"
 RICE_galicia_saint_james_routes_decision_non_christian_tt:0 "你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]中拥有信仰基督教的[counties|E]"
 RICE_galicia_saint_james_routes_decision_counties.close:0 "靠近或包含圣地亚哥‑德孔波斯特拉的地区"
 RICE_galicia_saint_james_routes_decision_counties.close.tooltip:0 "获得[GetModifier('RICE_galicia_saint_james_infrastructure_close').GetNameWithTooltip]并持续#V 10#!年"
 RICE_galicia_saint_james_routes_decision_counties.midrange.high:0 "距离圣地亚哥中等距离但是高[control|E]"
 RICE_galicia_saint_james_routes_decision_counties.midrange.high.tooltip:0 "获得[GetModifier('RICE_galicia_saint_james_infrastructure_midrange_high').GetNameWithTooltip]并持续#V 10#!年"
 RICE_galicia_saint_james_routes_decision_counties.midrange.low:0 "距离圣地亚哥中等距离但是低[control|E]"
 RICE_galicia_saint_james_routes_decision_counties.midrange.low.tooltip:0 "获得[GetModifier('RICE_galicia_saint_james_infrastructure_midrange_low').GetNameWithTooltip]并持续#V 10#!年"
 RICE_galicia_saint_james_routes_decision_counties.distant.high:0 "距离圣地亚哥遥远但有很高的[control|E]"
 RICE_galicia_saint_james_routes_decision_counties.distant.high.tooltip:0 "获得[GetModifier('RICE_galicia_saint_james_infrastructure_distant_high').GetNameWithTooltip]并持续#V 10#!年"
 RICE_galicia_saint_james_routes_decision_counties.distant.low:0 "距离圣地亚哥遥远而且低[control|E]"
 RICE_galicia_saint_james_routes_decision_counties.distant.low.tooltip:0 "获得[GetModifier('RICE_galicia_saint_james_infrastructure_distant_low').GetNameWithTooltip]并持续#V 10#!年"
 RICE_galicia_saint_james_levy_extra_tolls:0 "对圣地亚哥朝圣者征收额外费用"
 RICE_galicia_saint_james_levy_extra_tolls_tooltip:0 "这么多的朝圣者......啊！金币向我招手！"
 RICE_galicia_saint_james_levy_extra_tolls_desc:0 "圣雅各之路经过我的土地，这意味着很多朝圣者在前往圣地亚哥的路上会穿越我的土地。[ROOT.Char.GetFaith.GetReligion.GetAdjective]当局可能会抱怨我对这些朝圣者征收额外费用，但是如果我只是要求他们“捐赠”资金来寻求我保护他们，我想他们一定无话可说。"
 RICE_galicia_saint_james_levy_extra_tolls_nonchristian_desc:0 "很多基督教朝圣者在前往圣地亚哥的圣雅各伯之路会经过我的土地。因为我作为一个宽宏大量的非基督徒，大部分时间都不打扰他们，我相信他们会理解我需要一些“资金”来帮助他们更好的朝圣"
 RICE_galicia_saint_james_levy_extra_tolls_effect_tooltip_1_christian:0 "你将获得从#V [gold_i|E]0#!至#bold 最多#!#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_saint_james_toll_money_reward_max_value')]#!的[gold|E]"
 RICE_galicia_saint_james_levy_extra_tolls_effect_tooltip_1_nonchristian:0 "你将获得从#V [gold_i|E]0#!至#bold 最多#!#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_saint_james_toll_money_reward_nonchristian_max_value')]#!的[gold|E]"
 RICE_galicia_saint_james_levy_extra_tolls_effect_tooltip_2:0 "作为一个[christian.GetAdjective][ruler|E]，这个最多[gold|E]量，以及这个[decision|E]的[piety|E]成本，取决于你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]拥有多少个[counties|E]，它们的[control|E]水平，以及它们与[santiago.GetNameNoTier]的距离。"
 RICE_galicia_saint_james_levy_extra_tolls_effect_tooltip_3:0 "作为一个非[christian.GetAdjective][ruler|E]，这个最多[gold|E]量，以及这个[decision|E]的[prestige|E]成本，取决于你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]拥有多少个信仰[christian.GetAdjective]的[counties|E]，还有它们的[control|E]水平，以及它们与[santiago.GetNameNoTier]的距离。"
 RICE_galicia_saint_james_levy_extra_tolls_effect_tooltip_4:0 "因为[iberian_struggle|E]正处于[struggle_phase_iberia_conciliation|E]阶段或者通过#bold $struggle_iberia_ending_conciliation_decision$#![decision|E]而结束，所以这个[decision|E]对你这个不是[christian.GetAdjective]的[ruler|E]来说要付出更多的[prestige|E]"
 RICE_galicia_saint_james_levy_extra_tolls_confirm:0 "我相信朝圣者们会理解的。"
 RICE_galicia_saint_james_levy_extra_tolls_context_tooltip:0 "#emphasis 历史背景：#!在中世纪时期，当地人——无论是平民还是精英——都把走圣雅各伯之路的朝圣者当成肥羊来宰。例如，#italic 《加利提奴二世国王卷轴》（Codex Calixtinus）#!（一种为圣雅各伯之路上的朝圣者编写的12世纪旅行指南）批评了像阿拉贡国王这样的统治者对朝圣者征收过高的通行费。"
 RICE_galicia_saint_james_levy_extra_tolls_tt:0 "你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]拥有的[counties|E]"
 RICE_galicia_saint_james_levy_extra_tolls_non_christian_tt:0 "你在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]中拥有信仰基督教的[counties|E]"
 RICE_galicia_saint_james_levy_extra_tolls_counties.close:0 "靠近或包含圣地亚哥‑德孔波斯特拉的地区"
 RICE_galicia_saint_james_levy_extra_tolls_counties.close.tooltip:0 "获得[GetModifier('RICE_galicia_saint_james_tolls_close').GetNameWithTooltip]并持续#V 10#!年"
