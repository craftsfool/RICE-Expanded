 galicia.0044.t:0 "圣母玛利亚颂歌集"
 galicia.0044.desc:0 "在[CSM_original_compiler.GetTitledFirstName]去世之前，[CSM_original_compiler.GetSheHe]正在与一些诗人合作，收集关于圣母的诗歌和故事，打算编撰一本名为#italic 《圣母玛利亚颂歌集》#!的书籍\n\n现在[CSM_original_compiler.GetSheHe]已经去世了，但是这个项目不会中断，因为我相信[CSM_original_compiler.GetSheHe]会希望我们继续工作。现在由我来领导这项工作，这样[CSM_original_compiler.GetHerHis]的梦想就不会落空。"
 galicia.0044.a:0 "很遗憾，[CSM_original_compiler.GetSheHe]将无法看到最终作品。"
 galicia.0045.t:0 "扩充圣母玛利亚颂歌集"
 galicia.0045.a:0 "我期待着看到我们的成果。"
 RICE_galicia_no_more_CSM_expansions:0 "#italic 圣母玛利亚颂歌集#!已经无法再扩充了！$RICE_galicia_expand_CSM_decision$[decision|E]将不再可用。"
 galicia.0046.t:0 "扩充圣母玛利亚颂歌集"
 galicia.0046.desc:0 "经过几年的努力，《圣母玛利亚颂歌集》的扩充版本已经完成。与以前相比，增加了许多新的诗歌，形成了一个更加著名和美妙的诗歌集，以纪念圣母玛利亚。\n\n已经有抄写员在复制这个版本，关于它的完成的消息正在迅速传播，这反映了[ROOT.Char.GetTitleAsNameNoTooltip]的声誉相当好！"
 galicia.0046.a:0 "大家都做得很好。"
