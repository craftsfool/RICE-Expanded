 galicia.0050.t:0 "加利西亚黑话"
 galicia.0050.desc:0 "在访问[GetGeographicalRegion('RICE_galicia_region').GetName]的一个小镇时，我经过了工匠的住所区，特别是铁匠的住所。在那里我听到他们在说一些我听起来完全是胡言乱语的东西。\n\n我一直在思考这个问题，我决定四处打听是否有人知道这种语言可能是什么。最终我找到了一位学者，他似乎立即认出了我所指的是什么。\n\n“你听到的这种语言叫做#italic Barallete#!，是一种黑话”这位学者解释道，“这是由[GetGeographicalRegion('RICE_galicia_region').GetName]的刀匠们在几代人之前开发的一种秘密语言，用于相互交流。恐怕你不能学习它，即使你感兴趣，因为他们只让同行业的人学习它。”"
 galicia.0050.a:0 "告诉我你对这种语言了解多少。"
 galicia.0050.b:0 "啊，原来只是一些平民的胡言乱语。"
 galicia.0051.t:0 "严谨的司法系统"
 galicia.0051.desc:0 "在[GetGeographicalRegion('RICE_galicia_region').GetName]的部分地区可以发现一些摆动或摇晃的石头，当地人称之为#italic 滚石#!，这些大石头被平衡在一个点上，所以它们很容易来回移动，甚至会随风摆动。\n\n我听说在我的领地[GetGeographicalRegion('RICE_galicia_region').GetName]的当地平民喜欢用这些石头来确定被指控的罪犯是否有罪，主要用于不值得我或我的官员花时间的地方案件。\n\n我不清楚是否应该允许这种做法继续下去。一方面，这种做法可能会损害我的权威；另一方面，这是一个历史悠久的传统，许多当地人发誓它能提供准确和公正的结果。"
 galicia.0051.a:0 "如果有效，那为什么要取缔呢？"
 galicia.0051.b:0 "禁止这些石头！无聊的迷信。"
 galicia.0052.t:0 "在加利西亚的不列颠人"
 galicia.0052.desc:0 "很久以前，[GetGeographicalRegion('RICE_galicia_region').GetName]地区据说是大量从不列颠群岛移民到那里的人的家园。例如那里甚至有一个基督教教区来满足他们的精神需求。\n\n今天当我在[GetGeographicalRegion('RICE_galicia_region').GetName]的地区中巡查时，我遇到了一个据称有许多这些不列颠人居住的地区，至少根据该地区的民间传说是如此，我的导游解释说，例如当地传说这块石头或那块石头是由这些古代不列颠人使用的，或者附近的一些村庄、河流等的名字是如何源自不列颠人的。"
 galicia.0052.a:0 "总而言之，有趣的故事。"
 galicia.0053.t:0 "加利西亚传统粮仓"
 galicia.0053.desc:0 "在[GetGeographicalRegion('RICE_galicia_region').GetName]中，会经常见到一种非常细长的长方形粮仓，称为#italic hórreo#!。它们用木头或石头建造，通常立在柱子上不接触地面，这样老鼠和害虫就没有办法进入里面。\n\n今天我正在巡查[GetGeographicalRegion('RICE_galicia_region').GetName]的一些聚居地，与村镇长老讨论当地问题，作为我们会议的一部分，他们向我展示了附近的一些#italic hórreos#!，并向我解释这些结构如何工作，以及它们最近在保证我们的粮食供应安全方面的成功（或失败）。"
 galicia.0053.a:0 "这些信息将会很有用。"
 galicia.0054.t:0 "加利西亚马"
 galicia.0054.desc:0 "在[GetGeographicalRegion('RICE_galicia_region').GetName]饲养的马匹品种，尽管体型较小，但因其结实和能够忍受该地区崎岖不平的地形条件而闻名。我目前有机会获得一些这样的马匹，供我的士兵和仆人使用，因为似乎有大量的马匹可以从[county.GetNameNoTier]的马厩购买。购买它们是否值得？"
 galicia.0054.a:0 "当然！我认为这些马可能对我有很大帮助。"
 galicia.0054.b:0 "当地人应该把马匹卖到邻近地区。"
 galicia.0054.c:0 "我不需要这些马；当地人应该保留这些马。"
 galicia.0055.t:0 "地下精灵的复仇"
 galicia.0055.desc:0 "一个小贵族最近在[county.GetNameNoTier]去世了，似乎是自然原因。然而有一些迷信的人说，他的死并不像人们看到的那样。\n\n去年他和几个人在他的庄园附近探索了一个山洞，因为他听到了当地关于那里埋藏着巨大宝藏的传说。当他们进入洞穴深处时，据说他们目睹了一群神秘的人围着一个巨大的宝藏跳舞，但在他们到达之前，他们的火把熄灭了，他们被迫在黑暗中退却。\n\n有些人认为这个人很愚蠢，因为他竟然敢于偷取只属于#italic 莫拉#!的东西，即[GetGeographicalRegion('RICE_galicia_region').GetName]的古代地下精灵的财富。为此他付出了代价。"
 galicia.0055.a:0 "他只是在山洞里产生了幻觉，他的死是一个巧合。"
 galicia.0055.b:0 "我同意，这种贪婪的代价迟早遭受惩罚。"
 galicia.0056.t:0 "献给莫拉的祭品"
 galicia.0056.desc:0 "在[county.GetNameNoTier]，有一个山洞最近名声大噪，因为据说里面住着一个#italic 莫拉#!，一种据说住在[GetGeographicalRegion('RICE_galicia_region').GetName]地下的精灵。\n\n我的官员报告说，附近村庄的村民会定期留下一只母鸡，作为献给这个#italic 莫拉#!，他们希望#italic 莫拉#!能帮助他们获得丰收，或者抵御邪恶和巫术。\n\n总之当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]对他们认为有问题献祭行为很不高兴，但他们对此也无能为力，除非我愿意干预。"
 galicia.0056.a:0 "我要去拜访一下#italic 莫拉#!，并留下一份祭品。"
 galicia.0056.b:0 "愚蠢的农民迷信！这与我没有关系！"
 galicia.0056.c:0 "禁止当地人继续这种亵渎神明的做法。"
 galicia.0056.a.title:0 "他们说莫拉保佑你！"
 galicia.0057.t:0 "圣雅各与卢帕女王"
 galicia.0057.desc:0 "今天，我听到一个当地的吟游诗人唱出了一个版本的传说，即圣雅各伯如何在很久以前将[GetGeographicalRegion('RICE_galicia_region').GetName]的土地转变为[christian.GetName]信仰。\n\n据说当圣雅各伯到达[GetGeographicalRegion('RICE_galicia_region').GetName]时，这土地被一个残酷的异教女王卢帕统治着。她多次试图阻挠使徒，但每次都失败了。于是她意识到圣雅各伯不是普通人，她承认自己的错误，让他为她施洗，从那天起她就成了基督的忠实追随者。当使徒后来被希律王阿格里帕迫害后，他的尸体被带回伊比利亚时，女王卢帕协助他的门徒为他找到一个合适的埋葬地点。\n\n有趣的是，我听说过这个故事的其他版本，既女王卢帕她在圣徒死后才皈依。"
 galicia.0057.a:0 "关于圣雅各伯的胜利，多么鼓舞人心的故事啊！"
 galicia.0057.b:0 "卢帕女王的皈依表明任何人都可以被基督所拯救。"
 galicia.0058.t:0 "朝圣者在圣雅各伯之路被勒索"
 galicia.0058.desc:0 "一群罪犯最近在[county.GetNameNoTier]被捕，他们向前往[santiago.GetNameNoTier]圣地的[christian.GetAdjective]朝圣者勒索钱财。他们中的许多人都是当地有名的骑士和小贵族，但显然他们参与这种保护性的敲诈，恶行堪比土匪！\n\n虽然我可以像惩罚普通逃犯那样惩罚他们，但还有一个选择。该地区各个地方的当局允许被定罪的罪犯去[santiago.GetNameNoTier]朝圣，以便为他们的罪行忏悔，这种情况并不罕见，特别是那些原本有体面背景的罪犯，因此不太可能试图逃跑。\n\n与其通过正常手段惩罚这些敲诈者和强盗，我们可以一种讽刺的方法来惩罚他们，既让他们成为朝圣者。"
 galicia.0058.a:0 "让我们给他们一个机会。他们将前往[santiago.GetNameNoTier]。"
 galicia.0058.b:0 "这些强盗不会逃脱法律的制裁，对他们进行相应的惩罚！"
 galicia.0059.t:0 "圣雅各伯之路的罪犯朝圣者"
 galicia.0059.desc:0 "对于[christian.GetAdjective]罪犯来说，去[santiago.GetNameNoTier]朝圣很常见，这是一种合法逃避惩罚的方式。人们相信，通过作为朝圣者要经历斗争和艰难，这样他们将改过自新，为自己的罪行忏悔，并浪子回头。\n\n然而，圣雅各伯之路经过我统治的一些领土，所以在这些土地上，经常会有大量这些被定罪的罪犯经过。在[county.GetNameNoTier]，当地人就此事向我的官员提出投诉，担心大量罪犯的涌入会对该地区的安全和稳定造成危险。"
 galicia.0059.a:0 "如果他们的意图是好的，我们就不要去骚扰他们。"
 galicia.0059.b:0 "当这些罪犯在我们的土地上时，对他们进行监视。"
 galicia.0060.t:0 "一位朝圣者"
 galicia.0060.desc:0 "今天，我遇到了一位优秀的贵族[pilgrim.GetWomanMan]，名字叫[pilgrim.GetFullName]。[pilgrim.GetSheHe|U]是一位朝圣者，他最近走过圣雅各伯之路前往[santiago.GetNameNoTier]，现在要回去。\n\n然而由于各种原因，[pilgrim.GetFirstNameNoTooltip]说[pilgrim.GetSheHe]不愿意回到[pilgrim.GetHerHis]的老家，并考虑留在这里，因为[pilgrim.GetSheHe]觉得这个地区很迷人。毕竟朝圣者在前往[santiago.GetNameNoTier]后，在异国他乡定居的情况并不罕见。\n\n也许我可以慷慨地邀请[pilgrim.GetHerHim]加入我的宫廷。有一个不同文化的人的观点会给我带来帮助，尤其是一个经历过如此著名的朝圣之旅的人。话说回来，我对[pilgrim.GetFirstNameNoTooltip]了解不多，至少现在还不知道，所以我不确定这是否值得。"
 galicia.0060.a:0 "请留在我的宫廷上，在我的宫廷发光发热。"
 galicia.0060.b:0 "如果你想在我的领地内的某个地方定居下来，请便。"
 galicia.0061.t:0 "扇贝壳"
 galicia.0061.desc:0 "我正在[county.GetNameNoTier]访问当地的[ROOT.Char.GetFaith.HouseOfWorship]，进行定期巡视。当我在外面与负责人[ROOT.Char.Custom('DefaultPriestTitle')]谈论与我的领域有关事务时，我注意到一些旅行者正走向[ROOT.Char.Custom('DefaultPriestTitlePlural')]，他们在[ROOT.Char.GetFaith.HouseOfWorship]的门口站岗。\n\n这些旅行者携带贝壳，表明他们参加了前往[santiago.GetNameNoTier]的朝圣之旅，这是因为圣雅各伯与贝壳有不同寻常的关系。我看到朝圣者在里面受到欢迎，我听到[ROOT.Char.Custom('DefaultPriestTitlePlural')]说他们会得到食物、饮料和晚上休息的地方。"
 galicia.0061.a:0 "多么高尚的灵魂啊，真想完成这样的朝圣！"
 galicia.0061.b:0 "这只是一些朝圣者。现在，我们在谈论什么？"
 galicia.0062.t:0 "朝圣者聚居地"
 galicia.0062.desc:0 "最近，[county.GetNameNoTier]的一些城镇因吸引了前往[santiago.GetNameNoTier]的圣雅各布之路朝圣者而获得声誉。许多朝圣者在完成朝圣后决定在[county.GetNameNoTier]定居。也许他们发现这个地区的风景和文化令人着迷，也许他们想逃离家乡不幸的过去，也许他们认为这个地区可以为他们提供更好的发展机会。\n\n无论是哪种情况，这都意味着有很多有才华的人搬到了这里。这将促进当地发展！"
 galicia.0062.a:0 "听到这消息真是高兴。"
