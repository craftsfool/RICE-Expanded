 galicia.0031.tooltip.after:0 "你开始创作你的[cantiga|E]——结果会是什么？"
 galicia.0032.t:0 "加利西亚抒情诗完成了"
 galicia.0032.desc.intro.courtly_love:0 "经过一番辛劳和努力，我已经完成了我的诗歌创作作为加利西亚情诗的一部分，它侧重于宫廷浪漫的考验和磨难，通常以悲剧或苦涩为结局。"
 galicia.0032.desc.intro.romantic_love:0 "经过一番辛劳和努力，我已经完成了我的诗歌创作作为加利西亚情诗的一部分，它从女人的角度讲述浪漫爱情。"
 galicia.0032.desc.intro.satire:0 "经过一番辛劳和努力，我已经完成了我的诗歌创作作为加利西亚讥讽诗的一部分，它批判社会的方方面面，警示提醒人们。"
 galicia.0032.desc.acceptable:0 "\n\n到目前为止，那些听过我的加利西亚抒情诗的人反应不一。有些人很欣赏它，而其他人则比较冷淡。似乎我的诗歌#bold 不如人意#!，一个普通的作品，没有什么了不起"
 galicia.0032.desc.good:0 "\n\n听过我的加利西亚抒情诗的人的反应都很好。虽然他们不认为这是一个天才之作，但他们认为这#bold 行云流水#!，很好地运用了体裁的惯例，并很好地表达了我的想法和思想。"
 galicia.0032.desc.excellent:0 "\n\n自从我创作这首加利西亚抒情诗后，听过的人都赞不绝口，认为这绝对是#bold 拍案叫绝#!之作，这篇诗歌肯定会受到整个地区的诗人和学者的尊重。"
 galicia.0032.desc.conclusion:0 "\n\n总之我已经花了大量时间在揣摩加利西亚抒情诗文字上，我现在需要回归我的职责。不过能够抽出一些时间来专注于这种艺术追求，还是很不错的。"
 galicia.0032.a:0 "也许我早晚会找到时间再创作一首加利西亚抒情诗。"
 galicia.0032.tooltip.excellent:0 "因为你的[cantiga|E][cantiga_quality|E]是令人#V 拍案叫绝#!，所以你获得一个[character_modifier|E]并且可以转化为一个永久的[artifact|E]。"
 galicia.0033.t:0 "令人拍案叫绝的加利西亚抒情诗值得一听"
 galicia.0033.desc:0 "不久前，我花了一些时间创作了一首诗歌。从那时起它广为流传，许多人认为它十分优秀并传阅了它\n\n我已经决定制作这首颂歌的副本。我希望它能被广泛传播，许多人都能从中得到快乐。\n\n我还委托人在一份高质量的特殊手稿上制作了我的诗歌版本，装饰最好的艺术风格。这样一来，我就可以提醒自己是一个优秀加利西亚抒情诗作家。"
 galicia.0033.a:0 "现在，我想知道......我的加利西亚抒情诗会不会经得起时间的考验？"
