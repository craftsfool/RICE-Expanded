 galicia.0030.t:0 "创作一首加利西亚抒情诗"
 galicia.0030.desc.intro:0 "我现在充满了灵感，我要创作一首#italic 加利西亚抒情诗#!来消遣！"
 galicia.0030.desc.courtly_love:0 "\n\n我希望以#italic 爱的颂歌#!为体裁来创作加利西亚抒情诗，让我们专注于宫廷爱情的奥妙、悲欢离合。难道没有什么比这种纯粹的爱情和欲望的形式更高尚的了，它激励着英雄的、有德行的人去做伟大的事情！"
 galicia.0030.desc.romantic_love:0 "\n\n我希望以#italic 爱之述歌#!为体裁来创作加利西亚抒情诗，通过女人的角度来讲述的浪漫爱情，这样我们可以探索爱情的不同角度。"
 galicia.0030.desc.satire:0 "\n\n我希望以#italic 讥讽#!为体裁来创作加利西亚抒情诗，让我们批判社会的方方面面，警示提醒人们！"
 galicia.0030.desc.conclusion:0 "\n\n在我创作这首#italic 加利西亚抒情诗#!之前，我需要想一些合适的主题或话题，这首诗歌可以围绕这些主题。我有很多事情可以写！"
 galicia.0030.a:0 "我要描述什么呢？"
 galicia.0030.tooltip.courtly_love:0 "你将花几天时间思考你的[cantiga|E]可以涵盖的主题。"
 galicia.0030.tooltip.romantic_love:0 "你将花几天时间思考你的[cantiga|E]可以涵盖的主题。"
 galicia.0030.tooltip.satire:0 "你将花几天时间思考你的[cantiga|E]可以涵盖的主题。"
 galicia.0031.t:0 "加利西亚抒情诗的灵感来源"
 galicia.0031.desc.intro.courtly_love:0 "#italic 加利西亚情诗#!是围绕宫廷浪漫的歌曲。它是从一个男人的角度讲述的，他欣赏、崇拜并爱着一个他无法拥有的女人，通常以悲剧为结局。"
 galicia.0031.desc.intro.romantic_love.female:0 "#italic 加利西亚情诗#!是专注于浪漫的、甚至带有性爱内容的诗歌，它经常从一个女人的角度进行叙述，即使这些诗歌的作者是男人。作为一个女人，也许我可以提供一个更真实的叙述，而不是男人喜欢幻想的东西。"
 galicia.0031.desc.intro.romantic_love.male:0 "#italic 加利西亚情诗#!是专注于浪漫的、甚至带有性爱内容的诗歌，它经常从一个女人的角度进行叙述，即使这些诗歌的作者是男人。作为一个男人，虽然我无法真正的理解女人的想法但是我也可以做出最好的加利西亚抒情诗！"
 galicia.0031.desc.intro.satire:0 "#italic 加利西亚讥讽诗#!是具有讽刺性质的诗歌，小到特定的人（包括坏诗人），大到整个社会。我必须尽我所能地发挥我的智慧。"
 galicia.0031.desc.conclusion:0 "\n\n总之，在过去的几天里我一直在思考这个问题。有许多不同的主题我可以写入我的诗歌，目前有几个主题给了我灵感......但哪一个能帮助我制作出最好的诗歌？"
