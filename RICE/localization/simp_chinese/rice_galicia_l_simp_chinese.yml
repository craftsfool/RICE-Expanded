 cantiga_theme.beauty_lady:0 "女性之美"
 cantiga_theme.tooltip.beauty_lady:0 "这首[cantiga|E]将着重描绘了女主角的美貌，诗曲中用了一些隐喻来描述她美丽的面容，以及别人看到她美貌后的反应。"
 cantiga_theme.joy:0 "喜悦"
 cantiga_theme.tooltip.joy:0 "这首[cantiga|E]将以幸福和欢乐为主题，里面描绘从爱人久别重逢的欢欣，到刚刚坠入爱河的天真青年的甜美妄想。"
 cantiga_theme.sad:0 "悲伤"
 cantiga_theme.tooltip.sad:0 "这首[cantiga|E]将充满了各种悲剧元素，从被爱慕之人拒绝后的抑郁到高贵敌人死亡的苦乐参半情绪。"
 cantiga_theme.war:0 "战争"
 cantiga_theme.tooltip.war:0 "这首[cantiga|E]将讲述英勇骑士之间的战斗、与心爱女人分开的焦虑之情还有行军中的日常生活。"
 cantiga_theme.anger:0 "愤怒"
 cantiga_theme.tooltip.anger:0 "这首[cantiga|E]将讲述愤怒的各种表现形式，从夫妇之间的争吵，再到嫉妒之怒。"
 cantiga_theme.feudalism:0 "封建阶级关系"
 cantiga_theme.tooltip.feudalism:0 "这首[cantiga|E]将讲述封建阶级的尊卑，比如什么是好的领导者，或者恋爱中的男人如何像个附庸一样，尽其所能取悦所爱之人。"
 cantiga_theme.dying_for_love:0 "殉情"
 cantiga_theme.tooltip.dying_for_love:0 "这首[cantiga|E]将以殉情为主题，如饱受单相思之苦的男人如何解脱，以及一个女人在爱人出海后等待他回家的时间过长而老去。"
 cantiga_theme.holy_land:0 "圣地"
 cantiga_theme.tooltip.holy_land:0 "这首[cantiga|E]将以圣地为主题，如十字军的骑士与爱人告别场景或耶路撒冷的故事。"
 cantiga_theme.sea:0 "海"
