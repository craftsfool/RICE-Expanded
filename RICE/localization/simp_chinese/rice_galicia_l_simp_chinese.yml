 RICE_galicia_braganza_blood:0 "据称身怀亚美尼亚和布列塔尼贵族血统"
 RICE_galicia_braganza_blood_desc:0 "该家族最初起源于伊比利亚，不过声称祖上是亚美尼亚著名的阿尔茨鲁尼家族和布列塔尼公爵的后裔。尽管这样族谱是相当牵强无法让人相信，但这个家族的成员坚持这样声称。"
 RICE_galicia_csm_legend_name:0 "圣母颂"
 RICE_galicia_csm_legend_desc:0 "世人言，[compiler.GetTitledFirstName]必能出口成章，非此，其怎能作出#italic 圣母玛利亚颂歌集#!？"
 RICE_galicia_csm_legend_chapter_opening_new_title:0 "世人言，[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]必能出口成章，而今其文声名远扬、流芳百世。"
 RICE_galicia_csm_legend_chapter_motivation_new_title:0 "有人说，[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]是一个诗人的民族，而[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]则是诗人中的诗人。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]同身边的许多诗人一样，创作过许多的加利西亚抒情诗。但在[ROOT.Legend.GetProtagonist.GetSheHe]的内心深处，[ROOT.Legend.GetProtagonist.GetHerHis]正渴望着创作些真正伟大的、能够流芳百世的诗歌。那些世俗的诗歌是做不到的，只有宗教的、神圣的颂歌才能流芳百世。这也是[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]为何决心创作和汇编#italic 圣母#!的诗歌：她是基督之母，以童贞的处女身做了母亲，留下了数之不尽奇迹！"
 RICE_galicia_csm_legend_chapter_famous_deed_new_title:0 "为完成这伟大而神圣的事业，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]周游诸地，寻求同样有志于此的伟大诗人和歌者。这不是一场寻常的、舞枪弄棒的圣战，而是一场精神层面的、以文字与歌声为武器的圣战！在[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的领导下，诸位参与这一伟大事业的诗人歌者纷纷开动脑筋、积蓄灵感，以求将这部歌颂圣母奇迹圣品的#italic 圣母玛利亚颂歌集#!推敲打磨至完美！"
 RICE_galicia_csm_legend_chapter_extra_deed_new_title:0 "数年里，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]和[ROOT.Legend.GetProtagonist.GetHerHis]的“同志”夜以继日地创作打磨这些圣母的颂歌，以求尽善尽美，全面展现圣母所行的奇迹和她的圣品！"
 RICE_galicia_csm_legend_chapter_conclusion_new_title:0 "这些颂歌鼓舞了[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]及周边许多地区的基督徒。正如一首颂歌所唱的那样：“众人或因罪而残，圣母必以功救赎之！”"
 RICE_galicia_santiago_holy_site_building_level_2_req:0 "[GetBuilding('holy_site_basilica_santiago_01').GetName]已经建成"
 galicia.0045.desc.x:0 "多年前，我们开始着手创作一部献给圣母玛利亚的#italic 《圣母玛利亚颂歌集》#!，如今该项目圆满完成并广受赞誉，是我宫廷文化、智慧与虔诚的高水准证明。\n\n如今我计划继续为#italic 《圣母玛利亚颂歌集》#!增添更多颂歌。我将再次召集来自各地的诗人，与他们共同创作和汇编颂歌。待完成之时，我们必将使这部辉煌的歌集更加璀璨夺目。"
 dynn_RICE_paiva:0 "派瓦"
 RICE_galicia_geographical_domicile_req:0 "你的[domicile|E]位于[GetGeographicalRegion('RICE_galicia_region').GetName]"
 RICE_santiago_county_faith_req:0 "[GetTitleByKey('c_santiago').GetNameNoTier][county|E]信奉你的[faith|E]"
 activity_RICE_hot_springs_visit_ourense_province_desc:0 "\n#P +++ [GetTitleByKey('b_ourense').GetNameNoTier]的[hot_springs|E]自罗马时代甚至更早就已闻名遐迩，尤其是#italic 布尔加斯温泉#!。#!\n\n#italic 这将使你获得[GetModifier('RICE_galicia_ourense_as_burgas_non_christian_modifier').GetNameWithTooltip][character_modifier|E]。若你信奉[GetReligionByKey('christianity_religion').GetAdjective][faith|E]，则将改为获得[GetModifier('RICE_galicia_ourense_as_burgas_christian_modifier').GetNameWithTooltip][modifier|E]，并额外获得[piety_i|E][piety|E]。#!"
 RICE_galicia_ourense_as_burgas_non_christian_modifier:0 "造访布尔加斯温泉"
 RICE_galicia_ourense_as_burgas_non_christian_modifier_desc:0 "此角色最近前往$b_ourense$，去著名的#italic 布尔加斯温泉#!放松身心。"
 RICE_galicia_ourense_as_burgas_christian_modifier:0 "作为基督徒$RICE_galicia_ourense_as_burgas_non_christian_modifier$"
 RICE_galicia_ourense_as_burgas_christian_modifier_desc:0 "$RICE_galicia_ourense_as_burgas_non_christian_modifier_desc$也是圣地亚哥朝圣之路上的基督徒朝圣者热衷的休憩之所。"
 RICE_galicia_pico_sacro_modifier:0 "向萨克罗峰祈祷"
 RICE_galicia_pico_sacro_decision:0 "向萨克罗峰祈祷"
 RICE_galicia_pico_sacro_decision_tooltip:0 "据说神圣的萨克罗峰能治愈世人！"
 RICE_galicia_pico_sacro_decision_desc:0 "生活在[GetGeographicalRegion('RICE_galicia_region').GetName]周边的人们常相信，向[GetTitleByKey('c_santiago').GetNameNoTier]附近的萨克罗峰祈祷，能治愈任何病痛，这一信念源于围绕此地的众多传说。"
 RICE_galicia_pico_sacro_decision_effect_tooltip_1:0 "若尚未做出#V $RICE_galicia_pico_sacro_chapel_decision$#![decision|E]，则此[decision|E]需要更多[gold_i|E][gold|E]和[piety_i|E][piety|E]，并降低[GetReligionFamily('rf_abrahamic').GetName][faiths|E]信徒的[court_chaplain|E][opinion_i|E][opinion|E]"
 RICE_galicia_pico_sacro_decision_confirm:0 "治愈我吧，圣山！"
 RICE_galicia_pico_sacro_decision_context_tooltip:0 "#emphasis 历史背景：#!伊比利亚西北部坐落着数座与各种迷信传说相关的山峰，尽管它们与基督教之前的习俗的关系尚不确定，但萨克罗峰是其中较为著名的一座，因围绕使徒雅各和神话人物卢帕的传说而闻名；卢帕是一位异教女王，起初曾给雅各的门徒制造麻烦，但后来皈依了基督教。这座山与圣雅各的联系形成于中世纪时期，899年，主教西斯南多在此修建了一座献给他的礼拜堂。"
 RICE_galicia_pico_sacro_chapel_decision:0 "在萨克罗峰祝圣礼拜堂"
 RICE_galicia_pico_sacro_chapel_decision_tooltip:0 "据说神圣的萨克罗峰能治愈世人！"
 RICE_galicia_pico_sacro_chapel_decision_desc:0 "[GetGeographicalRegion('RICE_galicia_region').GetName]的一些当地人相信，在[GetTitleByKey('c_santiago').GetNameNoTier]附近的萨克罗峰祈祷能治愈一切疾病。然而，一些[ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural]对这些被视为虚假迷信的行为心存疑虑。若能在山上修建一座小教堂，并将其与正统的[ROOT.Char.GetFaith.GetAdjective]礼拜联系起来，或许能让这类人更容易接受。"
 RICE_galicia_pico_sacro_chapel_decision_effect_tooltip_1:0 "[GetReligionFamily('rf_abrahamic').GetName][faiths|E]的信徒在做出#V $RICE_galicia_pico_sacro_decision$#![decision|E]时，将不再需要支付额外的[gold_i|E][gold|E]、损失[piety_i|E][piety|E]，或降低[court_chaplain|E]的[opinion_i|E][opinion|E]。"
 RICE_galicia_pico_sacro_chapel_decision_confirm:0 "这座山属于[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]！"
 RICE_galicia_pico_sacro_chapel_decision_context_tooltip:0 "$RICE_galicia_pico_sacro_decision_context_tooltip$"
 galicia.0001.desc.other:0 "这神圣特质毋庸置疑。\n\n无论如何，我面向群山，诵念祷词，向[ROOT.Char.GetFaith.HighGodName]虔诚祈祷："
 galicia.0001.desc.christian:0 "在这些传说中，最为著名的莫过于与圣雅各、其门徒以及昔日信奉异教的女王卢帕相关的故事。\n\n无论如何，我转身面向群山的方向，开始诵念祷词，向圣雅各祈祷："
 galicia.0001.desc.conclusion:0 "\n\n#EMP “圣萨克罗峰治愈我身上的病痛吧！”#!"
 galicia.0002.desc.christian:0 "在[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]中，流传着许多将这座山与使徒圣雅各及卢帕女王联系起来的传说。"
 galicia.0002.desc.non_christian:0 "就连居住在那里的[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]也流传着关于此山为何神圣的诸多传说。"
 galicia.0002.desc.conclusion:0 "这座礼拜堂无疑会将这些传说与更正统的[ROOT.Char.GetFaith.GetAdjective]崇拜形式联系起来。\n\n如此一来，围绕萨克罗峰的种种“迷信”也将更容易被各[GetReligionFamily('rf_abrahamic').GetName]宗教的信徒所接受。"
 galicia.0017.desc.christian:0 "\n\n这些泉水也位于圣雅各之路的#italic 萨纳夫雷斯之路#!上，是朝圣者们热衷的休憩之地。也许看到一些朝圣者会激励我……"
 galicia.0018.desc.christian:0 "\n\n当然，我也注意到有不少[GetReligionByKey('christianity_religion').GetAdjective]朝圣者在使用这些温泉。他们大多可能是沿着圣雅各之路朝圣，他们的存在对虔诚的信徒而言是一种鼓舞。"
