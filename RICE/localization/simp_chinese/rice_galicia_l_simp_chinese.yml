 galicia.0040.t:0 "工作开始了"
 galicia.0040.desc:0 "在[GetGeographicalRegion('world_europe_west_iberia').GetName]中，有很多人创作了加利西亚抒情诗，而且有很多这些歌曲和诗歌的汇编在那里。然而作为一个[christian.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我渴望做一些更伟大的事情，而不仅仅是从事琐碎的、文字上的诗歌创作。\n\n我最近想出了一个主意，与我领土内的诗人合作，创作并编纂一本名为#italic 《圣母玛利亚颂歌集》#!的诗集。与普通的颂歌不同，这些颂歌将全部集中于圣母玛利亚的荣耀，以及庆祝她的奇迹。\n\n这并不是一项容易的工作。根据我对这套书的计划，它将需要很多年的时间来编纂，我可能无法活着看到它完成，这也不是不可能的。但我能想象，一旦这个项目完成，我们可以激发其他人的敬畏和惊奇，最终这将是值得的！"
 galicia.0040.a:0 "以圣母的名义！"
 galicia.0041.t:0 "圣母玛利亚颂歌集已经完成了"
 galicia.0041.desc.intro:0 "经过多年的努力，在我的领导下，第一版完整的#italic 《圣母玛利亚颂歌集》#!已经完成。这要感谢那些聚集在一起创作这本纪念圣母的颂集的诗人。"
 galicia.0041.desc.christian:0 "\n\n这些诗歌不仅向所有人展示了我作为一个[christian.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]的虔诚，而且我通过智力和艺术手段体现了这种虔诚。即使是现在一些与我合作过的诗人也曾讨论过将来用更多的诗歌来填充这个诗集。"
 galicia.0041.desc.non_christian:0 "\n\n虽然我不信奉[christian.GetAdjective]宗教，但这并不意味着我不能欣赏和享受这书中的诗歌。它里面包涵了许多动人的诗歌，而且许多诗歌包含了任何人都可以欣赏的重要道德训诫。"
 galicia.0041.a:0 "我为我们所取得的成就感到骄傲。"
 galicia.0041.tooltip:0 "现在可用$RICE_galicia_expand_CSM_decision$[decision|E]"
 galicia.0042.t:0 "圣母玛利亚颂歌集"
 galicia.0042.desc:0 "关于#italic 《圣母玛利亚颂歌集》#!完成的消息正在迅速传播！这是一部关于圣母玛利亚的诗集，在[alfonso_x.GetTitledFirstName]的领导下这几百首[christian.GetAdjective]诗歌以不同的方式纪念她，有些是赞美她的赞美诗，而有些则讲述了她所创造的奇迹的故事。\n\n总而言之，这部伟大的文学和音乐作品的完成很好地反映了[alfonso_x.GetFirstNameNoTooltip]和[alfonso_x.GetHerHis]宫廷的文化底蕴。即使这些诗歌现在可能不会被每个人欣赏，但毫无疑问，后人会因其音乐和宗教品质而赞美它。"
 galicia.0042.a:0 "这是一项伟大的艺术成就。"
 galicia.0043.t:0 "xxxxx"
 galicia.0043.desc:0 "xxxxx"
