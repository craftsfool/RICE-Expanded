 galicia.0010.t:0 "支持圣雅各伯之路"
 galicia.0010.desc.intro:0 "每天都有[christian.GetAdjective]朝圣者跋涉在我的领土上，前往[christian.GetAdjective]圣地和[santiago.GetNameNoTier]的圣雅各伯之墓。然而路途凶险的，因为沿途中有土匪、野生动物、恶劣天气，甚至糟糕路况。"
 galicia.0010.desc.christian:0 "\n\n因此作为一个[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我有责任帮助这些朝圣者无论他们来自哪里。毕竟我确信圣雅各本人会同意我对他的信徒提供任何形式的帮助。"
 galicia.0010.desc.non_christian:0 "\n\n有些[ROOT.Char.GetFaith.GetAdherentNamePlural]觉得我对我的[christian.GetAdjective]臣民没有任何亏欠，同时对外来的[christian.GetAdjective]朝圣者也没有亏欠。不过我还是希望被视为一个公正和宽容的统治者，改善与我的领地内[christian.GetAdjective]社区的关系，并促进贸易的流动。"
 galicia.0010.desc.conclusion:0 "\n\n因此我已经拨出款项，用于我的领土内通往[santiago.GetNameNoTier]的主要朝圣路线上的各种基础设施项目，从改善道路条件到建造旅馆等等。这都将确保朝圣者有一个更安全、更舒适的旅程。"
 galicia.0010.a:0 "这是我能做的最起码的事情。"
 galicia.0011.t:0 "圣雅各伯的代祷"
 galicia.0011.desc.intro:0 "自从圣雅各伯在许多世纪前前往[GetGeographicalRegion('world_europe_west_iberia').GetName]宣扬耶稣基督的福音以来，他一直与这片土地有着特殊的联系。毫无疑问他是这片土地的守护者，因此我祈求他的代祷。"
 galicia.0011.desc.warrior:0 "\n\n圣雅各伯的名字本身就象征着战争的胜利。我祈祷圣雅各伯将为我们提供力量和智慧，以战胜任何异教徒，他们是我们邪恶的敌人。让我们战胜异教徒并在陆地上传播[ROOT.Char.GetFaith.GetReligion.GetAdjective]信仰。"
 galicia.0011.desc.pilgrim:0 "\n\n圣雅各伯的名字让人想起涌向圣地亚哥‑德孔波斯特拉的圣地的众多朝圣者。我祈祷圣雅各伯为我们提供力量和智慧来忍受生活的艰辛，就像朝圣者忍受道路的艰辛一样，以便我们能够更好地理解和服务于主的意志。"
 galicia.0011.desc.preacher:0 "\n\n圣雅各伯这个名字让人想到使徒们在周游世界向人类传扬基督的福音时的虔诚。我祈祷圣雅各伯为我们提供力量和智慧，帮助全能的上帝将福音传播到更远的地方，并使我们在这个时代拥有和平。"
 galicia.0011.a:0 "阿门！"
 RICE_saint_james_intercession_tooltip.nothing:0 "圣雅各伯的代祷没有任何奇迹般的迹象"
 RICE_saint_james_intercession_tooltip.minor:0 "圣雅各伯的代祷有几个迹象"
 RICE_saint_james_intercession_tooltip.major:0 "圣雅各伯的代祷有一些迹象"
 RICE_saint_james_intercession_tooltip.great:0 "圣雅各伯的代祷有许多迹象"
 galicia.0012.t:0 "向朝圣者征收额外的过路费"
 galicia.0012.desc.intro:0 "圣雅各伯之路是一个路线网络，它们都朝着一个方向前进：[christian.GetAdjective]的圣地——[santiago.GetNameNoTier]。因此来自欧洲各地的朝圣者不得不穿越像我这样的统治者的土地，这些统治者善意地要求他们支付通行费，因为我们的权利。我决定这些通行费需要更#italic 高#!"
 galicia.0012.desc.christian:0 "\n\n有些人认为[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]向朝圣者征收这些有争议的费用是不虔诚的，更不用说增加费用了。"
 galicia.0012.desc.non_christian:0 "\n\n\n我相信我的许多[ROOT.Char.GetFaith.GetAdjective]不在乎我是否增加对这些朝圣者征收的费用。他们中的一些人甚至会说，作为一个[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我还是太仁慈，应该对这些异教徒更加凶狠。\n\n相反我王国里的[christian.GetAdjective]社区听到这个消息后并不高兴。他们认为朝圣者应该感谢我甚至允许他们进入我的领土。"
 galicia.0012.desc.court_chaplain_exists:0 "我那愤怒的[chaplain.GetCouncilTitle]，[chaplain.GetTitledFirstName]，曾私下批评过我这样做，例如[chaplain.GetSheHe|U]也对我的领地内一些更热心的[ROOT.Char.Custom('DefaultPriestTitlePlural')]视而不见，他们公开谴责我的行为。\n\n尽管如此，他们能对我做的也只有这么多。我甚至没有伤害那些朝圣者，我只是在乎钱。"
 galicia.0012.desc.no_court_chaplain_exists:0 "\n\n毫不奇怪，在我的领域里，许多虔诚的[ROOT.Char.Custom('DefaultPriestTitlePlural')]都公开谴责我，质疑我的权威。对他们来说，我没有像一个合格的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]那样行事。\n\n尽管如此，他们能对我做的也只有这么多。我甚至没有伤害那些朝圣者，我只是在乎钱。"
 galicia.0012.a:0 "我将做我必须做的。"
 galicia.0013.t:0 "发现圣雅各伯的坟墓"
 galicia.0013.desc:0 "有很多传言描述圣雅各伯被埋葬在我统治的[santiago.GetNameNoTier]上。因此我决定派我的[chaplain.GetCouncilTitle]，[chaplain.GetTitledFirstName]去调查此事，现在[chaplain.GetSheHe]已经带着[chaplain.GetHerHis]的调查结果回来。\n\n不久前，当地一位名叫[pelayo.GetFirstName]的隐士在某座山的上空目睹了神秘的火焰，连续几晚。在与[chaplain.GetFirstNameNoTooltip]联系后，两人去调查该地区。他们发现了一个古老的罗马墓地......以及圣雅各伯的坟墓。\n\n[chaplain.GetFirstNameNoTooltip]确保与当地学者和[ROOT.Char.Custom('DefaultPriestTitlePlural')]核实这个坟墓的真实性，现在任何人都不会怀疑，这个坟墓是圣雅各伯的安息地！"
 galicia.0013.a:0 "你对这个坟墓有什么了解？"
 galicia.0014.t:0 "发现圣雅各伯的坟墓"
 galicia.0014.desc:0 "作为调查的一部分，我的[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]记下了[pelayo.GetFirstName]所见证的神奇神迹。[chaplain.GetSheHe|U]还调查了当地关于圣雅各伯的传说。\n\n在这些传说的大多数版本中，圣雅各伯被希律王阿格里帕迫害后，一艘石船奇迹般地将他的遗体带到了[GetGeographicalRegion('world_europe_west_iberia').GetName]的西北部，因为圣雅各伯之前曾在那里为异教徒女王卢帕进行洗礼。所以他的门徒们埋葬了他并建造了坟墓。\n\n不管怎么说，我决定最好在墓旁建造一座小教堂，这样当地人就可以纪念我们伟大的使徒了，这一行为得到了[chaplain.GetFirstNameNoTooltip]的赞同。[chaplain.GetFirstNameNoTooltip]向我提出的最后一个问题是如何处理隐士[pelayo.GetFirstName]，他首先要对这个发现负责。"
 galicia.0014.a:0 "让[pelayo.GetFirstNameNoTooltip]加入我的宫廷！"
 galicia.0014.b:0 "我想[pelayo.GetFirstNameNoTooltip]他更希望隐居。"
 RICE_galicia_unlock_santiago_prayer_decision_tooltip:0 "[GetGeographicalRegion('RICE_galicia_region').GetName]符合要求的[christian.GetAdjective][rulers|E]解锁$RICE_galicia_pray_to_santiago$[decisions|E]"
 RICE_galicia_unlock_santiago_routes_decision_tooltip:0 "在[GetGeographicalRegion('world_europe_west_iberia').GetName]和[GetGeographicalRegion('custom_occitan').GetName]中符合要求的[rulers|E]解锁$RICE_galicia_saint_james_routes_decision$和$RICE_galicia_saint_james_levy_extra_tolls$[decisions|E]"
 galicia.0015.t:0 "发现圣雅各伯的坟墓"
 galicia.0015.desc:0 "来自[santiago.GetNameNoTier]的神奇消息，至少对[GetGeographicalRegion('world_europe_west_iberia').GetName]的[christian.GetAdjective]群体来说是好消息。\n\n住在那里的一位名叫[pelayo.GetFirstName]的隐士，最近连续几晚在夜空中目睹了几个神迹。他通知了[chaplain.GetTitledFirstName]，[alfonso.GetTitledFirstName]的[chaplain.GetCouncilTitle]，两人调查了此事。令他们惊讶的是，他们发现了使徒圣雅各伯的古墓。当地学者和[alfonso.Custom('DefaultPriestTitlePlural')]验证了坟墓的真实性后，[alfonso.GetTitledFirstNameNoTooltip]下令在其旁边建造一座小教堂。\n\n已经有朝圣者从附近地区涌向该墓。关于这一发现的消息正在迅速传播，可以肯定的是，还会有更多的朝圣者从远方赶来。对圣雅各伯墓的朝拜会是短暂的时尚，还是会演变成一个更持久的传统？"
 galicia.0015.a:0 "一个伟大的日子！愿圣雅各伯保护我们。"
 galicia.0015.b:0 "这当然是很有趣的消息。"
 galicia.0016.t:0 "强化加利西亚的海岸"
 galicia.0016.desc:0 "尽管崎岖不平，[GetGeographicalRegion('RICE_galicia_region').GetName]几个世纪以来一直受到海上的袭击和掠夺。任何统治这些土地的人都明白，维持一个由塔楼、前哨和其他防御结构组成的阵地对于这个地区的持续安全是必要的。\n\n我最近拨出一些资金，在我统治的领土上加强[GetGeographicalRegion('RICE_galicia_region').GetName]海岸线的防御，无论是建造新的防御工事还是翻新和扩大现有的防御工事。希望这能使我们的任何敌人都不敢想从海上攻击我们。"
 galicia.0016.a:0 "我们的沿海将得到保障。"
 galicia.0017.t:0 "前往[GetTitleByKey('b_ourense').GetNameNoTierNoTooltip]！"
 galicia.0017.desc:0 "[GetTitleByKey('b_ourense').GetNameNoTier]的温泉历史悠久，甚至在罗马人殖民[GetGeographicalRegion('RICE_galicia_region').GetName]时便备受推崇，我又怎能不去享受一番？"
 galicia.0017.a:0 "是时候前往[GetTitleByKey('b_ourense').GetNameNoTierNoTooltip]了！"
 galicia.0018.t:0 "布尔加斯温泉"
 galicia.0018.desc:0 "[GetTitleByKey('b_ourense').GetNameNoTier]拥有众多温泉，其盛名可追溯至古罗马时代。许多温泉坐落于城外，但其中最负盛名的#italic 布尔加斯温泉#!却位于城镇中心，其自远古时期便已为人所用。\n\n如今，我终于能沉浸于这温暖的泉水之中，享受前所未有的疗愈与放松。"
 galicia.0018.a:0 "$lesbos.0012.a$"
 galicia.0019.t:0 "xxxxx"
 galicia.0019.desc:0 "xxxxx"
 galicia.0019.a:0 "xxxxx"
 galicia.0020.t:0 "改建神祠"
 galicia.0020.desc:0 "在[chaplain.GetTitledFirstName]的指引下，存放圣雅各伯遗体的神祠以及墓穴的其他部分被摧毁并重新设计，以适应[santiago.GetNameNoTier]的大教堂，更好地容纳每天来此朝圣的外地人。\n\n许多当地人谴责了我们的行为。旧墓虽然简陋逼仄，但却是由圣雅各伯的弟子建造的，所以他们担心我们的行为是一种亵渎圣者的行为，会招致神的惩罚。奇怪的是，他们没有意识到我们的改建实际上是对圣雅各伯的尊重。显然他们是自私的，关心自己多于关心朝圣者。\n\n奇怪的是，抗议者来自[santiago.GetNameNoTier]的各行各业，从农民和商人到小贵族和牧师！他们都有自己的想法。有传言说，他们中的一些人，联合组成一个反对我的团体。"
 galicia.0020.a:0 "我已经改造了神祠了，祈求我不需要再改动它。"
 galicia.0020.tooltip:0 "当地人最终会明白大势所趋。无论如何，他们也不敢发动任何暴力抵抗，亵渎像圣地亚哥大教堂这样的圣地。"
 galicia.0021.t:0 "改建神祠"
 galicia.0021.desc:0 "[santiago.GetNameNoTier]已经成为计欧洲继罗马和耶路撒冷之后最重要的[christian.GetAdjective]朝圣者的目的地。他们都想看看圣雅各伯的坟墓因为他是耶稣基督的伟大使徒。\n\n然而圣雅各伯的原始简陋的坟墓并不是为了容纳大量的游客而设计的。因此，在[chaplain.GetFullName]等当地教会当局的建议下，其统治者[diego_gelmirez.GetTitledFirstName]最近下令拆除原圣地亚哥的神龛和祭坛，并建造一个新的神龛。\n\n虽然整个基督教世界的许多人都欢迎这一变化，但似乎[santiago.GetNameNoTier]的许多居民，包括当地的神职人员，并不赞同这种欢庆的感觉。他们认为对神圣的亵渎。"
 galicia.0021.a:0 "对于整个[christian.GetAdjective]群体来说，这是一个伟大的日子！"
 galicia.0021.b:0 "我看......基督徒是一个有趣的群体。"
 galicia.0022.t:0 "圣地亚哥缺乏信仰"
 galicia.0022.desc:0 "从圣地[santiago.GetNameNoTier]传来令人震惊的谣言，说有一个秘密的#italic 兄弟会#!，由当地[christian.GetAdjective]社区的许多成员组成。他们来自社会的各个阶层，包括当地的牧师、小贵族、农民、商人，以及许多城市中的官员。\n\n他们对我的现在统治没有意见，但与该市的[christian.GetAdjective]当局有冲突。他们声称教会主教是暴君，无视他们的合法权利和宗教传统，以放纵外国朝圣者的怪念头。这些胆大妄为的傻瓜们以多种方式抵抗他们，如在教会的财产上竖起栅栏来恐吓朝圣者。\n\n虽然这是多年前发生的事，但对圣雅各伯坟墓的改动尤其让他们痛心疾首。他们#italic 仍然#!认为这是一种亵渎圣人的行为，尽管主教们保证这是必要的，而且得到了教宗的批准。毫无疑问，圣地亚哥支持的是我们，而非这些傻瓜！"
 galicia.0022.a:0 "我发现他们缺乏信仰，令人不安。"
 galicia.0022.tooltip:0 "在[santiago.GetNameNoTier]，紧张局势正在上升，但只要[christian.GetAdjective]教会当局保持冷静，肯定不会发生什么……"
 galicia.0023.t:0 "圣地亚哥的暴乱"
 galicia.0023.desc:0 "可怕的消息！在[santiago.GetNameNoTier]的'兄弟会'已经煽动[christian.GetAdjective]人民举旗暴乱与其说是反对我，不如说是反对教会当局。\n\n暴乱者已经走上街头，赶走了他们鄙视的朝圣者，并冲进了城市的大教堂，以他们认为合适的方式破坏它。这些自欺欺人的傻瓜声称，因为大教堂在圣雅各伯墓被改变时就被亵渎了，所以这个地方不再被认为是神圣的。\n\n目前，这群暴徒控制了大教堂和城市，因为城市的大多数守卫都站在他们一边。我不能轻举妄动，因为城市的领导人仍然尊重我的权威，只是不尊重教会当局的权威。说到这里，[diego_gelmirez_priest.GetTitledFirstName]在这次袭击发生时就在大教堂。我担心暴徒会对[diego_gelmirez_priest.GetHerHim]做什么！"
 galicia.0023.a:0 "我们必须找到一种方法，小心翼翼地恢复秩序！"
 RICE_galicia_diego_gelmirez_attack_tt:0 "暴徒们四处搜寻[santiago.GetNameNoTier]，寻找[diego_gelmirez_priest.GetFirstName]。"
 RICE_galicia_diego_gelmirez_attack.minor_wounds:0 "[diego_gelmirez_priest.GetSheHe|U]侥幸逃过一劫"
 RICE_galicia_diego_gelmirez_attack.major_wounds:0 "暴徒攻击[diego_gelmirez_priest.GetHerHim]，但[diego_gelmirez_priest.GetSheHe]幸存下来。"
 RICE_galicia_diego_gelmirez_attack.dies:0 "暴徒们野蛮地对[diego_gelmirez_priest.GetFirstNameNoTooltip]进行私刑，并杀死了[diego_gelmirez_priest.GetHerHim]"
 galicia.0024.t:0 "混乱的圣地亚哥"
 galicia.0024.desc.intro:0 "来自[santiago.GetNameNoTier]群体正在传播该城刚刚发生的起义的消息。当地人以不寻常的方式团结起来，发动起义反对[christian.GetAdjective]教会当局。\n\n他们的不满包括无视他们的政治特权和宗教习俗，最重要的是，在[diego_gelmirez_ruler.GetTitledFirstName]下修缮圣雅各伯的神祠时，“亵渎”了该结构。[santiago_ruler.GetTitledFirstName]已经采取了外交和军事措施来说服叛乱分子退让，但混乱已经造成。\n\n[diego_gelmirez_priest.GetTitledFirstName]，[santiago_ruler.GetFirstNamePossessiveNoTooltip][diego_gelmirez_priest.GetCouncilTitle]，当暴徒袭击城市大教堂时，他也在场；他们的目标是[diego_gelmirez_priest.GetHerHim]，因为[diego_gelmirez_priest.GetSheHe]是宗教领导人的象征。"
 galicia.0024.desc.minor_wounds:0 "神奇的是，也许是由于神的干预，当暴徒将[diego_gelmirez_priest.GetSheHe]追入燃烧的钟楼时，[diego_gelmirez_priest.GetHerHim]成功逃脱。当建筑坍塌时，[diego_gelmirez_priest.GetSheHe]伪装成一个普通教士逃走了。"
 galicia.0024.desc.major_wounds:0 "暴徒们追上了[diego_gelmirez_priest.GetHerHim]，野蛮地殴打[diego_gelmirez_priest.GetHerHim]，然后试图用石头砸[diego_gelmirez_priest.GetHerHim]。虽然[diego_gelmirez_priest.GetSheHe]在混乱中设法逃脱，但因此也受了重伤。"
 galicia.0024.desc.dies:0 "就在[diego_gelmirez_priest.GetHerHim]试图伪装成普通教士逃跑的时候，暴徒们抓住了[diego_gelmirez_priest.GetSheHe]。他们把怒气发泄在[diego_gelmirez_priest.GetHerHim]身上，用石头把不幸的[diego_gelmirez_priest.GetWomanMan]砸死了。"
 galicia.0024.desc.conclusion:0 ""
 galicia.0024.a:0 "谁知道这将如何影响圣地亚哥的朝圣之旅？"
 galicia.0024.b:0 "让这些蠢货们就这样自相残杀！"
 RICE_galicia_1117_rebellion_context_tooltip:0 "#emphasis 历史背景：#!1116年至1117年的圣地亚哥起义是一场试图推翻该市首任大主教迭戈·赫尔米雷斯的行动，这是当地人多年来对教会当局的不满的高潮。\n\n赫尔米雷斯于1100年担任主教后，就致力于加强教会的中央集权，并将该市打造成一个重要的朝圣中心。例如，他对当地的神职人员实施了更严格的规定，并削减了许多当地人（至少在他们看来）为了朝圣者而放弃的权利。特别是，他对圣雅各伯之墓进行了修缮，这在许多当地人看来是对圣墓的亵渎，因为据说它是由使徒的门徒建造的。最终，当地人感觉这座城市不再是他们的家园，而是被成群的外国朝圣者和专横无能的赫尔米雷斯所控制。\n\n1116年，该市的贵族和当地的神职人员组成了一个反对赫尔米雷斯的秘密兄弟会。在随后的起义中，许多当地人支持他们夺回被朝圣者“占领”的本地空间。\n\n赫尔米雷斯本人被一群暴徒追到了大教堂的钟楼，他们放火焚烧了钟楼。他设法逃脱了，并且在起义失败后，他仍然掌握着圣地亚哥的权力。他继续推行扩建大教堂和鼓励进一步朝圣的计划，但最终没有解决与当地人的紧张关系的根本问题。1136年发生了一场更短暂的第二次起义；它也没有带来任何持久的变化。"
