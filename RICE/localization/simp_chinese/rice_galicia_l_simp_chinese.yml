 game_concept_cantiga:0 "加利西亚抒情诗"
 game_concept_cantigas:0 "加利西亚抒情诗"
 game_concept_cantiga_desc:0 "在[GetGeographicalRegion('world_europe_west_iberia').GetName]的基督徒说$language_iberian_name$[language|E]并具有$heritage_iberian_name$[heritage|E]，或具有$tradition_RICE_galician_portuguese_poetry_name$[tradition|E]的[culture|E]。并拥有特定[trait|E]或者[skill|E]的人，在达到$culture_era_high_medieval$[era|E]或发现$innovation_chronicle_writing$[innovation|E]后，可以使用$RICE_galicia_cantiga_decision$[decision|E]。\n\n这个[decision|E]可以让你用以下三种风格中的一种创作一首加利西亚抒情诗：\n\n$EFFECT_LIST_BULLET$#italic 加利西亚情诗#!：男性视角下的宫廷爱情之歌，大部分悲伤、赞美风格\n$EFFECT_LIST_BULLET$#italic 加利西亚情诗#!：女性视角下的宫廷爱情之歌，大部分浪漫、色情风格\n$EFFECT_LIST_BULLET$#italic 加利西亚讥讽诗#!：讽刺政治、道德的诗歌\n\n一旦你完成创作，你会得到一些[prestige|E]和[piety|E]。如果你的加利西亚抒情诗[cantiga_quality|E]在行云流水和拍案叫绝之间，你会获得一个[character_modifier|E]。行云流水或者拍案叫绝[cantiga_quality|E]的加利西亚抒情诗可以通过$RICE_galicia_promote_cantiga$[decision|E]来变成[artifacts|E]，这样你就可以永久地保留它们的效果以及奖励。"
 game_concept_cantiga_quality:0 "质量"
 game_concept_cantiga_quality_desc:0 "每个你创作的[cantiga|E]（来自$RICE_galicia_cantiga_decision$[decision|E]）都被认为具有一定的质量水平。有三个级别的水平，分别为：#Y 强差人意#!，#G 行云流水#!，#D 拍案叫绝#!。\n\n[cantiga|E]质量越高，你在作曲后获得的奖励就越多。如果在行云流水或拍案叫绝的水平那么会获得一个随机效果的[character_modifier|E]。同时你会获得一个[decision|E]，$RICE_galicia_promote_cantiga$，用[cantiga|E]制作一本[artifact|E]。\n\n[cantiga|E]品质由[skills|E]或者[traits|E]来决定的，并且受到$tradition_RICE_galician_portuguese_poetry_name$[tradition|E]影响，以及你之前是否有创作过抒情诗。"
 game_concept_santiago_modifier:0 "圣地亚哥增益"
 game_concept_santiago_modifiers:0 "圣地亚哥增益"
 game_concept_santiago_modifiers_desc:0 "积极的[character_modifiers|E]与圣雅各伯相关，可通过[decision|E]向$RICE_galicia_pray_to_santiago$祈祷获得各种军事和个人加成，此过程需消耗[piety|E]。该[decision|E]对所有[realm_capital|E]位于[GetGeographicalRegion('world_europe_west_iberia').GetName]且达到最低[piety_level|E]要求的基督教[rulers|E]开放，但需先由圣地亚哥（位于[GetGeographicalRegion('world_europe_west_iberia').GetName]西北部）的基督教[ruler|E]采用$RICE_galicia_alter_saint_james_tomb$[decision|E]。\n\n当你采用此[decision|E]时，有一定概率会获得代表圣雅各伯不同面向的增益[character_modifier|E]。这些$game_concept_santiago_modifiers$的效果取决于当前[iberian_struggle|E]的[struggle_phase|E]或结束该斗争时所采取的[decision|E]。\n\n若你所属的[culture|E]拥有$heritage_iberian_name$[heritage|E]，或属于[iberian_struggle|E]中的[struggle_involved|E]，此[decision|E]所需的成本更低，且获得良好结果的概率更高。[virtues|E]与[GetTrait('zealous').GetName( GetPlayer )][trait|E]，以及[sins|E]与[GetTrait('cynical').GetName( GetPlayer )][trait|E]也会对获得更好[modifier|E]的几率产生轻微正面或负面影响。[piety_level|E]同样有助于降低成本和提升获得良好结果的概率。\n\n若你因改信其他[faith|E]而不再符合这些[character_modifiers|E]的条件，将立即失去这些加成。"
 activity_galicia_compose_cantiga:0 "休息于专注加利西亚抒情诗创作"
 activity_galicia_compose_cantiga_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]休息于专注加利西亚抒情诗创作"
 RICE_galicia_saint_james_infrastructure_close:0 "圣雅各伯之路（靠近）"
 RICE_galicia_saint_james_infrastructure_close_desc:0 "当地领主最近努力改善这里的基础设施，以支持沿着圣雅各伯之路前往圣地亚哥德孔波斯特拉的朝圣者。这个地区靠近圣地亚哥因此接待了大量的朝圣者。"
 RICE_galicia_saint_james_infrastructure_midrange_high:0 "圣雅各伯之路（中端，高度掌控）"
 RICE_galicia_saint_james_infrastructure_midrange_high_desc:0 "当地领主最近改善这里的基础设施，以支持沿着圣雅各伯之路前往圣地亚哥—德孔波斯特拉的朝圣者。这个地区离圣地亚哥的距离适中，朝圣时当地对此高度掌控。"
 RICE_galicia_saint_james_infrastructure_distant_high:0 "圣雅各伯之路（遥远，高度掌控）"
 RICE_galicia_saint_james_infrastructure_distant_high_desc:0 "当地领主最近改善这里的基础设施，以支持沿着圣雅各伯之路前往圣地亚哥—德孔波斯特拉的朝圣者。虽然这个地区离圣地亚哥的距离遥远，朝圣时当地对此高度掌控。"
 RICE_galicia_saint_james_infrastructure_midrange_low:0 "圣雅各伯之路（中端，混乱）"
 RICE_galicia_saint_james_infrastructure_midrange_low_desc:0 "当地领主最近改善这里的基础设施，以支持沿着圣雅各伯之路前往圣地亚哥—德孔波斯特拉的朝圣者。这个地区离圣地亚哥的距离适中，朝圣时当地对此无法有效掌控局势，因此基础设施改善的收益降低。"
 RICE_galicia_saint_james_infrastructure_distant_low:0 "圣雅各伯之路（遥远，混乱）"
 RICE_galicia_saint_james_infrastructure_distant_low_desc:0 "当地领主最近改善这里的基础设施，以支持沿着圣雅各伯之路前往圣地亚哥—德孔波斯特拉的朝圣者。这个地区离圣地亚哥的距离遥远，朝圣时当地对此无法有效掌控局势，因此基础设施改善的收益降低。"
 RICE_galicia_saint_james_modifier_warrior_minor:0 "圣地亚哥勇士（小规模代祷）"
 RICE_galicia_saint_james_modifier_warrior_minor_desc:0 "基督的宗徒——圣雅各伯，据说会在战斗中出现帮助正义的基督徒。伊比利亚的虔诚基督徒应该效仿他的儿子#italic 马塔莫罗斯#!，成为摩尔人的杀手，勇敢的和异教徒战斗。\n\n#weak 这个[santiago_modifier|E]是由于$RICE_galicia_pray_to_santiago$的[decision|E]而获得的，因为[iberian_struggle|E]目前处于[struggle_phase_iberia_hostility|E]阶段或通过#bold $struggle_iberia_ending_hostility_decision$#![decision|E]来结束。如果该角色皈依了非基督教的[faith|E]，它将移除。#!\n"
 RICE_galicia_saint_james_modifier_warrior_major:0 "圣地亚哥勇士（大规模代祷）"
 RICE_galicia_saint_james_modifier_warrior_major_desc:0 "$RICE_galicia_saint_james_modifier_warrior_minor_desc$"
 RICE_galicia_saint_james_modifier_warrior_great:0 "圣地亚哥勇士（强大的代祷）"
 RICE_galicia_saint_james_modifier_warrior_great_desc:0 "$RICE_galicia_saint_james_modifier_warrior_minor_desc$"
 RICE_galicia_saint_james_modifier_pilgrim_minor:0 "圣地亚哥朝圣者（小规模代祷）"
 RICE_galicia_saint_james_modifier_pilgrim_minor_desc:0 "基督的宗徒——圣雅各伯，他在当时经历了艰难困苦的旅程，与许多朝圣者相似。伊比利亚的虔诚基督徒应该效仿他的榜样，相信上帝的怜悯，并忍受他们所面临的任何斗争。\n\n#weak 这个[santiago_modifier|E]是由于$RICE_galicia_pray_to_santiago$的[decision|E]而获得的，因为[iberian_struggle|E]目前处于[struggle_phase_iberia_compromise|E]或者[struggle_phase_iberia_opportunity|E]，也可以通过#bold $struggle_iberia_ending_compromise_decision$#![decision|E]来结束。如果该角色皈依了非基督教的[faith|E]，它将移除。#!\n"
 RICE_galicia_saint_james_modifier_pilgrim_major:0 "圣地亚哥朝圣者（大规模代祷）"
 RICE_galicia_saint_james_modifier_pilgrim_major_desc:0 "$RICE_galicia_saint_james_modifier_pilgrim_minor_desc$"
 RICE_galicia_saint_james_modifier_pilgrim_great:0 "圣地亚哥朝圣者（巨大规模代祷）"
 RICE_galicia_saint_james_modifier_pilgrim_great_desc:0 "$RICE_galicia_saint_james_modifier_pilgrim_minor_desc$"
 RICE_galicia_saint_james_modifier_preacher_minor:0 "圣地亚哥的传教士（小规模代祷）"
 RICE_galicia_saint_james_modifier_preacher_minor_desc:0 "基督的宗徒——圣雅各伯，他到遥远的伊比利亚去传扬福音。伊比利亚的虔诚基督徒应该记住这一点，并效仿他的榜样，践行美德，通过圣洁的话语给世界带来和平。\n\n#weak 这个[santiago_modifier|E]是通过$RICE_galicia_pray_to_santiago$[decision|E]获得的，因为[iberian_struggle|E]目前处于[struggle_phase_iberia_conciliation|E]阶段或者通过#bold $struggle_iberia_ending_conciliation_decision$#![decision|E]而结束，如果该角色皈依了非基督教的[faith|E]，它将移除。#!\n"
 RICE_galicia_saint_james_modifier_preacher_major:0 "圣地亚哥的传教士（大规模代祷）"
 RICE_galicia_saint_james_modifier_preacher_major_desc:0 "$RICE_galicia_saint_james_modifier_preacher_minor_desc$"
 RICE_galicia_saint_james_modifier_preacher_great:0 "圣地亚哥的传教士（巨大规模代祷）"
 RICE_galicia_saint_james_modifier_preacher_great_desc:0 "$RICE_galicia_saint_james_modifier_preacher_minor_desc$"
 RICE_galicia_recently_altered_the_altar:0 "最近对圣雅各伯的祭坛进行的改建"
 RICE_galicia_recently_altered_the_altar_desc:0 "世俗和教会的基督教当局最近对圣地亚哥的圣雅各布神祠进行重大修缮，以便更好的吸引和容纳朝圣者。然而许多当地人对此并不满意。他们一致团结抗议，认为神祠被亵渎了，但是当局无视他们的抗议，而贪婪地引进更多的外国朝圣者。"
 RICE_galicia_altered_saint_james_tomb:0 "有争议的圣雅各伯神祠修缮工程"
 RICE_galicia_way_of_saint_james_supporter:0 "支持圣雅各伯之路"
 RICE_galicia_way_of_saint_james_supporter_nonchristian:0 "作为一个非基督徒，支持圣雅各伯之路"
 RICE_galicia_way_of_saint_james_robber_baron:0 "对圣地亚哥朝圣者征收额外的过路费"
 RICE_galicia_way_of_saint_james_robber_baron_nonchristian:0 "对非基督徒的圣地亚哥朝圣者征收额外的过路费"
 RICE_galicia_saint_james_tolls_close:0 "对圣地亚哥朝圣者的额外收费（靠近）"
 RICE_galicia_saint_james_tolls_close_desc:0 "当地领主对沿着圣雅各布之路旅行的朝圣者征收额外的通行费，因为这个地区紧邻圣地亚哥所以有巨大的利益。这些领主只是敲诈勒索者和强盗男爵吗？不，他们可能声称，“我们只是需要'捐款'来保护朝圣者！他们应该感谢！他们应该心存感激！”"
 RICE_galicia_saint_james_tolls_midrange_high:0 "对圣地亚哥朝圣者征收额外费用（中端，高度掌控）"
 RICE_galicia_saint_james_tolls_midrange_high_desc:0 "当地领主对沿着圣雅各伯之路的朝圣者征收额外的过路费，由于这个地区靠近圣地亚哥，而且政局稳定，所以有利可图。那么这些领主只是敲诈者和不虔诚的强盗男爵吗？不，他们会声称，“我们只是需要'捐赠'来保护朝圣者！他们应该感谢！他们应该心存感激！”"
 RICE_galicia_saint_james_tolls_distant_high:0 "对圣地亚哥朝圣者征收额外费用（遥远，高度掌控）"
 RICE_galicia_saint_james_tolls_distant_high_desc:0 "当地领主对沿着圣雅各伯之路的朝圣者征收额外的过路费，虽然这个地区离圣地亚哥很远，但政局稳定，仍有利润可图。那么这些领主只是敲诈者和不虔诚的强盗男爵吗？不，他们会声称，“我们只是需要'捐赠'来保护朝圣者！他们应该感谢！他们应该心存感激！”"
 RICE_galicia_saint_james_tolls_midrange_low:0 "对圣地亚哥朝圣者征收额外费用（中端，混乱）"
 RICE_galicia_saint_james_tolls_midrange_low_desc:0 "当地领主对沿着圣雅各伯之路的朝圣者征收额外的过路费，即使这个地方政局不稳，但它靠近圣地亚哥，所以还是有利可图。那么这些领主只是敲诈者和不虔诚的强盗男爵吗？不，他们会声称，“我们只是需要'捐赠'来保护朝圣者！他们应该感谢！他们应该心存感激！”"
 RICE_galicia_saint_james_tolls_distant_low:0 "对圣地亚哥朝圣者的额外税（遥远，混乱）"
 RICE_galicia_saint_james_tolls_distant_low_desc:0 "当地领主对沿着圣雅各伯之路的朝圣者征收额外的过路费，即使这个地方政局不稳且离圣地亚哥遥远，并没有多少朝圣者愿意付钱，但小钱也是钱。那么这些领主只是敲诈者和不虔诚的强盗男爵吗？不，他们会声称，“我们只是需要'捐赠'来保护朝圣者！他们应该感谢！他们应该心存感激！”"
 RICE_galicia_recently_promoted_cantiga:0 "广为传阅的加利西亚抒情诗"
 RICE_galicia_recently_promoted_cantiga_desc:0 "该角色最近创作了一首案叫绝的加利西亚抒情诗，大家纷纷抄写并将其广泛传播。"
 RICE_currently_compiling_CSM:0 "目前正在编纂《圣母玛利亚颂歌集》"
 RICE_currently_compiling_CSM_desc:0 "这个人物目前正在努力创作，编纂可能是最伟大的中世纪音乐合集之一的#italic 《圣母玛利亚颂歌集》#!\n\n#weak 这个修正将在《圣母玛利亚颂歌集》编纂完成后被移除。如果这个人物在这之前去世，他的继承人将继承这个修正。#!"
 RICE_currently_expanding_CSM:0 "目前正在扩大《圣母玛利亚颂歌集》收录范围"
 RICE_currently_expanding_CSM_desc:0 "这个人物目前正在努力收录歌曲并编入#italic 《圣母玛利亚颂歌集》#!里，这可能是最伟大的中世纪音乐合集之一。\n\n#weak 这个修正buff将在《圣母玛利亚颂歌集》收录扩大完成后移除，如果这个人物在这之前去世，他的继承人将#bold 不会#!继承这个修正。#!"
 RICE_galicia_discovered_saint_james_tomb:0 "被发现的圣雅各伯之墓"
 RICE_galicia_santiago_tomb_recently_discovered:0 "发现圣雅各伯之墓"
 RICE_galicia_santiago_tomb_recently_discovered_desc:0 "最近在这里发现了传说中基督的使徒圣雅各伯的坟墓。根据当地的传说，在他殉道后一艘石船将他的尸体运到伊比利亚西北部。无论如何，四面八方的虔诚者涌向这里。"
 RICE_galicia_found_saint_james_tomb:0 "携手寻找圣雅各伯的坟墓"
 RICE_galicia_recently_fortified_coastline:0 "最近加固的加利西亚沿海地区"
 RICE_galicia_learning_about_barallete:0 "学习加利西亚黑话"
 RICE_galicia_discouraged_trial_by_rocking_stones:0 "摇石乐队的《失望的审判》"
 RICE_galicia_tales_of_britons:0 "关于加利西亚的古代不列颠居民的传闻"
 RICE_galicia_horreo_info:0 "关于加利西亚传统粮仓的珍贵信息"
 RICE_galicia_bought_horses:0 "买下加利西亚马"
 RICE_galicia_sold_horses:0 "向邻近地区出售加利西亚马"
 RICE_galicia_kept_horses:0 "大量的加利西亚马"
 RICE_galicia_moura_blessing:0 "莫拉之洞的祝福"
 RICE_galicia_forbade_offerings_to_a_local_moura:0 "禁止的莫拉山洞祭品"
 RICE_galicia_forbade_offerings_to_a_local_moura_desc:0 "当地领主最近禁止这里的人们向莫拉（即加利西亚民间地下精灵）供奉，据说莫拉居住在这个地区的一个著名洞穴里。当地人担心莫拉会不高兴，而且他们对当地领主认为他们的习俗只是毫无意义的迷信而感到不满。"
 RICE_galicia_inspired_by_saint_james:0 "被圣雅各伯故事所激励"
 RICE_galicia_inspired_by_queen_lupa:0 "被卢帕女王的故事所激励"
 RICE_galicia_offered_criminals_a_second_chance:0 "给予强盗贵族的第二次机会"
 RICE_galicia_offered_criminals_a_second_chance_desc:0 "按照欧洲部分地区的惯例，这位统治者最近给了一些非法敲诈朝圣者的小贵族和骑士一个悔过自新的机会，讽刺的是他们自己也成了圣地亚哥的朝圣者。"
 RICE_galicia_punished_pilgrim_extortionists:0 "惩罚敲诈朝圣者的强盗贵族"
 RICE_galicia_locals_wary_of_criminal_pilgrims:0 "当地人对虚伪的朝圣者心怀警惕"
 RICE_galicia_locals_wary_of_criminal_pilgrims_desc:0 "大量的朝圣者在前往圣地亚哥的途中会经过这个地区，朝圣者中有许多希望通过朝圣来忏悔自己的罪行并避免受到惩罚的罪犯。许多当地人对这些罪犯的存在感到不满。"
 RICE_galicia_closely_monitoring_criminal_pilgrims:0 "密切关注任何罪犯朝圣者"
 RICE_galicia_closely_monitoring_criminal_pilgrims_desc:0 "大量的朝圣者在前往圣地亚哥的途中经过这一地区，朝圣者中有许多希望通过朝圣来忏悔自己的罪行并避免受到惩罚的罪犯。当地领主对这些罪犯很警惕，并采取了措施密切监视他们，以确保他们不会造成任何麻烦，尽管这让一些主教们感到不安。"
 RICE_galicia_pilgrim_settlers:0 "圣雅各伯之路上的朝圣定居者"
 RICE_galicia_pilgrim_settlers_desc:0 "有些前往圣雅各布之路的朝圣者会在结束朝圣后，会在途中的城镇或村庄定居，并开始新生活。这个地区最近有大量这样的人涌入，他们决定在几个聚居地定居下来。"
 RICE_galicia_recent_1117_uprising:0 "圣地亚哥最近遭受叛乱"
 RICE_galicia_recent_1117_uprising_desc:0 "圣地亚哥‑德孔波斯特拉的基督教居民最近以一种不同寻常的行动而团结起来反对该地的教会当局，他们认为这些主教是亵渎神明的罪人。虽然事情目前已经稳定下来，但这次暴乱在短期内造成了很大的损失。"
 RICE_galicia_wrote_cantiga_music_1:0 "创作了一首关于音乐的加利西亚抒情诗"
