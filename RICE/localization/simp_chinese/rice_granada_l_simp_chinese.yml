 RICE_granada_garnata_al_yahud_tensions:0 "格拉纳达紧张局势的犹太人"
 RICE_granada_garnata_al_yahud_tensions_desc:0 "传说格拉纳达是几个世纪前的犹太人流亡者建立的。这座城市的大部分人口是犹太人，因此在阿拉伯语中，这座城市通常被称为“犹太人的格拉纳达”。现在格拉纳达已经取代伊比拉成为区域中心，其他团体已经安顿下来，他们与犹太人之间关系比较紧张——有些人担心有一天会爆发针对犹太人的暴力事件。\n\n#italic 尽管[county_modifier|E]处于活跃状态，但格拉纳达[county|E]的[rulers|E]仍然会有才华横溢的犹太流浪者来到在他们的宫廷中服务，然而，未来当地人的反犹太情绪会达到沸点……#!"
 RICE_granada_garnata_al_yahud_jews_dominant:0 "犹太人在格拉纳达的影响"
 RICE_granada_garnata_al_yahud_jews_dominant_desc:0 "传说格拉纳达是几个世纪前的犹太人流亡者建立的。这座城市的大部分人口是犹太人，因此在阿拉伯语中，这座城市通常被称为“Garnata‑al‑Yahud”（“犹太人的格拉纳达”）。由于历史和现在的各种趋势，虽然不时出现轻微的紧张局势，但这座城市被称为犹太人的避风港，犹太精英在该地区的领导中具有很大的影响力。\n\n#italic [county_modifier|E]处于活跃状态，格拉纳达[county|E]的[rulers|E]会接待有才华的犹太廷臣在他们的宫廷中任职。#!"
 RICE_granada_garnata_al_yahud_jews_accepted:0 "格拉纳达接受犹太人"
 RICE_granada_garnata_al_yahud_jews_accepted_desc:0 "传说格拉纳达是几个世纪前的犹太人流亡者建立的。这座城市的大部分人口是犹太人，因此在阿拉伯语中，这座城市通常被称为“Garnata al‑Yahud”（“犹太人的格拉纳达”）。由于各种历史和当前趋势，尽管不时会出现轻微的紧张局势，但犹太人已成为格拉纳达社会的一部分，并且可能会留在这里。\n\n#italic 目前[county_modifier|E]处于活跃状态，格拉纳达[county|E]的[rulers|E]有时可能会接待有才华的犹太廷臣在他们的宫廷中服务。#!"
 RICE_granada_transferred_to_granada:0 "格拉纳达的新中心"
 RICE_granada_transferred_to_granada_desc:0 "该地区的旧中心伊比拉并不适合防守，因为它位于平原上。而格拉纳达位于更崎岖的地形上，更容易防守。当地的统治者已开始将地方权力中心所在地转移到那里。"
 RICE_granada_lingering_tensions_light:0 "挥之不去的反犹情绪"
 RICE_granada_lingering_tensions_light_desc:0 "格拉纳达几代人以来一直是许多犹太人的家园，其中许多人是该市的知名官员。最近，反犹太情绪几乎达到沸点，可能导致不必要的死亡，但地方当局利用娴熟的外交手段在事态失控之前恢复了秩序。虽然非犹太人和他们的犹太邻居之间仍然存在着挥之不去的紧张关系，但格拉纳达的犹太人为避免悲剧而松了一口气，这座城市因其作为（相对）宽容的避风港而吸引远方的犹太人。"
 RICE_granada_lingering_tensions_high:0 "明显的反犹情绪"
 RICE_granada_lingering_tensions_high_desc:0 "格拉纳达几代人以来一直是许多犹太人的家园，其中许多人是该市的知名官员。最近，反犹太情绪几乎达到沸点，可能导致许多不必要的死亡，但地方当局在事态失控之前使用武力恢复了秩序。虽然现在非犹太人和他们的犹太邻居之间的紧张关系已经平息，但他们并没有完全消失——至少现在还没有。"
 RICE_granada_pogrom_happened:0 "格拉纳达大屠杀"
 RICE_granada_pogrom_happened_desc:0 "格拉纳达世世代代居住着许多犹太人，其中许多人是该市的重要官员。最近，反犹太情绪达到了沸点，一群暴徒谋杀了一位被指控与城市的敌人密谋的著名犹太行政人员，然后来到该市的犹太人区屠杀他们能找到的任何犹太人。犹太幸存者逃往别处，暴力破坏了该城市的经济和稳定。"
