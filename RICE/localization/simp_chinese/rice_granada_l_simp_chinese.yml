 granada.0060.t:0 "假期开始"
 granada.0060.desc:0 "经过一番准备，我终于来到了我在乡下的#italic 穆妮亚#!。在接下来的几天里，我将在庄园中放松身心、享受生活。\n\n当然，私人度假并不意味着我不能从事一些有趣的活动。那些有钱有势拥有这些穆妮亚的人，往往会资助当地学者进行植物和农艺实验。因此我准备检查一下正在赞助的项目是如何进行的。如果我能获得一些新的见解来帮助我管理领地或给别人留下深刻印象，那将是意外之喜。\n\n另一方面，也许假期应该只是为了纯粹的放松。"
 granada.0060.a:0 "周围农田的最新作物是什么？"
 granada.0060.a.tooltip:0 "选择此选项可能会获得管理领土和农业事务的新见解。"
 granada.0060.b:0 "我很好奇我的园丁和植物学家在做什么。"
 granada.0060.b.tooltip:0 "选择此选项，你有可能会获得有关植物的有益的知识。"
 granada.0060.c:0 "这是放松的时候，不要做任何有压力的事情。"
 granada.0060.c.tooltip:0 "选择此选项会损失更多[stress|E]，但会被剥夺获得其他奖励的机会。"
 granada.0061.t:0 "假期结束"
 granada.0061.desc:0 "所有美好的事情都结束了。虽然我在#italic 穆妮亚#!玩得很开心，但是我必须回去继续工作，因为这是我作为[ROOT.Char.GetTitleAsNameNoTooltip]的职责！\n\n尽管如此，我很高兴有机会从生活的压力中解脱出来。像这样下乡总是能让[ROOT.Char.GetWomanMan]的精神焕发活力，我期待着下一次度假。"
 granada.0061.a:0 "我相信我迟早会回来的。"
 granada.0062.t:0 "穆妮亚的农业"
 granada.0062.desc:0 "许多#italic 穆妮亚#!比如我自己的花园也兼作种植园，从美味的水果和蔬菜到糖，再到桑树的生丝。虽然我花了很多时间在我的#italic 穆妮亚#!庄园放松，但我很想看看我庄园里其他地方的状况如何。\n\n在我穿越田野和果园时，我曾聘请监工和一些专门从事农学研究的学者来提供指导。也许我应该问问他们最近从他们的工作中学到了什么。当我休假回来时，这些信息可能会派上用场，并帮助我履行作为这个地区[ROOT.Char.GetTitleAsNameNoTooltip]的职责"
 granada.0062.a:0 "询问作物产量和生产情况"
 granada.0062.a.title:0 "你获得有关农业的见解！"
 granada.0062.b:0 "询问储存食物的方法"
 granada.0062.b.title:0 "你获得有关贮存食物的见解！"
 granada.0063.t:0 "我的穆妮亚园艺"
 granada.0063.desc:0 "乡下的#italic 穆妮亚#!在庄园内或附近通常有相当大的花园。鲜花、灌木、树木和其他植物——既有伊比利亚的本土植物，也有来自遥远国度的异国植物——都以美观的方式摆放在一起，旁边还有迷人的人行道、长椅以及喷泉和池塘等与水有关的建筑景观。\n\n我喜欢享受我的#italic 穆妮亚#!的花园，但我也想看看我的员工在做什么。专门研究植物学的园丁、工人和学者不仅维护着我的花园，有时还会做一些实验用来了解这些植物。\n\n我应该问问他们是否学到了什么有趣的东西。这些信息可能会在我回去后派上用场，也许能帮助我找到打动别人的方法，或者让我能更好地打理宫廷花园。"
 granada.0063.a:0 "询问伊比利亚园艺的新风潮"
 granada.0063.a.title:0 "你将获得有关园艺的见解！"
 granada.0063.b:0 "询问这些植物的特性"
 granada.0063.b.title:0 "你将获得有关草药和药物的见解！"
 granada.0064.t:0 "在穆妮亚放松"
 granada.0064.desc:0 "虽然我可以在我的#italic 穆妮亚#!上做很多有趣的事情，例如与我的监督员讨论附近的农田是如何耕种的，或者调查我的园丁和植物学家正在进行的最新实验，但我来这里主要是为了放松才来这里。\n\n到目前为止，一切都很愉快，这些天完全没有做任何事情——或者至少没有什么费力的事情。我全天享用了几顿美餐和午睡，在花园里散步或骑马穿越乡村，也许还从事一些简单的乐趣，例如阅读卷轴。"
 granada.0064.a:0 "生活真美妙。"
 granada.0064.a.title:0 "你休息得非常好！"
