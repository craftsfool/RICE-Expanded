 RICE_granada_munya_insights_farmland:0 "在穆妮亚学到的新知识（农作物产量）"
 RICE_granada_munya_insights_farmland_desc:0 "该伯爵领的统治者最近在他们的一栋[munyas|E]度假，这是安达卢斯精英在安达卢斯乡村拥有的乡村庄园。在他们的别墅里，统治者根据这个[munya|E]里的学者正在进行的实验和研究了解了农学的一些最新发展，以及学习这些知识用于帮助他们提高领地的农业产量。"
 RICE_granada_munya_insights_foodstuffs:0 "在穆妮亚学到的新知识（粮食储备）"
 RICE_granada_munya_insights_foodstuffs_desc:0 "该角色最近在他们的一栋[munyas|E]度假，在这座别墅中，该角色了解到他们在[munya|E]的园丁和厨师如何开发出一种新的菜肴，并以美味的方式为他们准备饭菜。"
 RICE_granada_munya_insights_ornamental_plants:0 "在穆妮亚学到的新知识（观赏植物）"
 RICE_granada_munya_insights_ornamental_plants_desc:0 "该角色最近在他们的一栋[munyas|E]度假，在这座别墅中，该角色了解到，他们的园丁最近发明了一种新方法来展示他们花园中美丽的花卉和植物，甚至开始将一种新的外来植物物种融入到他们的花园。"
 RICE_granada_munya_insights_medicine:0 "在穆妮亚学到的新知识（药用植物）"
 RICE_granada_munya_insights_medicine_desc:0 "该角色最近在他们的一栋[munyas|E]度假，在他们的穆妮亚别墅里，该角色了解到他们所资助的在这栋[munya|E]做实验的学者们最近了解到他们花园中种植的某些草药和植物的一些新的有益应用。"
 RICE_granada_munya_vacation_famed_gardens:0 "著名的穆妮亚花园"
 RICE_granada_munya_vacation_famed_gardens_desc:0 "该角色的[munyas|E]，遍布整个安达卢斯地区并且以无与伦比的精致外观的花园而闻名。"
 RICE_granada_munya_vacation_famed_intellectual:0 "知名穆妮亚学者"
 RICE_granada_munya_vacation_famed_intellectual_desc:0 "该角色的[munyas|E]，因成为学者、诗人和其他有学问的人聚在一起进行伟大的知识和文学讨论的地方而享有盛誉。"
 RICE_granada_munya_vacation_famed_partier:0 "著名的穆妮亚派对"
 RRICE_granada_munya_vacation_famed_partier_desc:0 "该角色的[munyas|E]，以其惊人的派对而闻名，那些有幸被邀请参加该角色田园旅行的贵族们肯定会玩得很开心！"
 RICE_granada_vacationed_at_a_munya:0 "最近在一个[munya|E]"
 RICE_granada_almeria_silk_industry:0 "伊比利亚丝绸业制造中心"
 RICE_granada_almeria_silk_industry_desc:0 "在科尔多瓦工业衰落后，阿尔梅里亚是伊比利亚丝绸生产的主要中心。丝绸编织在这里十分发达，阿尔梅里亚靠近安达卢西亚南部的其他丝绸生产中心。这座城市也是西地中海最大的港口之一，其丝绸流传甚广。阿尔梅里亚丝绸如此具有传奇色彩，在整个欧洲和北非都受到赞誉以及十分抢手。"
 RICE_granada_invested_in_almeria_silks:0 "投资阿尔梅里亚丝绸"
 RICE_granada_invested_in_almeria_silks_desc:0 "这个人在发展阿尔梅里亚的丝绸工业方面发挥了重要作用，以至于它已经超越科尔多瓦成为伊比利亚丝绸生产的主要中心。"
 RICE_granada_granadan_jew:0 "格拉纳达犹太人"
 RICE_granada_granadan_jew_desc:0 "这个犹太角色在格拉纳达的犹太社区出生和长大，该社区是（或曾经是）伊比利亚犹太人的主要中心，在那里他们在政治、文学等艺术方面学到了很多东西。"
