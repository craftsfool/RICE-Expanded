 game_concept_alhambra:0 "阿尔罕布拉宫"
 game_concept_alhambra_desc:0 "阿尔罕布拉宫是位于格拉纳达的一座宏伟的宫殿和堡垒建筑群。一旦阿尔罕布拉宫的第二级[special_building|E]建成，格拉纳达[county|E]的[rulers|E]就可以采用一生一次（如果你的[stewardship|E]或者[learning|E]很高，则是一生两次）的[decision|E]来#bold $RICE_granada_alhambra_decision$#!。\n\n你可以选择构建八种不同的结构：五种独特的和三种通用的。通用结构简单且不会有很好的奖励，但更便宜并且可以由未来的[rulers|E]再次完成。与此同时，独特的结构具有更多的特殊效果和更好的奖励，但造价更高。\n\n另外两个[decisions|E]与独特建筑有关。建造科马雷斯宫将会解锁#bold $RICE_granada_alhambra_comares_baths$#![decision|E]，你也可以建造阿尔罕布拉礼拜堂来扩展阿尔罕布拉宫以获得更多奖励。同时，#bold $RICE_granada_admire_alhambra_gardens$#![decision|E]将会在阿尔罕布拉宫[special_building|E]建成后永久解锁，但你可以通过修建#bold 赫内拉利费宫#!来扩建阿尔罕布拉宫并获得更多奖励。"
 game_concept_munya:0 "穆妮亚"
 game_concept_munyas:0 "穆妮亚"
 game_concept_munya_desc:0 "有两种与[munya|E]相关的[activities|E]，可供在[GetGeographicalRegion('world_europe_west_iberia').GetName]中拥有[realm_capital|E]，并符合某些[culture|E]和[faith|E]要求的[rulers|E]使用，信仰随穆斯林[faith|E]或具有特定中东[heritage|E]的[culture|E]。\n\n[activity|E]有两个选项，分别为：可以让自己放松的[GetActivityType( 'activity_RICE_granada_munya_vacation_private' ).GetName]，和享受他人陪伴的[GetActivityType( 'activity_RICE_granada_munya_vacation_group' ).GetName]。你有时也可能被[liege|E]邀请加入，到郊外去度假！\n\n这两种度假类型都是不同的[activities|E]，有可能提供不同的好处。例如，私人度假可能为你提供更多的机会来学习管理农业。"
