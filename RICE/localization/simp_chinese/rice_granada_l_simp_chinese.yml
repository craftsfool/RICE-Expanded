 building_type_RICE_granada_alcazaba_01:0 "马拉加城堡"
 building_type_RICE_granada_alcazaba_01_desc:0 "这座虽不宏伟却至关重要的堡垒，俯瞰着地中海，从陆地和海上双重守护着马拉加城。"
 building_RICE_granada_alcazaba_01:0 "$building_type_RICE_granada_alcazaba_01$"
 building_RICE_granada_alcazaba_01_desc:0 "$building_type_RICE_granada_alcazaba_01_desc$"
 building_RICE_granada_alcazaba_02:0 "宫殿般的$building_type_RICE_granada_alcazaba_01$"
 building_RICE_granada_alcazaba_02_desc:0 "在早期朴素防御工事的基础上扩建而成，马拉加这座坚不可摧的宫殿建筑群堪称最令人叹为观止的#italic 阿尔卡萨瓦城堡#!之一，与城市其他防御体系紧密相连。其内部还包含一座华美的宫殿，配有精致的花园、水池与浴场。"
 innovation_RICE_placeholder_01:0 "王家造船厂"
 innovation_RICE_placeholder_01_desc:0 "世界各地只要有水的地方就有造船厂，但由于伊比利亚独特的战略位置和政治斗争，统治者们想方设法支持半岛本土[Glossary( '造船厂', 'ATARAZANA_GLOSS' )]以服务于经济和军事目的。"
 RICE_unlocked_atarazanas_decision_desc:0 "解锁$RICE_atarazanas_decision$[decision|E]"
 activity_RICE_hot_springs_visit_hedionda_province_desc:0 "\n#P +++埃迪翁达温泉是位于[GetTitleByKey('b_algeciras').GetNameNoTier]与[GetTitleByKey('b_malaga').GetNameNoTier]之间的[hot_springs|E]，据当地传说，就连尤利乌斯·凯撒也曾因其治疗皮肤病的盛名而专程造访。#!\n\n#italic 这将使你获得[GetModifier('RICE_granada_hedionda_baths_modifier').GetNameWithTooltip][character_modifier|E]。不过也有一定概率转而获得更强力的[modifier|E]：[GetModifier('RICE_granada_hedionda_baths_julius_caesar_modifier').GetNameWithTooltip]。#!"
 RICE_atarazanas_modifier:0 "补贴王家造船厂"
 RICE_atarazanas_modifier_desc:0 "统治者已在本地区资助了[Glossary( '王家造船厂', 'ATARAZANA_GLOSS' )]。这些造船厂将继续建造贸易船以促进经济发展，并建造战舰以保卫海岸。"
 RICE_granada_hedionda_baths_modifier:0 "造访赫迪翁达浴场"
 RICE_granada_hedionda_baths_modifier_desc:0 "该角色近日造访安达卢西亚的赫迪翁达温泉，相传尤利乌斯·凯撒曾到访此地，以治愈自身的皮肤疾患。"
 RICE_granada_hedionda_baths_julius_caesar_modifier:0 "受赫迪翁达浴场启发"
 RICE_granada_hedionda_baths_julius_caesar_modifier_desc:0 "$RICE_granada_hedionda_baths_modifier_desc$正是得益于这次经历，从而更好的理解了利乌斯·凯撒的著名功绩。"
 RICE_atarazanas_decision:0 "资助王家造船厂"
 RICE_atarazanas_decision_tooltip:0 "[GetGeographicalRegion('world_europe_west_iberia').GetName]的[Glossary( '造船厂', 'ATARAZANA_GLOSS' )]是地中海地区最重要的造船厂之一"
 RICE_atarazanas_decision_desc:0 "数个世纪以来，由于[GetGeographicalRegion('world_europe_west_iberia').GetName]局势动荡且地处战略要冲，[Glossary( '造船厂', 'ATARAZANA_GLOSS' )]对任何寻求在西地中海取得政治和经济优势的[ruler|E]而言愈发重要，它应当为我的[realm|E]提供助力。"
 RICE_atarazanas_decision_effect_tooltip_1:0 "该[decision|E]的[gold|E]与[prestige|E]花费取决于你拥有的沿海[counties|E]数量"
 RICE_atarazanas_decision_confirm:0 "那些船将扬帆起航，驶向远方！"
 RICE_atarazanas_decision_context_tooltip:0 "#emphasis 历史背景：#!$ATARAZANA_GLOSS$"
 granada.0006.a.normal:0 "你像往常一样放松身心"
 granada.0006.a.julius_caesar:0 "你深受尤利乌斯·凯撒的启发"
