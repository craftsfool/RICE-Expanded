 granada.0030.t:0 "[hafsa.GetFirstNamePossessiveNoTooltip]之愁"
 granada.0030.desc:0 "吾爱[abu_jafar.GetFirstName]……昔时时光，我们无忧无虑，互相赋诗，月下相拥，多么幸福，宛如花园里的两只小鸟，在外也是一对受人尊敬的连理。\n\n那该死的[uthman.Custom('InsultAdjective')][uthman.Custom('InsultNoun')][uthman.GetFirstName]，横刀斩断我们的联系，[uthman.GetSheHe|U]明知道我心属于你，知道你的忠心耿耿，还是像头畜生一样对我垂涎。越来越多的阴谋和出轨行为让你不得不反抗，但[uthman.GetSheHe|U]竟以此为借口残忍地处死了你。\n\n直到现在，我仍为你哭泣。直到现在，我依旧诅咒[uthman.GetFirstNameNoTooltip]。直到现在，我心仍为你破碎，不知生活方向……"
 granada.0030.a:0 "如此如此，思念你……"
 granada.0031.t:0 "[uthman.GetFirstNameNoTooltip]的耻辱"
 granada.0031.desc:0 "“[uthman.GetFirstName]！诅咒你！千百遍！！因为你谋杀了[abu_jafar.GetFirstName]，即使是现在，我也啐弃你！”\n\n我悲愤交加，思绪喷涌，笔下文字如河流雷鸣而涌，如风暴来袭，如地震不断，我写下了这首诗，以另一种新颖而有创意的方式侮辱、嘲弄和诋毁[uthman.GetFirstNameNoTooltip]"
 granada.0031.a:0 "全世界都会知道你的恶行！"
 granada.0032.t:0 "赞美[abu_jafar.GetFirstNameNoTooltip]"
 granada.0032.desc:0 "“[abu_jafar.GetFirstName]，我仍然梦见你，梦见你的拥抱，梦见你的唇贴在我的唇上。曾经这一切多么理所当然，但还拥有时候我却不懂珍惜。”\n\n外人诧于我总穿着寡妇的丧服，因我从未与[abu_jafar.GetFirstNameNoTooltip]正式结过婚，但又如何？[abu_jafar.GetSheHe]是一位了不起的[abu_jafar.GetWomanMan]和诗人，即使是现在，我也有灵感为[abu_jafar.GetHerHim]创作一些诗歌。[abu_jafar.GetHerHis|U]的美貌、[abu_jafar.GetHerHis]的头脑和[abu_jafar.GetHerHis]那正义的心灵将永远不会被忘记。"
 granada.0032.a:0 "我的爱，再次成为我的灵感之源……"
 granada.0033.t:0 "暂别诗坛"
 granada.0033.desc:0 "“我们曾经互相交换过很多诗歌。[abu_jafar.GetFirstName]有时会主动与我交流，有时我是主动。现在，每次写诗，我都会想起那些快乐、年轻、无忧无虑的日子”\n\n如今提笔写诗无比艰难，并非灵感，而是情感，每一个诗词都在痛苦地提醒我——[abu_jafar.GetFirstNameNoTooltip]。我需要从诗歌中解脱出来……寻找其他事情做……至少暂时如此……"
 granada.0033.a:0 "我需要放松一下。"
 granada.0034.t:0 "教导他人"
 granada.0034.desc:0 "“自[abu_jafar.GetFirstName]死后，我就离开了‌尔诈我虞的宫廷政治世界，然而……慢慢地……我渴望与他人建立联系并帮助他人，难道这就是[abu_jafar.GetFirstNameNoTooltip]所希望的吗？”\n\n吾爱[abu_jafar.GetFirstNameNoTooltip]去世后，我与世孤立，生活浮浮沉沉，但我是诗人也是博学的[ROOT.Char.GetWomanMan]，在这片土地上仍然相当有名。有些人找我教他们的年轻人甚至他们想自己学习艺术。也许，这是我将精力用于有意义的事情的好方法。"
 granada.0034.a:0 "听说附近有人向我求学……"
 granada.0035.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 granada.0035.desc:0 "我诅咒[uthman.GetFirstName]、[uthman.GetSheHe]把我当成玩物，处死我的爱人[abu_jafar.GetFirstName]，不是因为政治，仅仅只是嫉妒！？\n\n我的诗歌在这片土地上广为流传，但现在我似乎更加出名了。我不知道否能真正从悲痛中痊愈，但我的诗歌，无论是侮辱[uthman.GetFirstNameNoTooltip]还是歌颂[abu_jafar.GetFirstNameNoTooltip]，都已成为传奇。\n\n我想我只能接受这一点，但远远不够，不过至少，世界不会忘记[uthman.GetFirstNameNoTooltip]的罪恶，也不会忘记[abu_jafar.GetFirstNameNoTooltip]带给我的幸福。"
 granada.0035.a:0 "这就是我生命中的转折。"
 granada.0036.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 granada.0036.desc:0 "我原谅了[uthman.GetFirstName][uthman.GetSheHe]了？怎么可能！那家伙把我当成玩物，处死我的爱人[abu_jafar.GetFirstName]，不是因为政治，仅仅只是嫉妒！？\n\n然而，正如人们常说的那样，时间是一切的疗伤药。我想确实如此，[abu_jafar.GetFirstNameNoTooltip]会希望我在[abu_jafar.GetHerHis]的死亡之后，仍能找到有意义的东西。我的诗歌在这片土地上广为流传，而我现在也的确找到了新的目标和——那就是指导他人。\n\n我想我必须接受这一点，至少我不会再让悲伤和愤怒左右我的生活。"
 granada.0036.a:0 "$granada.0035.a$"
