 granada.0010.t:0 "从伊比拉到格拉纳达"
 granada.0010.desc:0 "几代人以来，伊比拉聚居地一直是该地区的中心，位于内华达山脉脚下。然而，随着岁月的流逝，伊比拉所在位置的弊端变得越来越明显：它根本无法防御，因为它位于平坦的平原上，因此很容易受到入侵。\n\n在与我的将军和官员讨论此事后，很明显，附近的要塞城镇格拉纳达位于高地，将是一个更好的区域权力中心，并且很难被攻击。我们已经开始在格拉纳达建造新建筑，并将很快将伊比拉的大部分居民搬到那里。最后，尽管格拉纳达有一个庞大而古老的犹太社区，但这些犹太人向我们保证他们将全力合作，因为我们尽最大努力减少他们与新定居者之间的任何潜在紧张关系。"
 granada.0010.a:0 "我们将拥有制高点！"
 granada.0011.t:0 "从伊比拉到格拉纳达"
 granada.0011.desc:0 "关于[granada_relocator.GetTitledFirstName]如何在[granada_county.GetNameNoTier]发起一项重大工作，将大部分人口迁移到新的区域中心的消息在安达卢西亚传播开来。从长远来看，伊比拉的旧址被认为不适合此目的，因为该定居点位于平坦的平原上，因此难以防御。\n\n远见卓识的[granada_relocator.GetFirstNameNoTooltip]识到附近的要塞城镇格拉纳达拥有高地和崎岖的地形，将成为一个更好的区域权力中心。尽管格拉纳达以前由犹太人主导，但他们很乐意与[granada_relocator.GetFirstNameNoTooltip]合作，以确保进程顺利进行。\n\n这绝对是[granada_relocator.GetFirstNameNoTooltip]的明智之举，但它将如何影响该地区未来的军事行动还有待观察。"
 granada.0011.a:0 "他们现在占据了制高点。"
 granada.0012.t:0 "格拉纳达的犹太人崛起"
 granada.0012.desc.jewish:0 "尽管[granada_county.GetNameNoTier]一直是规模庞大的[ROOT.Char.GetFaith.GetReligion.GetAdjective]社区的所在地，但由于我作为[ROOT.Char.GetFaith.GetReligion.GetAdjective]统治者。\n\n现在，我们有很好的机会在这片美丽的土地上为自己打造一个强大的家园。唉，来自其他国家的邪恶思想和信仰试图觊觎我们所拥有的脆弱和平，所以我们必须时刻准备好保卫[granada_county.GetNameNoTierNoTooltip]。"
 granada.0012.desc.non_jewish:0 "尽管[granada_county.GetNameNoTier]一直是一个庞大的犹太社区的家园，但直到最近该地区的犹太人才真正开始主宰该地区。\n\n不管出于什么原因，他们现在是[granada_county.GetNameNoTierNoTooltip]的主要群体。虽然我不追随他们的宗教信仰，但我承认与他们相对平等地工作对我来说很重要，以确保这片美丽土地的和平与繁荣。"
 granada.0012.a:0 "[granada_county.GetNameNoTierNoTooltip]的犹太人迎来了新的一天。"
 granada.0013.t:0 "格拉纳达紧张局势升级"
 granada.0013.desc:0 "[granada.GetNameNoTier]是伊比利亚最大的犹太社区之一。甚至传说这座城市是几个世纪前由犹太人建立的。\n\n多年来，格拉纳达的领导层在当地政府中严重依赖犹太人。由于他们的少数民族地位，他们通常比可能怀有煽动叛乱或相互竞争权力和影响力的非犹太当地人更值得信赖。然而，这引起了该地区许多非犹太人的嫉妒、不满和怨恨，他们怀疑地看着我的犹太官员。\n\n最近，一位当地[ROOT.Char.GetCulture.GetName]诗人和学者写了一首恶毒的诗，诋毁格拉纳达的犹太人，声称他们是控制国家的卑鄙、不道德的人，我必须摆脱他们的管理。当然，这样一首精神错乱的诗给我留下了深刻的印象，但我听说它在这座城市的非犹太居民中引起了不小的轰动……"
 granada.0013.a:0 "我非常希望这首诗不会引起任何骚乱。"
 granada.0013.a.tooltip:0 "格拉纳达的紧张局势可能#italic 很#!快就要达到沸点……"
 granada.0014.t:0 "暴徒"
 granada.0014.desc:0 "我在[granada.GetNameNoTier]的庄园里睡觉时，我的警卫在深夜把我吵醒了——城市的街道上爆发了混乱！\n\n显然，今天早些时候有一个不实的谣言传出，说犹太官员[yusuf.GetFullName]和其他犹太人投奔了一个敌对的统治者，打开了城门，杀了我。由于最近反犹情绪高涨，一群暴徒迅速形成以“保护”这座城市。显然，我还活着并且[granada.GetNameNoTierNoTooltip]是安全的。\n\n不知不觉中，[yusuf.GetFirstName]惊慌失措地前来求救。片刻之后，暴徒冲进了我的宫殿，尖叫着他们将如何杀死“叛徒”[yusuf.GetFirstName]，然后再去处置他的犹太人同胞。我赶紧面见外面的暴徒，向他们保证我一切安好，并要求他们解散，但他们毫不理会。\n\n暴徒正在快速向[yusuf.GetFirstName]冲去，我和我的守卫几乎没有时间做出反应。"
 granada.0014.a:0 "等等，发生什么？快停下！"
 granada.0014.a.tooltip:0 "你无力阻止暴徒。"
 granada.0014.b:0 "我是你的[ROOT.Char.GetTitleAsNameNoTooltip]！冷静下来——让我们谈谈吧！"
 granada.0014.b.tooltip:0 "你试着对暴徒讲道理。"
 granada.0014.c:0 "卫兵！保护[yusuf.GetFirstName]并恢复秩序，现在就去！"
 granada.0014.c.tooltip:0 "你命令你的部队阻止暴徒。"
 granada.0015.t:0 "黑暗的一天……"
 granada.0015.desc:0 "当我收到更多来自犹太区的报告时，我揉了揉额头。情况非常严峻。\n\n昨晚，我在这样一群庞大的暴徒面前无能为力。他们冲向[yusuf.GetFirstName]，在我还没来得及做任何事情之前就杀了他。疯狂的暴徒接着向城里的犹太区进发，残杀他们所遇到的任何犹太人。他们的愤怒如此之大，以至于当时在那里的一些非犹太人也被杀害了。\n\n等到我的士兵恢复了秩序，已经有数百甚至数千无辜的人死去，幸存的犹太人也已经四散逃亡。城市的一部分被毁，我的政府也因为突然失去了许多有才能的犹太官员而濒临崩溃。"
 granada.0015.a:0 "[granada.GetNameNoTier]的黑暗一天。"
 granada.0016.t:0 "秩序已恢复"
 granada.0016.desc.peaceful:0 "接下来的一两个小时非常紧张。在我的卫兵悄悄地将[yusuf.GetFirstName]转移到一个安全的地方的同时，我尽力平静、响亮、坚定地向暴民解释，事情并没有他们想象的那样。[yusuf.GetFirstName]背叛我们心爱的城市，投靠我们的敌人，只是一个谣言而已。\n\n令我欣慰的是，我的话似乎起了作用。暴力的呼喊声渐渐平息，暴民开始散去。\n\n当天晚些时候，我去看望[yusuf.GetFirstName]，确保[yusuf.GetSheHe]没事。[yusuf.GetSheHe|U]有些惊魂未定，但还是活了下来。我接着去犹太区，安抚城里的犹太人，告诉他们不会有任何事情发生。与此同时，我和我的官员们会继续监督局势，确保这种事情不会再次发生。\n\n总而言之，感谢[ROOT.Char.GetFaith.HighGodName]，这并没有闹出大乱……我刚才还有些担心，但我们成功地避免了悲剧的发生！"
 granada.0016.desc.force:0 "在混乱的局势下，我的士兵幸好能够迅速地执行我的命令。虽然人数不占优势，但他们迅速地将[yusuf.GetFirstName]护送出去，并召来了城里其他地方的增援。\n\n不幸的是，暴民已经陷入了疯狂的状态，这些胆大妄为的愚人试图攻击我的部队，企图找到并袭击[yusuf.GetFirstName]。他们根本不是我的士兵的对手，有些暴民在随后的冲突中丧命。\n\n那天早上，我很高兴听到[yusuf.GetFirstName]安然无恙。城里的其他犹太人也遭到了一些暴力，但我的士兵设法制止了这一切。\n\n总的来说，情况本来可能更糟，但即使在今天我去犹太人区安抚城里的犹太人，告诉他们不会有任何事情发生，我也知道局势很不稳定。我和我的官员们会继续监督局势，确保这种事情不会再发生，但我的行动可能不会得到[granada.GetNameNoTier]的一些居民的赞同。"
 granada.0016.a:0 "感谢[ROOT.Char.GetFaith.HighGodName]，眼下局势重归掌控。"
 RICE_granada_1066_jewish_pogrom_context_tooltip:0 "#emphasis 历史背景：#!1066年12月30日，格拉纳达的犹太人遭到了大屠杀，这是中世纪西班牙反犹太主义的最黑暗的事件之一。死难者可能有一千到几千人之多。\n\n传统的说法是，导致大屠杀的导火索是安达卢西亚的学者和诗人阿布·伊萨克写的一首激进诗歌，他在诗中谴责犹太人在格拉纳达的统治，尤其是王国的犹太大臣优素福·伊本·哈纳吉德。奇怪的是，这个故事直到几个世纪后才出现在历史文献中。因此，即使他真的写了这首诗，也不太可能是屠杀的真正原因，因为反犹主义在格拉纳达可能已经存在了多年。\n\n无论如何，大屠杀始于12月30日，当时有谣言传出，优素福杀死了格拉纳达的国王巴迪斯，为了背叛王国投靠他们的对手阿尔梅里亚。一群暴民聚集起来，冲向优素福寻求庇护的宫殿。即使他带出了巴迪斯，证明国王还活着，暴民也把他杀死并钉在十字架上，然后向城里的犹太人区进发。\n\n幸存的犹太人逃往别处，虽然有些人在未来的几十年里会回来（但在1090年被穆拉比特王朝驱逐），格拉纳达的犹太社区却再也没有恢复过昔日的辉煌。"
 granada.0017.t:0 "阿尔梅里亚丝绸"
 granada.0017.desc:0 "丝绸是一种有利可图的贸易，在过去，[cordoba.GetNameNoTier]曾经是伊比利亚贸易的中心。然而随着伊比利亚地缘政治局势和全球贸易路线的最新变化，[cordoba.GetNameNoTier]不再能够像以前那样生产大量丝绸。\n\n当半岛上的其他统治者争先恐后地为其他地方的丝绸作坊的发展提供资金时，我很幸运能够统治[almeria.GetNameNoTier]。我认识的许多商人都告诉我，接管[cordoba.GetNameNoTier]作为伊比利亚丝绸业中心角色的完美解决方案，有些人甚至说它有朝一日可能会超过[cordoba.GetNameNoTier]。但我不确定我是否会在有生之年看到这一点。\n\n无论何种方式，[almeria.GetNameNoTier]都是西地中海最重要的港口之一，因此可以将大量丝绸出口到其他地区。毫无疑问，这将确保这座城市未来的繁荣。"
 granada.0017.a:0 "我们将从这些丝绸中赚取利益！"
 granada.0018.t:0 "阿尔梅里亚丝绸"
 granada.0018.desc:0 "当阿拉伯人和柏柏尔人第一次来到伊比利亚半岛时，他们不仅带来了伊斯兰教，还带来了其他思想和习俗，例如生产精美丝绸的方法。由于倭马亚王朝的皇室赞助，[cordoba.GetNameNoTier]很快成为了主要的丝绸生产中心。\n\n然而现在，由于伊比利亚多年的冲突以及全球贸易的变化，[cordoba.GetNameNoTier]作为领先的丝绸生产国已经衰落。丝绸作坊在许多伊比利亚城市如雨后春笋般涌现，但[almeria.GetNameNoTier]居于一切之上，因为它显然继承了[cordoba.GetNameNoTier]伊比利亚丝绸生产中心的产业。\n\n[almeria.GetNameNoTier]的精英，尤其是[silk_investor.GetTitledFirstName]已经意识到丝绸贸易的潜在利润，并开始大力投资该市的丝绸产业。作为西地中海最大的海港之一，这座城市非常适合出口所谓的阿尔梅里亚丝绸，这种丝绸的质量开始在欧洲和中东地区享有盛誉。"
 granada.0018.a:0 "这座城市将因它变得越来越重要……"
 granada.0019.t:0 "有前途的格拉纳达犹太人"
 granada.0019.desc:0 "我最近认识了我的一位官员，他来自[granada.GetNameNoTier]犹太社区，名字叫[granadan_jew.GetFullName]。\n\n[granada.GetNameNoTierNoTooltip]的犹太人拥有在伊比利亚乃至欧洲和中东其他地方无与伦比的影响力和权力。因此[granada.GetNameNoTierNoTooltip]产生了许多[granadan_jew.GetFaith.GetReligion.GetAdjective]人才和学识渊博的人，例如[granadan_jew.GetFirstNameNoTooltip]。无论我对犹太人的个人感受如何，他们在我的宫廷中不可或缺。\n\n无论如何，我听说过[granadan_jew.GetFirstNameNoTooltip]的能力。或许我应该让他进入我的宫廷，并赋予他更大的职务。例如他与我宫廷诡计多端的贵族没有联系，这可能使他成为一个有用的资产。另一方面……有些人不善待犹太人，如果我这样做，他们可能会对我持负面看法。"
 granada.0019.a:0 "我需要像他这样的能人在我身边！"
 granada.0019.b:0 "转念一想……我不需要他。"
 granada.0020.t:0 "扩建阿尔罕布拉宫"
 granada.0020.desc.intro:0 "阿尔罕布拉宫是石头、大理石、水、植物和诗歌的综合体，给人一种天堂的感觉。然而，这座宫殿群还可以进行更多的扩建和修缮，我最近已经决定了阿尔罕布拉宫的下一个宏伟建筑。"
 granada.0020.desc.structure.generalife:0 "\n\n#bold 赫内拉利费宫#!将会成为一处令所有#italic 穆妮亚#!黯然失色的#italic 穆妮亚#!。按照我的设想，这将是一座非常美丽的别墅，里面有华丽而令人叹为观止的花园，还有喷泉和运河，里面有来自达罗河的最新鲜、最清澈的水。而且，不同于往常在郊外的#italic 穆妮亚#!，这些都建在阿尔罕布拉宫旁边，所以我不必走出太远就能看到它！"
 granada.0020.desc.structure.house_of_worship:0 "\n\n我们需要一个合适的#bold 阿罕布拉[ROOT.Char.GetFaith.HouseOfWorship|U]#!满足所有居住在其中的人的精神需求。是的，在阿尔罕布拉宫里到处散落着一些祈祷室和小祈祷厅等等，但这还不够。我们需要一个合适的礼拜堂，一个我们可以真正感受到我们可以像虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]膜拜的地方，并且我们可以从[ROOT.Char.GetFaith.HighGodName]获得启发的地方。这座建筑将满足这些需求。"
 granada.0020.desc.structure.rawda:0 "\n\n拉达陵墓将是一个美丽的墓地，也是[ROOT.Char.GetDynasty.GetName]宗族成员的合适墓地。一个小庭院和花园将欢迎任何进入陵墓的人，陵墓本身将呈矩形外壳的形式。我打算安葬在这里，我希望还有我家人的许多后代，这样即使在来世，我们距离阿罕布拉的美丽和荣耀也不会太远。"
 granada.0020.desc.structure.comares_palace:0 "\n\n#bold 科马雷斯宫#!将是阿罕布拉建筑群的宏伟翼楼。是的，还有其他富丽堂皇的建筑，即使在我去世后，后人肯定还会建造更多。但科马雷斯宫将与其他宫不同。它将有一个倒影池，一个供我欢迎廷臣和客人的宏伟宝座室，以及一个在伊比利亚从未见过的大小的浴室——总而言之，这将是一个真正令人羡慕的世界！"
 granada.0020.desc.structure.court_of_the_lions:0 "\n\n阿尔罕布拉宫有许多宫殿，每一个都有其独特的美丽。我喜欢那个将被称为#bold 狮子庭院#!。它不会是最宏伟的建筑，但我会不惜一切代价完成，因为这将是技术和艺术意义上的建筑成就的壮举。它将在其主庭院设有一个带有雕刻狮子的大理石喷泉，并在其大厅中设有精致的拱顶——任何未来的游客都会留下难忘的景象。"
 granada.0020.desc.structure.generic_palatial:0 "\n\n在阿尔罕布拉，新的#bold 宫廷住宅#!永远都不嫌多。每个强大的[ROOT.Char.GetTitleAsNameNoTooltip]都需要通过诸如扩建阿尔罕布拉宫和另一座宫殿建筑群之类的伟大事迹，向他人证明自己的地位、财富和权力，尤其是向平民们展示。不然别人怎么知道尊重我？该住宅将作为内部休息和休闲的区域，以及欢迎其他宫廷使者和一个学习工作或向[ROOT.Char.GetFaith.HighGodName]祈祷的地方。"
 granada.0020.desc.structure.generic_recreational:0 "\n\n谁不喜欢一个好的#bold 花园#!，尤其是阿尔罕布拉宫的花园？这就是为什么我会在这个地方再添加一个花园。当然，有些傻瓜说这里的花园一文不值，但每个花园都是独一无二的，并且有自己独特的花卉、灌木、喷泉等，这些都为阿尔罕布拉宫的整体美景做出了贡献。我会确保从远方引进专业的园丁、植物学家和水利工程师，以确保这个花园和其他花园一样令人痴迷。"
 granada.0020.desc.structure.generic_military:0 "\n\n尽管阿尔罕布拉宫以其美丽而闻名，并且通常只是我和我宫廷的放松与休闲之所，但我们不能忘记，它毕竟仍是一座堡垒，旨在保护该地区免受外敌侵害。因此，我希望在阿尔罕布拉宫建立额外的#bold 防御工事#!。虽然它不会像阿尔罕布拉建筑群的其他部分那样华丽或令人印象深刻，但从长远来看，它将有助于这座宫殿的整体安全。"
 granada.0020.desc.conclusion:0 "\n\n这座新建筑的施工已经开始了。虽然还需要一段时间，但我相信它会成为这片人间天堂的完美补充！"
 granada.0020.a:0 "我等不及要看到它完工！"
 granada.0020.tooltip.generalife:0 "建造#bold 赫内拉利费宫#!需要耗费1‑5年。格拉纳达[county|E]的[ruler|E]在建设完成后会获得以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!150\n$EFFECT_LIST_BULLET$@piety_icon!150\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_generalife').GetNameWithTooltip][modifier|E]持续十年\n$EFFECT_LIST_BULLET$#bold $RICE_granada_admire_alhambra_gardens$#![decision|E]奖励更好\n$EFFECT_LIST_BULLET$#bold $RICE_granada_alhambra_munya_estate$#![decision|E]更便宜"
 granada.0020.tooltip.house_of_worship:0 "建造#bold 阿罕布拉礼拜厅#!需要耗费1‑5年。格拉纳达[county|E]的[ruler|E]完成后将获得以下奖励：\n$EFFECT_LIST_BULLET$@piety_icon!300\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_house_of_worship').GetNameWithTooltip][modifier|E]将持续十年\n$EFFECT_LIST_BULLET$#bold $RICE_granada_alhambra_comares_baths$#![decision|E]奖励更好\n$EFFECT_LIST_BULLET$所有[rulers|E]未来对阿罕布拉扩建时，获得更多的[piety|E]。"
 granada.0020.tooltip.rawda:0 "建造#bold 达拉陵墓#!需要1‑5年，当它完成时，格拉纳达[county|E]的[ruler|E]会获得以下奖励：\n$EFFECT_LIST_BULLET$@piety_icon!200\n$EFFECT_LIST_BULLET$@dynasty_prestige_icon!100\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_rawda').GetNameWithTooltip][modifier|E]将持续十年\n$EFFECT_LIST_BULLET$所有[rulers|E]未来对阿罕布拉扩建时，获得[dynasty_prestige|E]"
 granada.0020.tooltip.comares_palace:0 "建造#bold 科马雷斯宫#!需要耗费1‑5年。格拉纳达[county|E]的[ruler|E]完成后将获得以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!300\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_comares_palace').GetNameWithTooltip][modifier|E]将持续十年\n$EFFECT_LIST_BULLET$解锁#bold $RICE_granada_alhambra_comares_baths$#![decision|E]"
 granada.0020.tooltip.court_of_the_lions:0 "建造#bold 狮子庭院#!需要1‑5年，当它完成时，格拉纳达[county|E]的[ruler|E]会获得以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!200\n$EFFECT_LIST_BULLET$@dynasty_prestige_icon!100\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_court_of_the_lions').GetNameWithTooltip][modifier|E]将持续十年\n$EFFECT_LIST_BULLET$所有[rulers|E]未来对阿罕布拉扩建时，获得[prestige|E]奖励"
 granada.0020.tooltip.generic_palatial:0 "建造#bold 宫殿式住宅#!需要1‑5年，当它完成时，格拉纳达[county|E]的[ruler|E]会获得以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!100（如果狮子庭院[alhambra_structure|E]已经在[alhambra|E]建成，则额外获得@prestige_icon!200）\n$EFFECT_LIST_BULLET$@piety_icon!100（如果阿罕布拉礼拜堂[alhambra_structure|E]已经在[alhambra|E]建成，则额外获得@piety_icon!200）\n$EFFECT_LIST_BULLET$如果达拉陵墓[alhambra_structure|E]已经在[alhambra|E]建成，则额外获得@dynasty_prestige_icon!50\n$EFFECT_LIST_BULLET$获得持续十年的[GetModifier('RICE_granada_built_generic_palatial').GetNameWithTooltip][modifier|E]"
 granada.0020.tooltip.generic_recreational:0 "建造#bold 阿罕布拉花园#!需要1‑5年，当它完成时，格拉纳达[county|E]的[ruler|E]会获得以下奖励：\n$EFFECT_LIST_BULLET$@piety_icon!200，（ 如果阿罕布拉礼拜厅[alhambra_structure|E]已经在[alhambra|E]建成，将额外获得@piety_icon!300）\n$EFFECT_LIST_BULLET$如果狮子庭院[alhambra_structure|E]已经在[alhambra|E]建成，则额外获得@prestige_icon!100\n$EFFECT_LIST_BULLET$如果达拉陵墓[alhambra_structure|E]已经在[alhambra|E]建成，则额外获得@dynasty_prestige_icon!50 \n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_generic_recreational').GetNameWithTooltip][modifier|E]将持续十年"
 granada.0020.tooltip.generic_military:0 "建造#bold 防御工事#!需要1‑5年，当它完成时，格拉纳达[county|E]的[ruler|E]会获得以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!200（ 如果獅子庭院[alhambra_structure|E]已经在[alhambra|E]建成，将额外获得@prestige_icon!300）\n$EFFECT_LIST_BULLET$如果阿罕布拉礼拜厅[alhambra_structure|E]已经在[alhambra|E]建成，将额外获得@piety_icon!100\n$EFFECT_LIST_BULLET$如果达拉陵墓[alhambra_structure|E]已经在[alhambra|E]建成，将额外获得@dynasty_prestige_icon!50\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_generic_military').GetNameWithTooltip][modifier|E]将持续十年"
 granada.0021.t:0 "阿尔罕布拉宫的建筑完工"
 granada.0021.desc.intro.original:0 "阿尔罕布拉宫的扩建工程终于完工了！我投入的所有资金都没有白费。现在，阿尔罕布拉宫比以前更加美丽，并增加了一个新的翼楼。"
 granada.0021.desc.intro.other_builder:0 "不久前，[granada.GetNameNoTier]的前任统治者开始了一项扩建阿尔罕布拉宫的建设项目。出于某种原因，我现在统治[granada.GetNameNoTier]所以是我见证了这个项目的完成。现在阿尔罕布拉宫增加了一个新建筑，比以前更加美丽。"
 granada.0021.desc.structure.generalife:0 "\n\n这个#bold 赫内拉利费宫#!是阿尔罕布拉宫的壮观结构之一。这里有美丽的花园、令人愉快的水梯和温馨的宫殿，是伊比利亚半岛上人们所能想象的最好的度假胜地。最重要的是它位于阿尔罕布拉宫对面的一座漂亮的小山上，所以我仍然可以轻松地往返于阿尔罕布拉宫任意一处。如果我想度过一个愉快的假期，我可以在眨眼间完成！"
 granada.0021.desc.structure.house_of_worship:0 "\n\n最后，我们在阿尔罕布拉宫有了一个合适的礼拜场所。#bold 阿罕布拉[ROOT.Char.GetFaith.HouseOfWorship|U]#!将满足居住在这里的每个人的精神需求，包括我自己。虽然不是最大的[ROOT.Char.GetFaith.HouseOfWorship]，但我想说，它比大多数都优秀，如果当一个人被郁郁葱葱的花园、宁静的庭院和无与伦比的优雅和艺术建筑所包围时，然后看到阿尔罕布拉宫的美景后，不会去崇拜[ROOT.Char.GetFaith.HighGodName]吗？"
 granada.0021.desc.structure.rawda:0 "\n\n一些人可能想知道在阿尔罕布拉宫的中放一个#bold 拉达墓#!是否有点变态。但是我们为什么要否认死者的灵魂不是一个美丽的安息之地呢？如果我们在阿尔罕布拉宫享受，那么我们也有机会在死后享受它是正确的。从今以后，我和[ROOT.Char.GetDynasty.GetName]家族的其他成员，包括这个地区所有未来的统治者，都将在这里安葬。在坟墓中与我们的先祖生活，会很愉快，也有点忧郁。"
 granada.0021.desc.structure.comares_palace:0 "\n\n#bold 科马雷斯宫#!原本打算成为一座宏伟的宫殿，我毫不怀疑正是如此。外部中心是香桃木院中的一个巨大的反射池。从那里，人们可以走进一个宏伟的大使厅，它可以作为一个王座室。最重要的是，该结构还包括一个在伊比利亚从未见过的庞大澡堂。"
 granada.0021.desc.structure.court_of_the_lions:0 "\n\n#bold 狮子庭院#!是以一座有十二只狮子的大理石喷泉命名，喷泉通过水道与宫殿的其他部分相连。这个喷泉是庭院的主要景点，不够它只是阿尔罕布拉宫大拼图中的一小部分。它是如此美丽，我相信每个人都会永远记得他们第一次踏入阿尔罕布拉宫的那一刻：他们会在第一次看到喷泉的最短暂的时刻忘记如何呼吸，甚至在他们离开后阿尔罕布拉宫，每次回想起来他们无疑都会赞叹不已。"
 granada.0021.desc.structure.generic_palatial:0 "\n\n阿尔罕布拉宫已经有其他宫殿了，也许还有一些也很漂亮，但我可以称之为我的#bold 住宅#!。至少从某种意义上说，我是确保它的建造完成的人。毫无疑问，我会在那里度过很多时间，无论是放松休息还是欢迎远道而来的客人或者做我的工作处理国事。"
 granada.0021.desc.structure.generic_recreational:0 "\n\n这些#bold 花园#!只是阿尔罕布拉宫中的几个之一，但我不得不说，它们为这座宫殿建筑群增添了色彩。喷泉和运河周围精心种植了来自世界各地的鲜花、树木和灌木，让人仿佛置身于天堂。我想说没有什么比在这个花园的某个地方坐下来欣赏美景，听水流和鸟儿歌唱，感受凉爽的风吹过我的脸更好的了。这让我很满足。"
 granada.0021.desc.structure.generic_military:0 "\n\n归根结底，阿尔罕布拉宫仍然是一座堡垒，如果要发挥其作为防御堡垒的最终作用，就需要不断地维护堡垒。建设新的#bold 防御工事#!，从这个意义上说，刚刚在阿尔罕布拉宫建造的建筑很好地发挥了它们的作用。塔楼、墙壁、军营等等——这些东西将确保我们能够保护阿尔罕布拉宫，并且它的美丽永远不会被那些试图摧毁我们的人破坏甚至夷为平地。"
 granada.0021.a:0 "简直太壮观了。"
 granada.0021.tooltip.generalife:0 "$EFFECT_LIST_BULLET$#bold $RICE_granada_admire_alhambra_gardens$#![decision|E]奖励更好\n$EFFECT_LIST_BULLET$#bold $RICE_granada_alhambra_munya_estate$#![decision|E]更便宜"
 granada.0021.tooltip.house_of_worship:0 "$EFFECT_LIST_BULLET$#bold $RICE_granada_alhambra_comares_baths$#![decision|E]奖励会更好\n$EFFECT_LIST_BULLET$所有[rulers|E]当他们扩建阿罕布拉时，会获得额外的[piety|E]"
 granada.0021.tooltip.rawda:0 "$EFFECT_LIST_BULLET$所有[rulers|E]在未来对阿罕布拉宫进行扩建时，会获得[dynasty_prestige|E]。"
 granada.0021.tooltip.comares_palace:0 "$EFFECT_LIST_BULLET$对格拉纳达的[rulers|E]来说已经解锁#bold $RICE_granada_alhambra_comares_baths$#![decision|E]"
 granada.0021.tooltip.court_of_the_lions:0 "$EFFECT_LIST_BULLET$所有[rulers|E]当他们未来对阿罕布拉宫进行扩建，会获得[prestige|E]奖励。"
