 RICE_granada_munya_vacation_private_type:0 "度假类型"
 RICE_granada_munya_vacation_private_type_leisure:0 "放松"
 RICE_granada_munya_vacation_private_type_leisure_desc:0 "$EFFECT_LIST_BULLET$利用这个机会，在宁静的乡间，在[munya|E]尽可能多地休息。\n$EFFECT_LIST_BULLET$与其他选项相比，降低更多的[stress_loss_i|E][stress|E]\n\n#weak 哪个正常人会在休假时工作啊？这种时候就该懒惰到底！#!"
 RICE_granada_munya_vacation_private_type_agriculture:0 "农学"
 RICE_granada_munya_vacation_private_type_agriculture_desc:0 "$EFFECT_LIST_BULLET$[munyas|E]是农业进一步发展的重要场所。\n$EFFECT_LIST_BULLET$获得[stewardship_lifestyle|E]或[learning_lifestyle|E][experience|E]。\n$EFFECT_LIST_BULLET$有概率获得#P 正面#!且农业有关的[character_modifier|E]\n\n#weak 有一些精通农业的人可以为明智的、有远见的统治者提供有用的建议，让其子民吃得饱饱的，让领土繁荣！#!"
 RICE_granada_munya_vacation_private_type_botany:0 "园艺"
 RICE_granada_munya_vacation_private_type_botany_desc:0 "$EFFECT_LIST_BULLET$这是一个很好的时机，看看你的园丁们在你的[munya|E]里都做了些什么。\n$EFFECT_LIST_BULLET$获得[diplomacy_lifestyle|E]或[intrigue_lifestyle|E][experience|E]\n$EFFECT_LIST_BULLET$有概率获得#P 正面#!且园艺有关的[character_modifier|E]\n\n#weak 贵族或女贵族的园丁能从[munya|E]花园中培育出最复杂、最美丽的花草，肯定会赢得很多威望和别人的尊重！#!"
 RICE_granada_munya_vacation_private_length:0 "度假时长"
 RICE_granada_munya_vacation_private_length_short:0 "短暂"
 RICE_granada_munya_vacation_private_length_short_desc:0 "$EFFECT_LIST_BULLET$[munya|E]度假将持续#V 一周#!\n$EFFECT_LIST_BULLET$假期越长，你和宾客降低的[stress_loss_i|E][stress|E]就越多。\n\n#weak 世事纷扰，你只能稍作喘息，请务必珍惜这片刻的安宁。#!"
 RICE_granada_munya_vacation_private_length_medium:0 "适中"
 RICE_granada_munya_vacation_private_length_medium_desc:0 "$EFFECT_LIST_BULLET$[munya|E]度假将持续#V 一个月#!\n$EFFECT_LIST_BULLET$假期越长，你和宾客降低的[stress_loss_i|E][stress|E]就越多。\n\n#weak 虽然最后还是要回去工作，但多休几天假也没关系，只要别太过分。#!"
 RICE_granada_munya_vacation_private_length_long:0 "长久"
 RICE_granada_munya_vacation_private_length_long_desc:0 "$EFFECT_LIST_BULLET$[munya|E]度假将持续#V 三个月#!\n$EFFECT_LIST_BULLET$假期越长，你和宾客降低的[stress_loss_i|E][stress|E]就越多。\n\n#weak 有时候，你只需要逃离一切，能逃多久就逃多久。眼下或许正是这样的时刻。#!"
