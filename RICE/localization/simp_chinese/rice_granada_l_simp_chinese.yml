 RICE_granada_hafsa_mourning:0 "哀悼阿布·贾法尔"
 RICE_granada_hafsa_mourning_desc:0 "女诗人哈芙莎至今仍在悼念她的爱人、格拉纳达总督阿布·赛义德·奥斯曼的宫廷官员兼诗人阿布·贾法尔。妒火中烧的总督想将美丽的哈芙莎据为己有，两人因此发生冲突，阿布·贾法尔最终被处死。"
 RICE_granada_aspiration_hafsa_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$在[GetTrait('RICE_hafsa').GetName( GetNullCharacter )][trait|E]的[trait_level_track|E]达到#V 100#![trait_level_track_xp|E]，方法是多次采用$RICE_granada_hafsa_decision$[decision|E]，以获得[GetTrait('RICE_hafsa_full_rage').GetName( GetNullCharacter )]或[GetTrait('RICE_hafsa_full_recovery').GetName( GetNullCharacter )][trait|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$如果[GetTrait('RICE_hafsa').GetName( GetNullCharacter )][trait|E]替换为[GetTrait('RICE_hafsa_full_rage').GetName( GetNullCharacter )][trait|E]，则获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$如果[GetTrait('RICE_hafsa').GetName( GetNullCharacter )][trait|E]替换为[GetTrait('RICE_hafsa_full_recovery').GetName( GetNullCharacter )][trait|E]，则获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![piety|E]"
 RICE_granada_historical_aspiration_action_hafsa:0 "#italic 吾爱阿布·贾法尔的去世，让我悲痛欲绝，我已不知道生活通往何方，我也不知如何走出悲伤。#!$RICE_granada_aspiration_hafsa_desc$"
 RICE_granada_historical_aspiration_modifier_desc_hafsa:0 "[GetModifier('RICE_granada_aspiration_successfully_process_grief').GetNameWithTooltip]"
 RICE_granada_aspiration_successfully_process_grief:0 "[RICE_aspiration|E]：从悲伤中走出"
 RICE_granada_aspiration_successfully_process_grief_desc:0 "#italic 哈芙莎深爱的诗人阿布·贾法尔的去世无疑让她心碎万分，不知道哈芙莎能否从绝望和悲伤中恢复过来。#!$RICE_granada_aspiration_hafsa_desc$\n\n"
 trait_RICE_hafsa:0 "心碎"
 trait_RICE_hafsa_desc:0 "该角色仍在悼念深爱的诗人阿布·贾法尔，并在努力处理悲痛。\n\n#weak 在[traveling|E]时选择相关的[travel_options|E]，就能提升该特质等级。\n\n#weak 该[trait|E]启用$RICE_granada_hafsa_decision$[decision|E]。如果任一[trait_level_track|E]达到#V 100#![trait_level_track_xp|E]，那么该[trait|E]将基于[trait_level_track_xp|E]替换为[GetTrait('RICE_hafsa_full_rage').GetName( GetNullCharacter )]或[GetTrait('RICE_hafsa_full_recovery').GetName( GetNullCharacter )][trait|E]。#!"
 trait_RICE_hafsa_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]仍在悼念深爱的诗人阿布·贾法尔，并在努力处理悲痛。\n\n#weak 该[trait|E]启用$RICE_granada_hafsa_decision$[decision|E]。如果任一[trait_level_track|E]达到#V 100#![trait_level_track_xp|E]，那么该[trait|E]将基于[trait_level_track_xp|E]替换为[GetTrait('RICE_hafsa_full_rage').GetName( GetNullCharacter )]或[GetTrait('RICE_hafsa_full_recovery').GetName( GetNullCharacter )][trait|E]。#!"
 trait_track_RICE_hafsa_rage:0 "悲愤"
 trait_track_RICE_hafsa_rage_desc:0 "#weak 雷霆啊，传我深情的信笺，\n潜入夜的深处。\n若他忆起，如何激荡我心怀，\n如细雨般绵密的敲击。#!"
 trait_track_RICE_hafsa_recovery:0 "愈合"
 trait_track_RICE_hafsa_recovery_desc:0 "#weak 神啊，请祢赐予慈悲的恩泽。\n予那些在泪河中沉浮的灵魂，\n逝去之人的微笑再不复见，\n泪滴如井水般被夺走。#!"
 trait_RICE_hafsa_full_rage:0 "悲痛之怒"
 trait_RICE_hafsa_full_rage_desc:0 "该角色深爱的诗人阿布·贾法尔，多年前被残酷处决。因此她将悲痛化为愤怒，成为一位著名且脾气暴躁的文学家。\n\n#weak 在[traveling|E]时选择相关的[travel_options|E]，就能提升该特质等级。\n\n#weak 该[trait|E]启用$RICE_granada_hafsa_decision$[decision|E]的$RICE_eulogize_abu_jafar_name$和$RICE_insult_uthman_name$选项。#!"
 trait_RICE_hafsa_full_rage_character_desc:0 "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]深爱的诗人阿布·贾法尔，多年前被残酷处决，因此她将悲痛化为愤怒，成为一位著名且脾气暴躁的文学家。\n\n#weak 该[trait|E]启用$RICE_granada_hafsa_decision$[decision|E]的$RICE_eulogize_abu_jafar_name$和$RICE_insult_uthman_name$选项。#!"
 trait_RICE_hafsa_full_recovery:0 "愈合如初"
 trait_RICE_hafsa_full_recovery_desc:0 "该角色深爱的诗人阿布·贾法尔，多年前被残酷处决。不过她如今从悲痛中痊愈，将精力投入到教书育人。\n\n#weak 在[traveling|E]时选择相关的[travel_options|E]，就能提升该特质等级。\n\n#weak 该[trait|E]启用$RICE_granada_hafsa_decision$[decision|E]的$RICE_eulogize_abu_jafar_name$和$RICE_insult_uthman_name$选项。#!"
 trait_RICE_hafsa_full_recovery_character_desc:0 "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]深爱的诗人阿布·贾法尔，多年前被残酷处决。不过[ROOT.GetCharacter.GetSheHe|U]如今从悲痛中痊愈，将精力投入到教书育人。\n\n#weak 该[trait|E]启用$RICE_granada_hafsa_decision$[decision|E]的$RICE_stop_poetry_name$和$RICE_teach_others_name$选项。#!"
 RICE_granada_hafsa_decision:0 "忧伤之路"
 RICE_granada_hafsa_decision_tooltip:0 "记忆有时浮现心头。"
 RICE_granada_hafsa_decision_desc:0 "阿布·贾法尔，吾爱，哪怕你早已死去，但我的心依然渴望着你！"
 RICE_granada_hafsa_decision_effect_tooltip_1:0 "[GetTrait('RICE_hafsa').GetName( GetNullCharacter )][trait|E]达到#V 100#![trait_level_track_xp|E]后将替换为[GetTrait('RICE_hafsa_full_rage').GetName( GetNullCharacter )]或[GetTrait('RICE_hafsa_full_recovery').GetName( GetNullCharacter )][trait|E]，并禁用相反[trait_level_track|E]的选项。"
 RICE_granada_hafsa_decision_effect_tooltip_2:0 "你在$trait_track_RICE_hafsa_rage$[trait_level_track|E]获得#V [EmptyScope.ScriptValue('RICE_hafsa_insult_uthman_xp_gain_min')|0]#!和#V [EmptyScope.ScriptValue('RICE_hafsa_insult_uthman_xp_gain_max')|0]#![trait_level_track_xp|E]。"
 RICE_granada_hafsa_decision_effect_tooltip_3:0 "你在$trait_track_RICE_hafsa_rage$[trait_level_track|E]获得#V [EmptyScope.ScriptValue('RICE_hafsa_eulogize_abu_jafar_xp_gain_min')|0]#!和#V [EmptyScope.ScriptValue('RICE_hafsa_eulogize_abu_jafar_xp_gain_max')|0]#![trait_level_track_xp|E]。"
 RICE_granada_hafsa_decision_effect_tooltip_4:0 "你在$trait_track_RICE_hafsa_recovery$[trait_level_track|E]失去#V [EmptyScope.ScriptValue('RICE_hafsa_stop_poetry_xp_gain_min')|0]#!和#V [EmptyScope.ScriptValue('RICE_hafsa_stop_poetry_xp_gain_max')|0]#![trait_level_track_xp|E]。"
 RICE_granada_hafsa_decision_effect_tooltip_5:0 "你在$trait_track_RICE_hafsa_recovery$[trait_level_track|E]失去#V [EmptyScope.ScriptValue('RICE_hafsa_teach_others_xp_gain_min')|0]#!和#V [EmptyScope.ScriptValue('RICE_hafsa_teach_others_xp_gain_max')|0]#![trait_level_track_xp|E]。"
 RICE_granada_hafsa_decision_confirm:0 "即使现在，我的心也仍隐隐作痛！"
 RICE_granada_hafsa_decision_context_tooltip:0 "#emphasis 历史背景：#!哈芙莎·宾特·哈吉·鲁库尼亚是12世纪安达卢西亚最伟大的诗人之一。年轻时，她与同为诗人的阿布·贾法尔展开热恋，而阿布·贾法尔恰好也是穆瓦希德王子兼格拉纳达总督——奥斯曼的官员。然而，奥斯曼自己却爱上了这位女诗人，并与阿布·贾法尔发生了冲突，后者最终参与了反对总督的叛乱。哈芙莎余生都在为阿布·贾法尔哀悼，她退出了宫廷生活，但后来接受了邀请，成为马拉喀什多位穆瓦希德王子的教师。"
 CHOOSE_HAFSA_ACTION:0 "$RICE_granada_hafsa_decision_confirm$"
 RICE_insult_uthman_name:0 "侮辱奥斯曼"
 RICE_insult_uthman_desc:0 "$RICE_insult_uthman_name$"
 RICE_insult_uthman_tooltip:0 "通过我的诗歌，世人将诅咒奥斯曼，就像我诅咒他杀害我的爱人一样！"
 RICE_eulogize_abu_jafar_name:0 "歌颂阿布‑贾法尔"
 RICE_eulogize_abu_jafar_desc:0 "$RICE_eulogize_abu_jafar_name$"
 RICE_eulogize_abu_jafar_tooltip:0 "我会永远铭记你，我的爱人，以诗为证。"
 RICE_stop_poetry_name:0 "暂别诗歌"
 RICE_stop_poetry_desc:0 "$RICE_stop_poetry_name$"
 RICE_stop_poetry_tooltip:0 "诗歌让我回想起太多与爱人的点点滴滴，我必须专注于其他事情。"
 RICE_teach_others_name:0 "教授他人"
 RICE_teach_others_desc:0 "$RICE_teach_others_name$"
 RICE_teach_others_tooltip:0 "我应该把精力转到有成效的事情上，比如教育和引导他人。"
 Abu_Ishaq_Ibrahim:0 "阿布·伊沙克·易卜拉欣"
