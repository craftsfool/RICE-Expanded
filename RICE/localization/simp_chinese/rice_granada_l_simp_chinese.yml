 RICE_granada_tower_of_cadiz:0 "加的斯的神像"
 RICE_granada_tower_of_cadiz_desc:0 "在港口城市加的斯的海岸附近有一座古老巨塔，在这座塔的顶部有一个由贵金属制成的神秘雕像，雕像是位一个带着斗篷蓄大胡子的人。没有人知道是谁建造了这座塔和它的雕像，尽管有学识的学者声称它是由海格力斯或亚历山大大帝在古代建造的。无论哪种说法，当地人都以恐惧和惊奇的眼光看待这座雕像，并相信它拥有护身符般的力量，保护他们或警告他们有危险。\n\n#italic 需要[gold|E]的[ruler|E]可以采取[decision|E]$RICE_granada_demolish_idol_cadiz$，不过他应该提防这种诱惑，因为当地民间传说，敢做这种事的人将遭受灾祸。#!"
 RICE_granada_cadiz_idol_character_curse:0 "加的斯神像的诅咒"
 RICE_granada_cadiz_idol_character_curse_desc:0 "人们说该角色是个贪婪的蠢货，下令摧毁加的斯的古老神像只为了熔了它来赚钱。现在有传言说，由于其目光短浅和对超自然世界缺乏尊重，该角色正遭受着一连串的厄运。"
 RICE_granada_cadiz_idol_county_curse:0 "加的斯神像的诅咒"
 RICE_granada_cadiz_idol_county_curse_desc:0 "当局最近摧毁了加的斯的古老神像，将其熔化以赚取一些钱。当地传说如果神像有一天被毁，不幸就会降临到加的斯，比如说没有人能够进入大海。虽然这种情况没有发生，但其他的小灾难却发生了。这真的只是一个巧合，还是迷信的当地人的传说是存在的？"
 RICE_granada_inspected_canals:0 "最近视察了格拉纳达的运河"
 RICE_granada_demolish_idol_cadiz:0 "拆除加的斯的神像"
 RICE_granada_demolish_idol_cadiz_tooltip:0 "它是由金属制成的，我们可以利用[gold|E]……"
 RICE_granada_demolish_idol_cadiz_desc:0 "在加的斯港附近有一座古塔，位于一个被称为神像区的地方。在那座塔的顶部有一个由贵金属制成的宏伟雕像。当地人声称这个雕像有超自然的力量，保护城市不受伤害，但如果我摧毁这个神像，将神像融成金属为自己所以，会如何呢？"
 RICE_granada_demolish_idol_cadiz_effect_tooltip_1:0 "一些当地人相信摧毁加的斯的神像会给你和城市带来超自然的#N 后果#!，但这只是迷信......不是吗？"
 RICE_granada_demolish_idol_cadiz_confirm:0 "拆掉那个神像！"
 RICE_granada_demolish_idol_cadiz_context_tooltip:0 "#emphasis 历史背景：#!中世纪的穆斯林文献提到了在加的斯附近存在着一座神秘的大塔和雕像。由于它在古典文献中没有发现，所以可能是属于古典晚期的遗物。像伊比利亚半岛上的其他希腊和罗马雕像一样，这个加的斯神像被中世纪的穆斯林认为具有超自然的保护力。它的原始用途不得而知——可能是作为庆祝纪念碑、墓葬，或者最有可能的是作为航运的导航辅助——因为它在12世纪被摧毁了，也许是为了将雕像熔化换钱。"
 RICE_demolish_cadiz_idol_nothing:0 "没有什么奇怪的事情发生"
 RICE_demolish_cadiz_idol_character_curse:0 "据说你会被诅咒"
 RICE_demolish_cadiz_idol_county_curse:0 "据称加的斯郡被诅咒了"
 RICE_demolish_cadiz_idol_both_curse:0 "你和加的斯伯爵领据说被诅咒了"
 granada.0003.desc.self_no_curse:0 "事实证明，在我毁掉雕像之后，什么都没有发生。没有奇怪的、巧合的不幸或灾祸，什么都没有。\n\n起初，[cadiz.GetNameNoTier]的一些当地人陷入了歇斯底里的状态，担心大海会吞噬他们、船只无法离开港口，或者其他灾难会降临到我们所有人身上，但这种什么情况都没有发生。\n\n诚然，当我的士兵和工人拆毁神像时，我有那么一瞬间的担心，但目前来看我的担心都是白费的。现在我有了一些有用的且珍贵的金属，我可以把它们熔炼，变得更富有！"
 granada.0003.desc.self_curse:0 "起初，我的士兵和雇工人拆毁加的斯神像时，我并不认为会发生什么。\n\n但我听说不久之后就发生了一些奇怪的事情。例如我会收到报告说我的住所附近或[cadiz.GetNameNoTier]附近的海边有奇怪的声音或者当地人船只经常无缘无故损坏导致无法出港\n\n至少我从雕像上得到了一些有用的且可以熔化的珍贵金属。当然所有其他的报告都只是巧合，只是迷信的当地人编造出来的虚幻故事......不是吗？"
 granada.0003.desc.other_no_curse:0 "散布在伊比利亚各地的是已逝文明的废墟纪念碑，其中许多被认为具有超自然的能力。一个比较明显的例子是所谓的#bold 加的斯的神像#!，在[cadiz.GetNameNoTier]附近俯瞰大海的巨大雕像。虽然这个雕像是由贵重金属制成的，但没有人敢为了钱而破坏它。\n\n除了[cadiz_idol_demolisher.GetTitledFirstName]。\n\n[cadiz_idol_demolisher.GetFirstName]试图获得雕像中的贵重金属，但当地人担心雕像被毁后会受到神的惩罚。无论如何[cadiz_idol_demolisher.GetSheHe]在下令拆除雕像并将其融化后，最终证明他们是错误的，因为之后没有发生任何奇怪的事情。不过这个神像以及那巨塔已经不复存在。"
 granada.0003.desc.other_curse:0 "散布在伊比利亚各地的是已逝文明的废墟纪念碑，其中许多被认为具有超自然的能力。一个比较明显的例子是所谓的#bold 加的斯的神像#!，在[cadiz.GetNameNoTier]附近俯瞰大海的巨大雕像。虽然这个雕像是由贵重金属制成的，但没有人敢为了钱而破坏它。\n\n除了[cadiz_idol_demolisher.GetTitledFirstName]。\n\n[cadiz_idol_demolisher.GetFirstName]试图获得雕像中的贵重金属，但当地人担心雕像被毁后会受到神的惩罚。[cadiz_idol_demolisher.GetSheHe]顽固地下令拆除雕像并将其熔化。不久之后[cadiz.GetNameNoTier]报告了一系列奇怪的事情，比如晚上有奇怪的声音，船只无法离开港口，以及其他奇怪的不幸事件。\n\n当然，这也行只是单纯的巧合，迷信的当地人在担心什么……"
