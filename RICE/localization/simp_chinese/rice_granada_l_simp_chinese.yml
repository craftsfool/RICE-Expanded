 granada.0050.t:0 "假期计划"
 granada.0050.desc:0 "我已经很久没有机会从忙碌的生活中休息一下了。安达卢斯的许多贵族都有自己的#italic 穆妮亚#!在乡下，他们可以在远离城市的地方放松和消磨时光。我想是该休闲的时候了。\n\n在#italic 穆妮亚#!度假并不像在未开化的异教徒的土地上那样只是为了琐碎的乐趣。这里也是农艺和植物实验的地方，也是有教养的人聚集在一起进行学术讨论的地方。\n\n总之，我很快就会参加在[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]的[ROOT.Char.GetInvolvedActivity.GetShortName]。无论人们爱好什么，在旅途中都有能玩得愉快！"
 granada.0050.a:0 "我想花一些时间一个人独处"
 granada.0050.a.tooltip:0 "如果你一个人去你的[munya|E]度假，你更有可能失去[stress|E]。如果你愿意，你也可能有机会了解农学和植物学的最新发展，以提高你的学识。"
 granada.0050.b:0 "让我们玩得开心！"
 granada.0050.b.tooltip:0 "如果你和团队一起去你的[munya|E]度假，你将有更好的机会获得[prestige|E]和[piety|E]。你还可以改善[opinions|E]受邀者对你的印象，以及你作为统治者所散发出的形象。"
 granada.0051.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 granada.0051.desc.host_likes_me:0 "我诚挚地邀请你和我一起去我的#italic 穆妮亚#!度假！几天后在[barony.GetNameNoTier]和我宫廷的其他成员一起。我向你保证我的#italic 穆妮亚#!是一个美妙的地方，你可以在这里放松和享受文人雅士的陪伴。如果你有时间的话，我很想在那里见到你。"
 granada.0051.desc.host_dislikes_me:0 "我很快就会去我的一个#italic 穆妮亚#!几天后在[barony.GetNameNoTier]和我宫廷的其他成员一起。出于礼貌，我邀请你参加我们的短途旅行。如你所知，#italic 穆妮亚#!是有教养的人（我不确定你是否算得上）聚集在一起享受彼此的陪伴。如果你想来，那么请保持你最好的行为不要让自己难堪。"
 granada.0051.a:0 "我很荣幸能在[sender.GetHerHis]#italic 穆妮亚#!度假！"
 granada.0051.a.tooltip:0 "在[munya|E]度假将使你有机会获得各种奖励，具体取决于你的兴趣以及持有者对行程的计划。"
 granada.0051.b:0 "我对此表示十分感兴趣，但遗憾的是，遗憾的是我没时间。"
 granada.0051.c:0 "你认真地吗？让[sender.GetHerHim]知道[sender.GetHerHis]度假简直是浪费人生！"
 granada.0051.c.tooltip:0 "回信给[sender.GetTitledFirstName]表达你对[sender.GetHerHis]无聊假期的不满。"
 granada.0052.opening:0 "[munya_vacation_rejector.Custom2('AppropriateGreeting', ROOT.Char)]"
 granada.0052.desc:0 "我想通知你，我拒绝你在#italic 穆妮亚#!度假的邀请！首先令我失望的是，你似乎对从事无聊的消遣更感兴趣，而不是专注于你作为[host.GetTitleAsNameNoTooltip]的职责。其次我有事先的承诺要处理，所以我比较忙。我相信你会理解的。"
 granada.0052.a:0 "我们可能会以不同的方式看待事物，但这已经足够公平了！"
 granada.0052.b:0 "[munya_vacation_rejector.GetSheHe]竟敢拒绝我的邀请！"
 granada.0053.t:0 "假期推迟……无限期"
 granada.0053.desc:0 "我收到了[host.GetTitledFirstName]刚刚去世的消息。因此[host.GetSheHe]的度假计划被取消了，[host.GetHerHis]的#italic 穆妮亚#!不用去了。"
 granada.0053.a:0 "不幸的消息"
 granada.0054.t:0 "假期推迟"
 granada.0054.desc:0 "我收到消息说[host.GetTitledFirstName]刚刚被监禁，我和任何其他客人不用再去[host.GetHerHis]的#italic 穆妮亚#!了"
 granada.0054.a:0 "多么尴尬的局面。"
 granada.0055.t:0 "假期推迟"
 granada.0055.desc:0 "我没有去我的#italic 穆妮亚#!，而是去地牢！由于我被监禁，我将不得不取消我的假期计划。希望我能尽快离开这里。"
 granada.0055.a:0 "所有的假期计划都是徒劳的"
