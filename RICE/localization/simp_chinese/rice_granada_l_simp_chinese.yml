 RICE_granada_munya_vacation_group_type_party:0 "夜夜笙歌"
 RICE_granada_munya_vacation_group_type_party_desc:0 "$EFFECT_LIST_BULLET$在[activity|E]结束时（在其他奖励的基础上）获得[prestige_i|E][prestige|E]。\n$EFFECT_LIST_BULLET$基于你的[diplomacy|E]和[intrigue|E]有几率获得[GetModifier('RICE_granada_munya_vacation_famed_partier').GetNameWithTooltip]\n\n#weak 一些富有的贵族都聚集在一个地方，远离文明，美酒美人美肉，当然是夜夜笙歌！#!"
 RICE_granada_munya_vacation_group_type_gardens:0 "欣赏美景"
