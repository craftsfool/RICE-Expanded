 granada.0040.t:0 "科马雷斯澡堂"
 granada.0040.desc:0 "沐浴在阿尔罕布拉宫的皇家浴池中是如此#italic 放松#!如此#italic 清凉#!如此#italic 美妙#!，我该用什么词语来形容呢？\n\n这座建筑的某些地方让人感觉如此平静，但总的来说阿尔罕布拉宫的大部分地方也是如此。我经常来这里，然而今天感觉比平时更好，因为我觉得我所有的烦恼都消失了。\n\n仆人帮我用肥皂擦了擦身上的杂质后，我就走到水边清洗自己。"
 granada.0040.a:0 "额……干净又卫生……"
 granada.0041.t:0 "阿尔罕布拉宫的花园"
 granada.0041.desc:0 "世界各地有很多花园，但肯定没有哪一个可以与阿尔罕布拉宫的花园相提并论。多年来，这里的花园不断扩大，树木、花卉、灌木、喷泉、运河、庭院等越来越多。\n\n我很幸运，作为[granada.GetNameNoTier]的[ROOT.Char.GetTitleAsNameNoTooltip]，我可以随时欣赏这美丽的花园。我已经有一段时间没有花一整天来欣赏我的花园了。"
 granada.0041.a:0 "阿尔罕布拉宫的一切欣赏起来总是令人心旷神怡。"
