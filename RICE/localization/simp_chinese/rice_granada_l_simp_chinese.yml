 RICE_granada_munya_vacation_private_reflection_intent:0 "思考"
 RICE_granada_munya_vacation_private_reflection_intent_desc:0 "你希望思考自己和周围的世界。你将在[lifestyle|E]中获得[experience|E]（在其他收益之上），并有概率获得一个随机的[skill|E]小幅增长。如果你拥有[GetTrait('diligent').GetName( GetNullCharacter )]特质，你也会失去[stress_loss_i|E][stress|E]。"
