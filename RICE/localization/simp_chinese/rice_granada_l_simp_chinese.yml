 RICE_granada_alhambra_decision:0 "扩建阿尔罕布拉宫"
 RICE_granada_alhambra_decision_tooltip:0 "阿尔罕布拉宫正在扩建以满足不断扩大的阿尔罕布拉宫的需求。"
 RICE_granada_alhambra_decision_desc:0 "尽管[alhambra|E]以令人叹为观止、无与伦比的壮丽而闻名于世，但总有改进的余地。也许可以打造成地上天堂……"
 RICE_granada_alhambra_decision_effect_tooltip_1:0 "每个[alhambra_structure|E]成本不同#weak （最低花费：@gold_icon!100）#!"
 RICE_granada_alhambra_decision_effect_tooltip_2:0 "你选择的[alhambra_structure|E]需要1‑5年来完成；当它完成时，格拉纳达[county|E]的[ruler|E]将根据你的选择获得各种奖励，比如[piety|E]或解锁新的[decisions|E]。"
 RICE_granada_alhambra_decision_effect_tooltip_3:0 "这个[decision|E]一生只能使用#bold 一次#!（如果你有高[stewardship|E]和[learning|E]可以选择两次），所以你要谨慎选择你所建造的！"
 RICE_granada_alhambra_pick_a_structure_type:0 "选择要构建的内容"
 RICE_granada_alhambra_pick_a_structure_type_gui:0 "选择将[alhambra_structure|E]添加到[alhambra|E]"
 RICE_granada_alhambra_decision_confirm:0 "是时候开工了！"
 RICE_granada_alhambra_decision_context_tooltip:0 "#emphasis 历史背景：#!阿尔罕布拉宫（来自阿拉伯语#italic Al‑Hamra#!，意为“红色的”）是格拉纳达纳斯尔王朝的宫殿和要塞群，是中世纪摩尔式建筑的典范。它是一个独立的城市，拥有自己的设施，如澡堂和清真寺，并在13世纪到15世纪期间不断被纳斯尔王朝扩建。阿尔罕布拉宫的一个引人注目的特点是，它的许多墙壁、柱子、喷泉和其他表面都覆盖着古兰经的经文或当时诗人的诗歌，并用阿拉伯书法书写。"
 RICE_granada_alhambra_not_done_already:0 "你尚未扩建[alhambra|E]，如果你的[stewardship|E]或者[learning|E]在15以上你可以选择两次"
 RICE_granada_alhambra_currently_building:0 "当前没有[alhambra_structure|E]在[alhambra|E]建造"
 RICE_alhambra_court_of_the_lions_option:0 "#Bold 狮子庭院#!"
 RICE_alhambra_court_of_the_lions_option_desc:0 "伊比利亚无与伦比的富丽堂皇"
 RICE_alhambra_court_of_the_lions_option_tooltip:0 "#V #Bold 花费：@gold_icon! 250#!#!\n\n这个[alhambra_structure|E]完成后给予[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon! 200\n$EFFECT_LIST_BULLET$@dynasty_prestige_icon! 100\n$EFFECT_LIST_BULLET$持续十年的[GetModifier('RICE_granada_built_court_of_the_lions').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$[prestige|E]奖励给所有[rulers|E]在未来对阿尔罕布拉宫进行通用扩建时\n\n#weak 一座拥有开创性、创新建筑元素的宫殿，是安达卢西亚建筑历史的巅峰之作——从其中心庭院以大理石喷泉和精美雕刻的狮子为特色，到其大厅和拱顶上绘有重要人物的图画场景，等等，这座宫殿是肯定的让参观它的人惊叹和眼花缭乱！#!"
 RICE_alhambra_comares_palace_option:0 "#Bold 科马雷斯宫#!"
 RICE_alhambra_comares_palace_option_desc:0 "富丽堂皇的侧翼，会给许多人留下深刻印象"
 RICE_alhambra_comares_palace_option_tooltip:0 "#V #Bold 花费：@gold_icon!250#!#!\n\n这个[alhambra_structure|E]完成后给予格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!300\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_comares_palace').GetNameWithTooltip][modifier|E]将持续十年\n$EFFECT_LIST_BULLET$解锁#bold $RICE_granada_alhambra_comares_baths$#![decision|E]\n\n#weak 宏伟的宫殿式建筑，拥有几个同样引人注目的侧翼，拥有巨大倒影池的庭院，王室大厅以及科马雷斯浴场，这是伊比利亚有史以来最大的皇家浴场！#!"
 RICE_alhambra_generalife_option:0 "#Bold 赫内拉利费宫#!"
 RICE_alhambra_generalife_option_desc:0 "一个充满欢乐的花园"
 RICE_alhambra_generalife_option_tooltip:0 "#V #Bold 花费：@gold_icon!250#!#!\n\n这个[alhambra_structure|E]完成后给予格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!150\n$EFFECT_LIST_BULLET$@piety_icon!150\n$EFFECT_LIST_BULLET$获得持续十年的[GetModifier('RICE_granada_built_generalife').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$#bold $RICE_granada_admire_alhambra_gardens$#![decision|E]效果更好\n$EFFECT_LIST_BULLET$[munya|E][activities|E]开销更低\n\n#weak 一处作为[munya|E]——安达卢西亚流行的一种乡村庄园——的夏宫；这座庄园毗邻阿尔罕布拉宫，位于其对面的一座小山上，其花园使其看起来比阿尔罕布拉宫的其他地方更像天堂。#!"
 RICE_alhambra_rawda_option:0 "#Bold 米拉尔墓#!"
 RICE_alhambra_rawda_option_desc:0 "少数幸运者的最后安息之地"
 RICE_alhambra_rawda_option_tooltip:0 "#V #Bold 花费：@gold_icon!200#!#!\n\n这个[alhambra_structure|E]完成后会给格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$@piety_icon!200\n$EFFECT_LIST_BULLET$@dynasty_prestige_icon!100\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_rawda').GetNameWithTooltip][modifier|E]十年\n$EFFECT_LIST_BULLET$未来[rulers|E]对阿尔罕布拉宫进行扩建时，获得[dynasty_prestige|E]奖励会更高\n\n#weak 一个宏伟的墓地，供那些贵族血统的人使用，取代了一个现有但又小又被忽视的墓地；墓地由一个长方形结构组成，装饰着雕刻的灰泥和瓷砖。要进入它，一个人进入一个庭院，然后通过一个小的马蹄形拱门。#!"
 RICE_alhambra_house_of_worship_option:0 "#Bold 阿尔罕布拉宫[ROOT.Char.GetFaith.HouseOfWorship|U]#!"
 RICE_alhambra_house_of_worship_option_desc:0 "少数幸运者的最后安息之地"
 RICE_alhambra_house_of_worship_option_tooltip:0 "#V #Bold 奖励：@gold_icon!200#!#!\n\n这个[alhambra_structure|E]完成后会给格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$@piety_icon!300\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_house_of_worship').GetNameWithTooltip][modifier|E]将持续十年\n$EFFECT_LIST_BULLET$将奖励用于[decision|E]以此来#bold $RICE_granada_alhambra_comares_baths$#!更好\n$EFFECT_LIST_BULLET$未来[rulers|E]对阿尔罕布拉宫进行扩建时，获得[piety|E]会更高\n\n#weak 一个礼拜堂，为居住在阿罕布拉城内的人提供宗教服务；当然，不言而喻，所提供的宗教服务的具体种类在很大程度上取决于阿罕布拉当权者的信仰归属。#!"
 RICE_alhambra_generic_palatial_option:0 "#Bold 宫殿式住宅#!"
 RICE_alhambra_generic_palatial_option_desc:0 "一个无与伦比的休息场所"
 RICE_alhambra_generic_palatial_option_tooltip:0 "#V #Bold 花费：@gold_icon!100#!#!\n\n这个[alhambra_structure|E]完成后会给予格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$获得@prestige_icon!100（如果狮子庭院[alhambra_structure|E]已经在[alhambra|E]建成，则变为@prestige_icon!200 ）\n$EFFECT_LIST_BULLET$获得@piety_icon!100（ 如果阿罕布拉礼拜厅[alhambra_structure|E]已经在[alhambra|E]建成，则变为@piety_icon!200）\n$EFFECT_LIST_BULLET$如果拉达墓[alhambra_structure|E]已经在[alhambra|E]建成，则获得@dynasty_prestige_icon!50\n$EFFECT_LIST_BULLET$获得持续10年的[GetModifier('RICE_granada_built_generic_palatial').GetNameWithTooltip][modifier|E]\n\n#weak 尽管被认为不如阿尔罕布拉宫更著名的部分令人印象深刻，但仍有许多较小的宫殿、大厅、凉亭和其他建筑为该地区的美丽做出了贡献——对于一些住在阿尔罕布拉宫或经过它的人来说，这里的宁静和魅力这些鲜为人知的宫殿也不容小觑。#!"
 RICE_alhambra_generic_recreational_option:0 "#Bold 美轮美奂的花园#!"
 RICE_alhambra_generic_recreational_option_desc:0 "世界上无与伦比的建筑之美"
 RICE_alhambra_generic_recreational_option_tooltip:0 "#V #Bold 花费@gold_icon!100#!#!\n\n完成[alhambra_structure|E]后会给予格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$获得@piety_icon!200（如果阿罕布拉礼拜堂[alhambra_structure|E]已建在[alhambra|E]，则获得@piety_icon!300）\n$EFFECT_LIST_BULLET$如果狮子庭院[alhambra_structure|E]已建在[alhambra|E]，则获得@prestige_icon!100\n$EFFECT_LIST_BULLET$如果拉达陵墓[alhambra_structure|E]已建在[alhambra|E]，则获得@dynasty_prestige_icon!50\n$EFFECT_LIST_BULLET$获得持续十年的[GetModifier('RICE_granada_built_generic_recreational').GetNameWithTooltip][modifier|E]\n\n#weak 另一个花园，以及另一个精心打造的迷宫，郁郁葱葱的绿色植物和舒缓的喷泉和运河——但就像阿罕布拉的花园一样常见，每一个都只会增加更多的确定性，即阿罕布拉实际上是人间天堂。#!"
 RICE_alhambra_generic_military_option:0 "#Bold 通用防御工事#!"
 RICE_alhambra_generic_military_option_desc:0 "坚固堡垒的坚固防御工事"
 RICE_alhambra_generic_military_option_tooltip:0 "#V #Bold 花费：@gold_icon!100#!#!\n\n这个[alhambra_structure|E]完成后会给予格拉纳达的[ruler|E]以下奖励：\n$EFFECT_LIST_BULLET$@prestige_icon!200，（@prestige_icon!300 如果狮子庭院[alhambra_structure|E]已经在[alhambra|E]建成）\n$EFFECT_LIST_BULLET$@piety_icon!100，如果阿尔罕布拉礼拜厅[alhambra_structure|E]已经在[alhambra|E]建成\n$EFFECT_LIST_BULLET$@dynasty_prestige_icon!50，如果米拉尔墓[alhambra_structure|E]已经在[alhambra|E]建成\n$EFFECT_LIST_BULLET$[GetModifier('RICE_granada_built_generic_military').GetNameWithTooltip][modifier|E]持续十年\n\n#weak 塔楼、城墙、营房、地牢等等都在提醒大家，尽管阿尔罕布拉宫如此美丽，但最终它仍然是一座强大的堡垒，旨在保护该地区免受外来入侵。那些从阿罕布拉统治的人最好记住这一点，如果他们希望防止这座城市沦为入侵者。#!"
 RICE_granada_transfer_seat_of_power:0 "从伊比拉搬到格拉纳达"
 RICE_granada_transfer_seat_of_power_tooltip:0 "伊比拉的防御……远远不如格拉纳达。"
 RICE_granada_transfer_seat_of_power_desc:0 "伊比拉目前是格拉纳达地区的主要聚居地。然而它很难进行防御，因为它位于一个低矮的平原上。附近的要塞城镇格拉纳达目前由一个古老的犹太社区主导，是一个更容易防守的地方，因为它位于高地上。我们应该将该地区的权力中心从伊比拉转移到那里。"
 RICE_granada_transfer_seat_of_power_confirm:0 "我们将拥有制高点！"
 RICE_granada_transfer_seat_of_power_effect_tooltip_1:0 "大量非犹太家庭搬迁到[granada_county.GetNameNoTier]可能会导致他们与现有犹太人之间发生摩擦，导致关系紧张。"
 RICE_granada_transfer_seat_of_power_effect_tooltip_2:0 "[court|E][ruler|E]宫殿可能会出现著名犹太人[courtiers|E]"
 RICE_granada_transfer_seat_of_power_context_tooltip:0 "#emphasis 历史背景：#!在安达卢斯的早期历史中，格拉纳达并不如附近的伊比拉（或埃尔维拉）镇那么重要。在11世纪的第一个泰法时期，柏柏尔人的齐里德王朝在安达卢西亚南部建立了一个独立的国家，他们担心伊比拉因为位于低洼平原而容易受到敌人的攻击。齐里德王朝决定把他们的权力中心转移到格拉纳达，那里当时是安达卢西亚的一个主要的犹太人聚居地。"
 RICE_granada_alhambra_comares_baths:0 "在科马雷斯澡堂放松一下"
 RICE_granada_alhambra_comares_baths_tooltip:0 "我需要休息一下……"
 RICE_granada_alhambra_comares_baths_desc:0 "[alhambra|E]的科马雷斯澡堂无疑是整个伊比利亚最大和最伟大的浴场。既然我拥有这个地方，我真的应该在某个时候利用这个设施。"
 RICE_granada_alhambra_comares_baths_effect_tooltip_1:0 "你会失去一些[stress|E]并且获得[piety|E]"
 RICE_granada_alhambra_comares_baths_effect_tooltip_2:0 "因为你统治着[granada.GetNameNoTier]，并且#bold 阿罕布拉[THIS.Char.GetFaith.HouseOfWorship|U]#!并且已经建造[alhambra|E]，所以[activity|E]奖励有所增加"
 RICE_granada_alhambra_comares_baths_confirm:0 "是时候泡澡了"
 RICE_granada_alhambra_comares_baths_context_tooltip:0 "#emphasis 历史背景：#!澡堂在历史上是穆斯林社会和宗教生活的重要组成部分，包括在安达卢斯。阿尔罕布拉宫的科马雷斯宫王家澡堂由格拉纳达苏丹优素福一世（1333年‑1354年在位）下令修建，后来甚至被西班牙的天主教统治者使用，并对建筑进行了翻新。科马雷斯澡堂不仅是伊比利亚半岛最大的澡堂之一，也是伊比利亚半岛少数几个保存完好的伊斯兰澡堂。"
 RICE_granada_alhambra_comares_palace_built_req:0 "#V 科马雷斯宫#![alhambra_structure|E]已经在[alhambra|E]建成"
 RICE_granada_admire_alhambra_gardens:0 "欣赏阿尔罕布拉宫的花园"
 RICE_granada_admire_alhambra_gardens_tooltip:0 "人间天堂，正如他们所说的那样!"
 RICE_granada_admire_alhambra_gardens_desc:0 "[alhambra|E]的花园有树木、灌木丛、庭院、喷泉、运河等等，它们融合在一起，让人仿佛置身于天堂。我已经有一段时间没有时间来欣赏它们了。"
 RICE_granada_admire_alhambra_gardens_effect_tooltip_1:0 "你会失去一些[stress|E]并且获得[prestige|E]"
 RICE_granada_admire_alhambra_gardens_effect_tooltip_2:0 "因为你统治着[granada.GetNameNoTier]，并且#bold 赫内拉利费宫#!已在[alhambra|E]建造，所以[activity|E]奖励有所增加"
 RICE_granada_admire_alhambra_gardens_confirm:0 "在这里可以看到很多美景！"
 RICE_granada_admire_alhambra_gardens_context_tooltip:0 "#emphasis 历史背景：#!花园是世界各地许多中世纪精英，包括穆斯林统治者，展示其权力和财富的重要象征和方式。阿尔罕布拉宫是伊斯兰花园传统的最佳例证之一。格拉纳达靠近许多优质的水源，因此能够支持阿尔罕布拉宫的众多花园和水景，如喷泉和运河。"
 RICE_granada_alhambra_munya_estate:0 "在穆妮亚度假"
 RICE_granada_alhambra_munya_estate_tooltip:0 "我真的需要离开大城市休息一下。"
 RICE_granada_alhambra_munya_estate_desc:0 "像安达卢斯的强大[ROOT.Char.GetTitleAsNameNoTooltip]一样，我在首都附近的郊村拥有许多[munya|E]庄园。我应该花时间在这些别墅之一放松，无论是单独享受还是与他人聚会。"
 RICE_granada_alhambra_munya_estate_effect_tooltip_1:0 "你将选择是自己去你的[munya|E]独自放松或研究那里的植物，还是邀请像你的[courtiers|E]和[vassals|E]这样的其他人加入这个[activity|E]并进行社交活动"
 RICE_granada_alhambra_munya_estate_effect_tooltip_2:0 "你会失去一些[stress|E]并且获得奖励，例如[lifestyle_experience|E]或者[character_modifiers|E]"
 RICE_granada_alhambra_munya_estate_effect_tooltip_3:0 "$RICE_granada_admire_alhambra_gardens_effect_tooltip_2$"
 RICE_granada_alhambra_munya_estate_confirm:0 "是时候去庄园了！"
 RICE_granada_alhambra_munya_estate_context_tooltip:0 "#emphasis 历史背景：#!#italic 穆妮亚#!指的是中世纪安达卢斯精英阶层建造的一种乡村庄园或别墅。它们通常是被花园和广阔的农田环绕的大型住宅，具有休闲和实用的双重功能——它们既是远离城市喧嚣的娱乐和学术活动的场所，也是农业和植物实验的基地。"
 RICE_granada_develop_almeria_silk_industry:0 "补贴阿尔梅里亚不断发展的丝绸业"
 RICE_granada_develop_almeria_silk_industry_tooltip:0 "阿尔梅里亚港可能不仅仅是奢侈品的出口商……它也可以创造奢侈品。"
 RICE_granada_develop_almeria_silk_industry_desc:0 "伊比利亚的时代动荡不安，科尔多瓦古老的皇家丝绸生产中心正在衰落。商人正在寻求通过投资其他伊比利亚城市的丝绸作坊来重振伊比利亚的丝绸业，而阿尔梅里亚是一个很有前途的选择，因为它正在迅速发展成为西地中海最重要的海港之一。"
 RICE_granada_develop_almeria_silk_industry_confirm:0 "丝绸必须流动！"
 RICE_granada_develop_almeria_silk_industry_context_tooltip:0 "#emphasis 历史背景：#!科尔多瓦是伊比利亚盈利丰厚的丝绸业的最初中心，直到10世纪科尔多瓦哈里发国的崩溃。随后，阿尔梅里亚取代科尔多瓦成为伊比利亚最大的丝绸生产者，得益于它是该地区最重要的港口之一。阿尔梅里亚的丝绸闻名于世，甚至被中世纪欧洲文学中提及为奢华的象征，常被用作礼物、贡品或炫耀财富和地位。"
 granada.0001.t:0 "[granada.GetNameNoTierNoTooltip]的命运"
 granada.0001.desc:0 "我已经统治了[granada.GetNameNoTier]将近三十年，不过我的成功很大程度上归功于我已故的大臣、将军和朋友[samuel.GetFullName]。多年来，犹太人在这座城市的发展中发挥着重要作用，而我的朋友是他们中最有权势、最有天赋的人。多亏了他，我才可以在年轻时候少走许多弯路，并将我的领地建设为一个强国。\n\n唉，他去世已经很多年了。他的儿子和继任者，[joseph.GetFullName]虽然有能力，但深受骄傲之罪的折磨——甚至其他犹太人也认为他太过傲慢。[joseph.GetFirstName]以前和我关系很好，但最近我们之间的关系很紧张。我甚至听说过他在幕后控制并密谋造反的谣言。我不相信这种诽谤性的胡言乱语，但这肯定会影响我周围人对我的看法。人们已经将我视为一个残忍、贪婪的统治者，我发誓这些都不是真的，但是这些谣言只会火上浇油。"
 granada.0001.a:0 "希望事情会自行解决。"
 granada.0001.a.info:0 "#emphasis 历史背景：#!巴迪斯·伊本·哈布斯一直统治着格拉纳达，直到1073年他的孙子阿卜杜拉继承了王位。他的长子阿尔普哈拉，也就是阿卜杜拉的父亲，于1064年死于中毒。有传言说，巴迪斯的大臣、犹太学者优素福·伊本·哈纳吉德是谋杀布卢金的幕后黑手。他是著名的撒母而·伊本·哈纳吉德的儿子。不管怎样，优素福成为了1066年12月31日发生的格拉纳达大屠杀的第一个受害者。\n\n阿卜杜拉是格拉纳达泰法的最后一位统治者。1090年，他向穆拉比特王朝投降，并被流放到阿格马特。在那里，他写下了自己的回忆录，详细地——虽然有些偏颇地——记录了格拉纳达的历史。"
 granada.0002.t:0 "加的斯的神像"
 granada.0002.desc:0 "有很多古老的雕像散落在伊比利亚各地，有些人把超自然的能力归功于它们。#bold 加的斯的神像#!由于其巨大的体积和精妙的工艺，是古人的一个伟大建筑遗产。而且我想的毁掉这样一件艺术品确实很可惜，它在[cadiz.GetNameNoTier]附近矗立了几个世纪，而且有些学者声称是海格力斯或亚历山大大帝统治伊比利亚时建造的。\n\n但雕像#italic 是由金和铜等坚固的贵重金属制成#!，而我可以利用这些金属……\n\n[cadiz.GetNameNoTier]的当地人发牢骚和抱怨，说即使带着不洁的想法去触碰神像所在的塔，也可能会给自己或[cadiz.GetNameNoTier]带来巨大的不幸。但我不认为摧毁它将导致任何超自然的灾难。\n\n至少……我希望它不会。"
 granada.0002.a:0 "不过我已经做出了决定。那就是拆除雕像！"
 granada.0003.t:0 "加的斯的神像"
 granada.0003.a:0 "加的斯的神像的命运如何！"
 granada.0004.t:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]的造船厂"
 granada.0004.desc:0 "在[GetGeographicalRegion('world_europe_west_iberia').GetName]半岛上，[Glossary( '王家造船厂', 'ATARAZANA_GLOSS' )]在这个动荡的时代对维持我们的贸易与军事舰队发挥着关键作用。\n\n资助这些承担要务的造船匠人，其益处不言而喻。从我们的海岸出发，船队将扬帆远航，把地中海与大西洋的财富带回故土，或英勇地保卫我们的海岸线，抵御一切来犯之敌与劫掠者！"
 granada.0004.a:0 "这将是一笔不错的投资。"
 granada.0005.t:0 "前往赫迪翁达浴场！"
 granada.0005.desc:0 "安达卢西亚拥有众多温泉，其中一些自古代起便已为人所知。在这些温泉中，最具传奇色彩的当属位于[GetTitleByKey('b_malaga').GetNameNoTier]与[GetTitleByKey('b_algeciras').GetNameNoTier]之间群山中的赫迪翁达浴场。\n\n根据传说，伟大的尤利乌斯·恺撒也曾到访此地，治愈他患上的一种可怕的皮肤病！"
 granada.0005.a:0 "我也来试试。"
 granada.0006.t:0 "赫迪翁达浴场"
 granada.0006.desc:0 "神奇的赫迪翁达浴场坐落于崎岖的[GetTitleByKey('b_malaga').GetNameNoTier]与[GetTitleByKey('b_algeciras').GetNameNoTier]之中。哪怕只是来这里观赏风景，也已让我感到心旷神怡。\n\n据说这些浴场不仅具有药用价值，还能治愈皮肤病，更能让肌肤焕发容光。相传早在很久以前，尤利乌斯·凯撒就曾专程造访此地，以疗愈自身的皮肤顽疾。"
 granada.0006.a:0 "如今，在此休憩，一如他数百年前那般。"
