 granada.0070.t:0 "假期开始"
 granada.0070.desc:0 "我现在在我乡下的一栋#italic 穆妮亚#!游览。我一定要提前到达，检查一切是否准备好了。当第一批客人开始到达时，我以主人的身份亲切地欢迎他们，然后带他们进去。\n\n在接下来的几天里，我们将在这座美丽的别墅中享受各种娱乐活动。一些人想用庄园和周围的壮丽景色来让他们的客人眼花缭乱。其他更有教养的人可能会喜欢进行智力讨论‑例如在这些#italic 穆妮亚#!进行的植物或农学实验！或者诗歌朗诵。然而其他人只是想大吃大喝，享受美好时光。\n\n现在，我已经决定要做什么了"
 granada.0070.a:0 "让我们享受花园和远景的美丽。"
 granada.0070.a.tooltip.1:0 "你将获得[prestige|E]或者[piety|E]，而你的#italic 穆妮亚#!可能会因其美丽而闻名。"
 granada.0070.a.tooltip.2:0 "内向、矜持的客人可能会更喜欢这项活动，假期结束后会对你有更好的[opinion|E]"
 granada.0070.b:0 "让我们参与到诗歌和知识的讨论中。"
 granada.0070.b.tooltip.1:0 "你会获得[piety|E]，而你的#italic 穆妮亚#!可能会因拥有大量博学、雄辩的学者和诗人聚集而闻名。"
 granada.0070.b.tooltip.2:0 "聪明、有见解的客人可能会更喜欢这个活动，假期结束后对你有更好的[opinion|E]"
 granada.0070.c:0 "让我们尽情享受，忘记生活的烦恼！"
 granada.0070.c.tooltip.1:0 "你将会获得[prestige|E]，而你的#italic 穆妮亚#!可能会因举办大量热闹、有趣的派对而出名。"
 granada.0070.c.tooltip.2:0 "外向、善于交际的客人可能会更喜欢这项活动，假期结束后对你有更好的[opinion|E]"
 granada.0071.t:0 "假期开始"
 granada.0071.desc:0 "我终于到了[host.GetTitledFirstNamePossessive]#italic 穆妮亚#!，我注意到其他一些客人也刚到。[host.GetWomanMan][host.GetHerselfHimself]出来迎接我们并欢迎我们进入。\n\n尽管该地区的许多贵族都拥有这类别墅，包括我自己在内，但看到属于他人的别墅总是很有趣。有些人专注于用美丽的花园、可爱的建筑或令人惊叹的乡村景观来取悦游客。其他人则通过邀请熟练的诗人来从事知识和文学追求来营造一种成熟的氛围。还有一些人更喜欢吸引博学的学者留下来进行植物学或农艺学实验。\n\n不管怎样，等其他客人来了，谁知道接下来的日子里我们会享受什么娱乐呢？"
 granada.0071.a:0 "我想知道，我们的行程是什么？"
 granada.0072.t:0 "假期结束"
 granada.0072.desc:0 "所有美好的事情都结束了。在我的#italic 穆妮亚#!的最后几天，过的很有趣，但是我和我的客人必须在某个时候回到我们的日常生活中。昨晚我们举行了一场盛大的最后宴会。现在在这个美好而美丽的早晨，我们必须离开。\n\n尽管如此，我知道我们都度过了愉快的时光，这是对日常生活压力的一种很好的消遣。"
 granada.0072.a:0 "我期待下一次的旅行！"
 granada.0073.t:0 "假期结束"
 granada.0073.desc:0 "所有美好的事情都结束了，在我的#italic 穆妮亚#!的最后几天！非常有趣，我和其他[host.GetTitledFirstName]在[host.GetHerHis]#italic 穆妮亚#!放松了许多天，昨晚我们举行了一场盛大的最后宴会，现在在这个美好而美丽的早晨，我们必须离开这里。\n\n尽管如此，我知道我们都度过了愉快的时光，这是对日常生活压力的一种很好的消遣。"
 granada.0073.a:0 "也许我会在我的#italic 穆妮亚#!之一举办类似的活动。"
 granada.0074.t:0 "我的#italic 穆妮亚#!花园"
 granada.0074.desc:0 "在过去的几天里，我让我的客人在我的#italic 穆妮亚#!参观了最好、最辉煌的花园。我做了很多工作来确保这些花园里种满了各种奇妙的植物，从色彩艳丽的异国花卉到适合在下面休息的雄伟大树。我还一定要指出我安装的一些喷泉，其出色的供水系统要归功于将附近河流中的淡水输送到我的庄园的小运河。\n\n我的努力似乎得到了回报，因为我可以看到客人眼中的惊讶，因为我们在花园的一个角落里放松——有些人在长凳上，有些人直接在地上——我们在这里聊天并享受我们的时光。"
 granada.0074.a:0 "我很高兴他们喜欢花园！"
 granada.0074.a.title:0 "你的客人宣传你的花园美丽！"
 granada.0075.t:0 "[host.GetTitledFirstNamePossessiveNoTooltip]#italic 穆妮亚#!花园"
 granada.0075.desc:0 "在过去的几天里，[host.GetTitledFirstName]一直在[host.GetHerHis]#italic 穆妮亚#!向我们展示了一些最好和最美丽的花园。很明显[host.GetSheHe]为花园感到非常自豪。\n\n前几天，当我第一次走进庄园时，我顺便注意到了远处的一些花园。但近距离观察它们完全是另一回事！这些花园不仅种满了壮观的植物——从来自遥远土地的奇异而迷人的花朵，在适合的高大树下休息的，而且花园还拥有大量凉爽清新的喷泉和小运河，人们可以轻松地穿过并连续观看数小时。\n\n今天，我们在一个花园里放松，我们中的一些人坐在长凳上，其他人坐在地上。我们在这里聊天并享受我们的时光。"
 granada.0075.a:0 "我喜欢在这样令人愉快的地方社交！"
 granada.0075.a.title:0 "你喜欢在#italic 穆妮亚#!花园进行社交活动"
 granada.0075.b:0 "我想放松一下，看看风景。"
 granada.0075.b.title:0 "你喜欢在你的#italic 穆妮亚#!花园闲逛"
 granada.0076.t:0 "一个文雅的#italic 穆妮亚#!"
 granada.0076.desc:0 "除了我的客人，我还邀请了一些当地的学者和诗人参加我的#italic 穆妮亚#!。从我的休闲花园，到餐厅，到浴室，到各个庭院和聚会大厅，我看到我的许多客人互相进行各种形式的智力活动。\n\n我的一些客人正在辩论当前政治或神学和哲学问题的细微之处。其他人正在举办诗歌比赛，他们互相朗诵美丽的诗歌，无论是关于他们周围的美丽场景还是关于彼此（从讽刺到奉承）。还有一些性格比较安静的人似乎正在彼此享受一场精彩的国际象棋比赛或阅读我图书馆的卷轴。"
 granada.0076.a:0 "总的来说，这里的气氛非常有文化。"
 granada.0076.a.title:0 "你的客人会把你的文化倾向宣传出去！"
 granada.0077.t:0 "一个文雅的#italic 穆妮亚#!"
 granada.0077.desc:0 "[host.GetTitledFirstName]鼓励我们在过去几天在[host.GetHerHis]#italic 穆妮亚#!参与各种智力活动。一个伟大的[host.GetTitleAsNameNoTooltip]的，毕竟是一个有文化和学识的人，而[host.GetFirstNameNoTooltip]甚至邀请了一些当地的学者和诗人参加这次旅行。\n\n虽然这个假期不是我见过的最吵闹的假期，但它是另一种乐趣，至少对于那些更聪明的人来说是这样。每天我都会看到一些客人就政治问题、神学和哲学进行辩论。其他人则炫耀于他们的文学技巧，并参加即兴诗歌比赛。还有一些性格比较安静的人喜欢玩国际象棋游戏或阅读[host.GetFirstNamePossessiveNoTooltip]的藏书。"
 granada.0077.a:0 "这些智力讨论很有启发性"
 granada.0077.a.title:0 "你获得了一些学识上的见解"
 granada.0077.b:0 "诗歌从未像现在这样有意义。"
 granada.0077.b.title:0 "你赢得了一些诗歌比赛"
 granada.0077.c:0 "我喜欢在这里下棋和看书"
 granada.0077.c.title.1:0 "你在图书馆找到一本好书"
 granada.0077.c.title.2:0 "国际象棋比赛是有趣的游戏"
 granada.0078.t:0 "在#italic 穆妮亚#!中游玩"
 granada.0078.desc:0 "当#italic 一些#!人们去#italic 穆妮亚#!与其他人一起度假，他们可能会进行更有素养的活动，例如讨论复杂的学术问题、探索乡村或进行植物实验。我和我的客人都没有时间进行这种高压的追求了！\n\n虽然我的客人可以随心所欲（在合理范围内），但我们来这里是为了玩得开心。这几天我努力为我的客人提供充足的食物和饮料，让我们尽情享受，聆听充满活力和愉快的音乐表演，与如此令人兴奋的好人聚会谁知道如何享受生活。"
 granada.0078.a:0 "不必不高兴——我们在这里度过了愉快的时光！"
 granada.0078.a.title:0 "你的客人会把你的精彩派对宣传出去！"
 granada.0079.t:0 "在#italic 穆妮亚#!中游玩"
 granada.0079.desc:0 "当我们在[host.GetHerHis]#italic 穆妮亚#!时，[host.GetTitledFirstName]一直在为我们举办一场又一场的宴会。当然这可能不是我参加过的最盛大、最狂野的盛宴，但在乡间的漂亮庄园举办派对还是颇有别出新裁感觉。\n\n虽然我们当然可以自由地从事其他活动，但我似乎几乎没有时间给自己！在过去的几天里，我主要是在吃喝玩乐，欣赏令人愉悦的音乐表演，或者与其他人交际。毫无疑问聚集在这里的其他许多人似乎都玩得很开心。"
 granada.0079.a:0 "是时候开始我们的下一场盛宴了吗？"
 granada.0080.t:0 "丝绸产业繁荣"
 granada.0080.desc:0 "多年来，丝绸一直是[granada_duchy.GetNameNoTier]地区的主要出口产品，尤其是在[almeria.GetNameNoTier]。最近，[county.GetNameNoTier]生产的丝绸，由于种种原因，比平时更赚钱！因此获得大量贸易单，这预示着该地区的繁荣。"
 granada.0080.a:0 "我很高兴听到这个！"
 granada.0081.t:0 "丝绸业陷入困境"
 granada.0081.desc:0 "多年来，丝绸一直是[granada_duchy.GetNameNoTier]地区的主要出口产品，尤其是在[almeria.GetNameNoTier]。不幸的是，最近在[county.GetNameNoTier]生产的丝绸由于各种原因没有像以前那样好赚。也许当前某些全球贸易路线存在问题，或者今年的生丝产量不够高。"
 granada.0081.a:0 "我希望这不会对该地区的经济造成太大影响。"
 granada.0082.t:0 "[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]之美"
 granada.0082.desc:0 "今天有一位远道而来的旅人来拜访我。这个人不禁赞叹[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]之美。\n\n“我来这里之前很怀疑，”他说道，“但在这里看到所有的山谷、旱地、森林、山脉、河流……我发现很难描述这个地方的荣耀。它就像不同气候的完美融合，极端之间的完美中间地带。你很幸运能住在这里，[ROOT.Char.GetTitledFirstName]，我相信你的土地是和平而繁荣的。如果可以的话，我会在这里安顿下来，但我的命运不允许我这样做，因为我有我的职责。”"
 granada.0082.a:0 "谢谢你。要我带你看一些景点吗？"
 granada.0083.t:0 "炸茄子条"
 granada.0083.desc:0 "最近，我养成了吃炸茄子的习惯——我很感激我的厨师能做出如此美味的菜！这种小吃是由阿拉伯人带到半岛的，但从那时起，当地人就在[granada_duchy.GetNameNoTier]将它变成了他们自己的小吃，在那里它特别受欢迎。通过用蔗糖捣茄子，它们是一种独特的甜味和可口的。"
 granada.0083.a:0 "它们绝对是我最喜欢的#italic 小吃#!。"
 granada.0084.t:0 "橙子和橄榄油"
 granada.0084.desc:0 "最近，我一直在享用浸泡在橄榄油中的橙子作为我用餐的一部分。这是[granada_duchy.GetNameNoTier]的传统美食，多年前由阿拉伯人带来但现在已成为当地美食的一部分。\n\n在安达卢西亚的阳光下成熟的多汁橙子和令人惊叹的美味橄榄油……我怎么能抗拒？当然，有时它会与新鲜捕获的鳕鱼、橄榄、鸡蛋、洋葱、大蒜或我自行决定的任何香料混合……这是一道好菜。"
 granada.0084.a:0 "美味至极"
 granada.0085.t:0 "一条新运河在[granada_county.GetNameNoTierNoTooltip]？"
 granada.0085.desc:0 "[granada_county.GetNameNoTier]得天独厚，因为它位于几条主要河流的交汇处，特别是达罗河、热尼尔河、莫纳奇尔河和贝罗河。因此该市拥有丰富的淡水资源。\n\n我们刚刚发现了一个完美的位置，可以建造一条从其中一条河流进入城镇的新运河。然而我的官员对运河应该流向哪里有不同的看法。\n\n有人说最好用运河水来灌溉附近地区以扩大我们的耕地。也有人说市民最好去公共澡堂和水井。其他人认为我们应该增加新的花园和喷泉，利用运河的水来美化城市。"
 granada.0085.a:0 "投资我们的农业将是一个聪明的主意。"
 granada.0085.b:0 "澡堂和喷泉将使我们的人民快乐。"
 granada.0085.c:0 "美化城市会提高我们的声望。"
 granada.0085.d:0 "我认为我们没有新运河的资源。"
 granada.0086.t:0 "运河需要维护"
 granada.0086.desc:0 "[granada_county.GetNameNoTier]位于几条主要河流的交汇处，特别是达罗河、赫尼尔河、莫纳奇尔河和贝罗河。由于拥有如此丰富的优质水源，几个世纪以来人们建造了许多运河和渡槽将水输送到城市。\n\n然而这些运河经常穿过内华达山脉崎岖地形的部分地区并且可能年久失修。我收到消息说这样的一条运河处于可怕的状态，如果要保持运转，需要尽快进行维护工作。它穿过用于农业的区域的一些重要部分并为几个关键社区提供急需的水，因此保持良好状态至关重要。"
 granada.0086.a:0 "我的官员应该有足够的资金。"
 granada.0086.b:0 "我现在不能节省资金。"
 granada.0087.t:0 "工业部门"
 granada.0087.desc:0 "今天，我正在检查[granada_county.GetNameNoTier]的部分工业部门。该地区的几个重要工业，特别是丝织、陶器和染色工业，都位于达罗河附近，因为生产这些商品的作坊需要充足的水源来进行生产。\n\n无论如何，工业的产生恶臭诚然不是我喜欢的。然而当我与他们的主要代表、各个作坊的负责人和知名商人讨论影响到这里的工匠的问题时，我会尽力而为。"
 granada.0087.a:0 "这是我必须做的工作。"
 granada.0088.t:0 "美丽的土地"
 granada.0088.desc:0 "有人说[granada_duchy.GetNameNoTier]的土地是世界上最美丽的地方之一——它是郁郁葱葱和干旱的完美结合，由于受到阿拉伯语、柏柏尔和拉丁影响。在这里统治领土……也许我可以认为自己很幸运。"
 granada.0088.a:0 "的确，我有幸能统治这样一片美好的土地。"
 granada.0088.b:0 "我相信这世界上还有其他美好的土地。"
 granada.0089.t:0 "来自达罗河的黄金"
 granada.0089.desc:0 "达罗河边总是能发现少量的黄金，这是流经[granada_county.GetNameNoTier]的主要河流之一。然而最近我收到消息说，不知出于什么原因，这里比以前更容易找到黄金。\n\n因此今天我派了一些仆人去河边淘金。他们刚刚带着这些黄金回来，虽然黄金不是很多，但比我预期的要多。"
 granada.0089.a:0 "干得好！"
 granada.0090.t:0 "检查[granada_county.GetNameNoTierNoTooltip]的运河"
 granada.0090.desc:0 "今天，我正在检查[granada_county.GetNameNoTier]中的一些运河。其中许多运河将达罗河的水输送到城市的各个区，但也有一些来自附近的其他河流，如吉尼尔河。\n\n无论是哪种方式，我都能及时了解这些运河的情况，这是一件好事。它们不仅是为当地人提供饮水、洗澡、耕作、工作等用水的必要条件，而且我必须知道这些运河的位置，是否有需要维修或进一步改善的地方，以及在敌人围攻我们或发生自然灾害时我们可以依靠哪些运河。"
 granada.0090.a:0 "现在，让我们继续参观……"
