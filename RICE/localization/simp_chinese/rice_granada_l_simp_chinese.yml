 RICE_granada_munya_vacation_private_exploration_intent_desc:0 "没有别人的打扰，你可以按照自己的节奏欣赏当地的风景。你将在[activity|E]结束时获得[prestige_i|E]#V 100#!和[GetModifier('RICE_granada_explored_munya').GetNameWithTooltip][modifier|E]。如果你拥有[GetTrait('brave').GetName( GetNullCharacter )]特质，你还会降低[stress_loss_i|E][stress|E]。"
