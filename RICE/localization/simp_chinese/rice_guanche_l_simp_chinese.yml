 guanche.0050.t:0 "将甘蔗引进马德拉岛"
 guanche.0050.desc:0 "值得注意的是，尽管该岛地理环境优越，木材资源丰富，但在[madeira_county.GetNameNoTier]这里还没有人建立甘蔗业。现在我利用各种关系，我已经找到了一些在地中海地区经营的商人，他们愿意资助将甘蔗引入该岛。如果有足够的奴隶劳工以及商人的投资，这将是马德拉岛发展的开始。\n\n有一些人甚至认为，只要管理得当我们甚至可以用一两代人的时间内让西西里岛、塞浦路斯和安达卢西亚等传统甘蔗生产区域黯然失色。要我说，这是一个不切实际的想法，但我钦佩这种乐观情绪。不过这样的事情能够发生，那将是好得不能再好的事情。"
 guanche.0050.a:0 "尽管如此，我们可能会赚取大量的利润。"
 guanche.0051.t:0 "将甘蔗引进马德拉岛"
 guanche.0051.desc:0 "[madeira_ruler.GetTitledFirstName]已主动将甘蔗引入[madeira_county.GetNameNoTier]；该岛丰富的木材无疑将为这里蓬勃发展的制糖业提供动力。[madeira_ruler.GetFirstName]与希望绕过其他地方的商业对手的地中海商人合作，不仅引进了甘蔗本身，还引进了奴隶和来自西西里等地的顾问来监督甘蔗厂的建设等等。有一些人认为该岛有一天甚至可能超过西西里、塞浦路斯和安达卢西亚等传统的甘蔗生产中心。"
 guanche.0051.a:0 "数之不尽的糖……听起来好得令人难以置信！"
 guanche.0052.t:0 "马德拉岛的制糖业崩溃了"
 guanche.0052.desc:0 "我们应该采取行动，但现在已经太晚了。[madeira_county.GetNameNoTier]上的木材供应迅速减少是我们忽略的警告信号。很难想象马德拉这个拥有无尽木材的岛屿，有一天会不再有足够的木材来维持其制糖业。\n\n拥有和经营马德拉岛曾经广阔的甘蔗农场及糖厂的商人告诉我，由于当地突然缺乏可用的木材，糖业生产处于历史最低水平，我们的糖业正在迅速崩溃。虽然可能会恢复，但它将不得不依赖外来的木材，这样马德拉岛上的甘蔗永远不会达到曾经的辉煌高度。"
 guanche.0052.a:0 "这对我们的经济没有好处。"
 guanche.0053.t:0 "马德拉岛的制糖业崩溃了"
 guanche.0053.desc:0 "几十年来，[madeira_county.GetNameNoTier]的产糖量让世界为之羡慕。这在一定程度上是由于在岛上含有大量的木材，为制糖业提供了动力。曾经强大的糖业生产中心，如塞浦路斯、安达卢西亚和西西里与马德拉岛的利润相比显得微不足道，不过美梦要结束了。\n\n多年来有增无减、不可持续的木材采伐造成了马德拉岛森林大幅消失，岛上的许多甘蔗农场和制糖厂正在关闭，当地根本没有足够的木材可以使用了。虽然可能会恢复，但它将不得不依赖外来的木材，这样马德拉岛上的甘蔗永远不会达到曾经的辉煌高度。"
 guanche.0053.a:0 "现在糖业生产的中心将转移到哪里？"
 guanche.0054.t:0 "xxxxx"
 guanche.0054.desc:0 "xxxxx"
 guanche.0054.a:0 "xxxxx"
 guanche.0055.t:0 "甘蔗引进到加那利群岛"
 guanche.0055.desc:0 "自从甘蔗首次被引入[madeira_county.GetNameNoTier]以来，一些来自地中海和西欧的商人也考虑投资将甘蔗带去加那利群岛。最近他们的计划已经实现了。\n\n这些商人与当地精英合作，开始在[canarias_county.GetNameNoTier]和[fuerteventura_county.GetNameNoTier]建立本地甘蔗种植园。他们从马德拉岛和其他地方请来专家监督这一过程，并雇奴来大批生产糖。\n\n加那利群岛的糖厂预计不会像马德拉岛的产量那么高，但利润也不菲。"
 guanche.0055.a:0 "群岛的经济肯定会从中受益。"
