 k_canary_islands_adj:0 "加那利"
 RICE_cn_canarias_arab:0 "哈利达群岛"
 RICE_cn_canarias_arab_desc:0 "哈利达群岛"
 RICE_only_formed_decision:0 "该[title|E]只能通过特殊[decision|E]创建。"
 RICE_decision_guanche_culture_requirement:0 "你的[culture|E]来自于关切或与关切融合"
 building_type_RICE_guanche_madeira_levadas:0 "列瓦达网络"
 building_type_RICE_guanche_madeira_levadas_desc:0 "马德拉岛南部地区被认为适合大规模农业，特别是甘蔗生产，但有一个问题就是缺乏足够的淡水。因此当地为缓解淡水的缺乏选择在山里建造了很多特殊的灌溉渠和水渠，被称为#italic 列瓦达渠道#!"
 building_RICE_guanche_madeira_levadas:0 "$building_type_RICE_guanche_madeira_levadas$"
 building_RICE_guanche_madeira_levadas_desc:0 "$building_type_RICE_guanche_madeira_levadas_desc$"
 RICE_guanche_levada_requirement:0 "做出#V 将甘蔗引进马德拉岛#!的[decision|E]"
 RICE_guanche_madeira_sugarcane_beginning:0 "马德拉岛甘蔗业的诞生"
 RICE_guanche_madeira_sugarcane_beginning_desc:0 "来自地中海的甘蔗最近被引入马德拉岛，该行业目前欣欣向荣。从各地运来的奴隶在恶劣条件的甘蔗园里工作，为贵族们带来巨大的利润。"
 RICE_guanche_fasting_weakness:0 "因禁食而感觉虚弱"
 RICE_guanche_rain_blessing_good:0 "雨之祝福"
 RICE_guanche_rain_blessing_good_desc:0 "最近这个地区得到了赐予生命之雨轻微有所增加，比预期的要多，虽然是在这个地区通常得到的正常范围之内，但是对于即将到来的收成应该是好的。这是否要感谢上天的恩赐？"
 RICE_guanche_rain_blessing_great:0 "庞大的雨之祝福"
 RICE_guanche_rain_blessing_great_desc:0 "最近这个地区得到了赐予生命之雨明显增加，远超预期，意味着会有大丰收，这是否要感谢上天的恩赐？"
 RICE_guanche_rain_blessing_amazing:0 "不可思议的雨之祝福"
 RICE_guanche_rain_blessing_amazing_desc:0 "最近这个地区得到了赐予生命的雨水大大增加，比预期的要多，但仍在合理范围内，不过收成会有大幅提升，这是否要感谢上天的恩赐？"
 RICE_guanche_madeira_timber:0 "木材之岛"
 RICE_guanche_madeira_timber_desc:0 "马德拉岛树木极为茂密，某些区域人类几乎无法进入。任何意图开发此地的人类都能在这里找到大量可用木材。"
 RICE_guanche_madeira_owner_timber:0 "开发利用马德拉的木材"
 RICE_guanche_madeira_owner_timber_desc:0 "控制马德拉的统治者将获得其丰富的木材资源。虽然它拥有丰富的木材资源，但不是无限的，所以这个统治者必须小心管理岛上的森林。"
 RICE_guanche_madeira_sugarcane_crash:0 "甘蔗业崩溃了"
 RICE_guanche_madeira_sugarcane_crash_desc:0 "由于大规模的森林砍伐，马德拉岛的甘蔗产业无法向之前一样大规模生产，在一夜之间几乎崩溃了，商人们正在寻找其他地方来满足全球对糖不断增长的需求。虽然这里的甘蔗生意可能有一天会恢复，但它肯定不会达到曾经的辉煌高度。"
 RICE_guanche_canary_islands_sugar_industry_booming:0 "甘蔗引进到加那利群岛"
 RICE_guanche_canary_islands_sugar_industry_booming_desc:0 "甘蔗业最近已经从马德拉岛移植到加那利群岛。虽然没有马德拉岛的甘蔗种植园那么有利可图，但加那利群岛上新建立的甘蔗种植园也利润不菲，并且吸引了远道而来的定居者和商人。"
 RICE_guanche_recently_celebrated_benesmen:0 "最近的贝涅斯曼庆典"
 RICE_guanche_kingdom_fortunate_isles:0 "幸运群岛"
 RICE_guanche_kingdom_unified_fortunate_isles:0 "统一幸运群岛"
 RICE_guanche_kingdom_worlds_edge:0 "世界的边缘"
 RICE_guanche_kingdom_unified_worlds_edge:0 "统一世界的边缘"
 RICE_guanche_new_whistlers:0 "新哨语者"
 RICE_guanche_new_whistlers_desc:0 "在关切人中，“哨语”是一项用于在崎岖地形中快速传递信息的古老传统。这位统治者刚刚雇佣了数名精通此道的“哨语者”。"
 RICE_guanche_fertility_prayer:0 "成功生育祈祷"
 RICE_guanche_unite_canary_islands:0 "团结加那利群岛"
 RICE_guanche_unite_canary_islands_tooltip:0 "加那利群岛上争吵不休的部族必须同心协力！"
 RICE_guanche_unite_canary_islands_desc:0 "自记事起，加那利群岛的人民一直被分成小部落和部族。不能再这样下去了！如果我们要生存和延续，我们必须团结起来，成为一个整体。"
 RICE_guanche_unite_canary_islands_effect_tooltip:0 "你将选择是否宣布这些土地为#P 幸运群岛#!或#P 世界边缘#!，分别获得经济和社会奖励或军事和谋略奖励。"
 RICE_guanche_unite_canary_islands_confirm:0 "在这些幸运群岛上，新的一天即将到来。"
 RICE_guanche_unite_canary_islands_context_tooltip:0 "#emphasis 历史背景：#!在古代，加那利群岛常被认为是传说中的幸运群岛。当西班牙人在15世纪开始殖民加那利群岛时，他们发现这些岛屿被分割成许多小部落和王国，这使得征服这些岛屿变得容易得多。"
 RICE_guanche_introduce_sugarcane_to_madeira:0 "将甘蔗引进马德拉岛"
 RICE_guanche_introduce_sugarcane_to_madeira_tooltip:0 "在这个岛上种植甘蔗可能暴利……"
 RICE_guanche_introduce_sugarcane_to_madeira_desc:0 "事实证明，甘蔗在地中海部分地区是利润可观的经济作物，而马德拉岛看起来是一个种植甘蔗的完美地点。当然马德拉岛丰富的木材可以为这里的制糖业提供燃料，至少可以使用很长一段时间内......不是吗？"
 RICE_guanche_introduce_sugarcane_to_madeira_effect_tooltip_1:0 "解锁建造#V 列瓦达网络#!，一个[special_building|E]在[madeira_county.GetNameNoTier]"
 RICE_guanche_introduce_sugarcane_to_madeira_effect_tooltip_2:0 "甘蔗将来也可能被引进到[canarias_county.GetNameNoTier]和[fuerteventura_county.GetNameNoTier]"
 RICE_guanche_introduce_sugarcane_to_madeira_effect_tooltip_3:0 "由于#N 砍伐森林#!，甘蔗业在未来可能会崩溃！在[madeira_county.GetNameNoTier]上，如果真的发生，利润肯定会暴跌。"
 RICE_guanche_introduce_sugarcane_to_madeira_confirm:0 "让我们赚点钱吧"
 RICE_guanche_introduce_sugarcane_to_madeira_context_tooltip:0 "#emphasis 历史背景：#!地中海的甘蔗在葡萄牙殖民之后被引入马德拉岛，这要归功于航海家亨利王子的努力，他在15世纪为该岛建造第一座糖厂的计划给予了支持。马德拉岛丰富的木材资源和非洲奴隶劳动支撑起该岛的糖业，使其在本世纪后期迎来了一次空前的繁荣，但在16世纪，由于过度砍伐森林，该岛的糖业遭到了毁灭性的打击。"
 RICE_guanche_pray_for_good_rain:0 "祈求雨之祝福"
 RICE_guanche_pray_for_good_rain_tooltip:0 "通过[ROOT.Char.GetFaith.GetAdjective]仪式祈求雨水"
 RICE_guanche_pray_for_good_rain_desc:0 "[ROOT.Char.GetFaith.PantheonTerm]是否会保佑我们的领土有充足的雨水，使我们庄稼茁壮成长？我们必须向祂们表示我们的虔诚，并请求祂们在未来为我们提供生命之雨。"
 RICE_guanche_pray_for_good_rain_effect_tooltip_1:0 "你的[realm_capital|E]#italic 可能#!被授予#P 正面的#![county_modifier|E]推动[taxes|E]、[development|E]和[county_opinion|E]"
 RICE_guanche_pray_for_good_rain_effect_tooltip_2:0 "获得正面结果的几率取决于你的[sins|E]、[virtues|E]，以及你愿意花多少[prestige|E]"
 RICE_guanche_pray_for_good_rain_confirm:0 "为仪式做准备！"
 RICE_guanche_pray_for_good_rain_context_tooltip:0 "#emphasis 历史背景：#!西班牙编年史家提到，祈雨是加那利群岛的异教原住民最常见的仪式之一。这种仪式通常包括集体禁食和盛大的哀乐表演。"
 RICE_guanche_celebrate_benesmen_festival:0 "庆祝贝涅斯曼节"
 RICE_guanche_celebrate_benesmen_festival_tooltip:0 "传统的[ROOT.Char.GetFaith.GetAdjective]是丰收和新年节日"
 RICE_guanche_celebrate_benesmen_festival_desc:0 "收获的季节即将结束，旧的一年也随之结束。让我们预示着新的一年的到来，并适当膜拜所有[ROOT.Char.GetFaith.PantheonTerm]和[ROOT.Char.GetFaith.CreatorName]"
 RICE_guanche_celebrate_benesmen_festival_effect_tooltip:0 "你庆祝贝涅斯曼节，在那里你可能获得[prestige|E]或[piety|E]，或失去[stress|E]。"
 RICE_guanche_celebrate_benesmen_festival_confirm:0 "现在是为节日做准备的时候了。"
 RICE_guanche_celebrate_benesmen_festival_context_tooltip:0 "#emphasis 历史背景：#!贝涅斯曼节是关切人皈依基督教之前最重要的节日。这是一个丰收的节日，通过对各种关切族神祇的崇拜来标志新年的开始。在西班牙对加那利群岛进行殖民统治后，该节日的可能已经被基督教同化。"
 RICE_decision_guanche_benesmen_month_requirement:0 "月份必须在七月至十月之间"
