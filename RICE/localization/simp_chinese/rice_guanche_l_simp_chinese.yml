 guanche.0060.t:0 "提比塞纳"
 guanche.0060.desc:0 "有报告说有一个#italic 提比塞纳#!住在离这里不远的一个山洞里。提比塞纳是[ROOT.Char.GetCulture.GetName]民间传说中的恶魔，据说长得像黑狗，长着长长的头发和红眼睛，捕食牲畜甚至是人。无论如何最近有许多牲畜被神秘地杀死，许多当地人相信这些是可怕的恶魔造成的。"
 guanche.0060.a:0 "祈求[ROOT.Char.GetFaith.PantheonTerm]将我们从这些邪恶中解救出来！"
 guanche.0060.b:0 "这可能只是土匪，让当地民兵保持警惕。"
 guanche.0061.t:0 "塔格罗会议"
 guanche.0061.desc:0 "我召集了一些当地的长老在附近的#italic 塔格罗#!（一种传统[ROOT.Char.GetCulture.GetName]石阵）内开会，我今天想和当地的长老讨论各种问题，我们都坐在各自的石头上，长篇大论，让会议顺利进行。"
 guanche.0061.a:0 "这个会议很无聊，所以我就小眯一会。"
 guanche.0061.b:0 "我希望解决当地的许多争端，以维持和平。"
 guanche.0061.c:0 "我仔细聆听其他人提出的关于统治这片土地的建议。"
 guanche.0062.t:0 "哨语"
 guanche.0062.desc:0 "最近，又有几名新的哨语者加入我的麾下。传统上，这些精通[ROOT.Char.GetCulture.GetName]哨语的人——会利用哨声在我们的群山与峡谷间传递信息。这种方法常被用于传播重要的公共通告。\n\n至少我的新哨语者天赋异禀，能发出比前任更洪亮的哨声，这对管理本地事务应有所裨益。"
 guanche.0062.a:0 "悦耳动听！"
 guanche.0063.t:0 "牧羊人飞跃"
 guanche.0063.desc:0 "今天我正在观看当地[ROOT.Char.GetCulture.GetName]牧羊人飞跃比赛。加那利群岛是关西人的发源地，很多地方都很崎岖所以那里的牧民都是用长木杆撑起自己然后跳过峡谷或跳下陡峭的地形。几个世纪以来人们开发了一些技巧，让练习者不费吹灰之力的迅速穿越这些空间，慢慢这些形成了#italic 牧羊人飞跃#!并且成为当地的一项运动。"
 guanche.0063.a:0 "壮观的景象值得一看！"
 guanche.0063.b:0 "为了鼓励参赛者，我给胜利者准备一个大奖。"
 guanche.0063.c:0 "我自己也参加了比赛，真是锻炼人啊。"
 guanche.0064.t:0 "一条简单的项链"
 guanche.0064.desc:0 "传统上，我们[ROOT.Char.GetCulture.GetName]已经找到了用最简单的材料如木头、骨头和贝壳制作最美丽的装饰品的方法。今天几个当地人送给我一条用这种材料制作的美丽项链。"
 guanche.0064.a:0 "这真是一份令人惊异且受欢迎的礼物！"
 guanche.0065.t:0 "火祭"
 guanche.0065.desc:0 "我最近以传统的[ROOT.Char.GetFaith.GetAdjective]方式，在当地一座高山上的祭坛上献祭。我带来的[ROOT.Char.Custom('DefaultPriestTitle')]解释了这次供奉产生的烟雾的含义，他告诉我看来[ROOT.Char.GetFaith.PantheonTerm]对这次供奉很满意。"
 guanche.0065.a:0 "那么看来我是被祝福了？"
 guanche.0066.t:0 "火祭"
 guanche.0066.desc:0 "我最近以传统的[ROOT.Char.GetFaith.GetAdjective]方式，在当地一座高山上的祭坛上献祭。我带来的[ROOT.Char.Custom('DefaultPriestTitle')]解释了这次供奉产生的烟雾的含义，他告诉我看来[ROOT.Char.GetFaith.PantheonTerm]对这次供奉不仅不感兴趣，而且还觉得受到了侮辱！"
 guanche.0066.a:0 "我想这只是一种误读？"
 guanche.0067.t:0 "石板琴"
 guanche.0067.desc:0 "在我回去处理事务的路上，我路过一个石板琴，它被用于一些当地的[ROOT.Char.GetFaith.GetAdjective]仪式。这些石头能产生悦耳的声音，而且更重要的是能让[ROOT.Char.GetFaith.PantheonTerm]感到愉悦，因此常常在仪式上使用。我随行的一个卫兵熟悉这个地区，他告诉我即使是巫师和恶灵也害怕这种石头，当地传说敲击它可以阻止这些危险的生物离自己太近而造成伤害。"
 guanche.0067.a:0 "我听说过这种奇妙的故事。"
 guanche.0067.b:0 "在我看来像是一种愚蠢的迷信。"
 guanche.0068.t:0 "木乃伊"
 guanche.0068.desc:0 "在附近的山上旅行时，一些当地人发现一具老木乃伊被防腐，并以传统的[ROOT.Char.GetFaith.GetAdjective]方式埋在一个山洞里。但这是一个相当简陋的洞穴，并不适合这样一个重要人物。总之发现木乃伊的平民们不知道该如何处理它，于是来找我寻求指导。"
 guanche.0068.a:0 "让木乃伊躺在那里，不要打扰它。"
 guanche.0068.b:0 "我们应该为这具木乃伊找到一个更好的安息地。"
