 guanche.0011.desc.culture:0 "雨水支撑养育了我们，它赋予农作物生命，以养活我们。\n\n然而，雨并不是凭空出现的。有时，雨不会来，或者雨量微不足道，而这往往是[ROOT.Char.GetFaith.PantheonTerm]未被尊重而降下的惩罚。\n\n因此，我决定在[rain_ritual_county.GetName]向[ROOT.Char.GetCulture.GetName]进行传统的[ROOT.Char.GetFaith.PantheonTerm]祈雨，恳求祂们赐予我们雨水。这个仪式的要求我领土上的每个人，包括我自己，在进行这个仪式之前要禁食三天。在这期间，我们将向天空祈祷并唱出清醒、忧郁的哀歌，以便[ROOT.Char.GetCulture.GetNameNoTooltip]怜悯我们。我应该为此付出多大的努力？"
