 guanche.0030.t:0 "准备贝涅斯曼节"
 guanche.0030.desc:0 "贝涅斯曼节即将开始，每个人都在尽力为这个场合做准备。作为传统的[ROOT.Char.GetFaith.GetAdjective]新年和收获节，它对我们的部落极其重要。我已经和其他长老合作，确保今年的庆祝活动能够成功，这样[ROOT.Char.GetFaith.PantheonTerm]，尤其是[ROOT.Char.GetFaith.CreatorName]、[ROOT.Char.GetFaith.WealthGodName]和[ROOT.Char.GetFaith.HealthGodName]，会对我们的努力表示满意。"
 guanche.0030.a:0 "我等不急了！"
 guanche.0031.t:0 "贝涅斯曼节开始！"
 guanche.0031.desc:0 "贝涅斯曼节即将到来，从最有权势的[ROOT.Char.GetLadyLord]到各种[ROOT.Char.Custom('DefaultPriestTitlePlural')]最卑为的牧羊人和农民，都聚集在该地区最高的#italic 塔格罗#!（一种石头圈建筑）附近举行这样的大会。\n\n赞美[ROOT.Char.GetFaith.PantheonTerm]，我们今年能够丰收，在这个经常被[ROOT.Char.GetFaith.DevilName]的势力所干扰且混乱不堪的世界里生存，全赖祂的恩赐。"
 guanche.0031.a:0 "赞美[ROOT.Char.GetFaith.PantheonTerm]！让庆祝活动开始吧！"
 guanche.0032.t:0 "贝涅斯曼节结束"
 guanche.0032.desc:0 "贝涅斯曼节已经结束了，每个人都玩得很开心，这也是纪念收获季节和旧年结束的好方法。我们只能希望[ROOT.Char.GetFaith.PantheonTerm]能在即将到来的新的一年里眷顾我们的领地，并保佑这些土地有丰富的作物和繁荣。"
 guanche.0032.a:0 "期待下一次！"
 guanche.0033.t:0 "xxxxx"
 guanche.0033.desc:0 "xxxxx"
 guanche.0033.a:0 "xxxxx"
 guanche.0034.t:0 "仪式任务"
 guanche.0034.desc:0 "贝涅斯曼节的一部分内容是以仪式的方式分配部落每个成员在来年将参与的任务，如放牧、捕鱼或制作工艺品。我坐在#italic 塔格罗#!（一种石头圈建筑）内，与其他长老商讨这种事宜。"
 guanche.0034.a:0 "你做这个，你做那个，你做这个，你做那个……"
 guanche.0035.t:0 "赞美[ROOT.Char.GetFaith.FertilityGodName]"
 guanche.0035.desc:0 "作为庆祝活动的一部分，我向[ROOT.Char.GetFaith.FertilityGodName]膜拜，这样土地就会充满丰收，我们的后代也会茁壮成长。我走到一块神圣的石头前说出我的祷告。"
 guanche.0035.a:0 "噢！[ROOT.Char.GetFaith.FertilityGodName]，聆听我的祷告"
 guanche.0035.toast:0 "一个[ROOT.Char.Custom('DefaultPriestTitle')]说[ROOT.Char.GetFaith.FertilityGodName]听到了我的祈祷！"
 guanche.0036.t:0 "群山之光"
 guanche.0036.desc:0 "在[ROOT.Char.GetFaith.GetAdjective]的信仰中，高大的山脉象征圣地的地位。随着贝涅斯曼庆典的继续，每当这时我就会望向附近的山脉，敬畏地看着[ROOT.Char.GetFaith.PantheonTerm]为我们创造的一切。"
 guanche.0036.a:0 "真是鼓舞人心"
 guanche.0037.t:0 "祭品羊"
 guanche.0037.desc:0 "在贝涅斯曼节期间对[ROOT.Char.GetFaith.PantheonTerm]的祭品的一部分，我们把羊的头骨和蹄子扔进火里。然后我们祈祷，烟雾升上天空，[ROOT.Char.Custom('DefaultPriestTitle')]告诉我，[ROOT.Char.GetFaith.PantheonTerm]一定会高兴。"
 guanche.0037.a:0 "我只能这么盼望了……"
 guanche.0038.t:0 "岩石在上"
 guanche.0038.desc:0 "在贝涅斯曼节期间，我们中的一些人敲击石板琴（能发出悠扬声音的特殊石头）来伴随我们的歌唱和祈祷。这是一件美好的事情，这些大自然的声音让我感到安心，并更好地适应[ROOT.Char.GetFaith.PantheonTerm]的荣光。"
 guanche.0038.a:0 "多么亲切的音乐！"
 guanche.0039.t:0 "盛宴"
 guanche.0039.desc:0 "我们刚刚结束了为[ROOT.Char.GetFaith.PantheonTerm]祭祀羊的活动，现在我们正在享用它们的肉，这些肉与谷物搭配并在火上烘烤，十分美味。"
 guanche.0039.a:0 "真是美味！"
 guanche.0040.t:0 "桧柏"
 guanche.0040.desc:0 "我和其他几个人把杜松扔到火堆上，我们继续为贝涅斯曼节做祭品和祈祷。芳香的气味传遍了整个地区，这激励我们做圣洁和美德的行为。"
 guanche.0040.a:0 "多么奇妙的植物啊。"
 guanche.0041.t:0 "舞蹈"
 guanche.0041.desc:0 "贝涅斯曼节不仅仅只是一个阴沉的祈祷节日，它同时也是一个庆祝丰收结束的节日！其中一部分庆祝活动涉及到跳舞，现在我们有一些人开始进行这样的舞蹈。男人和女人靠近在音乐声和观众的踩踏声、拍手声和口哨声中，彼此扭动和旋转。"
 guanche.0041.a:0 "这很有趣！"
 guanche.0042.t:0 "应该用什么音乐来唱歌跳舞？"
 guanche.0042.desc:0 "贝涅斯曼节是一个充满各种音乐的节日，是时候选择接下来要唱什么、跳什么了。大家都看着我这个在场地位最高的人来选择。也许我们可以合起手来，唱一些忧郁的歌曲，那些讲述过去的苦乐事件。或者我们可以唱一些好战的颂歌来庆祝过去的英雄们。"
 guanche.0042.a:0 "让我们唱起忧伤的歌曲，感受我们心中的深情吧！"
 guanche.0042.b:0 "这是一个用致敬那些凯旋的、胜利的英雄们的歌曲来庆祝的时刻！"
 guanche.0043.t:0 "运动"
 guanche.0043.desc:0 "随着贝涅斯曼节的继续，现在是运动和竞争的时刻！我们许多人围成一圈，看着有才华的男人和女人进行摔跤、跑步和牧羊人飞跃的比赛。（牧羊人飞跃是整个加那利群岛的一项民间运动，既只用一根长木棍支撑自己然后飞跃危险的地形）"
 guanche.0043.a:0 "惊心动魄的场面！"
 guanche.0044.t:0 "解决争议"
 guanche.0044.desc:0 "贝涅斯曼节往往是部落内人们之间解决纠纷的机会。我和其他重要的长老以及[ROOT.Char.Custom('DefaultPriestTitlePlural')]一起，刚刚成功地结束了部落内两个家庭之间的争执，他们同意在节日的见证下握手言和。"
 guanche.0044.a:0 "棒极了！"
