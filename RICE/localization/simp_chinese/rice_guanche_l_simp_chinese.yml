 activity_RICE_guanche_rain_ritual:0 "祈雨仪式"
 activity_RICE_guanche_rain_ritual_desc:0 "[GetPlayer.GetFaith.PantheonTerm]会不会保佑我们土地风调雨顺，让我们可以种植庄稼，茁壮成长？我们必须向上天表达我们的虔诚之心，并请求祂们在未来为我们提供生命之雨。"
 activity_RICE_guanche_rain_ritual_selection_tooltip:0 "祈求雨之祝福\n\n$RICE_guanche_pray_for_good_rain_context_tooltip$"
 activity_RICE_guanche_rain_ritual_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$你主办的[activity|E]所在的[county|E]有概率获得一个[county_modifier|E]，以促进[development|E]、[tax|E]和[county_opinion|E]，如果你决定禁食祈祷，会增加获得的概率。"
