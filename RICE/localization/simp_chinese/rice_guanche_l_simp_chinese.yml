 guanche.0003.desc:0 "xxxxx"
 guanche.0003.a:0 "xxxxx"
 guanche.0004.t:0 "幸运群岛"
 guanche.0004.desc:0 "古人称加那利群岛为“幸运群岛”，将其与希腊和罗马神话中的“祝福之岛”联系起来。自古以来，[fuerteventura_chieftain.GetCulture.GetName]一直居住在这里，与世界隔绝。不过遥远的土地在几百年发生了巨大的变化，但这些部落暂时过着相对平静的生活。谁知道这些位于世界边缘的幸运岛的最终命运会是什么？"
 guanche.0004.a:0 "我们的故事是关于加那利群岛的酋长……"
 guanche.0004.b:0 "我们的故事是关于富埃特文图拉岛的酋长……"
 guanche.0004.c:0 "我们的故事是关于马德拉的酋长……"
 guanche.0004.tooltip:0 "[canarias_duchy.GetName]的[counties|E]已经被几个[fuerteventura_chieftain.GetFaith.GetAdjective]、[fuerteventura_chieftain.GetCulture.GetName]酋长分割。你选择哪一个幸运岛作为家园？"
 guanche.0005.t:0 "加那利群岛联盟"
 guanche.0005.desc:0 "通过实力、诡计以及外交手段，我已经将加那利群岛统一为一个王国：[canarias_kingdom.GetName]。这些岛屿将不再被小规模的、纷争不断的酋长们分割。\n\n几代人以来，偶尔有大洋彼岸的外来者来到我们的土地上，告诉我们，他们对脚下这片土地的看法和故事。有些人说我们是#V 幸运岛#!一个富饶的天堂，善良和正义的人死后都住在这里。还有人说我们是#V 世界的边缘#!，因为在我们的岛屿之后，大洋彼岸就没有其他土地了。\n\n这些都是很好的传言。我们接受并传播这些传说，以提高我们新生王国的威望，让外人在谈到我们时感到敬畏，这才是正确的。"
 guanche.0005.a:0 "幸运群岛是一个统一而繁荣的王国。"
 guanche.0005.b:0 "世界的边缘在同一个旗帜下！我们不向任何人低头！"
 guanche.0006.t.fortunate_isles:0 "幸运群岛"
 guanche.0006.t.worlds_edge:0 "世界的边缘"
 guanche.0006.desc:0 "几个世纪以来，加那利群岛对许多人来说是一个充满神话和传奇的地方。在现实中这些岛屿被各个小部落瓜分。然而时代正在发生变化。[canarias_king.GetTitledFirstName]已经将这些岛屿统一在[canarias_king.GetHerHis]的统治之下。"
 guanche.0006.desc.fortunate_isles:0 "\n\n关于[canarias_kingdom.GetName]的巨大繁荣的传言已经在传播。即使在古代，希腊人、罗马人和腓尼基人也认为这些群岛是古代传说中的#V 幸运群岛#!，传闻它是一个幸福和富足的地方。岛上的人已经完全接受了这一赞赏。"
 guanche.0006.desc.worlds_edge:0 "\n\n关于[canarias_kingdom.GetName]战士的力量和狡猾的传言广为传播。几世纪以来，许多人都认为，这些岛屿是进入广阔无边的大西洋之前的最后一个岛屿，这里是理所当的#V 世界的边缘#!。只有可怕的、强大的民族才能在这里生存。"
 guanche.0006.a:0 "这些岛屿的下一步历史是什么？"
