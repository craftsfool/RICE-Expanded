 guanche.0011.t:0 "为仪式做准备"
 guanche.0011.desc:0 "雨水支持我们、养育了我们、赋予我们收获作物的生命之水，让我们养活自己。\n\n然而雨并不是凭空出现的。有时雨不会来，或者降水量微不足道，而这是因为是我们没有对[ROOT.Char.GetFaith.PantheonTerm]表示适当的敬意。\n\n因此我决定现在是时候让我们在[rain_ritual_county.GetName]向[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.PantheonTerm]祈祷，恳求祂们为我们提供雨水。这个仪式的一部分要求我的聚居地里的每个人包括我自己，在我们举行仪式之前禁食三天。在这期间我们将向天空祈祷并唱出清醒、忧郁的哀歌，以便[ROOT.Char.GetFaith.PantheonTerm]可以怜悯我们，我应该为此付出多大的努力？"
 guanche.0011.a:0 "为这些仪式做必要和预备的事情。"
 guanche.0011.b:0 "付出比平时更多的努力来哀叹，并不让自己吃东西。"
 guanche.0011.c:0 "付出巨大的努力，所以[ROOT.Char.GetFaith.PantheonTerm]请听我们悲痛的请求！"
 guanche.0011.tooltip:0 "花费更多的[prestige|E]#P 提高#!你的[realm_capital|E]获得更强大的[county_modifier|E]的机会！"
 guanche.0011.fasting_weakness:0 "禁食后感到虚弱"
 guanche.0012.t:0 "祈雨仪式"
 guanche.0012.desc:0 "历经三天的斋戒，我和其他许多人带着牲畜前往[rain_ritual_county.GetName]的一个最高点，并专门在那里建立一个神龛。我们中的一些人跳舞，另一些人敲打石板琴（能发出悠扬声音的特殊石头），我们都在仪式的火堆旁发出哀怨请求：我们祈求[ROOT.Char.GetFaith.CreatorName]和[ROOT.Char.GetFaith.WaterGodName]、[ROOT.Char.GetFaith.FertilityGodName]以及所有[ROOT.Char.GetFaith.PantheonTerm]接受我们的祭品，给我们提供生活和繁荣所急需的雨水。\n\n之后，[ROOT.Char.Custom('DefaultPriestTitlePlural')]围着火堆解读烟雾，看我们与[ROOT.Char.GetFaith.PantheonTerm]的交流是否取得了好进展……"
 guanche.0012.a:0 "[ROOT.Char.GetFaith.PantheonTerm]为我们准备了什么？"
 RICE_guanche_rain_blessing_nothing_tooltip:0 "看来我们的祈祷并没有被听到……"
