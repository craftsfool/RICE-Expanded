 hangzhou.0050.t:0 "至钱塘江"
 hangzhou.0050.desc:0 "大千世界，无奇不有。但世之景观之引人入胜，鲜有能媲美临近[GetTitleByKey('c_hangzhou').GetNameNoTier]的钱塘江大潮的。\n\n因而，我们决定前往[GetTitleByKey('c_hangzhou').GetNameNoTierNoTooltip]亲眼目睹大潮。有人说这很危险，因为曾有人被大潮卷走而丧生，但我相信这并没有#italic 那么#!危险！"
 hangzhou.0050.a:0 "我等不及想看这个惊心动魄的奇观了！"
 hangzhou.0051.t:0 "在河岸稍待"
 hangzhou.0051.desc:0 "我们终于赶到钱塘江边了，而且来得正是时候！潮水应该快来了。\n\n江边已经聚集了大批人群，都在等待观赏这一奇景。其中不少是本地人，也有许多远道而来的旅客，想必都是听闻了这盛事。"
 hangzhou.0051.a:0 "一场视觉盛宴就要到来了吗？"
 hangzhou.0052.t:0 "钱塘大潮"
 hangzhou.0052.desc:0 "钱塘大潮朝我们袭来，宛如一条宏伟、雄浑、激荡的水墙，突然前方传来一声呼喊——来了！\n\n人群爆发出欢呼、惊叹和兴奋的议论声，一道巨浪奔腾而来，然后猛然冲击而下，场面壮观且震撼。\n\n人群中响起阵阵呐喊助威声，一些勇敢的年轻人拿起木板，在大浪弄潮，这是献给龙王的一部分。"
 hangzhou.0052.a:0 "妙哉！妙哉！"
 hangzhou.0053.t:0 "结束"
 hangzhou.0053.desc:0 "潮起潮落，恍如瞬息之间。\n\n钱塘江正恢复往常的平静，人潮逐渐散去。我想我们也该回去了，但心中满溢着今日所见带来的欣喜与激动。最妙的是，这并非一生难遇的稀罕事——将来我们随时还能再次目睹。"
 hangzhou.0053.a:0 "也许有一天，我还能再看一次。"
 hangzhou.0054.t:0 "受伤"
 hangzhou.0054.desc:0 "大潮逼来，越来越近……猛的一下冲过我们，所幸无人伤亡。\n\n幸好这次没有什么大事，我们深知钱塘大潮的危险……"
 hangzhou.0054.a:0 "希望近期不会再发生什么不幸的事。"
