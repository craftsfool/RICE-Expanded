 RICE_hangzhou_legend_qian_liu_tidal_bore_name:0 "射潮"
 RICE_hangzhou_legend_qian_liu_tidal_bore_desc:0 "为保护钱塘江沿岸的百姓，[ruler.GetTitledFirstName]下令修筑海堤。传闻当潮神企图摧毁堤坝时，[ruler.GetFirstNameNoTooltip]命弓箭手齐射，逼退潮水。"
 RICE_hangzhou_legend_qian_liu_tidal_bore_chapter_opening_new_title:0 "xxxx"
 RICE_hangzhou_legend_qian_liu_tidal_bore_chapter_motivation_new_title:0 "xxxx"
 RICE_hangzhou_legend_qian_liu_tidal_bore_chapter_famous_deed_new_title:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]不向大潮低头，[ROOT.Legend.GetProtagonist.GetSheHe]决心采取行动。在八月初八大潮之时，[ROOT.Legend.GetProtagonist.GetSheHe]聚集过万劲弩伏河。当潮水涨起，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]下令健儿向大河射出箭雨，本地居民与其一道喝彩。大潮面对这一壮举奇迹般地退下，而施工中的大堤完好无损。"
 RICE_hangzhou_legend_qian_liu_tidal_bore_chapter_extra_deed_new_title:0 "xxxx"
 RICE_hangzhou_legend_qian_liu_tidal_bore_chapter_conclusion_new_title:0 "xxxx"
 RICE_hangzhou_ten_scenes_painting_name:0 "西湖十景图"
 RICE_hangzhou_ten_scenes_painting_desc:0 "这幅由[ROOT.Char.GetTitledFirstName]绘制的精美插图，生动地描绘了著名的[RICE_ten_scenes_of_west_lake|E]。这是已知最早描绘西湖十景的作品之一，西湖十景在亚洲的文人墨客之间的名声也因此作得以大幅提高。"
 RICE_hangzhou_ten_scenes_scroll_name:0 "西湖十景导览"
 RICE_hangzhou_ten_scenes_scroll_desc:0 "这本由[ROOT.Char.GetTitledFirstName]撰写的深度旅游指南，生动描绘了著名的[RICE_ten_scenes_of_west_lake|E]。这是已知最早描绘西湖十景的文学作品之一，西湖十景在亚洲的文人墨客之间的名声也因此作得以大幅提高。"
 RICE_poetry_gathering_poem_diplomacy_name:0 "[poetry_winner.GetFirstNamePossessiveNoTooltip]的现实诗"
 RICE_poetry_gathering_poem_diplomacy_desc:0 "由[poetry_winner.GetFirstName]在[host.GetFirstName]主持的诗会上即兴创作的诗赋，被公认是诗会上最佳作品。诗歌主题关乎人性与人际关系，重点描绘了[ROOT.Char.Custom('RICE_poetry_gathering_poem_diplomacy')]。"
 RICE_poetry_gathering_poem_martial_name:0 "[poetry_winner.GetFirstNamePossessiveNoTooltip]的边塞诗"
 RICE_poetry_gathering_poem_martial_desc:0 "由[poetry_winner.GetFirstName]在[host.GetFirstName]主持的诗会上即兴创作的诗赋，被公认是诗会上最佳作品。诗歌主题关乎战争与军事，重点描绘[ROOT.Char.Custom('RICE_poetry_gathering_poem_martial')]。"
 RICE_poetry_gathering_poem_stewardship_name:0 "[poetry_winner.GetFirstNamePossessiveNoTooltip]的山水诗"
 RICE_poetry_gathering_poem_stewardship_desc:0 "由[poetry_winner.GetFirstName]在[host.GetFirstName]主持的诗会上即兴创作的诗赋，被公认是诗会上最佳作品。诗歌主题关乎自然与环境，重点描绘[ROOT.Char.Custom('RICE_poetry_gathering_poem_stewardship')]。"
 RICE_poetry_gathering_poem_intrigue_name:0 "[poetry_winner.GetFirstNamePossessiveNoTooltip]的婉约诗"
 RICE_poetry_gathering_poem_intrigue_desc:0 "由[poetry_winner.GetFirstName]在[host.GetFirstName]主持的诗会上即兴创作的诗赋，被公认是诗会上最佳作品。诗歌主题关乎爱情与浪漫，重点描绘[ROOT.Char.Custom('RICE_poetry_gathering_poem_intrigue')]。"
 RICE_poetry_gathering_poem_learning_name:0 "[poetry_winner.GetFirstNamePossessiveNoTooltip]的讥讽诗"
 RICE_poetry_gathering_poem_learning_desc:0 "由[poetry_winner.GetFirstName]在[host.GetFirstName]主持的诗会上即兴创作的诗赋，被公认是诗会上最佳作品。诗歌主题关乎历史或政治，重点描绘[ROOT.Char.Custom('RICE_poetry_gathering_poem_learning')]。"
 RICE_hangzhou_west_lake_guide_name:0 "西湖指南"
 RICE_hangzhou_west_lake_guide_desc:0 "本指南包含一张地图和一些关于在[GetTitleByKey('c_hangzhou').GetNameNoTier][RICE_west_lake|E]信息，旨在帮助远道而来的游客探索和欣赏西湖的著名地标与更好的体验。"
 RICE_lu_you_final_poem_name:0 "示儿"
 RICE_lu_you_final_poem_desc:0 "$RICE_lu_you_final_poem_desc_kaifeng_reclaimed$\n\n#italic 死去元知万事空，\n但悲不见九州同。\n王师北定中原日，\n家祭无忘告乃翁。#!"
 RICE_lu_you_final_poem_desc_kaifeng_reclaimed:0 "这是[lu_you.GetFirstName]临终前所作的最后一首诗抄本。"
 RICE_lu_you_shen_garden_two_poems_name:0 "沈园二首"
 RICE_lu_you_shen_garden_two_poems_desc:0 "[lu_you.GetFirstName]在七十五岁重游[Glossary( '沈园', 'SHEN_GARDEN_GLOSS' )]时为怀念其原配夫人[tang_wan.GetFirstName]而作的二手诗，那时他即兴创作了[Glossary( '《钗头凤·红酥手》', 'LU_YOU_PHOENIX_HAIRPIN_GLOSS' )]，而她也和了一阕[Glossary( '《钗头凤·世情薄》', 'TANG_WAN_PHOENIX_HAIRPIN_GLOSS' )]，回忆往昔后的巨大悲伤激发他又写了两首诗。\n\n$LU_YOU_SHEN_GARDEN_TWO_POEMS_GLOSS$"
 RICE_hangzhou_aspiration_lu_you_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持作为[GetTitleByKey('h_china').GetNameNoTier][vassal|E]\n$EFFECT_LIST_BULLET$除[domicile|E]外不持有任何[title|E]\n$EFFECT_LIST_BULLET$在[GetTrait('lifestyle_poet').GetName( GetNullCharacter )][trait|E]上有#V 100#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高的[prestige_level|E]\n$EFFECT_LIST_BULLET$拥有低于[stress_i|E]#V [EmptyScope.ScriptValue('higher_than_baseline_stress')]#![stress|E]\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$你将终身拒绝所有[appointments|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_tiny_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_hangzhou_liberated_old_man').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$升级你的[education_trait|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$拥有至少一位[friend|E]或[best_friend|E]（奖励：获得@influence_icon!#V [EmptyScope.ScriptValue('major_influence_gain')]#![influence|E]）\n$EFFECT_LIST_BULLET$拥有低于[stress_i|E]#V [EmptyScope.ScriptValue('low_stress')]#!的[stress|E]（奖励：获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）"
 RICE_hangzhou_historical_aspiration_action_lu_you:0 "#italic 当今朝廷官员昏庸无能，我与同僚力主伐金，他们却始终拒绝为收复宋朝北方失地做准备，我已心生厌倦，是时候辞官归隐，在安宁中度过余生。#!$RICE_hangzhou_aspiration_lu_you_desc$"
 RICE_hangzhou_historical_aspiration_modifier_desc_lu_you:0 "[GetModifier('RICE_hangzhou_aspiration_retire_into_seclusion').GetNameWithTooltip]"
 RICE_hangzhou_aspiration_retire_into_seclusion:0 "[RICE_aspiration|E]：归隐山林"
 RICE_hangzhou_aspiration_retire_into_seclusion_desc:0 "#italic 陆游竭力主张北伐，对当今朝廷官员昏庸无能，于是心生厌倦，因此渴望辞官归隐，安度晚年。#!$RICE_hangzhou_aspiration_lu_you_desc$\n\n"
