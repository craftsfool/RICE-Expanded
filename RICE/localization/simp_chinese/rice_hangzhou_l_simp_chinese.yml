 hangzhou.0030.t:0 "去西湖"
 hangzhou.0030.desc:0 "[GetTitleByKey('c_hangzhou').GetNameNoTier]最负盛名的景点当属西湖，历代文人雅士都应当至少造访一次，若是可以多次更好。\n\n为此我已做好游览西湖的准备。届时我与同伴应沉浸于那片闻名遐迩的美景中，欣赏湖边众多著名的景点。"
 hangzhou.0030.a:0 "去[GetTitleByKey('c_hangzhou').GetNameNoTierNoTooltip]！"
 hangzhou.0031.t:0 "进入西湖"
 hangzhou.0031.desc:0 "我们在[GetTitleByKey('c_hangzhou').GetNameNoTier]繁华的街道上走了许久，终于来到了著名的西湖！\n\n这里的热闹程度丝毫不亚于繁华街市，各色行人汇聚于此，从看似博学的官员、身着华服的歌伎，叫卖货物的商贩再，再到前来寺庙敬拜的香客，不一而足。\n\n忽然，有个小贩向我招手，自豪地说道：“官人，您是第一次来？还是来了多次？要我说游西湖都得有个好向导指点该去哪儿看哪里！就算是西湖的老游客，要是没人指点看见美景也准会大吃一惊！”"
 hangzhou.0031.a:0 "买一本指南"
 hangzhou.0031.b:0 "忽略这个[guide_vendor.GetWomanMan]"
 hangzhou.0032.t:0 "做些什么？"
 hangzhou.0032.desc:0 "任何人一到西湖，就知晓此地为何如此闻名遐迩。\n\n翠叶、湖波、湖边如繁星般的寺庙，处处皆美景，步步可游玩，如此多美景，从何开始呢？\n\n我与同游商量一二，得出几个不错的去处。"
 hangzhou.0032.a:0 "西湖园林与公园"
 hangzhou.0032.b:0 "行走湖边进行畅谈"
 hangzhou.0032.c:0 "敬拜寺庙，思索人生"
 hangzhou.0032.d:0 "享用美味，品尝佳肴"
 hangzhou.0032.inspired:0 "西湖之旅让你深有感悟"
 hangzhou.0033.t:0 "该回家了"
 hangzhou.0033.desc:0 "西湖时光转瞬即逝，无奈乎文人雅士总是赞美西湖美景如画、令人流连忘返。\n\n可惜，我们总得回到劳碌的世界，回到我们的日常生活。\n\n但西湖美景的记忆忆将会伴随我们很长时间。"
 hangzhou.0033.a:0 "也许有一天我们能再来。"
 hangzhou.0034.t:0 "十景"
 hangzhou.0034.desc:0 "在游览西湖期间，我们特意抽出时间欣赏了著名的[RICE_ten_scenes_of_west_lake|E]。\n\n虽然我们无法亲眼观赏全部十景，但我们仍尽力饱览所能看到的景色。\n\n如世人所言，十景闻名遐迩自有其道理，摄人心魄的景致、鬼斧神工的奇观、生机盎然的美景。任凭人们如何形容，唯有亲身领略，方能体会那种难以言传的震撼。"
 hangzhou.0034.a:0 "西湖美景，千年无双！"
