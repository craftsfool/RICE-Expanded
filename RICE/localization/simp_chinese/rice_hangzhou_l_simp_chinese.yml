 RICE_hangzhou_84000_stupas_interaction:0 "赠送小佛塔"
 RICE_hangzhou_84000_stupas_interaction_desc:0 "将委托制作的一座小宝塔赠予[recipient.GetShortUINamePossessiveNoTooltip]。"
 RICE_hangzhou_84000_stupas_interaction_notification:0 "为恩惠众生，我前些时日命人铸造了八万四千座小佛塔。恳请施主慈悲收下一座，以作供养。"
 RICE_hangzhou_84000_stupas_interaction_effect:0 "[recipient.GetShortUINameNoTooltip]获得了一件#V $RICE_hangzhou_84000_miniature_stupa_artifact_name$#![artifact|E]。"
 RICE_hangzhou_84000_miniature_stupa_artifact_name:0 "小佛塔"
 RICE_hangzhou_84000_miniature_stupa_artifact_desc:0 "这是[stupa_builder.GetTitledFirstName]为效仿印度伟大君主阿育王而督造的八万四千座微型青铜佛塔之一。"
 RICE_opinion_mini_stupa_gift:0 "赠送一座小佛塔"
 RICE_hangzhou_84000_stupas_modifier:0 "八万四千小佛塔"
 RICE_hangzhou_84000_stupas_modifier_desc:0 "该角色效法伟大的[GetReligionByKey('buddhism_religion').GetAdjective]君主阿育王，下令建造了八万四千座微型佛塔，并将佛教[Glossary( '典籍', 'BUDDHIST_SUTRAS_GLOSS' )]抄本供奉于塔内。\n\n#Emp 拥有特殊的[interaction|E]能力，可用#V $RICE_hangzhou_84000_stupas_interaction$#!与其他[rulers|E]#!进行互动。"
 RICE_hangzhou_84000_miniature_stupas_decision:0 "委托制作八万四千座小佛塔"
 RICE_hangzhou_84000_miniature_stupas_decision_tooltip:0 "我应该效仿阿育王！"
 RICE_hangzhou_84000_miniature_stupas_decision_desc:0 "根据[GetReligionByKey('buddhism_religion').GetAdjective]传说，阿育王曾委托建造了八万四千座小佛塔以供奉佛陀舍利并传播佛陀的教义。在这个充满苦难和斗争的时代，人们需要精神上的鼓舞，因此我将效仿阿育王的做法。"
 RICE_hangzhou_84000_miniature_stupas_decision_effect_tooltip_1:1 "获得小佛塔[artifact|E]"
 RICE_hangzhou_84000_miniature_stupas_decision_effect_tooltip_2:1 "可以与其他[rulers|E]进行#V $RICE_hangzhou_84000_stupas_interaction$#![interaction|E]"
 RICE_hangzhou_84000_miniature_stupas_decision_confirm:0 "愿此法富济众生！"
 RICE_hangzhou_84000_miniature_stupas_decision_context_tooltip:0 "#emphasis 历史背景：#!五代十国时期，定都杭州的吴越国成为佛教的重要中心。吴越末代君主钱俶笃信佛教，效仿印度阿育王典故，于公元955年和965年间铸造了“八万四千宝塔”。这些微型供养塔内部藏有《宝箧印陀罗尼经》[Glossary( '等典籍', 'BUDDHIST_SUTRAS_GLOSS' )]，被称为“阿育王塔”或“宝箧印塔”，旨在祈求保境安民、广行布施，部分塔甚至远传至日本。尽管他的行为可能是最著名的，但有证据表明，吴越的佛教信徒也委托建造了类似的佛塔，例如8世纪的日本称德天皇据称亦敕造逾百万座微型佛塔。"
 hangzhou.0025.desc.actor:0 "我效仿阿育王的先例，命人铸造了八万四千座小佛塔，但将这些[GetReligionByKey('buddhism_religion').GetAdjective]珍宝私藏又有何用？\n\n我已向[recipient.GetTitledFirstName]赠予其中一座青铜小塔，并附上经卷等礼物以示善意。愿此举能激励[recipient.GetHerHim]竭尽所能济度众生之苦，广弘佛法。"
 hangzhou.0025.desc.recipient:0 "\n正如伟大的[GetReligionByKey('buddhism_religion').GetAdjective]君主阿育王那般，[actor.GetTitledFirstName]亦效仿其用青铜浇灌建造八万四千座小佛塔。\n\n为示友好，[actor.GetSheHe]将其中一座微型宝塔，连同其他次要的[GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip]经卷与宝物赠予了我。得此佛塔启迪，让我们竭尽所能普度众生，广弘佛法。"
 building_type_RICE_hangzhou_gardens_of_suzhou:0 "苏州园林"
 building_type_RICE_hangzhou_gardens_of_suzhou_desc:0 "苏州内园林大多由当地乡绅世家建造和维护，这些园林因仿效自然风光而闻名，此外也深刻影响了中原其他园林的发展与演变。"
 building_RICE_hangzhou_gardens_of_suzhou:0 "$building_type_RICE_hangzhou_gardens_of_suzhou$"
 building_RICE_hangzhou_gardens_of_suzhou_desc:0 "$building_type_RICE_hangzhou_gardens_of_suzhou_desc$"
