 RICE_hangzhou_west_lake_dredging_modifier:0 "西湖：疏通淤泥"
 RICE_hangzhou_west_lake_dredging_modifier_desc:0 "近日，当地官员明智地决定对$c_hangzhou$著名景点西湖进行清淤工作，以维护其水质与景观。\n\n$RICE_hangzhou_west_lake_decision_modifier_small_desc$\n\n"
 RICE_hangzhou_west_lake_patrols_modifier:0 "西湖：加强巡逻"
 RICE_hangzhou_west_lake_patrols_modifier_desc:0 "近日，当地官员明智地加强了$c_hangzhou$著名景点西湖的巡逻力度，维护该区域的安全秩序，并防止过度热情的游客破坏其自然环境。\n\n$RICE_hangzhou_west_lake_decision_modifier_small_desc$\n\n"
 RICE_hangzhou_west_lake_repairs_modifier:0 "西湖：修复基础设施"
 RICE_hangzhou_west_lake_repairs_modifier_desc:0 "近日，当地官员明智地决定对$c_hangzhou$著名景点西湖周边的各类建筑进行修缮，维护该地区建筑的美观与安全。\n\n$RICE_hangzhou_west_lake_decision_modifier_small_desc$\n\n"
 RICE_hangzhou_west_lake_landscaping_modifier:0 "西湖：美化景观"
 RICE_hangzhou_west_lake_landscaping_modifier_desc:0 "近日，当地官员明智地决定对$c_hangzhou$著名景点西湖周边景观进行额外美化。进一步提游客的视觉吸引力。\n\n$RICE_hangzhou_west_lake_decision_modifier_large_desc$\n\n"
 RICE_hangzhou_west_lake_religious_structures_modifier:0 "西湖：新增宗教建筑"
 RICE_hangzhou_west_lake_religious_structures_modifier_desc:0 "近日，当地官员明智地决定在$c_hangzhou$西湖周边建造一座新的宗教建筑，进一步提升西湖对游客的精神吸引力。\n\n$RICE_hangzhou_west_lake_decision_modifier_large_desc$\n\n"
 RICE_hangzhou_yue_kilns_modifier:0 "越窑"
 RICE_hangzhou_yue_kilns_modifier_desc:0 "上林湖周边遍布着[Glossary( '龙窑', 'DRAGON_KILN_GLOSS' )]，生产著名的越窑青瓷，这是一种自古闻名的[Glossary( '青瓷', 'CELADON_GLOSS' )]器具，这些青瓷在全世界被广泛交易。"
 RICE_hangzhou_longquan_kilns_modifier:0 "龙泉窑"
 RICE_hangzhou_longquan_kilns_modifier_desc:0 "龙泉县的[Glossary( '龙窑', 'DRAGON_KILN_GLOSS' )]生产一种以美观和技术发展而闻名的[Glossary( '青瓷', 'CELADON_GLOSS' )]，因此这些陶瓷在全世界广泛交易。"
 RICE_east_asian_won_poetry_contest:0 "赢得诗会"
 RICE_east_asian_won_poetry_contest_desc:0 "该角色在一次诗会上即兴赋诗，其诗作被公认为当场最佳，令众人深感钦佩。"
 RICE_east_asian_fraternized_with_poets:0 "与文人交往"
 RICE_opinion_poetry_gathering:0 "愉快的诗会"
 RICE_opinion_grand_poetry_gathering:0 "邀请我参加一场盛大的诗会。"
 RICE_hangzhou_qiantang_river_embankment_modifier:0 "钱塘江堤"
 RICE_hangzhou_qiantang_river_embankment_modifier_desc:0 "最近钱塘江修建了一道堤坝，保护这片土地免受钱塘江大潮的侵袭，这项工程背后有着无数英勇无畏的传说在流传。"
 RICE_hangzhou_liberated_old_man:0 "放翁"
 RICE_hangzhou_liberated_old_man_desc:0 "在官场上被同僚指责为“不拘礼法，恃酒颓放”，于是陆游索性[Glossary( '自号', 'ART_NAME_GLOSS' )]“放翁”，并在诗中自我嘲解，退隐后，纵情自在、无拘无束。"
 RICE_hangzhou_su_causeway_modifier:0 "西湖长堤"
 RICE_hangzhou_su_causeway_modifier_desc:0 "当地官员最近在[RICE_west_lake|E]修建了一条宏伟的长堤，进一步提升了西湖的美景。"
 RICE_hangzhou_built_su_causeway:0 "在西湖修建堤道"
 RICE_hangzhou_built_su_causeway_desc:0 "该角色近期在[RICE_west_lake|E]主导修建一条新的堤道工程。"
 RICE_hangzhou_west_lake_relaxation_modifier:0 "探索西湖园林与公园"
 RICE_hangzhou_west_lake_socialization_modifier:0 "在西湖社交"
 RICE_hangzhou_west_lake_reflection_modifier:0 "游览西湖周遭寺庙"
 RICE_hangzhou_west_lake_indulgence_modifier:0 "西湖野餐"
 RICE_hangzhou_improve_west_lake:0 "开发西湖"
 RICE_hangzhou_improve_west_lake_tooltip:0 "[RICE_west_lake|E]需要大量工作来维护或提升其美景"
 RICE_hangzhou_improve_west_lake_desc:0 "[RICE_west_lake|E]作为[GetTitleByKey('c_hangzhou').GetNameNoTier]的著名地标，需要定期维护甚至改善其水质与美景。"
 RICE_hangzhou_improve_west_lake_effect_tooltip_1:1 "只要此[decision|E]的[county_modifiers|E]处于激活状态，[GetActivityType( 'activity_RICE_hangzhou_sightsee_at_west_lake' ).GetName][activity|E]提供的失去[stress_loss_i|E][stress_loss|E]效果将增强。"
 RICE_hangzhou_improve_west_lake_effect_tooltip_2:1 "对[RICE_west_lake|E]进行的每项#V 新改造#!都会略微提高[RICE_ten_scenes_of_west_lake|E]被选入的概率"
 RICE_hangzhou_improve_west_lake_confirm:0 "西湖的美景将永存！"
 RICE_hangzhou_improve_west_lake_context_tooltip:0 "$RICE_hangzhou_sightsee_at_west_lake_context_tooltip$多年来，地方官员需要牵头开展各类项目来美化或改造这片区域。其中著名的工程包括8世纪著名诗人（兼太守）白居易和11世纪苏轼主持修建的堤道。"
