 hangzhou.0100.t:0 "闲人问题"
 hangzhou.0100.desc:0 "今日，在我向追随者们征询作为[ROOT.Char.GetTitleAsNameNoTooltip]应当采取何种行动后，[courtier.GetTitledFirstName]给出了相当激进的回答。\n\n“近来在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的集市上，[Glossary( '游手好闲之徒', 'YOU_SHOU_GLOSS' )]实在太多了，若是不加以惩戒，恐终酿灾祸”[courtier.GetTitledFirstName]说道\n\n部分人点头附议，提议将这些人驱逐出集市，或加以惩处，起码引导他们正当劳作。另一些人则不是很赞同，认为此举将浪费我们的资源。"
 hangzhou.0100.a:0 "将他们逐出市场便已足够。"
 hangzhou.0101.t:0 "市场里的闲人"
 hangzhou.0101.desc:0 "“小心那几个[Glossary( '游手', 'YOU_SHOU_GLOSS' )]，”[traveler.GetFirstName]在我们穿过[ROOT.Char.GetCurrentLocation.GetName]的街道时警告我。\n\n“那几个有什么问题？”我问[traveler.GetHerHim]，“看起来像是流民。”\n\n“正是看着无害，才是最大的危害，”[courtier.GetFirstNameNoTooltip]强调道，“他们好吃懒做，保不准哪天就犯了事。”"
 hangzhou.0101.a:0 "怕是懒人也懒得犯事。"
 hangzhou.0102.t:0 "不值当的旅游"
 hangzhou.0102.desc:0 "“简直身临其境一样！”[courtier.GetFirstName]倚靠在座位上感叹道，“谁还需要亲自远行呢？”\n\n今日我们几人聚在我宅邸休憩，为增添雅趣，便决定来一场[Glossary( '卧游', 'WO_YOU_GLOSS' )]。\n\n我们欣赏着一位擅此道的文人所作的山水画，不禁感慨这些画作如此生动鲜活、笔触细腻，如同亲临其境一般。"
 hangzhou.0102.a:0 "这样舒舒服服地“旅行”也很有趣呢！"
 hangzhou.0103.t:0 "龙井茶"
 hangzhou.0103.desc:0 "[GetTitleByKey('c_hangzhou').GetNameNoTier]西湖西南的龙井一带盛产茶叶。这里的茶叶虽不为外界广泛知晓，但当地人却将其视为难得的上品。\n\n我正好有些门路，可以从当地茶农那里采购一些。最近我想到，不妨多备上一些，既可以自己品尝，也可以在各类社交场合中款待宾客。"
 hangzhou.0103.a:0 "我应该买点这种鲜为人知的好茶。"
 hangzhou.0104.t:0 "暖风熏得游人醉"
 hangzhou.0104.desc:0 "我今天遇见[courtier.GetTitledFirstName]时，他看起来相当恼怒烦躁，便问[courtier.GetHerHim]怎么了。\n\n“今日闻人议及[RICE_west_lake|E]，实在可气。”[courtier.GetSheHe]说道。[courtier.GetSheHe|U]怒视着窗外，仿佛外面有什么东西激怒了[courtier.GetHerHim]。[courtier.GetSheHe]继续愤愤道：“知君必谓彼处山水怡情、足堪游乐——然则此#italic 正是#!祸根所在！!”\n\n我刚想开口，[courtier.GetSheHe]又滔滔不绝起来：“当此胡马窥江、蠹吏蚀朝之日，世人安得效鸥鹭忘机乎？彼[RICE_west_lake|E]浪荡子非惟尸位，实乃戕政！或耽丝竹而荒案牍，或慕烟霞而废经纶。不思祖逖中流誓，反效贾生鹏鸟悲。此辈但求片时醉梦，竟置社稷疮痍于罔闻，岂非畏葸豚犬耶？”"
 hangzhou.0104.a:0 "先生真乃忠正之士！"
 hangzhou.0105.t:0 "定胜糕"
 hangzhou.0105.desc:0 "今日，在一场小聚上，[courtier.GetTitledFirstName]赠予我一份新鲜出炉于[GetTitleByKey('c_hangzhou').GetNameNoTier]的[Glossary('定胜糕', 'GLOSS_DING_SHENG_GAO')]。\n\n“祝大人屡战屡胜，”[courtier.GetFirstNameNoTooltip]向我举杯致意，随后我们便开始享用这份糕点。"
 hangzhou.0105.a:0 "有心了，多谢！"
 hangzhou.0106.t:0 "《白蛇传》"
 hangzhou.0106.desc:0 "近来，我注意到[GetTitleByKey('c_hangzhou').GetNameNoTier]的白蛇传说日益流行，从街头艺人与戏班的演绎到文人雅集间的即兴赋诗，都在传颂这个故事。\n\n众人对情节发展各有偏爱，但主线总关乎一位美艳绝伦的白蛇精诱惑年轻书生的故事。在某些版本中，书生最终丧命或至少身染重疾；而在另一些版本里，则有一位正直勇武的僧人降伏白蛇，将其镇压于[GetTitleByKey('c_hangzhou').GetNameNoTier]著名的[RICE_west_lake|E]畔佛塔之下，从而拯救了书生。"
 hangzhou.0106.a:0 "我偏爱那些书生因贪恋美色而遭受惩罚的版本。"
 hangzhou.0107.t:0 "兰亭集会"
 hangzhou.0107.desc:0 "我最近读到，许多世纪前，伟大的政治家与书法家王羲之主持的[Glossary( '曲水流觞', 'WINDING_STREAM_PARTY_GLOSS' )]雅集。其中最著名的，或许要数在[GetTitleByKey('b_kuaiji').GetNameNoTier]附近举办的兰亭集会，当时他邀请了当时最杰出卓越的士人共饮并切磋诗艺。\n那时无与伦比的文雅氛围令人神往，先贤诗人以雷霆骤雨般的激情与才思，创作出一篇又一篇绝世诗作。"
 hangzhou.0107.a:0 "今日的诗人远不及先贤。"
 hangzhou.0108.t:0 "西施"
 hangzhou.0108.desc:0 "今日读书看到夫差寻得西施，终日荒淫，荒废朝政，才致吴国被越所灭，读后感慨，世人多知[Glossary( '四大美人', 'FOUR_BEAUTIES_GLOSS' )]之事，却不知其结尾。"
 hangzhou.0108.a:0 "后人云西施可能自尽于吴王，恐怕这是真的。"
