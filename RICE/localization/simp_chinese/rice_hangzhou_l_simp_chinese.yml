 hangzhou.0020.t:0 "大海堤"
 hangzhou.0020.desc:0 "钱塘江壮丽奇观，却也酿成无数灾祸，千百年来扰得百姓流离失所。前人修筑的海塘屡屡溃决，今日我修建海塘，定要比旧堤更能抵御江潮侵蚀。\n\n至于当地人畏惧江中龙王，我命弓箭手向江面射箭，安定人心，治水之业需世代坚守，这座新海堤亦当为后世治水工程奠定根基。"
 hangzhou.0020.a:0 "绝不能让钱塘江肆意泛滥。"
 hangzhou.0021.t:0 "改善西湖"
 hangzhou.0021.desc:0 "[GetTitleByKey('c_hangzhou').GetNameNoTier]西湖吸引了历代游客，其受欢迎程度似乎从未减弱。\n\n美景胜收，实乃幕后不懈维护——扩建现有设施和美化环境，防范游客的破坏和污染。\n\n作为[ROOT.Char.GetTitleAsNameNoTooltip]，我已下令官员启动此项目，并为此召集了大量资源和劳工。"
 hangzhou.0021.a:0 "愿西湖继续繁荣！"
 hangzhou.0022.t:0 "[ROOT.Char.GetDynasty.GetNameNoTooltip]堤"
 hangzhou.0022.desc:0 "虽然[RICE_west_lake|E]至今仍被誉为[GetTitleByKey('c_hangzhou').GetNameNoTier]胜景之一，但近年来其风华已因淤塞、无知乡民种植栗树及其他形式的生态破坏而蒙尘。古时历任官员曾主持修筑堤堰以缓解此患。\n\n如今，轮到我主导这样的工程了。我已征调民工，着手利用清淤所得的泥沙建造一座宏伟长堤——这将是迄今最宏大的堤道，其上还将架设六座桥梁以连通湖域各处。它将守护#italic 并#!增辉湖光山色，使后世之人皆能继续领略其风雅。\n\n有趣的是，似乎已有乡民开始称此堤为[ROOT.Char.GetDynasty.GetName]堤，以表对我的敬意！"
 hangzhou.0022.a:0 "“[ROOT.Char.GetDynasty.GetName]堤”？听起来真不错。"
 hangzhou.0023.t:0 "岳飞庙"
 hangzhou.0023.desc:0 "多年前，名将岳飞率领大宋军队北伐伪金，却遭奸臣构陷，尤以秦桧为甚。岳飞身负莫须有之罪，终致下狱遇害。幸有义士隗顺，甘冒生命之险，暗中将岳飞遗体移葬于寺庙之下。\n\n此后，岳飞冤屈终获昭雪，遗骸得以重见天日。如今，天下更盼这位蒙冤的英雄能得享应有的尊崇！\n\n故此，我已经下令于[GetTitleByKey('c_hangzhou').GetNameNoTier]其墓旁修建祠庙，并铸奸臣秦桧及其党羽铁像，长跪墓前，供万世唾骂。自此，天下怀德勇之士，当铭记岳飞忠烈风骨，永祀英灵！"
 hangzhou.0023.a:0 "愿岳飞将军在天之灵庇佑我们！"
 hangzhou.0024.t:0 "八万四千塔"
 hangzhou.0024.desc:0 "很久以前，天竺历史上最伟大的[GetReligionByKey('buddhism_religion').GetAdjective]君主君主阿育王，曾建造了成千上万座微型佛塔，分发到王国各处，以传播佛陀的教义。\n\n为了减轻一切众生的苦难，通过传播佛陀的教义，我同样委托制作了超过八万四千座微型青铜佛塔。我们目前生活在艰难的时代，战争、瘟疫和贫困已成为常态；愿这些佛塔，以及诸佛菩萨的慈悲，能够激励并治愈所有人！"
 hangzhou.0024.a:0 "愿众生早日脱离苦海！"
 hangzhou.0025.t:0 "$hangzhou.0024.t$"
 hangzhou.0025.a:0 "愿此法富济众生！"
