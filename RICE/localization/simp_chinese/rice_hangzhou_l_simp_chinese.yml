 RICE_hangzhou_watch_qiantang_tide_fun_intent_header:0 "享乐："
 RICE_hangzhou_watch_qiantang_tide_fun_intent:0 "享乐"
 RICE_hangzhou_watch_qiantang_tide_fun_intent_desc:0 "欣赏激动人心的钱塘大潮，将失去[stress_loss_i|E][stress|E]，若你拥有[GetTrait('brave').GetName( GetNullCharacter )|U]或[GetTrait('gregarious').GetName( GetNullCharacter )]特质则会失去更多。"
 RICE_hangzhou_watch_qiantang_tide_ritual_intent_header:0 "祭祀："
 RICE_hangzhou_watch_qiantang_tide_ritual_intent:0 "祭祀"
 RICE_hangzhou_watch_qiantang_tide_ritual_intent_desc:0 "我们必须尊崇龙王，额外获得[piety_i|E][piety|E]。如果你拥有[GetTrait('zealous').GetName( GetNullCharacter )|U]或[GetTrait('diligent').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]"
