 activity_RICE_hangzhou_watch_qiantang_tide_host_an_a:0 "$host_activity_a$"
 activity_RICE_hangzhou_watch_qiantang_tide:0 "钱塘观潮"
 activity_RICE_hangzhou_watch_qiantang_tide_desc:0 "浙江之潮，天下伟观也。自既望以至十八日为最盛。方其远出海门，仅如银线，既而渐进，则玉城雪岭，际天而来，大声如雷霆，震撼激射，吞天沃日，势极豪雄。"
 activity_RICE_hangzhou_watch_qiantang_tide_selection_tooltip:0 "在[GetTitleByKey('b_qiantang').GetNameNoTier]观钱塘江潮\n\n$RICE_hangzhou_watch_qiantang_tide_context_tooltip$"
 activity_RICE_hangzhou_watch_qiantang_tide_host_desc:0 "\n$BULLET_WITH_TAB$减少[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$增加[opinion_i|E][opinion|E]\n$BULLET_WITH_TAB$增加[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$@warning_icon!#X 有极低概率受伤或@death_icon!死亡，导致奖励减少#!\n\n$BULLET_WITH_TAB$#P 如果你在潮神节期间（#V 8月#!或#V 9月#!）抵达，即可获得额外奖励！#!"
 activity_RICE_hangzhou_watch_qiantang_tide_guest_desc:0 "$activity_RICE_hangzhou_watch_qiantang_tide_host_desc$"
 activity_RICE_hangzhou_watch_qiantang_tide_province_desc:0 "在这里可以观赏钱塘江潮水。"
