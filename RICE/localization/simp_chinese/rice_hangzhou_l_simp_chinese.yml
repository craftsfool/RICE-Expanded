 hangzhou.0080.t:0 "宾客到来"
 hangzhou.0080.desc.host:0 "远近博学风雅之士齐聚寒舍，共享今宵美酒佳肴、妙谈高论，自当还有诗词相和。\n\n身为主人迎候宾朋之际，我希望这是个令人难忘的夜晚！谈笑有鸿儒，往来无白丁。且看今宵谁为诗中魁首……"
 hangzhou.0080.desc.guest:0 "远近博学风雅之士齐聚[host.GetTitledFirstNamePossessive]府邸，共享美酒佳肴、妙谈高论，自当还有诗词相和。\n\n我向主人[host.GetFirstNameNoTooltip]迎候宾朋之际问好，我希望这是个令人难忘的夜晚！谈笑有鸿儒，往来无白丁。且看今宵谁为诗中魁首……"
 hangzhou.0080.a:0 "且待今宵！"
 hangzhou.0081.t:0 "诗会现在开始"
 hangzhou.0081.desc:0 "今晚聚集于此的文人雅士们已花了不少时间享用佳肴、畅饮美酒，并互相讨论政治甚至哲学等深奥话题。\n\n但现在真正的乐趣即将开始——诗会。诗会的玩法多种多样，但常见的一种是让参与者随机抽取主题即兴赋诗，并由众人共同评选出最佳诗作。\n\n随着第一轮诗赛开始，终于轮到我了。我看向抽到的题目是#V [ROOT.Char.Custom('RICE_poetry_gathering_poem_random_topic')]#!。"
 hangzhou.0081.a:0 "我思考片刻，然后开始说道……"
 hangzhou.0082.t:0 "获胜的诗人"
 hangzhou.0082.desc:0 "我们度过了一个充美酒佳肴，才思对碰的夜晚，所有参与者都即兴创作诗歌，期间佳作频出，若说谁拔得头筹？毫无争议的诗人显然是："
 hangzhou.0082.desc.host:0 "舍我其谁？"
 hangzhou.0082.desc.attendee:0 "肯定是[poetry_winner.GetTitledFirstName]！"
 hangzhou.0082.desc.local_literati:0 "$hangzhou.0082.desc.fallback$[poetry_winner.GetTitledFirstName]"
 hangzhou.0082.desc.fallback:0 "被邀请来这里的当地世家才子"
 hangzhou.0082.desc.conclusion:0 "\n\n众人齐声欢呼，要求再诵一遍诗篇，好让大家细细品味字句间的精妙。"
 hangzhou.0082.a:0 "再来一次，再来一次！"
 hangzhou.0083.t:0 "xxxx"
 hangzhou.0083.desc:0 "xxxx"
 hangzhou.0083.a:0 "xxxx"
 hangzhou.0084.t:0 "深夜时分"
 hangzhou.0084.desc:0 "夜色渐深，佳肴已尽，杯盏已空，宾客散去，或闲坐，或讨论，诗会已落幕。\n\n能与这般博学之士共聚一堂，共享灵感，若是不济，也是缔结情谊的良机。\n\n但如今，也该告辞了，又或者在此小憩片刻？"
 hangzhou.0084.a:0 "天下无不散之筵席。"
 hangzhou.0085.t:0 "吉祥的会面？"
 hangzhou.0085.desc:0 "随着诗会渐近尾声，我一直与[recruit_option.GetFirstName]进行愉快的交谈，[recruit_option.GetSheHe]同为当地文人，也喜好吟诗、美食和美酒。\n\n“恕我冒昧，”[recruit_option.GetFirstNameNoTooltip]轻啜一口[ROOT.Char.Custom('RegionalAlcoholicDrink')]后放下杯说道，“大人，您是我见过最具洞见的[ROOT.Char.GetWomanMan]，如此投缘，恳请您允许鄙人愿追随左右，相信我们定能相互成就。”"
 hangzhou.0085.a:0 "“得先生一人，此乃我之幸！”"
 hangzhou.0085.b:0 "“恕我拒绝。”"
