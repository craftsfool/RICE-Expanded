 hangzhou.0040.t:0 "西湖十景"
 hangzhou.0040.desc:0 "[GetTitleByKey('c_hangzhou').GetNameNoTier]西湖自古以来便被世人尤为追捧，可惜许多前来游览的游客只是附庸风雅之辈，未能真正欣赏其美。\n\n近来，人们纷纷热议西湖美景，如果我们这些真正欣赏西湖的人能够向他人传授如何欣赏它的美景，或许每个人都能更加领略其中韵味。\n\n我参考了其他见多识广的文人所著文章，并与游历过西湖的友人探讨后，归纳出十处最能体现西湖之美的景致。这些是游客游览时应当寻访的胜景，我将通过创作……来印证我的观点。"
 hangzhou.0040.a:0 "详细描写西湖地标"
 hangzhou.0040.b:0 "绘制西湖美丽"
 hangzhou.0040.tooltip:0 "$RICE_hangzhou_ten_scenes_west_lake_decision_effect_tooltip_2$"
 hangzhou.0041.t:0 "$hangzhou.0040.t$"
 hangzhou.0041.desc:0 "[GetTitleByKey('c_hangzhou').GetNameNoTier]西湖每年都吸引众多游客造访，文人雅士们也越来越热衷于讨论西湖最美的景色是什么。\n\n一位对西湖颇有研究的大家[ten_scenes_promoter.GetTitledFirstName]，精心挑选了[ten_scenes_promoter.GetSheHe]心目中的西湖十大美景，并希望通过这种方式，让西湖的游客（尤其是附庸风雅之辈）更好地了解西湖的独特魅力。\n\n显然，其大作收获成效，“西湖十景”之说如今已广为流传。"
 hangzhou.0041.a:0 "下次去西湖时，我一定要寻访那十处胜景！"
