 activity_RICE_east_asian_poetry_gathering_host_an_a:0 "$host_activity_a$"
 activity_RICE_east_asian_poetry_gathering:0 "诗会"
 activity_RICE_east_asian_poetry_gathering_desc:0 "我应该把那些才思敏捷、谈吐不凡、富有学识的人们聚集在一起，共享诗歌与艺术的妙趣！"
 activity_RICE_east_asian_poetry_gathering_selection_tooltip:0 "与当地的文人雅士聚会，共赏诗歌。\n\n$RICE_east_asian_poetry_gathering_context_tooltip$"
 activity_RICE_east_asian_poetry_gathering_host_desc:0 "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$增加[opinion_i|E][opinion|E]\n$BULLET_WITH_TAB$增加[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[merit_i|E][merit|E]\n$BULLET_WITH_TAB$有概率获得诗歌[artifacts|E]或高技能的[courtiers|E]\n$BULLET_WITH_TAB$在[GetTrait('lifestyle_poet').GetName(GetNullCharacter)]和[GetTrait('confucian_education').GetName(GetNullCharacter)][trait|E]路线中增加[trait_level_track_xp|E]\n$BULLET_WITH_TAB$赢得诗歌比赛有概率获得额外奖励，奖励取决于你的[traits|E]和[diplomacy_i|E][diplomacy|E]以及[learning_i|E][learning|E]"
 activity_RICE_east_asian_poetry_gathering_guest_desc:0 "$activity_RICE_east_asian_poetry_gathering_host_desc$"
 activity_RICE_east_asian_poetry_gathering_province_desc:0 "可以在此举办诗会。"
 activity_RICE_east_asian_poetry_gathering_destination_selection:0 "$activity_RICE_east_asian_poetry_gathering_province_desc$"
 activity_RICE_east_asian_poetry_gathering_guest_help_text:0 "$activity_RICE_east_asian_poetry_gathering$"
 activity_RICE_east_asian_poetry_gathering_predicted_cost:0 "[activity|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_east_asian_poetry_gathering_conclusion_desc:0 "[GetActivityType( 'activity_RICE_east_asian_poetry_gathering' ).GetName]已经结束，在此期间优雅和雄辩的氛围令人难忘！"
 activity_RICE_east_asian_poetry_gathering_type:0 "诗会规模"
 RICE_east_asian_poetry_gathering_type_normal:0 "休闲宴会"
 RICE_east_asian_poetry_gathering_type_normal_desc:0 "$EFFECT_LIST_BULLET$获得[influence_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_influence_gain')]#![influence|E]（如果有此资源）  \n$EFFECT_LIST_BULLET$获得#V [merit_i|E][GetPlayer.MakeScope.ScriptValue('miniscule_merit_gain')]#![merit|E]（如果有此资源）  \n$EFFECT_LIST_BULLET$降低遇见拥有不错[skills|E]的[courtiers|E]的概率  \n\n#weak 在私宅幽密氛围中享受诗歌与陪伴之乐。#!"
 RICE_east_asian_poetry_gathering_type_grand:0 "高雅竞争"
 RICE_east_asian_poetry_gathering_type_grand_desc:0 "$EFFECT_LIST_BULLET$获得[influence_i|E]#V [GetPlayer.MakeScope.ScriptValue('major_influence_gain')]#![influence|E]（如果有此资源）  \n$EFFECT_LIST_BULLET$获得#V [merit_i|E][GetPlayer.MakeScope.ScriptValue('minor_merit_gain')]#![merit|E]（如果有此资源）  \n$EFFECT_LIST_BULLET$所有参与者彼此获得[opinion_i|E]#P +10#![opinion|E]\n$EFFECT_LIST_BULLET$更高概率遇到拥有优秀[skills|E]的[courtiers|E]  \n\n#weak 前往当地知名花园，让聚集的诗人获得更多灵感。#!"
 RICE_east_asian_poetry_gathering_amenities_amount:0 "酒水茶饮"
 RICE_east_asian_poetry_gathering_amenities_amount_small:0 "少许"
 RICE_east_asian_poetry_gathering_amenities_amount_small_desc:0 "$EFFECT_LIST_BULLET$所有参与者获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('miniscule_prestige_gain')]#![prestige|E]\n$EFFECT_LIST_BULLET$参与者不会对此获得[opinion_i|E][opinion|E]\n$EFFECT_LIST_BULLET$遇到拥有高[skills|E]的[courtiers|E]概率降低\n\n#weak 本次诗会仅提供基础茶点。毕竟我们齐聚于此，更多是为品鉴佳作！#!"
 RICE_east_asian_poetry_gathering_amenities_amount_medium:0 "体面"
 RICE_east_asian_poetry_gathering_amenities_amount_medium_desc:0 "$EFFECT_LIST_BULLET$所有参与者获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_prestige_gain')]#![prestige|E]\n$EFFECT_LIST_BULLET$所有参与者对此获得[opinion_i|E]#P +5#![opinion|E]\n$EFFECT_LIST_BULLET$较大概率遇到拥有高[skills|E]的[courtiers|E]\n\n#weak 我等文人雅士聚会若是没有美酒佳肴，简直索然无味！#!"
 RICE_east_asian_poetry_gathering_amenities_amount_large:0 "大量"
 RICE_east_asian_poetry_gathering_amenities_amount_large_desc:0 "$EFFECT_LIST_BULLET$所有参与者获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('medium_prestige_gain')]#![prestige|E]\n$EFFECT_LIST_BULLET$所有参与者对此获得[opinion_i|E]#P +15#![opinion|E]\n$EFFECT_LIST_BULLET$极大概率遇到拥有高[skills|E]的[courtiers|E]\n\n#weak 美酒佳肴、才子佳作，不亦说乎？#!"
 RICE_east_asian_poetry_gathering_poetry_phase:0 "精致诗会"
 RICE_east_asian_poetry_gathering_poetry_phase_desc:0 "正如[Glossary( '夫子', 'CONFUCIUS_GLOSS' )]所言：#italic “兴于《诗》，立于礼，成于乐。”#!"
 RICE_east_asian_poetry_gathering_socialize_intent_header:0 "交际："
 RICE_east_asian_poetry_gathering_socialize_intent:0 "交际"
 RICE_east_asian_poetry_gathering_socialize_intent_desc:0 "与志同道合的文人雅士交往。获得[GetModifier('RICE_east_asian_fraternized_with_poets').GetNameWithTooltip][character_modifier|E]。若你拥有[GetTrait('lustful').GetName( GetNullCharacter )]或[GetTrait('gregarious').GetName( GetNullCharacter )|U]特质则额外失去[stress_loss_i|E][stress|E] "
 RICE_east_asian_poetry_gathering_fame_intent_header:0 "求名："
 RICE_east_asian_poetry_gathering_fame_intent:0 "求名"
 RICE_east_asian_poetry_gathering_fame_intent_desc:0 "让众人将知晓你的诗歌，或者至少会知道你认识一些优秀的诗人。获得额外[prestige_i|E][prestige|E]与[influence_i|E][influence|E]。若你拥有[GetTrait('arrogant').GetName( GetNullCharacter )]或[GetTrait('ambitious').GetName( GetNullCharacter )|U]特质则额外失去[stress_loss_i|E][stress|E] "
 RICE_east_asian_poetry_gathering_erudition_intent_header:0 "求胜："
 RICE_east_asian_poetry_gathering_erudition_intent:0 "求胜"
 RICE_east_asian_poetry_gathering_erudition_intent_desc:0 "享受诗歌本身的乐趣！增加获胜几率。在[GetTrait('lifestyle_poet').GetName(GetNullCharacter)]与[GetTrait('confucian_education').GetName(GetNullCharacter)][traits|E]中获得额外[trait_level_track_xp|E]。若你拥有[GetTrait('calm').GetName( GetNullCharacter )]或[GetTrait('humble').GetName( GetNullCharacter )|U]特质则额外失去[stress_loss_i|E][stress|E] "
 RICE_east_asian_poetry_gathering_recognize_literati_intent_header:0 "求贤："
 RICE_east_asian_poetry_gathering_recognize_literati_intent:0 "求贤"
 RICE_east_asian_poetry_gathering_recognize_literati_intent_desc:0 "尊重并支持当地文人。必定触发事件来招募一位带有[GetTrait('lifestyle_poet').GetName( GetNullCharacter )][trait|E]的[courtier|E]。若你拥有[GetTrait('diligent').GetName( GetNullCharacter )]或[GetTrait('trusting').GetName( GetNullCharacter )|U]特质则额外失去[stress_loss_i|E][stress|E] "
