 RICE_hangzhou_west_lake_decision_modifier_small_desc:0 "#Emp 只要该[county_modifier|E]处于激活状态，就会因#V $activity_RICE_hangzhou_sightsee_at_west_lake$#![activity|E]而持续产生少量[stress_loss_i|E] [stress_loss|E]#!"
