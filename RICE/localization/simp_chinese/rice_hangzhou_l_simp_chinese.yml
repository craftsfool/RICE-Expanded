 RICE_hangzhou_sightsee_at_west_lake_context_tooltip:0 "#emphasis 历史背景：#!西湖是杭州最著名的景点之一。自唐代以来，其秀美的风光和悠久的历史遗存一直备受赞誉，并启发了众多文人墨客与宗教人物。"
 RICE_hangzhou_west_lake_bought_guide_log_title:0 "购买指南"
 RICE_hangzhou_west_lake_bought_guide_log:0 "[CHARACTER.GetShortUIName|U]购买了一份标有[RICE_west_lake|E]所有重要旅游景点的指南。"
 RICE_hangzhou_west_lake_relaxation_log_title:0 "游览"
 RICE_hangzhou_west_lake_relaxation_log:0 "大家在西湖园林与公园中放松游览，度过了一段悠闲时光。"
 RICE_hangzhou_west_lake_socialization_log_title:0 "社交"
 RICE_hangzhou_west_lake_socialization_log:0 "大家在西湖边相谈甚欢。"
 RICE_hangzhou_west_lake_reflection_log_title:0 "探访"
 RICE_hangzhou_west_lake_reflection_log:0 "大家在探访西湖寺院时静思冥想，感悟良多。"
 RICE_hangzhou_west_lake_indulgence_log_title:0 "野餐"
 RICE_hangzhou_west_lake_indulgence_log:0 "大家在西湖边野餐，度过了一段惬意的时光。"
 RICE_hangzhou_west_lake_enjoyed_ten_scenes_log_title:0 "十景"
 RICE_hangzhou_west_lake_enjoyed_ten_scenes_log:0 "[CHARACTER.GetShortUIName|U]尽情欣赏着[RICE_ten_scenes_of_west_lake|E]中每一处景致。"
 RICE_hangzhou_watch_qiantang_tide_context_tooltip:0 "#emphasis 历史背景：#!流经杭州的钱塘江因其独特的地理环境，形成了世界上最大的潮涌奇观。这一壮丽景象已盛行数百年，尤以农历八月为盛——此时恰逢祭祀潮神（即“龙王”）的节庆。在宋代，当地民众甚至将踏浪而行作为仪式的一部分。"
 RICE_hangzhou_watch_qiantang_tide_injury_log_title:0 "受伤"
 RICE_hangzhou_watch_qiantang_tide_injury_log:0 "[CHARACTER.GetShortUIName|U]在观潮时被潮水打伤。"
 RICE_hangzhou_watch_qiantang_tide_death_log_title:0 "死亡"
 RICE_hangzhou_watch_qiantang_tide_death_log:0 "[CHARACTER.GetShortUIName|U]被潮水卷走，不幸溺亡。"
 RICE_east_asian_poetry_gathering_context_tooltip:0 "#emphasis 历史背景：#!历史上，在[Glossary( '中华文化圈', 'SINOSPHERE_GLOSS' )]，曾盛行一种以诗歌或文学为主题的社交聚会。参与者多为文人雅士或受过教育的男女，常被要求在给定题目后即兴赋诗。这类聚会规模宏大者不乏其例，例如1201年一场传奇的日本歌合战便进行了逾1500轮，其中还包含[Glossary( '曲水流觞', 'WINDING_STREAM_PARTY_GLOSS' )]等各类游戏或竞赛形式。"
 RICE_opinion_travel_while_lying_at_ease:0 "卧游"
 RICE_hangzhou_recent_travel_while_lying_at_ease:0 "$RICE_opinion_travel_while_lying_at_ease$"
 RICE_hangzhou_recent_travel_while_lying_at_ease_desc:0 "该角色最近参加了一个小型聚会，和其他几人一起[Glossary( '卧游', 'WO_YOU_GLOSS' )]，让他们暂时忘却烦恼，享受扮演游客的乐趣，而不必真正前往。"
 RICE_hangzhou_longjing_tea:0 "龙井茶供应"
 RICE_hangzhou_victory_cakes:0 "享受定胜糕"
 RICE_hangzhou_victory_cakes_desc:0 "该角色最近收到了一份[Glossary('定胜糕', 'GLOSS_DING_SHENG_GAO')]甜点。"
 RICE_hangzhou_idolizes_past_chinese_poets:0 "崇拜中国古代诗人"
 RICE_hangzhou_appreciates_modern_poetry:0 "欣赏当代诗歌"
 RICE_hangzhou_prefers_moral_endings:0 "偏爱具有道德寓意的故事结局"
 RICE_hangzhou_prefers_positive_endings:0 "偏爱结局美满的故事"
 RICE_hangzhou_prefers_tragic_endings:0 "偏爱悲剧结局的故事"
 RICE_hangzhou_unconventional_white_snake_story:0 "偏爱《白蛇传》的非传统结局"
 RICE_hangzhou_unconventional_white_snake_story_desc:0 "与许多人不同，该角色认为著名的白蛇传说如果稍作改动会成为一个更好的故事——将蛇妖塑造成主角，一位英勇且令人同情的女性，而高僧则变为反派，一个迂腐狂热之徒。但多数人觉得此人愚不可及，认为其想法绝无流行之可能。"
 RICE_opinion_west_lake_fun_outing:0 "乐游西湖"
 RICE_hangzhou_expelled_youshou:0 "驱逐游手"
 RICE_hangzhou_expelled_youshou_desc:0 "地方官员已下令，凡在本地区集市内发现的任何[Glossary( '游手', 'YOU_SHOU_GLOSS' )]都要驱逐出场，以儆效尤，遏制其懒惰之风。"
 RICE_hangzhou_punished_youshou:0 "驱逐游手"
 RICE_hangzhou_punished_youshou_desc:0 "地方官员已下令，凡在本地区集市内发现的任何[Glossary( '游手', 'YOU_SHOU_GLOSS' )]都要逮捕并严惩，以遏制其懒惰之风。"
 RICE_hangzhou_agriculture_youshou:0 "劝课农桑以减少游手"
 RICE_hangzhou_agriculture_youshou_desc:0 "地方官员推行多项举措，试图帮助并鼓励本区域的[Glossary('游手','YOU_SHOU_GLOSS')]成为勤恳耕作的农人，引导其摒弃懒惰之风。"
 RICE_hangzhou_ignore_youshou:0 "官员无视游手"
 RICE_hangzhou_ignore_youshou_desc:0 "地方官员对该地区[Glossary( '游手', 'YOU_SHOU_GLOSS' )]引发的社会问题置若罔闻。"
 RICE_hangzhou_comfortable_around_all_commoners:0 "平易近人"
 RICE_hangzhou_avoiding_suspicious_people:0 "敬而远之"
 RICE_hangzhou_ten_scenes_enjoyer:0 "西湖品鉴名家"
 RICE_hangzhou_ten_scenes_enjoyer_desc:0 "这位博学多闻的游者被视为最通晓[RICE_west_lake|E]奇观胜景的行家之一。众多文人视其为[RICE_ten_scenes_of_west_lake|E]理念的重要推广者。"
 RICE_hangzhou_honored_yue_fei:0 "修建岳王庙"
 RICE_hangzhou_honored_yue_fei_desc:0 "该角色通过在岳坟旁修建庙宇来纪念英雄岳飞，以此弘扬这位伟大将领的忠勇精神。\""
 hangzhou.0051.desc.festival:0 "\n\n正值农历八月，前来参加龙王节的人比平时更多，这个节日充满了各种娱乐、美食和热闹的气氛。"
 hangzhou.0052.a.nothing:0 "无事发生"
 hangzhou.0052.a.injury:0 "有人#N 受伤#!了"
 hangzhou.0052.a.death:0 "有人#N 遇难#!了"
 hangzhou.0054.desc.intro:0 "潮水已退，却非风平浪静。"
 hangzhou.0054.desc.injury_self:0 "唉，我在观看时也受伤了。"
 hangzhou.0054.desc.injury_other:0 "[victim.GetTitledFirstName]在观看时受伤了，"
 hangzhou.0055.desc.intro:0 "$hangzhou.0054.desc.intro$原本激动人心、充满乐趣的一天，如今却演变成了一场令人痛心的悲剧。\n\n"
 hangzhou.0055.desc.death_self:0 "大潮冲来……越来越近……\n\n忽然大水一下子拉我！\n\n我奋力挣扎，惊慌地试图抓住什么，却无济于事，潮水将我吞没。转眼间，我便失去了意识。"
 hangzhou.0055.desc.death_other:0 "在观潮时，[victim.GetTitledFirstName]被潮水卷走并溺水身亡。我们竭尽全力想把[victim.GetHerHim]从水中拉出来，但为时已晚。\n\n后来，当地人在下游发现了[victim.GetFirstNamePossessive]的尸体。"
 hangzhou.0070.info:0 "#emphasis 历史背景：#!陆游生逢北宋灭亡之际，宋高宗时，陆游参加礼部考试，因受秦桧排斥而仕途不畅。宋孝宗即位后，赐进士出身，历任福州宁德县主簿、敕令所删定官、隆兴府通判等职，因坚持抗金，遭到主和派排斥。乾道七年（1171年），陆游应四川宣抚使王炎之邀，投身军旅，任职于南郑幕府。次年，幕府解散，陆游奉诏入蜀，与范成大相知。宋光宗继位后，陆游升为礼部郎中兼实录院检讨官，不久即因“嘲咏风月”被罢官归居故里。嘉泰二年（1202年），宋宁宗诏陆游入京，主持编修孝宗、光宗《两朝实录》和《三朝史》，官至宝章阁待制。书成后，陆游长期蛰居山阴。嘉定二年（1210年），与世长辞，享年八十五岁，留下绝笔诗《示儿》。"
 hangzhou.0100.b:0 "我们必须惩罚他们！"
 hangzhou.0100.c:0 "责令地方官员督促农事。"
 hangzhou.0100.d:0 "忽略这个问题，它没那么重要。"
 hangzhou.0101.b:0 "好主意……我们应该避开这些游手好闲的人。"
 hangzhou.0102.b:0 "这感觉不错，但和真正的旅行还是没法比。"
 hangzhou.0103.b:0 "这茶不出名是有原因的。它永远流行不起来！"
 hangzhou.0103.info:0 "#emphasis 历史背景：#!龙井茶是中国最著名的绿茶品种之一，原产于[RICE_west_lake|E]西南方。虽然其历史可追溯至多个世纪以前，但直到明清时期才逐渐声名远扬。例如，有许多传说将18世纪的中国皇帝乾隆与龙井茶联系在一起。"
 hangzhou.0104.b:0 "恕我失陪，我得先走一步……"
 hangzhou.0104.info:0 "#emphasis 历史背景：#!尽管[RICE_west_lake|E]作为著名旅游胜地已有数百年历史，但其在南宋时期尤为兴盛，当时杭州是都城，是文化与悠闲活动的象征，但它也招致了一些评论家的批评，例如林升，他写下了一首著名的讥讽诗《西湖游览志余》，批评人们沉溺享乐，缺乏收复北方意愿：\n\n#italicBeyond 山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。#!"
 hangzhou.0106.b:0 "我更钟意蛇妖被降伏的圆满结局。"
 hangzhou.0106.c:0 "可若是蛇妖乃女英雄，而僧人是个腐朽狂僧呢？"
 hangzhou.0106.info:0 "#emphasis 历史背景：#!中国最著名的民间传说之一《白蛇传》，在现代版本中，能化身为美女的白蛇精被塑造成一位令人同情的角色，她与一位年轻书生相恋并结为夫妻，但这段姻缘遭到高僧法海的阻挠，法海一心要消灭她。然而，在清代以前的古老版本中，两者的角色恰恰相反：白蛇是凶残的反派，而法海则是斩妖除魔的英雄。不过在已知最早的版本里，白蛇仅仅是一只滋扰地方、危害牲畜与百姓的妖怪，最终被一位僧人所降服。"
 hangzhou.0107.b:0 "江山代有才人出！"
 hangzhou.0108.a.flavor:0 "唉，红颜祸水……"
 hangzhou.0108.b:0 "我听说西施与范蠡相恋，后来归隐江湖，希望是真的。"
 hangzhou.0108.b.flavor:0 "其他四大美人都没有好结局，所以我真心希望，至少有一位能有个幸福的结局……"
