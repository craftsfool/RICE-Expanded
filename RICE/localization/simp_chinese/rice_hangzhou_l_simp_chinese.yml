 RICE_hangzhou_improve_west_lake_dredge_silt_name:0 "#Bold 疏通淤泥#!#weak (常规任务)#!"
 RICE_hangzhou_improve_west_lake_dredge_silt_desc:0 "$RICE_hangzhou_improve_west_lake_dredge_silt_name$"
 RICE_hangzhou_improve_west_lake_dredge_silt_tooltip:0 "#italic 随着时间的推移，钱塘江有大量的淤泥沉积，影响了西湖的美观，必须清除这些淤泥。#!"
 RICE_hangzhou_improve_west_lake_patrols_name:0 "#Bold 加强巡逻#!#weak (常规任务)#!"
 RICE_hangzhou_improve_west_lake_patrols_desc:0 "$RICE_hangzhou_improve_west_lake_patrols_name$"
 RICE_hangzhou_improve_west_lake_patrols_tooltip:0 "#italic 西湖需要每日巡逻，以确保前来西湖的游客不会通过引起骚乱、乱扔垃圾或胡乱种植等方式破坏西湖的美景。#!"
 RICE_hangzhou_improve_west_lake_repairs_name:0 "#Bold 修复基础设施#!#weak (常规任务)#!"
 RICE_hangzhou_improve_west_lake_repairs_desc:0 "$RICE_hangzhou_improve_west_lake_repairs_name$"
 RICE_hangzhou_improve_west_lake_repairs_tooltip:0 "#italic 桥梁、亭台、寺庙处处皆有美感，代价就是需要不断维护。#!"
