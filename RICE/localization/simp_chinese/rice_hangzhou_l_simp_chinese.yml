 RICE_hangzhou_improve_west_lake_religious_structures_name:0 "#Bold 建造宗教建筑#!#weak (新建)#!"
 RICE_hangzhou_improve_west_lake_religious_structures_desc:0 "$RICE_hangzhou_improve_west_lake_religious_structures_name$"
 RICE_hangzhou_improve_west_lake_religious_structures_tooltip:0 "此选项将额外消耗[treasury_i|E][treasury|E]（或[gold_i|E][gold|E]）。\n\n#italic 西湖边上有着各色的宗教建筑，若再加一座更添灵气。#!"
 RICE_hangzhou_erect_embankment_on_qiantang_river:0 "钱塘江沿岸修建海堤"
 RICE_hangzhou_erect_embankment_on_qiantang_river_tooltip:0 "钱塘大潮必须得到控制"
 RICE_hangzhou_erect_embankment_on_qiantang_river_desc:0 "钱塘大潮多年来给当地居民带来诸多困扰，以往治理措施收效甚微，如今应当修筑大坝来堵塞一二！"
 RICE_hangzhou_erect_embankment_on_qiantang_river_effect_tooltip_1:1 "xxxx"
 RICE_hangzhou_erect_embankment_on_qiantang_river_confirm:0 "人强胜天！"
 RICE_hangzhou_erect_embankment_on_qiantang_river_context_tooltip:0 "#emphasis 历史背景：#!流经杭州的钱塘江，因其特殊的地理环境，拥有世界上最大的潮涌。这一壮观的自然现象数百年来一直备受推崇，但也带来了诸多苦难与破坏。一次著名的控潮尝试，是十世纪初吴越王钱镠下令修建海塘。据传说，当工程受到潮水威胁时，吴越王召集了万名弓箭手，命他们向潮水射箭；潮水即刻退却，被这威武的阵势所震慑。"
 RICE_hangzhou_dedicate_temple_to_yue_fei:0 "修建岳飞庙"
 RICE_hangzhou_dedicate_temple_to_yue_fei_tooltip:0 "武穆之志，未敢忘也"
 RICE_hangzhou_dedicate_temple_to_yue_fei_desc:0 "武穆既得平反，我等理应在[GetTitleByKey('c_hangzhou').GetNameNoTier]的墓前立庙，让后世不能忘却他与他的功绩。"
 RICE_hangzhou_dedicate_temple_to_yue_fei_effect_tooltip_1:1 "xxxx"
 RICE_hangzhou_dedicate_temple_to_yue_fei_confirm:0 "武穆之志，永励来兹！"
 RICE_hangzhou_dedicate_temple_to_yue_fei_context_tooltip:0 "#emphasis 历史背景：#!岳飞是宋朝将领，在宋朝对抗女真人（此前已占领中国北方）的战争中率军作战。尽管被政敌以叛国罪指控并处死，但岳飞多年后得以平反，如今被视为中国伟大的民族英雄之一。宋宁宗于1221年在杭州为岳飞修建了一座专门的祠庙。"
 RICE_hangzhou_build_su_causeway:0 "西湖筑堤"
 RICE_hangzhou_build_su_causeway_tooltip:0 "西湖需要再建一条堤道"
 RICE_hangzhou_build_su_causeway_desc:0 "早在唐代，时任[GetTitleByKey('c_hangzhou').GetNameNoTier]刺史的香山居士，任内有修筑[RICE_west_lake|E]堤防、疏浚六井等政绩，并作《钱塘湖石记》，刻石置于湖边，供后人知晓，如今是时候再进行类似的工程了。"
 RICE_hangzhou_build_su_causeway_effect_tooltip_1:1 "xxxx"
 RICE_hangzhou_build_su_causeway_confirm:0 "西湖美景更甚！"
 RICE_hangzhou_build_su_causeway_context_tooltip:0 "$RICE_hangzhou_improve_west_lake_context_tooltip$"
 RICE_hangzhou_ten_scenes_west_lake_decision:0 "推广西湖十景"
 RICE_hangzhou_ten_scenes_west_lake_decision_tooltip:0 "西湖需要再建一条堤道"
 RICE_hangzhou_ten_scenes_west_lake_decision_desc:0 "虽然[RICE_west_lake|E]是[GetTitleByKey('c_hangzhou').GetNameNoTier]的热门旅游景点，但大多数人并不懂得如何充分领略其魅力。像我这样真正懂得欣赏[RICE_west_lake|E]的人之间，流传着代表西湖的[RICE_ten_scenes_of_west_lake_ten_scenes|E]之说，我应当做些事情来推广它们！"
 RICE_hangzhou_ten_scenes_west_lake_decision_effect_tooltip_1:1 "你将在书籍或绘画[artifact|E]之间做出选择"
 RICE_hangzhou_ten_scenes_west_lake_decision_effect_tooltip_2:1 "[GetActivityType( 'activity_RICE_hangzhou_sightsee_at_west_lake' ).GetName]可以在更大的地理范围内都可以进行[activity|E]，参与[activity|E]的成员将获得更高概率获得灵感。"
 RICE_hangzhou_ten_scenes_west_lake_decision_confirm:0 "大家都会知道十景！"
 RICE_hangzhou_ten_scenes_west_lake_decision_context_tooltip:0 "$RICE_hangzhou_sightsee_at_west_lake_context_tooltip$始于宋代，文人雅士列出了游览西湖必看的十处标志性景观；此后声名远播，乃至[Glossary( '中华文化圈', 'SINOSPHERE_GLOSS' )]其他城市也纷纷为本地名胜推出各自的“十景”。这在中国文化中已成陈套，以至于二十世纪中国最伟大的作家之一鲁迅曾不无讥讽地写道：“我们中国有许多人，大抵患有一种‘十景病’……沉重起来的时候大概在清朝。”"
