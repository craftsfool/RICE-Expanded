 hangzhou.0070.t:0 "心哀"
 hangzhou.0070.desc:0 "今时犹然，思卿之痛犹噬我心。\n\n此生诸事，尽是蹉跎。连理之事——毁于母命休弃；庙堂之志——皆阻于佞臣，享乐偷安，坐视大[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]故土沦于[jurchen.GetCollectiveNoun]。\n\n而今衰鬓已催，不似少年，或此生终究力薄。应静养天年，安度余生，忘却世间……"
 hangzhou.0070.a:0 "思卿之痛犹噬我心……"
 hangzhou.0071.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 hangzhou.0071.desc.not_reclaimed:0 "中原已丢，朝堂无人思念故土，[Glossary( '靖康之难', 'JINGKANG_INCIDENT_GLOSS' )]难道全部忘了？[jurchen.GetCollectiveNounNoTooltip]之恶无人记得？"
 hangzhou.0071.desc.reclaimed:0 "虽然我们已在对[jurchen.GetCollectiveNoun]的战事中取得进展，并开始收复中原，但圣上恐怕不想坚守土地和战果，想到北方可能再度沦陷，重演[Glossary( '靖康之难', 'JINGKANG_INCIDENT_GLOSS' )]的悲剧，实在令人痛心。"
 hangzhou.0071.desc:0 "\n\n我多年为官，力主正道，却屡遭忽视——朝堂大员们或贪腐、或短视、或怯懦，或兼而有之。我已年老，不堪此累，决定退居府邸，安享余年，专心作诗，倒也博得些许声名。\n\n然而，尽管致仕生活日渐安逸，每当我回望过往——中原在战乱中为金贼所占，朝堂之上无人敢言北伐；回顾往生，以及已逝之爱[tang_wan.GetFirstName]，心中仍不免涌起深切的悲凉。"
 hangzhou.0071.a:0 "东风恶，欢情薄。"
 hangzhou.0072.t:0 "xxxx"
 hangzhou.0072.desc:0 "xxxx"
 hangzhou.0072.a:0 "xxxx"
 hangzhou.0073.t:0 "xxxx"
 hangzhou.0073.desc:0 "我凝视着[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lu_you'))][lu_you.GetFirstName]的面容。如今[lu_you.GetSheHe]已然离世，想必正享受着安宁与平静，毕竟[lu_you.GetSheHe]度过了漫长而艰辛的一生。\n\n手中捧着[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lu_you'))]在自知时日无多时新近创作的诗篇，我怀着沉重的心情诵读字句，忆起[lu_you.GetHerHis]临终前对我们的殷殷嘱托。"
 hangzhou.0073.desc.not_reclaimed:0 "#italic \n\n死去元知万事空，\n但悲不见九州同。\n王师北定中原日，\n家祭无忘告乃翁。#!"
 hangzhou.0073.a:0 "也许[lu_you.GetSheHe]终于与[tang_wan.GetFirstName]重逢了。"
 hangzhou.0074.t:0 "忆沈园"
 hangzhou.0074.desc:0 "虽非我愿，今日却是再忆[Glossary( '沈园', 'SHEN_GARDEN_GLOSS' )]，四十年前，我与[tang_wan.GetFirstName]初次也是最后一次重逢之地。我含泪望向窗外，想起当时匆匆[Glossary( '所题小阕', 'LU_YOU_PHOENIX_HAIRPIN_GLOSS' )]，以及她那[Glossary( '和之', 'TANG_WAN_PHOENIX_HAIRPIN_GLOSS' )]。\n\n而今偶复一至，而园已易主，刻小阕于石，读之怅然。\n\n情难自抑，草草题下[Glossary( '几句', 'LU_YOU_SHEN_GARDEN_TWO_POEMS_GLOSS' )]。可这些字句，又如何能抚平我这垂暮之人追忆往昔的苦涩哀愁？"
 hangzhou.0074.a:0 "梦中她依然爱着我。"
 hangzhou.0074.info:0 "#emphasis 历史背景：#!陆游与发妻唐琬在离异八年后，二人在[GetTitleByKey('b_kuaiji').GetNameNoTier]的[Glossary( '沈园', 'SHEN_GARDEN_GLOSS' )]中不期而遇，陆游百感交集，当场写下传世名作[Glossary( '《钗头凤·红酥手》', 'LU_YOU_PHOENIX_HAIRPIN_GLOSS' )]，唐琬亦以同样脍炙人口的[Glossary( '《钗头凤·世情薄》', 'TANG_WAN_PHOENIX_HAIRPIN_GLOSS' )]相和。唐琬随后在一年内去世。五十多年后，在陆游生命的最后一年，陆游重访沈园，写下了[Glossary( '《沈园二首》', 'LU_YOU_PHOENIX_HAIRPIN_GLOSS' )]，哀伤地反思了爱情和时间的流逝。"
