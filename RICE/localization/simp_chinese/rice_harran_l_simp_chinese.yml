 dynn_harrani_motto:0 "认识自己本质的人就会成为神圣之人"
 game_concept_harranian_courtier:0 "哈兰人廷臣"
 game_concept_harranian_courtiers:0 "哈兰人廷臣"
 game_concept_harranian_character:0 "哈兰人角色"
 game_concept_harranian_characters:0 "哈兰人角色"
 game_concept_harranian_courtier_desc:0 "偶尔，$game_concept_harranian_characters$可以通过在中东的[rulers|E]事件随机出现。他们追随信奉哈兰[GetReligionFamily('rf_pagan').GetName]教。这是一种融合了美索不达米亚和希腊元素的古老信仰，在美索不达米亚北部的哈兰城流传了几个世纪。\n\n$game_concept_harranian_characters$往往具有较高的[learning_skill|E]，并会成为有价值的[courtiers|E]。有时你的$game_concept_harranian_courtier$可能会就各种主题撰写学术论文。这些论文会赋予你一个特殊的[artifact|E]。\n\n如果[harran_neoplatonic_academy|E]拒绝，$game_concept_harranian_characters$将停止生成。"
 game_concept_harran_neoplatonic_academy:0 "新柏拉图学派"
 game_concept_harran_neoplatonic_academy_desc:0 "在较早的开始日期，哈兰的[county|E]有一个名为$game_concept_harran_neoplatonic_academy$[special_building|E]。除了通常的奖金，它还有其他与之相关的特殊功能。\n\n首先，它的存在是[harranian_courtiers|E]在中东[courts|E]的[rulers|E]中生成的必要条件。这是因为一段时间后，如果一个强大的[GetReligionFamily('rf_pagan').GetName][ruler|E]不采取振兴新柏拉图学派的[decision|E]，该学派将陷入衰落，[special_building|E]将被禁用。\n\n其次，它允许哈兰附近以及美索不达米亚和黎凡特地区拥有高[learning_skill|E]的[rulers|E]采取[decision|E]来赞助学派，这给你带来各种好处，包括一个临时的[character_modifier|E]。这也为你增加了一个[harranian_character|E]出现的几率。"
 game_concept_harran_temple_of_the_moon:0 "月神殿"
 game_concept_harran_temple_of_the_moon_desc:0 "在较早的开始日期，哈兰[barony|E]的高马赫拉[county|E]有一个[special_building|E]，叫做$game_concept_harran_temple_of_the_moon$。它代表了古代月神辛的神殿，在哈兰存在了几个世纪，甚至几千年。\n\n除了通常的好处外，它的存在还允许附近的[GetReligionFamily('rf_pagan').GetName][rulers|E]采取特殊的[decision|E]在那里进行礼拜，这可能会给他们带来[prestige|E]和[piety|E]的奖励。然而，非多神教[faith|E]的[ruler|E]可以采取[decision|E]的方式永久地摧毁该神殿。一旦神殿被毁，多神教[rulers|E]将无法获得[decision|E]。"
 activity_semitic_praying_to_a_planet:0 "向圣光祈祷"
 activity_semitic_praying_to_a_planet_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]对圣光的祈祷词"
 activity_harran_make_offerings_to_moon_temple:0 "在月神殿祭祀"
 activity_harran_make_offerings_to_moon_temple_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]在月神殿祭祀"
 building_type_RICE_harran_temple_of_the_moon:0 "月神辛神殿"
 building_type_RICE_harran_temple_of_the_moon_desc:0 "位于哈兰的月神辛神殿已经存在了几个世纪，见证了巴比伦人、波斯人、希腊人、罗马人等的来来往往。自从古代美索不达米亚国王时代以来，月神辛就在这个地区受到崇拜。"
 building_RICE_harran_temple_of_the_moon:0 "$building_type_RICE_harran_temple_of_the_moon$"
 building_RICE_harran_temple_of_the_moon_desc:0 "$building_type_RICE_harran_temple_of_the_moon_desc$"
 building_type_RICE_harran_baalbek_temple:0 "朱庇特神殿"
 building_type_RICE_harran_baalbek_temple_desc:0 "巴勒贝克的众神之王朱庇特神殿是古罗马世界中最大的神殿之一。在巴勒贝克，朱庇特被认为是闪米特人的神祇主神巴尔及风暴神哈达德。根据古代资料，主宰神殿的神像描绘了一个没有胡子的金色神像，摆出战车手的姿势，右手举着鞭子，左手拿着雷电和谷物秆。"
 building_RICE_harran_baalbek_temple:0 "$building_type_RICE_harran_baalbek_temple$"
 building_RICE_harran_baalbek_temple_desc:0 "$building_type_RICE_harran_baalbek_temple_desc$"
 RICE_harran_moon_temple_destroyed_tooltip:0 "月神殿还没有被一个狂热的非多神教信徒统治者摧毁"
 RICE_harran_neoplatonic_academy_declined_tooltip:0 "新柏拉图学派还没有衰落"
 building_type_RICE_harran_neoplatonic_academy:0 "新柏拉图学派"
 building_type_RICE_harran_neoplatonic_academy_desc:0 "几个世纪以来，哈兰新柏拉图学派一直是新柏拉图主义的最后遗迹。新柏拉图学派源于对柏拉图主义的神秘主义解读。该学派是区域性的学习中心，培养了许多参与中东知识文化的学者。"
 building_RICE_harran_neoplatonic_academy:0 "$building_type_RICE_harran_neoplatonic_academy$"
 building_RICE_harran_neoplatonic_academy_desc:0 "$building_type_RICE_harran_neoplatonic_academy_desc$"
 building_type_RICE_harran_neoplatonic_academy_athens:0 "新柏拉图学派"
 building_type_RICE_harran_neoplatonic_academy_athens_desc:0 "雅典目前是许多异教徒学者的家园，他们声称自己的知识来源于最初的柏拉图学院。然而，他们对自己独特的异教坚定辩护可能会让非异教当局感到不安……"
 RICE_harran_sun_blessing:0 "太阳神索尔的祝福"
 RICE_harran_sun_blessing_desc:0 "据说七大行星之一的太阳，就偏爱该角色。"
 RICE_harran_moon_blessing:0 "月神露娜的祝福"
 RICE_harran_moon_blessing_desc:0 "据说七大行星之一的月亮，就偏爱该角色。"
 RICE_harran_mercury_blessing:0 "神使墨丘利的祝福"
 RICE_harran_mercury_blessing_desc:0 "据说七大行星之一的水星，就偏爱该角色。"
 RICE_harran_venus_blessing:0 "爱神维纳斯的祝福"
 RICE_harran_venus_blessing_desc:0 "据说七大行星之一的金星，就偏爱该角色。"
 RICE_harran_mars_blessing:0 "战神玛尔斯的祝福"
 RICE_harran_mars_blessing_desc:0 "据说七大行星之一的火星，就偏爱该角色。"
 RICE_harran_jupiter_blessing:0 "众神之王朱庇特的祝福"
 RICE_harran_jupiter_blessing_desc:0 "据说七大行星之一的木星，就偏爱该角色。"
 RICE_harran_saturn_blessing:0 "农神萨图恩的祝福"
 RICE_harran_saturn_blessing_desc:0 "据说七大行星之一的土星，就偏爱该角色。"
 RICE_harran_revitalized_neoplatonic_academy_leader:0 "振兴了哈兰的新柏拉图学派"
 RICE_harran_revitalized_neoplatonic_academy_leader_desc:0 "如果说有哪个领袖对哈兰多神教学术贡献最大的话，那肯定就是这个人了。其为恢复新柏拉图学派在世界上应有的地位所作的努力，将在未来的几个世纪里为博学的信徒们所传颂。"
 RICE_harran_neoplatonic_academy_recently_revitalized:0 "新柏拉图学派最近重新振兴"
 RICE_harran_neoplatonic_academy_recently_revitalized_desc:0 "哈兰的新柏拉图学派最近在一位有远见的统治者帮助下得到了重振。因此，随着该地区成为一个主要的学习和艺术中心，学者们蜂拥而至。"
 RICE_harran_patronized_neoplatonic_academy_hellenic:0 "新柏拉图学派的赞助人"
 RICE_harran_patronized_neoplatonic_academy_hellenic_desc:0 "该角色慷慨地将他们的一些资产捐赠给哈兰的新柏拉图学派，从而确保其受人尊敬的多神教思想家和学者的血统将继续增长和繁荣。"
 RICE_harran_patronized_neoplatonic_academy_pagan:0 "新柏拉图学派的赞助人"
 RICE_harran_patronized_neoplatonic_academy_pagan_desc:0 "该角色慷慨地将他们的一些资产捐赠给哈兰的新柏拉图学派，从而确保其受人尊敬的多神教思想家和学者的血统将继续增长和繁荣。"
 RICE_harran_patronized_neoplatonic_academy_nonpagan:0 "新柏拉图学派的赞助人"
 RICE_harran_patronized_neoplatonic_academy_nonpagan_desc:0 "该角色慷慨地将他们的一些资产捐赠给哈兰的新柏拉图学派，从而确保其受人尊敬的多神教思想家和学者的血统将继续增长和繁荣。"
 RICE_harran_moon_temple_destroyer:0 "摧毁了哈兰的月神殿"
 RICE_harran_moon_temple_recently_destroyed:0 "哈兰的月神殿最近被摧毁了"
 RICE_harran_historical_last_of_the_harranians:0 "最后的哈兰多神教信徒"
 RICE_harran_historical_last_of_the_harranians_desc:0 "该角色是美索不达米亚的哈兰城曾经实行的一种古老的多神教形式的最后追随者之一，它结合了美索不达米亚和希腊的新柏拉图主义多神教的元素。当然，除非出现某种神迹，否则这种杰出的多神教思想血统将很快消亡。"
 RICE_harran_historical_thabit_ibn_qurra:0 "伟大的哈兰多神教信徒"
 RICE_harran_historical_thabit_ibn_qurra_desc:0 "萨比特·伊本·库拉被中东许多人公认为是他那一代最杰出的学者之一，在天文学、数学、语言学翻译等诸多领域无人能及。"
 RICE_harran_historical_ibn_nabhan:0 "哈兰多神教的最后继承人"
 RICE_harran_historical_ibn_nabhan_desc:0 "伊本·纳卜罕出生在一个学术家庭，直到一两代人之前，这个家庭一直信奉哈兰的一种多神式，他的祖先有一些著名的名字，比如萨比特·伊本·库拉。有人说，当其他人质疑他的家人皈依伊斯兰教的真实性时，他感到不安；其他人甚至推测他暗地里同情他祖先的信仰，并对哈兰古老传统的衰落感到极大的悲哀，除非有神的奇迹……"
 RICE_harran_courtier_former_moneylender:0 "哈兰的前放债人"
 RICE_harran_courtier_former_moneylender_desc:0 "虽然这位哈兰人现在已深入学术界，但他曾经是个放债人。"
 RICE_harran_courtier_prominent_harranian:0 "著名的哈兰人"
 RICE_harran_courtier_prominent_harranian_desc:0 "这位哈兰人过去是，现在仍然是哈兰多多神教信徒团体中有影响力的领袖。"
 RICE_harran_courtier_neoplatonic_fanatic:0 "新柏拉图主义的狂热者"
 RICE_harran_courtier_neoplatonic_fanatic_desc:0 "这位哈兰人是新柏拉图主义的坚定信徒，正如新柏拉图主义学派所教的那样。"
 RICE_harran_courtier_ostracized_harranian:0 "被排斥的哈兰人"
 RICE_harran_courtier_ostracized_harranian_desc:0 "这个哈兰人拥有许多非正统的信仰和哈兰多神信徒的思想，并与其他有学问的哈兰人有许多分歧。"
 RICE_harran_courtier_devout_planet_worshipper:0 "虔诚的星辰崇拜者"
 RICE_harran_courtier_devout_planet_worshipper_desc:0 "这个哈兰人非常热衷于以哈兰人的方式来崇拜七大行星。"
 RICE_harran_courtier_tammuz_devotee:0 "丰饶之神塔木兹的信徒"
 RICE_harran_courtier_tammuz_devotee_desc:0 "这个哈兰人致力于崇拜古老的美索不达米亚丰饶之神杜姆兹，希腊人称之为春季植物之神阿多尼斯。"
