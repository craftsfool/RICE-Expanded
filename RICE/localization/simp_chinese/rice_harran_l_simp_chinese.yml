 harran.0020.t:0 "资助哈兰学派"
 harran.0020.desc:0 "哈兰新柏拉图学派的学者们非常感谢我在经济和精神上的支持，并希望这将确保他们能够继续把他们所拥有的几个世纪的智慧传递给其他人。作为一个古老但正在缩小的群落成员，他们总是需要帮助，无论这种帮助来自何方。"
 harran.0020.a:0 "不错。"
 harran.0021.t:0 "哲人"
 harran.0021.desc:0 "在我的梦中，有一位外表高贵的人向我走来，他的头发是淡淡的银色，眼睛是威严和睿智的。[ancient_pagan_philosopher.GetSheHe]用温和权威的语气介绍[ancient_pagan_philosopher.GetHerselfHimself]，[ancient_pagan_philosopher.GetFirstName]是古代多神教哲学家之一，不过在梦里我并没有意识到这一点的重要性。无论如何，[ancient_pagan_philosopher.GetSheHe]感谢我对哈兰的新柏拉图学派的所有支持，确保了它的存续。"
 harran.0021.hellenic:0 "“我永远感谢你的善意，孩子，愿诸神保佑你。”"
 harran.0021.nonhellenic:0 "“虽然我不遵循你的[ROOT.Char.GetFaith.GetAdjective]信条，但真理却以多种方式出现。”"
 harran.0022.t:0 "振兴哈兰学派"
 harran.0022.desc:0 "我已经汇集了大量的资金和资源，并召集了许多有识之士，以重振[harran_county.GetNameNoTier]的新柏拉图学派。长久以来，我们让这个宝贵的学派陷入了困境，现在要靠我们来恢复它昔日的辉煌。我们的目标将是翻新学派校园的建筑，以及建立和确保一个充满活力的大型学者社区（主要是多神教信徒，但也欢迎其他人，只要他们有开放的思想）。虽然这需要一些时间，但学派将继续存在下去。"
 harran.0022.a:0 "这是为了人类的福祉。"
 harran.0023.t:0 "新柏拉图主义的复兴"
 harran.0023.desc:0 "世代以来，位于[harran_county.GetNameNoTier]的新柏拉图学派一直是古代世界的最后遗迹。位于美索不达米亚北部崎岖的山丘上，它的学者们可以宣称自己是罗马帝国新柏拉图主义的知识分子后裔，而后者的血统又可以一直追溯到柏拉图本人。唉，多年来，鉴于该地区是由非多神教信徒统治的，学派遭受了不可避免的衰退。\n\n然而，现在幸运之神正向学派微笑。聪明的[harran_academy_reviver.GetTitledFirstName]已经汇集了资源，通过翻新学派的建筑和吸引许多聪明的学者住在这里来振兴学派。虽然它可能永远无法与巴格达的智慧宫相媲美，也无法与最初的柏拉图学派相比，但哈兰学派现在作为一个学习中心的未来是有保障的。"
 harran.0023.a:0 "就像星辰上写的那样！"
 harran.0024.t:0 "哈兰学派的终结"
 harran.0024.desc:0 "近年来，[harran_county.GetNameNoTier]的新柏拉图学派一直在衰落，反映了世界上一些地方多神教的衰落。唉，很少有人愿意投入时间和资源来保护这个最可敬的学派了。现在，随着最后一位真正的老师和学者的去世，它实际上已经不存在了，没有人再延续它的血统。"
 harran.0024.a:0 "我懂了……"
 harran.0025.t:0 "新柏拉图派的末路"
 harran.0025.desc:0 "总有一天，一切都会枯萎。位于[harran_county.GetNameNoTier]的新柏拉图学派曾经是一个充满活力的学者社区，是古代希腊文明的最后残余。几个世纪以来，学派的哲学家和神秘主义者将他们残存的知识传承给了下一代。\n\n但仅此而已。\n\n该学派的最后一位教师已经去世了，没有任何经济和精神上的支持，该学派将被载入史册。这里曾经是一个充满活力的知识分子社区，现在唯一保留下来的，是古老卷轴中渐渐褪色的墨迹和过去辉煌历史的私语。"
 harran.0025.a:0 "事实如此，将来也是如此。"
 RICE_harran_neoplatonic_academy_dead_tooltip:0 "[harranian_characters|E]将不会在中东的[courts|E]中出现，该地区的[rulers|E]也不能再采取[decision|E]来资助[harran_neoplatonic_academy|E]。"
 harran.0026.t:0 "雅典新柏拉图派的终结"
 harran.0026.desc:0 "几个世纪以来，[athens_barony.GetNameNoTier]一直是在所谓的#bold 新柏拉图学院#!学者的家园！并声称获得古代柏拉图学院的知识传承。尽管存在宗教差异，但像我这样的统治者已经忍受了他们，甚至资助了他们的机构，错误地假设他们为我们的社会做出了贡献。\n\n然而时代在变化，我们在这些人和他们的学校上浪费了足够多的资金。尽管学者们恳求我不要这样做，但我还是决定停止资助学院。这些新柏拉图主义者说，这实际上迫使他们流浪，因为他们没有家。对此我只能说一件事：那是他们的问题，不是我的。"
 harran.0026.a:0 "他们的命运与我无关。"
 harran.0026.tooltip:0 "新柏拉图的学者们将四处游荡，寻找新的家园。有传言说他们正在关注近东的一些地方，例如[harran_county.GetNameNoTier]，以建立一个新的[harran_neoplatonic_academy|E]，但是否欢迎他们将由当地统治者决定"
 harran.0027.t:0 "雅典新柏拉图派的终结"
 harran.0027.desc:0 "几个世纪以来，[athens_barony.GetNameNoTier]是#bold 新柏拉图学院#!的所在地，这是一个自称是古代柏拉图学院的知识分子后裔的学者。他们历经了困难时期和许多挑战，前当局乐于在财政上支持他们，即使他们基于宗教原因与他们意见相左，然而他们的运气都到这里了。\n\n[neoplatonic_academy_hater.GetTitledFirstName][athens_barony.GetNameNoTier]的现任统治者，已决定停止资助学院，[neoplatonic_academy_hater.GetHerHis]的意思很明确：这些新柏拉图派在那里不再受欢迎。\n\n没有人，甚至新柏拉图派学者自己，都不知道未来是什么。他们中的许多人正计划在东方的土地上流浪，据说那里的统治者更宽容、更有眼光。"
 harran.0027.a:0 "也许他们会找到一个新家，也许他们将永远消失"
 harran.0027.b:0 "[harran_county.GetNameNoTier]可能会为他们打造一个不错的安身之处……他们会来这里吗？"
 harran.0027.tooltip:0 "$harran.0026.tooltip$"
 harran.0028.t:0 "新柏拉图主义者在哈兰定居"
 harran.0028.desc:0 "新柏拉图学院曾经是雅典受人尊敬的学府，里面挤满了著名的异教学者。然而宗教观点不同的地方当局最终停止资助他们的机构，迫使他们流亡，因为他们寻求更宽容的统治者。他们终于找到了他们的赞助人。\n\n我听说过这些学者的困境，以及他们如何流浪了这么久。我不仅为他们的才华没有得到赏识感到遗憾，而且对机会的出现感到兴奋。当我听说这些学者考虑询问他们是否可以在[harran_county.GetNameNoTier]安家时，我知道我必须欢迎他们进入我的土地。[harran_county.GetNameNoTier]的异教徒社区也对在这里重建新柏拉图学院感到兴奋。"
 harran.0028.a:0 "新柏拉图学院迎来了新的一天"
 harran.0028.tooltip:0 "这些[harran_neoplatonic_academy|E]已经找到了新的安身之处，中东和小亚细亚的[rulers|E]现在可以采取[decision|E]来#Bold 资助新柏拉图学院#!。此外，[harranian_courtiers|E]偶尔也会在这个地区生成。"
 harran.0029.t:0 "新柏拉图主义者在哈兰定居"
 harran.0029.desc:0 "新柏拉图学院曾经是雅典受人尊敬的学府，里面挤满了著名的异教学者。然而宗教观点不同的地方当局最终停止资助他们的机构，迫使他们流亡，因为他们寻求更宽容的统治者。他们终于找到了他们的赞助人。\n\n[neoplatonic_academy_lover.GetTitledFirstName]同情这些流浪了这么久的学者，并与他们达成了协议，允许他们在[harran_county.GetNameNoTier]定居。这座城市的异教徒社区很高兴欢迎这些受人尊敬的学者来到他们的新家。这无疑是新柏拉图传统历史上精彩新篇章的开始。"
 harran.0029.a:0 "谁知道这次他们还能坚持多久？"
 harran.0029.tooltip:0 "$harran.0026.tooltip$"
 harran.0030.t:0 "一位哈兰的学者"
 harran.0030.desc:0 "几个世纪以来，[harran_county.GetNameNoTier]的人们一直是古代多神教信仰的最后堡垒之一。他们中的许多人因其知识和智慧而闻名于整个地区。\n今天，一个名叫[spawned_harranian_courtier.GetFullName]的人来到了我的宫廷，寻求我的资助。如果我支持他和他的家人，他将提供他作为学者和思想家的服务作为交换。哈兰人因其在整个地区以他们在所有领域的广博知识而闻名，神秘、精神和物质，所以在我的宫廷里有这样一个人将是一个巨大的恩惠。"
 harran.0030.a:0 "听起来不错！欢迎他。"
 harran.0030.a.tooltip:0 "作为一个[harranian_courtier|E]，[spawned_harranian_courtier.GetFullNameNoTooltip]可能会通过撰写学术论文为你的王国贡献知识。"
 harran.0030.b:0 "我不需要这样的人。"
 harran.0031.t:0 "一本关于哈兰的论著"
 harran.0031.desc:0 "我宫中的哈兰学者，[harranian_scholar.GetFullName]，已经完成了一篇学术论文的撰写，并向我赠送了一份副本。毕竟，哈兰人的古老知识必须与世界其他地方分享。无论如何，不仅[harranian_scholar.GetTitledFirstName]会赢得该地区其他学者的尊重，而且我也会因为支持这样一个有才华的人而获得一定程度的荣誉和名望。"
 harran.0031.a:0 "妙不可言！让我们希望其他人能从这篇论文中学习。"
 harran.0032.t:0 "新柏拉图主义学者"
 harran.0032.desc:0 "在欢迎新柏拉图主义学者来到[harran_county.GetNameNoTier]并允许他们建立新学院，不久后他们的一位杰出代表[spawned_harranian_courtier.GetTitledFirstName]找到了我。他认为我公正和宽容的领导，他希望在我的宫廷上效忠，并充当我与[harran_county.GetNameNoTier]新兴学院之间的联络人。的确在我的宫廷里有这样一位博学多才的人，或许是值得的……"
 harran.0032.a:0 "当然能在我的宫廷里有这样一位学者，我感到很荣幸。"
 harran.0032.b:0 "你最好和你的学者们呆在一起，并帮助他们。"
