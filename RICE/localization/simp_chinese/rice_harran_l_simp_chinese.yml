 RICE_harran_aficionado_of_ancient_history:0 "古代历史爱好者"
 RICE_harran_aficionado_of_ancient_history_desc:0 "该角色对古代史怀有极大的热忱，远超其他学者，并且认为保存古代遗迹和文物是明智、公正的统治者应尽的庄严职责。"
