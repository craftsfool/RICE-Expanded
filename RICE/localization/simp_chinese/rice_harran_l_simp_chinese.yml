 RICE_harran_treatise_medicine_copy_desc:0 "在该角色的宫廷里，一位哈兰学者写了一篇关于医学和生物科学的论文，并给该角色提供了一份副本。"
 RICE_harran_ibn_nabhan_internal_conflict:0 "内在精神冲突"
 RICE_harran_ibn_nabhan_internal_conflict_desc:0 "伊本·纳卜罕(Ibn Nabhan)出生在一个穆斯林家庭，不久之前，这个家庭信奉一种古老的多神教信仰，可以追溯到希腊和罗马时代。他现在感到很多关于他身份的内在精神冲突，但也许他会找到一个方法来解决他的痛苦。"
 RICE_harran_ibn_nabhan_studying_grandfathers_writings:0 "研究祖父的宗教著作"
 RICE_harran_good_divination:0 "解读天体运行的好方法"
 RICE_harran_good_divination_desc:0 "哈兰的多神教占星家预言，在不久的将来，哈兰会有好事发生。"
 RICE_harran_bad_divination:0 "对天体运行的错误解读"
 RICE_harran_bad_divination_desc:0 "哈兰的多神教徒占星家预言，在不久的将来，哈兰将遭遇不幸。"
 RICE_harran_tammuz_festival:0 "伟大的塔木兹节"
 RICE_harran_tammuz_festival_desc:0 "塔木兹节是哈兰的一个古老传统。最近的一次活动非常成功，鼓舞了当地的多神教信徒。"
 RICE_harran_scholars_publish_texts:0 "新柏拉图学派的学者最近写了重要的著作"
 RICE_harran_scholars_foreign_contacts:0 "与外国学者的交流"
 RICE_harran_neoplatonic_academy_athens_modifier:0 "雅典的新柏拉图学院"
 RICE_harran_neoplatonic_academy_athens_modifier_desc:0 "雅典的新柏拉图学院是许多异教徒学者的家园，他们声称自己的知识来源于最初的柏拉图学院。然而他们得到国家的定期资助，但他们对自己独特的异教坚定捍卫可能会引起任何当局的愤怒……"
 RICE_harran_welcomed_neoplatonist_exiles:0 "欢迎流亡的新柏拉图学者"
 RICE_harran_pray_to_a_planet:0 "向星辰祈祷"
 RICE_harran_pray_to_a_planet_tooltip:0 "你将执行正确的仪式向七个行星之一祈祷"
 RICE_harran_pray_to_a_planet_effect_tooltip:0 "根据你向哪颗星辰祈祷而收到一个[character_modifier|E]"
 RICE_harran_pray_to_a_planet_desc:0 "是星辰决定了人类的命运，在黑暗中指引着我们，特别是七大行星。我会用传统的[ROOT.Char.GetFaith.GetAdjective]方式向这七位神祇中的一位献祭。"
 RICE_harran_pray_to_a_planet_confirm:0 "为仪式做准备！"
 RICE_harran_pray_to_a_planet_context_tooltip:0 "#emphasis 历史背景：#!对天体，尤其是七大古典行星的崇拜，在黎凡特和美索不达米亚地区很普遍。例如，中世纪早期的穆斯林经常因为这个原因而把哈兰的多神教信徒视为对天空有着深刻洞察力的人。"
 RICE_harran_patronize_the_neoplatonic_academy:0 "资助新柏拉图学派"
 RICE_harran_patronize_the_neoplatonic_academy_tooltip:0 "你将为哈兰的[harran_neoplatonic_academy|E]提供急需的资金。"
 RICE_harran_patronize_the_neoplatonic_academy_effect_tooltip:0 "增加了[harranian_characters|E]出现的概率"
 RICE_harran_patronize_the_neoplatonic_academy_desc:0 "作为古代希腊学术的最后遗迹，哈兰的[harran_neoplatonic_academy|E]经常需要慷慨的统治者的投资，他们愿意忽视其不同寻常的信仰和教义。"
 RICE_harran_patronize_the_neoplatonic_academy_confirm:0 "以学术的名义！"
 RICE_harran_patronize_the_neoplatonic_academy_context_tooltip:0 "#emphasis 历史背景：#!据说，哈兰学派是从雅典的新柏拉图学派传承下来的，而新柏拉图学派本身则声称是从柏拉图创立的最初学派继承下来的。不管这是否属实，哈兰的知识分子在阿拔斯王的宫廷中扮演了重要的角色，他们是科学家、占星家、医生等。从历史上看，这个学派似乎在11世纪的某个时候衰落并消失了，因为剩下的哈兰多神教信徒转向了伊斯兰教等其他宗教。"
 RICE_harran_revitalize_the_neoplatonic_academy:0 "振兴新柏拉图学派"
 RICE_harran_revitalize_the_neoplatonic_academy_tooltip:0 "你将确保哈兰的[harran_neoplatonic_academy|E]永远不会消亡。"
 RICE_harran_revitalize_the_neoplatonic_academy_effect_tooltip:0 "你将确保[harran_neoplatonic_academy|E]成为子孙后代的学习中心，并且不会衰落"
 RICE_harran_revitalize_the_neoplatonic_academy_desc:0 "几个世纪以来，[harran_neoplatonic_academy|E]一直在不可逆转的衰落边缘徘徊，虽然它暂时幸存下来，但我们不能等待，必须采取行动扭转这种趋势，并恢复学派作为古代哲学家继承人的应有地位！"
 RICE_harran_revitalize_the_neoplatonic_academy_confirm:0 "世界不能堕入黑暗。"
 RICE_harran_revitalize_the_neoplatonic_academy_context_tooltip:0 "#emphasis 历史背景：#!据说，哈兰学派是从雅典的新柏拉图学派传承下来的，而新柏拉图学派本身则声称是从柏拉图创立的最初学派继承下来的。不管这是否属实，哈兰的知识分子在阿拔斯王的宫廷中扮演了重要的角色，他们是科学家、占星家、医生等。从历史上看，这个学派似乎在11世纪的某个时候衰落并消失了，因为剩下的哈兰多神教信徒转向了伊斯兰教等其他宗教。"
 RICE_harran_make_offerings_moon_temple:0 "向哈兰的月神殿献祭"
 RICE_harran_make_offerings_moon_temple_tooltip:0 "你将在哈兰的[harran_temple_of_the_moon|E]进行祈祷"
 RICE_harran_make_offerings_moon_temple_effect_tooltip:0 "在[harran_temple_of_the_moon|E]祈祷时，你将获得[prestige|E]或[piety|E]的恩赐。"
 RICE_harran_make_offerings_moon_temple_desc:0 "尽管困难重重，这座供奉月亮神辛的神殿在罗马帝国之前就已经矗立在哈兰了。是时候通过向神庙赠送一些礼物来表达我对辛的敬意了。"
 RICE_harran_make_offerings_moon_temple_confirm:0 "准备好礼物！"
 RICE_harran_make_offerings_moon_temple_context_tooltip:0 "#emphasis 历史背景：#!对美索不达米亚月神辛的崇拜可以追溯到苏美尔时代，并在中世纪早期的哈兰得到证实。他在哈兰的圣所被称为E‑hul‑hul，即欢乐之家，于11世纪中叶被敌对的穆斯林领袖摧毁。"
 RICE_harran_destroy_the_moon_temple:0 "摧毁哈兰的月神殿"
 RICE_harran_destroy_the_moon_temple_tooltip:0 "异教徒亵渎神明的纪念碑必须被毁掉！"
 RICE_harran_destroy_the_moon_temple_effect_tooltip:0 "哈兰附近的异教徒不能再向[harran_temple_of_the_moon|E]献祭[decision|E]了。"
 RICE_harran_destroy_the_moon_temple_desc:0 "长久以来，我们允许位于哈兰的亵渎神明的[harran_temple_of_the_moon|E]存在，它的继续存在是对[ROOT.Char.GetFaith.HighGodName]的侮辱，现在是我们将它夷为平地的时候了！"
 RICE_harran_destroy_the_moon_temple_confirm:0 "烧光它们！"
 RICE_harran_destroy_the_moon_temple_context_tooltip:0 "#emphasis 历史背景：#!哈兰的多神殿供奉着古代美索不达米亚月神辛，它经历了数个世纪的战争、动乱和其他灾难，最终在11世纪中期的某个时候被当地的敌对穆斯林领袖所摧毁，但其具体的毁灭日期却不得而知。"
 RICE_harran_study_grandfathers_writings:0 "研究你祖父的宗教著作"
 RICE_harran_study_grandfathers_writings_tooltip:0 "你会读到你祖父关于宗教的思想，也许能解决你自己内在的精神冲突。"
 RICE_harran_study_grandfathers_writings_effect_tooltip:0 "你开始了一个事件链，可能导致你决定是否恢复你祖先的信仰。"
 RICE_harran_study_grandfathers_writings_desc:0 "多年前，我的祖父告诉我，如果我质疑我的信仰和宇宙的奥秘，就去读这些关于宗教事务的著作。现在是时候解决我内心深处的冲突了....我注意到一封写给我的信，它能告诉我什么？"
 RICE_harran_study_grandfathers_writings_confirm:0 "我先读一下我祖父的信……"
 RICE_harran_study_grandfathers_writings_context_tooltip:0 "#emphasis 历史背景：#!伊本·纳卜罕是著名的哈兰学者如萨比特·伊本·库拉的后裔，他坚决维护了他祖父从哈兰多神教改信伊斯兰教的行为（这一事件发生在公元1000年前后）。他把自己的故事告诉了一个熟人，穆罕默德·本·纳斯尔，后者又把它传给了他的弟子，著名的汉巴利法学家和历史学家伊本·贾乌齐，由他为后人记录下来。虽然伊本·纳布汗不是一个异教徒（尽管他的一些年长的亲戚可能仍然是），但这并不能排除他可能对祖先的传统有同情心的推测可能性。"
 RICE_harran_is_ibn_nabhan:0 "伊本·纳卜罕是否？"
 RICE_harran_write_scholarly_treatise:0 "写一篇学术论文"
 RICE_harran_write_scholarly_treatise_tooltip:0 "你将花时间写一篇学术论文。"
 RICE_harran_write_scholarly_treatise_effect_tooltip:0 "你将致力于撰写涵盖特定主题的论文，最终将为你赢得一本特别的书[artifact|E]以及对应的[character_modifier|E]"
 RICE_harran_write_scholarly_treatise_desc:0 "作为一名哈兰学者，我有责任继续我们无与伦比的著名学术传统。"
 RICE_harran_write_scholarly_treatise_confirm:0 "现在，我的羽毛笔在哪里？"
 RICE_harran_write_scholarly_treatise_context_tooltip:0 "#emphasis 历史背景：#!源自哈兰的学者因为他们所拥有的异教背景的知识而在中东地区被刻板化。其中一些人，如萨比特·伊本·库拉，深深地参与了阿拔斯王朝的宫廷和智慧宫的学术氛围。"
 RICE_decision_currently_working_on_treatise_requirement:0 "目前不从事学术论著的写作"
 RICE_harran_stop_funding_the_neoplatonic_academy:0 "停止资助新柏拉图学院"
 RICE_harran_stop_funding_the_neoplatonic_academy_tooltip:0 "新柏拉图主义者不值得我们支持。"
 RICE_harran_stop_funding_the_neoplatonic_academy_desc:0 "几个世纪以来，异教学者在雅典的[harran_neoplatonic_academy|E]安家。虽然他们不是[ROOT.Char.GetFaith.GetAdherentName]，但我们容忍他们的存在是因为他们的学识出众。然而他们变得傲慢自大，浪费了我的资金，我希望结束对他们学院的支持。"
 RICE_harran_stop_funding_the_neoplatonic_academy_effect_tooltip:0 "新柏拉图主义者将在更宽容的统治者下寻找新家园。"
 RICE_harran_stop_funding_the_neoplatonic_academy_confirm:0 "我不是驱逐他们，只是终止他们的资助！"
 RICE_harran_stop_funding_the_neoplatonic_academy_context_tooltip:0 "#emphasis 历史背景：#!雅典新柏拉图学院一直存续到公元529年，当时查士丁尼皇帝停止了对它的资助（尽管罗马帝国其他地方的老学院仍然开办）。在学院最后一位已知的学长达马修斯的领导下，学院的残余成员逃往萨珊帝国。虽然其中一些学者后来回到了罗马帝国，但有一种并不被普遍认同的理论，认为他们中的一些人——也许是由达马希乌斯的学生辛普利修斯率领——在哈兰开办了一所所谓的新柏拉图学院，这所学院一直延续到中世纪时期。"
 RICE_harran_welcome_neoplatonists_to_harran:0 "欢迎新柏拉图主义者来到哈兰"
 RICE_harran_welcome_neoplatonists_to_harran_tooltip:0 "这些学者可能需要一个新家。"
 RICE_harran_welcome_neoplatonists_to_harran_desc:0 "雅典的[harran_neoplatonic_academy|E]世代是许多异教学者的家园，但由于缺乏当局的支持，他们逃离了自己的家园。从那时起他们就一直在流浪，他们希望安定下来，并相信拥有多元化知识氛围的哈兰可能是重建[harran_neoplatonic_academy|E]的理想之地"
 RICE_harran_welcome_neoplatonists_to_harran_effect_tooltip_1:0 "一个[harranian_courtier|E]将会到达你的[court|E]"
 RICE_harran_welcome_neoplatonists_to_harran_effect_tooltip_2:0 "中东和小亚细亚的[rulers|E]现在可以采取#Bold 取消新柏拉图学院#![decision|E]"
 RICE_harran_welcome_neoplatonists_to_harran_effect_tooltip_3:0 "[harranian_courtiers|E]现在将开始在中东部分地区生成"
 RICE_harran_welcome_neoplatonists_to_harran_confirm:0 "他们古老的智慧将照亮我们！"
 RICE_harran_welcome_neoplatonists_to_harran_context_tooltip:0 "$RICE_harran_stop_funding_the_neoplatonic_academy_context_tooltip$"
 RICE_harran_treatise_astronomy_name:0 "哈兰星表论"
 RICE_harran_treatise_astronomy_desc:0 "哈兰学者撰写的天文学论文名为[harranian_scholar.GetFullName]"
 RICE_harran_treatise_geometry_name:0 "哈兰人撰写关于测量和数字的论文"
 RICE_harran_treatise_geometry_desc:0 "一位名为[harranian_scholar.GetFullName]的哈兰学者撰写了关于几何的论文，其中涵盖诸如比率和测量等"
 RICE_harran_treatise_algebra_name:0 "哈兰人撰写关于解决数学问题的论文"
 RICE_harran_treatise_algebra_desc:0 "一位名为[harranian_scholar.GetFullName]的哈兰学者撰写了代数论文，涵盖诸如求解方程等主题的论文"
 RICE_harran_treatise_greek_philosophy_name:0 "哈兰希腊哲学家论著"
 RICE_harran_treatise_greek_philosophy_desc:0 "一位名叫[harranian_scholar.GetFullName]在撰写一篇关于柏拉图和亚里士多德等古代思想家的论文"
 RICE_harran_treatise_harranian_history_name:0 "哈兰人撰写关于他们的历史"
 RICE_harran_treatise_harranian_history_desc:0 "由一位名叫[harranian_scholar.GetFullName]在撰写哈兰人的历史"
 RICE_harran_treatise_mysticism_name:0 "哈兰人关于图像和视觉论"
 RICE_harran_treatise_mysticism_desc:0 "由一位名叫[harranian_scholar.GetFullName]的学者在撰写一篇关于各种深奥主题和神秘主义的论文"
 RICE_harran_treatise_medicine_name:0 "哈兰药园论"
 RICE_harran_treatise_medicine_desc:0 "一位名叫[harranian_scholar.GetFullName]在撰写一篇关于关于医学和生物学的论文"
