 RICE_nabataean_ibn_wahshiyya_decision:0 "编译《纳巴泰农业》"
 RICE_nabataean_ibn_wahshiyya_decision_tooltip:0 "必须拯救祖先们的智慧"
 RICE_nabataean_ibn_wahshiyya_decision_desc:0 "我多年翻译古籍、拜访当地人以及撰写评论，收集支离破碎的古老智慧。现在我已经积累了足够的信息，可以将其汇编成一本书，因为书中的大部分内容都与农业有关，所以我将其命名为#italic 《纳巴泰农业》#!"
 RICE_nabataean_ibn_wahshiyya_decision_effect_tooltip_1:0 "你将获得一本功能强大的书籍[artifact|E]——#V 《纳巴泰农业》 #!"
 RICE_nabataean_ibn_wahshiyya_decision_confirm:0 "这种智慧必须为后人保留！"
 RICE_nabataean_ibn_wahshiyya_decision_context_tooltip:0 "#emphasis 历史背景：#!伊本·瓦赫西亚（生不详，约卒于公元930年） 是一位穆斯林学者和农学家，其巨著《纳巴泰农业》 是我们了解伊拉克纳巴泰人的主要资料来源，纳巴泰人是美索不达米亚南部一群说阿拉米语的多神教徒（不要与建造了佩特拉的纳巴泰阿拉伯人相混淆）。他本人也是纳巴泰人，甚至声称自己是古亚述国王西拿基立后裔（在这一时期的阿拉米民间传说中，人们对西拿基立记忆犹新）， 虽然《纳巴泰农业》一书的重点是农业，但它也涵盖了魔法、天文学、宗教等方面，因此它受到了后来学者迈蒙尼德、伊本·赫勒敦和托马斯·阿奎那等人的高度重视和参考。"
 RICE_nabataean_agriculture_book_name:0 "《纳巴泰农业》"
 RICE_nabataean_agriculture_book_desc:0 "一本由[ibn_wahshiyya.GetDynasty.GetName|U]学者撰写的巨著，该书包含对农业、宗教、哲学、魔法、占星术、历史等方面的见解。纵观全文，作者对[nabataean.GetAdjective]文化和其祖先[kasdanian.GetFaith]信仰感到无比自豪。"
 harran.0013.tooltip:0 "[GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )][trait|E]可以通过[travel|E]选择不同的[travel_options|E]来提升等级。当在每条路线上的[trait_level_track_xp|E]都达到最大值时，你就可以使用#bold $RICE_nabataean_ibn_wahshiyya_decision$#![decision|E]来获得一本书籍[artifact|E]"
 harran.0013.info:0 "\n#emphasis 历史背景：#!伊本·瓦赫希亚，一名来自伊拉克，活跃于九世纪末十世纪初的学者。他的著作#italic 《纳巴泰农业》#!因其对农业、占星与魔法的研究被广为推崇。\n\n对于当代学者来说，#italic 纳巴泰农业#!是伊本·瓦赫希亚所属的，如今鲜为人知的伊拉克纳巴泰人的重要资料，在RICE里以$nabati$文化表示。他们和生活在黎凡特，建造佩特拉古城的纳巴泰阿拉伯人并不是同一人群，因为伊拉克纳巴泰人操亚兰语，并自视为古两河文明继承者。在阿巴斯王朝早期，大部分人甚至还是多神教徒，坚持着古两河宗教的后续演进，这在RICE里以$south_mesopotamian_pagan$表示。\n\n有许多围绕这些纳巴泰人的传说，例如“他们所讲的亚兰语是创世时的原初之语”，甚至即使在那些视其为轻贱贫农的人中也存在流传。很有趣的一点在于伊本·瓦赫希亚自称是亚述王西拿基立的后人，和这位亚述王通常被描绘为的暴君形象不同的是，他被伊拉克的纳巴泰人视作伟大的祖先。"
 harran.0041.desc.landless:0 "自我离开[harran_county.GetNameNoTier]已经多年。曾经肥沃的农田如今变得尘土飞扬；人类成长、衰老直至死亡；生活依旧，一如既往地无常。但那些星星呢？它们一如往昔，也将永远如此。那些懂得解读星辰的人明白，命运有着自己的意志。\n\n奇妙的命运选择我成为学者，在著名的[GetTitleByKey('c_baghdad').GetNameNoTier]智慧宫与来自各地最伟大的思想家们会面，深夜研读着古老的智慧典籍。然而，我每天都在思考群星为我准备了什么。"
 harran.0047.desc.landless:0 "我依然思念着家乡，思念着[GetTitleByKey('c_harran').GetNameNoTier]。虽然身处[GetTitleByKey('c_baghdad').GetNameNoTier]是一种无上的荣耀，但作为多神教徒，我四处碰壁。我们中的一些人认为，在这个新信仰层出不穷的时代，我们这些特立独行之人前景不容乐观。我并不否认这一点，时间也在针对我们，像埃及人和希腊人那样，坚持古老信仰的人已经寥寥无几。\n\n我时常想起哈兰那座古老而宏伟的神庙，过去我不时经过那里。在它的门上刻着柏拉图——我们尊敬的祖先的话：“了解自身本质之人方为圣贤。”\n\n我站在门外，低声念诵着，仰望着越来越暗的天空，假装能以某种方式读懂我们的命运，然后进入门内。"
 harran.0061.desc.landless:0 "世事无常，沃田变废土，人们出生成长死亡，如此往复，而天上的星星呢？它们存在于过去、现在以及未来，读懂星象的人都知道，命运自有安排。\n\n如今奇妙的命运把我送回[harran_county.GetNameNoTierNoTooltip]，许久没踏在[harran_county.GetNameNoTier]街道上了，这座城市曾因学者和异教原因一度衰落。\n\n从柏拉图学院到月亮殿，从废墟到残存的大门，我不断搜索翻阅，直到看到刻在木头上的柏拉图的字迹——“了解自身本质之人方为圣贤。”\n\n我读了几遍这句话，然后抬头仰望越来越黑的天空，假装自己能以某种方式读懂我们的命运。"
