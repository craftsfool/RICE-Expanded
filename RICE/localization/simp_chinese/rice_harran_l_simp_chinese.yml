 harran.0005.t:0 "月神殿"
 harran.0005.desc:0 "每隔一段时间向神明表示敬意是明智的，无论何种方式。\n\n因此，我决定是时候去[harran_county.GetNameNoTier]的月神殿祭拜一下了。向祭司打过招呼后，我走到祭坛前。在我周围有各种神像，比如塔木兹神，希腊人也称其为阿多尼斯。在神庙的中心，矗立着月神的神像，当地人称其为辛。虽然墙壁破旧，神殿的日子肯定也不好过，但我能感觉到几个世纪的历史厚重感压在我身上。\n\n总之，我以捐赠礼物的方式表示敬意，以示我的虔诚。"
 harran.0005.a:0 "我希望得到神祇的眷顾！"
 harran.0005.b:0 "让这些祭品表明我的虔诚！"
 harran.0006.t:0 "xxxxx"
 harran.0006.desc:0 "xxxxx"
 harran.0006.a:0 "xxxxx"
 harran.0007.t:0 "神殿已不复存在"
 harran.0007.desc:0 "我无视[harran_county.GetNameNoTier]剩余亵渎者的抗议和恳求，他们敦促我不要终止我们与他们达成的协议，允许他们随意崇拜。我的想法是不会被动摇的。\n\n长期以来，我们对这些异教徒一直很宽容，哈兰的月神殿不会再接待这些异教徒的人了。我手下有不少人，随时可以听从我的吩咐，哈兰的异教时代已经结束了。"
 harran.0007.a:0 "掠夺并烧毁神殿！"
 harran.0007.tooltip:0 "[GetReligionFamily('rf_pagan').GetName][rulers|E]将不能使用在[harran_county.GetNameNoTier]继续[harran_temple_of_the_moon|E][decision|E]"
 harran.0008.t:0 "月神殿的毁灭"
 harran.0008.desc:0 "在[harran_county.GetNameNoTier]的月神殿，它自古以来就矗立着，是一个罕见的早已逝去的时代提醒。它和埃及人一样古老，在亚历山大大帝和尤利乌斯·凯撒生活的时候就已经有数千年了。它经历了一次又一次的灾难，比阿契美尼德帝国、孔雀王朝和罗马帝国活得更久，即使在十字架和新月崛起之后，它仍然继续存在。在一个战争和冲突的年代，它是越来越少的多神崇拜者的避难所，如赫尔墨斯，塔木兹，当然，还有一个古老的月神辛。\n\n然而，它终于走到了尽头。根据[harran_temple_destructor.GetTitledFirstName]的命令。神殿已经被夷为平地。哈兰剩下的多神教信徒已经失去了他们的神殿，他们剩下的日子也屈指可数了。"
 harran.0008.a:0 "我懂了……"
 harran.0008.tooltip:0 "[GetReligionFamily('rf_pagan').GetName][rulers|E]将不能使用在[harran_county.GetNameNoTier]继续[harran_temple_of_the_moon|E][decision|E]"
 harran.0009.t:0 "撰写论文"
 harran.0009.desc:0 "作为一个被认为是哈兰学者的人，我是时候为知识界做出一些贡献了！我们哈兰人可以拥有悠久的知识传承，可以追溯到雅典的新柏拉图学院，并最终追溯到像柏拉图和赫尔墨斯这样睿智的古代思想家。我准备我的书写工具，以及由专家撰写的各种书籍和卷轴，我可以参考这些书籍和卷轴进行研究。"
 harran.0009.a:0 "我等不及了！"
 harran.0009.tooltip:0 "你开始写一篇学术论著。"
 harran.0010.t:0 "停止写作"
 harran.0010.desc:0 "我已经完成了关于一个学术主题的论文写作，希望这是另一个值得哈兰人对学习的贡献。我希望我在作品中所阐述的知识能对人类有所裨益。至少，它应该为我在该地区的学术界带来一些名声和声誉。"
 harran.0010.a:0 "这是一项艰苦的工作！我将向其他人送去一些副本。"
 harran.0010.b:0 "也许我可以在精英中推广我的工作……"
 harran.0011.t:0 "xxxxx"
 harran.0011.desc:0 "xxxxx"
 harran.0011.a:0 "xxxxx"
 harran.0012.t:0 "纳巴泰农业"
 harran.0012.desc:0 "那些认识[ibn_wahshiyya.GetTitledFirstName][ibn_wahshiyya.GetDynasty.GetName]的人都说他是一位有天赋但古怪的学者。[ibn_wahshiyya.GetHerHis|U]来自南[GetGeographicalRegion('RICE_region_mesopotamia').GetName]的本地族群[nabataean.GetCollectiveNoun]之中（又称Nabataeans，但请不要与黎凡特地区拼写相同的纳巴泰人混淆）。\n\n长久以来，那些[nabataean.GetCollectiveNounNoTooltip]被很多人嘲弄为乡野下人。然而饱学的[ibn_wahshiyya.GetDynasty.GetNameNoTooltip]用[ibn_wahshiyya.GetHerHis]大半生探寻来自过往世界的智慧，尤其是属于[ibn_wahshiyya.GetHerHis]祖先的那些，来证明他们有很多值得世界学习之物。\n\n现在，[ibn_wahshiyya.GetDynasty.GetNameNoTooltip]将[ibn_wahshiyya.GetSheHe]的毕生所学编制成一本鸿篇巨著，名为$RICE_nabataean_agriculture_book_name$。那些读过它的人相信不仅在其主编的农业方面，而且在哲学、魔法、占星以及[nabataean.GetCollectiveNounNoTooltip]传统的[kasdanian.GetAdjective]信仰上有深刻的洞见。"
 harran.0012.a:0 "为人类智慧做出突出贡献。"
 harran.0013.t:0 "纳巴泰人"
 harran.0013.desc:0 "我们[nabati.GetCollectiveNoun]一度是强大而受到他国尊敬和恐惧的民族。在先古之年，强大的君主们，例如我之祖先桑哈里夫（亚述王辛纳赫里布，圣经作西拿基立），荣耀地征服与实行统治。而我们的语言，[nabati.GetLanguage.GetName]，则是创世之中的初始之语！\n\n我们如何陨落……或者至少是外人——那些说我们是无知土包子的人——喜欢这种所谓陨落的说法，但我知晓更多。\n\n如今，很多[nabati.GetCollectiveNounNoTooltip]只是居住在伊拉克沼泽之中的农民。这就是为什么我作为一个受过教育的学者，责任是去尽可能多的收集我族的古代知识、思考它，然后再传给其他人——这样，它们有可能被保留下来传至后世。我希望有一天，我能汇集我所学所思成为一部鸿篇巨著。"
 harran.0013.a:0 "我将为我的遗产倾注心血。"
