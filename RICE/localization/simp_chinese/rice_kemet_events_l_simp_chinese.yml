l_simp_chinese:
 RICE_kemet_palm_tree_mansion:0 "用棕榈树新装修的豪宅"
 RICE_kemet_opinion_accepted_gift:0 "接受我的礼物"
 RICE_kemet_opinion_didnt_accept_gift:0 "没有接受我的礼物"
 RICE_kemet_khnum_amulet:0 "克努姆的金护符"
 RICE_kemet_khnum_amulet_desc:0 "该角色有一个献给尼罗河之神克努姆的护身符；那个被称为“创造一切的众父之父”克努姆会保护他们吗？"
 RICE_kemet_akhenaten_curse:0 "埃赫那吞的诅咒"
 RICE_kemet_beer_enjoyer:0 "享受啤酒"
 RICE_kemet_beer_enjoyer_desc:0 "一些精英可能会认为啤酒只是一种流涎且不符合上等口味的饮料，但该角色更清楚。"
 RICE_kemet_good_maat:0 "维护玛阿特的平衡"
 RICE_kemet_good_maat_desc:0 "在人们眼中，该统治者简直就是神话中的玛阿特，为领地带来了正义与秩序。"
 RICE_kemet_bad_maat:0 "破坏玛阿特的平衡"
 RICE_kemet_bad_maat_desc:0 "在人们眼中，该统治者完完全全是神话中的玛阿特的反面，为领地带来了不义与失序。"
 VIETkemet.0000.t:0 "xxxxx"
 VIETkemet.0000.desc:0 "xxxxx"
 VIETkemet.0000.a:0 "xxxxx"
 VIETkemet.0001.t:0 "奥西里斯节"
 VIETkemet.0001.desc:0 "今天，我一直在我的领地内巡游。然而我来到的一个即将开始节庆的村庄并由大量当地盛宴，以纪念伟大的奥西里斯！我的一些同伴说，能遇到这样一个欢乐的时刻，真是太幸运了。我现在该怎么办？"
 VIETkemet.0001.a:0 "我会远远地观看庆典，这是一个有地位的人应该做的事。"
 VIETkemet.0001.b:0 "我会伪装成一个平民，享受欢乐时光。"
 VIETkemet.0001.c:0 "村民竟敢无视我！命令他们停止宴会并为我服务！"
 VIETkemet.0002.t:0 "赞美奥西里斯"
 VIETkemet.0002.desc:0 "我会见了村里的长者，他们为我来到他们简陋的定居点而激动不已。他们说我如同吉祥的使者一样。\n\n站在俯瞰村庄的山顶上，我看着对奥西里斯的节庆进行。一些村民带着猪到神的祭坛前。他们割断了猪的喉咙，这是对奥西里斯的祭品，然后把尸体交给猪倌，猪倌把尸体带走。\n\n之后，一阵欢呼声响起，男人和女人开始挤满村庄广场，跳舞、大笑和喝酒。一位吹长笛的村民高兴地跳来跳去，弹奏着活泼的曲子，村民们开始跟着他，一边歌颂奥西里斯。"
 VIETkemet.0002.a:0 "很高兴看到村民们这样高兴。"
 VIETkemet.0002.b:0 "奥西里斯会对他们的奉献感到高兴。"
 VIETkemet.0003.t:0 "赞美奥西里斯"
 VIETkemet.0003.desc:0 "我和我的同伴们换上了简单的衣服，现在看起来就像是普通但富裕的旅行者。村民们对我们这些“旅行者”很热情，并乐于为我们提供住宿。他们说，我们在这个时候来真是幸运。\n\n站在村里的广场上，在一群男人、女人和孩子中间，我看着奥西里斯的庆典进行。一些村民带着猪，把猪带到神的祭坛前。他们割断了这些不幸野兽的喉咙放血，这无疑是给奥西里斯的祭品，然后把尸体交给猪倌，猪倌把尸体带走。\n\n之后，他们爆发出巨大的欢呼声，村庄广场变得拥挤大家庆祝。我喜欢喝好啤酒，和其他村民一起跳舞。很快，一个吹着长笛的村民高兴地跳来跳去，吹起了一首活泼的曲子，我们都跟着他，一边唱着歌颂奥西里斯。"
 VIETkemet.0003.a:0 "这很有趣！"
 VIETkemet.0004.t:0 "节日结束"
 VIETkemet.0004.desc:0 "就像所有美好的事物一样，盛宴即将结束。我度过了一段美好的时光，并告别了我的新朋友。也许有一天我会回来再次享受庆祝活动！"
 VIETkemet.0004.a:0 "多有趣啊！赞美伟大的奥西里斯！"
 VIETkemet.0005.t:0 "大蒜礼品"
 VIETkemet.0005.desc:0 "古时候，埃及人珍视最美妙、最美味的蔬菜——大蒜。它取悦众神并被用来宣誓。也许订购大量大蒜分发到分散在我们领土的寺庙是一个好主意！"
 VIETkemet.0005.a:0 "是的，让我们就这样做，赞美神灵！"
 VIETkemet.0005.b:0 "不行，我们没有多余的资源。"
 VIETkemet.0006.t:0 "棕榈树"
 VIETkemet.0006.desc:0 "古埃及有权势的男人和女人经常种植棕榈树，不仅是为了约会，而且是为了在他们的宫殿和寺庙中提供良好的遮荫。我觉得如果我对我的住所和附近的寺庙也这样做是明智的。如果可以的话，我可以推广出去，让他们想起古埃及人的辉煌！"
 VIETkemet.0006.a:0 "那就让我们开始种树吧！"
 VIETkemet.0006.b:0 "这似乎是徒劳和毫无意义的。"
 VIETkemet.0007.t:0 "一个护符"
 VIETkemet.0007.desc:0 "[khnum_gifter.GetTitledFirstName]今天给了我一份礼物，是一个制作精美的黄金护身符，献给克努姆神。作为尼罗河的控制者，他为所有人带来财富，神力不可小觑。"
 VIETkemet.0007.a:0 "谢谢！愿它能帮助我这一生"
 VIETkemet.0007.b:0 "我不能接受这么好的礼物！"
 VIETkemet.0008.t:0 "劫掠者之墓"
 VIETkemet.0008.desc:0 "坏消息！最近，似乎有一群狡猾的强盗闯入附近的各种坟墓，亵渎尸体，偷走他们能找到的任何财宝。这样的话死者现在如何能够庇护他们的后代们，更不用说如果与奥西里斯一起安享来世？这不过是一种耻辱！"
 VIETkemet.0008.a:0 "希望当地治安员能抓住这些强盗……"
 VIETkemet.0008.b:0 "我们将提供一些援助来保护任何未被掠夺的坟墓。"
 VIETkemet.0009.t:0 "侏儒的守护神"
 VIETkemet.0009.desc:0 "在梦中我发现自己置身于黑夜中，并被恶魔包围着。我在梦中迷路了。我很害怕并入绝望。但后来贝斯神出现，那个外表古怪的矮人神，我看到他拿出刀剑，像士兵一样挥舞着，以驱赶恶魔。我看到他拿出乐器，大声演奏吓退他们。当我醒来时，我感到很平静。"
 VIETkemet.0009.a:0 "就像他守护古代的法老一样，他刚才也保护了我！"
 VIETkemet.0010.t:0 "我内在的邪恶"
 VIETkemet.0010.desc:0 "我觉得尽管我做了很多好事，但我的内心仍然有邪恶，必须加以清除，因为作为统治者，我确实做了必要的恶事。如果我的心与玛阿特失去平衡，那么在来世我将被可怕的野兽阿密特吞食，我将没有机会和平地长生不老。因此，我渴望找到一个好牧师，那么谁知道如何减轻邪恶呢！"
 VIETkemet.0010.a:0 "我会去寺庙，以确保我在来世的地位！"
 VIETkemet.0010.b:0 "细思一些，也许我反应过度了"
 VIETkemet.0011.t:0 "玛阿特的复苏？"
 VIETkemet.0011.desc:0 "牧师了解我的担忧，知道适合我情况的咒语。因此他开始在我面前吟唱：\n\n“我带来了诸神熏香和苏打。\n我想将你嘴里的臭味去掉。\n所以我来是为了驱除你们心中的恶。\n有了这个，我消除了依附在你身上的邪恶，\n有了这个，我给你带来了好运。\n我为你呼唤正义，呼唤玛阿特……”"
 VIETkemet.0011.a:0 "我陡然如释重负，仿佛灵魂被净化。"
 VIETkemet.0012.t:0 "令人发指的罪行"
 VIETkemet.0012.desc:0 "令人发指的罪行！这个可怜的罪犯被带到我面前，在我的宫廷中，很少有人能忍受看到这个离经叛道、无法无天、毫无人性的恶棍。毫无疑问他的行为将受到严厉的惩罚。我把他的判刑告诉了他，我的卫兵很快就把他带去处决了。\n\n想到他谋杀了一只猫，即使是意外！那也是不可饶恕的罪行。\n\n像古代法老一样，我们认为猫是神圣的，尤其是对伟大的女神巴斯特来说。任何人杀死猫即使是无意中，都将立即被处死——巴斯特的正义是迅速而复仇的，愿罪犯的鲜血足以让她满意！"
 VIETkemet.0012.a:0 "灾厄！"
 VIETkemet.0013.t:0 "异端的诅咒"
 VIETkemet.0013.desc:0 "[aten_fearer.GetTitledFirstName]说今天一个人散步时遇到了埃赫那吞的鬼魂！那个可恶的异端，痴迷于阿吞神的无能法老，给埃及带来了混乱！他的宗教改革使祭司的诅咒降临其身。但这不是好消息……[aten_fearer.GetFirstName]也被诅咒了吗？"
 VIETkemet.0013.a:0 "最好快点去找牧师，亲爱的朋友，以防万一！"
 VIETkemet.0014.t:0 "愉悦塞日姆神"
 VIETkemet.0014.desc:0 "我庄严地看着罪犯被斩首。他的头掉了下来，他的血溅到了地上。恶魔之神晟祖，被称为邻里恶人的惩戒者，一定很高兴。据说，当死刑犯被处决时，那位酿造了酒、榨出了油的塞日姆神会把他们砍下的头颅榨成红酒。"
 VIETkemet.0014.a:0 "今天晚些时候我会品尝一些正义的红酒！"
 VIETkemet.0015.t:0 "啤酒？"
 VIETkemet.0015.desc:0 "就像在古埃及一样，啤酒被认为是大众的饮料，但葡萄酒是留给富人的。然而最近我开始对啤酒产生了兴趣。一种奇妙的后天味道，因为与葡萄酒相比，它浓稠且富含固体，当然也不会成为酒中贵族，但它让我感觉更健康，也不算太糟糕。"
 VIETkemet.0015.a:0 "但我应该克制自己。我毕竟不是农民！"
 VIETkemet.0015.b:0 "让他人的意见都去见鬼！啤酒对我和我的灵魂有好处！"
 VIETkemet.0016.t:0 "玛阿特的化身"
 VIETkemet.0016.desc:0 "我所统治的农民相信，无论他们面临什么样的困难，即使是因为我的过错，但是我的统治仍然是玛阿特的——是正义、善良和有秩序的。他们赞扬我不懈的努力。"
 VIETkemet.0016.a:0 "听到这真是高兴。"
 VIETkemet.0017.t:0 "玛阿特的对立面"
 VIETkemet.0017.desc:0 "无论是对是错，我统治的农民都认为，由于我的统治方式，即使我对他们做了好事，他们也不认为我的统治是玛阿特的——是正义、善良和有秩序的。"
 VIETkemet.0017.a:0 "他们不理解！"
 VIETkemet.0018.t:0 "一个遗忘的坟墓"
 VIETkemet.0018.desc:0 "我和我的卫兵在附近的沙漠中旅行时，偶然发现了一座半埋在沙子里的古墓。如果我没有发现沙漠裸露的一些磨损的石头并排列成一个图案，那么我们会错过它\n\n在我们调查之后，我们发现了某种古老的文字，虽然这些文字已经磨损得无法辨认，但很明显，它是由这片土地上的某个古埃及或努比亚文化的人书写的。此外，很明显这是古代某个重要人物的墓地，即使这个地方现在是光秃秃的——也许不是法老，但至少是某个重要的男人或女人。"
 VIETkemet.0018.a:0 "在继续之前，我会在这里表达我的敬意"
 VIETkemet.0018.b:0 "所剩无几……但我们可以抢点什么东西吗？"
 VIETkemet.0019.t:0 "德顿的庇佑"
 VIETkemet.0019.desc:0 "新一批熏香运到我的住处，用于各种仪式和祭祀仪式，我想起了古代在埃及和努比亚边境流行的古老信仰——德顿神教"
 VIETkemet.0019.a:0 "当我在家烧熏香时，火焰将保护我。"
 VIETkemet.0020.t:0 "荣耀德顿神"
 VIETkemet.0020.desc:0 "我在参观附近的一座寺庙时，看到一个人坐在角落里，用小仪器和天平测量似乎熏香之类东西。当我问他在做什么时，他坚定地告诉我：“我有责任衡量每月发给与这座寺庙相关的神殿和祭坛以及在那里工作的牧师的香火。我的工作是为了荣耀熏香之神德顿，这是必不可少的仪式。请让我集中精力。”"
 VIETkemet.0020.a:0 "很好，请继续你重要的工作。"
 VIETkemet.0020.b:0 "不要这么冷淡，记住你在和谁说话！"
