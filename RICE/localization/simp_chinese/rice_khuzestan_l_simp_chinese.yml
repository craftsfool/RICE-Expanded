 RICE_khuzestan_gift_tiraz_robes:0 "一件提拉兹赠礼"
 RICE_khuzestan_gift_tiraz_robes_desc:0 "在[khila_ceremony|E]中向[recipient.GetShortUINamePossessiveNoTooltip]赠与一件[tiraz|E]"
 RICE_khuzestan_gift_tiraz_robes_tooltip:0 "[interaction|E]的成本，以及你和[recipient.GetFirstNameNoTooltip]获得的[prestige|E]（和[piety|E]）取决于你的[ranks|E]以及你是否是[recipient.GetHerHis][head_of_faith|E]"
 building_type_RICE_khuzestan_shushtar_hydraulic_system:0 "舒什塔尔水利系统"
 building_type_RICE_khuzestan_shushtar_hydraulic_system_desc:0 "舒什塔尔水利系统历史可追溯到大流士大帝所在的公元前五世纪，舒什塔尔是一个岛屿城市，因此周围环绕着复杂的水坝、运河、桥梁和水车，这些建筑共同构成世界上最广泛的灌溉网络之一，使舒什塔尔周围大片地区的农业种植成为可能，并带来地区繁荣，这个系统是由古代波斯人用几个世纪的时间建立起来的，至今仍由当地统治者维护。"
 building_RICE_khuzestan_shushtar_hydraulic_system:0 "$building_type_RICE_khuzestan_shushtar_hydraulic_system$"
 building_RICE_khuzestan_shushtar_hydraulic_system_desc:0 "$building_type_RICE_khuzestan_shushtar_hydraulic_system_desc$"
 building_type_RICE_tiraz_factories_01:0 "提拉兹中心工坊"
 building_type_RICE_tiraz_factories_01_desc:0 "[tiraz|E]由于其政治和文化重要性，是伊斯兰社会珍视的一种刺绣布料。无论是政府还是私人所有，生产[tiraz|E]的设施对区域经济都很重要。"
 building_RICE_tiraz_factories_01:0 "提拉兹织工"
 building_RICE_tiraz_factories_01_desc:0 "该地统治者雇佣了一些当地工匠来生产昂贵的、华丽的[tiraz|E]纺织品。\n\n#EMP 该[county|E]的[ruler|E]和其[lieges|E]如果持有此[building|E]将降低赠送[tiraz|E]的[interaction|E]成本（减少#P -10%#!且不叠加）#!"
 building_RICE_tiraz_factories_02:0 "提拉兹工坊"
 building_RICE_tiraz_factories_02_desc:0 "随着该地纺织业的发展，领主扩大了现有的[tiraz|E]工坊以雇用更多工匠并提高生产水平。\n\n#EMP 该[county|E]的[ruler|E]和其[lieges|E]如果持有此[building|E]将降低赠送[tiraz|E]的[interaction|E]成本（减少#P ‑30%#!且不叠加）#!"
 building_RICE_tiraz_factories_03:0 "知名提拉兹作坊"
 building_RICE_tiraz_factories_03_desc:0 "这里的[tiraz|E]作坊分布广泛，其中一些是世界上最著名的，他们生产的提拉兹在其他地方一匹难求\n\n#EMP 该[county|E]的[ruler|E]和其[lieges|E]如果持有此[building|E]将降低赠送[tiraz|E]的[interaction|E]成本（减少#P ‑50%#!且不叠加）#!"
