 khuzestan.0050.t:0 "运河维护"
 khuzestan.0050.desc:0 "[GetGeographicalRegion('RICE_khuzestan_region').GetName]几个世纪以来一直是重要的农垦重地，不过当地人经常发现古代运河的遗骸，这些运河似乎维护好后又可以重新利用。\n\n[county.GetNameNoTier]的官员最近通知我发现了一条这样的大运河，历史似乎可以追溯到古波斯时代.他们说只要有合适的资金，我们就可以聘请工匠来维护这条运河，让它再次发挥作用，这将大大增加耕地面积。"
 khuzestan.0050.a:0 "好好好！钱拿走！"
 khuzestan.0050.b:0 "钱有更好的去处，而不是这里"
 khuzestan.0051.t:0 "甘蔗之乡"
 khuzestan.0051.desc:0 "来自胡齐斯坦的糖品质响彻中东，并且大量出口到其他地区。这就是为什么有人称胡齐斯坦为“甘蔗之乡”。\n\n幸运的是，我宫廷最近从胡齐斯坦采购了大量糖。他们确信这种​​糖在不久的将来能满足我们的口味，无论是用它来制作糖果和糕点，还是在宴会上用来做美味的菜肴都可以用到！"
 khuzestan.0051.a:0 "我期待着大厨们做的甜食！"
 khuzestan.0052.t:0 "[GetGeographicalRegion('RICE_khuzestan_region').GetNameNoTooltip]的织工"
 khuzestan.0052.desc:0 "[GetGeographicalRegion('RICE_khuzestan_region').GetName]几个世纪以来一直以其编织而闻名，来自该地区的衣服、长袍、地毯、被子等在世界各地的市场上销售。\n\n最近[county.GetNameNoTier]的织工声名鹊起，因为其产品被认为是该地区最好的产品。"
 khuzestan.0052.a:0 "这对当地来说是极好的！"
 khuzestan.0053.t:0 "向古人学习"
 khuzestan.0053.desc:0 "我最近去了[GetGeographicalRegion('RICE_khuzestan_region').GetName]的领土，以更好地了解那里的当地问题。我注意到的一件事是伟大的建筑，其中许多是由古代波斯人在很久以前建造的。\n\n自从我回到宫后，这些辉煌的建筑壮举就一直在我脑海中萦绕，想不到古人能创造出如此奇迹！\n\n我突然想到，也许我应该派一些工匠和学者去研究这些建筑。那样的话，我们就可以应用古人的知识用来帮助我们！"
 khuzestan.0053.a:0 "好主意！我们就这样做。"
 khuzestan.0053.b:0 "别想这些有的没的。"
