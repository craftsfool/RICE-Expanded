 RICE_khuzestan_legend_new_title_name: "胡齐民族伟大复兴"
 RICE_khuzestan_legend_new_title_desc: "只要在心底里，灵魂还在渴望，[GetCultureByKey('khuzi').GetCollectiveNoun]人的脊梁就不会折断！感恩[founder.GetName]，是[founder.GetSheHe]带领我们再造家园、走向辉煌！"
 RICE_khuzestan_legend_chapter_opening_new_title: "曾几时，[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]为主流社会所不容，被视为低劣卑贱的民族，只配做上等人的仆役。啊，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，你的同胞歌颂你伟大的功绩！没有你，[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]人怎能成为[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]的主人！"
 RICE_khuzestan_legend_chapter_motivation_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]并不以自己[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]人的身份为耻。相反，[ROOT.Legend.GetProtagonist.GetSheHe]正是因作为[ROOT.Legend.GetProperty('culture').Culture.GetCollectiveNounNoTooltip]人而受尽白眼才有了“翻身做主人”的志向。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]不相信有什么民族是生而卑贱的，[ROOT.Legend.GetProtagonist.GetSheHe]会完成祖祖辈辈的夙愿，让[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]人摆脱束缚的锁链！"
 RICE_khuzestan_legend_chapter_famous_deed_new_title: "一切赞颂，全归[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]！只有[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]的祝福，才能让[GetCultureByKey('khuzi').GetNameNoTooltip]人出一位[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]这样的英雄！有智慧聪明，有不拔之志，[ROOT.Legend.GetProtagonist.GetSheHe]杀恶贼、斩凶兽，因势利导，合纵连横，降伏诸方豪杰，自称[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]之主，令世人对[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人刮目相看！"
 RICE_khuzestan_legend_chapter_extra_deed_new_title: "不过，总有人固执己见，[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]蒙蔽了他们的内心，蒙蔽了他们的双眼，让他们看不到哪怕是近在咫尺的真相。这些人对[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]人、对[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]嗤之以鼻。他们四处散布谣言，说[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]不过是走了狗屎运，从阴沟里捡了顶王冠。但[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]丝毫不以此为怵，“是的，我是在阴沟里捡到的王冠，但却是[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]将它戴在了我的头上！”"
 RICE_khuzestan_legend_chapter_conclusion_new_title: "啊，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，你的功绩将代代为[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]人传唱，你对[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]的统治会一直到永远，你的传奇将世世代代流淌于[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]人的血脉中！你领导[GetCultureByKey('khuzi').GetCollectiveNounNoTooltip]走向了光明！"
