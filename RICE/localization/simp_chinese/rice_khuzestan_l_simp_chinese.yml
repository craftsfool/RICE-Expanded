 khuzestan.0020.t:0 "准备前往苏斯！"
 khuzestan.0020.desc:0 "圣人但以理对[ROOT.Char.GetFaith.GetAdherentNamePlural]很重要，他是一个忠于[ROOT.Char.GetFaith.HighGodName]的义人。虽然据说有几个地方是他的坟墓，但许多人认为苏斯（古人也称为苏萨）是最可靠的地点，幸运的是我住在苏斯附近。\n\n当地人经常前往但以理墓朝圣，而我正打算这样做。虽然苏斯旅程不会很长，但我仍然需要做好准备。"
 khuzestan.0020.a:0 "做好准备"
 khuzestan.0021.t:0 "前往苏斯"
 khuzestan.0021.desc:0 "我已经为但以理墓朝圣做好了准备，我告别了大家前往苏斯，我等不及想去那里！"
 khuzestan.0021.a:0 "目的地！苏斯！"
 khuzestan.0022.t:0 "抵达苏斯"
 khuzestan.0022.desc:0 "我已抵达苏斯，前往参​​观但以理墓。朝圣者中有[judaism.GetName]、[christianity.GetName]和[islam.GetName]的追随者。尽管这三种宗教之间存在差异，但我们都崇敬伟大的但以理，他的虔诚至今仍在激励着我们。\n\n"
 khuzestan.0022.desc.before:0 "苏斯被一条大河隔开，但以理墓的位置每年都在这条河的两岸交替变化。换句话说，当地人来回搬运丹尼尔的尸体，这对某些人来说可能听起来很奇怪且惊悚。\n\n不过这样做要追溯到很久之前坟墓只在河的一侧，后来有但以理墓变得富裕的起来，无论是由于但以理的祝福，来自朝圣者的商业，还是两者兼而有之。河岸的另一侧对此表示不满，双方为墓葬的位置而争吵，直到达成协议导致现在的安排，因此双方都变得富有。"
 khuzestan.0022.desc.after:0 "苏斯被一条大河隔开，但但以理坟墓位于一座桥上的小教堂内，这座建筑是[sanjar.GetTitledFirstName]不久前建造的。\n\n在过去，每年坟墓都会在河流两岸交替埋葬。然而[sanjar.GetFirstNameNoTooltip]觉得这样来回移动他的棺材是对伟大的但以理侮辱，所以[sanjar.GetSheHe]下令建造现在的教堂，并将棺材埋在在河中。"
 khuzestan.0022.a:0 "是时候去朝圣了。"
 khuzestan.0023.t:0 "但以理之墓"
 khuzestan.0023.desc.before:0 "我已经到达但以理墓现在的位置"
 khuzestan.0023.desc.after:0 "我已经到达[sanjar.GetTitledFirstName]为纪念但以理而建造的桥上陵墓"
 khuzestan.0023.desc:0 "据说此墓周边皆为圣地，为向但以理表示崇敬，就连水中游鱼也不可惊扰。\n\n总之，我按照[ROOT.Char.GetFaith.GetAdjective]的礼仪，与在场的人们一同念诵祈祷，随即又在此沉思片刻，思索但以理的走过的人生与留下的事迹。身临此地，瞻仰如此虔诚正直之人，何其有幸！"
 khuzestan.0023.a:0 "赞美[ROOT.Char.GetFaith.HighGodName]！"
 khuzestan.0024.t:0 "打道回府"
 khuzestan.0024.desc:0 "在苏斯的但以理墓待了一段时间后，我回到了家。\n\n总的来说，来到圣地并缅怀[ROOT.Char.GetFaith.GetReligion.GetName]中如此重要的人物是一次很棒的经历。"
 khuzestan.0024.a:0 "我很高兴可以这么做"
 khuzestan.0025.t:0 "迁移但以理墓"
 khuzestan.0025.desc:0 "尽管有许多城市声称是但以逝去之地，但许多人认为苏斯才是最符合的地方。因此周围地区的许多人涌向苏斯来拜访但以理墓。\n\n不过当地人有一个奇怪的习俗。他们每年将但以理墓迁移至苏斯河流的另一边，从而交替放置但以理的棺材。虽然我知道河流两岸的人都希望平等地享受他的存在，但我最终发现这种习俗是对伟大的但以理的不尊重。\n \n因此我已下令在其中一个地方建造一座永久性的陵墓，将横跨河流的桥梁来作为伟大的但以理的安息之地。"
 khuzestan.0025.a:0 "但以理现在有了一个永久的安息之地。"
 khuzestan.0026.t:0 "$khuzestan.0025.t$"
 khuzestan.0026.desc:0 "尽管有许多城市声称是但以逝去之地，但许多人认为苏斯才是最符合的地方。因此周围地区的许多人涌向苏斯来拜访但以理墓。\n\n不过当地人有一个奇怪的习俗。他们每年将但以理墓迁移至苏斯河流的另一边，从而交替放置但以理的棺材。虽然我知道河流两岸的人都希望平等地享受他的存在，但[sanjar.GetTitledFirstName]认为这种习俗是对伟大的但以理的不尊重。\n \n因此[sanjar.GetSheHe]已下令在其中一个地方建造一座永久性的陵墓，将横跨河流的桥梁来作为伟大的但以理的安息之地。"
 khuzestan.0026.a:0 "$khuzestan.0025.a$"
