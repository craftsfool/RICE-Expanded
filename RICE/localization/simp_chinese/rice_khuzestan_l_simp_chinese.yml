 khuzestan.0029.a:0 "xxxxx"
 khuzestan.0030.t:0 "为圣五节做准备"
 khuzestan.0030.desc:0 "圣五节对我们[mandean.GetAdherentNamePlural]来说是最重要的节日之一，因为这是黑暗无法降临地球的时刻。这个庆典是在与任何其他月份无关的五天内举行，即在#italic 穗谷节#!结束之后举行，现在宗教日历的第八个月，之后五天我们都纪念[mandean.HighGodName]和创造万物的五天。\n\n今年我希望为这个节日举办一场盛大而精彩的庆祝活动！因此我需要召集当地的[mandean.GetAdjective]群体共同努力，使之成为可能。[mandean.PriestNeuterPlural]告诉我，为了确保一切顺利，他们会参考两本圣典#italic 《圣五节卷轴》#!和#italic 《先祖卷轴》#!，为在圣五节期间进行的仪式提供了说明。"
 khuzestan.0030.a:0 "让我们抓紧时间！"
 khuzestan.0031.t:0 "圣五节开始"
 khuzestan.0031.desc:0 "圣五节即将到来！我和当地的[mandean.GetAdjective]群体聚集在一起庆祝这个伟大的节日，因为它纪念神创造世界的五天。\n \n现在每个人都穿着白色的衣服，今天我们全体都不吃肉除了为死者举行祭祀仪式的羊，也不会在脚上穿皮革制品，所以我们中的一些人穿草鞋，而另一些人则赤脚。"
 khuzestan.0031.a:0 "我要赤脚！"
 khuzestan.0031.b:0 "我会穿草鞋"
 khuzestan.0032.t:0 "圣五节：第一天"
 khuzestan.0032.desc:0 "圣五节的第一天是献给所有世界之父、光之王、第一道光#italic 哈依拉比#!，是祂创造了所有的天使、人类和物质世界。\n\n随着[mandean.PriestNeuterPlural]帮助我们完成各种仪式，如洗礼，现在每个人都心情愉快。这五天是为了纪念祂，以及祂带来的好处。"
 khuzestan.0032.a:0 "一个好的开始！"
 khuzestan.0033.t:0 "圣五节：第二天"
 khuzestan.0033.desc:0 "圣五节的第二天是献给第一道光，至高无上的主宰#italic 哈依拉比#!的日子。"
 khuzestan.0033.a:0 "赞美祂初光！"
 khuzestan.0034.t:0 "圣五节：第三天"
 khuzestan.0034.desc:0 "圣五节的第三天是第一道光创造知识的日子，祂在其中创造了自己。"
 khuzestan.0034.a:0 "赞美生命的知识！"
 khuzestan.0035.t:0 "圣五节：第四天"
 khuzestan.0035.desc:0 "圣五节的第四天庆祝第一道光#italic 哈依拉比#!的显化，祂在其中创造了自己。"
 khuzestan.0035.a:0 "赞美第一道光！"
 khuzestan.0036.t:0 "圣五节：第五天"
 khuzestan.0036.desc:0 "圣五节的第五天是纪念日，第一道光分配了万物如河流，因为祂万物得到分配。"
 khuzestan.0036.a:0 "赞美第一道光，他将奔腾的溪流分开！"
 khuzestan.0037.t:0 "圣五节结束"
 khuzestan.0037.desc:0 "今年的圣五节已经结束，当地每个人都参加了这五天的庆典，庆祝第一道光创造了宇宙。[mandean.PriestNeuterPlural]指导我们完成了各种仪式，就像举行的许多洗礼一样。\n\n我们所有人，从底层到贵族，能够聚集在一起参加一个重要的场合，像这样真是一种快乐！"
 khuzestan.0037.a:0 "下次再见！"
