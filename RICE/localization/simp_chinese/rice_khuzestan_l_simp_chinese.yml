 RICE_khuzestan_recently_gifted_tiraz:0 "将提拉兹赠予重要人物"
 RICE_khuzestan_recently_gifted_tiraz_desc:0 "该角色最近在[khila_ceremony|E]中向一位贵族赠送[tiraz|E]，这样做很好地反映了他们自己的地位。"
 RICE_khuzestan_received_tiraz_from_head_of_faith:0 "从信仰领袖手中获得提拉兹"
 RICE_khuzestan_received_tiraz_from_head_of_faith_desc:0 "该角色有幸在[khila_ceremony|E]中从其[head_of_faith|E]手中获得[tiraz|E]，因此在其信仰的信徒眼中赢得了很高的威望。"
 RICE_khuzestan_gifted_tiraz:0 "赐予我提拉兹"
 RICE_khuzestan_mandaean_connections:0 "曼达派接触"
 RICE_khuzestan_mandaean_connections_desc:0 "该角色与美索不达米亚南部和胡齐斯坦的曼达人社区有着密切的联系，尤其是那里的曼达人撰经阁。"
 RICE_khuzestan_restored_elymais:0 "胡齐人崛起：埃兰迈斯复兴"
 RICE_khuzestan_restored_elymais_desc:0 "胡齐斯坦的本土居民在自己的故土掌权后，开始效仿他们认为是其直系文化祖先埃兰迈斯人的生活方式。在古代，埃兰迈斯王国的人民以精湛的射箭技巧以及其独立文化特性而广为人知。"
 RICE_khuzestan_restored_khuzi:0 "胡齐人崛起：受尊重的社区"
 RICE_khuzestan_restored_khuzi_desc:0 "胡齐斯坦的本土居民在自己的故土掌权后，他们专注于将自己的社会发展和文化培育到更高的高度。曾经他们与浴室侍者、乳母和其他卑微的角色联系在一起，如今人们提到他们时会想到国王、哲学家和艺术家！"
 RICE_khuzestan_restored_gulf:0 "胡齐人崛起：海湾商人"
 RICE_khuzestan_restored_gulf_desc:0 "胡齐斯坦的本土居民在自己的故土掌权后，将注意力转向了波斯湾沿岸繁华的贸易路线，他们寻求充分利用胡齐斯坦历史悠久的农业和商业天赋，以建立新的文明。"
 RICE_khuzestan_celebrated_parwanaya:0 "著名的圣五节"
 RICE_khuzestan_repaired_ancient_canal:0 "已修复的古运河"
 RICE_khuzestan_repaired_ancient_canal_desc:0 "胡齐斯坦境内有许多古波斯人开凿的运河，当地领主刚刚修复了其中一条较大的运河，这应该有助于提高该地区未来几年的农业产量。"
 RICE_khuzestan_sugar_sugar:0 "来自胡齐斯坦的糖"
 RICE_khuzestan_weavers:0 "繁忙的织工"
 RICE_khuzestan_weavers_desc:0 "胡齐斯坦的纺织业远近闻名，最近来自胡齐斯坦这个地区的纺织品在全世界都受到追捧。"
 RICE_khuzestan_engineering_study:0 "研究胡齐斯坦的古代水利系统"
 RICE_khuzestan_engineering_study_desc:0 "古波斯人以运河、水坝、桥梁等建筑在胡齐斯坦创造了许多伟大的工程。该角色最近对这些建筑产生了兴趣并了解了许多。"
 RICE_khuzestan_tomb_of_daniel_decision:0 "去但以理墓朝圣"
 RICE_khuzestan_tomb_of_daniel_decision_tooltip:0 "前往苏斯的[tomb_of_daniel|E]"
 RICE_khuzestan_tomb_of_daniel_decision_desc:0 "但以理是[ROOT.Char.GetFaith.GetAdherentNamePlural]的重要宗教人物，[daniels_tomb|E]据说在苏斯，临近地区许多人都去那里向他表示缅怀——作为尊贵的领主我也应该这样做！"
 RICE_khuzestan_tomb_of_daniel_decision_effect_tooltip_1:1 "你将前往苏斯的[tomb_of_daniel|E]朝圣，将会获得随机[piety|E]以及[GetModifier('RICE_khuzestan_daniel_pilgrimage_done').GetNameWithTooltip][character_modifier|E]"
 RICE_khuzestan_tomb_of_daniel_decision_confirm:0 "准备前往苏斯！"
 RICE_khuzestan_tomb_of_daniel_decision_context_tooltip:0 "#emphasis 历史背景：#!《但以理书》提到但以理住在巴比伦，可能参观过伊朗苏萨的宫殿，但没有具体说明他死的地方，不过犹太人和阿拉伯人普遍认为埋葬在苏斯。欧洲出版的最早提及但以理墓的是图德拉的本杰明（著名中世纪旅行家），他在1160年至1163年间游历亚洲。他看到了传统认为的但以理墓，不过本杰明却称，这座坟墓中并没有安放但以理的遗骸，据说这些遗骸是在公元640年左右在苏萨发现的。这些遗骸本应带来好运，因此在苏斯河两岸的居民之间发生了激烈的争吵.，住在但以理坟墓那一边的人都富裕幸福，而对面的人却穷困潦倒。因此后者希望将但以理的棺材转移到另一边。不过他们最终同意棺材应该每侧交替放置一年，这个协议执行了很多年，直到塞尔柱统治者桑贾尔在12世纪停止了这种做法，因为他觉得这是对但以理的侮辱；因此他在河流中间立了一座桥并建立坟墓。不管事情的真相如何，原来的坟墓被洪水摧毁，如今的但以理墓建于1870年。"
 RICE_khuzestan_rebury_daniel:0 "迁移但以理墓"
 RICE_khuzestan_rebury_daniel_tooltip:0 "将[tomb_of_daniel|E]迁移到更合适的地点"
 RICE_khuzestan_rebury_daniel_desc:0 "苏斯是[tomb_of_daniel|E]的所在地，他是许多[faiths|E]的重要宗教人物包括[ROOT.Char.GetFaith.GetName]。但是当地人每年都会交替挪动但以理的坟墓，让这位圣人坟墓在苏斯的河流上来回移动。我觉得这种习俗是对圣人的不尊重！让我们为他找到一个永久的家！"
 RICE_khuzestan_rebury_daniel_effect_tooltip_1:1 "[GetActivityType( 'activity_RICE_khuzestan_tomb_of_daniel_pilgrimage' ).GetName]的[piety|E]奖励增加了，并且在更大的地理范围内都可以进行[activity|E]"
 RICE_khuzestan_rebury_daniel_confirm:0 "这个圣人需要一个适当的安息之所！"
 RICE_khuzestan_rebury_daniel_context_tooltip:0 "$RICE_khuzestan_tomb_of_daniel_decision_context_tooltip$"
 RICE_khuzestan_repair_shushtar_hydraulics:0 "维护$c_tustar$的水利系统"
 RICE_khuzestan_repair_shushtar_hydraulics_tooltip:0 "[GetBuilding('RICE_khuzestan_shushtar_hydraulic_system').GetName]可以进行一些维护或者整修"
 RICE_khuzestan_repair_shushtar_hydraulics_desc:0 "尽管[GetTitleByKey('c_tustar').GetNameNoTier]的大部分水利系统建于几个世纪前，但其继续为该地区的繁荣做出巨大贡献。不过由于它们的年龄，这些建筑通常需要维护工作来确保它们的长期效率。"
 RICE_khuzestan_repair_shushtar_hydraulics_effect_tooltip_1:1 "[GetTitleByKey('c_tustar').GetNameNoTier]将获得持续#V 10年#!的[county_modifier|E]，奖励取决于完成的类型"
 RICE_khuzestan_repair_shushtar_hydraulics_effect_tooltip_2:1 "你可以选择进行#bold 维护#!#weak （成本为：@gold_icon![EmptyScope.ScriptValue('RICE_khuzestan_shushtar_repair_cost_value')|0]）#!或者选择#bold 整修#!#weak （成本为：@gold_icon![EmptyScope.ScriptValue('RICE_khuzestan_shushtar_renovation_cost_value')|0]）#!。后者成本更高但是奖励更好"
 RICE_khuzestan_repair_shushtar_hydraulics_confirm:0 "召集工匠！"
 RICE_khuzestan_repair_shushtar_hydraulics_context_tooltip:0 "#emphasis 历史背景：#!舒什塔尔水利系统历史可追溯到大流士大帝所在的公元前五世纪，不过萨珊王朝崩溃后逐渐衰落，但是目前研究表明这些水力系统的维护和扩展在伊斯兰时期仍然存在。舒什塔尔最著名的建筑包括#italic 凯撒桥#!（凯撒桥由萨珊王朝建造，使用罗马战俘作为劳动力，于公元3世纪建，伊斯兰时期多次修缮，一直使用到19世纪末），以及#italic 加尔格运河#!，它至今仍在供水。"
 RICE_khuzestan_pick_shushtar_hydraulics:0 "选择要维护或修整的东西"
 RICE_khuzestan_shushtar_dams_option:0 "#Bold #V 河堤#!#!\n$RICE_khuzestan_shushtar_dams_option_desc$"
 RICE_khuzestan_shushtar_dams_option_tooltip:0 "$EFFECT_LIST_BULLET$维护修正：[GetModifier('RICE_khuzestan_shushtar_dams_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$整修修正：[GetModifier('RICE_khuzestan_shushtar_dams_renovation').GetNameWithTooltip]"
 RICE_khuzestan_shushtar_canals_option:0 "#Bold #V 运河#!#!\n$RICE_khuzestan_shushtar_canals_option_desc$"
 RICE_khuzestan_shushtar_canals_option_tooltip:0 "$EFFECT_LIST_BULLET$维护修正：[GetModifier('RICE_khuzestan_shushtar_canals_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$整修修正：[GetModifier('RICE_khuzestan_shushtar_canals_renovation').GetNameWithTooltip]"
 RICE_khuzestan_shushtar_bridges_option:0 "#Bold #V 桥梁#!#!\n$RICE_khuzestan_shushtar_bridges_option_desc$"
 RICE_khuzestan_shushtar_bridges_option_tooltip:0 "$EFFECT_LIST_BULLET$维护修正：[GetModifier('RICE_khuzestan_shushtar_bridges_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$整修修正：[GetModifier('RICE_khuzestan_shushtar_bridges_renovation').GetNameWithTooltip]"
 RICE_khuzestan_shushtar_watermills_option:0 "#Bold #V 水磨#!#!\n$RICE_khuzestan_shushtar_watermills_option_desc$"
 RICE_khuzestan_shushtar_watermills_option_tooltip:0 "$EFFECT_LIST_BULLET$维护修正：[GetModifier('RICE_khuzestan_shushtar_watermills_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$整修修正：[GetModifier('RICE_khuzestan_shushtar_watermills_renovation').GetNameWithTooltip]"
 RICE_khuzestan_khuzi_status_decision:0 "提升胡齐社区"
 RICE_khuzestan_khuzi_status_decision_tooltip:0 "在胡齐斯坦建立一个胡齐人的[kingdom|E]"
 RICE_khuzestan_khuzi_status_decision_desc:0 "长期以来，我们[ROOT.Char.GetCulture.GetCollectiveNoun]一直被波斯和阿拉伯邻国践踏和蔑视。作为[ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetTitleAsNameNoTooltip]，我有能力为我们的人民建立一个新的王国，恢复我们的荣誉和尊严。"
 RICE_khuzestan_khuzi_status_decision_effect_tooltip_1:1 "$innovation_RICE_khuzi$[innovation|E]将#bold 永久#!从[THIS.Char.GetCulture.GetName]以及衍生&融合[cultures|E]中移除"
 RICE_khuzestan_khuzi_status_decision_effect_tooltip_2:1 "$tradition_RICE_khuzi_name$[tradition|E]将根据你的选择来#bold 升级#!，从而为[THIS.Char.GetCulture.GetCollectiveNoun]和衍生&融合[cultures|E]提供更好的奖励"
 RICE_khuzestan_khuzi_status_decision_confirm:0 "我们人民迎来新的时代！"
 RICE_khuzestan_khuzi_status_decision_context_tooltip:0 "#emphasis 历史背景：#!中世纪早期的伊斯兰资料来源提到了所谓的胡齐人，他们说的语言被现代学者推论为古代伊拉姆语的残余。不过“胡齐”一词是当地贵族所说的，但这可能是他们从仆人（如奶妈、浴室侍者等）那里学来的。胡齐人被视为地位低下，例如#italic “yā Xuz̄ı”（嘿你这个胡齐）#!。据10世纪阿拉伯地理学家穆卡达西文献，这是该地区常见的侮辱俚语。随着胡齐人融入阿拉伯或伊朗，胡齐人的身份和语言可能会消失。"
 RICE_khuzestan_khuzi_status_decision_modifier_bonus_tt:1 "你将能够选择以下三个修正之一以应用于 在[GetTitleByKey('d_khuzestan').GetNameNoTier]的每个[county|E]，并持续#V 50年#!\n$EFFECT_LIST_BULLET$[GetModifier('RICE_khuzestan_restored_elymais').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('RICE_khuzestan_restored_khuzi').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('RICE_khuzestan_restored_gulf').GetNameWithTooltip|L]"
 RICE_khuzestan_parwanaya_festival:0 "庆祝圣五节"
 RICE_khuzestan_parwanaya_festival_tooltip:0 "庆祝圣五节，这是曼达教的重要宗教节日"
 RICE_khuzestan_parwanaya_festival_desc:0 "对于许多[ROOT.Char.GetFaith.GetAdherentNamePlural]来说，#italic 圣五节（Parwanaya）#!（#italic 五节（Panja波斯语为五）#!）是一年中最重要的场合之一。这是我们庆祝[ROOT.Char.GetFaith.HighGodName]创造天使和宇宙的五天。"
 RICE_khuzestan_parwanaya_festival_effect_tooltip_1:1 "你将获得[piety|E]、[prestige|E]和[GetModifier('RICE_khuzestan_celebrated_parwanaya').GetNameWithTooltip][character_modifiers|E]"
 RICE_khuzestan_parwanaya_festival_confirm:0 "让我们做好准备！"
 RICE_khuzestan_parwanaya_festival_context_tooltip:0 "#emphasis 历史背景：#!#italic 圣五节（Parwanaya）#!（#italic 词源来自波斯语panja，意为五 #!）是曼达族宗教团体的主要节日之一。它在穗谷（曼达历节日，曼达历没有闰年，它目前对应公历中的二月/三月）的第8个月之后获得额外五天庆祝，被认为是一年中最快乐和最幸运的时期之一。"
 RICE_khuzestan_gnostic_baptism_rite:0 "接受洗礼仪式"
 RICE_khuzestan_gnostic_baptism_rite_tooltip:0 "通过洗礼仪式进行净化"
 RICE_khuzestan_gnostic_baptism_rite_desc:0 "[ROOT.Char.GetFaith.GetAdherentNamePlural]信洗礼仪式是作为净化我们的重要方式。当然我们应该按照[ROOT.Char.GetFaith.ReligiousText]的指示定期进行这些仪式。"
 RICE_khuzestan_gnostic_baptism_rite_effect_tooltip_1:1 "你获得的[piety|E]取决于你的[piety_level|E]"
 RICE_khuzestan_gnostic_baptism_rite_confirm:0 "为洗礼仪式寻找合适的河流。"
 RICE_khuzestan_gnostic_baptism_rite_context_tooltip:0 "#emphasis 历史背景：#!基督教洗礼是一种通常只进行一次的入会仪式，与此相反曼达教因为崇敬施洗约翰，所以洗礼仪式#italic 马斯布塔#!（masbuta）是作为一种净化仪式定期进行的。它也通常是其他各种庆祝活动和仪式的一部分。塞思派是一个诺斯替教派，可能与曼达教有关系，据称他们有自己类似的仪式，称为五封印。"
 khuzestan.0001.t:0 "xxxxx"
 khuzestan.0001.desc:0 "xxxxx"
 khuzestan.0001.a:0 "xxxxx"
 khuzestan.0002.t:0 "[gnostic_faith.GetAdjectiveNoTooltip]洗礼仪式"
 khuzestan.0002.desc:0 "所有善良的[gnostic_faith.GetAdherentNamePlural]都需要定期进行洗礼仪式，而今天轮到了我。\n\n现在我身着圣袍，和许多聚集在一起接受洗礼的信徒在仪式选择的河流旁，根据[gnostic_faith.ReligiousText]，所谓的活水是必需的。\n\n[gnostic_faith.PriestNeuterPlural]指引我们进入水中，在那里我们经历了三重完全浸没——我的第一反应是它很冷！ \n\n在我回到陆地后，一个[gnostic_faith.PriestNeuter]在我的额头上涂上圣芝麻油，然后我被要求喝三遍水和圣餐面包。最后我还在颤抖时，[gnostic_faith.PriestNeuter]在我们握手之前取下了一个神圣的戒指并将它放在我的额头上。"
 khuzestan.0002.a:0 "我感到精神上得到了净化——我感觉到焕发第二春！"
 khuzestan.0003.t:0 "xxxxx"
 khuzestan.0003.desc:0 "xxxxx"
 khuzestan.0003.a:0 "xxxxx"
 khuzestan.0004.t:0 "xxxxx"
 khuzestan.0004.desc:0 "xxxxx"
 khuzestan.0004.a:0 "xxxxx"
 khuzestan.0005.t:0 "[khuzi_hero.GetCulture.GetNameNoTooltip]重生"
 khuzestan.0005.desc:0 "我们[GetGeographicalRegion('RICE_khuzestan_region').GetName]的古老原始居民，在阿拉伯、波斯、希腊等其他国家的枷锁下遭受了巨大的痛苦。我们中的许多人在社会上都扮演过屈辱的角色。他们甚至用我们的名字[khuzi_hero.GetCulture.GetName]作为侮辱！\n\n但时代在变。在我的领导下，我将该地区统一为一个新王国，[khuzi_hero.GetPrimaryTitle.GetName]。我们不再受压迫！我已经敦促我的同胞[khuzi.GetCollectiveNounNoTooltip]不要拒绝我们的旧方式，也不要拒绝我们独特的、古老的语言——外国人认为这些语言难以理解，但如今我们已经强大起来，值得尊重。\n \n现在，由我来决定[khuzi_hero.GetPrimaryTitle.GetNameNoTierNoTooltip]在未来几年的发展方向。"
 khuzestan.0005.a:0 "回顾我们辉煌的过去，那时候我们还是埃利迈斯人！"
 khuzestan.0005.b:0 "首先发展我们的社会和文化。"
 khuzestan.0005.c:0 "在波斯湾建立贸易网络。"
 RICE_khuzestan_counties_elymaean_tooltip:0 "所有拥有$innovation_RICE_khuzi$[innovation|E]的[cultures|E]永久失去，且$tradition_RICE_khuzi_name$[tradition|E]让拥有它的[cultures|E]获得军事加成。"
 RICE_khuzestan_counties_community_tooltip:0 "所有拥有$innovation_RICE_khuzi$[innovation|E]的[cultures|E]永久失去，且$tradition_RICE_khuzi_name$[tradition|E]让拥有它的[cultures|E]获得外交加成。"
 RICE_khuzestan_counties_traders_tooltip:0 "所有拥有$innovation_RICE_khuzi$[innovation|E]的[cultures|E]永久失去，且$tradition_RICE_khuzi_name$[tradition|E]让拥有它的[cultures|E]获得经济加成。"
 khuzestan.0006.t:0 "$khuzestan.0005.t$"
 khuzestan.0006.desc:0 "在任何人的记忆中，[GetGeographicalRegion('RICE_khuzestan_region').GetName]的古老原始居民在阿拉伯、伊朗、希腊和其他国家等其他势力遭受了巨大的苦难。许多[khuzi.GetCollectiveNoun]在社会上第一印象是扮演奴籍，他们的名字[khuzi.GetNameNoTooltip]曾被其他民族用作侮辱。\n\n但时代在变。[khuzi_hero.GetTitledFirstName]将该地区统一为一个新王国，并让[khuzi_hero.GetHerHis]同胞[khuzi.GetCollectiveNounNoTooltip]接受新方式\n"
 khuzestan.0006.desc.elymais:0 "[khuzi_hero.GetFirstNameNoTooltip]试图效仿古代[khuzi.GetCollectiveNounNoTooltip]的埃兰迈斯文化。埃兰迈斯王国以精湛的射箭技巧以及其独立文化而闻名，[khuzi_hero.GetFirstNameNoTooltip]希望这个辉煌的过去能够重现。"
 khuzestan.0006.desc.community:0 "[khuzi_hero.GetFirstNameNoTooltip]认为[khuzi.GetCollectiveNounNoTooltip]重要的是专注于发展文化和社会。通过在艺术、宫廷生活和政治方面获得声誉，这样其他人将学会欣赏他们。"
 khuzestan.0006.desc.traders:0 "[khuzi_hero.GetFirstNameNoTooltip]利用胡齐斯坦传统的农业和商业繁荣将[khuzi.GetCollectiveNounNoTooltip]融入波斯湾的贸易网络​​，并为[khuzi_hero.GetHerHis]人民开创一个新时代。"
 khuzestan.0006.a:0 "看来已经繁荣昌盛的他们值得我们尊敬！"
