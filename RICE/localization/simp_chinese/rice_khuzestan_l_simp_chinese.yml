 khuzestan.0010.t:0 "维护水利系统"
 khuzestan.0010.desc:0 "[tustar.GetNameNoTier]的水利系统已经存在了几个世纪，至今仍为该地带来财富和繁荣。然而像我这样的统治者需要定期资助工程以维护这个复杂的建筑网络。这样我们都可以继续长期受益。\n\n"
 khuzestan.0010.desc.dams:0 "无论如何，我决定对#bold 水坝#!进行维护工程"
 khuzestan.0010.desc.canals:0 "无论如何，我决定对#bold 水坝#!进行整修工程"
 khuzestan.0010.desc.bridges:0 "无论如何，我决定对#bold 大桥#!进行维护工程"
 khuzestan.0010.desc.watermills:0 "无论如何，我决定对#bold 大桥#!进行整修工程"
 khuzestan.0010.desc.conclusion:0 "\n\n我的工匠现在问我是否应该进行维护或整修，维护将加强我们已有的设施，而整修将使建筑结构扩展，以增加系统的活力。"
 khuzestan.0010.a:0 "对这些建筑进行维护工作"
 khuzestan.0010.b:0 "进行整修以扩大水利网络"
 khuzestan.0011.t:0 "展示提拉兹"
 khuzestan.0011.desc:0 "通过[actor.GetTitleAsNameNoTooltip]的权力，我决定在#italic 赐服仪式#!授予[recipient.GetTitledFirstName]一匹#italic 提拉兹#!织品。这是一匹高质量#italic 提拉兹#!，这种#italic 提拉兹#!只有在定期的官方场合才会被授予。"
 khuzestan.0011.desc.local:0 "我确信[recipient.GetFirstNameNoTooltip]感到受宠若惊！\n\n"
 khuzestan.0011.desc.foreign:0 "虽然[recipient.GetSheHe]不能亲自到场领取，但我相信[recipient.GetSheHe]收到这份礼物一定很高兴！\n\n"
 khuzestan.0011.desc.early:0 "赠予某人美丽的#italic 提拉兹#!纺织品是一种崇高的荣誉，因为有能力给予像这样的高质量#italic 提拉兹#!，只有像我这样强大的[actor.GetTitleAsNameNoTooltip]才能做到。"
 khuzestan.0011.desc.middle:0 "虽然授予#italic 提拉兹#!不再是哈里发或强大统治者的特权，它仍然是像我这样强大的[actor.GetTitleAsNameNoTooltip]的典型做法，因此获得高质量的#italic 提拉兹#!仍然是一种莫大的荣耀！"
 khuzestan.0011.desc.late:0 "在过去，只有哈里发或非常强大的统治者才能对某人授予#italic 提拉兹#!。如今贵族阶层的人互相赠送是很常见的，不过能从我这样强大的[actor.GetTitleAsNameNoTooltip]获得#italic 提拉兹#!也是莫大的荣幸。"
 khuzestan.0011.a:0 "我希望[recipient.GetFirstNameNoTooltip]能表达感激！"
 khuzestan.0012.t:0 "$khuzestan.0011.t$"
 khuzestan.0012.desc:0 "[actor.GetTitleAsNameNoTooltip]行使[actor.GetHerHis]权力，[actor.GetTitledFirstName]决定在#italic 赐服仪式#!上授予我一匹#italic 提拉兹#!织品。这是一个高质量#italic 提拉兹#!，超越了其他#italic 提拉兹#!，只有在盛大官方场合才可以见到。"
 khuzestan.0012.desc.local:0 "[actor.GetSheHe|U]以这种方式表达[actor.GetHerHis]的青睐，我深感荣幸！\n\n"
 khuzestan.0012.desc.foreign:0 "虽然不能亲临现场领取，但能得到这样的礼物还是很开心的！毕竟这个#italic 提拉兹#!质量远超#italic 提拉兹#!代表的象征！只有盛大的场合才可以见到。\n\n"
 khuzestan.0012.desc.early:0 "赠予某人美丽的#italic 提拉兹#!织品是一种崇高的荣誉，只有像[actor.GetFirstNameNoTooltip]这样强大的[actor.GetTitleAsNameNoTooltip]才能赐予这种高品质的#italic 提拉兹#!。"
 khuzestan.0012.desc.middle:0 "虽然授予#italic 提拉兹#!不再是哈里发或强大统治者的特权，它仍然是像[actor.GetTitleAsNameNoTooltip]（如[actor.GetFirstNameNoTooltip]）的典型做法，因此获得高质量的#italic 提拉兹#!仍然是一种莫大的荣耀！"
 khuzestan.0012.desc.late:0 "在过去，只有哈里发或非常强大的统治者才能对某人授予#italic 提拉兹#!。如今贵族阶层的人互相赠送是很常见的，不过要是收到来自[actor.GetFirstNameNoTooltip]强大的[actor.GetTitleAsNameNoTooltip]的#italic 提拉兹#!是莫大的荣幸。"
 khuzestan.0012.a:0 "我为此感到荣幸"
 khuzestan.0013.t:0 "[mandaean.GetFaith.GetAdjectiveNoTooltip]廷臣？"
 khuzestan.0013.desc:0 "南美索不达米亚和胡齐斯坦是[mandaean.GetFaith.GetAdherentNamePlural]的中心地带，尽管几个世纪以来他们都面临着迫害，但诺斯替教派自古以来就在这些土地上生生不息。今天一位名叫[mandaean.GetFirstName]来到我的宫廷，打算向我提供[mandaean.GetHerHis]的智慧\n\n[mandaean.GetFaith.GetAdherentNamePluralNoTooltip]的定居点以抄写经典和文学而闻名，由于他们重视记录和保留他们的宗教经典。或许我通过[mandaean.GetFirstNameNoTooltip]与[mandaean.GetFaith.GetAdjectiveNoTooltip]群体建立互惠互利的联系是明智的。"
 khuzestan.0013.a:0 "[mandaean.GetSheHe|U]将在这里受到欢迎！"
 khuzestan.0013.b:0 "我不需要[mandaean.GetHerHis]服务"
