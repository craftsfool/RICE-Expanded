 game_concept_tomb_of_daniel:0 "但以理之墓"
 game_concept_tomb_of_daniel_desc:0 "有几个地方声称是《旧约》中人物但以理的逝去之地（在游戏中$c_tustar$[county|E]的舒什是最令人信服的但以理逝去之地）\n\n因此$c_tustar$附近的犹太教、基督教和穆斯林角色可以前往[GetActivityType( 'activity_RICE_khuzestan_tomb_of_daniel_pilgrimage' ).GetName]，除了常规的[local_pilgrimage|E]奖励还可以获得正面的[GetModifier('RICE_khuzestan_daniel_pilgrimage_done').GetNameWithTooltip][character_modifier|E]\n\n$c_tustar$[ruler|E]也可以获得$RICE_khuzestan_rebury_daniel$[decision|E]，采取这个[decision|E]将增加朝圣提供的[piety|E]奖励，以及增加可朝圣的地理范围。"
 game_concept_khila_ceremony:0 "赐服仪式"
 game_concept_khila:0 "赐服"
 game_concept_tiraz:0 "提拉兹"
 game_concept_tiraz_desc:0 "提拉兹是伊斯兰社会珍视的一种刺绣布料，拥有独特的政治和文化重要性\n\n伊斯兰教[rulers|E]可以使用一个[character_interaction|E]，将$RICE_khuzestan_gift_tiraz_robes$送给其他穆斯林，这将给予双方各种加成。这个[interaction|E]的一个特点是，最初只有哈里发（即伊斯兰教的[heads_of_faith|E]）、[emperors|E]和[kings|E]可以使用；一旦他其文化处于中世纪早期[era|E]，[duke|E]亦可使用，而[counts|E]则处于中世纪中期[era|E]才行。\n\n持有$building_type_RICE_tiraz_factories_01$可以降低[interaction|E]成本"
