 RICE_khwarezm_establish_cult_center:0 "建立当地的祆教朝拜中心"
 RICE_khwarezm_establish_cult_center_tooltip:0 "我们的[capital|E]成为一个[zoroastrian_cult_centers|E]"
 RICE_khwarezm_establish_cult_center_desc:0 "有许多值得崇拜的[yazatas|E]，但我认为[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]中有一个应该受到更追捧的供奉对象。因此我希望将这个地区转变为特定[yazata|E]的[zoroastrian_cult_center_short|E]。"
 RICE_khwarezm_establish_cult_center_effect_tooltip_1:1 "你将选择一个[yazata|E]作为新的[zoroastrian_cult_center_short|E]"
 RICE_khwarezm_establish_cult_center_effect_tooltip_2:1 "在[THIS.Char.GetCapitalLocation.GetTitle.GetNameNoTier]获得一个#P 正面的#![county_modifier|E]"
 RICE_khwarezm_establish_cult_center_effect_tooltip_3:1 "[THIS.Char.GetFaith.GetReligion.GetAdjective][rulers|E]的[zoroastrian_cult_center_short|E]采取膜拜[yazatas|E][decision|E]时将获得额外的奖励（前提是[zoroastrian_cult_center_short|E]的[yazata|E]是相对应的[yazata|E][doctrine|E]）"
 RICE_khwarezm_establish_cult_center_confirm:0 "建立朝拜中心"
 RICE_khwarezm_establish_cult_center_context_tooltip:0 "#emphasis 历史背景：#!在波斯世界的边缘地区，如在粟特和花剌子模，它们祆教多样性比在萨珊王朝的中心地带更为分散，通常来说是围绕着特定的城邦和小王国（类似古希腊多神教城邦）。例如娜娜是粟特主要城市班吉肯特的守护神，在某些方面甚至比祆教主神阿胡拉·玛兹达更为显赫。与更为集中、有组织的萨珊王朝正统相比，这些小宗教无法在阿拉伯征服带来的大规模政治和文化动荡中幸存下来。"
