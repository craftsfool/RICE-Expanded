 khwarezm.0020.t:0 "亚扎塔朝拜"
 khwarezm.0020.desc.intro:0 "我已到达[ROOT.Char.GetFaith.HouseOfWorship]，参加[ROOT.Char.GetFaith.GetAdjective]的朝拜仪式。\n\n今天我祈祷向……"
 khwarezm.0020.desc.anahita:0 "亚美尼亚神话中象征水与繁荣的亚扎塔，安娜希塔"
 khwarezm.0020.desc.bahram:0 "象征胜利的亚扎塔，巴赫拉姆"
 khwarezm.0020.desc.mah:0 "象征月亮的亚扎塔，马赫"
 khwarezm.0020.desc.mithra:0 "象征太阳、光明、真理与荣耀的亚扎塔，密特拉"
 khwarezm.0020.desc.nana:0 "象征战争与王权的亚扎塔，娜娜"
 khwarezm.0020.desc.rashnu:0 "象征审判的亚扎塔，拉什努"
 khwarezm.0020.desc.sraosha:0 "象征忍耐服从的亚扎塔，斯拉欧加"
 khwarezm.0020.desc.tir:0 "司雨之神亚扎塔，蒂什塔尔"
 khwarezm.0020.desc.siyavash:0 "象征死亡与重生的亚扎塔，西亚瓦什"
 khwarezm.0020.desc.wakhsh:0 "象征乌浒河的亚扎塔，镬沙"
 khwarezm.0020.desc.weshparkar:0 "风之亚扎塔，维施帕卡"
 khwarezm.0020.desc.astghik:0 "亚美尼亚神话中象征美与爱的亚扎塔，阿丝忒希克"
 khwarezm.0020.desc.barshamin:0 "象征天空的亚扎塔，巴沙明"
 khwarezm.0020.desc.tork:0 "象征力量与勇气的亚扎塔，托克"
 khwarezm.0020.desc.vahagn:0 "亚美尼亚神话中象征水与繁荣的亚扎塔，瓦哈根"
 khwarezm.0020.desc.dali:0 "格鲁吉亚神话中狩猎与黎明的亚扎塔，达利"
 khwarezm.0020.desc.gaim:0 "密特拉侍者亚扎塔，盖姆"
 khwarezm.0020.desc.gatsi:0 "金之亚扎塔与密特拉侍者，加齐"
 khwarezm.0020.desc.kopala:0 "象征辟邪与闪电的亚扎塔，科帕拉"
 khwarezm.0020.desc.zaden:0 "象征生育和多产的亚扎塔，扎登"
 khwarezm.0020.desc.conclusion:0 "\n\n仪式结束后，我感谢[ROOT.Char.GetFaith.PriestNeuterPlural]的辛勤付出，因为他们确保了一切顺利进行，现在我深受鼓舞，希望我对亚扎塔的崇拜会伴随着善念、善言和善行，希望将被证明是有效的。"
 khwarezm.0020.a:0 "赞美[ROOT.Char.GetFaith.HighGodName]和诸亚扎塔"
 khwarezm.0020.b.sassanian:0 "我确信这是一个比大多数都盛大的朝拜仪式！"
 khwarezm.0020.b.cult:0 "在这个神圣的地方朝拜这个亚扎塔是极好的"
 khwarezm.0021.t:0 "亚扎塔朝拜中心"
 khwarezm.0021.desc.intro:0 "长期以来，[capital.GetNameNoTier]一直是一些虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]的家，包括我自己，他们特别致力于"
 khwarezm.0021.desc.anahita:0 "亚美尼亚神话中象征水与繁荣的亚扎塔，安娜希塔"
 khwarezm.0021.desc.bahram:0 "象征胜利的亚扎塔，巴赫拉姆"
 khwarezm.0021.desc.mah:0 "象征月亮的亚扎塔，马赫"
 khwarezm.0021.desc.mithra:0 "象征太阳、光明、真理与荣耀的亚扎塔，密特拉"
 khwarezm.0021.desc.nana:0 "象征战争与王权的亚扎塔，娜娜"
 khwarezm.0021.desc.rashnu:0 "象征审判的亚扎塔，拉什努"
 khwarezm.0021.desc.sraosha:0 "象征忍耐服从的亚扎塔，斯拉欧加"
 khwarezm.0021.desc.tir:0 "司雨之神亚扎塔，蒂什塔尔"
 khwarezm.0021.desc.siyavash:0 "象征死亡与重生的亚扎塔，西亚瓦什"
 khwarezm.0021.desc.wakhsh:0 "象征乌浒河的亚扎塔，镬沙"
 khwarezm.0021.desc.weshparkar:0 "风之亚扎塔，维施帕卡"
 khwarezm.0021.desc.astghik:0 "亚美尼亚神话中象征美与爱的亚扎塔，阿丝忒希克"
 khwarezm.0021.desc.barshamin:0 "象征天空的亚扎塔，巴沙明"
 khwarezm.0021.desc.tork:0 "象征力量与勇气的亚扎塔，托克"
 khwarezm.0021.desc.vahagn:0 "亚美尼亚神话中象征水与繁荣的亚扎塔，瓦哈根"
 khwarezm.0021.desc.dali:0 "格鲁吉亚神话中狩猎与黎明的亚扎塔，达利"
 khwarezm.0021.desc.gaim:0 "密特拉侍者亚扎塔，盖姆"
 khwarezm.0021.desc.gatsi:0 "金之亚扎塔与密特拉侍者，加齐"
 khwarezm.0021.desc.kopala:0 "象征辟邪与闪电的亚扎塔，科帕拉"
 khwarezm.0021.desc.zaden:0 "象征生育和多产的亚扎塔，扎登"
 khwarezm.0021.desc.conclusion:0 "\n\n我已经决定，[capital.GetNameNoTierNoTooltip]应该被改造成亚扎塔的主要膜拜中心。把当地的资源用于建造宗教建筑！引进[ROOT.Char.Custom('DefaultPriestTitlePlural')]和工匠！并且我们要尽力确保[capital.GetNameNoTierNoTooltip]成为[ROOT.Char.GetFaith.GetName]的一个堡垒，不能让异端来犯。\n\n这样一来，[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]远近的人都可以到这里来崇拜这位神祇，祂是如此的伟大！"
 khwarezm.0021.a:0 "伟大的圣所为了伟大的亚扎塔！"
 khwarezm.0022.t:0 "摧毁朝拜中心"
 khwarezm.0022.desc.intro:0 "\n\n在我的领土内有许多地方是[zoroastrianism.GetAdjective]异端朝拜中心，那些相信[zoroastrianism.GetNameNoTooltip]的人前往和朝拜他们所谓的亚扎塔，他们不过是伪神！"
 khwarezm.0022.desc.zoroastrian:0 "虽然这些异端声称他们崇拜 亚扎塔的方式没有任何不妥，而且与[ROOT.Char.GetFaith.GetAdjective]宗教仪式相似，但这些都是谎言。异端做法违背了真正的教义，迷惑了易受骗的[ROOT.Char.GetFaith.GetAdherentNamePlural]！鼓励了不道德和玷污思想！是对我们公正统治的反叛！！"
 khwarezm.0022.desc.non_zoroastrian:0 "诚然这些异端[zoroastrianism.GetAdjective]的做法是对[ROOT.Char.GetFaith.GetName][ROOT.Char.GetFaith.ReligiousText]中教导神圣真理的玷污。这种异端场所与[ROOT.Char.GetFaith.HighGodName]的真正教义相抵触，鼓励了不道德和玷污思想，是对我们公正统治的反叛。"
 khwarezm.0022.desc.conclusion:0 "\n\n因此我已经下令，在我的领土内异端膜拜中心都要摧毁，任何异端建筑都将被拆除，财富也将充公。从现在开始当地人将被禁止从事非法的、非正统的宗教活动！"
 khwarezm.0022.a:0 "真相终将胜出！"
 khwarezm.0023.t:0 "$khwarezm.0022.t$"
 khwarezm.0023.desc.intro:0 "在[RICE_yazata_cult_destroyer.GetTitledFirstNamePossessive]领土的许多地方都有[zoroastrianism.GetAdjective]崇拜中心，那些相信[zoroastrianism.GetNameNoTooltip]的人都来膜拜和向他们所谓的亚扎塔祈祷。然而就[RICE_yazata_cult_destroyer.GetFirstNameNoTooltip]而言，这些亚扎塔不过是伪神。"
 khwarezm.0023.desc.zoroastrian:0 "\n\n尽管[RICE_yazata_cult_destroyer.GetFirstNameNoTooltip]也遵循[zoroastrianism.GetNameNoTooltip]的一个分支，但[RICE_yazata_cult_destroyer.GetSheHe]对[RICE_yazata_cult_destroyer.GetSheHe]视为异端的做法没有宽容。在[RICE_yazata_cult_destroyer.GetHerHis]看来，这些做法违背了真正的教义，迷惑了容易受骗的[ROOT.Char.GetFaith.GetAdherentNamePlural]，鼓励了不道德和玷污思想，是对[RICE_yazata_cult_destroyer.GetHerHis]正义统治的反叛。"
 khwarezm.0023.desc.non_zoroastrian:0 "\n\n作为一个[RICE_yazata_cult_destroyer.GetFaith.GetAdherentName]，[RICE_yazata_cult_destroyer.GetFirstNameNoTooltip]认为[RICE_yazata_cult_destroyer.GetHerHis]有责任反对任何在[RICE_yazata_cult_destroyer.GetHerHis]看来与[RICE_yazata_cult_destroyer.GetFaith.HighGodName]的真正教义相抵触，这鼓励了不道德和玷污思想，是对[RICE_yazata_cult_destroyer.GetHerHis]统治的反叛。"
 khwarezm.0023.desc.conclusion:0 "\n\n因此[RICE_yazata_cult_destroyer.GetFirstNameNoTooltip]已经下令将[RICE_yazata_cult_destroyer.GetHerHis]领土内的异端中心摧毁。任何异端建筑都将被拆除，财富也将充公还禁止当地人从事非法的、非正统的宗教活动。"
 khwarezm.0023.a.cult:0 "黑暗的一天……"
 khwarezm.0023.a.not_cult:0 "听起来很有意思……"
