 khwarezm.0050.t:0 "迁移乌浒河的定居点"
 khwarezm.0050.desc:0 "乌浒河两岸一直都很容易发生洪水，这就是为什么它被当地人称为“狂河”。\n\n最近[county.GetNameNoTier]的部分地区的洪水泛滥严重。居民们被迫搬迁到安全地带，我在那里的官员恳求我为当地提供一些资金，以协助处理这种情况，以免变得混乱。"
 khwarezm.0050.a:0 "他们将获得所需的资金！"
 khwarezm.0050.b:0 "贱民死活关我什么事？"
 khwarezm.0051.t:0 "乌浒河祷告"
 khwarezm.0051.desc:0 "乌浒河两岸一直都很容易发生洪水，对当地人的生活产生负面影响，这就是为什么它被当地人称为“狂河”，\n\n因此当地[ROOT.Char.GetFaith.GetAdherentNamePlural]有一个传统，就是每隔一段时间就会在河边祈祷，请求[ROOT.Char.GetFaith.PantheonTerm]确保今年河水畅通不泛滥。然而虽然有些[ROOT.Char.Custom('DefaultPriestTitlePlural')]支持这些做法，但其他[ROOT.Char.Custom('DefaultPriestTitlePlural')]却斥责这些仪式与[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]教义相违背。\n\n现在我刚刚被一个著名的[ROOT.Char.Custom('DefaultPriestTitle')]邀请参加这些仪式之一。这可能是一个获得当地人好感的好机会，但另一方面，其他[ROOT.Char.Custom('DefaultPriestTitlePlural')]可能对我的参与而恼怒。"
 khwarezm.0051.a:0 "我没有兴趣参加这个仪式"
 khwarezm.0051.b:0 "我们需要祈祷以确保河流畅通无阻"
 khwarezm.0052.t:0 "宏伟的断壁残垣"
 khwarezm.0052.desc:0 "几个世纪以来，在[GetGeographicalRegion('RICE_lower_oxus_region').GetName]的大部分地区都建造了#italic 风中堡垒#!。作为在乌浒河这一段拥有领土的人，我对这些堡垒并不陌生，我甚至偶尔会翻修一些风中堡垒以加强领土防御。\n\n现在我有机会到乌浒河沿岸的乡村寻访，在途中遇到了许多这样古老的#italic 风中堡垒#!遗迹。虽然这些废墟风化严重，无法修复到可使用的状态，但人们仍然可以想象它们在过去的日子里看起来是多么的宏伟!"
 khwarezm.0052.a:0 "确实是壮观的景象。"
 khwarezm.0053.t:0 "乌浒河恶臭"
 khwarezm.0053.desc:0 "今天一位著名的旅行者在走过我领土的大部分地区后，在我的宫廷里停留。我好奇地问他对他所看到的地方有什么看法。\n\n这位旅行者首先称赞了我的领土上工匠们制作的艺术品的质量以及当地人对[ROOT.Char.GetFaith.HighGodName]的虔诚。\n\n随后他话锋一转说有一个大问题，特别是在[GetGeographicalRegion('RICE_lower_oxus_region').GetName]地区附近的定居点。\n\n他告诉我：“我不得不说实话，那些城镇充满了味道！恶臭让人难以忍受！我知道这不是谁的错，因为这是乌浒河不断泛滥造成的，但我不知道人们是如何忍受这种情况的！”"
 khwarezm.0053.a:0 "我也无能为力。这也是我为什么在宫殿里的原因！"
 khwarezm.0053.b:0 "我们尽力了，但乌浒河像女人一样变幻莫测"
 khwarezm.0054.t:0 "阿夫里格王朝"
 khwarezm.0054.desc:0 "据传说花剌子模沿着[GetGeographicalRegion('RICE_lower_oxus_region').GetName]建立了伟大的王国，国王是《列王纪》传说中的凯·霍斯罗的后代，他是更加传奇的阿夫里格之子，比亚历山大大帝的时代早一千年多。\n\n据说在那个时代，阿夫里格王朝把他们的触角延伸到了大草原，征服了那里的许多部落，开发了一片繁荣的土地，并建造了许多伟大的城市和城堡。\n\n当然也有人对这些传说的真实性怀疑。毕竟亚历山大大帝之前的时代是很久很久以前的事了，虽然我们发现很多古代堡垒的遗迹，甚至在我沿着乌浒河的领土上，但谁能说这些城堡最初是不是由其他人建造的？"
 khwarezm.0054.a:0 "我敢肯定这些堡垒是阿夫里格王朝的遗产!"
 khwarezm.0054.b:0 "我十分怀疑故事的真实性"
