 khwarezm.0011.t:0 "“狂河”泛滥"
 khwarezm.0011.desc:0 "几个世纪以来，人们把乌浒河称为“狂河”。虽然这条河对这里的农业至关重要，但它经常改变路线或泛滥成灾，让当地人又敬又畏。\n\n这条河经常冲毁建筑物和淹没整个城市。即使是[kath.GetNameNoTier]的伟大阿尔菲尔城堡废墟，也不能幸免于。我刚刚听说，阿尔菲尔城堡最后的残余已经被河水冲走了。\n\n值得庆幸的是，该城堡多年来或多或少地被遗弃了，所以损失和很小。考虑到河水一直在慢慢侵蚀这些废墟，所以我们知道这一天会到来，但看到这座雄伟的古代城堡以这种方式消失，我还是很难过。"
 khwarezm.0011.a:0 "一切皆有命数……"
 khwarezm.0012.t:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]的风中堡垒 "
 khwarezm.0012.desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]按照传统建造并维持了一种独特的#italic 风中堡垒#!以保护自己，并促进我们家园的发展和贸易。这些风中堡垒是定居点也是堡垒还是农业耕地的混合体，它们对于确保[ROOT.Char.GetPrimaryTitle.GetName]的持续繁荣非常重要。\n\n现在我已经下达了命令，让我领地内的各个#italic 风中堡垒#!通过各种方式进行加固。有些将接受装修和其他维护工作，甚至是扩建。如果是防御较差的地区，可能会建造新的#italica 风中堡垒#!"
 khwarezm.0012.a:0 "从长远来看，它会得到回报。"
 khwarezm.0013.t:0 "xxxxx"
