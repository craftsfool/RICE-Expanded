 khwarezm.0014.t:0 "$khwarezm.0011.t$"
 khwarezm.0014.desc:0 "位于[kath.GetNameNoTier]的阿菲尔城堡多年来一直傲然屹立于乌浒河旁，这座美丽而强大的堡垒可以从几英里远看到，很好的彰显了当地统治者威严和威望。但成也乌浒河，败也乌浒河....\n\n阿菲尔城堡多年来不断受到乌浒河的一次又一次泛滥冲刷，其设施已逐渐破损。虽然城堡的主要结构仍然存在，但部分毁坏严重，当地领主认为不能安全的使用它，内部人员已迁往镇上的其他建筑。\n\n尽管如此，至少堡垒现在仍然屹立不倒。即使它不再被频繁使用，它肯定会继续激励和鼓舞附近的居民。"
 khwarezm.0014.a:0 "这最终会发生并不奇怪。"
