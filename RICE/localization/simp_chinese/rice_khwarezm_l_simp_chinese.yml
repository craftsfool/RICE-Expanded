 building_type_RICE_khwarezm_al_fir_fortress_TFE:0 "阿菲尔城堡"
 building_type_RICE_khwarezm_al_fir_fortress_TFE_desc:0 "据传说，位于$c_kath$的阿菲尔城堡是由阿夫里格王朝建造的。它位于乌浒河旁边。虽然该建筑目前还很坚固，但人们担心，随着时间的推移，乌浒河会逐渐摧毁它。\n\n@warning_icon!#X 这座[building|E]正逐渐被乌浒河摧毁，它很可能在未来成为一片废墟。#!"
 building_RICE_khwarezm_al_fir_fortress_TFE:0 "$building_type_RICE_khwarezm_al_fir_fortress_TFE$"
 building_RICE_khwarezm_al_fir_fortress_TFE_desc:0 "$building_type_RICE_khwarezm_al_fir_fortress_TFE_desc$"
 khwarezm.0014.tooltip:0 "在遥远的未来，城堡废墟可能会被乌浒河冲毁。"
