 RICE_khwarezm_kala_decision:0 "强化在[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]的风中堡垒"
 RICE_khwarezm_kala_decision_tooltip:0 "你[domain|E]内的[counties|E]获得与防御有关的[county_modifiers|E]"
 RICE_khwarezm_kala_decision_desc:0 "我们的土地上遍布着许多#italic 风中堡垒式#!定居点或防御工事，包括古老的和最近建造的，以源自[GetGeographicalRegion('RICE_lower_oxus_region').GetName]的[ROOT.Char.GetCulture.GetName]的方式建造。风中堡垒是我们王国的防御和经济的组成部分，所以我们应该继续维护或扩大现有的风中堡垒，甚至根据需要建造新的风中堡垒。"
 RICE_khwarezm_kala_decision_effect_tooltip_1:1 "该[decision|E]将花费#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_khwarezm_kala_fortress_cost_value')|0]#!（基于你的[counties|E]和它们的[fort_level|E]）"
 RICE_khwarezm_kala_decision_confirm:0 "巩固这些领土！"
 RICE_khwarezm_kala_decision_context_tooltip:0 "#emphasis 历史背景：#!#italic 风中堡垒（kala）#!（也叫#italic qala#!或#italic qalat#!）在各种中东世界中只意味着要塞或城堡。然而在中亚，特别是在花剌子模地区，有一种独特形式的#italic 风中堡垒#!在古代发展起来，这种风中堡垒模糊了定居点、堡垒和农村以及耕地之间的界限。它们类似堡垒式村庄（城镇）的结构促进了丝绸之路花剌子模一带的农业和贸易的发展。"
