 building_type_RICE_khwarezm_al_fir_fortress:0 "阿菲尔堡垒遗址"
 building_type_RICE_khwarezm_al_fir_fortress_desc:0 "根据传说，$c_kath$的阿尔菲尔堡垒是由阿夫里格王朝建造的。它位于乌浒河（阿姆河）附近，当地人将其昵称为“狂河”，因为它经常泛滥或改道。多年来大部分地区都被洪水淹没或者摧毁，许多人担心阿尔菲尔堡垒会成为下一个。即便城堡已成废墟，但它仍然是一个令人印象深刻的堡垒，从几英里外也能看到。\n \n@warning_icon!#X 这个[building|E]正逐渐被乌浒河洪水冲刷，它很可能在未来被摧毁。#!"
 building_RICE_khwarezm_al_fir_fortress:0 "$building_type_RICE_khwarezm_al_fir_fortress$"
 building_RICE_khwarezm_al_fir_fortress_desc:0 "$building_type_RICE_khwarezm_al_fir_fortress_desc$"
 RICE_khwarezm_the_mad_river:0 "狂河"
 RICE_khwarezm_the_mad_river_desc:0 "乌浒河（阿姆河）是中亚流量最大的河流。虽然它肥沃的河岸为周围地区的繁荣做出了贡献，但它也被称为“疯狂之河”，因为它有时是逐渐的，有时是突然的改变其水路并泛滥成灾，特别是沿着[GetGeographicalRegion('RICE_lower_oxus_region').GetName]。当地人经常迁移，而外国人则轻蔑地评论这些原本繁荣的城市因洪水而变得肮脏。"
 RICE_khwarezm_kala_fortresses:0 "强化风中堡垒"
 RICE_oxus_devastation:0 "乌浒河冲毁"
 RICE_oxus_devastation_desc:0 "乌浒河最近改道并淹没了该地的部分地区，扰乱了当地经济并迫使一些定居居民搬到其他地方定居。"
 RICE_oxus_devastation_mitigated:0 "乌浒河破坏减轻"
 RICE_oxus_devastation_mitigated_desc:0 "乌浒河最近改道并淹没了该地区的部分地区。值得庆幸的是，地方尽了最大努力帮助民众，因此对当地经济的影响不大，当地人能够以相对顺利重新安家。"
