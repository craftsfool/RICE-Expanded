 RICE_khwarezm_yazata_cult_center_kopala:0 "科帕拉朝拜中心"
 RICE_khwarezm_yazata_cult_center_kopala_desc:0 "该地被认为是科帕拉的重要朝拜中心，科帕拉是象征闪电和辟邪的[yazata|E]。\n\n#italic 如果该[county|E]的[ruler|E]遵循祆教[faith|E]且有适当的[yazata|E][doctrine|E]，那么可以采取崇拜[yazata|E][decision|E]，采取后将获得与此[yazata|E]相关且效果更佳的[character_modifier|E]。#!"
 RICE_khwarezm_yazata_cult_center_zaden:0 "泽登宗朝拜中心"
 RICE_khwarezm_yazata_cult_center_zaden_desc:0 "该地被认为是泽登的重要朝拜中心，泽登是卡特维利教派的[yazata|E]。\n\n#italic 如果该[county|E]的[ruler|E]遵循祆教[faith|E]且有适当的[yazata|E][doctrine|E]，那么可以采取崇拜[yazata|E][decision|E]，采取后将获得与此[yazata|E]相关且效果更佳的[character_modifier|E]。#!"
 RICE_khwarezm_worship_yazata:0 "朝拜亚扎塔"
 RICE_khwarezm_worship_yazata_tooltip:0 "朝拜[yazatas|E]会获得加成[character_modifier|E]"
 RICE_khwarezm_worship_yazata_desc:0 "虽然我们认为[ROOT.Char.GetFaith.HighGodName]是至高无上的神祇，但对于虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]来说，在仪式中崇拜[yazatas|E]也很重要。事实上，[yazata|E]一词本身的意思是“值得崇拜”。"
 RICE_khwarezm_worship_yazata_effect_tooltip_1:1 "根据你的[faithpossessive|E][yazata|E][doctrine|E]，你将从几个[yazata|E]中选择一个来崇拜。"
 RICE_khwarezm_worship_yazata_effect_tooltip_2:1 "除了[piety|E]奖励外，你还将获得持续#V 10年的#!#P 正面#![character_modifier|E]，具体效果取决于你崇拜的[yazata|E]"
 RICE_khwarezm_worship_yazata_effect_tooltip_3:1 "由于你的[faith|E]拥有$rice_zoroastrian_sassanian_doctrine_name$[doctrine|E]，你也会获得一些[prestige|E]，并且可以支付#V @gold_icon![GetPlayer.MakeScope.ScriptValue('RICE_yazata_pay_bonus_value')|0]#!来获得更好的[modifier|E]"
 RICE_khwarezm_worship_yazata_effect_tooltip_4:1 "如果你的[faith|E]有$rice_zoroastrian_armenian_doctrine_name$[doctrine|E]，你可以获得额外的[prestige|E]和更好效果的[modifier|E]#bold 前提是#!你在[domain|E]拥有对应正确的[zoroastrian_cult_centers|E]。"
 RICE_khwarezm_worship_yazata_effect_tooltip_5:1 "如果你的[faith|E]有$rice_zoroastrian_eastern_doctrine_name$[doctrine|E]，你可以获得额外的[prestige|E]和更好效果的[modifier|E]#bold 前提是#!你在[domain|E]拥有对应正确的[zoroastrian_cult_centers|E]"
 RICE_khwarezm_worship_yazata_confirm:0 "为仪式做准备！"
 RICE_khwarezm_worship_yazata_context_tooltip:0 "#emphasis 历史背景：#!在祆教中，亚扎塔（阿维斯陀语：Yazata）指的是那些是“值得被崇拜者”。在多神论的背景下，他们是神祗；在一神论的背景下，他们是至高神的天使或流露。从历史上看，对这些存在的崇拜不仅出于宗教原因，也有政治意义。"
