 RICE_khwarezm_yazata_cult_center_dali_desc:0 "该地被认为是达利的重要朝拜中心，达利是象征狩猎和黎明的[yazata|E]。\n\n#italic 如果该[county|E]的[ruler|E]遵循祆教[faith|E]且有适当的[yazata|E][doctrine|E]，那么可以采取崇拜[yazata|E][decision|E]，采取后将获得与此[yazata|E]相关且效果更佳的[character_modifier|E]。#!"
