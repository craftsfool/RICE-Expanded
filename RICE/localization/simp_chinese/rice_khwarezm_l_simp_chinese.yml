 RICE_khwarezm_yazata_cult_center_anahita:0 "安娜希塔朝拜中心"
 RICE_khwarezm_yazata_cult_center_anahita_desc:0 "该地区被认为是安娜希塔的重要朝拜中心，安娜希塔是水域和生育力的[yazata|E]。\n \n#italic 如果该[county|E]的[ruler|E]遵循祆教[faith|E]且有适当的[yazata|E][doctrine|E]，那么可以采取崇拜[yazata|E][decision|E]，采取后将获得与此[yazata|E]相关且效果更佳的[character_modifier|E]。#!"
