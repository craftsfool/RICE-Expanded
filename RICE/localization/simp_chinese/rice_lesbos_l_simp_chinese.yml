 RICE_lesbos_fortify_aegean_decision:0 "巩固爱琴领土"
 RICE_lesbos_fortify_aegean_decision_tooltip:0 "[GetGeographicalRegion('RICE_aegean_region').GetName]真是个凶险之地！"
 RICE_lesbos_fortify_aegean_decision_desc:0 "危险的[GetGeographicalRegion('RICE_aegean_region').GetName]海域拥有无数的岛屿、海湾与半岛。即使抛去风暴和船难的风险，海盗和军队[raids|E]也一直是个威胁。为了让这些攻击的后果尽可能温和，我们需要加固在这片区域的领土。"
 RICE_lesbos_fortify_aegean_decision_effect_tooltip_1:0 "这个[decision|E]的[gold_i|E][gold|E]与[prestige_i|E][prestige|E]花费取决于你控制了多少[GetGeographicalRegion('RICE_aegean_region').GetName]的海岸[counties|E]。"
 RICE_lesbos_fortify_aegean_decision_confirm:0 "[GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip]将会安宁！"
 RICE_lesbos_fortify_aegean_decision_context_tooltip:0 "#emphasis 历史背景：#!自古以来，[GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip]就因为适宜且重要的地理位置吸引了众多海盗、海上掠袭和海上军事冲突。例如，尤利乌斯·凯撒在年轻时就被爱琴海的海盗抓过。他戏谑的说赎金偿付清后必然回来报冤仇，而他真就这么做了，那之后抓捕处决了这群海盗。几个世纪以来，这个区域的人一直在探索各种自这些袭击中自保的方法。"
