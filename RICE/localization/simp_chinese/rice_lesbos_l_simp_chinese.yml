 BOOKMARK_RELATION_FORMER_EMPLOYER:0 "(前雇主）"
 innovation_RICE_dragomans:0 "译员"
 innovation_RICE_dragomans_desc:0 "地中海是一个汇有着不同民族、文化和信仰的地区，因此当地官方口译员不仅仅会翻译，还利用自己的知识和名誉来促进商业和政治的发展。"
 RICE_mediterranean_pirate_legitimacy_desc:0 "在采用[decision|E]联系[mediterranean_pirates|E]时减少[legitimacy_i|E][legitimacy|E]的损失，增加[legitimacy_i|E][legitimacy|E]的获得"
 RICE_indian_ocean_pirate_cooldown_desc:0 "采用[decision|E]联系[indian_ocean_pirates|E]的冷却时间从5年降至#V 4#!年"
 RICE_aegean_region:0 "爱琴海"
 RICE_every_coastal_county_in_aegean:0 "每个你拥有的[GetGeographicalRegion('RICE_aegean_region').GetName]沿海[county|E]"
 RICE_every_coastal_county_in_mediterranean:0 "每个你拥有的[GetGeographicalRegion('RICE_mediterranean_region').GetName]沿海[county|E]"
 RICE_mediterranean_pirate_spawn_event_troops:0 "地中海海盗"
 building_type_RICE_lesbos_fortress_of_mytilene_01:0 "米蒂利尼堡垒"
 building_type_RICE_lesbos_fortress_of_mytilene_01_desc:0 "几个世纪以来，莱斯沃斯岛在爱琴海充当了罗马防御的重要要塞。米蒂利尼城的要塞因防御岛屿和周围的爱琴海区域而兴建，同时也保护着穿越此海的商路。"
 building_RICE_lesbos_fortress_of_mytilene_01:0 "$building_type_RICE_lesbos_fortress_of_mytilene_01$"
 building_RICE_lesbos_fortress_of_mytilene_01_desc:0 "$building_type_RICE_lesbos_fortress_of_mytilene_01_desc$"
 building_RICE_lesbos_fortress_of_mytilene_02:0 "$building_type_RICE_lesbos_fortress_of_mytilene_01$"
 building_RICE_lesbos_fortress_of_mytilene_02_desc:0 "$building_type_RICE_lesbos_fortress_of_mytilene_01_desc$"
 building_type_RICE_mediterranean_pirate_den_01:1 "地中海海盗黑湾"
 building_type_RICE_mediterranean_pirate_den_01_desc:1 "武装商人和海盗之间的界限往往是模糊的。简单的掠夺往往不是一个可行的长期目标，因此在地中海等许多海洋地区，精英们往往为了利益和收益与海盗合作，并削弱作为经济竞争对手的共同敌人。"
 building_RICE_mediterranean_pirate_den_01:0 "盗贼藏身处"
 building_RICE_mediterranean_pirate_den_01_desc:1 "尽管海盗们现在得到了国家的间接补贴，以掠夺共同的敌人，但这一地区的海盗们才刚刚开始在地中海的这一部分建立立足点。"
 building_RICE_mediterranean_pirate_den_02:0 "黑市"
 building_RICE_mediterranean_pirate_den_02_desc:1 "该地区的海盗正与当地的领主紧密合作，从竞争对手那里偷货，然后走私到其他地方。这是一种有利的安排，在地中海上并不少见。"
 building_RICE_mediterranean_pirate_den_03:0 "海盗港"
 building_RICE_mediterranean_pirate_den_03_desc:1 "在地区统治者的帮助下，这里的海盗团伙已经积累了足够的财富和影响力，以维持他们自己的避难所，在那里他们可以管理他们的船队和从事贸易。"
 building_RICE_mediterranean_pirate_den_04:0 "海上要塞"
 building_RICE_mediterranean_pirate_den_04_desc:1 "这里有一个强大的要塞来保护这些海岸，恐吓那些胆敢违抗居住在这里的海盗和支持他们的当地统治者的人。无论是填满他们的金库，还是对抗敌人，这两个集团的利益是一致的。"
 activity_RICE_roman_kalends:0 "朔日"
 activity_RICE_roman_kalends_desc:0 "古罗马人庆祝即将到来的雅努斯月（儒略历一月）新年。这一庆典在地中海和中东的许多社区持续进行。"
 activity_RICE_roman_kalends_selection_tooltip: "庆祝朔日。\n\n$activity_RICE_roman_kalends_context_tooltip$"
 activity_RICE_roman_kalends_context_tooltip:0 "#emphasis 历史背景：#!公历一月朔日是古罗马的传统新年。即使新年改到了其他日期，地中海和中东受东罗马帝国影响的部分依然在此日庆祝。这一天节庆日在中世纪希腊语被简单称作Kalandai，而其他罗马历法的的每月初一不再庆祝。虽然东罗马教会权威谴责朔日庆典是不正统的异教行为，但它成为了穆斯林土地上东正教徒的基督教信徒标志。不管怎么样，东罗马和穆斯林资料都表明，新年庆典在逐渐衰落，并于13~14世纪基本消失。"
 activity_RICE_roman_kalends_host_desc: "\n$BULLET_WITH_TAB$#P 获得#![prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$受邀者对东道主的[opinions|E]提高\n$BULLET_WITH_TAB$[capital|E][county|E]获得#V 5#!年的[GetModifier('RICE_kalends_celebrated_modifier').GetNameWithTooltip][county_modifier|E]\n$BULLET_WITH_TAB$除非你采用$RICE_roman_kalends_devotion_intent$[intent|E]或遵循[GetReligionByKey('hellenism_religion').GetAdjective][faith|E]，否则你会#N 失去#![piety_i|E][piety|E]"
 activity_RICE_roman_kalends_guest_desc: "$activity_RICE_roman_kalends_host_desc$"
