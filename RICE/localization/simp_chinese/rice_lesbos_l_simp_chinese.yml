 lesbos.0020.t:0 "庆典准备"
 lesbos.0020.desc:0 "马上就是雅努斯月（儒略历一月）了，就像它在古罗马人的时代那样，这也就意味着是庆祝#italic 朔日#!（或#italic 正月朔日#!）的时候了。在古罗马，它标志着新年的开始。\n\n这一次，我会确保参与节庆。也许过节会有点嘈杂，但从另一个角度说呢，这也是送礼和分享快乐的季节，毕竟它位于寒冬之中。"
 lesbos.0020.a:0 "让我们准备一场大庆典！"
 lesbos.0021.t:0 "庆典开始"
 lesbos.0021.desc:0 "#italic 朔日庆典#!来临了！\n\n在冬季的寒冷月份之中，自古罗马以降，每个人无论贫富、男女、老少，都像这样聚在一起玩乐、在宴会上大吃大喝、交换礼物。我的住处到处都是点燃的灯火，甚至从这里都能听到一些远方的呼声。"
 lesbos.0021.a:0 "来，好，我们一起玩乐！"
 lesbos.0022.t:0 "庆典结束"
 lesbos.0022.desc:0 "#italic 朔日庆典#!结束了，所有的嘈杂与欢笑都在逐渐远去，平常的生活再次显形。\n\n如往年一样，这是一个快活的时光，我们也希望现在开始的一整年之后还能够再进行庆祝。"
 lesbos.0022.a:0 "重回挣扎的平日生活！"
 lesbos.0023.t:0 "交换礼物"
 lesbos.0023.desc:0 "这是#italic 朔日庆典#!早已有之的习俗，我们互相送礼，而交换礼物的时候是节庆中的重中之中。\n\n我自然做好了我的分内事务，给我的家人和相关者送了礼物，而他们也会因此送出回礼。"
 lesbos.0023.a:0 "今年我们交换的礼物多棒啊！"
 lesbos.0024.t:0 "xxxxx"
 lesbos.0024.desc:0 "xxxxx"
 lesbos.0024.a:0 "xxxxx"
 lesbos.0025.t:0 "反对[ROOT.Char.Custom('DefaultPriestTitlePlural')]"
 lesbos.0025.desc:0 "很多人觉得#italic 朔日庆典#!足够有趣，但不是所有人都这么想。\n\n[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]最近再次传统的谴责了他们认为是异端节日和我们早该摆脱的黑暗过去的遗迹，因为它遮蔽了我们的判断，冒犯了[ROOT.Char.GetFaith.HighGodName]。\n\n不是所有人都对这些扫兴之言大加关注，但[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]已经直言表示了[chaplain.GetHerHis]对日后仍然可能举办这种节日的不满。"
 lesbos.0025.a:0 "让[chaplain.GetHerHim]不要对这些东西看得太严肃"
 lesbos.0025.b:0 "告诉[chaplain.GetHerHim]我以后会克制"
 lesbos.0026.t:0 "异教徒治下"
 lesbos.0026.desc:0 "无论#italic 朔日庆典#!多喜庆，也不能忘记它还是重要的宗教时刻——至少对于我们这些在像[liege.GetFirstName]这样的[liege.GetFaith.GetAdjective][liege.GetTitleAsNameNoTooltip]统治下依旧奉献于[ROOT.Char.GetFaith.GetAdherentNamePlural]的人而言如此。\n\n通过这些节庆我们可以加强我们为古老信仰与习俗奉献的热忱，不会有任何人——即使是[liege.GetTitledFirstNameNoTooltip]——动摇我们在庆祝#italic 朔日庆典#!时的自豪。因此，我会拨出时间去本地的[ROOT.Char.GetFaith.HouseOfWorship]，在今日节庆的间隙中为[ROOT.Char.GetFaith.HighGodName]献上祈祷。"
 lesbos.0026.a:0 "我们即使在#italic 朔日节庆#!也是尽责的[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]。"
 lesbos.0027.t:0 "宴饮"
 lesbos.0027.desc:0 "#italic 朔日庆典#!的重要部分就是宴饮！今年没什么太大区别，而我的侍者做了一顿包括所有[ROOT.Char.GetCulture.GetName]菜式的精美大餐！\n\n不过嘛，总有人比起节庆的其他时候，更关注这顿宴会。"
 lesbos.0027.a:0 "我不会责难他们！来，所有人，开动！"
 lesbos.0027.b:0 "就算今天是节日，我也不能太过分。"
 lesbos.0028.t:0 "化装舞会"
 lesbos.0028.desc:0 "我们听到外面一片嘈杂，去看看到底发生了什么——一大群人在化装舞会上，有人男扮女装，有人女扮男装，还有人打扮成了动物。\n\n不是所有参加的人都进行了特殊打扮，但那些不打扮的人看起来也很愉悦。"
 lesbos.0028.a:0 "为什么我们不加入他们的小游行呢？"
 lesbos.0028.b:0 "我想变变装！"
 lesbos.0028.c:0 "我们可以就在这里观赏化装舞会。"
 lesbos.0029.t:0 "儿童的颂歌"
 lesbos.0029.desc:0 "不会错了，是孩子们在唱朔日颂歌。“朔日到了！朔日到了！”像一首动人的宗教诗歌一样唱着。\n\n当孩子们前来时，我们需要给他们一些糖或者一点钱，因为这是#italic 朔日庆典#!的古老传统。\n\n我的仆人们开了门，甜美的童声充满了我们的耳朵。当歌唱结束时，仆人希望我允许他们给这些孩子糖和钱。"
 lesbos.0029.a:0 "去吧，给孩子们一些糖。"
 lesbos.0029.b:0 "这些可爱的孩子值得大礼奖赏！"
 lesbos.0029.c:0 "我们这里不施舍东西——再见，孩子们！"
 lesbos.0030.t:0 "过头了"
 lesbos.0030.desc:0 "有人在#italic 朔日庆典#!之中吃喝过度的事情并不罕见。\n\n[eater.GetTitledFirstName]很不幸的发生了这种情况，在庆典宴会上[eater.GetSheHe]吃喝太多了。\n\n然而，[eater.GetFirstNameNoTooltip]依然不想错过之后的庆典！"
 lesbos.0030.a:0 "你应该休息一阵，[eater.GetFirstNameNoTooltip]。"
 lesbos.0031.t:0 "全是算计"
 lesbos.0031.desc:0 "#italic 朔日庆典#!的礼物交换总是很重要，但也总是因此引发讨论。\n\n有人说送礼组织的不够多，让这个节日没啥气氛了。又有人说送礼太多了，这也让节日气氛被破坏了。还有的人担心他们收的回礼不值送的礼那么多。"
 lesbos.0031.a:0 "礼轻情意重嘛！"
 lesbos.0031.b:0 "人们需要再送礼收礼上考虑得更谨慎。"
 lesbos.0032.t:0 "狂欢"
 lesbos.0032.desc:0 "我们决定进入举办#italic 朔日庆典#!的城镇，原因嘛，自然是狂欢了！\n\n一大群人聚集在一起玩乐宴饮，空气中充满了喜悦的气氛。可能有些喧闹，但至少足够好玩！"
 lesbos.0032.a:0 "最好和其他人一起狂欢。"
 lesbos.0032.b:0 "我该保持距离。"
 lesbos.0033.t:0 "不分贵贱"
 lesbos.0033.desc:0 "#italic 朔日庆典#!中的宴会人尽皆知，但区隔开它和一年之中其他节日的是，在这个节日中仆人和奴隶将平等的参与他们主人的宴会。\n\n对一些人来说，和身份低贱者吃饭并不是什么不愉快的经历，因为这可以让奴隶和仆人们了解到他们的仁善之心。而有的人则不喜欢和这些低贱者混在一起。"
 lesbos.0033.a:0 "这些经历不仅有趣，而且能够体贴他人。"
 lesbos.0033.b:0 "我可不想和下人同桌。"
 lesbos.0034.t:0 "外国人"
 lesbos.0034.desc:0 "一些外邦商人和旅行者在附近停留。尽管传统没有要求他们庆祝#italic 朔日#!，但邀请他们一起庆祝的情况并不罕见。\n\n一些外人将这种庆典视为冒犯和粗俗的聚会，会警告他们的人远离我们“不当”的庆祝和狂欢。但也有的人不介意一起参与节日。\n\n也许我们应该邀请这些外国人加入我们？"
 lesbos.0034.a:0 "当然，越热闹越好！"
 lesbos.0034.b:0 "他们大概不感兴趣。"
