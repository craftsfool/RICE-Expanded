 game_concept_mediterranean_pirate:0 "地中海海盗"
 game_concept_mediterranean_pirates:0 "地中海海盗"
 game_concept_RICE_pirate:0 "海盗"
 game_concept_RICE_pirates:0 "海盗"
 game_concept_RICE_pirate_desc:0 "在RICE中，海盗有多种表现形式，例如[special_buildings|E]和[decisions|E]。如果满足某些条件，位于地中海和印度洋的[rulers|E]可以分别与[mediterranean_pirates|E]和[indian_ocean_pirates|E]互动。"
 game_concept_mediterranean_local_pirate:0 "本地海盗"
 game_concept_mediterranean_local_pirates:0 "本地海盗"
 game_concept_mediterranean_pirate_desc:0 "地中海的[RICE_pirates|E]和私掠者在游戏中以几种不同的方式表现出来。首先，在地中海沿岸满足一定条件的统治者可以采用[decision|E]，建造一个名为$building_type_RICE_mediterranean_pirate_den_01$的[special_building|E]。它有一些军事和经济方面的奖励，有几个[counties|E]甚至在游戏开始时就已经有了这个建筑，通常是那些历史上以接纳海盗或与海盗合作而闻名的国家，比如意大利半岛的共和国。\n\n此外，还有一个$RICE_pirate_mediterranean_decision$[decision|E]，它包含多个选项。大多数选项可以通过在你的领地内拥有$building_type_RICE_mediterranean_pirate_den_01$，或者通过上述[decision|E]中的$RICE_pirate_establish_relations_name$选项获得的$RICE_pirate_mediterranean_connections_modifier$[modifier|E]来解锁。"
 dynn_RICE_seth:0 "塞斯"
 RICE_indian_ocean_pirate_infestation_2:0 "$RICE_socotra_pirate_infestation$"
 RICE_indian_ocean_pirate_infestation_2_desc:0 "当地统治者违背了与海盗达成的协议，这在短期内造成了混乱，因为许多海盗或前海盗依然存在，而且他们曾在当地的商业和政治机构担职。"
 RICE_mediterranean_reneged_pirate_deals:0 "违背与地中海海盗的协议"
 RICE_mediterranean_reneged_pirate_deals_desc:0 "#EMP 不能采用与[mediterranean_pirates|E]有关的[decisions|E]#!"
 RICE_mediterranean_renege_on_pirate_collaboration:0 "背叛与地中海海盗合作"
 RICE_mediterranean_renege_on_pirate_collaboration_tooltip:0 "你将取消与[mediterranean_local_pirates|E]签订的协议，禁止他们在你的领土上维持任何基地。"
 RICE_mediterranean_renege_on_pirate_collaboration_desc:0 "这些[mediterranean_local_pirates|E]带来的麻烦超过了他们的价值。许多人即是商人也是海盗，现在是我们摆脱他们的时候了。"
 RICE_mediterranean_renege_on_pirate_collaboration_effect_tooltip_1:0 "你所以[counties|E]上的#V $building_type_RICE_mediterranean_pirate_den_01$#![special_building|E]将被移除。"
 RICE_mediterranean_renege_on_pirate_collaboration_effect_tooltip_2:0 "[gold_i|E][gold|E]和[prestige_i|E][prestige|E]花费，以及获得的[legitimacy_i|E][legitimacy|E]的数值，取决于你的[counties|E]拥有多少座[buildings|E]和它们的等级，以及你的[diplomacy_i|E][diplomacy|E]、[martial_i|E][martial|E]和[intrigue_i|E][intrigue|E][skills|E]"
 RICE_mediterranean_renege_on_pirate_collaboration_effect_tooltip_3:0 "@warning_icon!#X 由于游戏限制，这不会移除[special_building|E]槽#!"
 RICE_every_county_with_mediterranean_pirate_building_tt:0 "每个有#V $building_type_RICE_mediterranean_pirate_den_01$#![special_building|E]的[county|E]"
 RICE_mediterranean_renege_on_pirate_collaboration_confirm:0 "他们不会喜欢它，但我们必须如此。"
 RICE_mediterranean_renege_on_pirate_collaboration_req:0 "拥有一个带#V $building_type_RICE_mediterranean_pirate_den_01$#![special_building|E]的[county|E]"
