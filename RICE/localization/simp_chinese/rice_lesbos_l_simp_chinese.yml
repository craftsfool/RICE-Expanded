 lesbos.0080.t:0 "赫淮斯托斯的铁砧"
 lesbos.0080.desc:0 "在古代，一个靠近[GetTitleByKey('c_lesbos').GetNameNoTier]的小岛，利姆诺斯岛，传说中是[GetReligionByKey('hellenism_religion').GetAdjective]中的匠神赫淮斯托斯巨大的铁砧所在之地。根据传说，这座岛屿因为他的父亲宙斯第一次将还是孩子的赫淮斯托斯摔在地上时掉下的地方。\n\n即使我遵循[ROOT.Char.GetFaith.GetAdjective]之道，向[ROOT.Char.GetFaith.HighGodName]而非赫淮斯托斯祈祷，我依然曾经听到一些关于这事的民俗传说，而且依然觉得它很有意思。谁知道爱琴海上其他万千岛屿上又有什么故事呢？"
 lesbos.0080.a:0 "那里一定有很多这样的故事。"
 lesbos.0081.t:0 "利姆诺斯葡萄酒"
 lesbos.0081.desc:0 "我治下的[GetTitleByKey('c_lesbos').GetNameNoTier]本地居民送了我一些#italic 利姆诺斯葡萄酒(Limnio)#!，自古以来这被视为那座岛屿的特产，在古典时代就已被诸如亚里士多德之类提及。著名古医师伽伦认为这座岛出产的葡萄酒是世界上最好的葡萄酒之一！\n\n无论如何，这些葡萄酒都极其适合拿到宴会上，或者干脆自己享用！"
 lesbos.0081.a:0 "一份厚礼！"
 lesbos.0082.t:0 "最伟大的莱斯沃斯诗人？"
 lesbos.0082.desc:0 "在古代，[GetTitleByKey('c_lesbos').GetNameNoTier]有一个别称，#italic 诗人之岛#!，因为岛上诞生了几位最著名的诗人，我最近时常思索这其中最著名的那些。\n\n#bold 萨福#!，从古至今都被认为是最伟大的女诗人之一，她在描绘男女浪漫上的文采迄今无人可及，尽管有些人批判她的生活放荡不经。\n\n#bold 特尔潘德#!，因在乐器和抒情风格上的发明毫不意外的被认为是最伟大的诗人之一——而且有可能是个派对爱好者。\n\n#bold 阿尔凯奥斯#!，最后一位，是萨福的同时代人，也是一位著名发明家和古往今来有名的抒情诗人，虽然，他和他的兄弟经常被卷入本地的政治冲突。"
 lesbos.0082.a:0 "我最喜欢萨福"
 lesbos.0082.b:0 "我最喜欢特尔潘德"
 lesbos.0082.c:0 "我最喜欢阿尔凯奥斯"
 lesbos.0083.t:0 "萨福的真实故事"
 lesbos.0083.desc:0 "萨福，[GetTitleByKey('c_lesbos').GetNameNoTier]上出过的最著名人物之一。自从古代起，她就备受争议，很多人承认她是一位雄辩诗人之一，但另一些人认为她是个到处和男女交媾的粗俗荡妇。多年后的今天，人们对这一差异得出了不同的结论。\n\n有些人相信实际上有两位著名的叫萨福的女性，只是日后混同了。一位是著名的诗人，一位则是不道德的荡妇。\n\n也有的人认为上面的理论让事情过于复杂了，认为实际上只有一位萨福。她本是一个道德败坏的人，但是随着时间过去逐渐精进自身并成为了著名的诗人。"
 lesbos.0083.a:0 "我觉得更有可能有两个萨福！"
 lesbos.0083.b:0 "我觉得萨福肯定努力提升自己了。"
 lesbos.0084.t:0 "[GetTitleByKey('c_lesbos').GetNameNoTierNoTooltip]木化石林"
 lesbos.0084.desc:0 "[GetTitleByKey('c_lesbos').GetNameNoTier]岛上有一个著名的地标——一座大的木化石林，这里的树木被变成了石头，没人知道这是怎么发生的。\n\n今天，一些来访的要员们来询问这处地标的事情，我们很开心能和他们分享我们对其所知。"
 lesbos.0084.a:0 "世界无奇不有——鄙岛亦是如此！"
 lesbos.0085.t:0 "亚里士多德和潟湖"
 lesbos.0085.desc:0 "一天，我的廷臣和我聊到有人说到历史上亚里士多德曾经在[GetTitleByKey('c_lesbos').GetNameNoTier]住过两年。\n\n在这段时间里，这位大哲在卡洛尼斯潟湖花大量时间学习，以更好的了解动植物，这启发了一些他对生物学的想法与观察。当时，他问询当地渔民所关注到的本地动植物，并且得出了很多我们一直到现在都会学习的理论。"
 lesbos.0085.a:0 "我应该学习更多亚里士多德的作品……"
 lesbos.0085.b:0 "看起来亚里士多德的学习确实很刻苦。"
