 activity_RICE_roman_kalends_predicted_cost: "[activity|E]的费用主要取决于你的[income|E]。"
 activity_RICE_roman_kalends_conclusion_desc: "我们的[GetActivityType( 'activity_RICE_roman_kalends' ).GetName]结束了，多愉快的庆典啊！"
 RICE_roman_kalends_celebration_phase: "庆祝"
 RICE_roman_kalends_celebration_phase_desc: "本地有句谚语，“新年之时，保持暖和，待在家里。”"
 RICE_roman_kalends_festive_intent_header: "节庆："
 RICE_roman_kalends_festive_intent: "节庆"
 RICE_roman_kalends_festive_intent_desc: "你放松下来玩得很开心，额外[stress_loss_i|E][stress|E]，如果你拥有[GetTrait('gregarious').GetName( GetNullCharacter )]或[GetTrait('gluttonous').GetName( GetNullCharacter )]特质，则会失去更多。"
 RICE_roman_kalends_devotion_intent_header: "奉献："
 RICE_roman_kalends_devotion_intent: "奉献"
 RICE_roman_kalends_devotion_intent_desc: "你加强你的宗教认同。#P 获得#!而非失去[piety_i|E][piety|E]，如果你的任意上级[liege|E]遵循不同的[religion|E]，虔诚获得#bold 翻倍#!。如果你[GetTrait('zealous').GetName( GetNullCharacter )]或[GetTrait('diligent').GetName( GetNullCharacter )]，失去更多[stress_loss_i|E][stress|E]。"
 RICE_roman_kalends_generosity_intent_header: "布施："
 RICE_roman_kalends_generosity_intent: "布施"
 RICE_roman_kalends_generosity_intent_desc: "你认真的践行送礼的精神。在送礼中#P +100%#![opinion|E]。如果你[GetTrait('generous').GetName( GetNullCharacter )]或[GetTrait('compassionate').GetName( GetNullCharacter )]，失去[stress_loss_i|E][stress|E]。"
 RICE_roman_kalends_gift_type: "礼物"
 RICE_roman_kalends_gift_small: "谦逊"
 RICE_roman_kalends_gift_small_desc: "$EFFECT_LIST_BULLET$获得基础[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_roman_kalends_gift_gain_small_base')]#![prestige|E]\n$EFFECT_LIST_BULLET$每个参加这个[activity|E]的[character|E]对你的[opinion|E]提升#P 4#!\n$EFFECT_LIST_BULLET$你自己#italic 可能#!接受最多#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!的礼物\n\n#weak 这次真的只是字面意义上的略备薄礼。#!"
 RICE_roman_kalends_gift_medium: "中等"
 RICE_roman_kalends_gift_medium_desc: "$EFFECT_LIST_BULLET$获得基础[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_roman_kalends_gift_gain_medium_base')]#![prestige|E]\n$EFFECT_LIST_BULLET$每个参加这个[activity|E]的[character|E]对你的[opinion|E]提升#P 8#!\n$EFFECT_LIST_BULLET$你自己#italic 可能#!接受最多#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!的礼物\n\n#weak 一个节庆自然需要节庆礼#!"
 RICE_roman_kalends_gift_large: "豪奢"
 RICE_roman_kalends_gift_large_desc: "$EFFECT_LIST_BULLET$获得基础[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_roman_kalends_gift_gain_large_base')]#![prestige|E]\n$EFFECT_LIST_BULLET$每个参加这个[activity|E]的[character|E]对你的[opinion|E]提升#P 12#!\n$EFFECT_LIST_BULLET$你自己#italic 可能#!接受最多#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!的礼物\n\n#weak 我会真正拥抱朔月节庆的精神，厚礼谢众人#!"
