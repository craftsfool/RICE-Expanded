 mediterranean_pirate_intro_text:0 "有一群和我们有联系的海盗活跃在[GetGeographicalRegion('RICE_mediterranean_region').GetName]，他们同意不袭击我们的领土，并且和我们分享共同的利益。\n\n"
 lesbos.0060.t:0 "海盗：建立关系"
 lesbos.0060.desc:0 "自古以来，广阔的大海上就有海盗袭扰。\n\n因此，同样自古以来，统治者就在考虑如何以不同的方式利用海盗——毕竟，我们之中的很多都有共同利益。而且，很多海盗本身就是商人，总是有博取利益的空间。\n\n循着很多过往统治者的足迹，我已经命令我的官员与那些愿意与我们合作的海盗建立有利可图的联系。即使我给予他们一个避风港，他们也可能不会真正顺从我的统治，但如果他们接受不将我的领土作为目标时，我们能互帮互助，从长计议。"
 lesbos.0060.a:0 "务实而有必要的举措。"
 lesbos.0061.t:0 "海盗：取得分红"
 lesbos.0061.desc:0 "最近，我接到了一群海盗从其他地方的掠夺中获益颇丰的消息。\n\n作为我们早先协定的一部分，他们把收益的一部分交给我们，包括各种各样的珍贵货物——奴隶，黄金，武器，食物，珍贵的艺术品等等。"
 lesbos.0061.a:0 "多么美妙的收益啊！"
 lesbos.0062.t:0 "海盗：授权销赃"
 lesbos.0062.desc:0 "这些海盗近期很有斩获，取得了不少的掠夺物，不管是奴隶，黄金，武器，食物还是其他什么的。\n\n他们提议我应该允许在领内售卖这些货物，我怎么能拒绝如此慷慨的请求呢？"
 lesbos.0062.a:0 "这会促进当地经济。"
 lesbos.0063.t:0 "海盗：征募水手"
 lesbos.0063.desc:0 "海盗的军事经验是充足的，而且也是我自己军事力量的有力补充。\n\n我决定和一些海盗签订一份更加永久的协议，将他们直接招募到我的旗帜下作战。"
 lesbos.0063.a:0 "让我们期待他们能证明自己作为士兵能够被信赖。"
 lesbos.0064.t:0 "海盗：赎回俘虏"
 lesbos.0064.desc:0 "我听说我的封臣之一被海盗抓走了，这显然不是“我们有联系的的”海盗所为，因为我们之间有他们不得劫掠我领地的协议。\n\n不过，那些和我们友好的海盗依然有价值，因为我的领民请求我协助他们朋友和家人的释放时，我们的海盗能用他们的人脉网帮助我们解救和释放这些人质——当然，“只要我付赎金”"
 lesbos.0064.a:0 "赎金付了，俘虏们可以回家了。"
