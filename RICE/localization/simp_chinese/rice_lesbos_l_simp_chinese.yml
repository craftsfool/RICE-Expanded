 lesbos.0050.t:0 "地中海海盗"
 lesbos.0050.desc:0 "多年来，海盗一直在[capital_province.GetName]沿海地区活动。掠夺在地中海航行的商船，但如果我们合作，会有更多收获。毕竟，普通商人，就像我们做生意的那些人一样，求助于海盗以赚取额外收入的情况并不少见，海盗向有事业心的领主提供服务的情况也并非闻所未闻。但以前，这些事情都是在我们的领域内以一种临时的、无序的方式进行的。\n\n现在，我们已经和当地的海盗达成了协议。作为让他们在我国领土上建立官方基地的交换，他们将代表我们袭击我们敌人的海岸，并提供我们一份战利品，并支持我们的军事活动。与海盗为伍并不可耻；它只不过是我们在不断变化和危险的地中海世界中保护我们的经济和政治利益的另一个工具。"
 lesbos.0050.a:0 "他们会很好地服务于我们。"
 lesbos.0050.tooltip:0 "$RICE_mediterranean_collaborate_with_pirates_effect_tooltip_2$"
 lesbos.0051.t:0 "$lesbos.0050.t$"
 lesbos.0051.desc:0 "海盗在我的领土上太久了，我受够了！我们与他们达成的“协议”对我们不利，尽管许多人即是海盗也是受人尊敬的商人，但他们的贪婪不是一般江湖骗子和强盗可比的，我们真的能信任他们吗？\n\n发出诏令！立即取消我们与[GetGeographicalRegion('RICE_mediterranean_region').GetName]海盗的任何协议。他们将不再获得法律保护，也无法在我的领土上建立行动基地，他们不再#italic 为我们#!服务。\n\n我已经命令卫兵去确保这些海盗服从我们的命令，希望他们和平离开！"
 lesbos.0051.a:0 "希望这个决定没错……"
