 RICE_kalends_opinion:0 "朔日节礼"
 activity_RICE_hot_springs_visit_lesbos_thermi_province_desc:0 "\n#P +++[GetTitleByKey('c_lesbos').GetNameNoTier]塞尔米的[hot_springs|E]是一个独特的[hot_springs|E]。#!\n\n#italic 你会获得[GetModifier('RICE_lesbos_visit_thermi_normal').GetNameWithTooltip][character_modifier|E]。如果你的[faith|E]是[GetReligionByKey('hellenism_religion').GetAdjective]，你会获得[GetModifier('RICE_lesbos_visit_thermi_artemis').GetNameWithTooltip][modifier|E]而非一般加成，并且给予一些额外[piety_i|E][piety|E]。#!"
 RICE_pirate_mediterranean_connections_modifier:0 "地中海海盗联系"
 RICE_pirate_mediterranean_connections_modifier_desc:0 "该角色与一些地中海海盗团体建立了联系。\n\n#EMP $RICE_pirate_mediterranean_decision$[decision|E]的各种选项，他年若得报怨仇……#!"
 RICE_kalends_celebrated_modifier:0 "最近庆祝朔日"
 RICE_lesbos_mediterranean_pirate_infestation:0 "海盗侵扰"
 RICE_lesbos_mediterranean_infestation_desc:0 "这个区域统治者已经开始主动向该地区的海盗示意，允许他们建立永久性基地以在进行抢劫和贸易时互利合作。然而，海盗的首领们需要一些时间来控制住他的船上兄弟，然后将他们整合进附近的社区和权力结构。"
 RICE_lesbos_recently_fortified_aegean:0 "最近加固了爱琴领土"
 RICE_mediterranean_pirate_sales:0 "地中海海盗黑市"
 RICE_mediterranean_pirate_sales_desc:0 "本地统治者允许海盗，或者至少和他们有合作关系的那部分，在这个地区售卖他们无论合法还是非法得到的货物。毕竟，很多“海盗”也是商人，当然换句话说——很多商人有时也干海盗。"
 RICE_ransomed_pirate_prisoners:0 "赎回海盗俘虏"
 RICE_ransomed_pirate_prisoners_desc:0 "本地统治者最近利用他们的关系网赎回了一部分曾居住在这里但是被海盗掠走的居民。"
 RICE_kalends_dressed_up_as_animal:0 "在朔日庆典上扮成动物"
 RICE_kalends_dressed_up_as_animal_desc:0 "在最近的#italic 朔日庆典#!上，这个角色参加了一场化妆舞会，装扮成了某种动物。"
 RICE_kalends_crossdressed:0 "在朔日庆典上穿异装"
 RICE_kalends_crossdressed_desc:0 "在最近的#italic 朔日庆典#!上，这个角色装扮以相反性别风格的衣服。"
 RICE_lesbos_sick_from_kalends_feasting:0 "在朔日庆典上不胜酒量"
 RICE_lesbos_sick_from_kalends_feasting_desc:0 "在最近的#italic 朔日庆典#!上，这个角色喝太多了，把自己喝出问题了。"
 RICE_roman_kalends_modifier:0 "庆祝朔日"
 RICE_lesbos_thinking_about_hephaestus_legends:0 "想到赫淮斯托斯的神话"
 RICE_lesbos_wine_modifier:0 "莱斯沃斯葡萄酒"
 RICE_lesbos_likes_sappho:0 "受萨福启发"
 RICE_lesbos_likes_terpander:0 "受特尔潘德启发"
 RICE_lesbos_likes_alcaeus:0 "受阿尔凯奥斯启发"
 RICE_lesbos_sappho_duplication:0 "两萨福理论"
 RICE_lesbos_sappho_duplication_desc:0 "来自莱斯沃斯岛的诗人萨福的真实性存在争议，一般传说中提到了萨福作为诗人和荡妇。这个角色相信有种理论可以兼容这两个形象——假设实际上有两个萨福，一个诗人萨福和一个荡妇萨福，前者极富才学，不像是个粗俗的人。"
 RICE_lesbos_sappho_narrativisation:0 "萨福求进理论"
 RICE_lesbos_sappho_narrativisation_desc:0 "来自莱斯沃斯岛的诗人萨福的真实性存在争议，一般传说中提到了萨福作为诗人和荡妇。这个角色相信有种理论可以兼容这两个形象——萨福曾经是个荡妇，后来精进自己更加富有文采——这样听起来就是个皆大欢喜的故事了。"
 RICE_lesbos_studying_aristotle_biology:0 "回顾亚里士多德的生物学研究"
 RICE_lesbos_visit_thermi_artemis:0 "造访莱斯沃斯的塞尔米"
 RICE_lesbos_visit_thermi_artemis_desc:0 "这一角色最近去到了莱斯沃斯岛拜访游玩塞尔米温泉。它以治愈功效闻名，因而被视为阿尔忒弥斯的圣地。"
 RICE_lesbos_visit_thermi_normal:0 "$RICE_lesbos_visit_thermi_artemis$"
 RICE_lesbos_visit_thermi_normal_desc:0 "这一角色最近去到了莱斯沃斯岛拜访游玩塞尔米温泉，它以治愈功效闻名。"
 RICE_pirate_mediterranean_decision:0 "联系地中海海盗"
 RICE_pirate_mediterranean_decision_tooltip:0 "海盗并不总是敌人——有时，或者说许多时候，他们可以是朋友，或者至少是有用的工具！"
 RICE_pirate_mediterranean_decision_desc:0 "[GetGeographicalRegion('RICE_mediterranean_region').GetName]总是成为一些海盗的安身立命之处，而熟练的[rulers|E]知道怎么和海岛互利共赢。"
 RICE_pirate_mediterranean_decision_confirm:0 "海盗也能为我所用。"
 RICE_pirate_mediterranean_decision_requirement_1:0 "持有一个拥有#V 地中海海盗黑湾#!的[county|E]，或拥有[GetModifier('RICE_pirate_mediterranean_connections_modifier').GetNameWithTooltip][character_modifier|E]"
 RICE_NOT_pirate_mediterranean_decision_requirement_1:0 "你#bold 没有#!一个[county|E]有#V 海盗窝#!或[GetModifier('RICE_pirate_mediterranean_connections_modifier').GetNameWithTooltip][character_modifier|E]"
 RICE_pirate_mediterranean_decision_context_tooltip:0 "$RICE_socotra_collaborate_with_pirates_context_tooltip$"
 RICE_PIRATE_PICK_ACTION_TYPE:0 "我们当然有共同的利益……"
 RICE_pirate_establish_relations_name: "建立联系"
 RICE_pirate_establish_relations_desc: "$RICE_pirate_establish_relations_name$"
 RICE_pirate_establish_relations_tooltip: "#italic 如果我们和海盗建立联系，首先我们需要一个常规沟通渠道。#!"
 RICE_pirate_establish_relations_effect_tooltip_1: "现在你可以使用$RICE_pirate_mediterranean_decision$[decision|E]的其他选项。"
 RICE_pirate_acquire_booty_name: "要求分红"
 RICE_pirate_acquire_booty_desc: "$RICE_pirate_acquire_booty_name$"
 RICE_pirate_acquire_booty_tooltip: "#italic 我们要求一些和我们合作的海盗分享分享他们的战利品。#!"
 RICE_pirate_acquire_booty_effect_tooltip_1: "你将获得介于#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_pirate_booty_min_value')|0]#!到#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_pirate_booty_max_value')|0]#!之间随机数量的[gold|E]"
 RICE_pirate_acquire_booty_effect_tooltip_2: "你能够获得的[gold_i|E][gold|E]最小值和最大值取决于你的[diplomacy_i|E][diplomacy|E]、[stewardship_i|E][stewardship|E]和[intrigue_i|E][intrigue|E]"
 RICE_pirate_authorize_sales_name: "许可销赃"
 RICE_pirate_authorize_sales_desc: "$RICE_pirate_authorize_sales_name$"
 RICE_pirate_authorize_sales_tooltip: "#italic 海盗能在这里销赃来促进当地经济。#!"
 RICE_pirate_recruit_pirates_name: "招募海盗"
 RICE_pirate_recruit_pirates_desc: "$RICE_pirate_recruit_pirates_name$"
 RICE_pirate_recruit_pirates_tooltip: "#italic 这些有战斗经验的海盗可以作为熟练士兵为我所用。#!"
 RICE_pirate_recruit_pirates_effect_tooltip_1: "你会收到#V 200#!到#V 500#!名[special_troops|E]，包括一些[men_at_arms|E]"
 RICE_pirate_ransom_prisoners_name: "赎回俘虏"
 RICE_pirate_ransom_prisoners_desc: "$RICE_pirate_ransom_prisoners_name$"
 RICE_pirate_ransom_prisoners_tooltip: "#italic 我们可以用我们的海盗关系网定位和送回我们被其他海盗抓住的封臣……当然，有偿的咯。#!"
 RICE_pirate_ransom_prisoners_effect_tooltip_1: "你将#N 失去#!介于#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_pirate_ransom_min_value')|0]#!和#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_pirate_ransom_max_value')|0]#!之间随机数量的[gold|E]来支付赎金"
 RICE_pirate_ransom_prisoners_effect_tooltip_2: "你支付的[gold_i|E][gold|E]数目取决于你的[diplomacy_i|E][diplomacy|E]、[martial_i|E][martial|E]和[intrigue_i|E][intrigue|E]"
 RICE_mediterranean_collaborate_with_pirates:0 "与地中海海盗合作"
 RICE_mediterranean_collaborate_with_pirates_tooltip:0 "你将会与[mediterranean_local_pirates|E]谈判并允许他们在你的领土内维持一个行动基地，以此交换他们让一部分利给你并且不骚扰你保护下的商人。"
 RICE_mediterranean_collaborate_with_pirates_desc:0 "为什么在你能和这些[mediterranean_pirates|E]合作共赢时却与他们交战呢？不能让你们共同的敌人从对抗中得益。"
 RICE_mediterranean_collaborate_with_pirates_effect_tooltip_1:0 "$RICE_socotra_collaborate_with_pirates_effect_tooltip$"
 RICE_mediterranean_collaborate_with_pirates_effect_tooltip_2:0 "拥有含#V 海盗窝#!的[counties|E]的[rulers|E]永远可以用[decision|E]以各种方式与海盗合作，具体方式取决于位于哪片水域。"
 RICE_mediterranean_collaborate_with_pirates_confirm:0 "让我们为互惠互利进行谈判！"
 RICE_mediterranean_collaborate_with_pirates_requirement_1:0 "首都位于地中海沿岸且没有[special_buildings|E]"
