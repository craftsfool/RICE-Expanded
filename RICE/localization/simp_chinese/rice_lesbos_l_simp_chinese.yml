 lesbos.0010.t:0 "加固[GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip]"
 lesbos.0010.desc:0 "[GetGeographicalRegion('RICE_aegean_region').GetName]位于地中海要冲，它极大促进了因贸易、外交与旅行而起的航行。然而不幸的是，我们不希望看到的掠袭与海盗行为也因此得到了促进。\n\n为了对抗这些海上威胁，我拨出资源增加我在[GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip]领地的防御。它包含许多任务，比方说建造新堡垒或者加固已有堡垒，修建望楼观察通行船只，训练当地人防御战术，以及将脆弱的定居点移动到更安全的位置。"
 lesbos.0010.a:0 "我们将在那里保卫我们的海疆。"
 lesbos.0011.t:0 "去塞尔米！"
 lesbos.0011.desc:0 "有很多自古皆知的温泉位于[GetGeographicalRegion('RICE_aegean_region').GetName]，其中最突出的一个在[GetTitleByKey('c_lesbos').GetNameNoTier]的塞尔米村附近并以此为名。\n\n有传言说古人在这里祭拜[GetReligionByKey('hellenism_religion').GetAdjective]神阿尔忒弥斯，但就算是现在，这温泉依然以治疗功效在本地人中闻名。"
 lesbos.0011.a:0 "那会是一场足够好足够值得的访问。"
 lesbos.0012.t:0 "塞尔米温泉"
 lesbos.0012.desc:0 "我终于来到了[GetTitleByKey('c_lesbos').GetNameNoTier]的塞尔米温泉！塞尔米是一座相对不起眼的海岸小镇，也是一个适合进行放松旅程享受温泉的地方。\n\n当我泡进水里，我发觉有些小而古老的遗迹在这附近的路上，也许那是古代神龛的遗存。"
 lesbos.0012.desc.hellenic_pagan:0 "\n\n我很清楚这里曾经是阿尔忒弥斯女神的信仰中心，因为泉水因她而神圣。作为[ROOT.Char.GetFaith.GetName]的信徒，我只能做到在这里为#bold 忒耳弥亚的阿尔忒弥斯#!献上祈祷，作为猎神与以此泉治愈我们的神，她护佑着我们。"
 lesbos.0012.a:0 "无论如何我很高兴我能来这里！"
