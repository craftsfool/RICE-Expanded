 magadha.0060.t:0 "放生仪式"
 magadha.0060.desc.birds:0 "今天是为鸟儿们举行放生仪式的日子。除了接受我邀请的所有人，当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]也前来我的住所协助我们。他们带领我们进行了几轮祈祷，为这些鸟儿祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的鸟带到一块空地上。它们被放飞到天上，形成一个壮丽的风景，它们在天空中自由飞翔（希望能远离任何猎人和猎鹰人）。"
 magadha.0060.desc.turtles:0 "今天是为龟群举行放生仪式的日子。除了接受我邀请的所有人，当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]也前来我的住所协助我们。他们带领我们进行了几轮祈祷，为这些千岁祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的乌龟带到附近的湖边。它们被放生在湖边，希望它们能远离任何猎人。"
 magadha.0060.desc.fish:0 "今天是为鱼儿们举行放生仪式的日子。除了接受我邀请的所有人，当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]也前来我的住所协助我们。他们带领我们进行了几轮祈祷，为这些鱼祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的鱼带到附近的河边。它们被释放到水中，我们高兴地看着它们在水中自由地游动。"
 magadha.0060.desc.insects:0 "今天是为虫群举行放生仪式的日子。除了接受我邀请的所有人，当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]也前来我的住所协助我们。他们带领我们进行了几轮祈祷，为这些昆虫祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的昆虫带到一个安静的野外。虽然我们可能会害怕它们，但它们也是芸芸众生的一员，它们现在可以在野外自由的生活了。"
 magadha.0060.desc:0 "\n\n最后我们回到一座寺庙，在那里[ROOT.Char.Custom('DefaultPriestTitlePlural')]给我们讲授各种关于[ROOT.Char.GetFaith.GetAdjective]的故事，以及为什么我们必须珍惜和爱护芸芸众生"
 magadha.0060.a:0 "愿众生早日脱离苦海！"
 magadha.0061.t:0 "放生仪式"
 magadha.0061.desc.birds:0 "今天是[host.GetTitledFirstName]主持的鸟儿放生仪式的日子。除了接受[host.GetHerHis]邀请的所有人，当地的[host.Custom('DefaultPriestTitlePlural')]也来到了[host.GetHerHis]的住所协助我们。他们带领我们做了几轮祈祷，为这些鸟儿祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的鸟带到一块空地上。它们被放飞到天上，形成一个壮丽的风景，它们在天空中自由飞翔（希望能远离任何猎人和猎鹰人）。"
 magadha.0061.desc.turtles:0 "今天是[host.GetTitledFirstName]主持的龟群放生仪式的日子。除了接受[host.GetHerHis]邀请的所有人，当地的[host.Custom('DefaultPriestTitlePlural')]也来到了[host.GetHerHis]的住所协助我们。他们带领我们做了几轮祈祷，为这些千岁祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的乌龟带到附近的湖边。它们被放生在湖边，希望它们能远离任何猎人。"
 magadha.0061.desc.fish:0 "今天是[host.GetTitledFirstName]主持的鱼群放生仪式的日子。除了接受[host.GetHerHis]邀请的所有人，当地的[host.Custom('DefaultPriestTitlePlural')]也来到了[host.GetHerHis]的住所协助我们。他们带领我们做了几轮祈祷，为这些鱼祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的鱼带到附近的河边。它们被释放到水中，我们高兴地看着它们在水中自由地游动。"
 magadha.0061.desc.insects:0 "今天是[host.GetTitledFirstName]主持的昆虫放生仪式的日子。除了接受[host.GetHerHis]邀请的所有人，当地的[host.Custom('DefaultPriestTitlePlural')]也来到了[host.GetHerHis]的住所协助我们。他们带领我们做了几轮祈祷，为这些昆虫祈福，以便它们在未来的生活中能在更好的环境中生活。\n\n之后，我们把买来的昆虫带到一个安静的野外。虽然我们可能会害怕它们，但它们也是芸芸众生的一员，它们现在可以在野外自由的生活了。"
 magadha.0061.b:0 "我为出席这次放生仪式感到开心。"
 magadha.0061.desc:0 "\n\n最后，我们回到了寺庙，[host.Custom('DefaultPriestTitlePlural')]给我们作[host.GetFaith.GetAdjective]的布道，令我们明白为何要爱护一切有情众生。"
 magadha.0061.a:0 "我很高兴来此帮助这些动物"
