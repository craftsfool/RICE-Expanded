 RICE_magadha_performed_life_release_birds:0 "进行了一次鸟类放生"
 RICE_magadha_performed_life_release_birds_desc:0 "该角色最近赞助了一个鸟类的放生仪式。该仪式是佛教的一种做法，俗人和僧侣将要被宰杀的动物放生到野外，以拯救它们免受无谓的痛苦。"
 RICE_magadha_performed_life_release_turtles:0 "进行了一次海龟放生"
 RICE_magadha_performed_life_release_turtles_desc:0 "该角色最近赞助了一个海龟的放生仪式。该仪式是佛教的一种做法，俗人和僧侣将要被宰杀的动物放生到野外，以拯救它们免受无谓的痛苦。"
 RICE_magadha_performed_life_release_fish:0 "进行了一次鱼类放生"
 RICE_magadha_performed_life_release_fish_desc:0 "该角色最近赞助了一个鱼类的放生仪式。该仪式是佛教的一种做法，俗人和僧侣将要被宰杀的动物放生到野外，以拯救它们免受无谓的痛苦。"
 RICE_magadha_performed_life_release_insects:0 "进行了一次昆虫放生"
 RICE_magadha_performed_life_release_insects_desc:0 "该角色最近赞助了一个昆虫的放生仪式。该仪式是佛教的一种做法，俗人和僧侣将要被宰杀的动物放生到野外，以拯救它们免受无谓的痛苦。"
 RICE_magadha_participated_in_life_release:0 "参加了放生仪式"
 RICE_magadha_participated_in_life_release_desc:0 "该角色最近参加了一个由别人主持的放生仪式。该仪式是佛教的一种做法，俗人和僧侣将要被宰杀的动物放生到野外，以拯救它们免受无谓的痛苦。"
 RICE_magadha_disapproves_of_life_release:0 "浪费时间和资源的放生仪式"
 RICE_magadha_criticized_life_release:0 "不赞成我的放生仪式"
 RICE_magadha_invited_me_to_life_release:0 "邀请我参加放生仪式"
 RICE_magadha_mahabodhi_donation_small:0 "小额的捐赠给摩诃菩提寺"
 RICE_magadha_mahabodhi_donation_small_desc:0 "该角色最近向菩提伽耶的摩诃菩提寺提供了一笔微薄的捐赠。这些资金将帮助住在那里的僧伽们努力维护这个地方，并支持来到这里的朝圣者。"
 RICE_magadha_mahabodhi_donation_medium:0 "中额的捐赠给摩诃菩提寺"
 RICE_magadha_mahabodhi_donation_medium_desc:0 "该角色最近向菩提伽耶的摩诃菩提寺提供了一笔引人注目的捐赠。这些资金将帮助住在那里的僧伽们努力维护这个地方，除了帮助僧伽和朝圣者外，它还将用于小型建筑的维修。"
 RICE_magadha_mahabodhi_donation_large:0 "大额的捐款给摩诃菩提寺"
 RICE_magadha_mahabodhi_donation_large_desc:0 "这个人最近向菩提伽耶的摩诃菩提寺提供了一笔可观的捐款。这笔捐赠将用于建筑维修，建造一些杂项设施，以及支持那里的僧侣和朝圣者。"
 RICE_magadha_nalanda_donation_everyday:0 "捐赠给那烂陀寺的基本必需品"
 RICE_magadha_nalanda_donation_everyday_desc:0 "这人最近向那烂陀寺大学捐赠了牲畜、食物和其他基本用品，如纺织品、器皿、手工工具、陶瓷、床、药品等。希望那里的学者、僧侣和技术支持人员能够善用这些物品。"
 RICE_magadha_nalanda_donation_religious:0 "捐赠给那烂陀寺的宗教物品"
 RICE_magadha_nalanda_donation_religious_desc:0 "该角色最近向那烂陀寺大学捐赠了一些宗教物品，如雕像、较小的遗物、香火、经书抄本、僧袍等。该大学的学生和教师可以在他们的精神实践中好好利用这些东西。"
 RICE_magadha_nalanda_donation_construction:0 "捐赠资金用于那烂陀寺的建设项目"
 RICE_magadha_nalanda_donation_construction_desc:0 "该角色最近向那烂陀寺大学捐赠了资金和物资，帮助该机构重建或修复旧的建筑，同时也建造新的建筑。这些建筑可以是任何东西，从学生宿舍，到小型佛寺和窣堵坡，再到食品和物资的仓库。"
 RICE_magadha_nalanda_donation_endowment:0 "给那烂陀寺的捐赠"
 RICE_magadha_nalanda_donation_endowment_desc:0 "该角色最近给那烂陀寺大学捐赠了在他们领域内的几个村庄。这些村庄产生的资源和收入将直接用于那烂陀寺大学，这种捐赠对于资助大学的运营非常重要。"
 RICE_magadha_nalanda_endowment_of_villages:0 "捐赠那烂陀寺的村庄"
 RICE_magadha_nalanda_endowment_of_villages_desc:0 "一位佛教领主最近将这个地区的几个村庄捐赠给印度的那烂陀寺大学。这些村庄的资源和收入将直接用于那烂陀寺大学，这种捐赠对于资助大学的运作非常重要。"
 RICE_magadha_rajgir_bonus_buddhist:0 "以佛教徒的身份沐浴在王舍城的圣洁温泉中"
 RICE_magadha_rajgir_bonus_hindu:0 "以印度教徒的身份沐浴在王舍城的神圣温泉中"
 RICE_magadha_rajgir_bonus_jain:0 "以耆那教徒的身份沐浴在王舍城的神圣温泉中"
 RICE_magadha_rajgir_hot_springs_buddhist:0 "佛教徒控制[hot_springs_of_rajgir_short|E]的温泉"
 RICE_magadha_rajgir_hot_springs_buddhist_desc:0 "王舍城的温泉受到印度各种宗教信徒的敬仰，但王舍城温泉目前的景观反映出佛教的影响要大于其他宗教。\n\n#italic 佛教[rulers|E]采取[visit_the_hot_springs_of_rajgir|E][decision|E]时，将获得[GetModifier('RICE_magadha_rajgir_bonus_buddhist').GetNameWithTooltip][character_modifier|E]#!"
 RICE_magadha_rajgir_hot_springs_hindu:0 "印度教徒控制[hot_springs_of_rajgir_short|E]的温泉"
 RICE_magadha_rajgir_hot_springs_hindu_desc:0 "王舍城的温泉受到印度各种宗教信徒的敬仰，但王舍城温泉目前的景观反映出印度教的影响要大于其他宗教。\n\n#italic 印度教[rulers|E]采取[visit_the_hot_springs_of_rajgir|E][decision|E]时，将获得[GetModifier('RICE_magadha_rajgir_bonus_hindu').GetNameWithTooltip][character_modifier|E]#!"
 RICE_magadha_rajgir_hot_springs_jain:0 "耆那教控制着[hot_springs_of_rajgir_short|E]的温泉"
 RICE_magadha_rajgir_hot_springs_jain_desc:0 "王舍城的温泉受到印度各种宗教信徒的敬仰，但王舍城温泉目前的景观反映出耆那教的影响要大于其他宗教。\n\n#italic 佛教[rulers|E]采取[visit_the_hot_springs_of_rajgir|E][decision|E]时，将获得[GetModifier('RICE_magadha_rajgir_bonus_jain').GetNameWithTooltip][character_modifier|E]#!"
 RICE_magadha_pithipati_of_bodh_gaya:0 "菩提伽耶的金刚座之主"
 RICE_magadha_pithipati_of_bodh_gaya_desc:0 "作为[pithipati|E]，菩提迦耶（佛陀开悟的确切地点）的主人，该角色因维护菩提迦耶周围的圣地而受到许多佛教徒的尊敬。诚然，这种行为为他们赢得了巨大的功德!\n\n#EMP 只要是伽耶的[ruler|E]，并且还是#V 佛教徒#!就可以获得[character_modifier|E]，作为[pithipati|E]，该人物可获得与各种佛教[decisions|E]以及各种加成#!"
 RICE_magadha_transformed_rajgir:0 "改造了王舍城的温泉"
 RICE_magadha_currently_abstaining_vassa:0 "在结夏安居期间期戒除恶习"
 RICE_magadha_currently_abstaining_vassa_desc:0 "当结夏安居进行时，该角色试图戒除各种会产生恶业的行为和想法，如饮酒、不当性行为和杀孽。"
 RICE_magadha_cannot_resist_vices:0 "在结夏安居期间无法抗拒的恶习"
 RICE_magadha_restrained_lustful:0 "在结夏安居期间克制性欲"
 RICE_magadha_restrained_greedy:0 "在结夏安居期间克制贪欲"
 RICE_magadha_restrained_sadistic:0 "在结夏安居期间戒除暴虐想法"
 RICE_magadha_restrained_callous:0 "在结夏安居期间克制冷漠之情"
 RICE_magadha_restrained_wrathful:0 "在结夏安居期间克制愤怒"
 RICE_magadha_restrained_vengeful:0 "在结夏安居期间克制仇恨之情"
 RICE_magadha_restrained_gluttonous:0 "在结夏安居期间克制贪欲"
 RICE_magadha_restrained_arrogant:0 "在结夏安居期间放下傲慢之心"
 RICE_magadha_restrained_impatient:0 "在结夏安居期间克制烦躁"
 RICE_magadha_reformed_vices_vassa:0 "在结夏安居期间成功戒除恶习"
 RICE_magadha_vassa_buddhist_scriptures:0 "定期阅读佛经"
 RICE_magadha_inspired_bodhi_tree_ashoka:0 "被阿育王改信而激励"
 RICE_magadha_inspired_bodhi_tree_ashoka_desc:0 "在加雅的菩提树下沐浴之后，该角色被印度皇帝阿育王的佛教传说所激励。据说当阿育王是一个残酷的暴君时，他摧毁了这棵树，然而尽管他努力复原这树，但是另一棵树却奇迹般地出现了，他因此被感动了，皈依佛教并成为一个仁慈的领袖。"
 RICE_magadha_inspired_bodhi_tree_mara:0 "被佛陀对魔罗的抵抗所激励"
 RICE_magadha_inspired_bodhi_tree_mara_desc:0 "在沐浴了伽耶的菩提树之后，该角色被佛教中关于佛陀如何抵御魔罗诱惑的传说所激励。相传当佛陀即将开悟时，魔罗用洪水、火焰、雷鸣和闪电来攻击他，释迦牟尼不为所动。魔罗又让自己的三个女儿来诱惑他，依然毫无结果。释迦牟尼进入深定之中，终于在一个月圆之夜终成彻悟。"
 RICE_magadha_inspired_bodhi_tree_sujata:0 "被牧女苏耶妲的行为所激励"
 RICE_magadha_inspired_bodhi_tree_sujata_desc:0 "在沐浴了伽耶的菩提树之后，该角色被牧女苏耶妲的传说所激励，相传当佛祖在树下打坐时，牧女苏耶妲给他了一碗用米、栗等熬的粥。佛祖吃后精力充沛，来到菩提树下幡然觉悟，彻悟成道并创立了佛教，而苏耶妲成为佛祖第一批女弟子之一。"
 RICE_magadha_inspired_bodhi_tree_pushyamitra:0 "启发于弗沙蜜多罗之败"
 RICE_magadha_inspired_bodhi_tree_pushyamitra_desc:0 "在加雅的菩提树下沐浴之后，该角色受启发于弗沙蜜多罗的传说。相传弗沙蜜多罗原是孔雀王朝最后一代帝王布里哈陀罗的将军，但是他弒王篡位后，成为巽伽王朝的开国国君，据说他是一个残忍的人，还得到了#italic 夜叉#!支持，因此他通过破坏圣地和杀死僧伽来压迫佛教。然而当他砍下菩提树时，菩提树化为一个美丽的女人，并杀死了他。"
 RICE_magadha_inspired_bodhi_tree_jaya_sri_maha_bodhi:0 "启发于阇耶室利摩诃菩提树"
 RICE_magadha_inspired_bodhi_tree_jaya_sri_maha_bodhi_desc:0 "在伽耶的菩提树下沐浴之后，该角色受启发于#italic 阇耶室利摩诃菩提树#!的传说。相传这棵树是菩提伽耶摩诃菩提树南枝衍生出来的，阿育王的女儿带南枝前往室利楞伽并种下。"
 RICE_magadha_inspired_bodhi_tree_navel_of_the_earth:0 "受启发于大地之脐"
 RICE_magadha_inspired_bodhi_tree_navel_of_the_earth_desc:0 "在加雅的菩提树下沐浴之后，该角色受到了佛教传说的启发，即为什么这个地方被认为是“大地之脐”。据说这个地方是唯一能够支撑佛陀开悟的地方，而且据说当这个世界轮回时，菩提树将是最后一个消失的地方，而且当新的劫数开始时，它也将是第一个重新出现的地方。"
 RICE_magadha_learning_about_magadha_history:0 "了解摩揭陀的历史"
 RICE_magadha_learning_about_magadha_history_buddhist_or_jain:0 "了解摩揭陀的历史"
 RICE_magadha_buddhist_pilgrims_supported:0 "支持佛教徒前往菩提伽耶朝圣"
 RICE_magadha_mentioned_by_a_buddhist_pilgrim:0 "佛教朝圣者记录中提到的"
 RICE_magadha_bathe_the_bodhi_tree:0 "在菩提伽耶的菩提树下沐浴"
 RICE_magadha_bathe_the_bodhi_tree_tooltip:0 "我们必须记住在菩提伽耶发生的事情"
 RICE_magadha_bathe_the_bodhi_tree_desc:0 "几个世纪前，佛祖在菩提伽耶的菩提树下开悟。每年无论高低贵贱的信徒们都会聚集在这棵树下，沐浴佛法，并给予关注，以纪念这里发生的一切。今年我希望加入他们。"
 RICE_magadha_bathe_the_bodhi_tree_effect_tooltip_1:0 "你将去菩提树下参加灌溉和沐浴仪式，并获得随机数量的[piety|E]。"
 RICE_magadha_bathe_the_bodhi_tree_effect_tooltip_2:0 "你也可能在菩提树下#P 开悟#!，让你获得几个不同的[character_modifiers|E]。"
 RICE_magadha_bathe_the_bodhi_tree_confirm:0 "我们必须尊重和保护它。"
 RICE_magadha_bathe_the_bodhi_tree_context_tooltip:0 "#emphasis 历史背景：#!7世纪唐朝僧侣、朝圣者和旅行家玄奘在他的记述中提到，每年在卫塞节（通常是4月或5月），人们会聚集在菩提树下，用香水和牛奶浇灌和沐浴这棵树。这一点后来得到了13世纪的吐蕃朝圣者和僧侣达摩斯瓦明的证实。千百年来，尽管这棵树曾经多次被砍伐或毁坏，但总是被重新种植。"
 RICE_decision_magadha_bodhi_tree_bath_month_req:0 "月份在二月、三月或四月"
 RICE_decision_magadha_bodhi_tree_bath_distance_req:0 "[realm_capital|E]靠近#V 加雅#!的[county|E]"
 RICE_magadha_donate_holy_site:0 "建设地方佛教场所"
 RICE_magadha_donate_holy_site_tooltip:0 "我必须展示我的信仰和奉献。"
 RICE_magadha_donate_holy_site_desc:0 "作为一个希望为[ROOT.Char.GetFaith.GetAdherentName]积累大功德的[ROOT.Char.GetHerselfHimself]，我希望捐献资金，建造一个新的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教场所。这样我就可以尊敬佛陀，传播佛法，并帮助僧团。"
 RICE_magadha_donate_holy_site_effect_tooltip_1:0 "你将首先选择捐款是用于建造佛塔、寺庙还是僧院，这将为你带来[piety|E]、[prestige|E]和[dynasty_prestige|E]等不同的好处，并为你的[realm_capital|E]提供相应的[character_modifier|E]和[county_modifier|E]"
 RICE_magadha_donate_holy_site_effect_tooltip_2:0 "你将首先选择捐款是用于建造佛塔、寺庙还是僧院，这将为你带来[piety|E]、[prestige|E]和[dynasty_prestige|E]等不同的好处，并为你的[realm_capital|E]提供相应的[character_modifier|E]和[county_modifier|E]#weak （注意：宝塔是可以作为你的一个选择，因为[THIS.Char.GetFaith.GetName]遵循[GetDoctrineType('rice_mahayana_canon_doctrine').GetBaseName]）#!"
 RICE_magadha_donate_holy_site_effect_tooltip_3:0 "然后，你将决定这个宗教场所的规模，这决定了加成的强度和需要多大的捐赠。#weak （最低花费：@gold_icon! 100）#!"
 RICE_magadha_donate_holy_site_effect_tooltip_4:0 "整个建设过程将需要一年到两年的时间。"
 RICE_magadha_donate_holy_site_req:0 "你的[realm_capital|E]没有一个[county_modifier|E]，表明那里最近建有一个[GetPlayer.GetFaith.GetReligion.GetAdjective]的圣地。"
 RICE_magadha_currently_building_holy_site_req:0 "未在建设佛教宗教场所"
 RICE_magadha_donate_holy_site_confirm:0 "为了佛门三宝！"
 RICE_magadha_donate_holy_site_context_tooltip:0 "#emphasis 历史背景：#!自从佛教创立以来，精英阶层常常赞助建造或维护宗教场所，以此作为积累巨大功德的方式。"
 RICE_magadha_donate_nalanda:0 "布施于那烂陀大学"
 RICE_magadha_donate_nalanda_tooltip:0 "佛陀的教义必须传承下去。"
 RICE_magadha_donate_nalanda_desc:0 "作为一个强大的[ROOT.Char.GetTitleAsNameNoTooltip]，我有责任帮助有学识的圣人研究和传播[ROOT.Char.GetFaith.GetAdjective]教义。最简单方法之一是向摩揭陀的伟大的那烂陀大学提供大量捐赠，该大学是[ROOT.Char.GetFaith.GetReligion.GetAdjective]学习中心。"
 RICE_magadha_donate_nalanda_effect_tooltip_1:0 "你将选择你希望支持的那烂陀大学运作或基础设施的哪一方面，这将决定你获得的[character_modifier|E]和加成的类别，以及捐赠的规模。#weak （最低花费：@gold_icon! 40）#!"
 RICE_magadha_donate_nalanda_effect_tooltip_2:0 "因为你的[realm_capital|E]位于[region|E]，离[magadha_county.GetNameNoTier]不太远，所以你也可以选择向大学捐赠资金。"
 RICE_magadha_donate_nalanda_confirm:0 "祝那烂陀继续繁荣！"
 RICE_magadha_donate_nalanda_context_tooltip:0 "#emphasis 历史背景：#!在整个历史上，那烂陀在其历史上一直得到了平民和精英阶层的捐赠和赠款的经济支持。其中一些甚至来自远离印度的土地。例如，九世纪印度尼西亚的室利佛逝国王巴拉普特拉，是那烂陀的著名赞助人，他为那烂陀提供了几个村庄的收入作为赠款，用于维护那烂陀，并在那里建造了一座寺院。"
 RICE_magadha_donate_mahabodhi:0 "布施于摩诃菩提寺"
 RICE_magadha_donate_mahabodhi_tooltip:0 "佛陀开悟的地点必须被保留下来。"
 RICE_magadha_donate_mahabodhi_desc:0 "作为一个强大的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我有责任以任何方式保护和帮助[ROOT.Char.GetFaith.GetReligion.GetAdjective]#italic 和尚#!或僧伽团。因此我希望向信仰[ROOT.Char.GetFaith.GetReligion.GetName]的菩提伽耶捐款，以支持那里的和尚和朝圣者。"
 RICE_magadha_donate_mahabodhi_effect_tooltip_1:0 "你将选择向摩诃菩提寺捐献多少钱，决定你获得的奖励和[character_modifier|E]。#weak （最低花费：@gold_icon! 50）#!"
 RICE_magadha_donate_mahabodhi_effect_tooltip_2:0 "如果你的最高[title|E]至少是[king|E][title_tier|E]，而且[gaya_county.GetNameNoTier]目前没有[GetModifier('RICE_magadha_great_royal_donation_mahabodhi').GetNameWithTooltip][county_modifier|E]，你可以选择支付#V @gold_icon!300#!来赞助摩诃菩提的大规模建设和维修项#X 这是一个远远超出常规的项目！这种类型的捐赠一生只能做一次。#!"
 RICE_magadha_donate_mahabodhi_confirm:0 "为了佛门三宝！"
 RICE_magadha_donate_mahabodhi_context_tooltip:0 "#emphasis 历史背景：#!在古典时期和中世纪时期，摩诃菩提寺得到了来自佛教世界各地的信徒和僧侣的捐赠而得以维持和扩建。这些捐赠包括食物、供奉塔、建筑修缮和新设施的建造等。例如，在11世纪和13至14世纪，缅甸国王为寺院建筑群提供了大规模的重建资金。"
 RICE_magadha_life_liberation:0 "准备放生仪式"
 RICE_magadha_life_liberation_tooltip:0 "世界纷扰不断，须早日开脱"
 RICE_magadha_life_liberation_desc:0 "[ROOT.Char.GetFaith.GetAdjective]经文指出，我们不应该伤害动物，并尽我们所能来保护它们。我与当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]协商并举行放生仪式，让我们解放原本注定要被宰杀的动物，这将有助于我展示虔诚。"
 RICE_magadha_life_liberation_effect_tooltip_1:0 "你将选择释放什么样的动物，决定你获得什么样的加成和[character_modifiers|E]"
 RICE_magadha_life_liberation_effect_tooltip_2:0 "加成强度取决于释放动物的数量以及规模#weak （最低花费：@gold_icon! 25）#!"
 RICE_magadha_life_liberation_confirm:0 "让我们为所有众生做这件事。"
 RICE_magadha_life_liberation_context_tooltip:0 "#emphasis 历史背景：#!如今，所有佛教派别的信徒，尤其是大乘佛教和金刚乘佛教的信徒，都会进行放生仪式。但放生仪式很可能起源于隋唐时期，也许是源于中国本土的做法。即使在那个时代，佛教徒也意识到了这种做法的道德问题、环境影响，以及它可能是一种戏剧性的、肤浅的行为，而不是出于对动物福祉的真诚关怀。为了解决这些潜在的问题，一些亚洲国家也试图改革这种做法。"
 RICE_magadha_observe_vassa:0 "在结夏安居期间戒除恶习"
 RICE_magadha_observe_vassa_tooltip:0 "这仅仅只有三个月……"
 RICE_magadha_observe_vassa_desc:0 "每年，所有[ROOT.Char.GetFaith.GetAdherentNamePlural]，无论是僧侣还是世俗之人，都要遵守为期三个月的结夏安居。虽然我不是僧侣，我可以在结夏安居修炼，以示虔诚。"
 RICE_magadha_observe_vassa_effect_tooltip_1:0 "你将放弃各种恶习，有可能为你获得不同的[character_modifiers|E]和[piety|E]等加成。"
 RICE_magadha_observe_vassa_effect_tooltip_2:0 "在结夏安居进行时，你可能有[GetModifier('RICE_magadha_currently_abstaining_vassa').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_observe_vassa_effect_tooltip_3:0 "在结夏安居结束时，你可以参加#italic 供僧衣节#!，并向僧侣捐赠，以获得额外的奖励。#weak （最低花费：@gold_icon! 25）#!"
 RICE_magadha_observe_vassa_effect_tooltip_trait.lustful:0 "作为[GetTrait('lustful').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('chaste').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.greedy:0 "作为[GetTrait('greedy').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('generous').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.sadistic:0 "作为[GetTrait('sadistic').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('compassionate').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.callous:0 "作为[GetTrait('callous').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('compassionate').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.wrathful:0 "作为[GetTrait('wrathful').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('calm').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.vengeful:0 "作为[GetTrait('vengeful').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('forgiving').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.gluttonous:0 "作为[GetTrait('gluttonous').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的概率改过自新，成为[GetTrait('temperate').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.arrogant:0 "作为[GetTrait('arrogant').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的几率改过自新，成为[GetTrait('humble').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_effect_tooltip_trait.impatient:0 "作为[GetTrait('impatient').GetName( GetPlayer )]在结夏安居期间会有独特的挑战和机会，你甚至有很小的几率改过自新，成为[GetTrait('patient').GetName( GetPlayer )]！"
 RICE_magadha_observe_vassa_confirm:0 "这将是一次充实的精神之旅。"
 RICE_magadha_observe_vassa_context_tooltip:0 "#emphasis 历史背景：#!在印度，每逢雨季，早期的佛教徒就会停止远游，进行结夏安居，以免在恶劣的天气中伤害庄稼、昆虫或自己。结夏安居仍然是东南亚的上座部佛教徒的传统；在瓦萨期间，一些在家众采取更严格的生活方式，甚至发愿出家，而且随后还有欢乐的供僧衣节。生活在不同气候地区的非上座部佛教徒，大多已经放弃了这种形式的结夏安居，尽管他们可能会遵守其他形式的闭关。"
 RICE_decision_magadha_vassa_month_req:0 "月份是在四月至六月之间，在七月结夏安居正式开始之前"
 RICE_magadha_visit_rajgir_hot_springs:0 "参观王舍城的温泉"
 RICE_magadha_visit_rajgir_hot_springs_tooltip:0 "在[hot_springs_of_rajgir_short|E]有很多神奇的温泉，我可以去看看。"
 RICE_magadha_visit_rajgir_hot_springs_desc:0 "几个世纪以来，[hot_springs_of_rajgir|E]一直被佛教徒、印度教徒和耆那教徒尊崇为神圣的地方，称赞其具有净化和治疗的功效。也许我也是时候准备去温泉了！"
 RICE_magadha_visit_rajgir_hot_springs_effect_tooltip_1:0 "你将花时间前往[rajgir_barony.GetNameNoTier]的一个温泉，以失去[stress|E]并获得[piety|E]。"
 RICE_magadha_visit_rajgir_hot_springs_effect_tooltip_2.buddhist:0 "因为[rajgir_barony.GetNameNoTier]温泉的宗教设施目前反映了[THIS.Char.GetFaith.GetReligion.GetAdjective]在那里占主导地位，你也将得到[GetModifier('RICE_magadha_rajgir_bonus_buddhist').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_visit_rajgir_hot_springs_effect_tooltip_2.hindu:0 "因为[rajgir_barony.GetNameNoTier]温泉的宗教设施目前反映了[THIS.Char.GetFaith.GetReligion.GetAdjective]在那里占主导地位，你也将得到[GetModifier('RICE_magadha_rajgir_bonus_hindu').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_visit_rajgir_hot_springs_effect_tooltip_2.jain:0 "因为[rajgir_barony.GetNameNoTier]温泉的宗教设施目前反映了[THIS.Char.GetFaith.GetReligion.GetAdjective]在那里占主导地位，你也将得到[GetModifier('RICE_magadha_rajgir_bonus_jain').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_visit_rajgir_hot_springs_confirm:0 "我们动身吧！"
 RICE_magadha_visit_rajgir_hot_springs_context_tooltip:0 "#emphasis 历史背景：#!王舍城周边有许多温泉，佛教徒、印度教徒和耆那教徒都认为它们是神圣的，而且还有各种传说与它们相关。例如，耆那教和佛教的创始人，即摩诃毗罗和释迦牟尼，据说经常在这些温泉中沐浴。中国的朝圣者和僧侣玄奘曾记载，许多人——尤其是那些患有疾病和慢性病的人——纷纷涌向这些温泉寻求治愈。几个世纪以来，这三个宗教的信徒都试图通过同化、调和和争夺，来改变该地区现有的宗教景观，以适应自己的社区。"
 RICE_magadha_convert_rajgir_hot_springs:0 "重新利用王舍城的温泉"
 RICE_magadha_convert_rajgir_hot_springs_tooltip:0 "我们应该在[hot_springs_of_rajgir_short|E]更多地支持[ROOT.Char.GetFaith.GetReligion.GetName]。"
 RICE_magadha_convert_rajgir_hot_springs_desc:0 "几个世纪以来，佛教徒、印度教徒和耆那教徒一直推崇[hot_springs_of_rajgir|E]，因为其具有净化和治愈作用。目前的宗教景观可以得到改变，以更好地满足任何[ROOT.Char.GetFaith.GetReligion.GetAdjective]信徒来到这里的精神需求。例如我们可以调整那里现有的异教建筑，使其改用[ROOT.Char.GetFaith.HighGodName]，并派[ROOT.Char.Custom('DefaultPriestTitlePlural')]来监督这项工作。"
 RICE_magadha_convert_rajgir_hot_springs_effect_tooltip_1.buddhist:0 "佛教[rulers|E]采取去[hot_springs_of_rajgir|E]的[decide|E]时，现在会获得[GetModifier('RICE_magadha_rajgir_bonus_buddhist').GetNameWithTooltip][character_modifier|E]。"
 RICE_magadha_convert_rajgir_hot_springs_effect_tooltip_1.hindu:0 "印度教[rulers|E]采取[hot_springs_of_rajgir|E]的[decide|E]时，现在会获得[GetModifier('RICE_magadha_rajgir_bonus_hindu').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_convert_rajgir_hot_springs_effect_tooltip_1.jain:0 "耆那教[rulers|E]采取[hot_springs_of_rajgir|E]的[decide|E]时，现在会获得[GetModifier('RICE_magadha_rajgir_bonus_jain').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_convert_rajgir_hot_springs_effect_tooltip_2.buddhist:0 "佛教[rulers|E]采取去[hot_springs_of_rajgir|E]的[decide|E]时，#N 不再#!获得[GetModifier('RICE_magadha_rajgir_bonus_buddhist').GetNameWithTooltip][character_modifier|E]。"
 RICE_magadha_convert_rajgir_hot_springs_effect_tooltip_2.hindu:0 "印度教[rulers|E]采取[hot_springs_of_rajgir|E]的[decide|E]时，#N 不再#!获得[GetModifier('RICE_magadha_rajgir_bonus_hindu').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_convert_rajgir_hot_springs_effect_tooltip_2.jain:0 "耆那教[rulers|E]采取[hot_springs_of_rajgir|E]的[decide|E]时，#N 不再#!得[GetModifier('RICE_magadha_rajgir_bonus_jain').GetNameWithTooltip][character_modifier|E]"
 RICE_decision_magadha_convert_rajgir_req:0 "位于#V 摩揭陀#![county|E]的#P 王舍城温泉#![county_modifier|E]的[religion|E]目前与你的[religion|E]不一致。"
 RICE_magadha_convert_rajgir_hot_springs_confirm:0 "为了[ROOT.Char.GetFaith.HighGodName]！"
 RICE_magadha_convert_rajgir_hot_springs_context_tooltip:0 "$RICE_magadha_visit_rajgir_hot_springs_context_tooltip$"
 RICE_magadha_claim_pithipati_title:0 "宣称金刚座之主的衣钵"
 RICE_magadha_claim_pithipati_title_tooltip:0 "我们是菩提伽耶的守护者。"
 RICE_magadha_claim_pithipati_title_desc:0 "作为一个虔诚的[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我管理菩提伽耶周围的圣地。替全世界的佛教徒来维护它，是一种巨大的荣誉，但也是一种巨大的责任。我希望要求获得[pithipati|E]的称号，即金刚座之主，以强调我是一位圣地的守护者。"
 RICE_magadha_claim_pithipati_title_effect_tooltip_1:0 "从现在开始，任何[THIS.Char.GetFaith.GetReligion.GetAdjective][rulers|E]的[gaya_county.GetNameNoTier]将自动获得[GetModifier('RICE_magadha_pithipati_of_bodh_gaya').GetNameWithTooltip][character_modifier|E]"
 RICE_magadha_claim_pithipati_title_effect_tooltip_2:0 "作为[pithipati|E]，你可以获得[THIS.Char.GetFaith.GetReligion.GetAdjective][decisions|E]，并有大量加成"
 RICE_magadha_claim_pithipati_title_confirm:0 "我们是佛门三宝守护者"
 RICE_magadha_claim_pithipati_title_context_tooltip:0 "#emphasis 历史背景：#!#italic Pithipati#!是中世纪印度当地支拘荔王朝使用的一个称号，意为金刚座之主。金刚座指的是菩提伽耶的一个确切地点，传说佛祖就是在那里开悟的。因此几个世纪以来支拘荔王朝一直充当着菩提伽耶周围圣地的守护者与管理者。"
