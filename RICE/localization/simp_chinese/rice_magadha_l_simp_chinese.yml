 magadha.0070.t:0 "准备结夏安居"
 magadha.0070.desc:0 "结夏安居就快到了！很快，[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]将退居寺院，只专注于冥想和研究[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.GetReligion.GetAdjective]经文以及进行其他修行事项。\n\n像我这样的教友通常也会利用这段时间进行修行，过有德行的生活。然而今年我想把它提升到另一个层次。有一些教友发誓要进行苦行，如减少食用肉类和饮用酒水，并克制欲望，如滥交或杀戮。\n\n我也发过这样的誓言。\n\n一旦结夏安居开始，我将准备戒除这些恶习，希望我能坚持住。"
 magadha.0070.a:0 "我必须做好准备。"
 magadha.0071.t:0 "结夏安居开始：三宝日"
 magadha.0071.desc:0 "今天是#italic 三宝日#!，也是结夏安居的第一天！三宝日是为了纪念佛祖启动法轮的周年纪念日；他首次讲授了四圣谛：这世上存在着痛苦，痛苦是由欲望引起的；有一种超越痛苦和欲望的状态，即涅槃；最后，通往涅槃的途径是八正道。\n\n总之像往常一样，我去当地的寺庙向[ROOT.Char.Custom('DefaultPriestTitlePlural')]致意，听他们讲法，并参与祈祷。然而今年我也将尽力戒除各种恶习，当然减少过度行为，这应该不会影响我的生活。"
 magadha.0071.a:0 "我希望能获得成功"
 magadha.0071.a.tooltip:0 "因为你至少有几个负面的[traits|E]中的一个变成了正面特性。"
 magadha.0072.t:0 "结夏安居结束：供僧衣节"
 magadha.0072.desc:0 "经过漫长的三个月，结夏安居现在结束了。今年我采取了更多的苦行，并试图戒除各种恶习。无论我是成功还是失败，重要的是我至少尝试了。迟早我可以按照佛祖的教义过上幸福的日子。\n\n结夏安居结束之后是#italic 供僧衣节#!。在传统上人们会举行游行和仪式来庆祝僧伽闭关的结束，这也是我们留发僧向[ROOT.Char.Custom('DefaultPriestTitlePlural')]赠送礼物以表示感激的时候。也许我应该送一份礼物来感谢他们的教诲，特别是帮助我在今年戒除恶习。"
 magadha.0072.a:0 "我不认为给他们送礼是必要的。"
 magadha.0072.b:0 "我将捐献一些基本的生活用品和施舍。"
 magadha.0072.c:0 "我将按照传统捐献新的僧衣。"
 magadha.0073.t:0 "诱惑"
 magadha.0073.desc.intro:0 "在这个结夏安居期间，我已经尽力克制了一些恶习，如沉溺于食物，滥交，以及易怒。然而我已经开始感觉到压力了。"
 magadha.0073.desc.conclusion:0 "\n\n在结夏安居期间，我不应该被这些东西诱惑，集中精力坚持克制欲望！"
 magadha.0073.desc.lustful:0 "\n\n事实上，我发现我很难放下我的[GetTrait('lustful').GetName( GetPlayer )]欲望。一直以来都是这样，无论走到哪里，我都会沉溺于肉欲! 自从结夏安居开始以来，我一直试图压制欲望，然而即使看到一点裸露皮肤，我#italic 都#!会浮想联翩。当然美是无常的，快乐是短暂的，所以欲望会导致我的毁灭……但是它是如此的有趣！"
 magadha.0073.desc.greedy:0 "\n\n事实上，我发现我很难放下我的[GetTrait('greedy').GetName( GetPlayer )]欲望。在这个问题上，[ROOT.Char.Custom('DefaultPriestTitlePlural')]是很清楚的。如果我要成为一个好的[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，我必须学会与他人分享，然而我为什么要把#italic 我的#!的东西施舍给别人，为什么！？诚然，这些东西生不来死带不去，万事无常，我的财富终将消散，然而这些都是我的……哪怕是暂时的！"
 magadha.0073.desc.sadistic:0 "\n\n事实上，我发现我很难放下我的[GetTrait('sadistic').GetName( GetPlayer )]欲望。我喜欢看到别人受苦，其他人可能不认为这是一种好的品质，也许它确实不是，但它只是如此……令人愉悦。别人恐惧、痛苦、流血让我感到幸福！我知道阿育王，佛教史上最伟大的赞助人，曾经是一个嗜血、残暴的人，就像有些人口中的我。不知何故，他改过自新。我不知道我也会改过自新……但我必须尝试……"
 magadha.0073.desc.callous:0 "\n\n事实上，我发现我很难放下我的[GetTrait('callous').GetName( GetPlayer )]欲望。很多人都说我不关心任何人。并不是说我一定很残忍（也许是真的），但我只是对别人不太关心，毕竟这不关我事。佛陀教导我们要善待芸芸众生。然而既然每个人出生都有贵贱，那我为什么要在乎他人呢？一点点虚假的善意有什么用呢？"
 magadha.0073.desc.vengeful:0 "\n\n事实上，我发现我很难放下我的[GetTrait('vengeful').GetName( GetPlayer )]欲望。我很容易记仇，我喜欢尽可能尽快的报复回去。为什么我必须坐在那里受苦，而让别人在冤枉我之后仍然逍遥法外？这是不对的。即使是现在在结夏安居期间，当我想到那些敢于冒犯我的蠢货时，我就忍不住要发火，这让我很痛苦。话又说回来……我肯定冤枉了很多人，让别人受苦，即使是无意的。说不定有很多人也想对我进行报复？"
 magadha.0073.desc.wrathful:0 "\n\n事实上，我发现我很难放下我的[GetTrait('wrathful').GetName( GetPlayer )]倾向。作为一个易怒之人，一切东西都那么容易激怒我。即使在结夏安居期间，讽刺的是我对自己无法控制愤怒的事情感到愤怒！我怎么可能放松，更不用说放下了！！[ROOT.Char.GetFaith.GetReligion.GetAdjective]经文中经常描述愤怒就像一把火，会吞噬一切。我必须深呼吸，让自己平静下来……然而……该死！我做不到！"
 magadha.0073.desc.gluttonous:0 "\n\n事实上，我发现我很难放下我的[GetTrait('gluttonous').GetName( GetPlayer )]欲望。与其他恶行相比，享受美食并不坏，所以我为什么要为此感到内疚？在结夏安居期间克制自己的欲望是很难的。但佛陀说的是真的：贪婪导致痛苦。在放纵和禁欲主义之间必须有一个平衡，但我不知道我是否能找到佛陀所说的这个中庸之道……"
 magadha.0073.desc.arrogant:0 "\n\n事实上，我发现我很难放下我的[GetTrait('arrogant').GetName( GetPlayer )]欲望。我的意思是，谁能责怪我呢？外面有很多人根本不懂欣赏我的伟大。这个结夏安居一直很烦，因为我得尽量不夸耀自己的伟大事迹。然后……也许过度的骄傲会导致一个人做些相当愚蠢、鲁莽的事情。佛陀敦促人们在所有事情上都要谨慎和深思熟虑。但是...我不夸耀自己的事迹如同锦衣夜行！"
 magadha.0073.desc.impatient:0 "\n\n尤其是，我发现我很难放下我的[GetTrait('impatient').GetName( GetPlayer )]欲望。长期以来，我对事情的态度就是发生的越快越好，最好现在就发生，我想这并不是世界上最糟糕的恶习，但现在结夏安居已经顺利进行，我发现我的烦躁一直在影响着我。为什么我对奢侈品的渴望无法消失？为什么我那些淫欲不能放过我？也许我需要深吸一口气，放松一下……该死！结夏安居怎么还没有结束？"
 magadha.0073.a:0 "它很快就会结束，马上我就可以解脱了！"
 magadha.0073.b:0 "以佛门三宝名义，集中精力！"
 magadha.0073.failure:0 "你忍不住沉溺于你的恶习中"
 magadha.0073.helped:0 "你克制自己不沉溺于恶习"
 magadha.0073.success:0 "你戒掉恶行了"
 magadha.0074.t:0 "精读经文"
 magadha.0074.desc:0 "虽然我不是[ROOT.Char.Custom('DefaultPriestTitle')]，因此不期望在结夏安居期间广泛研究[ROOT.Char.GetFaith.GetReligion.GetAdjective]经文，但我仍然可以花时间研究它们。至少现在我每天都会花时间阅读#italic 《大藏经》#!这一古老的经文集，以更好地理解佛陀的教义。"
 magadha.0074.a:0 "在结夏安居期间，这样做对我有很大的帮助！"
 magadha.0074.b:0 "也许我应该定期这样做，即使在结夏安居结束后……"
 magadha.0075.t:0 "对僧侣的帮助"
 magadha.0075.desc:0 "在结夏安居期间，像我这样的教友习惯于为当地寺庙的[ROOT.Char.Custom('DefaultPriestTitlePlural')]经常提供帮助。例如我们向他们提供香火钱和物资。另一方面，在我作为[ROOT.Char.GetTitleAsNameNoTooltip]的职责之外，我确实想专注于提高自己毕竟我有大把时间。"
 magadha.0075.a:0 "在结夏安居期间，专注于自己是很重要。"
 magadha.0075.b:0 "我应该去看看本地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]是否需要什么。"
 magadha.0076.t:0 "别人的失误"
 magadha.0076.desc:0 "在结夏安居期间，我知道其他教友也发了和我类似的誓言，如减少或者抵制恶行，并从事善行。然而并不是所有的人似乎都在认真对待这些誓言，有些人像我一样没能戒除恶习。"
 magadha.0076.a:0 "真不幸，我可以从中吸取些教训。"
 magadha.0076.b:0 "我应该专注于自己，而不是在乎别人做或不做什么。"
 magadha.0077.t:0 "别人的成功"
 magadha.0077.desc:0 "在结夏安居期间，我知道其他教友也发了和我类似的誓言，如减少或者抵制恶行，并从事善行。他们中的一些人做得令人钦佩，完美得克制了自己。看到其他人所能取得的成就，非常鼓舞人心!"
 magadha.0077.a:0 "他们行，那我也行！"
 magadha.0078.t:0 "僧院需要帮助"
 magadha.0078.desc:0 "我听说当地的一个佛寺缺少物资。通常情况下这不是一个大问题，因为[ROOT.Char.Custom('DefaultPriestTitlePlural')]可以出去化缘。\n\n然而在结夏安居期间，[ROOT.Char.Custom('DefaultPriestTitlePlural')]不被鼓励到佛寺以外的地方去，而且对此有严格规定，即使他们有合理的理由，但是像我这样的俗人有责任协助他们，使他们能够专注于修行。"
 magadha.0078.a:0 "我为什么要参与？"
 magadha.0078.b:0 "给佛寺一些布施。"
 magadha.0078.c:0 "给佛寺大量布施！"
 magadha.0079.t:0 "聆听讲法"
 magadha.0079.desc:0 "虽然[ROOT.Char.Custom('DefaultPriestTitlePlural')]在结夏安居期间主要专注于冥想、诵经和其他修行，但当我们去给他们布施时，有些人也会抽时间给像我这样的俗人讲法。今天我参加了一个这样的弘扬佛法场次，这位和尚是一位著名的[ROOT.Char.Custom('DefaultPriestTitle')]，他阐述了各种与佛陀教义有关的各种主题。听了他的话语，将会对我修炼有更好的帮助。"
 magadha.0079.a:0 "很高兴我参加了这次布道会。"
 magadha.0080.t:0 "诵经"
 magadha.0080.desc:0 "在结夏安居期间，今天我正在诵读各种[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.GetReligion.GetAdjective]的经文。它正在帮助我集中精力，当然这样我更好的提高自己的意志。"
 magadha.0080.a:0 "在佛、法、僧之间……"
 magadha.0081.t:0 "什么都找不到"
 magadha.0081.desc:0 "在结夏安居期间，买到食物和酒水是个问题，因为这并不容易。正如许多人在这段时间试图减少放纵一样，店家和商人也会减少出售这些酒肉。不幸的是，我很难买到足够东西来满足我即将举办的一些活动和聚会。\n\n由于我不是[ROOT.Char.Custom('DefaultPriestTitle')]，如果我想买一些这样的东西，特别是它能帮助我展现作为[ROOT.Char.GetTitleAsNameNoTooltip]的各种职责和责任，这也不一定有人为难我。但我已经同意今年戒除恶习或减少恶习，所以也许这是一个机会，让我把它付诸实践，让我说到做到……"
 magadha.0081.a:0 "作为一个[ROOT.Char.GetTitleAsNameNoTooltip]，我不能让别人看到我的狼狈！"
 magadha.0081.b:0 "以后再买也行。"
 magadha.0082.t:0 "智慧与洞悉"
 magadha.0082.desc:0 "一些当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]知道我在这次结夏安居期间发誓戒除恶习，并赞扬我为[ROOT.Char.GetFaith.GetReligion.GetAdjective]社区和和尚们树立了榜样。特别是一位[ROOT.Char.Custom('DefaultPriestTitle')]，他对我提供的指导和建议非常感兴趣，并告诉我如何管理自己和修行佛法，以及在结夏安居期间[ROOT.Char.Custom('DefaultPriestTitle')]什么该做什么不该做。"
 magadha.0082.a:0 "我非常感谢你的智慧和见解。"
