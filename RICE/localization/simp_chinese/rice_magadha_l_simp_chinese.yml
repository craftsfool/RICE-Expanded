 magadha.0100.t:0 "摩揭陀的古老传说"
 magadha.0100.desc:0 "据说，佛教和耆那教的创始人释迦牟尼和筏驮摩那在古代曾经经常出入[magadha_duchy.GetNameNoTier]的许多地方，在那里至今有许多与他们有关的传说。今天一位学者正在告诉我与这两位人物有关的几个传说，例如在我统治的领土内，他们访问过什么地方，他们在哪里宣扬教教义，他们遇到了谁，以及他们在那里做了什么。"
 magadha.0100.a:0 "想到[magadha_duchy.GetNameNoTier]竟然充满了这样的历史！"
 magadha.0101.t:0 "佛教朝觐者"
 magadha.0101.desc:0 "最近，由于[magadha_duchy.GetNameNoTier]周围地区充满了许多重要的佛教崇拜和专研佛法场所，有大量的佛教朝圣者涌入[capital_province.GetName]。我考虑过采取一些政策来支持这些朝圣者，比如提供资金建造更多的旅馆，或者鼓励商人前来向他们出售各种必需品。"
 magadha.0101.a:0 "这样既帮助了他们也促进了经济！"
 magadha.0101.b:0 "我没有多余的资金来这样做。"
 magadha.0101.c:0 "我为什么要支持异教徒？"
 magadha.0102.t:0 "[rajgir_barony.GetNameNoTier]之旅"
 magadha.0102.desc:0 "[rajgir_visitor.GetTitledFirstName]最近刚从[rajgir_barony.GetNameNoTier]的泉水回来，既是为了放松，也是为了在那里祈祷和进行灵修，因为泉水一直被[ROOT.Char.GetFaith.GetAdherentNamePlural]的几代人所推崇。但是不得不说，[rajgir_visitor.GetSheHe]似乎玩得很开心！"
 magadha.0102.a:0 "欢迎回来！"
 magadha.0103.t:0 "学习我们的和平之道……"
 magadha.0103.desc:0 "在[magadha_duchy.GetNameNoTier]附近的一些著名的佛教、印度教和耆那教的苦行僧最近陷入了一些关于彼此信仰教义差别的大型公开辩论。我只是偶尔参与其中，但也许现在是我介入的时候了，以确保这些……争论不会失去控制，不会造成骚乱。多年来，这些团体都在该地区共存，但由于他们要争夺发展空间和资源，往往会出现很多紧张的局面，所以这并不是什么新鲜事。"
 magadha.0103.a:0 "我必须支持[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]！"
 magadha.0103.b:0 "我需要保持中立，以确保一切井然有序。"
 magadha.0103.c:0 "我不关心异教徒的争吵。"
 magadha.0104.t:0 "朝圣者记录"
 magadha.0104.desc:0 "一个名叫[xuanzang.GetFullName]的[xuanzang.GetFaith.GetReligion.GetAdjective][xuanzang.Custom('DefaultPriestTitle')]从异国他乡而来，目前正穿越我的领土，拜访我的宫廷。[xuanzang.GetSheHe|U]打算从印度收集[xuanzang.GetFaith.GetReligion.GetAdjective]经书并带回其祖国，以便在那里更好地传播佛法。\n\n除此之外，[xuanzang.GetFullName]正在对[xuanzang.GetSheHe]所经过的国家和王国进行细致的记录，以记录[xuanzang.GetSheHe]在这里所看到的一切并告诉家乡的每一个人。因此[xuanzang.GetSheHe]一直在问我关于我王国里的生活和文化等各种问题。\n\n我想确保我留下一个美好的印象，这样当[xuanzang.GetSheHe]回到[xuanzang.GetHerHis]的家乡并在[xuanzang.GetHerHis]的记录中提到我时，[xuanzang.GetSheHe]会对我和我的人民产生好感。"
 magadha.0104.a:0 "我们的人民对[ROOT.Char.GetFaith.HighGodName]的虔诚和信仰。"
 magadha.0104.b:0 "我们的军队和政体"
 magadha.0104.c:0 "我们的土地是如何的美丽，就像[xuanzang.GetFirstNamePossessiveNoTooltip]祖国一样"
 magadha.0104.toast:0 "[xuanzang.GetFullName]非常重要！"
