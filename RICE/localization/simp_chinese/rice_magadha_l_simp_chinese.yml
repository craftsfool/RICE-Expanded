 magadha.0089.t:0 "结夏安居提前结束"
 magadha.0089.desc:0 "我现在是[ROOT.Char.GetFaith.GetName]的信徒，并信仰[ROOT.Char.GetFaith.HighGodName]。因此结夏安居与我不再有任何关联，我也不再参所谓的戒除恶习。"
 magadha.0089.a:0 "我现在毕竟是个[ROOT.Char.GetFaith.GetAdherentName]。"
 magadha.0090.t:0 "布施于那烂陀大学"
 magadha.0090.desc:0 "几个世纪以来，那烂陀大学一直是[ROOT.Char.GetFaith.GetReligion.GetName]的一个重要的学习和宗教中心。来自各地的僧侣前来学习和交流哲学、宗教、文学等方面的思想。作为[ROOT.Char.GetFaith.GetAdjective]的统治者，我有能力向这个可敬的学院提供一笔可观的捐款，以各种方式协助大学的日常运作。"
 magadha.0090.desc.endowment:0 "\n\n由于我离那烂陀大学不太远，我可以选择在我的领地内以几个村庄捐赠给大学，这将这些村庄所产生的税收和资源将直接归于那烂陀大学，只要法令有效。"
 magadha.0090.a:0 "提供牲畜和日常必需品"
 magadha.0090.b:0 "赠送宗教物品、遗物和经文等礼物"
 magadha.0090.c:0 "修缮寺院和扩建设施"
 magadha.0090.d:0 "遗留几个村庄作为捐赠"
