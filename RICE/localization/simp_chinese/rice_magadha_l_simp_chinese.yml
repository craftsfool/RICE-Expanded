 magadha.0040.t:0 "布施于摩诃菩提寺"
 magadha.0040.desc:0 "我准备给[gaya_county.GetNameNoTier]的摩诃菩提寺提供一笔巨额捐款。几个世纪前佛陀在此开悟，它作为僧伽的崇拜和朝圣中心而存在是很重要的。\n\n我对摩诃菩提寺的捐款可以用于很多方面。我可以提供资金支持住在那里的僧侣和维护这个地方，如果我更慷慨，我甚至可以送资金给现有的建筑修缮或者扩建"
 magadha.0040.desc.massive_option:0 "\n\n我是一个强大的[ROOT.Char.GetTitledFirstName]，我要将大量的资金献给摩诃菩提寺，进行大规模的建设和维修。这样的项目将是一代人一次的努力，毫无疑问这样做我的名字会在佛教统治者的史册上世代流传！"
 magadha.0040.a:0 "我将提供#bold 少量#!捐款。"
 magadha.0040.b:0 "我将提供#bold 适当#!捐款。"
 magadha.0040.c:0 "我将提供#bold 大额#!捐款。"
 magadha.0040.d:0 "我将提供#bold 巨额#!捐款。"
 magadha.0040.d.tooltip.1:0 "#X 一生中只能捐赠#bold 一次#!巨额捐款#!"
 magadha.0040.d.tooltip.2:0 "其他[THIS.Char.GetFaith.GetReligion.GetAdjective][rulers|E]将无法向摩诃菩提寺提供大量捐款，除非[gaya_county.GetNameNoTier]有[GetModifier('RICE_magadha_great_royal_donation_mahabodhi').GetNameWithTooltip][county_modifier|E]"
 magadha.0041.t:0 "摩诃菩提寺的巨额捐款"
 magadha.0041.desc:0 "关于虔诚的[mahabodhi_donator.GetTitledFirstName]的消息在佛教世界广为流传，他最近向摩诃菩提寺庙群捐赠了大量的资源和资金。这笔捐款将用于建造、重建和修复那里的设施，剩余的钱都将用于维持开销。\n\n摩诃菩提寺是佛祖许多世纪前开悟的地方，因此它是佛教徒最重要的崇拜和朝圣中心。\n\n像这样的大额香火捐赠一生只有一次，所以各地的佛教徒一定会感到高兴，[mahabodhi_donator.GetTitledFirstName]可以放心，[mahabodhi_donator.GetSheHe]将被佛教徒同胞记住，作为一个高尚和正义的君主，将与阿育王等杰出的统治者并列。"
 magadha.0041.a:0 "绚丽的"
 magadha.0041.b:0 "我希望是#italic 我#!做的！"
