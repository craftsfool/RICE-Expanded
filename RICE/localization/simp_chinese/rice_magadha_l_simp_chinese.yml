 magadha.0050.t:0 "准备放生仪式"
 magadha.0050.desc:0 "[ROOT.Char.GetFaith.GetAdjective]教的[ROOT.Char.GetFaith.GetReligion.GetName]展示对芸芸众生的爱和慈悲是确切的。为了实践这样的理想，我将与当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]进行一场大型放生仪式。\n\n我们将购买并释放那些原本待宰杀的动物，将它们从痛苦中解救出来。当然我和其他参加这场仪式的人也将积累功德。"
 magadha.0050.a:0 "我们要普济众生！"
 magadha.0051.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 magadha.0051.desc:0 "我打算在近期举办一场#bold 放生仪式#!，为了实践[sender.GetFaith.GetReligion.GetAdjective]经文中所教导的对芸芸众生的爱与慈悲，实现崇高的[sender.GetFaith.GetReligion.GetAdjective]理想，我们将释放一些原本注定要被宰杀的动物。我邀请你加入我们这个重要的仪式，以便我们都能积累功德，希望你有空前来。"
 magadha.0051.a:0 "我很高兴能参加这个仪式！"
 magadha.0051.b:0 "哎呀！太可惜了！我无暇目睹此次仪式！"
 magadha.0051.c:0 "[sender.GetSheHe|U]道貌岸然，还沾沾自喜，我不会去的！"
 magadha.0051.c.tooltip:0 "给[sender.GetTitledFirstName]回信，对这种愚蠢的“虔诚”行为表示不赞同。"
 magadha.0052.opening:0 "[life_release_rejector.Custom2('AppropriateGreeting', ROOT.Char)]"
 magadha.0052.desc:0 "我不能接受你的邀请，参加你所谓的放生仪式。这只是你的道德自我满足罢了，坦率地说是这是一种愚蠢且虚伪的行为。在我看来，你还不如做好自己。作为一个[host.GetTitleAsNameNoTooltip]，你应该优先考虑更重要的事情，而不是像这样轻率地花钱来让自己感觉比别人虔诚。"
 magadha.0052.a:0 "不幸的是，有些人不理解我们为什么要这样做。"
 magadha.0052.b:0 "#italic[life_release_rejector.GetSheHe|U]#!才是那个虚伪的人！竟然如此不虔诚！"
 magadha.0053.t:0 "取消放生仪式"
 magadha.0053.desc:0 "我收到消息，[host.GetTitledFirstName]刚刚去世，因此[host.GetSheHe]计划的放生仪式已被取消了。"
 magadha.0053.a:0 "我明白了……真是不幸的消息。"
 magadha.0054.t:0 "取消放生仪式"
 magadha.0054.desc:0 "我收到消息，[host.GetTitledFirstName]刚刚入狱，因此无法举办[host.GetSheHe]计划的放生仪式。它现在已被取消了。"
 magadha.0054.a:0 "我明白了……真是不幸的消息。"
 magadha.0055.t:0 "取消放生仪式"
 magadha.0055.desc:0 "由于我现在被囚禁，我不能再进行计划中的放生仪式。我只希望为此已经积累足够多的功德，让我早日离开此处。"
 magadha.0055.a:0 "我不知道现在会发生什么……"
