 RICE_magadha_great_royal_donation_mahabodhi:0 "大皇室的捐赠"
 RICE_magadha_great_royal_donation_mahabodhi_desc:0 "一位心地高尚的统治者，对佛门三宝深怀敬意，最近实现僧侣的愿望，资助了一项大规模的工作来修复和扩大摩诃菩提寺的圣地。当然该统治者做完这件事后会获得大量功德！\n\n#italic 如果该[county_modifier|E]处于激活状态，佛教徒[rulers|E]在采用#V 捐赠摩诃菩提寺#![decision|E]时，将#bold 无法#!选择资助大规模的修缮和建设工作。#!"
 RICE_magadha_great_royal_donation_mahabodhi_character:0 "大额的捐赠给摩诃菩提寺"
 RICE_magadha_great_royal_donation_mahabodhi_character_desc:0 "这位心地高尚的统治者通过资助修复和扩大位于摩揭陀菩提伽耶的摩诃菩圣地的巨大努力，显示了他们对佛教三宝的深切敬意。这种杰出的行为肯定会使他们在今生获得巨大的功德!"
