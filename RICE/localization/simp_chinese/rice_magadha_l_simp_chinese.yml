 magadha.0030.t:0 "准备前往参观菩提树"
 magadha.0030.desc:0 "每年，来自世界各地的[ROOT.Char.GetFaith.GetReligion.GetAdjective]信众齐聚[gaya_county.GetNameNoTier]，参拜佛陀成道时冥想的神圣菩提树。人们参观这棵树不仅是为了看它，还用水和牛奶沐浴它，作为一种崇拜的行为。今年我已经计划参加这个仪式。"
 magadha.0030.a:0 "我准备很快前往[gaya_county.GetNameNoTier]！"
 magadha.0031.t:0 "在菩提树下沐浴佛道"
 magadha.0031.desc:0 "在旅行了一段时间后，我已经到达了[gaya_county.GetNameNoTier]。成千上万的人聚集在这里，参加这个菩提树的沐浴仪式，这个一年四季都已经很热闹的地方，比平时更热闹了。\n\n虽然我是[ROOT.Char.GetTitleAsNameNoTooltip]，但在这里，我只是众多[ROOT.Char.GetFaith.GetAdherentNamePlural]中的一员。我和其他人一起，拿着牛奶或者带有香气的水来灌溉它周围的区域，并清洁佛陀的#italic 金刚座#!，这是一块古老的石板，据说佛陀坐在这里开悟。\n\n灌溉完之后，我和其他人一同庆祝庆祝，并在菩提树下泼洒鲜花和香水。"
 magadha.0031.a:0 "我很高兴今年可以过来"
 magadha.0031.tooltip:0 "你可能会受到菩提树的启发，获得一个[character_modifier|E]。"
 magadha.0031.toast:0 "沐浴菩提树给你带来了灵感！"
 magadha.0032.t:0 "不再有菩提树"
 magadha.0032.desc:0 "我现在是[ROOT.Char.GetFaith.GetName]的信徒，并崇拜[ROOT.Char.GetFaith.HighGodName]。因此参观所谓佛教徒崇拜的“菩提树”对我来说已经没有任何意义了。"
 magadha.0032.a:0 "我毕竟是[ROOT.Char.GetFaith.GetAdherentName]。"
