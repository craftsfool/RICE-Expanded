 magadha.0020.t:0 "菩提伽耶的金刚座之主"
 magadha.0020.desc:0 "在这个[ROOT.Char.GetFaith.GetReligion.GetName]三宝里忧外患的时代，有大胆而虔诚的领导人尽最大努力保护三宝。虽然我不能说自己是这些领导人中最伟大的，但作为[gaya_county.GetNameNoTier]周围圣地的领主，特别是摩诃菩提，那里正是佛陀在菩提树下开悟的地方，我已经尽了责任去守护这里。\n\n因此，我决定要求获得#Bold 金刚座之主#!的称号。各地的佛教徒将知道我是负责守卫和维护这一重要区域的人，而后代将能够在一个安全和繁荣的环境中学习佛陀的教义。"
 magadha.0020.a:0 "为了佛门三宝！"
 magadha.0020.tooltip:0 "从现在开始，任何[gaya_county.GetNameNoTier]的[pithipati.GetFaith.GetReligion.GetAdjective][rulers|E]都将拥有[pithipati|E]的称号，它提供了[pithipati.GetFaith.GetReligion.GetAdjective]的[decisions|E]，并有对应的奖励。"
 magadha.0021.t:0 "菩提伽耶的金刚座之主"
 magadha.0021.desc:0 "我收到消息，[gaya_county.GetNameNoTier]的统治者[pithipati.GetTitledFirstName]宣布[pithipati.GetHerselfHimself]为#Bold 金刚座之主#!，即[pithipati.GetFaith.GetReligion.GetName]的金刚座之主（金刚座指释迦牟尼成佛之座）。\n\n这个称号反映了[pithipati.GetSheHe]作为菩提伽耶圣地的管理者和捍卫者所要承担的巨大责任。[pithipati.GetSheHe|U]因[pithipati.GetHerHis]对佛教界的贡献而在该地区的许多佛教徒中享有盛誉和尊重。"
 magadha.0021.a:0 "有点意思……"
