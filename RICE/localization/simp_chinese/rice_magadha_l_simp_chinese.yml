 RICE_magadha_life_liberation_guest_memory:0 "参加了[host.GetTitledFirstNamePossessive][GetActivityType('activity_RICE_magadha_life_liberation').GetName]"
 RICE_magadha_life_liberation_guest_memory_first_perspective:0 "我参加了[host.GetTitledFirstNamePossessive][GetActivityType('activity_RICE_magadha_life_liberation').GetName]"
 RICE_magadha_life_liberation_guest_memory_second_perspective:0 "你参加了[host.GetTitledFirstNamePossessive][GetActivityType('activity_RICE_magadha_life_liberation').GetName]"
 RICE_magadha_life_liberation_guest_memory_third_perspective:0 "[owner.GetName]参加了[host.GetTitledFirstNamePossessive][GetActivityType('activity_RICE_magadha_life_liberation').GetName]"
 activity_RICE_magadha_life_liberation:0 "放生仪式"
 activity_RICE_magadha_life_liberation_desc:0 "经文中说，我们不应该伤害动物，并尽我们所能保护它们。与当地僧伽举行放生仪式，让原本注定要被宰杀的动物获得自由，将有助于我展示虔诚和积累功德。"
 activity_RICE_magadha_life_liberation_selection_tooltip:0 "把那些原本会被杀害的动物放归大自然。\n\n$RICE_magadha_life_liberation_context_tooltip$"
 activity_RICE_magadha_life_liberation_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i][prestige|E]\n$BULLET_WITH_TAB$获得#P 正面#![character_modifiers|E]"
 activity_RICE_magadha_life_liberation_guest_desc:0 "获得[GetModifier('RICE_magadha_participated_in_life_release').GetNameWithTooltip][modifier|E]"
 activity_RICE_magadha_life_liberation_province_desc:0 "这是放生良地"
 activity_RICE_magadha_life_liberation_destination_selection:0 "[GetPlayer.GetFaith.PriestNeuterPlural]说这里是一个放生动物的吉利地点。"
 activity_RICE_magadha_life_liberation_guest_help_text:0 "$activity_magadha_life_release$"
 activity_RICE_magadha_life_liberation_predicted_cost:0 "放生的成本取决于你选择的[activity_options|E]。"
 activity_RICE_magadha_life_liberation_conclusion_desc:0 "[GetActivityType( 'activity_RICE_magadha_life_liberation' ).GetName]已结束。我们的许多动物同胞，已经被放生到野外。也许有一天，他们甚至可能重新轮回，成为一个人！"
 RICE_magadha_life_liberation_court:0 "住所"
 RICE_magadha_life_liberation_court_desc:0 "$EFFECT_LIST_BULLET$你将在某人的住所内进行放生，可以是你的，也可以是别人的。\n$EFFECT_LIST_BULLET$你将获得一定的[piety_i][piety|E]和[prestige_i][prestige|E]，但比其他选项少。\n\n#weak 一般庄园周围的土地有足够的空间让这些动物在离开去其他地方之前停留！#!"
 RICE_magadha_life_liberation_temple:0 "寺院"
 RICE_magadha_life_liberation_temple_desc:0 "$EFFECT_LIST_BULLET$你将在寺院中进行放生动物。\n$EFFECT_LIST_BULLET$与#bold 住所#!选项相比，你将获得更多的[piety_i][piety|E]。\n\n#weak 如果我们在[GetPlayer.GetFaith.HouseOfWorship]上放生这些动物，这意味它们将在[GetPlayer.GetFaith.HighGodName]面前被放生，而且[GetPlayer.GetFaith.GetAdjective][GetPlayer.GetFaith.PriestNeuterPlural]可以为它们日夜祈祷，早日得道#!"
 RICE_magadha_life_liberation_wilderness:0 "野外"
 RICE_magadha_life_liberation_wilderness_desc:0 "$EFFECT_LIST_BULLET$你将在野外一个安全地点进行放生，远离任何定居点。\n$EFFECT_LIST_BULLET$与#bold 住所#!选项相比，你将获得更多的[piety_i][piety|E]和[prestige_i][prestige|E]，但分别少于#bold 寺院#!和#bold 公开#!选项。\n\n#weak 被放生的动物不应该被迫生活在人类附近，人类对它们是如此的残忍。相反，它们应该更接近它们的自然家园。#!"
 RICE_magadha_life_liberation_public:0 "公开"
 RICE_magadha_life_liberation_public_desc:0 "$EFFECT_LIST_BULLET$你将在公开，以引人注目的方式进行方式。\n$EFFECT_LIST_BULLET$与#bold 住所#!选项相比，你将获得更多的[prestige_i][prestige|E]。\n\n#weak 对这些可怜的生物所做的伟大的仁慈行为，肯定会激励其他人对芸芸众生产生仁爱之心！#!"
 RICE_magadha_life_liberation_animal_type:0 "放生类型"
 RICE_magadha_life_liberation_animal_type_insects:0 "虫类"
 RICE_magadha_life_liberation_animal_type_insects_desc:0 "$EFFECT_LIST_BULLET$获得为期#V 五年#!的[GetModifier('RICE_magadha_performed_life_release_insects').GetNameWithTooltip]\n\n#weak 有些人对昆虫感到厌恶，但它们也是有生命的生物，应该过上幸福一生。#!"
 RICE_magadha_life_liberation_animal_type_birds:0 "鸟类"
 RICE_magadha_life_liberation_animal_type_birds_desc:0 "$EFFECT_LIST_BULLET$获得为期#V 五年#!的[GetModifier('RICE_magadha_performed_life_release_birds').GetNameWithTooltip]\n\n#weak 鸟儿囚于笼子里是不对的，应该在宽阔的天空中自由飞翔！#!"
 RICE_magadha_life_liberation_animal_type_turtles:0 "龟类"
 RICE_magadha_life_liberation_animal_type_turtles_desc:0 "$EFFECT_LIST_BULLET$获得为期#V 五年#!的[GetModifier('RICE_magadha_performed_life_release_turtles').GetNameWithTooltip]\n\n#weak 乌龟是智慧的、古老的生物，我们应该尽最大努力尊重它们。#!"
 RICE_magadha_life_liberation_animal_type_fish:0 "鱼类"
 RICE_magadha_life_liberation_animal_type_fish_desc:0 "$EFFECT_LIST_BULLET$获得为期#V 五年#!的[GetModifier('RICE_magadha_performed_life_release_fish').GetNameWithTooltip]\n\n#weak 鱼儿自由自在地游动多么美丽，每条鱼都为我们水域做出了贡献！#!"
 RICE_magadha_life_release_phase:0 "放生"
 RICE_magadha_life_release_phase_desc:0 "愿众生早日脱离苦海！"
 RICE_life_liberation_compassion_intent_header:0 "怜悯："
 RICE_life_liberation_compassion_intent:0 "怜悯"
 RICE_life_liberation_compassion_intent_desc:0 "每个[GetPlayer.GetFaith.GetAdherentName]都必须遵循[GetPlayer.GetFaith.ReligiousText]的教诲，尽其所能减轻他人的痛苦，包括动物在内。你从这项[activity|E]中获得持续#V 十年#![character_modifier|E]来取代五年的修正"
 RICE_life_liberation_spectacle_intent_header:0 "作秀："
 RICE_life_liberation_spectacle_intent:0 "作秀"
 RICE_life_liberation_spectacle_intent_desc:0 "你想向其他[GetPlayer.GetFaith.GetAdherentNamePlural]表演一番你的笃信，证明你也是[GetPlayer.GetFaith.HighGodName]的虔诚追随者。你将在你已经获得的[prestige|E]基础上额外追加获得#V 50%#!"
 RICE_life_liberation_merit_intent_header:0 "功德："
 RICE_life_liberation_merit_intent:0 "功德"
 RICE_life_liberation_merit_intent_desc:0 "无论你是否对这项[activity|E]感到热情，你都希望放生仪式会给你带来功德与因果。你将在你已经获得的[piety|E]基础上额外追加获得#V 50%#!"
 RICE_magadha_life_liberation_completed_log_title:0 "放生仪式完成"
 RICE_magadha_life_liberation_completed_log:0 "[CHARACTER.GetShortUIName|U]完成了[CHARACTER.GetHerHis]放生仪式"
 activity_RICE_hot_springs_visit_rajgir_province_desc:0 "\n#P +++[hot_springs_of_rajgir|E]是一处独特的[hot_springs|E]。#!\n\n#italic 温泉之旅将获得额外的[piety|E]。此外如果你信奉佛教、耆那教或印度教的[faith|E]，并且你的[religion|E]控制着相关的[county|E]，你将获有进一步获得[character_modifier|E]。#!"
 TRAVEL_NAME_FOR_activity_RICE_magadha_life_liberation:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_magadha_life_liberation$"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony:0 "菩提树沐浴"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_desc:0 "几个世纪前，佛祖在菩提伽耶的菩提树下开悟。每年无论高低贵贱的信徒们都会聚集在这棵树下，沐浴佛法，为它浇水，并给予关注，以纪念这里发生的一切。\n\n@alert_icon!#alert_trial 沐浴仪式大约在三月举行。如果你在那之前到达，活动将暂停，因为你在[GetTitleByKey('c_gaya').GetNameNoTier]等待它开始！#!"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_selection_tooltip:0 "参加每年一次的菩提树沐浴活动。\n\n$RICE_magadha_bathe_the_bodhi_tree_context_tooltip$"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$有概率获得菩提树的#P 启迪#!并获得几种不同的[character_modifiers|E]"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_guest_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_province_desc:0 "释迦牟尼开悟的菩提树在[GetTitleByKey('c_gaya').GetNameNoTier]。"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_destination_selection:0 "$activity_RICE_magadha_bodhi_tree_bathing_ceremony_province_desc$"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_guest_help_text:0 "$activity_RICE_magadha_bodhi_tree_bathing_ceremony$"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_predicted_cost:0 "旅行的费用主要取决于你的[income|E]。"
 activity_RICE_magadha_bodhi_tree_bathing_ceremony_conclusion_desc:0 "今年的[GetActivityType( 'activity_RICE_magadha_bodhi_tree_bathing_ceremony' ).GetName]已结束。我很高兴能参加这样一个神圣的仪式，并积累一定的功德！"
 RICE_magadha_bodhi_tree_bathing_ceremony_bathing_phase:0 "沐浴"
 RICE_magadha_bodhi_tree_bathing_ceremony_bathing_phase_desc:0 "菩提树正沐浴在芳香的水和牛奶中。"
 RICE_magadha_bodhi_tree_bathing_ceremony_devotion_intent_header:0 "奉献："
 RICE_magadha_bodhi_tree_bathing_ceremony_devotion_intent:0 "奉献"
 RICE_magadha_bodhi_tree_bathing_ceremony_devotion_intent_desc:0 "菩提树是对释迦牟尼成就的一种见证，你会认真给它沐浴，你将获得两倍其他[intents|E]的[piety_i|E][piety|E]奖励。如果你拥有[GetTrait('zealous').GetName( GetNullCharacter )]特质，你将失去[stress_loss_i|E][stress|E]。"
 RICE_magadha_bodhi_tree_bathing_ceremony_contemplation_intent_header:0 "追悼："
 RICE_magadha_bodhi_tree_bathing_ceremony_contemplation_intent:0 "追悼"
 RICE_magadha_bodhi_tree_bathing_ceremony_contemplation_intent_desc:0 "沐浴菩提树时，你希望思考佛陀的生平和佛教历史。你从这个[activity|E]中获得#P 正面#![modifier|E]的概率大大增加。如果你拥有[GetTrait('humble').GetName( GetNullCharacter )]或[GetTrait('patient').GetName( GetNullCharacter )]特质，你将失去[stress_loss_i|E][stress|E]。"
 RICE_magadha_bodhi_tree_bathing_ceremony_serenity_intent_header:0 "冥思："
 RICE_magadha_bodhi_tree_bathing_ceremony_serenity_intent:0 "冥思"
 RICE_magadha_bodhi_tree_bathing_ceremony_serenity_intent_desc:0 "沐浴菩提树是一个让身心平静的地方，在一个宁静的环境中思考精神世界。你会失去[stress_loss_i|E][stress|E]，如果你拥有[GetTrait('content').GetName( GetNullCharacter )]或[GetTrait('calm').GetName( GetNullCharacter )]特质，则会失去更多。"
 RICE_magadha_bodhi_tree_bathing_ceremony_completed_log_title:0 "沐浴完菩提树"
 RICE_magadha_bodhi_tree_bathing_ceremony_completed_log:0 "[CHARACTER.GetShortUIName|U]沐浴完菩提树"
 TRAVEL_NAME_FOR_activity_RICE_magadha_bodhi_tree_bathing_ceremony:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_magadha_bodhi_tree_bathing_ceremony$"
 magadha.0050.desc.birds:0 "\n\n这一次，我们将把鸟儿放生到无尽的天空中。"
 magadha.0050.desc.turtles:0 "\n\n这一次，我们将龟群放生到水域之中"
 magadha.0050.desc.fish:0 "\n\n这一次，我们将把鱼儿放生到一个温馨的水域中。"
 magadha.0050.desc.insects:0 "\n\n这一次，我们将昆虫放生到荒野中。"
 RICE_magadha_bodhi_tree_bathing_ceremony_host_memory:0 "参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_host_memory_first_perspective:0 "我参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_host_memory_second_perspective:0 "你参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_host_memory_third_perspective:0 "[owner.GetName]参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_guest_memory:0 "与[host.GetTitledFirstName]一同参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_guest_memory_first_perspective:0 "我与[host.GetTitledFirstName]一同参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_guest_memory_second_perspective:0 "你与[host.GetTitledFirstName]一同参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_bodhi_tree_bathing_ceremony_guest_memory_third_perspective:0 "[owner.GetName]与[host.GetTitledFirstName]一同参加了[GetTitleByKey('c_gaya').GetNameNoTier]的[GetActivityType('activity_RICE_magadha_bodhi_tree_bathing_ceremony').GetName]"
 RICE_magadha_donate_holy_site_effect_tooltip_5:0 "[RICE_sri_lanka_s|E][RICE_sri_lanka_monasteries|E]的[RICE_sri_lanka_prominence|E]取决于场地而增加，尤其是你赞助的佛派"
 RICE_magadha_pithipati_legend_name:0 "金刚座之主"
 RICE_magadha_pithipati_legend_desc:0 "正觉之地——[title.GetNameNoTier]，乃佛陀开悟之处。如今时过境迁，世人早已忘却这里的伟大，但虔诚的[guardian.GetName]自号“金刚座之主”，以希望保护[religion.GetAdjectiveNoTooltip]，和不让此处沦落异教徒之手。"
 RICE_magadha_pithipati_legend_chapter_opening_new_title:0 "世人皆知佛陀在正觉之地的一棵菩提树下结跏趺坐，发誓“不达究竟正觉，终不起座。”终究开悟入得四种禅，悟得三明四谛，证得无上正等正觉，千百轮回以来，凡夫俗子前往[ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip]瞻仰正觉之地。"
 RICE_magadha_pithipati_legend_chapter_motivation_new_title:0 "与诸释门同，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]亦知此树之贵重，值此兵戈四起，纷纭变乱之世，[ROOT.Legend.GetProtagonist.GetSheHe]知若无所作为，则佛法必遭劫难，故立志为#italic 金刚座之主#!，守护正觉之地。"
 RICE_magadha_pithipati_legend_chapter_famous_deed_new_title:0 "然名为虚着，实行为先。故[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]慎行其职，以符其名，众皆称其不负金刚主之名。[ROOT.Legend.GetProtagonist.GetSheHe|U]又以资财维菩提圣所，又力劝释门弟子来朝。此间诸所亦防群魔，其间俗世胁客，邪魔徒欲诱人弃佛陀者甚众。"
 RICE_magadha_pithipati_legend_chapter_extra_deed_new_title:0 "佛国四方正主闻[ROOT.Legend.GetProtagonist.GetSheHe]虔心崇佛，礼敬三宝。故纷至沓来，赠厚礼以助巍巍之业。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]欲以一人之苦行，证三宝之伟业。使平凡众生，皆入佛门，天下教化，善莫大焉。"
 RICE_magadha_pithipati_legend_chapter_conclusion_new_title:0 "金刚座之主非虚号也，欲证其名，须历灭世之劫，其劫之巨，万物众生，无所幸免，然正觉之地，历劫而新生，为万物之始。故任其世事纷纭变化，而正觉之地不受其扰，金刚座主之裔守护于此，又蒙我佛慈悲，后世众生皆可无忧矣！"
