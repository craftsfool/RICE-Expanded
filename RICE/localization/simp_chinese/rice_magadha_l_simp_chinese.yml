 magadha.0010.t:0 "一个佛教宗教场所"
 magadha.0010.desc:0 "自佛陀开悟以来，无论高低贵贱的佛教徒都会为了建造各种宗教场所出一份力，以纪念佛陀，弘扬佛法，并激励僧伽。我也会这样做，因为作为一个佛教领主，我有责任树立一个榜样，更何况我这样做可以为自己积累巨大的功德。\n\n第一件事是我应该首先决定建造什么样的场所："
 magadha.0010.a:0 "一个小庙宇"
 magadha.0010.b:0 "一座僧院"
 magadha.0010.c:0 "一座浮图塔"
 magadha.0010.d:0 "一座佛塔"
 magadha.0010.tooltip.temple_1:0 "小庙宇作为上香的地方，可以为当地社区带来好处。"
 magadha.0010.tooltip.temple_2:0 "大约一两年庙宇建成后，与其他佛教场所相比，你将获得更多的[prestige|E]而不是更多的[piety|E]。"
 magadha.0010.tooltip.monastery_1:0 "一座佛寺可以让僧伽在这里专研佛法经文。"
 magadha.0010.tooltip.monastery_2:0 "大约一两年佛寺建成后，与其他佛教场所相比，你将获得更多的[piety|E]而不是更多的[prestige|E]"
 magadha.0010.tooltip.stupa_1:0 "一座浮图塔可以放高僧舍利以及其遗物，并作为一个壮丽的佛教景观"
 magadha.0010.tooltip.stupa_2:0 "大约一两年浮图塔建成后，与其他佛教场所相比，你将获得同样的[piety|E]和[prestige|E]"
 magadha.0010.tooltip.pagoda_1:0 "佛塔可以同时作为朝圣地和佛寺，也可以放置高僧遗物"
 magadha.0010.tooltip.pagoda_2:0 "大约一两年佛塔建成后，你将获得与其他佛教场所同等数量的[piety|E]和[prestige|E]"
 magadha.0010.tooltip.pagoda_3:0 "佛塔奖励也会更多，但建造一个佛塔至少需要@gold_icon!#V 125#!"
 magadha.0010.tooltip.pagoda_4:0 "佛塔可以作为一个选项，因为[THIS.Char.GetFaith.GetName]遵循[GetDoctrineType('rice_mahayana_canon_doctrine').GetBaseName]"
 magadha.0011.t:0 "一个佛教宗教场所"
 magadha.0011.desc.temple:0 "[ROOT.Char.GetFaith.GetReligion.GetAdjective]庙宇对于确保出家之人和世俗之人都能继续修行佛法和培养功德非常重要。它是当地人供奉、去庆祝节日或听有学问的[ROOT.Char.Custom('DefaultPriestTitlePlural')]讲道的地方。我们已经为新的庙宇找到了一个很好的位置，离一个城镇不远。"
 magadha.0011.desc.monastery:0 "如果我们要发展[ROOT.Char.Custom('DefaultPriestTitlePlural')]的智力和精神能力，[ROOT.Char.GetFaith.GetReligion.GetAdjective]佛寺是必要的。在这样的地方，他们可以学习和阐释佛法，并为世俗之人讲法。我们已经为新的佛寺找到了一个绝佳的位置，很快！这个地方就会充满诵经声！"
 magadha.0011.desc.stupa:0 "浮图塔用于存放各种[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教物品，如经文副本、珠宝、佛像，甚至是著名、已故[ROOT.Char.Custom('DefaultPriestTitlePlural')]的舍利。佛塔越大，其“宝库”中的物品越多，其精神力量就越强大。我们已经为新的浮图塔找到了一个很好的位置，它很快就会耸立在这片区域。"
 magadha.0011.desc.pagoda:0 "佛塔是一种由浮图塔演变而来的[ROOT.Char.GetFaith.GetReligion.GetAdjective]塔，常见于东亚和东南亚。这些宏伟的建筑通常存放圣物和经文，但其他信仰也是使用，例如把它当成祭祀祖先或祭祀当地神灵的地方。我们为新佛塔找到了一个绝佳的位置，它无疑将是一个宏伟的地标！"
 magadha.0011.desc.conclusion:0 "\n\n此外，当我汇集资源和派遣人员来协助我完成这项工作时，我需要一个明确的计划来做什么。例如我与当地的[ROOT.Char.Custom('DefaultPriestTitlePlural')]讨论，这个建筑是要加到现有的宗教建筑群中，还是在其他地方独立存在。我还需要选择这个建筑有多大。一旦决定了就可以开始动工了。"
 magadha.0011.a:0 "它的规模会#bold 很小#!"
 magadha.0011.b:0 "它的规模#bold 适中#!"
 magadha.0011.c:0 "它的规模会#bold 很大#!"
 magadha.0011.disclaimer:0 "#bold 佛教建筑将在大约一到两年内完成，完成时你将获得以下的加成。#!"
 magadha.0012.t:0 "佛教宗教场所完工"
 magadha.0012.desc.temple:0 "我刚刚收到消息，我几年前资助的庙宇终于完工了。看到装饰在大殿上的佛像，是多么令人振奋啊！许多人将从这座庙宇中受益，它将成为当地僧侣和世俗之人的香火之地"
 magadha.0012.desc.monastery:0 "我刚刚收到消息，我几年前资助的佛寺终于完工了。已经有[ROOT.Char.Custom('DefaultPriestTitlePlural')]在其墙内居住了。他们将能在短时间内满足城市的精神需求，并将该设施转变成当地的学习中心。"
 magadha.0012.desc.stupa:0 "我刚刚收到消息，我几年前资助的浮图塔终于完工了。在我自己的领土里，大量的圣物能被存放在这样一个好地方，真让人高兴。很快当地人就会到这里来上香，作为他们修行的一部分。"
 magadha.0012.desc.pagoda:0 "我刚刚收到消息，我几年前资助的佛塔终于完工了。它高高耸立，无疑将激励这里的许多人对三宝的信心。当地[ROOT.Char.Custom('DefaultPriestTitlePlural')]和和尚们已经开始组织力量维护这个佛塔，以确保它能世世代代保持屹立。"
 magadha.0012.a:0 "这简直是太美了！"
 magadha.0013.t:0 "佛教宗教场所完工"
 magadha.0013.desc:0 "在我最近皈依[ROOT.Char.GetFaith.GetName]之前，我曾为建造一个新的佛教场所捐献了一大笔资金。现在我追随[ROOT.Char.GetFaith.GetReligion.GetName]，这座建筑对我来说已经没有精神上的意义。\n\n尽管如此，我仍然可以鼓励它的使用，作为对我曾经加入的佛教团体的一种善意的表现。另一方面，也许我应该表明我对[ROOT.Char.GetFaith.HighGodName]新信仰的诚意，并放弃该建筑，让它听天由命，或改用它。"
 magadha.0013.a:0 "允许当地佛教徒前往上香"
 magadha.0013.a.tooltip:0 "因为你皈依了非佛教的[faith|E]，所以你放弃了原本要得到的[character_modifier|E]的奖励。"
 magadha.0013.b:0 "不承认那座建筑，我是[ROOT.Char.GetFaith.HighGodName]的追随者!"
 magadha.0013.b.tooltip:0 "为了证明你对[THIS.Char.GetFaith.GetName]的皈依是真诚的，你不仅放弃了你原来得到的[character_modifier|E]的奖励，而且还放弃了你的[realm_capital|E]的[county_modifier|E]。"
 magadha.0014.t:0 "转变宗教景观"
 magadha.0014.desc:0 "在[rajgir_barony.GetNameNoTier]的各个温泉的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教基础设施已经缺乏一段时间了。然而我们确实有办法恢复[ROOT.Char.GetFaith.GetReligion.GetAdjective]在这里的存在，并为[ROOT.Char.GetFaith.GetReligion.GetAdjective]寻求在这些神圣的温泉沐浴的朝圣者和旅行者提供精神帮助。\n\n我们的计划需要挪用和吸收其他佛教信仰的现有设施，并将原来的宗教景观改造成更适合我们的东西。异端的寺庙将变成[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetFaith.HouseOfWorshipPlural]，[ROOT.Char.GetFaith.GetReligion.GetAdjective]的圣像将被竖立起来，[ROOT.Char.Custom('DefaultPriestTitlePlural')]将被派来管理这个地区，还有更多的步骤将被采取以确保这个地区沐浴在我们的信仰之下。"
 magadha.0014.a:0 "就这么办"
 magadha.0015.t:0 "离开[rajgir_barony.GetNameNoTierNoTooltip]"
 magadha.0015.desc:0 "我决定参观[rajgir_barony.GetNameNoTier]的各种温泉，因为根据[ROOT.Char.GetFaith.GetReligion.GetAdjective]的传说，其中许多温泉被认为是神圣的，其他信仰也是如此觉得。该地区充满了各种神龛、圣洞等等。去那里会是一个很好的精神之旅，同时对我的健康也有好处。"
 magadha.0015.a:0 "让我们离开[rajgir_barony.GetNameNoTier]！"
 magadha.0016.t:0 "[rajgir_barony.GetNameNoTier]的温泉之旅"
 magadha.0016.desc:0 "最后，我已经到达了[rajgir_barony.GetNameNoTier]，现在正在参观它的各种温泉。还没有沐浴我就已经感到精神焕发了。当地的[ROOT.Char.GetFaith.GetReligion.GetAdjective]信徒告诉我关于[ROOT.Char.GetFaith.HighGodName]在其中一些温泉的各种传说。当我花时间浸泡在温泉中，我感到一种很久没有感受到的平静和轻松。"
 magadha.0016.a:0 "来这里是一个很好的决定。"
