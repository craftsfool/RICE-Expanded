l_simp_chinese:
 game_concept_pithipati:0 "金刚座之主"
 game_concept_pithipatis:0 "金刚座之主"
 game_concept_pithipati_desc:0 "$game_concept_pithipati$是历史上中世纪伽耶领主所使用的称号。一旦伽耶[county|E]的[ruler|E]采取宣称金刚座之主的[decision|E]，每一位遵循#V 佛教#![religion|E]的[ruler|E]会自动获得[GetModifier('RICE_magadha_pithipati_of_bodh_gaya').GetNameWithTooltip][character_modifier|E]，这个修正提供几个不同的收益。\n\n首先在印度、缅甸或西藏[county_capital|E]拥有“金刚座之主”[dynasty|E]成员可以采用在菩提树下沐浴的[decision|E]，而不是局限于一个较小的范围。\n\n其次，当任何[ruler|E]（除宣称““金刚座之主””家族之外）采取捐赠摩诃菩萨的[decision|E]时，““金刚座之主””家族成员都可以获得一点[piety|E]和[prestige|E]，其[dynasty|E]将获得[dynasty_prestige|E]。\n\n最后，重建圣拉吉尔温泉的[decision|E]中[piety_level|E]和[prestige_level|E]要求被免除。"
 game_concept_hot_springs_of_rajgir:0 "王舍城的温泉"
 game_concept_hot_springs_of_rajgir_short:0 "王舍城"
 game_concept_visit_the_hot_springs_of_rajgir:0 "参观王舍城的温泉"
 game_concept_hot_springs_of_rajgir_desc:0 "几个世纪以来，$game_concept_hot_springs_of_rajgir$一直被佛教徒、印度教徒和耆那教教徒认为是圣地，因此多年来在那里举办了各种宗教活动。\n\n居住在拉吉尔所在的摩揭陀[county|E]附近的[rulers|E]，可以采取访问王舍城温泉的[decision|E]。根据上述三个[religions|E]中的哪一个对该地区有主要影响（由始终存在的[county_modifier|E]表示），前往温泉的人可以得到一个[character_modifier|E]的奖励。\n\n为了改变这个[county_modifier|E]，使之与你的[religion|E]相匹配，你必须控制摩揭陀，以便作出[decision|E]，重新利用王舍城的神圣温泉。"
