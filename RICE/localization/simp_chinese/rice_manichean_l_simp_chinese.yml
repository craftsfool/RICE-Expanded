 RICE_manichean_patient_with_anti_manicheans_desc:0 "该角色认为，那些诽谤先知摩尼的人只是被误导了，本身并没有恶意。"
 RICE_manichean_denigrated_the_elect:0 "诋毁阿罗缓"
 RICE_manichean_denigrated_the_elect_desc:0 "该角色曾经对摩尼教的[Glossary( '阿罗缓', 'ELECT_GLOSS' )]发表过尖刻的评论。"
 RICE_manichean_helping_manichean_merchants:0 "帮助摩尼教商人"
 RICE_manichean_confiscated_manichean_merchants:0 "没收摩尼教商人的货物"
 RICE_manichean_understanding_towards_christians:0 "理解基督徒"
 RICE_manichean_dislikes_christians:0 "厌恶基督徒"
 RICE_manichean_freed_slaves:0 "以摩尼教的名义释放奴隶"
 RICE_manichean_freed_slaves_desc:0 "该角色买下了许多奴隶，然后把这些奴隶交给摩尼教[Glossary( '阿罗缓', 'ELECT_GLOSS' )]照顾，正如摩尼教教义所鼓励的那样。"
 RICE_manichean_careful_mingjiao:0 "谨慎的摩尼追随者"
 RICE_manichean_careful_mingjiao_desc:0 "该角色认为摩尼光佛的信徒需要谨慎行事，避免引起所谓正统宗教权威的怀疑——这些其他信仰的势力在汉文化圈内贬称摩尼光佛的信徒为“吃菜事魔”，唯有如此才能在可能的镇压或冲突中生存下来。"
 RICE_manichean_protect_mingjiao:0 "激进的摩尼追随者"
 RICE_manichean_protect_mingjiao_desc:0 "该角色认为摩尼光佛的信徒需要主动出击，保​​护自己免受汉文化圈所谓正统宗教暴政，以便在压迫下生存下来。"
 RICE_manichean_writing_manuscript:0 "撰写摩尼教典籍"
 RICE_uyghur_manichean_church_decision:0 "影响$uyghur$[GetFaithByKey('manichean').GetNameNoTooltip]的未来"
 RICE_uyghur_manichean_church_decision_tooltip:1 "我们的先辈坚定地追随光明宗教，但如今已有人开始质疑其教义体系。"
 RICE_uyghur_manichean_church_decision_desc:0 "[GetFaithByKey('manichean').GetAdjective]教会在[GetTitleByKey('e_uyghur_khanate').GetNameNoTier]崩溃以及中原王朝贬斥压迫后衰落了。如今许多人声称[Glossary( '阿罗缓', 'ELECT_GLOSS' )]变得腐败贪婪。我作为一个强大的[ROOT.Char.GetCulture.GetName][GetFaithByKey('manichean').GetAdjectiveNoTooltip]，或许我应该对这种现状做点什么……"
 RICE_uyghur_manichean_church_decision_effect_tooltip_1:1 "摩尼"
 RICE_uyghur_manichean_church_decision_confirm:0 "我们将找到正道"
 RICE_uyghur_manichean_church_decision_context_tooltip:0 "#emphasis 历史背景：#!回鹘汗国是历史上唯一一个支持摩尼教的大国，其统治精英在公元8世纪末皈依后，一度支持摩尼教；因此，约公元840年回鹘破灭之时，摩尼教亦首当其冲遭受打击。摩尼教而后在高昌回鹘王国残存了一段时间，但其统治阶层出于各种原因逐渐皈依佛教。蒙古时期可能还有回鹘摩尼教徒，但大多数回鹘人在11世纪就皈依了佛教。"
 RICE_manichean_uyghur_decision_PICK_TYPE: "$RICE_uyghur_manichean_church_decision_confirm$"
 RICE_manichean_uyghur_decision_select_text: "我们应该如何对待[GetFaithByKey('manichean').GetAdjective]教会内部所谓的腐败现象？\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_manichean_uyghur_decision_support_name: "#Bold 支持阿罗缓#!"
 RICE_manichean_uyghur_decision_support_desc: "$RICE_manichean_uyghur_decision_support_name$"
 RICE_manichean_uyghur_decision_support_tooltip: "#italic 任何不必要地诋毁[Glossary( '阿罗缓', 'ELECT_GLOSS' )]腐败的人都是受$manicheanism_devil_name$蛊惑，我们必须支持教会，防止其消亡！#!"
 RICE_manichean_uyghur_decision_reform_name: "#Bold 整顿教会#!"
 RICE_manichean_uyghur_decision_reform_desc: "$RICE_manichean_uyghur_decision_reform_name$"
 RICE_manichean_uyghur_decision_reform_tooltip: "#italic 不久前[Glossary('电那勿们','DINAVARIYA_GLOSS')]抨击[GetGeographicalRegion('RICE_region_mesopotamia').GetName]的同胞们过于堕落。现在我们应该改革我们的[Glossary('阿罗缓制度','ELECT_GLOSS')]了！#!"
 RICE_manichean_uyghur_decision_abandon_name: "#Bold 放弃光明教#!"
 RICE_manichean_uyghur_decision_abandon_desc: "$RICE_manichean_uyghur_decision_abandon_name$"
 RICE_manichean_uyghur_decision_abandon_tooltip: "#italic 所谓的[Glossary( '选民们', 'ELECT_GLOSS' )]都腐败无能，缺乏美德，下层如此，[GetFaithByKey('manichean').GetNameNoTooltip]又如何呢？我想其他信仰更为正道……#!\n"
 RICE_manichean_uyghur_decision_abandon_effect_1: "你将获得一个事件，让你[domain|E]中的[county|E]（如果存在）皈依其他[faith|E]，如果存在其他信仰，则你可以选择暂时不皈依。"
 RICE_manichean_uyghur_decision_abandon_effect_2: "[GetGeographicalRegion('RICE_greater_qocho_region').GetName]中的所有[GetFaithByKey('manichean').GetAdjective][rulers|E]（包括你）将有权做出#Bold 放弃[GetFaithByKey('manichean').GetNameNoTooltip]#![decision|E]，为期#V 100#!年。"
 RICE_manichean_uyghur_decision_abandon_effect_3: "[region|E]中的其他[GetFaithByKey('manichean').GetAdjective][rulers|E]可能会（不保证）随着时间的推移做出此[decision|E]。"
 RICE_manichean_manuscript_decision:0 "赞助[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]典籍"
 RICE_manichean_manuscript_decision_tooltip:1 "赞助人编写宗教典籍来传播摩尼教义。"
 RICE_manichean_manuscript_decision_desc:0 "摩尼教导我们要尊重典籍，因为只有通过文字才能将[ROOT.Char.GetFaith.GetAdjective]的教义一致、真实地传承下来。"
 RICE_manichean_manuscript_decision_effect_tooltip_1:1 "当典籍完成时，获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('medium_piety_gain')]#![piety|E]"
 RICE_manichean_manuscript_decision_effect_tooltip_2:1 "若你的[learning_i|E][learning|E]达到#V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_manuscript_learning_req_value')]#!，则可以选择自己撰写典籍并从中获得额外的[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('medium_prestige_gain')]#![prestige|E]，但撰写期间将拥有[GetModifier('RICE_manichean_writing_manuscript').GetNameWithTooltip][modifier|E]"
 RICE_manichean_manuscript_decision_effect_tooltip_3:1 "[GetTrait('RICE_disciple_of_lin_deng').GetName( GetNullCharacter )][trait|E]将获得#V [GetPlayer.MakeScope.ScriptValue('RICE_lin_deng_trait_xp_gain_value_medium')]#![trait_level_track_xp|E]"
 RICE_manichean_manuscript_decision_confirm:0 "愿摩尼的教诲永恒流传！"
 RICE_manichean_manuscript_decision_context_tooltip:0 "#emphasis 历史背景：#!摩尼极为重视宗教经典在传教过程中的作用，同时为了保证其离世后宗教思想仍能统一，他亲自写定了七部经典著作。为了方便文盲理解教义，还画了《大二宗图》。所谓“感四圣以为威力，腾七部以作舟航”。正因如此，摩尼教手抄本不仅在摩尼教徒中备受尊崇，而且以其品质而闻名；例如，在穆斯林文献中，即使是在充满敌意的文献中，也赞美摩尼教书籍。"
 RICE_manichean_manuscript_decision_select_text: "与其他先知不同，摩尼敦促我们记录他的言行， 以便他的教义永远保持纯洁和不受玷污。"
 RICE_MANICHEAN_MANUSCRIPT_PICK_TYPE: "$RICE_manichean_manuscript_decision_confirm$"
 RICE_manichean_manuscript_seven_treatises_name: "#Bold 七大典籍#!"
 RICE_manichean_manuscript_seven_treatises_desc: "$RICE_manichean_manuscript_seven_treatises_name$"
 RICE_manichean_manuscript_seven_treatises_tooltip: "#italic 七大典籍是由摩尼亲手撰写的七本书#!\n\n装备该[artifact|E]后，降低$RICE_manichean_confession_decision$[decision|E]和[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]的[gold_i|E][gold|E]成本。"
 RICE_manichean_manuscript_shabuhragan_name: "#Bold 《二宗经》#!"
 RICE_manichean_manuscript_shabuhragan_desc: "$RICE_manichean_manuscript_shabuhragan_name$"
 RICE_manichean_manuscript_shabuhragan_tooltip: "#italic 《二宗经》（《沙卜拉干》），意为“献给沙普尔之书”，是摩尼亲自撰写的摩尼教教义纲要。#!\n\n装备该[artifact|E]后，你参与[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]时，会获得额外的[prestige_i|E][prestige|E]。"
 RICE_manichean_manuscript_arzhang_name: "#Bold 《大二宗图》#!"
 RICE_manichean_manuscript_arzhang_desc: "$RICE_manichean_manuscript_arzhang_name$"
 RICE_manichean_manuscript_arzhang_tooltip: "#italic 为了方便文盲理解教义，由摩尼亲手绘制，以视觉图像来说明摩尼教的宇宙观以及光明王国和黑暗王国的情况。#!\n\n#EMP 装备此[artifact|E]可在[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中使得每位宾客增加对你[opinion_i|E][opinion|E]。#! "
 RICE_manichean_manuscript_kephalaia_name: "#Bold 《克弗来亚》#!"
 RICE_manichean_manuscript_kephalaia_desc: "$RICE_manichean_manuscript_kephalaia_name$"
 RICE_manichean_manuscript_kephalaia_tooltip: "#italic 尽管《克弗来亚》不是七大典籍，但它阐述了摩尼的教义，并经常引用摩尼生平中的例子#!\n\n装备此[artifact|E]可在[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外获得[piety_i|E][piety|E]。"
 RICE_manichean_manuscript_hymn_book_name: "#Bold 颂歌集#!"
 RICE_manichean_manuscript_hymn_book_desc: "$RICE_manichean_manuscript_hymn_book_name$"
 RICE_manichean_manuscript_hymn_book_tooltip: "#italic 摩尼为了法事目的而创作了各种赞美诗，其中许多用于重要的政治和日常#!\n\n装备此[artifact|E]可在举办[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外获得[legitimacy_i|E][legitimacy|E]。"
 RICE_manichean_manuscript_confessional_texts_name: "#Bold 忏悔集#!"
 RICE_manichean_manuscript_confessional_texts_desc: "$RICE_manichean_manuscript_confessional_texts_name$"
 RICE_manichean_manuscript_confessional_texts_tooltip: "#italic 这份典籍指导我们如何忏悔罪孽，这是人们为对抗黑暗所能采取的最重要行为之一。#!\n\n装备此[artifact|E]可在$RICE_manichean_confession_decision$[decision|E]和[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外减少[stress_loss_i|E][stress|E]。"
 RICE_manichean_manuscript_parables_and_tales_name: "#Bold 寓言和故事#!"
 RICE_manichean_manuscript_parables_and_tales_desc: "$RICE_manichean_manuscript_parables_and_tales_name$"
 RICE_manichean_manuscript_parables_and_tales_tooltip: "#italic 摩尼认为寓言和故事是一种教导和指导人们如何最好地生活的方式。#!\n\n装备该[artifact|E]后，你参与[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]时，会获得额外的[lifestyle_experience|E]。"
 RICE_manichean_manuscript_other_religions_texts_name: "#Bold 其他宗教的典籍#!"
 RICE_manichean_manuscript_other_religions_texts_desc: "$RICE_manichean_manuscript_other_religions_texts_name$"
 RICE_manichean_manuscript_other_religions_texts_tooltip: "#italic 摩尼说追随者的职责之一是收集其他信仰的典籍，并将其改编并添加到摩尼教中。#!\n\n装备后，此[artifact|E]可降低为摩尼教义[faiths|E]委托手稿[decision|E]的[gold_i|E][gold|E]成本。"
 RICE_manichean_confession_decision:0 "进行每周忏悔"
 RICE_manichean_confession_decision_tooltip:1 "每周忏悔罪过是你[faith|E]中的一项重要准则。"
 RICE_manichean_confession_decision_desc:0 "[ROOT.Char.GetFaith.GetAdherentNamePlural]为了净化自身，频繁忏悔罪孽至关重要，我非[Glossary( '阿罗缓', 'ELECT_GLOSS' )]，因此每周需要忏悔一次。\n"
 RICE_manichean_confession_decision_effect_tooltip_1:1 "你有#V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_confession_lose_sin_chance')]%#!概率失去#N 负面#!或#N 罪行#![trait|E]，并基于你的[piety_level|E]和[traits|E]获得#P 正面#![trait|E]"
 RICE_manichean_confession_decision_effect_tooltip_2:1 "基于你的[piety_level|E]，获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_confession_piety_gain_min')|0]#![piety|E]至[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_confession_piety_gain_max')|0]#![piety|E]之间随机值"
 RICE_manichean_confession_decision_confirm:0 "我们罪孽阻碍光明！"
 RICE_manichean_confession_decision_context_tooltip:0 "#emphasis 历史背景：#!据三印和十戒要求，摩尼教信徒每周举行一次法事，届时信徒和僧侣必须聚集在一起忏悔。不过具体时间和内容各方说法不一，例如《宿曜经》记载：“尼乾子末摩尼以密日（周日）持斋，亦事此日为大日，此等事持不忘。”，但《下部赞》中记载的“此偈凡莫日（周一）用为结愿”"
 RICE_manichean_confession_lose_sin_effect_tooltip:0 "$RICE_manichean_confession_decision_effect_tooltip_1$"
 RICE_manichean_lin_deng_decision:0 "敬拜林瞪公"
 RICE_manichean_lin_deng_decision_tooltip:1 "林瞪传播光明佛法，至今仍在庇佑正义与善良之人。"
 RICE_manichean_lin_deng_decision_desc:0 "林瞪公是一位无与伦比的大师，他传授给深奥的教义和法事。因此我们定期祭拜他，祈求他在圆寂后仍能保佑我们。"
 RICE_manichean_lin_deng_decision_effect_tooltip_1:1 "你有#V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_lin_deng_decision_modifier_chance')]%#!概率获得#P 正面#![modifiers|E]，具体概率取决于你的[piety_level|E]、[traits|E]和[learning_i|E][learning|E]"
 RICE_manichean_lin_deng_decision_confirm:0 "愿林瞪公指引并庇佑我们！"
 RICE_manichean_lin_deng_decision_context_tooltip:0 "#emphasis 历史背景：#!摩尼教之所以能在中国福建地区生存到16世纪，主要归功于一位名叫林瞪的摩尼教领袖，他一直活跃在福建地区，直到1059年去世。林瞪充满传奇色彩，当地人至今仍对他顶礼膜拜。\n例如万历《福宁州志》 记其事曰：\n\n「林瞪，上万人。嘉间，闽县前津门火，郡人望空中有人衣素衣，手持铁扇扑火，遂灭。遥告众曰：“我长溪上万林瞪也。”闽人访至其墓拜谒，事闻，敕封“兴福真人”。正德初，闽县令刘槐失辟，因祷之，夜梦神衣象服，告以亡处，明日果获」\n\n如今，福建当地的一位祭司兼法师陈培生是林瞪弟子陈平山的后代，他所持有的抄本具有明确的摩尼教传承，对摩尼教学者至关重要。"
 RICE_gnostic_alms_decision:0 "施舍给[ROOT.Char.GetFaith.GetAdjectiveNoTooltip][ROOT.Char.GetFaith.PriestNeuterPlural]"
 RICE_gnostic_alms_decision_mandaean:0 "履行布施"
 RICE_gnostic_alms_decision_manichean:0 "布施阿罗缓"
 RICE_gnostic_alms_decision_tooltip:1 "拥有知识并祈求救赎的阿罗缓应得到一切可能的帮助。"
 RICE_gnostic_alms_decision_desc:0 "[ROOT.Char.GetFaith.GetName]的戒律教导我们要施舍给僧侣，他们运用自己的知识日夜劳作，祈祷并举行法事，以获得救赎。"
 RICE_gnostic_alms_decision_effect_tooltip_1:1 "该[decision|E]的[gold_i|E][gold|E]成本取决于多少[counties|E]是你的[faith|E]"
 RICE_gnostic_alms_decision_confirm:0 "他们值得我们的帮助！"
 RICE_gnostic_alms_decision_context_tooltip:0 "#emphasis 历史背景：#!布施给神职人员是许多宗教的重要组成部分，包括诺斯替教派，因为在某些诺斯替教派中，神职人员被劝阻或禁止从事各种正常工作。例如《摩尼光佛教法仪略》记载：“右置五堂，法众共居，精修善业；不得别立私室厨库。每日斋食，俨然待施；若无施者，乞丐以充。唯使听人，勿畜奴婢及六畜等非法之具。”"
 RICE_persecute_manicheans_in_mesopotamia:0 "打压[GetGeographicalRegion('world_mesopotamia').GetNameNoTooltip]精底格"
 RICE_persecute_manicheans_in_mesopotamia_tooltip:1 "[GetGeographicalRegion('world_mesopotamia').GetName]的[Glossary( '精底格们', 'ZINDIQ_GLOSS' )]十分危险！"
 RICE_persecute_manicheans_in_mesopotamia_desc:0 "[GetGeographicalRegion('world_mesopotamia').GetName]中受假先知摩尼蒙骗的[Glossary( '精底格', 'ZINDIQ_GLOSS' )]必须被彻底镇压，让他们永远无法再欺骗他人，也无法再用他们的谎言和令人作呕的恐怖习俗摧毁我们的社会。"
 RICE_persecute_manicheans_in_mesopotamia_effect_tooltip_1:1 "XXXXX"
 RICE_persecute_manicheans_in_mesopotamia_confirm:0 "让这嗜血的异教徒承受万千诅咒！"
 RICE_persecute_manicheans_in_mesopotamia_context_tooltip:0 "#emphasis 历史背景：#!摩尼教因其在在其历史上各地都视为少数派宗教，而遭受过多次迫害。在阿拔斯王朝时期，摩尼教徒受到其他宗教信徒的怀疑；例如他们被指控实行活人祭祀，在占卜仪式中使用受害者的头颅。在摩尼教的发源地美索不达米亚，最后一次大规模迫害发生在穆克塔迪尔（公元908至932年）统治时期，当时包括教会领袖在内的摩尼教残余分子向东逃往撒马尔罕。"
 RICE_revive_manicheism_in_mesopotamia:0 "在[GetGeographicalRegion('world_mesopotamia').GetNameNoTooltip]复兴摩尼教"
 RICE_revive_manicheism_in_mesopotamia_tooltip:1 "[GetGeographicalRegion('world_mesopotamia').GetName]，我们先知摩尼的故乡，必须从黑暗中解放出来。"
 RICE_revive_manicheism_in_mesopotamia_desc:0 "[GetGeographicalRegion('world_mesopotamia').GetName]曾是先知摩尼的故乡。几个世纪以来，这片古老的土地一直被黑暗势力所控制，他的追随者也曾遭受迫害，这片两河之间的土地必须被摩尼的教义重新启迪。"
 RICE_revive_manicheism_in_mesopotamia_effect_tooltip_1:1 "[GetFaithByKey('manichean').GetAdjective][head_of_faith|E]将回归[GetTitleByKey('c_kufa').GetNameNoTier]，前提是需要存在。"
 RICE_revive_manicheism_in_mesopotamia_effect_tooltip_2:1 "[GetFaithByKey('manichean').GetAdjective][head_of_faith|E]如果没有[holder|E]，则将重新确立。"
 RICE_revive_manicheism_in_mesopotamia_effect_tooltip_3:1 "阻止非摩尼教[rulers|E]使用$RICE_persecute_manicheans_in_mesopotamia$[decision|E]"
 RICE_revive_manicheism_in_mesopotamia_confirm:0 "为了光明！为了摩尼！"
 RICE_revive_manicheism_in_mesopotamia_context_tooltip:0 "$RICE_persecute_manicheans_in_mesopotamia_context_tooltip$"
 RICE_manichean_convert_away_decision:0 "放弃[ROOT.Char.GetFaith.GetNameNoTooltip]"
 RICE_manichean_convert_away_decision_tooltip:1 "也许那里有更好的[faiths|E]……"
 RICE_manichean_convert_away_decision_desc:0 "多年来，[GetTitleByKey('e_uyghur_khanate').GetNameNoTier]的继承者们一直坚守先知摩尼的教义。然而，[ROOT.Char.GetFaith.GetAdjective]教会被指控内部腐败及其衰落，正使一些人背离光明信仰……"
 RICE_manichean_convert_away_decision_effect_tooltip_1:0 "从[GetPlayer.GetFaith.GetName]皈依到你选择的[faith|E]"
 RICE_manichean_convert_away_decision_confirm:0 "让我们找到新信仰！"
 RICE_manichean_convert_away_decision_context_tooltip:0 "$RICE_uyghur_manichean_church_decision_context_tooltip$"
 RICE_ADOPT_NEW_UYGHUR_FAITH_PICK_ACTION_TYPE: "$RICE_manichean_convert_away_decision_confirm$"
 RICE_manichean_convert_to_nangchos_name: "[GetFaithByKey('lamaism').GetName]"
 RICE_manichean_convert_to_nangchos_desc: "[GetFaithByKey('lamaism').GetNameNoTooltip]"
 RICE_manichean_convert_to_nangchos_tooltip: "来自[GetGeographicalRegion('world_tibet').GetName]的[GetFaithByKey('lamaism').GetAdjective]僧伽们在丝绸之路沿线时常见到。他们弘扬[GetReligionByKey('buddhism_religion').GetAdjective]佛法的方式与我们在[GetFaithByKey('manichean').GetName]习得的方式并无二致，他们也宣扬救度众生……难道他们更是正道？"
 RICE_manichean_convert_to_mahayana_name: "[GetFaithByKey('mahayana').GetName]"
 RICE_manichean_convert_to_mahayana_desc: "[GetFaithByKey('mahayana').GetNameNoTooltip]"
 RICE_manichean_convert_to_mahayana_tooltip: "[GetReligionByKey('buddhism_religion').GetName]中的[GetFaithByKey('mahayana').GetName]在丝绸之路上举足轻重，其僧伽们令人联想起古代的[GetFaithByKey('manichean').GetName]阿罗缓。或许他们更自律且有美德，因为他们宣扬的是普度众生的教义……但我真的能相信他们的话吗？"
 RICE_manichean_convert_to_vajrayana_name: "[GetFaithByKey('vajrayana').GetName]"
 RICE_manichean_convert_to_vajrayana_desc: "[GetFaithByKey('vajrayana').GetNameNoTooltip]"
 RICE_manichean_convert_to_vajrayana_tooltip: "[GetReligionByKey('buddhism_religion').GetName]中的[GetFaithByKey('vajrayana').GetName]法事不仅带来感悟，还会让人联想到[GetFaithByKey('manichean').GetName]丰富多彩、充满活力的法事。或许，它们更具吸引力，是因为它们宣扬涅槃和普度众生……但这足以称得上是真理吗？"
 RICE_manichean_convert_to_zhengyi_name: "[GetFaithByKey('zhengyi').GetName]"
 RICE_manichean_convert_to_zhengyi_desc: "[GetFaithByKey('zhengyi').GetNameNoTooltip]"
 RICE_manichean_convert_to_zhengyi_tooltip: "在中国，有些人声称中国先知老子实际上是先知摩尼的过去身，[GetFaithByKey('manichean').GetAdjective]的阿罗缓也这么认为，但现在有些人却认为恰恰相反。那么皈依[GetFaithByKey('zhengyi').GetName]真的需要付出巨大的付出吗？"
 RICE_manichean_convert_to_nestorian_name: "[GetFaithByKey('nestorian').GetName]"
 RICE_manichean_convert_to_nestorian_desc: "[GetFaithByKey('nestorian').GetNameNoTooltip]"
 RICE_manichean_convert_to_nestorian_tooltip: "[GetFaithByKey('nestorian').GetName]教会遍布中亚，甚至游牧民族也信奉。[GetFaithByKey('manichean').GetName]的一个重要信条是摩尼是耶稣的使徒，他们总说[GetReligionByKey('christianity_religion').GetAdherentNamePlural]是误入歧途，教义腐朽，但如果情况恰恰相反呢？"
 RICE_manichean_convert_to_maturidi_name: "[GetRiteByKey('hanafi').GetName]"
 RICE_manichean_convert_to_maturidi_desc: "[GetRiteByKey('hanafi').GetNameNoTooltip]"
 RICE_manichean_convert_to_maturidi_tooltip: "[GetReligionByKey('islam_religion').GetName]的兴起永远地改变了世界历史，其信徒们对正义和慈善的论调令人着迷，更何况他们还宣称自己拥有一位先知，而先知的教义正是对先前被腐化教义的复兴。难道他们掌握着真正的、未被腐化的正道吗？"
 RICE_manichean_convert_to_khurmazta_name: "[GetFaithByKey('khurmazta').GetName]"
 RICE_manichean_convert_to_khurmazta_desc: "[GetFaithByKey('khurmazta').GetNameNoTooltip]"
 RICE_manichean_convert_to_khurmazta_tooltip: "几个世纪以来，[GetFaithByKey('manichean').GetAdjective]和[GetReligionByKey('zoroastrianism_religion').GetAdjective]一直并存，而我们熟悉的后者在丝绸之路上以[GetFaithByKey('khurmazta').GetName]的形式在当地存在。难道正道一直就隐藏在我们之中吗？"
 RICE_manichean_recruit_ming_cultists:0 "招募明教信众"
 RICE_manichean_recruit_ming_cultists_tooltip:1 "可怜天下人民！面临诸多苦难！"
 RICE_manichean_recruit_ming_cultists_desc:0 "[ROOT.Char.GetCulture.GetName]人[ROOT.Char.GetFaith.GetName]信徒如同姊妹兄弟，世世代代饱受邪恶压迫。让我们团结起来，拿起武器，团结互助，保护世界免受邪恶侵害！"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_1:1 "使用[decision|E]所需的[gold_i|E][gold|E]和[piety_i|E][piety|E]成本会基于你的[diplomacy_i|E][diplomacy|E]和[learning_i|E][learning|E]调整"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_2:1 "[decision|E]的冷却时间取决于你的[stewardship_i|E][stewardship|E]"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_3:1 "你将基于你的[martial_i|E][martial|E]和[intrigue_i|E][intrigue|E]获得#V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_recruit_ming_cultists_levies_amount')]#![levies|E]"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_4:1 "你将获得基础的#V 300名#![men_at_arms|E]，此外每拥有一个下面的[traits|E]将额外获得#V 100名#![men_at_arms|E]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_physician').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('erudite').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('peasant_leader').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('heresiarch').GetName( GetNullCharacter )|U]"
 RICE_manichean_recruit_ming_cultists_confirm:0 "救苦救难，为善除恶！"
 RICE_manichean_recruit_ming_cultists_context_tooltip:0 "#emphasis 历史背景：#!五代、两宋时将许多异端叛乱团体定性为“食菜事魔”的摩尼教徒，但这种说法并非全无根据。与其他摩尼教相比，中国的摩尼教确实更为尚武，这很可能是为了抵御政府屡次的镇压。例如，据传许多教徒精通武术，而中国的摩尼教很可能参与了多次农民起义。事实上，中国的摩尼教对武侠小说大师金庸笔下的虚构武术门派——#italic 明教#!产生了重大影响。"
 manichean.0000.t:0 "xxxxx"
 manichean.0000.desc:0 "xxxxx"
 manichean.0000.a:0 "xxxxx"
 manichean.0001.t:0 "摩尼教义重返[GetGeographicalRegion('RICE_region_mesopotamia').GetNameNoTooltip]"
 manichean.0001.desc:0 "救世主耶稣的使徒与光明先知——摩尼诞生于[GetGeographicalRegion('RICE_region_mesopotamia').GetName]，正是在那里他开始宣扬其教义，据说不仅是所有宗教的终极真理，更在深邃与真理上超越了一切。\n\n近年来，摩尼教徒饱受其他宗教信徒歧视与迫害，在摩尼故土尤甚。\n\n这一局面因[manichean_reviver.GetTitledFirstName]而改变。这位[manichean_reviver.GetFaith.GetName]的强力庇护者统治着[GetGeographicalRegion('RICE_region_mesopotamia').GetNameNoTooltip]大部分，主导了该地区摩尼教的复兴。\n\n光明信仰的追随者们终于在这位虔诚仁厚的统治者治下，获得了长久渴望与祈祷的和平自由。新月沃土的城市如今涌现无数精美的[manichean_reviver.GetFaith.GetAdjectiveNoTooltip]典籍、绘画与艺术品；居民们歌颂先知摩尼与[manichean_reviver.GetFaith.HighGodName]的荣光；而居住于此的[Glossary('阿罗缓','ELECT_GLOSS')]们昼夜不停地践行戒律，为解放光明而奋斗。"
 manichean.0001.a:0 "这是摩尼教会历史的新篇章。"
 manichean.0002.t:0 "修行问题"
 manichean.0002.desc:0 "我们近期成功地在[GetGeographicalRegion('RICE_region_mesopotamia').GetName]故乡复兴摩尼教，引发人们关于#bold 隐修#!制度的质疑，尤其是在[Glossary( '阿罗缓', 'ELECT_GLOSS' )]中十分流行。\n\n有些人开始重新思考出家修行的必要性，认为这是教会错误地从其他宗教，尤其是[GetReligionByKey('buddhism_religion').GetName]借鉴而来的做法，即便我们如摩尼所教导的那样吸收其他信仰的思想来传播真理教义，也不意味着我们必须#italic 全盘照搬#!。\n\n另一些人则主张，无论这种修行方式是否后来才融入我们，它都是一种有益的实践，都可以帮助[Glossary('阿罗缓','ELECT_GLOSS')]与黑暗斗争，更好地解放光明。"
 manichean.0002.a:0 "没有必要放弃隐修制度。"
 manichean.0002.a.tooltip:0 "[GetDoctrineType('doctrine_monasticism_encouraged').GetBaseName][doctrine|E]不会被替换。"
 manichean.0002.b:0 "是的，让我们借此机会改革[manichean_reviver.GetFaith.GetNameNoTooltip]"
 manichean.0002.b.tooltip:0 "根据有影响力的[Glossary( '阿罗缓', 'ELECT_GLOSS' )]成员的建议，[manichean_reviver.GetFaith.GetNameNoTooltip]应该采用这个新[doctrine|E]。"
 manichean.0003.t:0 "xxxxx"
 manichean.0003.desc:0 "xxxxx"
 manichean.0003.a:0 "xxxxx"
 manichean.0004.t:0 "[GetFaithByKey('manichean').GetNameNoTooltip]时代的终结"
 manichean.0004.desc:0 "沉重的消息正在全世界零散的[GetFaithByKey('manichean').GetAdjective]社群间传开：[persecutor.GetTitledFirstName]在中东掀起了新一轮针对[GetFaithByKey('manichean').GetAdherentNamePluralNoTooltip]的迫害。自先知摩尼时代起，历代统治者就曾发起过多次迫害，但这次截然不同。\n\n此次镇压之残酷，连[GetFaithByKey('manichean').GetAdjectiveNoTooltip]教会的领袖[archegos.GetTitledFirstName]都认为，作为[GetFaithByKey('manichean').GetNameNoTooltip]传统中心和古老家园的[GetGeographicalRegion('RICE_region_mesopotamia').GetName]，已不再适合光明信徒居住。\n\n尽管[archegos.GetSheHe]被迫退位并改信[persecutor.GetFaith.GetName]，但[archegos.GetFirstNameNoTooltip]仍带着忠诚信徒东逃，沿丝绸之路前往中国——那里仍有古老的[GetFaithByKey('manichean').GetAdjectiveNoTooltip]社群存续。他们在[county.GetNameNoTier]为[GetTitleByKey('d_manichean').GetNameNoTier]重建了新家园。\n\n历经重重危机的[GetFaithByKey('manichean').GetNameNoTooltip]，能否熬过此次劫难，唯有时间能给出答案。"
 manichean.0004.a:0 "[ROOT.Char.GetFaith.DevilName]的力量愈发强大了！"
 manichean.0004.b:0 "[GetTitleByKey('d_manichean').GetNameNoTierNoTooltip]将来是否又要被迫迁徙？"
 manichean.0004.tooltip:0 "[GetTitleByKey('d_manichean').GetNameNoTierNoTooltip]从[GetTitleByKey('c_kufa').GetNameNoTier]迁至[GetTitleByKey('c_samarkand').GetNameNoTier]"
 manichean.0005.t:0 "灵知净化"
 manichean.0005.desc:0 "我们新确立的真正信仰——[ROOT.Char.GetFaith.GetName]，其根基在于[GetTenetType('tenet_gnosticism').GetBaseName]教义，以及对灵魂净化的追求。为此，我们的[ROOT.Char.GetFaith.PriestNeuterPlural]正探讨如何将这种净化融入日常宗教仪轨。"
 manichean.0005.a:0 "洗礼：定期浸入圣水中"
 manichean.0006.t:0 "摩尼水晶印章"
 manichean.0006.desc:0 "多年前我们在[GetGeographicalRegion('RICE_region_mesopotamia').GetNameNoTooltip]被敌人打压亵渎并毁坏摩尼的圣物，我们一度以为这些圣物都已湮没在历史长河中。\n\n然而，似乎有一件例外。\n\n起初没人相信，但#bold 摩尼水晶印章#!竟被领土内虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]找到，最睿智博学的[Glossary( '阿罗缓', 'ELECT_GLOSS' )]也确认，这的确曾是摩尼亲手所用之物！\n\n这件可能是摩尼最后仅存的圣物，现已置于我的保护之下，确保它永远不会再遗失或面临毁灭！"
 manichean.0006.a:0 "光明愈发明亮。"
 manichean.0007.t:0 "$manichean.0006.t$"
 manichean.0007.desc:0 "#bold 摩尼用过的水晶印章#!已被寻回！这则振奋人心的消息已传遍全世界。\n\n水晶印章的真实性已经被[discoverer.GetFaith.GetAdjectiveNoTooltip][Glossary( '阿罗缓', 'ELECT_GLOSS' )]确认，现在由[discoverer.GetFaith.GetAdjective]信徒[discoverer.GetTitledFirstName]保管。\n\n自视为光明先知摩尼及其创立的摩尼教追随者都为此欢欣鼓舞，因为这块水晶印章很可能是先知摩尼仅存的遗物，其他遗物早在古代的迫害时期中被毁。"
 manichean.0007.a:0 "对于摩尼教的信徒来说，这无疑是值得庆贺的时刻。"
 manichean.0008.t:0 "xxxxx"
 manichean.0008.desc:0 "xxxxx"
 manichean.0008.a:0 "xxxxx"
 manichean.0009.t:0 "xxxxx"
 manichean.0009.desc:0 "xxxxx"
 manichean.0009.a:0 "xxxxx"
 RICE_uyghur_manichean_decision_intro:0 "自坚定捍卫光明信仰的[GetTitleByKey('e_uyghur_khanate').GetNameNoTier]覆灭，他国迫害，摩尼教会近年来遭受重创。更糟糕的是，有人指责[Glossary('阿罗缓', 'ELECT_GLOSS')]腐败堕落，生活奢靡，无视摩尼圣人之教诲。\n\n为了应对[GetGeographicalRegion('RICE_greater_qocho_region').GetName]摩尼教内日益增长的危机，一位本地强力统治者[uyghur_leader.GetTitledFirstName]已"
 RICE_uyghur_manichean_decision_conclusion:0 "\n\n不管是出于虔信与美德，还是仅仅政治之便，又或者兼而有之，[uyghur_leader.GetFirstNamePossessive]之治标志着光明信仰的分界时刻。只有时间能告诉我们[uyghur_leader.GetHerHis]的行动，以及其他地区内的或信徒或非信徒的行为对该地摩尼教轨迹的影响。"
 manichean.0010.t:0 "再次支持摩尼教会"
 manichean.0010.desc:0 "$RICE_uyghur_manichean_decision_intro$发起了一场运动，通过各种方式加强对[uyghur_leader.GetCulture.GetName][uyghur_leader.GetFaith.GetAdjective]的支持，从财政支持到赋予其更大的政治影响力。[uyghur_leader.GetSheHe|U]还宣称，那些诋毁并诬告[Glossary( '阿罗缓', 'ELECT_GLOSS' )]腐败的人，是想摧毁[uyghur_leader.GetFaith.DevilName]。$RICE_uyghur_manichean_decision_conclusion$"
 manichean.0010.a:0 "这是[uyghur_leader.GetCulture.GetCollectiveNounNoTooltip]土地上的动荡时期……"
 manichean.0011.t:0 "摩尼教会内部的必要改革"
 manichean.0011.desc:0 "$RICE_uyghur_manichean_decision_intro$用了各种方式改革[uyghur_leader.GetCulture.GetName] [uyghur_leader.GetFaith.GetAdjective]。[uyghur_leader.GetSheHe|U]认真对待了关于部分[Glossary( '阿罗缓', 'ELECT_GLOSS' )]腐败贪婪的指控，也仍然相信阿罗缓机制是好的。显然部分[Glossary( '阿罗缓', 'ELECT_GLOSS' )]对这样的政治干预感到不满，不过其他虔诚的[uyghur_leader.GetFaith.GetAdherentNamePluralNoTooltip]对这些重振教会所的改革表示欢迎。$RICE_uyghur_manichean_decision_conclusion$"
 manichean.0011.a:0 "$manichean.0010.a$"
 manichean.0012.t:0 "放弃摩尼教会"
 manichean.0012.desc:0 "$RICE_uyghur_manichean_decision_intro$公开表示对[uyghur_leader.GetCulture.GetName]的[uyghur_leader.GetFaith.GetAdjective]宗教以及教士的腐败和贪婪感到不满，甚至幻灭，这让[Glossary( '阿罗缓', 'ELECT_GLOSS' )] 的支持率暴跌，有传言称[uyghur_leader.GetFirstNameNoTooltip]试图庇护其他宗教的信徒，并将[uyghur_leader.GetFaith.GetAdjectiveNoTooltip]的财产挪作他用。$RICE_uyghur_manichean_decision_conclusion$"
 manichean.0012.a:0 "$manichean.0010.a$"
 manichean.0013.t:0 "对[ROOT.Char.GetCulture.GetNameNoTooltip]中的[ROOT.Char.GetFaith.GetNameNoTooltip]幻灭"
 manichean.0013.desc:0 "近来我对领地上出现的[new_faith.GetName]产生了兴趣，这些信徒们似乎品行端正、值得称赞，与我眼中[ROOT.Char.GetFaith.GetName]内部泛滥的腐败堕落形成鲜明对比。\n\n这让我公开表达了对[ROOT.Char.GetCulture.GetName]中的[ROOT.Char.GetFaith.GetAdjective]体制的不满，这自然在领地内引发了无数争议。\n\n不过，对自身信仰产生厌倦是一回事，真正皈依新教又是另一回事了。"
 manichean.0013.desc.chaplain:0 "[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]在听到我希望终止对[ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetFaith.GetNameNoTooltip]支持的谣言后，恳求我重新考虑。"
 manichean.0013.a:0 "我已经决定，[new_faith.GetName]才是真信！"
 manichean.0013.b:0 "我虽然感到失望，但要改变信仰实在太过分了。"
 manichean.0013.b.tooltip:0 "即使你不立即皈依，你仍然可以在接下来的#V 100#!年内获得皈依[decision|E]。"
 manichean.0014.t:0 "残余汗国国王"
 manichean.0014.desc:0 "[GetTitleByKey('e_uyghur_khanate').GetNameNoTier]曾与强大的中国、吐蕃和阿拉伯帝国并立的世界强国之一，也是[GetFaithByKey('manichean').GetAdjective]教会的捍卫者。若先辈们看到如今现况，定会潸然泪下！\n\n汗国崩塌后，我们四散流离，一支[ROOT.Char.GetCulture.GetCollectiveNoun]逃往[GetTitleByKey('c_kara_khoja').GetNameNoTierNoTooltip]地区，建立了由我统治的汗国残余。在此地，我们[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]艰难求存，内部分裂，外敌环伺，[GetTitleByKey('k_hexi').GetNameNoTier]军也对我们虎视眈眈，就连我们长期支持的[GetFaithByKey('manichean').GetAdjectiveNoTooltip]教会也深陷腐败与堕落的指控。\n\n然而危机亦是转机，承受苦难的不仅是我们[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]。宿敌同样自顾不暇，这场信仰危机或许是重大宗教变革的契机。"
 manichean.0014.a:0 "无论发生什么，我都会尽我所能带领我的人民前进！"
 manichean.0014.info:0 "#emphasis 历史背景：#!公元840年左右，回鹘汗国属部黠戛斯击败后，回鹘人部分西迁，部分南下，南下的回鹘人与唐朝发生冲突而亡，其中回鹘残余势力中最强大的是西迁的高昌回鹘（位于准噶尔盆地和塔里木盆地北部）。在9世纪的数十年中，高昌回鹘与归义军争夺该地区的霸权，双方在不同地点互相攻伐。"
 manichean.0015.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 manichean.0015.desc:0 "[GetTitleByKey('e_uyghur_khanate').GetNameNoTier]曾经主宰了草原，即使是强大的中华帝国、吐蕃帝国与阿拉伯帝国也不得不平等对待我们的祖先。然而，帝国的崩溃对我们来说是一个巨大的打击，我们只得四散奔逃。\n\n我不敢断言旧帝国已经归来——至少没恢复到鼎盛那般。然而，我已经通过外交、战争、宗教组织的支持等等手段为[ROOT.Char.GetCulture.GetCollectiveNoun]巩固了一个[GetGeographicalRegion('RICE_greater_qocho_region').GetName]。\n\n[ROOT.Char.GetPrimaryTitle.GetName]再也不是旧汗国的附属国，而是一个强大的独立王国。随着我们新家园的建立，我们可以再次骄傲地与其他强大的王国平起平坐。"
 manichean.0015.a:0 "我们的未来无疑是光明的。"
 manichean.0016.t:0 "新的信仰"
 manichean.0016.desc:0 "摩尼教在[GetGeographicalRegion('RICE_former_uyghur_influence_region').GetName]急剧衰落，原因包括缺乏强大的赞助者、在异国他乡持续受到镇压，以及[Glossary( '阿罗缓', 'ELECT_GLOSS' )]阶层内部存在大量关于腐败、贪婪和奢靡生活方式的指控。\n\n随着社会上越来越多的精英撤回对[ROOT.Char.GetCulture.GetName][ROOT.Char.GetFaith.GetAdjective]机构的支持或彻底拒绝它们。\n\n现在，我已转向更具吸引力的[new_faith.GetName]，它的信徒已在我的领地内被发现，他们得知我与他们站在一起，而非摩尼的虚假教诲，这令他们感到非常高兴。让我们将自己奉献给[new_faith.HighGodName]，并支持那些更具美德和神启的[new_faith.GetAdjectiveNoTooltip][new_faith.PriestNeuterPlural]！"
 manichean.0016.a:0 "荣耀归于[new_faith.HighGodNameAlternate]！"
