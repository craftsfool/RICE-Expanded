 manichean.0050.t:0 "委托撰写[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]典籍"
 manichean.0050.desc:0 "正如先知摩尼教诲，书籍的保存对宗教至关重要。其他先知的教义在他们去世后遭到歪曲，但充满智慧的摩尼敦促我们尽可能记录下他的话语，所有符合他教义的文字从而保持纯净信仰。\n\n我希望委托编撰一本[ROOT.Char.GetCulture.GetName]寓言故事集。这些广为流传的故事是向信徒传授[ROOT.Char.GetFaith.GetName]教义的绝佳方式。\n\n我可以请其他人来完成这项工作，尤其是[Glossary( '阿罗缓', 'ELECT_GLOSS' )]中的一人……或者#italic 我#!亲自动手，只要在文学上有足够的造诣即可。毕竟书籍是神圣的，撰写阐述摩尼教诲本身就是一种敬拜行为。"
 manichean.0050.a:0 "花钱让书吏来处理。"
 manichean.0050.b:0 "我自己即可撰写典籍"
 manichean.0050.tooltip:0 "该典籍将需要一年的时间才能完成，但也可能更快。"
 manichean.0051.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]典籍"
 manichean.0051.desc.self:0 "经过无数个日日夜夜看似永无止境的辛劳，我终于完成了这部[ROOT.Char.GetFaith.GetAdjective]典籍，融合了[ROOT.Char.GetCulture.GetName]文学风格，来阐述摩尼的深邃教义。\n\n即便最终成书并非世间至美之作，但正如摩尼教导我们的那样：以任何方式向世人传播他那无与伦比的教义，这件事本身就是一种善行。\n\n尤其是这部典籍"
 manichean.0051.desc.other:0 "经过无数个日日夜夜看似永无止境的辛劳，我委托的书吏终于完成了这部[ROOT.Char.GetFaith.GetAdjective]典籍，融合了[ROOT.Char.GetCulture.GetName]文学风格，来阐述摩尼的深邃教义。\n\n像所有[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]典籍一样，文本证明了我们学者的技能、我们工匠的美丽以及我们信仰的真实。\n\n尤其是这部典籍"
 manichean.0051.desc:0 "是#bold [ROOT.Char.GetFaith.GetNameNoTooltip]中七大典籍#!之一，这些典籍中蕴含着智慧与教诲，将引领摩尼教会。"
 manichean.0051.a:0 "希望这份典籍能够帮助传播摩尼教的教义。"
 manichean.0052.desc:0 "#bold 《二宗经》#!，这是摩尼向萨珊王朝沙普尔一世提供的教义摘要。它是介绍或提醒我们信仰戒律的绝佳文本。"
 manichean.0053.desc:0 "#bold 《大二宗图》#!，为了方便文盲理解教义，以视觉图像来说明摩尼教的宇宙观，复制摩尼本人绘制的图画比写下他的文字更具挑战性，但如果我们要向文盲大众传播教义，这是一项必要的任务！"
 manichean.0054.desc:0 "是一部#bold 《克弗来亚》#!，阐述了摩尼的教义，并经常引用摩尼生平中的例子。这些故事不仅传授我们的信仰，也具有故事和文学价值。"
 manichean.0055.desc:0 "是一本#bold 赞美诗集#!，包含在各种宗教、政治或更世俗些的仪式中颂唱的赞美诗。这些赞美诗在我们日常中无处不在，时刻提醒我们牢记摩尼的教诲。"
 manichean.0056.desc:0 "是一部#bold 忏悔录#!，指导我们忏悔自己的罪过，这在我们的宗教中是一项重要的修行。正如摩尼教导我们的，这是帮助解放光明的一种重要方式。"
 manichean.0057.desc:0 "从摩尼教教义的角度讲述的各种[ROOT.Char.GetCulture.GetNameNoTooltip]的#bold 寓言和故事#!。通过这些引人入胜的故事，愿我们能够更好地理解摩尼给我们的教诲。"
 manichean.0058.desc:0 "一部经过修改的神圣#bold [other_faith.GetAdjective]经文#!副本。摩尼并没有阻止我们学习其他信仰；事实上，他鼓励我们从其他宗教经文中发掘他隐藏的真理，并正确地重新诠释它们。"
 manichean.0059.t:0 "废弃的抄本"
 manichean.0059.desc:0 "前些时日，我委托誊写一部旨在传播所谓先知摩尼教义的经卷。\n\n如今我已皈依[ROOT.Char.GetFaith.GetName]，而非那套所谓光明宗教的虚妄教条。故此我果断叫停了这部经卷的编撰。"
 manichean.0059.a:0 "我找到了一条更优越的信仰之路。"
