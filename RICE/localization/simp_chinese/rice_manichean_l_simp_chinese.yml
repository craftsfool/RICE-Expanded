 RICE_manichean_reviver_legend_name: "摩尼的化身"
 RICE_manichean_reviver_legend_desc: "最后的先知、耶稣的使徒、慧明圣使摩尼的追随者对[faith.DevilName]失去所有希望时，[reviver.GetTitledFirstName]带领信徒夺回了摩尼教圣地[GetGeographicalRegion('world_mesopotamia').GetName]，并在那里重新传播他的教义。"
 RICE_manichean_reviver_legend_chapter_opening_new_title: "在过去的黑暗时代，[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName]似乎每一次都击败了摩尼虔诚的追随者。教会受到的压迫和诋毁屡见不鲜，甚至许多教会成员也堕入了罪恶和绝望种。"
 RICE_manichean_reviver_legend_chapter_motivation_new_title: "但对教会来说并非没有好消息，赞美摩尼！教会迷失了方向，但在雄伟而强大的[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]中寻找到了新的勇士。[ROOT.Legend.GetProtagonist.GetSheHe|U]看到摩尼教团多么贫乏窘困，在黑暗面前多么弱小。尽管如此，[ROOT.Legend.GetProtagonist.GetSheHe]知道他们必须为捍卫和解放光明而战。"
 RICE_manichean_reviver_legend_chapter_famous_deed_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]召集了一支正义的阿罗缓和耨沙喭的队伍，挺进摩尼的家乡新月沃地的丰饶平原，驱逐了[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName]罪恶凶猛的士兵。摩尼的追随者在底格里斯河和幼发拉底河之间重新掌权，并在[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]的领导下开始重建那里的教堂。"
 RICE_manichean_reviver_legend_chapter_extra_deed_new_title: "幸运的是，连摩尼教会的领袖#italic 光明使者#!也得以回归他们古代在巴比伦的宝座，这多亏了[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的贡献。"
 RICE_manichean_reviver_legend_chapter_conclusion_new_title: "摩尼的教会重返新月沃地以及随之而来的复兴简直是一个奇迹。然而，这样的奇迹之所以发生，是因为阿罗缓和耨沙喭在[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]的权威引领下，与[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName]的邪恶作了艰苦而英雄的斗争。由于[ROOT.Legend.GetProtagonist.GetHerHis]在拯救和传播光明宗教的贡献，即使在几个世纪后，摩尼教仍将继续赞扬[ROOT.Legend.GetProtagonist.GetHerHis]的名，并认为[ROOT.Legend.GetProtagonist.GetHerHim]与摩尼的使徒并列。"
 RICE_manichean_mani_sealstone_name:0 "摩尼水晶印章"
 RICE_manichean_mani_sealstone_desc:0 "很久以前，[manichean_faith.GetAdjective]创始人兼先知摩尼据说拥有一枚水晶印章，印章上刻有他本人和两名追随者的身影。在他受难和[Glossary( '圆寂', 'MANICHEAN_PARINIRVANA_GLOSS' )]后，一代又一代虔诚[manichean_faith.GetAdherentNamePluralNoTooltip]都将其视为圣物，但在摩尼教遭受的多次迫害中，这枚印章最终丢失了。\n\n多年后，在[discoverer.GetTitledFirstName]的努力下，这块印章被重新发现。虽然年代久远，它却基本完好无损，上面的[syriac_culture.GetName]铭文也基本清晰可辨：“摩尼，耶稣基督的使徒”。"
 RICE_manichean_manuscript_creator_self_name:0 "[ROOT.Char.GetTitledFirstName]"
 RICE_manichean_manuscript_creator_others_name:0 "受[ROOT.Char.GetTitledFirstName]赞助的书吏"
 RICE_manichean_manuscript_opening_desc:0 "该著作由[GetPlayer.Custom('RICE_manichean_manuscript_creator')]用[ROOT.Char.GetCulture.GetLanguage.GetName]撰写，是一篇闻名遐迩的[ROOT.Char.GetFaith.GetAdjective]精美著作。"
 RICE_random_manichean_canonical_scripture_01:0 "#bold 《彻尽万法根源智经》#!是[ROOT.Char.GetFaith.GetNameNoTooltip]最重要的经文，且是唯一真实的福音书，虽然因外人误解而被破坏，但却讲述了弥赛亚光明夷数的真实故事。"
 RICE_random_manichean_canonical_scripture_02:0 "#bold 《净命宝藏经》#!内包含了先知摩尼关于人和宇宙的详细解释，以及我们哪些部分来自光明领域，哪些部分来自黑暗领域。"
 RICE_random_manichean_canonical_scripture_03:0 "#bold 《律藏经》#!是先知摩尼与其亲传弟子之间的书信集，起到解释[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]教义的目的，并论证摩尼教的正确性。"
 RICE_random_manichean_canonical_scripture_04:0 "#bold 《赞愿经》#!内收录摩尼及其弟子所创作的诗歌。"
 RICE_random_manichean_canonical_scripture_05:0 "#bold 《证明过去教经》#!一篇从[ROOT.Char.GetFaith.GetAdjective]角度概述人类历史的典籍。"
 RICE_random_manichean_canonical_scripture_06:0 "#bold 《大力士经》#!记载的巨人的故事，扩展了《以诺书》，据[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]的教义，在大洪水之前，光明使者们派遣一些守望者去看守这些恶魔。然而，这些守望者们逐渐被恶魔诱惑而堕落并失去了神性，来到地上，犯下种种恶行，把奇技淫巧教给人类，把天上的秘密告诉人类。他们与人类的女儿交合，生下了巨人，而后这些巨人被天使们击败。"
 RICE_random_manichean_canonical_scripture_07:0 "#bold 《秘密法藏经》#!讨论了有关灵魂本质，批判了假先知的教义，并论证了最后一位先知摩尼的真实性。"
 RICE_manichean_artifact_seven_treatises_name:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]正经"
 RICE_manichean_artifact_seven_treatises_desc:0 "$RICE_manichean_manuscript_opening_desc$[ROOT.Char.GetFaith.GetName]一共有七部经典著作。\n\n这份抄本是[GetPlayer.Custom('RICE_random_manichean_canonical_scripture')]\n\n#EMP 装备此[artifact|E]可降低$RICE_manichean_confession_decision$[decision|E]和[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]的[gold_i|E][gold|E]成本。#!"
 RICE_manichean_artifact_shabuhragan_name:0 "《二宗经》"
 RICE_manichean_artifact_shabuhragan_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作是#bold 《二宗经》#!抄本，由摩尼亲自为萨珊王朝君王沙普尔一世撰写，阐述摩尼教的教义梗概。它是一部极佳的著作，可用于介绍或提醒[ROOT.Char.GetFaith.GetNameNoTooltip]的重要戒律。\n\n#EMP 装备此[artifact|E]可在[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外获得[prestige_i|E][prestige|E]。#!"
 RICE_manichean_artifact_arzhang_name:0 "《大二宗图》"
 RICE_manichean_artifact_arzhang_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作是#bold 《大二宗图》#!的抄本，为了方便文盲理解教义，由摩尼亲手绘制，以视觉图像来说明摩尼教的宇宙观以及光明王国和黑暗王国的情况。\n\n#EMP 装备此[artifact|E]可在[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中使得每位宾客增加对你[opinion_i|E][opinion|E]。#!"
 RICE_manichean_artifact_kephalaia_name:0 "《克弗来亚》"
 RICE_manichean_artifact_kephalaia_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作收录了#bold 《克弗来亚》#!，这些典籍阐述了摩尼的教义，并经常引用摩尼生平中的例子。这些故事不仅传授[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]的信仰，也具有故事和文学价值。\n\n#EMP 装备此[artifact|E]可在[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外获得[piety_i|E][piety|E]。#!"
 RICE_manichean_artifact_hymn_book_name:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]赞美诗集"
 RICE_manichean_artifact_hymn_book_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作包含[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]在各种法事上吟唱的赞美诗，这些法事既包括宗教、政治和世俗，可以传播[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]的教义。\n\n#EMP 装备此[artifact|E]可在举办[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外获得[legitimacy_i|E][legitimacy|E]。#!"
 RICE_manichean_artifact_confessional_texts_name:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]忏悔录"
 RICE_manichean_artifact_confessional_texts_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作包含[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]文本。可以引导[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]完成忏悔的过程。忏悔是摩尼教信徒的重要修行，据说也是帮助光明解放的重要途径之一。\n\n#EMP 装备此[artifact|E]可在$RICE_manichean_confession_decision$[decision|E]和[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外减少[stress_loss_i|E][stress|E]。#!"
 RICE_manichean_artifact_parables_and_tales_name:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]寓言和故事"
 RICE_manichean_artifact_parables_and_tales_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作包含各种[ROOT.Char.GetCulture.GetNameNoTooltip]#bold 寓言和故事#!，以教义的视角讲述并重新诠释这些引人入胜的故事，让忠实信徒以及那些正在接受其教义的人们更好地理解摩尼教的教义。\n\n#EMP 装备此[artifact|E]可在举办[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]中额外获得[lifestyle_experience|E]。#!"
 RICE_manichean_artifact_other_religions_texts_name:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]对[other_faith.GetAdjectiveNoTooltip]典籍阐述"
 RICE_manichean_artifact_other_religions_texts_desc:0 "$RICE_manichean_manuscript_opening_desc$这份著作是#bold [other_faith.GetAdjective]典籍的修改本#!。先知摩尼并没有阻止他的追随者学习其他信仰，反而鼓励他们去发现隐藏在其他宗教经文中的真理，并“正确地”重新诠释它们，使其更符合他的教义。\n\n#EMP 装备此[artifact|E]可降低为遵循摩尼教义[faiths|E]委托手稿[decision|E]的[gold_i|E][gold|E]成本。#!"
 trait_RICE_disciple_of_lin_deng_info:0 "\n\n#emphasis  该[trait|E][trait_level_track_xp|E]是通过完成与带有$rice_light_purification_doctrine$[doctrine|E]的[faiths|E]相关的[decisions|E]和[activities|E]来获得的。#!"
 trait_RICE_disciple_of_lin_deng:0 "师承林瞪"
 trait_RICE_disciple_of_lin_deng_desc:0 "该角色是一位法事师傅，其师承林瞪，林瞪乃中国东南部的传奇摩尼教圣贤领袖，至今仍因其事迹而受到当地人的崇敬，因此该角色致力传承林瞪遗志，无论信仰如何。\n\n#weak 一旦该角色的[children|E]成为[adults|E]时就会继承此[trait|E]。#!"
 trait_RICE_disciple_of_lin_deng_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是一位法事师傅，其师承林瞪，林瞪乃中国东南部的传奇摩尼教圣贤领袖，至今仍因其事迹而受到当地人的崇敬，因此[ROOT.GetCharacter.GetFirstNameNoTooltip]致力传承林瞪遗志，无论[ROOT.GetCharacter.GetHerHis]信仰如何。\n\n#weak 一旦该角色的[children|E]成为[adults|E]时就会继承此[trait|E]。#!"
 trait_RICE_disciple_of_lin_deng_2:0 "可敬尊者"
 trait_RICE_disciple_of_lin_deng_2_desc:0 "$trait_RICE_disciple_of_lin_deng_desc$"
 trait_RICE_disciple_of_lin_deng_2_character_desc:0 "$trait_RICE_disciple_of_lin_deng_character_desc$"
 trait_RICE_disciple_of_lin_deng_3:0 "得道真人"
 trait_RICE_disciple_of_lin_deng_3_desc:0 "$trait_RICE_disciple_of_lin_deng_desc$"
 trait_RICE_disciple_of_lin_deng_3_character_desc:0 "$trait_RICE_disciple_of_lin_deng_character_desc$"
 trait_track_RICE_disciple_of_lin_deng:0 "$trait_RICE_disciple_of_lin_deng$"
 trait_track_RICE_disciple_of_lin_deng_desc:0 "#italic 生亦何欢，死亦何苦？为善除恶，唯光明故。喜乐悲愁，皆归尘土。怜我世人，忧患实多#!"
 RICE_manichean_aspiration_chen_pingshan_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[GetTrait('RICE_disciple_of_lin_deng').GetName( GetNullCharacter )][trait|E]获得#V 100点#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$至少有一个[adult|E]孩子具有[GetTrait('RICE_disciple_of_lin_deng').GetName( GetNullCharacter )][trait|E]\n$EFFECT_LIST_BULLET$[piety_level|E]达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高\n$EFFECT_LIST_BULLET$至少用过一次$RICE_manichean_lin_deng_decision$[decision|E]\n$EFFECT_LIST_BULLET$保持[faith|E]中有$rice_light_purification_doctrine_name$[doctrine|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$你的[dynasty|E]获得[GetModifier('RICE_manichean_lin_deng_spiritual_lineage_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$获得[learning_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![piety|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$[prestige_level|E]达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高（奖励：获得[diplomacy_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$至少用过一次$RICE_manichean_recruit_ming_cultists$[decision|E]（奖励：获得[martial_lifestyle|E][perk|E]）"
 RICE_manichean_historical_aspiration_action_chen_pingshan: "#italic 你的已故上师林瞪曾传授你摩尼光佛的无上教理，以及各种造福众生法事。随着上师圆寂，你有责任传承师父的教诲，并维护他的精神传承。#!$RICE_manichean_aspiration_chen_pingshan_desc$"
 RICE_manichean_historical_aspiration_modifier_desc_chen_pingshan: "[GetModifier('RICE_manichean_aspiration_continue_lin_dengs_legacy').GetNameWithTooltip]"
 RICE_manichean_aspiration_bokut_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$属于$uyghur$[culture|E]，或有$heritage_turkic_name$[heritage|E]的[culture|E]，亦或$uyghur$分支文化\n$EFFECT_LIST_BULLET$是[independent|E][king|E]或[emperor|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetGeographicalRegion('RICE_greater_qocho_region').GetName][region|E]\n$EFFECT_LIST_BULLET$至少参加一次[GetActivityType( 'activity_RICE_tarim_basin_bezeklik_pilgrimage' ).GetName]\n$EFFECT_LIST_BULLET$[piety_level|E]达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高\n$EFFECT_LIST_BULLET$[prestige_level|E]达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]\n$EFFECT_LIST_BULLET$获得#V 1000名#![special_troops|E]（包括[men_at_arms|E]）\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$每个在[GetGeographicalRegion('RICE_greater_qocho_region').GetName]的[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$与[GetTitleByKey('k_khotan').GetNameNoTier]的[ruler|E][allied|E]或成为其[vassal|E]或对其朝贡，亦或摧毁或持有[title|E]（奖励：#V 1000名#!$heritage_iranian_name$和$heritage_turkic_name$[special_troops|E]，包括[men_at_arms|E]）\n$EFFECT_LIST_BULLET$与[GetTitleByKey('k_hexi').GetNameNoTier]的[ruler|E][allied|E]或成为其[vassal|E]或对其朝贡，亦或摧毁或持有[title|E]（奖励：#V 1000名#!$heritage_chinese_name$[special_troops|E]，包括[men_at_arms|E]）\n$EFFECT_LIST_BULLET$采用一次$RICE_uyghur_manichean_church_decision$[decision|E]（奖励：@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![dynasty_prestige|E]）"
 RICE_manichean_historical_aspiration_action_bokut: "#italic 身为前回鹘汗国残部领袖，如今强敌环绕和摩尼教日渐衰落，但你雄心勃勃地想要恢复回鹘人民在该地区昔日的政治、宗教和经济地位。#!$RICE_manichean_aspiration_bokut_desc$"
 RICE_manichean_historical_aspiration_modifier_desc_bokut: "[GetModifier('RICE_manichean_aspiration_reclaim_uyghur_power_in_qocho').GetNameWithTooltip]"
 RICE_manichean_aspiration_continue_lin_dengs_legacy: "[RICE_aspiration|E]：延续先师林瞪的遗志"
 RICE_manichean_aspiration_continue_lin_dengs_legacy_desc: "#italic 陈平山的已故先师林瞪曾向他传授摩尼光佛的无上教理，以及各种造福众生法事。随着先师圆寂，陈平山义不容辞地要传承林瞪的传承和维护其社群。#!$RICE_manichean_aspiration_chen_pingshan_desc$\n\n"
 RICE_manichean_aspiration_reclaim_uyghur_power_in_qocho: "[RICE_aspiration|E]：重振高昌回鹘势力"
 RICE_manichean_aspiration_reclaim_uyghur_power_in_qocho_desc: "#italic 仆固俊身为前回鹘汗国残部领袖，面对强敌环绕和摩尼教日渐衰落的现实，还是他雄心勃勃地想要恢复回鹘人民在该地区昔日的政治、宗教和经济地位。#!$RICE_manichean_aspiration_bokut_desc$\n\n"
 activity_RICE_manichean_bema_festival_host_an_a:0 "$host_activity_a$"
 activity_RICE_manichean_bema_festival:0 "庇麻节"
 activity_RICE_manichean_bema_festival_desc:0 "在摩尼历年末，最后一位先知摩尼信徒们会纪念他的受难和[Glossary( '圆寂', 'MANICHEAN_PARINIRVANA_GLOSS' )]。据说，在庇麻节期间，摩尼会亲自来赦免罪孽，信徒们会举行仪式，将光从物质的牢笼中释放出来。"
 activity_RICE_manichean_bema_festival_selection_tooltip: "参加庇麻节\n\n$activity_RICE_manichean_bema_festival_context_tooltip$"
 activity_RICE_manichean_bema_festival_context_tooltip:0 "#emphasis 历史背景：#!庇麻节标志着摩尼教宗教年的结束，并纪念摩尼教创始人摩尼的殉道。节日名称“庇麻”源于（希腊语 bēma，意为宝座；波斯语和帕提亚语：gāhrōšn，意为“光明王座”），因为活动的中心是一个空宝座，人们相信摩尼会降临于此，赦免信徒的罪孽。"
 activity_RICE_manichean_bema_festival_host_desc: "\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得#P 正面#![character_modifiers|E]\n$BULLET_WITH_TAB$极小概率会失去[sinful|E]或负面[traits|E]"
 activity_RICE_manichean_bema_festival_guest_desc: "$activity_RICE_manichean_bema_festival_host_desc$"
 activity_RICE_manichean_bema_festival_province_desc: ""
 activity_RICE_manichean_bema_festival_destination_selection: "$activity_RICE_manichean_bema_festival_province_desc$"
 activity_RICE_manichean_bema_festival_guest_help_text: "$activity_RICE_manichean_bema_festival$"
 activity_RICE_manichean_bema_festival_predicted_cost: "[activity|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_manichean_bema_festival_conclusion_desc: "今年的[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]已经结束，那些正直且真心忏悔的人已经获得了赦免！"
 RICE_manichean_bema_festival_fasting_length_type: "时间长度"
 RICE_manichean_bema_festival_fasting_length_type_day: "一天"
 RICE_manichean_bema_festival_fasting_length_type_day_desc: "$BULLET_WITH_TAB$失去负面[traits|E]的概率非常低\n$BULLET_WITH_TAB$几乎不会获得负面[modifier|E]来影响你的[health|E]\n\n$BULLET_WITH_TAB$失去基础的[stress_loss_i|E]#V [EmptyScope.ScriptValue('miniscule_stress_impact_loss')]#![stress|E]\n\n#weak 斋戒一天就足以为庇麻节做准备，因为我不是[Glossary('阿罗缓','ELECT_GLOSS')]#!"
 RICE_manichean_bema_festival_fasting_length_type_week: "一周"
 RICE_manichean_bema_festival_fasting_length_type_week_desc: "$BULLET_WITH_TAB$低概率失去负面[traits|E]\n$BULLET_WITH_TAB$极低概率会获得负面[modifier|E]来影响你的[health|E]\n\n$BULLET_WITH_TAB$失去基础的[stress_loss_i|E]#V [EmptyScope.ScriptValue('minor_stress_impact_loss')]#![stress|E]\n\n#weak 我虽不是[Glossary( '阿罗缓', 'ELECT_GLOSS' )]，但我应该在庇麻节之前充分斋戒来表达我的虔诚#!"
 RICE_manichean_bema_festival_fasting_length_type_month: "一个月"
 RICE_manichean_bema_festival_fasting_length_type_month_desc: "$BULLET_WITH_TAB$有大概率失去负面[traits|E]\n$BULLET_WITH_TAB$低概率会获得负面[modifier|E]来影响你的[health|E]\n\n$BULLET_WITH_TAB$失去基础的[stress_loss_i|E]#V [EmptyScope.ScriptValue('medium_stress_impact_loss')]#![stress|E]\n\n#weak 我虽不是[Glossary( '阿罗缓', 'ELECT_GLOSS' )]，但我身为摩尼教的追随者，我有责任尽我所能，通过在 庇麻节前进行大量禁食来释放光明！#!"
 RICE_manichean_bema_festival_fruit_alms_type: "水果施舍"
 RICE_manichean_bema_festival_fruit_alms_type_small: "适度布施"
 RICE_manichean_bema_festival_fruit_alms_type_small_desc: "$BULLET_WITH_TAB$获得基础[piety_i|E]#V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_piety_small')]#![piety|E]\n$BULLET_WITH_TAB$获得基础[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_prestige_small')]#![prestige|E]\n\n#weak 我会提供适量的水果给[Glossary( '阿罗缓', 'ELECT_GLOSS' )]食用，从而释放光明。#!"
 RICE_manichean_bema_festival_fruit_alms_type_medium: "大量布施"
 RICE_manichean_bema_festival_fruit_alms_type_medium_desc: "$BULLET_WITH_TAB$获得基础[piety_i|E]#V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_piety_medium')]#![piety|E]\n$BULLET_WITH_TAB$获得基础[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_prestige_medium')]#![prestige|E]\n\n#weak 我会提供大量的水果给[Glossary( '阿罗缓', 'ELECT_GLOSS' )]食用，从而释放光明。#!"
 RICE_manichean_bema_festival_fruit_alms_type_large: "倾尽所能"
 RICE_manichean_bema_festival_fruit_alms_type_large_desc: "$BULLET_WITH_TAB$获得基础[piety_i|E]#V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_piety_large')]#![piety|E]\n$BULLET_WITH_TAB$获得基础[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_prestige_large')]#![prestige|E]\n\n#weak 我尽我所能地提供水果给[Glossary( '阿罗缓', 'ELECT_GLOSS' )]食用，从而释放光明。#!"
 RICE_manichean_bema_festival_ceremony_phase: "法事"
 RICE_manichean_bema_festival_ceremony_phase_desc: "当我们释放光明时，摩尼来到我们身边并赦免我们。"
 RICE_manichean_bema_festival_liberation_intent_header: "净化："
 RICE_manichean_bema_festival_liberation_intent: "净化"
 RICE_manichean_bema_festival_liberation_intent_desc: "专注于正确执行释放光明的法事。在基础加成之上获得更多[prestige_i|E][prestige|E]。你[faith|E]的所有虔诚立场[vassals|E]和[courtiers|E]对你+#P +10#![opinion_i|E][opinion|E]。如果你有[GetTrait('diligent').GetName( GetNullCharacter )|U]或[GetTrait('ambitious').GetName( GetNullCharacter )]特质，则额外失去[stress_i|E][stress|E]。"
 RICE_manichean_bema_festival_spiritual_guidance_intent_header: "学道："
 RICE_manichean_bema_festival_spiritual_guidance_intent: "学道"
 RICE_manichean_bema_festival_spiritual_guidance_intent_desc: "专注于学习[Glossary( '阿罗缓', 'ELECT_GLOSS' )]的布道。获得等同于[legitimacy_i|E][legitimacy|E]的[lifestyle|E][experience|E]，如果你拥有[GetTrait('patient').GetName( GetNullCharacter )|U]或[GetTrait('content').GetName( GetNullCharacter )]特质，你还会失去额外的[stress_i|E][stress|E]。"
 RICE_manichean_bema_festival_confession_intent_header: "忏悔："
 RICE_manichean_bema_festival_confession_intent: "忏悔"
 RICE_manichean_bema_festival_confession_intent_desc: "专注于忏悔罪孽。在基础加成之上获得额外[piety_i|E][piety|E]。失去[sinful|E]或负面[traits|E]的概率更高。如果你拥有[GetTrait('honest').GetName( GetNullCharacter )|U]或[GetTrait('humble').GetName( GetNullCharacter )]特质，你还会失去额外的[stress_i|E][stress|E]。"
