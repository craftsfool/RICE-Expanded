 RICE_manichean_bema_festival_lose_sin_log:0 "[CHARACTER.GetShortUIName|U]在真心向摩尼坦白后变得更好了。"
 RICE_manichean_fast_health_malus_effect_log_title:0 "斋戒困难"
 RICE_manichean_fast_health_malus_effect_log:0 "[CHARACTER.GetShortUINamePossessive|U]的身体不适合斋戒。"
 RICE_manichean_uyghur_manicheism_decline:0 "$manichean_adj$教会衰落"
 RICE_manichean_uyghur_manicheism_decline_desc:0 "[GetFaithByKey('manichean').GetAdjective]教会在该地区衰败，其神职人员的腐化导致了大批信徒幻灭，当地精英不再支持教会，越来越多地将资源从教会转移到其他的事业上。\n\n#EMP 该[county|E]的[rulers|E]的[faith|E]遵循$rice_light_purification_doctrine_name$[doctrine|E]将周期性地#N 失去#!少量的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]，其他[faith|E]有此类[doctrine|E]且[modifier|E]活跃则同样如此。#!"
 RICE_manichean_persecutor_of_zindiqs:0 "迫害精底格"
 RICE_manichean_persecutor_of_zindiqs_desc:0 "该角色是[GetGeographicalRegion('world_mesopotamia').GetName]的强大统治者，并开启了针对该地区[Glossary( '精底格', 'ZINDIQ_GLOSS' )]的新迫害时代，屠戮大多数信徒并迫使宗教领袖向东逃亡。"
 RICE_manichean_uyghur_manicheism_empowered_elect:0 "支持阿罗缓"
 RICE_manichean_uyghur_manicheism_empowered_elect_desc:0 "[GetFaithByKey('manichean').GetAdjective]教会在该地区遭受重创，其神职人员的腐败丑闻更是雪上加霜。不过当地[GetFaithByKey('manichean').GetAdjectiveNoTooltip]精英阶层重申了对[Glossary( '阿罗缓', 'ELECT_GLOSS' )]的支持，并将任何有关腐败的谣言斥为亵渎诽谤，这重振了教会的权力和影响力。\n\n#EMP 只要此[modifier|E]处于活动状态，[county|E][rulers|E]的[faith|E]有$rice_light_purification_doctrine_name$[doctrine|E]则定期获得随机[prestige_i|E][prestige|E]。#!"
 RICE_manichean_uyghur_manicheism_reformed_church:0 "改革$manichean_adj$教会"
 RICE_manichean_uyghur_manicheism_reformed_church_desc:0 "[GetFaithByKey('manichean').GetAdjective]教会在该地区遭受重创，其神职人员的腐败丑闻更是雪上加霜。不过当地[GetFaithByKey('manichean').GetAdjectiveNoTooltip]精英阶层对[Glossary( '阿罗缓', 'ELECT_GLOSS' )]机制的改革发挥重要作用，希望以此重振教会，恢复人们对它的信心。\n\n#EMP 只要此[modifier|E]处于活动状态，[county|E][rulers|E]的[faith|E]有$rice_light_purification_doctrine_name$[doctrine|E]则定期获得随机[piety_i|E][piety|E]。#!"
 RICE_manichean_uyghur_decision_support_character_modifier:0 "支持$manichean_adj$教会"
 RICE_manichean_uyghur_decision_support_character_modifier_desc:0 "该角色在争取[GetGeographicalRegion('RICE_greater_qocho_region').GetName]的[GetFaithByKey('manichean').GetAdjective]教会部分精英的支持。虽然一些虔诚教信徒对此表示欢迎，但其他对神职人员腐败现象感到失望的人却对此表示反对。\n\n#EMP 如果该角色皈依不具有$rice_light_purification_doctrine_name$[doctrine|E]的[faith|E]，则[modifier|E]将被删除。#!"
 RICE_manichean_uyghur_decision_reform_character_modifier:0 "$manichean_adj$改革者"
 RICE_manichean_uyghur_decision_reform_character_modifier_desc:0 "该角色在[GetGeographicalRegion('RICE_greater_qocho_region').GetName]的[GetFaithByKey('manichean').GetAdjective]教会最近的改革中扮演了重要角色。强硬派谴责这种改革是过度的政治干预，削弱了宗教力量。但其他人，尤其是那些对神职人员的腐败现象感到失望的人，却由衷地表示赞同。\n\n#EMP 如果该角色皈依不具有$rice_light_purification_doctrine_name$[doctrine|E]的[faith|E]，则[modifier|E]将被删除。#!"
 RICE_manichean_uyghur_decision_abandon_character_modifier:0 "放弃$manichean_adj$教会"
 RICE_manichean_uyghur_decision_abandon_character_modifier_desc:0 "该角色是或曾经是[GetGeographicalRegion('RICE_greater_qocho_region').GetName]的重要政治人物，曾公开表示对摩尼教的失望，这削弱了社会各阶层对教会的支持，无论大家目前的宗教信仰如何。"
 RICE_manichean_lin_deng_spiritual_lineage_modifier:0 "师承林瞪公"
 RICE_manichean_lin_deng_spiritual_lineage_modifier_desc:0 "该家族的成员师承智慧慈悲的林瞪——陈平山尊者的后裔。"
