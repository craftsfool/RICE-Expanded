 manichean.0030.t:0 "斋戒开始"
 manichean.0030.desc:0 "#italic 庇麻节#!即将来临，这是[ROOT.Char.GetFaith.GetName]最重要的庆典。在每年的这个时候，我们都会缅怀耶稣使徒摩尼的殉道，他将以灵态降临，赦免我们所忏悔的罪孽，正如我们从这个黑暗物质世界中解放光明一样。\n\n然而，在庇麻节之前，像我一样的[Glossary( '耨沙喭', 'HEARER_GLOSS' )]必须进行斋戒作为准备。我们会避免那些会使“光明”被困于“物质”中的行为，例如进食（尤其是荤食）、酗酒、性行为。"
 manichean.0030.a:0 "我们#italic 将#!在节庆开始之前净化自己。"
 manichean.0031.t:0 "齐聚一堂"
 manichean.0031.desc:0 "我们已经完成了为#italic 庇麻#!节所做的斋戒准备。现在，我们已经净化了自己，可以正式开始节日庆典了。\n\n我们全部排着队进入中央大厅，与[Glossary( '阿罗缓', 'ELECT_GLOSS' )]聚集在一起。大厅的尽头有一个空置的宝座，除了我们的先知摩尼的画像。他将在这里神降，并将在我们忏悔之后赦免我们的罪孽。"
 manichean.0031.a:0 "既然所有人都到齐了，我们就可以开始了。"
 manichean.0031.a.toast:0 "斋戒影响了你的健康"
 manichean.0032.t:0 "忏悔"
 manichean.0032.desc.intro:0 "起初，一切都简单地开始。一声祈祷的脉动，由[Glossary( '阿罗缓', 'ELECT_GLOSS' )]中的一位唱起来。一瞬间，一个又一个声音加入了进来。房间里所有的[Glossary( '阿罗缓', 'ELECT_GLOSS' )]与[Glossary( '耨沙喭', 'HEARER_GLOSS' )]都齐声唱了起来。\n\n我们齐聚一堂，共同唱响我们信仰的赞美诗。我们齐聚一堂，悲伤地哭泣，以纪念摩尼的[Glossary( '圆寂', 'MANICHEAN_PARINIRVANA_GLOSS' )]。我们齐聚一堂，喜极而泣，当我们忏悔罪孽时，摩尼将从高空的光明中降临，赦免我们的罪孽。\n\n刹那间，我的周围只有光明、纯洁、力量、智慧的声音，以及#italic 庇麻宝座#!的景象，除了摩尼的画像，空无一物。"
 manichean.0032.desc.change:0 "\n\n当我反思自己的罪孽，感受它们离我而去时，我周围只有圣洁与灵性的纯净……我已成为焕然一新的[ROOT.Char.GetWomanMan]。"
 manichean.0032.a:0 "这是一次完美的经历，不，简直是奇迹！"
 manichean.0033.t:0 "阿罗缓"
 manichean.0033.desc:0 "在充满强烈情感、声响与视像的忏悔仪式后，我们迎来了#italic 庇麻#!节的下一环节。\n\n[Glossary( '阿罗缓', 'ELECT_GLOSS' )]终年保持素食，因食用植物能帮助这些圣者最大限度地将光明释放回天界，使光明挣脱物质世界的束缚。在至关重要的#italic 庇麻#!节期间，[Glossary( '阿罗缓', 'ELECT_GLOSS' )]庄严地食用我们为其采摘的植物，同时为光明与我们的灵魂得救而祈祷。\n\n此后，[Glossary( '阿罗缓', 'ELECT_GLOSS' )]会进行多场布道，宣讲摩尼的深奥教义，并勉励我们在来年继续践行善举。"
 manichean.0033.a:0 "愿光明从黑暗中解放出来。"
 manichean.0034.t:0 "结束"
 manichean.0034.desc:0 "终于，今年的#italic 庇麻节#!已经落下帷幕。摩尼来到人间，为我们忏悔过的罪孽给予宽恕，越来越多的光明得以解放，回归天界。如此盛大的节日一年只有一次，但我们会为下一次做好准备。在那之前，我们应当尽全力行善积德以解放光明，尽可能蔑视黑暗。"
 manichean.0034.a:0 "我们赞美至高无上的启蒙者摩尼的真理！"
