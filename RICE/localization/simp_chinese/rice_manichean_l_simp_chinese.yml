 manichean.0090.t:0 "[lin_deng.GetFirstNameNoTooltip]门徒"
 manichean.0090.desc:0 "先师林瞪仙逝已有数年，其弘明尊教、济苍生之功，名流千古。\n\n听人异闻，离此不远的[lin_deng.GetCulture.GetName]津门火，阖城惶怖。郡人望空中有人衣素衣，手持铁扇扑火，遂灭。遥告众曰：“我长溪上万林瞪也。”\n\n自此，我教[lin_deng.GetFaith.GetAdherentNamePlural]，[GetReligionByKey('buddhism_religion').GetAdherentNamePlural]、[GetReligionByKey('taoism_religion').GetAdherentNamePlural]外教弟子，皆焚香祷于先师。摩尼光佛无上妙法，固为善事，然吾虽承衣钵，欲继吾师之志，任重道远矣……"
 manichean.0090.a:0 "清净光明，大力智慧！"
 manichean.0090.info:0 "#emphasis 历史背景：#!鲜为人知的11世纪中国摩尼教领袖陈平山，是更为人熟知的摩尼教中兴大师林瞪的弟子。林瞪通过将摩尼教传播至中国东南部的福建地区，在随后几个世纪中为摩尼教在中国的存续发挥了重要作用。因其传奇事迹，林瞪至今仍受当地民众尊崇。\n\n关于陈平山的记载寥寥无几，但其现代后裔陈培生传承的摩尼教仪式手抄本，为研究中国摩尼教历史的学者提供了珍贵资料。"
 manichean.0091.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 manichean.0091.desc:0 "先前吾于先师林登公门下夙夜耕耘，绍续摩尼光佛妙法。每疑功业难继，时时惴惴，未尝安枕。\n\n然渐有所悟，吾虽非师尊有通天彻地之能，无人焉及？然弘道济世，未曾停歇。今摩尼光佛妙法广传苍生，明尊法脉星布诸城，信众云集。\n\n前路虽遥，然明尊法既传，可告慰先师矣。"
 manichean.0091.a:0 "清净光明，大力智慧！"
 manichean.0092.t:0 "敬拜林瞪公"
 manichean.0092.desc:0 "依照我教传统，我们在此敬拜明教的林瞪大师。即便在离世之后，他依然庇佑无助者，接济贫苦之人。\n\n今日我们为这位伟人备下丰厚祭品，期盼他能如过往般赐福指引。我们如期齐聚，依循传承多年的正统仪轨，追思林瞪大师的传奇事迹，感念他昔日传授的深刻教诲。我们尤其铭记光明佛摩尼的真言：清净、光明、大力、智慧。"
 manichean.0092.desc.blessing:0 "\n\n礼毕，[ROOT.Char.GetFaith.GetAdjectiveNoTooltip][ROOT.Char.GetFaith.PriestNeuterPlural]寻得我，说林瞪公福瑞已降我身！"
 manichean.0092.a:0 "清净光明，大力智慧！"
