 manichean.0019.title:0 "摩尼教会的衰落"
 manichean.0019.tooltip:0 "你对据传腐败的[Glossary( '阿罗缓', 'ELECT_GLOSS' )]的支持，即便只是名义上的，也使得一些人对你的领导能力产生了怀疑。"
 manichean.0020.t:0 "救苦救难，为善除恶"
 manichean.0020.desc:0 "[ROOT.Char.GetFaith.GetName]教诲我们护持正法，为善除恶。怜我世人！忧患实多！\n\n当那些腐败、贪婪和权势之人仍在为众生制造苦难时，我们如何才能实现这些目标？当我们的运动在几个世纪以来一直受到多方压迫时，我们又如何能完成英雄之举来帮助受压迫者？\n\n在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTier]，我成功招募了一些志同道合的光明宗教信徒，或对我们的教义感兴趣的人，他们来自各行各业，从农民和学者到士兵、工匠、僧侣等等。作为因共同事业而团结起来的兄弟姐妹，他们发誓追随我，将世界从苦难和邪恶中解救出来。"
 manichean.0020.a:0 "迈向更光明的未来！"
 manichean.0021.t:0 "每周忏悔"
 manichean.0021.desc:0 "[ROOT.Char.GetFaith.GetName]最重要的教义之一是每周一的忏悔仪式。罪孽阻碍了光明——以及我们的灵魂——从这个黑暗物质世界得到救赎。因此，忏悔仪式由先知摩尼教导给了我们，更多的光明便能够随之解放。\n\n本周，我比以往任何时候都更专注于这个仪式。[Glossary( '阿罗缓', 'ELECT_GLOSS' )]已经聚集在这里，聆听我本人以及其他[Glossary( '耨沙喭', 'HEARER_GLOSS' )]的忏悔。\n\n我们吟诵高度规范化的礼拜诗和赞美诗，敦促我们审视自己最近的所作所为，辨别善恶，并约束自己变得越来越好。我们的罪孽越少，就能解放越多的光明。"
 manichean.0021.a:0 "我们的灵魂——以及所有的光明——将从黑暗中被解放！"
