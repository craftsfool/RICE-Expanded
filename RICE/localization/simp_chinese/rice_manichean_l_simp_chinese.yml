 manichean.0070.t:0 "对书籍的热爱"
 manichean.0070.desc:0 "[ROOT.Char.GetFaith.GetName]是一个极为尊重书籍的宗教。毕竟，我们的先知摩尼认为文字是最能忠实记录他教诲的方式。这是之前的先知们没有做到的，因为其教义会被后来的追随者误解与篡改。\n\n即使是蔑视我们的异教徒们，也只得不情不愿地承认我们书籍的浩瀚，以及我们保存书籍的奉献精神！\n\n我最近一直在思考，我是否已经做了足够多来支持[Glossary( '阿罗缓', 'ELECT_GLOSS' )]进行创作与书籍保护？也许，我得投入更多资源来进行这些工作。"
 manichean.0070.a:0 "作为[ROOT.Char.GetTitleAsNameNoTooltip]，我已经尽力了。"
 manichean.0070.b:0 "是的，让我们为书籍拨更多的款吧。"
 manichean.0070.info:0 "#emphasis 历史背景：#!摩尼教徒极为崇敬书籍，因为摩尼认为文字是后世记录教义的极为重要的方式。摩尼认为，之前的先知们没有做到这一点，导致他们的宗教被歪曲了。即使是来自其他信仰的追随者在当代的论战中对摩尼教进行批判时，也都承认摩尼教徒对书籍的重视以及他们手稿的精美。例如，伊斯兰作家贾希兹(776年-868年或869年）写道，他的朋友易卜拉欣·辛迪曾经告诉他：“我希望[Glossary( '精底格', 'ZINDIQ_GLOSS' )]不要再购买洁净的纸张，黑的发亮的墨水，不要再进行优美的书写，不要煽动文士们的热情。因为，我所见过的任何纸张都无法与他们的书本用纸相比，任何优美的字体都无法与他们的书法相媲美。”"
 manichean.0071.t:0 "画家摩尼"
 manichean.0071.desc:0 "我们的先知摩尼，他教诲了我们[ROOT.Char.GetFaith.GetAdherentNamePlural]现如今仍在遵循的真理，数世纪以来长久引起了不信者们的兴趣。他们编造了关于他的各种各样的故事，或夸或贬。\n\n例如，摩尼有着艺术天赋。我们的圣书之一#italic 大二宗图#!就是由摩尼亲自绘制的画作组成的。我听说正因此，[GetReligionByKey('zoroastrianism_religion').GetName]与[GetReligionByKey('islam_religion').GetName]经常称他“只是”一个伟大的画家——少数人认为这样做是赞美他雅致脱俗的审美，然而许多人只是以此诋毁他。他们在含沙射影我们是被一个画家蒙骗的蠢货，这个画家则想故意通过他的奇特画作与言论来破坏[GetReligionByKey('zoroastrianism_religion').GetAdjective]教。"
 manichean.0071.a:0 "对摩尼出言不逊者不可饶恕。"
 manichean.0071.b:0 "他们虽误入歧途，但我们有责任教化他们。"
 manichean.0072.t:0 "灵魂服务"
 manichean.0072.desc:0 "一些游历四方的[ROOT.Char.GetFaith.GetAdjective][Glossary( '阿罗缓', 'ELECT_GLOSS' )]今天在我的宫廷暂歇。\n\n早些时候，他们睿智地进行了布道。现在已经是晚上了，他们正在准备一天的圣餐，正如摩尼教导的那样：[Glossary( '阿罗缓', 'ELECT_GLOSS' )]每日只能聚在一起吃一顿饭。在此期间，他们必须祈祷并颂赞美诗，以便从黑暗物质世界解放光明。\n\n通常，作为一种名为灵魂服务的形式，[Glossary( '耨沙喭', 'HEARER_GLOSS' )]应该向[Glossary( '阿罗缓', 'ELECT_GLOSS' )]提供素食，尤其是黄瓜与甜瓜，因为这两者能够提供最浓厚的光明来解放。"
 manichean.0072.a:0 "给阿罗缓提供素食"
 manichean.0072.b:0 "施给阿罗缓们大量素食——解放光明！"
 manichean.0072.c:0 "为什么阿罗缓敢来我这里蹭吃蹭喝？"
 manichean.0073.t:0 "通过素食净化世界"
 manichean.0073.desc:0 "难怪信仰[courtier.GetFaith.GetName]的[courtier.GetTitledFirstName]不认同[ROOT.Char.GetFaith.GetName]的灵修习俗。\n\n因为就在今天，一群[ROOT.Char.GetFaith.GetAdjective][Glossary( '阿罗缓', 'ELECT_GLOSS' )]前来拜访我们，宣讲先知摩尼的教诲。傍晚时分，他们举行了素食餐，席间充满祷告，以释放食物中被物质世界禁锢的光明。\n\n阿罗缓们用餐完毕，我听见[courtier.GetFirstNameNoTooltip]锐评道：“这些[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]居然妄想通过饱嗝来净化世界？”"
 manichean.0073.a:0 "我可不会对此评价。"
 manichean.0073.b:0 "我会假装没听见……"
 manichean.0073.info:0 "#emphasis 历史背景：#!这段锐评几乎逐字逐句地摘自圣奥古斯丁（公元354至430年）的著作。他是一位北非基督教神学家和知识分子，年轻时曾是摩尼教徒。虽然他后来否定了摩尼教，但由于他曾经信奉摩尼教，因此他仍然是了解摩尼教习俗和信仰的第一手人。"
 manichean.0074.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]商人"
 manichean.0074.desc:0 "数个世纪以来，丝绸之路上许多商人都追随着光明使者摩尼的教义。因此，我领地上的[ROOT.Char.GetFaith.GetAdjective]商人在旅途中喜欢用[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]宗教建筑存放货物与财富，也就不足为奇了。\n\n部分商人请求我以[ROOT.Char.GetTitleAsNameNoTooltip]的权力和资源协助他们，保护这些圣地免遭盗匪侵扰。"
 manichean.0074.a:0 "好，我乐意相助。"
 manichean.0074.b:0 "我们抽不出资源办这事。"
 manichean.0074.c:0 "我会没收他们的货物！"
 manichean.0074.info:0 "#emphasis 历史背景：#!摩尼教是一种在丝绸之路上商人群体中盛行的宗教，尤其在粟特人和回鹘人中广为传播。这些商人经常将摩尼教寺院和礼拜场所作为钱庄和仓库使用。例如，中国唐朝对摩尼教徒进行迫害，不仅没收了摩尼教宗教机构所属的货物与财富，还查抄了那些将财物存放在这些场所的摩尼教商人的资产。"
 manichean.0075.t:0 "汇聚成海"
 manichean.0075.desc:0 "今天，一位本地[ROOT.Char.GetFaith.GetAdjective][Glossary('阿罗缓','ELECT_GLOSS')]正在宣讲摩尼的教义。摩尼著作中的一段话让我觉得十分有趣：\n\n#italic 所有先前宗教的典籍、智慧、启示、寓言和诗篇，在各地都被收集起来汇入了我的宗教，如同水汇聚到海中，这增添了我所揭示的智慧。同样古老的典籍也丰富了我的著作，使之成为更伟大的智慧。#!\n\n这让我想起，为何理解其他信仰并将其教义融入我们自身是如此重要——唯有如此，才能让光明信仰教义更加丰盈。"
 manichean.0075.a:0 "我们必须满怀热情地向其他信仰学习！"
 manichean.0075.b:0 "向其他信仰学习时须慎之又慎。"
 manichean.0076.t:0 "光明夷数"
 manichean.0076.desc:0 "[GetReligionByKey('christianity_religion').GetAdjective]教会虽宣称夷数佛是他们的，但我们深知唯有我们[ROOT.Char.GetFaith.GetAdherentNamePlural]才持有真正的福音。\n\n近来我常思及此，每当念及这些愚昧的所谓夷数追随者竟无视基督使徒摩尼的教义，便怒火中烧——正是摩尼向我们昭示了光明夷数亲授的未受玷污之教义，而非他们那遭到篡改的夷数宗教形式..."
 manichean.0076.a:0 "我不可过于愤怒——我们必须对他们保持耐心。"
 manichean.0076.b:0 "那些愚蠢的基督徒是危险的异端。"
 manichean.0076.info:0 "#emphasis 历史背景：#!摩尼教的先知摩尼主张，先前诸如耶稣、佛陀、琐罗亚斯德等先知所传授的教义与他本人完全一致。然而，由于这些先知没有将自己的教导诉诸文字（而摩尼则不同），他们的后世追随者误解并曲解了其原始教义。摩尼尤其对耶稣表现出强烈尊崇，这种态度直接反映在摩尼教的教义体系中。后来的摩尼教徒常将摩尼与耶稣类比，例如将摩尼的殉道称为其“受难”，与耶稣相提并论。甚至晚近的伊斯兰文献，如波斯神学家阿卜杜·贾巴尔（公元935‑1025年）的记载亦指出，摩尼教徒坚称自己才是基督的“真正”追随者，掌握着真正的福音。"
 manichean.0077.t:0 "抄录[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]经文"
 manichean.0077.desc:0 "今日我接见了当地[ROOT.Char.GetCulture.GetName]人[ROOT.Char.GetFaith.GetAdjective][Glossary( '阿罗缓', 'ELECT_GLOSS' )]代表，共同探讨他们在传播先知摩尼教义、指引我们灵性成长、将光明从物质世界中解放出来时面临的困境，以及我能提供何种支持。会议颇有成效，我们就诸多问题及解决方案进行了深入交流。\n\n会后，我与阿罗缓展开了更为轻松的闲聊。话题逐渐转向了书籍抄录与编纂工作。鉴于摩尼教导我们要珍视经文——这是传承其教义最可靠的方式，阿罗缓肩负着不断誊抄与复刻典籍的职责。\n\n“这真是苦差事！我的双手总是酸痛无力，”一位阿罗缓诙谐地感慨道，“但我们所做的工作至关重要，如此光明圣教方能永续不灭。”"
 manichean.0077.a:0 "是啊，只要阿罗缓尚在，圣火便永不熄灭。"
 manichean.0077.b:0 "真庆幸我不必做这种苦差事。"
 manichean.0078.t:0 "鸡与蛋"
 manichean.0078.desc:0 "我正在研究一些古老的[ROOT.Char.GetFaith.GetAdjective]典籍，其中记录了我们的先知摩尼与他那个时代的其他哲学家和思想家进行的一些辩论。\n\n先知摩尼的言语一如既往地发人深省，但其中一些……说得含蓄，却颇为深奥。其中一句话尤其让我困惑：#EMP “如果蛋里的小鸡死了，它的灵魂怎么从蛋里出来？”#!\n\n我感到非常困惑，甚至询问了[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]，但[chaplain.GetSheHe]和我一样困惑。"
 manichean.0078.a:0 "先知话语有时太深奥，让我们无法理解！"
 manichean.0078.b:0 "也许只是书吏的笔误？"
 manichean.0078.info:0 "#emphasis 历史背景：#!摩尼的话出自《克弗来亚》。该手稿最初发现于埃及，很可能属于埃及古典晚期的一个摩尼教社群。《克弗来亚》是摩尼教文献，扩展了摩尼的教义，经常取材于他的生平故事，因此与伊斯兰教的[Glossary( '圣训', 'HADITHS_GLOSS' )]类似。《克弗来亚》的内容以科普特语写成，其内容揭示了一个了解不同宗教信仰与议题的社区，表明它诞生于多元文化、多宗教交融的环境。不过原始纸莎草手稿历经数世纪的磨损、掩埋、液体浸泡、颜料覆盖等严重损毁，直到2007年学者们才借助现代技术（主要是多光谱和计算机增强）艰难地破译了文字。该手稿现藏于爱尔兰都柏林的切斯特·比替图书馆。"
 manichean.0079.t:0 "解放奴隶，释放光明"
 manichean.0079.desc:0 "[courtier.GetTitledFirstName]今天给我提了一个建议。\n\n“作为先知摩尼的虔诚信徒，”[courtier.GetSheHe]解释道，“您当记得[ROOT.Char.GetFaith.GetAdjective]典籍教导我们赎买奴隶自由，将其托付给[Glossary( '阿罗缓', 'ELECT_GLOSS' )]照料，使其成为选民的门徒与仆从。尊贵的[ROOT.Char.GetTitleAsNameNoTooltip]若解放众多奴隶，他们将成为未来的[Glossary( '阿罗缓', 'ELECT_GLOSS' )]，为我们的教会做出巨大贡献，我们也能由此释放更多光明。”"
 manichean.0079.a:0 "明智的提议！那就释放一些奴隶吧。"
 manichean.0079.b:0 "我理解此意，但目前没有足够资金。"
 manichean.0080.t:0 "食菜事魔教"
 manichean.0080.desc:0 "有些[ROOT.Char.GetCulture.GetCollectiveNoun]不理解我们的信仰，还诋毁我们[ROOT.Char.GetFaith.GetName]的信徒是“食菜事魔”，他们说我们本是邪见，妄称[GetReligionByKey('buddhism_religion').GetName]诳惑黎元。\n\n他们怎能如此误解我们？我们只是想敬拜并解放光明，把人类从物质与黑暗世界的苦难中拯救出来，我们是光明佛摩尼的正信弟子啊！\n\n可悲，可悲！难怪我的许多[ROOT.Char.GetFaith.GetAdherentNamePlural]同胞都对那些不信奉我们教义的[ROOT.Char.GetCulture.GetCollectiveNoun]保持戒心。"
 manichean.0080.a:0 "在这个黑暗时代，我们确实必须小心。"
 manichean.0080.b:0 "我们必须保护自己并抵抗压迫者。"
 manichean.0080.info:0 "#emphasis 历史背景：#!在宋代，统治者对“摩尼教”的诬称。因人民群众常以摩尼教组织起义，统治者便矣“摩”为“魔”，诬摩尼教为“魔教”，因其吃斋的特点，又诬称为“食菜事魔”。"
