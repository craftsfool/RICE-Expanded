 mayo.0030.t:0 "去圣山"
 mayo.0030.desc:0 "[GetGeographicalRegion('custom_ireland').GetName]是一座遍布圣地的岛屿，其中最著名的当属巴特利爵山——圣巴特利爵曾在此山顶禁食四十天。\n\n几个世纪以来，哪怕路途艰险，朝圣者们也坚持攀登此山，有时甚至赤足而行。今日，我也将踏上旅程，追随他们的足迹前往那座圣山。"
 mayo.0030.a:0 "愿圣巴特利爵保佑我！"
 mayo.0031.t:0 "山脚"
 mayo.0031.desc:0 "赞美[ROOT.Char.GetFaith.HighGodName]！\n\n正如许多前人一样，我终于抵达了宏伟的巴特利爵山脚下。圣巴特利爵曾在山上斋戒四十日，如同摩西在西奈山上的壮举。\n\n今夜我将在山麓休整，明日便将启程攀登这险峻的山路。依照传统，许多朝圣者赤脚上山，以此考验他们的力量和热情，并作为对他们罪行的忏悔。"
 mayo.0031.a:0 "我会赤脚爬上山。"
 mayo.0031.b:0 "我可不想劳累自己，还是穿鞋上去吧。"
 mayo.0032.t:0 "艰难的攀登"
 mayo.0032.desc.intro:0 "我的脚因为爬巴特利爵山而感到疲惫。但并不只有我一个人——周围无数的朝圣者也在做着同样的事情。\n\n"
 mayo.0032.desc.injury_you:0 "唉，在上山的路上我受了伤，好在不算太严重——但这种痛苦是我们攀登险峻山峰时必须承担的风险。现在我必须依靠别人的帮助才能继续前进，哪怕这可能会很痛苦。\n\n"
 mayo.0032.desc.injury_other:0 "唉，上山途中，[injured_person.GetTitledFirstName]不慎弄伤了自己，所幸伤势不重，[injured_person.GetSheHe|U]如今必须倚仗他人搀扶才能继续前行，纵使每一步都可能伴着痛楚。\n"
 mayo.0032.desc:0 "在攀登途中，我们经过了许多古老的石碑和石堆，比如[Glossary( '圣巴特利爵之座', 'SAINT_PATRICKS_CHAIR_GLOSS' )]，有些还留有先人刻下的痕迹。当我在这样一块石头旁停下休息时，我向圣巴特利爵做了祷告。"
 mayo.0032.a:0 "继续前进！就差一点了！"
 mayo.0033.t:0 "顶峰"
 mayo.0033.desc:0 "双脚酸痛似乎永无止息，最终终于抵达巴特利爵山顶峰。当看到为纪念圣巴特利爵而建的简朴教堂时，我们感到一阵宽慰！\n\n在教堂里，我们祈祷并祈求宽恕罪孽，默想[ROOT.Char.GetFaith.HighGodName]与创世的荣光。我们也追忆着圣巴特利爵的故事——他曾效仿西奈山上的摩西，在山顶斋戒四十日，并将所有恶魔与毒蛇逐出[GetGeographicalRegion('custom_ireland').GetName]。传说当他结束斋戒时，[ROOT.Char.GetFaith.HighGodName]授予他在末日审判时裁决[GetGeographicalRegion('custom_ireland').GetNameNoTooltip]所有子民的权柄。"
 mayo.0033.a:0 "我们今晚就留在这里祈祷。"
 mayo.0034.t:0 "火球"
 mayo.0034.desc:0 "随着夜幕降临，远远处乌云密布，风也越来越大，在这险峻的山上，这样的天气并不罕见，圣巴特利爵在这里禁食四十天时也曾面临过这样的危险。们怀着对[ROOT.Char.GetFaith.HighGodNameAlternate]的信赖，继续彻夜斋戒守夜。\n\n接着，一声巨响传来，比世间所有的声音都要响亮，仿佛地狱本身降临到了我们身上。\n\n一团火球向我们袭来，速度之快让我们来不及反应。现场一片混乱，尖叫声和哭喊声此起彼伏，闪电在肆虐。片刻之间，一些朝圣者已经倒地身亡。"
 mayo.0034.a:0 "[ROOT.Char.GetFaith.HighGodName]庇佑我们！ [ROOT.Char.GetFaith.HighGodName]庇佑我们！ "
 mayo.0034.info:0 "#emphasis 历史背景：#!巴特利爵山地处开阔地带，因其地理位置而常遭遇危险天气。数个世纪以来，前来此山的朝圣者曾因恶劣天气和失温而受伤甚至丧生。一个著名的中世纪事例发生在公元1113年，据#italic 《乌尔斯特编年史》#!记载，在圣巴特利爵节（3月17日）那天晚上，聚集在山顶的三十名朝圣者被闪电击中身亡。"
 mayo.0035.t:0 "下山"
 mayo.0035.desc:0 "下山的路途感觉比上山时轻松许多。我们朝圣巴特利爵山的过程不是胆小者能承受的，但巴特利爵在很久以前到达山顶时坚持了下来——我们至少可以尝试效仿他的榜样。\n\n当我们回到山脚下时，我们已焕然一新。"
 mayo.0035.a:0 "正如圣巴特利爵所言：“[Glossary( '基督与我同在，基督在我前方', 'SAINT_PATRICKS_BREASTPLATE_GLOSS' )]。”"
