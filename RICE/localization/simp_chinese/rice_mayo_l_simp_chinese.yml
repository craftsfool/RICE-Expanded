 mayo.0040.t:0 "埋藏黄油"
 mayo.0040.desc:0 "我已命仆从将大量[bog_butter_short|E]埋藏在居所附近的沼泽中。\n\n假以时日，这些黄油不仅能完好保存，更会蜕变成风味独特的美味珍馐。"
 mayo.0040.a:0 "我等不及了！"
 mayo.0041.t:0 "取回黄油"
 mayo.0041.desc:0 "前些时候，我吩咐仆人们将一些[bog_butter_short|E]埋进附近的泥炭沼泽里。如今时间已足够久远，沼泽黄油应当腌制地恰到好处。\n\n于是我命令仆人们取回当初埋藏的黄油。现在是时候享用它了，无论是用于宴会还是我个人食用。"
 mayo.0041.a:0 "泥炭沼泽黄油好吃！"
 mayo.0042.t:0 "黄油领主"
 mayo.0042.desc:0 "我对[bog_butter_short|E]的喜爱在领地内人尽皆知。似乎正因为如此，有些人开始称呼我为#V “$RICE_nick_butterlord|U$”#!。\n\n这个绰号虽不算特别光彩，但也并非恶意中伤，更像是对我多年来大量使用和消耗黄油的一种调侃的认可。"
 mayo.0042.a:0 "这个绰号挺有趣的，我喜欢！"
 mayo.0042.b:0 "哼！这根本不适合我！"
 mayo.0042.b.tooltip:0 "之后你将再无机会获得此[nickname|E]。"
 mayo.0043.t:0 "一份黄油礼物"
 mayo.0043.desc:0 "[bog_butter_short|E]在[actor.GetCulture.GetCollectiveNoun]中备受推崇，因为这里牛的价值无法估量，它们提供的产品，如黄油，也同样宝贵。\n\n我赠予[recipient.GetTitledFirstName]与其社会地位相称的黄油，以此作为善意和友谊的象征。"
 mayo.0043.a:0 "愿你品尝黄油时感到美味可口！"
 mayo.0044.t:0 "$mayo.0043.t$"
 mayo.0044.desc:0 "[bog_butter_short|E]在[recipient.GetCulture.GetCollectiveNoun]人中备受推崇，因为这里牛的价值无法估量，它们提供的产品，如黄油，也同样宝贵。\n\n[actor.GetTitledFirstName]赠予了我与我的社会地位相称的黄油，以此作为善意与友谊的象征。"
 mayo.0044.a:0 "一份美味且非常受欢迎的礼物！"
