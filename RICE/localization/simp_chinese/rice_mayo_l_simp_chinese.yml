 innovation_RICE_bog_butter:0 "泥炭沼泽黄油"
 innovation_RICE_bog_butter_desc:0 "在不列颠群岛的许多地区，黄油常被埋在沼泽中保存。这一古老习俗已延续数千年，源于黄油的重要地位与多种用途——从食物、化妆品到药膏等不一而足。"
 innovation_RICE_crannogs:0 "湖上木屋"
 innovation_RICE_crannogs_desc:0 "在不列颠群岛的部分地区，尤其是凯尔特地区，湖上木屋是一种特殊类型的木制建筑，是建在湖泊和沼泽上的人工岛。"
