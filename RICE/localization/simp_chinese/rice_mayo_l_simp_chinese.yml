 mayo.0010.t:0 "动荡的至高王国"
 mayo.0010.desc:0 "[norman.GetCollectiveNoun]最初是以雇佣兵和冒险者的身份来到我们这座岛屿，介入那些本应由我这个[GetTitleByKey('k_ireland').GetNameNoTier]至高王掌控的政治纷争。多年来，岛上的[irish.GetName]统治者愈发桀骜，拒绝服从我的意志。\n\n[henry_ii.GetTitledFirstName]在教会的支持下，认为有必要对这些[norman.GetCollectiveNounNoTooltip]进行制裁，但我们在几年前通过《温莎条约》达成了协议——将岛屿划分为我的势力范围和[henry_ii.GetFirstNamePossessiveNoTooltip]的势力范围，条件是我每年向[henry_ii.GetHerHim]进贡，这是为了重申我作为至高王的权威而付出的微不足道的代价。\n\n然而，[henry_ii.GetFirstNamePossessiveNoTooltip]的属下们背信弃义，他们不断侵犯我的势力范围，破坏了条约。我对这些[norman.GetCollectiveNounNoTooltip]人几乎毫无信任……但仍有人认为我们或许还能达成另一项协议。"
 mayo.0010.a:0 "我苦苦挣扎了这么久才保住至高王的地位……"
 mayo.0010.info:0 "#emphasis 历史背景：#!罗里·乌·康霍巴尔（英译为罗里·奥康纳）是最后一位得到广泛承认的爱尔兰至高王。罗里一生大多时间都在试图确立自己作为至高王的权威，但成效不一。盎格鲁‑诺曼雇佣军介入爱尔兰地方冲突，使情况进一步复杂化，导致这些冲突失控演变为一场由英格兰国王亨利二世授权的、由同一批盎格鲁‑诺曼人发起的入侵。罗里与亨利于1175年签署了《温莎条约》，约定亨利与罗里划分在爱尔兰的势力范围，罗里向亨利宣誓效忠。然而，由于两位国王各自的诺曼和爱尔兰封臣无视条约并公开相互征战，这一协议迅速瓦解。罗里于1198年去世后，虽仍有少数人宣称拥有这一头衔（包括14世纪更著名的罗伯特·布鲁斯的兄弟爱德华·布鲁斯），但无人获得广泛支持。"
