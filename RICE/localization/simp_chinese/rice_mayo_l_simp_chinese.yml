 mayo.0080.t:0 "圣麦克达拉岛"
 mayo.0080.desc:0 "在[GetTitleByKey('b_galway').GetNameNoTier]海岸之外，坐落着传说中的圣麦克达拉岛。据说在六世纪时，一位同名的圣徒曾在此建造了一座小教堂，过着隐士生活。当地居民尊奉他为水手和渔民的守护者，甚至时常有人冒险渡海前往这座小岛进行小型朝圣。\n\n作为统治[GetTitleByKey('c_connacht').GetNameNoTier]的[ROOT.Char.GetTitleAsNameNoTooltip]，当地领袖们询问我是否有意拨出部分资源，以支持岛上小教堂及前往朝圣的信众。尽管这位圣徒在外地鲜为人知，但此举将大大提升我在沿海居民中的形象。"
 mayo.0080.a:0 "当然，以圣麦克达拉之名！"
 mayo.0080.info:0 "#emphasis 历史背景：#!圣麦克达拉岛是戈尔韦海岸外的一座岛屿，长久以来与当地六世纪的圣人麦克达拉紧密相连。尽管在区域之外鲜为人知（事实上，圣徒传记资料中几乎未提及麦克达拉），但至今他在当地仍作为航海者的守护神而广受欢迎。与圣麦克达拉相关的海洋习俗和灵修众多，例如水手和渔民经过该岛时会三次降帆致敬，或当地居民定期前往朝圣。"
 mayo.0080.b:0 "我无法为此提供资金。"
 mayo.0081.t:0 "树中之王榛树"
 mayo.0081.desc:0 "根据[ROOT.Char.GetCulture.GetCollectiveNoun]的古老律法，有七种树木因其提供的重要资源而被尊为[Glossary( '树中之王', 'LORDS_OF_THE_WOOD_GLOSS' )]。\n\n其中的榛树在今年的[county.GetNameNoTier]获得了相当丰硕的收成。甚至说那里的榛子产量如此之大，以至于一些小河都被堵塞了！\n\n依照我们的古老律法，作为[ROOT.Char.GetTitleAsNameNoTooltip]，我有权从这次收获中分得一部分榛木条，而平民们已经给我送来了一整车的榛木条。"
 mayo.0081.a:0 "这会派上大用场！"
 mayo.0081.info:0 "#emphasis 历史背景：#! 在中世纪的爱尔兰，有七种树木被视为至关重要，被归为所谓的[Glossary( '树中之王', 'LORDS_OF_THE_WOOD_GLOSS' )]，并附有大量关于其使用和保护的法律。榛树便是其中之一，其木材备受珍视，被用于各类建筑，而榛子则是重要的食物来源；根据中世纪爱尔兰法律，领主有权获得部分榛子收成。榛树的重要性高到以至于爱尔兰编年史甚至会特意记录榛子丰收的年份。例如，记载中世纪爱尔兰的重要一手史料#italic 《阿尔斯特编年史》#!就曾饶有趣味地提到，在836年和1066年的榛子产量竟多到堵塞了河流！"
 mayo.0082.t:0 "闯入者"
 mayo.0082.desc:0 "[trespasser.GetTitledFirstName]羞愧地看着我，递给我钱。“对于擅闯您的领地，我感到非常抱歉，[ROOT.Char.GetLadyLord]，但急躁让我失了分寸。”\n\n我们都知道[ROOT.Char.GetCulture.GetName]的法律对擅闯行为的罚款有明确规定。一个人从外面打开门查看是否有人在家是允许的，不会受到处罚，但未经许可进入尤其是打开房屋的门的人必须支付罚款。\n\n[trespasser.GetSheHe|U]未曾按规矩等候我的仆从引[trespasser.GetHerHim]入内，这本是[trespasser.GetSheHe]应守的礼节。"
 mayo.0082.a:0 "很好，我接受你的道歉。"
 mayo.0082.b:0 "钱你留着，但下次可要记住教训了。"
 mayo.0082.info:0 "#emphasis 历史背景：#!该事件基于中世纪早期爱尔兰关于非法入侵的法律，相关论述可见于#italic 《Críth Gablac》#!（意为“分叉交易”）等法律文献。这部8世纪的法律文本着重探讨社会地位问题，以及中世纪爱尔兰不同社会阶层之间的差异。当时的爱尔兰社会等级森严，法律惩处的轻重很大程度上取决于受害者与施害者的社会等级。"
 mayo.0083.t:0 "卑微的制梳匠"
 mayo.0083.desc:0 "“制梳匠？”[arrogant.GetTitledFirstName]嗤之以鼻。“我前几天看到一个，他们真是恶心，不是吗？他们就像狗和粪堆一样，你从他们那里获取的材料？”\n\n我只是问了[arrogant.GetFirstNameNoTooltip]前几天进城的情况，但看起来[arrogant.GetSheHe]看到了一些不想见到的低贱工匠，对此非常不满。"
 mayo.0083.a:0 "他们地位虽低，但也不该过分嘲笑。"
 mayo.0083.b:0 "那些家伙确实令人厌恶，我完全同意！"
 mayo.0083.info:0 "#emphasis 历史背景：#!中世纪爱尔兰是一个等级森严的社会，人们的地位与特权因其阶层和职业而异。某些工匠如木匠、铜匠和铁匠被视为高阶层，有时甚至享有与低级贵族相当的荣誉。相比之下，其他工匠如制梳匠则被认为社会地位低下；例如，法律文献会将梳匠与狗和粪堆相提并论，并认为他们从那里获取原材料。"
 mayo.0084.t:0 "稀有的爱尔兰松树"
 mayo.0084.desc:0 "这真是一个了不起的发现！在[county.GetNameNoTier]的偏远森林中隐藏着一大片松树林。\n\n我的[councilor.GetCouncilTitle][councilor.GetTitledFirstName]表示，我们可以利用这些稀有树木来生产树脂，或用于建筑。在[ROOT.Char.GetCulture.GetCollectiveNoun]人文化中，松树被视为[Glossary( '树中之王', 'LORDS_OF_THE_WOOD_GLOSS' )]之一，能找到任何松树都堪称奇迹。"
 mayo.0084.a:0 "这些松树将非常有用！"
 mayo.0084.b:0 "我认为这不值得。"
 mayo.0084.info:0 "#emphasis 历史背景：#!#italic 欧洲赤松#!曾生长于爱尔兰，但其数量在中世纪期间大幅减少直至灭绝；该树种后来于18世纪被重新引入该岛。不过松树作为[Glossary( '树中之王', 'LORDS_OF_THE_WOOD_GLOSS' )]之一，其木材与树脂具有极高价值。一则中世纪传说反映了此树的稀有：某修道院试图用松木建造食堂，工匠们在森林中搜寻数日却找不到松树的踪迹，最终唯有依靠8世纪爱尔兰传奇修女兼女修道院长圣桑珊的神迹干预，才得以寻获松木。"
 mayo.0085.t:0 "凯什洞"
 mayo.0085.desc:0 "[GetTitleByKey('b_sligo').GetNameNoTier]的凯什洞常年与王权颇有渊源。今天，我的吟游诗人正向我讲述着与之相关最著名传说。\n\n相传在很久以前，[GetGeographicalRegion('custom_ireland').GetName]的传奇至高王——康马克·麦·亚特，是一位极富荣誉、慷慨、智慧和仁慈的君主，在其父于战场被一位篡夺王位的亲属杀害后，尚在襁褓的康马克被一只母狼带走，于凯什洞穴中抚养长大。多年后，他最终夺回了自己应得的王位。"
 mayo.0085.a:0 "精彩绝伦的故事，可惜纯属虚构。"
 mayo.0085.b:0 "这些洞穴散发出王权气息是有原因的！"
 mayo.0086.t:0 "一名可疑的[ROOT.Char.GetCulture.GetNameNoTooltip]法学家"
 mayo.0086.desc:0 "当[ROOT.Char.GetCulture.GetName]的述法者喋喋不休地向我解释其所建议法律案件的具体细节和细微差别时，所有人都注意到了这一点——他的脸颊上出现了一种不同寻常的微红色，虽然很淡但非常明显。\n\n在场的所有人都兴奋地窃窃私语。难道是真的？这位法官难道在说谎？这样的脸颊红斑通常是这种迹象的标志。\n\n最终，我的一位廷臣大声说出了大家的想法。述法者的声音迅速从单调乏味变成了恐慌的语气，他向我们保证他说的都是实话，并且只是因为紧张而脸红。"
 mayo.0086.a:0 "相信述法者的话。"
 mayo.0086.b:0 "惩罚说谎的述法者"
 mayo.0086.c:0 "指出述法者的法律建议中的不足之处"
 mayo.0086.info:0 "#emphasis 历史背景：#!在早期中世纪的爱尔兰社会中，述法者扮演着重要角色，他们身上笼罩着一层神秘的面纱，备受尊崇，其地位堪比爱尔兰的吟游诗人，而且他们会佩戴颈环，若是述法者说谎，颈环便会收紧勒住他的脖颈，甚至将其窒息而死。因此，八世纪编纂的爱尔兰各类法律文献汇编#italic 《Senchas Már》#!中记载，当法学家偏离真相时，他的脖颈上会出现斑痕。"
 mayo.0087.t:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]文化的三巨石"
 mayo.0087.desc:0 "我曾听闻，[ROOT.Char.GetCulture.GetName]法律和行为的基石，在于宗教、领主和家族这“三块基石”。它们的影响渗透我们的生活，指引我们前行。然而我不禁思考……至少在涉及法律事务时，哪一块才是最重要的呢？"
 mayo.0087.a:0 "没有[ROOT.Char.GetFaith.HighGodName]的法律是什么？"
 mayo.0087.b:0 "统治者是执行正义的关键。"
 mayo.0087.c:0 "通过亲属，我们学习并实践良好的行为。"
 mayo.0087.info:0 "#emphasis 历史背景：#!本事件灵感源自八世纪文献#italic 《爱尔兰的审判三部曲》#!中的一段摘录，该文集涵盖法律、礼仪、地理等多种主题。摘录写道“修道院、领主、家族是维系法律的基石”，这句话反映了早期爱尔兰文化的理想与价值观，揭示了法律与正当行为如何与宗教、王权及家族血脉紧密相连。"
