 TFE_holy_well_level_1:0 "近期祝圣小圣井"
 TFE_holy_well_level_1_desc:0 "此地区的宗教权威近期祭祀了一口有一定知名度的圣井。虔诚的信徒们从附近蜂拥而至，在这里祈祷并留下祭品。\n\n#italic 若[rulers|E]拥有此[county|E]或在此地拥有[domicile|E]，且其[culture|E]属于$heritage_goidelic_name$、$heritage_brythonic_name$或$heritage_west_germanic_name$[heritage|E]，则会提升[GetActivityType( 'activity_RICE_visit_holy_well' ).GetName][activity|E]的增益效果。与大和巨圣井相比，小圣井在做出此[decision|E]时提供的加成较少。#!"
 TFE_holy_well_level_2:0 "近期祝圣大圣井"
 TFE_holy_well_level_2_desc:0 "该地区的宗教权威近期祭祀了一口有一定知名度的圣井。虔诚的信徒们从附近地区蜂拥而至，在这里祈祷并留下祭品。\n\n#italic 若[rulers|E]拥有此[county|E]或在此地拥有[domicile|E]，且其[culture|E]属于$heritage_goidelic_name$、$heritage_brythonic_name$或$heritage_west_germanic_name$[heritage|E]，则会提升[GetActivityType( 'activity_RICE_visit_holy_well' ).GetName][activity|E]的增益效果。与小圣井相比，大圣井在执行此[decision|E]时提供更多增益，但相较于巨圣井则有所不及。#!"
 TFE_holy_well_level_3:0 "近期祝圣巨圣井"
 TFE_holy_well_level_3_desc:0 "该地区的宗教权威近期祭祀了一口有一定知名度的圣井。虔诚的信徒们从附近蜂拥而至，在这里祈祷并留下祭品。\n\n#italic 若[rulers|E]拥有此[county|E]或在此地拥有[domicile|E]，且其[culture|E]属于$heritage_goidelic_name$、$heritage_brythonic_name$或$heritage_west_germanic_name$[heritage|E]，则会提升[GetActivityType( 'activity_RICE_visit_holy_well' ).GetName][activity|E]的增益效果。与大和小圣井相比，巨圣井在做出此[decision|E]时将提供更丰厚的加成。#!"
 TFE_healing_waters_of_a_holy_well:0 "圣井的治疗之水"
 TFE_healing_waters_of_a_holy_well_desc:0 "该角色最近去了一口圣井，进行祈祷和宗教供奉。之后，该角色感觉自己在精神和身体上都恢复了活力。"
 RICE_recently_gaelicized:0 "近期盖尔化"
 RICE_rulers_recently_gaelicized:0 "近期盖尔化的统治者"
 RICE_mayo_supported_galway_bay_seafarers:0 "戈尔韦湾的海上支持者"
 RICE_mayo_supported_galway_bay_seafarers_desc:0 "该角色利用其地位，慷慨地以多种方式帮助了戈尔韦湾沿岸的社区，赢得了当地民众的感激与认可。"
 RICE_mayo_saint_macdara_support:0 "为圣麦克达拉岛捐款"
 RICE_mayo_saint_macdara_support_desc:0 "戈尔韦海岸附近的一座岛屿长期以来一直与圣麦克达拉联系在一起，这位当地圣人被视为航海者的守护神。统治者们近来提供了资源和资金，以帮助当地人进行传统的宗教活动以及前往该岛的朝圣之旅。"
 RICE_mayo_hazelnut_tribute:0 "榛子贡品"
 RICE_mayo_hazelnut_tribute_desc:0 "根据古爱尔兰法律，榛树被视为[Glossary('树中之王','LORDS_OF_THE_WOOD_GLOSS')]之一，领主每年有权从封臣处获得一定数量的榛木。最近，该角色的下属采集了大量榛木，用于修建篱笆、围栏和房屋墙壁，同时收获了可供食用的榛果。"
 RICE_mayo_bountiful_hazelnut_harvest:0 "丰盛的榛子丰收"
 RICE_mayo_pine_trees:0 "爱尔兰松树"
 RICE_mayo_school_irish_modifier:0 "支持梅奥学院"
 RICE_mayo_school_irish_modifier_desc:0 "当地统治者支持梅奥学院，这所曾由盎格鲁‑撒克逊人主导的机构，正日益成为爱尔兰文化与学术的中心。"
 RICE_mayo_school_irish_character_modifier:0 "支持梅奥学院"
 RICE_mayo_school_irish_character_modifier_desc:0 "多亏了该角色的财政与政治支持，梅奥学院成功转型为爱尔兰文化与学术的重要中心。"
 RICE_mayo_school_english_modifier:0 "复兴的梅奥学院"
 RICE_mayo_school_english_modifier_desc:0 "当地统治者支持了历史悠久的盎格鲁‑撒克逊主导的梅奥学院，并恢复了其与英格兰的联系。"
 RICE_mayo_school_english_character_modifier:0 "复兴了梅奥学院"
 RICE_mayo_school_english_character_modifier_desc:0 "多亏了该角色的财政与政治支持，梅奥学院成功恢复了与英格兰教会的联系，并重新成为连接爱尔兰与英格兰的重要纽带。"
 RICE_mayo_school_destroy_character_modifier:0 "撤回对梅奥学院的支持"
 RICE_mayo_school_destroy_character_modifier_desc:0 "无论出于真诚的信仰，还是更功利的原因，该角色指控由盎格鲁-撒克逊人主导的古老梅奥学院犯有"
 RICE_mayo_school_of_mayo_decision:0 "影响梅奥学院的走向"
 RICE_mayo_school_of_mayo_decision_tooltip:1 "梅奥学院正在我们眼前发生变化，是时候影响它的发展方向了。"
 RICE_mayo_school_of_mayo_decision_desc:0 "撒克逊人的梅奥，或称梅奥学院，得益于爱尔兰人与盎格鲁‑撒克逊人的支持使其成为爱尔兰重要的学术中心之一。然而，随着学院与其盎格鲁‑撒克逊渊源的联结日渐式微，它的命运将何去何从？"
 RICE_mayo_school_of_mayo_decision_effect_tooltip_1:1 "$heritage_west_germanic_name$[heritage|E]的[GetReligionByKey('christianity_religion').GetAdjective]修士或修女可能会偶尔在[GetGeographicalRegion('custom_ireland').GetName]地区出现，尤其当[county_modifier|E]修正处于激活状态时。"
 RICE_mayo_school_of_mayo_decision_confirm:0 "我们将影响学院的未来。"
 RICE_mayo_school_of_mayo_decision_context_tooltip:0 "#emphasis 历史背景：#!我们所知的梅奥起源于一座名为“撒克逊人的梅奥”的修道院，该修道院由盎格鲁‑撒克逊修士约于公元668年建立。此前，这些修士与爱尔兰修士因664年英格兰惠特比宗教会议的结果产生分歧。随着时间推移，梅奥学院逐渐成为连接爱尔兰与盎格鲁‑撒克逊世界的重要宗教中心，也成为主要的教育中心。“撒克逊人的梅奥”在8世纪至9世纪初达到鼎盛，虽然后续数世纪仍作为爱尔兰重要的基督教中心存在，但其独特的盎格鲁‑撒克逊特征逐渐消逝，最终在新教改革时期湮没于历史尘埃。"
 RICE_mayo_school_of_mayo_decision_PICK_TYPE: "$RICE_mayo_school_of_mayo_decision_confirm$"
 RICE_mayo_school_of_mayo_decision_select_text: "撒克逊人的梅奥的未来将何去何从？\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_mayo_school_of_mayo_decision_irish_name: "#Bold 拥抱爱尔兰学术#!"
 RICE_mayo_school_of_mayo_decision_irish_desc: "$RICE_mayo_school_of_mayo_decision_irish_name$"
 RICE_mayo_school_of_mayo_decision_irish_tooltip: "#italic 梅奥学院的盎格鲁‑撒克逊人影响正逐渐消退，现在是时候支持来自爱尔兰背景的新一代学者和僧侣了。#!"
 RICE_mayo_school_of_mayo_decision_english_name: "#Bold 重振英格兰联系#!"
 RICE_mayo_school_of_mayo_decision_english_desc: "$RICE_mayo_school_of_mayo_decision_english_name$"
 RICE_mayo_school_of_mayo_decision_english_tooltip: "#italic 多年来，梅奥学院一直是爱尔兰与英格兰宗教联系的见证，这种联系可以重新加强，变得比以往更加牢固。#!"
 RICE_mayo_school_of_mayo_decision_destroy_name: "#Bold 撤销对学院的支持#!"
 RICE_mayo_school_of_mayo_decision_destroy_desc: "$RICE_mayo_school_of_mayo_decision_destroy_name$"
 RICE_mayo_school_of_mayo_decision_destroy_tooltip: "#italic 梅奥学院早已腐朽，既无法继续充当英格兰与爱尔兰之间的桥梁，也丧失了学术的职能。我们应当撤回支持并没收其部分资产。#!"
 RICE_mayo_bury_bog_butter:0 "埋藏泥炭沼泽黄油"
 RICE_mayo_bury_bog_butter_tooltip:1 "将[bog_butter_short|E]埋入沼泽是绝佳的保存方法。"
 RICE_mayo_bury_bog_butter_desc:0 "将[bog_butter_short|E]埋入沼泽是长期保存这种食物的传统方法。附近应该有些沼泽地，可以用来埋藏我的黄油。"
 RICE_mayo_bury_bog_butter_effect_tooltip_1:1 "#bold $RICE_mayo_retrieve_bog_butter$#![decision|E]可在#V 1年#!后执行，以获得[GetModifier('RICE_mayo_bog_butter_modifier').GetNameWithTooltip][character_modifier|E]及其他增益效果。"
 RICE_mayo_bury_bog_butter_effect_tooltip_2:1 "#bold $tradition_RICE_brehon_law_name$#![tradition|E]]增强了此[decision|E]的增益效果。"
 RICE_mayo_bury_bog_butter_confirm:0 "我可太爱黄油了！"
 RICE_mayo_bury_bog_butter_context_tooltip:0 "#emphasis 历史背景：#!黄油因其在食品、化妆品、药膏等多种用途，在不列颠群岛历史上的许多社会中备受珍视。在古时和中世纪的爱尔兰与苏格兰，人们有时会将其埋入泥炭沼泽中保存。这种做法也使黄油形成了与普通新鲜黄油不同的独特风味。"
 RICE_mayo_retrieve_bog_butter:0 "取回泥炭沼泽黄油"
 RICE_mayo_retrieve_bog_butter_tooltip:1 "是时候去沼泽地挖出我们之前埋下的黄油了。"
 RICE_mayo_retrieve_bog_butter_desc:0 "我前段时间把一些[bog_butter_short|E]埋在沼泽里，以便更好地保存它。也许现在是时候挖出来，品尝它现在的风味了！"
 RICE_mayo_retrieve_bog_butter_effect_tooltip_1:1 "xxxxxxxxxxx"
 RICE_mayo_retrieve_bog_butter_confirm:0 "黄油收获的季节到了！"
 RICE_mayo_retrieve_bog_butter_context_tooltip:0 "$RICE_mayo_bury_bog_butter_context_tooltip$"
 RICE_consecrate_holy_well:0 "祝圣水井"
 RICE_consecrate_holy_well_tooltip:0 "这些土地充满了可以被祝圣的神圣水源。"
 RICE_consecrate_holy_well_desc:0 "圣泉和圣井在[ROOT.Char.GetCulture.GetName]的民俗中发挥着重要作用，虽然我的土地上散布着许多这样的地方，但我希望在我的[capital|E]附近祭祀一座，提高它在各地忠实的[ROOT.Char.GetFaith.GetAdherentNamePlural]眼中的重要性。"
 RICE_consecrate_holy_well_effect_tooltip_1:0 "此[decision|E]你一生只能使用#V 一次#!！"
 RICE_consecrate_holy_well_effect_tooltip_2:0 "你的[capital|E]将获得为期#V 20#!年的[county_modifier|E]，增加[county_opinion|E]和[control|E]；修正的强度随机，但受到你[piety_level|E]的影响"
 RICE_consecrate_holy_well_effect_tooltip_3:0 "只要此[county_modifier|E]处于激活状态，拥有该[county|E]或在此地拥有[domicile|E]的[rulers|E]即可参与[GetActivityType( 'activity_RICE_visit_holy_well' ).GetName][activity|E]。"
 RICE_consecrate_holy_well_confirm:0 "寻找一口合适的圣井！"
 RICE_consecrate_holy_well_context_tooltip:0 "#emphasis 历史背景：#!自新石器时代以来，水井和泉水在不列颠群岛各民族中都具有重要意义，无论他们信仰如何。尽管近期一些学术研究对英国“圣井”作为一个连贯概念提出质疑——例如质疑异教与基督教在圣井的实践是否存在关联，除了它们都围绕水展开这一点，但可以肯定的是，这些水井几代以来一直是精神寄托之地。"
 RICE_no_holy_well_county:0 "你未拥有具备圣井[county_modifier|E]的[county|E]"
 RICE_yes_holy_well_county:0 "你拥有具备圣井[county_modifier|E]的[county|E]"
 RICE_embrace_gaelicization:0 "接受盖尔化"
 RICE_embrace_gaelicization_tooltip:1 "盖尔人的习俗和世界观吸引着你。"
 RICE_embrace_gaelicization_desc:0 "无论我出身何处，如今我在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的[ROOT.Char.GetCapitalLocation.GetCulture.GetCollectiveNoun]人之中，我愈发感到自在。他们的语言、音乐、饮食、服饰、礼仪……这一切都已深深融入我的灵魂。"
 RICE_embrace_gaelicization_effect_tooltip_1:1 "xxxxxxxxxxx"
 RICE_embrace_gaelicization_confirm:0 "我们会比[ROOT.Char.GetCapitalLocation.GetCulture.GetCollectiveNounNoTooltip]人更像[ROOT.Char.GetCapitalLocation.GetCulture.GetNameNoTooltip]人！"
 RICE_embrace_gaelicization_context_tooltip:0 "#emphasis 历史背景：#!定居爱尔兰的盎格鲁‑诺曼人后裔已完全融入当地盖尔文化，以至于后世评论家会浪漫地宣称这些盎格鲁‑诺曼人变得“比爱尔兰人更爱尔兰”。当近代早期英格兰君主开始更直接地尝试控制和征服爱尔兰时，许多“本土”爱尔兰家族与这些被称为“老英格兰人”的希伯诺‑诺曼人后裔已广泛通婚，并时常共同抵抗英格兰统治。"
