 mayo.0012.t:0 "论自然的区分"
 mayo.0012.desc:0 "历经多年辛勤，我终于完成了这部[Glossary( '《论自然的区分》', 'PERIPHYSEON_GLOSS' )]，献给我亲爱的朋友与同侪学者[wulfad.GetTitledFirstName]。这是我毕生心血的结晶，书中深入探讨了宇宙本源的哲学思辨，以及[ROOT.Char.GetFaith.HighGodName]与造物之间的关联。\n\n我确信那些斥我为[GetGeographicalRegion('custom_ireland').GetName]蛮子的学界定会指斥此书为异端邪说，声称我的论点已近乎[Glossary( '泛神论', 'PANTHEISM_GLOSS' )]的边缘。\n\n然而即便是这些对手也不得不承认，如我这般的“蛮族”竟能精通[greek.GetLanguage.GetName]与神学奥义，更屡获伟大的[charles.GetTitledFirstName]在[GetGeographicalRegion('world_europe_west_francia').GetName]对我的学术生涯施以援手。他们或许反对我的神学立场，却无法否认我至少具备与他们平起平坐的学术造诣。"
 mayo.0012.a:0 "而且我做这一切的时候还是个门外汉！"
 mayo.0012.b:0 "我在[GetGeographicalRegion('custom_ireland').GetNameNoTooltip]接受的僧侣训练果然没有白费。"
 mayo.0012.info:0 "#emphasis 历史背景：#!约翰·司各脱·爱留根纳是一位爱尔兰神学家，被认为是9世纪最伟大的基督教思想家之一，他也是加洛林文艺复兴时期的宫廷学校校长和首席学者。他在公元866年完成了他的杰作[Glossary( '《论自然的区分》', 'PERIPHYSEON_GLOSS' )]。如今我们很难确定他到底是平信徒还是教士，但他受过高等教育（包括精通希腊语等多种语言），使他更有可能是教士或僧侣，或者至少接受过此类训练。虽然有一个传说称他后来应阿尔弗雷德大帝的邀请前往英格兰，并在那里被学生用笔刺死，但更有可能的是，他大部分晚年生活都在法国度过。"
 mayo.0013.t:0 "助手"
 mayo.0013.desc:0 "在撰写[Glossary( '《论自然的区分》', 'PERIPHYSEON_GLOSS' )]时，我亲爱的弟子[nisifortinus.GetFirstName]给予了我极大的帮助——尽管[nisifortinus.GetSheHe]不得不删减了我的某些尖锐评论和观点，这令我颇为懊恼。[nisifortinus.GetSheHe]究竟有多少次通过“[Glossary( '假设', 'NISI_FORTE_GLOSS' )]”来干预我的行文呢？\n\n不过[nisifortinus.GetFirstNameNoTooltip]认为这些干预对于减少我作品中的争议性是必要的，我依然感激[nisifortinus.GetHerHis]的辛勤付出。如今，当我思索前路方向与未来所为时，不禁思忖我们是否应当延续这段合作关系。"
 mayo.0013.a:0 "我们的道路就此分别，或许有一天还会重逢。"
 mayo.0013.b:0 "[ROOT.Char.GetFaith.HighGodName]让我们团结合作是有原因的。"
 mayo.0013.info:0 "#emphasis 历史背景：#!约翰内斯·司各脱·爱留根纳有一位助手兼弟子，协助他撰写了他的巨著[Glossary( '《论自然的区分》', 'PERIPHYSEON_GLOSS' )]以及其他一些作品。这位弟子的名字已经遗失在历史中，但现代学者根据这位弟子习惯在修改爱留根纳的文字时使用[Glossary( '假设', 'NISI_FORTE_GLOSS' )]一词以使其更加圆滑、减少争议的特点，给这位门徒起了一个绰号——#italic 假设先生#!。"
 mayo.0014.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 mayo.0014.desc:0 "曾经我的处境或许不是很可以。但向[GetTitleByKey('k_england').GetNameNoTier]宣誓效忠并非全无益处。\n\n我不再是那个毋庸置疑独立的[GetTitleByKey('k_ireland').GetNameNoTier]至高王，但我对这个岛屿的掌控力比那些小[irish.GetName]酋长和国王互相争夺零星土地和几头优质牛时要强得多。\n\n[norman.GetCollectiveNoun]人固然是灾祸，但我已巧妙借其力，为这片土地重建了秩序与繁荣的雏形。即便我与他们的关系仍暧昧不明，或许将来某日，我或我的子孙终将再度与他们兵戎相见——但此刻，和平已然降临。"
 mayo.0014.a:0 "我这一生，想来也快走到尽头了……"
 mayo.0015.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 mayo.0015.desc:0 "这数十年间，我为了夺回本应属于我的[GetTitleByKey('k_ireland').GetNameNoTier]王冠，期间血泪交加。就连狡诈的[norman.GetCollectiveNoun]人也企图插手[irish.GetName]内部的纷争，试图通过背叛与冷酷手段扩张他们的影响力。\n\n但岁月流转，如今我们已凭借军事与外交手腕，建立起崭新的[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip]，而我正是这片土地的至高王。历经多年战乱动荡，我们需要时间来巩固和恢复，且必须时刻警惕海峡对岸的邻邦——他们曾背弃《温莎条约》出卖过我，我毫不怀疑只要有机会，他们定会故技重施。\n\n不过此刻，作为漫长岁月以来首位无可争议且统一[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip]的至高王，我终于能暂享片刻安宁了。"
 mayo.0015.a:0 "$mayo.0014.a$"
 mayo.0016.t:0 "至高王的归来"
 mayo.0016.desc:0 "数十年来，[rory_o_connor.GetFirstName]一直自称“[GetTitleByKey('k_ireland').GetNameNoTier]至高王”，但直到最近[rory_o_connor.GetSheHe]才真正行使权威，而非仅仅停留在名号上。背信弃义的[norman.GetCollectiveNoun]人短暂入侵及其对《温莎条约》的背叛与撕毁，似乎成为[rory_o_connor.GetHerHis]迈向真正至高王之路的诱因。\n\n如今，[rory_o_connor.GetFirstNameNoTooltip]已成为[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip]最强大的领主。"
 mayo.0016.desc.irish:0 "有人认为我应向[rory_o_connor.GetHerHim]宣誓效忠，或者是作为[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip]的统治者向[rory_o_connor.GetHerHim]进贡。然而，也有人认为我不该被[rory_o_connor.GetFirstNamePossessive]虚张声势的武力展示所震慑，因为[rory_o_connor.GetHerHis]权势可能转瞬即逝，或者在那位老迈的[rory_o_connor.GetWomanMan]死后，至高王权便会分崩离析。"
 mayo.0016.a:0 "我们静观其变……"
 mayo.0016.b:0 "我绝不会向这个暴发户宣誓效忠！"
 mayo.0016.c:0 "我们将谨慎地提供贡品，比如牛群和黄油。"
 mayo.0016.d:0 "我们别无选择，还是宣誓效忠吧。"
