 dynn_RICE_eriugena:0 "爱留根纳"
 nick_RICE_scottus:0 "生于爱尔兰的"
 nick_RICE_scottus_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat]最初来自爱尔兰岛，该岛居民在拉丁语中被称为[Glossary( '斯科提', 'SCOTTI_GLOSS' )]，因此[CHARACTER.GetSheHe]在拉丁语中被称作#italic 斯科图斯#!，意为“爱尔兰人”。"
 Wulfad:0 "沃尔法德"
 Winibert:0 "温尼伯特"
 RICE_nick_butterlord:0 "黄油领主"
 RICE_nick_butterlord_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]因酷爱黄油而闻名，并时常举办奢华宴会，而且宴席上会供应各类顶级美味的黄油——从新鲜黄油到风味独特的泥炭沼泽黄油，应有尽有。"
 RICE_anglo_norman_mercenaries_event_troops:0 "盎格鲁‑诺曼冒险者"
 RICE_irish_event_troops:0 "爱尔兰领主"
 RICE_irish_high_king_message_tooltip:0 "在[GetGeographicalRegion('custom_ireland').GetName]的[independent|E][dukes|E]和[counts|E]将选择成为你的[vassal|E]或[tributary|E]。"
 Bega:0 "贝加"
 game_concept_bog_butter_bog:0 "泥炭沼泽黄油"
 game_concept_bog_butter_short:0 "泥炭沼泽黄油"
 game_concept_bog_butter:0 "泥炭沼泽黄油"
 game_concept_bog_butter_desc:0 "古典和中世纪时期不列颠群岛部分地区会以一种传统的方法来保存黄油——这些黄油便是$game_concept_bog_butter$。它通过两个[decisions|E]来体现：#bold $RICE_mayo_bury_bog_butter$#!和#bold $RICE_mayo_retrieve_bog_butter$#!。\n\n任何拥有#V $game_concept_bog_butter$#![innovation|E]的[culture|E]都可用这两个[decisions|E]。在你使用第一个[decision|E]后，必须等待至少一年才能使用第二个[decision|E]。"
 game_concept_gift_of_luxury_butter:0 "奢侈黄油赠送"
 game_concept_gift_luxury_butter_gift:0 "奢侈黄油赠送"
 game_concept_gift_luxury_butter_short:0 "黄油"
 game_concept_gift_luxury_butter:0 "奢侈黄油赠送"
 game_concept_gift_luxury_butter_desc:0 "拥有#bold $tradition_RICE_brehon_law_name$#![tradition|E]的[cultures|E]可以使用一个[character_interaction|E]来#V $RICE_mayo_butter_interaction$#!。这反映了在前现代爱尔兰，牛群和黄油是个人地位与财富的重要象征，因此黄油会作为款待客人的习俗，而一个人的社会阶层决定了他应收到多少黄油。\n\n该[interaction|E]会提升对方对你的[opinion_i|E][opinion|E]，并给予其一个正面的[modifier|E]。双方的[rank|E]越高（基于本人、任一[close_family|E]或[spouse|E]是否持有[title|E]以及该[title|E]的[title_tier|E]），双方获得的[prestige_i|E][prestige|E]奖励就越多。如果接收者是[duchy|E][title_tier|E]或更高等级，赠送者还会根据接收者的[title_tier|E]获得少量[legitimacy_i|E][legitimacy|E]。"
 RICE_mayo_butter_interaction:0 "赠送奢侈黄油"
 RICE_mayo_butter_interaction_desc:0 "赠送[recipient.GetShortUINamePossessiveNoTooltip]优质上乘的[gift_luxury_butter_short|E]。"
 RICE_mayo_butter_interaction_notification:0 "请收下这份来自我们家族中浓郁香滑的[gift_luxury_butter_short|E]，以此表达我的热情。正如老话说的好——黄油不能治愈的，便无药可医。"
 RICE_mayo_periphyseon_name:0 "论自然的区分"
 RICE_mayo_periphyseon_desc:0 "这部名为[Glossary( '《论自然的区分》', 'PERIPHYSEON_GLOSS' )]的书籍，由[ROOT.Char.GetFirstName]在一位匿名的[ROOT.Char.GetCulture.GetName]抄写员的协助下，历时数年编纂而成。此书献给[ROOT.Char.GetFirstNamePossessiveNoTooltip]的友人[wulfad.GetTitledFirstName]，内容是一场关于神学与哲学的冗长而深刻的师生对话，尤其聚焦于[ROOT.Char.GetFirstNameNoTooltip]所提出的现实存在的四种“形态”：\n\n$BULLET_WITH_TAB$创造而不被造者\n$BULLET_WITH_TAB$被造且创造者\n$BULLET_WITH_TAB$被造而不创造者\n$BULLET_WITH_TAB$非被造亦非创造者\n\n尽管书中论点曾被一些[GetReligionByKey('christianity_religion').GetAdjective]思想家批评为过于接近[Glossary( '泛神论', 'PANTHEISM_GLOSS' )]与新柏拉图主义的异教思想，但亦有人赞赏其智识上的严谨、大胆的视角，以及将古代哲学融入[GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip]框架的能力。"
 building_type_RICE_mayo_mayo_of_the_saxons_01:0 "撒克逊人的梅奥"
 building_type_RICE_mayo_mayo_of_the_saxons_01_desc:0 "林迪斯法恩的圣科尔曼创建以来，梅奥修道院数代以来一直是不列颠群岛重要的学术与朝圣中心。这座机构在促进爱尔兰与英格兰神职人员及知识分子之间的联系方面发挥着重要作用。"
 building_RICE_mayo_mayo_of_the_saxons_01:0 "$building_type_RICE_mayo_mayo_of_the_saxons_01$"
 building_RICE_mayo_mayo_of_the_saxons_01_desc:0 "$building_type_RICE_mayo_mayo_of_the_saxons_01_desc$"
 building_type_RICE_mayo_croagh_patrick:0 "巴特利爵山"
 building_type_RICE_mayo_croagh_patrick_desc:0 "相传圣巴特利爵曾在这座俯瞰大西洋的山顶禁食四十天，效仿摩西在西奈山上的经历。自此，爱尔兰各地的基督徒纷纷前往这座圣山，重走圣巴特利爵的足迹。山脉周围散布着众多祭坛、岩画及其他遗迹，共同构成了一幅宏伟的宗教景观。"
 building_RICE_mayo_croagh_patrick:0 "$building_type_RICE_mayo_croagh_patrick$"
 building_RICE_mayo_croagh_patrick_desc:0 "$building_type_RICE_mayo_croagh_patrick_desc$"
 building_type_RICE_mayo_giants_causeway:0 "巨人堤道"
 building_type_RICE_mayo_giants_causeway_desc:0 "成千上万根交错的玄武岩柱在这里的海岸边汇聚。据当地民间传说，这一宏伟的自然构造据说是传奇英雄芬恩·麦克库尔所建堤道的遗迹。"
 building_RICE_mayo_giants_causeway:0 "$building_type_RICE_mayo_giants_causeway$"
 building_RICE_mayo_giants_causeway_desc:0 "$building_type_RICE_mayo_giants_causeway_desc$"
 building_type_RICE_mayo_abbey_of_kells:0 "凯尔斯修道院"
 building_type_RICE_mayo_abbey_of_kells_desc:0 "这座由来自艾奥纳修道院的圣高隆巴创立的修道院，是爱尔兰的一处学术中心。它尤其以珍藏《凯尔经》而闻名，这本福音书以其无与伦比的艺术美感，几个世纪以来一直令虔诚的基督徒目眩神迷并深受启迪。"
 building_RICE_mayo_abbey_of_kells:0 "$building_type_RICE_mayo_abbey_of_kells$"
 building_RICE_mayo_abbey_of_kells_desc:0 "$building_type_RICE_mayo_abbey_of_kells_desc$"
 building_type_RICE_mayo_rock_of_cashel_01:0 "卡舍尔岩"
 building_type_RICE_mayo_rock_of_cashel_01_desc:0 "坐落于广阔平原之上的卡舍尔岩，据说是圣巴特利爵让芒斯特国王皈依基督教的地方。数世纪以来，这里一直是芒斯特国王的统治中心。"
 building_RICE_mayo_rock_of_cashel_01:0 "卡舍尔岩"
 building_RICE_mayo_rock_of_cashel_01_desc:0 "$building_type_RICE_mayo_rock_of_cashel_01_desc$"
 building_RICE_mayo_rock_of_cashel_02:0 "卡舍尔圣岩"
 building_RICE_mayo_rock_of_cashel_02_desc:0 "$building_type_RICE_mayo_rock_of_cashel_01_desc$\n近期的统治者将建筑群的大部分捐赠给了当地的宗教机构，这些机构增建了宏伟壮丽的精神建筑，并积累了无数价值连城的艺术珍品。"
 building_type_RICE_mayo_hill_of_tara:0 "塔拉丘"
 building_type_RICE_mayo_hill_of_tara_desc:0 "在古时候，塔拉丘曾是爱尔兰最重要的仪式与安葬之地，岛上的至高王会在#italic 命运之石#!前举行神圣的加冕典礼。"
 building_RICE_mayo_hill_of_tara:0 "$building_type_RICE_mayo_hill_of_tara$"
 building_RICE_mayo_hill_of_tara_desc:0 "$building_type_RICE_mayo_hill_of_tara_desc$"
 RICE_mayo_aspiration_ruaidri_o_connor_desc: "#bold [historical_aspiration_main_objectives|E]#!（@warning_icon![historical_aspiration_routes|E] 互相排斥）\n#bold #italic #N [historical_aspiration_route|E]：效忠#!#!#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_england').GetNameNoTier]的$heritage_goidelic_name$[vassal|E]或[tributary|E]\n$EFFECT_LIST_BULLET$通过直接控制或[vassals|E][completely_control|E][GetGeographicalRegion('custom_ireland').GetName]内至少#V 6#!个[counties|E]\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高的[prestige_level|E]\n#bold #italic #P [historical_aspiration_route|E]：独立#!#!#!\n$EFFECT_LIST_BULLET$保持为独立的非[tributary|E]$heritage_goidelic_name$[ruler|E]\n$EFFECT_LIST_BULLET$通过直接控制或[vassals|E]完全控制[GetGeographicalRegion('custom_ireland').GetName]内至少#V 9#!个[counties|E]\n$EFFECT_LIST_BULLET$[GetGeographicalRegion('custom_ireland').GetName]内最多#V 2#!个[counties|E]由非$heritage_goidelic_name$[culture|E]的[rulers|E]直接拥有\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高的[prestige_level|E]\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n#italic #bold #N 效忠#[historical_aspiration_route|E]奖励#!#!#!\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$获得#V 1000名#!英格兰[special_troops|E]，其中包含[men_at_arms|E]\n$EFFECT_LIST_BULLET$提升你的[culture|E]与诺曼和英格兰[cultures|E]之间的[cultural_acceptance|E]\n#italic #bold #P 独立[historical_aspiration_route|E]奖励#!#!#!\n$EFFECT_LIST_BULLET$获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$获得爱尔兰#V 2000名#![special_troops|E]，包含[men_at_arms|E]\n$EFFECT_LIST_BULLET$若无[GetTitleByKey('k_ireland').GetNameNoTier]头衔则会获得\n$EFFECT_LIST_BULLET$$RICE_irish_high_king_message_tooltip$\n\n#bold [historical_aspiration_bonus_objectives|E]#!（两种[historical_aspiration_routes|E]皆可达成）\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高的[piety_level|E]（奖励：获得一个[diplomacy_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$至少完成一次[GetActivityType( 'activity_RICE_mayo_croagh_patrick_pilgrimage' ).GetName][activity|E]（奖励：获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）"
 RICE_mayo_historical_aspiration_action_ruaidri_o_connor: "#italic 数十年来，我一直在努力确立自己作为爱尔兰至高王的权威，对抗傲慢的爱尔兰统治者以及诡计多端的亲戚，甚至还有那些新来且蠢蠢欲动的盎格鲁‑诺曼冒险家。如今我已日渐年迈，希望能在这座圣巴特利爵的传奇岛屿上重掌些许权柄。#!$RICE_mayo_aspiration_ruaidri_o_connor_desc$"
 RICE_mayo_historical_aspiration_modifier_desc_ruaidri_o_connor: "[GetModifier('RICE_mayo_aspiration_maintain_authority_in_ireland').GetNameWithTooltip]"
 RICE_mayo_aspiration_maintain_authority_in_ireland: "[RICE_aspiration|E]：维持爱尔兰的权威"
 RICE_mayo_aspiration_maintain_authority_in_ireland_desc: "#italic 多年来，罗里·乌·康霍巴尔一直致力于在爱尔兰确立自己作为至高王的权威，对抗桀骜不驯的爱尔兰敌对统治者、心怀叵测的亲属，以及新近到来、动机可疑的盎格鲁‑诺曼冒险家。如今年事已高的他，渴望重获对圣巴特利爵之岛的部分掌控权。#!$RICE_mayo_aspiration_ruaidri_o_connor_desc$\n\n"
 activity_RICE_mayo_croagh_patrick_pilgrimage_host_an_a:0 "$host_activity_a$"
 activity_RICE_mayo_croagh_patrick_pilgrimage:0 "巴特利爵山朝圣"
 activity_RICE_mayo_croagh_patrick_pilgrimage_desc:0 "巴特利爵山是爱尔兰最受欢迎的朝圣地之一，因其与爱尔兰主保圣人圣帕特里克有关联而闻名。"
 RICE_mayo_croagh_patrick_pilgrimage_context_tooltip: "#emphasis 历史背景：#!巴特利爵山早在新石器时代起就被视为圣地。自基督教化以来，这座山与著名的圣巴特利爵紧密相连，据说他曾在山顶禁食四十天，如同摩西在西奈山上度过四十昼夜。直至今日，每年仍有众多朝圣者来此尝试登山，尤其在登山假日期间"
 activity_RICE_mayo_croagh_patrick_pilgrimage_selection_tooltip: "前往[GetTitleByKey('c_mayo').GetNameNoTier]的巴特利爵山进行[local_pilgrimage|E]。\n\n$RICE_mayo_croagh_patrick_pilgrimage_context_tooltip$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_host_desc: "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$获得#P 正面#![character_modifiers|E]的概率取决于你的[piety_level|E]"
 activity_RICE_mayo_croagh_patrick_pilgrimage_guest_desc: "$activity_RICE_mayo_croagh_patrick_pilgrimage_host_desc$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_province_desc: "巴特利爵山位于[GetTitleByKey('b_castlebar').GetNameNoTier]附近。"
 activity_RICE_mayo_croagh_patrick_pilgrimage_destination_selection: "$activity_RICE_mayo_croagh_patrick_pilgrimage_province_desc$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_guest_help_text: "$activity_RICE_mayo_croagh_patrick_pilgrimage$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_predicted_cost: "前往巴特利爵山进行[local_pilgrimage|E]的费用取决于你选择的[activity_options|E]。"
 activity_RICE_mayo_croagh_patrick_pilgrimage_conclusion_desc: "我们的[GetActivityType( 'activity_RICE_mayo_croagh_patrick_pilgrimage' ).GetName]已圆满结束，克罗帕特里克山果然如传说般充满灵性！"
 RICE_mayo_croagh_patrick_pilgrimage_completed_log_title:0 "巴特利爵山朝圣之旅完成"
 RICE_mayo_croagh_patrick_pilgrimage_completed_log:0 "[CHARACTER.GetShortUIName|U]完成了前往巴特利爵山的[local_pilgrimage|E]。"
