 mayo.0020.t:0 "祝圣井水"
 mayo.0020.desc:0 "从人们有记忆以来，圣泉和圣井就在[ROOT.Char.GetCulture.GetName]人的民俗和日常生活中发挥了重要作用。\n\n在我的指导下，[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]在[county.GetNameNoTier]找到了当地崇敬的圣井，它作为崇敬和祈祷的场所值得更多认可。在我们为这口圣井举行了各种仪式后，关于这口圣井的灵性和疗效的消息正在该地区迅速传播。\n\n毫无疑问，这口圣井将成为当地[ROOT.Char.GetFaith.GetAdjective]宗教活动多年来的一个重要焦点。"
 mayo.0020.a:0 "好消息！"
 mayo.0020.tooltip:0 "$RICE_consecrate_holy_well_effect_tooltip_3$"
 mayo.0021.t:0 "拜访圣井"
 mayo.0021.desc:0 "从人们有记忆以来，圣泉和圣井就在[ROOT.Char.GetCulture.GetName]人的民俗和日常生活中发挥了重要作用。许多人出于宗教原因访问这些井、泉或在大地上星罗棋布的小水潭。我也不例外。我决定去拜访[county.GetNameNoTier]的一口在当地颇有名望的圣井。\n\n当我到达这个地方后，虽然它相对较小，但却宁静而谦卑，我感到一种很久没有感受到的精神和身体的平静。我以[ROOT.Char.GetFaith.PantheonTerm]的方式向[ROOT.Char.GetFaith.GetAdjective]祈祷，并在离开前留下贡品。"
 mayo.0021.a:0 "总而言之，一段美好的时光。"
 mayo.0021.toast:0 "圣井的水祝福了你"
 mayo.0022.t:0 "圣井"
 mayo.0022.desc:0 "近来，[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]的圣井因其灵性而声名鹊起——即便是我这种[ROOT.Char.GetTitleAsNameNoTooltip]，也能从中受益。与许多人一样，我将前往那里，向[ROOT.Char.GetFaith.PantheonTerm]祈求赐福。"
 mayo.0022.a:0 "去圣井！"
 mayo.0023.t:0 "曾经的[old_culture.GetNameNoTooltip]人，现在的[gaelic_culture.GetNameNoTooltip]人"
 mayo.0023.desc:0 "我们与[gaelic_culture.GetCollectiveNoun]人共同生活已有多年，不仅逐渐接纳了他们文化的饮食与服饰，更是深入了解他们的语言与思维方式。我的许多[old_culture.GetCollectiveNoun]同胞甚至已与[gaelic_culture.GetNameNoTooltip]人通婚。\n\n连[gaelic_culture.GetCollectiveNounNoTooltip]人都曾感叹，说我比他们族人更像真正的[gaelic_culture.GetNameNoTooltip]人！这份赞誉令我自豪，因为我已经把这些土地和这里的人民视为我的亲人。"
 mayo.0023.a:0 "我永远是[gaelic_culture.GetNameNoTooltip]人！"
