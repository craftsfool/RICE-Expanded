 mayo.0050.intro:0 "公元668年，圣科尔曼创立了伟大的[GetReligionByKey('christianity_religion').GetAdjective]梅奥学院。得益于大批热忱的[anglo_saxon_culture.GetName]僧侣从[GetGeographicalRegion('custom_england').GetName]远赴[GetTitleByKey('c_mayo').GetNameNoTier]求学，学院在此后数百年间蓬勃发展。尽管它仍是重要的学术中心，但近些年已有所衰落。\n\n如今，由于[GetTitleByKey('c_mayo').GetNameNoTierNoTooltip]的统治者[mayo_leader.GetTitledFirstName]近期的举措，这所学院的历史迎来了有趣的转折"
 mayo.0050.t:0 "梅奥学院"
 mayo.0050.desc:0 "$mayo.0050.intro$随着时间的推移，学院已失去了许多原有的[anglo_saxon_culture.GetNameNoTooltip]特色，并越来越多地采用了$heritage_goidelic_name$的装饰风格。\n\n[mayo_leader.GetFirstNameNoTooltip]并未抵制这一变化，反而鼓励梅奥学院与[GetGeographicalRegion('custom_ireland').GetName]的其他[GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip]机构建立更紧密的联系。[mayo_leader.GetHerHis|U]目标是帮助梅奥学院成为该岛上的领先机构。"
 mayo.0050.a:0 "这是[GetTitleByKey('c_mayo').GetNameNoTierNoTooltip]历史的新篇章……"
 mayo.0051.t:0 "$mayo.0050.t$"
 mayo.0051.desc:0 "$mayo.0050.intro$[mayo_leader.GetSheHe|U]认为学校需要重振与[GetGeographicalRegion('custom_england').GetNameNoTooltip]的历史联系，毕竟那里曾是学校的根源也是构建不列颠群岛各地区关系的关键纽带。\n\n为此，[mayo_leader.GetFirstNameNoTooltip]协助学校重新扩展了与[GetGeographicalRegion('custom_england').GetNameNoTooltip]其他宗教机构的正式联系，[mayo_leader.GetHerHis|U]希望这样做能够恢复学校的命运并再次扩大其影响力。"
 mayo.0051.a:0 "$mayo.0050.a$"
 mayo.0052.t:0 "$mayo.0050.t$"
 mayo.0052.desc:0 "$mayo.0050.intro$由于[mayo_leader.GetFirstNamePossessiveNoTooltip]的行为，这所学校很可能#italic 再也无法#!恢复往日的辉煌了。\n\n在指控学校师生犯下种种罪行后，[mayo_leader.GetFirstNameNoTooltip]撤回了对学校的支持。不仅如此，学校的一些资产从土地到书籍和圣物一一被没收，归[mayo_leader.GetHerselfHimself]所有，有人怀疑此举背后是否存在政治或经济动机。\n\n尽管学校依然存在，但它已经失去了往日的光辉。"
 mayo.0052.a:0 "$mayo.0050.a$"
 mayo.0053.t:0 "来自[GetGeographicalRegion('custom_england').GetNameNoTooltip]的[saxon_monk.Custom('NunMonk')|U]"
 mayo.0053.desc:0 "自从[GetGeographicalRegion('custom_ireland').GetName]重要的[GetReligionByKey('christianity_religion').GetAdjective]梅奥学院重建了与[GetGeographicalRegion('custom_england').GetName]的联系，许多来自[GetGeographicalRegion('custom_england').GetNameNoTooltip]的学者便踏上了这座岛，前往[GetTitleByKey('c_mayo').GetNameNoTier]求学。\n\n这些学者中有一位名叫[saxon_monk.GetFirstName]的[saxon_monk.GetCulture.GetName][saxon_monk.Custom('NunMonk')]。[saxon_monk.GetSheHe|U]在梅奥学院潜心研习并广结人脉，如今正考虑在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]定居，并主动提出要借助[saxon_monk.GetHerHis]的关系网协助我处理宗教事务。"
 mayo.0053.a:0 "欢迎！我们正需要你这样的人才。"
 mayo.0053.b:0 "[saxon_monk.GetSheHe|U]没有给我留下深刻印象。"
