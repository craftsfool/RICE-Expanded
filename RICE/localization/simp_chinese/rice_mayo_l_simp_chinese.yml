 activity_RICE_visit_holy_well:0 "拜访圣井"
 activity_RICE_visit_holy_well_desc:0 "附近有一口圣井，是当地民众热衷朝拜的圣地。我可以在那里向[GetPlayer.GetFaith.PantheonTerm]祈祷并献上供品。"
 RICE_visit_holy_well_context_tooltip: "$RICE_consecrate_holy_well_context_tooltip$"
 activity_RICE_visit_holy_well_selection_tooltip: "拜访当地的一处圣井。\n\n$RICE_visit_holy_well_context_tooltip$"
 activity_RICE_visit_holy_well_host_desc: "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$获得[legitimacy_i|E][legitimacy|E]\n$BULLET_WITH_TAB$有概率获得[GetStaticModifier('TFE_healing_waters_of_a_holy_well').GetNameWithTooltip][character_modifier|E]"
