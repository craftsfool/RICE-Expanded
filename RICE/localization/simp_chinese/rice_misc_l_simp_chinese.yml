 RICE_local_pilgrimage_memorialization_type_small_desc:0 "$EFFECT_LIST_BULLET$[activity|E]完成后获得基础的[prestige_i|E]#V 50#!。\n\n#weak 我要在圣地留下我的印记，刻上我的名字，或在某个地方留下一条消息。#!"
 RICE_local_pilgrimage_memorialization_type_medium:0 "寻常题字"
 RICE_local_pilgrimage_memorialization_type_medium_desc:0 "$EFFECT_LIST_BULLET$[activity|E]完成后获得基础的[prestige_i|E]#V 100#!。\n$EFFECT_LIST_BULLET$获得基础的[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('miniscule_dynasty_prestige_gain')]#![dynasty_prestige|E]\n\n#weak 为了庆祝这次朝圣，我回去我要题字纪念。#!"
 RICE_local_pilgrimage_memorialization_type_large:0 "纪念碑"
 RICE_local_pilgrimage_memorialization_type_large_desc:0 "$EFFECT_LIST_BULLET$[activity|E]完成后获得基础的[prestige_i|E]#V 200#!。\n$EFFECT_LIST_BULLET$获得基础的[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_dynasty_prestige_gain')]#![dynasty_prestige|E]\n\n#weak 每个人都要知道我的虔诚，因此我要委托建造一座朴素但令人印象深刻的纪念碑来纪念这一时刻。#!"
