 RICEmisc.0011.t:0 "旅程开始"
 RICEmisc.0011.desc:0 "是时候开始前往[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]进行一趟[ROOT.Char.GetInvolvedActivity.GetShortName]之旅了。我相信，为此付出的头痛与麻烦终将在目的地后烟消云散......或者至少我得希望是这样，否则所有为旅行的准备都毫无意义。"
 RICEmisc.0011.a:0 "我们为此的准备是为了诗与远方"
 RICEmisc.0012.t:0 "[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]温泉"
 RICEmisc.0012.desc:0 "我们刚刚来到[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]中的一个当地温泉。尽管这个温泉并不特别有名，但与其他一些更受欢迎更遥远的温泉相比，泡在温暖的水中仍然是相当愉快的体验！\n\n"
 RICEmisc.0012.desc.private:0 "在日常中从未有如此放松，我闭上眼睛，放松下来，我所有的忧虑都一瞬间离开我的脑海。"
 RICEmisc.0012.desc.public:0 "在这里，我还花时间与一些当地人聊天，并与该地区的一些知名人士会面，在这样放松的同时进行社交活动是件好事。"
 RICEmisc.0012.desc.conclusion:0 "遗憾的是，这次行程只能持续这么久，所以我在这里的时候会尽量利用它。"
 RICEmisc.0012.a:0 "我很高兴来到这里！"
