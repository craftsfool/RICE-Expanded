 activity_RICE_hot_springs_visit:0 "温泉之旅"
 activity_RICE_hot_springs_visit_desc:0 "世上有许多[hot_springs|E]，但并非所有值得前往，恰好我住在靠近一个温泉的地方。我应该去那里消除压力，让我忘掉日常生活中的忧虑。"
 activity_RICE_hot_springs_visit_selection_tooltip:0 "前往当地[hot_springs|E]放松。\n\n$activity_RICE_hot_springs_visit_context_tooltip$"
 activity_RICE_hot_springs_visit_context_tooltip:0 "#emphasis 历史背景：#!温泉由于火山活动等等原因形成。人类使用温泉已经有数千年的历史，许多温泉被认为具有疗效或治疗作用。"
 activity_RICE_hot_springs_visit_host_desc:0 "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$其他可能的加成取决于地点"
 activity_RICE_hot_springs_visit_guest_desc:0 "$activity_RICE_hot_springs_visit_host_desc$"
 activity_RICE_hot_springs_visit_province_desc:0 "\n#N 这里的[hot_springs|E]并不那么有名，但作为一个放松的地方应该还是足够的。#!\n#weak 减少较少的[stress_loss_i|E][stress|E]，与其他知名[hot_springs|E]相比，并没有额外加成。#!"
 activity_RICE_hot_springs_visit_destination_selection:0 ""
 activity_RICE_hot_springs_visit_guest_help_text:0 "$activity_RICE_hot_springs_visit$"
 activity_RICE_hot_springs_visit_predicted_cost:0 "前往[hot_springs|E]之旅的成本取决于你选择的[activity_options|E]。"
 activity_RICE_hot_springs_visit_conclusion_desc:0 "[GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName]已经结束，这是一次有趣且轻松的体验！期待下一次！"
 RICE_hot_springs_visit_type:0 "温泉之旅类型"
 RICE_hot_springs_visit_type_public:0 "高调之旅"
 RICE_hot_springs_visit_type_public_desc:0 "$EFFECT_LIST_BULLET$这将是一次高调、公开的[hot_springs|E]之旅。当地人将尽其所能取悦你。\n$EFFECT_LIST_BULLET$与#bold 私密之行#!相比，你将获得更多的[prestige_i][prestige|E]，但失去的[stress_loss_i|E][stress|E]更少。\n\n#weak 什么是放松？唯有大家一同其乐融融在一起才是放松！只有那些不善于社交和忙碌的人，才会在玩乐的时候避开别人！#!"
 RICE_hot_springs_visit_type_private:0 "私密之行"
 RICE_hot_springs_visit_type_private_desc:0 "$EFFECT_LIST_BULLET$这将是一次低调的[hot_springs|E]之旅。你将避免引起别人的注意，这样你就可以平静地放松。\n$EFFECT_LIST_BULLET$与#bold 高调之旅#!访问相比，你会失去更多的[stress_loss_i|E][stress|E]，但获得更少的[prestige_i][prestige|E]（或者根本没有，取决于你前往的地方）。\n\n#weak 那些依靠别人享受的人并不能自得其乐，一次安静、和平的环境才是最好的放松。#!"
 RICE_hot_springs_visit_leisure_phase:0 "闲暇"
 RICE_hot_springs_visit_leisure_phase_desc:0 "现在是享受[hot_springs|E]！"
