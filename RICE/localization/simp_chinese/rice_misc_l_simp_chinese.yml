 RICEintro_ROA_warning_tooltip:0 "\n————————————————————————\n\n监测到#V #bold 亚洲之王#!#!mod已经运行，如果你已经使用该mod，请#bold 确保它排在RICE#underline 下面#!，并开始新游戏。"
 game_rule_category_sri_lanka:0 "室利楞伽"
 action_RICE_historical_aspiration:0 "[GetPlayer.Custom('RICE_historical_aspiration_action_title_name')]"
 action_RICE_historical_aspiration_label:0 "你可以尝试完成[historical_aspirations|E]"
 action_RICE_historical_aspiration_desc_default:1 "通过完成一个或多个[objectives|E]来实现你的[RICE_aspiration|E]，从而获得各种加成"
 action_RICE_historical_aspiration_desc:1 "[GetPlayer.Custom('RICE_historical_aspiration_action_desc')]\n\n@alert_icon!#alert_trial [historical_aspirations|E]完成后会在年初时进行计算。#!"
 action_RICE_historical_aspiration_click:1 "#I 点击查看你的角色#!"
 RICE_historical_aspiration_fulfilled:1 "[GetPlayer.GetTitledFirstName]实现了[GetPlayer.GetHerHis]的[GetPlayer.Custom('RICE_historical_aspiration_modifier_desc')]"
 RICE_historical_aspiration_fulfilled_title:1 "野心得以实现"
 game_concept_historical_aspiration:2 "历史宏愿"
 game_concept_historical_aspirations:2 "历史宏愿"
 game_concept_historical_aspirations_desc:2 "$game_concept_historical_aspirations$是一种简单的、可选的任务，在游戏开始时提供给某些历史[characters|E]。与“成就”不同，这些野心任务完成后会获得各种奖励，如[modifiers|E]或@dynasty_prestige_icon![dynasty_prestige|E]\n\n野心机制一般反映的是历史上角色在当时历史环境的动机，而不是其他可能性或假设，其目的是鼓励玩家扮演该角色在游戏中还原角色愿望和经历。\n\n野心包括两类，[historical_aspiration_main_objectives|E]是要满足一定目标才能实现的野心。反之，[historical_aspiration_bonus_objectives|E]则不需要满足，但满足后会获得额外奖励。这些野心目标可以是直接行动，如做出[decision|E]，也可以是被动行动，如追随某个[religion|E]。\n\n需要注意的是，野心完成是在每一年的#V 开始#!时计算的，而不是立即计算。即如果你在年初就达到了目标，那么次年才会结算。"
 game_concept_historical_aspiration_main_objective:2 "主要目标"
 game_concept_historical_aspiration_main_objectives:2 "主要目标"
 game_concept_historical_aspiration_main_objectives_desc:2 "$game_concept_historical_aspiration_main_objectives$是历史角色实现其[historical_aspiration|E]所需的先决条件。它们不同于[historical_aspiration_bonus_objectives|E]，后者是可选的。\n\n一旦完成了一个或多个主要目标，角色就会获得相关奖励，包括他们设法完成的[historical_aspiration_bonus_objectives|E]中的奖励。"
 game_concept_historical_aspiration_bonus_objective:2 "附加目标"
 game_concept_historical_aspiration_bonus_objectives:2 "附加目标"
 game_concept_historical_aspiration_bonus_objectives_desc:2 "$game_concept_historical_aspiration_bonus_objectives$是历史角色在实现其[historical_aspiration|E]时可以尝试达成的额外的可选目标。与[historical_aspiration_main_objectives|E]不同的是，这些目标并不是必须实现的，但如果你想实现它们，它们会提供更多奖励。\n\n不过，[historical_aspiration_bonus_objectives|E]必须在完成[historical_aspiration_main_objectives|E]后才能获得奖励。如果之后才实现，角色将无法获得此类奖励。"
 rule_RICE_yazidi_emergence:0 "RICE中雅兹迪教的出现"
 setting_RICE_yazidi_emergence_default:0 "默认"
 setting_RICE_yazidi_emergence_default_desc:0 "雅兹迪[faith|E]会在游戏开始半个世纪后随机出现，但更有可能在12世纪后出现。"
 setting_RICE_yazidi_emergence_historical:0 "#high 史实#!"
 setting_RICE_yazidi_emergence_historical_desc:0 "雅兹迪[faith|E]只有在 12 世纪中叶后才会随机出现。"
 setting_RICE_yazidi_emergence_unrestricted:0 "#high 无限制#!"
 setting_RICE_yazidi_emergence_unrestricted_desc:0 "雅兹迪[faith|E]可以随时出现"
 rule_RICE_yarsani_emergence:0 "RICE中雅赛尼派的出现"
 setting_RICE_yarsani_emergence_default:0 "默认"
 setting_RICE_yarsani_emergence_default_desc:0 "雅赛尼派[faith|E]会在游戏开始半个世纪后随机出现，但更有可能在13世纪中期以后出现。"
 setting_RICE_yarsani_emergence_historical:0 "#high 史实#!"
 setting_RICE_yarsani_emergence_historical_desc:0 "雅赛尼派[faith|E]只有在 14世纪中叶后才会随机出现。"
 setting_RICE_yarsani_emergence_unrestricted:0 "#high 无限制#!"
 setting_RICE_yarsani_emergence_unrestricted_desc:0 "雅赛尼派[faith|E]可以随时出现"
 rule_RICE_afro_roman_counties:0 "RICE$african_roman$出现"
 setting_RICE_afro_roman_counties_default:0 "默认"
 setting_RICE_afro_roman_counties_default_desc:0 "在原版启动日期中，北非没有$african_roman$和$catholic_adj$的[counties|E]。其他添加了它们的mod会覆盖这一点。"
 setting_RICE_afro_roman_counties_reduced:0 "#high 半史实#!"
 setting_RICE_afro_roman_counties_reduced_desc:0 "在原版启动日期中，北非有一些$african_roman$和$catholic_adj$的[counties|E]，它们在这些地区顽强得生存了下来。其他添加了它们的mod会覆盖这一点。"
 setting_RICE_afro_roman_counties_extensive:0 "#high 夸张的#!"
 setting_RICE_afro_roman_counties_extensive_desc:0 "在原版启动日期中，北非有很多$african_roman$和$catholic_adj$的[counties|E]，比现实生活中的数量要多得多。其他添加了它们的mod会覆盖这一点。"
 RICE_not_tribal_government_req:0 "你的[government|E]不是[GetGovernment( 'tribal_government' ).GetName]"
 rule_RICE_easter_egg_characters:0 "RICE彩蛋角色"
 setting_RICE_easter_egg_characters_default:0 "默认"
 setting_RICE_easter_egg_characters_default_desc:0 "RICE彩蛋角色将在游戏开始时正常出现。"
 setting_RICE_easter_egg_characters_removed:0 "#high 禁用#!"
 setting_RICE_easter_egg_characters_removed_desc:0 "RICE彩蛋角色在游戏开始时将不会出现。"
 rule_RICE_warning_events:0 "RICE警告事件"
 setting_RICE_warning_events_default:0 "启用"
 setting_RICE_warning_events_default_desc:0 "当检测到问题时，游戏开始时会显示警告，提示加载顺序不正确或可能导致游戏异常行为。这些提示只会在检测到问题时出现，不会反复显示。"
 setting_RICE_warning_events_removed:0 "#high 关闭#!"
 setting_RICE_warning_events_removed_desc:0 "游戏开始不会出现警告事件。#warning @warning_icon!除非你对自己的操作非常确定，否则强烈建议不要这样做，以免错过警告事件！#!"
 RICE_local_pilgrimage_votive_offering_type:0 "祭品"
 RICE_local_pilgrimage_votive_offering_type_small:0 "基本祭品"
 RICE_local_pilgrimage_votive_offering_type_small_desc:0 "$EFFECT_LIST_BULLET$[activity|E]完成后获得的基础[piety_i|E]为#V 50#!。\n\n#weak 朝圣归来后，向[GetPlayer.GetFaith.PantheonTerm]献上祭品乃延续传统的良策。#!"
 RICE_local_pilgrimage_votive_offering_type_medium:0 "宏大祭品"
 RICE_local_pilgrimage_votive_offering_type_medium_desc:0 "$EFFECT_LIST_BULLET$[activity|E]完成后获得的基础[piety_i|E]为#V 100#!。\n\n#weak 即便是规模较小的朝圣，也须以丰厚的祭品虔诚尊奉[GetPlayer.GetFaith.PantheonTerm]。#!"
 RICE_local_pilgrimage_votive_offering_type_large:0 "小规模[GetPlayer.GetFaith.HouseOfWorship|U]土地捐赠"
 RICE_local_pilgrimage_votive_offering_type_large_desc:0 "$EFFECT_LIST_BULLET$[activity|E]完成后获得的基础[piety_i|E]为#V 200#!。\n$EFFECT_LIST_BULLET$[activity|E]完成后[capital|E]的[development_i|E][development|E]#P 增加#!#V [EmptyScope.ScriptValue('minor_development_progress_gain')]#!\n\n#weak 在朝圣途中，明智的统治者会将土地捐赠给教会，以示虔诚，并彰显[GetPlayer.GetFaith.PantheonTerm]的荣光。#!"
 RICE_local_veneration_option:0 "尊奉当地祭坛"
 RICE_local_veneration_option_desc:0 "在旅途中，你可能会路过一些受到当地[GetPlayer.GetFaith.GetReligion.GetAdjective]圣徒或其他神圣存在庇佑的地方，每当遇到他们时，切记要表达敬意。"
