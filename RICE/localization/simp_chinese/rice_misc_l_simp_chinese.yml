 game_concept_hot_springs:0 "温泉"
 game_concept_hot_spring:0 "温泉"
 game_concept_hot_springs_desc:0 "[GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName]是[rulers|E]可以使用的一种[activity|E]类型，是一种减轻[stress|E]的方式。它有两个[activity_options|E]：高调之旅和私密之行\n\n在地图的各个地方都有一些#bold 独特的#!温泉，例如锡瓦的太阳之泉。如果你[realm|E]的这些地方，你可以前往[travel|E]去独特的温泉，从而获得额外的奖励，如[character_modifiers|E]。"
 game_concept_local_pilgrimage_short:0 "朝圣"
 game_concept_local_pilgrimages_short:0 "朝圣"
 game_concept_local_pilgrimage:0 "本地朝圣"
 game_concept_local_pilgrimages:0 "本地朝圣"
 game_concept_local_pilgrimage_desc:0 "$game_concept_local_pilgrimages$是[rulers|E]或居住在某些圣地附近的人可以参加的[activities|E]。这些朝圣活动有别于前往个人[faith|E][holy_sites|E]的大型[pilgrimages|E]行为，因为本地朝圣的范围和影响要小得多。\n\n不是每个人都有机会参加本地朝圣。此外，即使[ruler|E]身处正确的位置，也只有在做出某些[decisions|E]或发生某些事件时，才会有本地朝圣的触发。本地朝圣有时也与进一步的特殊[decisions|E]相联系，这些决议可能会增加朝圣的收益，或者增加朝圣者的地理范围。\n\n尽管提供的好处比普通的[pilgrimages|E]要少，但本地朝圣往往能提供独特的收益，比如根据具体的目的地，提供特殊的[character_modifiers|E]。此外，它们也是获得[GetTrait('pilgrim').GetName( GetNullCharacter )][trait_level_track_xp|E]的好方法，尽管速度比正常[pilgrimages|E]慢，但可以为更宏大的[pilgrimage|E]做准备。"
