l_simp_chinese:
 rule_RICE_intro_event:0 "区域沉浸与文化丰富（简称RICE）介绍"
 setting_RICE_intro_event_on:0 "启用"
 setting_RICE_intro_event_on_desc:0 "当你加载到游戏中时，一个介绍事件会触发一次，告诉你你正在使用的RICE的版本和它的最新功能。它有助于验证mod是否正确安装并使用最新的版本。"
 setting_RICE_intro_event_off:0 "关闭"
 setting_RICE_intro_event_off_desc:0 "介绍事件将被禁用。"
 RICEintro.0000.t:0 "RICE 1.19.2 ”安达卢斯”"
 RICEintro.0000.desc:0 "区域沉浸与文化丰富（RICE）1.19.2版本已成功安装。此事件只在游戏开始时触发，可通过游戏规则禁用它。请注意，某些最新添加的功能需要开新档，bug问题请前往原作者页面反馈。RICE目前已有#V 44#!个风味包，涵盖了世界各地不同的文化、宗教和地区。\n\n最新风味包为#Bold 『大洋洲：最终边疆』#!，聚焦于地图最东部靠近[GetGeographicalRegion('RICE_papuan_region').GetName]地区，往期风味包和本期风味包详情请看汉化页面介绍。\n\n#Bold 【感谢众多汉化苦工一起劳作，感谢Juijote的先决汉化包、#Y 奶皇的超强汉化#!、感谢xizhigaofeng、YoungのFish、JamieLann1(带唐明皇)、Aurora600(今天常白背英语了吗)、Warsawka、Nagabhata(Nagabhata)、Minstrel373(哒萌嘟诗)、Luke‑the‑paradoxical、上轸明、小鹿和我玩、Andraste、nicocorey(Ford)、伊恩、AZ_none(无壹)、yang‑zixuan、Priderooster、xza2004(Reki)、刻伊俄奈精灵的汉化助力，如果你希望了解风味包的地区请到牛奶汉化的工坊页面查询】#!"
 RICEintro.0000.a:0 "听起来很不错！"
 RICEintro.0000.b:0 "我想了解一下这次更新新增的内容。（请看牛奶汉化mod页面的简介）"
 RICEintro.0000.c:0 "不再提示此信息。"
 RICEintro.0000.c.tooltip:0 "#EMP 要注意如果你选择了这个选项，你将不会收到这个信息来验证这个文件是否成功更新！#!"
 RICEintro_intro_tooltip:0 "#EMP “安达卢斯的人民啊！\n真主赐予了你们甘霖、河流与林木！\n天堂花园又能在何处寻？”\n——伊本·哈贾法，安达卢斯诗人（1058–1138/9）#!"
 RICEintro.0010.t:0 "风味包信息"
 RICEintro.0010.desc:0 "你想了解哪种风味包？"
 RICEintro.0010.next:0 "查看更多"
 RICEintro.0010.done:0 "不在意，我想继续游戏"
 RICEintro.0010.siwa:0 "锡瓦：西部沙漠绿洲"
 RICEintro.0010.chios:0 " 希俄斯：乳香之岛"
 RICEintro.info.a:0 "听起来不错，那我们就开始游戏吧。"
 RICEintro.info.b:0 "返回菜单查看另一种风味事件"
 RICEintro.0020.t:0 "锡瓦：西部沙漠绿洲"
 RICEintro.0020.desc:0 "‑ 重建阿蒙神谕所和希比斯神庙，之后分别寻求神谕的指引或祭祀西沙漠的地方神灵。\n‑ 参观锡瓦的太阳之泉，放松心情。"
 RICEintro.0021.t:0 " 希俄斯：乳香之岛"
 RICEintro.0021.desc:0 "＊参加蒂米亚纳狂欢节（每年春天举行的狂欢节庆祝活动）。\n＊通过改善当地经济或基础设施的决定，在 希俄斯建设乳香村。\n＊为荷马竖立一座纪念碑，据说荷马的故乡就在 希俄斯。\n＊利用在希俄斯的新乳香建筑的优势。"
 RICEintro.0010.siberia:0 "西伯利亚：驯鹿人"
 RICEintro.0022.t:0 "西伯利亚：驯鹿人"
 RICEintro.0022.desc:0 "‑ 图鲁米克统治者可以通过牺牲驯鹿来获得对自身和宇宙的更多理解\n‑ 北方统治者可以在针叶林区扩大驯鹿牧群\n‑ 西伯利亚文化组:  鄂温克、尼夫赫、雅库特、叶尼塞和尤卡吉尔的流浪者偶尔会在北方统治者的宫廷中，以教授廷臣新的生存技能。"
 rule_RICE_historical_context:0 "RICE历史背景提示"
 setting_RICE_historical_context_on:0 "启用"
 setting_RICE_historical_context_on_desc:0 "游戏中会偶尔出现提示信息，为RICE的各种风味提供背景说明。由于我有时会为了风味和游戏性而对历史进行艺术加工，这些提示也会对此类情况作出解释。"
 setting_RICE_historical_context_off:0 "#high 关闭#!"
 setting_RICE_historical_context_off_desc:0 "偶尔出现的、为RICE某些方面提供历史背景的工具提示将不再显示。这是为那些觉得这些历史背景提示会破坏沉浸感的纯粹主义者准备的。"
 rule_RICE_music:0 "RICE音乐"
 setting_RICE_music_off:0 "#high 关闭#!"
 setting_RICE_music_off_desc:0 "由RICE添加的音乐曲目将无法播放。"
 setting_RICE_music_default:0 "默认"
 setting_RICE_music_default_desc:0 "由RICE添加的音乐曲目只有在你在适当的地区进行游戏，或扮演正确的文化或宗教时才会播放。"
 setting_RICE_music_unrestricted:0 "#high 无限制#!"
 setting_RICE_music_unrestricted_desc:0 "由RICE添加的音乐曲目将播放，而不考虑你的地区、文化或宗教。"
 setting_RICE_music_no_vocal_music:0 "#high 不需要音乐#!"
 setting_RICE_music_no_vocal_music_desc:0 "唱歌的音乐将被禁用，环境音乐，器乐仍然会播放。"
 rule_RICE_new_characters:0 "开启RICE的风味活动"
 setting_RICE_new_characters_off:0 "#high 关闭#!"
 setting_RICE_new_characters_off_desc:0 "RICE的风味活动不会生效，#emp 除了#!有特殊效果的事件。"
 setting_RICE_new_characters_default:0 "默认"
 setting_RICE_new_characters_default_desc:0 "RICE可以在游戏开始时根据位置或角色触发事件，以提供关于当前情况的信息。"
 rule_RICE_event_frequency:0 "RICE事件的频率"
 setting_RICE_event_frequency_default:0 "默认"
 setting_RICE_event_frequency_default_desc:0 "RICE的通用风味事件按默认的比例触发。"
 setting_RICE_event_frequency_high:0 "#high 高#!"
 setting_RICE_event_frequency_high_desc:0 "RICE的通用风味事件触发得更频繁。警告：由于RNG的工作方式，你仍然可能一次看到许多事件，或长时间没有事件。"
 setting_RICE_event_frequency_very_high:0 "#high 极高#!"
 setting_RICE_event_frequency_very_high_desc:0 "RICE的通用风味事件触发得更频繁。这可能会导致垃圾事件频繁出现！警告：由于RNG的工作方式，你仍然可能一次看到许多事件，或长时间没有事件。"
 setting_RICE_event_frequency_low:0 "#high 低#!"
 setting_RICE_event_frequency_low_desc:0 "RICE的通用风味事件触发的频率较低。警告：由于RNG的工作方式，你仍然可能一次看到许多事件，或长时间没有事件。"
 setting_RICE_event_frequency_very_low:0 "#high 极低#!"
 setting_RICE_event_frequency_very_low_desc:0 "RICE的通用风味事件的触发频率要低得多。你可能很少看到事件！警告：由于RNG的工作方式，你仍然可能一次看到许多事件，或长时间没有事件。"
 RICE_baklava_test_name:0 "神圣的一片果仁蜜饼"
 RICE_baklava_test_desc:0 "通常情况下，果仁蜜饼应该被吃掉。这块果仁蜜饼应该被崇拜，因为果仁蜜饼是神圣的，果仁蜜饼是阿耳法和敖默加，而这是果仁蜜饼中的果仁蜜饼，果仁蜜饼中的万王之王。"
 RICEintro.8888.t:0 "甜品中的万王之王"
 RICEintro.8888.desc:0 "[ROOT.Char.GetFaith.GetName][ROOT.Char.GetCulture.GetName]人！"
 RICEintro.8888.a:0 "多么讽刺的是，我可以崇拜这块果仁蜜饼，但却不吃它……"
 RICE_misc_myra_santa_claus:0 "圣尼古拉的土地"
 RICE_misc_myra_santa_claus_desc:0 "圣尼古拉因其慈善、虔诚和对尼西亚东正教的捍卫而闻名，他出生在迈拉，后来在公元4世纪成为迈拉的主教。迈拉的一座教堂里有圣人的坟墓，他经常受到当地人的敬仰。"
