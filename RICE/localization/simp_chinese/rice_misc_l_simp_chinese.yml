 RICEintro.0030.t:0 "@warning_icon!检测到不恰当加载顺序"
 RICEintro.0030.desc:0 "检测到已在运行的Rajas of Asia与RICE的加载顺序有误。\n\n此消息仅会在游戏开始时出现，因此未来的类似问题将不会被检测到。请注意，检测系统并不完善，可能会误报。\n\n#bold #warning @warning_icon!确保Rajas of Asia排在RICE#underline 下面#!。你需要另开新档。#!#!"
 RICEintro.0030.a:0 "好的"
 RICEintro.0031.t:0 "@warning_icon!检测到不恰当加载顺序"
 RICEintro.0031.desc:0 "检测到已在运行的雄鹰陨落与RICE的加载顺序有误。\n\n此消息仅会在游戏开始时出现，因此未来的类似问题将不会被检测到。请注意，检测系统并不完善，可能会误报。\n\n#bold #warning @warning_icon!确保雄鹰陨落排在RICE#underline 下面#!。你需要另开新档。#!#!"
 RICEintro.0031.a:0 "好的"
 RICEintro.0032.t:0 "@alert_icon!万民之母成就"
 RICEintro.0032.desc:0 "温馨提醒，RICE新增的非洲原始信仰，例如[ROOT.Char.GetFaith.GetReligion.GetAdjective][faith|E][ROOT.Char.GetFaith.GetName]，将#warning 不会#!计入#bold 万民之母#!成就。只有原版的非洲原始[faiths|E]会被计入。请注意，其他模组可能会对此进行修改。\n\n此消息并非重要警告，而是为了避免未来产生混淆的温馨提醒。"
 RICEintro.0032.a:0 "好的"
