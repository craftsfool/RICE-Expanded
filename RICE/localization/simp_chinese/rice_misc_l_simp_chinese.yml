 activity_RICE_local_pilgrimage:0 "本地朝圣"
 activity_RICE_local_pilgrimage_desc:0 "世界上有很多地方本土圣地。这些地方往往不像[faithpossessive|E]的主要[holy_sites|E]那样突出，因此不常成为长途[pilgrimages|E]的目标，但它们仍然吸引着周围地区的信徒。"
 activity_RICE_local_pilgrimage_selection_tooltip:0 "前往[local_pilgrimage|E]\n\n$activity_RICE_local_pilgrimage_context_tooltip$"
 activity_RICE_local_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!虽然朝圣常常让人联想到前往麦加、耶路撒冷、圣地亚哥和菩提伽耶等著名地点的盛大旅行，但前往当地、区域目的地的朝圣在过去和现在也很常见。其中一些朝圣地成为新的朝拜中心。它们往往与当地的传说和文化有关，而且，在旅行困难的古代，去这些地方旅行往往更实用。"
 activity_RICE_local_pilgrimage_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$[GetTrait('pilgrim').GetName( GetNullCharacter )][trait|E]/[GetTrait('pilgrim').GetName( GetNullCharacter )][trait_level_track_xp|E]"
 activity_RICE_local_pilgrimage_guest_desc:0 "$activity_RICE_local_pilgrimage_host_desc$"
 activity_RICE_local_pilgrimage_province_desc:0 ""
 activity_RICE_local_pilgrimage_destination_selection:0 "$activity_RICE_local_pilgrimage_province_desc$"
 activity_RICE_local_pilgrimage_guest_help_text:0 "$activity_RICE_local_pilgrimage$"
 activity_RICE_local_pilgrimage_predicted_cost:0 "[local_pilgrimage|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_local_pilgrimage_conclusion_desc:0 "[GetActivityType( 'activity_RICE_local_pilgrimage' ).GetName]已经结束了，这是一次伟大的精神洗礼！"
 RICE_local_pilgrimage_type:0 "朝圣类型"
 RICE_local_pilgrimage_type_devotion:0 "奉献之行"
 RICE_local_pilgrimage_type_devotion_desc:0 "\n$EFFECT_LIST_BULLET$在其他[piety|E]收益上额外获得#V 100#![piety_i|E]\n$EFFECT_LIST_BULLET$与其他选项相比，[GetTrait('pilgrim').GetName( GetNullCharacter )][trait|E]获得双倍的[trait_level_track_xp|E]，如果尚未获得该[trait|E]，则额外获得初始[trait_level_track_xp|E]。\n\n#weak 虽然我们不一定是去一个重要的圣地旅行，但我们仍然是在朝圣，心之所向，诚之所至。#!"
 RICE_local_pilgrimage_type_observance:0 "民俗之途"
 RICE_local_pilgrimage_type_observance_desc:0 "\n$EFFECT_LIST_BULLET$在其他[prestige|E]收益上额外获得#V 100#![prestige_i|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_misc_engaged_with_local_religious_practices').GetNameWithTooltip][character_modifier|E]\n\n#weak 通过依照当地习俗，尊重[GetPlayer.GetFaith.PantheonTerm]，你可以证明不管如何皆是你的子民。#!"
 RICE_local_pilgrimage_type_vacation:0 "精神之旅"
 RICE_local_pilgrimage_type_vacation_desc:0 "\n$EFFECT_LIST_BULLET$与其他选项相比，失去更多的[stress_loss_i|E][stress|E]。\n\n#weak 宗教经历和精神之旅可以抚慰身体与精神，并使人更接近[GetPlayer.GetFaith.PantheonTerm]。#!"
 RICE_local_pilgrimage_pilgrimage_phase:0 "$pilgrimage_phase_solo$"
 RICE_local_pilgrimage_pilgrimage_phase_desc:0 "$pilgrimage_phase_solo_desc$"
 RICE_local_pilgrimage_worship_intent_header:0 "朝拜："
 RICE_local_pilgrimage_worship_intent:0 "朝拜"
 RICE_local_pilgrimage_worship_intent_desc:0 "你希望专注于[local_pilgrimage|E]的宗教方面。此选项在其他收益的基础上，获得更多的[piety_i|E][piety|E]。如果你拥有[GetTrait('zealous').GetName( GetNullCharacter )]或[GetTrait('calm').GetName( GetNullCharacter )]，会失去额外的[stress_loss_i|E][stress|E]。"
 RICE_local_pilgrimage_model_intent_header:0 "范世："
 RICE_local_pilgrimage_model_intent:0 "范世"
 RICE_local_pilgrimage_model_intent_desc:0 "你将以身作则，向该地区所有[GetPlayer.GetFaith.GetAdherentNamePlural]进行这次[local_pilgrimage|E]。此选项在其他收益的基础上，获得更多的[prestige_i|E][prestige|E]。如果你拥有[GetTrait('ambitious').GetName( GetNullCharacter )]或[GetTrait('diligent').GetName( GetNullCharacter )]，会失去额外的[stress_loss_i|E][stress|E]。"
 RICE_local_pilgrimage_curiosity_intent_header:0 "视察："
 RICE_local_pilgrimage_curiosity_intent:0 "视察"
 RICE_local_pilgrimage_curiosity_intent_desc:0 "你想更好地了解当地居民，和他们的问题，以及他们如何践行[GetPlayer.GetFaith.GetName]，同时去参加[local_pilgrimage|E]，此选项会在你选择的[lifestyle|E]中获得[experience|E]。如果你拥有[GetTrait('humble').GetName( GetNullCharacter )]或[GetTrait('just').GetName( GetNullCharacter )]，会失去额外的[stress_loss_i|E][stress|E]。"
 RICE_local_pilgrimage_completed_log_title:0 "本地朝圣完成"
 RICE_local_pilgrimage_completed_log:0 "[CHARACTER.GetShortUIName|U]完成了[CHARACTER.GetHerHis]在[PROVINCE.GetBaronyNameExplicitly]的[local_pilgrimage|E]"
