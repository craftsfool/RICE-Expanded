 activity_RICE_mordvin_ine_ozks:0 "奥兹克庆典"
 activity_RICE_mordvin_ine_ozks_desc:0 "现在是时候让我们作为一个民族聚集在一起进行一次一次盛大的庆祝和祈祷，以纪念我们的先祖和诸神，这将是超越我们通常举行的#italic 奥兹克庆典#!！"
 activity_RICE_mordvin_ine_ozks_selection_tooltip:0 "组织奥兹克庆典\n\n$RICE_mordvin_major_ozks_festival_context_tooltip$"
 activity_RICE_mordvin_ine_ozks_host_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$获得[GetModifier('RICE_mordvin_recently_celebrated_ine_ozks').GetNameWithTooltip][character_modifier|E]\n$BULLET_WITH_TAB$举行[activity|E]的[county|E]信仰[GetPlayer.GetFaith.GetReligion.GetName]那么将额外获得[GetModifier('RICE_mordvin_ine_ozks_recently_held').GetNameWithTooltip][county_modifier|E]"
 activity_RICE_mordvin_ine_ozks_guest_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]"
 activity_RICE_mordvin_ine_ozks_province_desc:0 ""
 activity_RICE_mordvin_ine_ozks_destination_selection:0 "$activity_RICE_mordvin_ine_ozks_province_desc$"
 activity_RICE_mordvin_ine_ozks_guest_help_text:0 "$activity_RICE_mordvin_ine_ozks$"
 activity_RICE_mordvin_ine_ozks_predicted_cost:0 "旅行的费用主要取决于你的[income|E]。"
 activity_RICE_mordvin_ine_ozks_conclusion_desc:0 "[GetActivityType( 'activity_RICE_mordvin_ine_ozks' ).GetName]已经结束了，多么光荣且壮观的活动啊!"
 RICE_mordvin_ine_ozks_prayer_phase:0 "祈祷"
 RICE_mordvin_ine_ozks_prayer_phase_desc:0 "周围地区的人聚集在一起，参加共同的祈祷活动。"
 RICE_mordvin_ine_ozks_pious_intent_header:0 "虔诚："
 RICE_mordvin_ine_ozks_pious_intent:0 "虔诚"
 RICE_mordvin_ine_ozks_pious_intent_desc:0 "你怀着虔诚之心参与宗教仪式。你在[activity|E]结束时获得的[modifiers|E]持续时间延长为常规的两倍时间。如果你拥有[GetTrait('zealous').GetName( GetNullCharacter )]特质，你会失去[stress_loss_i|E][stress|E]，但如果你拥有[GetTrait('cynical').GetName( GetNullCharacter )]特质，你会获得[stress_gain_i|E][stress|E]。"
 RICE_mordvin_ine_ozks_community_intent_header:0 "交际："
 RICE_mordvin_ine_ozks_community_intent:0 "交际"
 RICE_mordvin_ine_ozks_community_intent_desc:0 "你希望与他人交往。在这个[activity|E]结束时，在你已经获得的其他[prestige|E]的基础上，额外获[prestige_i|E]#V 100#!，如果你拥有[GetTrait('gregarious').GetName( GetNullCharacter )]特质，你会失去[stress_loss_i|E][stress|E]，但如果你拥有[GetTrait('shy').GetName( GetNullCharacter )]特质，你会获得[stress_gain_i|E][stress|E]。"
 RICE_mordvin_ine_ozks_enjoyment_intent_header:0 "享乐："
 RICE_mordvin_ine_ozks_enjoyment_intent:0 "享乐"
 RICE_mordvin_ine_ozks_enjoyment_intent_desc:0 "这可能是一个重要的场合，但这并不意味着你不能放松和享受！你会失去[stress_loss_i|E][stress|E]，如果你拥有[GetTrait('lazy').GetName( GetNullCharacter )]、[GetTrait('content').GetName( GetNullCharacter )]或[GetTrait('gluttonous').GetName( GetNullCharacter )]，则会失去更多。"
 RICE_mordvin_ine_ozks_completed_log_title:0 "参加完奥兹克庆典"
 RICE_mordvin_ine_ozks_completed_log:0 "[CHARACTER.GetShortUIName|U][CHARACTER.GetHerHis]参加完奥兹克庆典"
 RICE_mordvin_ine_ozks_same_religion:0 "\n#P ++该[county|E]遵循[GetPlayer.GetFaith.GetReligion.GetAdjective][religion|E]"
