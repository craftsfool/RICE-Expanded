 activity_RICE_mordvin_horse_sacrifice:0 "马祭"
 activity_RICE_mordvin_horse_sacrifice_desc:0 "自古以来，我们[faith|E]就有向神灵和祖先献上宝马的习俗。"
 activity_RICE_mordvin_horse_sacrifice_selection_tooltip:0 "$RICE_misc_sacrifice_horses_effect_tooltip_1$\n\n$RICE_misc_sacrifice_horses_context_tooltip$"
 activity_RICE_mordvin_horse_sacrifice_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i][prestige|E]\n$BULLET_WITH_TAB$#P 有概率获得#![character_modifiers|E]"
 activity_RICE_mordvin_horse_sacrifice_guest_desc:0 "获得[piety_i][piety|E]"
 activity_RICE_mordvin_horse_sacrifice_province_desc:0 "寻找合适的马祭场所！"
 activity_RICE_mordvin_horse_sacrifice_destination_selection:0 "$activity_RICE_mordvin_horse_sacrifice_province_desc$"
 activity_RICE_mordvin_horse_sacrifice_guest_help_text:0 "$activity_RICE_mordvin_horse_sacrifice$"
 activity_RICE_mordvin_horse_sacrifice_predicted_cost:0 "马祭的成本取决于你选择的[activity_options|E]。"
 activity_RICE_mordvin_horse_sacrifice_conclusion_desc:0 "[GetActivityType( 'activity_RICE_mordvin_horse_sacrifice' ).GetName]已结束。愿[GetPlayer.GetFaith.PantheonTerm]对这一祭品感到满意！"
 RICE_horse_sacrifice_number_of_horses_type:0 "献祭规模"
 RICE_horse_sacrifice_number_of_horses_type_small:0 "小"
 RICE_horse_sacrifice_number_of_horses_type_small_desc:0 "献祭越多，奖励越多\n\n#weak 将为寻找合适的马匹进行献祭#!"
 RICE_horse_sacrifice_number_of_horses_type_medium:0 "中等"
 RICE_horse_sacrifice_number_of_horses_type_medium_desc:0 "献祭越多，奖励越多\n\n#weak 向[GetPlayer.GetFaith.PantheonTerm]献祭适当数量的马匹，这样他们肯定会满意。#!"
 RICE_horse_sacrifice_number_of_horses_type_large:0 "大"
 RICE_horse_sacrifice_number_of_horses_type_large_desc:0 "献祭越多，奖励越多\n\n#weak [GetPlayer.GetFaith.PantheonTerm]应该获一场盛大的马祭！#!"
 RICE_mordvin_horse_sacrifice_phase:0 "仪式 "
 RICE_mordvin_horse_sacrifice_phase_desc:0 "我们的马匹将以符合我们传统的方式献给上天，这样我们可以得到赐福。"
 RICE_mordvin_horse_sacrifice_sacrifice_intent_header:0 "祭典："
 RICE_mordvin_horse_sacrifice_sacrifice_intent:0 "祭典"
 RICE_mordvin_horse_sacrifice_sacrifice_intent_desc:0 "你将参加马祭的各种仪式。"
 RICE_mordvin_horse_sacrifice_completed_log_title:0 "马祭完成"
 RICE_mordvin_horse_sacrifice_completed_log:0 "[CHARACTER.GetShortUIName|U]完成了[CHARACTER.GetHerHis]的马祭"
 RICE_horse_sacrifice_number_of_horses_amount:0 "将要献祭的马匹数量"
