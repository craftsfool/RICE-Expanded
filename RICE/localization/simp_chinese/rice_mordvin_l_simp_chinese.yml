 mordvin.0010.t:0 "准备马祭"
 mordvin.0010.desc.intro:0 "自人们有记忆以来，马祭一直是[host.GetFaith.GetAdherentNamePlural]一项重要宗教活动，原来纪[host.GetFaith.PantheonTerm]"
 mordvin.0010.desc.minor:0 "命令在[location.GetName]举行一场小型马祭"
 mordvin.0010.desc.major:0 "命令[location.GetName]举行一场大型马祭"
 mordvin.0010.desc.great:0 "命令在[location.GetName]举行一场奢华的马祭"
 mordvin.0010.desc.conclusion:0 "当地的[host.Custom('DefaultPriestTitlePlural')]已经为祭典准备所需的工作了。\n\n每个人都希望[host.GetFaith.PantheonTerm]会因为这个祭典而感到高兴，并以此赐福此地。"
 mordvin.0010.a:0 "祭典之时已至！"
 mordvin.0011.t:0 "马祭"
 mordvin.0011.desc:0 "马祭的日子已经到来，而我早早到了一个[host.GetFaith.HouseOfWorship]，里面聚集了一些[host.Custom('DefaultPriestTitlePlural')]的人。他们准备了一个祭坛，马匹将在[host.GetFaith.GetAdjective]仪式中被献祭。\n\n现在马匹被牵到祭坛上，在那里被[host.Custom('DefaultPriestTitlePlural')]安静地杀死。在此过程中，我们都向[host.GetFaith.PantheonTerm]祈祷。\n\n仪式完成后，我们感谢[host.Custom('DefaultPriestTitlePlural')]帮助我们完成这样一个重要的仪式。希望[host.GetFaith.PantheonTerm]注意到了我们的祭品！"
 mordvin.0011.a:0 "我很高兴参与其中"
