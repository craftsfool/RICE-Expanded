 mordvin.0030.t:0 "准备奥兹克庆典"
 mordvin.0030.desc:0 "对于我们[ROOT.Char.GetFaith.GetAdherentNamePlural]来说，#italic 奥兹克庆典#!是日常一部分。然而在一些重要的场合，社区可能会聚在一起举办盛大的活动，为纪念[ROOT.Char.GetFaith.PantheonTerm]和祖先而举行奢华的仪式，并为人们提供许多机会相互交往和休息。\n\n我已经下令让[capital_province.GetName]的每个人都为这样一个#italic 大奥兹克庆典（大祈祷）#!。目前[ROOT.Char.Custom('DefaultPriestTitlePlural')]已经和社区的其他成员一起，正在为这个活动做准备。"
 mordvin.0030.a:0 "这将是一个伟大且重要的时刻!"
 mordvin.0031.t:0 "奥兹克庆典开始"
 mordvin.0031.desc:0 "#italic 大奥兹克（大祈祷）#!的日子即将到来！我和[ROOT.Char.Custom('DefaultPriestTitlePlural')]以及当地知名人士为这一天的到来出了很多力。\n\n人们从[capital_province.GetName]附近的城镇和村庄聚集过来，我们邀请已故祖先的灵魂加入我们！现在开始庆祝活动！每个人都从自己的家乡带来了一把泥土，这些泥土都被放在一个古老的土丘上，作为祈祷的中心场所。随着奥兹克的举行，这个土丘多年来一直在增高。\n\n在这之后，一个#italic shtatol（一个用蜂蜡制成的巨大蜡烛）#!，被竖立在土丘的中心。然后[ROOT.Char.Custom('DefaultPriestTitlePlural')]点燃蜡烛，随后我们用一些动物献祭，以赢得[ROOT.Char.GetFaith.PantheonTerm]的青睐，尤其是一头公牛，其肉随后将被煮给大家食用。"
 mordvin.0031.a:0 "我们希望我们的祈祷能得到回应！"
 mordvin.0032.t:0 "奥兹克庆典结束"
 mordvin.0032.desc:0 "多么美妙的一个#italic 奥兹克庆典#!！\n\n庆典很快就会结束，每个人都会回家，而且精神上也满足，彼此和[ROOT.Char.GetFaith.PantheonTerm]有了更多联系。不管怎么说，我很高兴看到这么多人参加！"
 mordvin.0032.a:0 "我们应该尽快再组织一次！"
 mordvin.0033.t:0 "我们的先祖"
 mordvin.0033.desc:0 "作为这个奥兹克庆典仪式的一部分，我们必须向我们的祖先表示敬意。庆典开始时，我们邀请祖先之灵加入，但同样重要的是，随着庆典的继续，我觉得现在我和祖先之间的关系似乎比奥兹克庆典开始之前更密切了。"
 mordvin.0033.a:0 "毕竟我们的祖先为了我们做出如此多贡献"
 mordvin.0034.t:0 "家庭时光"
 mordvin.0034.desc:0 "大奥兹克庆典是家庭和亲戚们互相见面和加强我们家庭纽带的一个好机会。因此我把奥兹克庆典视为与我的亲密家人相处的机会。"
 mordvin.0034.a:0 "毕竟没有对方，我们什么都不是。"
 mordvin.0035.t:0 "丰收祷告"
 mordvin.0035.desc:0 "作为本次奥兹克庆典的一部分，我们正在向[ROOT.Char.GetFaith.FertilityGodName]进行祈求，希望下一个收获是好的，希望[ROOT.Char.GetFaith.FertilityGodSheHe|U]能在这次奥兹克期间听到我们的祈祷，并赐予我们祝福。"
 mordvin.0035.a:0 "希望我们的祈祷能被听到吧！"
 mordvin.0035.toast:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')]说下一个收成会不错！"
 mordvin.0036.t:0 "神佑"
 mordvin.0036.desc:0 "作为奥兹克庆典的一部分，我们正向[ROOT.Char.GetFaith.HighGodName]进行祈祷，请求[ROOT.Char.GetFaith.HighGodNameSheHe|U]保护我们和土地免受任何敌人的入侵。祈祷是严肃且持续的，因为我们恳求[ROOT.Char.GetFaith.HighGodNameSheHe|U]听到我们的祈祷，虽然我们能够也会保卫我们的家园，但有了神的帮助，就会容易得多！"
 mordvin.0036.a:0 "我们部族将经久不衰"
 mordvin.0036.toast:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')]说[ROOT.Char.GetFaith.HighGodName]会保佑我们！"
 mordvin.0037.t:0 "解决问题"
 mordvin.0037.desc:0 "奥兹克庆典是人们聚集在一起解决紧急问题的时候，例如彼此之间的冲突或各种当地问题。当我在奥兹克庆典期间遇到各种人时，虽然他们的世俗生活不一定是我所关心的，但我确实从听到这些问题和人们如何努力解决这些问题中学到了不少。"
 mordvin.0037.a:0 "这些措施有些确实眼光独到！"
 mordvin.0038.t:0 "比试"
 mordvin.0038.desc:0 "在奥兹克庆典期间，通常会举行各种比试，从摔跤，到射箭，到跑步，以及许多其他运动，这是一个美妙的时刻。有这么多东西可看，我发现自己有很多乐趣，为竞争对手加油。"
 mordvin.0038.a:0 "每个人都过得很开心。"
 mordvin.0039.t:0 "比试冠军"
 mordvin.0039.desc:0 "比试是奥兹克庆典的一个共同要素。除了娱乐观赏之外，这也是战士们获得大人物青睐的好时候，从射箭到投掷等等。这些比试的获胜者会获得#italic 乌斯曼迪#!的称号，意为指挥官\n\n"
 mordvin.0039.desc.winner_knight:0 "我宫中的一位$knight_culture_player_plural_no_tooltip_lowercase$，[warrior.GetTitledFirstName]，在这些比赛中[warrior.GetHerselfHimself]表现突出，赢得了许多场胜利。因此[warrior.GetSheHe|U]被授予了#italic 乌斯曼迪#!的称号！"
 mordvin.0039.desc.winner_local:0 "我祝贺各种比试的获胜者，他们因而被授予#italic 乌斯曼迪#!的称号！"
 mordvin.0039.a:0 "无论怎样，他们都做得很好"
 mordvin.0040.t:0 "跳舞"
 mordvin.0040.desc:0 "与任何美好的庆典一样，跳舞是奥兹克庆典的一个重要部分。这次参与者聚集在一起跳圆舞曲，正是通过这些活动，我们拉进彼此之间的距离、与祖先以及与[ROOT.Char.GetFaith.PantheonTerm]的关系越来越密切。"
 mordvin.0040.a:0 "真有趣"
 mordvin.0041.t:0 "为家庭祈祷"
 mordvin.0041.desc:0 "在奥兹克庆典期间，我看到一些妇女向[ROOT.Char.GetFaith.HouseholdGodName]祈祷，希望家庭健康和幸福。也行通过在奥兹克庆典期间保持良好的氛围，我们可以吸引神赐，将不幸从我们的家里赶走。"
 mordvin.0041.a:0 "希望她们的祈祷能得到回应。"
 mordvin.0042.t:0 "奥兹克庆典盛宴"
 mordvin.0042.desc:0 "没有宴会的节日是不完整的，盛大的奥茨克节也不例外！ 作为庆典的一部分，盛宴上充满了各种肉类、面包、蔬菜、水果等等。大家一边吃，一边互相交际，其乐融融！"
 mordvin.0042.a:0 "我将专注于吃大餐！"
 mordvin.0042.b:0 "我想和大家一起社交"
 mordvin.0043.t:0 "巨蜂蜜蜡"
 mordvin.0043.desc:0 "根据古老的[ROOT.Char.GetFaith.GetAdjective]习俗，奥兹克庆典的大土丘上竖起的巨大的蜂蜜蜡烛是由所有参与的家庭，从最贫穷到最富有的家庭贡献制作的。\n\n我作为[ROOT.Char.GetTitleAsNameNoTooltip]，显然应该为制作这支蜡烛贡献最大。\n\n不管怎么说，传统的观念是，这支蜡烛越大，我们这个部族就越繁荣和强大。"
 mordvin.0043.a:0 "这象征着我们的团结和力量！"
 mordvin.0044.t:0 "牛肉汤"
 mordvin.0044.desc:0 "奥兹克庆典的开始，就会有一头公牛被献给[ROOT.Char.GetFaith.PantheonTerm]，作为各种传统[ROOT.Char.GetFaith.GetAdjective]仪式的开始。而且公牛象征着长寿和健康。\n\n现在庆典已经开始了，被献祭的公牛已经被特别指定的人剥了皮，然后由被指定的妇女煮熟。通常情况下，公牛的肉与各种蔬菜和草药一起煮成汤，这次也不例外。\n\n我现在正在喝公牛肉汤，我不得不说，它的味道相当美味！"
 mordvin.0044.a:0 "它与面包和蜂蜜也很搭配。"
