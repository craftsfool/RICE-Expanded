 activity_mordvin_ine_ozks:0 "奥兹克庆典"
 activity_mordvin_ine_ozks_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]奥兹克庆典"
 activity_horse_sacrifice:0 "马祭"
 activity_horse_sacrifice_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]马祭"
 RICE_mordvin_major_ozks_festival:0 "组织奥兹克庆典"
 RICE_mordvin_major_ozks_festival_desc:0 "现在是时候让我们作为一个民族聚集在一起进行一次一次盛大的庆祝和祈祷，以此来纪念我们的祖先和[ROOT.Char.GetFaith.PantheonTerm]。盛大的庆祝这将是超越我们一般举行的#italic 奥兹克庆典#!，名为大奥兹克庆典！"
 RICE_mordvin_major_ozks_festival_tooltip:1 "与你的人民一起举办大奥兹克庆典祈祷"
 RICE_mordvin_major_ozks_festival_effect_tooltip_1:1 "你将组织一次大奥兹克庆典，并获得一些加成，如获得[piety|E]、[prestige|E]、正面的[character_modifiers|E]或失去[stress|E]"
 RICE_mordvin_major_ozks_festival_effect_tooltip_2:1 "如果你的[capital|E]是[THIS.Char.GetFaith.GetReligion.GetAdjective][faith|E]，那么它将获得持续#V 五年#!的[GetModifier('RICE_mordvin_ine_ozks_recently_held').GetNameWithTooltip][modifier|E]"
 RICE_mordvin_major_ozks_festival_confirm:0 "准备奥兹克庆典！"
 RICE_mordvin_major_ozks_festival_context_tooltip:0 "#emphasis 历史背景：#!#italic 奥兹克#!（Ozks）是一个用来表示莫尔多瓦人中的一种公共祈祷、礼拜仪式和宗教节日的术语。在现代，最著名的奥兹克是拉斯肯·奥兹克（Rasken Ozks），本风味包描绘就是倾向于它的；拉斯肯·奥兹克（Rasken Ozks）在17世纪被沙皇政府禁止，但在1999年复兴。"
 RICE_misc_sacrifice_horses:0 "准备马祭"
 RICE_misc_sacrifice_horses_desc:0 "自人们有记忆以来，向我们的祖先和[ROOT.Char.GetFaith.PantheonTerm]献上骏马是[ROOT.Char.GetFaith.GetAdjective]信众的习俗。"
 RICE_misc_sacrifice_horses_tooltip:1 "你会献祭一些马匹"
 RICE_misc_sacrifice_horses_effect_tooltip_1:1 "你将献祭一匹马，可能会让你获得各种奖励，如[piety|E]、[prestige|E]和正面的[character_modifiers|E]，具体取决于你愿意献祭多大的数量"
 RICE_misc_sacrifice_horses_confirm:0 "寻找合适的马匹来献祭！"
 RICE_misc_sacrifice_horses_context_tooltip:0 "#emphasis 历史背景：#!马祭是欧亚大陆各地的一种普遍的宗教仪式，从北欧人到蒙古人和莫尔多瓦人，不同民族都有参与。他们通常会把马和死者一起埋葬。在中世纪和近代早期，随着亚伯拉罕诸教和佛教等组织化信仰的传播，这种习俗逐渐衰落。"
 RICE_misc_sacrifice_horses_type:0 "选择献祭多少匹马"
 RICE_misc_sacrifice_horses_type_gui:0 "$RICE_misc_sacrifice_horses_type$"
 RICE_misc_horse_sacrifice_minor_option:0 "#Bold #V 小型献祭仪式#!#!\n$RICE_misc_horse_sacrifice_minor_option_desc$"
 RICE_misc_horse_sacrifice_minor_option_desc:0 "献祭几匹马"
 RICE_misc_horse_sacrifice_minor_option_tooltip:0 "#V #Bold 最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0]#!#!\n\n$EFFECT_LIST_BULLET$获得#V 0#!至#V 50#!的[piety|E]和[prestige|E]\n$EFFECT_LIST_BULLET$获得具有随机次要效果的正面[character_modifier|E]"
 RICE_misc_horse_sacrifice_major_option:0 "#Bold #V 大型献祭仪式#!#!\n$RICE_misc_horse_sacrifice_major_option_desc$"
 RICE_misc_horse_sacrifice_major_option_desc:0 "献祭一定数量的马匹"
 RICE_misc_horse_sacrifice_major_option_tooltip:0 "#V #Bold 最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_major')|0]#!#!\n \n$EFFECT_LIST_BULLET$获得#V 25#!至#V 100#!的[piety|E]和[prestige|E]\n$EFFECT_LIST_BULLET$获得具有随机效果的正面[character_modifier|E]"
 RICE_misc_horse_sacrifice_great_option:0 "#Bold #V 重大献祭仪式#!#!\n$RICE_misc_horse_sacrifice_great_option_desc$"
 RICE_misc_horse_sacrifice_great_option_desc:0 "献祭大量的马"
 RICE_misc_horse_sacrifice_great_option_tooltip:0 "#V #Bold 最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_great')|0]#!#!\n \n$EFFECT_LIST_BULLET$获得#V 50#![piety|E]和#V 200#![prestige|E]\n$EFFECT_LIST_BULLET$获得具有随机效果的正面[character_modifier|E]（BUFF很强）"
 RICE_misc_horse_sacrifice_ai_option:0 "$RICE_north_atlantic_expedition_ai_option$"
 RICE_misc_horse_sacrifice_ai_option_desc:0 "$RICE_north_atlantic_expedition_ai_option_desc$"
 RICE_misc_horse_sacrifice_ai_option_tooltip:0 "$RICE_north_atlantic_expedition_ai_option_tooltip$"
 RICE_mordvin_extract_beekeeper_tribute:0 "从伏尔加养蜂人提取额外贡品"
 RICE_mordvin_extract_beekeeper_tribute_desc:0 "我们王国源自伏尔加河流域，和其他民族一样我们以其养蜂能力而闻名。虽然我们已经以蜂蜜、蜂蜡等蜂产品的形式从各个村庄作为税款来征收，但我们是否可以再征收#italic 更多#!的蜂产品？"
 RICE_mordvin_extract_beekeeper_tribute_tooltip:1 "向当地养蜂人索取额外的[gold|E]作为贡品"
 RICE_mordvin_extract_beekeeper_tribute_effect_tooltip_1:1 "你将获得随机的[gold|E]，介于#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_mordvin_beekeeper_extra_tribute_min_value')]#!直到#bold 最大值#!#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_mordvin_beekeeper_extra_tribute_max_value')]#!"
 RICE_mordvin_extract_beekeeper_tribute_effect_tooltip_2:1 "这一数额取决于你的[stewardship_skill|E]和你的[domain|E]中有多少个[counties|E][culture|E]是拥有$tradition_RICE_volga_apiculture_name$[tradition|E]"
 RICE_mordvin_extract_beekeeper_tribute_confirm:0 "立即通知领地的所有养蜂人！"
 RICE_mordvin_extract_beekeeper_tribute_context_tooltip:0 "#emphasis 历史背景：#!在伏尔加河流域，养蜂业在历史上是一项非常有利可图的产业，特别是对于芬兰‑乌戈尔文化和突厥文化的民族来说，如莫尔文人、切列米斯人、乌德穆尔特人、楚瓦什人、鞑靼人等。例如，著名的10世纪阿拉伯探险家伊本·法德兰就提到了这个地区的蜂蜜交易量有多大。后来在近代早期，沙皇政府会以蜜蜂产品的形式向这些民族征收贡品。"
 RICE_mordvin_any_county_has_volga_apiculture_culture_req:0 "拥有至少一个属于[culture|E]且拥有$tradition_RICE_volga_apiculture_name$[tradition|E]的[county|E]"
 RICE_mordvin_acquire_volga_bee_products:0 "收购伏尔加蜂制品"
 RICE_mordvin_acquire_volga_bee_products_desc:0 "几个世纪以来，养蜂业一直是伏尔加河各民族的支柱产业，[ROOT.Char.GetCulture.GetCollectiveNoun]也不例外，我应该为自己的利益收购伏尔加蜂制品"
 RICE_mordvin_acquire_volga_bee_products_tooltip:1 "你可以为自己购买蜂蜜、蜂蜡，或全都要。"
 RICE_mordvin_acquire_volga_bee_products_effect_tooltip_1:1 "根据购买的选择，你会获得正面的[character_modifier|E]"
 RICE_mordvin_acquire_volga_bee_products_confirm:0 "让我们拜访当地的养蜂人！"
 RICE_mordvin_acquire_volga_bee_products_context_tooltip:0 "$RICE_mordvin_extract_beekeeper_tribute_context_tooltip$"
 RICE_mordvin_acquire_volga_bee_products_type:0 "选择购买哪种蜂制品"
 RICE_mordvin_acquire_volga_bee_products_type_gui:0 "$RICE_mordvin_acquire_volga_bee_products_type$"
 RICE_mordvin_honey_option:0 "#Bold #V 蜂蜜#!#!"
 RICE_mordvin_honey_option_desc:0 "$RICE_mordvin_honey_option$"
 RICE_mordvin_honey_option_tooltip:0 "花费：@gold_icon! #V #Bold [EmptyScope.ScriptValue('RICE_mordvin_honey_cost')|0]#!#!\n\n获得持续十年的[GetModifier('RICE_mordvin_honey').GetNameWithTooltip][modifier|E]"
 RICE_mordvin_beeswax_option:0 "#Bold #V 蜂蜡 #!#!"
 RICE_mordvin_beeswax_option_desc:0 "$RICE_mordvin_beeswax_option$"
 RICE_mordvin_beeswax_option_tooltip:0 "花费：@gold_icon! #V #Bold [EmptyScope.ScriptValue('RICE_mordvin_beeswax_cost')|0]#!#!\n\n获得持续十年的[GetModifier('RICE_mordvin_beeswax').GetNameWithTooltip][modifier|E]"
 RICE_mordvin_honey_and_beeswax_option:0 "#Bold #V 蜂蜜与蜂蜡#!#!"
 RICE_mordvin_honey_and_beeswax_option_desc:0 "$RICE_mordvin_honey_and_beeswax$"
 RICE_mordvin_honey_and_beeswax_option_tooltip:0 "花费：@gold_icon! #V #Bold [EmptyScope.ScriptValue('RICE_mordvin_honey_and_beeswax_cost')|0]#!#!\n\n获得持续十年的[GetModifier('RICE_mordvin_honey_and_beeswax').GetNameWithTooltip][modifier|E]"
