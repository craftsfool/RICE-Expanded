 mordvin.0050.t:0 "圣马"
 mordvin.0050.desc:0 "马被所有虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]信徒所敬重，因为马被认为可以赶走邪恶力量或踢断他们的腿。\n\n像今天这种重要的场合，传统的做法是安排马匹外出骑行。人们相信这将赶走这里的任何邪恶，因为马被认为是在打断任何恶灵的腿。\n\n希望在不久的将来，我的家庭不会受到任何邪灵的影响！"
 mordvin.0050.a:0 "马确实是一种重要且可敬的动物。"
 mordvin.0051.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]婚礼"
 mordvin.0051.desc:0 "昨天，附近有两个年轻人举行婚礼，他们属于[ROOT.Char.GetFaith.GetAdjective]中较小的贵族家庭。作为[ROOT.Char.GetTitleAsNameNoTooltip]，我是在场最尊贵的客人。\n\n今天按照[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]的习俗，我们现在要参加一个#italic 奥兹克庆典#!，这次奥兹克庆典是专门向[ROOT.Char.GetFaith.WaterGodName]祈祷。在此期间，新娘被领到附近有水的地方，因为水象征着生育能力。然后唱歌、跳舞来祝愿这对新婚夫妇在一起生活顺利。"
 mordvin.0051.a:0 "一次有趣的经历"
 mordvin.0052.t:0 "水神奥兹克庆典"
 mordvin.0052.desc:0 "在[ROOT.Char.GetFaith.GetAdherentNamePlural]中，水是非常高贵之物，因为水被视为与生育有关。\n\n今天，我参加了一个#italic 奥兹克庆典#!，庆典是献给我们的水神，[ROOT.Char.GetFaith.WaterGodName]。我的法庭成员和一些[ROOT.Char.Custom('DefaultPriestTitlePlural')]一起，为这个场合聚集在附近的水体。\n\n我们正在举行的仪式，例如唱着献给[ROOT.Char.GetFaith.WaterGodName]的歌曲，然后用稻草阴茎“浸渍”水体，这样会唤起神的祝福，确保所有人的丰收和繁荣！"
 mordvin.0052.a:0 "赞美[ROOT.Char.GetFaith.WaterGodName]！"
 mordvin.0053.t:0 "桦木神奥兹克庆典"
 mordvin.0053.desc:0 "树木对于[ROOT.Char.GetFaith.GetAdherentNamePlural]很重要，因为人们相信它们具有各种治疗和神秘的能力，所以我们必须给予尊重，并崇拜它们。在各种类型的树木中，白桦树被认为是最神圣的树木之一。\n\n今天我正在参加一个小型的#italic 奥兹克庆典#!或向离宫廷不远的几棵白桦树祈祷的仪式。在场的每个人都唱着赞美白桦的歌曲。"
 mordvin.0053.a:0 "树强，则地强，人强！"
 mordvin.0054.t:0 "可怕且凶残的[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
 mordvin.0054.desc:0 "我听说过这样的故事，外族人说我们[ROOT.Char.GetCulture.GetCollectiveNoun]凶残且恐怖，以至于我们会杀死任何踏入我们土地的外族人，甚至在与他们进行贸易的时候也拒绝与他们交谈。毫无疑问这样让我们名声远扬，虽然不一定有道理！"
 mordvin.0054.a:0 "我们的敌人听到这样的传言就会畏缩不前！"
 mordvin.0054.b:0 "这些故事夸大了我们！"
 mordvin.0054.info:0 "\n#emphasis 历史背景：#!一些中世纪的伊斯兰文献，如10世纪的旅行家和地理学家伊斯塔赫里，提到了一个叫做#italic 阿尔桑尼亚#!的地方，那里的居民凶残无比，任何踏入他们领土的陌生人都会被杀死。\n\n关于#italic 阿尔桑尼亚#!的位置和居民的身份，现代学者有许多不同的理论，有写说法是指莫尔多瓦人的祖先——尔雅人和莫克沙人。13世纪的匈牙利僧侣和探险家朱利安修士，提到了莫尔多瓦人的野蛮，而另一位同时代的匈牙利文献则声称：“这些莫尔多瓦人在杀死至少一个人之前，没有人能阻止。”\n\n无论这些关于中世纪莫尔多瓦人的说法是否夸大，显然他们被异族视为一种可怕的民族。"
 mordvin.0055.t:0 "沉默交易"
 mordvin.0055.desc:0 "一位来自遥远国度的著名商人正停留在我的领土上。虽然他不会说我们的语言，但他被认为精通所谓的“沉默交易”，这是许多外族商人在这里使用这种贸易方式。“沉默交易”是基于手势的交流方式，是由[ROOT.Char.GetCulture.GetCollectiveNoun]和与我们进行贸易的商人在很久以前开发的。\n\n总之，这位商人正在访问我的宫廷，尽管我们之间无法进行口头交流，但他很高兴见到我，并赞美我的统治，因为在他看来，我们对像他这样的外族商人很友善。"
 mordvin.0055.a:0 "即使我们没有共同的语言，也可以进行贸易!"
 mordvin.0055.b:0 "沉默贸易的习俗之所以存在，是因为我们忍外族人"
 mordvin.0055.info:0 "#emphasis 历史背景：#!在一些中世纪的历史文献中，例如12世纪安达卢斯旅行家和探险家阿布·哈米德的记载中，提到了一些在伏尔加河流域经商的外来商人。他们在与当地的芬兰‑乌戈尔族人进行贸易时，偶尔会使用一种手语或“无声贸易”的方式来进行交流。"
 mordvin.0056.t:0 "蓬勃发展的行业"
 mordvin.0056.desc:0 "相当一段时间以来，[ROOT.Char.GetCulture.GetCollectiveNoun]一直以养蜂的能力而闻名。最近由于各种原因，[county.GetNameNoTier]的养蜂行业比往常产量更多，给该地区带来了更大的利润，促进了当地经济的发展。"
 mordvin.0056.a:0 "充满蜂蜜......和利润的土地！"
