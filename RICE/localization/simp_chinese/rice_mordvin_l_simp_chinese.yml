 mordvin.0020.t:0 "蜂产品"
 mordvin.0020.desc:0 "几个世纪以来，养蜂业一直是伏尔加地区经济和文化的重要组成部分。在我的领地上有许多定居点保持着这些养蜂传统，其蜂制品以质量而闻名。\n\n"
 mordvin.0020.desc.honey:0 "我命令领内的养蜂人准备大批蜂蜜，送给[recipient.GetTitledFirstName]。除了为食物增添甜味，据说蜂蜜还具有许多药用性。"
 mordvin.0020.desc.beeswax:0 "我命令领内的养蜂人准备大批蜂蜡，送给[recipient.GetTitledFirstName]。蜂蜡比蜂蜜更有利可图，并且有多种实际用途，例如制作蜡烛或化妆品。"
 mordvin.0020.desc.honey_and_beeswax:0 "因此我命令领内的养蜂人准备大批蜂蜡和蜂蜜，送给[recipient.GetTitledFirstName]。这两种产品都有多种用途，我相信[recipient.GetFirstNameNoTooltip]可以很好地利用它们!"
 mordvin.0020.a:0 "我希望[recipient.GetSheHe]会喜欢这份礼物！"
 mordvin.0021.opening:0 "[actor.Custom2('AppropriateGreeting', recipient)]"
 mordvin.0021.desc.honey:0 "我希望赠送一份来自我领土的高质量蜂蜜的礼物并伴随这封信"
 mordvin.0021.desc.beeswax:0 "谨以此信，赠吾国上品蜜蜡。"
 mordvin.0021.desc.honey_and_beeswax:0 "谨以此书，赠吾国上品蜂蜜蜂蜡。"
 mordvin.0021.desc:0 "吾国囊括伏尔加河地区养蜂佳地，与汝共享吾之礼。"
 mordvin.0021.a:0 "一份完美的礼物！"
 mordvin.0022.t:0 "$mordvin.0020.t$"
 mordvin.0022.desc:0 "$mordvin.0020.desc$"
 mordvin.0022.desc.honey:0 "我已经决定从领土上的养蜂人那里购买大量的蜂蜜。除了为食物增添甜味，据说蜂蜜还有许多药用价值。"
 mordvin.0022.desc.beeswax:0 "我已经决定从当地的养蜂人那里购买大量的蜂蜡。蜂蜡比蜂蜜更有利可图，而且有多种实际用途，如制作蜡烛或化妆品。"
 mordvin.0022.desc.honey_and_beeswax:0 "我已经决定从当地的养蜂人那里购买大量的蜂蜜和蜂蜡。这两种产品都有多种用途，我相信我可以很好地利用它们！"
 mordvin.0022.a:0 "很好。"
 mordvin.0023.t:0 "养蜂人的额外上供"
 mordvin.0023.desc:0 "世代以来，养蜂一直是伏尔加河流域的人民生活重要组成部分。我很幸运，在我的领地里有一些定居点在继续养蜂传统。他们生产的蜂蜜和蜂蜡等蜂制品在其他领土上售价很高，从而为我们带来了很多财富和税款。\n\n不过有时这些养蜂人缴纳的税款是不够，我们需要更多。\n\n因此我已命令领土上的养蜂人今年要提供更多蜂制品！他们已经从贸易中获得了很多利润，并拥有与之相关的各种特权，所以适当提高一些赋税对他们来说肯定没什么问题。"
 mordvin.0023.a:0 "一个真正的#italic 甜蜜#!交易......！"
