l_simp_chinese:
 RICE_every_volga_beekeeper_county:0 "你的[domain|E]中属于[culture|E]的每个[county|E]具有$tradition_RICE_volga_apiculture_name$[tradition|E]"
 RICE_volga_river_region:0 "伏尔加河流域"
 RICE_culture_in_volga_river_basin_desc:0 "[culture|E]至少有#V 4个#![counties|E]在[GetGeographicalRegion('RICE_volga_river_region').GetName]"
 tradition_RICE_apiculture_name:0 "养蜂人"
 tradition_RICE_apiculture_desc:0 "#F 虽然世界各地都有养蜂和采蜜的习俗，但这种文化被广泛认为是这些养蜂技艺的大师。他们通过适当的养蜂和与野生蜜蜂互动，从蜜蜂身上收集许多有价值的东西，尤其是蜂蜜，此外还有蜂蜡、蜂浆、花粉等等。#!"
 tradition_RICE_volga_apiculture_name:0 "伏尔加养蜂人"
 tradition_RICE_volga_apiculture_desc:0 "#F 虽然世界各地都有养蜂和采蜜的习俗，但伏尔加人却以出色的养蜂技巧而闻名。他们生产的蜂蜜和蜂蜡经常畅销国外并且作为贡品献给当地统治者。#!"
 culture_parameter_unlock_rice_volga_bee_tribute_decision:1 "为统治该[culture|E][counties|E]的统治者解锁$RICE_mordvin_extract_beekeeper_tribute$[decision|E]"
 culture_parameter_unlock_rice_volga_bee_product_decision:1 "为其他[characters|E]解锁$RICE_mordvin_acquire_volga_bee_products$[decision|E]和$RICE_mordvin_give_bee_products$[interaction|E]"
 RICE_culture_in_volga_beekeeper_terrain_desc:0 "该[culture|E]没有任何[county|E]位于农田、洪泛平原、平原、森林、丘陵或湿地[terrain|E]"
 tradition_RICE_finnic_sorcerers_name:0 "北境巫师"
 tradition_RICE_finnic_sorcerers_desc:0 "#F 巫术对这种文化来说具有特殊意义，人们通常会从积极的角度看待它；那些在生活中取得巨大成就的人通常被认为是强大的巫师或者有巫术保佑。而在异国他乡，该文化的人因神乎其神的巫术能力而受到敬畏和尊重。#!"
 RICE_mordvin_beekeeper_tribute_extracted:0 "从伏尔加养蜂人索要贡品"
 RICE_mordvin_beekeeper_tribute_extracted_desc:0 "该角色最近从以养蜂闻名的村庄额外要求上贡蜂蜜、蜂蜡和其他蜂产品。"
 RICE_mordvin_beekeeper_tribute_extracted_county:0 "从伏尔加养蜂人提取额外贡品"
 RICE_mordvin_beekeeper_tribute_extracted_county_desc:0 "尽管该地区的养蜂人定期向统治者上贡蜂蜜和蜂蜡，但当地领主最近要求他们进贡更多。"
