 RICE_mordvin_ozks_ushmandey_winner:0 "乌什曼迪"
 RICE_mordvin_ozks_ushmandey_winner_desc:0 "该角色在一次重要的奥兹克庆典（莫尔多瓦人的传统祈祷庆典节日）上赢得几场比试后，获得了#italic 乌斯曼迪#!的称号。奥兹克庆典比试的获胜者会被任命为#italic 乌斯曼迪#!或部落中的指挥官。"
 RICE_mordvin_ozks_bull_meat_soup:0 "奥兹克庆典期间喝了牛祭汤"
