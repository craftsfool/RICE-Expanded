 activity_RICE_niger_delta_olojo_festival:0 "黎明节"
 activity_RICE_niger_delta_olojo_festival_desc:0 "黎明节一直在人类的摇篮——[GetTitleByKey('b_ile-ife').GetNameNoTier]举行了几个世纪。它与该地区的历史、神话和文化紧密相连，也是所有$west_african_orisha_religion_adherent_plural$的精神领袖[GetTrait('RICE_ooni_of_ife').GetName( GetNullCharacter )]宣誓就职并向众神尤其是奥贡献祭的场合。\n\n@alert_icon!#alert_trial 黎明节在十月开始。如果你在那之前到达，活动将暂停，因为你在[GetTitleByKey('b_ile-ife').GetNameNoTier]等待活动开始。#!"
 activity_RICE_niger_delta_olojo_festival_selection_tooltip: "参加黎明节\n\n$RICE_niger_delta_partake_olojo_festival_context_tooltip$"
 activity_RICE_niger_delta_olojo_festival_host_desc: "\n$BULLET_WITH_TAB$你可以获得各种好处，如[piety_i|E][piety|E]或#P 增益#![character_modifiers|E]\n$BULLET_WITH_TAB$如果你是欧尼，你将在[activity|E]中获得额外的职责与责任"
