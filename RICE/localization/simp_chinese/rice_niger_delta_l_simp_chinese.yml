 niger_delta.0030.t:0 "选择一个日期"
 niger_delta.0030.desc:0 "新山药节即将来临，届时我们将庆祝山药的第一次收获，山药是[ROOT.Char.GetCulture.GetName]人民的最重要农作物之一。\n\n甚至在节日的准备工作开始之前，我们就需要确定一个吉日，什么时候举行。现在的问题是，谁应该负责与[ROOT.Char.GetFaith.PantheonTerm]协商并确定今年的节日日期？"
 niger_delta.0030.a:0 "作为[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]的[ROOT.Char.GetTitleAsNameNoTooltip]，这是我的职责。"
 niger_delta.0030.b:0 "我们知识渊博的[ROOT.Char.Custom('DefaultPriestTitlePlural')]会知道该怎么做。"
 niger_delta.0030.c:0 "召集长老和其他知名人士共同决定。"
 niger_delta.0031.t:0 "日期已定"
 niger_delta.0031.desc:0 "我们经过深思熟虑，确定了节日的日期。在那之前，我们将尽我们所能为这个重要的时刻做准备，其中包括通过一系列仪式和实践在这段时间内对仪式进行仪式净化。\n\n最重要的是我们都必须遵守规则，在节日之前，任何人包括我自己，[ROOT.Char.GetTitleAsNameNoTooltip]——都不允许吃任何新的山药。这样做会招致部落和[ROOT.Char.GetFaith.PantheonTerm]的谴责和蔑视。"
 niger_delta.0031.a:0 "让我们开始准备！确保没有人吃到新山药！"
 niger_delta.0032.t:0 "新山药节开始"
 niger_delta.0032.desc:0 "第一批新鲜收获的山药，在盛大的仪式上祭祀[ROOT.Char.GetFaith.PantheonTerm]，并祭祀各种动物。只有完成这个仪式，我们才能吃新的山药。\n\n该地区的不同部族对于谁可以先吃山药有不同的传统。有些人让[ROOT.Char.Custom('DefaultPriestTitlePlural')]或统治者享有这种荣誉，而另一些人则认为社会底层的成员应该先吃。\n\n一旦第一个新山药被吃掉，节日就真正开始了！"
 niger_delta.0032.a:0 "作为[ROOT.Char.GetTitledFirstNameNoTooltip]，我应该是第一个吃新山药的人。"
 niger_delta.0032.b:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')]应该是第一个吃新山药的人。"
 niger_delta.0032.c:0 "最低级、最卑微的人应该是第一个吃新山药的人。"
 niger_delta.0033.t:0 "新山药节结束"
 niger_delta.0033.desc:0 "欢声笑语过后，新山药节落下帷幕。我们的部族在仪式上得到了净化，[ROOT.Char.GetFaith.PantheonTerm]收到了很好的供品，每个人都玩得很开心。\n\n我的使者和代表已被派往整个王国，向所有人通报新山药节。我希望该地区的其他村庄和氏族能够分享我们对目前正在进行的山药收获的喜悦和希望。\n\n随着庆祝活动和兴奋的消退，部族中的每个人都恢复了正常的生活。或许明年的山药节也同样有趣！"
 niger_delta.0033.a:0 "直到下次！"
 niger_delta.0034.t:0 "作为净化的执行"
 niger_delta.0034.desc:0 "在一些庆祝新山药节的地区，有“祭祀”罪犯的习俗。这是因为处决这些人被视为部族仪式净化的重要组成部分，在节日前夕。\n\n今年，一些[ROOT.Char.Custom('DefaultPriestTitlePlural')]告诉我，他们认为将我的囚犯[prisoner.GetFullName]列入被处决的死刑犯，作为这一净化过程的一部分，是最吉祥的。"
 niger_delta.0034.a:0 "很好！我们要用[prisoner.GetHerHis]的血来洁净土地。"
 niger_delta.0034.a.tooltip:0 "这个选项将略微增加你的[counties|E]在节日结束后获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
 niger_delta.0034.b:0 "不，我不明白为什么[prisoner.GetFirstNameNoTooltip]需要死亡。"
 niger_delta.0035.t:0 "食用山药"
 niger_delta.0035.desc:0 "新山药节的一个重要组成部分是#italic 没有一个人#!允许吃即将收获的山药。连像我这样强大的[ROOT.Char.GetTitleAsNameNoTooltip]都不允许这样做。事实上，对像我这样的精英阶层的限制是最大的：我们不仅被禁止看新的山药，甚至是接触它们的农民。\n\n然而我们就在这里发现[yam_eater.GetTitledFirstName]在吃新山药，他被当场抓住了。[yam_eater.GetSheHe|U]可能有很多借口，比如说[yam_eater.GetSheHe]把山药误认为是很久以前收获的老山药，但我们的传统在这个问题上很清楚。[yam_eater.GetFirstNameNoTooltip]食用这些新山药，犯了严重的禁忌。\n\n现在，由我来决定[yam_eater.GetHerHis]的命运。"
 niger_delta.0035.a:0 "如果[yam_eater.GetSheHe]吸取了教训，我认为没有必要惩罚[yam_eater.GetHerHim]。"
 niger_delta.0035.a.tooltip:0 "这个选项略微#N 减少#!当节日结束时，你的[counties|E]将获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
 niger_delta.0035.b:0 "只要[yam_eater.GetSheHe]缴纳罚款，那么我们就会原谅[yam_eater.GetHerHim]。"
 niger_delta.0035.c:0 "不可饶恕的！我将公开宣布[yam_eater.GetHerHim]为罪犯。"
 niger_delta.0036.t:0 "山药的诱惑"
 niger_delta.0036.desc:0 "新山药节的一个重要组成部分是#italic 没有一个人#!允许吃即将收获的山药。连像我这样强大的[ROOT.Char.GetTitleAsNameNoTooltip]都不允许这样做。事实上，对像我这样的精英阶层的限制是最大的：我们不仅被禁止看新的山药，甚至是接触它们的农民。\n\n但我看到它们就在那里，在我面前：美味可口的山药，准备收获。我#italic 真的#!想吃它们，因为我已经厌倦了吃老山药，但我知道我不应该这样做。\n\n或者我应该？"
 niger_delta.0036.a:0 "我甚至不应该看这些山药！我必须在仪式上净化自己!"
 niger_delta.0036.b:0 "我忍不住了，我一定要吃那些山药！"
 niger_delta.0036.b.success:0 "吃山药时不会被发现，并享受其美味"
 niger_delta.0036.b.failure:0 "你在吃山药时被抓，减少了你的[counties|E]在节日结束后获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
 niger_delta.0037.t:0 "山药的诱惑"
 niger_delta.0037.desc.intro:0 "那些新山药确实很好吃，和老山药完全不同。"
 niger_delta.0037.desc.not_caught:0 "\n\n值得庆幸的是，没有人发现我在吃它们。也许[ROOT.Char.GetFaith.HighGodName]看到我犯了这个禁忌，但决定暂时不惩罚我。不过我的恶行在我心里确实很重，但我就是忍不住了。那些山药真的是太好吃了。"
 niger_delta.0037.desc.caught:0 "\n\n不幸的是，我在吃这些东西时被发现了。如果只有一个目击者，我可能会侥幸逃脱，但有几个人看到了我的所作所为。现在，大家都在谈论[ROOT.Char.GetTitledFirstName]是如何打破这个神圣的禁忌的。\n\n[ROOT.Char.Custom('DefaultPriestTitlePlural')]受到了极大的冒犯，要求我为此忏悔故。"
 niger_delta.0037.a:0 "回到准备新山药节的工作中去了!"
 niger_delta.0037.b:0 "我将支付适当的罚款并进行祭祀以净化我的灵魂。"
 niger_delta.0037.b.tooltip:0 "这个选项略微#N 减少#!当节日结束时，你的[counties|E]将获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
 niger_delta.0037.c:0 "如果我打破了禁忌，那又如何？那只是一次而已。"
 niger_delta.0037.c.tooltip:0 "这个选项略微#N 减少#!当节日结束时，你的[counties|E]将获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
