 niger_delta.0006.t:0 "一个新欧尼"
 niger_delta.0006.desc:0 "[ife.GetNameNoTier]中很久没有欧尼了。然而我作为这座神圣城市的统治者，我已经召集了许多[yoruba.GetAdjective]首领，这是一个通过宣布自己为新的欧尼来坚定地使我的政治和精神权威合法化的机会。\n\n欧尼按照传统要求必须是伟大的奥杜杜瓦的后裔。虽然有人质疑我对这个头衔的要求，但除了我自己之外，几乎没有合适的人选担任这个职位。\n\n现在，我需要适应我的新角色。按照传统，除特殊场合外，我将不再进入公共领域，我必须负责任和光荣地履行我的职责。所有[yoruba.GetAdjective]统治者都承认欧尼作为约鲁巴人的精神领袖的首要地位，在我的领导下，所有追随神明的人必将获得稳定和繁荣。"
 niger_delta.0006.a:0 "愿我的领导能激励所有人！"
 niger_delta.0007.t:0 "$niger_delta.0006.t$"
 niger_delta.0007.desc:0 "一段时间以来，没有人声称[ife.GetNameNoTier]的欧尼头衔，他是[yoruba.GetAdjective]社区的礼仪精神领袖。[GetGeographicalRegion('RICE_yorubaland_region').GetName]及其他地区的虔诚[yoruba.GetAdjective]人，他们认识到[ife.GetNameNoTierNoTooltip]的重要性，在没有欧尼的指导下迷失了方向。\n\n现在他们的情况有所好转。[reformer.GetFirstName]获得了足够的权力和声望，可以被宣布为[ife.GetNameNoTier]的新欧尼。[reformer.GetSheHe|U]甚至已经开始退入[reformer.GetHerHis]的宫殿，不再像传统那样与公众互动。\n\n最终，欧尼作为神明世间代言人现在回归了。"
 niger_delta.0007.a:0 "对于[yoruba.GetAdjectiveNoTooltip]部族来说，这是新的一天！"
 niger_delta.0007.b:0 "有趣的消息……"
