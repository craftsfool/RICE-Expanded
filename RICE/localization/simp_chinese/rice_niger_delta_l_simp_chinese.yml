 niger_delta.0010.t:0 "提供可乐果"
 niger_delta.0010.desc.intro:0 "我已尽我所能为今天的仪式做准备。在[ROOT.Char.Custom('DefaultPriestTitlePlural')]的帮助下，我向[ROOT.Char.GetFaith.HighGodName]献上各种祈祷和圣歌，特别是神圣的可乐果。打开第一个可乐果后，我们记下它有多少个裂痕："
 niger_delta.0010.desc.one:0 "\n\n一道。\n\n该死！！这种被称为#italic Oji Ogbi#!或哑果的可乐果被视为可憎之物，不适合人类食用，只适合上天。我立即将其丢弃，但这无论如何都是不祥之兆。"
 niger_delta.0010.desc.two:0 "\n\n两道。\n\n多么的不幸！！这种被称为#italic Oji Gworo#!的可乐果，或精神可乐果，在当地数字二缺乏平衡，这样的可乐果属于不正常的。我立即将其丢弃，但这无论如何都是不祥之兆。"
 niger_delta.0010.desc.three:0 "\n\n三道。\n\n好兆头！ 这种类型的可乐果，称为#italic Oji Ikengai#!，或英勇可乐果，在当地这样的可乐果被视为具有阳刚之气，体现了勇敢。这无疑彰显了我作为[ROOT.Char.GetTitleAsNameNoTooltip]的勇气和力量！"
 niger_delta.0010.desc.four:0 "\n\n四道。\n\n不错！这种类型的可乐果，称为#italic Oji Udo na Ngozi#!，或和平与祝福可乐果，在当地四是一个神圣的、好的数字，这样的可乐果被视为能带来和平。表明在我的生活和领土中存在着稳定和统一。"
 niger_delta.0010.desc.five:0 "\n\n五道。\n\n很......很好！！这种被称为#italic Oji Omumu#!，或繁荣可乐果，在当地这样的可乐果很罕见，象征着丰收以及财富还有强大的生育能力。毫无疑问，目前和不久的将来，我的生活中将充满财富。"
 niger_delta.0010.desc.six:0 "\n\n六道。\n\n多么神奇啊！这种被称为#italic Oji Ogbugbandu#!，或祖先可乐果，在当地这样的可乐果极其罕见，象征着[ROOT.Char.GetFaith.PantheonTerm]与人之间的特殊约定。我的领土并将繁荣！"
 niger_delta.0010.desc.seven:0 "\n\n七道。\n\n不可思议！这种被称为#italic Oji Asaa‑Asota#!，或永恒可乐果，在当地这样的可乐果基本不可能出现，象征着许多东西，如庆祝、法律、皇室、预言、现实和永恒，被认为具有魔力。对我来说，它是一种无法衡量的幸运的标志，马上为[ROOT.Char.GetFaith.PantheonTerm]举行祭祀！庆祝并举办宴会。"
 niger_delta.0010.a:0 "仪式就这样结束了。"
