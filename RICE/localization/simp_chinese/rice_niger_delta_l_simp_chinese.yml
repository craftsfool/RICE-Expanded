 action_RICE_uncrowned_by_ooni_desc:1 "你未从欧尼哪里获得[beaded_crown|E]，这对你在臣民中的声誉和你统治的合法性有负面影响。\n\n#help 为了摆脱[GetModifier('RICE_niger_delta_uncrowned').GetNameWithTooltip][character_modifier|E]，你需要采取$RICE_niger_delta_request_beaded_crown$[decision|E]#!"
