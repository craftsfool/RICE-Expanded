 niger_delta.0040.t:0 "变得狂野"
 niger_delta.0040.desc:0 "山药节是一个狂欢的时刻，有时对于我们社会中更拘谨的成员来说是过度的。许多人不仅吃很多食物，而且喝了不少酒，有时甚至会听到关于秘密，艳遇的谣言，这些谣言通常会令人不悦，但由于这些节日的忙碌性质而被忽略或忽视。"
 niger_delta.0040.a:0 "人们在这里庆祝丰收也让他们玩得开心！"
 niger_delta.0040.b:0 "尽管我个人不赞成它，但我无能为力。"
 niger_delta.0040.c:0 "今年的节日我会制定和执行更严格的规定！"
 niger_delta.0041.t:0 "神奇的草药"
 niger_delta.0041.desc:0 "在一些地方，人们习惯在新山药节开始时，在向[ROOT.Char.GetFaith.PantheonTerm]进行最初一轮祭祀后，分发神奇的草药。这些仪式被认为可以保护大家不因过早食用新山药作物而生病。"
 niger_delta.0041.a:0 "这样的事情对于保护我们的健康和灵魂是必要的。"
 niger_delta.0042.t:0 "为祖先准备的山药"
 niger_delta.0042.desc:0 "人们总是在新山药节期间拜访祖先的神龛，我也不例外。在祠堂里，我向我的先祖们献上山药，以表示我的孝心，并向祖先们祈求他们的祝福和指导。"
 niger_delta.0042.a:0 "亲爱的祖先们，愿你们享受这些山药的美味"
 niger_delta.0042.b:0 "祖先们应该得到一大堆巨大的山药供奉！"
 niger_delta.0042.b.tooltip:0 "这个选项略微#P 增加#!你的[counties|E]在节日结束时获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
 niger_delta.0043.t:0 "山药王"
 niger_delta.0043.desc.intro:0 "有时，在新山药节期间，当地农民相互竞争，看谁种的山药最好。谁种出了最好的山药，谁就被任命为所谓的 “山药王”，为自己赢得了巨大的声望和荣誉。"
 niger_delta.0043.desc.no_farmer:0 "\n\n也许我应该为赢得今年比赛的农民提供某种奖励。这样做肯定会让我在部族长老的眼中有良好的形象。"
 niger_delta.0043.desc.farmer:0 "\n\n今年的胜利者是一位名叫[farmer.GetFullName]的农夫。据说[farmer.GetSheHe|U]比一般的农民更有天赋（或者至少是非常幸运），因为[farmer.GetHerHis]农场的山药收获结果令人印象深刻。\n\n也许我应该给[farmer.GetFirstNameNoTooltip]一个奖励。事实上，鉴于[farmer.GetHerHis]在农业方面的知识和能力，邀请[farmer.GetHerHim]到我的宫廷可能对我有利。"
 niger_delta.0043.a:0 "声望和荣誉是足够好的奖励。"
 niger_delta.0043.b:0 "好主意，我将送给这个农民一个合适的礼物！"
 niger_delta.0043.c:0 "[farmer.GetFirstNameNoTooltip]将得到一份礼物，[farmer.GetSheHe]可以加入我的宫廷。"
 niger_delta.0043.tooltip:0 "你的[counties|E]获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会，当节日完成后，已经稍微#P 增加#!"
 niger_delta.0044.t:0 "巨大山药"
 niger_delta.0044.desc:0 "有时在山药节期间，当地人会在村子里公开展示异常大的山药，让大家感到高兴和着迷。我正在检查几个这样的山药。这些真正了不起的标本当然很大，有些达到了普通人的高度。"
 niger_delta.0044.a:0 "设法做到这一点的农民干得好。"
 niger_delta.0044.b:0 "这只能归功于[ROOT.Char.GetFaith.PantheonTerm]。"
 niger_delta.0045.t:0 "最大的山药"
 niger_delta.0045.desc:0 "在一些庆祝新山药节的民族中，有这样的习俗：找到收获的最大的山药并把它带到当地的神庙。一些部族认为，最好把它储存起来，直到下一个新山药节，在那里它将被吃掉。而其他文化则认为，最好将这些大山药留作祭祀之用。\n\n今年，在我的领土内，一个村子里长出了一个异常大的山药，达到了一个人的高度。应该如何处理它？"
 niger_delta.0045.a:0 "让我们保留它，这样我们就可以在下一个新山药节上吃到它!\n"
 niger_delta.0045.b:0 "我们应该把这种山药保留给宗教祭祀用。"
 niger_delta.0045.tooltip:0 "你的[counties|E]获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会，当节日完成后，已经稍微#P 增加#!"
 niger_delta.0046.t:0 "来自他乡的山药"
 niger_delta.0046.desc:0 "有许多与新山药节相关的重要规定。在一些文化中有的规定是，外来者不能将新的山药从他们的部族带到即将或正在庆祝新山药节的城镇。陌生的“山药”被看作是一种污秽的存在。\n\n最近，一位来自其他地方的知名旅行者来到[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]，不知道我们的新山药节还没有结束，结果当这位旅行者被发现携带来自家乡的新山药时，出现了尴尬的局面。\n\n要求罪魁祸首缴纳罚款通常就够了，但也有人认为需要举行一个特殊的、紧急的祭祀仪式，对部族进行仪式性的清洗。"
 niger_delta.0046.a:0 "缴纳罚款应该是足够的惩罚。\n"
 niger_delta.0046.b:0 "这片土地必须得到净化！让我们来做祭祀。"
 niger_delta.0046.c:0 "罚款？牺牲？不需要任何这些。"
 niger_delta.0046.c.tooltip:0 "这个选项略微#N 减少#!当节日结束时，你的[counties|E]将获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]的机会。"
 niger_delta.0047.t:0 "一个欢乐时光"
 niger_delta.0047.desc:0 "现在，山药节正在进行中，每个人都在享受快乐。[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]到处都是当地人在跳舞、演奏音乐、欢呼、鼓掌、享受。"
 niger_delta.0047.a:0 "我也要加入欢乐的行列！"
 niger_delta.0047.b:0 "我将在一旁观察。"
