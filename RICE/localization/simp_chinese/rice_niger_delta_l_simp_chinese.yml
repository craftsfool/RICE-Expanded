 niger_delta.0050.t:0 "为[scoped_ruler.GetTitledFirstNameNoTooltip]举行加冕仪式？"
 niger_delta.0050.desc.intro:0 "作为$c_ife$的欧尼，我被许多[ROOT.Char.GetFaith.GetAdherentNamePlural]和[GetGeographicalRegion('RICE_yorubaland_region').GetName]的人们视为具有重大精神意义的统治者。这些远道而来的统治者会来到欧尼的宫廷，并用珍贵的奥杜杜瓦珠冠王冠举行加冕仪式，以使他们的统治合法化。\n\n有一位这样的统治者，[scoped_ruler.GetTitledFirstName]，已经到我的宫廷来做这件事。由于人们不能简单地向欧尼索取串珠王冠，因此[scoped_ruler.GetSheHe]给我带来了一份礼物。"
 niger_delta.0050.desc.sacrifice:0 "[scoped_ruler.GetFirstName]以我的名义向[scoped_ruler.GetFaith.HighGodName]献祭。这样做展现了[scoped_ruler.GetSheHe]对信仰的前程及对祖先的尊重。"
 niger_delta.0050.desc.oduduwa_shrine:0 "[scoped_ruler.GetFirstName]向$c_ife$中我们伟大的祖先奥杜杜瓦的神殿赠送了一大笔黄金。[ROOT.Char.Custom('DefaultPriestTitlePlural')]对此非常满意，这也表明了[scoped_ruler.GetFirstNamePossessiveNoTooltip]的信念和诚意。"
 niger_delta.0050.desc.sacred_vow:0 "[scoped_ruler.GetFirstName]发誓[scoped_ruler.GetSheHe]将以[scoped_ruler.GetSheHe]所能提供的任何方式帮助我——即使这不符合了[scoped_ruler.GetHerHis]的利益。这种神圣的誓言不是轻易能发的。"
 niger_delta.0050.desc.art:0 "[scoped_ruler.GetFirstName]给了我大量无价的艺术品，由[scoped_ruler.GetHerHis]家族的工艺行会[scoped_ruler.GetDynasty.GetName]制作。这些美观的物品证明了[scoped_ruler.GetHerHis]作为[scoped_ruler.GetTitleAsNameNoTooltip]的身份和我作为欧尼的权威。"
 niger_delta.0050.desc.land:0 "\n\n[scoped_ruler.GetFirstName]发誓要把[county.GetNameNoTier]的土地交给我的家族成员[other_character.GetFullName]来统治。这是一个慷慨的提议，将巩固我家族在世界上的权力。"
 niger_delta.0050.desc.low_concubine:0 "\n\n[scoped_ruler.GetFirstName]提供了一个名为[other_character.GetFullName]的[other_character.GetWomanMan]作为我的配偶。[other_character.GetSheHe|U]据说拥有讨人喜欢的面容和其他优良品质。"
 niger_delta.0050.desc.high_concubine:0 "\n\n[scoped_ruler.GetFirstName]提供了他们的家庭成员[other_character.GetFullName]作为我的配偶。除了据称拥有[other_character.GetSheHe|U]令人愉悦的容貌和良好的品质外，这还清楚地表明[scoped_ruler.GetFirstNamePossessiveNoTooltip]对我的尊重，可以像这样将一位珍爱的家人送到我的宫廷。"
 niger_delta.0050.desc.no_gift:0 "\n\n[scoped_ruler.GetFirstName]没有给我……什么。相反，从逻辑上说，[scoped_ruler.GetSheHe]认为[scoped_ruler.GetHerHis]的存在足以作为“礼物”。这是……好吧，我甚至不知道该如何应对。[scoped_ruler.GetSheHe]是疯[scoped_ruler.GetWomanMan]吗？什么样的野蛮、亵渎神明的傻瓜会如此大胆地公开对欧尼表示这种程度的不尊重？"
 niger_delta.0050.a:0 "好！我会给[scoped_ruler.GetHerHim]一个串珠王冠。"
 niger_delta.0050.b:0 "这不是什么好礼物，但我还是会接受。"
 niger_delta.0050.c:0 "尽管这很荒谬，但我会接受[scoped_ruler.GetHerHis]的“礼物”。"
 niger_delta.0050.d:0 "告诉[scoped_ruler.GetHerHim]我不会接受这个侮辱的“礼物”！"
 niger_delta.0051.t:0 "欧尼加冕礼"
 niger_delta.0051.desc:0 "当我收到[ooni.GetTitledFirstName]接受我作为欧尼的礼物的好消息后，我立即前往$c_ife$，以便[ooni.GetHerHim]正式授予我串珠王冠，承认我作为[ROOT.Char.GetPrimaryTitle.GetNameNoTier][ROOT.Char.GetTitleAsNameNoTooltip]的合法性。\n在那里举行的仪式上，我跪在欧尼前，因为[ooni.GetSheHe]将神圣的奥杜杜瓦串珠王冠戴在了我的头上。我起身后立下誓言，承诺保护我的臣民的安全，尊重祖先，每年在奥杜杜瓦神殿进行祭祀，并保护和维护我土地上的神圣神殿。"
 niger_delta.0051.desc.bad_gift:0 "\n\n我听说欧尼对我送给[ooni.GetHerHim]的礼物不太满意。虽然这对我没有很好的反映，但只要[ooni.GetSheHe]接受了礼物，我就可以忍受。"
 niger_delta.0051.a:0 "我感觉到奥杜杜瓦的意识进入我体内！"
 niger_delta.0052.t:0 "打道回府"
 niger_delta.0052.desc:0 "在[ooni.GetTitledFirstName]正式收到我的礼物并为我戴 奥杜杜瓦的串珠王冠后，我在$c_ife$度过了一段时间，参观了各个神殿并向[ROOT.Char.GetFaith.HighGodName]祈祷。\n\n我已经回到[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的家。从欧尼手中接过串珠王冠是一种荣誉，我的臣民现在会更加尊重我，因为我已经证明自己是他们眼中的合法统治者。"
 niger_delta.0052.a:0 "我现在可以恢复我作为[ROOT.Char.GetTitleAsNameNoTooltip]的职责。"
 niger_delta.0053.t:0 "被欧尼拒绝"
 niger_delta.0053.desc:0 "不幸的消息！\n\n[ooni.GetTitledFirstName]拒绝接受我的礼物，并且在这样做时也拒绝履行我的请求，他拒绝用奥杜杜瓦串珠王冠为我加冕。唉，这将对我产生不良影响。也许欧尼将来会改变[ooni.GetHerHis]的想法，让我有幸获得这顶王冠。"
 niger_delta.0053.desc.no_gift:0 "\n\n平心而论，每个人都同意要求加冕，甚至不向 欧尼提供至少某种象征性的礼物，这简直是愚蠢的。我现在所到之处，到处都在传播可怕的谣言，不仅是关于欧尼是如何蔑视我的，而且是关于我是一个被[ROOT.Char.GetFaith.PantheonTerm]诅咒的不配统治的无能、非法统治者。"
 niger_delta.0053.a:0 "这可不好……"
