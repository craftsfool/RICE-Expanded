 game_concept_beaded_crowns:0 "珠冠"
 game_concept_beaded_crown:0 "钉珠冠"
 game_concept_beaded_crown_desc:0 "$c_ife$的统治者被称为欧尼，在约鲁巴人中曾经并拥有巨大的宗教和世俗权威。在历史上该地区的君主会前往圣城$c_ife$，由欧尼为其戴上奧杜杜瓦的特殊珠冠，奧杜杜瓦是约鲁巴的神灵和祖先，珠冠来证明其统治合法化。\n\n在游戏中，欧尼是$west_african_orisha_pagan$[faith|E]的[head_of_faith|E]，该地区[faith|E]是$west_african_orisha_religion$[religion|E]的[rulers|E]或该地区符合其他要求的人可以采用[decision|E]前往$c_ife$来$RICE_niger_delta_request_beaded_crown$。在你选择向欧尼提供的礼物后，他们将决定是否接受或拒绝该礼物。如果你是欧尼本人，你可以反过来接受礼物和加冕[rulers|E]。\n\n如果你信奉$west_african_orisha_religion$的[faith|E]，你将有[GetModifier('RICE_niger_delta_uncrowned').GetNameWithTooltip][character_modifier|E]，直到你让欧尼同意给你加冕。"
 game_concept_niger_delta_craft_guild:0 "工匠行会"
 game_concept_niger_delta_craft_guilds:0 "手工艺行会"
 game_concept_niger_delta_craft_guilds_desc:0 "历史上，[GetGeographicalRegion('RICE_niger_delta_region').GetName]的[rulers|E]在皇室的庇护下组织了一些职业的行会，如工匠行会，以提高皇家地位和经济，但作为交换，皇家为这些行会提供稳定的工作和政治环境。\n\n如果你的[culture|E]有$tradition_RICE_kinship_based_craft_guilds_name$或$tradition_RICE_ritual_hegemony_name$[traditions|E]，并且你是一个[dynast|E]，你可以采用$RICE_niger_delta_form_craft_guilds$[decision|E]。有四个可供选择，每个都有各自的要求：青铜铸造师、铁匠、象牙和木雕师以及珠造师。\n\n每个行会都会给你的[dynasty|E]一个独特的[modifier|E]，并解锁$RICE_niger_delta_commission_art_from_craft_guilds$[decision|E]（取决于你的[dynasty|E]已经组织了哪些行会）。采用这个[decision|E]会让你获得各种[artifacts|E]，其中一些可以[reforge|E]成[court_artifact|E]。"
 game_concept_kola_nut:0 "可乐果"
 game_concept_kola_nuts:0 "可乐果"
 game_concept_kola_nuts_desc:0 "虽然可乐果在整个非洲都很重要，但没有任何地方比伊博人更崇尚它。因此[faith|E]是$odinala_religion$[religion|E]的[rulers|E]或属于有$tradition_RICE_igwebuike_name$[tradition|E]的[culture|E]，可以获得与可乐果有关的两个特殊能力。\n\n首先，你可以获得$RICE_niger_delta_kola_nut_interaction$的[character_interaction|E]。这可以让你“支付”另一个[ruler|E]一些[prestige|E]和[piety|E]（取决于你的等级）来获得[truce|E]。其次你可以采用提供可乐果的[decision|E]，有可能获得各种正面（或负面）的[character_modifiers|E]"
 culture_parameter_unlock_rice_african_royal_guilds:0 "解锁组织和委托以氏族为单位的[niger_delta_craft_guilds|E]的工艺品[decisions|E]"
 culture_parameter_unlock_rice_unrestricted_beaded_crown_bestowments:0 "如果你在[GetGeographicalRegion('RICE_yorubaland_region').GetName]中至少拥有一个[county|E]，则可以向[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]请求[beaded_crowns|E]，无视[faith|E]或者[heritage|E]"
 culture_parameter_unlock_rice_ancestor_worship:0 "解锁[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName][activity|E]"
 tradition_RICE_kinship_based_craft_guilds_name:0 "氏族工会"
 tradition_RICE_kinship_based_craft_guilds_desc:0 "#F 职业行会在非洲社会中发挥着重要作用，但在该文化中，声称具有传奇色彩的工匠行会在王室的赞助下拥有相当大的权力和影响力。没有出生在行会家庭的外人通常被排除在这些行会之外，尽管他们可能有才能和天赋，但是他们没有这些神圣艺术所需的神话祖先。#!"
 RICE_niger_delta_geographical_req:0 "你在[GetGeographicalRegion('RICE_niger_delta_region').GetName]中至少拥有一个[county|E]"
 tradition_RICE_igwebuike_name:0 "人多势众"
 tradition_RICE_igwebuike_desc:0 "#F 伊格贝克（人多势众）是一种互惠的道德观，源于万物相互关联的哲学概念。因此该文化认为人们应该努力通过维持互利关系来解决冲突。此外在这种文化中，[kola_nut|E]往往被视为格贝克的最大象征。#!"
 innovation_lost_wax_casting:0 "失蜡法"
 innovation_lost_wax_casting_desc:0 "受伊格博‑乌克武大师的启发，我们的工匠已经掌握了一种高度复杂的金属铸造技术，以生产华丽的艺术品，我们的青铜作品将名垂青史！"
 not_egalitarian_spiritual_or_communal_desc:1 "[culture|E]没有$ethos_egalitarian_name$、$ethos_spiritual_name$或者$ethos_communal_name$[ethos|E]"
 culture_parameter_unlock_rice_kola_nut_truce:1 "解锁与其他[rulers|E]使用$RICE_niger_delta_kola_nut_interaction$[interaction|E]来允许[truces|E]"
 culture_parameter_unlock_rice_kola_nut_decision:1 "解锁在宗教仪式上献上[kola_nuts|E][decision|E]，且无视[faith|E]要求"
 tradition_RICE_ritual_hegemony_name:1 "祭祀霸权"
 tradition_RICE_ritual_hegemony_desc:1 "该文化的政体往往是分散的，通过祭祀、精神权威和血统，以及棕榈叶等神圣符号和象征来强化霸权。在许多这样的部族中，无论他们的职业如何，他们往往通过获得头衔、声望和象征性的权力来寻求更大的影响力和地位。"
 RICE_niger_delta_kola_nut_interaction:0 "祈求和平的可乐果"
 RICE_niger_delta_kola_nut_interaction_notification:0 "我希望向你赠送神圣的可乐果，希望我们可以在正式的仪式上分享它们，并在我们双方之间宣誓和平。让我们确认我们对彼此没有恶意，避免潜在的冲突，并本着#italic 伊格贝克#!的精神进行合作。"
 RICE_niger_delta_kola_nut_interaction_desc:0 "与[recipient.GetTitledFirstName]以[kola_nuts|E]宣誓开达成[truce|E]，这样可以获得[prestige|E]和[piety|E]"
 RICE_niger_delta_kola_nut_interaction.accept.actor.tt:0 "[recipient.GetTitledFirstName]同意接受和平的可乐果"
 RICE_niger_delta_kola_nut_interaction.accept.recipient.tt:0 "[actor.GetTitledFirstName]分享可乐果"
 RICE_niger_delta_kola_nut_interaction.decline.actor.tt:0 "[recipient.GetTitledFirstName]拒绝分享可乐果"
 RICE_niger_delta_kola_nut_interaction.decline.recipient.tt:0 "[actor.GetTitledFirstName]感到被羞辱，因为我拒绝了可乐果"
 RICE_niger_delta_kola_nut_interaction_truce_purchased:0 "\n[recipient.GetTitledFirstName]和[actor.GetTitledFirstName]以神圣的[kola_nut|E]来宣誓休战"
 RICE_niger_delta_kola_nut_interaction_AI_believes_in_igwebuike:0 "相信#italic 伊格贝克#!的理念：$VALUE|=+0$"
 RICE_niger_delta_kola_nut_interaction_AI_skeptical_of_igwebuike:0 "对#italic 伊格贝克#!理持怀疑态度：$VALUE|=+0$"
 RICE_niger_delta_kola_nut_interaction_lacking_igwebuike:0 "[recipient.GetCulture.GetName][culture|E]不理解#italic 伊格贝克#!理念：$VALUE|=+0$"
 RICE_niger_delta_kola_nut_interaction_non_african:0 "[recipient.GetCulture.GetName][culture|E]不属于非洲[heritage|E]而且不明白可乐果内涵的精神观念：$VALUE|=+0$"
 activity_niger_delta_beaded_crown:0 "前往$c_ife$获得[beaded_crown|E]之旅"
 activity_niger_delta_beaded_crown_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]前往$c_ife$领取[beaded_crown|E]"
 activity_niger_delta_new_yam_festival:0 "新山药节"
 activity_niger_delta_new_yam_festival_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]新山药节"
 activity_niger_delta_olojo_festival:0 "出席黎明节"
 activity_niger_delta_olojo_festival_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]出席黎明节"
 trait_RICE_ooni_of_ife:0 "伊莱伊费的欧尼"
 trait_RICE_ooni_of_ife_desc:0 "该角色是一位欧尼，是$yoruba$的精神领袖同时也是圣城伊费的统治者。无论是名义上还是实际上。他们很少离开自己的领地，除非在某些重要的宗教仪式上，否则一般都隐居在远离公众视野的宫殿里。"
 trait_RICE_ooni_of_ife_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是一位欧尼，是$yoruba$的精神领袖同时也是圣城伊费的统治者（无论是名义上还是实际上）。[ROOT.GetCharacter.GetSheHe|U]很少离开[ROOT.GetCharacter.GetHerHis]的领地，除非在某些重要的宗教仪式上，否则一般都隐居在[ROOT.GetCharacter.GetHerHis]的宫殿里。"
 RICE_niger_delta_bronze_artifact_name:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]青铜艺术品"
 RICE_niger_delta_bronze_artifact_good_name:0 "良好的[ROOT.Char.GetCulture.GetNameNoTooltip]青铜艺术品"
 RICE_niger_delta_bronze_artifact_excellent_name:0 "优秀的[ROOT.Char.GetCulture.GetNameNoTooltip]青铜艺术品"
 RICE_niger_delta_bronze_artifact_desc:0 "一件用青铜铸造的艺术品，具有传统的[ROOT.Char.GetCulture.GetName]风格，采用非洲部分地区常见的失蜡法来锻造。它是应[ROOT.Char.GetDynasty.GetName]家族下的青铜铸造行会的工匠们成员之一[ROOT.Char.GetTitledFirstName]的要求制作的。"
 RICE_niger_delta_iron_artifact_name:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]铁制品"
 RICE_niger_delta_iron_artifact_good_name:0 "良好的[ROOT.Char.GetCulture.GetNameNoTooltip]铁制品"
 RICE_niger_delta_iron_artifact_excellent_name:0 "优质的[ROOT.Char.GetCulture.GetNameNoTooltip]铁制品"
 RICE_niger_delta_iron_artifact_desc:0 "以传统的[ROOT.Char.GetCulture.GetName]风格用铁铸造的艺术作品。非洲的许多文化都有很强的铁匠传统，而这件艺术品体现了非洲发达的铁器文化。它是由在[ROOT.Char.GetDynasty.GetName]家族下服务的铁匠行会的工匠们制作的，是应他们的一个成员[ROOT.Char.GetTitledFirstName]的要求。"
 RICE_niger_delta_ivory_artifact_name:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]象牙雕"
 RICE_niger_delta_ivory_artifact_good_name:0 "良好的[ROOT.Char.GetCulture.GetNameNoTooltip]象牙雕"
 RICE_niger_delta_ivory_artifact_excellent_name:0 "优质[ROOT.Char.GetCulture.GetNameNoTooltip]象牙雕"
 RICE_niger_delta_ivory_artifact_desc:0 "以传统的[ROOT.Char.GetCulture.GetName]风格并采用当地猎人杀死的大象牙齿制作的。它是由在[ROOT.Char.GetDynasty.GetName]家族下服务的铁匠行会的工匠们制作的，是应他们的一个成员[ROOT.Char.GetTitledFirstName]的要求。"
 RICE_niger_delta_wood_artifact_name:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]木雕"
 RICE_niger_delta_wood_artifact_good_name:0 "良好的[ROOT.Char.GetCulture.GetNameNoTooltip]木雕"
 RICE_niger_delta_wood_artifact_excellent_name:0 "优质的[ROOT.Char.GetCulture.GetNameNoTooltip]木雕"
 RICE_niger_delta_wood_artifact_desc:0 "一件以传统[ROOT.Char.GetCulture.GetName]风格雕刻的艺术品，使用的木材在撒哈拉以南非洲的许多地方都很常见。它是由在[ROOT.Char.GetDynasty.GetName]家族下服务的木匠行会的工匠们制作的，是应他们的一个成员[ROOT.Char.GetTitledFirstName]的要求。"
 RICE_niger_delta_glass_artifact_name:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]玻璃珠艺术品"
 RICE_niger_delta_glass_artifact_good_name:0 "良好的[ROOT.Char.GetCulture.GetNameNoTooltip]玻璃珠艺术品"
 RICE_niger_delta_glass_artifact_excellent_name:0 "优质的[ROOT.Char.GetCulture.GetNameNoTooltip]玻璃珠艺术品"
 RICE_niger_delta_glass_artifact_desc:0 "以传统的[ROOT.Char.GetCulture.GetName]风格制作的玻璃珠装饰品，使用的玻璃来自非洲本土的玻璃作坊。它是由在[ROOT.Char.GetDynasty.GetName]家族下服务的玻璃行会的工匠们制作的，是应他们的一个成员[ROOT.Char.GetTitledFirstName]的要求。"
 RICE_niger_delta_coral_artifact_name:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]珊瑚珠艺术品"
 RICE_niger_delta_coral_artifact_good_name:0 "良好的[ROOT.Char.GetCulture.GetNameNoTooltip]珊瑚珠艺术品"
 RICE_niger_delta_coral_artifact_excellent_name:0 "优质的[ROOT.Char.GetCulture.GetNameNoTooltip]珊瑚珠艺术品"
 RICE_niger_delta_coral_artifact_desc:0 "以传统的[ROOT.Char.GetCulture.GetName]风格完成，使用在非洲海岸收获的珍贵珊瑚。它是由在[ROOT.Char.GetDynasty.GetName]家族下服务的手工行会的工匠们制作的，是应他们的一个成员[ROOT.Char.GetTitledFirstName]的要求。"
 building_type_wap_bronze_industry_01:1 "青铜器行业"
 building_type_wap_bronze_industry_01_desc:1 "从伊格博‑乌库的工匠开始研究出这些技术然后传播到伊莱伊费和贝宁，失蜡法的开创是西非历史上伟大的创新之一......他们制作了世界上最美丽的金属作品和雕塑。"
 building_wap_bronze_industry_01:0 "小青铜器作坊"
 building_wap_bronze_industry_01_desc:1 "从古老时代的村庄开始，我们的铁匠已经开始加工附近发现新材料，但我们产能发展受限于四处散落的工坊和库存的材料。"
 building_wap_bronze_industry_02:0 "中型青铜作坊"
 building_wap_bronze_industry_02_desc:1 "我们已经有意识的聚集青铜作坊，以来增加产能，我们的努力最终组成一个重要的失蜡法作坊。"
 building_wap_bronze_industry_03:0 "大型青铜作坊"
 building_wap_bronze_industry_03_desc:1 "现在有一个大规模的、专业的区域专门为我们的青铜大师工作。他们专门生产最好的金属制品，我们的工匠大师的作品从尼日尔河流传到尼罗河流域。"
 RICE_niger_delta_new_yam_festival_ruler_ate_first_yam:0 "吃了第一个山药"
 RICE_niger_delta_new_yam_festival_ruler_ate_first_yam_desc:0 "该角色在最近庆祝的新山药节上，给自己吃了那年的第一个新山药（即新收割的山药）。"
 RICE_niger_delta_new_yam_festival_priests_ate_first_yam:0 "教士们吃了第一个山药"
 RICE_niger_delta_new_yam_festival_priests_ate_first_yam_desc:0 "该角色在最近庆祝的新山药节上，给神职人员吃了那年的第一个新山药（即新收割的山药）。"
 RICE_niger_delta_new_yam_festival_commoners_ate_first_yam:0 "卑微的平民吃了第一个山药"
 RICE_niger_delta_new_yam_festival_commoners_ate_first_yam_desc:0 "该角色在最近庆祝的新山药节上，给底层人民吃了那年的第一个新山药（即新收割的山药）。"
 RICE_niger_delta_received_beaded_crown:0 "最近收到来自欧尼的珠冠"
 RICE_niger_delta_uncrowned:0 "没有被欧尼加冕"
 RICE_niger_delta_uncrowned_desc:0 "这位统治者遵循一种[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]的精神和世俗至上的[faith|E]，但他却没有向欧尼寻求[beaded_crown|E]，他需要这样做以使其统治合法。\n\n#EMP 一旦采取$RICE_niger_delta_request_beaded_crown$[decision|E]并且被欧尼授予珠冠，这个[character_modifier|E]会被移除。#!"
 RICE_niger_delta_ooni_scorn:0 "被$c_ife$的欧尼蔑视"
 RICE_niger_delta_ooni_denounced:0 "被$c_ife$的欧尼谴责"
 RICE_niger_delta_ooni_denounced_permanent:0 "被$c_ife$的欧尼永久谴责"
 RICE_niger_delta_ooni_denounced_permanent_desc:0 "该角色羞辱了$c_ife$的欧尼，其程度甚至很少人敢这么做。\n\n#EMP 该角色永远被禁止采用$RICE_niger_delta_request_beaded_crown$[decision|E]#!"
 RICE_niger_delta_ife_effects:0 "\n\n#italic $c_ife$[county|E]的[rulers|E]可以采取[decide|E]来委托#bold 珠造师#!制造艺术品。[niger_delta_craft_guilds|E]不会在乎[title_tier|E]，即使他们的[culture|E]没有[traditions|E]。#!"
 RICE_niger_delta_city_of_ife:0 "人类的摇篮，$c_ife$"
 RICE_niger_delta_city_of_ife_desc:0 "根据生活在尼日尔河三角洲的人们的传说，伊费（意为“扩张之地”）是所有世俗和精神力量的来源。这座城市点缀着神圣的神龛和神灵与祖先的树林，如奥洛昆的树林，这里有非洲最大的玻璃制造工场之一。$RICE_niger_delta_ife_effects$"
 RICE_niger_delta_ruler_of_ife:0 "$c_ife$的欧尼"
 RICE_niger_delta_ruler_of_ife_desc:0 "该角色是欧尼，或者说是圣城$c_ife$的传统统治者。生活在尼日尔河三角洲及周边地区的人对他给予了极大的尊重，因为这里的许多人把$c_ife$视为世俗和精神力量的传奇之源。$RICE_niger_delta_ife_effects$"
 RICE_niger_delta_bronze_caster_guild_modifier:0 "皇家铜铸行会"
 RICE_niger_delta_bronze_caster_guild_modifier_desc:0 "这个家族领土上的青铜工坊，通过家族关系和网络相互联系，在这个家族的赞助下，被组织成正式的行会。他们听从这个家族的召唤，在互惠互利的安排下，创造出美丽的青铜艺术品。\n\n#EMP 解锁[dynasty|E]（其[culture|E]具有$tradition_RICE_kinship_based_craft_guilds_name$或者$tradition_RICE_ritual_hegemony_name$[traditions|E]，且满足其他要求）的任何[landed|E][rulers|E]在采取[niger_delta_craft_guilds|E][decision|E]委托艺术品时，能够制作#bold 青铜#![artifacts|E]#!"
 RICE_niger_delta_ironsmith_guild_modifier:0 "皇家铁匠行会"
 RICE_niger_delta_ironsmith_guild_modifier_desc:0 "这个家族领土上的铁匠们，通过家族关系和网络相互联系，在这个家族的赞助下，被组织成正式的行会。他们听从这个家族的召唤，在互惠互利的安排下，创造出美丽的铁艺术品。\n\n#EMP 解锁[dynasty|E]（其[culture|E]具有$tradition_RICE_kinship_based_craft_guilds_name$或者$tradition_RICE_ritual_hegemony_name$[traditions|E]，且满足其他要求）的任何[landed|E][rulers|E]在采取[niger_delta_craft_guilds|E][decision|E]委托艺术品时，能够制作#bold 铁#![artifacts|E]#!"
 RICE_niger_delta_ivory_and_wood_carver_guild_modifier:0 "皇家象牙和木雕师行会"
 RICE_niger_delta_ivory_and_wood_carver_guild_modifier_desc:0 "这个家族领土上的象牙和木雕工匠，通过家族关系和网络相互联系，在这个家族的赞助下，被组织成正式的行会。他们听从这个家族的召唤，在互惠互利的安排下，创造出美丽的象牙和木雕艺术品。\n\n#EMP 解锁[dynasty|E]（其[culture|E]具有$tradition_RICE_kinship_based_craft_guilds_name$或者$tradition_RICE_ritual_hegemony_name$[traditions|E]，且满足其他要求）的任何[landed|E][rulers|E]在采取[niger_delta_craft_guilds|E][decision|E]委托艺术品时，能够制作#bold 象牙和木雕#![artifacts|E]#!"
 RICE_niger_delta_bead_maker_guild_modifier:0 "皇家制珠行会"
 RICE_niger_delta_bead_maker_guild_modifier_desc:0 "这个家族领土上的制珠工匠，通过家族关系和网络相互联系，在这个家族的赞助下，被组织成正式的行会。他们听从这个家族的召唤，在互惠互利的安排下，创造出美丽的珠子艺术品。\n\n#EMP 解锁[dynasty|E]（其[culture|E]具有$tradition_RICE_kinship_based_craft_guilds_name$或者$tradition_RICE_ritual_hegemony_name$[traditions|E]，且满足其他要求）的任何[landed|E][rulers|E]在采取[niger_delta_craft_guilds|E][decision|E]委托艺术品时，能够制作#bold 珠子#![artifacts|E]#!"
 RICE_niger_delta_opinion_choose_new_yam_date:0 "向我咨询新山药节日期"
 RICE_niger_delta_successful_new_yam_festival:0 "成功举办新山药节"
 RICE_niger_delta_successful_new_yam_festival_desc:0 "这个伯爵领最近庆祝了一个重要的新山药节，这是该地区的一个传统的年度节日。当地人认为，这个节日进行得非常顺利，取悦了上天，确保了丰收。"
 RICE_niger_delta_opinion_spared_me_from_execution:0 "让我免于被处决"
 RICE_niger_delta_opinion_spared_me_from_punishment:0 "让我免于惩罚"
 RICE_niger_delta_kola_nut_one_lobe:0 "哑果（Oji Ogbi）"
 RICE_niger_delta_kola_nut_one_lobe_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有一道裂痕。这种被称为#italic Oji Ogbi#!，或哑果，哑果被视为一种可憎的东西，不适合人类食用，只适合上天。虽然该角色尽快丢弃了它，但还是有些许影响。"
 RICE_niger_delta_kola_nut_two_lobes:0 "神经可乐果（Oji Gworo）"
 RICE_niger_delta_kola_nut_two_lobes_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有两道裂痕。这种被#italic Oji Gworoi#!，或神经可乐果，在当地数字二缺乏平衡，这样的可乐果属于不正常的。虽然这个人物丢弃了它，但它显然是一个坏兆头。"
 RICE_niger_delta_kola_nut_three_lobes:0 "英勇可乐果(Oji Ikenga)"
 RICE_niger_delta_kola_nut_three_lobes_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有三道裂痕。这种被称为#italic Oji Ikengai#!，或英勇可乐果，在当地这样的可乐果被视为具有阳刚之气，体现了勇敢。因此该角色的勇气和力量得到上天的证明。"
 RICE_niger_delta_kola_nut_four_lobes:0 "和平与祝福可乐果（Oji Udo na Ngozi）"
 RICE_niger_delta_kola_nut_four_lobes_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有四道裂痕。这种被称为#italic Oji Udo na Ngozi#!，或和平与祝福可乐果，在当地四是一个神圣的、好的数字，这样的可乐果被视为能带来和平。因此该角色的团结得到上天的证明。"
 RICE_niger_delta_kola_nut_five_lobes:0 "繁荣可乐果（Oji Omumu）"
 RICE_niger_delta_kola_nut_five_lobes_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有五道裂痕。这种被称为#italic Oji Omumu#!，或繁荣可乐果，在当地这样的可乐果很罕见，象征着丰收以及财富还有强大的生育能力。这是该角色的一个好兆头。"
 RICE_niger_delta_kola_nut_six_lobes:0 "祖先可乐果(Oji Ogbugbandu)"
 RICE_niger_delta_kola_nut_six_lobes_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有六道裂痕。这种被称为#italic Oji Ogbugbandu#!，或祖先可乐果，在当地这样的可乐果极其罕见，象征着丰神与人之间的特殊约定。预示着该角色的生活会有巨大的繁荣和成功。"
 RICE_niger_delta_kola_nut_seven_lobes:0 "永恒可乐果（Oji Asaa‑Asota）"
 RICE_niger_delta_kola_nut_seven_lobes_desc:0 "在最近的一次仪式上，该角色掰开的第一个可乐果有七道裂痕。这种被称为#italic Oji Asaa‑Asota#!，或永恒可乐果，在当地这样的可乐果基本不可能出现，象征着许多东西，如庆祝、法律、皇室、预言、现实和永恒，被认为具有魔力。因此对该角色来说，它是一种无法衡量的财富标志。"
 RICE_niger_delta_ate_yams_early:0 "在新山药节前吃了山药"
 RICE_niger_delta_ate_yams_early_desc:0 "该角色在新山药节前吃新鲜山药时被发现。很少有人敢打破这样的禁忌，但该角色不是不在乎，就是太想吃山药了。"
 RICE_niger_delta_opinion_fair_punishment_but_still_annoyed:0 "公正的惩罚，但仍然很恼火"
 RICE_niger_delta_opinion_declared_yam_crime:0 "宣布我是罪犯，因为我犯了新山药节的禁忌"
 RICE_niger_delta_opinion_broke_yam_taboo:0 "打破吃山药禁忌"
 RICE_niger_delta_opinion_broke_yam_taboo_not_criminal:0 "打破吃山药禁忌"
 RICE_niger_delta_yam_festival_party_pooper:0 "在新山药节上禁止狂野行为"
 RICE_niger_delta_new_yam_festival_herbs:0 "新山药节上的药材"
 RICE_niger_delta_yam_king:0 "山药王"
 RICE_niger_delta_yam_king_desc:0 "该角色原本是一个熟练的（或难以置信的幸运）山药农民，曾在新山药节上被加冕为山药国王。"
 RICE_niger_delta_attended_olojo_festival:0 "最近参加了在$c_ife$举办的黎明节"
 RICE_niger_delta_olojo_ooni_renewed_oaths_1:0 "重新作为欧尼宣誓（合适）"
 RICE_niger_delta_olojo_ooni_renewed_oaths_1_desc:0 "这个欧尼刚刚在黎明节期间重新宣誓。许多人认为这位欧尼在节日期间履行了令人满意的职责。"
 RICE_niger_delta_olojo_ooni_renewed_oaths_2:0 "重新作为欧尼宣誓（伟大）"
 RICE_niger_delta_olojo_ooni_renewed_oaths_2_desc:0 "这个欧尼刚刚在黎明节期间重新宣誓。许多人认为这位欧尼在节日期间出色地履行了职责，保证世界将受到祖先和精神的祝福。"
 RICE_niger_delta_olojo_ooni_renewed_oaths_3:0 "重新作为欧尼宣誓（不可思议）"
 RICE_niger_delta_olojo_ooni_renewed_oaths_3_desc:0 "这个欧尼刚刚在黎明节期间重新宣誓。许多人认为这个欧尼在节日期间非常出色地履行了他的职责，这样做不仅获得了祖先和精神的认可，也预示着一个更大的和平时期 和整个土地的繁荣……"
 RICE_niger_delta_olojo_good_health:0 "欧尼的祝福（身体健康）"
 RICE_niger_delta_olojo_good_health_desc:0 "该角色在黎明节期间获得欧尼的祝福。"
 RICE_niger_delta_olojo_good_fortune:0 "欧尼的祝福（好运）"
 RICE_niger_delta_olojo_good_fortune_desc:0 "该角色在黎明节期间获得欧尼的祝福。"
 RICE_niger_delta_olojo_good_enemies:0 "欧尼的祝福（敌人被诅咒）"
 RICE_niger_delta_olojo_good_enemies_desc:0 "该角色在黎明节期间收到了欧尼的祝福，让其敌人不幸。"
 RICE_restored_ooni_opinion:0 "在$c_ife$恢复欧尼"
 RICE_niger_delta_opinion_good_ooni_gift:0 "给了我一份好的、合适的珠冠仪式的礼物"
 RICE_niger_delta_opinion_bad_ooni_gift:0 "给我的珠冠仪式的礼物有问题"
 RICE_niger_delta_opinion_insulting_gift:0 "试图给我一个侮辱性的礼物，让我参加珠冠仪式"
 RICE_niger_delta_opinion_chastised_me:0 "斥责我没有做好工作"
 RICE_niger_delta_opinion_didnt_do_job:0 "在处理国家事务时，没有集中精力"
 RICE_niger_delta_opinion_fun_chat:0 "趣味聊天"
 RICE_niger_delta_shared_elephant_meat:0 "与当地村民分享大象肉"
 RICE_niger_delta_glassmaking_industry_good:0 "在$c_ife$繁荣的玻璃制造业"
 RICE_niger_delta_regularly_chews_kola_nuts:0 "勤于定期咀嚼可乐果"
 RICE_niger_delta_request_beaded_crown:0 "请求欧尼加冕"
 RICE_niger_delta_request_beaded_crown_tooltip:0 "$c_ife$的欧尼可以赐予我一个[beaded_crown|E]"
 RICE_niger_delta_request_beaded_crown_desc:0 "$c_ife$的欧尼被[GetGeographicalRegion('RICE_yorubaland_region').GetName]甚至更远地方的人民认为是最伟大的世俗和精神权威。为了赢得臣民的尊重并使我的统治合法化，我必须向欧尼请求奥杜杜瓦的[beaded_crown|E]来加冕，如果我的请求得到批准，我将前往$c_ife$接受它。"
 RICE_niger_delta_request_beaded_crown_effect_tooltip:0 "如果欧尼认为你的礼物诚意足够，他们会给你一个[beaded_crown|E]并且你会收到适当的祝福（如果有的话）"
 RICE_niger_delta_request_beaded_crown_confirm:0 "把我的礼物送给欧尼！"
 RICE_niger_delta_request_beaded_crown_context_tooltip:0 "$RICE_restore_ooni_decision_context_tooltip$"
 RICE_not_received_beaded_crown_req:0 "尚未收到来自[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]的[beaded_crown|E]"
 RICE_niger_delta_pick_a_ooni_gift_type:0 "为欧尼选一个礼物"
 RICE_niger_delta_pick_a_ooni_gift_type_gui:0 "挑选礼物送给欧尼"
 RICE_niger_delta_modest_sacrifice_option:0 "#Bold 适度的奉献#!"
 RICE_niger_delta_modest_sacrifice_option_desc:0 "以欧尼的名义做出适度的奉献"
 RICE_niger_delta_modest_sacrifice_option_tooltip:0 "$EFFECT_LIST_BULLET$花费#V [gold_i]50#!以欧尼的名义做出适度的奉献\n$EFFECT_LIST_BULLET$这是基本选项，没有其他好处"
 RICE_niger_delta_gift_gold_oduduwa_shrine_option:0 "#Bold 向奥杜杜瓦神殿捐款#!"
 RICE_niger_delta_gift_gold_oduduwa_shrine_option_desc:0 "向伟大的$c_ife$奥杜杜瓦神殿捐赠！"
 RICE_niger_delta_gift_gold_oduduwa_shrine_option_tooltip:0 "$EFFECT_LIST_BULLET$向$c_ife$奥杜杜瓦神殿捐赠#V [gold_i]100#!\n$EFFECT_LIST_BULLET$获得#V [piety_i]200#!\n$EFFECT_LIST_BULLET$欧尼获得#V [piety_i]200#!"
 RICE_niger_delta_sacred_vow_option:0 "#Bold 神圣誓言#!"
 RICE_niger_delta_sacred_vow_option_desc:0 "许下神圣的誓言以协助欧尼"
 RICE_niger_delta_sacred_vow_option_tooltip:0 "$EFFECT_LIST_BULLET$欧尼会在你身上获得[strong_hook|E]\n$EFFECT_LIST_BULLET$失去#V [prestige_i]100#!"
 RICE_niger_delta_art_gift_option:0 "#Bold 珍贵的艺术品#!"
 RICE_niger_delta_art_gift_option_desc:0 "赠送欧尼一些由你的[niger_delta_craft_guilds|E]制作的精美艺术品"
 RICE_niger_delta_art_gift_option_tooltip:0 "$EFFECT_LIST_BULLET$花费#V [gold_i]100#!向欧尼赠送一些由你[niger_delta_craft_guilds|E]制作的精美艺术品\n$EFFECT_LIST_BULLET$获得#V [prestige_i]200#!\n$EFFECT_LIST_BULLET$欧尼获得#V [prestige_i]200#!"
 RICE_niger_delta_land_option:0 "#Bold 欧尼家族的土地#!"
 RICE_niger_delta_land_option_desc:0 "将一个[county|E]给予欧尼[family_member|E]"
 RICE_niger_delta_land_option_tooltip:0 "$EFFECT_LIST_BULLET$欧尼的[dynasty|E]的随机[family_member|E]会获得#bold 随机个#![county|E]（从你的直辖中给予）\n$EFFECT_LIST_BULLET$如果你拥有[duke|E]以上[title_tier|E]，欧尼亲戚将成为你的[vassal|E]"
 RICE_niger_delta_low_concubine_option:0 "#Bold 配偶#!"
 RICE_niger_delta_low_concubine_option_desc:0 "送给欧尼一个[concubine|E]"
 RICE_niger_delta_low_concubine_option_tooltip:0 "$EFFECT_LIST_BULLET$花费#V [gold_i]100#!寻找愿意作为[concubine|E]献给欧尼的人\n$EFFECT_LIST_BULLET$获得#V [prestige_i]100#!和#V [piety_i]100#!"
 RICE_niger_delta_high_concubine_option:0 "#Bold 高贵妃子#!"
 RICE_niger_delta_high_concubine_option_desc:0 "给欧尼一个[family_member|E]作为他们的[concubine|E]或[spouse|E]"
 RICE_niger_delta_high_concubine_option_tooltip:0 "$EFFECT_LIST_BULLET$在你的[court|E]中随机选择一个合适性别的[family_member|E]作为[concubine|E]或[spouse|E]加入欧尼的家庭\n$EFFECT_LIST_BULLET$获得 #V [prestige_i]100#!和#V [piety_i]100#!"
 RICE_niger_delta_no_gift_option:0 "#Bold 没有礼物#!"
 RICE_niger_delta_no_gift_option_desc:0 "不给欧尼礼物"
 RICE_niger_delta_no_gift_option_tooltip:0 "$EFFECT_LIST_BULLET$你决定不给欧尼任何礼物\n$EFFECT_LIST_BULLET$失去#V [prestige_i]200#!和#V [piety_i]200#!\n$EFFECT_LIST_BULLET$#X #bold 不要这么做#!因为你这样做肯定会激怒欧尼并引起一些不好的后果！#!"
 RICE_niger_delta_commission_art_from_craft_guilds:0 "从工匠行会委托艺术品"
 RICE_niger_delta_commission_art_from_craft_guilds_tooltip:0 "我对皇家[niger_delta_craft_guilds|E]拥有很大的管理权，那么——他们能为我做什么？"
 RICE_niger_delta_commission_art_from_craft_guilds_desc:0 "[ROOT.Char.GetDynasty.GetName][dynasty|E]有几个以氏族为单位的皇家[niger_delta_craft_guilds|E]为我们服务。作为[ROOT.Char.GetTitleAsNameNoTooltip]，我可以委托他们制作一些东西来向他人展示我的地位和权力。"
 RICE_niger_delta_commission_art_from_craft_guilds_effect_tooltip_1:0 "你将获得不同品质的[artifact|E]，具体取决于你委托的[niger_delta_craft_guild|E]。"
 RICE_niger_delta_pick_a_guild_type:0 "选择一个委托的行会"
 RICE_niger_delta_pick_a_guild_type_gui:0 "选择一个你想委托艺术品的[niger_delta_craft_guild|E]"
 RICE_niger_delta_commission_art_from_craft_guilds_confirm:0 "通知手工艺行会！"
 RICE_niger_delta_commission_art_from_craft_guilds_context_tooltip:0 "#emphasis 历史背景：#!尼日利亚的历史文明以其艺术而闻名，比如贝宁的青铜器或者约鲁巴的珠饰王冠，这些艺术品有时在讨论这些文化时会受到过分的关注，甚至在学术界也是如此。制作这些艺术品的工匠通常是在这个地区的王室下属的正式行会组织的；这增强了王室的威望和对资源的控制，同时也让工匠获得了更大的政治权力和影响力。"
 RICE_niger_delta_bronze_casters_option:0 "#Bold 青铜工匠#!"
 RICE_niger_delta_bronze_casters_option_desc:0 "青铜工匠使用失蜡法制作青铜艺术品"
 RICE_niger_delta_bronze_casters_option_tooltip:0 "$EFFECT_LIST_BULLET$#Bold 至少花费：@gold_icon!100#!\n$EFFECT_LIST_BULLET$比其他类型的艺术品提供更多的[piety|E]\n$EFFECT_LIST_BULLET$[artifacts|E]提高[learning|E]"
 RICE_niger_delta_ivory_and_wood_carvers_option:0 "#Bold 象牙和木材雕刻工匠#!"
 RICE_niger_delta_ivory_and_wood_carvers_option_desc:0 "象牙和木雕是两种紧密相连的技艺"
 RICE_niger_delta_ivory_and_wood_carvers_option_tooltip:0 "$EFFECT_LIST_BULLET$#Bold 最低花费：@gold_icon!50#!\n$EFFECT_LIST_BULLET$在获得[piety|E]、[prestige|E]和[dynasty_prestige|E]方面，不如其他类型的艺术品，但它便宜。\n$EFFECT_LIST_BULLET$象牙[artifacts|E]会提高[martial|E]，而木头[artifacts|E]会提高[intrigue|E]"
 RICE_niger_delta_beadmakers_option:0 "#Bold 串珠师#!"
 RICE_niger_delta_beadmakers_option_desc:0 "由玻璃或珊瑚制成的美丽珠子是权力和影响力的真正标志。"
 RICE_niger_delta_beadmakers_option_tooltip:0 "$EFFECT_LIST_BULLET$#Bold 最低花费：@gold_icon!125#!\n$EFFECT_LIST_BULLET$与其他类型的艺术品不同，它会让你获得[dynasty_prestige|E]\n$EFFECT_LIST_BULLET$珠子[artifacts|E]将由玻璃制成，但在沿海地区，它们将由珊瑚制成。\n$EFFECT_LIST_BULLET$[artifacts|E]提高[diplomacy|E]"
 RICE_niger_delta_ironsmiths_option:0 "#Bold 铁器#!"
 RICE_niger_delta_ironsmiths_option_desc:0 "铁的用途不仅仅是用于武器或工具，它还可以用于艺术。"
 RICE_niger_delta_ironsmiths_option_tooltip:0 "$EFFECT_LIST_BULLET$#Bold 至少花费：@gold_icon!100#!\n$EFFECT_LIST_BULLET$比其他类型的艺术品，提供更多的[prestige|E]\n$EFFECT_LIST_BULLET$[artifacts|E]提高[stewardship|E]"
 RICE_niger_delta_currently_commissioning_artwork_req:0 "[niger_delta_craft_guilds|E]目前没有代表你进行委托工作。"
 RICE_niger_delta_form_craft_guilds:0 "组织一个以氏族为单位的手工业行会"
 RICE_niger_delta_form_craft_guilds_tooltip:0 "我对皇家[niger_delta_craft_guilds|E]拥有很大的管理权，那么——他们能为我做什么？"
 RICE_niger_delta_form_craft_guilds_desc:0 "[ROOT.Char.GetDynasty.GetName][dynasty|E]很伟大，但是还不够伟大。为了彰显我们的力量，我们应该把生活在我们领土上的工匠组织起来，形成皇家[niger_delta_craft_guilds|E]。通过将他们原有的社会网络纳入我们的政治结构，这样我们双方都将受益。"
 RICE_niger_delta_form_craft_guilds_effect_tooltip_1:0 "你的[dynasty|E]将获得一个[modifier|E]，这取决于你组织的[niger_delta_craft_guild|E]的类型，这也将允许你采取相对应的[decision|E]，通过$RICE_niger_delta_commission_art_from_craft_guilds$来获得[artifacts|E]和其他奖励。"
 RICE_niger_delta_pick_a_guild_to_form_type:0 "选择一个行会来组建"
 RICE_niger_delta_pick_a_guild_to_form_type_gui:0 "选择一个[niger_delta_craft_guild|E]，并在你的[dynasty|E]庇护下组织起来。"
 RICE_niger_delta_form_craft_guilds_confirm:0 "为了我们宗族的荣耀!"
 RICE_niger_delta_form_craft_guilds_context_tooltip:0 "$RICE_niger_delta_commission_art_from_craft_guilds_context_tooltip$"
 RICE_niger_delta_form_bronze_casters_option:0 "#Bold 青铜工匠#!"
 RICE_niger_delta_form_bronze_casters_option_desc:0 "$RICE_niger_delta_bronze_casters_option_desc$"
 RICE_niger_delta_form_bronze_casters_option_tooltip:0 "$EFFECT_LIST_BULLET$[dynasty|E]将获得[GetModifier('RICE_niger_delta_bronze_caster_guild_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$这个[dynasty|E]的所有[landed|E][rulers|E]都可以解锁委托[niger_delta_craft_guilds|E]制造#bold 青铜#![artifacts|E]的[decision|E]\n$EFFECT_LIST_BULLET$青铜艺术品往往可以比其他类型的艺术品获得更多的[piety|E]\n\n#X 此选项仅在你的[culture|E]有$innovation_lost_wax_casting$[innovation|E]才可以用#!"
 RICE_niger_delta_form_ivory_and_wood_carvers_option:0 "#Bold 象牙和木材雕刻工匠#!"
 RICE_niger_delta_form_ivory_and_wood_carvers_option_desc:0 "$RICE_niger_delta_ivory_and_wood_carvers_option_desc$"
 RICE_niger_delta_form_ivory_and_wood_carvers_option_tooltip:0 "$EFFECT_LIST_BULLET$[dynasty|E]将获得[GetModifier('RICE_niger_delta_ivory_and_wood_carver_guild_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$这个[dynasty|E]的所有[landed|E][rulers|E]都可以解锁委托[niger_delta_craft_guilds|E]制造#bold 象牙和木雕#![artifacts|E]的[decision|E]\n$EFFECT_LIST_BULLET$象牙和木雕艺术品虽然奖励效果不如其他类型的艺术品，但它便宜。"
 RICE_niger_delta_form_beadmakers_option:0 "#Bold 串珠师#!"
 RICE_niger_delta_form_beadmakers_option_desc:0 "$RICE_niger_delta_beadmakers_option_desc$"
 RICE_niger_delta_form_beadmakers_option_tooltip:0 "$EFFECT_LIST_BULLET$[dynasty|E]将获得[GetModifier('RICE_niger_delta_bead_maker_guild_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$这个[dynasty|E]的所有[landed|E][rulers|E]都可以解锁委托[niger_delta_craft_guilds|E]制造#bold 玻璃珠或珊瑚珠#![artifacts|E]的[decision|E]（只要满足其他要求）\n$EFFECT_LIST_BULLET$玻璃或珊瑚珠艺术比其他类型的艺术品，它可以获得更多的[dynasty_prestige|E]。\n\n#X 只有你的[title_tier|E]是[king|E]或者[emperor|E]时或者你拥有[GetTitleByKey('c_ife').GetName]或者[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]，才可以使用此选项。#!"
 RICE_niger_delta_form_ironsmiths_option:0 "#Bold 铁器#!"
 RICE_niger_delta_form_ironsmiths_option_desc:0 "$RICE_niger_delta_ironsmiths_option_desc$"
 RICE_niger_delta_form_ironsmiths_option_tooltip:0 "$EFFECT_LIST_BULLET$[dynasty|E]将获得[GetModifier('RICE_niger_delta_ironsmith_guild_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$这个[dynasty|E]的所有[landed|E][rulers|E]都可以解锁委托[niger_delta_craft_guilds|E]制造#bold 铁器#![artifacts|E]的[decision|E]（只要满足其他要求）\n$EFFECT_LIST_BULLET$铁器艺术比其他类型的艺术品，它可以获得更多的[prestige|E]。\n\n#X 这个选项只有在你有$prestige_level_3$[prestige_level|E]才可以使用#!"
 RICE_niger_delta_celebrate_new_yam_festival:0 "庆祝新山药节"
 RICE_niger_delta_celebrate_new_yam_festival_tooltip:0 "第一批山药的收成很快就会到来……"
 RICE_niger_delta_celebrate_new_yam_festival_desc:0 "几个世纪以来，山药一直是[ROOT.Char.GetCulture.GetCollectiveNoun]和其他源自大西洋海岸的西非人民的重要食物来源。随着山药收成的到来，我应该准备一个盛大的新山药节，并感谢[ROOT.Char.GetFaith.FertilityGodName]带来的丰收。"
 RICE_niger_delta_celebrate_new_yam_festival_effect_tooltip_1:0 "你将获得[prestige|E]、[piety|E]，以及潜在的各种正面的[character_modifiers|E]。"
 RICE_niger_delta_celebrate_new_yam_festival_effect_tooltip_2:0 "到节日结束时，你拥有的每一个[county|E]都有机会获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]"
 RICE_niger_delta_celebrate_new_yam_festival_confirm:0 "这是收获季！"
 RICE_niger_delta_celebrate_new_yam_festival_context_tooltip:0 "#emphasis 历史背景：#!新山药节是非洲许多社会的一种年度活动，它发生在所谓的“山药区”，这个区域横跨西非的大部分森林和沿海地区，那里山药传统上是主要的农作物。虽然节日的具体内容因文化而异，但它们都可以被看作是一种欢乐而又社会和宗教的仪式，它标志着山药收获的开始，同时加强了社区的联系和传统。"
 RICE_decision_new_yam_month_req:0 "月份是七月、八月或九月"
 RICE_niger_delta_partake_olojo_festival:0 "参加黎明节"
 RICE_niger_delta_partake_olojo_festival_tooltip:0 "让我们在$c_ife$中庆祝吧!"
 RICE_niger_delta_partake_olojo_festival_desc:0 "几个世纪以来，黎明节一直在人类的摇篮$c_ife$里举行。这个节日与该地区的历史、神话和文化息息相关，所有[ROOT.Char.GetFaith.GetReligion.GetName]的精神领袖和世俗$c_ife$领袖欧尼重新宣誓并并向[ROOT.Char.GetFaith.PantheonTerm]，尤其是奥贡献祭的时刻，我应该参加今年的活动。"
 RICE_niger_delta_partake_olojo_festival_effect_tooltip_1:0 "你可能获得[piety|E]和可能的其他好处。"
 RICE_niger_delta_partake_olojo_festival_effect_tooltip_2:0 "在黎明节期间，你可以加入人群，向持有[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]的欧尼祈求各种祝福"
 RICE_niger_delta_partake_olojo_festival_effect_tooltip_3:0 "作为[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]的欧尼，你将在节日期间承担独特的责任，需要在活动前自我隔离，但你会获得额外的[piety|E]，[prestige|E]，甚至可能是特殊的[character_modifiers|E]"
 RICE_niger_delta_partake_olojo_festival_confirm:0 "让我们为节日做准备吧!"
 RICE_niger_delta_partake_olojo_festival_context_tooltip:0 "#emphasis 历史背景：#!黎明节是尼日利亚伊费（或伊莱‑伊费）庆祝的最重要的年度节日之一。它有许多宗教、文化和政治的功能，特别是与伊费的传统统治者，所谓的欧尼有关。传说这个节日是由第三任欧尼，奥贡发起的。"
 RICE_niger_delta_offer_kola_nuts:0 "向[ROOT.Char.GetFaith.HighGodName]提供可乐果"
 RICE_niger_delta_offer_kola_nuts_tooltip:0 "让我们将[kola_nuts|E]献给[ROOT.Char.GetFaith.HighGodName]"
 RICE_niger_delta_offer_kola_nuts_desc.religion:0 "在[ROOT.Char.GetFaith.GetAdherentNamePlural]中，[kola_nuts|E]被尊为#italic 伊格贝克#!哲学的象征，即与这个世界的联系。此外，据说它们可以帮助一个先知了解未来。我应该向[ROOT.Char.GetFaith.HighGodName]献祭[kola_nuts|E]。"
 RICE_niger_delta_offer_kola_nuts_desc.culture:0 "在[ROOT.Char.GetCulture.GetCollectiveNoun]中，[kola_nuts|E]被尊为#italic 伊格贝克#!，即万物相互关联。此外据说它们可以帮助一个先知了解未来。我应该向[ROOT.Char.GetFaith.HighGodName]献祭[kola_nuts|E]。"
 RICE_niger_delta_offer_kola_nuts_confirm:0 "准备可乐果！"
 RICE_niger_delta_offer_kola_nuts_tt:0 "你获得[piety|E]和[character_modifier|E]取决于你提供的第一个[kola_nut|E]有多少裂痕"
 RICE_niger_delta_offer_kola_nuts.one:0 "一道裂痕"
 RICE_niger_delta_offer_kola_nuts.two:0 "两道裂痕"
 RICE_niger_delta_offer_kola_nuts.three:0 "三道裂痕"
 RICE_niger_delta_offer_kola_nuts.four:0 "四道裂痕"
 RICE_niger_delta_offer_kola_nuts.five:0 "五道裂痕"
 RICE_niger_delta_offer_kola_nuts.six:0 "六道裂痕"
 RICE_niger_delta_offer_kola_nuts.seven:0 "七道裂痕"
 RICE_niger_delta_offer_kola_nuts_context_tooltip:0 "#emphasis 历史背景：#!可乐果在非洲很重要，用来欢迎客人，进行占卜等等。可乐果也许最受伊博人的敬重，他们把它看作是#italic 伊格贝克（Igwebuike）#!哲学的象征。这种哲学强调相互联系和互惠，他们在许多不同的社会和宗教场合使用它。当可乐果被掰开时，裂痕的数量有象征意义；虽然该地区的每个文化都有自己的解释，但这里的描绘是基于伊博文化的。"
 RICE_restore_ooni_decision:0 "恢复 $d_ooni_of_ife$"
 RICE_restore_ooni_decision_desc:0 "$c_ife$城，根据[ROOT.Char.GetFaith.GetReligion.GetAdjective]神话，是人类的神圣家园，已经太久没有合适的统治者。欧尼的传统必须恢复。"
 RICE_restore_ooni_decision_tooltip:1 "你将成为$c_ife$的欧尼"
 RICE_restore_ooni_decision_effect_tooltip:1 "你将成为$c_ife$的欧尼"
 RICE_restore_ooni_decision_confirm:0 "欧尼回归 $c_ife$！"
 RICE_restore_ooni_decision_context_tooltip:0 "#emphasis 历史背景：#!伊费被约鲁巴人视为人类的摇篮。伊费（或伊莱‑伊费）的统治者，称为欧尼，因此拥有巨大的宗教和世俗权威。早期现代时期的葡萄牙文献也把欧尼比作教宗，而约鲁巴传说中最早的欧尼之一，奥杜杜瓦，后来成为了约鲁巴地区和贝宁许多王室的传奇祖先。该地区的统治者通常会前往伊菲，由欧尼用奥杜杜瓦的王冠正式加冕。"
 RICE_niger_delta_restore_ooni_to_ife:0 "将$c_ife$的控制权交给欧尼"
 RICE_niger_delta_restore_ooni_to_ife_confirm:0 "让我们欢迎欧尼回到 $c_ife$！"
 RICE_niger_delta_restore_ooni_to_ife_desc:0 "虽然我控制着$c_ife$，但它真正的统治者是欧尼，即[ROOT.Char.GetFaith.GetReligion.GetAdjective]的精神领袖。他们应该统治圣城，而不是我。"
 RICE_niger_delta_restore_ooni_to_ife_tooltip:0 "欧尼将重新夺回$c_ife$。"
 RICE_ife_held_by_you_or_vassal_tt:0 "$c_ife$必须由你或[vassal|E]持有"
 RICE_ife_is_capital:0 "$c_ife$不是你的[realm_capital|E]"
