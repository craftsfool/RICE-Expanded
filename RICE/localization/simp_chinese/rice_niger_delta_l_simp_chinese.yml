 niger_delta.0020.t.a:0 "青铜铸工行会"
 niger_delta.0020.t.b:0 "铁匠行会"
 niger_delta.0020.t.c:0 "象牙木雕行会"
 niger_delta.0020.t.d:0 "制珠行会"
 niger_delta.0020.desc.intro.dynasty_head:0 "作为[organizer.GetPrimaryTitle.GetName]的[organizer.GetTitleAsNameNoTooltip]和我的[organizer.GetDynasty.GetName]氏族的负责人，我与居住在我们领土上的许多工匠有联系，我们经常与之合作。但是我相信他们可以在我们的指导下最大程度地发挥他们的潜力。\n\n因此我认为将他们组织起来是明智之举。"
 niger_delta.0020.desc.intro.dynasty_other:0 "有许多工匠生活在[organizer.GetDynasty.GetName]所统治的领土上。然而宗族族长[organizer.GetTitledFirstName]认为，在我们宗族的指导下，我们可以最大程度地发挥他们的潜力。\n\n这就是为什么[organizer.GetSheHe]最近决定组织他们的原因 "
 niger_delta.0020.desc.bronze_casters:0 "在我们的领土上，在我们宗族的赞助下，#bold 青铜工匠#!形成了一个正式的、有组织的行会系统。他们使用失蜡法创造出精美的青铜雕塑和工艺品，这些作品在[organizer.GetCulture.GetName]社会中往往具有政治和宗教意义，特别是描绘神灵、祖先和重要领袖的青铜头像。"
 niger_delta.0020.desc.ironsmiths:0 "在我们的领土上，在我们宗族的赞助下，#bold 铁匠#!形成了一个正式的、有组织的行会系统。铁在非洲的许多地方被广泛使用，但在这里，在[organizer.GetCulture.GetCollectiveNoun]中，我们将确保这种铁不仅仅是强大的武器和日常工具。它还可以变成艺术品，雕塑，皇家御用工具，以及激发人内心恐惧的东西。"
 niger_delta.0020.desc.ivory_and_wood_carvers:0 "在我们的领土上，在我们宗族的赞助下，#bold 象牙和木雕匠#!形成了一个正式的、有组织的行会系统。对于[organizer.GetCulture.GetCollectiveNoun]来说，象牙和木雕紧密相连，因为许多木雕师也接受过象牙雕刻师的培训，反之亦然。这些工匠使用当地狩猎行会杀死的大象的象牙或森林地区丰富的木材制作精美的艺术品，供精英和平民使用。"
 niger_delta.0020.desc.beadmakers:0 "在我们的领土上，在我们宗族的赞助下，#bold 串珠师#!形成了一个正式的、有组织的行会系统。在[organizer.GetCulture.GetCollectiveNoun]非常强调珠子作为权力和地位的象征，例如在珠冠或珠宝的生产中。珠子通常由非洲一些最大的玻璃工坊生产的玻璃制成，或者在沿海地区，通常由红珊瑚制成。"
 niger_delta.0020.desc.conclusion:0 "\n\n有一个有组织的行会系统对双方都有好处。工匠与我们的关系稳定，我们的政治权力增加，而我们可以更好地管理甚至从当地工业中获利，并赞助他们的艺术以提高我们宗族的地位。"
 niger_delta.0020.a:0 "我们的宗族日益壮大。"
 niger_delta.0021.t:0 "从行会委托"
 niger_delta.0021.desc.intro:0 "作为一个[patron.GetTitleAsNameNoTooltip]，我与我们伟大的[patron.GetDynasty.GetName]宗族组织的一些工艺行会有联系。我们定期向这些行会委托制作艺术品，作为回报，他们有稳定的工作机会和一定的政治话语权。\n\n今天我决定委托一些青铜艺术作品"
 niger_delta.0021.desc.bronze:0 "#bold 青铜工匠#!。他们使用失蜡法创造出精美的青铜雕塑和工艺品，这些作品在[patron.GetCulture.GetName]社会中往往具有政治和宗教意义，特别是描绘神灵、祖先和重要领袖的铜像。"
 niger_delta.0021.desc.iron:0 "#bold 铁匠#!。铁在非洲的许多地方被广泛使用，但在这里，在[patron.GetCulture.GetCollectiveNoun]中，我们将确保这种铁不仅仅是强大的武器和日常工具。它还可以变成艺术品，雕塑，皇家御用工具，以及激发人内心恐惧的东西。"
 niger_delta.0021.desc.ivory_or_wood:0 "#bold 象牙和木雕匠#!。对于[patron.GetCulture.GetCollectiveNoun]来说，象牙和木雕紧密相连，因为许多木雕师也接受过象牙雕刻师的培训，反之亦然。这些工匠使用当地狩猎行会杀死的大象的象牙或森林地区丰富的木材制作精美的艺术品，供精英和平民使用。"
 niger_delta.0021.desc.glass:0 "#bold 串珠师#!。在[patron.GetCulture.GetCollectiveNoun]中，非常强调珠子作为权力和地位的象征，例如在珠冠或珠宝的生产中。珠子通常由非洲一些最大的玻璃工坊生产的玻璃制成，或者在沿海地区，通常由红珊瑚制成。"
 niger_delta.0021.desc.coral:0 "#bold 串珠师#!。在[patron.GetCulture.GetCollectiveNoun]中，非常强调珠子作为权力和地位的象征，由于我的首都靠近海岸，我的串珠师可以用红珊瑚制作物品。"
 niger_delta.0021.desc.conclusion:0 "既然我已经提出了正式要求，那么就等着看这些工匠们的能力，以及他们的劳动成果。"
 niger_delta.0021.a:0 "我十分期待！"
 niger_delta.0021.tooltip:0 "你选择的[niger_delta_craft_guild|E]最多需要一年时间才能完成[artifact|E]的制作。"
 niger_delta.0021.tooltip.ivory_or_wood:0 "有50%的几率完成艺术品是由象牙制成的，50%的几率是由木头制成的。"
 niger_delta.0022.t:0 "行会展示他们的艺术品"
 niger_delta.0022.desc.intro:0 "前一段时间，我委托一些为我家族工作的手工艺行会创作一件艺术品。现在终于完成了"
 niger_delta.0022.desc.intro.heir:0 "前段时间，[patron.GetTitledFirstName]委托一些为[patron.GetDynasty.GetName]家族工作的工艺行会创作一件艺术品。由于[patron.GetFirstNameNoTooltip]已经不在我们这里，现在我将收到这件艺术品。"
 niger_delta.0022.desc.bronze:0 "今天，#bold 青铜工匠行会#!向我展示了他们辛勤劳动的成果：一个用失蜡铸法制作优雅的青铜雕塑。\n\n"
 niger_delta.0022.desc.iron:0 "\n\n今天，#bold 铁匠行会#!向我展示了他们辛勤劳动的成果：一个铁制的雕塑，坚固且美丽，象征着我的力量。"
 niger_delta.0022.desc.ivory:0 "\n\n今天，#bold 象牙和木头雕刻行会#!向我展示了他们辛勤劳动的成果：一个象牙雕刻，由当地猎人砍下的一头强大的大象的牙制成。"
 niger_delta.0022.desc.wood:0 "\n\n今天，#bold 象牙和木雕行会#!向我展示了他们辛勤劳动的成果：一个木雕，由这个地区的大树制成"
 niger_delta.0022.desc.glass:0 "\n\n今天，#bold 串珠师行会#!向我展示了他们辛勤劳动的成果：一个玻璃串珠，由这个地区的玻璃工坊制成的玻璃串联起来。"
 niger_delta.0022.desc.coral:0 "\n\n今天，#bold 串珠师行会#!向我展示了他们辛勤劳动的成果：一个红珊瑚串珠，由这个地区的红珊瑚制成"
 niger_delta.0022.desc.quality.fair:0 "这幅作品质量尚可，符合向我这样的[current_patron.GetTitleAsNameNoTooltip]赠送礼物的标准。虽然我希望他们能创造出真正宏伟的东西，但我不能抱怨收到另一件可爱的艺术作品。"
 niger_delta.0022.desc.quality.good:0 "这件艺术品的质量很好。它不是这种艺术的缩影，但它仍然是一件相当令人惊叹的艺术作品。对于像我这样的[current_patron.GetTitleAsNameNoTooltip]来说，它是一个合适的礼物，并且很好地反映了这些手工艺行会的能力。"
 niger_delta.0022.desc.quality.excellent:0 "这件艺术品的质量很好。我只瞥了一眼这幅美丽的艺术品，我就已经知道它是会激发很多敬畏的东西。人们会说：“啊，[current_patron.GetFirstNameNoTooltip]如果[current_patron.GetTitleAsNameNoTooltip]能委托制作这样的艺术品，那真是一个伟大且强大的[current_patron.GetSheHe]！”"
 niger_delta.0022.a:0 "感谢你们的努力！这看起来不错！"
 niger_delta.0022.quality_tooltip:0 "因为[artifact|E]的质量#bold 非常好#!，所以可以把它[reforge|E]成[court_artifact|E]。"
