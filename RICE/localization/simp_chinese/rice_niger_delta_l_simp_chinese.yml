 niger_delta.0100.t:0 "大象肉"
 niger_delta.0100.desc:0 "最近在[county.GetNameNoTier]被我伟大家族赞助的猎人行会下的猎人杀死了一头大象。虽然大象的肉是我的，但我宫廷里的一些人建议我将大象肉分发给[county.GetNameNoTierNoTooltip]的一些部族，以表示我的慷慨。"
 niger_delta.0100.a:0 "好！把肉分给大家。"
 niger_delta.0100.b:0 "不，我想我会保留肉。"
 niger_delta.0101.t:0 "Iyan"
 niger_delta.0101.desc:0 "今天，我的厨师说晚餐时，他们会准备#italic iyan#!或捣碎的山药，这是一道简单而美味的传统菜肴，在[ROOT.Char.GetCulture.GetCollectiveNoun]和该地区的其他人中很受欢迎。将煮熟的山药捣成泥，然后与其他食物一起食用，尤其是秋葵汤和炖菠菜等汤。"
 niger_delta.0101.a:0 "真是美味！"
 niger_delta.0102.t:0 "水的女儿"
 niger_delta.0102.desc:0 "我的一些廷臣——主要是男性——最近进城代表我做一些生意。当我们谈论发生的事情时，几个男人提到他们在执行国家事务时遇到了一个相当漂亮的女孩。\n\n“她真的是#italic Ọmọge omi#!”，[courtier.GetTitledFirstName]说，“水的女儿！”\n\n在[ROOT.Char.GetFaith.GetReligion.GetAdjective]信仰中，这种美丽与水的精神奥洛昆有关，它与人类有着复杂的关系。"
 niger_delta.0102.a:0 "你应该做的是工作，而不是对女孩子着迷！"
 niger_delta.0102.b:0 "告诉我更多关于这个女孩是什么样的。"
 niger_delta.0103.t:0 "回去吧，铁匠！"
 niger_delta.0103.desc:0 "我今天听到了一个很奇怪的消息，说一位著名的铁匠最近在他失踪并差点淹死在河里后被救了出来。\n\n据他说，一位美貌无与伦比的未婚年轻女子来到他的作坊购买他的工具。他被她着迷了于是当场求婚，她却说不能。他没有气馁，在她离开时追了上去，跟着她进入了城外的荒野，尽管她一直在警告他，“如果你拒绝回去，你会遇到一条染料河——回去吧，铁匠！”\n\n不知不觉，他掉进了河里。很明显，他遇到了某种水精灵，那种人们会在古老的[ROOT.Char.GetFaith.GetAdjective]民间故事中听到的那种。毕竟，河流是生者与死者的分界线。"
 niger_delta.0103.a:0 "就算她警告过他，他还是个傻瓜！"
 niger_delta.0103.b:0 "我怀疑他说的是假的，但这是一个有趣的故事。"
 niger_delta.0104.t:0 "圣河水"
 niger_delta.0104.desc:0 "当我在我住所附近的一条河边散步时，我遇到了一个用大罐子收集河水的女人。她在唱祈祷文：\n\n#italic òrìsà, jé kí omi tútù tán tèmi, òrìsà。\n愿你的冷水解决我的问题。#!\n\n她似乎是某些[ROOT.Char.Custom('DefaultPriestTitlePlural')]在当地神社。人们习惯在[ROOT.Char.GetFaith.GetReligion.GetAdjective]神社里放一大盆白色的水，以象征水神的存在，每天更换这些盆中的水很重要（通常由处女或育龄妇女）。由于这些盆中的水被认为具有药用价值，因此需要保持新鲜和活力。"
 niger_delta.0104.a:0 "赞美[ROOT.Char.GetFaith.WaterGodName]！"
 niger_delta.0105.t:0 "木制装饰"
 niger_delta.0105.desc:0 "我目前正在为我的住所添加一个新的侧翼。在[ROOT.Char.GetCulture.GetName]建筑中，用男人、女人和动物的形象广泛装饰我们的门和柱子是一种流行的做法。\n\n我可以指导我聘请的专业雕刻师雕刻比最初计划更多的这些。一个[ROOT.Char.GetTitleAsNameNoTooltip]，毕竟不应该住在一脸肮脏的地方。人们应该对我住的地方的宏伟感到敬畏！"
 niger_delta.0105.a:0 "好主意！我们就这样做。"
 niger_delta.0105.b:0 "让我们坚持原来的计划。"
 niger_delta.0106.t:0 "一个古老的青铜头像"
 niger_delta.0106.desc:0 "当地人最近在附近发现了一个青铜雕塑。这座雕塑描绘了某人的头像，它看起来与现在的[ROOT.Char.GetCulture.GetName]铜雕相似，但显然不属于任何当代风格。\n\n这座雕塑很有可能是为了纪念甚至是崇敬许多代以前统治这里的某个统治者而创作的，因此是我的某位前辈的代表，不管是哪种方式，所以应该尊重它。有人说把这个铜头埋在被发现的地方可能会更好，但要标明位置，以便在某些适当的宗教节日里可以把它拿出来祭祀。"
 niger_delta.0106.a:0 "把它埋起来，只在某些宗教场合使用。"
 niger_delta.0106.b:0 "把它带到我的家族祠堂，以便我可以供奉它。"
 niger_delta.0107.t:0 "玻璃制造热潮"
 niger_delta.0107.desc:0 "$c_ife$的玻璃工坊最近表现不错。由于这座城市是非洲本土玻璃生产的主要中心之一，其玻璃产品，尤其是玻璃珠，因其文化和宗教意义而在该地区其他地方及其他地区的需求量很大。玻璃制造行业的繁荣肯定会帮助该地区的经济。"
 niger_delta.0107.a:0 "好消息！"
 niger_delta.0108.t:0 "一次成功的$c_ife$之旅"
 niger_delta.0108.desc:0 "我的代表最近从$c_ife$回来，代表我参加了那里的一个重要节日。人们喜欢说这座城市每天都会庆祝[ROOT.Char.GetFaith.GetReligion.GetAdjective]节日以纪念某种神祇。尽管我不能总是去这个人类神圣的摇篮，但重要的是有人在那里代表我。\n\n无论如何，我的特使说一切都很顺利，他们的到来也很好地提升了我在城市中的声誉。"
 niger_delta.0108.a:0 "非常好。你做的真的很棒！"
 niger_delta.0109.t:0 "可乐果刺激"
 niger_delta.0109.desc:0 "在[ROOT.Char.GetCulture.GetName]中，有咀嚼可乐果刺激身体的习惯。我最近一直在这样做，发现它很有趣也很有帮助。或许我应该对此更加积极主动，并确保我有充足的可乐果供应，这样我才能保持这个好习惯。"
 niger_delta.0109.a:0 "好主意！给我更多的可乐果！"
 niger_delta.0109.b:0 "转念一想，也许不是。"
 niger_delta.0110.t:0 "仪式任务"
 niger_delta.0110.desc.culture:0 "作为一家之主，我有责任在清晨掰一颗可乐果来迎接新的一天。这是许多[ROOT.Char.GetCulture.GetCollectiveNoun]的习俗，考虑到可乐果对我们的精神重要性——甚至比我们的邻居更重要，其中许多人已经高度重视可乐果。\n\n在这个仪式上，我在家人的陪同下感谢祖先，并要求[ROOT.Char.GetFaith.PantheonTerm]在剩下的一天中保佑我们。\n\n虽然这是一个简单的仪式，但确实需要时间，我需要专注于做好。"
 niger_delta.0110.desc.faith:0 "作为一家之主，我有责任在清晨掰一颗可乐果来迎接新的一天。这是许多[ROOT.Char.GetFaith.GetAdherentNamePlural]的习惯做法，考虑到可乐果对我们的精神重要性——甚至比我们的邻居更重要，其中许多人已经高度重视可乐果。\n\n在这个仪式上，我在家人的陪同下感谢祖先，并要求[ROOT.Char.GetFaith.PantheonTerm]在剩下的一天中保佑我们。\n\n虽然这是一个简单的仪式，但确实需要时间，我需要专注于做好。"
 niger_delta.0110.a:0 "我会竭尽全力"
 niger_delta.0110.b:0 "一个累人的仪式，我会做最少的事"
 niger_delta.0111.t:0 "热情好客"
 niger_delta.0111.desc.culture:0 "今天，一位显赫的客人从远方来到我的宫廷。虽然他们不能待太久，但重要的是他们应当受到良好的礼仪和待遇。\n\n因此，当我第一次见到这位尊贵的人时，我向他们展示了一些我能找到的最好的可乐果，这是我们之间的传统[ROOT.Char.GetCulture.GetCollectiveNoun]。"
 niger_delta.0111.desc.faith:0 "今天，一位显赫的客人从远方来到我的宫廷。虽然他们不能待太久，但重要的是他们应当受到良好的礼仪和待遇。\n\n因此，当我第一次见到这位尊贵的人时，我向他们展示了一些我能找到的最好的可乐果，这是我们之间的传统[ROOT.Char.GetFaith.GetAdherentNamePlural]。"
 niger_delta.0111.desc.conclusion:0 "按照惯例，我的客人随后挑选了一颗可乐果带他们回家，剩下的可乐果留给了我。\n\n这次拜访很愉快，我的客人似乎对我的热情好客感到满意。"
 niger_delta.0111.a:0 "愿你一路平安。"
 niger_delta.0112.t:0 "可乐果正义"
 niger_delta.0112.desc:0 "[ROOT.Char.GetFaith.GetAdherentNamePlural]相信可乐果具有巨大的神圣和象征意义。因此许多人会对他们起誓。\n\n在当地的一个村庄，一名男子最近被指控犯有令人发指的罪行。我的官员或社区领袖都无法确定他是否有罪。为了清除他的指控，他同意在可乐果面前公开宣誓。\n\n在这个仪式中，一颗可乐果的叶子掉在地上，被告不得不弯下腰用嘴捡起来，如果他有罪，他将被[ROOT.Char.GetFaith.PantheonTerm]击倒。因此如果[ROOT.Char.GetFaith.PantheonTerm]发现被告是无辜的，那么他就#italic 是#!没有任何错误的行为。"
 niger_delta.0112.a:0 "确实，这个仪式的结果是显而易见的。"
 niger_delta.0112.b:0 "我不确定他是否无辜，但这是我们的传统。"
