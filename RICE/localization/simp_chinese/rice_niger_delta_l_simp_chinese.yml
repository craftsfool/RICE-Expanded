 building_type_RICE_niger_delta_osun_osogbo_sacred_grove_desc:0 "虽然尼日利亚有许多圣林，但奥孙-奥索博神树林无疑是最重要的。它位于奥孙河沿岸，是约鲁巴神奥孙的主要崇拜中心，奥孙是掌管爱、生育、水、美和占卜的女神。"
