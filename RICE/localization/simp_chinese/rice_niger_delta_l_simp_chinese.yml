 activity_RICE_niger_delta_new_yam_festival:0 "新山药节"
 activity_RICE_niger_delta_new_yam_festival_desc:0 "几个世纪以来，山药一直是[GetPlayer.GetCulture.GetCollectiveNoun]和其他源自大西洋海岸的西非人民的重要食物来源。随着山药收成的到来，我应该准备一个盛大的新山药节，并感谢[GetPlayer.GetFaith.FertilityGodName]带来的丰收。"
 activity_RICE_niger_delta_new_yam_festival_selection_tooltip: "举办新山药节\n\n$RICE_niger_delta_celebrate_new_yam_festival_context_tooltip$"
 activity_RICE_niger_delta_new_yam_festival_host_desc: "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$你拥有的每个[county|E]都有机会获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]"
