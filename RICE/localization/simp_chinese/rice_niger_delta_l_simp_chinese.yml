 building_type_RICE_niger_delta_sungbos_eredo_01_desc:0 "伊杰布奥德定居点拥有悠久而传奇的历史。相传，为纪念一位备受尊敬的富有无嗣寡妇比利基苏·桑博，人们建造了庞大的防御墙与壕沟体系，这些防御工事因此得名桑博要塞。"
