 RICE_restart_ooni_uncrowned_mechanic_loc:0 "除了欧尼以外的每个[yoruba.GetAdjective][ruler|E]都会得到[GetModifier('RICE_niger_delta_uncrowned').GetNameWithTooltip][character_modifier|E]。为了移除它，他们必须采取[decision|E]，从[GetTitleByKey('d_ooni_of_ife').GetNameNoTier]中获得一个[beaded_crown|E]。"
