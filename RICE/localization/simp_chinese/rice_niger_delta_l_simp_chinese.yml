 niger_delta.0070.t:0 "日期已定"
 niger_delta.0070.desc.intro:0 "我收到消息说，担任首席[yoruba.GetAdjective]日历管理员的奥兰米扬大祭司已决定今年黎明节的日期。可以说是[yoruba.GetName]在[ife.GetNameNoTier]庆祝的最重要的节日，它是为了纪念凶猛的铁神和战神奥贡为其他神灵和神灵进入地球扫清道路并成为早期的[ife.GetNameNoTierNoTooltip]的欧尼。"
 niger_delta.0070.desc.ooni:0 "\n\n作为欧尼，我在这个节日中扮演着重要的角色，因为我将重申我作为所有[yoruba.GetName]的精神领袖的神圣誓言，参加各种仪式，并祝福我的人民。我需要做好准备，举行各种仪式和仪式，与祖先交流，为我所有的人祈祷。"
 niger_delta.0070.desc.not_ooni:0 "\n\n今年，我已经计划在[ife.GetNameNoTierNoTooltip]参加这个盛会。作为一个[ROOT.Char.GetTitleAsNameNoTooltip]，我应该与所有[yoruba.GetName]的精神领袖欧尼一起参加许多仪式。"
 niger_delta.0070.a:0 "我已经等不及"
 niger_delta.0071.t:0 "欧尼的隐居"
 niger_delta.0071.desc.intro:0 "在黎明节开始前一周，欧尼将隐居直到节日开始。这样做的原因是，欧尼可以净化自己，以确保他们在黎明节期间参加的各种仪式的效果。"
 niger_delta.0071.desc.ooni:0 "\n\n我是现在的欧尼，所以我有责任坚定不移地遵循这些神圣的传统。我已经回到宫殿，在那里与我的祖先交流并进行不间断的祈祷。"
 niger_delta.0071.desc.not_ooni:0 "\n\n现在的欧尼，[ooni.GetFirstName]，已经回到[ooni.GetHerHis]宫殿与[ooni.GetHerHis]祖先交流并进行不间断的祈祷。我们其他已经抵达[ife.GetNameNoTier]的人只能耐心等待。"
 niger_delta.0071.desc.conclusion:0 "\n\n在此期间，皇室的妇女每天晚上都会聚集在一起，歌颂另一位战神和古代欧尼奥贡和奥兰米扬，并扫除宫殿以象征性地清除邪恶。与此同时，[ife.GetNameNoTier]的奥贡神殿已经用棕榈叶装饰。"
 niger_delta.0071.a:0 "这有助于提醒大家，黎明节即将开始。"
 niger_delta.0072.t:0 "黎明节开始"
 niger_delta.0072.desc.intro:0 "今天，黎明节开始了！\n\n第一天，即 Ilagun 日，早在日出之前就开始了，当一个搜索队从欧尼的宫殿中被派去寻找并捕获一条要献给奥贡的狗。奥贡是一个粗心的神祇，在狩猎、战争和道路上的事故中牺牲，所以这个献给他的节日不可避免地以这样的牺牲开始。\n\n黎明节的首席祭司奥索贡带着狗的游行队伍前往[ife.GetNameNoTier]的欧尼住所。"
 niger_delta.0072.desc.ooni:0 "按照传统，我作为欧尼，不出去会见奥索贡。取而代之的是，为了奥洛霍而聚集的各种酋长和其他强大的统治者已经代替我在宫殿外等候。他们给了奥索贡一小罐药，并从我自己那里得到了一个正式的信息，即可以继续向奥索贡献祭。"
 niger_delta.0072.desc.not_ooni:0 "因为欧尼[ooni.GetFirstName]按照传统，不会到外面去见奥索贡，而是在宫殿外迎接奥索贡，像我这样为奥洛霍而聚集的各种酋长和有权势的统治者。我们给了奥索贡一小罐药，以及来自欧尼的信息，表示可以继续向奥贡献祭。"
 niger_delta.0072.a:0 "奥索贡现在可以去奥贡神殿了。"
 niger_delta.0073.t:0 "对奥贡的牺牲"
 niger_delta.0073.desc:0 "奥索贡带着游行队伍和祭祀狗到达奥贡的神社。然后奥索贡为欧尼祈祷：“国王，神圣力量的拥有者，仅次于众神，愿你统治长久，愿你征服你的敌人！”\n\n狗被依礼捆绑，它的头被棍棒一击砸碎。一旦狗死去，它就会被绑在神树上被剖开，它的血液会从中流出。然后为欧尼和其他所有人祈祷和供品，同时献祭第二只狗。\n\n当一天的祭祀仪式结束时，每个人都开始为奥贡欢乐、跳舞和歌颂。"
 niger_delta.0073.a:0 "到处热热闹闹！"
 niger_delta.0074.t:0 "黎明节人群"
 niger_delta.0074.desc:0 "在黎明节的第二天，[ife.GetNameNoTier]仍然充满了欢乐的人群。有几个群体尤其引人注目。\n\n第一是皇室成员，他们穿着飘逸的长袍，头戴带有线边的帽子，以显示他们与欧尼的紧密联系。\n\n第二群是祭司，在节日期间保护欧尼免受邪恶势力的侵害。他们展示他们的药用动物角，并在奥洛霍期间低语咒语以防止雨水落下。\n\n第三是宫廷仆人，身体被涂成凶猛的白色和红色，并伴随着鼓手，他们用鞭子控制人群。\n\n最后但同样重要的是猎人和铁匠，他们带着行会的旗帜。"
 niger_delta.0074.a:0 "人们现在也前往欧尼的宫殿。"
 niger_delta.0075.t:0 "欧尼出现在公众面前"
 niger_delta.0075.desc.intro:0 "现在是欧尼离开[ooni.GetHerHis]宫殿并出现在公众面前的罕见场合之一。"
 niger_delta.0075.desc.ooni:0 "\n\n我戴着#italic 阿雷#!王冠从宫殿里出来。然后我拍打皇冠上的珠子，凝视着人群。在场的所有统治者和祭司都拜倒在我面前，承认我作为神圣统治者的权威。\n\n然后我前往奥贡神殿。在这样做的同时，每个人都向我祈祷，从身体健康到诅咒敌人，因为人们相信#italic 阿雷#!是强大的。"
 niger_delta.0075.desc.not_ooni:0 "\n\n[ooni.GetTitledFirstName]出现，拍打着[ooni.GetHerHis]#italic 阿雷#!的珠子，凝视着人群。在场的所有统治者和祭司，包括我自己，都在欧尼面前行礼，承认[ooni.GetHerHis]是神圣的统治者。\n\n当欧尼前往奥贡神社时，每个人都向[ooni.GetHerHim]祈祷从身体健康到诅咒敌人的任何事情，因为#italic 阿雷#!被认为是强大的。或许我也应该祈求些什么？"
 niger_delta.0075.a:0 "我适时地向在场的每一个人祈祷。"
 niger_delta.0075.b:0 "身体健康高于一切！"
 niger_delta.0075.c:0 "财富和繁荣！"
 niger_delta.0075.d:0 "我的敌人的不幸！"
 niger_delta.0075.e:0 "我什么也不需要。"
 niger_delta.0075.health:0 "欧尼听从你的健康祈祷！"
 niger_delta.0075.fortune:0 "欧尼听从你的财富祈祷！"
 niger_delta.0075.enemies:0 "欧尼听从你的祈祷并诅咒你的敌人"
 niger_delta.0076.t:0 "$c_ife$的神殿"
 niger_delta.0076.desc.ooni:0 "我的奥贡神殿之旅需要一段时间，所有人群都在场，但一旦我到达那里，我就会与奥索贡一起进行各种仪式。最重要的是，我再次宣誓为欧尼。\n\n之后，我前往财富女神阿杰的神殿。虽然男性通常占据[yoruba.GetAdjective]信仰中的仪式和公共空间，但女性占据市场空间，在此做出重要的商业决策，所以我来这里是为了吸引人们的注意力，这一点很重要。\n \n总而言之，这些访问加强了我的宗教权威。第二天结束回宫后，接下来的第三天通常是休息日。"
 niger_delta.0076.desc.not_ooni:0 "欧尼前往奥贡神殿需要一段时间，所有人群都在场，但一旦[ooni.GetSheHe]到达那里，欧尼就会与奥索贡进行各种仪式。最重要的是，[ooni.GetSheHe]将宣布[ooni.GetHerHis]为新的欧尼。\n\n之后，[ooni.GetSheHe]前往财富女神阿杰的神殿。虽然男性通常占据[yoruba.GetAdjective]信仰中的仪式和公共空间，但女性占据市场空间，在那里做出关键的商业决策，因此对于成功的一年来说，欧尼很重要。\n\n总而言之，这些访问加强了欧尼的宗教权威。欧尼在第二天结束时回到宫殿后，接下来的第三天通常是休息日。"
 niger_delta.0076.a:0 "到目前为止，这非常令人兴奋。"
 niger_delta.0077.t:0 "黎明节的最后一天"
 niger_delta.0077.desc.ooni:0 "这是黎明节的第四天也是最后一天，当我回到奥贡神殿重复几天前在那里完成的所有仪式时，比如更新我神圣的王权誓言。在此之后，我会拜访我家的长辈，然后再拜访附近的其他皇室成员。\n\n在此期间，人们习惯于在我回到我的住所之前向欧尼打招呼并提供礼物，当我家的年长妇女歌颂我和我的传说。\n\n今年我在这里遇到了很多人，他们都向我打招呼并赠送我礼物，承认我。"
 niger_delta.0077.desc.not_ooni:0 "这是奥洛霍的第四天也是最后一天，[ooni.GetTitledFirstName]返回奥贡神殿，重复几天前在那里完成的所有仪式，例如重新宣称[ooni.GetHerHis]神圣的王权誓言。在此之后，欧尼拜访[ooni.GetHerHis]家的长辈，然后拜访附近的其他王室成员。\n\n在此期间，人们习惯于向欧尼打招呼并提供礼物。如果我也这样做就好了，在欧尼回到[ooni.GetHerHis]住所之前，[ooni.GetHerHis]家的年长妇女歌颂[ooni.GetHerHim]和[ooni.GetHerHis]血统。"
 niger_delta.0077.a:0 "我为所有接近我的人祈祷。"
 niger_delta.0077.b:0 "我接近并向欧尼提供一份适度的礼物。"
 niger_delta.0077.c:0 "我接近并向欧尼提供一份很好的礼物。"
 niger_delta.0077.d:0 "我不会接近欧尼"
 niger_delta.0078.t:0 "黎明节结束"
 niger_delta.0078.desc:0 "黎明节已经结束，[ife.GetNameNoTier]外面的人正在离开这座城市。虽然这是一个有趣的场合，但它是人们纪念可怕的神、向欧尼致敬并纪念[yoruba.GetAdjective]历史、遗产和价值观的节日。\n \n毕竟，[ife.GetNameNoTierNoTooltip]是一个圣地，据说是众神降临地球的人类摇篮。归根结底，黎明节是我们所有人认识到调节宇宙的神圣力量的时候。"
 niger_delta.0078.a:0 "直到下次"
 niger_delta.0078.ooni.tooltip:0 "在宣誓你的誓言时，你在仪式上加强了欧尼的统治"
 niger_delta.0078.ooni.tooltip.1:0 "人们认为你在黎明节期间对欧尼职责的履行尚可"
 niger_delta.0078.ooni.tooltip.2:0 "人们相信你在黎明节期间出色地履行了欧尼的职责"
 niger_delta.0078.ooni.tooltip.3:0 "人们相信你在黎明节期间极其出色地履行了作为欧尼的职责"
