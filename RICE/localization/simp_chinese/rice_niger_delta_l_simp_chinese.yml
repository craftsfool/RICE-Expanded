 RICE_niger_delta_new_yam_festival_ritual_phase: "祭祀"
 RICE_niger_delta_new_yam_festival_ritual_phase_desc: "虽然新山药节是一个喜庆的时刻，但它也有重要的仪式和规则，我们都必须遵守。"
 RICE_niger_delta_new_yam_festival_celebration_intent_header: "庆祝："
 RICE_niger_delta_new_yam_festival_celebration_intent: "庆祝"
 RICE_niger_delta_new_yam_festival_celebration_intent_desc: "虽然这是一个严肃的场合，但新山药节也是一个庆祝丰收的时刻！你会失去[stress_i|E][stress|E]！，如果你拥有[GetTrait('gregarious').GetName( GetNullCharacter )|U]、[GetTrait('gluttonous').GetName( GetNullCharacter )]或[GetTrait('content').GetName( GetNullCharacter )]，则失去更多。"
 RICE_niger_delta_new_yam_festival_generosity_intent_header: "布施："
 RICE_niger_delta_new_yam_festival_generosity_intent: "布施"
 RICE_niger_delta_new_yam_festival_generosity_intent_desc: "新山药节是展示你作为[GetPlayer.GetTitleAsNameNoTooltip]身份的好时机。你的[counties|E]将更有可能获得[GetModifier('RICE_niger_delta_successful_new_yam_festival').GetNameWithTooltip][county_modifier|E]，如果你拥有[GetTrait('just').GetName( GetNullCharacter )|U]或[GetTrait('generous').GetName( GetNullCharacter )]特质，你会额外失去[stress_i|E][stress|E]。"
 RICE_niger_delta_new_yam_festival_purification_intent_header: "净化："
 RICE_niger_delta_new_yam_festival_purification_intent: "净化"
 RICE_niger_delta_new_yam_festival_purification_intent_desc: "在新山药节里，你试图净化社会上的罪犯。你必须#italic 献祭一个[prisoner|E]#!，如果你没有一个有效的囚犯，也可进行净化；而献祭囚犯也会为你带来额外的[prestige_i|E]#V 100#!"
