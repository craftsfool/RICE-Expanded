 RICE_normandy_build_christian_site_large_monastery_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_build_large_christian_site_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$你获得[prestige_i|E]100和[piety_i|E]200\n$EFFECT_LIST_BULLET$你每有一级[piety_level|E]，你的[dynasty|E]就获得[dynasty_prestige_i]25\n$EFFECT_LIST_BULLET$你获得为期#V 十#!年的[GetModifier('RICE_normandy_built_large_monastery').GetNameWithTooltip][character_modifier|E]\n$EFFECT_LIST_BULLET$你的[capital|E]为期#V 十#!年的[GetModifier('RICE_normandy_built_large_monastery_county').GetNameWithTooltip][county_modifier|E]"
 RICE_normandy_compile_domesday_book:0 "编纂《末日审判书》"
 RICE_normandy_compile_domesday_book_tooltip:0 "调查你的[dynasty|E]征服的王国，以便更有效地统治它"
 RICE_normandy_compile_domesday_book_desc_england:0 "[RICE_normandy_struggle|E]结束了，以诺曼人征服了[GetGeographicalRegion('custom_england').GetName]而告终。然而，征服是一回事，统治又是一回事。为了更好地治理我们的新领地，我们应该对其进行调查，并准确评估其拥有的财产和资源。"
 RICE_normandy_compile_domesday_book_desc_francia:0 "[RICE_normandy_struggle|E]结束了，以诺曼人征服了[GetGeographicalRegion('custom_west_francia_minus_mediterranean').GetName]而告终。然而，征服是一回事，统治又是一回事。为了更好地治理我们的新领地，我们应该对其进行调查，并准确评估其拥有的财产和资源。"
 RICE_normandy_compile_domesday_book_desc_greater_normandy:0 "[RICE_normandy_struggle|E]结束了，以诺曼人征服了[GetGeographicalRegion('RICE_greater_normandy_region').GetName]而告终。然而，征服是一回事，统治又是一回事。为了更好地治理我们的新领地，我们应该对其进行调查，并准确评估其拥有的财产和资源。"
 RICE_normandy_compile_domesday_book_desc:0 "$RICE_normandy_compile_domesday_book_desc_england$"
 RICE_normandy_compile_domesday_book_effect_tooltip_1:1 "你的官员将在一两年内完成调查"
 RICE_normandy_compile_domesday_book_effect_tooltip_2:1 "一旦完成，你将获得#italic [artifact|E]《末日审判书》#!"
 RICE_domesday_decision_tt:1 "你的官员将在一两年内完成调查"
 RICE_normandy_compile_domesday_book_confirm:0 "开始这项伟大的调查吧！"
 RICE_normandy_compile_domesday_book_context_tooltip:0 "#emphasis 历史背景：#!征服者威廉在1085年发起了一项艰难调查，以记录英格兰每项资产的价值及其土地、人力和牲畜等资源，一年后完工。最终手稿最初在拉丁语中名为#italic “Liber de Wintonia”（《温彻斯特书》）#!，但更广为人知的是《末日审判书》一名。当地英国人这样称呼是因为这次调查就像圣经中最后的审判一样，结果是不可更改，不容置疑的。"
