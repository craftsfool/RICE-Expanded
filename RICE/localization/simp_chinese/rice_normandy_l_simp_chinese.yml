 RICE_normandy_build_christian_site_large_church_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_build_large_christian_site_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$你获得[prestige_i|E]200和[piety_i|E]100\n$EFFECT_LIST_BULLET$你每级[piety_level|E]，让[dynasty|E]获得每[dynasty_prestige_i]25\n$EFFECT_LIST_BULLET$你获得为期#V 十#!年的[GetModifier('RICE_normandy_built_large_church').GetNameWithTooltip][character_modifier|E]\n$EFFECT_LIST_BULLET$你的[capital|E]获得为期#V 十#!年的[GetModifier('RICE_normandy_built_large_church_county').GetNameWithTooltip][county_modifier|E]"
