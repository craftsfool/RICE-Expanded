 normandy.0033.desc.mercenaries:0 "$normandy.0023.desc.mercenaries$"
 normandy.0033.desc.traders:0 "$normandy.0023.desc.traders$"
 normandy.0033.desc.scholars:0 "在合并[GetGeographicalRegion('RICE_normandy_region').GetName]之后，[courtier_1.GetCulture.GetCollectiveNounNoTooltip]已经理所当然地赢得了完善和学习的声誉——至少我是这么认为的。"
