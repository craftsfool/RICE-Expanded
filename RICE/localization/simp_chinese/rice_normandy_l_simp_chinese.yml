 normandy.0041.t:0 "[normandy_title.GetNameNoTierNoTooltip]的诞生"
 normandy.0041.desc:0 "多年来，法国北部一直遭受着诺斯海盗无数次的袭击。为了保卫这一地区，人们组建了一支边军，但其效果有限。\n\n然而，一个解决方案已经出现了。一个诺斯军阀——[rollo.GetFirstName]，愿意与我们合作，当然，[rollo.GetSheHe]要求得到一些回报。\n\n我们就这样通过谈判达成了一项双方都能接受的协议。[rollo.GetFirstNameNoTooltip]被授予[normandy_title.GetNameNoTier]作为[rollo.GetHerHis]个人封地。作为交换，[rollo.GetSheHe]发誓要保护这些土地，即使这意味着与其他诺斯人作战，并采取我们的一些法律和习俗。\n\n总之，这是双赢。[rollo.GetFirstNameNoTooltip]可能无法完全控制[normandy_title.GetNameNoTierNoTooltip]，但这不是我的问题。"
 normandy.0041.desc.rollo:0 "多年来，法国北部海岸遭受了我们无数次的袭击和掠夺。\n\n然而，持续的敌对对双方来说都是代价高昂的，从长远来看，与法兰克人结盟可能是有利可图的。我们诺斯人中的一些甚至对法兰克文化的某些方面产生了迷恋。因此，作为一个杰出的诺斯军阀，我已经向[charles.GetTitledFirstName]表示，愿意与[charles.GetHerHim]合作，当然并非免费的。\n\n我们就这样通过谈判达成了一项双方都能接受的协议。我被授予[normandy_title.GetNameNoTier]作为封地来统治。作为交换，我发誓采用法兰克人的法律和习俗保护这些领土不受诺斯人侵犯。\n\n但我知道[charles.GetTitledFirstNameNoTooltip]非常乐意让我处理控制[normandy_title.GetNameNoTierNoTooltip]的混乱问题。这是双赢的局面，因为以前的敌人变成了朋友…大概吧。"
 normandy.0041.a:0 "好。现在，我要把注意力集中在其他事上。"
 normandy.0041.b:0 "我想知道[rollo.GetFirstNamePossessiveNoTooltip]命运将是怎样……"
 normandy.0041.c:0 "这对我们的人民来说这是一个新的开始！"
 normandy.0042.t:0 "$normandy.0041.t$"
 normandy.0042.desc:0 "关于法国最近的政治发展的消息传到我的宫廷：那里的统治者[charles.GetTitledFirstName]已授予[GetTitleByKey('d_normandy').GetName]给一个名为[rollo.GetTitledFirstNameNicknamed]的[rollo_old_culture.GetName]军阀。\n\n多年来，斯堪的纳维亚海盗蹂躏了法国的海岸线。为了解决这场危机，[charles.GetFirstNameNoTooltip]想要使用[rollo.GetFirstNameNoTooltip]和[rollo.GetHerHis]战士对抗[rollo.GetHerHis]的弟兄们。\n\n与此同时，[rollo.GetFirstNameNoTooltip]可以统治一个相当大的领土并安顿[rollo.GetHerHis]人。[rollo_old_culture.GetCollectiveNoun]开始融合并采用拉丁人的习俗，形成了新的[rollo.GetCulture.GetName]人。\n\n获得领土是一回事，有效控制是另一回事——毕竟，这不是海岸地区。人们只能猜想[rollo.GetFirstNameNoTooltip]和$d_normandy$的命运如何。"
 normandy.0042.a:0 "我相信他们有相当的命运！"
 normandy.0042.tooltip.struggle_started:0 "[RICE_normandy_struggle|E][struggle|E]开始了"
 normandy.0042.tooltip.old_liege:0 "以前属于[rollo.GetFirstNameNoTooltip]的[counties|E]和[vassals|E]将移交给你，因为你是[rollo.GetHerHis]前[liege|E]"
