 RICE_normandy_struggle_culture_involved_req:0 "你的[culture|E]在[RICE_normandy_struggle|E]是[struggle_involved|E]"
 RICE_normandy_struggle_faith_involved_req:0 "你的[faith|E]在[RICE_normandy_struggle|E]是[struggle_involved|E]"
 RICE_normandy_struggle_is_norman_req:0 "是诺曼[culture|E]或源自诺曼的[culture|E]"
 RICE_normandy_struggle_not_norman_req:0 "不是诺曼[culture|E]或源自诺曼的[culture|E]"
 RICE_normandy_struggle_no_norman_rulers_req:0 "在[GetGeographicalRegion('RICE_normandy_region').GetName]中没有[county|E]属于诺曼[culture|E]或有源自诺曼[culture|E]的[ruler|E]"
 RICE_normandy_struggle_decision_historia_normannorum_tt:0 "#italic 《诺曼底史》#![decision|E]已经完成"
 RICE_normandy_grant_to_norse:0 "将$d_normandy$授予诺斯人"
 RICE_normandy_grant_to_norse_tooltip:0 "用一个明智的方案解决[GetTitleByKey('d_normandy').GetNameNoTier]遭受诺斯人掠袭的问题。"
 RICE_normandy_grant_to_norse_desc:0 "我们在[GetTitleByKey('d_normandy').GetNameNoTier]建立边区以防御诺斯人的袭击的尝试并没有取得很好的成果。然而，还有另一个潜在的方案，既我们可以为一个好说话明事理的诺斯领袖提供土地和财富，如果他肯为#italic 我们#!服务并与其他诺斯人作战的话。"
 RICE_normandy_grant_to_norse_effect_tooltip_1:1 "一个[norse.GetHeritage.GetName][character|E]将被授予[GetTitleByKey('d_normandy').GetName]和其中所有[count|E][rank|E]的[vassals|E]"
 RICE_normandy_grant_to_norse_effect_tooltip_2:1 "如果新[ruler|E]并不信仰[THIS.Char.GetFaith.GetReligion.GetAdjective][faith|E]，其将会改信[THIS.Char.GetFaith.GetName]，不过他们的[vassals|E]不一定会改信。"
 RICE_normandy_grant_to_norse_effect_tooltip_3:1 "新[ruler|E]以及[GetGeographicalRegion('RICE_normandy_region').GetName]中所有[norse.GetHeritage.GetName]和[latin.GetHeritage.GetName]的[courtiers|E]和[rulers|E]将采用[norman.GetName][culture|E]"
 RICE_normandy_grant_to_norse_effect_tooltip_4:1 "如果你愿意，可以切换为该[ruler|E]"
 RICE_normandy_grant_to_norse_confirm:0 "我相信他们不会拒绝我们的提议！"
 RICE_normandy_grant_to_norse_context_tooltip:0 "#emphasis 历史背景：#!公元911年，西法兰克国王查理三世根据圣克莱尔条约将诺曼底授予在法兰西活动多年的诺斯军阀罗洛。虽然传统上认为这是诺曼底公国的起始，但过去半个世纪的研究表明当时的情况更加复杂，罗洛和他的后代奋斗了几十年甚至一个世纪才真正控制该地区并将其人民团结在他们的旗帜下。"
 RICE_normandy_recruit_norse_adventurers:0 "邀请诺斯定居者"
 RICE_normandy_recruit_norse_adventurers_tooltip:0 "邀请北境之人来到你的[realm|E]"
 RICE_normandy_recruit_norse_adventurers_desc:0 "[GetGeographicalRegion('world_europe_north').GetName]的[RICE_norse|E]人因其袭扰和野蛮人的名声而臭名昭著。然而，他们中的一些人是可以被说服的。我可以从国外邀请有意合作的[RICE_norse|E]人到[GetPlayer.GetPrimaryTitle.GetNameNoTier]来[RICE_normandy_settle|E]，以各种方式帮助我。"
 RICE_normandy_recruit_norse_adventurers_desc_norse:0 "愿同行的[RICE_norse|E]前程似锦，对世界了解甚多，并在许多地方畏惧其名声。我利用关系，可以从远方找到愿意在[GetPlayer.GetPrimaryTitle.GetNameNoTier]中[RICE_normandy_settle|E]的[RICE_norse|E]，并以各种方式帮助我。"
 RICE_normandy_recruit_norse_adventurers_effect_tooltip_1:1 "你将选择接受增益的[character_modifiers|E]、[county_modifiers|E]、一个新的[courtier|E]或[special_troops|E]。"
 RICE_normandy_recruit_norse_adventurers_effect_tooltip_2:1 "[RICE_norse_settlers|E]可能会要求额外的[gold|E]甚至是[titles|E]，如果谈判破裂，诺斯人会很生气！"
 RICE_normandy_recruit_norse_adventurers_effect_tooltip_3:1 "如果你的[capital|E]位于[GetGeographicalRegion('RICE_southern_europe_region').GetName]，而非[GetGeographicalRegion('RICE_northern_europe_region').GetName]，那么该[decision|E]的成本更高，冷却时间更长。"
 RICE_normandy_recruit_norse_adventurers_confirm:0 "向斯堪的纳维亚发出消息！"
 RICE_normandy_recruit_norse_adventurers_context_tooltip:0 "#emphasis 历史背景：#!与维京海盗的流行想象中的历史形象形成鲜明对比的是，维京海盗与“不那么武断”或“比较”文明的欧洲人（取决于你个人倾向）是分开的，诺斯人与其他地域社会的关系常常是相当复杂。例如，即使在诺曼人开始信仰基督教化之后，他们仍然与当时信仰异教的斯堪的纳维亚人保持着频繁的联系，这些人经常来到诺曼底各个领主的领土上定居，甚至为他们而战或与他们作对，而不考虑宗教信仰是否敌对。"
 RICE_normandy_coastal_county_req:0 "你至少拥有一个沿海[county|E]"
 RICE_normandy_capital_duchy_coastal_req:0 "你[capital|E]的[de_jure|E][duchy|E]中至少有一个沿海[county|E]"
 RICE_normandy_invite_norse_type:0 "选择要邀请的诺斯定居者类型"
 RICE_normandy_invite_norse_type_gui:0 "选择邀请哪类[RICE_norse_settlers|E]来你的[realm|E]"
 RICE_normandy_invite_norse_colonists_option:0 "#Bold 定居者#!"
 RICE_normandy_invite_norse_colonists_option_desc:0 "邀请诺斯定居者"
 RICE_normandy_invite_norse_colonists_option_tooltip:0 "花费：@gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_norse_adventurers_large_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$你[capital|E]所在[duchy|E]的其他所有[counties|E]获得持续#V 10#!到#V 25#!年的少量[development|E]和[control|E]以及[GetModifier('RICE_normandy_norse_colonists').GetNameWithTooltip][county_modifier|E]\n$EFFECT_LIST_BULLET$你可能获得[GetModifier('fp1_reprieve_from_sa_modifier').GetNameWithTooltip|L][character_modifier|E]，概率取决于你的[intrigue_i|E][intrigue|E]"
 RICE_normandy_invite_norse_courtiers_option:0 "#Bold 廷臣#!"
 RICE_normandy_invite_norse_courtiers_option_desc:0 "邀请诺斯廷臣"
 RICE_normandy_invite_norse_courtiers_option_tooltip:0 "花费：@gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_norse_adventurers_small_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$会在你的[court|E]生成两个带着[family|E]的诺斯[courtiers|E]，他们至少有一项高数值的[skill|E]，通常是[martial|E]和[prowess|E]，你可以从中选择一个或都要 \n$EFFECT_LIST_BULLET$你可能获得[GetModifier('fp1_reprieve_from_sa_modifier').GetNameWithTooltip|L][character_modifier|E]，概率取决于你的[diplomacy_i|E][diplomacy|E]"
 RICE_normandy_invite_norse_mercenaries_option:0 "#Bold 佣兵#!"
 RICE_normandy_invite_norse_mercenaries_option_desc:0 "邀请诺斯佣兵"
 RICE_normandy_invite_norse_mercenaries_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_norse_adventurers_large_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$你将会获得#V 200‑1000#!的[special_troops|E]，其中至少包括一个诺斯[men_at_arms|E][regiment|E]\n$EFFECT_LIST_BULLET$你可能获得[GetModifier('fp1_reprieve_from_sa_modifier').GetNameWithTooltip|L][character_modifier|E]，概率取决于你的[martial_i|E][martial|E]"
 RICE_normandy_invite_norse_traders_option:0 "#Bold 商人#!"
 RICE_normandy_invite_norse_traders_option_desc:0 "邀请诺斯商人"
 RICE_normandy_invite_norse_traders_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_norse_adventurers_large_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$你获得持续#V 10‑25#!年的[GetModifier('RICE_normandy_norse_traders').GetNameWithTooltip][character_modifier|E]\n$EFFECT_LIST_BULLET$你可能获得[GetModifier('fp1_reprieve_from_sa_modifier').GetNameWithTooltip|L][character_modifier|E]，概率取决于你的[stewardship_i|E][stewardship|E]"
 RICE_normandy_invite_norse_rulers_option:0 "#Bold 统治者#!"
 RICE_normandy_invite_norse_rulers_option_desc:0 "邀请诺斯统治者"
 RICE_normandy_invite_norse_rulers_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_norse_adventurers_large_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$将随机授予一个[RICE_norse|E][ruler|E]一个你持有的[county|E]\n$EFFECT_LIST_BULLET$你获得持续#V 10‑25#!年的[GetModifier('fp1_reprieve_from_sa_modifier').GetNameWithTooltip|L][character_modifier|E]"
 RICE_normandy_recruit_norman_adventurers:0 "邀请诺曼移民"
 RICE_normandy_recruit_norman_adventurers_tooltip:0 "让诺曼人在你的[realm|E]定居"
 RICE_normandy_recruit_norman_adventurers_desc:0 "来自[GetGeographicalRegion('RICE_normandy_region').GetName]的[RICE_normans|E]在从事冒险家和雇佣兵方面有相当高的声誉，他们可能愿意以合适的价格为我们工作。我可以从国外邀请感兴趣的[RICE_normans|E]人到[GetPlayer.GetPrimaryTitle.GetNameNoTier][RICE_normandy_settle|E]，并以各种方式帮助我。"
 RICE_normandy_recruit_norman_adventurers_desc_norman:0 "我们[RICE_normans|E]作为冒险家和雇佣兵有相当高的声誉。我利用关系，可以在[GetPlayer.GetPrimaryTitle.GetNameNoTier]找到其他愿意为我效忠的[RICE_normans|E]，以[RICE_normandy_settle|E]的方式帮助我。"
 RICE_normandy_recruit_norman_adventurers_effect_tooltip_1:1 "你将选择接受增益的[character_modifiers|E]、[county_modifiers|E]、一个新的[courtier|E]或[special_troops|E]。"
 RICE_normandy_recruit_norman_adventurers_effect_tooltip_2:1 "[RICE_norman_settlers|E]可能会要求额外的[gold|E]甚至是[titles|E]，如果谈判破裂，诺斯人会很生气！"
 RICE_normandy_recruit_norman_adventurers_confirm:0 "向诺曼人传话！"
 RICE_normandy_recruit_norman_adventurers_context_tooltip:0 "#emphasis 历史背景：#!在迅速实现了基督教化并接受了法国文化之后，诺曼人远涉重洋，从事雇佣兵工作，进行袭扰定居等等。例如，诺曼冒险家在11世纪征服了西西里的大部分地区，在那里建立了一个多元化的王国，甚至威胁到了东罗马帝国，如安条克的博希蒙德一世这样的诺曼人作为十字军东征中的军政领袖也发挥了重要作用。"
 RICE_normandy_invite_norman_type:0 "选择邀请哪类诺曼移民"
