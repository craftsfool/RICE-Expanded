 normandy.0096.t:0 "被轻视的女人？"
 normandy.0096.desc:0 "我发现自己陷入了一种奇怪的境地。我的妻子[matilda.GetFirstName]正计划利用她的职权，没收[beorhtric.GetTitledFirstName]的土地，并让他锒铛入狱。她说他拥有太多土地，这是消除危险威胁的好办法。\n\n然而，可能另有其因。谣传，在我们结婚之前的多年前，我的妻子迷恋上了[beorhtric.GetFirstNameNoTooltip]，当时他作为使者来到我岳父[baldwin.GetTitledFirstName]的宫廷。他拒绝了她的求爱，从那时起她就对他怀恨在心。这可能是她的报复。\n\n无论如何，我那一向能干的妻子已经为她的计划准备了正当理由（不管是否是捏造的），以减轻我其他封臣的担忧。"
 normandy.0096.a:0 "不管真假，只要他无权无势就好了……"
 normandy.0096.b:0 "我们不要太过分，监禁就够了。"
 normandy.0096.c:0 "亲爱的[matilda.GetFirstNameNoTooltip]，我们不要鲁莽行事。"
 normandy.0096.info:0 "\n#emphasis 历史背景：#!布里特里克是一位11世纪著名的盎格鲁‑撒克逊贵族。根据一些中世纪史料，他年轻时曾作为大使前往佛兰德斯，玛蒂尔达爱上了他，但他拒绝了她的求爱。\n\n几年后，当玛蒂尔达成为威廉强大而受信任的王后时，她利用职权没收了布里特里克的土地，他本人则被投入监狱，最终死于其中。一个女人被轻视后复仇的故事可能只是中世纪史料的修饰：没收布里特里克的地产只是一个务实举措，以消除诺曼征服后构成威胁的盎格鲁‑撒克逊贵族。\n\n不管怎样，布里特里克的领地后来形成了中世纪格洛斯特男爵领的核心。"
