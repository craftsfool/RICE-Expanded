 RICE_normandy_built_large_church:0 "最近建造了一座大型基督教教堂"
 RICE_normandy_built_large_church_county:0 "一座大型基督教教堂近期建成"
 RICE_normandy_built_large_monastery:0 "最近建造了一座大型基督教修道院"
 RICE_normandy_built_large_monastery_county:0 "一座大型基督教修道院近期建成"
 RICE_normandy_norman_assimilation:0 "诺曼底蕴"
 RICE_normandy_norman_assimilation_desc:0 "完成史诗般[RICE_normandy_struggle|E]，以文化和学术团结了诺曼人而为世人知晓的宗族，甚至超越了他们所学习的法兰克人。"
 RICE_normandy_rollo_modifier:0 "诺曼底之愿"
 RICE_normandy_rollo_modifier_desc:0 "有传言说，上帝向赫罗尔夫预示法国北部应许之地的愿景，并给了他神谕，让他前往那里接受真正的信仰，并在新的家园建立一个强大的王朝。\n\n#italic 当采取[decision|E]或[interaction|E]将诺曼底授予诺斯人时，赫罗尔夫将被优先考虑，而且（如果是AI）只要他满足其他要求，他总是会接受。同样地，赫罗尔夫不需要某些先决条件来进行$RICE_normandy_negotiate_normandy_interaction$[interaction|E]。#!"
 RICE_normandy_saint_aubert_miracle:0 "圣奥贝尔的圣迹"
 RICE_normandy_saint_aubert_miracle_desc:0 "他们说，该角色在圣米歇尔山附近观看圣奥贝尔游行时，目睹或经历了某种奇迹。"
 RICE_normandy_saint_aubert_relic_discoverer:0 "发现圣奥贝尔遗物"
 RICE_normandy_mont_saint_michael_pilgrimage_aubert_modifier:0 "圣奥贝尔的祝福"
 RICE_normandy_mont_saint_michael_pilgrimage_aubert_modifier_desc:0 "该角色最近前往圣米歇尔山朝圣，去瞻仰创始人圣奥贝尔主教，据说圣奥贝尔具有神奇的治愈能力。"
 RICE_normandy_mont_saint_michael_pilgrimage_michael_early_modifier:0 "大天使米迦勒的祝福"
 RICE_normandy_mont_saint_michael_pilgrimage_michael_early_modifier_desc:0 "该角色最近前往圣米歇尔山朝圣，去瞻仰大天使米迦勒，据说米迦勒会对那些威胁或侮辱他或教会的人进行报复。"
 RICE_normandy_mont_saint_michael_pilgrimage_michael_later_modifier:0 "大天使米迦勒的祝福"
 RICE_normandy_mont_saint_michael_pilgrimage_michael_later_modifier_desc:0 "该角色最近前往圣米歇尔山朝圣，去瞻仰大天使米迦勒，回来时受故事的启发，既大天使米迦勒是一位强大的战士，他惩罚罪人、异教徒和任何敢于威胁或侮辱他或教会的人。"
 RICE_normandy_mont_saint_michael_pilgrimage_virgin_mary_modifier:0 "圣母玛利亚的祝福"
 RICE_normandy_mont_saint_michael_pilgrimage_virgin_mary_modifier_desc:0 "该角色最近前往圣米歇尔山朝圣，去瞻仰圣母玛利亚，她是天使长米迦勒的仁慈的对应者，长期以来，米迦勒一直与该地有关。据说，圣米迦勒在来世会权衡人们的灵魂，但圣母玛利亚经常用她的念珠为罪人洗涤罪行。"
 RICE_normandy_norse_raids:0 "诺斯强盗"
 RICE_normandy_norse_raids_desc:0 "一群诺斯冒险家在这个地区建立了强盗基地以掠夺四周，虽然他们人数太少，不足以对统治者构成严重威胁，但不断的袭击正在损害当地人口。"
 RICE_normandy_dudo_of_saint_quentin_WIP_modifier:0 "从事《诺曼底史》的研究"
 RICE_normandy_dudo_of_saint_quentin_modifier:0 "完成《诺曼底史》"
 RICE_normandy_dudo_of_saint_quentin_modifier_desc:0 " 应诺曼底领主的要求，该角色煞费苦心地花了数年时间搜集梳理远方的诺斯冒险者如何定居开始直到现在的资料，最终撰写了一部有关诺曼底公国的不朽而完整的史书。"
 RICE_normandy_norman_raids:0 "诺曼强盗"
 RICE_normandy_norman_raids_desc:0 "一群诺曼“强盗”冒险家在这个地区建立了基地并四处劫掠，虽然他们人数稀少，不足以对统治者构成严重威胁，但不断的袭扰却让当地居民付出了代价。"
 RICE_normandy_norman_long_term_assistance:0 "长期诺曼援助"
 RICE_normandy_norman_long_term_assistance_desc:0 "该角色雇佣了许多学富五车的诺曼人作为顾问和官员，这些诺曼人提供了宝贵的知识和援助，包括军事训练、积极的防御指导和政治指导。"
 RICE_normandy_norman_scholars_modifier:0 "诺曼学者和工匠"
 RICE_normandy_norman_scholars_modifier_desc:0 "在诺曼底合并之后，诺曼人以其精致、文化和学习而闻名。因此该文化性格吸引一些来自外地的学者，进一步提高诺曼底土地上的人的学习和艺术水平。"
 RICE_normandy_alexander_blessing:0 "教宗亚历山大的祝福"
 RICE_normandy_alexander_blessing_desc:0 "1066年，威廉请求教宗亚历山大准许他入侵英格兰，夺取本该属于他的王位。在天主教会最高权威的支持下，威廉的事业怎能不是正确且正义的呢？"
 RICE_normandy_chausey_stone:0 "在当地建筑中使用绍塞石"
 RICE_normandy_apple_orchards:0 "投资苹果园"
 RICE_normandy_apple_orchards_desc:0 "苹果是诺曼底重要的出口产品，当地领主已采取措施鼓励该地区苹果产业的发展。"
 RICE_normandy_brioche:0 "吃大量的诺曼蛋糕"
 RICE_normandy_struggle_ending_conquest_decision:0 "诺曼征服"
 RICE_normandy_struggle_ending_conquest_decision_tooltip:0 "为人民征服[kingdom|E]"
 RICE_normandy_struggle_ending_conquest_decision_desc:0 "[GetGeographicalRegion('RICE_normandy_region').GetName]也许是我们民族的摇篮，但人不可能永远生活在摇篮中，这世界还有大片土地等着我们去征服！遵循[ROOT.Char.GetFaith.HighGodName]的意志下，我们将征服并统治一个比诺曼底更伟大的国家，这即吾等天命！"
 RICE_normandy_struggle_ending_conquest_decision_effect_tooltip_1:1 "xxxxx"
 RICE_normandy_struggle_ending_conquest_decision_confirm:0 "结束$RICE_normandy_struggle$"
 RICE_normandy_struggle_ending_domesday_book_tt:0 "解锁#Bold 编撰《末日审判书》#![decision|E]"
 RICE_normandy_struggle_ending_conquest_tradition_tt:0 "拥有冒险者贵族[tradition|E]的[cultures|E]将#bold 升级#!该传统并获得军事与政治加成"
 RICE_normandy_struggle_ending_conquest_ethos_tt:0 "从$ethos_bellicose_name$、$ethos_stoic_name$、$ethos_communal_name$和$ethos_egalitarian_name$四者之间来决定你的[GetPlayer.GetCulture.GetName][ethos|E]"
 RICE_normandy_struggle_ending_greater_normandy_tt:0 "如果你征服了[GetGeographicalRegion('RICE_greater_normandy_region').GetName]，你将获得[GetTitleByKey('k_normandy').GetNameNoTier][kingdom|E]，且[GetGeographicalRegion('RICE_greater_normandy_region').GetName]中的所有[duchies|E]将成为其[de_jure|E]的一部分"
 RICE_normandy_struggle_ending_england_francia_tt:0 "如果你征服了[GetGeographicalRegion('custom_england').GetName]或[GetGeographicalRegion('custom_west_francia_minus_mediterranean').GetName]，且你没有持有[GetTitleByKey('k_england').GetNameNoTier]和[GetTitleByKey('k_france').GetNameNoTier][kingdom|E]，那么将自动获得上述头衔"
 RICE_normandy_struggle_conquest_decision_correct_phase_tt:0 "[RICE_normandy_struggle|E]现在处于[struggle_phase_normandy_adventure|E]"
 RICE_normandy_struggle_ending_assimilation_decision:0 "完全同化"
 RICE_normandy_struggle_ending_assimilation_decision_tooltip:0 "完全融入拉丁[culture|E]"
 RICE_normandy_struggle_ending_assimilation_decision_desc:0 "世界并非一成不变，在[GetGeographicalRegion('RICE_normandy_region').GetName]的诺斯人后裔和高高在上的“文明的”拉丁人和凯尔特人邻居，长期以来因细微的分歧而冲突不断，但现在，我们拥有共同的语言、习俗和法律。是时候承认到我们都是[GetGeographicalRegion('world_europe_west_francia').GetName]不可分割的一部分了。"
 RICE_normandy_struggle_ending_assimilation_decision_effect_tooltip_1:1 "xxxxx"
 RICE_normandy_struggle_ending_assimilation_decision_confirm:0 "$RICE_normandy_struggle_ending_conquest_decision_confirm$"
 RICE_normandy_struggle_ending_assimilation_tradition_tt:0 "拥有冒险者贵族[tradition|E]的[cultures|E]将#bold 升级#!该传统并获得文化与政治加成"
 RICE_normandy_struggle_ending_assimilation_ethos_tt:0 "从$ethos_spiritual_name$、$ethos_courtly_name$、$ethos_bureaucratic_name$和$ethos_egalitarian_name$四者之间来决定你的[GetPlayer.GetCulture.GetName][ethos|E]"
 RICE_normandy_struggle_assimilation_decision_correct_phase_tt:0 "[RICE_normandy_struggle|E]现在处于[struggle_phase_normandy_acculturation|E]"
 RICE_normandy_struggle_assimilation_decision_development_req:0 "在[GetGeographicalRegion('RICE_normandy_region').GetName]每个[county|E]拥有至少[EmptyScope.ScriptValue('RICE_normandy_assimilation_ending_general_development_level')|0][development|E]"
 RICE_normandy_struggle_assimilation_decision_capital_development_req:0 "你的[capital|E]位于[GetGeographicalRegion('RICE_normandy_region').GetName]并且至少具有[EmptyScope.ScriptValue('RICE_normandy_assimilation_ending_capital_development_level')|0][development|E]"
 RICE_normandy_struggle_ending_scholars_tt:0 "在采取邀请[RICE_normandy_scholars|E][decision|E]时，为每个人解锁邀请[RICE_norman_settlers|E]选项"
 RICE_normandy_struggle_ending_outsider_decision:0 "外来枷锁"
 RICE_normandy_struggle_ending_outsider_decision_tooltip:0 "恢复混乱的[duchy|E]秩序"
 RICE_normandy_struggle_ending_outsider_decision_desc:0 "[GetGeographicalRegion('RICE_normandy_region').GetName]原本该保卫法兰西的北部边疆。如今它却陷入混乱，受制于冲突不断的军阀和外来侵略者，显然它需要由明智领主直接控制。"
 RICE_normandy_struggle_ending_outsider_decision_effect_tooltip_1:1 "xxxxx"
