 normandy.0034.desc.scholars:0 "\n\n我很欣慰[courtier_1.GetFirstNameNoTooltip]将遵守我们最初协议的条款，赞助一些学者、神职人员和工匠，在我的宫廷和王国里用他们的才能协助我。另一方面……有知识#italic 和#!好学的[courtier_1.GetCulture.GetCollectiveNoun]可能比蠢人更危险。"
