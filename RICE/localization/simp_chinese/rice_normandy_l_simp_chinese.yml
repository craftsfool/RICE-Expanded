 game_concept_RICE_normandy_settlers:1 "诺斯和诺曼定居者"
 game_concept_RICE_normandy_settlers_desc:2 "在$culture_era_high_medieval$[era|E]和$culture_era_late_medieval$[era|E]之前，大多数欧洲[rulers|E]都可以使用邀请北欧或诺曼底定居者的[decisions|E]。它允许你分别从斯堪的纳维亚或诺曼底招揽定居者，为你提供不同的奖励。\n\n对于那些来自北欧的冒险者，你还可以额外要求他们保护你免受[varangian_adventures|E]入侵，而对于来自诺曼底的冒险者，你可以要求他们提供长期援助，以提高你的军事和政治地位。如果你邀请定居者成为[rulers|E]，这两种情况都可以获得。\n \n但是，如果你不邀请他们成为[rulers|E]，他们有可能会向你提出额外的要求，比如额外的[gold|E]，甚至是统治一个[county|E]。如果你不答应他们的要求或者谈判破裂，他们就会在你的领土上留下一些负面的[county_modifiers|E]"
 game_concept_RICE_normandy_border_raid:1 "布列塔尼‑诺曼边境劫掠"
 game_concept_RICE_normandy_border_raids:1 "布列塔尼‑诺曼边境劫掠"
 game_concept_RICE_normandy_border_raiding:1 "布列塔尼‑诺曼边境劫掠"
 game_concept_RICE_normandy_border_raid_desc:2 "这是一个特殊类型的[war|E]，模拟法国北部边境地区各$norman$和$breton$领主之间多年的低强度战争。\n\n这场战争适用于[RICE_normandy_struggle_short|E][struggle|E]的[struggle_involved|E][rulers|E]、和那些[cultures|E]属于$heritage_brythonic_name$或有$heritage_frankish_name$[heritage|E]并且[capital|E]在$RICE_normandy_and_brittany_region$[region|E]的统治者，可以对接壤领土的[rulers|E]宣战。在对不同[heritage|E]的人宣战时，其费用也较低。\n\n与[iberian_struggle|E]的[border_raid|E]一样，在这场[war|E]中，进攻方的目标是[siege|E]与其[realm|E]接壤的特定[county|E]。攻占[war_target|E]后，[war_leader|E]可获得[gold|E]，而[war_target|E]将失去[development|E]和[control|E]。攻占后，[buildings|E]也可能被摧毁，从而产出更多的[gold|E]，几率随着[development|E]和[siege|E][army|E]规模的增加而增加。\n\n攻击方在[occupying|E][war_target|E]后将迅速获得[war_score|E]。"
 game_concept_RICE_norman_adventure:0 "诺曼冒险"
 game_concept_RICE_norman_adventures:0 "诺曼冒险"
 game_concept_RICE_norman_adventuring:0 "冒险"
 game_concept_RICE_norman_adventure_adventure:0 "冒险"
 game_concept_RICE_norman_adventure_desc:0 "这是一种特殊的[war|E]，进攻方意图将其[realm|E]全部迁移至[war_target|E]。它类似于[varangian_adventure|E]，但有一些不同之处，并且适用于具有$tradition_RICE_northmen_name$或有$tradition_RICE_adventurers_and_aristocrats_name$[traditions|E]的[cultures|E]。\n\n如果获胜，会立即吞并相应的[counties|E]，并将[capital|E]迁移至此。过去的封臣将获得独立，过去的$game_concept_counties$将被交给新崛起的当地军阀。#EMP 只有#![duke|E]和$game_concept_count$[title_tier|E]的[rulers|E]才能进行$game_concept_RICE_norman_adventures$，每一次成功的$game_concept_RICE_norman_adventure_adventure$也会让花费越来越高\n\n该[casus_belli|E]在$culture_era_early_medieval$和$culture_era_high_medieval$[eras|E]中可用，不能用来对付其他具有$tradition_RICE_northmen_name$或$tradition_RICE_adventurers_and_aristocrats_name$[traditions|E]的[cultures|E]。\n\n当启动他们的第一个$game_concept_RICE_norman_adventure$时，进攻方获得高达[EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0][special_troops|E]的奖励，金额随他们完全控制其领域内的每一个同[faith|E]同[culture|E]伯爵领而上升。"
 RICE_normandy_struggle:0 "联合诺曼底"
 RICE_normandy_struggle_desc:0 "我的品位独一无二，无趣的你不会明白的\n\n我的品位独一无二，无趣的你不会明白的"
 struggle_RICE_normandy_phase_adventure:0 "机遇"
 struggle_RICE_normandy_phase_adventure_desc:0 "[struggle_phase|E]——机遇，是象征[RICE_normandy_struggle|E]的机遇年代，无论是由于[struggle_phase_normandy_confrontation|E]的冲突，还是由于[struggle_phase_normandy_acculturation|E]的繁荣、稳定。\n\n现在，来自斯堪的纳维亚的人（也包括欧洲其他地区的人）大量抵达诺曼底，要么定居，要么成为雇佣兵，要么成为劫匪。同时，那些已经在这里的人也被刺激着去异国他乡寻找财富。\n\n然而，机遇年代的风口就那么点时间。如果诺曼底的[rulers|E]扩张权力太快，这可能会导致激化为[struggle_phase_normandy_confrontation|E]，或如果[rulers|E]谨慎地处理这些大杂烩般的诺曼底，这可能会进入[struggle_phase_normandy_acculturation|E]"
 struggle_RICE_normandy_phase_acculturation:0 "共存"
 struggle_RICE_normandy_phase_acculturation_desc:0 "在经历了一次收获颇丰的[struggle_phase_normandy_adventure|E]后，或者当[struggle_phase_normandy_confrontation|E]平息后，[RICE_normandy_struggle|E]沿着时间长河继续进行，该地区的居民已经适应[struggle_phase|E]学会共处。\n\n不同群体之间的频繁接触导致了法律、语言、军事战术等方面的思想交流，采用拉丁思想成为最主要的趋势，学习这些又[rulers|E]让试图加强他们的权威，更有效地管理[realm|E]。\n\n如果这些吸收不同思想和习俗引起了摩擦，可能会引起不同的领主或团体之间的冲突，会导致[struggle_phase_normandy_confrontation|E]。然而，如果文化同化获得成功，这可能会进一步促进诺曼底的繁荣，从而导致[struggle_phase_normandy_adventure|E]。"
 struggle_RICE_normandy_phase_confrontation:0 "冲突"
 struggle_RICE_normandy_phase_confrontation_desc:0 "由于在[struggle_phase_normandy_acculturation|E]中未能通过同化来凝聚当地文化共识，或在[struggle_phase_normandy_adventure|E]中领主冲突，导致[RICE_normandy_struggle|E]在[struggle_phase|E]中面临挫折与挑战。\n\n现在，诺曼底即使没有面临战争，但动荡不断，小贵族们对领主的统治不满。同时，现在生活在诺曼底的各个团体经常争夺世俗和宗教权力。\n\n最终，如果冲突各方通过武力或外交手段相互容忍，他们就可以开始建立一个统一的诺曼底社会，从而导致[struggle_phase_normandy_acculturation|E]的出现。他们也可能希望在其他地方寻求财富，或者邀请其他人协助他们解决争端，从而导致[struggle_phase_normandy_adventure|E]的发生。"
