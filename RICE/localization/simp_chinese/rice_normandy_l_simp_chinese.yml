 normandy.0005.t:0 "诺曼征服"
 normandy.0005.desc:0 "许多年前，当[rollo.GetFullName]来到法国北部海岸，统治[normandy.GetNameNoTier]时，很少有人能想象到[normandy_struggle_ender.GetCulture.GetCollectiveNoun]日后的命运。[normandy.GetNameNoTierNoTooltip]，曾经是由不同出身的军阀兵革不休局面，在[normandy_struggle_ender.GetTitledFirstName]的统治下实现了统一。"
 normandy.0005.desc.francia:0 "\n\n在[normandy_struggle_ender.GetFirstNamePossessiveNoTooltip]杰出而坚定的带领下，[normandy_struggle_ender.GetCulture.GetCollectiveNoun]已经实现诺斯先辈们渴望已久的目标：完全控制[GetGeographicalRegion('world_europe_west_francia').GetName]的北部地带！\n\n通过结合诺斯人和法兰克人的优点，毫无疑问，[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]开始经历一个黄金时代。"
 normandy.0005.desc.greater_normandy:0 "\n\n\n在[normandy_struggle_ender.GetFirstNamePossessiveNoTooltip]卓越而坚定的领导下，[normandy_struggle_ender.GetCulture.GetCollectiveNoun]已经形成了一个伟大的帝国，横跨以前由昔日对手凯尔特人和弗拉芒人的领土。\n\n现在他们成为西欧一个强大的力量！这无疑是[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]的黄金开始！"
 normandy.0005.desc.england:0 "\n\n在[normandy_struggle_ender.GetFirstNamePossessiveNoTooltip]出色而坚定的领导下，[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]已经越过了英吉利海峡，从失德之人中夺得[GetGeographicalRegion('custom_england').GetName]！毫无疑问，他们将在整个[GetGeographicalRegion('custom_england').GetNameNoTooltip]传播法兰克的方方面面\n\n现在，有了横跨英吉利海峡的领地，[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]一个新的黄金时代已经来临了！"
 normandy.0005.desc.bellicose:0 "[normandy_struggle_ender.GetFirstNameNoTooltip]知道，往后，[normandy_struggle_ender.GetHerHis]人要想经久不衰，唯有不断征战！"
 normandy.0005.desc.stoic:0 "[normandy_struggle_ender.GetFirstNameNoTooltip]很清楚[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]会继续面临的威胁，然而他们无疑会尽最大努力保护他们新征服的家园！"
 normandy.0005.desc.communal:0 "[normandy_struggle_ender.GetFirstNameNoTooltip]认为，为了延续巩固胜利成果，[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]必须继续建立社区联系。"
 normandy.0005.desc.cosmopolitan:0 "就[normandy_struggle_ender.GetFirstNameNoTooltip]而言，只有通过拥抱不同的观点和政策才能确保战争的胜利。[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]将继续实践这些"
 normandy.0005.a:0 "就这样，诺曼底巩固了地位。"
 normandy.0006.t:0 "诺曼底完全同化"
 normandy.0006.desc:0 "很多年前，当[rollo.GetFullName]到达法国北部海岸统治[normandy.GetNameNoTier]时，一些人嘲笑[rollo.GetSheHe]对劫掠比对统治和文化更感兴趣，与高贵的法兰克人形成了鲜明对比。多么讽刺是，[rollo.GetFirstNamePossessiveNoTooltip]的继承者们已经完全融入了法兰克文明!\n\n[normandy.GetNameNoTierNoTooltip]曾经充斥着混战的军阀，但终于在[normandy_struggle_ender.GetTitledFirstName]的治理下统一了。感谢[normandy_struggle_ender.GetHerHim]，如今[normandy_struggle_ender.GetCulture.GetCollectiveNoun]接受了法兰克文化、语言、习俗、法律和行政的各个方面，同时仍设法保持自己的身份。曾经的学生而今成为一代教师！\n\n"
 normandy.0006.desc.spiritual:0 "几乎没有人在去过[normandy.GetNameNoTierNoTooltip]之后还对宗教之于[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]的重要性，以及其在[normandy_struggle_ender.Custom('DefaultPriestTitlePlural')]的神学造诣产生怀疑。[normandy_struggle_ender.GetFirstNameNoTooltip]相信，正是这种对[normandy_struggle_ender.GetFaith.GetName]和[normandy_struggle_ender.GetFaith.HighGodName]的投入，使得他们通向未来的繁荣道路。"
 normandy.0006.desc.bureaucratic:0 "[normandy_struggle_ender.GetFirstNameNoTooltip]很清楚，书写历史的不是胜利者，而是历史的第一记录人。就[normandy_struggle_ender.GetSheHe]而言，无论[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]发生什么都会被关注，他们对学习和记录的奉献无疑将确保他们的历史在未来的传说中永垂不朽。"
 normandy.0006.desc.courtly:0 "[normandy_struggle_ender.GetFirstNameNoTooltip]正集中力量为[normandy_struggle_ender.GetHerHis]的宫廷添砖加瓦，如今富丽堂皇的宫殿及其所在城市已逐步发展为该地区的学术与文化中心。毫无疑问，这一切都将使周围的外乡人们坚信[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]不仅是有文化的文明人，他们在某些领域甚至青出于蓝，比如冶金，种植以及人才培养"
 normandy.0006.desc.cosmopolitan:0 "毫无疑问，[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]的不同起源，以及各种文化和教义的融合，是他们的巨大优势之一。尽管这一切并非一帆风顺，多年来也曾出现许多紧张的局势甚至于冲突，但[normandy_struggle_ender.GetFirstNameNoTooltip]知道，持续拥抱多元的世界观才是他们持续成功的原因。"
 normandy.0006.desc.bellicose:0 "然而，[normandy_struggle_ender.GetCulture.GetCollectiveNounNoTooltip]并没有忘记他们被战争蹂躏的过去，他们甚至比其邻人更了解战争。对于[normandy_struggle_ender.GetFirstNameNoTooltip]来说，[normandy_struggle_ender.GetHerHis]人首先是军人，当然，是有学问和文化的军人而非蛮族。"
 normandy.0006.a:0 "$normandy.0005.a$"
 normandy.0007.t:0 "诺曼底的外来枷锁"
 normandy.0007.desc:0 "多年前，当[rollo.GetFullName]抵达法国北部海岸，统治[normandy.GetNameNoTier]时，许多人认为这只是暂时的，毕竟一个野蛮祖鲁的诺斯人怎么能长期统治得好这个地区呢？[normandy.GetNameNoTierNoTooltip]中的小领主之间兵革不休，历经数代，这更进一步证实了他们的观点\n\n但不管怎样，总得有人来恢复秩序。[normandy_struggle_ender.GetTitledFirstName]，一个外来统治者出面宣称[normandy_struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip]对该地区的管辖权。\n\n很明显，向诺曼底进军是一次失败的行动；该地区甚至在没有外来者的情况下都无法无天。直到[normandy_struggle_ender.GetFirstNamePossessiveNoTooltip]的权威在整个[normandy.GetNameNoTierNoTooltip]中不受质疑，公国才能在经历了这么多年的冲突和混乱后，看到一丝稳定的可能。"
 normandy.0007.a:0 "$normandy.0005.a$"
 normandy.0008.t:0 "$normandy.0006.t$"
 normandy.0008.desc:0 "当朝阳出现在[GetGeographicalRegion('RICE_normandy_region').GetName]，新的一天开始了。我们[ROOT.Char.GetCulture.GetCollectiveNoun]不仅享受作为该地区的尊贵主人的种种便利，也同时承担起守护这里璀璨文化的重任。我们已经汲取了拉丁文化与斯堪的纳维亚文化的精华，并正逐步成长为一个追求学术，教育和艺术的社会。\n\n但在我们真正将自己视作法国文化的一份子之前，我们应该考虑清楚，作为[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]，将要选择怎样的道路。我们作为团结一致的民族，应该珍视和尊崇怎样的价值和理念呢？"
 normandy.0008.a:0 "信仰[ROOT.Char.GetFaith.HighGodName]将带领我们走向更多胜利！"
 normandy.0008.b:0 "通过专注于宫廷艺术，我们会给很多人留下深刻印象。"
 normandy.0008.c:0 "通过文学与学习，我们将永垂不朽。"
 normandy.0008.d:0 "为了更繁荣，我们应该接纳我们多元的起源。"
 normandy.0008.e:0 "虽已是文明之人，但不能忘武者之根！"
 normandy.0009.t:0 "$normandy.0005.t$"
 normandy.0009.desc:0 "随着[GetGeographicalRegion('RICE_normandy_region').GetName]新一天的到来，我开始回忆那些伟大而可怕的战争岁月。我们在此完成了伟大的诺曼征服！毫无疑问，未来的历史学家将会大肆书写我们的英勇事迹。\n\n然而在征服了敌人之后，在作为一个强大王国的统治者开始这个新时代之前，我们作为[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]要去向何方呢？作为一个团结的民族，我们价值观和理念应该是什么呢？"
 normandy.0009.a:0 "战争对我们来说仍然很重要。"
 normandy.0009.b:0 "我们会捍卫我们挣得的东西。"
 normandy.0009.c:0 "与敌人作战使我们团结一致。"
 normandy.0009.d:0 "多元血统使我们强大。"
 normandy.0010.t:0 "一个基督教宗教场所"
 normandy.0010.desc:0 "像我这种身居要位之人，有必要向世人展示作为虔信的[faith.GetAdherentNamePlural]对[faith.HighGodName]的虔诚，可以修建一所[christian.GetAdjective]的宗教场所。这样不仅能丰富当地民众的精神世界，还能赎罪善功，展示我们虔敬恭顺。\n\n因此我决定修建一所"
 normandy.0010.desc.chapel:0 "#Bold [faith.GetAdjectiveNoTooltip]小礼拜堂#!。尽管小型礼拜场所通常缺乏[faith.PriestNeuterPlural]，但他们依然有其用途。在穷乡僻壤之地，一座小礼拜堂可以为那些因山高路远而无法抵达大教堂的乡民们提供祷告的场所，也有些小礼拜堂作为更大的宗教建筑群的附属建筑而存在。"
 normandy.0010.desc.small_church:0 "#Bold 小[faith.GetAdjectiveNoTooltip]教堂#!。像这样的教堂服务于较小定居点的精神需求，或者在某些情况下，服务于偏远的农村地区。虽然大多是简陋的，但是满足[faith.GetAdherentNamePluralNoTooltip]们的精神需求是必不可少的。"
 normandy.0010.desc.small_monastery:0 "#Bold  小[faith.GetAdjectiveNoTooltip]修道院#!。在这里，修士和修女可以避世隐修，在一个和平的环境中学习神学和[faith.ReligiousText]，而僧尼的知识也可以为当地社区提供有限的服务。"
 normandy.0010.desc.large_church:0 "#Bold 大[faith.GetAdjectiveNoTooltip]教堂#!。虽然这不是高耸的大教堂，但它仍将成为周围的一道令人印象深刻的风景。它的存在将激励当地人做出更伟大的事迹，并为他们提供一个祈祷和膜拜[faith.HighGodName]的地方。"
 normandy.0010.desc.large_monastery:0 "#Bold 大[faith.GetAdjectiveNoTooltip]修道院#!。在这里，修士和修女可以可以避世隐修，在一个和平的环境中学习神学和[faith.ReligiousText]。这个修道院还可以为当地社区提供一些服务，甚至还可以充当医院、学校和酿酒厂。"
 normandy.0010.desc.conclusion:0 "\n\n总而言之，这座建筑需要一些时间才能完工，但我相信等待是值得的。"
 normandy.0010.a:0 "我期待着它的完成。"
 normandy.0010.disclaimer:0 "#bold 当这个神圣场所在大约一到两年的时间内完成建设时，你将获得以下加成。#!"
 normandy.0011.t:0 "基督教宗教场所落成"
 normandy.0011.desc.chapel:0 "赞美[faith.HighGodName]！\n\n我刚得到消息，我在[county.GetNameNoTier]下令建造的[faith.GetAdjective]礼拜堂已完工。虽然很简朴，但毫无疑问，当地的[faith.GetAdherentNamePluralNoTooltip]将大量使用它来祈祷和崇拜。"
 normandy.0011.desc.small_church:0 "赞美[faith.HighGodName]！\n\n我刚得到消息，我下令在[county.GetNameNoTier]建造的[faith.GetAdjective]小教堂已经竣工。毫无疑问，它将在未来许多年里，在当地居民的宗教生活中发挥重要作用。"
 normandy.0011.desc.small_monastery:0 "赞美[faith.HighGodName]！\n\n我刚得到消息，我在[county.GetNameNoTier]下令建造的[faith.GetAdjective]修道院已完工。与其他大型修道院相比，它的规模可能比较小，但它将以多种方式为当地社区提供服务。"
 normandy.0011.desc.large_church:0 "赞美[faith.HighGodName]！\n\n我刚得到消息，我在[county.GetNameNoTier]下令建造的大[faith.GetAdjective]教堂已完工。虽然它不能与那些伟大的大教堂相比，但它仍是一道壮丽风景，并将激励和满足许多代[faith.GetAdherentNamePluralNoTooltip]。"
 normandy.0011.desc.large_monastery:0 "赞美[faith.HighGodName]！\n\n我刚得到消息，我在[county.GetNameNoTier]下令建造的大[faith.GetAdjective]修道院已完工。凭借其巨大的规模和像样的修道院社区，它将为附近的定居点提供许多重要的服务，并成为当地的学习和信仰中心。"
 normandy.0011.a:0 "我很高兴建立了这样一个宗教场所。"
 normandy.0012.t:0 "$normandy.0011.t$"
 normandy.0012.desc:0 "在我皈依[ROOT.Char.GetFaith.GetName]之前，我捐了一大笔钱来建立一个新的[faith.GetAdjective]建筑在[county.GetNameNoTier]。那座即将完工的建筑对我来说已经没有任何精神意义了。\n\n也就是说，我仍然可以鼓励使用它作为对[christian.GetAdjective]社区的善意姿态，毕竟我曾经是该社区的一员。另一方面，也许我应该证明我对新信仰[ROOT.Char.GetFaith.HighGodName]的虔诚，让其自生自灭或者将其作为其他设施重用。"
 normandy.0012.a:0 "允许当地基督徒使用它来满足他们的宗教需要。"
 normandy.0012.a.tooltip:0 "因为你皈依了非基督[faith|E]，你将失去其对应的[character_modifier|E]。"
 normandy.0012.b:0 "不承认那座建筑，余乃[ROOT.Char.GetFaith.GetAdherentName]！"
 normandy.0012.b.tooltip:0 "为了证明你皈依[THIS.Char.GetFaith.GetName]的虔诚，你不仅失去原本获得的[character_modifier|E]加成，且失去在[realm_capital|E]中的[county_modifier|E]的加成"
 normandy.0013.t:0 "xxxxx"
 normandy.0013.desc:0 "xxxxx"
 normandy.0013.a:0 "xxxxx"
 normandy.0014.t:0 "xxxxx"
 normandy.0014.desc:0 "xxxxx"
 normandy.0014.a:0 "xxxxx"
 normandy.0015.t:0 "大调查"
 normandy.0015.desc.england:0 "虽然我已经适应了我作为[GetGeographicalRegion('custom_england').GetName]统治者的角色，但要驯服这片“背信弃义的阿尔比恩”之岛，还有许多工作要做。"
 normandy.0015.desc.france:0 "虽然我已经适应了我作为[GetGeographicalRegion('custom_west_francia_minus_mediterranean').GetName]统治者的角色，但要驯服这些卢瓦尔河和塞纳河畔“不听话”的领主们，还有许多工作要做。"
 normandy.0015.desc.greater_normandy:0 "虽然我已经适应了我作为[GetGeographicalRegion('RICE_greater_normandy_region').GetName]统治者的角色，但要驯服这些从布列塔尼半岛到弗里西亚沼泽的沿海土地，还有许多工作要做。"
 normandy.0015.desc:0 "仍有许多人质疑[ROOT.Char.GetDynasty.GetName]家族治理这片领土的能力。\n\n我决定对这片土地进行一次伟大的调查——一次远超这里，甚至全世界的调查！这不仅有助于我们对这片土地进行征税和管理，还能让我们更好地控制当地百姓。\n\n"
 normandy.0015.desc.steward:0 "我的[ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName][steward.GetTitledFirstName]向我保证一切都会按计划进行。[steward.GetSheHe|U]已经挑选了官员来进行这项调查，并要求他们在一两年内完成。"
 normandy.0015.desc.no_steward:0 "我的官员向我保证，一切将按计划进行。他们已经着手调查，预计在一两年内完成。"
 normandy.0015.a:0 "我期待看到调查结果。"
 normandy.0016.t:0 "末日审判书"
 normandy.0016.desc.steward:0 "我的[ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName][steward.GetTitledFirstName]有喜讯相报："
 normandy.0016.desc.no_steward:0 "我的官员们今天高兴地给我带来了喜讯："
 normandy.0016.desc.england:0 "我们的[GetGeographicalRegion('custom_england').GetName]大调查已经完成了！"
 normandy.0016.desc.france:0 "我们的[GetGeographicalRegion('custom_west_francia_minus_mediterranean').GetName]大调查已经完成了！"
 normandy.0016.desc.greater_normandy:0 "我们的[GetGeographicalRegion('RICE_greater_normandy_region').GetName]大调查已经完成了！"
 normandy.0016.desc.not_original:0 "\n\n我的前任不久前明智地开始了这项工作，我现在可以从调查结果中受益。"
 normandy.0016.desc.original:0 "\n\n我不久前开始了这项工作，我很高兴我现在可以从调查结果中受益。"
 normandy.0016.desc:0 "有了关于这一地区人民和资产的可靠信息，我们可以更有效地对当地百姓征税，并确保我们在此的统治。\n\n有趣的是，有些人将称其为“末日审判”（或“末日裁决”）。他们说我的官员们做得极其出色，导致手稿中的记录就像是最后的审判——其中包含的信息是不可更改，不容置疑的。"
 normandy.0016.a:0 "官员们干得好！"
