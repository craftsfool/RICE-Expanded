 normandy.0110.t:0 "撰写诺曼底史"
 normandy.0110.desc:0 "几年前，以[rollo.GetTitledFirstNameNicknamed]为首的斯堪的纳维亚冒险者控制了[GetGeographicalRegion('RICE_normandy_region').GetName]。然而，$d_normandy$，这里仍是一个军阀和民族争斗不休的边境地区。我想到了一个可行的方法来统一此地，不仅仅是在法律或政治意义上，而是作为一个社会整体。\n\n如果我能找到一位学者撰写一部我们在$d_normandy$共同的历史，我的宗族再加以支持，我们就能建立一个共同的身份认同，作为一个民族团结起来，这样也使我们的统治合法化、集权化。\n\n"
 normandy.0110.desc.candidate:0 "宫廷中有些人表示有兴趣参与并领导这项任务。还有人"
 normandy.0110.desc.no_candidate:0 "虽然宫廷中没人有兴趣领导这个任务，但我的一些廷臣们"
 normandy.0110.desc.conclusion:0 "推荐了一位当地学者[scholar.GetFullName]，此人对历史、文学和神话都颇有了解。"
 normandy.0110.a:0 "[candidate_1.GetFirstName]是这项工作的最佳人选！"
 normandy.0110.a.tooltip:0 "[candidate_1.GetFirstNameNoTooltip]将花几年时间研究这段历史。"
 normandy.0110.b:0 "[candidate_2.GetFirstName]有能力胜任这项工作。"
 normandy.0110.b.tooltip:0 "[candidate_2.GetFirstNameNoTooltip]将花几年时间研究这段历史。"
 normandy.0110.c:0 "让我们邀请[scholar.GetFirstName]来领导这项工作吧！"
 normandy.0110.c.tooltip:0 "[scholar.GetFirstNameNoTooltip]将花几年时间研究这段历史。"
