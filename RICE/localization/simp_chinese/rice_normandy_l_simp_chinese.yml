 normandy.0050.t:0 "为朝圣做准备"
 normandy.0050.desc:0 "我计划去[avranches.GetNameNoTier]附近的圣米歇尔山。作为法国主要的[faith.GetReligion.GetAdjective]圣地，它吸引着来自四面八方的朝圣者，而我也将成为这样的朝圣者之一。许多人想去那里崇敬大天使米迦勒，"
 normandy.0050.desc.early:0 "特别是圣米歇尔山的创始人圣奥贝尔，我自然也不例外。"
 normandy.0050.desc.late:0 "以他所有的荣耀之名，我自然也不例外。"
 normandy.0050.a:0 "为参观做好准备！"
 normandy.0051.t:0 "出发去圣米歇尔山"
 normandy.0051.desc:0 "预备工作已经完成，我准备好前往[avranches.GetNameNoTier]附近的圣米歇尔山了。我期待崇拜[faith.HighGodName]的荣耀"
 normandy.0051.desc.early:0 "通过大天使米迦勒和圣奥贝尔！"
 normandy.0051.desc.late:0 "在大天使米迦勒面前！"
 normandy.0051.a:0 "我们去圣米歇尔山！"
 normandy.0052.t:0 "到达圣米歇尔山"
 normandy.0052.desc:0 "我来到了位于圣米歇尔山所在海湾岸边的库埃农河口，它坐落在一座高耸的岛屿上。甚至当我离目的地还有一段距离时，我就能从远处看到圣米歇尔山高耸的景色——这真是令人振奋的景象。\n\n退潮时，我穿过潮汐堤进入此地，而有些迫不及待的蠢货们可能会在海浪中丧生或受伤。"
 normandy.0052.a:0 "很高兴在这里！"
 normandy.0053.t:0 "圣米歇尔山"
 normandy.0053.desc:0 "在过去的几天里，我对圣米歇尔山有了很好的了解。[faith.PriestNeuterPlural]因像我一样的[faith.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]存在而荣耀。\n\n"
 normandy.0053.desc.early:0 "尽管圣米歇尔山与天使长米迦勒息息相关(毕竟是以其名字命名的)，但许多[faith.GetReligion.GetAdjective]朝圣者更愿意崇敬圣米歇尔山的创始人及其主教——圣奥贝尔的遗物。\n\n奥贝尔的主要遗物是他的头骨，如今人们仍可以看到上面的洞，传言这是米迦勒用手指戳了戳奥贝尔，劝说他找到这里。许多朝圣者因为治愈奇迹的传说关注圣奥贝特，而非严厉的惩罚恶与罪的圣米迦勒。"
 normandy.0053.desc.late:0 "圣米歇尔山与天使长米迦勒息息相关(毕竟是以其名字命名的)。因此，[faith.GetReligion.GetAdjective]朝圣者通常把注意力集中在崇敬米迦勒上。这里有一个他的大金像，是许多朝圣者的焦点。\n\n对圣母玛利亚的敬礼在这里也很流行。她与严厉的大天使形成对比。据说，圣米迦勒衡量我们的灵魂，而圣母玛利亚常用她的念珠为罪人倾斜天平。"
 normandy.0053.desc.conclusion:0 "\n\n现在，我应该崇敬谁？"
 normandy.0053.a:0 "治愈者圣奥贝尔"
 normandy.0053.a.toast:0 "你得到了圣奥贝尔的祝福！"
 normandy.0053.b:0 "天使长圣米迦勒"
 normandy.0053.b.toast:0 "你得到了圣米迦勒的祝福！"
 normandy.0053.c:0 "荣福童贞玛利亚"
 normandy.0053.c.toast:0 "你得到了圣母玛利亚的祝福！"
 normandy.0053.d:0 "天使长圣米迦勒"
 normandy.0053.d.toast:0 "你得到了圣米迦勒的祝福！"
 normandy.0054.t:0 "离开圣米歇尔山"
 normandy.0054.desc:0 "我的圣米歇尔山之旅即将结束，在此期间，我欣赏了这里的风景，见证了[faith.HighGodName]和[faith.HighGodHerHis]创造的荣耀。\n\n然而，现在我该回家了。\n\n我准备好行李离开，穿过我曾经进入这个地方的潮汐堤道，仍然有更多的朝圣者向我相反的方向走去。谁知道他们在这里会经历什么奇迹呢？"
 normandy.0054.a:0 "也许有一天我还会来拜访。"
 normandy.0055.t:0 "朝圣结束"
 normandy.0055.desc:0 "终于到家了!\n\n我从圣米歇尔山朝圣回来了。大家都说我在那度过了一段充实的时光，这次旅行我很高兴。"
 normandy.0055.a:0 "现在，是该回到我的日常生活了。"
 normandy.0056.t:0 "xxxxx"
 normandy.0056.desc:0 "xxxxx"
 normandy.0056.a:0 "xxxxx"
