 normandy.0058.a:0 "xxxxx"
 normandy.0059.t:0 "xxxxx"
 normandy.0059.desc:0 "xxxxx"
 normandy.0059.a:0 "xxxxx"
 normandy.0060.t:0 "[avranches.GetNameNoTierNoTooltip]之旅"
 normandy.0060.desc:0 "每年在五旬节之后，[avranches.GetNameNoTier]人会组织一个为圣奥贝尔举行的游行。圣奥贝尔主教是附近圣米歇尔山圣地的创建者，他很受当地[faith.GetReligion.GetAdjective]社区的尊敬。多年来，许多人声称在这次事件中目睹了，甚至是受到了各种奇迹的影响。\n\n今年，我打算去[avranches.GetNameNoTierNoTooltip]自己观察圣奥伯特的游行。也许我会亲眼见证一个奇迹!"
 normandy.0060.a:0 "向前——我们去[avranches.GetNameNoTierNoTooltip]！"
 normandy.0061.t:0 "圣奥贝尔游行"
 normandy.0061.desc:0 "当我到达[avranches.GetNameNoTier]，当地人和[faith.GetAdjective][faith.PriestNeuterPlural]对我的出现感到很荣幸。像我这样地位的人参加圣奥贝的游行不是每次都有的。\n\n在游行的那天，一群[faith.PriestNeuterPlural]和俗人带着圣奥贝尔的圣物从圣米歇尔山游行穿过[avranches.GetNameNoTierNoTooltip]的街道。奥贝尔曾经是此地主教。、\n\n据传说，大天使米迦勒曾两次指示奥贝尔建立圣米歇尔山，但奥贝尔没有理会，担心这是[faith.DevilName]的欺骗。在他第三次来访时，愤怒的大天使戳了奥伯尔的头，说服他完成自己的使命。\n\n即使在今天，我们都能看到奥伯特头骨上的洞。它被带到镇上，有很多人说见证它会带来各种奇迹!"
 normandy.0061.a:0 "不可思议的景象！"
 normandy.0061.miracle.tooltip:0 "你在游行中见证了奇迹！"
 normandy.0061.toast:0 "$normandy.0061.miracle.tooltip$"
 normandy.0062.t:0 "离开[avranches.GetNameNoTierNoTooltip]"
 normandy.0062.desc:0 "我刚从[avranches.GetNameNoTier]那的一年一度的[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]游行中回到家里。这是一次美妙的经历，看到这位圣人的遗物，联系到他与天使长米迦勒的精神联系，以及他建立圣米歇尔山这一伟大建筑，不得不感慨万分。"
 normandy.0062.desc.miracle:0 "\n\n我特别幸运地在游行中目睹了一个奇迹！毕竟，这样的事情并不总是发生。"
 normandy.0062.a:0 "也许我将来应该再来！"
 normandy.0063.t:0 "xxxxx"
 normandy.0063.desc:0 "xxxxx"
 normandy.0063.a:0 "xxxxx"
 normandy.0064.t:0 "xxxxx"
 normandy.0064.desc:0 "xxxxx"
 normandy.0064.a:0 "xxxxx"
 normandy.0065.t:0 "圣奥贝尔的遗物被找到了吗？"
 normandy.0065.desc:0 "前段时间，[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]的创始人圣奥贝尔的遗物失踪了。这对长期以来一直作为当地朝拜和学习的圣米歇尔山来说是巨大的打击。因此，我发起了一次寻找这些文物的尝试。"
 normandy.0065.desc.found:0 "\n\n似乎[ROOT.Char.GetFaith.HighGodName]今天偏爱我们！[ROOT.Char.GetFaith.PriestNeuterPlural]向我报告说，这些遗物位于最近去世的[ROOT.Char.GetFaith.PriestNeuter]家中。这一发现发生了一些奇迹事件——例如，一个对遗物的真实性表示怀疑的[ROOT.Char.GetFaith.PriestNeuter]得瘫痪了！这无疑证实了这些是圣奥伯尔的真正圣物。"
 normandy.0065.desc.not_found:0 "\n\n唉，看来今天[ROOT.Char.GetFaith.HighGodName]并不青睐我们。经过努力，我们没有发现任何遗物的痕迹。不过[ROOT.Char.GetFaith.PriestNeuterPlural]还是感谢我的帮助;希望有一天我们能找到这些遗物吧。"
 normandy.0065.a:0 "不可思议！"
 normandy.0065.b:0 "所以就是这样。"
 normandy.0065.info:0 "$RICE_normandy_find_saint_aubert_relics_context_tooltip$"
 normandy.0065.tooltip:0 "$RICE_normandy_observe_procession_of_saint_aubert$[decision|E]现在可用，$RICE_normandy_mont_saint_michael_pilgrimage$[decision|E]现在可以在更大的地理范围内使用"
 normandy.0066.t:0 "圣奥贝尔的遗物失踪"
 normandy.0066.desc:0 "多年来，[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]安全地保存着其创始人阿夫朗什的圣奥贝尔的遗物。虽然修道院是献给大天使米迦勒的，祂最初指示圣奥贝特建立了这个地方，当地的[christian.GetAdjective]朝圣者也在许多场合前来瞻仰圣奥贝尔。\n\n不幸的是，圣奥贝的遗物不知何故失踪了，无处可寻。也许这是由于看门人的粗心大意，或者它们是被偷的，亦或者由于附近的[christian.GetAdjectiveNoTooltip]社区的原罪导致“奇迹般地”消失了。\n\n当地领主目前正在努力寻找这些遗物，但不知结果如何。不管怎样，当地的朝圣者肯定会对此事感到悲伤。"
 normandy.0066.a:0 "这些遗物还会被找到吗？"
 normandy.0066.info:0 "$RICE_normandy_find_saint_aubert_relics_context_tooltip$"
 normandy.0066.tooltip:0 "$RICE_normandy_find_saint_aubert_relics$[decision|E]现在可用"
 normandy.0067.t:0 "圣奥贝尔的遗物被找到"
 normandy.0067.desc:0 "不久前，[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]创始人圣奥伯尔的遗物不见了。从那以后，人们曾多次试图找到它们。现在[relic_discoverer.GetTitledFirstName]很高兴地报告圣人的遗物已经被重新发现。\n\n关于这些遗物和它们的发现的一些神奇的故事已经开始广泛传播，提高了圣徒崇拜和修道院的声望和声誉。这反过来又吸引了更多远方来的[christian.GetAdjective]朝圣者。"
 normandy.0067.a:0 "愿赞美归于[ROOT.Char.GetFaith.HighGodName]！"
 normandy.0067.b:0 "有趣的消息……"
 normandy.0067.tooltip:0 "$normandy.0065.tooltip$"
 normandy.0068.t:0 "圣米迦勒金像"
 normandy.0068.desc:0 "[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]这个名字几个世纪来一直与大天使米迦勒紧密联系在一起。在此期间的大部分时间里，该遗址的创始人圣奥贝尔一直被当地人和朝圣者视作大天使权力的象征。\n\n然而，近年来，圣米迦勒越来越受欢迎，牺牲了现有的圣奥贝尔崇拜。唯一的问题是，作为大天使，米迦勒没有留下任何身体上的遗物。信徒的敬拜重点在哪里？\n\n幸运的是，由于[statue_giver.GetTitledFirstName]的努力，已经找到了解决方案。[statue_giver.GetSheHe|U]向修道院捐赠了一尊巨大的金色天使长雕像——在美丽和威严方面超过了许多类似的雕像。[statue_giver.GetHerHis]在某种程度上希望这能让所有人都能看到修道院的赞助人是谁。"
 normandy.0068.a:0 "这是给修道院的一份多么光荣的礼物啊！"
 normandy.0068.b:0 "我不喜欢他们的异教行为。"
 normandy.0068.info:0 "$RICE_normandy_mont_saint_michael_pilgrimage_context_tooltip$"
 normandy.0069.t:0 "xxxxx"
 normandy.0069.desc:0 "xxxxx"
 normandy.0069.a:0 "xxxxx"
 normandy.0070.t:0 "绍塞石"
 normandy.0070.desc:0 "我治下的几位官员请我注意那块花岗岩及其用途和使用方法，它来自[avranches.GetNameNoTier]海岸外的一个绍塞岛。例如，它被用于建造[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]。\n\n这些官员说，他们正在联系运送这些石料的商人，我们可以谈一笔不错的交易，为各种项目采购石料，比如教堂或道路的建造。"
 normandy.0070.a:0 "好主意。那我们就这么办吧。"
 normandy.0070.b:0 "我们暂时不需要石料。"
 normandy.0071.t:0 "捐款？"
 normandy.0071.desc:0 "我最近一直在考虑[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]。这对于像我这样的[ROOT.Char.GetFaith.GetReligion.GetAdjective]统治者来说，愿意投入一些资金来协助维护这个场所，甚至扩建它并不罕见。也许我应该这样做来向所有人表达我对[ROOT.Char.GetFaith.HighGodName]的忠诚。"
 normandy.0071.a:0 "我会给住在那的修士们捐点钱。"
 normandy.0071.b:0 "一大笔捐款将帮助修复和翻新该场所！"
 normandy.0071.c:0 "没有我的捐献，圣米歇尔山也没问题。"
 normandy.0072.t:0 "大天使的神迹"
 normandy.0072.desc:0 "今天，一位来自[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的小贵族在宫廷中停留。她是一位虔诚的[christian.GetAdjective]，最近去了[avranches.GetNameNoTier]的圣米歇尔山朝圣，并告诉我一个奇迹。\n\n起初，她无法进入圣米歇尔山。每当她走近，周围的潮汐就变得非常危险，在她身边汹涌地拍打着，有几次差点要了她的命。在到达的几周后，只有当这个女人跪在滩涂上，忏悔她的罪过，并乞求赎罪时，海浪才终于平静下来，让她通过。\n\n圣米歇尔山的修士们说，这显然是严厉的大天使米迦勒本人发出的神谕，鼓励她成为一个更加虔诚和忠实的[christian.GetAdjectiveNoTooltip]信徒。"
 normandy.0072.a:0 "这个故事听起来夸张，但很有趣！"
 normandy.0072.b:0 "真的，大天使指引你忏悔了！"
 normandy.0072.c:0 "基督徒总是异想天开。"
 normandy.0073.t:0 "诺曼苹果"
 normandy.0073.desc:0 "苹果园在[GetGeographicalRegion('RICE_normandy_region').GetName]并不罕见，这个产业在那已经发展了一段时间。最近，我在[county.GetNameNoTier]一些官员建议我们投资一些苹果园，扩展业务。苹果的生产，特别是苹果汁的生产，有助于当地经济的发展。"
 normandy.0073.a:0 "好主意！我们就这样做。"
 normandy.0073.b:0 "我觉得没必要这样做。"
 normandy.0074.t:0 "牛肚"
 normandy.0074.desc:0 "今天，我的厨师们准备了一道美味的撒有苹果汁的牛肚，作为我为廷臣们举办的小宴会的压轴菜。当然，这是来自[GetGeographicalRegion('RICE_normandy_region').GetName]的美味佳肴之一，我很高兴我有那的厨师。\n\n总之，每个人都盛赞这道菜五味俱全，里面有牛肚、其他肉类和蔬菜。"
 normandy.0074.a:0 "美味至极！"
 normandy.0075.t:0 "诺曼蛋糕"
 normandy.0075.desc:0 "宫廷中有位面包师来自[county.GetNameNoTier]，他最近为我烤了大量的奶油面包，据说这种面包来自[GetGeographicalRegion('RICE_normandy_region').GetName]，用的是一个祖传秘方，他说把它当点心是不错之选。"
 normandy.0075.a:0 "确实是种不错的点心！"
 normandy.0076.t:0 "埃特尔塔海岸"
 normandy.0076.desc:0 "今天我有机会拜访了[eu.GetNameNoTier]的埃特尔塔村，它以宏伟的白灰色悬崖而闻名于世，犹如一棵树的巨大分枝从悬崖高处伸展下来，欲向海底扎根。毫无疑问，这些悬崖是我此行的亮点。"
 normandy.0076.a:0 "美不胜收。"
 normandy.0077.t:0 "皮鲁的传说"
 normandy.0077.desc:0 "我和我的廷臣们碰巧聊起了[avranches.GetNameNoTier]皮鲁城堡的传说。\n\n据传，很久以前，一群维京海盗袭击了这座城堡。他们进去之后，发现除了一位老人家，空无一人。经过审问，老人说，多年前城堡的主人获得了一本古巫书，里面有一些神秘咒语，其中就包括把人变成鹅。\n\n维京人们突然想起，前一天他们看到一大群鹅飞走了——一定是居民们变成鹅逃之夭夭了！维京人们愤然将城堡夷为平地，并烧毁了这本书。当这些鹅回来时，没有此书的帮助，它们再也无法变回人类。这就是为什么鹅群每年都会在这里停留，日复一日年复一年地，徒劳地，寻找那本书。"
 normandy.0077.a:0 "我们都知道这是一个愚蠢但有趣的故事。"
 normandy.0077.b:0 "我想知道那本书有什么魔咒……"
 normandy.0078.t:0 "xxxxx"
 normandy.0078.desc:0 "xxxxx"
 normandy.0078.a:0 "xxxxx"
 normandy.0079.t:0 "xxxxx"
 normandy.0079.desc:0 "xxxxx"
 normandy.0079.a:0 "xxxxx"
 normandy.0080.t:0 "罗洛的故事"
 normandy.0080.desc:0 "他们说我做了一个预言梦。\n\n在梦中，我听到一个伟大而威严的声音，它告诉我离开斯堪的纳维亚去完成我的使命。我的一个[christian.GetAdjective]奴隶[thrall.GetFirstName]解读了这个梦，[thrall.GetHerHis]断定这不是别人，正是他们的上帝给了我神谕。\n\n虽然我正值壮年，但人生已相当坎坷。这会是命运的又一次转折吗？\n\n如果我真是天选之子，也许这一切从我出生时就开始了，多年前……"
 normandy.0080.intro.info:0 "\n#emphasis 历史背景：#!中世纪史料为诺曼底的罗洛提出了各种矛盾的出身——例如，一些人声称他来自丹麦，另一些人则声称他来自挪威。然而，这些都不是他在世时写的。\n\n"
 normandy.0080.a:0 "……在$c_more$，挪威的峡湾。"
 normandy.0080.a.tooltip:0 "你的[dynasty|E]现在名为#V $dynn_RICE_rollo_af_more$#!"
 normandy.0080.a.info:0 "$normandy.0080.intro.info$斯诺里·斯图鲁松将罗洛与“步行者”赫罗尔夫（或称工头罗夫）相提并论。根据这些冰岛萨迦（一种特有文学体裁），罗洛出生在挪威的默勒，父亲是首领罗格瓦尔德·艾斯泰因松，母亲是贵族妇女希尔德·赫罗夫斯多蒂。\n\n这些萨迦写于罗洛之后的几个世纪，其真实性值得怀疑，但一些早期的历史学家也提出了生于挪威的假说。其中包括11世纪西西里的历史学家戈弗雷多·马拉泰拉（他可能是诺曼人），以及12世纪英国历史学家马姆斯伯里的威廉。"
 normandy.0080.b:0 "……我的家乡在丹麦的法斯格。"
 normandy.0080.b.tooltip:0 "你的[dynasty|E]现在名为#V $dynn_RICE_rollo_af_fasge$#!"
 normandy.0080.b.info:0 "$normandy.0080.intro.info$12世纪的编年史家贝努瓦在#italic 《诺曼底公爵编年史》#!中指出，罗洛是丹麦人，出生在一个叫法斯奇的小镇。丹麦和挪威的几个地点都被认为是法斯奇，或者它可能指的是一个现在被遗弃或被遗忘的定居点。"
 normandy.0080.c:0 "……在斯堪的纳维亚的别处。"
 normandy.0080.c.tooltip:0 "你的[dynasty|E]现在名为#V $dynn_RICE_rollo_placeholder$#!"
 normandy.0080.c.tooltip.stay:0 "你的家乡就在这里"
 normandy.0080.c.info:0 "$normandy.0080.intro.info$最早关于罗洛生平的史料来源是#italic 《诺曼底史》#!，该书由圣康坦的诺曼教士杜多在10世纪末至11世纪初应罗洛后代诺曼底公爵要求所写。在书中杜多声称罗洛是丹麦人。\n\n尽管杜多的作品有失偏颇，包含了许多荒诞的虚构，但这是最接近罗洛时代的史书。此外，杜多还是时任公爵的亲密伙伴，他可能认识一些对罗洛还有记忆的人。"
 normandy.0080.tooltip:0 "如果你以后跟随使命去了诺曼底，你的[dynasty|E]将更名为#V 诺曼底#!。"
 normandy.0080.d:0 "这奴隶是个傻子。我没有这样的梦，还选择自己的使命？"
 normandy.0080.d.tooltip:0 "@warning_icon!#X 你跳过了罗洛的事件链，失去了选择罗洛过去和之后获得各种奖励的机会。你还将失去在诺曼底定居的[RICE_aspiration|E]，及获得实现野心的相关奖励。#!"
 normandy.0080.d.info:0 "$normandy.0080.intro.info$"
 normandy.0081.t:0 "罗洛的家乡"
 normandy.0081.desc:0 "毋庸置疑，我现在很担心丹麦强大的统治者，[king.GetTitledFirstName]。\n\n我的家人们并不认同[king.GetFirstNameNoTooltip]那所谓的权威，已和[king.GetHerHis]发生过多次冲突。我和我手下人也都不欣赏[king.GetHerHis]对我们和整个斯堪的纳维亚强施权力的企图。毕竟，已故的父亲总告诉我，永远不要向那些自称为国王的自大傻瓜低头。"
 normandy.0081.a:0 "父亲说的没错。"
 normandy.0081.b:0 "[king.GetSheHe|U]杀了我兄弟，我们#italic 不共戴天#!！"
 normandy.0081.c:0 "人们夸大了恩怨。"
 normandy.0081.d:0 "我的过去由其它事情决定，而非[king.GetFirstNameNoTooltip]。"
 normandy.0081.info:0 "\n#emphasis 历史背景：#!根据圣康坦的杜多的#italic 《诺曼底史》#!，某个丹麦王与罗洛一家敌对。为了方便起见，此人在事件链中被视为西古尔德，但杜多实际上没有提到他的名字，所以即使故事是真的，也很难说罗洛生活在谁手下。其他一些资料甚至没有提到罗洛与这样一位国王的敌对关系，特别是认为罗洛家乡在别处的资料。\n\n不管怎样，在撕毁了双方的休战协议后，据说此人杀害了罗洛的兄弟古里姆，迫使罗洛离开丹麦。据说事实上，罗洛有着所谓的正义事业，为了更伟大的命运，不得不逃离家乡建立新民族，这让人想起《埃涅阿斯纪》中的埃涅阿斯，他同样是一个有道德的人，但是为了建立未来罗马人的家园而背井离乡。在杜多笔下，这种与古典神话的相似之处比比皆是。"
 normandy.0082.t:0 "罗洛的梦境"
 normandy.0082.desc:0 "我再次思考这个梦，并要求[thrall.GetFirstName]解释[thrall.GetSheHe]说的[thrall.GetFaith.HighGodName]给了我神谕是什么意思。\n\n[thrall.GetFirstNameNoTooltip]解释说，显然有一天，我将接受真正的信仰，获得永恒的荣耀。这个梦只不过是[thrall.GetFaith.HighGodNamePossessive]指引我完成使命的方式，我需要先在别处寻求荣耀和胜利。"
 normandy.0082.a:0 "你的[thrall.GetFaith.HighGodName]，帮我？听起来不错。"
 normandy.0082.b:0 "荣耀？胜利？我期待着这样命运！"
 normandy.0082.c:0 "留在我身边吧，我还需要你。"
 normandy.0082.d:0 "转念一想，我没做过这个梦。"
 normandy.0082.info:0 "\n#emphasis 历史背景：#!根据#italic 《诺曼底史》#!，罗洛在做完梦后，乘船离开丹麦，入侵英格兰，他将此理解为实现预言之路。\n\n当然，这一事件很可能只是圣康坦的杜多和后来的作家编造的，他们把罗洛描绘成一个正义的异教徒，被上帝指引走向救赎和更伟大的命运，使罗洛后代的统治合法化。有趣的是，为了强调这一点，杜多将罗洛与维京军阀海斯泰因进行了比较，海斯泰因被描绘成一个卑鄙而嗜血的背信者，与罗洛形成鲜明对比。"
 normandy.0083.t:0 "罗洛的迟疑"
 normandy.0083.desc:0 "偶尔，我会回想起不久前做的梦，梦中的天国之音告诉我要去寻找自己的使命。但我一直被怀疑所困扰。我要去征服一片新土地吗？或是冒险去某地并定居吗？这个梦到底是什么意思？\n\n昨晚，令我吃惊的是，我又做了一个梦。这和之前的梦不一样，但我认为这可能是理解这一切的关键。"
 normandy.0083.a:0 "我试着回忆昨晚的梦是关于什么的。"
 normandy.0083.b:0 "事实上，我没做那个梦。我会找到我自己的使命！"
 normandy.0083.info:0 "\n#emphasis 历史背景：#!正如杜多在他的#italic 《诺曼底史》#!中所说，在罗洛做了预言梦并抵达英格兰与当地人多次战斗后，他最终被对自己使命的怀疑所困扰，并做了另一个更有意义的梦。\n\n虽然这很可能又是一个虚构的传说，但现实中的罗洛在永久定居诺曼底时已是一名经验丰富的掠夺者，所以这并非难以置信。"
 normandy.0084.t:0 "罗洛的预言"
 normandy.0084.desc:0 "我记得在梦中，我患了可怕的麻风病，还登上了一座在[GetGeographicalRegion('world_europe_west_francia').GetName]的巍峨大山。大山之巅有一股甘洌的泉水汩汩流淌，我在沐浴其中，不知怎地就奇迹般地痊愈了。\n\n这座山被数千只鸟包围着，它们五颜六色、种类各异，但都拍打着红色的翅膀，在我周围欢快地飞来飞去，仿佛我们是熟识多年的朋友。它们也都在泉水中清洗自己，然后一起努力筑巢。最不可思议的是，无论我给它们下达什么命令，它们都百依百顺。"
 normandy.0084.a:0 "或许[interpreter.GetFirstName]能帮我解读这个梦。"
 normandy.0084.b:0 "谁能帮我解释一下这个怪梦？"
 normandy.0085.t:0 "罗洛的命运"
 normandy.0085.desc.not_original:0 "宫廷中没人理解我的梦，但我听说战士们在最近的劫掠中俘虏了一个名叫[interpreter.GetFirstName]的囚犯，[interpreter.GetHerHim]知道如何解梦。于是我召见了此人。"
 normandy.0085.desc.original:0 "我问[interpreter.GetTitledFirstName]，[interpreter.GetSheHe]能否解读这个怪梦。毕竟，[interpreter.GetSheHe]以前做过一次，所以也许[interpreter.GetSheHe]能理解这个梦。"
 normandy.0085.desc:0 "\n\n根据[interpreter.GetFirstNameNoTooltip]的说法，泉水代表着洗礼之水，它会洗去我的罪恶，也就是梦中的麻风病。之后，无数来自世界各地的勇士——不同种类的红翅鸟——将在和平中走到一起，帮助我建立一个新的、辉煌的王国。\n\n[interpreter.GetFirstNameNoTooltip]的结论是，显然，[interpreter.GetFaith.HighGodName]看到了我内心的高贵，并试图指引我在[GetGeographicalRegion('custom_west_francia_minus_mediterranean').GetName]，或是在[GetGeographicalRegion('RICE_normandy_region').GetName]实现我的使命。\n\n我不得不怀疑……这真是冥冥之中注定的吗？"
 normandy.0085.a:0 "也许我早晚会知道的。"
 normandy.0085.info:0 "\n#emphasis 历史背景：#!如果我们假设罗洛的终极大梦是杜多在攥写#italic 《诺曼底史》#!时虚构的传说，那我们可以将其视为杜多的聪明尝试，以解决罗洛的血统问题(从后来的基督教诺曼人的角度来看)，从而扩展到诺曼人起源问题：他们的异教根源，以及诺曼底的多样性，当时那里充满了争吵不休的诺曼人、法兰克人、布列塔尼人、诺斯人、基督徒和异教徒。\n\n因此杜多认为，上帝的计划是通过罗洛和其后代，将这些人在诺曼底团结起来，实现伟业。"
 normandy.0086.t:0 "罗洛的凯旋"
 normandy.0086.desc:0 "谁能想到，我终有一日来到了应许之地？很久以前的那些预言梦可能是正确的，也许[ROOT.Char.GetFaith.HighGodName]真在向我传达我的使命。\n\n然而，我还有许多工作要做，尽管[GetGeographicalRegion('RICE_normandy_region').GetName]是一片充满希望的沃地，但它也是一片动荡不安的边疆，我在这的权力有限。总有一天，我们[ROOT.Char.GetDynasty.GetName]宗族，将完全实现对这片土地的统治——甚至更远！"
 normandy.0086.a:0 "这是[ROOT.Char.GetFaith.HighGodName]的意志！"
 normandy.0086.b:0 "我在这，是因为我选择了自己的使命！"
 normandy.0086.c:0 "我的人民在这会安居乐业的。"
 normandy.0086.info:0 "#emphasis 历史背景：#!罗洛抵达诺曼底的过程可能比此事件链所描述的要复杂得多。尽管如此，根据杜多的#italic 《诺曼底史》#!，当罗洛第一次到达诺曼底时，海斯泰因作为他的邪恶陪衬，试图强迫罗洛成为法兰克国王的封臣。罗洛因另一国王的残忍而流亡，所以拒绝了，并与法兰克人打了许多仗。最终，双方在911年和解，罗洛在被授予诺曼底封地后接受了洗礼。\n\n杜多接着插入了一段有趣的轶事，似乎是为了软化罗洛屈从法兰克国王的暗示。据说当罗洛被授予诺曼底时，法兰克人要求他亲吻国王的脚作为对授予土地的感谢。经过再三劝说，罗洛终于让他的一名勇士替他做了此事。然而此人也没有躬身去亲吻国王的脚，反而举起国王的腿，这时他还站着，可怜的国王倒摔得仰面朝天了，弄得周围的维京人捧腹不已。"
 normandy.0087.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 normandy.0087.desc:0 "到目前为止，一切顺利。自从我和同胞们在[GetGeographicalRegion('RICE_normandy_region').GetName]建立家业，统治起那些曾经遭受我们掠夺的子民，磨合的过程远非一帆风顺，但目前进展顺利。\n\n一想到从[christian.GetAdjective]那里得到了来此处异像.....如果是神的指引的话，那就太奇怪了。但不管怎么样，我都看到了在新家园定居的美好场景。尽管我的同胞们可能会认为这是一个边疆地区，在肆虐的掠夺者和法兰克权贵之间徘徊，但我看到了机遇，看到了我们的未来。"
 normandy.0087.a:0 "我们注定要成就一番事业！"
 normandy.0088.t:0 "x"
 normandy.0088.desc:0 "x"
 normandy.0088.a:0 "x"
 normandy.0089.t:0 "x"
 normandy.0089.desc:0 "x"
 normandy.0089.a:0 "x"
 normandy.0090.t:0 "[william.GetFirstNameNoTooltip]和[matilda.GetFirstNameNoTooltip]"
 normandy.0090.desc:0 "即使对我这样的人来说，有一个好而值得信赖的妻子也是一种福气。即使现在，当我努力实现统治英格兰的野心时，我还是时常想起，并感谢我的爱妻[matilda.GetFirstName]给我的指导和支持。\n\n例如，当我们还在计划征服英格兰时，她亲自出钱装备了一艘名为#italic “莫拉号”#!的战舰送给我。而且，在我不在时，她能良好地处理诺曼底的日常事务。她也许明显比我小，但我已经开始倾佩这位能干的小姐。\n\n随着远征继续，我回想着是什么让我走到了这一刻，从她和我在一起的多年开始。看到我离开前往英格兰作战，她肯定很伤心。"
 normandy.0090.a:0 "我们已经结婚多年……"
 normandy.0090.a.tooltip:0 "你将经历威廉和玛蒂尔达的短事件链，为你的开局情况进行一些小调整。未来可能会发生更多事件。"
 normandy.0090.b:0 "她会告诉我不用担心她，战争重要。"
 normandy.0090.b.tooltip:0 "@warning_icon!#X 你跳过了威廉的开局事件链，放弃了小额奖励。然而，与威廉和玛蒂尔达相关的事件未来仍有可能发生。#!"
 normandy.0090.info:0 "\n#emphasis 历史背景：#!尽管很难知道征服者威廉和他的妻子佛兰德斯的玛蒂尔达私人关系的确切细节，但至少他们的婚姻看起来是幸福的。与中世纪国王不同，威廉没有任何情妇，他们被视为忠贞不渝的模范夫妇。玛蒂尔达在1083年的去世对威廉影响很深：例如，他悲痛欲绝，甚至放弃了他最爱的打猎。"
 normandy.0091.t:0 "$normandy.0090.t$"
 normandy.0091.desc:0 "当我回顾我们的婚姻时，我想起了我听到的关于我和[matilda.GetFirstNameNoTooltip]的流言蜚语。\n\n谣传，当我第一次向[matilda.GetFirstNamePossessiveNoTooltip]求婚时，她不仅拒绝了我，还侮辱我，声称嫁给一个“私生子”有失身份。我立即策马来到她的家乡，在离开前打了她一顿。我本以为我会为自己的行为付出代价，但玛蒂尔达为了化解冲突，发誓非我不嫁。\n\n这就是谣言。我当然有脾气，但我绝不会如此厚颜无耻地对一位德高望重的领主，我未来岳父[baldwin.GetTitledFirstName]的女儿做这样的事。\n\n不管怎样，有人说我和我的妻子深爱着对方。的确，我非常重视她的忠告，并把她当作我最亲密的知己之一。"
 normandy.0091.a:0 "谁能不爱这样一位杰出的女人呢？"
 normandy.0091.b:0 "她是我重要的顾问和合作伙伴。"
 normandy.0091.info:0 "\n#emphasis 历史背景：#!无论威廉和玛蒂尔达两人关系的真实情况如何，一些关于这段关系是如何开始的传说的真实性值得怀疑。据说，玛蒂尔达拒绝了威廉的求婚，因为她认为自己是佛兰德斯伯爵鲍德温的女儿，出身高贵，不适合下嫁给“私生子”。\n\n威廉闻后勃然大怒，一路冲到佛兰德斯。在一些传说中，威廉发现玛蒂尔达正悠哉地骑着一匹小马去教堂，于是光天化日之下，他冲上去一把揪起她的辫子，拎起来就是一抛，将她丢到淤泥中，然后扬鞭而去。在其他版本中，身着戎装的威廉去了她父亲的领地，众目睽睽之下拽着她的辫子殴打她。暴怒的鲍德温拔剑冲向威廉，正在这千钧一发之际，玛蒂尔达勇敢地站了出来，发誓非威廉不嫁，巧妙地化解了冲突。总之，事后玛蒂尔达只想嫁给威廉。\n\n实际上，这桩婚姻可能是在更平凡的政治环境下安排的。佛兰德斯伯爵势力强大，是诺曼底东部的潜在威胁。通过婚姻，威廉不仅避免了冲突，还获得了一个宝贵的盟友。"
 normandy.0092.t:0 "近亲婚姻？"
 normandy.0092.desc:0 "然而，起初有些人反对我与[matilda.GetFirstName]的婚姻，因为我们是远房表亲。教宗[leo.GetFirstName]尤为反对，我的几个封臣也是。\n\n幸运的是，[leo.GetFirstNamePossessive]的继任者之一，教宗[nicholas.GetFirstName]赞同我们的婚姻。作为条件，并为了争取我在意大利南部的诺曼同胞的支持，他赦免了我和[matilda.GetFirstNameNoTooltip]的“罪过”，只要我们忏悔地修建两座教堂。"
 normandy.0092.a:0 "我很高兴能以这种方式表示忏悔。"
 normandy.0092.b:0 "我做了必须做的来巩固我的权力。"
 normandy.0092.info:0 "\n#emphasis 历史背景：#!在威廉和玛蒂尔达与教廷达成和解后，两人同意在1059年修建两座教堂作为近亲婚姻的赎罪，这距离他们约1051年的结婚已经过去了近十年。这两座位于卡昂的教堂分别为：由威廉在1063年建立的圣艾蒂安教堂，和由玛蒂尔达在1062年建立的圣三一教堂。两人死后被分别安葬在各自的修道院里。"
 normandy.0093.t:0 "教宗的祝福"
 normandy.0093.desc:0 "在婚姻问题解决后，我与教廷的关系也恢复了，这对我来说很好。\n\n毕竟，现任教宗[alexander.GetFirstName]是授权我征服英格兰的人。[alexander.GetSheHe|U]甚至给了我几件重要之物，让我带着去英格兰，包括一枚教宗戒指、教宗旗帜，以及一份给英格兰神职人员的诏书，让他们服从于我的合法统治。\n\n现在，我前往英格兰，不仅仅是为了统治很久以前[edward.GetTitledFirstName]许诺给我的王冠，还有那个无赖[harold.GetFirstName]背信弃义从我这夺走的一切。这是一场正义之战，由[alexander.GetFirstNameNoTooltip]亲自批准，是对我的合法要求的认可！"
 normandy.0093.a:0 "我和[matilda.GetFirstNameNoTooltip]会公正地取回我们应得之物。"
 normandy.0093.b:0 "我和[matilda.GetFirstNameNoTooltip]将实现我们的雄心壮志！"
 normandy.0093.info:0 "\n#emphasis 历史背景：#!教宗亚历山大二世支持征服者威廉入侵英格兰的性质是不确定的(比如是否是真正地支持，或者支持的力度有多大)，这是因为提到它的主要史料有些问题，尽管目前大多数学者认为支持以某种形式发生过。无论怎样，亚历山大都有理由支持威廉。\n\n在11世纪，教廷试图将其影响力扩展到整个欧洲，也许亚历山大希望英格兰受到罗马教会更强的控制。多年来，由于英国教会的独立性，它一直被认为是教廷的眼中钉。"
