 normandy.0021.t:0 "[courtier_1.GetCulture.GetNameNoTooltip]冒险者"
 normandy.0021.desc:0 "我遇到了一群[courtier_1.GetCulture.GetName]冒险者，由一位名叫[courtier_1.GetFirstName]的[courtier_1.GetWomanMan]领导，他们表示有兴趣为我服务。[courtier_1.GetFirstNameNoTooltip]同意提供些东西作为回报，只要我允许[courtier_1.GetHerHis]的队伍进入我的领地。\n\n"
 normandy.0021.desc.courtiers:0 "我告诉[courtier_1.GetFirstNameNoTooltip]，我想要[courtier_1.GetHerHis]留下一人充当我和新定居下来的[courtier_1.GetCulture.GetCollectiveNounNoTooltip]之间的中间人。结果，[courtier_1.GetFirstNameNoTooltip]主动提出留在我这，而且[courtier_1.GetSheHe]说如果不行的话，[courtier_1.GetSheHe]也可以推荐[courtier_1.GetHerHis]的伙伴[courtier_2.GetFullName]。"
 normandy.0021.desc.colonists:0 "[courtier_1.GetFirstNamePossessiveNoTooltip]群体与其说是一个小团体，不如说是一个由小部落组成的人。幸运的是，他们带着和平而来！在[ROOT.Char.GetPrimaryTitle.GetName]有几处适合定居，而[courtier_1.GetFirstNameNoTooltip]治下的[courtier_1.GetCulture.GetNameNoTooltip]已经开始定居为该地区的活力做出贡献。"
 normandy.0021.desc.mercenaries:0 "不言而喻，[courtier_1.GetCulture.GetCollectiveNounNoTooltip]因其战争能力而闻名，甚至令人畏惧。[courtier_1.GetFirstNameNoTooltip]指挥着许多可敬的战士，若逢明主，他们可以比一般的凶残佣兵更忠诚。从现在起，这些勇士将为我效力，让敌人感到恐惧吧！"
 normandy.0021.desc.traders:0 "尽管作为战士和掠夺者而臭名昭著，但[courtier_1.GetCulture.GetCollectiveNounNoTooltip]在商业上也很狡猾，而且活动广泛。对于任何有商业头脑的统治者来说，斯堪的纳维亚人广泛的贸易网络都是一笔宝贵的资产。\n\n碰巧，[courtier_1.GetFirstNameNoTooltip]有旅行和贸易的经验，并提出把商人带到我的领地，与我建立富有成效的贸易关系。"
 normandy.0021.desc.rulers:0 "经过我们的谈判，我允许在[courtier_1.GetFirstNameNoTooltip]的统治下，[courtier_1.GetCulture.GetNameNoTooltip]移民在[award_county.GetNameNoTier]自治。[courtier_1.GetSheHe|U]高兴地同意了这样的安排。\n\n达成协议是明智的，因为这些[courtier_1.GetCulture.GetCollectiveNounNoTooltip]已经同意帮助我们保护土地，抵御外来攻击，包括其他诺斯劫掠者。在某种程度上，我们把像[courtier_1.GetHerHim]这样的潜在敌人化为了朋友！"
 normandy.0021.desc.conclusion:0 "\n\n最后，我想问问是否可以请[courtier_1.GetFirstNameNoTooltip]帮助我保卫领土，抵御敌对的诺斯人入侵。"
 normandy.0021.a:0 "[courtier_1.GetFirstNameNoTooltip]可以留在宫廷中为我服务。"
 normandy.0021.b:0 "[courtier_2.GetFirstNameNoTooltip]看起来很适合我的宫廷。"
 normandy.0021.c:0 "他们两人都可以成为我的廷臣。"
 normandy.0021.d:0 "太好了！我想这就足够了。"
 normandy.0021.e:0 "[courtier_1.GetFirstNameNoTooltip]，你能进一步协助我们抵御诺斯海盗吗？"
 normandy.0021.e.failure:0 "[courtier_1.GetFirstNameNoTooltip]无法帮助你更好地抵御斯堪的纳维亚冒险者"
 normandy.0021.e.success:0 "[courtier_1.GetFirstNameNoTooltip]帮助你获得为期#V 5‑20年#!的[GetModifier('fp1_reprieve_from_sa_modifier').GetNameWithTooltip|L][character_modifier|E]"
 normandy.0021.f:0 "我好奇[courtier_1.GetFirstNameNoTooltip]会是哪种统治者……"
 normandy.0021.colonists_duchy_tt_10:0 "获得为期#V 10年#!的[GetModifier('RICE_normandy_norse_colonists').GetNameWithTooltip|L][county_modifier|E]"
 normandy.0021.colonists_duchy_tt_15:0 "获得为期#V 15年#!的[GetModifier('RICE_normandy_norse_colonists').GetNameWithTooltip|L][county_modifier|E]"
 normandy.0021.colonists_duchy_tt_20:0 "获得为期#V 20年#!的[GetModifier('RICE_normandy_norse_colonists').GetNameWithTooltip|L][county_modifier|E]"
 normandy.0021.colonists_duchy_tt_25:0 "获得为期#V 25年#!的[GetModifier('RICE_normandy_norse_colonists').GetNameWithTooltip|L][county_modifier|E]"
 RICE_norse_adventurer_convert_tooltip:0 "#italic 可能会#!皈依你的[faith|E]"
 normandy.0022.t:0 "抵御诺斯人的攻击"
 normandy.0022.desc.intro:0 "在达成了一个对双方都有利的协议后，我与[courtier_1.GetFirstName]商讨[courtier_1.GetSheHe]和[courtier_1.GetHerHis]的战团是否可以进一步帮助我抵抗未来诺斯人对我领地的大规模袭击。\n\n"
 normandy.0022.desc.no.courtiers:0 "[courtier_1.GetFirstNameNoTooltip]告诉我，[courtier_1.GetCulture.GetCollectiveNoun]的[courtier_1.GetHerHis]战团只是一小群冒险家，很难有效地对抗军队或说服他们回头。[courtier_1.GetSheHe|U]还声称[courtier_1.GetSheHe]怀疑[courtier_1.GetHerHis]在斯堪的纳维亚半岛的关系是否对我们有用。"
 normandy.0022.desc.no.colonists:0 "[courtier_1.GetFirstNameNoTooltip]说，[courtier_1.GetHerHis]战团中的许多人是相对和平的农民和工匠，不是那种能够抵抗军事入侵的人。[courtier_1.GetFirstNameNoTooltip]解释说，在改造这些土地时他们会做得更好。"
 normandy.0022.desc.no.mercenaries:0 "[courtier_1.GetFirstNameNoTooltip]向我保证，虽然[courtier_1.GetHerHis]战士有能力，并且可以在任何战斗中战斗，但与其他诺斯军阀谈判是另一回事。看来[courtier_1.GetSheHe]显然没有影响力或权威来影响其他诺斯掠夺者。"
 normandy.0022.desc.no.traders:0 "[courtier_1.GetFirstNameNoTooltip]摇了摇[courtier_1.GetHerHis]的头，说[courtier_1.GetSheHe]和[courtier_1.GetHerHis]团队更习惯于交易而不是战争。当然，所有商人都会时不时地进行战斗，但准备抵抗潜在的大规模入侵是另一回事。"
 normandy.0022.desc.yes.courtiers:0 "[courtier_1.GetFirstNameNoTooltip]表示，虽然[courtier_1.GetHerHis]战团很小，但[courtier_1.GetSheHe]在斯堪的纳维亚半岛确实有许多可能有用的关系。[courtier_1.GetSheHe|U]说[courtier_1.GetSheHe]可以利用这些联系来说服潜在的诺斯攻击者暂时不要去这里。"
 normandy.0022.desc.yes.colonists:0 "[courtier_1.GetFirstNameNoTooltip]说我可以安心，因为虽然[courtier_1.GetSheHe]带来的[courtier_1.GetHerHim]许多定居者都是和平的农民和工匠，但他们与斯堪的纳维亚兄弟有着密切的联系。任何潜在的诺斯掠夺者都不愿意伤害他们现在在这里的朋友和家人。"
 normandy.0022.desc.yes.mercenaries:0 "[courtier_1.GetFirstNameNoTooltip]大笑着，[courtier_1.GetSheHe]告诉我，即使在斯堪的纳维亚半岛，[courtier_1.GetHerHis]战士也非常可怕。他们出现在我的领地意味着我将从潜在的诺斯攻击者那里获得一定程度的尊重，推迟与我和[courtier_1.GetFirstNamePossessiveNoTooltip]战士战斗。"
 normandy.0022.desc.yes.traders:0 "[courtier_1.GetFirstNameNoTooltip]告诉我[courtier_1.GetCulture.GetCollectiveNoun]因其在战争中的能力而威慑四方，但很少有人知道他们在商业方面的技能。随着我的领土与斯堪的纳维亚半岛之间更紧密的贸易联系，诺斯军阀只要不是彻头彻尾的白痴，就不会愚蠢地破坏这些贸易网络中。"
 normandy.0022.desc.conclusion.no:0 "\n\n觉察到我的失望，[courtier_1.GetFirstNameNoTooltip]保证[courtier_1.GetHerHis]战团将尽他们所能在我的领土上巩固防御，所以至少诺斯入侵者前来，它的防御会更强大。不过，我想知道[courtier_1.GetFirstNameNoTooltip]是在说真话，还是[courtier_1.GetSheHe]狡猾地试图骑墙。"
 normandy.0022.desc.conclusion.yes:0 "\n\n虽然这并不能永久减少诺斯人的长期威胁，但也是个极好的消息。与[courtier_1.GetFirstNamePossessiveNoTooltip]共事已经证明比我最初想的更好!"
 normandy.0022.a:0 "有像[courtier_1.GetFirstNameNoTooltip]这样的“好”维京人存在真走运！"
 normandy.0022.b:0 "让我们希望[courtier_1.GetFirstNameNoTooltip]不会惹出什么怪事。"
 normandy.0022.c:0 "在此期间，[courtier_1.GetFirstNameNoTooltip]可以留在我的宫廷"
 normandy.0022.d:0 "现在，撇开这个不谈，我想要[courtier_2.GetFirstNameNoTooltip]留下"
 normandy.0022.e:0 "继续，我想要[courtier_1.GetFirstNameNoTooltip]#italic 和#![courtier_2.GetFirstNameNoTooltip]留下。"
 normandy.0023.t:0 "冒险者的要求"
 normandy.0023.desc.intro:0 "我遇到了一群[courtier_1.GetCulture.GetName]冒险者，由一位名叫[courtier_1.GetFullName]的[courtier_1.GetWomanMan]领导，他们表示有兴趣为我服务并进入我的领地。当然，作为回报，他们必须给我些东西。\n\n"
 normandy.0023.desc.courtiers:0 "我告诉[courtier_1.GetFirstNameNoTooltip]，我想让[courtier_1.GetHerHis]留下一人正式作为廷臣为我服务，充当我和新定居下来的[courtier_1.GetCulture.GetCollectiveNounNoTooltip]之间的中间人。"
 normandy.0023.desc.colonists:0 "[courtier_1.GetFirstNamePossessiveNoTooltip]战团更像是一个小部落，他们到达的人数相对较多，所以我希望他们能在我领土中需要更多人口的部分定居下来。"
 normandy.0023.desc.mercenaries:0 "不言而喻，[courtier_1.GetCulture.GetCollectiveNounNoTooltip]因其战争能力而闻名——[courtier_1.GetFirstNameNoTooltip]指挥着许多精锐战士，我希望将他们招入麾下。"
 normandy.0023.desc.traders:0 "尽管作为战士和掠夺者而臭名昭著，但[courtier_1.GetCulture.GetCollectiveNounNoTooltip]在商业上也很狡猾，而且活动广泛。我希望我们之间能达成一些互惠互利的贸易协议。"
 normandy.0023.desc.mid:0 "\n\n我们最初达成了协议，只要我慷慨地支付这些冒险者报酬。唉，可惜我与[courtier_1.GetFirstNameNoTooltip]的谈判出了岔子。"
 normandy.0023.desc.gold:0 "那个该死的恶棍想要更多的金子，比我们当初约定好的还要多！"
 normandy.0023.desc.titles:0 "这个贪得无厌的畜生现在说我应该交出[award_county.GetNameNoTier]让[courtier_1.GetHerHim]统治！"
 normandy.0023.desc.conclusion:0 "我必须谨慎地回应这些荒谬的要求，以免这些海盗想出什么更滑稽的主意……"
 normandy.0023.a:0 "好吧。这个无赖会得到[courtier_1.GetSheHe]想要的。"
 normandy.0023.b:0 "[courtier_1.GetFirstNameNoTooltip]，你不能言而无信。"
 normandy.0023.b.failure:0 "[courtier_1.GetFirstNameNoTooltip]不遵守协议，导致了负面的后果。"
 normandy.0023.b.success:0 "[courtier_1.GetFirstNameNoTooltip]退缩了，勉强尊重你的决心"
 normandy.0024.t:0 "冒险者定居下来"
 normandy.0024.desc:0 "移交[award_county.GetNameNoTier]给[courtier_1.GetFirstName]是一个有争议的决定，但我别无选择，因为我不想领土遭受[courtier_1.GetHerHis]的劫掠者。最好把[courtier_1.GetHerHim]作为一个可疑的盟友，而不是让[courtier_1.GetHerHim]在我的土地上劫掠。"
 normandy.0024.desc.courtiers:0 "\n\n作为名义上善意的姿态，[courtier_1.GetFirstNameNoTooltip]同意我最初建议[courtier_1.GetSheHe]送一个[courtier_1.GetHerHis]所选之人在我的宫廷，作为某种形式的联络人。现在[courtier_1.GetFirstNameNoTooltip]选了个叫[courtier_2.GetFirstName]的[courtier_2.GetWomanMan]去完成这事。"
 normandy.0024.desc.colonists:0 "\n\n就像我们原来的协议一样，[courtier_1.GetFirstNamePossessiveNoTooltip]的大量人马在我的领土上定居下来。尽管他们背信弃义，但一旦他们在新家园安定下来，应该能在[courtier_1.GetFirstNameNoTooltip]的领导下被证明是好定居者。"
 normandy.0024.desc.mercenaries:0 "\n\n为了履行我们最初的协议，[courtier_1.GetFirstNameNoTooltip]说[courtier_1.GetSheHe]已经指示许多[courtier_1.GetHerHis]的战士现在在我的旗帜下战斗；即使[courtier_1.GetSheHe]现在是统治者，[courtier_1.GetHerHis]的战士无论如何都会只忠于我，即使这意味着将来要与[courtier_1.GetHerHim]作战。我们将看看这是否成立。"
 normandy.0024.desc.traders:0 "\n\n让我松了一口气的是，根据我们最初的协议，[courtier_1.GetFirstNameNoTooltip]在尽[courtier_1.GetHerHis]义务，并使用[courtier_1.GetHerHis]关系扩大贸易网络。虽然我们有一个糟糕的开始，我可能从来都不太相信这些[courtier_1.GetCulture.GetCollectiveNoun]，但至少我王国的经济会增长!"
 normandy.0024.desc.conclusion:0 "\n\n手续结束后，[courtier_1.GetFirstNameNoTooltip]正式成为[award_county.GetNameNoTier]的[courtier_1.GetTitleAsNameNoTooltip]。我希望[courtier_1.GetSheHe]能坚持[courtier_1.GetHerHis]协议，不要让我们双方关系进一步恶化。"
 normandy.0024.a:0 "我想知道...命运会把[courtier_1.GetFirstNameNoTooltip]带向何处？"
 normandy.0024.b:0 "从此以后，我会留意[courtier_1.GetFirstNameNoTooltip]。"
 normandy.0025.t:0 "新家园"
 normandy.0025.desc:0 "我和我的[courtier_1.GetCulture.GetName]冒险家们走遍了很远很远的地方，但直到现在我们还没有找到一个真正的家。经过我的努力，我与统治[current_ruler.GetPrimaryTitle.GetNameNoTier]的[current_ruler.GetTitledFirstName]达成了一项协议。\n\n[current_ruler.GetFirstNameNoTooltip]不仅让我们在[courtier_1.GetPrimaryTitle.GetNameNoTier]安顿下来，而且[current_ruler.GetSheHe]也正式授予我作为个人封地管此地的权利。"
 normandy.0025.desc.vassal:0 "当然，生活中没有什么是免费的：我必须向[current_ruler.GetHerHim]宣誓效忠，并承诺协助[current_ruler.GetFirstNameNoTooltip]保护这些土地——即使这意味着与其他[courtier_1.GetCulture.GetCollectiveNoun]作战。"
 normandy.0025.desc.vassal_in_realm:0 "当然，生活中没有什么是免费的：我必须向[courtier_1.GetLiege.GetTitledFirstName]宣誓效忠，并承诺协助[current_ruler.GetFirstNameNoTooltip]保护这些土地——即使这意味着与其他[courtier_1.GetCulture.GetCollectiveNoun]作战。"
 normandy.0025.desc.independent:0 "当然，生活中没有什么是免费的：当我能够保持政治独立时，我不得不与[current_ruler.GetFirstNameNoTooltip]缔结休战协议，以确保我不会做可疑之事。不过停战期之后……谁知道呢？"
 normandy.0025.desc.conversion:0 "\n\n我战团中的一些人建议，为了确保我与[current_ruler.GetFirstNameNoTooltip]的关系保持良好，我应该改信[current_ruler.GetFaith.GetName]。不得不说这很有吸引力，但其他人认为我们应该坚持传统信仰。"
 normandy.0025.a:0 "我首先改信[current_ruler.GetFaith.GetNameNoTooltip]。"
 normandy.0025.b:0 "是时候安顿新家了。"
 normandy.0026.t:0 "协议达成"
 normandy.0026.desc:0 "由于风险太大，我别无选择只能同意[courtier_1.GetFirstName]的要求。然而，这些[courtier_1.GetCulture.GetCollectiveNoun]并不是没有荣誉之人，因为他们同意履行最初对我的承诺。\n\n"
 normandy.0026.desc.courtiers:0 "$normandy.0021.desc.courtiers$"
 normandy.0026.desc.colonists:0 "$normandy.0021.desc.colonists$"
 normandy.0026.desc.mercenaries:0 "$normandy.0021.desc.mercenaries$"
 normandy.0026.desc.traders:0 "$normandy.0021.desc.traders$"
 normandy.0026.a:0 "非常好，你可以留在这，[courtier_1.GetFirstNameNoTooltip]。"
 normandy.0026.b:0 "我更喜欢[courtier_2.GetFirstNameNoTooltip]。"
 normandy.0026.c:0 "我会把你们俩都留下来，以防万一。"
 normandy.0026.d:0 "希望他们不会惹出什么麻烦。"
 normandy.0027.t:0 "[granter.GetFirstNamePossessiveNoTooltip]与[courtier_1.GetCulture.GetCollectiveNounNoTooltip]达成协议"
 normandy.0027.desc:0 "我注意到[granter.GetTitledFirstName]将[granter.GetSheHe]之前统治的一些领土授予了一个名叫[courtier_1.GetFirstName]的[courtier_1.GetCulture.GetName]冒险家。他随后以[award_county.GetNameNoTier][courtier_1.GetTitleAsNameNoTooltip]的身份宣誓效忠于我。\n\n一方面，[courtier_1.GetCulture.GetCollectiveNounNoTooltip]的欺骗技巧和贪婪而臭名昭著，我担心他们胁迫[granter.GetHerHim]交出这些土地。另一方面，如果[courtier_1.GetFirstNameNoTooltip]证明#italic 是#!有荣耀的[courtier_1.GetCulture.GetNameNoTooltip]，毫无疑问[courtier_1.GetSheHe]可以做很多事情来阻止[courtier_1.GetHerHis]无理取闹[courtier_1.GetCulture.GetNameNoTooltip]兄弟们再威胁我们。\n\n无论如何，[courtier_1.GetFirstNameNoTooltip]现在作为一个封臣已经宣誓忠诚地为我服务，这是有意义的。"
 normandy.0027.a:0 "嗯……我们拭目以待。"
 normandy.0028.t:0 "[courtier_1.GetCulture.GetNameNoTooltip]匪徒"
 normandy.0028.desc.original:0 "我拒绝了[courtier_1.GetFirstNamePossessive]荒谬的要求，希望[courtier_1.GetSheHe]能够退缩并承诺我们最初的协议，然而[courtier_1.GetSheHe|U]并没有。\n\n在我们的谈判破裂后，我从官员那里得知[courtier_1.GetCulture.GetCollectiveNoun]的[courtier_1.GetFirstNamePossessiveNoTooltip]战团变成了掠袭者，并在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTier]建立了一个匪寨，从那里肆意掠夺周围的领土。\n\n由于人数较少，这些强盗对我的统治没有构成重大威胁，但他们的行动仍然对附近的地区造成毁灭性打击。"
 normandy.0028.desc:0 "可怕的消息从[original_negotiator.GetTitledFirstName]宫廷传来。[original_negotiator.GetSheHe|U]最近试图与某个[courtier_1.GetFirstName]领导的[courtier_1.GetCulture.GetCollectiveNoun]战团达成某种交易。然而，当[courtier_1.GetFirstNameNoTooltip]要求各种让步时，谈判破裂了。\n\n在谈判破裂后，[courtier_1.GetFirstNamePossessiveNoTooltip]的[courtier_1.GetCulture.GetCollectiveNounNoTooltip]战团四处流窜，并在[capital.GetDeJureLiege.GetNameNoTier]建立了一个匪寨，从那里肆意掠夺周围的领土，甚至还有我的！\n\n由于人数相对较少，这些强盗对我的统治没有构成重大威胁，但他们的行动仍然对附近的地区造成毁灭性打击。"
 normandy.0028.a:0 "我做了什么？！"
 normandy.0028.b:0 "[original_negotiator.GetFirstNameNoTooltip]做了什么？！"
 normandy.0029.t:0 "谈判成功"
 normandy.0029.desc:0 "我拒绝了[courtier_1.GetFirstNamePossessive]荒谬的要求，坚定地告诉[courtier_1.GetHerHim]我不会屈服于[courtier_1.GetHerHis]威胁。令我宽慰的是，[courtier_1.GetSheHe]退缩了。也许[courtier_1.GetFirstNameNoTooltip]对我的决心印象深刻，或者[courtier_1.GetSheHe]只是虚张声势，试图从我身上得到更多。无论哪种，我们都将保持原始协议。\n\n"
 normandy.0029.a:0 "我会留意[courtier_1.GetFirstNameNoTooltip]的。"
 normandy.0029.b:0 "[courtier_2.GetFirstNameNoTooltip]将加入我的宫廷。"
 normandy.0029.c:0 "他们俩都应该加入我的宫廷，以防万一。"
 normandy.0029.d:0 "希望他们能信守承诺。"
 normandy.0029.e:0 "我不能相信[courtier_1.GetHerHim]，但[courtier_1.GetSheHe]能帮我对付诺斯海盗吗？"
 normandy.0030.t:0 "xxxxx"
 normandy.0030.desc:0 "xxxxx"
 normandy.0030.a:0 "xxxxx"
 normandy.0031.t:0 "[courtier_1.GetCulture.GetNameNoTooltip]冒险者"
 normandy.0031.desc:0 "$normandy.0021.desc$"
 normandy.0031.desc.courtiers:0 "$normandy.0021.desc.courtiers$"
 normandy.0031.desc.colonists:0 "$normandy.0021.desc.colonists$"
 normandy.0031.desc.mercenaries:0 "[courtier_1.GetCulture.GetNameNoTooltip]士兵的英勇和其战争能力在各地都闻名遐迩。[courtier_1.GetFirstNameNoTooltip]指挥着许多可敬的骑士，若逢明主，他们会证明自己比一般的凶残佣兵更忠诚。从现在起，这些骑士将为我效力，让敌人感到恐惧吧！ "
 normandy.0031.desc.traders:0 "尽管他们因其战争能力而闻名，但[courtier_1.GetCulture.GetCollectiveNounNoTooltip]在在整个欧洲都关系良好。对于任何有商业头脑的统治者来说，他们多年来建立的人际网络都是一笔宝贵的资产。\n\n碰巧，[courtier_1.GetFirstNameNoTooltip]有旅行和贸易的经验，并提出把商人带到我的领地，与我建立富有成效的贸易关系。"
 normandy.0031.desc.rulers:0 "经过我们的谈判，我允许[courtier_1.GetCulture.GetNameNoTooltip]定居者[courtier_1.GetFirstNameNoTooltip]在[award_county.GetNameNoTier]自治。[courtier_1.GetSheHe|U]愉快地同意了这样的安排。\n\n同意这一点是明智的，因为这些[courtier_1.GetCulture.GetCollectiveNounNoTooltip]不仅仅是野蛮人。他们同意帮助保护我们的土地免受外国攻击，训练我们自己的士兵，并邀请更多的冒险家来协助我们处理军事和政治事务。"
 normandy.0031.desc.scholars:0 "在合并[GetGeographicalRegion('RICE_normandy_region').GetName]结束后，[courtier_1.GetCulture.GetCollectiveNoun]从拉丁人那获得了文化大师的美誉。因此，在[courtier_1.GetFirstNameNoTooltip]团队中有许多学者，神职人员和工匠。\n\n我向[courtier_1.GetFirstNameNoTooltip]明确表示，希望这些熟练的人能够帮助我改善我领土的文化。[courtier_1.GetSheHe|U]说他们非常乐意在这方面帮助我。"
 normandy.0031.desc.conclusion:0 "\n\n最后，我想问问是否可以请[courtier_1.GetFirstNameNoTooltip]帮助我训练士兵，并提供长期的军事和政治援助。"
 normandy.0031.a:0 "$normandy.0021.a$"
 normandy.0031.b:0 "$normandy.0021.b$"
 normandy.0031.c:0 "$normandy.0021.c$"
 normandy.0031.d:0 "$normandy.0021.d$"
 normandy.0031.e:0 "[courtier_1.GetFirstNameNoTooltip]，你能进一步协助我们吗？"
 normandy.0031.e.failure:0 "[courtier_1.GetFirstNameNoTooltip]无法再帮助你了"
 normandy.0031.e.success:0 "[courtier_1.GetFirstNameNoTooltip]帮助你获得为期#V 5‑20年#!的[GetModifier('RICE_normandy_norman_long_term_assistance').GetNameWithTooltip|L][character_modifier|E]"
 normandy.0031.f:0 "$normandy.0021.f$"
 normandy.0031.colonists_duchy_tt_10:0 "获得为期#V 10年#!的[GetModifier('RICE_normandy_norman_colonists').GetNameWithTooltip|L][county_modifier|E]"
 normandy.0031.colonists_duchy_tt_15:0 "获得为期#V 15年#!的[GetModifier('RICE_normandy_norman_colonists').GetNameWithTooltip|L][county_modifier|E]"
 normandy.0031.colonists_duchy_tt_20:0 "获得为期#V 20年#!的[GetModifier('RICE_normandy_norman_colonists').GetNameWithTooltip|L][county_modifier|E]"
 normandy.0031.colonists_duchy_tt_25:0 "获得为期#V 25年#!的[GetModifier('RICE_normandy_norman_colonists').GetNameWithTooltip|L][county_modifier|E]"
 RICE_norman_adventurer_convert_tooltip:0 "#italic 可能会#!皈依你的[faith|E]"
 normandy.0032.t:0 "更多援助"
 normandy.0032.desc.intro:0 "在我们谈判达成了双方有利的协议后，我与[courtier_1.GetFirstName]商议[courtier_1.GetSheHe]和[courtier_1.GetHerHis]战团是否可以提供进一步的长期援助。毕竟来自[GetGeographicalRegion('RICE_normandy_region').GetName]的人的军事勇气和政治头脑是众所周知的。"
 normandy.0032.desc.no:0 "\n\n唉，似乎[courtier_1.GetFirstNameNoTooltip]声称[courtier_1.GetSheHe]缺乏良好的联系，也没有能力为我军进行长期训练。\n\n意识到我的失望，[courtier_1.GetFirstNameNoTooltip]保证[courtier_1.GetHerHis]那帮冒险家会尽他们所能在我的王国里安居乐业。不过，我想知道[courtier_1.GetFirstNameNoTooltip]是在说真话，或者[courtier_1.GetSheHe]正狡猾地试图避免让我变得#italic 过于#!强大以损害[courtier_1.GetHerHis]利益。"
 normandy.0032.desc.yes:0 "\n\n[courtier_1.GetFirstNameNoTooltip]向我保证，谢天谢地，[courtier_1.GetSheHe]和[courtier_1.GetHerHis]冒险家可以为我提供长期的政治和军事支持。[courtier_1.GetSheHe|U]已经提供关于如何提高王国的防御能力，如何训练我的军队在战斗中表现得更好，以及如何提高我的政治权威的建议。\n\n总而言之，这些都是具体而有用的步骤，可以帮助我保持权力。有[courtier_1.GetFirstNamePossessiveNoTooltip]已被证明是一件好事！"
 normandy.0032.a:0 "我期待着与这些[courtier_1.GetCulture.GetCollectiveNounNoTooltip]一同合作！"
 normandy.0032.b:0 "$normandy.0022.b$"
 normandy.0032.c:0 "$normandy.0022.c$"
 normandy.0032.d:0 "$normandy.0022.d$"
 normandy.0032.e:0 "$normandy.0022.e$"
