 building_type_RICE_normandy_mont_saint_michel_01:0 "圣米歇尔山"
 building_type_RICE_normandy_mont_saint_michel_01_desc:0 "圣米歇尔山的潮汐岛上有一座著名的修道院，与大天使米迦勒息息相关。由于其独特的地理特征，该岛也具有很强的防御性，阻止了许多狼心狗行的军阀贸然进攻圣山，抢夺财富。"
 building_RICE_normandy_mont_saint_michel_01:0 "圣米歇尔山圣所"
 building_RICE_normandy_mont_saint_michel_01_desc:0 "圣米歇尔山的潮汐岛是大天使米迦勒的敬礼中心。虽然现在岛上只有一个简陋的圣殿，但该地仍吸引了许多当地朝圣者冒着危险的潮汐来到这里。"
 building_RICE_normandy_mont_saint_michel_02:0 "圣米歇尔山修道院"
 building_RICE_normandy_mont_saint_michel_02_desc:0 "在圣米歇尔山的潮汐岛上，建有一座规模庞大的修道院，可以看到数英里之外。朝圣者从很远的地方赶来，冒着危险的潮汐来瞻仰大天使。现在还有一个更大的修道院社区，将这个防卫森严的地方变成了诺曼底的学习和信仰中心。"
 building_RICE_normandy_mont_saint_michel_03:0 "圣米歇尔山修道院"
 building_RICE_normandy_mont_saint_michel_03_desc:0 "圣米歇尔山修道院除了为每天到此瞻仰大天使米迦勒的大量朝圣者服务外，还因其易守难攻的声誉而闻名。当地的统治者认识到这一点，将修道院早期的防御工事扩建为更加坚固和美丽的防御工事。"
 RICE_norse_raids:0 "纽斯特利亚的诺斯存在"
 RICE_norse_raids_desc:0 "法国心脏地带以北的地区被诺斯人的军营所侵占，诺斯军阀从这里向周边地区发动前所未有的袭扰，甚至威胁到巴黎本身的安全。控制这些诺斯人的军事手段效果好坏参半，也许一个狡猾的统治者反而可以找到一种和平谈判的方式，甚至可以同化这些诺斯人。"
 RICE_normandy_rollo_family_equivalent:0 "诺曼底缔造者"
 RICE_normandy_rollo_family_equivalent_desc:0 "该宗族在诺曼底公国的建立中发挥了重要作用。"
 RICE_normandy_norman_conquest:0 "诺曼征服"
 RICE_normandy_norman_conquest_desc:0 "完成史诗般[RICE_normandy_struggle|E]，以传奇般的大征服运动团结了诺曼人并巩固自己和诺曼人在历史书中的地位而为世人知晓的宗族。"
 RICE_normandy_domesday_book_surveyed:0 "受《末日审判书》调查"
 RICE_normandy_domesday_book_surveyed_desc:0 "该地区的统治者是诺曼人的后裔或继承人，他们在征服这些领土后最近下令进行一项伟大调查，有些人将称其为“末日审判书”。而“末日审判书”中包含的信息是管理这些领土的宝贵资料。"
 RICE_normandy_norse_colonists:0 "诺斯定居者"
 RICE_normandy_norse_colonists_desc:0 "该地区的领主最近颁布了一些政策，鼓励大量来自诺斯移民涌入并在此定居，希望他们的技艺和关系能够证明是有用的。"
 RICE_normandy_norman_colonists:0 "诺曼定居者"
 RICE_normandy_norman_colonists_desc:0 "该地区的领主最近颁布了一些政策，鼓励大量来自诺曼地区的移民涌入并在此定居，希望他们的技艺和关系能够证明是有用的。"
 RICE_normandy_norse_traders:0 "诺斯商人"
 RICE_normandy_norse_traders_desc:0 "该角色与在其领土上经营的诺斯商人达成一些重要的商业交易。"
 RICE_normandy_norman_traders:0 "诺曼商人"
 RICE_normandy_norman_traders_desc:0 "该角色与在其领土上经营的诺曼地区商人达成一些重要的商业交易。"
