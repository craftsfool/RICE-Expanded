 RICE_normandy_aspiration_rollo_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$在[GetTitleByKey('d_normandy').GetNameNoTier]定居，通过任何必要手段发起[RICE_normandy_struggle|E]或成为[struggle_involved|E]。\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![special_troops|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$皈依基督教[faith|E]（奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('d_normandy').GetNameNoTier]的[ruler|E]（奖励：@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![dynasty_prestige|E]）\n$EFFECT_LIST_BULLET$国库里至少有[gold_i|E]#V 1000#!（奖励：你[realm|E]中的每个在[GetGeographicalRegion('RICE_normandy_region').GetName]区域的[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]）"
