 RICE_normandy_mont_saint_michael_pilgrimage:0 "开始圣米歇尔山朝圣之旅"
 RICE_normandy_mont_saint_michael_pilgrimage_tooltip:0 "你将开始去[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]的[pilgrimage|E]"
 RICE_normandy_mont_saint_michael_pilgrimage_desc:0 "[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]是当地朝圣者的热门目的地，我应该去那里看看存放的圣遗物，这些遗物长期以来一直与大天使米迦勒联系在一起。"
 RICE_normandy_mont_saint_michael_pilgrimage_effect_tooltip_1:1 "你将前往[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]进行[pilgrimage|E]，并获得圣奥贝尔主教或大天使米迦勒祝福的[character_modifiers|E]以及[piety|E]"
 RICE_normandy_mont_saint_michael_pilgrimage_effect_tooltip_2:1 "你将前往[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]进行[pilgrimage|E]，并获得圣母玛利亚或大天使米迦勒祝福的[character_modifiers|E]以及[piety|E]"
 RICE_normandy_mont_saint_michael_pilgrimage_effect_tooltip_3:1 "获得[modifiers|E]的概率取决于你的[piety_level|E]"
 RICE_normandy_mont_saint_michael_pilgrimage_confirm:0 "去朝圣！"
 RICE_normandy_mont_saint_michael_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!在中世纪，圣米歇尔山是一个受欢迎的朝圣地，与大天使米迦勒相关。起初，对米迦勒的敬礼往往是通过圣奥贝尔间接进行的，他是8世纪该修道院的传奇创始人。奥贝尔甚至比米迦勒更受欢迎，他在附近的阿夫朗什有一年一度的游行，据说会引起许多神迹。后来，朝圣者的关注点转回到了米迦勒和圣母玛利亚身上，而非奥贝尔。例如法国国王菲利普四世向修道院捐赠了一尊巨大的金色雕像，使所有人都能看到米迦勒。不过宗教改革以及后来的法国大革命，导致了朝圣的人气下降。"
 RICE_normandy_observe_procession_of_saint_aubert:0 "观看圣奥贝尔游行"
 RICE_normandy_observe_procession_of_saint_aubert_tooltip:0 "去阿夫朗什参加圣奥贝尔常规游行"
 RICE_normandy_observe_procession_of_saint_aubert_desc:0 "在[ROOT.Char.GetFaith.GetReligion.GetAdjective]，每年都有一个习俗——即组织游行，从[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]街道到[GetTitleByKey('b_avranches').GetNameNoTier]拉着圣奥贝尔遗骸来巡游。他们说在这个活动中会发生许多奇迹，我希望今年能参加这个活动。"
 RICE_normandy_observe_procession_of_saint_aubert_effect_tooltip_1:1 "你将获得一些[piety|E]，基于你的[piety_level|E]，还会有小概率获得不可思议的[character_modifier|E]"
 RICE_normandy_observe_procession_of_saint_aubert_confirm:0 "为参观做好准备！"
 RICE_normandy_observe_procession_of_saint_aubert_context_tooltip:0 "$RICE_normandy_mont_saint_michael_pilgrimage_context_tooltip$"
 RICE_normandy_find_saint_aubert_relics:0 "找到圣奥贝尔的遗物"
 RICE_normandy_find_saint_aubert_relics_tooltip:0 "圣奥贝尔的遗物还能被重新发现吗？"
 RICE_normandy_find_saint_aubert_relics_desc:0 "[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]创始人圣奥贝尔遗物在不久前被宣布遗失了。如果我们奇迹般地重新找到它们，那么可以提高[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]的威望。"
 RICE_normandy_find_saint_aubert_relics_effect_tooltip_1:1 "基于你的[intrigue|E]和[piety_level|E]，你有#V [GetPlayer.MakeScope.ScriptValue('RICE_normandy_saint_aubert_relic_discovery_chance')|0]%#!的概率发现遗迹并获得[GetModifier('RICE_normandy_saint_aubert_relic_discoverer').GetNameWithTooltip][character_modifier|E]"
 RICE_normandy_find_saint_aubert_relics_effect_tooltip_2:1 "如果找到了遗物，你将获得随机的[piety|E]（[piety_i|E]#P 150#!和[piety_i|E]#P 250#!之间），反之如果没找到将获得则为[piety_i|E]#P 50#!和[piety_i|E]#P 100#!之间的[piety|E]"
 RICE_normandy_find_saint_aubert_relics_effect_tooltip_3:1 "如果发现遗物，将允许来自[GetTitleByKey('c_avranches').GetNameNoTier]附近更大地理范围的[rulers|E]进行$RICE_normandy_mont_saint_michael_pilgrimage$[decisions|E]，以及$RICE_normandy_observe_procession_of_saint_aubert$[decision|E]"
 RICE_normandy_find_saint_aubert_relics_confirm:0 "遗物#italic 肯定#!在某处。"
 RICE_normandy_find_saint_aubert_relics_context_tooltip:0 "#emphasis 历史背景：#!圣米歇尔山及教堂创始人圣奥贝尔的遗物在十世纪末曾失踪三十多年，在院牧希尔德贝尔一世（1009年‑1017年）时期被重新发现。根据传说，遗物是在一位名叫伯尼里乌斯的教士家里发现的；他计划将圣徒的遗体转移到其他地方，不过随后他的身亡导致计划泡汤。此间发生一系列神奇的事件，以证实这些确实是圣奥贝尔的遗物，例如一位修士在怀疑遗物的真实性时瘫痪了等等，这些奇事标志着对圣奥贝尔的崇敬开始流行。"
 RICE_normandy_saint_aubert_relics_missing_req:0 "圣奥贝尔的遗物已经丢失了！"
 RICE_normandy_saint_aubert_relics_found_req:0 "圣奥贝尔的遗物已被找到"
 RICE_normandy_close_to_avranches_req:0 "你的[capital|E]靠近[GetTitleByKey('c_avranches').GetNameNoTier]地区"
 RICE_decision_normandy_procession_saint_aubert_month_requirement:0 "当前月份是五月或六月"
 RICE_normandy_archangel_michael_statue:0 "在圣米歇尔山竖立米迦勒像"
 RICE_normandy_archangel_michael_statue_tooltip:0 "一定有更好的方式来膜拜大天使米迦勒！"
 RICE_normandy_archangel_michael_statue_desc:0 "[GetBuilding('RICE_normandy_mont_saint_michel_02').GetName]多年来一直是个重要的朝圣地。天使长米迦勒长期与这的修道院息息相关，而且越来越受欢迎。我们为什么不在修道院里建一座伟大的米迦勒像，让信徒们有一个看得见的敬拜对象？"
 RICE_normandy_archangel_michael_statue_effect_tooltip_1:1 "当[decision|E]参加$RICE_normandy_mont_saint_michael_pilgrimage$时，朝圣者现在将在代表圣奥贝尔主教或大天使米迦勒的[modifiers|E]之间进行选择，而不是在代表米迦勒或圣母[modifiers|E]之间进行选择。"
 RICE_normandy_archangel_michael_statue_effect_tooltip_2:1 "随着圣奥伯尔的重要性下降，$RICE_normandy_observe_procession_of_saint_aubert$[decision|E]现在将仅限于[GetTitleByKey('c_avranches').GetNameNoTier][rulers|E]。"
 RICE_normandy_archangel_michael_statue_confirm:0 "伟大的修道院理应如此!"
 RICE_normandy_archangel_michael_statue_context_tooltip:0 "$RICE_normandy_mont_saint_michael_pilgrimage_context_tooltip$"
 RICE_normandy_commission_historia_normannorum:0 "委托编撰诺曼人的历史"
 RICE_normandy_commission_historia_normannorum_tooltip:0 "为了解决[RICE_normandy_struggle|E]，我们必须通过身份认同和文化认同来团结一致"
 RICE_normandy_commission_historia_normannorum_desc:0 "我们巩固[GetTitleByKey('d_normandy').GetNameNoTier]的尝试并不一定顺利。为了我们作为[ROOT.Char.GetCulture.GetCollectiveNoun]团结起来，我决定找一位学者撰写我们民族的历史，讲述在[ROOT.Char.GetDynasty.GetName]家族的领导下，如何团结发展诺斯人和法兰克人！"
 RICE_normandy_commission_historia_normannorum_effect_tooltip_1:1 "你将指派一名[courtier|E]撰写#italic 诺曼史#!或者雇佣一名随机[character|E]来代替#V @gold_icon![EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0]#!"
 RICE_normandy_commission_historia_normannorum_effect_tooltip_2:1 "发起这个[decision|E]将获得[prestige_i|E]#V  200#!和@dynasty_prestige_icon! #V 100#!. 一旦完成，[GetTitleByKey('d_normandy').GetNameNoTier][ruler|E]的[dynasty|E]（或在[duchy|E]中选择[count|E]，前提是没人持有它）获得@dynasty_prestige_icon!#V 1000#!，无论由其发起。"
 RICE_normandy_commission_historia_normannorum_effect_tooltip_3:1 "[norman.GetCollectiveNoun]的[language|E]（以及所有仍使用[norse.GetLanguage.GetName]的[cultures|E]后裔）将更改为[french.GetLanguage.GetName]"
 RICE_normandy_commission_historia_normannorum_effect_tooltip_4:1 "所有拥有$tradition_RICE_northmen_name$[tradition|E]的[cultures|E]将升级至更好的$tradition_RICE_adventurers_and_aristocrats_name$"
 RICE_normandy_commission_historia_normannorum_effect_tooltip_5:1 "该[decision|E]是[RICE_normandy_struggle|E]中$RICE_normandy_struggle_ending_conquest_decision$结局与$RICE_normandy_struggle_ending_assimilation_decision$的#bold 必要#![decision|E]"
 RICE_normandy_commission_historia_normannorum_confirm:0 "我们曾有辉煌而今后也必将辉煌！"
 RICE_normandy_commission_historia_normannorum_context_tooltip:0 "#emphasis 历史背景：#!完成于公元1015年的#italic 《诺曼底史》（De moribus et actis primorum Normanniae ducum）#!是一部有影响力的诺曼底人的早期历史文献。不过它有许多幻想的成分，例如将诺曼底的第一任公爵罗洛变成了特洛伊英雄埃涅阿斯那样的英雄流亡者。它是由圣康坦的杜多在罗洛的后裔的要求下写成的，有人认为，他们想通过神话祖先来创造一个以他们王朝为中心的诺曼底身份。因此，对公爵们在诺曼底发挥作用极端简化，浓缩在一些决定和事件中。"
 RICE_normandy_build_minor_christian_holy_building:0 "建立当地的基督教宗教建筑"
 RICE_normandy_build_minor_christian_holy_building_tooltip:0 "将在你的[capital|E]建造一座[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]建筑"
 RICE_normandy_build_minor_christian_holy_building_desc:0 "作为一个[ROOT.Char.GetTitleAsNameNoTooltip]，我希望通过捐献资金来彰显对[ROOT.Char.GetFaith.HighGodName]的虔诚，在我的[domain|E]上建造一个新的[ROOT.Char.GetFaith.GetAdjective]建筑。当地将从中获得精神上的安抚，这样每个人都会知道我的虔诚！"
 RICE_normandy_build_minor_christian_holy_building_effect_tooltip_1:1 "你将选择建造一个礼拜堂，教堂或修道院，这将获得不同的[piety|E]，[prestige|E]和[dynasty_prestige|E]收益，并为你和你的[realm_capital|E]加上相配的[character_modifier|E]和[county_modifier|E]"
 RICE_normandy_build_minor_christian_holy_building_effect_tooltip_2:1 "你不会立即获得奖励，因为建设过程需要一两年的时间"
 RICE_normandy_build_minor_christian_holy_building_confirm:0 "为了[ROOT.Char.GetFaith.HighGodNameAlternate]的荣耀！"
 RICE_normandy_build_minor_christian_holy_building_county_req:0 "你的[realm_capital|E]中没有[county_modifier|E]是关于正在建造宗教场所"
 RICE_normandy_build_minor_christian_holy_building_current_req:0 "未在建设基督教宗教场所"
 RICE_normandy_build_minor_christian_holy_building_context_tooltip:0 "#emphasis 历史背景：#!在中世纪，基督教王室和贵族经常在当地建立宗教场所，以示虔诚或忏悔。例如，征服者威廉与佛兰德斯的玛蒂尔达的婚姻被教宗以血缘关系为由拒绝，这对夫妇后来同意建立两座教堂作为忏悔。另一个例子是，威廉争夺英格兰王位的竞争对手哈罗德·戈德温森在1060年重建了沃尔瑟姆修道院——据传，他这样做是为了感谢自己小时候的瘫痪奇迹般地治愈了。"
