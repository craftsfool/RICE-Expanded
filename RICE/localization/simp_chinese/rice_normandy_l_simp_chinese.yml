 normandy.0001.t:0 "$RICE_normandy_struggle$"
 normandy.0001.desc.RICE:0 "曾经诺斯人蹂躏法国海岸的时代已经一去不复返了！如今[charles.GetTitledFirstName]与一位著名诺斯军阀[rollo.GetFirstNameNicknamed]签订了一份协议：既保护法国北部免遭其他诺斯人袭扰，作为回报，[rollo.GetFirstNameNoTooltip]将统治[GetGeographicalRegion('RICE_normandy_region').GetName]。\n\n然而，对于[rollo.GetFirstNameNoTooltip]和[rollo.GetHerHis]的继任者来说，被授予诺曼底是一回事，#italic 治理#!它是另一回事。该地是一个动荡不安的边境地区，充满了机遇，如今诺斯定居者与当地的法兰克人和布列塔尼人混合在一起，形成了一个新的[norman.GetName]文化。"
 normandy.0001.desc.vanilla:0 "曾经诺斯人蹂躏法国海岸的时代已经一去不复返了！一位名叫[rollo.GetFirstNameNicknamed]的著名诺斯军阀通过征服、阴谋、政治还是其他手段，最终在[GetGeographicalRegion('RICE_normandy_region').GetName]建立了一个大王国。\n\n然而，对于[rollo.GetFirstNameNoTooltip]和[rollo.GetHerHis]的继任者来说，夺取诺曼底是一回事，#italic 治理#!它是另一回事。该地是一个动荡不安的边境地区，充满了机遇，如今诺斯定居者与当地的法兰克人和布列塔尼人混合在一起，形成了一个新的[norman.GetName]文化。"
 normandy.0001.a:0 "我们的命运就是诺曼底的命运。"
 normandy.0001.b:0 "谁知道诺曼底的未来会怎样？"
