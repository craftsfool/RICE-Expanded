 RICE_normandy_domesday_book_artifact_name:0 "《末日审判书》"
 RICE_normandy_domesday_book_artifact_england_desc:0 "这份手稿全面记录了在[ROOT.Char.GetTitledFirstName]统治时期对[GetGeographicalRegion('custom_england').GetName]的调查。它包含了该地区的土地所有者、资产、居民和农奴等的详细信息。虽然官方称其为“大调查”，但它却赢得了“末日审判书”的美称，因为就像圣经中最后的审判一样，调查结果是不可更改，不容置疑。"
 RICE_normandy_domesday_book_artifact_france_desc:0 "这份手稿全面记录了在[ROOT.Char.GetTitledFirstName]统治时期对[GetGeographicalRegion('custom_west_francia_minus_mediterranean').GetName]的调查。它包含了该地区的土地所有者、资产、居民和农奴等的详细信息。虽然官方称其为“大调查”，但它却赢得了“末日审判书”的美称，因为就像圣经中最后的审判一样，调查结果是不可更改，不容置疑。"
 RICE_normandy_domesday_book_artifact_greater_normandy_desc:0 "这份手稿全面记录了在[ROOT.Char.GetTitledFirstName]统治时期对[GetGeographicalRegion('RICE_greater_normandy_region').GetName]的调查。它包含了该地区的土地所有者、资产、居民和农奴等的详细信息。虽然官方称其为“大调查”，但它却赢得了“末日审判书”的美称，因为就像圣经中最后的审判一样，调查结果是不可更改，不容置疑的。"
 RICE_normandy_historia_normannorum_name:0 "诺曼底史"
 RICE_normandy_historia_normannorum_desc:0 "这是一份[dudo_of_saint_quentin.GetFullName]所著的#italic 版《诺曼底史》#!手稿原件。\n\n[dudo_of_saint_quentin.GetFirstNameNoTooltip]受[original_sponsor.GetTitledFirstName]所托，记载了由最初的[norman.GetCollectiveNoun]登陆$d_normandy$至今的筚路蓝缕。耗时多年，最终成文献于[norman_duke.GetTitledFirstName]。\n\n全篇取材于口口相传的民间故事，采用散文结合诗歌的方式，以奇幻视角重述了[rollo.GetTitledFirstName][rollo.GetHerHis]是如何抵达海岸、其后裔是如何将$d_normandy$各族人民团结至[rollo.GetTitledFirstName]麾下，凝聚成统一王国的传奇伟业。因此，本文着力刻画了[norman_duke.GetFirstNameNoTooltip]宗族的光辉形象。"
 game_concept_RICE_normandy_struggle_short:1 "诺曼底斗争"
 game_concept_RICE_normandy_struggle:1 "联合诺曼底"
 game_concept_RICE_normandy_struggle_desc:2 "$game_concept_RICE_normandy_struggle$是发生在[GetGeographicalRegion('RICE_normandy_region').GetName][region|E]的一个小型[struggle|E]。它描述了诺曼人的民族起源，诺曼人将在中世纪早期极大地影响欧洲和中东的历史，以及诺曼人在政治、军事和文化方面的长期斗争，不仅要凝聚在一个统一的身份之下，还认同这一身份的性质。\n\n由于这是一场规模较小的[struggle|E]，与其他[struggle|E]相比，$game_concept_RICE_normandy_struggle$中的[struggle_involved|E][rulers|E]对其结果有较大的影响，因此该斗争删除部分（跳过）[struggle_phase_phases|E]，所以会比其他[struggle_struggles|E]要快很多。"
