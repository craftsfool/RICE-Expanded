 normandy.0111.desc:0 "xxxxx"
 normandy.0111.a:0 "xxxxx"
 normandy.0112.t:0 "#italic 诺曼底史#!"
 normandy.0112.desc:0 "几年前，[dudo_of_saint_quentin.GetFirstName]在[original_sponsor.GetTitledFirstNameNicknamed]赞助下开始编写[GetGeographicalRegion('RICE_normandy_region').GetName]的历史。[original_sponsor.GetFirstNameNoTooltip]希望这项工作将鼓励[norman.GetName]团结在一个身份和[original_sponsor.GetHerHis]家族下。#italic 《诺曼底史》#!记录了公国从[rollo.GetTitledFirstName]直到现在的历史，终于完成了。\n\n"
 normandy.0112.desc.sponsor_dead:0 "然而，[original_sponsor.GetFirstNameNoTooltip]并没有活着看到这一天。因此，这部史书被献给了$d_normandy$的一位重要大人物，[norman_duke.GetTitledFirstName]。"
 normandy.0112.desc.sponsor_alive:0 "这部史书被献给给[original_sponsor.GetFirstNameNoTooltip]，项目的发起人。"
 normandy.0112.desc.sponsor_other:0 "虽然[original_sponsor.GetFirstNameNoTooltip]还在，但[original_sponsor.GetSheHe]在$d_normandy$的政治事务中不再扮演重要角色。因此，这部史书被献给$d_normandy$的一位重要大人物，而非[norman_duke.GetTitledFirstName]。"
 normandy.0112.desc.sponsor_backup:0 "完整的史书已被献给最强大的$d_normandy$统治者。"
 normandy.0112.desc.dudo_alive:0 "多年来，[dudo_of_saint_quentin.GetFirstNameNoTooltip]努力梳理旧记录并采访相关人员，在此期间，[dudo_of_saint_quentin.GetSheHe]逐渐接近[norman_duke.GetFirstNameNoTooltip]。"
 normandy.0112.desc.dudo_dead:0 "[dudo_of_saint_quentin.GetFirstNameNoTooltip]在撰写这段历史时去世了，其他学者不得不继续[dudo_of_saint_quentin.GetHerHis]工作。然而，[dudo_of_saint_quentin.GetHerHis]贡献不可否认，所以[dudo_of_saint_quentin.GetSheHe]被理所当然地认为是这本书的主要作者。"
 normandy.0112.desc.conclusion:0 "\n\n总而言之，这是一部不朽的作品，促进了[norman_duke.GetDynasty.GetName]王朝巩固他们对$d_normandy$的统治，并引导[norman.GetCollectiveNounNoTooltip]走向更伟大的命运。"
 normandy.0112.a:0 "[dudo_of_saint_quentin.GetFirstNameNoTooltip]已经为[norman.GetNameNoTooltip]人做了很多。"
 normandy.0112.tooltip.culture_language:1 "[norman.GetCollectiveNoun]的[language|E]（以及所有来自他们而依然说[norse.GetLanguage.GetName]的[cultures|E]）改为[french.GetLanguage.GetName]"
 normandy.0112.tooltip.culture_tradition:1 "所有拥有$tradition_RICE_northmen_name$[tradition|E]的[cultures|E]，其传统已升级为$tradition_RICE_adventurers_and_aristocrats_name$"
 normandy.0112.tooltip.struggle_req:1 "[RICE_normandy_struggle|E]离结束又近了一步"
 normandy.0113.t:0 "xxxxx"
 normandy.0113.desc:0 "xxxxx"
 normandy.0113.a:0 "xxxxx"
 normandy.0114.t:0 "$normandy.0110.t$"
 normandy.0114.desc:0 "不久前，[dudo_of_saint_quentin.GetFullName]由[original_sponsor.GetTitledFirstNameNicknamed]委托写关于[GetGeographicalRegion('RICE_normandy_region').GetName]的历史。唉,[dudo_of_saint_quentin.GetFirstNameNoTooltip]已经在[dudo_of_saint_quentin.GetSheHe]写完之前去世。"
 normandy.0114.desc.almost_done:0 "\n\n幸运的是，[dudo_of_saint_quentin.GetFirstNameNoTooltip]正在写的史书，即[dudo_of_saint_quentin.GetSheHe]称为#italic 《诺曼底史》#!的那本，已基本完成。其他几位学者和[dudo_of_saint_quentin.GetFaith.PriestNeuterPlural]一直在帮助[dudo_of_saint_quentin.GetHerHim]研究，他们有信心很快就能完成。"
 normandy.0114.desc.partway:0 "\n\n[dudo_of_saint_quentin.GetFirstNameNoTooltip]正在写的史书，[dudo_of_saint_quentin.GetSheHe]称为#italic 《诺曼底史》#!的那本，有些不完整。值得庆幸的是，其他几位学者和[dudo_of_saint_quentin.GetFaith.PriestNeuterPlural]一直在帮助[dudo_of_saint_quentin.GetHerHim]。他们发誓要尽最大的努力续上[dudo_of_saint_quentin.GetFirstNameNoTooltip]结束的地方。"
 normandy.0114.desc.starting:0 "\n\n唉，[dudo_of_saint_quentin.GetFirstNameNoTooltip]写的史书，[dudo_of_saint_quentin.GetSheHe]称为#italic 《诺曼底史》#!的那本，是非常不完整的。其他几位学者和[dudo_of_saint_quentin.GetFaith.PriestNeuterPlural]一直在帮助[dudo_of_saint_quentin.GetHerHim]。基于[dudo_of_saint_quentin.GetFirstNamePossessiveNoTooltip]的注释和[dudo_of_saint_quentin.GetSheHe]留下的说明，尽管遭遇了挫折，他们还是会尽其所能。"
 normandy.0114.desc.conclusion:0 "\n\n不管怎样，这些学者和[dudo_of_saint_quentin.GetFaith.PriestNeuterPlural]会尽力工作。他们确信如果[dudo_of_saint_quentin.GetFirstNameNoTooltip]仍然活着，[dudo_of_saint_quentin.GetSheHe]也会为最终的作品感到骄傲！"
 normandy.0114.a:0 "我知道了……"
