 RICE_north_atlantic_make_faith_involved_in_greenland_desc:0 "虽然[ROOT.Char.GetFaith.GetName]已经扩散到[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]，但它在[greenland_settlements|E]并不是主流。如果我们的[faith|E]在[RICE_greenland_struggle|E]中成为[struggle_involved|E]就好了，这样即使那些遥远的世界边疆也能被[ROOT.Char.GetFaith.HighGodName]的真理教诲。"
