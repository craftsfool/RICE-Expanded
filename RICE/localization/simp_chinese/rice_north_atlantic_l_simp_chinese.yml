 north_atlantic.0090.t.thrall:0 "才华横溢的[thrall.GetCulture.GetNameNoTooltip]索尔奴隶"
 north_atlantic.0090.t.free:0 "才华横溢的[thrall.GetCulture.GetNameNoTooltip]定居者"
 north_atlantic.0090.desc.thrall:0 "[thrall.GetFirstName]最近在我的宫廷里获得认可，他是一个有能力的奴隶。[thrall.GetSheHe|U]是在突袭某个[thrall.GetCulture.GetName]定居点时被抓获的奴隶，我花了不小的价钱才买下他。\n\n也许我应该给[thrall.GetHerHim]一个更好的位置，来提升[thrall.GetHerHis]的地位。[thrall.GetSheHe]在我身边帮助我，而不是在其他地方做无意义琐事，这样才对得起[thrall.GetHerHis]的才能。"
 north_atlantic.0090.desc.free:0 "最近[thrall.GetWomanMan]近因为有能力、有技术获得了一些认可。[thrall.GetSheHe|U]不是一个索尔（至少不再是一个奴隶），而是来自某个遥远的[thrall.GetCulture.GetName]定居点的自由[thrall.GetWomanMan]，他不久前定居在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]。\n\n也许我应该给[thrall.GetHerHim]一个更好的位置，来提升[thrall.GetHerHis]的地位。[thrall.GetSheHe]在我身边帮助我，而不是在其他地方做无意义琐事，这样才对得起[thrall.GetHerHis]的才能。"
 north_atlantic.0090.a:0 "没错，我们应该挖掘[thrall.GetFirstNamePossessiveNoTooltip]能力。"
 north_atlantic.0090.b:0 "不，我对[thrall.GetFirstNameNoTooltip]没兴趣"
 north_atlantic.0090.info:0 "\n#emphasis 历史背景：#!有明确的遗传学、历史学和文学证据表明，现代冰岛人有相当多的盖尔人血统。参与冰岛最初定居的女性中有超过50%、男性中至少有20%可能是盖尔人的后裔，虽然他们中的许多人可能是奴隶或仆人，但也不排除有相当一部分人是自由身的男女。考虑到诺斯人曾经在欧洲各地进行掠夺和奴役，冰岛最初定居者中也有可能包括来自欧洲其他地区的人。\n\n一个有可能有盖尔人血统的著名例子是莱夫·埃里克松，他可能是爱尔兰贵族的远亲。另一个著名例子是梅尔科卡，她被认为是一位爱尔兰公主，后来被一位冰岛酋长纳为妾室。她的儿子“孔雀”奥拉夫据说曾经前往爱尔兰，并被他的祖父提供王位，之后又经历了各种冒险。\n\n这些盖尔男女中的许多人被同化（很可能是在许多情况下被强制）到诺斯社会中，而后来的冰岛人如果有任何盖尔人血统，很可能会因为可能是卑微奴隶的后代而感到羞耻并选择隐瞒。然而，他们可能以多种方式影响了冰岛的历史和文化。例如，他们可能促进了基督教在冰岛的早期传播。此外，有证据表明，冰岛传奇尽管是由基督教徒的冰岛人编纂，但通常与异教徒的维京人联系在一起，可能借鉴了爱尔兰神话和文学的思想、主题和情节，即使其中的人物或神祗并不是盖尔人本身。"
 north_atlantic.0091.t.thrall:0 "强迫一个索尔作为配偶"
 north_atlantic.0091.t.free:0 "定居者之间的婚姻"
 north_atlantic.0091.desc.thrall:0 "[thrall.GetFirstName]是在突袭[thrall.GetCulture.GetName]定居点时被抓获并在不久前被卖给[courtier.GetTitledFirstName]的索尔（奴隶）。"
 north_atlantic.0091.desc.free:0 "[thrall.GetFirstName]是来自某个遥远的[thrall.GetCulture.GetName]定居点的当地自由民[thrall.GetWomanMan]，不久前在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]定居，并与[courtier.GetTitledFirstName]相识了。"
 north_atlantic.0091.desc.marriage:0 "\n\n我被告知，[courtier.GetTitledFirstNameNoTooltip]不知道因为什么原因，就决定将[thrall.GetFirstNameNoTooltip]许配为[courtier.GetHerHis]的配偶。"
 north_atlantic.0091.desc.concubinage:0 "\n\n我被告知，[courtier.GetTitledFirstNameNoTooltip]不知道因为什么原因，就决定娶[thrall.GetFirstNameNoTooltip]为[courtier.GetHerHis]的妾室。"
 north_atlantic.0091.desc.conclusion.thrall:0 "有许多来自遥远国度（尤其是不列颠群岛）的奴隶，他们居住在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]。不管怎么说，与自己的奴隶上床也不是没有，所以这样的事情是可以预期的。毕竟这里的一些定居者是这种结合的后代。"
 north_atlantic.0091.desc.conclusion.free:0 "虽然这里来自远方的人不多，但仍有不少人居住在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]。定居者尽管在文化和语言上存在差异，但无论是出于经济或实际的原因，还是出于伴侣关系，形成这样的联盟并不罕见。毕竟这里的一些定居者是这种结合的后代。"
 north_atlantic.0091.a:0 "我希望[thrall.GetFirstNameNoTooltip]没问题……"
 north_atlantic.0091.b:0 "我希望他们两个有一个成功的后裔！"
 north_atlantic.0091.c:0 "有趣，让我们拭目以待吧。"
 north_atlantic.0092.t:0 "被俘的外乡人"
 north_atlantic.0092.desc.intro:0 "来自[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的一些冒险者引起了很大的轰动。在西部海域旅行时，他们抓到了一个当地土著，我让这些冒险家来到我的宫廷，向我介绍这个名叫[native.GetFirstName]的土著。\n\n"
 north_atlantic.0092.desc.child:0 "我发现[native.GetFirstNameNoTooltip]是个孩子！而且这个看起来很奇怪的孩子在我们面前相当紧张。"
 north_atlantic.0092.desc.adult:0 "[native.GetFirstNameNoTooltip]是一个有趣的且有些奇怪的[native.GetWomanMan]。[native.GetSheHe|U]显然和我们对[native.GetHerHim]一样对我们感到困惑。"
 north_atlantic.0092.desc.conclusion:0 "\n\n尽管语言不通，但[native.GetFirstNameNoTooltip]还是设法与我们交流了一下。虽然我们这里很多人都称[native.GetHerHim]为“斯格林人”，但[native.GetSheHe]坚持认为[native.GetHerHis]人被称为[native.GetCulture.GetCollectiveNoun]。冒险家们说如果我愿意，我可以让[native.GetHerHim]留在我的宫廷。"
 north_atlantic.0092.a:0 "[native.GetSheHe|U]可以留下来，请务必支付一些金闪闪。"
 north_atlantic.0092.b:0 "我没有兴趣把[native.GetHerHim]留在我的宫廷里"
 north_atlantic.0092.c:0 "这对[native.GetHerHim]不公平。帮助[native.GetHerHim]返回[native.GetHerHis]的故乡吧"
 north_atlantic.0093.t:0 "外乡人"
 north_atlantic.0093.desc.vinland_colony:0 "我们在遥远的文兰同胞们有时会遇到生活在附近土地上的外乡人。"
 north_atlantic.0093.desc.vinland_outpost:0 "生活在遥远的文兰前哨家族同胞们有时会遇到生活在附近土地上的外乡人。"
 north_atlantic.0093.desc.greenland:0 "随着格陵兰定居点的发展，我在那里家族庄园的同胞们有时会遇到生活在附近土地上的外乡人。"
 north_atlantic.0093.desc.conclusion:0 "与这样的外乡人交往也不是没有过。有一个这样的外乡人[native.GetWomanMan]，名叫[native.GetFirstName]，已经在我们的人民身边生活了一段时间，[native.GetSheHe]与他们关系良好。\n\n有趣的是，[native.GetFirstNameNoTooltip]在听到关于我的故事后，希望访问我的宫廷，并设法获得了前往我们土地的船票。今天[native.GetSheHe]到达了我世世代代赖以生存的土地。\n\n虽然我们这里的许多人称[native.GetFirstNameNoTooltip]为“斯克林斯人”，但[native.GetSheHe]坚持认为[native.GetSheHe]来自[native.GetCulture.GetName]族。正如我们发现[native.GetHerHim]的魅力一样，[native.GetSheHe]显然也被我们文化迷住了。也许我可以说服[native.GetSheHe]留下来……"
 north_atlantic.0093.a:0 "我应该说服[native.GetHerHim]留下来"
 north_atlantic.0093.a.success:0 "[native.GetFirstNameNoTooltip]被说服 "
 north_atlantic.0093.a.failure:0 "[native.GetFirstNameNoTooltip]未被说服 "
 north_atlantic.0093.a.failure.tooltip:0 "[native.GetFirstNameNoTooltip]谢绝回乡"
 north_atlantic.0093.b:0 "[native.GetSheHe|U]很优秀，但我不需要[native.GetHerHim]在我的宫廷上。"
 north_atlantic.0094.t:0 "与格陵兰建立联系"
 north_atlantic.0094.desc:0 "遥远的格陵兰岛定居点是一个小而旺盛的城镇，这个城镇是多年前[erik.GetFirstNameNicknamed]发现格陵兰岛时首次建立的。这些[greenlander.GetCulture.GetCollectiveNoun]中的一些人经常在格陵兰和欧洲之间来回贸易，通常交易海象牙等异国商品。\n\n一个名叫[greenlander.GetFirstName]的[greenlander.GetCulture.GetNameNoTooltip]城镇青年最近来到[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]，并想长期留在这里，如果我愿意接受[greenlander.GetHerHim]作为我的廷臣，那么我们可以利用[greenlander.GetHerHis|U]来加强格陵兰的商业和政治网络的联系…… "
 north_atlantic.0094.a:0 "欢迎来到我的宫廷！[greenlander.GetFirstNameNoTooltip]！"
 north_atlantic.0095.t:0 "与文兰建立联系"
 north_atlantic.0095.desc:0 "遥远的文兰定居点是一个小而旺盛的城镇，这个城镇是多年前[leif.GetFirstNameNicknamed]发现文兰时首次建立的。这些[vinlander.GetCulture.GetCollectiveNoun]中的一些人经常在文兰和欧洲之间来回贸易，通常交易一些小商品。\n\n一个名叫[vinlander.GetFirstName]的[vinlander.GetCulture.GetNameNoTooltip]城镇青年最近来到[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]，并想长期留在这里，如果我愿意接受[vinlander.GetHerHim]作为我的廷臣，那么我们可以利用[vinlander.GetHerHis|U]来加强文兰的商业和政治网络的联系…… "
 north_atlantic.0095.a:0 "欢迎来到我的宫廷！[vinlander.GetFirstNameNoTooltip]！"
