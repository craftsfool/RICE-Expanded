 north_atlantic.0270.t:0 "冰岛的第一位主教"
 north_atlantic.0270.desc:0 "多年前，我曾前往德意志地区，师从那里博学的修道士和学者学习[christian.GetName]。虽然现在我的祖国[GetTitleByKey('d_iceland').GetNameNoTier]已经是一个坚定的基督教国家，但教会仍然难以在这里扎根。\n\n为了改变这种状况，[aldabert.GetTitledFirstName]在1056年任命我为[GetTitleByKey('d_iceland').GetNameNoTierNoTooltip]的第一位主教，这可能是因为我在学习过程中表现出的能力，也可能是因为我家族的关系。无论如何，作为[GetTitleByKey('d_iceland').GetNameNoTierNoTooltip]的第一位主教，我现在的目标是确保教会能够在这个遥远的土地上繁荣发展。\n\n我有宏大的计划，要建造宗教场所，培养新一代的神职人员，并尽我所能将[ROOT.Char.GetFaith.HighGodName]的荣耀传播到北大西洋。"
 north_atlantic.0270.a:0 "愿[ROOT.Char.GetFaith.HighGodNameAlternate]帮助我实现目标。"
 north_atlantic.0271.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 north_atlantic.0271.desc:0 "诚然，像[GetTitleByKey('d_iceland').GetNameNoTier]这样偏远的土地也能因教会的存在而受到祝福。虽然花了很多年，但通过我们的努力，我相信这座小岛正在成为[ROOT.Char.GetFaith.GetReligion.GetAdjective]社区的一员。\n\n据我所知，这里的许多人都认为[aldabert.GetTitledFirstNamePossessive]对我的信任是实至名归的，我成功地履行了[GetTitleByKey('d_iceland').GetNameNoTierNoTooltip]第一任主教的职责。我们现在有了更多的学校和礼拜堂，随着岛上第一所学校的建立，我可以高枕无忧知道冰岛子孙后代将继续尊崇和赞美[ROOT.Char.GetFaith.HighGodName]，并尽其所能地了解[ROOT.Char.GetFaith.HighGodHerHis|U]创造的世界。"
 north_atlantic.0271.a:0 "赞美[ROOT.Char.GetFaith.HighGodName]！"
 north_atlantic.0272.t:0 "苏格兰的匈牙利人"
 north_atlantic.0272.desc:0 "我的赞助人[aetheling.GetFullName]，虽生于[GetGeographicalRegion('custom_hungary').GetName]，却并非[hungarian.GetName]的后裔。[aetheling.GetSheHe]乃是[GetTitleByKey('k_england').GetNameNoTier]的合法君主，在今年早些时候，继[edward.GetTitledFirstNameNicknamed]驾崩之后，被推举为王。\n\n可是，在这不列颠群岛之上，混乱却成了主宰。那些自封的国王们，企图用武力夺取本应属于[aetheling.GetFirstNamePossessiveNoTooltip]的王位。我陪伴着[aetheling.GetHerHim]以及[aetheling.GetHerHis]的姐姐[margaret.GetFirstName]，前往邻近的[GetTitleByKey('k_scotland').GetNameNoTier]，然而在眼下这政治风云变幻之际，我或许需要在别处另谋高就。尽管如此，我必须承认，我发现[scots.GetCollectiveNoun]颇为迷人，我能想象自己在[GetTitleByKey('k_scotland').GetNameNoTierNoTooltip]安家落户……但话又说回来，或许我该踏上旅程，去往他处寻找新的机遇。"
 north_atlantic.0272.a:0 "[scots.GetName]人很好，我会在这里住一段时间。"
 north_atlantic.0273.t:0 "苏格兰神秘学家"
 north_atlantic.0273.desc:0 "我年纪轻轻就从不列颠学校里学到了很多东西，但我抱负远大，我的数学知识、各种语言天赋，尤其天文学知识，会让我走得更远，因为我想更好地了解[ROOT.Char.GetFaith.HighGodName]创造的世界。\n\n天空之间星辰点点，每颗皆是一团火，我对这些星星了如指掌，从星象得知，我应该远走他乡，去了解这个世界的。也许有一天，我还能成为世界上最伟大的占星家。\n\n#weak “每一位占星家都值得赞美和尊敬，因为通过占星术，他知道许多[ROOT.Char.GetFaith.HighGodName]的秘密，以及很少有人知道的事情。”#!"
 north_atlantic.0273.a:0 "是时候完成我的使命了！"
