 game_concept_greenland_colony:1 "格陵兰定居点"
 game_concept_RICE_greenland_struggle:1 "格陵兰探索"
 game_concept_RICE_greenland_struggle_desc:2 "$game_concept_RICE_greenland_struggle$是一个影响[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]的[struggle|E]。它描绘了诺斯人在[greenland|E]定居点的历史，尽管它是一个遥远的边疆地区，但它一度是北大西洋经济的重要组成部分。\n\n在约980年后的开始日期，该[struggle|E]就已经存在。如果在较早的起始日期，一旦有[ruler|E]采用了$RICE_north_atlantic_explore_greenland$[decision|E]，就会触发[struggle|E]。\n\n在$game_concept_colonizing_greenland$中，[struggle_involved|E][rulers|E]可以获得一系列特殊的[decisions|E]和机制，例如在[nordsetur|E]狩猎海象或向西部海域派遣[greenland_expeditions|E]队。这些机制很多都与@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]有关系，这两个主要数值需要保持高位，以保证[greenland|E]繁荣，特别是通过[greenland_supporting|E][greenland|E]来达成。\n\n有四种方式可以结束这场[struggle|E]，其中三种是通过[decisions|E]结束：有两个#P 好#!结局，分别是$RICE_greenland_struggle_ending_integration_decision$和$RICE_greenland_struggle_ending_indigenous_decision$，以及一个#N 坏#!结局，即$RICE_greenland_struggle_ending_abandonment_decision$。此外还有第四种结局，即殖民地随着时间自然衰落，这种情况会逐渐发生。如果@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的数值较低，那么在游戏后期会触发几个历史事件。"
 game_concept_greenlands:0 "格陵兰"
 game_concept_greenland:0 "格陵兰"
 game_concept_greenland_desc:0 "格陵兰是北大西洋的一座大岛。它是[RICE_greenland_struggle|E]的主要焦点，这是一场影响[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]的[struggle|E]。\n\n尽管它是一个遥远的、边缘的前沿地区，格陵兰却是北大西洋经济的重要组成部分，因为它出口了各种奢侈品，如独角鲸的獠牙、北极熊的皮毛，还有那#italic 重中之重#!的海象牙。"
 game_concept_nordseturs:0 "诺塞图尔"
 game_concept_nordsetur:0 "诺塞图尔"
 game_concept_nordsetur_desc:0 "诺塞图尔是[greenland|E]北部的一个地区，可能相当于今天的迪斯科湾，那里生活着大量的海象。在中世纪的大部分时间里，[greenland|E]向欧洲出口了大量的海象牙，海象捕猎是[greenland_colony|E]生活和社会的重要组成部分。\n\n如果[RICE_greenland_struggle|E]仍在进行中，或者以好结局结束，那么拥有[greenland_estate_long|E]的[houses|E]的[rulers|E]，可以采用$RICE_north_atlantic_hunting_trip$[decision|E]。如果你运气好，这是赚取大量[gold|E]的好办法。"
 game_concept_vinlands:0 "文兰"
 game_concept_vinland:0 "文兰"
 game_concept_vinland_desc:0 "文兰是诺斯人对[greenland|E]以西、[markland|E]和[helluland|E]以南地区的称呼，可能相当于今天的纽芬兰岛和圣劳伦斯湾，也可能南至美国的缅因州。只有当一名[RICE_greenland_struggle|E]中的[struggle_involved|E][ruler|E]采用了$RICE_north_atlantic_explore_vinland$[decision|E]，就可以和它进行互动。\n\n由于地处偏远，缺乏的资源（与[greenland|E]不同），如果[RICE_greenland_struggle|E]没有以一个好的结局解决，殖民文兰是非常困难的。向文兰派遣[greenland_expeditions|E]队的成本也很高。\n\n文兰的@RICE_vinland_viability_icon![vinland_viability|E]与全球息息相关，会影响建立[vinland_outpost_long|E]的成功几率。\n\n如果[RICE_greenland_struggle|E]有一个好的结局，那么[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]的[rulers|E]将可以获得建立一个永久[vinland_colony_long|E]的[decision|E]。"
 game_concept_marklands:0 "马克兰"
 game_concept_markland:0 "马克兰"
 game_concept_markland_desc:0 "马克兰是诺斯人对[greenland|E]以西、[helluland|E]以南地区的称呼，可能相当于今天加拿大的拉布拉多省。只有当一名[RICE_greenland_struggle|E]中的[struggle_involved|E][ruler|E]采用了$RICE_north_atlantic_explore_vinland$[decision|E]，才能与马克兰产生互动。\n\n与马克兰互动的主要方式是通过[greenland_expeditions|E]。相比于前往[helluland|E]或[vinland|E]，派遣[greenland_expeditions|E]队前往马克兰的优势在于，你更有可能触发[expedition_episodes_long|E]，从而提高[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]。\n\n历史上，马克兰以其众多的森林而闻名，格陵兰人可能早在14世纪就已经在那里航行，采伐木材，一些后来的格陵兰探险队也会来此地收集木材。在诺斯地区以外的中世纪文献，唯一已知的关于马克兰的文献记录出现在十四世纪上半叶由米兰修士加尔瓦纽斯·弗拉玛撰写的编年史中。这是1492年哥伦布航行到美洲以前唯一已知的有关新大陆的记录。"
 game_concept_hellulands:0 "赫鲁兰"
 game_concept_helluland:0 "赫鲁兰"
 game_concept_helluland_desc:0 "赫鲁兰是诺斯人对[greenland|E]以西地区的称呼，可能是相当于今天加拿大的巴芬岛。只有当一名[RICE_greenland_struggle|E]中的[struggle_involved|E][ruler|E]采用了$RICE_north_atlantic_explore_vinland$[decision|E]，才能与赫鲁兰产生互动。\n\n与赫鲁兰互动的主要方式是通过[greenland_expeditions|E]。相比于前往[markland|E]或[vinland|E]，派遣[greenland_expeditions|E]队前往赫鲁兰的优势在于，你更有可能触发[expedition_episodes_long|E]，在那里遇到当地原住民，并扩大[greenlands|E]@RICE_greenland_networks_icon![greenland_networks|E]。\n\n历史上，赫鲁兰可能是诺斯人与当地多塞特人和后来的因纽特人之间偶尔接触的地点。"
 game_concept_greenland_resilience_i:0 "@RICE_greenland_resilience_icon!"
 game_concept_greenland_resilience:0 "适应力"
 game_concept_greenland_full_resilience:0 "格陵兰适应力"
 game_concept_greenland_full_resilience_desc:0 "适应力是一个全局变量，反映了[greenland_settlements|E]适应可能影响其生存和发展的任何变化的能力。它是与[greenland|E]相关的两个全局变量之一，另一个是@RICE_greenland_networks_icon![greenland_networks|E]。\n\n对于那些[RICE_greenland_struggle|E]的[struggle_involved|E]，更高的适应力对一些机制和[decisions|E]有积极的影响。特别是，适应力越高，你每年从[greenland_estate_long|E]获得的[gold|E]和[piety|E]就越多。此外，适应力和[greenland_networks|E]必须达到一个较高的水平，才能获得[RICE_greenland_struggle|E]的好结局。\n\n适应力每年会根据[RICE_greenland_struggle|E]所处的[struggle_phase|E]而随机增加或减少。它也会受到各种[decisions|E]的影响，最重要的是[greenland_supporting|E][greenland|E]。适应力能达到的最大值是#Bold 1000#!。\n\n一旦适应力低于100，[greenland_settlements|E]就有很小的几率自然衰落。"
 game_concept_greenland_networks_i:0 "@RICE_greenland_networks_icon!"
 game_concept_greenland_networks:0 "贸易网络"
 game_concept_greenland_full_networks:0 "格陵兰贸易网络"
 game_concept_greenland_full_networks_desc:0 "贸易网络是一个全局变量，反映了[greenland_settlements|E]与其他地区和群体的联系，包括欧洲人和当地土著人。这些联系可以包括政治、经济和文化方面的纽带。它是与[greenland|E]相关的两个全局变量之一，另一个是@RICE_greenland_resilience_icon![greenland_resilience|E]。\n\n对于那些[RICE_greenland_struggle|E]的[struggle_involved|E]，更发达的贸易网络有利于提高一些机制和[decisions|E]的效果。特别是，贸易网络越发达，你每年从[greenland_estate_long|E]获得的[gold|E]和[prestige|E]就越多。此外，贸易网络和[greenland_resilience|E]必须达到一个较高的水平，才能获得[RICE_greenland_struggle|E]的好结局。\n\n贸易网络每年会根据[RICE_greenland_struggle|E]所处的[struggle_phase|E]而随机增加或减少。它也会受到各种[decisions|E]的影响，最重要的是[greenland_supporting|E][greenland|E]。贸易网络能达到的最大值是#Bold 1000#!。\n\n如果贸易网络的数值在[struggle_phase_greenland_subsistence_simple|E]和[struggle_phase_greenland_marginalization_simple|E]这两个[struggle_phase_phases|E]中低于一定程度，一些[decisions|E]将会更加昂贵，甚至无法实施。"
 game_concept_vinland_viability_i:0 "@RICE_vinland_viability_icon!"
 game_concept_vinland_viability:0 "生存力"
 game_concept_vinland_full_viability:0 "文兰生存力"
 game_concept_vinland_full_viability_desc:0 "生存力是一个全局变量，表示参与[RICE_greenland_struggle|E]的人前往[vinland|E]定居的吸引力。尽管它在现代互联网上声名显赫，但北欧人并没有长期留在[vinland|E]，因为它太遥远了，而且会浪费资源，不如用在[greenland|E]。因此如何提高[vinlands|E]@RICE_vinland_viability_icon!盈利是关键。\n\n在[RICE_greenland_struggle|E]进行期间，提高[vinlands|E]生存力的主要方式是通过两个[decisions|E]：要么派遣[greenland_expeditions|E]前往[vinland|E]，要么如果你的[dynasty|E]通过[greenland_supporting|E][vinland|E]拥有一个[vinland_outpost|E]。如果[RICE_greenland_struggle|E]以一个好结局结束，那么生存力将每年随机增加一些小数值，直到达到#V 50#!（如果还没有超过这个数值的话）。"
 game_concept_struggle_phase_greenland_settlement_simple:1 "聚居地"
 game_concept_struggle_phase_greenland_settlement:1 "定居阶段"
 game_concept_struggle_phase_greenland_settlement_desc:1 "$struggle_RICE_greenland_phase_settlement_desc$"
 game_concept_struggle_phase_greenland_integration_simple:1 "整合"
 game_concept_struggle_phase_greenland_integration:1 "整合阶段"
 game_concept_struggle_phase_greenland_integration_desc:1 "$struggle_RICE_greenland_phase_integration_desc$"
 game_concept_struggle_phase_greenland_subsistence_simple:1 "勉强生存"
 game_concept_struggle_phase_greenland_subsistence:1 "求生阶段"
 game_concept_struggle_phase_greenland_subsistence_desc:1 "$struggle_RICE_greenland_phase_subsistence_desc$"
 game_concept_struggle_phase_greenland_marginalization_simple:1 "边缘化"
 game_concept_struggle_phase_greenland_marginalization:1 "边缘阶段"
 game_concept_struggle_phase_greenland_marginalization_desc:1 "$struggle_RICE_greenland_phase_marginalization_desc$"
 game_concept_greenland_expedition_s:1 "探险队"
 game_concept_greenland_expeditions:1 "探险队"
 game_concept_greenland_expedition:1 "远征"
 game_concept_greenland_expedition_desc:1 "如果[RICE_greenland_struggle|E]的斗争仍在进行或以好结局结束，拥有[greenland_estate_long|E]的[houses|E]的[rulers|E]，则可以采用$RICE_north_atlantic_explore_americas$[decision|E]。\n\n在探险开始之前，你需要选择一个[greenland_expedition_leader|E]。探险事件链本身分为三种[expedition_episodes|E]，可以有#Bold #P 积极#!#!、#Bold 一般#!或#Bold #N 较差#!#!的结果，有时受到你的[greenland_leader_s|E]的[skills|E]的影响。这些结果反过来又对探险起#P 积极#!或#N 消极#!作用。\n\n你可以派探险队去三个地区：[markland|E]、[helluland|E]和[vinland|E]。它们都以不同的方式对[greenland_colony|E]起有利作用（或者对[vinland|E]起消极作用）。"
 game_concept_greenland_great_expedition_s:1 "大远征"
 game_concept_greenland_great_expeditions:1 "大远征"
 game_concept_greenland_great_expedition:1 "大远征"
 game_concept_greenland_great_expedition_desc:1 "与普通的[greenland_expeditions|E]不同，$game_concept_greenland_great_expeditions$是重大探索之旅，对应重要的历史事件，如“红发”埃里克发现[greenland|E]，或莱夫·埃里克松对[helluland|E]、[markland|E]和[vinland|E]的远航，只有一次机会。"
 game_concept_greenland_lead:1 "领袖"
 game_concept_greenland_leader_s:1 "领袖"
 game_concept_greenland_leaders:1 "领袖"
 game_concept_greenland_leader:1 "领袖"
 game_concept_greenland_expedition_leader_s:1 "大远征领袖"
 game_concept_greenland_expedition_leaders:1 "大远征领袖"
 game_concept_greenland_expedition_leader:1 "大远征领袖"
 game_concept_greenland_expedition_leader_desc:1 "每次[greenland_expedition|E]都需要一个领袖，如果没有从你的[courtiers|E]中选出一个，或者你的[courtiers|E]都不愿意，游戏会在[greenland_expedition|E]开始时为你生成一个领袖。\n\n领袖的选择很重要，因为他们的技能可以影响到这次[expedition_episodes|E]的结果。因为你永远不知道在[greenland_expeditions|E]中会遇到什么，所以建议你选择精通各种行业的领袖。"
 game_concept_expedition_episode_long:1 "远征途中的事件"
 game_concept_expedition_episodes_long:1 "远征事件"
 game_concept_expedition_episode_s:1 "事件"
 game_concept_expedition_episode:1 "事件"
 game_concept_expedition_episodes:1 "事件"
 game_concept_expedition_episode_long_desc:1 "每个[greenland_expedition|E]都分为三种“事件”，可以有#Bold #P 积极#!#!、#Bold 一般#!或#Bold #N 较差#!#!的结果。有时，这些结果会受到[greenland_expedition_leader_s|E][skills|E]的影响。无论如何这些结果决定了一个[greenland_expedition|E]是成功还是失败。"
 game_concept_greenland_estate_s:1 "庄园"
 game_concept_greenland_estates:1 "庄园"
 game_concept_greenland_estate:1 "庄园"
 game_concept_greenland_estates_long:1 "格陵兰庄园"
 game_concept_greenland_estate_long:1 "格陵兰庄园"
 game_concept_greenland_estate_long_desc:1 "如果[RICE_greenland_struggle|E]的斗争仍在进行或者以好结局解决，[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的[rulers|E]可以采用$RICE_north_atlantic_family_estate_greenland$[decision|E]。这为你的[house|E]增加了[GetModifier('RICE_north_atlantic_greenland_family_estate').GetNameWithTooltip][modifier|E]，更重要的是会解锁许多与[greenland|E]有关的[decisions|E]和机制。\n\n当这个[modifier|E]处于激活状态时，[house|E]的每个成员每年都会获得少量的[gold|E]、[prestige|E]和[piety|E]，也有可能失去这些资源，不过这种情况不会太常见，除非[greenland_colony|E]处于[struggle_phase_greenland_subsistence_simple|E]和[struggle_phase_greenland_marginalization|E]，和/或[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]或@RICE_greenland_networks_icon![greenland_networks|E]两个指标处于低位"
 game_concept_greenland_supporting:1 "支援"
 game_concept_greenland_supported:1 "支援"
 game_concept_greenland_support:1 "支援"
 game_concept_greenland_support_long:1 "支援格陵兰"
 game_concept_greenland_support_long_desc:1 "为了[RICE_greenland_struggle|E]的成功，在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]的[struggle_involved|E][rulers|E]可以采用$RICE_north_atlantic_support_greenland$[decision|E]。从诸多选项中选择几种选择支援[greenland|E]建设，从建造建筑到招募定居者前往。每种支援方式都有不同的收益，但都会提高[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]或@RICE_greenland_networks_icon![greenland_networks|E]。\n\n还有一个与$RICE_north_atlantic_support_vinland$不同的[decision|E]，它反而改善了[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]。"
 game_concept_vinland_outpost:1 "前哨站"
 game_concept_vinland_outposts:1 "前哨站"
 game_concept_vinland_outpost_long:1 "文兰前哨站"
 game_concept_vinland_outposts_long:1 "文兰前哨站"
 game_concept_vinland_colony:1 "定居点"
 game_concept_vinland_colonize:1 "定居"
 game_concept_vinland_colony_long:1 "文兰定居点"
 game_concept_vinland_colony_long_desc:1 "永久定居[vinland|E]并非易事。这甚至会损害[greenlands|E]的长期可持续性，而且可能会非常昂贵，为那些胆敢尝试的[rulers|E]带来很少的好处——如果有的话。毕竟，从历史上看，诺斯人在[vinland|E]的存在是相当短暂的。\n\n如果你一心想要定居[vinland|E]，那么你必须分几个阶段进行。首先，你的[dynasty|E]需要采用$RICE_north_atlantic_build_outpost_vinland$[decision|E]，这将使你的[dynasty|E]获得[GetModifier('RICE_north_atlantic_vinland_outpost').GetNameWithTooltip][modifier|E]。然而，这有可能会失败，这取决于[vinlands|E]的@RICE_vinland_viability_icon! [vinland_viability|E]。即使成功了（也是基于[vinlands|E]@RICE_vinland_viability_icon! [vinland_viability|E]），每年也会有几率导致你#italic 所有#!在[vinland|E]的前哨站遭到重创！\n\n为了防止这种失败，你需要采用$RICE_north_atlantic_settle_vinland$[decision|E]，这只能由一个[dynasty|E]来完成。然而，这个[decision|E]只有在[RICE_greenland_struggle|E]已经解决并取得好结局的情况下才可用。\n\n归根结底，定居[vinland|E]是一项风险投资，可能会耗费你大量的时间和资源。最好先关注[greenland|E]，然后在[struggle|E]解决后再考虑[vinland|E]。"
 innovation_RICE_dog_sleds:0 "狗拉雪橇"
 innovation_RICE_dog_sleds_desc:0 "在遥远的北方，某些狗已经被培育和训练成可以拉着雪橇在雪地甚至冰上行走。事实证明，这些雪橇在旅行、拖运物资和远距离狩猎方面非常有效。"
 innovation_RICE_arctic_boats:0 "北极之舟"
 innovation_RICE_arctic_boats_desc:0 "在北冰洋的寒冷地区，有两种被称为#italic 皮艇#!和#italic 乌米亚克船#!的船只被用来运送人员和协助猎杀海洋动物，特别是庞大又可怕的鲸鱼。"
 innovation_RICE_toggling_harpoons:0 "拨动鱼叉"
 innovation_RICE_toggling_harpoons_desc:0 "活动式鱼叉是对传统鱼叉的创新，常用于海上捕猎。与普通鱼叉不同，活动式鱼叉有两个尖端。一个尖端固定在握柄上，另一个尖端像帽子一样套在第一个尖端上，可以拆卸。这样一来活动式鱼叉就能更有效地刺入动物体内。"
 RICE_north_atlantic_appoint_expedition_leader:0 "任命远征队领袖"
 RICE_north_atlantic_appoint_expedition_leader_desc:0 "任命[recipient.GetShortUINameNoTooltip]成为即将向西方进行的[greenland_expedition|E]的[greenland_leader|E]。"
 RICE_north_atlantic_appoint_expedition_leader_extra_icon:0 "$hook_extra_icon$"
 RICE_north_atlantic_appoint_expedition_leader.recipient.notification.t:0 "被选为远征队领袖"
 RICE_north_atlantic_appoint_expedition_leader.recipient.notification.tt:0 "将在XXX之后离开"
 RICE_pay_to_lead_expedition:0 "提出以金钱贿赂，让他们接受"
 RICE_appoint_expedition_leader_brave_acceptance:0 "[recipient.GetSheHe|U]有勇敢特质：$VALUE|=+0$"
 RICE_appoint_expedition_leader_craven_acceptance:0 "[recipient.GetSheHe|U]有怯懦特质：$VALUE|=+0$"
 RICE_appoint_expedition_leader_ambitious_acceptance:0 "[recipient.GetSheHe|U]有野心勃勃特质：$VALUE|=+0$"
 RICE_appoint_expedition_leader_lazy_acceptance:0 "[recipient.GetSheHe|U]有懒惰特质：$VALUE|=+0$"
 RICE_paid_me_extra_to_accept:0 "额外支付让其接受此请求：$VALUE|=+0$"
 RICE_north_atlantic_appoint_expedition_leader_accept_desc:0 "[recipient.GetTitledFirstName]成为[greenland_expedition|E]的[greenland_leader|E]"
 trait_RICE_explorer:0 "探险者"
 trait_RICE_explorer_desc:0 "该角色已走遍天下，探索新世界，寻找新文明，并勇于前往无人曾至之地，因此赢得了生前身后名。"
 trait_RICE_explorer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]已走遍天下，探索新世界，寻找新文明，并勇于前往无人曾至之地，因此赢得了生前身后名。"
 trait_RICE_exploring_western_seas:0 "西部海域探险"
 trait_RICE_exploring_western_seas_desc:0 "该角色目前正在西部海域进行冒险。"
 trait_RICE_exploring_western_seas_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]目前正在西部海域进行冒险。"
 RICE_north_atlantic_greenland_family_estate:0 "格陵兰岛的家族地产"
 RICE_north_atlantic_greenland_family_estate_desc:0 "[house|E]正在参与[RICE_greenland_struggle|E]，需要在那里维持一个[greenland_estate|E]。\n\n#italic 这个[house|E][rulers|E]可以获得与[RICE_greenland_struggle]有关的各种[decisions|E]和机制。他们每年还获得（或偶尔失去）不同程度的[gold_i|E][gold|E]、[prestige_i|E][prestige|E]和[piety_i|E][piety|E]，这取决于[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]数值，以及潜在的其他因素。#!"
 RICE_greenland_integration_cultural:0 "北大西洋文化融合"
 RICE_greenland_integration_cultural_desc:0 "在[greenland_settlements|E]建造成功之后，北大西洋的各民族现在紧密地联系在一起。不管他们的文化和宗教差异如何，从欧洲挪威一直到美洲豪德诺萨尼族，各民族之间都在进行思想交流，并经常进行合作。"
 RICE_greenland_integration_economic:0 "北大西洋经济一体化"
 RICE_greenland_integration_economic_desc:0 "在[greenland_settlements|E]成功建造之后，北大西洋的海上贸易路线已经成为延伸到欧亚大陆、非洲甚至遥远的东方，是日益全球化商业的重要组成部分。海象牙、海狸毛皮、鲸鱼油等贵重产品为北部海域带来了财富和繁荣。"
 RICE_greenland_integration_community:0 "北大西洋共同体"
 RICE_greenland_integration_community_desc:0 "继[greenland_settlements|E]的成功建造之后，北大西洋的定居点已经发展壮大，像星星之火一样散布在广阔的北方海域。无论其起源如何，这些社区成功地保留了大量关于如何在北方寒冷土地上最佳生存的知识，并将世代繁荣。"
 RICE_north_atlantic_walrus_carving_workshop_inside_region:0 "北欧海象牙雕刻中心"
 RICE_north_atlantic_walrus_carving_workshop_inside_region_desc:0 "格陵兰供应的海象牙有很大一部分是沿着北海的海上商路运到这个地区的。在这里熟练的工匠们雕刻出美丽的艺术品，沿着欧亚贸易路线出口，因此该地区被认为是欧洲制造象牙雕刻的主要转口港。\n\n#italic 如果[RICE_greenland_struggle|E]达到[struggle_phase_greenland_marginalization|E]或定居计划以失败告终，这个[modifier|E]将被自动删除。#!"
 RICE_north_atlantic_walrus_carving_workshop_outside_region:0 "欧洲海象牙雕刻中心"
 RICE_north_atlantic_walrus_carving_workshop_outside_region_desc:0 "格陵兰供应的海象牙有很大一部分被运到欧洲的这个地区。在这里熟练的工匠们雕刻出美丽的艺术品，沿着欧亚贸易路线出口，因此这个地区被认为是欧洲制造象牙雕刻的主要转口港。\n\n#italic 如果[RICE_greenland_struggle|E]达到[struggle_phase_greenland_marginalization|E]或定居计划以失败告终，这个[modifier|E]将被自动删除。#!"
 RICE_north_atlantic_built_hunting_stations:0 "资助建造一个在格陵兰岛的狩猎站"
 RICE_north_atlantic_built_hunting_stations_desc:0 "$EFFECT_LIST_BULLET$每年从[greenland_estates_long|E]获得额外的[prestige_i|E]。\n$EFFECT_LIST_BULLET$到[nordsetur|E]狩猎成功的概率增加。"
 RICE_north_atlantic_built_shielings:0 "资助建造一个在格陵兰的牧场"
 RICE_north_atlantic_built_shielings_desc:0 "$EFFECT_LIST_BULLET$每年从[greenland_estates_long|E]获得额外的[gold_i|E]\n$EFFECT_LIST_BULLET$从[greenland_expeditions|E]成功概率增加"
 RICE_north_atlantic_built_temples:0 "资助建造一个在格陵兰岛的礼拜堂"
 RICE_north_atlantic_built_temples_desc:0 "$EFFECT_LIST_BULLET$每年从[greenland_estates_long|E]获得额外的[piety_i|E]\n$EFFECT_LIST_BULLET$派遣[close_family|E]或[courtier|E]到[greenland|E]定居的奖励会增加"
 RICE_greenland_indigenous_social:0 "印第安演说家"
 RICE_greenland_indigenous_social_desc:0 "一旦美洲原住民在这个地区建立了永久的定居点，他们将会在当地社会和文化的发展中发挥了重要作用，对这里的社区产生了深刻的影响。"
 RICE_greenland_indigenous_political:0 "印第安领主"
 RICE_greenland_indigenous_political_desc:0 "一旦美洲的原住民在这个地区建立了永久性的定居点，他们就证明了自己老练的政治嗅觉，并通过政治彻底控制这片地区。"
 RICE_greenland_indigenous_military:0 "印第安战士"
 RICE_greenland_indigenous_military_desc:0 "一旦美洲原住民在这一地区建立了永久性的定居点，他们会组建军队，无论是以正规军队的形式，还是以雇佣军的形式，他们都会以此拿来炫耀为荣。"
 RICE_north_atlantic_resettled_greenlanders:0 "重新安置的格陵兰人"
 RICE_north_atlantic_resettled_greenlanders_desc:0 "随着格陵兰定居点的完全崩溃，原定居点的人们已经分散到整个北大西洋各个角落，比如这个地区。"
 RICE_north_atlantic_inuit_alliance:0 "因纽特同盟"
 RICE_north_atlantic_inuit_alliance_desc:0 "该角色不仅与格陵兰岛的定居点有很深的关系，而且还与因纽特人（被一些维京人贬称为“斯克雷林人”）有很好的联系。事实上，该角色甚至与遥远的因纽特人部落建立联盟关系。"
 RICE_north_atlantic_immigration_from_greenland:0 "格陵兰移民"
 RICE_north_atlantic_immigration_from_greenland_desc:0 "格陵兰的定居点最近一直在衰退，所以这些定居点的前居民决定搬到这个地区，寻找更好的发展机会。"
 RICE_north_atlantic_vinland_settlement:0 "建立永久文兰定居点"
 RICE_north_atlantic_vinland_settlement_desc:0 "这个家族引领了人们在文兰建立永久定居点的道路。许多人对这样的定居点是否能持续下去表示怀疑，因为它的位置偏远，缺乏经济价值，但或许历史会证明这些反对者的猜测是错误的。"
 RICE_north_atlantic_vinland_outpost:0 "文兰前哨站"
 RICE_north_atlantic_vinland_outpost_desc:0 "这个家族在文兰建立了一个规模不大的前哨基地，他们打算把它作为探索这片茂盛土地的前方站。\n\n#italic #bold 每个#![vinland_outpost_long|E]的存在，会让[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]减少以下数值。\n$EFFECT_LIST_BULLET$在[struggle_phase_greenland_marginalization|E]减少#Bold #N 3#!#!（最多为10）\n$EFFECT_LIST_BULLET$在[struggle_phase_greenland_subsistence|E]#Bold #N 2#!#!(最多 8)\n$EFFECT_LIST_BULLET$在[struggle_phase_phases|E]的其他[RICE_greenland_struggle|E]中减少#Bold #N 1#!#!，或者如果已被解决（最多为5）#!"
 RICE_north_atlantic_papar_remnants:0 "帕帕尔遗迹"
 RICE_north_atlantic_papar_remnants_desc:0 "九世纪在这里定居的诺斯人声称遇到或发现#italic 帕帕尔#!的痕迹，他们是盖尔裔的基督教僧侣和隐士，居住在北大西洋岛屿的孤岛和岩石海岸。很难确认这些#italic 帕帕尔#!是否仍然存在或者只是传说和传闻。"
 RICE_north_atlantic_whale_exempt_from_tax_modifier:0 "捕鲸镇的免税政策"
 RICE_north_atlantic_whale_exempt_from_tax_modifier_desc:0 "这个地区的捕鲸镇被免于缴税，并被授予其他特权。看来当地统治者希望支持这里的捕鲸业。"
 RICE_north_atlantic_whale_levy_extra_tax_modifier:0 "对捕鲸镇征收更多税款"
 RICE_north_atlantic_whale_levy_extra_tax_modifier_desc:0 "这个地区的捕鲸镇不得不承受对他们征收的额外税款。看来当地的领主想从这里有利可图的捕鲸业中获利。"
 RICE_north_atlantic_whale_tax_exempter:0 "免除捕鲸镇的税款"
 RICE_north_atlantic_whale_tax_exempter_desc:0 "这位领主对其境内的捕鲸镇给予免税和各种其他特权，以支持其境内的捕鲸业。"
 RICE_north_atlantic_whale_tax_levier:0 "对捕鲸镇征收更多税款"
 RICE_north_atlantic_whale_tax_levier_desc:0 "这位领主对其领土上的捕鲸镇征收额外的税收，以便从其领域内有利可图的捕鲸业中获利。"
 RICE_north_atlantic_nordsetur_trade_connections:0 "与诺塞图尔的当地人建立贸易联系"
 RICE_north_atlantic_discoverer_of_greenland:0 "格陵兰的发现者"
 RICE_north_atlantic_discoverer_of_greenland_desc:0 "该角色率领了一次大探险，向冰岛西部的海域进发，发现了一块新的土地，将其命名为格陵兰。他们完成了这样一项光荣的壮举，为自己赢得了历史的一席之地。"
 RICE_north_atlantic_discoverer_of_americas:0 "赫鲁兰、马克兰以及文兰的发现者"
 RICE_north_atlantic_discoverer_of_americas_desc:0 "该角色率领了一次大探险，向格陵兰西部的海域进发，发现了三块新的土地，他们将其命名为赫鲁兰、马克兰和文兰。他们完成了这样一项光荣的壮举，为自己赢得了历史的一席之地。"
 RICE_north_atlantic_auk_meat:0 "食用鸟肉"
 RICE_north_atlantic_auk_eggs:0 "食用鸟蛋"
 RICE_north_atlantic_broch_encounter:0 "遇到了一座苏格兰石塔"
 RICE_north_atlantic_inspired_by_gaelic_monks:0 "受盖尔修士启发"
 RICE_north_atlantic_inspired_by_gaelic_monks_desc:0 "不知该角色的个人宗教信仰或信念是什么，但最近听到了关于盖尔修士们前往遥远的岛屿进行冥想和和平祈祷的故事，为僧侣们的热心奉献精神感到振奋。"
 RICE_north_atlantic_inspired_by_monks_voyages:0 "受盖尔修士的远游启发"
 RICE_north_atlantic_inspired_by_monks_voyages_desc:0 "不知该角色的个人宗教信仰或信念是什么，但最近听到了关于盖尔修士们前往西方神话之地的传奇故事，为僧侣们的热心奉献精神感到振奋。"
 RICE_north_atlantic_iceland_moss:0 "冰岛海苔"
 RICE_north_atlantic_puffin_meat:0 "用美味的海雀肉款待"
 RICE_north_atlantic_puffin_meat_desc:0 "该角色的厨师非常擅长为盛宴和聚会准备海雀肉。"
 RICE_north_atlantic_dairy_inhospitality:0 "乳业冷漠"
 RICE_north_atlantic_dairy_inhospitality_desc:0 "在北欧冰岛，为客人提供乳制品食物被认为是一种侮辱，尤其是没有其他配菜的时候。该角色有一个非常不好的习惯，就是经常这样做。"
 RICE_north_atlantic_tasty_skyr_yogurt:0 "喜欢斯哥特酸奶"
 RICE_north_atlantic_expedition_native_contacts:0 "与美洲原住民接触"
 RICE_north_atlantic_expedition_native_contacts_desc:0 "该角色最近赞助了一支前往美洲的探险队。探险队与当地原住民进行了几次积极的接触，该角色现在与他们有着脆弱的联系。"
 RICE_north_atlantic_expedition_native_legends:0 "关于美洲原住民的传说"
 RICE_north_atlantic_expedition_native_legends_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队与当地原住民有一些接触，并了解了他们当地的一些物产以及文化，探险队队员们讲述当地的故事和传说让该角色着迷。"
 RICE_north_atlantic_expedition_native_info:0 "关于美洲原住民的具体信息"
 RICE_north_atlantic_expedition_native_info_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队与当地原住民有广泛接触，并近乎了解他们当地所有的物产以及文化。回程后向该角色转达了关于这些民族的信息。这些信息可能包括这些人的政治、信仰或社会组织等细节，并向该角色提供更多细节，比如他们的武器和工具是如何设计的，他们吃什么食物，以及他们的长相。"
 RICE_north_atlantic_expedition_western_herbs:0 "来自美洲大陆的草药"
 RICE_north_atlantic_expedition_western_herbs_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队设法从该地区获得了一些奇特的草药，办法无非是通过当地人（通过和平贸易或强行获取）或是自己采集。"
 RICE_north_atlantic_expedition_glorious_battle_americas:0 "关于与美洲原住民战斗的故事"
 RICE_north_atlantic_expedition_glorious_battle_americas_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队与一些美洲原住民发生了火并，他们的胜利故事极大地鼓舞了该角色并使其着迷。"
 RICE_north_atlantic_expedition_vinland_grapes_small:0 "一些产自文兰的葡萄"
 RICE_north_atlantic_expedition_vinland_grapes_small_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队航行至文兰岛，在那里他们成功地找到并收获了一些当地特产的野生葡萄，并将其带回给该角色。"
 RICE_north_atlantic_expedition_vinland_grapes_large:0 "许多产自文兰的葡萄"
 RICE_north_atlantic_expedition_vinland_grapes_large_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队航行至文兰岛，在那里他们成功地找到并收获了大量当地特产的野生葡萄，并将其带回给该角色。"
 RICE_north_atlantic_expedition_seal_meat:0 "来自西大西洋的海豹肉"
 RICE_north_atlantic_expedition_seal_meat_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队在旅行过程中，成功地猎获了一些海豹，并将肉保存起来，风干之后送给了该角色。"
 RICE_north_atlantic_expedition_seal_blubber:0 "来自西大西洋的海豹脂肪"
 RICE_north_atlantic_expedition_seal_blubber_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队在旅行过程中，成功地猎取了一些海豹，并得到了一些海豹脂肪（这种脂肪可以用来制油），送给了该角色。"
 RICE_north_atlantic_expedition_americas_fauna_knowledge:0 "美洲的动物世界"
 RICE_north_atlantic_expedition_americas_fauna_knowledge_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队研究了一些动物（包括普通的以及从未见过的），并将他们收集的信息转述给该角色。"
 RICE_north_atlantic_expedition_americas_flora_knowledge:0 "美洲的植物世界"
 RICE_north_atlantic_expedition_americas_flora_knowledge_desc:0 "该角色最近赞助了一个前往美洲的探险队。探险队研究了一些植物（包括普通的以及从未见过的），并将他们收集的信息转述给该角色。"
 RICE_north_atlantic_native_american_artifact_name:0 "美洲原住民打造的饰品"
 RICE_north_atlantic_native_american_artifact_desc:0 "这是一个由生活在美洲大陆这块神话般的土地上的一些民族制作的物品。也许它是一种工具，或者是一件艺术品，或者有一些其他未知的用途。它是在某人前往冰岛以西地区的过程中获得的，无论是通过武力还是通过与这些民族的贸易。"
 RICE_north_atlantic_arctic_artifact_name:0 "北极圈原住民打造的饰品"
 RICE_north_atlantic_arctic_artifact_desc:0 "这是一个由生活在遥远的北极圈的一些民族制作的物品。也许它是一种工具，或者是一件艺术品，或者有一些其他未知的用途。它是在某人前往冰岛以西地区的过程中获得的，无论是通过武力还是通过与这些民族的贸易。"
 RICE_north_atlantic_polar_bear_pelt_name:0 "北极熊的皮毛"
 RICE_north_atlantic_polar_bear_pelt_desc:0 "这张北极熊的皮毛是在[greenland|E]的[nordsetur|E]猎获的。是一个来自遥远的神话和传说之地的奢华物品，一定会让人惊奇和高兴，就像它能提供舒适和温暖一样!"
 RICE_north_atlantic_narwhal_horn_name:0 "独角鲸之角"
 RICE_north_atlantic_narwhal_horn_desc:0 "这是在[greenland|E]的[nordsetur|E]被猎杀的独角鲸之角，有人认为这些生物正是民间传说中所说的海上独角兽。许多人认为这些角具有神奇的药用价值，因此它们在全世界范围内经常被高价收购。"
 RICE_north_atlantic_walrus_ivory_name:0 "雕刻的海象牙"
 RICE_north_atlantic_walrus_ivory_desc:0 "用在[greenland|E]的[nordsetur|E]猎获的海象的象牙制作的艺术品。这种艺术品通常不在格陵兰岛本身制作，而是在与格陵兰岛有贸易联系的北大西洋的各个城市制作。"
 RICE_greenland_struggle_ending_integration_decision:1 "区域融合"
 RICE_greenland_struggle_ending_integration_decision_desc:0 "北大西洋的人民曾经是小军阀和部落，长期被大片寒冷的海洋分割。现在他们团结起来，在文化、思想和贸易方面越来越多，[greenlands|E]定居点连接着欧亚大陆和美洲。遥远的北方的黄金时代才刚刚开始!"
 RICE_greenland_struggle_ending_integration_decision_tooltip:0 "将格陵兰岛和美洲大陆完全纳入北大西洋领域"
 RICE_greenland_struggle_ending_integration_decision_confirm:0 "结束$RICE_greenland_struggle$"
 RICE_greenland_struggle_integration_decision_correct_phase_tt:0 "目前[struggle_phase|E]是[struggle_phase_greenland_integration|E]"
 RICE_greenland_struggle_marginalization_decision_correct_phase_tt:0 "目前[struggle_phase|E]是[struggle_phase_greenland_marginalization|E]"
 RICE_greenland_struggle_ending_integration_decision_region_tt:0 "你控制了超过[SCOPE.ScriptValue('RICE_greenland_struggle_integration_owned_percent_value')|0]%的[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]（当前：[SCOPE.ScriptValue('RICE_greenland_struggle_region_owned_percent_value')|0]%）"
 RICE_greenland_struggle_ending_low_resource_mitigation_tt:0 "@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的负面影响大大降低"
 RICE_greenland_struggle_ending_culture_acceptance_tt:0 "$fp2_struggle_conciliation_culture_tt$"
 RICE_greenland_struggle_ending_native_american_courtiers_tt:0 "在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中，美洲原住民[courtier|E]的出现会更常见一些。"
 RICE_greenland_struggle_ending_vinland_tt:0 "安置[vinland|E]的成本和风险大大降低，如果[vinlands|E][vinland_viability|E]低于[vinland_viability_i|E]#V 50#!，它将每年随机增加，直到满。"
 RICE_greenland_struggle_ending_expedition_success_tt:0 "在向西部派遣[greenland_expeditions|E]时，减少了失败的几率"
 RICE_greenland_struggle_integration_ending_county_bonus_tt:1 "从以下三个修正中选择一个，适用于[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的每一个[county|E]，为其50年：\n$EFFECT_LIST_BULLET$[GetModifier('RICE_greenland_integration_cultural').GetNameWithTooltip|L]。在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中，美洲原住民[courtier|E]的出现也将常见，且更优秀。\n$EFFECT_LIST_BULLET$[GetModifier('RICE_greenland_integration_economic').GetNameWithTooltip|L]。在[greenland|E]有[greenland_estates|E]的情况下，每年[houses|E]收益会有轻微的提升。\n$EFFECT_LIST_BULLET$[GetModifier('RICE_greenland_integration_community').GetNameWithTooltip|L]。对$RICE_north_atlantic_hunting_trip$[decision|E]也会带来更好的奖励。"
 RICE_greenland_struggle_integration_acceptance_tt:0 "北大西洋区域融合"
 RICE_greenland_struggle_ending_integration_decision_resilience_tt_1:0 "[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]数值至少在#V [EmptyScope.ScriptValue('RICE_greenland_regional_integration_ending_value')|0]#!"
 RICE_greenland_struggle_ending_integration_decision_networks_tt_1:0 "[greenlands|E]@RICE_greenland_networks_icon![greenland_networks|E]数值至少在#V [EmptyScope.ScriptValue('RICE_greenland_regional_integration_ending_value')|0]#!"
 RICE_greenland_struggle_ending_indigenous_decision:1 "原住民主权"
 RICE_greenland_struggle_ending_indigenous_decision_desc:0 "我们被欧洲人民蔑视为神秘的、野蛮的“斯克雷林人”，然而我们有自己伟大的历史、文化和生活方式。作为这片远方海洋和陆地的主人，现在是对北大西洋的沿岸宣示我们的主权的时候了！"
 RICE_greenland_struggle_ending_indigenous_decision_tooltip:0 "重申我们在北大西洋的存在"
 RICE_greenland_struggle_ending_indigenous_decision_confirm:0 "$RICE_greenland_struggle_ending_integration_decision_confirm$"
 RICE_greenland_struggle_ending_native_american_courtiers_more_tt:0 "在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中，美洲原住民[courtier|E]的出现将更为普遍。"
 RICE_greenland_struggle_ending_native_american_maa_tt:0 "所有美洲原住民[cultures|E][heritage|E]都可以解锁“西部勇者”[men_at_arms|E]"
 RICE_greenland_struggle_indigenous_ending_county_bonus_tt:0 "从以下三个修正中选择一个，适用于[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的每个[county|E]，为期50年：\n$EFFECT_LIST_BULLET$[GetModifier('RICE_greenland_indigenous_social').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('RICE_greenland_indigenous_political').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('RICE_greenland_indigenous_military').GetNameWithTooltip|L]"
 RICE_greenland_struggle_ending_indigenous_decision_region_tt:0 "你控制了超过[SCOPE.ScriptValue('RICE_greenland_struggle_indigenous_owned_percent_value')|0]%的[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]（当前：[SCOPE.ScriptValue('RICE_greenland_struggle_region_owned_percent_value')|0]%）"
 RICE_greenland_struggle_ending_abandonment_decision:1 "放弃格陵兰岛"
 RICE_greenland_struggle_ending_abandonment_decision_desc:0 "随着[greenlands|E]海象贸易的衰退，以及恶劣的气候条件，格陵兰定居点的居民正在成群结队地迁回欧洲。作为一个在北大西洋有很大影响力的[ROOT.Char.GetTitleAsNameNoTooltip]，我可以加快这一进程，减少我们的损失。"
 RICE_greenland_struggle_ending_abandonment_decision_tooltip:0 "让格陵兰听天由命吧，遗弃格陵兰的定居点！"
 RICE_greenland_struggle_ending_abandonment_decision_confirm:0 "$RICE_greenland_struggle_ending_integration_decision_confirm$"
 RICE_greenland_struggle_ending_no_more_mechanics_tt:0 "将失去与[RICE_greenland_struggle|E]有关的各种[decisions|E]，如向西[greenland_expeditions|E]和[greenland_support|E][greenland|E]"
 RICE_greenland_struggle_ending_no_more_estate_bonus_tt:0 "所有拥有[GetModifier('RICE_north_atlantic_greenland_family_estate').GetNameWithTooltip][modifier|E]的[houses|E]将失去这些修正，这些[houses|E][rulers|E]将不再从他们[greenland_estates_long|E]中获得收益，不过他们将根据他们的[rank|E]和[prestige_level|E]获得一些[gold_i|E][gold|E]作为补偿；特别是采取这种[decision|E]的[ruler|E]将获得更多[gold|E]"
 RICE_greenland_struggle_ending_native_american_courtiers_none_tt:0 "美洲原住民将不会在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]担任宫廷里的[courtier|E]"
 RICE_greenland_struggle_abandonment_ending_county_bonus_tt:0 "[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的每个[county|E]都将获得[GetModifier('RICE_north_atlantic_resettled_greenlanders').GetNameWithTooltip][county_modifier|E]，持续#V 20年#!"
 RICE_north_atlantic_explore_greenland:0 "探索冰岛西部的海域"
 RICE_north_atlantic_explore_greenland_desc:0 "一些水手声称，在他们的船在往返冰岛的途中被吹离航线后，在遥远的西方看到了一大片陆地，那里会不会有更多的陆地？目前还没有人敢于探索这一地区，但也许我愿意冒这个险，资助一支[greenland_great_expedition|E]前往西部。"
 RICE_north_atlantic_explore_greenland_tooltip:1 "谁知道西方有什么东西在等待着我们？"
 RICE_north_atlantic_explore_greenland_effect_tooltip_1:1 "如果成功，你将获得[prestige|E]，随着[greenland|E]的发现，[RICE_greenland_struggle|E]将开始，你的家族将自动在那里建立起第一个[greenland_estate|E]。"
 RICE_north_atlantic_explore_greenland_effect_tooltip_2:1 "在接下来的三个月里，你将召集人员和物资进行准备，可以请一个[courtier|E]作为[greenland_great_expedition|E]的[greenland_lead|E]，或者以[gold_i|E]50雇佣一个随机产生的[greenland_leader|E]。"
 RICE_north_atlantic_explore_greenland_effect_tooltip_3:1 "你不能有一个正在进行的正常的[greenland_expedition|E]，而且只能有#V 一个#![greenland_great_expedition|E]可以在全局游戏内（除非先前大远征失败）。"
 RICE_north_atlantic_explore_greenland_effect_tooltip_4:1 "如果[rulers|E]的[cultures|E]属于[norse.GetHeritage.GetName]或具有[irish.GetHeritage.GetName][heritage|E]，并且已经采取了$RICE_north_atlantic_form_iceland$[decision|E]，则该[decision|E]的费用将减少。"
 RICE_north_atlantic_explore_greenland_confirm:0 "前进！前往伟大的冒险！"
 RICE_north_atlantic_explore_greenland_context_tooltip:0 "$RICE_north_atlantic_explore_vinland_context_tooltip$"
 RICE_north_atlantic_explore_vinland:0 "探索格陵兰岛以西的海域"
 RICE_north_atlantic_explore_vinland_desc:0 "在北大西洋航行时被吹离航线的水手们报告说，他们看到[greenland|E]以西的土地，到处是树木和山丘。我是否应该冒着风险，资助一次[greenland_great_expedition|E]，以发现这些所谓的说法背后的真相，并看看[greenland|E]之外有什么？"
 RICE_north_atlantic_explore_vinland_tooltip:1 "谁知道我们会在[greenland|E]之外发现什么？"
 RICE_north_atlantic_explore_vinland_effect_tooltip_1:1 "如果成功，你将获得[prestige|E]，[greenlands|E]@RICE_greenland_networks_icon![greenland_networks|E]也将大幅扩张，新的土地将被发现，为任何在[RICE_greenland_struggle|E]中[struggle_involved|E]解锁进一步的[decisions|E]和机会。"
 RICE_north_atlantic_explore_vinland_effect_tooltip_2:1 "$RICE_north_atlantic_explore_greenland_effect_tooltip_2$"
 RICE_north_atlantic_explore_vinland_effect_tooltip_3:1 "$RICE_north_atlantic_explore_greenland_effect_tooltip_3$"
 RICE_north_atlantic_explore_vinland_effect_tooltip_4:1 "$RICE_north_atlantic_explore_greenland_effect_tooltip_4$"
 RICE_north_atlantic_explore_vinland_confirm:0 "我们将创造历史！"
 RICE_north_atlantic_explore_vinland_context_tooltip:0 "#emphasis 历史背景：#!两部《文兰传说》写于13世纪，是我们了解诺斯人探索美洲的主要资料。但由于这两部传奇中的细节太过神奇和矛盾，它们并不是可靠的史料；直到1960年，在纽芬兰发现了一处考古遗址——梅多斯湾，学者们才不再怀疑诺斯人是否曾到过美洲。莱夫·埃里克松，是格陵兰的发现者“红发”埃里克的儿子，也是一位基督教皈依者，他通常被认为是第一个真正踏上美洲大陆的诺斯探险家，但两部传奇对他的航行性质有不同的描述——如果这些传奇有一定的真实性的话。"
 RICE_north_atlantic_settle_vinland:0 "在文兰建立永久定居点"
 RICE_north_atlantic_settle_vinland_desc:0 "是的！[vinland|E]是一个遥远的地方。[vinland|E]没有什么有价值的资源？没错！在[vinland|E]定居可能是愚蠢的？有可能是对的。但谁又能拒绝这样一片诱人的肥沃土地和冒险的召唤呢！？已经有#V [GetGlobalVariable('RICE_north_atlantic_vinland_outposts').GetValue|0]#![vinland_outposts|E]在[vinland|E]，现在是永久[vinland_colonize|E]它的时候了!"
 RICE_north_atlantic_settle_vinland_tooltip:1 "是时候前往定居[vinland|E]！"
 RICE_north_atlantic_settle_vinland_effect_tooltip_1:1 "只有#V 一个#![dynasty|E]可以建立[vinland_colony_long|E]"
 RICE_vinland_colony_decision_tooltip_1:0 "[vinland_outposts|E]每年不再有失败的几率"
 RICE_vinland_colony_decision_tooltip_2:0 "在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]中的[rulers|E]有更高的机会获得与美洲原住民的事件，如产生[courtiers|E]"
 RICE_vinland_colony_decision_tooltip_3:0 "前往[vinland|E]的[greenland_expeditions|E]花费减少"
 RICE_vinland_colony_decision_tooltip_4:0 "拥有[greenland_estate_long|E]的[rulers|E]每年会多获得一点[gold|E]、[prestige|E]和[piety|E]"
 north_atlantic.0147.t:0 "文兰定居点"
 RICE_north_atlantic_settle_vinland_confirm:0 "去文兰！"
 RICE_north_atlantic_settle_vinland_context_tooltip:0 "$RICE_north_atlantic_build_outpost_vinland_context_tooltip$"
 RICE_vinland_colonization_decision_viability_tt_1:0 "[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]至少拥有#V 80#!"
 RICE_north_atlantic_form_iceland:0 "召开冰岛第一次议会"
 RICE_north_atlantic_form_iceland_desc:0 "冰岛的#italic 人口迁入#!问题已经持续了多年。很多冰岛人现在希望建立某种集会，在那里我们可以解决影响我们所有人的政治和个人问题。这样做我们可以建立一个新的社会，并结束这种#italic 居无定所#!的时代。"
 RICE_north_atlantic_form_iceland_tooltip:1 "建立一个新冰岛，以终结居无定所的时代。"
 RICE_north_atlantic_form_iceland_effect_tooltip_1:1 "所有在[GetGeographicalRegion('custom_iceland').GetName]的[norse.GetHeritage.GetName]和[irish.GetHeritage.GetName]的[counties|E]和[characters|E]成为[icelandic.GetName]文化"
 RICE_north_atlantic_form_iceland_effect_tooltip_2:1 "在[GetGeographicalRegion('custom_iceland').GetName]的所有[count|E][rank|E]的[rulers|E]成为你的[vassal|E]"
 RICE_north_atlantic_form_iceland_effect_tooltip_3:1 "减少了前往$RICE_north_atlantic_explore_greenland$进行[greenland_great_expedition|E][decision|E]的费用，特别是[cultures|E]属于[norse.GetHeritage.GetName]或有[irish.GetHeritage.GetName][heritage|E]的[rulers|E]来说。"
 RICE_north_atlantic_form_iceland_confirm:0 "冰岛联邦诞生了！"
 RICE_north_atlantic_form_iceland_context_tooltip:0 "#emphasis 历史背景：#!#italic 定居冰岛#!（landnámsöld ）一般认为开始于公元870‑874年左右（在此之前，冰岛可能已经有少量的诺斯人或凯尔特人的存在，但这一话题在学者间颇有争议）。最初的定居者中，虽然很多是诺斯人，但也有相当一部分是盖尔人，包括奴隶和自由人。到公元930年，冰岛的大部分土地已被占领，冰岛人据称在辛格韦德利举行了第一次#italic 阿尔庭#!（Althing）——一种户外的议会，并为冰岛联邦的建立奠定了基础。冰岛被定居的原因尚不明确。在中世纪后期，冰岛人自己将其归因于由挪威国王哈拉尔德一世所带来的内乱，但现代历史学家关注更深层次的因素，如斯堪的纳维亚地区耕地的短缺。与英国和爱尔兰不同，冰岛是未定居的土地，可以在不与现有居民发生冲突的情况下定居。"
 RICE_north_atlantic_explore_americas:0 "向西派遣远征队"
 RICE_north_atlantic_explore_americas_tooltip:0 "这些地区会不会有资源、潜在盟友或其他宝藏？"
 RICE_north_atlantic_explore_americas_desc:0 "在[greenland|E]以西，有一些土地可能拥有资源、盟友和其他宝藏。我希望招募一些勇敢的冒险家来探索这些地区，尽管资助一次[greenland_expedition|E]将是昂贵和危险的。"
 RICE_north_atlantic_explore_americas_effect_tooltip_1:0 "[greenland_expedition|E]的结果，可以是获得或失@gold_icon![gold|E]和[character_modifiers|E]以及更多，取决于[greenland_leader|E]、目的地和你在[greenland_expedition|E]期间的[expedition_episodes|E]的选择"
 RICE_north_atlantic_explore_americas_effect_tooltip_2:0 "[greenland_expeditions|E]的成本可能更高，具体取决于[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]，特别是在[struggle_phase_greenland_subsistence|E]"
 RICE_north_atlantic_explore_americas_effect_tooltip_3:0 "在接下来的三个月里，你将收集人员和物资进行准备，并可以通过[interaction|E]请求[courtier|E]成为[greenland_expedition|E][greenland_lead|E]，或者随机生成[greenland_leader|E]代替。你在此阶段的选择可能会增加[greenland_expedition|E]的[gold_i|E]成本。"
 RICE_north_atlantic_explore_americas_confirm:0 "准备好迎接旅程！"
 RICE_north_atlantic_explore_americas_context_tooltip:0 "#emphasis 历史背景：#!北欧人在文兰的存在只不过是一次短暂的停留，而不是真正定居，但有证据表明，北欧人持续地前往马克兰甚至可能是赫鲁兰。马克兰直到14世纪仍是格陵兰的木材来源，而有一种有争议的理论认为，北欧人与赫鲁兰的土著人民进行了几个世纪的定期贸易。"
 RICE_north_atlantic_pick_expedition_destination_type:0 "确定大远征的目的地"
 RICE_north_atlantic_pick_expedition_destination_type_gui:0 "确定[greenland_expedition_s|E]的目的地"
 RICE_north_atlantic_helluland_option:0 "#Bold #V 赫鲁兰#!#!\n$RICE_north_atlantic_helluland_option_desc$"
 RICE_north_atlantic_helluland_option_desc:0 "虽然荒凉，但[helluland|E]离[greenland|E]更近"
 RICE_north_atlantic_helluland_option_tooltip:0 "#V #Bold 花费：@gold_icon![GetGlobalVariable('RICE_global_helluland_expedition_cost').GetValue|0]#!#!\n\n$EFFECT_LIST_BULLET$关于[greenlands|E]@RICE_greenland_networks_icon![greenland_networks|E]的[expedition_episodes|E]增加（或减少）几率更高！\n$EFFECT_LIST_BULLET$与其他选项相比，[expedition_episodes|E]关于与当地人相遇的机会更高"
 RICE_north_atlantic_markland_option:0 "#Bold #V 马克兰#!#!\n$RICE_north_atlantic_markland_option_desc$"
 RICE_north_atlantic_markland_option_desc:0 "遥远的[markland|E]以其木材而闻名"
 RICE_north_atlantic_markland_option_tooltip:0 "#V #Bold 花费：@gold_icon![GetGlobalVariable('RICE_global_markland_expedition_cost').GetValue|0]#!#!\n\n$EFFECT_LIST_BULLET$关于[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]的[expedition_episodes|E]增加（或减少）几率更高！"
 RICE_north_atlantic_vinland_option:0 "#Bold #V 文兰#!#!\n$RICE_north_atlantic_vinland_option_desc$"
 RICE_north_atlantic_vinland_option_desc:0 "传说中的、遥远的[vinland|E]真的值得吗？"
 RICE_north_atlantic_vinland_option_tooltip:0 "#V #Bold 花费：@gold_icon![GetGlobalVariable('RICE_global_vinland_expedition_cost').GetValue|0]#!#!\n\n$EFFECT_LIST_BULLET$关于[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]的[expedition_episodes|E]增加（或减少）几率更高\n$EFFECT_LIST_BULLET$没有机会提高[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]\n$EFFECT_LIST_BULLET$如果[RICE_greenland_struggle|E]在[struggle_phase_greenland_marginalization|E]中，则此选项不可用"
