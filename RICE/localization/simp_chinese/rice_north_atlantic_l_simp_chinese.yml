 north_atlantic.0200.t:0 "海鸥"
 north_atlantic.0200.desc:0 "大海鸥是大西洋大部分地区明显的存在的生物。这些大型的、不会飞的鸟类在该地区可以找到群落，并且是一种常见的食物来源。\n\n最近这个地区的一些水手最近成功地猎取了一些这样的鸟，并提出以一个好的价格将肉和蛋卖给我，厨师在任何即将到来的盛宴或聚会中都是有用的。"
 north_atlantic.0200.a:0 "让我吃那块海鸥肉。"
 north_atlantic.0200.b:0 "我将购买一些海鸥蛋！"
 north_atlantic.0200.c:0 "我可以同时购买海鸥肉和海鸥蛋吗？"
 north_atlantic.0200.d:0 "不，谢谢你，我现在不需要！"
 north_atlantic.0201.t:0 "赫斯塔维格"
 north_atlantic.0201.desc:0 "斗马在冰岛很流行，它被称为#italic Hestavíg（赫斯塔维格）#!，这个运动有很多社会意义。最近[horse_1.GetTitledFirstName]和[horse_2.GetTitledFirstName]参加了一个这样的活动，支持不同的一方并相互发生了争执。\n\n像这样的争执在这些活动中并不罕见，甚至会导致斗殴。值得庆幸的是这次没有人受伤。\n\n作为[ROOT.Char.GetTitleAsNameNoTooltip]，也许我应该和这两个人谈谈，以确保将来不会再发生。毕竟如果我不能控制自己的人，这看起来确实很糟糕。"
 north_atlantic.0201.a:0 "我将对他们进行严厉的批评教育。"
 north_atlantic.0201.a.success:0 "他们同意言归于好"
 north_atlantic.0201.a.failure:0 "他们并不理会我的要求"
 north_atlantic.0201.b:0 "他们的争吵不关我的事。"
 north_atlantic.0202.t:0 "苏格兰石塔"
 north_atlantic.0202.desc:0 "在不列颠群岛的北部地区，人们可能偶尔会偶然发现神秘的、由石头制成的空心壁塔，这些塔被称为brochs（苏格兰石塔）。没有人知道是谁建造了这些建筑以及为什么建造。\n\n不久前我在[county.GetNameNoTier]遇到了一个这样的苏格兰石塔。当地人向我们解释关于它的一些传说，即使是现在，我也对这个苏格兰石塔非常好奇。"
 north_atlantic.0202.a:0 "这个世界上有许多奥秘。"
 north_atlantic.0203.t:0 "牛吼"
 north_atlantic.0203.desc:0 "在[county.GetNameNoTier]巡查时，我和我的随行人员听到了一阵呼啸的声音。起初我们很惊慌，一个卫兵甚至紧张地嘟囔着什么愤怒的亡灵。\n\n最后我们发现声音是人为的：一个当地的平民正在挥舞着一把牛吼器。这种牛吼器是苏格兰高地使用的一种奇怪的乐器，它是一块简单的、雕刻好的木头，连在一根绳子上，然后在一个大圆圈中连续摆动，产生振动的声音。\n\n不管怎么说，这个平民对这种行为表示歉意，但他说这是这些地方的一种仪式的一部分，目的是保护自己不被他危险所困扰。"
 north_atlantic.0203.a:0 "保护自己是很重要的！！"
 north_atlantic.0203.b:0 "请不要再发出那种恐怖的噪音了!"
 north_atlantic.0204.t:0 "僧侣的故事"
 north_atlantic.0204.desc:0 "今天一位当地吟游诗人在我的宫廷上表演，他的很多曲子都是关于来自爱尔兰和苏格兰的基督教僧侣的传奇冒险故事，据说他们在很多代以前就来到了大西洋中遥远的不毛之地，这样他们就可以心无旁骛地做礼拜。在这些岛屿上，他们有时会被称为 #italic papar#!。\n\n有时，这些故事甚至涉及到这些僧侣到非常遥远的地方去传教。在这些梦幻般的远方，僧侣们会遇到各种野兽、植物和文明。"
 north_atlantic.0204.a:0 "僧侣们对他们信仰的热忱引起了我的兴趣。"
 north_atlantic.0204.b:0 "我最感兴趣的是遥远国度的传说！"
 north_atlantic.0204.c:0 "这些僧侣的故事很傻，但也足够有趣。"
 north_atlantic.0205.t:0 "观赏间歇泉"
 north_atlantic.0205.desc:0 "间歇泉是[GetGeographicalRegion('custom_iceland').GetName]的一个显著景观，我有机会到那里的领地亲自看看这样一个间歇泉（当然是在安全距离内）。不是所有人能看到这样的非凡景象的！我想这是我的幸运！"
 north_atlantic.0205.a:0 "非常有趣的景观"
 north_atlantic.0206.t:0 "冰岛苔藓"
 north_atlantic.0206.desc:0 "冰岛苔藓是一种众所周知的地衣，在整个北大西洋的山区都有的存在，但特别是在[GetGeographicalRegion('custom_iceland').GetName]。虽然可以食用，但许多地位高的人都避免吃它，因为它显然是更适合农民食用的食物。\n\n然而最近有人告诉我，这种冰岛苔藓是很好的药物，可以帮助解决食欲不振和舒缓胸部疾病或咳嗽。也许我应该购买一些供我使用。"
 north_atlantic.0206.a:0 "这不过是农民的食物——我的医生有更好的药方。"
 north_atlantic.0206.b:0 "好主意！它分布广泛、数量繁多，很容易找到。"
 north_atlantic.0207.t:0 "海雀肉"
 north_atlantic.0207.desc:0 "海鹦在整个大西洋沿岸都可以找到，在这里，它们通常被认为是当地的美食。最近我有幸将海鹦肉作为我为一些来访贵宾举办的小型宴会的亮点。来访的客人纷纷称赞我的厨师能做出如此美味佳肴，我们度过了愉快的一天！"
 north_atlantic.0207.a:0 "我的厨子们做得很好！"
 north_atlantic.0208.t:0 "乳业冷漠"
 north_atlantic.0208.desc:0 "每个人都喜欢吃乳制品，如酸奶和奶酪凝块。然而在[GetGeographicalRegion('custom_iceland').GetName]，向尊敬的客人提供乳制品被认为是不礼貌的，尤其是在有更好的食物提供的情况下。\n\n不幸的是，[milkdrinker.GetTitledFirstName]有一个坏习惯，喜欢为[milkdrinker.GetHerHis]的客人提供乳制品。因此[milkdrinker.GetSheHe|U]因对[milkdrinker.GetHerHis]的客人招待不周而闻名。\n\n最近当我对[milkdrinker.GetFirstNameNoTooltip]进行非正式探访时，[milkdrinker.GetSheHe]只给了我一些#italic skyr（一种冰岛酸奶）#!！[milkdrinker.GetFirstNameNoTooltip]声称，由于现在不是吃饭时间，所以没有必要提供大餐。虽然#italic skyr（一种冰岛酸奶）#!是一种相当美味的奶油味、酸味和甜味的混合体，但这仍然是对我这种[ROOT.Char.GetTitleAsNameNoTooltip]的侮辱。我不能无视这个！"
 north_atlantic.0208.a:0 "仔细想想，你说的也对，而我也喜欢酸奶，这次就原谅你啦。"
 north_atlantic.0208.b:0 "该死的！！[milkdrinker.GetSheHe]居然敢这么做！！我必须羞辱[milkdrinker.GetHerHim]！"
 north_atlantic.0208.c:0 "也许我可以说服[milkdrinker.GetHerHim]改变[milkdrinker.GetHerHis]做法。"
 north_atlantic.0208.c.success:0 "[milkdrinker.GetFirstNameNoTooltip]同意以后变得更加热情好客一些"
 north_atlantic.0208.c.failure:0 "[milkdrinker.GetFirstNameNoTooltip]拒绝改变[milkdrinker.GetHerHis]方式"
 north_atlantic.0208.info:0 "\n#emphasis 历史背景：#!北欧和西欧的人们已经食用乳制品数百年，而#italic skyr#!是冰岛特有的酸奶的名称。有趣的是，在冰岛传奇中，向客人提供牛奶、奶酪或酸奶之类的食物被认为是不礼貌的，尤其是如果还有其他食物可以供应的话。被浸泡在乳制品中可能被视为特别的羞辱。\n\n例如，在#italic 《埃吉尔传奇》#!的一个故事中，主人公红胡子埃吉尔和他的同伴拜访了一个叫阿莫德的人，他只给他们提供了#italic skyr#!。埃吉尔认为这是一种极大的侮辱，于是为了报复，他把酸奶全吐在了阿莫德身上，阿莫德也反过来吐了埃吉尔一身。当阿莫德的手下问埃吉尔为什么这么做时，他说：“不要怪我效仿这里的主人。他和我一样，都在吐自己的内脏。”"
