 north_atlantic.0165.t:0 "大远征扬帆起航"
 north_atlantic.0165.desc.greenland:0 "就在今天！我赞助的一支伟大的远征队即将启航前往西海，去看看冰岛以西是否有什么膏腴之地。"
 north_atlantic.0165.desc.americas:0 "就在今天！我赞助的一支伟大的远征队即将启航前往西海，看看格陵兰岛以外是否有更多的土地。"
 north_atlantic.0165.desc.leader_dead:0 "\n\n由于最初被选为这次探险队领队的人已经不在了，我们不得不在最后一刻找到新的领队。我最终选择了一位当地人，名为[leader.GetFirstName]，他是著名的资深旅行者和冒险家，希望[leader.GetSheHe]不会让我们失望！"
 north_atlantic.0165.desc:0 "\n\n我选择的领队[leader.GetFirstName]说，[leader.GetSheHe]对船员很有信心，他向我保证，[leader.GetSheHe]会尽最大努力让[leader.GetHerHis]发现的任何新土地，如果我们将来可能在这种土地上定居他还会画下地图。"
 north_atlantic.0165.a:0 "我们热切地等待着你的归来！"
 north_atlantic.0165.tooltip:0 "[leader.GetFirstNameNoTooltip]将至少在一年内探索西部海域，可能还会更久"
 north_atlantic.0166.t:0 "发现文兰"
 north_atlantic.0166.desc.intro:0 "$north_atlantic.0161.desc$"
 north_atlantic.0166.desc.leader_dead:0 "\n\n我收到了不幸的消息，[leader.GetFirstNameNoTooltip]在[leader.GetHerHis]伟大的探险中去世了，但[leader.GetHerHis]的船员信上说他们会继续旅程，以纪念[leader.GetHerHis]。\n\n根据[leader.GetFirstNamePossessiveNoTooltip]船员的说法，在西部还有三块土地，[leader.GetSheHe]将其命名为#Bold 赫鲁兰#!、#Bold 马克兰#!和#Bold 文兰#!。"
 north_atlantic.0166.desc.leader_not_dead:0 "\n\n[leader.GetFirstNameNoTooltip]回到了我的领地，带来了关于[leader.GetSheHe]在[leader.GetHerHis]探索的消息。\n\n根据[leader.GetFirstNameNoTooltip]的说法，在西部还有三块土地，[leader.GetSheHe]将其命名为#Bold 赫鲁兰#!、#Bold 马克兰#!和#Bold 文兰#!。"
 north_atlantic.0166.desc:0 "文兰是这三块土地中最肥沃的，也是最偏远的。\n\n未来将有大量时间来进一步探索这些土地，谁知道我们还能发现什么？"
 north_atlantic.0166.a:0 "多么勇敢和鼓舞人心的探险家啊！"
 north_atlantic.0167.t:0 "西海大远征！"
 north_atlantic.0167.desc.greenland:0 "多年来，一直有关于冰岛西部有一块巨大陆地的传言。然而没有人敢于确定这些故事是否真实......直到现在！！\n\n一支由[leif_sponsor.GetTitledFirstName]赞助的探险队的消息正在北部海域流传，探险队将探索冰岛以西的海域并寻找新的土地。这支探险队将由一位名叫[leif_temp.GetFullName]的冒险家领导。\n\n如果这些土地存在，如果它们被证明有可以定居的领土，那么毫无疑问，[leif_sponsor.GetFirstNameNoTooltip]将是第一批在那里建立[leif_sponsor.GetHerHis]家族的人，建立一个定居点。"
 north_atlantic.0167.desc.americas:0 "在[erik.GetTitledFirstName]发现格陵兰岛之后，现在有人根据被吹离航线的水手说法，谈论位于更西部的土地。然而格陵兰与世界其他地方已经有了很大的距离，所以很少有人愿意冒着风险跨海旅行那么远……直到现在。\n\n一支由[leif_sponsor.GetTitledFirstName]赞助的探险队的消息正在穿越北部海域，以探索格陵兰西部海域，看看是否有甚至超越格陵兰的土地，探险队由一位名叫[leif_temp.GetFullName]的冒险家领导。\n\n大多数人怀疑的不是是否能找到什么，如果存在土地的话，是否值得定居……当然现在还没有盖棺定论。"
 north_atlantic.0167.a:0 "历史即将被创造吗？"
 north_atlantic.0167.tooltip.no_greenland:0 "假设这次[greenland_great_expedition|E]成功，$RICE_north_atlantic_explore_greenland$[decision|E]对[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的其他[rulers|E]永久不可用。"
 north_atlantic.0167.tooltip.no_vinland:0 "假设这次[greenland_great_expedition|E]成功了，那么对[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的其他[rulers|E]来说，$RICE_north_atlantic_explore_vinland$[decision|E]将永久不可用"
