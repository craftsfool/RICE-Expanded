 action_RICE_greenland_establish_estate_label:0 "你可以在[greenland|E]建造[greenland_estate|E]"
 action_RICE_greenland_establish_estate_desc:1 "如果你采用建造[greenland_estate_long|E]的[decision|E]，那么你的[house|E]可以从[RICE_greenland_struggle|E]获益。\n\n#help 采用这个[decision|E]可以让你的[house|E]解锁其他几个[decisions|E]，帮助你从[greenland|E]甚至更多地方获利。你的[house|E]内每个[ruler|E]也将每年获得少量随机的[gold|E]、[prestige|E]和[piety|E]。#!"
 action_RICE_greenland_establish_estate_click:1 "#I 点击查看可用[decisions|E]#!"
 action_RICE_greenland_decline_warning:0 "衰退中的格陵兰定居点"
 action_RICE_greenland_decline_warning_label:0 "[greenland_settlements|E]正在衰落"
 action_RICE_greenland_decline_warning_desc:1 "气候和/或全球经济的变化会对[greenland_settlements|E]造成影响，降低了持续定居可能性。\n\n#help 仔细考虑你在[greenland|E]的长期计划吧！这可能是所有[struggle_involved|E][rulers|E]在[RICE_greenland_struggle|E]中最后机会，以一个好的结局来结束这场[struggle|E]，否则就准备采用$RICE_greenland_struggle_ending_abandonment_decision$[decision|E]。#!"
 action_RICE_greenland_decline_warning_click:1 "#I 点击查看可用[decisions|E]#!"
 action_RICE_greenland_collapse_warning:0 "格陵兰定居点即将崩溃"
 action_RICE_greenland_collapse_warning_label:0 "[greenland_settlements|E]即将崩溃"
 action_RICE_greenland_collapse_warning_desc:1 "气候和/或全球经济的变化已经破坏了[greenland_settlements|E]。西部定居点已不复存在，幸存的东部定居点也即将崩溃。\n\n#help 目前每年都有#V [GetGlobalVariable('RICE_greenland_auto_fail_chances').GetValue|0]#!%机会自动结束[RICE_greenland_struggle|E]。在你还可以的时候，尽快采用$RICE_greenland_struggle_ending_abandonment_decision$[decision|E]来减少你的损失。#!"
 action_RICE_greenland_collapse_warning_click:1 "#I 点击查看可用[decisions|E]#!"
 RICE_greenland_struggle:0 "格陵兰探索"
 RICE_greenland_struggle_desc:0 "我的品位独一无二，无趣的你不会明白的~\n我的品位独一无二，无趣的你不会明白的~"
 struggle_RICE_greenland_phase_settlement:0 "定居点"
 struggle_RICE_greenland_phase_settlement_desc:0 "[colonizing_greenland|E]以及可能的更远的土地，有着很多机遇，但由于它距离欧洲很远，也存在着很高的风险。\n\n在有利的气候、与当地土著的友好关系以及稳定的出口奢侈品（如海象牙）的支持下，[greenland|E]可能会在与北大西洋政治和贸易网络建立联系的过程中繁荣发展，从而达到[struggle_phase_greenland_integration|E]。相反，其他地方的政治和经济变化，以及与当地土著的冲突，可能会打断贸易和供应的流动，导致[greenlands|E]的定居点衰落，陷入[struggle_phase_greenland_subsistence|E]。"
 struggle_RICE_greenland_phase_integration:0 "整合"
 struggle_RICE_greenland_phase_integration_desc:0 "由于成功的[struggle_phase_greenland_settlement|E]，[greenland_settlements|E]紧密相连，部分原因是出口奢侈品，特别是海象牙。与此同时，与当地土著的和平关系也促进了贸易和合作的扩展。事实上，[greenland|E]已经足够繁荣，人们对探索更遥远的土地也有了更大的兴趣。\n\n然而一切美好的事物都会有尽头。[greenland|E]仍然很小，而且容易受到其他地方政治和经济变化的社会冲击，这可能导致[struggle_phase_greenland_subsistence|E]的出现。如果这些冲击足够破坏性，而定居点无法适应，[greenland|E]反而会滑向[struggle_phase_greenland_marginalization|E]。"
 struggle_RICE_greenland_phase_subsistence:0 "勉强生存"
 struggle_RICE_greenland_phase_subsistence_desc:0 "在经历了[struggle_phase_greenland_settlement|E]或[struggle_phase_greenland_integration|E]的斗争阶段后，[greenland_settlements|E]由于维持生存所需的长途运输和在严寒土地上生活的困难而变得脆弱。与当地土著的关系也日益紧张。\n\n其他地方的政治和经济变化打乱了贸易和供应的秩序，[greenland|E]变得越来越依赖北欧。定居者必须从欧洲获得更多的援助，并加倍努力出口有价值的奢侈品，特别是海象牙，以期达到[struggle_phase_greenland_integration|E]，否则[greenland|E]将陷入[struggle_phase_greenland_marginalization|E]。"
 struggle_RICE_greenland_phase_marginalization:0 "边缘化"
 struggle_RICE_greenland_phase_marginalization_desc:0 "[greenland_settlements|E]依赖外界的帮助才能生存，但却经常被北欧的政治实体所忽视。曾经以出口奢侈品，特别是海象牙为主的产业正在严重衰退。与[greenlands|E]土著的关系也充满了不信任甚至冲突。\n\n最终，事态可能会达到一个平衡，[greenland|E]的定居者适应了这些新的环境，并进入了[struggle_phase_greenland_subsistence|E]。否则，他们将陷入更深的衰落，再次面临[struggle_phase_greenland_marginalization|E]的危机。"
