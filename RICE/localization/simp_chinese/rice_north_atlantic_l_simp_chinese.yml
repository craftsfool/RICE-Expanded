 RICE_north_atlantic_make_culture_involved_in_greenland_desc:0 "虽然[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中的[ROOT.Char.GetCulture.GetName]社区与[greenland_settlements|E]有一些经济联系，但我们[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]在那里并不是主流。如果我们要从海象贸易中获益，我们需要在[RICE_greenland_struggle|E]中成为[struggle_involved|E]"
