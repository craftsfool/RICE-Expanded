 RICE_north_atlantic_support_greenland:0 "支援格陵兰岛定居点"
 RICE_north_atlantic_support_greenland_tooltip:0 "[greenland_settlements|E]需要更多的[greenland_support|E]来确保他们继续生存。"
 RICE_north_atlantic_support_greenland_desc:0 "有远见的[rulers|E]可以向偏远的[greenland_settlements|E]提供[greenland_support|E]，这不仅是为了提高他们对该地区的影响力，也是为了帮助生活在那里的人们，确保[greenland|E]继续向欧洲市场源源不断地出口海象牙等珍贵的奢侈品。"
 RICE_north_atlantic_support_greenland_effect_tooltip_1:0 "大多数形式的[greenland_support|E]都会让你获得[prestige_i|E][prestige|E]、[piety_i|E][piety|E]或良性[modifiers|E]等收益，但更关键的是，它们可以改善[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]"
 RICE_north_atlantic_support_greenland_effect_tooltip_2:0 "你的[greenland_support|E]有很小的可能性无法到达[greenland|E]和#N #italic 减少#!#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的数值，特别是如果这些数值一开始就很低的话。"
 RICE_north_atlantic_support_greenland_effect_tooltip_3:0 "发送[greenland_support|E]的成本较高，因为你的[house|E]缺乏[greenland_estate_long|E]。"
