 north_atlantic.0110.t:0 "向文兰派遣援助"
 north_atlantic.0110.desc.intro:0 "我们在传说中的文兰边疆定居点比格陵兰边疆定居点更加偏远，甚至更小，因此需要大量的支持。具有讽刺意味的是，尽管文兰岛物产丰富，但我们在那里的定居者严重依赖来自格陵兰的货物和人员来生存。"
 north_atlantic.0110.desc.supplies:0 "我收集了一批物资，准备送往文兰。从食品到贵重金属和工具以及更多，这些物资应该能帮助定居者的日常生活。"
 north_atlantic.0110.desc.settlers:0 "\n\n我因此招募一些同胞在文兰定居。他们人数很少，毕竟谁会去这么遥远的地方？ 但我可以放心，他们是非常勇敢和冒险的人（甚至是愚蠢的人）。我希望他们会对那里现有的定居者有很大帮助。"
 north_atlantic.0110.desc.base_camps:0 "\n\n我派了一艘船带着物资和工匠，打算在文兰建造一些基地营地。由于距离遥远，文兰鲜有人涉足，如果我们要在那片土地上立足，就应该沿着海岸线建立小站，为探险者提供一个修理船只和工具的地方，在旅行中休息等等。"
 north_atlantic.0110.desc.temples:0 "\n\n因此，我已经派了一艘船，带着物资和工人，在文兰岛建造一个[ROOT.Char.GetFaith.HouseOfWorship]。由于那里的定居者远离故土，[ROOT.Char.GetFaith.HouseOfWorship]可以作为城镇中心；当然[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]也会非常乐意在这片新土地上扩大影响力。"
 north_atlantic.0110.desc:0 "\n\n虽然我们在文兰的存在诚然给我们现有的格陵兰定居点带来了沉重的负担，但我希望从长远来看，这将是值得的！"
 north_atlantic.0110.a:0 "愿我们的船能迅速安全地到达那里"
 north_atlantic.0110.a.tooltip:0 "$north_atlantic.0100.a.tooltip$"
 north_atlantic.0111.t:0 "援助抵达文兰"
 north_atlantic.0111.desc.intro:0 "好消息！我们派往文兰的船只已经安然抵达那里。"
 north_atlantic.0111.desc.supplies:0 "\n\n我们向文兰的定居者提供的物资是最受欢迎的，希望能让他们在这块陌生但奇妙的土地上生存下去，至少能多活一段时间。"
 north_atlantic.0111.desc.settlers:0 "\n\n新的定居者开始在文兰安家了，虽然他们的技能在格陵兰定居点会得到更好的发挥，但人们只能希望他们在文兰的贡献不会白费。"
 north_atlantic.0111.desc.base_camps:0 "\n\n沿着海岸线已经开始建造一些营地。虽然它们不会一直被占用，但它们会成为任何探险者欢迎的风景，并提供一个连接系统，使我们能够在该地区扩大我们的存在。"
 north_atlantic.0111.desc.temples:0 "\n\n一个[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]的建设已经开始。我相信我们之前派往文兰的人一定会感谢我们的举动，这肯定会是思乡回忆。"
 north_atlantic.0111.desc:0 "\n\n现在我知道有些人质疑我向文兰提供援助的决定，因为我本可以向格陵兰派船，它也需要支持，而且经济上比文兰更重要。尽管如此，我相信我做出了正确的选择，文兰岛对我也很重要，我希望看到它成功。"
 north_atlantic.0111.a:0 "愿我们的努力不会白费。"
 north_atlantic.0111.tooltip.increase_viability:0 "[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]增加#V [THIS.Char.MakeScope.Var('RICE_viability_resource_value_temp').GetValue]#!到@RICE_vinland_viability_icon!#V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
 north_atlantic.0111.tooltip.decrease_resilience:0 "[greenlands|E][greenland_resilience|E]减少#V [THIS.Char.MakeScope.Var('RICE_resilience_resource_value_temp').GetValue]#!到@RICE_greenland_resilience_icon!#V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0111.tooltip.decrease_networks:0 "[greenlands|E][greenland_networks|E]减少#V [THIS.Char.MakeScope.Var('RICE_networks_resource_value_temp').GetValue]#!到@RICE_greenland_networks_icon!#V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0112.t:0 "援助未能到达文兰"
 north_atlantic.0112.desc.supplies:0 "糟糕！我派去运送食物、金属和工具等基本物资的船只未能到达文兰，这些船在海上迷失了方向。"
 north_atlantic.0112.desc.settlers:0 "糟糕！我招揽定居者的船只未能到达文兰，这些船在海上迷失了方向。"
 north_atlantic.0112.desc.base_camps:0 "糟糕！我派遣的船只在危险的西行过程中未能到达那里，这些船在海上迷失了方向。"
 north_atlantic.0112.desc.temples:0 "糟糕！我派遣的船只在危险的西行过程中未能到达那里，这些船在海上迷失了方向。"
 north_atlantic.0112.desc:0 "\n\n我们在文兰花费的这些资源都被浪费了！我知道有一些人不赞成我在文兰岛投资的决定，认为格陵兰会是一个更安全、更合理、更有利的选择。毫无疑问这些反对者中的许多人现在可能觉得自己现在是对的，现在我们承认在文兰建立一个定居点，会使我们的格陵兰定居点变得生存紧张。"
 north_atlantic.0112.a:0 "也许我应该向格陵兰提供援助，而不是……"
 north_atlantic.0112.tooltip.decrease_resilience:0 "$north_atlantic.0111.tooltip.decrease_resilience$"
 north_atlantic.0112.tooltip.decrease_networks:0 "$north_atlantic.0111.tooltip.decrease_networks$"
