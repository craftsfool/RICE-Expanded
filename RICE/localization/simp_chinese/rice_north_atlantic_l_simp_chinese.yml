 north_atlantic.0102.t:0 "援助未能到达格陵兰"
 north_atlantic.0102.desc:0 "\n\n绝望的是，我支持格陵兰的努力似乎是徒劳的。这场灾难让我失去了优秀的水手和人民，以及我的船只和许多物资。我只能感叹我们是否做了什么错事，会导致[ROOT.Char.GetFaith.WaterGodName]不保护这些船只！"
 north_atlantic.0102.desc.basic_supplies:0 "我收到消息说，送去格陵兰岛的基本物资未能到达那里，因为船只在海上遇到风暴而沉没了。"
 north_atlantic.0102.desc.settlers:0 "我收到消息，招募前往格陵兰岛的定居者未能到达那里。船只遇到风暴并沉没，导致定居者和船员一起死亡。"
 north_atlantic.0102.desc.food:0 "我收到消息说，我送去格陵兰岛的食品和牲畜未能到达那里，因为船只在海上遇到风暴而沉没了。"
 north_atlantic.0102.desc.materials:0 "我收到消息说，送去格陵兰岛的那批材料未能到达那里，因为船只在海上遇到风暴而沉没了。"
 north_atlantic.0102.desc.clergy:0 "我收到消息，我招募前往格陵兰岛的[ROOT.Char.Custom('DefaultPriestTitlePlural')]未能到达那里。船只遇到风暴而沉没，导致[ROOT.Char.Custom('DefaultPriestTitlePlural')]和船员一起死亡。"
 north_atlantic.0102.desc.hunting_stations:0 "我收到消息说，运载着劳工和物资的船只但未能抵达那里，这些船遇到了风暴，在海上沉没了。"
 north_atlantic.0102.desc.shielings:0 "我收到消息说，前往格陵兰岛的船只未能到达那里，因为船只在海上遇到风暴而沉没了。"
 north_atlantic.0102.desc.temples:0 "我收到消息说，前往格陵兰岛的船只未能到达那里，因为船只在海上遇到风暴而沉没了。"
 north_atlantic.0102.a:0 "悲剧啊！"
