 RICE_north_atlantic_family_estate_greenland:0 "在格陵兰建立一个家族庄园"
 RICE_north_atlantic_family_estate_greenland_desc:0 "[ROOT.Char.GetHouse.GetName][house|E]应该参加[RICE_greenland_struggle|E]。通过建立[greenland_estate|E]，我们可以开发该地区，更好地出口海象牙并从中获利。"
 RICE_north_atlantic_family_estate_greenland_tooltip:1 "我们的[house|E]应该在[greenland|E]建立一个[greenland_estate|E]。"
 RICE_north_atlantic_family_estate_greenland_effect_tooltip_1:1 "如果你是[house_head|E]，这个决议的成本会降低。"
 RICE_north_atlantic_family_estate_greenland_effect_tooltip_2:1 "所有在[RICE_greenland_struggle|E]中[struggle_involved|E]的[landed|E][house|E]成员，现在可以获得与[struggle|E]有关的各种[decisions|E]和机制；他们现在还将每年获得（或有时失去）不同数量的[gold_i|E][gold|E]、[prestige_i|E][prestige|E]和[piety_i|E][piety|E]"
 RICE_north_atlantic_family_estate_greenland_effect_tooltip_3:1 "[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的数值影响在[greenland|E]的#italic 每个#![greenland_estate|E]"
 RICE_north_atlantic_family_estate_greenland_confirm:0 "这将是我们家族历史上永远铭记的一天。"
 RICE_north_atlantic_family_estate_greenland_context_tooltip:0 "#emphasis 历史背景：#!格陵兰的诺斯定居点人口可能从未超过几千人，而且受到一小撮精英的控制。这些精英中很可能有格陵兰的发现者——“红发”埃里克的后裔，他们在公元900年代末在格陵兰的布拉塔利德建立了自己的家族庄园。这个庄园拥有肥沃的农田，还可能是美洲第一座欧式教堂。"
 RICE_north_atlantic_hunting_trip:0 "组织一次诺塞图尔狩猎之旅"
 RICE_north_atlantic_hunting_trip_desc:0 "[greenlands|E]的奢侈品出口往往是在[nordsetur|E]的狩猎中获得的，这是一个遥远的北方地区。我将派遣我的家族在那里的[greenland_estate|E]招募人员，在明年夏天驶向[nordsetur|E]，以获得这些宝贵的奢侈品，#italic 尤其是海象牙#!。这是一次艰难的旅途，但回报是巨大的。"
 RICE_north_atlantic_hunting_trip_tooltip:1 "通往[nordsetur|E]的旅程是危险的，但利润的潜力绝对是巨大的!"
 RICE_north_atlantic_hunting_trip_effect_tooltip_1:1 "根据你的[stewardship|E]、[diplomacy|E]和当前[RICE_greenland_struggle|E]的[struggle_phase|E]，这次狩猎成功的基本几率估计为#V [THIS.Char.MakeScope.ScriptValue('RICE_walrus_hunt_success_chance')|0]%#!，但如果你雇佣更多人员和船只，这个概率可以#bold 增加#!"
 RICE_north_atlantic_hunting_trip_effect_tooltip_2:1 "如果成功，你将获得至少[gold_i|E]#V [THIS.Char.MakeScope.ScriptValue('RICE_walrus_hunt_gold_gain_min_value')|0]#!的一次性金额。可能更多，但取决于你愿意雇佣多少人和船只，以及当前[RICE_greenland_struggle|E]的[struggle_phase|E]"
 RICE_north_atlantic_hunting_trip_effect_tooltip_3:1 "当你的人在秋季回来，你可能会得到其他的好处，如[artifacts|E]、[modifiers|E]，以及更多。"
 RICE_north_atlantic_hunting_trip_effect_tooltip_4:1 "高@RICE_greenland_resilience_icon![greenland_resilience|E]增加获得更好结果的几率，也增加了你能获得的最大[gold|E]的数量，而低@RICE_greenland_resilience_icon![greenland_resilience|E]会降低这两个数值。"
 RICE_north_atlantic_hunting_trip_effect_tooltip_5:1 "高@RICE_greenland_networks_icon![greenland_networks|E]降低[decision|E]的成本，而低@RICE_greenland_networks_icon![greenland_networks|E]则会增加其成本。"
 RICE_north_atlantic_hunting_trip_effect_tooltip_6:1 "因为[RICE_greenland_struggle|E]目前处于[struggle_phase_greenland_settlement_simple|E]或[struggle_phase_greenland_integration|E]，采取这个[decision|E]只会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]，猎物的数量是随机的，从#V 0#!到#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_miniscule')|0]#!的小猎物，#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_minor')|0]#!的大猎物，以及#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_medium')|0]#!的巨大猎物之间波动"
 RICE_north_atlantic_hunting_trip_effect_tooltip_7:1 "因为[RICE_greenland_struggle|E]已经以一个好结局解决了，采取这个[decision|E]只会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]，猎物的数量是随机的，从#V 0#!到#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_miniscule')|0]#!的小猎物，#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_minor')|0]#!的大猎物，以及#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_medium')|0]#!的巨大猎物之间波动"
 RICE_north_atlantic_hunting_trip_effect_tooltip_8:1 "因为[RICE_greenland_struggle|E]目前处于[struggle_phase_greenland_subsistence|E]，采取这个[decision|E]只会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]，猎物的数量是随机的，从#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_minor')|0]#!到#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_medium')|0]#!的小猎物，#V 10#!的大猎物，以及#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_major')|0]#!的巨大猎物之间波动"
 RICE_north_atlantic_hunting_trip_effect_tooltip_9:1 "因为[RICE_greenland_struggle|E]目前处于[struggle_phase_greenland_marginalization|E]，采取这个[decision|E]只会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]，猎物的数量是随机的，从#V 0#!到#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_medium')|0]#!的小猎物，#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_major')|0]#!的大猎物，以及#V [EmptyScope.ScriptValue('RICE_greenland_walrus_hunt_resilience_penalty_massive')|0]#!的巨大猎物之间波动"
 RICE_north_atlantic_hunting_trip_confirm:0 "狩猎时间到了！"
 RICE_north_atlantic_hunting_trip_context_tooltip:0 "#emphasis 历史背景：#!在中世纪，欧洲艺术中使用的大部分象牙都来自格陵兰岛。大多数海象只能在夏季北极水域较为安全时，在距离诺斯定居点数百英里的迪斯科湾捕猎。参与捕猎的格陵兰人只有很短的时间窗口——几周——去航行、杀死并斩首海象（因为它们的尸体太大，无法用小船运输），并及时把象牙带回家，以便参与秋季的收获。格陵兰殖民地在鼎盛时期最多也只有几千人，所以每一个有劳动能力的人的贡献都是必不可少的。"
 RICE_current_nordsetur_hunt_req:0 "已经赞助了在[nordsetur|E]的海象狩猎活动。"
 RICE_north_atlantic_nordsetur_hunt_type:0 "计划在诺塞图尔举办一次海象狩猎活动"
 RICE_north_atlantic_nordsetur_hunt_type_gui:0 "将此次狩猎之旅的资源分配给[nordsetur|E]"
