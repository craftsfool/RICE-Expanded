 north_atlantic.0161.t:0 "发现格陵兰"
 north_atlantic.0161.desc:0 "有一些普通的冒险家和旅行者，他们在死后往往被遗忘。而有些人的荣耀和名字将在未来传奇般延续几十年，甚至几个世纪。毫无疑问，[leader.GetFirstName]就是这样一位传奇的探险家！"
 north_atlantic.0161.desc.leader_dead:0 "\n虽然[leader.GetFirstNameNoTooltip]在旅途中去世了，但[leader.GetHerHis]的船员一定要继续他们的旅程，以纪念[leader.GetHerHis]的执念，他们发现了一片土地，[leader.GetFirstNameNoTooltip]将其命名为“#Bold 绿岛（格陵兰）#!”作为吸引定居者的一种巧妙方式。\n\n虽然格陵兰是一片贫穷、偏远的土地，但它也是一片充满机遇的土地。[leader.GetFirstNamePossessiveNoTooltip]船员在[ROOT.Char.GetCulture.GetName]定居者（现在被认定为[new_culture.GetCollectiveNoun]）的帮助下，已经以我的名义在格陵兰可耕种的地方建立了两个定居点。[leader.GetFirstNamePossessiveNoTooltip]船员还报告说格陵兰岛北部有大量的海象。如果我们可以定期猎杀他们，我们就能在欧洲赚取丰厚的利润，因为欧洲对象牙的需求很高。"
 north_atlantic.0161.desc.leader_not_dead:0 "\n\n[leader.GetFirstNameNoTooltip]凯旋而归，确认在遥远的西方确实有一片广阔的土地，[leader.GetSheHe]称之为将其命名为 “#Bold 绿岛（格陵兰）#!”作为吸引定居者的一种巧妙方式。\n\n虽然格陵兰是一片贫穷、偏远的土地，但它也是一片充满机遇的土地。[leader.GetFirstNameNoTooltip]在[ROOT.Char.GetCulture.GetName]定居者（现在认定为[new_culture.GetCollectiveNoun]）的帮助下，已经以我的名字在格陵兰可耕种的地方建立了两个定居点。[leader.GetFirstNameNoTooltip]也报告说格陵兰岛北部有大量的海象。如果我们能定期猎杀它们，我们就能在欧洲赚取丰厚的利润，因为欧洲对象牙的需求很高。"
 north_atlantic.0161.a:0 "这是北大西洋新时代的诞生！"
 north_atlantic.0162.t:0 "大远征计划"
 north_atlantic.0162.desc.greenland:0 "千里之行始于足下！\n我已经决定赞助一支前往西部海域的探险队，看看那些关于冰岛以西有一块巨大的陆地的故事是否属实。我需要做的第一件事是选择一个有能力和有冒险精神的人来领导这次探险。"
 north_atlantic.0162.desc.americas:0 "千里之行始于足下！\n我已经决定赞助一支前往西部海域的探险队，看看那些关于格陵兰以外有陆地的故事是否属实。我需要做的第一件事是选择一个有能力和有冒险精神的人来领导这次探险。"
 north_atlantic.0162.desc.some_courtiers:0 "\n\n我的一些廷臣已经表示有兴趣领导这次探险，我当然欣赏他们对冒险的渴望！\n\n此外一位名叫[local.GetFirstName]的当地人听说了我的计划，并向我请求[local.GetHerHis]的效忠。我听说[local.GetSheHe]有冒险经验，所以[local.GetSheHe]也可以作为探险队队长。"
 north_atlantic.0162.desc.no_courtiers:0 "\n\n不幸的是，我的廷臣们们都不愿接受这次伟大远征的领袖角色，我理解他们的犹豫，但这还是令人失望。\n\n幸运的是一位名叫[local.GetFirstName]的当地人听说了我的计划，并向我请求[local.GetHerHis]的效忠。我想我别无选择，只能任命其为这次远征的领队，不过没多久我得到一些消息，[local.GetSheHe]有许多去地方探险的经验。"
 north_atlantic.0162.a:0 "[candidate_1.GetFirstNameNoTooltip]应该承担起这个责任。"
 north_atlantic.0162.b:0 "[candidate_2.GetFirstNameNoTooltip]是完成这项伟大任务的合适[candidate_2.GetWomanMan]。"
 north_atlantic.0162.c:0 "[local.GetFirstNameNoTooltip]将被选为这次远征的领袖。"
