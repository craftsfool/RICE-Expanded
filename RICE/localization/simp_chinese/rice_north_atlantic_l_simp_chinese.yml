 RICE_bartholomew_leslie_modifier:0 "苏格兰的匈牙利人"
 RICE_bartholomew_leslie_modifier_desc:0 "该角色原是一位匈牙利贵族，在诺曼征服之后跟随盎格鲁‑撒克逊公主玛格丽特来到不列颠群岛。"
 north_atlantic.0272.b:0 "我仍是[hungarian.GetNameNoTooltip]骑士，应当继续旅行。"
 north_atlantic.0272.info:0 "#emphasis 历史背景：#!巴塞洛缪·莱斯利被认为是苏格兰的莱斯利氏的匈牙利人祖先，他在诺曼征服之后跟随[aetheling.GetFullNameNoTooltip]与[margaret.GetFirstNameNoTooltip]来到苏格兰。他本应于1067年抵达，而非此处的1066年。"
 RICE_ivory_center_europe_region:0 "大欧洲"
 RICE_michael_scot_modifier:0 "苏格兰神秘学家"
 RICE_michael_scot_modifier_desc:0 "这位学者在数学和语言等方面天赋异禀，更别说他触类旁通占星术和炼金术等神秘学知识。"
 north_atlantic.0273.info:0 "#emphasis 历史背景：#!迈克尔·斯科特（或称迈克尔·斯格特）是中世纪苏格兰学者、数学家和占星家，他游历各地，通晓多国语言，因此在有生之年就享有盛誉。\n\n例如斐波那契将其数学名著#italic 《计算之书》#!的第二版送给了斯科特，1227年教宗甚至一度让他担任坎特伯雷大主教。而斯科特最重要的赞助人是神圣罗马帝国皇帝兼西西里国王腓特烈二世，由于他精通阿拉伯语，腓特烈二世可能将他任为外交官与穆斯林国家进行交流。\n\n以上种种事迹让斯科特响彻世界，尤其是他对占星术和炼金术等神秘学知识的了解，导致了出现许多以他为蓝本的巫师传说。例如，他出现在但丁的#italic 《神曲》#!中（在第八层地狱中，巫师、占星家和假先知都被关在这里）。"
