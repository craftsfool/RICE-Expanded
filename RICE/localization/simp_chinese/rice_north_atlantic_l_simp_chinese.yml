 RICE_north_atlantic_skalholt_school_desc:0 "[GetGeographicalRegion('custom_iceland').GetName]已经在他人领导下完成了定居和当地政体组织，这个岛屿继续成长并扩大与外界的联系。现在我们应该在[GetGeographicalRegion('custom_iceland').GetNameNoTooltip]建立一所合适的[ROOT.Char.GetFaith.GetReligion.GetAdjective]学校，培训[ROOT.Char.Custom('DefaultPriestTitlePlural')]，加强权威，并教育当地精英。"
 RICE_north_atlantic_skalholt_school_tooltip:1 "在冰岛建立第一所宗教学院"
 RICE_north_atlantic_skalholt_school_confirm:0 "以[ROOT.Char.GetFaith.HighGodName]的名义！"
 RICE_north_atlantic_skalholt_school_context_tooltip:0 "#emphasis 历史背景：#!冰岛酋长埃尔斯佛·吉苏拉松曾在德意志地区接受教育，于1056年被不来梅总主教阿达尔贝特任命为冰岛第一任主教。埃尔斯佛的一个显著成就是在他的家族故居斯卡尔霍特建立了一所重要的学校。由于冰岛刚刚基督教化，这有助于加强教会在冰岛的权威。埃尔斯佛的儿子特尔托和祭苏儿也都是教士，他们在他去世后继续扩展冰岛的宗教和学术机构。"
