 RICE_greenland_ender_name:0 "格陵兰定居成功"
 RICE_greenland_ender_desc:0 "虽然经过多年的辛勤努力，格陵兰殖民地终于不再挣扎求存。在[struggle_ender.GetFirstName]的引领下，它已发展成为北大西洋世界中繁荣且不可或缺的一部分。"
 RICE_greenland_legend_chapter_opening_struggle:0 "在第一批定居者抵达格陵兰很久之后，[ROOT.Legend.GetProtagonist.GetNameNoTooltip]历经险难，合纵连横，联合了格陵兰诸多定居点。"
 RICE_greenland_legend_chapter_motivation_struggle:0 "尽管定居点从海象象牙中获得了大量财富，但[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]晓得坐吃山空的道理。而若要改变现状，唯[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]不可。"
 RICE_greenland_legend_chapter_famous_deed_generic:0 "[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]就如同传说中的英雄一样，既有屠龙勇士般的勇武，也有与民生息的智慧。为了避免后人坐吃山空、竭泽而渔的未来，[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]决心将格陵兰打造成成为北大西洋的经济、政治和文化中心！"
 RICE_greenland_legend_chapter_extra_deed_struggle:0 "但好事总多磨。成大事者有几人未曾经受风高浪急甚至惊涛骇浪的重大考验？[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]亦四面受敌。前有那些对定居点居心莫测的人，后有贪婪红眼的商人眼馋定居点的利润，还有愚蠢的野心家，他们希望前往文兰岛，而非定居格陵兰，甚至格陵兰内部也貌合神离。"
 RICE_greenland_legend_chapter_conclusion_ended_struggle:0 "曾有人认为在文明世界之外的荒蛮之地定居是一件愚蠢且不可能的事情，但[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U]证明他们错了，在其的努力下，格陵兰真正成为了北大西洋世界繁荣、不可分割的一部分，后世子孙来往格陵兰再也不会遭遇他们先祖曾遭遇过的重重磨难！"
 RICE_greenland_sunset_invasion_ender_name:0 "日落入侵"
 RICE_greenland_sunset_invasion_ender_desc:0 "来自大洋东岸的蛮子虽然成功殖民了格陵兰岛，但想要问鼎备北洋霸主，还得问问[struggle_ender.GetCulture.GetName]人的首领，智勇双全、文武兼备的[struggle_ender.GetFirstName]答不答应！"
 RICE_greenland_sunset_invasion_legend_chapter_opening_struggle:0 "当第一批来自大洋东岸的探险者抵达大洋西岸并发起[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]后，大洋两岸之间的联系日益密切。不过这大好海洋，若就拱手让给大洋东岸短视的蛮子也太过可惜了。这北洋霸主之位，舍[ROOT.Legend.GetProtagonist.GetNameNoTooltip其谁]？"
 RICE_greenland_sunset_invasion_legend_chapter_motivation_struggle:0 "大洋两岸，一东一西，往来者甚众。这其中，有和平、友好的，比如贸易、外交也有不那么有好的，比如劫掠，以及那些格陵兰岛是的殖民者对[ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]等文明的蔑视——他们蔑称其为“斯克雷林人”，即“丑人”。[ROOT.Legend.GetProtagonist.GetNameNoTooltip]当然不会喜欢这种对[ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]人的偏见，[ROOT.Legend.GetProtagonist.GetSheHe|U]会让这些瞧不起[ROOT.Legend.GetProtagonist.GetSheHe|U]们的人付出代价，但同时也会给帮助[ROOT.Legend.GetProtagonist.GetSheHe|U]的朋友带去财富与友谊。"
 RICE_greenland_sunset_invasion_legend_chapter_famous_deed_generic:0 "[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]就如同传说中的英雄，给敌人带去征服，予朋友以财富。藉此，[ROOT.Legend.GetProtagonist.GetSheHe|U]在大洋两岸发展了贸易、聚敛了财富，并获得了大量的盟友。"
 RICE_greenland_sunset_invasion_legend_chapter_extra_deed_struggle:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]使[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]之名传遍整个大洋，[ROOT.Legend.GetProtagonist.GetHerHis]无不自豪地将自己的丰功伟绩称作“日落入侵”。就像之前说的那样，[ROOT.Legend.GetProtagonist.GetSheHe|U]会让这些瞧不起[ROOT.Legend.GetProtagonist.GetSheHe|U]们的人付出代价，但同时也会给帮助[ROOT.Legend.GetProtagonist.GetSheHe|U]的朋友带去财富与友谊！"
 RICE_greenland_sunset_invasion_legend_chapter_conclusion_ended_struggle:0 "历经多次传奇般的冒险，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]率领[ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]人成功稳定北洋，控制了联系大洋两岸的格陵兰岛海道。如今，人们提到“斯克雷林人”时，不再是带着蔑视，而是带着恐惧与尊崇。毫无疑问，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的威名将在历史中留下浓墨重彩的一笔！"
 RICE_vinland_settlement_success_legend_name:0 "文兰定居点"
 RICE_vinland_settlement_success_legend_desc:0 "在旧大陆，许多对文兰的实际情况几乎一无所知的傻瓜却梦想征服文兰，获得无数的财富。[settler.GetTitledFirstName]就是这样一位“傻瓜”。不过，[settler.GetTitledFirstName]与“傻瓜”最大的不同在于，[settler.GetSheHe]成功了。"
 RICE_vinland_settlement_success_legend_chapter_opening_new_title:0 "啊，文兰，遥远的地方，传说中的流淌着葡萄酒的人间天堂！自有探险家从极寒的格陵兰岛横渡大西洋到达那里后，有关这片传说之地的故事便不绝于耳。在那里，生长着大片的小麦和世间最甜的葡萄。不过，那么多年来，还未曾听闻有哪个探险家成功在那里建立定居点。这也是为什么与资助探险家探索前往文兰的航路相比，人们更愿意用这份资金去投资格陵兰岛——毕竟格陵兰岛能稳定地提供海象牙。"
 RICE_vinland_settlement_success_legend_chapter_motivation_new_title:0 "同无数听着文兰的传说长大的[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人一样，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]也对在大海彼岸的传说之地充满了无尽的遐想。不过，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]可不是什么叶公好龙之人，[ROOT.Legend.GetProtagonist.GetHerHis]是真心想要前往文兰，建立一番丰功伟业的！[ROOT.Legend.GetProtagonist.GetSheHe]相信，只要有智慧、够狡猾、有足够的资金支持，并与当地人友好合作，[ROOT.Legend.GetProtagonist.GetSheHe]就一定能成功在那里建立定居点！"
 RICE_vinland_settlement_success_legend_chapter_famous_deed_new_title:0 "[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]敢有如此野心并非没有依仗。[ROOT.Legend.GetProtagonist.GetHerHis]的家族在格陵兰岛经营多年，根基深厚，繁荣的海象贸易是其积累了大量的财富，因而有余力派人渡海而去，与文兰土著开展贸易。通过家族的人脉与资源，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]得以实地勘察文兰，去寻找理想的定居地。[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive]保佑！虽然花费了不少时间和精力，但在[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive]的指引下，[ROOT.Legend.GetProtagonist.GetSheHe]在一处海岸找到了一片宛若世外桃源的地方，那里生长着文兰特产的葡萄和小麦。"
 RICE_vinland_settlement_success_legend_chapter_extra_deed_new_title:0 "阳光总在风雨后，万事总是开头难！虽然在定居点刚刚建立时，一切似乎都是那么艰辛，要人没人，要物没物，一切都百废待兴。但随着时间的推移，定居点逐渐走上了正轨，大量的探险家，尤其是吃苦耐劳的[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]探险家来到了这里，尝试自给自足。同时，[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]还与其在当地的盟友维持了良好的关系。最艰难的时期已然渡过，文兰岛迎来了新的曙光！"
 RICE_vinland_settlement_success_legend_chapter_conclusion_new_title:0 "有人曾对[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的雄心壮志不屑一顾，说[ROOT.Legend.GetProtagonist.GetHerHis]不过是叶公好龙，最后肯定会向其他失败者一样，要么葬身鱼腹，要么耗光了青春与钱财，灰溜溜地回来。的确，到目前为止是还没有人成功在文兰建立定居点，但这并不意味着失败就成了唯一的可能。世界终究是不断发展、不断变化的。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]顺应了北大西洋发展的潮流，虽然[ROOT.Legend.GetProtagonist.GetSheHe|U]不可能让文兰像格陵兰一样成为北大西洋地区的重要角色，但[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]发现传说中流淌着葡萄酒的土地的故事必将代代流传！"
