 north_atlantic.0040.t:0 "远征：新朋友？"
 north_atlantic.0040.desc:0 "根据回信，[leader.GetSheHe]已经接触到了一小伙当地土著，他们的领袖是[native_leader.GetTitledFirstName]。尽管语言不通，但这些当地土著似乎也有与我们和平交往、甚至进行贸易的企图。\n\n[leader.GetFirstNamePossessiveNoTooltip]探险队的成员对下一步该怎么做意见不一。有些人不想给当地人任何可能被用来对付探险队的武器或工具。其他人则认为，重要的是赢得当地人的信任，并看看他们可能希望交易什么贵重物品。但也有人觉得这些当地人很天真，所以最好是直接偷窃或绑架他们。接下来[leader.GetFirstNameNoTooltip]做了什么呢？"
 north_atlantic.0040.a:0 "[leader.GetSheHe]说他们明智地尝试与[native_leader.GetFirstNamePossessiveNoTooltip]人交易"
 north_atlantic.0040.a.failure:0 "[leader.GetFirstNameNoTooltip]说他们未能就双方都能接受的贸易协议进行谈判"
 north_atlantic.0040.a.success:0 "[leader.GetFirstNameNoTooltip]说他们设法缔结了双方都能接受的贸易协议"
 north_atlantic.0040.b:0 "[leader.GetSheHe|U]说他们谨慎的拒绝了"
 north_atlantic.0040.c:0 "虽然[leader.GetSheHe]没说做了什么，但是我猜少不了绑架……"
 north_atlantic.0040.c.failure.battle:0 "[leader.GetFirstNameNoTooltip]说他们谈判失败导致双方交战，结果失败了"
 north_atlantic.0040.c.failure.get_away:0 "[leader.GetFirstNameNoTooltip]说他们失败了但[leader.GetSheHe]和[leader.GetHerHis]的队员们还是成功逃离了。"
 north_atlantic.0040.c.success.steal:0 "[leader.GetFirstNameNoTooltip]说他们成功“巧取”属于[native_leader.GetFirstNamePossessiveNoTooltip]人的一些贵重物品"
 north_atlantic.0040.c.success.kidnap:0 "[leader.GetFirstNameNoTooltip]说他们成功绑架[native_leader.GetFirstNamePossessiveNoTooltip]人"
 north_atlantic.0041.t:0 "远征：贸易协定"
 north_atlantic.0041.desc.success:0 "虽然[leader.GetFirstName]和[leader.GetHerHis]队员一开始与[native_leader.GetFirstName]和[native_leader.GetHerHis]人沟通困难，但他们最终还是达成了某种共识。双方同意交换各种物品：我们给他们布匹、金属等，而他们给我们一些艺术品、毛皮、木制工具和各种小饰品。\n\n[leader.GetFirstNameNoTooltip]回信我，如果探险队成功返回，[leader.GetSheHe]会向我展示[leader.GetSheHe]从这些外国人那里获得的货物。总而言之，这次交易很成功，[leader.GetSheHe]离开时觉得他们在[native_leader.GetFirstNameNoTooltip]交了一个好朋友。"
 north_atlantic.0041.desc.failure:0 "[leader.GetFirstName]和[leader.GetHerHis]队员与[native_leader.GetFirstName]和[native_leader.GetHerHis]人因为语言问题导致难以沟通，所以最后双方都没能达成任何进程。[leader.GetFirstNameNoTooltip]没有从[native_leader.GetFirstNameNoTooltip]和[native_leader.GetHerHis]人那里没有感觉到任何亲切感，幸好也没有感任何敌意。\n\n在一番尴尬之后，[native_leader.GetFirstNameNoTooltip]和[native_leader.GetHerHis]人离开了，[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]人回到了[leader.GetHerHis]船上。在[leader.GetHerHis]的回信中，[leader.GetFirstNameNoTooltip]表示担心，如果在该地区遇到同样的当地人，是否会产生误解甚至冲突。"
 north_atlantic.0041.a:0 "我希望我们能找到更多像[native_leader.GetFirstNameNoTooltip]这样友好的人!"
 north_atlantic.0041.b:0 "不幸的结果。"
 north_atlantic.0042.t:0 "远征：偷窃"
 north_atlantic.0042.desc.battle:0 "[leader.GetFirstName]和[leader.GetHerHis]队员找到并探测[native_leader.GetFirstName]和[native_leader.GetHerHis]人扎营的区域。然后他们从里面偷走了一些物品，不过他们离开时被发现！\n\n令他们吃惊的是，[native_leader.GetFirstNamePossessiveNoTooltip]人反应迅速，挥舞着可怕的武器，射出许多箭矢对付他们。现在很清楚得知，虽然外国人看起来很和平，但对战斗并不陌生！\n\n[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的队员们以最快的速度撤退回自己的船上，一路上遭受了一些伤亡。[leader.GetHerHis|U]的回信最后说，[leader.GetHerHim]希望永远不要再遇到这些外国人。"
 north_atlantic.0042.desc.get_away:0 "[leader.GetFirstName]和[leader.GetHerHis]队员找到并探测[native_leader.GetFirstName]和[native_leader.GetHerHis]人扎营的区域。然后他们从里面偷走了一些物品，不过他们离开时被发现！\n\n值得庆幸的是，[native_leader.GetFirstNameNoTooltip]和[native_leader.GetHerHis]人似乎被打了个措手不及，不知道如何应对这种背叛行为。这让[leader.GetFirstName]和[leader.GetHerHis]的队员勉强有足够的时间跑到他们的船上逃跑。虽然他们失败了，但至少他们平安无事地逃了出来"
 north_atlantic.0042.desc.steal:0 "通过诡计和欺骗，[leader.GetFirstName]和[leader.GetHerHis]一行人成功地从[native_leader.GetFirstNamePossessive]那里偷取了一些物品，而那些天真的傻瓜们却毫不知情。他们也考虑过绑架[native_leader.GetFirstNamePossessiveNoTooltip]中的一个人，但决定这样做太冒险了。\n\n在把货物藏在他们的船上后，[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员逃离了这个地区。毫无疑问[native_leader.GetFirstNameNoTooltip]最终会发现发生了什么，所以[leader.GetFirstNameNoTooltip]希望[leader.GetSheHe]不要再遇到这群外国人。"
 north_atlantic.0042.desc.kidnap:0 "通过诡计和欺骗，[leader.GetFirstName]和[leader.GetHerHis]一行人成功地从[native_leader.GetFirstNamePossessive]那里偷取了一些物品，而那些天真的傻瓜们却毫不知情。甚至胆大包天的他们还绑架[native_leader.GetFirstNamePossessiveNoTooltip]中的一个人到船上。\n\n随后[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员逃离了这个地区。毫无疑问[native_leader.GetFirstNameNoTooltip]最终会发现发生了什么，所以[leader.GetFirstNameNoTooltip]希望[leader.GetSheHe]不要再遇到这群外乡人。"
 north_atlantic.0042.a:0 "果然没选错人！我等不及想看看[leader.GetFirstNameNoTooltip]带回来什么！"
 north_atlantic.0042.b:0 "[leader.GetFirstNameNoTooltip]怎么可以这样对待这些善良的人呢？!"
 north_atlantic.0042.c:0 "唉，[leader.GetFirstNameNoTooltip]应该知道风险！"
 north_atlantic.0043.t:0 "远征：一个陌生人"
 north_atlantic.0043.desc:0 "[leader.GetFirstName]回信说他们在一个未知地区航行并海滩登陆，只见一个[native.GetWomanMan]蜷缩在篝火旁。[native.GetSheHe|U]看起来不像[ROOT.Char.GetCulture.GetName]，而且穿着奇怪的衣服。\n\n尽管语言不通，[leader.GetFirstNameNoTooltip]还是设法了解了这个[native.GetWomanMan]的情况，他叫[native.GetFirstName]。[native.GetSheHe|U]来自[native.GetCulture.GetName]人的一个部落，但由于某种原因与[native.GetHerHis]脱离，现在孤身一人，也许[native.GetSheHe]被排斥或是敌人袭击后的幸存者，不排除遭受了一些其他的灾难。\n\n嗯......我想知道后来[leader.GetFirstNameNoTooltip]怎么应付？"
 north_atlantic.0043.a:0 "我想好心的[leader.GetSheHe]会给些资源给这个[native.GetFirstNameNoTooltip]"
 north_atlantic.0043.b:0 "我想[leader.GetSheHe]会用强行带走[native.GetFirstNameNoTooltip]"
 north_atlantic.0043.c:0 "我想[leader.GetSheHe|U]会把[native.GetHerHis]这个不值得信任的陌生人留给命运"
 north_atlantic.0043.a.failure.refuse:0 "[leader.GetFirstNamePossessiveNoTooltip]回信说[native.GetFirstNameNoTooltip]不接受施舍。"
 north_atlantic.0043.a.failure.not_alone:0 "事实证明，[native.GetFirstNameNoTooltip]并不孤单，而且不是以一种好的方式。"
 north_atlantic.0043.a.success.accept:0 "信件上说[native.GetFirstNameNoTooltip]接受[leader.GetFirstNamePossessiveNoTooltip]慷慨解囊，并提供一些知识作为回报。"
 north_atlantic.0043.a.success.not_alone:0 "事实证明，[native.GetFirstNameNoTooltip]并不孤单"
 north_atlantic.0043.a.success.join:0 "信上说[native.GetFirstNameNoTooltip]加入[leader.GetFirstNamePossessiveNoTooltip]探险队了"
 north_atlantic.0043.b.failure.escape:0 "[native.GetFirstNameNoTooltip]抵抗并逃走了"
 north_atlantic.0043.b.failure.not_alone:0 "后面发现[native.GetFirstNameNoTooltip]其实并没有被孤立，而是被[native.GetHerHis]部落所救。"
 north_atlantic.0043.b.success.loot:0 "[leader.GetFirstNameNoTooltip]回信说未能成功绑走[native.GetFirstNameNoTooltip]，但还是抢走[native.GetHerHis]不少有价值的东西"
 north_atlantic.0043.b.success.capture:0 "[leader.GetFirstNameNoTooltip]回信说已经成功绑走[native.GetFirstNameNoTooltip]"
 north_atlantic.0044.t:0 "远征：好心人"
 north_atlantic.0044.desc.refuse:0 "[leader.GetFirstNamePossessive]回信说已经做出最大的努力，但[native.GetFirstName]并不希望得到帮助，还拒绝任何支援。也许[native.GetFirstName]误解了，或者对陌生人提供[native.GetHerHim]的东西感到怀疑。\n\n但是当[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]一行人商议下一步该怎么做时，[native.GetFirstNameNoTooltip]则利用这段时间悄悄地溜走了。[leader.GetFirstNameNoTooltip]在[leader.GetSheHe]搜索该地区时没有发现[native.GetFirstNameNoTooltip]的踪迹，[leader.GetSheHe]没有什么选择，只能继续进行探险活动。"
 north_atlantic.0044.desc.not_alone_bad:0 "[leader.GetFirstName]回信说他们试图向[native.GetFirstName]解释[leader.GetHerHis]的良苦用心时，这个流浪者似乎不愿意接受这些物资。然而在他们达成沟通时，一声可怕的战吼不知从何处传来，陌生的战士们向他们袭来！\n\n[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的队员们被打的措手不及，不得不退回到他们的船上离开。值得庆幸的是这次他们的受伤和伤亡不多。\n\n由于这次突然性、混乱性的袭击，让[leader.GetFirstNameNoTooltip]无法判断这些陌生的战士是[native.GetFirstNameNoTooltip]的朋友还是敌人，他们可能认为[leader.GetSheHe]和[leader.GetHerHis]的队员们心怀不轨，也有可能这些是[native.GetFirstNameNoTooltip]的敌人，想要杀死[native.GetHerHim]和任何似乎是[native.GetHerHis]的朋友。"
 north_atlantic.0044.desc.accept:0 "[native.GetFirstName]一开始表现得谨慎是可以理解的，但最终[native.GetSheHe]接受了[leader.GetFirstName]提供给[native.GetHerHim]的物资，无论是出于无奈，还是因为[native.GetSheHe]相信[leader.GetFirstNamePossessiveNoTooltip]的善意，或者两者皆是。\n\n然后[native.GetFirstName]向探险队提供了一些知识和物品作为回报。[leader.GetFirstName]和[leader.GetHerHis]的队员呢吧随后向[native.GetFirstNameNoTooltip]询问这片土地，打算了解[native.GetHerHis]人，即[native.GetCulture.GetCollectiveNoun]。虽然由于语言不通，沟通有困难，但[leader.GetFirstNameNoTooltip]认为[native.GetFirstNameNoTooltip]为我们提供了一些有用的信息，如果我们进一步向这个地区派出探险队，会有很大帮助。"
 north_atlantic.0044.desc.not_alone_good:0 "[leader.GetFirstName]回信说他们已经尽力向[native.GetFirstName]解释，[leader.GetSheHe]想通过向[native.GetHerHim]提供一些用品来帮助[native.GetHerHim]。然而没多久就听到巨大的声音向他们靠近时，交谈就这样被打断了。\n\n原来是其他[native.GetCulture.GetName]人，他们看起来与[native.GetFirstNameNoTooltip]相似，也许是[native.GetHerHis]的朋友或家人。这些陌生人一开始显得很有敌意，可能是因为他们认为[leader.GetFirstNameNoTooltip]是敌人，但[native.GetFirstNameNoTooltip]还是让他们平静下来\n\n之后双方进行了一些交易，然后在和平的离开了。[leader.GetFirstName]回忆起来说这些当地人是一个非常友好的人，而且很谨慎。"
 north_atlantic.0044.desc.join:0 "[native.GetFirstName]一开始表现得谨慎是可以理解的，但最终[native.GetSheHe]接受了[leader.GetFirstName]提供给[native.GetHerHim]的物资，无论是出于无奈，还是因为[native.GetSheHe]相信[leader.GetFirstNamePossessiveNoTooltip]的善意，或者两者皆是。\n\n随着[native.GetFirstNameNoTooltip]开始对[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]队员们感到安心，[native.GetSheHe]似乎用手势和听不懂的话表示[native.GetSheHe]想加入他们。也许是无处可去，也许觉得[native.GetSheHe]没有什么选择，也有可能是[native.GetSheHe]对其他环境感到好奇，还是两者兼有？\n\n[leader.GetFirstNameNoTooltip]在信件中最后留笔道，[leader.GetSheHe]不确定我是否会同意，但[leader.GetSheHe]决定让[native.GetFirstNameNoTooltip]跟随。也许我们将来会遇到像[native.GetCulture.GetName]这样的其他[native.GetFirstNameNoTooltip]!"
 north_atlantic.0044.a:0 "多么令人困惑的事情啊！"
 north_atlantic.0044.b:0 "我很高兴这一切都解决了！"
 north_atlantic.0044.c:0 "欢迎[native.GetFirstNameNoTooltip]来我的宫廷！"
 north_atlantic.0044.d:0 "什么？为什么[leader.GetFirstNameNoTooltip]会相信这个外乡人？"
 north_atlantic.0045.t:0 "远征：绑架"
 north_atlantic.0045.desc.escape:0 "[leader.GetFirstName]回信说他们试图让[native.GetFirstName]产生安全感，向[native.GetHerHim]承诺提供食物和其他用品，试图绑架[native.GetHerHim]。然而[native.GetFirstNameNoTooltip]警惕的拒绝了。\n\n当[leader.GetFirstNameNoTooltip]试图用武力威迫[native.GetFirstNameNoTooltip]时，这个狡猾的家伙逃脱了，而且还抢走了[leader.GetFirstNamePossessiveNoTooltip]的一些物资[leader.GetFirstNameNoTooltip]觉得[leader.GetSheHe]对整个局势估计错误，并承认[leader.GetSheHe]没能抓住这个狡猾的家伙，应该受到责备。"
 north_atlantic.0045.desc.not_alone:0 "[leader.GetFirstName]回信说他们试图让[native.GetFirstName]产生安全感，向[native.GetHerHim]承诺提供食物和其他用品，试图绑架[native.GetHerHim]，但是突然一声大吼，一群陌生的战士们向他们跑来！在他们面前的是一个巨大的“陷阱”\n\n[native.GetFirstNameNoTooltip]毕竟不是一个人，要么[native.GetSheHe]对[leader.GetFirstNameNoTooltip]撒了谎，要么就是有误会。总之，[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的队员们被打了个措手不及，不得不退回到他们的船上。值得庆幸的是，他们的受伤和伤亡都不多。"
 north_atlantic.0045.desc.loot:0 "[leader.GetFirstName]回信说他们试图让[native.GetFirstName]产生安全感，向[native.GetHerHim]承诺提供食物和其他用品，试图绑架[native.GetHerHim]。然而[native.GetFirstNameNoTooltip]警惕的拒绝了。\n\n[leader.GetFirstNameNoTooltip]可能过早地启动了陷阱，或者[native.GetFirstNameNoTooltip]进行抵抗，还成功地逃脱。尽管如此，[native.GetHerHis]匆忙逃离时，还在[native.GetHerHis]的营地留下了一些[native.GetHerHis]的物品和饰品，被[leader.GetFirstNameNoTooltip]洗劫。[leader.GetSheHe|U]说[leader.GetSheHe]会在这次探险回来后给我看这些物品和饰品。"
 north_atlantic.0045.desc.capture:0 "[leader.GetFirstName]回信说他们用花言巧语让[native.GetFirstName]产生虚假的安全感，向[native.GetHerHim]承诺提供食物和其他物资，试图绑走[native.GetHerHim]。这个可怜的家伙要么太天真，要么太绝望，要么两者都有，所以[native.GetSheHe]跟着[leader.GetFirstNameNoTooltip]回到了[leader.GetHerHis]的船上，此后他们扬长而去。\n\n[leader.GetFirstNameNoTooltip]信上还说，[native.GetFirstNameNoTooltip]对所发生的事情感到不安，但这是可以预料的。[leader.GetSheHe|U]希望当探险队返回时，我能够亲自见到[native.GetFirstNameNoTooltip]!"
 north_atlantic.0045.a:0 "我期待[leader.GetFirstNameNoTooltip]更好的表现！"
 north_atlantic.0045.b:0 "我相信这对[leader.GetFirstNameNoTooltip]来说一定是个挑战。"
 north_atlantic.0045.c:0 "[leader.GetFirstNameNoTooltip]怎么会想在这种情况下绑架别人？"
 north_atlantic.0046.t:0 "远征：海难水手"
 north_atlantic.0046.desc:0 "探险队沿着一块未知土地的海岸线航行时，惊讶地发现岸边有一艘沉船。更让他们吃惊的是，[ROOT.Char.GetCulture.GetName]的水手也在那里。\n\n根据船长[sailor.GetFirstName]的说法，他们是一艘往返于格陵兰贸易船的船员，但他们被吹离了航线。随着物资的减少，他们担心再也见不到任何友好的面孔，也见不到自己的故乡。\n\n不管怎么说，这些水手所运输的一些货物设法在沉船中幸存下来。因此他们帮助[leader.GetFirstNameNoTooltip]在加入[leader.GetHerHis]的船员之前，打捞了剩下的东西。"
 north_atlantic.0046.a:0 "大团圆的结局！"
 north_atlantic.0047.t:0 "远征：遭遇风暴"
 north_atlantic.0047.desc:0 "今天收到[leader.GetFirstName]的信件，上面说他们遇到了一场相当可怕的风暴，可怕到许多船员认为他们当时就会死在那里。也许[ROOT.Char.GetFaith.WaterGodName]听见他们的祈祷，所以风暴最后消失了！\n\n然而在事后，[leader.GetFirstNameNoTooltip]注意到，[leader.GetSheHe]失去了一些[leader.GetHerHis]船员，甚至还有几艘船。这无疑会阻碍他们进行远征的能力，但[leader.GetFirstNameNoTooltip]发誓无论如何他们都会继续旅行。"
 north_atlantic.0047.a:0 "可怕的灾难！"
 north_atlantic.0048.t:0 "远征：失踪人员"
 north_atlantic.0048.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说他们在文兰的一个地方露宿几天。在此期间，[leader.GetFirstNameNoTooltip]偶尔会派出侦察队，寻找食物和探索该地区。\n\n一天晚上，[leader.GetFirstNamePossessiveNoTooltip]的一个侦察兵，[tyrker.GetFirstName]，没有和[tyrker.GetHerHis]的队伍一起返回营地，这是一个最奇怪的现象。\n\n尽管时间越来越晚，[leader.GetFirstNameNoTooltip]和几个队员还是想寻找[tyrker.GetFirstNamePossessiveNoTooltip]的行踪。然而其他船员说，[tyrker.GetFirstNameNoTooltip]可能只是迷路了，很快就会回来。"
 north_atlantic.0048.a:0 "我认为[leader.GetFirstNameNoTooltip]最后找到了[tyrker.GetFirstNameNoTooltip]"
 north_atlantic.0048.a.failure:0 "[leader.GetFirstNameNoTooltip]不可能再找到[tyrker.GetFirstNameNoTooltip]了。"
 north_atlantic.0048.a.success:0 "[leader.GetFirstNameNoTooltip]发现[tyrker.GetFirstNameNoTooltip]一直在做什么"
 north_atlantic.0048.b:0 "我确信[tyrker.GetFirstNameNoTooltip]后来自己回来了，不需要搜索了……"
 north_atlantic.0049.t.found:0 "远征：葡萄！"
 north_atlantic.0049.t.lost:0 "远征：迷失"
 north_atlantic.0049.desc.found:0 "今天收到[leader.GetFirstName]的信件，上面说[leader.GetSheHe]和[leader.GetHerHis]的探险队员去寻找[tyrker.GetFirstName]，尽管天色越来越暗。值得庆幸的是，他们还没有走远，就发现了失踪的[tyrker.GetWomanMan]，他处于兴奋状态，而且奇怪的是他喝醉了！起初，[leader.GetFirstNameNoTooltip]非常生气，但[tyrker.GetFirstNameNoTooltip]解释说，他有一个惊人的发现：是野葡萄！！\n\n每个人都知道这样一个传说：当[leif.GetTitledFirstNameNicknamed]的船员在那里发现葡萄时，文兰的名字是由[leif.GetHerHis]赋予的。然而在文兰找葡萄说起来容易找起来难，所以[leader.GetFirstNameNoTooltip]很高兴[tyrker.GetFirstNameNoTooltip]能偶然发现一些。\n\n总之[leader.GetFirstNameNoTooltip]在[leader.GetHerHis]的信结尾上说，[leader.GetSheHe]会给我带回一些这些葡萄。"
 north_atlantic.0049.desc.lost:0 "今天收到[leader.GetFirstName]的信件，上面说[leader.GetSheHe]和[leader.GetHerHis]的探险队员去寻找[tyrker.GetFirstName]，尽管天色越来越暗，但是不幸的是他们当晚未能找到[tyrker.GetFirstNameNoTooltip]。\n\n在接下来的几个星期里，搜索仍在继续，也没有结果。最后，由于没有找到[tyrker.GetFirstNameNoTooltip]的踪迹，大家都认为[tyrker.GetSheHe]肯定已经死亡，或者因为某种原因故意抛弃了他们。\n\n于是，旅程继续进行，只不过没有[tyrker.GetFirstNameNoTooltip]……"
 north_atlantic.0049.a:0 "我等不及想尝尝文兰葡萄的味道！"
 north_atlantic.0049.b:0 "嗯......我想知道[tyrker.GetHerHim]发生了什么情况？"
 north_atlantic.0050.t:0 "远征：漂流木"
 north_atlantic.0050.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说他们在海岸线上航行时，他们遇到了一个到处都是浮木的区域。\n\n当然，格陵兰的浮木并不陌生，因为来自陌生的、遥远的地方的树木残骸经常被海浪带到海滩上。这种浮木可以用来做任何事情，从木柴到造船！\n\n总之，[leader.GetFirstNameNoTooltip]说，能找到这么多这种质量的浮木是不常见的。因此，[leader.GetSheHe]和他的船员将花一些时间尽可能多地收集，以便带上他们的船。"
 north_atlantic.0050.a:0 "格陵兰总是可以找到浮木！"
 north_atlantic.0051.t:0 "远征：骷髅"
 north_atlantic.0051.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说他们在海岸线上航行时，[leader.GetHerHis]队员们发现了几具骷髅的遗骸。他们身边有一些好奇的小玩意，虽然有些大部分没什么价值，但有还有珠宝和工具这些。\n\n在进一步调查该地区并没有发现最近人类活动的迹象后，[leader.GetFirstNameNoTooltip]决定埋葬这些骸骨，并从该地带走一些更有用的材料。"
 north_atlantic.0051.a:0 "多么有趣的发现！"
 north_atlantic.0052.t:0 "远征：熊！"
 north_atlantic.0052.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说[leader.GetSheHe]派遣数名船员前往某区域勘探。[leader.GetSheHe|U]本指望他们能发现新奇事物或实用资源。\n\n岂料侦察队甫出发不久，便遭遇一头体型硕大无朋的巨熊！众人不知怎地竟激怒了这头猛兽，在仓皇逃回船只途中，有一名船员葬身熊掌之下。\n\n哎呀，这种事恰印证了在此地域勘探可能遭遇的致命风险……"
 north_atlantic.0052.a:0 "熊可不是好惹的。"
 north_atlantic.0053.t:0 "远征：神秘的袭击者"
 north_atlantic.0053.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说[leader.GetHerHis]找到了一个看起来不错的天然港口来停泊他们的船只。但是他们开始接近海岸线时，就有许许多多的箭矢不知从何处飞来，射向他们！船也被射中！\n\n船员们立即赶忙离开港口。幸运的是，信上面[leader.GetFirstNameNoTooltip]说他们没有多少严重的伤亡。\n\n由于突如其来的袭击，[leader.GetFirstNamePossessiveNoTooltip]船员们只设法瞥见了几眼他们的攻击者，而且关于这些攻击者的样子的报告也是相互矛盾的。例如，一些船员声称这些袭击者是奇怪的、单腿的生物还会迅速地跳来跳去，但其他船员说他们像凶残的人类……"
 north_atlantic.0053.a:0 "不管那些袭击者是谁，他们似乎都很危险！"
 north_atlantic.0054.t:0 "远征：海豹"
 north_atlantic.0054.desc:0 "根据信件，探险队进展顺利！！\n\n[leader.GetFirstNameNoTooltip]信上说，船员们刚刚遇到了大量的海豹，他们成功地猎杀了这些海豹。在北方民族习俗中，海豹通常被用来做肉和油，这让船员们的士气大增。"
 north_atlantic.0054.a:0 "真高兴听到这些！"
 north_atlantic.0055.t:0 "远征：沉船"
 north_atlantic.0055.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说探险队遇到了挫折，向我保证情况可能更糟。\n\n因为他们驶入一个天然港口，打算探索附近地区时，其中一艘船搁浅了。损坏严重，[leader.GetFirstNameNoTooltip]下达了弃船的命令。\n\n[leader.GetFirstNameNoTooltip]遗憾地告诉我，此后船员们士气低落，但沉船上的所有船员都已被转移到幸存的船上，他们仍然设法打捞了大量沉船上的货物和木材。[leader.GetSheHe|U]告诉我，无论如何，探险队将继续前进。"
 north_atlantic.0055.a:0 "不幸中之万幸"
 north_atlantic.0056.t:0 "远征：前任探险者"
 north_atlantic.0056.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说们发现了一个以前的欧洲冒险家团队使用过的营地！这是一个惊喜，一个受欢迎的惊喜！\n\n很难说这究竟是哪位探险家建造的，但[leader.GetFirstNameNoTooltip]想，也许等[leader.GetSheHe]回来后，[leader.GetSheHe]可以通过将[leader.GetSheHe]发现的地点与早期探险家的记录或传说进行比较来调查此事。显然，这里有简陋的建筑，有床和其他设施，还有修理工具和船只的地方。\n\n总之，[leader.GetFirstNameNoTooltip]计划在这里呆上几个星期，侦察一下这个地区，也许还能了解以前的探险家为什么在这里扎营，然后再继续探险。"
 north_atlantic.0056.a:0 "诚然，我们总是追随先人的脚步！"
 north_atlantic.0057.t:0 "远征：奇怪的鲸鱼肉"
 north_atlantic.0057.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说发生了不幸的、但却很有趣的事件。当他们船只驶过一个海滩时，船员们都注意到了一个奇怪的景象：一条因被搁浅而死亡的奇形怪状的鲸鱼尸体。\n\n当他们停下来在那片海滩上休息时，一些船员认为这只死鲸鱼显然是来自[ROOT.Char.GetFaith.HighGodName]的礼物，于是他们立即开始大吃特吃。然而其他船员却心存疑虑，拒绝吃这些肉。\n\n第二天，所有吃了这些肉的船员都病倒了。于是他们决定把鲸鱼剩下的东西扔回海里，并向[ROOT.Char.GetFaith.HighGodName]祈祷。这之后，他们的病就消散了。[leader.GetFirstNameNoTooltip]推测这是来自[ROOT.Char.GetFaith.HighGodName]的某种信息。"
 north_atlantic.0057.a:0 "这是我听过的最奇怪的事件！"
 north_atlantic.0058.t:0 "远征：信息收集"
 north_atlantic.0058.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说考察工作进展顺利，没有发生什么重大的事情，是个好现象。\n\n[leader.GetSheHe|U]和其他船员目前正在一个相当宁静的地方休息，并记录下那里的各种野生动物和植物。[leader.GetHerHis]希望这些信息对我们，或者至少对未来的其他探险者有帮助。"
 north_atlantic.0058.a:0 "干得好！"
 north_atlantic.0059.t:0 "远征：攻击者......还是别的什么？"
 north_atlantic.0059.desc:0 "在已知世界的边缘旅行是充满危险的，但有时这些危险是想象出来的。今天收到[leader.GetFirstNameNoTooltip]的信件，上面说一个有趣的案例，[leader.GetSheHe]最近派了几个探险队的成员去内陆探索。\n\n队员们匆匆忙忙地回来了，大叫着说伏击。[leader.GetFirstNameNoTooltip]命令大家拿起武器准备战斗，必要时可能还要撤离该地区，然后他们紧张地等待着。\n\n等待着.....没有攻击者到来。\n\n但是船员坚持说他们看到外面有什么东西在攻击他们。[leader.GetFirstNameNoTooltip]相信他们没有欺骗[leader.GetHerHim]，那么他们发生了什么？长时间的旅行变得疯了吗？还是他们真的看到了外面的东西？"
 north_atlantic.0059.a:0 "我确信外面没有任何东西.....不是吗？"
 north_atlantic.0060.t:0 "远征：敌对的陌生人"
 north_atlantic.0060.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说他们到达了一个小港口，遇到了由某个[native_leader.GetFirstName]领导的一群奇怪的人。双方起初试图沟通，但也许是由于误解而爆发了冲突，导致双方都有一些人死亡。陌生人暂时撤退了，但[leader.GetFirstNameNoTooltip]担心他们会回来。\n\n有些船员认为他们也需要撤退，但也有人想报仇，甚至想绑架敌人。我想知道[leader.GetFirstNameNoTooltip]做了什么？"
 north_atlantic.0060.a:0 "也许[leader.GetSheHe]试图用外交手段达成和解"
 north_atlantic.0060.b:0 "如果让我猜，我会说[leader.GetSheHe]肯定是会明智地决定撤退。"
 north_atlantic.0060.c:0 "[leader.GetSheHe]肯定是加固了防御，等待战士们的回归"
 north_atlantic.0060.d:0 "我想[leader.GetSheHe]肯定会试图突袭营地。"
 north_atlantic.0060.a.success.peace:0 "[leader.GetFirstNameNoTooltip]设法与[native_leader.GetFirstNameNoTooltip]达成和解。"
 north_atlantic.0060.a.failure.tension:0 "[leader.GetFirstNameNoTooltip]未能讲和，但[native_leader.GetFirstNameNoTooltip]也没有进一步攻击。"
 north_atlantic.0060.a.failure.no_peace:0 "[leader.GetFirstNameNoTooltip]未能讲和，而且[native_leader.GetFirstNameNoTooltip]还攻击[greenland_expedition|E]。"
 north_atlantic.0060.c.success.kidnap_battle:0 "[leader.GetFirstNameNoTooltip]在战斗中击败了[native_leader.GetFirstNameNoTooltip]，甚至还俘获了[native_leader.GetFirstNamePossessiveNoTooltip]的人。"
 north_atlantic.0060.c.success.loot_battle:0 "[leader.GetFirstNameNoTooltip]在战斗中击败了[native_leader.GetFirstNameNoTooltip]，并获得了很多战利品。"
 north_atlantic.0060.c.neutral.no_battle:0 "最终没有发生任何战斗。"
 north_atlantic.0060.c.failure.defeat:0 "最终[native_leader.GetFirstNameNoTooltip]击败了[leader.GetFirstNameNoTooltip]"
 north_atlantic.0060.d.success.kidnap_raid:0 "最终[leader.GetFirstNameNoTooltip]在突袭[native_leader.GetFirstNamePossessiveNoTooltip]营地时，成功绑架了[native_leader.GetHerHis]营地的人。"
 north_atlantic.0060.d.success.loot_raid:0 "最终[leader.GetFirstNameNoTooltip]设法掠夺[native_leader.GetFirstNamePossessiveNoTooltip]营地。"
 north_atlantic.0060.d.neutral.abandoned:0 "后来发现营地里没有人，也没有什么可突击的。"
 north_atlantic.0060.d.failure.caught:0 "最终[leader.GetFirstNameNoTooltip]突袭[native_leader.GetFirstNamePossessiveNoTooltip]营地失败，但设法逃出，基本没有人员伤亡。"
 north_atlantic.0060.d.failure.counterambush:0 "最终[leader.GetFirstNameNoTooltip]突袭[native_leader.GetFirstNamePossessiveNoTooltip]营地失败，随后发生了战斗。"
 north_atlantic.0061.t:0 "远征：一次外交尝试"
 north_atlantic.0061.desc.peace:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说一些船员对这些外乡人在冲突爆发后是否愿意交谈持怀疑态度，但[leader.GetFirstNameNoTooltip]让[leader.GetHerHis]船员放心，这些人显然是人类，而人类是可以讲道理的。事实证明，[leader.GetSheHe]是正确的。\n\n[leader.GetFirstNameNoTooltip]设法接近[native_leader.GetFirstNamePossessive]的人，说服外乡人相信[leader.GetSheHe]没有恶意，这一切都是一个可怕的误解。[leader.GetFirstNameNoTooltip]和[native_leader.GetFirstNameNoTooltip]互相道歉，并允许各自的下属埋葬死者。\n\n之后，虽然事情还有点紧张，但为了表示善意，双方同意通过交换各种饰品来做一下交易。最后，[leader.GetFirstNameNoTooltip]说，[leader.GetSheHe]觉得[leader.GetSheHe]和[native_leader.GetFirstNameNoTooltip]互相了解起来了。"
 north_atlantic.0061.desc.tension:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说一些船员对这些外乡人在冲突爆发后是否愿意交谈持怀疑态度，但[leader.GetFirstNameNoTooltip]让[leader.GetHerHis]船员放心，这些人显然是人类，而人类是可以讲道理的。事实证明，[leader.GetSheHe]是错误的。\n\n不管[leader.GetFirstNamePossessiveNoTooltip]如何乐观，但[native_leader.GetFirstNameNoTooltip]似乎对和平不感兴趣。每次[leader.GetFirstNameNoTooltip]试图接近[native_leader.GetFirstNamePossessiveNoTooltip]营地时，[leader.GetSheHe]都会被奇怪的语言嘲弄和几支旨在吓走[leader.GetHerHim]的高空箭矢赶走。\n\n最终[leader.GetFirstNameNoTooltip]得出结论，至少这些外乡人对杀死他们不感兴趣，只想让他们离开。最后[leader.GetFirstNameNoTooltip]决定就这样做了。"
 north_atlantic.0061.desc.no_peace:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说一些船员对这些外乡人在冲突爆发后是否愿意交谈持怀疑态度，但[leader.GetFirstNameNoTooltip]让[leader.GetHerHis]船员放心，这些人显然是人类，而人类是可以讲道理的。事实证明，[leader.GetSheHe]是错误的。\n\n不管[leader.GetFirstNamePossessiveNoTooltip]如何乐观，[native_leader.GetFirstNameNoTooltip]似乎对和平不感兴趣。当[leader.GetFirstNameNoTooltip]第一次试图接近[native_leader.GetFirstNamePossessiveNoTooltip]的营地时，外乡人大举进攻，死伤不少。\n\n最终，[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员不得不退到船上落魄而逃。然而，[leader.GetFirstNameNoTooltip]想知道，在不同的情况下，他们是否能与外乡人建立和平。"
 north_atlantic.0061.a:0 "[native_leader.GetFirstNameNoTooltip]看起来是个不错的[native_leader.GetWomanMan]！"
 north_atlantic.0061.b:0 "[leader.GetFirstNamePossessiveNoTooltip]的愚蠢想法！！"
 north_atlantic.0062.t:0 "远征：战斗"
 north_atlantic.0062.desc.kidnap_battle:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说正如[leader.GetFirstName]所预料的那样，在[leader.GetSheHe]指示[leader.GetHerHis]船员建立临时防御设施后不久，外乡人就发动了攻击。一场大战发生了，尽管[native_leader.GetFirstNamePossessiveNoTooltip]战士们非常勇敢和凶猛，但[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]船员还是取得了胜利。\n\n有趣的是，在战斗结束后，当[captive.GetSheHe]试图与其他外国人一起逃跑时，他们成功地抓到了[native_leader.GetFirstNamePossessiveNoTooltip]营地的一名成员。\n\n[captive.GetFirstName]，这个俘虏称[captive.GetHerselfHimself]，显然对这种情况不太满意，但似乎对[captive.GetHerHis]的命运心有不甘。[leader.GetFirstNameNoTooltip]认为，无论如何，把这个外乡人留在身边可能是有用的。[leader.GetSheHe|U]告诉我，探险队回来后，[leader.GetSheHe]会把我介绍给[captive.GetFirstNameNoTooltip]。"
 north_atlantic.0062.desc.loot_battle:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说[leader.GetSheHe]指示[leader.GetHerHis]船员建立临时防御设施后不久，外乡人就发动了攻击。一场大战发生了，尽管[native_leader.GetFirstNamePossessiveNoTooltip]的战士们非常勇敢和凶猛，但[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员还是取得了胜利。\n\n在战斗结束后，[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员从死去的战士尸体上拿走了一些物品，以及幸存下来的人在撤退时遗留的东西。这些饰品并不都是有用的，但其中一些似乎有实用价值，或者至少作为战争战利品会很好看。"
 north_atlantic.0062.desc.no_battle:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说关于外乡人会回来攻击他们的说法是完全错误的。[leader.GetSheHe|U]和[leader.GetHerHis]的船员们等了好几天，都没有人过来。\n\n[leader.GetFirstNameNoTooltip]承认对这个结果松了一口气，但想知道那些外乡人是怎么回事，他们是不是很胆小？害怕战斗？还是说他们认为[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]船员很弱，不值得战斗？他们是回到他们的国王或其他地方的酋长那里汇报情况吗？还是出现了其他情况？\n\n也许我们永远不会知道。不过无论如何，[leader.GetFirstNameNoTooltip]还是能够和平地离开这个地区。"
 north_atlantic.0062.desc.defeat:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，正如[leader.GetFirstName]预测的那样，在[leader.GetSheHe]指示[leader.GetHerHis]船员建立临时防御设施后不久，外乡人就发动了攻击。一场大战发生了，尽管[leader.GetFirstNameNoTooltip]船员有勇敢无畏，但[native_leader.GetFirstNamePossessiveNoTooltip]战士们更胜一筹。\n\n最终，[leader.GetFirstNameNoTooltip]不得不下令撤退，在慌乱中他们都冲回自己的船，离开了这个地区。伤亡人数不少，但[leader.GetFirstNameNoTooltip]在[leader.GetHerHis]的信中向我保证，探险队#italic 将会#!继续探索。"
 north_atlantic.0062.a:0 "[leader.GetFirstNameNoTooltip]的卓越领导！"
 north_atlantic.0062.b:0 "这当然不是这次事件最糟糕的结果。"
 north_atlantic.0062.c:0 "$north_atlantic.0061.b$"
 north_atlantic.0063.t:0 "远征：突袭"
 north_atlantic.0063.desc.kidnap_raid:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说道[leader.GetFirstNamePossessive]对[native_leader.GetFirstNamePossessive]营地的突袭很顺利！虽然[leader.GetSheHe|U]和[leader.GetHerHis]的队员们引起了不小的骚动，但是外乡人措手不及，他们杀了不少人，并从营地掠夺了许多物品，然后匆匆回到了自己的船上。\n\n更令人惊讶的是，[leader.GetFirstNameNoTooltip]在混乱中成功抓获了[native_leader.GetFirstNamePossessiveNoTooltip]营地的一名成员。\n\n[captive.GetFirstName]，这个俘虏称[captive.GetHerselfHimself]，显然对这种情况不太满意，但似乎对[leader.GetHerHis]的命运心有不甘。[leader.GetFirstNameNoTooltip]认为，无论如何，把这个外乡人留在身边可能是有用的。[leader.GetSheHe]信上告诉我，探险队回来后，[leader.GetSheHe]会把[captive.GetFirstNameNoTooltip]介绍给我。"
 north_atlantic.0063.desc.loot_raid:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说道[leader.GetFirstNamePossessive]对[native_leader.GetFirstNamePossessive]营地的突袭很顺利！虽然[leader.GetSheHe|U]和[leader.GetHerHis]的队员们引起了不小的骚动，但是外乡人措手不及，他们杀了不少人并从营地掠夺了许多物品，然后匆匆回到了自己的船上。\n\n总的来说，[leader.GetFirstNameNoTooltip]信上说他们得到了相当多的战利品，[leader.GetSheHe]急于在探险队返回时向我展示这些。"
 north_atlantic.0063.desc.caught:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说[leader.GetFirstNamePossessive]对[native_leader.GetFirstNamePossessive]营地的突袭进行得很糟糕。看来[native_leader.GetFirstNamePossessiveNoTooltip]的战士们显然很有经验，也很狡猾，因为一旦警报响起，他们就能迅速地集结起来，进行反击，尽管被打得措手不及。\n\n[leader.GetFirstNameNoTooltip]幸好反应迅速，立即命令[leader.GetHerHis]船员有秩序地撤退。此外，外国战士并没有追击太远，所以伤亡很小。"
 north_atlantic.0063.desc.counterambush:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说[leader.GetFirstNamePossessive]对[native_leader.GetFirstNamePossessive]营地的突袭进行得很糟糕。[native_leader.GetFirstNameNoTooltip]一定是预料到了一场伏击，因为[native_leader.GetSheHe]已经在[native_leader.GetHerHis]营地准备了一场反伏击\n\n[leader.GetFirstNameNoTooltip]偶然发现了看似无人看守的营地，并开始抢掠，却不料被凶残的外国战士包围。一场大战接踵而至，虽然[leader.GetFirstNameNoTooltip]和许多[leader.GetHerHis]船员成功逃脱，但他们确实遭受了一些伤亡。"
 north_atlantic.0063.desc.abandoned:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说[leader.GetFirstNamePossessive]对[native_leader.GetFirstNamePossessive]营地的突袭是......嗯，结果是什么都没发生。虽然他们确实找到并到达了营地，但没有人在那里。\n\n起初，[leader.GetFirstNameNoTooltip]担心[native_leader.GetFirstNameNoTooltip]得到他们突袭的消息。[leader.GetSheHe|U]急忙派一些船员重新侦察该地区，但他们没有发现[native_leader.GetFirstNameNoTooltip]。仿佛他们都起身离开了。这些外乡人是否害怕[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员？还是他们只是谨慎行事？这就很难说了...\n\n不管怎么说，在放弃营地后，这些外国人并没有在那里留下什么，所以没有什么东西可以让[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]队员们去搜索。不过，[leader.GetFirstNameNoTooltip]还是对这个结果感到欣慰...毕竟它的结局可能会更糟"
 north_atlantic.0063.a:0 "这是一次令人印象深刻和大胆的突袭行动！"
 north_atlantic.0063.b:0 "$north_atlantic.0062.b$"
 north_atlantic.0063.c:0 "$north_atlantic.0061.b$"
 north_atlantic.0064.t:0 "远征：被遗弃的村庄"
 north_atlantic.0064.desc:0 "今天收到[leader.GetFirstNameNoTooltip]的信件，上面说探险队在一个海滩上登陆了，几个队员在[leader.GetFirstNameNoTooltip]的带领下，冒险到内陆去探索这个地区。\n\n队伍没走多远就发现了一些有趣的东西：几个形状奇怪的建筑，由木头和兽皮制成。毫无疑问，这是某种村庄。然而没有人在里面，看来这个村庄在一段时间前就被遗弃了。\n\n[leader.GetFirstNameNoTooltip]与[leader.GetHerHis]的队员们争论着，是出于谨慎而撤退，还是在离开之前带走并寻找任何看起来有价值的东西。我想知道[leader.GetSheHe]接下来做了什么？"
 north_atlantic.0064.a:0 "我的直觉是，[leader.GetFirstNameNoTooltip]肯定是会为了安全而撤退。"
 north_atlantic.0064.b:0 "我相信[leader.GetFirstNameNoTooltip]找到任何看起来有用的东西。"
 north_atlantic.0064.c:0 "也许[leader.GetFirstNameNoTooltip]等着看是否有当地人出现？"
 north_atlantic.0064.return:0 "该村的人返回了"
 north_atlantic.0064.empty:0 "该村确实无人居住"
 north_atlantic.0064.b.success.battle_victory:0 "一场战斗接踵而至，但[leader.GetFirstNameNoTooltip]取得了胜利。"
 north_atlantic.0064.b.failure.battle_defeat:0 "一场战斗接踵而至，不过[leader.GetFirstNameNoTooltip]失败了。"
 north_atlantic.0064.b.failure.useless:0 "信上说村子里没有什么值得掠夺的东西"
 north_atlantic.0064.b.success.useful:0 "信上说村里有很多有用的战利品"
 north_atlantic.0064.c.failure.no_trade:0 "信上说村里的人对与[leader.GetFirstNameNoTooltip]交易不感兴趣。"
 north_atlantic.0064.c.success.trade:0 "信上说村里的人对与[leader.GetFirstNameNoTooltip]交易很感兴趣。"
 north_atlantic.0064.c.failure.useless:0 "$north_atlantic.0064.b.failure.useless$"
 north_atlantic.0064.c.success.useful:0 "$north_atlantic.0064.b.success.useful$"
 north_atlantic.0065.t:0 "远征：战斗"
 north_atlantic.0065.desc.battle_defeat:0 "这封信上说[leader.GetFirstName]和[leader.GetHerHis]船员认为这个村子里确实没有人了，所以他们开始在村子里搜寻任何好的战利品，以便带回到船上去。然而没过多久，他们就听到了奇怪的声音，是村子里的居民回来了！\n\n总之，当地人看到人们洗劫他们的建筑物，当然相当愤怒，开始大声喊叫，[leader.GetFirstNameNoTooltip]相信他听到了这个村子的领袖的名字，[native_leader.GetFirstName]。\n\n然后不出意外的一场战斗发生了。不幸的是，这些当地人是相当凶猛的战士。在付出了一些伤亡之后，[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的队员们不得不撤退。"
 north_atlantic.0065.desc.battle_victory:0 "这封信上说[leader.GetFirstName]和[leader.GetHerHis]船员认为这个村子里确实没有人了，所以他们开始在村子里搜寻任何好的战利品，以便带回到船上去。然而没过多久，他们就听到了奇怪的声音，是村子里的居民回来了！\n\n总之，当地人看到人们洗劫他们的建筑物，当然相当愤怒，开始大声喊叫，[leader.GetFirstNameNoTooltip]相信他听到了这个村子的领袖的名字，[native_leader.GetFirstNameNoTooltip]。\n\n然后不出意外的一场战斗发生了。幸运的是，这些当地人打不过[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的队员们，没多久就撤退了，探险队匆匆搜索后也回到船上。"
 north_atlantic.0065.a:0 "[leader.GetFirstNameNoTooltip]干得好！！"
 north_atlantic.0065.b:0 "那些外国战士听起来像是一群强悍的人。"
 north_atlantic.0066.t:0 "远征：被遗弃的村庄"
 north_atlantic.0066.desc.no_wait_text:0 "这封信上说[leader.GetFirstName]和[leader.GetHerHis]船员认为这个村子里确实没有人了，所以他们开始在村子里搜寻任何有价值的东西，以便带回去上船。"
 north_atlantic.0066.desc.wait_text:0 "这封信上说[leader.GetFirstName]和[leader.GetHerHis]的船员们等了很久都没有人，他们起先的怀疑被证明是正确的。这里是被遗弃的，所以他们开始在村子里搜寻任何有价值的东西，以便带回去上船。"
 north_atlantic.0066.desc.useless_text:0 "村子里没有多少有用的物品，[leader.GetFirstNameNoTooltip]推测村民们在放弃村子的时候，一定是带走了任何值得带走的物品，船员们白白浪费了大量的时间和精力，因此有点士气低落。\n\n在[leader.GetHerHis]信上的最后的话，[leader.GetFirstNameNoTooltip]想知道为什么这个村庄会被遗弃。他们是被敌人赶走了吗？他们是在寻找更好的土地来生活吗？这到底是不是一次临时性的迁移？也许我们将永远不会知道。"
 north_atlantic.0066.desc.useful_text:0 "这个被遗弃的村庄充满了有用的物品，包括各种工具、木材、武器，以及一些看似珍贵的小饰品和装饰品。队员们最后花了不少时间把村子洗劫一空。\n\n[leader.GetFirstNameNoTooltip]在信里不停地炫耀这个成果，并称[leader.GetSheHe|U]已让船员们将尽可能多的东西装到船上。"
 north_atlantic.0066.desc.useless_no_wait:0 "$north_atlantic.0066.desc.no_wait_text$\n\n$north_atlantic.0066.desc.useless_text$"
 north_atlantic.0066.desc.useless_wait:0 "$north_atlantic.0066.desc.wait_text$\n\n$north_atlantic.0066.desc.useless_text$"
 north_atlantic.0066.desc.useful_no_wait:0 "$north_atlantic.0066.desc.no_wait_text$\n\n$north_atlantic.0066.desc.useful_text$"
 north_atlantic.0066.desc.useful_wait:0 "$north_atlantic.0066.desc.wait_text$\n\n$north_atlantic.0066.desc.useful_text$"
 north_atlantic.0066.a:0 "这么好的一个村怎么会没人呢？"
 north_atlantic.0066.b:0 "看来，远征队在那里浪费了很多时间。"
 north_atlantic.0067.t:0 "远征：毕竟没有被遗弃"
 north_atlantic.0067.desc.no_trade:0 "这封信上说[leader.GetFirstName]怀疑周围还有人，并告诉[leader.GetHerHis]船员要有耐心。他们在安全距离上等待和观察，以免引起任何误解。\n\n一段时间后，事实证明[leader.GetFirstNamePossessive]的预感是正确的！ 村里的居民回来了，[leader.GetFirstNameNoTooltip]出去迎接他们了。尽管语言不通，[leader.GetSheHe]还是设法了解到这些人是[native_leader.GetCulture.GetName]人的一个部落，由[native_leader.GetFirstName]统治和领导。\n\n双方交谈了一会儿，虽然[native_leader.GetFirstNameNoTooltip]和[native_leader.GetHerHis]人没有敌意，但似乎他们也很谨慎，对贸易不感兴趣。[leader.GetFirstNameNoTooltip]和[leader.GetHerHis]的船员不得不空手而归，他们漫长的等待全部白费。"
 north_atlantic.0067.desc.trade:0 "这封信上说[leader.GetFirstName]怀疑周围还有人，并告诉[leader.GetHerHis]船员要有耐心。他们在安全距离上等待和观察，以免引起任何误解。\n\n一段时间后，事实证明[leader.GetFirstNamePossessive]的预感是正确的！ 村里的居民回来了，[leader.GetFirstNameNoTooltip]出去迎接他们了。尽管语言不通，[leader.GetSheHe]还是设法了解到这些人是[native_leader.GetCulture.GetName]人的一个部落，由[native_leader.GetFirstName]统治和领导。\n\n双方交谈了一会儿，似乎这些[native_leader.GetCulture.GetCollectiveNoun]很感激[leader.GetFirstNameNoTooltip]没有偷窃还等待他们回来。双方同意进行一些商品交换。对[leader.GetFirstNameNoTooltip]来说，这种等待是值得的。"
 north_atlantic.0067.a:0 "好在外乡人都很友好！"
 north_atlantic.0067.b:0 "至少这些外乡人没有敌意。"
 north_atlantic.0068.t:0 "远征：好木材"
 north_atlantic.0068.desc:0 "马克兰因其丰富的木材木材而闻名，这可以说是我们当初派出探险队的主要原因。\n\n总之，[leader.GetFirstNameNoTooltip]信上说[leader.GetSheHe]在马克兰发现了一个森林茂密的地方。[leader.GetSheHe|U]和[leader.GetHerHis]的队员将在那里花几个星期的时间，砍伐树木带回格陵兰。这些木材将对格陵兰的定居点有很大的用处。"
 north_atlantic.0068.a:0 "这就是为什么他们被派往马克兰的原因！"
 north_atlantic.0069.t:0 "远征：劣质木材"
 north_atlantic.0069.desc:0 "马克兰因其丰富的木材木材而闻名，这可以说是我们当初派出探险队的主要原因。\n\n总之，[leader.GetFirstNameNoTooltip]信上说[leader.GetSheHe]在马克兰发现了一个森林茂密的地方。[leader.GetSheHe|U]和[leader.GetHerHis]的队员砍掉一些树后，他们发现这些木材的质量相当差。而且整个地区缺乏像样的木材，所以他们最终白白浪费了很多时间。"
 north_atlantic.0069.a:0 "也许他们会在马克兰的其他地方找到更好的木材"
 north_atlantic.0070.t:0 "远征：旧伐木场"
 north_atlantic.0070.desc:0 "马克兰意为“森林之地”，所以来自格陵兰的人偶尔会到这个地区寻找木材，这并不奇怪。\n\n在[leader.GetHerHis]信中说，[leader.GetFirstNameNoTooltip]他们遇到了一个伐木营地的遗迹，他们发现遗迹风格是一段时间前来自格陵兰或欧洲的探险队建造的。\n\n[leader.GetFirstNameNoTooltip]解释说，这是相当幸运的，因为这意味着[leader.GetSheHe]和[leader.GetHerHis]船员可以利用剩余的工具和物资来寻找和获得木材。这将为他们节省宝贵的时间和资源，使他们能够更有效地收获附近的木材。"
 north_atlantic.0070.a:0 "极好的发现！"
 north_atlantic.0071.t:0 "远征：伐木事故"
 north_atlantic.0071.desc:0 "马克兰意为“森林之地”，所以来自格陵兰的人偶尔会到这个地区寻找木材，这并不奇怪。\n\n在[leader.GetHerHis]信中，说道[leader.GetFirstNameNoTooltip]他们正在森林海岸线上进行例行的木材采伐，然后灾难发生了。\n\n在砍伐一棵树时，探险队的一些成员这颗树木倒在他们身上而受伤或死亡。这对整个探险队造成严重干扰，因为[leader.GetFirstNameNoTooltip]不得不拿出人力和物力来照顾伤员。"
 north_atlantic.0071.a:0 "难道是[ROOT.Char.GetFaith.DevilName]做的吗？"
 north_atlantic.0072.t:0 "远征：正确的路线"
 north_atlantic.0072.desc:0 "格陵兰的木材有很大一部分来自漂流木或欧洲出口的木材，但有时也来自马克兰岛。事实上这并不是我们第一次对马克兰的探查。\n\n[leader.GetFirstNameNoTooltip]信上说，在[leader.GetSheHe]离开之前，[leader.GetSheHe]从几个老水手那里获得了一些关于在马克兰可以找到高质量木材的信息。利用这些信息，[leader.GetFirstNameNoTooltip]能够找到一个充满优质木材的区域，而现在[leader.GetSheHe]现在正在采伐。"
 north_atlantic.0072.a:0 "很高兴听到一切进展顺利！"
 north_atlantic.0073.t:0 "远征：错误的路线？"
 north_atlantic.0073.desc:0 "格陵兰的木材有很大一部分来自漂流木或欧洲出口的木材，但有时也来自马克兰岛。事实上这并不是我们第一次对马克兰的探查。\n\n[leader.GetFirstNameNoTooltip]信上说，在[leader.GetSheHe]离开之前，[leader.GetSheHe]从几个老水手那里获得了一些关于在马克兰可以找到高质量木材的信息。不幸的是要么这些信息是错误的，要么是[leader.GetFirstNameNoTooltip]误解了它们，因为信上[leader.GetSheHe]承认他们徘徊了很长一段时间，试图找到这个地点，但没有结果。\n\n最终[leader.GetFirstNameNoTooltip]放弃寻找。但[leader.GetSheHe|U]向我保证，无论如何，探险队都会继续。"
 north_atlantic.0073.a:0 "多么的不幸。"
 north_atlantic.0074.t:0 "远征：传说中的地点"
 north_atlantic.0074.desc:0 "在探险过程中，[leader.GetFirstNameNoTooltip]的信上说他们被#italic slightly#!吹偏了方向，起初飘到了一个似乎是未知的海岸附近。然而大家很快就开始认识到这些特征，因为它们与一个关于早期探险家航行的传说中提到的地点描述相吻合。\n\n因为传说中关于这个地区的情况有些模糊，[leader.GetFirstNameNoTooltip]认为这是一个很好的机会，可以确定传说中的地理细节是否准确，绘制出这个地区的地图，帮助未来的水手和探险家在这个地区旅行，不过也许[leader.GetSheHe]可能不会发现什么新的东西，但这个传说显然足以驱动他们在这个地区航行。"
 north_atlantic.0074.a:0 "我猜[leader.GetSheHe]会继续前行不会浪费时间"
 north_atlantic.0074.b:0 "我猜[leader.GetSheHe]肯定会调查完那个地区"
 north_atlantic.0074.b.failure.no_info:0 "最终[leader.GetFirstNameNoTooltip]没有发现任何有用的新信息，并且浪费了许多[greenland_expedition_s|E]资源。"
 north_atlantic.0074.b.success.new_info:0 "[leader.GetFirstNameNoTooltip]发现了有用的新线索，扩展了前人的信息。"
 north_atlantic.0075.t:0 "远征：传说中的地点"
 north_atlantic.0075.desc.no_info:0 "在花了几个星期调查该地区后，[leader.GetFirstNameNoTooltip]得出结论，传说实际上是相当准确并不缺乏任何细节。换句话说，[leader.GetSheHe]和船员们浪费了大量的时间和精力来重复勘测一些本来不需要勘测的地点。\n\n[leader.GetFirstNameNoTooltip]信上辩称至少验证了传说中的细节是准确的。"
 north_atlantic.0075.desc.new_info:0 "在花了几个星期调查这个地区后，[leader.GetFirstNameNoTooltip]发现传说并不准确（不过他们当初就是这样认识这个地区的地理环境的），而且它缺少一些其他信息。也许以前的探险家并没有太深入地涉足这一地区，或者由于传说中的某些部分比较模糊，某些细节被遗漏了。\n\n[leader.GetFirstNameNoTooltip]和船员们仔细记录了该地区的地理环境和其他细节，如生活在那里的野生动物和植物。[leader.GetHerHis]希望他们的发现能够补充传说中已经发现的信息。"
 north_atlantic.0075.a:0 "探索这片区域的工作做得很棒！"
 north_atlantic.0075.b:0 "真是浪费时间！"
