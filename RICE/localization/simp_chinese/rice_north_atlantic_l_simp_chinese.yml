 RICE_north_atlantic_support_greenland_confirm:0 "让我们一起帮助格陵兰定居点！"
 RICE_north_atlantic_support_greenland_context_tooltip:0 "#emphasis 历史背景：#!从10世纪末到15世纪初，格陵兰岛是旧世界的北部和西部边疆。尽管地处偏远，但格陵兰岛上的北欧定居点与欧亚大陆的其他地区保持着重要的联系，从海象象牙、北极熊皮、独角鲸牙等出口到欧洲的贸易中心，到教会任命的在格陵兰岛服侍信徒的主教。这些联系有助于格陵兰岛与欧亚大陆保持沟通和参与其事务。"
