 innovation_RICE_skiing:0 "滑雪板"
 innovation_RICE_skiing_desc:0 "滑雪板是用来在雪地和冰面上滑行的窄木条，在冬季或冰雪较多的寒冷地区，常用于旅行和交通。"
 building_type_RICE_north_atlantic_hekla:0 "赫克拉火山"
 building_type_RICE_north_atlantic_hekla_desc:0 "赫克拉火山因其频繁的喷发和滚滚熔岩而声名狼藉。人们因其恐怖景象而赋予它“地狱之门”的别称，许多信徒坚信这正是通往地狱的入口。在基督教传说中，背叛耶稣的加略人犹大被永远囚禁在这座火山之下，受尽永恒的折磨。"
