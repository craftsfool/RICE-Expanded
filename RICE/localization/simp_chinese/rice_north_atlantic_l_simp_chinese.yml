 north_atlantic.0250.desc:0 "你会如愿以偿："
 north_atlantic.0250.a:0 "从今往后，你再也见不到你的家了。"
 north_atlantic.0251.desc:0 "我拒绝你可笑的要求！"
 north_atlantic.0251.a:0 "这个固执的傻瓜拒绝了我的好意！"
 north_atlantic.0252.desc:0 "经过多次祈祷和深思熟虑，我决定同意这一决定，尽管做出这个选择绝非易事。"
 north_atlantic.0252.a:0 "我希望[recipient.GetHerHis]一切顺利。"
 north_atlantic.0253.desc:0 "经过深思熟虑，我决定拒绝你的请求。"
 north_atlantic.0253.a:0 "很不幸，但我可以理解。"
