 north_atlantic.0180.t:0 "捕鲸人出发"
 north_atlantic.0180.desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]世代以来一直在猎杀鲸鱼。\n\n即使是像我这样伟大的[ROOT.Char.GetTitleAsNameNoTooltip]，也意识到捕鲸业潜在的利润，即使是有风险的。因此我决定赞助一些捕鲸者去寻找和猎杀鲸鱼，而他们利润的很大一部分将归我所有。一些捕鲸者喜欢出海，在那里捕鲸，而另一些捕鲸者则坚持引诱到沿海地区，在那里可以捕鲸。\n\n当然我应该管理我的期望，因为不是每次狩猎都能成功返回，不过我有信心，我所雇用的捕鲸者会做得更多，而且是可以接受的工作。"
 north_atlantic.0180.a:0 "好运连连！"
 north_atlantic.0181.t:0 "捕鲸人归来"
 north_atlantic.0181.desc:0 "我最近派去捕鲸的[ROOT.Char.GetCulture.GetName]捕鲸人已经回来了\n\n"
 north_atlantic.0181.desc.fail:0 "唉，看来这些捕鲸人失败了，他们没有办法杀死任何鲸鱼！我对这个结果失望至极，但这也不是没有先例。我只希望下次雇用的捕鲸者能更幸运......或者更有能力吧。"
 north_atlantic.0181.desc.success:0 "值得庆幸的是，这些捕鲸者成功地捕杀了一些鲸鱼。一旦我们与附近的商人取得联系，我们就可以把肉和鲸脂卖掉换成钱，总之捕鲸者完成任务时，我会评估我们将从他们的杀戮中获得多少利润\n\n"
 north_atlantic.0181.desc.low:0 "不幸的是，虽然捕鲸者确实设法杀死了几头鲸鱼，但数量很少，仅够出海费用，不足以带来丰厚的利润。\n\n不过事情可能会更糟！至少我们从中得到了一些东西！而不是一无所获！"
 north_atlantic.0181.desc.medium:0 "捕鲸者们成功地杀死许多鲸鱼，不光保本，我们还赚了相当可观的利润！\n\n我还能抱怨什么呢？真高兴我找到了一支有能力的捕鲸队！"
 north_atlantic.0181.desc.high:0 "捕鲸者们成功地捕杀了大量的鲸鱼！！我们不仅收回了整个行程的成本，而且还赚了一大笔钱！\n\n我期待着将来有可能再次与他们合作！"
 north_atlantic.0181.a.failure:0 "也许我们下次会做得更好……"
 north_atlantic.0181.a.low:0 "我们就用抓到的东西凑合一下。"
 north_atlantic.0181.a.medium:0 "捕鲸者的工作非常出色。"
 north_atlantic.0181.a.high:0 "一个非常值得称赞的结果！"
 north_atlantic.0182.t:0 "捕鲸镇的税收豁免"
 north_atlantic.0182.desc.culture:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]人有悠久的捕鲸历史，世界各地的人们都非常尊重我们，因为我们有能力捕猎鲸鱼并从中获利。"
 north_atlantic.0182.desc.not_culture:0 "在我的领土上生活着相当多的[culture.GetCollectiveNoun]人。他们有着悠久的捕鲸历史，并因其捕杀鲸鱼并从中获利的能力而在全世界受到极大的尊重。"
 north_atlantic.0182.desc:0 "\n\n在我的领土里有一些沿海城镇在很大程度上参与捕鲸，它们贡献了很多税收。\n\n从今天起，我将暂时免除这些捕鲸镇的税收，并且还将给予他们其他特权。我希望这些措施将支持这些城镇的经济增长，并确保捕鲸业的繁荣。"
 north_atlantic.0182.a:0 "我相信捕鲸城镇会对此感激涕零。"
 north_atlantic.0183.t:0 "向捕鲸镇征收额外税款"
 north_atlantic.0183.desc.culture:0 "$north_atlantic.0182.desc.culture$"
 north_atlantic.0183.desc.not_culture:0 "$north_atlantic.0182.desc.not_culture$"
 north_atlantic.0183.desc:0 "\n\n在我的领土里有一些沿海城镇在很大程度上参与捕鲸，它们贡献了很多税收。\n\n从今天起，我将对这些捕鲸镇征收额外的税收。他们已经从捕鲸中获得了巨大的利润，所以他们付出更多才是公平的。"
 north_atlantic.0183.a:0 "国库将变得充实！"
