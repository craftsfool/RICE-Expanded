 north_atlantic.0120.t:0 "海象狩猎！"
 north_atlantic.0120.desc:0 "每年夏季，格陵兰定居点的人们都会乘船前往诺塞图尔去猎杀海象被，因此也是格陵兰财富的一个重要来源。\n\n今年我指示我在格陵兰的庄园在诺塞图尔组织一次这样的狩猎。他们需要一些时间，但应该在夏季之前完成，那时狩猎开始，狩猎队从格陵兰岛的定居点出发前往北方。"
 north_atlantic.0120.a:0 "愿[ROOT.Char.GetFaith.WaterGodName]会保护这些人。"
 north_atlantic.0120.a.tooltip:0 "狩猎之旅将在8月底左右返回，我们只能希望他们能成功返回，并带着许多海象的獠牙。"
 north_atlantic.0121.t:0 "海象狩猎：灾难！"
 north_atlantic.0121.desc:0 "一个可怕的消息！由于不可预见的情况，我们组织的诺塞图尔狩猎之旅 提前结束。"
 north_atlantic.0121.desc.attack:0 "\n\n狩猎队遭到了一队陌生战士的袭击。根据幸存者的叙述，他们无法判断这些人是住在附近的当地人，还是从很远的地方来的狩猎队，因为他们也是为了猎取海象而来到这里。\n\n不管怎么说，双方第一次见面时，气氛有些紧张，在一系列误解和争吵后，爆发了一场战斗。不幸的是我的狩猎队输了，而且由于死了很多人，他们不得不撤退到格陵兰定居点。"
 north_atlantic.0121.desc.heavy_storm:0 "\n\n这两艘船在风暴中被卷入然后沉没了，没有幸存者，几天后我的狩猎队的沉船和一些尸体被另一个来自格陵兰的狩猎队发现，他们随后向我的庄园报告了这一悲剧。"
 north_atlantic.0121.desc.mild_storm:0 "\n\n这两艘船在风暴中被卷入然后沉没了，但是有少数幸存者！（也许是由于[ROOT.Char.GetFaith.HighGodName]的干预和仁慈），随后被另一个来自格陵兰岛的狩猎队发现。这些幸存者救起返回格陵兰报告了他们的同伴和船只的悲惨命运。"
 north_atlantic.0121.desc.rescue_storm:0 "\n\n\n这两艘船在风暴中被卷入，它们沉没了。一些船员活了下来，但他们以为自己会屈服于大自然，直到他们遇到了一群穿着不寻常、语言奇怪的人。很难说这些陌生人是住在附近的当地人，还是从遥远的地方来的人，他们也是来诺德塞图尔猎取海象的。\n\n我们担心最坏的情况，但是当这些怪异的人在一个名为[native_leader.GetFirstName]的[native_leader.GetWomanMan]带领下，在临别前给他们提供食物和补给时，他们感到很惊讶。这足以帮助他们生存下去，直到另一支来自格陵兰岛的狩猎队找到他们。\n\n虽然我的人被这些富有同情心的陌生人所救，但我仍然失去了许多其他的船员和船支。"
 north_atlantic.0121.desc.kaboom:0 "\n\n不管是由于意外还是缺乏经验，这些船的船员似乎遭遇灾难。值得庆幸的是，很大一部分人都活了下来，而且他们还能收回一些物资。\n\n然而船只在海上迷失了方向，我的人被迫在附近的一个狩猎站躲歇息了几天，直到另一支狩猎队路过并将他们带走。我雇佣的人对所发生的事情深感羞愧，但我们现在也无能为力。"
 north_atlantic.0121.desc.supplies:0 "\n\n狩猎队领导人错误地估算所需要的食物数量。随着供应的减少，他们开始配给食物，直到不剩任何食物。结果半路上他们不得不掉头返回格陵兰。"
 north_atlantic.0121.desc.deaths:0 "\n\n狩猎最初很顺利。然而在狩猎过程中，一系列意外导致狩猎队中的许多人都死了。有些人死于狂暴的海象口中，有些人在猎场附近航行时溺水而亡，还有一些人死于疾病。\n\n最后船员的减少，让领导人意识到继续狩猎是毫无意义的，他们别无选择，只能空手返回格陵兰。"
 north_atlantic.0121.desc.fled:0 "\n这对我来说是一场灾难，但对船员来说不是，我们雇用的许多人实际上都是些恶棍！他们并不打算真的去猎取海象！他们拿着我们提供的钱和物资，然后扬长而去，估计是去了欧洲或地中海的其他地方！！我找不到他们！！\n\n看来我是被骗了！这些该死的骗子可能在任何地方！"
 north_atlantic.0121.a:0 "这真是太不幸了!"
 north_atlantic.0121.tooltip.hunt_ends:0 "你组织的[nordsetur|E]狩猎之旅提前结束了"
 north_atlantic.0121.tooltip.decrease_resilience:0 "[greenlands|E][greenland_resilience|E]减少#V [THIS.Char.MakeScope.Var('RICE_resilience_value_temp').GetValue]#!到@RICE_greenland_resilience_icon!#V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0122.t:0 "海象狩猎：返回"
 north_atlantic.0122.desc:0 "我收到了来自格陵兰族庄园的报告：我们组织的狩猎之旅已经带海象牙回来了\n\n最大的问题是，我们在这项工作中的投资是否取得了合理的回报。总之根据狩猎的结果，我们雇佣的猎人已经收集了足够的海象牙，可以以[gold_i|E]#V [ROOT.Char.MakeScope.Var('RICE_walrus_hunt_gold_gain_value').GetValue]#!卖给整个北大西洋市场和港口的各种商人。"
 north_atlantic.0122.desc.extras:0 "\n\n此外，报告中提到了一些我应当知道的狩猎之旅中发生的有趣的事情。"
 north_atlantic.0122.desc.no_extras:0 "\n\n狩猎过程中没有发生其他值得注意的事件，现在猎人已经恢复了在格陵兰的正常生活。"
 north_atlantic.0122.a:0 "是时候从这些海象牙中赚钱了！"
 north_atlantic.0122.a.extra:0 "哦？ 这次旅行还发生了什么？"
 north_atlantic.0122.tooltip.hunt_ends:0 "你组织的[nordsetur|E]狩猎之旅结束了"
 north_atlantic.0123.t:0 "海象狩猎：准备工作"
 north_atlantic.0123.desc:0 "每年成群结队的格陵兰人航行到诺塞图尔猎杀海象，因此它是格陵兰的一个重要财富来源。\n\n今年我打算在格陵兰庄园组织一次诺塞图尔猎狩猎。他们需要一些时间准备，但应该在夏季之前完成，那时狩猎开始，狩猎队从格陵兰岛的定居点出发前往北方。"
 north_atlantic.0123.a:0 "我想看看这次狩猎的成果。"
 north_atlantic.0123.a.tooltip:0 "你的[greenland_estate_long|E]将组织一支前往[nordsetur|E]的狩猎队，将于6月出发。"
 north_atlantic.0124.t:0 "海象狩猎：友好的外乡人"
 north_atlantic.0124.desc:0 "在从事寻找和狩猎海象的任务时，我的狩猎队似乎遇到了一群奇怪的外乡人，他们也在那里狩猎，由[native_leader.GetFirstName]带领，也许他们就住在附近，也许他们也从遥远的地方来到了诺塞图尔。\n\n总之这些外乡人相当友好，[native_leader.GetFirstNameNoTooltip]允许[native_leader.GetHerHis]猎人与我的猎人做一些交易。\n\n这两组人在靠近的地方呆了几天，进行了一些贸易之类的活动，然后这些外乡人就离开了。"
 north_atlantic.0124.a:0 "真是有意思的好人"
 north_atlantic.0124.a.tooltip:0 "[greenlands|E]@RICE_greenland_networks_icon![greenland_networks|E]增加@RICE_greenland_networks_icon!#V 1#!"
 north_atlantic.0125.t:0 "海象狩猎：卑鄙的外乡人"
 north_atlantic.0125.desc:0 "在从事寻找和狩猎海象的任务时，我的狩猎队似乎遇到了一群奇怪的外乡人，他们也在那里狩猎，由[native_leader.GetFirstName]带领，也许他们就住在附近，也许他们也从遥远的地方来到了诺塞图尔。\n\n而且这些外乡人具有敌意，可能是误解了我的猎人的意图，然后两伙人发生了冲突。值得庆幸的是，这场战斗很短暂，在双方撤退之前，伤亡很小。\n\n在这样一片荒凉的土地上遇到敌对的陌生人，一定是很痛苦的事！我的狩猎队虽然损失了一些人，虽然我的狩猎队确实损失了一些物资和几个猎人，但我应该庆幸，这次不幸的遭遇没有进一步升级。"
 north_atlantic.0125.a:0 "希望我们不会再看到这些人。"
 north_atlantic.0125.a.tooltip:0 "[greenlands|E]@RICE_greenland_networks_icon![greenland_networks|E]减少@RICE_greenland_networks_icon!#V 1#!"
 north_atlantic.0126.t:0 "海象狩猎：死亡猎人"
 north_atlantic.0126.desc:0 "在狩猎途中，猎人们遇到了一些令人不安的事情——一个来自格陵兰定居点的狩猎队尸体。\n\n猎人们检查了这些尸体，并确定这些人一定是死于寒冷和缺乏食物。而且他们似乎在我的猎人到达前不久就已经死亡了。可悲的是，在寒冷、荒凉的土地上，这样的遭遇并非没有发生过。\n\n不过，我只能想......如果这些不幸的灵魂能多活一会儿，我的猎人能不能救他们？无论如何，我的猎人决定从尸体上打捞出任何工具、武器和用品，因为死去的猎人显然不需要它们。"
 north_atlantic.0126.a:0 "愿[ROOT.Char.GetFaith.HighGodName]在来世指引他们的灵魂"
 north_atlantic.0126.a.tooltip:0 "[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]减少@RICE_greenland_resilience_icon!#V 1#!"
 north_atlantic.0127.t:0 "海象狩猎：其他猎人"
 north_atlantic.0127.desc:0 "在狩猎途中，猎人们遇到了另一支来自格陵兰的狩猎队。这支狩猎队缺乏物资和食物，许多成员已经死亡。\n\n值得庆幸的是，我自己的队伍有足够的补给和食物，并把另一支队伍的残余人员也带上了。在诺塞图尔狩猎是一件危险的事情，而且这块寒冷、荒凉的地形上，这样的事件并不是没有发生过。\n\n另一个狩猎队的首领，[hunter.GetFirstName]，感谢我的猎人在那里拯救了[hunter.GetHerHis]的生命。[hunter.GetSheHe|U]甚至在他们都从狩猎中回来后，一定要到我的格陵兰岛庄园去拜访，以正式感谢我们。"
 north_atlantic.0127.a:0 "[hunter.GetFirstNameNoTooltip]看着不错，[hunter.GetSheHe]愿意为我效忠吗？"
 north_atlantic.0127.a.success:0 "[hunter.GetFirstNameNoTooltip]加入你的宫廷"
 north_atlantic.0127.a.failure:0 "[hunter.GetFirstNameNoTooltip]没有加入你的宫廷"
 north_atlantic.0127.a.failure.tooltip:0 "虽然对这个提议表示感谢，但[hunter.GetFirstNameNoTooltip]对离开格里兰没有兴趣。"
 north_atlantic.0127.b:0 "多么幸运啊"
 north_atlantic.0128.t:0 "海象狩猎：独角鲸"
 north_atlantic.0128.desc:0 "当我的猎人在追踪海象的时，他们遇到了被冲到海滩上的独角鲸尸体！多么幸运啊！在海里很难捕捉到的神奇生物被我们碰到了\n\n由于独角鲸的稀少，许多人不确定这些生物的性质，然而可以肯定的是，它们的角被认为具有神奇的特性。\n\n独角鲸的角现在在我手中，也许我可以把这个留给自己；另一方面，我可以把它卖掉赚不少钱，尤其是卖给那些愿意花大价钱购买这种奇特产品的远方人。"
 north_atlantic.0128.a:0 "我自己留着。"
 north_atlantic.0128.b:0 "把它卖给商人。"
 north_atlantic.0129.t:0 "海象狩猎：北极熊"
 north_atlantic.0129.desc:0 "猎手们猎杀不仅仅是海象甚至北极熊也可以！今天玩的猎人们就碰到一只北极熊！\n\n杀死这只强大的野兽并非易事，但勇敢、大胆、强大的猎人成功地将其拿下，为自己赢得名声和荣耀。\n\n这头北极熊的皮毛现在在我手里。一方面，我可以把它留给自己。另一方面，北极熊皮在欧洲和其他地区是多么珍贵的奢侈品，也许我可以把它卖掉赚点钱。"
 north_atlantic.0129.a:0 "我不忍心和这么好的毛皮分开！！"
 north_atlantic.0129.b:0 "它很棒，但我宁愿把它卖掉换钱。"
