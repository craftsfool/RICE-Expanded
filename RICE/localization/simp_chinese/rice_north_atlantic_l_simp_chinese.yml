 north_atlantic.0100.t:0 "向格陵兰岛派遣援助"
 north_atlantic.0100.desc:0 "格陵兰岛的定居点又远又小，有时要靠我们这些回到欧洲的人协助他们的行动。所以定居点繁荣离不开我们的帮助，尤其是格陵兰岛的象牙是沿着各种大西洋海上贸易路线交易的重要和宝贵的商品。\n\n"
 north_atlantic.0100.desc.basic_supplies:0 "我已经收集了一批物资送往格陵兰。尽管这只是一批不大的货物，但这些基本的必需品，从食物到工具、原材料和简单的宗教工艺品，无疑仍会得到格陵兰人的感激，因为这将有助于他们的日常生活。"
 north_atlantic.0100.desc.settlers:0 "我因此招募了一些生活在我的领土上的人到格陵兰定居。这些勇敢而坚韧的同胞们可能都是出于不同的原因移民到格陵兰。然而格陵兰定居点的人口已经不多，所以每一个新的定居者都很重要，因为他们的技能和辛勤工作将确保定居点的持续生存。"
 north_atlantic.0100.desc.food:0 "我已经收集了一大批食品和牲畜，准备送往格陵兰。谷物、鱼等食物将帮助格陵兰岛的定居点持续过冬，而牲畜将确保格陵兰人能够在未来几年的农庄中继续生产更多食物。"
 north_atlantic.0100.desc.materials:0 "我已经收集了一大批材料送往格陵兰。从石头到其他金属，它们对格陵兰定居点都有用途，无论是建造新的建筑，修理或锻造新的工具，建造船只等等。从长远来看，这样的援助将对格陵兰人有很大的帮助。"
 north_atlantic.0100.desc.clergy:0 "我招募了一些勇敢的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]前往格陵兰。虽然人数不多，而且这些[ROOT.Char.Custom('DefaultPriestTitlePlural')]都知道他们可能永远不会回到自己的家乡，但对他们来说，冒险的召唤和帮助同胞机会是可遇不可求的。作为我们与格陵兰人保持文化和政治联系的中间人，他们很有勇敢也很有价值。"
 north_atlantic.0100.desc.hunting_stations:0 "我已经派船携带物资和技术工人，打算在格陵兰岛建造几个狩猎站。这些建筑建在格陵兰岛西部海岸线的战略要地，在每年的诺塞图尔海象狩猎中，这些建筑对于提供物资、庇护人员和处理猎物至关重要。"
 north_atlantic.0100.desc.shielings:0 "我已经派船带着物资和熟练的工匠们，打算在格陵兰岛建造船坞。无论它们建在格陵兰的什么地方，这些简陋但重要的船坞都能容纳牲畜（甚至是人），并储存农作物和其他材料，换句话说，船坞是日常生活中必不可少的。"
 north_atlantic.0100.desc.temples:0 "我已经派船带着物资和工匠，打算在格陵兰岛的定居点建造一个[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]。虽然他们可能住在离我们很远的地方，但格陵兰的[ROOT.Char.GetFaith.GetAdherentNamePlural]仍然有精神上的需求，以及向[ROOT.Char.GetFaith.PantheonTerm]祈祷的地方。[ROOT.Char.GetFaith.HouseOfWorshipPlural|U]也作为定居点中心，也进一步提高了格陵兰岛的生活质量。"
 north_atlantic.0100.a:0 "愿这些船安全地驶向格陵兰！"
 north_atlantic.0100.a.tooltip:0 "如果一切顺利，这些船将需要长达几周的时间才能抵达目的地。"
 north_atlantic.0101.t:0 "援助抵达格陵兰"
 north_atlantic.0101.desc:0 "来自格陵兰的好消息！\n\n"
 north_atlantic.0101.desc.basic_supplies:0 "我收到消息，我运往格陵兰岛的那批基本物资已经安全抵达那里。毫无疑问这些物资将对当地人有很大的帮助，希望他们能好好利用这些物资！"
 north_atlantic.0101.desc.settlers:0 "我已经收到消息，我招募到格陵兰岛的定居者已经安全抵达那里。虽然他们可能需要一些时间来适应他们的新家园，但我相信他们肯定可以很好地融入其中。"
 north_atlantic.0101.desc.food:0 "我收到消息，我送往格陵兰的那批食品和牲畜已经安全抵达那里。虽然格陵兰的定居点偏远且恶劣，但是拥有额外的食品和牲畜总是可以在困难年份提供良好的保障。"
 north_atlantic.0101.desc.materials:0 "我已经收到消息，我送去格陵兰的那批材料已经安全抵达那里。虽然格陵兰的定居点偏远且恶劣，但是拥有额外的材料总是可以在困难年份提供良好的保障。"
 north_atlantic.0101.desc.clergy:0 "我收到消息，我招募前往格陵兰岛的[ROOT.Char.Custom('DefaultPriestTitlePlural')]已经安全抵达那里。这些勇敢的灵魂可能要过几年才能回家，也许他们可能永远不会回家。无论如何可以肯定的是格陵兰的[ROOT.Char.GetFaith.GetAdherentNamePlural]将感谢这些[ROOT.Char.Custom('DefaultPriestTitlePlural')]可以为他们提供的指导。"
 north_atlantic.0101.desc.hunting_stations:0 "我收到消息说，随着我运送工匠和物资的船只抵达格陵兰岛，在格陵兰岛西部海岸线上建造几个狩猎站的工作已经开始建造，一旦完成，它们就会在诺塞图尔的海象狩猎中提供帮助。"
 north_atlantic.0101.desc.shielings:0 "我收到消息说，随着我运送工匠和物资的船只抵达格陵兰，已经开始在格陵兰定居点建造几个船坞。一旦完工，当地农民和牧民会发现它们在日常工作中非常有用。"
 north_atlantic.0101.desc.temples:0 "我收到消息，随着我运送工匠和物资的船只抵达格陵兰，在格陵兰定居点建造[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]的工作已经开始。一旦完工，它们将激励和安慰格陵兰的[ROOT.Char.GetFaith.GetAdherentNamePlural]，并为他们提供一个向[ROOT.Char.GetFaith.PantheonTerm]祈祷和聚会的地方。"
 north_atlantic.0101.a:0 "太好了！"
