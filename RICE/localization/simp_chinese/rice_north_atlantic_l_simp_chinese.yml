 activity_RICE_hot_springs_visit_iceland_province_desc:0 "\n#P ++[GetGeographicalRegion('custom_iceland').GetName]上拥有许多[hot_springs|E]，其中一些与冰岛各种传奇故事有关。#!\n\n#italic 与[GetGeographicalRegion('custom_iceland').GetName]以外的正常[hot_springs|E]相比，此地会减少更多的[stress_loss_i|E][stress|E]。如果选择的[barony|E]不是你的[capital|E]，你也会获得更多的[prestige_i|E][prestige|E]#!。"
 RICE_north_atlantic_aspiration_isleifur_desc:0 "\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('d_iceland').GetNameNoTier][ruler|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_iceland').GetNameNoTier]\n$EFFECT_LIST_BULLET$完成$RICE_north_atlantic_skalholt_school$[decision|E]\n$EFFECT_LIST_BULLET$达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L][piety_level|E]或更高\n$EFFECT_LIST_BULLET$保持基督[faith|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$在[GetGeographicalRegion('custom_iceland').GetName]的每个[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$用$RICE_normandy_build_minor_christian_holy_building$[decision|E]，建造一座大教堂（奖励：@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#!）"
 RICE_north_atlantic_historical_aspiration_action_isleifur:0 "#italic 几十年前，冰岛皈依了基督教，但基督教化是一个需要时间的过程。你被任命为冰岛的第一任主教，你希望利用自己所受的教育为冰岛提供所需的精神指导。#!$RICE_north_atlantic_aspiration_isleifur_desc$"
 RICE_north_atlantic_historical_aspiration_modifier_desc_isleifur:0 "[GetModifier('RICE_north_atlantic_aspiration_cultivate_icelands_church').GetNameWithTooltip]"
 RICE_north_atlantic_aspiration_cultivate_icelands_church:0 "[RICE_aspiration|E]：培养冰岛教士"
 RICE_north_atlantic_aspiration_cultivate_icelands_church_desc:0 "#italic 几十年前，冰岛皈依了基督教，但基督教化是一个需要时间的过程。伊斯莱弗·吉苏拉松被任命为冰岛的第一任主教，其希望利用自己所受的教育为冰岛提供所需的精神指导。#!$RICE_north_atlantic_aspiration_isleifur_desc$\n\n"
