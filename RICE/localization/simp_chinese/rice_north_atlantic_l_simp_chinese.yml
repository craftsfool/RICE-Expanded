 RICE_north_atlantic_build_outpost_vinland:0 "试图在文兰建立一个前哨基地"
 RICE_north_atlantic_build_outpost_vinland_desc:0 "对许多人来说，在[vinland|E]建立定居点并不是一个特别有前途的前景，因为它距离遥远，且缺乏有利可图的资源。无论如何，要在[vinland|E]上建立永久性的存在，需要很大的努力，但也许我可以找到一些愿意接受挑战的定居者。"
 RICE_north_atlantic_build_outpost_vinland_tooltip:1 "虽然代价高昂，但我愿意冒险在[vinland|E]建立一个长久的[vinland_outpost|E]！"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_1:1 "根据目前[RICE_greenland_struggle|E]的[struggle_phase|E]，以及[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值，你估计有#V [GetGlobalVariable('RICE_vinland_viability_chances').GetValue|0]%#!的成功率。"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_2:1 "如果你派往[vinland|E]的定居者成功定居，那么你的[dynasty|E]将获得[GetModifier('RICE_north_atlantic_vinland_outpost').GetNameWithTooltip][modifier|E]，根据[RICE_greenland_struggle|E]的[struggle_phase|E]，你的[greenland_estate_long|E]的每年收益略有增减，你可以获得$RICE_north_atlantic_support_vinland$[decision|E]，而且前往[vinland|E]的[greenland_expeditions|E]费用将减少"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_3:1 "如果成功，[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值将#P 增加#!；如果失败，那么[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]两个数值将会#N 减少#!"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_4:1 "每年每个[vinland_outpost_long|E]将#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]数值"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_5:1 "@warning_icon!#X [RICE_greenland_struggle|E]还没有以一个好的结局结束，所以即使你成功建立了一个永久的[vinland_outpost|E]也有可能会因为[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]而导致#N 失败#!#!"
 RICE_north_atlantic_build_outpost_vinland_confirm:0 "我喜欢刺激的冒险，让我们开始行动吧！"
 RICE_north_atlantic_build_outpost_vinland_context_tooltip:0 "#emphasis 历史背景：#!尽管我们有考古证据表明，诺斯人曾经在纽芬兰的梅多斯湾有过活动，但那里并不是一个完整的定居点，而更像是一个用来修理船只和工具、补充物资的小站。与流行历史所描绘的莱夫·埃里克松及其同类作为维京征服者的同等人物相反，诺斯人可能对在文兰定居没有多大兴趣：那里离格陵兰太远，而且能提供的有用资源很少。任何试图定居文兰的尝试也会耗尽格陵兰定居点更为丰厚的有限资源和人力。"
 RICE_north_atlantic_support_vinland:0 "支援文兰定居点"
 RICE_north_atlantic_support_vinland_tooltip:0 "是时候为我们在遥远[vinland|E]的勇敢的兄弟姐妹们提供支持了"
 RICE_north_atlantic_support_vinland_desc:0 "在[vinland|E]定居是一项昂贵的、有风险的、甚至是略微愚蠢的决定；目前，这里有#V [GetGlobalVariable('RICE_north_atlantic_vinland_outposts').GetValue|0]#![vinland_outposts|E]。如果能把[greenland_support|E]提供给[vinland_outposts|E]就好了，但[vinland|E]太遥远了，没有什么实际价值，所以这是在浪费资源，不如用在更有利可图的[greenland|E]上……对吗？"
 RICE_north_atlantic_support_vinland_effect_tooltip_1:0 "你的[greenland_support|E]很可能无法到达[vinland|E]，尤其是在[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]很低的情况下。"
 RICE_north_atlantic_support_vinland_effect_tooltip_2:0 "各种形式的[greenland_support|E]会给予你[prestige_i|E][prestige|E]、[piety_i|E][piety|E]或[modifiers|E]等收益，但更重要的是会#P 增加#![vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值; 然而它们也会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的数值"
 RICE_north_atlantic_support_vinland_effect_tooltip_3:0 "提供[greenland_support|E]的成本较高，因为你的[house|E]缺乏[greenland_estate_long|E]。"
 RICE_north_atlantic_support_vinland_effect_tooltip_4:0 "如果[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]较低，且如果[RICE_greenland_struggle|E]目前处于[struggle_phase_greenland_subsistence_simple|E]和[struggle_phase_greenland_marginalization|E]的状态下时，需要提供[greenland_support|E]的成本会更高。"
 RICE_north_atlantic_support_vinland_confirm:0 "这对文兰定居点来说是至关重要的援助！"
 RICE_north_atlantic_support_vinland_context_tooltip:0 "$RICE_north_atlantic_build_outpost_vinland_context_tooltip$"
 RICE_north_atlantic_vinland_aid_type:0 "请选择支援文兰定居点的办法"
 RICE_north_atlantic_vinland_aid_type_gui:0 "请选择支援[vinland|E]的办法"
 RICE_north_atlantic_vinland_supplies_option:0 "#Bold #V 发送物资#!#!\n$RICE_north_atlantic_basic_supplies_option_desc$"
 RICE_north_atlantic_vinland_supplies_option_desc:0 "向定居点运输食物、工具以及其他必需补给品。"
 RICE_north_atlantic_vinland_supplies_option_tooltip:0 "#V #Bold 最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_vinland_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$获得[piety_i|E]50\n$EFFECT_LIST_BULLET$#P 增加#![vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值，[vinland_viability_i|E]最多到#V 2#!（如果成功的话）\n$EFFECT_LIST_BULLET$无论成功与否，都会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]随机数值（最多减少#V 10#!）"
 RICE_north_atlantic_vinland_settlers_option:0 "#Bold #V 招募定居者#!#!\n$RICE_north_atlantic_vinland_settlers_option_desc$"
 RICE_north_atlantic_vinland_settlers_option_desc:0 "有能力的人会以各种方式作出贡献"
 RICE_north_atlantic_vinland_settlers_option_tooltip:0 "#V #Bold 最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_vinland_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$获得[prestige_i|E]50\n$EFFECT_LIST_BULLET$#P 增加#![vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值，[vinland_viability_i|E]最多到#V 2#!（如果成功的话）\n$EFFECT_LIST_BULLET$无论成功与否，都会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]随机数值（最多减少#V 10#!）"
 RICE_north_atlantic_vinland_base_camps_option:0 "#Bold #V 建造基本营地#!#!\n$RICE_north_atlantic_vinland_base_camps_option_desc$"
 RICE_north_atlantic_vinland_base_camps_option_desc:0 "用于贸易、探索和战斗的前哨站"
 RICE_north_atlantic_vinland_base_camps_option_tooltip:0 "#V #Bold 最低花费：@gold_icon![EmptyScope.ScriptValue('RICE_vinland_cost')|0]#!#!\n \n$EFFECT_LIST_BULLET$获得[prestige_i|E]100\n$EFFECT_LIST_BULLET$#P 增加#![vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值，[vinland_viability_i|E]最多到#V 4#!（如果成功的话）\n$EFFECT_LIST_BULLET$无论成功与否，都会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]随机数值（最多减少#V 20#!）"
 RICE_north_atlantic_vinland_temples_option:0 "#Bold #V 建造[ROOT.Char.GetFaith.HouseOfWorship|U]#!#!\n$RICE_north_atlantic_vinland_temples_option_desc$"
 RICE_north_atlantic_vinland_temples_option_desc:0 "远方的新礼拜堂"
 RICE_north_atlantic_vinland_temples_option_tooltip:0 "#V #Bold 最低花费：@gold_icon!50#!#!\n\n$EFFECT_LIST_BULLET$获得[piety_i|E]100\n$EFFECT_LIST_BULLET$#P 增加#![vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]数值，[vinland_viability_i|E]最多到#V 4#!（如果成功的话）\n$EFFECT_LIST_BULLET$无论成功与否，都会#N 减少#![greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]随机数值（最多减少#V 20#!）"
 RICE_north_atlantic_attract_greenland_immigrants:0 "吸引格陵兰岛的移民"
 RICE_north_atlantic_attract_greenland_immigrants_desc:0 "有传言说，[greenland_settlements|E]正在衰落，生活在那里的人感觉会在其他地方寻找更好的经济机会。虽然我们可以向[greenland|E]提供援助，不过假如我们吸引一些格陵兰人到我的领地内定居呢？"
 RICE_north_atlantic_attract_greenland_immigrants_tooltip:1 "随着[greenland|E]的衰落，也许我们可以邀请生活在那里的人到我的领地上定居。"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_1:1 "你的每个[county|E]将获得为期#V 十年#!的[GetModifier('RICE_north_atlantic_immigration_from_greenland').GetNameWithTooltip][county_modifier|E]"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_2:1 "在你的[courtier|E]中，[greenlandic.GetName][culture|E]的[court|E]有很小的机会出现；[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]越低，这种情况就越容易发生。"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_3:1 "因为[RICE_greenland_struggle|E]目前处于[struggle_phase_greenland_subsistence|E]，[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]都将减少随机数值（最多为10）"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_4:1 "因为[RICE_greenland_struggle|E]目前处于[struggle_phase_greenland_marginalization|E]，[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]都将减少随机数值（最多为20）"
 RICE_north_atlantic_attract_greenland_immigrants_confirm:0 "找到任何愿意在这里重新安置的人！"
 RICE_north_atlantic_attract_greenland_immigrants_context_tooltip:0 "#emphasis 历史背景：#!关于北欧格陵兰岛定居点衰落的一些学术理论认为，诺斯格陵兰人逐渐离开了定居点，去欧洲寻求更好的经济机会，无论是由于黑死病导致的斯堪的纳维亚人口减少而增加了劳动力需求，还是由于海象象牙贸易的衰落而降低了格陵兰的生活质量，或者是其他原因。然而，即使这种说法成立，它也可能只是解释北欧格陵兰岛定居点衰落的一个方面而已。"
 RICE_north_atlantic_whale_hunt:0 "赞助捕鲸活动"
 RICE_north_atlantic_whale_hunt_desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]人世代都在猎杀鲸鱼。鲸鱼肉和鲸脂都可以变成有价值的油，因此鲸鱼浑身上下都是宝，我想以我的名义资助猎鲸活动。"
 RICE_north_atlantic_whale_hunt_tooltip:1 "“地球上没有任何野兽的愚蠢不会无限地被人类的疯狂所超越。”"
 RICE_north_atlantic_whale_hunt_effect_tooltip_1:1 "你有#V [GetPlayer.MakeScope.ScriptValue('RICE_north_atlantic_whaling_success_chance')|0]%#!的成功几率，这受你的[traits|E]和[skills|E]影响，特别是[stewardship|E]，但[martial|E]和[learning|E]也会影响"
 RICE_north_atlantic_whale_hunt_effect_tooltip_2:1 "如果成功，你将获得[prestige|E]和随机数量的[gold|E]，介于#V [gold_i|E]1#!到#bold 最大#![gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_north_atlantic_whaling_max_gold_display_value')|0]#!之间"
 RICE_north_atlantic_whale_hunt_effect_tooltip_3:1 "因为[THIS.Char.GetCulture.GetName][culture|E]有$tradition_RICE_master_whalers_name$[tradition|E]，所以你成功狩猎的几率增加了#P 15%#!"
 RICE_north_atlantic_whale_hunt_confirm:0 "开始寻找一些有经验的捕鲸者！"
 RICE_north_atlantic_whale_hunt_context_tooltip:0 "#emphasis 历史背景：#!自史前时代以来，世界各地的许多文化都从事捕鲸活动。从中世纪开始，巴斯克人就是最早参与大规模商业捕鲸的社会之一，并被认为是二十世纪之前世界上最优秀的捕鲸者。中世纪的统治者以不同的方式参与捕鲸业，例如给予捕鲸城镇特权或向其征收额外的税收，这对于巴斯克捕鲸者尤其如此。"
 RICE_north_atlantic_whale_neither_tax:0 "你[realm|E]中目前没有[county|E]拥有"
 RICE_north_atlantic_whale_exempt_tax:0 "对捕鲸镇免征税款"
 RICE_north_atlantic_whale_exempt_tax_desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]是捕鲸的专家，我应该鼓励这个行业来帮助土地繁荣。做到这一点的一个方法是，免除捕鲸的城镇的税收！"
 RICE_north_atlantic_whale_exempt_tax_not_basque_desc:0 "我的领地内的几个沿海城镇以捕鲸而闻名。我应该鼓励这个行业，以助我的王国繁荣，其中一个方法是免除以捕鲸业为主的城镇税收。"
 RICE_north_atlantic_whale_exempt_tax_tooltip:1 "$RICE_north_atlantic_whale_hunt_tooltip$"
 RICE_north_atlantic_whale_exempt_tax_confirm:0 "是时候进行减税了！"
 RICE_north_atlantic_whale_exempt_tax_context_tooltip:0 "$RICE_north_atlantic_whale_hunt_context_tooltip$"
 RICE_north_atlantic_whale_levy_extra_tax:0 "向捕鲸镇征收额外税款"
 RICE_north_atlantic_whale_levy_extra_tax_desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]以捕鲸的技术而闻名，捕鲸是一个#italic 非常#!有利可图的行业，所以捕鲸镇肯定足够富裕，他们可以向我支付更多的税收！"
 RICE_north_atlantic_whale_levy_extra_tax_not_basque_desc:0 "在我的领地内有几个沿海城镇以捕鲸业闻名。捕鲸是一个#italic 非常#!有利可图的行业，所以这些捕鲸镇肯定足够富裕，他们可以向我支付更多的税收！"
 RICE_north_atlantic_whale_levy_extra_tax_tooltip:1 "$RICE_north_atlantic_whale_hunt_tooltip$"
 RICE_north_atlantic_whale_levy_extra_tax_confirm:0 "对我来说，他们应该交更多的税——给我！"
 RICE_north_atlantic_whale_levy_extra_tax_context_tooltip:0 "$RICE_north_atlantic_whale_hunt_context_tooltip$"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia:0 "建立北欧海象牙雕刻中心"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_desc:0 "[greenland_settlements|E]每年向欧洲港口运送大量的海象牙。如果我们成为[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的象牙雕刻品的主要出口商，我们可以从这个贸易中获得丰厚的利润。"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_tooltip:1 "在斯堪的纳维亚半岛建立一个主要的象牙雕刻工坊"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_effect_tooltip_1:1 "如果[RICE_greenland_struggle|E]转变为[struggle_phase_greenland_marginalization|E]，[county_modifier|E]将被移除（从而重新启用这个[decision|E]）"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_effect_tooltip_2:1 "如果你的[house|E]有[greenland_estate_long|E]，那么[decision|E]花费更低"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_confirm:0 "海象的象牙必须流向我们！"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_context_tooltip:0 "#emphasis 历史背景：#!从11世纪到14世纪，格陵兰岛提供了欧洲使用的大部分象牙，这些象牙是由海象制成的，其主要的雕刻中心是挪威的特隆赫姆和德国的科隆的工坊。以前，历史学家认为格陵兰象牙是相对于象牙的廉价替代品，但最近的研究表明，它们有着自身的价值，甚至可能出口到伊斯兰世界和亚洲等地。"
 RICE_north_atlantic_walrus_ivory_workshop_europe:0 "建立欧洲海象牙雕刻中心"
 RICE_north_atlantic_walrus_ivory_workshop_europe_desc:0 "每年都有大量来自[greenland|E]的海象牙抵达欧洲港口。虽然我们不是[RICE_greenland_struggle|E][struggle_involved|E]，但如果我们成为[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]以外的象牙雕刻品的主要出口国，我们仍然可以从这个贸易中获得丰厚的利润。"
 RICE_north_atlantic_walrus_ivory_workshop_europe_tooltip:1 "在欧洲建立一个主要的象牙雕刻工坊"
 RICE_north_atlantic_walrus_ivory_workshop_europe_effect_tooltip_1:1 "$RICE_north_atlantic_walrus_ivory_workshop_scandinavia_effect_tooltip_1$"
 RICE_north_atlantic_walrus_ivory_workshop_europe_confirm:0 "$RICE_north_atlantic_walrus_ivory_workshop_scandinavia_confirm$"
 RICE_north_atlantic_walrus_ivory_workshop_europe_context_tooltip:0 "$RICE_north_atlantic_walrus_ivory_workshop_scandinavia_context_tooltip$"
 RICE_north_atlantic_incorporate_inuit_ideas:0 "融入因纽特传统"
 RICE_north_atlantic_incorporate_inuit_ideas_desc:0 "虽然有些人把生活在[greenland|E]北部的人贬称为“斯克雷林人”，但我和在[greenland_estate_long|E]的人已经与他们进行友好的互动。尽管条件恶劣，他们似乎在[greenland|E]茁壮繁衍——我们的新朋友是否愿意传授一些关于他们生活方式的知识？"
 RICE_north_atlantic_incorporate_inuit_ideas_tooltip:1 "也许我们可以用来自[greenland|E]的因纽特人的新想法和[innovations|E]来充实[greenland_colony|E]"
 RICE_north_atlantic_incorporate_inuit_ideas_effect_tooltip_1:1 "存在于[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的[cultures|E]会解锁$tradition_RICE_arctic_adaptations_name$[tradition|E]"
 RICE_north_atlantic_incorporate_inuit_ideas_effect_tooltip_2:1 "[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]数值分别增加了#V 200#!和#V 10#!。"
 RICE_north_atlantic_incorporate_inuit_ideas_confirm:0 "我们可以互相学习到很多。"
 RICE_north_atlantic_incorporate_inuit_ideas_context_tooltip:0 "#emphasis 历史背景：#!与一些流行的历史叙事相反，描绘格陵兰上的诺斯人在13‑14世纪无法应对气候变化的情形，诺斯人#italic 确实#!在这些年里进行了适应，比如改变了他们以海洋食物为主的饮食。然而，他们并没有采用因纽特人在北极生存的技术，这可能是由于缺乏兴趣、不信任、意识不到或其他原因。很难说这些创新是否能改变格陵兰定居点的最终命运，但它们可能对诺斯定居点有很大的帮助。"
 RICE_north_atlantic_incorporate_inuit_ideas_greenlandic_effect:0 "[greenlandic.GetName][culture|E]获得$tradition_RICE_arctic_adaptations_name$[tradition|E]以及#italic $innovation_RICE_dog_sleds$#!、#italic $innovation_RICE_toggling_harpoons$#!和#italic $innovation_RICE_arctic_boats$#![innovations|E]（这可以降低@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的数值），并且获得#P 25%#![cultural_acceptance|E]和[inuit.GetName]（#warning @warning_icon!如果[greenlandic.GetName][culture|E]的[tradition|E]数量已达上限，则该[decision|E]可能会移除一个[tradition|E]。#!）"
 RICE_north_atlantic_incorporate_inuit_ideas_your_culture_effect:0 "[greenlandic.GetName]和[adopter.GetCulture.GetName][cultures|E]获得$tradition_RICE_arctic_adaptations_name$[tradition|E]以及#italic $innovation_RICE_dog_sleds$#!、#italic $innovation_RICE_toggling_harpoons$#!和#italic $innovation_RICE_arctic_boats$#![innovations|E]（这可以降低@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]数值），两个[cultures|E]都获得#P 25%#![cultural_acceptance|E]和[inuit.GetName]（#warning @warning_icon!如果[greenlandic.GetName]或[adopter.GetCulture.GetName]的[cultures|E]的[tradition|E]数量已达上限，则可能会移除一个[tradition|E]。#!）"
 RICE_north_atlantic_recruit_native_american_warriors:0 "招募[ROOT.Char.GetCulture.GetNameNoTooltip]战士"
 RICE_north_atlantic_recruit_native_american_warriors_desc:0 "当我们在北大西洋的东岸定居时，我们需要更多勇敢和狡猾的战士来保护我们的新家园。让我们联系我们的家乡，看看是否有[ROOT.Char.GetCulture.GetName]战士愿意过来。"
 RICE_north_atlantic_recruit_native_american_warriors_tooltip:1 "从大西洋彼岸的故土中招募一些勇士吧"
 RICE_north_atlantic_recruit_native_american_warriors_confirm:0 "将对我们有很大的帮助！"
 RICE_north_atlantic_recruit_native_american_warriors_context_tooltip:0 "#emphasis 历史背景：#!根据早期欧洲的资料，在东北部的美洲原住民中，野战是一种仪式化的事情。然而这些资料很可能忽略了突袭、伏击和游击战在这个地区发挥的作用。有证据表明，即使在前哥伦布时期，许多定居点都有大型的、多层的木制防御工事，像Haudenosaunee（即易洛魁）这样的大联盟可能部分是为了遏制持续的、地方性的战争所带来的破坏。"
 RICE_north_atlantic_learn_dog_sleds:0 "掌握狗拉雪橇的使用"
 RICE_north_atlantic_learn_dog_sleds_desc:0 "[greenland_settlements|E]正在与生活在[greenland|E]和[helluland|E]北部的外国人建立更紧密的联系，并学习他们的生活方式。例如#bold 狗拉雪橇#!为这些外国人提供了一种可靠的运输方式，并协助他们打猎。我们也可以利用这种技术吗？"
 RICE_north_atlantic_learn_dog_sleds_tooltip:1 "狗拉雪橇可能有助于[greenland_settlements|E]的运输和打猎"
 RICE_north_atlantic_learn_dog_sleds_effect_tooltip_1:1 "[greenlandic.GetName][culture|E]解锁#V $innovation_RICE_dog_sleds$#![innovation|E]，从而减少@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]负面影响，并降低[greenland_expeditions|E]的成本。"
 RICE_north_atlantic_learn_dog_sleds_effect_tooltip_2:1 "[greenlandic.GetName]和[adopter.GetCulture.GetName][culture|E]解锁#V $innovation_RICE_dog_sleds$[innovation|E]，可以减少@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]负面影响并且减少[greenland_expeditions|E]成本"
 RICE_north_atlantic_learn_dog_sleds_confirm:0 "狗是人类最好的朋友，这是有原因的！"
 RICE_north_atlantic_learn_dog_sleds_context_tooltip:0 "#emphasis 历史背景：#!在遥远的北方，犬类经过数千年的培育，被用来拉雪橇，许多这些地区的文化广泛地利用它们进行旅行和狩猎。因纽特人的祖先——图勒人，得益于他们广泛使用的狗拉雪橇，能够在广阔的土地上觅食、打猎和迁徙。"
 RICE_north_atlantic_learn_toggling_harpoons:0 "掌握拨动鱼叉的使用方法"
 RICE_north_atlantic_learn_toggling_harpoons_desc:0 "[greenland_settlements|E]正与生活在[greenland|E]和[helluland|E]北部的外国人建立更紧密的联系，学习他们的生活方式。例如这些人似乎使用#bold 活动式鱼叉#!来更有效地捕猎鲸鱼、海豹和其他动物，我们可以利用这种技术吗？"
 RICE_north_atlantic_learn_toggling_harpoons_tooltip:1 "活动式鱼叉能够用于[greenland_settlements|E]的狩猎和战斗"
 RICE_north_atlantic_learn_toggling_harpoons_effect_tooltip_1:1 "[greenlandic.GetName][culture|E]解锁#V $innovation_RICE_toggling_harpoons$#![innovation|E]，这可以减轻低@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的负面影响，并在采取$RICE_north_atlantic_whale_hunt$[decision|E]时增加成功的几率。"
 RICE_north_atlantic_learn_toggling_harpoons_effect_tooltip_2:1 "[greenlandic.GetName]和[adopter.GetCulture.GetName][culture|E]解锁#V $innovation_RICE_toggling_harpoons$#![innovation|E]这可以减轻低@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]的负面影响，并在采取$RICE_north_atlantic_whale_hunt$[decision|E]时增加成功的几率。"
 RICE_north_atlantic_learn_toggling_harpoons_confirm:0 "这将使我们的狩猎更容易！"
 RICE_north_atlantic_learn_toggling_harpoons_context_tooltip:0 "#emphasis 历史背景：#!因纽特人和美洲及北极地区的各民族在狩猎时使用活动式鱼叉。与普通鱼叉不同，活动式鱼叉有两个尖端。一个尖端固定在握柄上，另一个尖端像帽子一样套在第一个尖端上，可以拆卸。这样一来活动式鱼叉就能更有效地刺入动物体内。"
 RICE_north_atlantic_learn_arctic_boats:0 "掌握北极船的使用"
 RICE_north_atlantic_learn_arctic_boats_desc:0 "[greenland_settlements|E]正在与生活在[greenland|E]和[helluland|E]北部的外国人建立更紧密的联系，并学习他们的生活方式。例如#bold 北极船#!为这些外国人提供了一种可靠的运输方式，并协助他们打猎。我们也可以利用这种技术吗？"
 RICE_north_atlantic_learn_arctic_boats_tooltip:1 "北极船可能帮助[greenland_settlements|E]居民在不太有利的环境条件下旅行"
 RICE_north_atlantic_learn_arctic_boats_effect_tooltip_1:1 "[greenlandic.GetName][culture|E]解锁#V $innovation_RICE_arctic_boats$#![innovation|E]，从而减少@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]负面影响，并降低$RICE_north_atlantic_whale_hunt$[decision|E]的成本。"
 RICE_north_atlantic_learn_arctic_boats_effect_tooltip_2:1 "[greenlandic.GetName]和[adopter.GetCulture.GetName][culture|E]解锁#V $innovation_RICE_arctic_boats$#![innovation|E]，从而减少@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]负面影响，并降低$RICE_north_atlantic_whale_hunt$[decision|E]的成本。"
 RICE_north_atlantic_learn_arctic_boats_confirm:0 "划，划，划你的船啊！"
 RICE_north_atlantic_learn_arctic_boats_context_tooltip:0 "#emphasis 历史背景：#!北极地区的民族，例如因纽特人，利用几种不同类型的开放式皮船进行水上旅行。大型的#italic 乌米亚克船（umiaks）#!适合在广阔的水域中运送人员和物资，而小型的#italic 皮艇（kayaks）#!通常用于狩猎和快速航行。"
 north_atlantic.0000.t:0 "xxxxx"
 north_atlantic.0000.desc:0 "xxxxx"
 north_atlantic.0000.a:0 "xxxxx"
 north_atlantic.0001.t:0 "$RICE_greenland_struggle$"
 north_atlantic.0001.desc:0 "[erik.GetFirstNameNicknamedPossessive]的航行为其他人铺平了道路，让[erik.GetSheHe]参与到名为#V 格陵兰#!的土地定居进程中来！那些在遥远而寒冷的海岸定居的人，如果能控制海象牙等奢侈品的出口，肯定会收获巨大的利益和影响。"
 north_atlantic.0001.desc.involved:0 "[ROOT.Char.GetHouse.GetName]家族是否也注定要驶向格陵兰，在那里是否有更多的土地等待我们去发现？"
 north_atlantic.0001.desc.interloper:0 "[ROOT.Char.GetHouse.GetName]家族是否会更积极地参与到这些北方斗争中来，以解决这个边境地区？只有时间才能够回答……"
 north_atlantic.0001.a:0 "北大西洋的传奇海域和土地召唤我们！"
 north_atlantic.0001.b:0 "也许有一天，我们也将在大洋彼岸航行。"
 north_atlantic.0001.c:0 "有谁能为我提供关于格陵兰的建议吗？"
 north_atlantic.0001.tooltip:0 "如果你想了解[RICE_greenland_struggle|E]中各种机制的基本原理，请选择此选项——了解这些将有助于你和[greenlands|E]定居者的互利互惠!"
 north_atlantic.0001.c.tooltip:0 "如果你想了解[RICE_greenland_struggle|E]中各种机制的基本原理，请选择此选项——了解这些将有助于你和[greenlands|E]定居者的互利互惠!"
 north_atlantic.0002.t:0 "xxxxx"
 north_atlantic.0002.desc:0 "xxxxx"
 north_atlantic.0002.a:0 "xxxxx"
 north_atlantic.0003.t:0 "格陵兰定居点"
 north_atlantic.0003.desc:0 "虽然我不打算去格陵兰，但我想找到参与定居点的方法，以提高我们家族的影响力。\n\n当地一位知名人士[guide.GetFirstName]正计划搬到那里。出发前，[guide.GetSheHe]拜访了我，给我一些建议：“大人，您的家族应该在格陵兰岛建立一个#bold 庄园#!并#bold 支持#!定居者，这样你们就可以从定居地中相互受益，比如在#bold 诺塞图尔#!猎取海象，因为海象的牙可以卖出很多利润！如果胆子大一点，还可以通过赞助#bold 探险队#!发现其他地方还有什么东西，在历史留下一笔。”"
 north_atlantic.0003.a:0 "我想我已经学到了很多。谢谢你的真知灼见。"
 north_atlantic.0003.b:0 "你能分享关于格陵兰本身的更多信息吗？"
 north_atlantic.0004.t:0 "格陵兰的资源和压力"
 north_atlantic.0004.desc:0 "“在我看来，”[guide.GetFirstName]说，“只要格陵兰的定居者证明了他们的#bold 适应力#!，并与外界维持强大的#bold 贸易网络#!，他们就能抵御大多数压力。在那里也许还有更多的神话传说之地，但不要贪图荣耀；要小心这些土地的#bold 生存力#!，因为如果这些土地太偏远，而且缺乏有利可图的资源，你可能会浪费你的时间和金钱。记住这一切，谁知道我们会在格陵兰及其以外的地方探索和实现什么呢？”\n\n[guide.GetFirstNameNoTooltip]还提供了一些关于格陵兰情况的有用建议，我在[guide.GetSheHe]离开前感谢了[guide.GetHerHim]。"
 north_atlantic.0004.a:0 "毫无疑问，我们生活在有趣的时代。"
 north_atlantic.0005.t:0 "xxxxx"
 north_atlantic.0005.desc:0 "xxxxx"
 north_atlantic.0005.a:0 "xxxxx"
 north_atlantic.0006.t:0 "北方的气候变化"
 north_atlantic.0006.desc:0 "几个世纪前，第一批定居者从欧洲抵达格陵兰。从那时起，他们和他们的后代在这些寒冷、偏远的海岸上建立了一个繁荣的小城镇。不幸的是最近这些土地似乎变得更加寒冷了。\n\n最近的天气有些不同：风暴更加频繁，冬天更长，而春天更短。当地人并没有注意到这种变化，他们正试图以各种方式适应。例如许多定居者正在增加饮食中的海产食物的数量。\n\n只有时间才能告诉我们，这些定居者是否能在长期内设法适应不断变化的土地，或者格陵兰岛的定居点是否会无法忍受这些具有挑战性的条件。"
 north_atlantic.0006.a:0 "格陵兰岛的定居点将面临什么？"
 north_atlantic.0006.tooltip:0 "从现在开始，无论[RICE_greenland_struggle|E]处于哪个[struggle_phase|E]，@RICE_greenland_resilience_icon![greenland_resilience|E]都会#N 减少#!更多。这最终会对在[greenland|E]拥有[greenland_estates|E]的[rulers|E]利益和其他[decisions|E]产生负面影响。\n \n从长远来看，尤其是在[greenland_settlements|E]出现其他麻烦迹象的情况下，如果找不到资源来解决[RICE_greenland_struggle|E]的情况达成好结局，[struggle_involved][rulers|E]可能要考虑放弃这些庄园以减少损失。"
 north_atlantic.0007.t:0 "不断变化的大西洋经济"
 north_atlantic.0007.desc:0 "几个世纪前，第一批定居者从欧洲抵达格陵兰。从那时起，他们和他们的后代在这些寒冷、偏远的海岸上建立了一个繁荣的小城镇。不幸的是最近这些土地似乎变得更加寒冷了。\n\n格陵兰的经济主要依赖于通过其两个主要定居点出口海象牙（以及其他奢侈品）。即使是格陵兰的人们也意识到全球经济最近的变化——这些变化可能会危及这一长期的财富来源。这些变化包括从亚洲和非洲运到欧洲的大象象牙数量增加，在比亚尔米亚猎取海象的活动日益盛行，北方的海上贸易从大西洋航线转向波罗的海。\n\n长期以来，格陵兰岛一直作为欧亚大陆遥远的边疆，在相对孤立的情况下持续存在。现在格陵兰人是否能够适应世界上其他地方发生的变化的影响？"
 north_atlantic.0007.a:0 "格陵兰岛的定居点将面临什么？"
 north_atlantic.0007.tooltip:0 "从现在开始，无论[RICE_greenland_struggle|E]处于哪个[struggle_phase|E]，@RICE_greenland_networks_icon![greenland_networks|E]都会#N 减少#!更多。这最终会对在[greenland|E]拥有[greenland_estates|E]的[rulers|E]利益和其他[decisions|E]产生负面影响。\n \n从长远来看，尤其是在[greenland_settlements|E]出现其他麻烦迹象的情况下，如果找不到资源来解决[RICE_greenland_struggle|E]的情况达成好结局，[struggle_involved][rulers|E]可能要考虑放弃这些庄园以减少损失。"
 north_atlantic.0008.t:0 "$north_atlantic.0001.t$"
 north_atlantic.0008.desc:0 "关于[erik.GetFirstNameNicknamed]的冒险的消息正像野火一样传播，他刚刚从伟大西海航线中回来。[erik.GetSheHe]在冰岛西部发现了一块巨大的陆地！！[erik.GetSheHe]称之为#V 格陵兰#!。有传言说格陵兰实际上是一片荒凉、寒冷的土地，选择这个名字是为了吸引定居者的狡猾伎俩。\n\n尽管如此，有商业头脑的人已经注意到格陵兰是海象（以及其他有价值的奢侈品）的家园。由于象牙的稀缺性，毫无疑问，谁控制了格陵兰岛的贸易流，谁就能获得巨大的利润和影响力，无畏的定居者已经开始前往那里，在其遥远的海岸定居。\n\n虽然格陵兰岛离我们太远，无法对其事务产生有意义的影响，但它的发现和定居会对北大西洋世界的商业、文化和政治网络产生深远影响。"
 north_atlantic.0008.a:0 "从冰岛到格陵兰岛......还有可能更远？"
 north_atlantic.0008.tooltip:0 "[RICE_greenland_struggle|E]开始了，现在为[rulers|E]解锁各种[decisions|E]和机制，他们在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName][region|E]中作为[struggle_involved|E]。两个全局数值，分别是[greenlands|E]@RICE_greenland_resilience_icon![greenland_resilience|E]和@RICE_greenland_networks_icon![greenland_networks|E]将记录下定居点的目前情况如何。"
 north_atlantic.0009.t:0 "格陵兰定居点的终结"
 north_atlantic.0009.desc:0 "曾几何时，格陵兰是北大西洋的一个重要前沿基地，这个基地甚至比冰岛更有利可图，更重要与欧洲的联系更紧密。可惜历史从来就不是一个维持现状的人。多年来，气候和全球经济的变化已经造成了损失。\n\n最近，一艘孤独的商船从格陵兰岛返回，他们报告说他们在那里除了废弃的建筑和死人之外什么都没有发现；还有传言说幸存一些零散的定居者，一些名义上参与格陵兰事务的贵族仍然声称对它有管辖权，但很明显，这个定居点实际上已经不存在了。也许有一天，学者们会争论格陵兰定居地衰落的原因。\n\n自从[erik.GetTitledFirstNameNicknamed]多年前首次发现并定居格陵兰以来，几代人都在那里生活。然而现在，曾经繁荣的格陵兰定居点只剩下凄厉的风声，以及海浪对冰面发出的轻轻的不祥的吼声。"
 north_atlantic.0009.a:0 "格陵兰定居点的历史告一段落......暂时？"
 north_atlantic.0009.tooltip:0 "[RICE_greenland_struggle|E]结束了，定居点的崩溃为北大西洋历史的一个篇章画上了句号，而新的篇章开始了。"
 RICE_greenland_struggle_ending_no_more_estate_bonus_collapse_tt:0 "[GetModifier('RICE_north_atlantic_greenland_family_estate').GetNameWithTooltip][modifier|E]将从所有拥有它的[houses|E]中移除，这些[houses|E]的[rulers|E]将不再从其[greenland_estates_long|E]中获得年度收益。"
 north_atlantic.0010.t:0 "发现文兰"
 north_atlantic.0010.desc:0 "勇敢的冒险家[leif.GetFullName]和[leif.GetHerHis]船员已经从探索西部海域的探险中返回，已经证实关于格陵兰岛西部土地的传言。\n\n根据报告，他们发现了三块新土地。他们经过的第一块土地，被他们命名为#Bold 赫鲁兰#!，上面以平坦的石头为主。第二块土地，他们命名为#Bold 马克兰#!，上面充满了强大的森林和白色的沙滩。第三块土地，他们命名为#Bold 文兰#!，上面充满了葡萄和肥沃的草地，有一天可以定居下来——如果它不是离欧洲那么远，而且缺乏其他有价值的资源的话。\n\n也许一些过于雄心勃勃的傻瓜会试图（而且很可能失败）永久地定居在这个文兰，但更明智的领导人可能会看到探索这些土地的价值，特别是赫鲁兰和马克兰，以寻找当地的盟友或货物贸易。谁知道北大西洋的世界接下来会发生什么？"
 north_atlantic.0010.a:0 "由[leif.GetFirstNameNoTooltip]和[leif.GetHerHis]的伙伴们完成的非凡壮举！"
 north_atlantic.0010.tooltip.1:0 "在[RICE_greenland_struggle|E]中，与[helluland|E]、[markland|E]和[vinland|E]有关的[decisions|E]和机制已经为[struggle_involved|E][rulers|E]解锁。"
 north_atlantic.0010.tooltip.2:0 "因为[vinland|E]是在[struggle_phase_greenland_settlement|E]中被发现的，或者是在[RICE_greenland_struggle|E]成功结束后，所以[vinlands|E][vinland_viability|E]的起点是@RICE_vinland_viability_icon!#V 20#!"
 north_atlantic.0010.tooltip.3:0 "因为[vinland|E]是在[struggle_phase_greenland_integration|E]中被发现的，所以[vinlands|E][vinland_viability|E]的起点是@RICE_vinland_viability_icon!#V 10#!"
 north_atlantic.0010.tooltip.4:0 "因为[vinland|E]是在[struggle_phase_greenland_subsistence|E]中被发现的，所以[vinlands|E][vinland_viability|E]的起点是@RICE_vinland_viability_icon!#V 10#!"
 north_atlantic.0011.t:0 "定居点的结局"
 north_atlantic.0011.desc:0 "几个世纪以来，格陵兰定居地的两个主要城镇，分别是较大的东部和较小的西部。它们是向欧洲和其他地区提供海象牙和其他异国奢侈品的重要供应地点。然而最近气候和全球经济的变化已经降低了这些定居点的长期可持续性，也许是永久性的。\n\n不过最近令人不安的消息已经从西部定居点传来。一艘船最近从挪威前往格陵兰岛，并报告说该地区的所有农场和建筑都被遗弃了！这让人感到很奇怪。\n\n西部定居点的人口多年来一直在减少，但周围应该还有一些人；但却找不到他们的痕迹。他们是在外国人的袭击中被杀或被奴役了吗？他们去了西部的文兰吗？他们都死于疾病吗？他们都因为某种原因而躲起来了吗？其他原因？\n\n虽然东部定居点仍然相对强大，但许多人担心格陵兰的未来，因为它是最不确定的。"
 north_atlantic.0011.a:0 "让我们希望东部定居点能够生存下去。"
 north_atlantic.0011.tooltip.resilience:0 "[greenlands|E][greenland_resilience|E]减少#V 50#!到@RICE_greenland_resilience_icon!#V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0011.tooltip.networks:0 "[greenlands|E][greenland_networks|E]减少#V 50#!到@RICE_greenland_networks_icon!#V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0011.tooltip:0 "\n在这个事件之后，将有一个大约10‑25年的宽限期。在这个宽限期之后，每年都会有机会触发一个事件，导致定居点被放弃。\n\n当定居点被放弃时，如果到那时还没有得到解决，[RICE_greenland_struggle|E]就会结束。如果发生这种情况，任何[ruler|E]的[house|E]有[greenland_estate_long|E]，将#italic 不会#!得到任何损失的补偿。\n\n@warning_icon!#X [struggle_involved|E][rulers|E]应尽量采取$RICE_greenland_struggle_ending_abandonment_decision$[decision|E]以减少损失。#!"
 north_atlantic.0012.t:0 "xxxxx"
 north_atlantic.0012.desc:0 "xxxxx"
 north_atlantic.0012.a:0 "xxxxx"
 north_atlantic.0013.t:0 "xxxxx"
 north_atlantic.0013.desc:0 "xxxxx"
 north_atlantic.0013.a:0 "xxxxx"
 north_atlantic.0014.t:0 "因纽特人抵达格陵兰"
 north_atlantic.0014.desc:0 "来自格陵兰的传言称，该地区有一个新的民族来到这里，他们自称是[inuit.GetName]人。时间会告诉我们将如何与格陵兰的其他居民，如[dorset.GetName]互动。\n\n听说自古以来，[inuit.GetNameNoTooltip]人就生活在世界寒冷的北方地区，从事捕鲸和海豹，熟悉建造隔热性能良好的房屋，还有乘坐狗拉雪橇迁徙和穿越冰雪，无所不能。\n\n凭借[inuit.GetNameNoTooltip]人的能力，会不会在控制重要资源方面与其他群体竞争，造成紧张和冲突？这是否是他们之间合作和贸易的机会？或者这三个群体将相互忽视，在遥远的北方独自走向自己的命运？"
 north_atlantic.0014.a:0 "即使在遥远的北方，时代也总是在变化。"
 north_atlantic.0014.a.tooltip:0 "对于那些在[RICE_greenland_struggle|E]中的[struggle_involved|E]，与[inuit.GetNameNoTooltip]的关系现在将在一些[decisions|E]和事件中发挥作用，比如在[greenland_expeditions|E]上。"
 north_atlantic.0015.t:0 "xxxxx"
 north_atlantic.0015.desc:0 "xxxxx"
 north_atlantic.0015.a:0 "xxxxx"
 north_atlantic.0016.t:0 "遗弃文兰"
 north_atlantic.0016.desc.intro.support:0 "我派往文兰的船只已经提前回国了。"
 north_atlantic.0016.desc.intro:0 "我收到了来自我们家族在文兰的前哨站的不幸消息！"
 north_atlantic.0016.desc:0 "似乎文兰的大多数定居者，那些效忠于我的家族的人已经放弃了在那里建立的任何和所有定居点。\n\n关于这一点的原因，有很多矛盾的报告。一些定居者将责任归咎于袭击和攻击他们的侵略性原住民。其他人则声称，由于计划不周，他们没有足够的物资来长期维持。一些回家的人甚至怀疑定居者失去了留下来的意志力，意识到留在这个偏远和未知的地区没有什么经济利益。\n\n不管是什么原因，这对任何想长期定居文兰的人来说无疑是个挫折。"
 north_atlantic.0016.a:0 "从长远来看，留在文兰是可行的吗？"
 north_atlantic.0016.tooltip:0 "所有在[vinland|E]的[vinland_outposts|E]都被放弃，而[vinlands|E]@RICE_vinland_viability_icon![vinland_viability|E]减少#V [GetGlobalVariable('RICE_viability_vinland_fail_value_temp').GetValue]#!至@RICE_vinland_viability_icon!#V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
 north_atlantic.0016.support.tooltip:0 "你的援助未能到达[vinland|E]。"
 north_atlantic.0017.t:0 "融入[inuit.GetNameNoTooltip]的思想"
 north_atlantic.0017.desc:0 "格陵兰的定居点是一个重要但遥远的边疆地区。近来它面临着一些挑战，虽然[greenlandic.GetName]人适应得很好，但仍有许多人认为可以做更多的工作，以确保定居点的可持续性。\n\n[adopter.GetTitledFirstName]是[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的一位著名统治者，他的家族与格陵兰岛定居地有很深的关系，他已经向格陵兰岛北部的[inuit.GetCollectiveNoun]伸出了援手。[adopter.GetSheHe|U]试图与他们建立更多的联系，因为[adopter.GetSheHe]已经听到了关于他们如何适应寒冷的北极气候的故事。\n\n[adopter.GetFirstNameNoTooltip]将站在格陵兰定居地这项新政策的最前沿，利用[adopter.GetHerHis]的影响力和关系，鼓励[greenlandic.GetCollectiveNoun]更多地了解[inuit.GetNameNoTooltip]的生活方式，并反过来改善与[inuit.GetNameNoTooltip]的关系和贸易网络。这样一来，两个群体就可以共同在遥远的北方建立一个更强大、更繁荣的社会。"
 north_atlantic.0017.a:0 "从长远来看会怎么样呢？"
 north_atlantic.0018.t:0 "冰岛温泉"
 north_atlantic.0018.desc:0 "我已经来到了[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]中的温泉。虽然它们只是[GetGeographicalRegion('custom_iceland').GetName]中众多温泉中的一个，但我对今天要去的这个温泉早有耳闻，并想亲自体验一下。\n\n在这里，我抽出时间来休息，难怪古老的传奇故事中的英雄们会去泡这样的温泉，这真是如此舒服的体验！\n\n我不得不想......我下次会回到这个地方，还是会尝试岛上的另一个地方？"
 north_atlantic.0018.a:0 "这很放松……"
 north_atlantic.0019.t:0 "$north_atlantic.0018.t$"
 north_atlantic.0019.desc:0 "[GetGeographicalRegion('custom_iceland').GetName]是许多温泉的所在地，传说中的人物会经常出入这些温泉。\n\n因此，我决定去[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]进行[ROOT.Char.GetInvolvedActivity.GetShortName]，以放松和恢复我的精神。"
 north_atlantic.0019.a:0 "走！"
 north_atlantic.0020.t:0 "[ROOT.Char.GetHouse.GetNameNoTooltip]家族到达格陵兰岛"
 north_atlantic.0020.desc.establisher:0 "经过深思熟虑，我决定[ROOT.Char.GetHouse.GetName]家族也应该在格陵兰为我们争取权益。虽然这片土地寒冷而严酷，但从外来动物产品，特别是海象牙的贸易中，有很多获利的机会。\n\n我主动为我们家族在格陵兰的产业找到了一个合适的地点，我已经下令在这块土地上建造一个庄园，同时为当地农民建造附属的农庄。很快来自我们格陵兰岛庄园的珍贵、豪华出口货物将抵达我们家族控制的港口，在欧洲市场销售。"
 north_atlantic.0020.desc.relative:0 "[establisher.GetTitledFirstName]决定[ROOT.Char.GetHouse.GetName]家族准备在格陵兰获得利益，虽然这片土地寒冷而严酷，但有很多获利的机会。\n\n[establisher.GetFirstName]主动为我们家族在格陵兰岛的产业找到了一个合适的地点，[establisher.GetSheHe]已经下令在这片土地上建造一个住宅，同时为当地农民建造附属的农庄。"
 north_atlantic.0020.a:0 "从长远来看，我们在格陵兰的存在将得到回报。"
 north_atlantic.0021.t:0 "格陵兰的新移民抵达"
 north_atlantic.0021.desc:0 "由于格陵兰定居点目前由于各种原因面临经济衰退，我已经能够利用我的影响力和关系，说服一些生活在那里的[greenlandic.GetCollectiveNoun]在我的土地上重新定居。虽然这个小团体中的许多人是农民，但包括一些著名的知名人士。无论如何，他们可以向我现有的臣民传授在寒冷气候下生存的各种方法，或者帮助我们维持与格陵兰的网络（即使它正在衰退）。"
 north_atlantic.0021.desc.immigrant:0 "\n\n其中一位移民是格陵兰社会的重要成员，名字叫[immigrant.GetFullName]。[immigrant.GetSheHe|U]表示愿意作为廷臣为我服务，以感谢他帮助[immigrant.GetHerHim]找到新家。"
 north_atlantic.0021.a:0 "我相信这些新来的人在这里会过得很好"
 north_atlantic.0021.b:0 "我们很乐意让[immigrant.GetFirstNameNoTooltip]留在我们身边！"
 north_atlantic.0021.c:0 "我不需要[immigrant.GetFirstNamePossessiveNoTooltip]服务"
 north_atlantic.0022.t:0 "冰岛第一次议会"
 north_atlantic.0022.desc:0 "多年前，我们第一次来到冰岛寻找新的家园和土地。多年后随着我们不断发展，岛上的大部分地区已经被不同的家庭所定居，我们开始更多地认同[icelandic.GetCollectiveNoun]，而不是认同我们祖先的家乡。"
 north_atlantic.0022.desc.convener:0 "\n\n最近，全岛都在呼吁成立一个议会来管理我们的事务。作为著名的统治者之一，我主动提出了这个要求。在得到了岛上其他统治者的支持后，我召开了在冰岛廷维尔平原上召开了#italic 阿尔庭（中世纪冰岛全国自由民大会;）#!，从岛上的任何地方都可以很容易地到达这里，而且这里还拥有法律岩，这是一个非常适合宣布法律和判决的岩石峭壁。"
 north_atlantic.0022.desc.not_convener:0 "\n\n最近，全岛都在呼吁成立一个议会来管理我们的事务。[althing_convener.GetFirstName]主动提出了这个要求。在得到了岛上其他统治者的支持后，[althing_convener.GetSheHe]召开了在冰岛廷维尔平原上召开了#italic 阿尔庭（中世纪冰岛全国自由民大会;）#!，从岛上的任何地方都可以很容易地到达这里，而且这里还拥有法律岩，这是一个非常适合宣布法律和判决的岩石峭壁。"
 north_atlantic.0022.desc.ending:0 "\n\n今天我们可以真正地说，冰岛联盟诞生了！我为自己参与了[icelandic.GetName]历史上这样一个重要的转折点而感到自豪！"
 north_atlantic.0022.a:0 "冰岛的新一天"
 north_atlantic.0022.vassal.tooltip:0 "在[GetGeographicalRegion('custom_iceland').GetName]的所有[rulers|E]，如果是[count|E][rank|E]，就自动成为[althing_convener.GetTitledFirstNamePossessive][vassal|E]"
 north_atlantic.0023.t:0 "北欧海象牙雕刻中心"
 north_atlantic.0023.desc:0 "格陵兰向整个欧洲市场出口大量的海象象牙，在那里往往能卖出高价。直到现在，最能利用这些象牙的象牙雕刻作坊还分散在很多地方，有商业精神的[walrus_person.GetTitledFirstName]认为这是一个巨大的机会。\n\n[walrus_person.GetFirstNameNoTooltip]与当地的商人和象牙雕刻家合作，建设[walrus_person.GetHerHis]的首都，[walrus_person.GetCapitalLocation.GetTitle.GetNameNoTier]，发展成为[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的象牙雕刻中心。通过投资这一行业，并将[walrus_person.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]转变为满载海象牙的船只的主要目的地，[walrus_person.GetSheHe]和[walrus_person.GetHerHis]的继承人将在未来几年内从象牙贸易中获得丰厚的利润。"
 north_atlantic.0023.a:0 "一个明智的商业举措"
 north_atlantic.0024.t:0 "欧洲象牙雕刻中心"
 north_atlantic.0024.desc:0 "格陵兰向整个欧洲市场出口了大量的海象象牙，这些象牙经常被高价出售。直到现在，最能利用这些象牙的象牙雕刻作坊还分散在很多地方，有创业精神的[walrus_person.GetTitledFirstName]认为这是一个巨大的机会。\n\n与当地的商人和象牙雕刻家合作，[walrus_person.GetFirstNameNoTooltip]将[walrus_person.GetHerHis]的首都[walrus_person.GetCapitalLocation.GetTitle.GetNameNoTier]发展成欧洲在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]之外的主要象牙雕琢中心。通过投资这一行业，并将[walrus_person.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]转变为满载海象牙的船只的主要目的地，[walrus_person.GetSheHe]和[walrus_person.GetHerHis]的继承人将在未来几年内从象牙贸易中获得丰厚的利润。"
 north_atlantic.0024.a:0 "$north_atlantic.0023.a$"
 north_atlantic.0025.t:0 "海象牙贸易在[inside_county.GetNameNoTierNoTooltip]的衰落"
 north_atlantic.0025.desc:0 "多年来，格陵兰一直是向欧洲市场出口海象牙的主要国家。然而现在格陵兰岛定居点最近正面临着重大挑战，经历了一个边缘化时期。\n\n目前的情况对海象牙市场产生了不利影响，并导致[inside_county.GetNameNoTier]的海象牙雕刻业急剧下降。事实上，由于海象牙贸易的衰退，[inside_county.GetNameNoTierNoTooltip]已经不能算是[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的主要海象牙雕刻中心。"
 north_atlantic.0025.a:0 "我希望海象牙贸易的情况在未来有所改善……"
 north_atlantic.0025.tooltip:0 "现在所有符合前提条件的[rulers|E]都可以重新启用$RICE_north_atlantic_walrus_ivory_workshop_scandinavia$[decision|E]，不过只有在[RICE_greenland_struggle|E]处于[struggle_phase_greenland_integration|E]时才能采取。"
 north_atlantic.0026.t:0 "在[outside_county.GetNameNoTierNoTooltip]海象牙贸易的衰落"
 north_atlantic.0026.desc:0 "多年来，格陵兰一直是向欧洲市场出口海象牙的主要国家。然而现在格陵兰岛定居点最近正面临着重大挑战，经历了一个边缘化时期。\n \n目前的情况对海象牙市场产生了不利影响，并导致[outside_county.GetNameNoTier]的海象牙雕刻业急剧下降。事实上，由于海象牙贸易的衰退，[outside_county.GetNameNoTierNoTooltip]已经不能算是[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的主要海象牙雕刻中心。"
 north_atlantic.0026.a:0 "$north_atlantic.0025.a$"
 north_atlantic.0026.tooltip:0 "现在所有符合前提条件的[rulers|E]都可以重新启用$RICE_north_atlantic_walrus_ivory_workshop_europe$[decision|E]，不过只有在[RICE_greenland_struggle|E]处于[struggle_phase_greenland_integration|E]时才能采取。"
 north_atlantic.0027.t:0 "冰岛第一所宗教学院"
 north_atlantic.0027.desc:0 "随着[isleifur.GetFaith.GetReligion.GetName]在[GetGeographicalRegion('custom_iceland').GetName]继续扩张，许多冰岛人认为应该通过各种手段加强该地区的宗教权威。\n\n尤其是[isleifur.GetTitledFirstName]，已经拨出资金和资源，在[GetGeographicalRegion('custom_iceland').GetNameNoTooltip]创办了第一所[isleifur.GetFaith.GetReligion.GetAdjective]学校。现在[isleifur.Custom('DefaultPriestTitlePlural')|U]不再需要长途跋涉去接受宗教方面的培训，而当地的精英们可以把他们的孩子送到这里学习。这不仅满足精神需求，而且对其政治和文化的发展，肯定会有很大的贡献!"
 north_atlantic.0027.a:0 "因此，[GetGeographicalRegion('custom_iceland').GetNameNoTooltip]继续增长。"
 north_atlantic.0028.t:0 "[greenland_colonizer.GetCulture.GetNameNoTooltip]的影响力在格陵兰蔓延"
 north_atlantic.0028.desc:0 "长久以来，[greenland_colonizer.GetCulture.GetCollectiveNoun]在格陵兰岛定居点没有重要的存在，尽管他们越来越多地参与到[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]的各种经济和政治网络。\n\n然而，在[greenland_colonizer.GetTitledFirstName]的领导下，这种情况正在改变，他认识到如果[greenland_colonizer.GetCulture.GetCollectiveNounNoTooltip]要想从格陵兰适当地获利，他们必须更多地参与其日常事务。因此，[greenland_colonizer.GetSheHe]现在鼓励[greenland_colonizer.GetCulture.GetCollectiveNounNoTooltip]在那里定居，并鼓励家乡人与格陵兰的海象贸易建立更紧密的联系。"
 north_atlantic.0028.a:0 "[greenland_colonizer.GetCulture.GetCollectiveNounNoTooltip]未来将在格陵兰扮演什么角色？"
 north_atlantic.0029.t:0 "[greenland_colonizer.GetFaith.GetNameNoTooltip]的影响力在格陵兰蔓延"
 north_atlantic.0029.desc:0 "虽然[greenland_colonizer.GetFaith.GetName]在[GetGeographicalRegion('RICE_greenland_struggle_region').GetName]有不小的影响力，但相比之下，[greenland_colonizer.GetFaith.GetAdjective]在格陵兰定居点影响力却不大。\n\n然而，[greenland_colonizer.GetTitledFirstName]试图改变目前的状况。无论是否出于真心，[greenland_colonizer.GetSheHe]试图将[greenland_colonizer.GetFaith.HighGodName]的真理传播到格陵兰这个遥远的、冰冷的世界边疆。[greenland_colonizer.GetSheHe|U]正派遣[greenland_colonizer.Custom('DefaultPriestTitlePlural')]到这些定居点，以扩大那里的[greenland_colonizer.GetFaith.GetAdherentNamePlural]社区，打算吸纳新信徒。"
 north_atlantic.0029.a:0 "现在甚至在格陵兰都能听到向[greenland_colonizer.GetFaith.HighGodName]的祈祷声！"
 north_atlantic.0030.t:0 "远征：挑选领袖"
 north_atlantic.0030.desc.helluland:0 "格陵兰之外还有一些土地，如赫鲁兰。"
 north_atlantic.0030.desc.markland:0 "格陵兰之外还有一些土地，如马克兰。"
 north_atlantic.0030.desc.vinland:0 "格陵兰之外还有一些土地，如文兰。"
 north_atlantic.0030.desc:0 "通过赞助那里的探险，我们可以找到有用的资源，#italic 如果#!我们成功，那么我们可以与当地人进行贸易\n\n当我开始组织这次探险时，我要仔细考虑谁来领导这次探险的问题。这个人需要有勇气、有智慧、有能力；领导的强弱会对探险队造成不同影响。"
 north_atlantic.0030.desc.some_courtiers:0 "\n\n宫廷中有一些人表示有兴趣成为探险队的领袖。我应该给予他们这个荣誉，还是应该再考虑一下其他人选？"
 north_atlantic.0030.desc.no_courtiers:0 "\n\n遗憾的是宫廷中没有人有兴趣成为探险队的队长！我需要找到一个人承担这个职责，以使这次远征得以实现！"
 north_atlantic.0030.a:0 "[candidate_1.GetFirstNameNoTooltip]是[candidate_1.GetWomanMan]的职责"
 north_atlantic.0030.b:0 "[candidate_2.GetFirstNameNoTooltip]将会是好领袖。"
 north_atlantic.0030.c:0 "[candidate_3.GetFirstNameNoTooltip]有能力胜任这个角色。"
 north_atlantic.0030.d:0 "我需要考虑一下"
 north_atlantic.0030.d.tooltip:0 "在接下来的三个月里，你可以通过一个[interaction|E]来邀请一个[courtiers|E]成为[greenland_expedition|E]的[greenland_lead|E]。起初表示有兴趣的[courtiers|E]仍然可以得到这个提议，他们会自动接受。如果你没有选择任何人或三个月期满后没有人接受你的请求，那么将随机生成一个角色作为[greenland_leader|E]"
 north_atlantic.0031.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 north_atlantic.0031.desc:0 "我很乐意接受你任命我为探险队的领队提议！一想到要进行这样的冒险，我就很兴奋，我很感谢你对我能力的信任。我保证我不会让你失望！"
 north_atlantic.0031.a:0 "妙哉！"
 north_atlantic.0031.tooltip:0 "[recipient.GetTitledFirstName]已被任命为[greenland_expedition|E]的[greenland_leader|E]"
 north_atlantic.0032.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 north_atlantic.0032.desc:0 "抱歉，我不能接受你的提议。虽然我很感谢你对我能力的信任，但我在这里的职责使我无法进行这样的冒险，我相信你会理解的，大人。"
 north_atlantic.0032.a:0 "多么令人失望。"
 north_atlantic.0032.tooltip:0 "你仍有一些时间可以通过[interaction|E]请求另一位[courtier|E]作为[greenland_lead|E][greenland_expedition|E]。如果你没有选择任何人或者在探险队准备完毕时没有人接受你的请求，那么将随机生成一个角色作为[greenland_leader|E]。"
 north_atlantic.0033.t:0 "远征：启航！"
 north_atlantic.0033.desc.helluland:0 "今天是我组织的远征队将启程前往赫鲁兰的日子。我来到[province.GetName]的港口为他们送行。"
 north_atlantic.0033.desc.markland:0 "今天是我组织的远征队将启程前往马克兰的日子。我来到[province.GetName]的港口为他们送行。"
 north_atlantic.0033.desc.vinland:0 "今天是我组织的远征队将启程前往文兰的日子。我来到[province.GetName]的港口为他们送行。"
 north_atlantic.0033.desc.picked_leader:0 "\n\n这支探险队由[leader.GetTitledFirstName]领导，他是我亲自挑选的领导人。希望我对[leader.GetHerHis]能力的信任是正确的。\n"
 north_atlantic.0033.desc.custom_leader:0 "\n\n我无法从我的廷臣中找到一个愿意出征的领袖，所以我不得不求助于招募[leader.GetTitledFirstName]，一个住在我的领地内的资深旅行者。我对[leader.GetHerHim]并不了解，所以我只能希望我没有犯错。"
 north_atlantic.0033.desc:0 "\n\n[leader.GetFirstNameNoTooltip]向我保证，船员们的精神状态很好，他们已经为这次伟大的冒险做好准备。我只能希望这次旅行不要出什么差错，[leader.GetSheHe]和[leader.GetHerHis]的船员们能够顺利返回，无论是丰厚的财宝、与当地人的贸易机会、新的发现，还是其他什么。"
 north_atlantic.0033.a:0 "一路顺风！"
 north_atlantic.0033.tooltip:0 "[greenland_expedition|E]大约会持续一到两年，其间会经历三个“[expedition_episodes|E]”。这些[expedition_episodes|E]可以有#Bold #P 正面#!#!、#Bold #N 负面#!#!或#Bold 中性#!的结果，决定了[greenland_expedition|E]是被认为是#P 成功#!还是#N 失败#!。有时结果会受到[greenland_expedition_leader_s|E][skills|E]的影响。"
 north_atlantic.0034.t:0 "远征：回归"
 north_atlantic.0034.desc.helluland:0 "我们派往赫鲁兰的远征队已经回来了！\n\n"
 north_atlantic.0034.desc.markland:0 "我们派往马克兰的远征队已经回来了！\n\n"
 north_atlantic.0034.desc.vinland:0 "我们派往文兰的远征队已经回来了！\n\n"
 north_atlantic.0034.desc.leader_dead:0 "不幸的是，[leader.GetFirstName]没有活到这一天，因为[leader.GetSheHe]在旅途中去世了。不过我还是见到了幸存的船员，我要问一下具体情况。"
 north_atlantic.0034.desc.leader_not_dead:0 "我去见[leader.GetFirstName]，向[leader.GetHerHim]询问[leader.GetSheHe]在远征期间的各种冒险。不出意外的话，应该有很多故事可以听。"
 north_atlantic.0034.desc.failure:0 "\n\n不幸的是，看来这次远征最终是一个#bold #N 失败的结果#!#!。探险队一路上挫折练练，但[leader.GetFirstNameNoTooltip]至少做到了[leader.GetHerHis]尽力探索这个边疆地区，找到新的资源以及友好的当地人。\n\n但是我们没有获得任何的优势或信息来帮助格陵兰定居点，这次探险甚至可能让格陵兰定居点在资源和人力方面损失不少。"
 north_atlantic.0034.desc.success:0 "\n\n看来这次远征最终是一个#bold #P 成功的结果#!#!。探险队一路上没有什么大苦难，[leader.GetFirstNameNoTooltip]在探索这个边境地区时，成功获得了很多有用的资源、人员和信息。\n\n毫无疑问，这次远征的好处将极大地帮助格陵兰定居点。也许我们在未来可以再派一支探险队到这个地区！这将是另一个为我们赢得更多荣耀的好机会!"
 north_atlantic.0034.a.failure:0 "这是一个非常令人失望的结果"
 north_atlantic.0034.a.success:0 "真是一个美妙的结果"
 north_atlantic.0034.tooltip.success:0 "因为[greenland_expedition|E]有#Bold #P 正面[THIS.Char.MakeScope.Var('RICE_expedition_success_value_temp').GetValue]#!#!和#Bold #N 负面[THIS.Char.MakeScope.Var('RICE_expedition_failure_value_temp').GetValue]#!#![expedition_episodes|E]，因此它被视为#Bold #P 成功#!#!。"
 north_atlantic.0034.tooltip.failure:0 "因为[greenland_expedition|E]有#Bold #P 正面[THIS.Char.MakeScope.Var('RICE_expedition_success_value_temp').GetValue]#!#!和#Bold #N 负面[THIS.Char.MakeScope.Var('RICE_expedition_failure_value_temp').GetValue]#!#![expedition_episodes|E]，因此它被视为#Bold #N 失败#!#!。"
 north_atlantic.0034.tooltip.increase.resilience:0 "[greenlands|E][greenland_resilience|E]增加#P [THIS.Char.MakeScope.Var('RICE_resilience_value_temp').GetValue]#!@RICE_greenland_resilience_icon!#V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0034.tooltip.increase.networks:0 "[greenlands|E][greenland_networks|E]增加#P [THIS.Char.MakeScope.Var('RICE_networks_value_temp').GetValue]#!到@RICE_greenland_networks_icon!#V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0034.tooltip.increase.viability:0 "[vinlands|E][vinland_viability|E]增加#P [THIS.Char.MakeScope.Var('RICE_viability_value_temp').GetValue]#!到@RICE_vinland_viability_icon!#V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
 north_atlantic.0034.tooltip.decrease.resilience:0 "[greenlands|E][greenland_resilience|E]减少#N [THIS.Char.MakeScope.Var('RICE_resilience_value_temp').GetValue]#!到@RICE_greenland_resilience_icon!#V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0034.tooltip.decrease.networks:0 "[greenlands|E][greenland_networks|E]减少#N [THIS.Char.MakeScope.Var('RICE_networks_value_temp').GetValue]#!到@RICE_greenland_networks_icon!#V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
