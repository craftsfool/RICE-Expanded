 north_atlantic.0170.t:0 "$RICE_greenland_struggle_ending_integration_decision$"
 north_atlantic.0170.desc:0 "长久以来格陵兰被浩瀚海洋隔开，成为两个世界的边界。有一些人怀疑，很久以前由来自欧洲的无畏先驱者建立的格陵兰定居点能否在如此恶劣的气候下持续下去。\n\n在我的领导下，格陵兰定居点不再是世界上一个贫穷的角落，它已经成为北大西洋文明中一个强大的、适应性强的、充满活力的部分。\n\n就像曾经的海象牙一样涓涓细流进入欧洲港口，格陵兰为整个地区人民、思想、文化和贸易带来了大洪水。现在就看我们如何决定格陵兰下一步命运了。"
 north_atlantic.0170.a:0 "北大西洋的人民应该携手共建更为紧密的联系！"
 north_atlantic.0170.b:0 "格陵兰发展得益于贸易。让我们拭目以待吧。"
 north_atlantic.0170.c:0 "远北的定居点必须坚韧且强大。"
 north_atlantic.0171.t:0 "北大西洋的$RICE_greenland_struggle_ending_integration_decision$"
 north_atlantic.0171.desc:0 "长久以来格陵兰被浩瀚海洋隔开，成为两个世界的边界。有一些人怀疑，很久以前由来自欧洲的无畏先驱者建立的格陵兰定居点能否在如此恶劣的气候下持续下去。\n\n然而在[struggle_ender.GetTitledFirstName]的领导下，格陵兰定居点不再是世界上一个贫穷的角落，它已经成为北大西洋文明中一个强大的、适应性强的、充满活力的部分。"
 north_atlantic.0171.desc.closing.cultural:0 "\n\n[struggle_ender.GetFirstNameNoTooltip]决心扩大居住在大西洋两岸的人民之间的文化和外交联系，这可能是一个合作与和平的新时代吗？"
 north_atlantic.0171.desc.closing.economic:0 "\n\n格陵兰的繁荣要归功于贸易，就[struggle_ender.GetFirstNameNoTooltip]而言，必须继续支持这些贸易网络，特别是海象牙的出口。"
 north_atlantic.0171.desc.closing.community:0 "\n\n正如[struggle_ender.GetFirstNameNoTooltip]所理解的那样，持续繁荣的关键是在整个北大西洋发展强大的、有弹性的定居点，无论环境或政治气候如何，都能蓬勃发展。"
 north_atlantic.0171.desc.closing:0 "\n\n只有时间才能告诉我们，[struggle_ender.GetFirstNamePossessiveNoTooltip]的做法是否会给格陵兰岛带来进一步的繁荣。无论怎样格陵兰定居点都将继续存在。"
 north_atlantic.0171.a:0 "北大西洋迎来了一个新时代。"
 north_atlantic.0172.t:0 "[struggle_ender.GetCulture.GetNameNoTooltip]主权"
 north_atlantic.0172.desc:0 "自从东方民族在格陵兰定居以来，已经过了很长时间，他们才与我们——[ROOT.Char.GetCulture.GetCollectiveNoun]接触。\n\n这些民族中有些更加和平，渴望交流思想和商品。其他的……则不然；那些敌对、傲慢的人把我们和大西洋另一边的人称为“斯克雷林人”，还有其他一些不敬的名字。不管怎样，我们也开始探索和定居在欧洲。\n\n我们[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]已经成为这些奇异的东方土地上的一股有影响力的力量，以及大西洋两岸的主要纽带，而不是格陵兰。我们的敌人畏惧我们，而我们的朋友尊重我们作为贸易和政治上的可靠伙伴。\n\n作为[ROOT.Char.GetCulture.GetNameNoTooltip]领袖中最有影响力的人，我要决定我们的人民应该如何在我们的新家园中维护我们的主权和扩大我们的影响力："
 north_atlantic.0172.a:0 "通过文化和贸易和平地进行"
 north_atlantic.0172.b:0 "利用直接和间接的政治网络"
 north_atlantic.0172.c:0 "通过扩大我们的军事存在来进行"
 north_atlantic.0173.t:0 "$north_atlantic.0172.t$"
 north_atlantic.0173.desc:0 "当格陵兰最初被定居时，其定居者不可避免地与大西洋西侧的原住民发生了联系，这些原住民最终开始在欧洲探索和定居。随着时间的推移，他们的力量和影响越来越大，特别是[struggle_ender.GetCulture.GetCollectiveNoun]\n\n现在在伟大的[struggle_ender.GetTitledFirstName]的领导下，[struggle_ender.GetCulture.GetCollectiveNounNoTooltip]被他们的敌人所惧怕，被他们的朋友所尊重和敬佩。曾经的原住民正在他们新的家园宣扬自己的主权，并取代格陵兰成为大西洋两岸联系的主要纽带。"
 north_atlantic.0173.desc.closing.social:0 "\n\n[struggle_ender.GetTitledFirstNameNoTooltip]被认为是一位明智的统治者，他希望通过建立贸易网络和与[struggle_ender.GetCulture.GetNameNoTooltip]邻国进行文化交流来和平地扩大[struggle_ender.GetHerHis]影响力。他们不再被诋毁为“斯克雷林人”（丑人），相反，人们更喜欢称他们为“日落讲者”，他们在外交和贸易方面的技能正引领北大西洋走向更光明的未来。"
 north_atlantic.0173.desc.closing.political:0 "\n\n[struggle_ender.GetTitledFirstNameNoTooltip]被认为是一个明智的统治者，他希望通过政治手段扩大[struggle_ender.GetCulture.GetNameNoTooltip]影响力，找到直接和间接的方法来联系和控制欧洲的地方统治者，[struggle_ender.GetCulture.GetCollectiveNounNoTooltip]不再被诋毁为“斯克雷林人”（丑人），相反许多人喜欢称他们为“日落领主”，承认他们在北大西洋的权威。"
 north_atlantic.0173.desc.closing.military:0 "\n\n[struggle_ender.GetTitledFirstNameNoTooltip]被认为是一个明智的统治者，他希望通过增加他们的军事存在来扩大[struggle_ender.GetCulture.GetNameNoTooltip]的影响力，来自西大西洋的勇敢战士们现在热衷于前往欧洲冒险或充当雇佣兵。[struggle_ender.GetCulture.GetCollectiveNounNoTooltip]不再被诋毁为“斯克雷林人”（丑人），相反，许多人更喜欢称他们为“日落战士”，这是他们称霸北大西洋的标志。"
 north_atlantic.0173.a:0 "毫无疑问，这是北大西洋新的一天。"
 north_atlantic.0174.t:0 "遗弃格陵兰岛"
 north_atlantic.0174.desc:0 "许久前格陵兰定居点刚建立时，谁能想到它的历史会以这种方式结束？格陵兰岛的定居点曾经是纵横交错的北大西洋贸易网络的一个组成部分。\n\n现在由于各种环境和社会经济的压力，该定居点已不复以往。许多格陵兰人为了更好的机会而迁往欧洲，对于任何仍然牵涉于格陵兰事物的人来说，这都是对他们财富的消磨。\n\n作为北大西洋最有影响力的领导人之一，我已经决定我们应该在仍有余力时及时止损，正式放弃这个定居点。剩下那些希望离开的格陵兰人可以在我们的土地上重新安置，而少数愚蠢的人则任其听天由命。"
 north_atlantic.0174.a:0 "是时候把注意力集中在家里的其他事情上了。"
 north_atlantic.0175.t:0 "$north_atlantic.0174.t$"
 north_atlantic.0175.desc:0 "曾几何时格陵兰以异国奢侈品的来源而闻名，但那些日子早已过去。\n\n近来格陵兰面临着难以克服的环境和社会经济挑战。许多格陵兰人为了寻求更好的机会而迁往欧洲，对于任何仍然牵涉于格陵兰事物的人来说，这都是对他们财富的消磨。\n\n[struggle_ender.GetTitledFirstName]是一位重要的地区领袖，他一直与格陵兰定居点有联系，他认为拖延不可避免的事情是毫无意义的。[struggle_ender.GetSheHe|U]已经采取措施，正式放弃定居点。大多数同意此举的格陵兰人已经心甘情愿地重新安置在北大西洋的各个社区。\n\n如今，毫无疑问，曾经繁荣的格陵兰定居点只剩下凄厉的风声，以及海浪拍打冰面发出的不祥轻吼。"
 north_atlantic.0175.a:0 "$north_atlantic.0009.a$"
