 north_atlantic.0140.t:0 "文兰前哨站"
 north_atlantic.0140.desc:0 "文兰是我的梦，我将#italic 实现！#!。我没有被成本和风险的可悲论调所动摇，也没有想过会有什么负担。文兰是一片肥沃的土地，非常适合定居，即使它没有多少有价值的资源！\n\n我已经能够招募到一些定居者，他们渴望证明他们的勇敢（虽然可能是想远离税收）。但他们将不得不先在这片异国土地上建立一个较小的前哨站，这样做将使我们能够在文兰建立一个行动基地，以便今后在该地区开展活动。在未来，也许这个前哨站会发展成为一个合适的定居点！"
 north_atlantic.0140.a:0 "祝他们好运"
 north_atlantic.0140.a.tooltip:0 "这项工作大约需要一年的时间来完成。"
 north_atlantic.0141.t:0 "文兰监督者"
 north_atlantic.0141.desc.courtiers:0 "在我的宫廷中，有一些人打算代表我监督文兰前哨站。这将是一次危险的旅程，但如果我们成功了，他们的英雄业绩一定会被后人所铭记！"
 north_atlantic.0141.desc.no_courtiers:0 "在我的宫廷里，似乎没有人有兴趣监督我们在文兰前哨站。难道我的廷臣们只是一群懦夫？他们天天抱怨成本和风险，抱怨他们所谓的务实的担心，担心这将使格陵兰岛的资源紧张！那么，他们的冒险之心呢？那冒险呢？勇敢？野心？多么可悲啊！"
 north_atlantic.0141.desc.local:0 "有些人还向我推荐了一个当地的[local.GetWomanMan]，名叫[local.GetFullName]，他作为一个经验丰富的旅行者已经获得获得诸多美誉。[local.GetSheHe|U]可以作为我们在文兰前哨站的监督者。但是[local.GetSheHe]希望为[local.GetHerHis]提供一些经济补偿。"
 north_atlantic.0141.a:0 "[candidate_1.GetFirstName]具有担任监督者的能力和经验。"
 north_atlantic.0141.b:0 "我毫不怀疑[candidate_2.GetFirstNameNoTooltip]作为监督者会做得很好"
 north_atlantic.0141.c:0 "[local.GetFirstNameNoTooltip]有丰富的经验！聘请[local.GetHerHim]来完成这项工作"
 north_atlantic.0141.d:0 "仔细想想，我们不需要监督者"
 north_atlantic.0142.t:0 "来自文兰的新消息"
 north_atlantic.0142.desc:0 "今天，我收到了关于我们最近试图在文兰建立一个前哨基地的消息。"
 north_atlantic.0142.desc.success:0 "\n\n幸运的是，那些反对者已经被证明是错误的......现在我派往丰饶的文兰定居者已经成功地建立了一个前哨！\n\n也许我们甚至可以计划有一天在那里建立一个真正的、永久性的定居点！但我不应该妄自尊大，持反对意见的人是正确的，至少在这个#italic 已经付出高昂代价#!。我们首先需要确保这个前哨站发展得很好，这样我们到目前为止为这个冒险所投入的资源才不会白白浪费。"
 north_atlantic.0142.desc.fail:0 "\n\n尽管我们做出了最大的努力，但似乎那些反对者是对的。由于计划不周，物资和资源有限，当地原住民的敌意等等原因，我派往文兰的定居者都没能在那里建立一个小的前哨。那些在整个磨难中幸存下来的人，都垂头丧气地回来了。\n\n也许我低估了在文兰建立立足点的困难。"
 north_atlantic.0142.a:0 "我们会看到接下来会发生什么。"
 north_atlantic.0143.t:0 "$north_atlantic.0142.t$"
 north_atlantic.0143.desc:0 "[vinland_colonizer.GetTitledFirstName]以我们伟大家族[ROOT.Char.GetDynasty.GetName]的名义在文兰建立一个前哨。[vinland_colonizer.GetHerHis]希望我们能以此为跳板，在这片遥远的传说和神话的土地上实现我们的野心。\n\n相当多的人对这样的冒险是否能长期做好持怀疑态度。虽然文兰是一片郁郁葱葱的肥沃土地，但它甚至离格陵兰（格陵兰本身已经远离文明）也极其遥远，而且缺乏许多有利可图的资源。\n\n我们只能希望[ROOT.Char.GetDynasty.GetName]最后能占上风，希望这个文兰前哨站能成功!"
 north_atlantic.0143.a:0 "我们会看到接下来会发生什么！"
 north_atlantic.0144.t:0 "定居文兰……永远……"
 north_atlantic.0144.desc:0 "许多年前，勇敢的冒险家[leif.GetFirstNameNicknamed]从格陵兰出发，航行在蔚蓝海洋中，发现了一片茂盛的土地，[leif.GetSheHe]将其命名为文兰。随着格陵兰定居点的发展，我们在文兰的活动也越来越多：来自格陵兰岛、冰岛和其他地方的人沿着文兰的海岸建立了小型前哨站，从事勘探、资源收集，以及与友好的当地人进行贸易，并与敌对的人作战。\n\n我们[ROOT.Char.GetDynasty.GetName]家族，一直是文兰领导家族之一。随着格陵兰岛定居点牢牢地成为北大西洋世界的一部分，现在是我们最终将目光转向西部的时候了。\n\n我已经收集了所需的资源和定居者，以便将我们的文兰前哨站变成一个永久的定居点。为了避免误解，我还将我们的意图通知了当地的盟友，他们似乎很希望我们的人民之间增加商业、文化和外交联系。"
 north_atlantic.0144.a:0 "我们只能盼望一切顺利！"
 north_atlantic.0144.a.tooltip:0 "这项工作大约需要一年的时间来完成。"
 north_atlantic.0145.t:0 "永久文兰定居点"
 north_atlantic.0145.desc:0 "我们做到了！\n\n今天从文兰传来了好消息，我派出的定居者和物资的船只已经成功地在文兰建立一个属于我们家族的定居点。我们在当地人民也期待着新的机会，在贸易和战争中与我们一起合作。\n\n事实上，这一事件对定居点来说是如此的变革，以至于那里的许多人开始认同为一个新的民族，有些人称他们为[new_culture.GetCollectiveNoun]。\n\n文兰不再被认为是我们已知世界的边缘地带，甚至与格陵兰岛相比也是如此。虽然我承认在经济效益方面它永远无法与格陵兰岛相提并论，但在我们家族的领导下，我相信文兰还是可以作为欧亚大陆和美洲之间的一个重要连接点。"
 north_atlantic.0145.a:0 "我期待看到文兰的发展与繁荣。"
 north_atlantic.0146.t:0 "$north_atlantic.0145.t$"
 north_atlantic.0146.desc:0 "多年前，当[leif.GetFirstNameNicknamed]发现文兰时，许多人认为长期定居文兰岛是不切实际的，因为它甚至离格陵兰岛（格陵兰本身已经离欧洲很远了）都很远，而且缺乏可盈利的资源。\n\n从那时起，情况发生了变化。随着商业、文化和外交网络的发展，格陵兰已经转变为北大西洋文明的一个重要而稳定的部分。随着时间的推移，格陵兰人在文兰岛建立了小型前哨基地，从事贸易、勘探和资源开采。\n\n在[vinland_colonizer.GetTitledFirstName]的领导下，这些前哨站之一已经扩大到足以成为一个相当大的城镇。——这是来自欧亚大陆的人在文兰的第一个永久定居点。虽然这个定居点很小，也没有格陵兰岛那么赚钱，但它肯定会成为北大西洋两岸的一个重要桥梁。那里的许多人甚至开始认同一个新的民族，即[new_culture.GetCollectiveNoun]。\n\n通过实现很少有人认为可能的事情，[vinland_colonizer.GetTitledFirstNameNoTooltip]将与[leif.GetFirstNameNicknamedNoTooltip]一起被铭记为北大西洋历史上最重要的历史人物之一。"
 north_atlantic.0146.a:0 "一个真正的历史性事件！"
 north_atlantic.0147.desc:0 "自从[leif.GetFirstNameNicknamed]发现文兰岛以来，许多人都考虑过在那里建立一个类似于格陵兰岛的大型永久性定居点的可能性。现在，随着格陵兰岛定居点的稳定和能够长期存在，一些人试图在文兰实现这样的目标。\n\n特别是[vinland_person.GetTitledFirstName]已经决定采取行动，带头建立这样一个定居点。[vinland_person.GetSheHe]正在汇集所需的资源和定居者，将[vinland_person.GetHerHis]家族在文兰的前哨扩展为一个相当大的定居点的消息正在传播。\n\n如果并且一旦这项努力成功，那么这个文兰定居点地就可以像格陵兰岛一样，成为连接欧亚大陆和美洲的重要纽带。"
 north_atlantic.0147.a:0 "我们会看到接下来会发生什么……"
 north_atlantic.0147.tooltip:0 "假设[vinland_person.GetFirstNameNoTooltip]或[vinland_person.GetHerHis]的继承人在建立[vinland_colony|E]中取得成功，那么$RICE_north_atlantic_settle_vinland$[decision|E]对其他[rulers|E]是不可利用的。"
