 nubia.0140.t:0 "逃亡的奴隶"
 nubia.0140.desc:0 "我身为[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]，负责管理着努比亚与埃及的边境。\n\n今天本以为会像往常一样处理着永无止境的文书工作，但很快就被[teniellasi.GetTitledFirstName]打破了，[teniellasi.GetHerHis]告诉我，其两名奴隶逃亡了，而且[teniellasi.GetHerHim]还怀疑奴隶已经潜入到我手下[mena.GetFirstName]的领地里。\n\n[teniellasi.GetFirstNameNoTooltip]恳求我采取行动，来弥补[teniellasi.GetHerHim]的顺势，也可以挽回我的声誉。毕竟监视边境往来、缉拿罪犯和可疑分子是我的职责，若是这些奴隶逃到埃及惹是生非，或被怀疑是间谍，还可能引发与[Glossary( '阿斯旺总督', 'GOVERNOR_OF_ASWAN_GLOSS' )][aswan_governor.GetFirstName]的不和。"
 nubia.0140.a:0 "立刻起草一封给[mena.GetFirstName]的信！"
 nubia.0140.b:0 "我没有精力来处理这种工作。"
 nubia.0141.t:0 "谁来担任信使？"
 nubia.0141.desc:0 "我的书吏们已起草完致[mena.GetTitledFirstName]关于[teniellasi.GetTitledFirstNamePossessive]逃亡奴隶的信函。若他们藏身于[GetTitleByKey('c_qurta').GetNameNoTier]某处，但愿[mena.GetFirstNameNoTooltip]能速解决此事，赶在奴隶越境之前，免得在[GetGeographicalRegion('ghw_region_egypt').GetName]也引发事端。\n\n现在我得决定派谁向[mena.GetFirstNameNoTooltip]递送这封信。虽说可派遣寻常信使，但[angelosinkouda.GetTitledFirstName]已经主动提出要处理这件事。派一个#italic 高级官职#!的使者，能让[mena.GetFirstNameNoTooltip]更清楚局势的紧迫性……\n\n毕竟身为[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]，我手头#italic 诸多#!要事等待处理。"
 nubia.0141.a:0 "派一名普通官员去处理这件事。"
 nubia.0142.t:0 "通讯无效"
 nubia.0142.desc:0 "#italic 这是什么意思？#!\n\n我寄给[mena.GetFirstName]关于[teniellasi.GetTitledFirstNamePossessive]逃亡奴隶的信件竟然未能送达？！我雇用的都是些什么人手？我真心希望不必浪费时间去处理这些杂事。\n\n然而更紧迫的是，必须通知[teniellasi.GetFirstNameNoTooltip]，由于我们对此事反应迟缓，[teniellasi.GetHerHis]的奴隶此刻必然已经逃走。[teniellasi.GetSheHe|U]绝#italic 不会#!对此感到满意。"
 nubia.0142.a:0 "“额……[teniellasi.GetFirstNameNoTooltip]，关于奴隶们那件事……”"
 nubia.0143.t:0 "xxxxx"
 nubia.0143.desc:0 "xxxxx"
 nubia.0143.a:0 "xxxxx"
 nubia.0144.t:0 "来自都长的信件"
 nubia.0144.desc:0 "一份来自[Glossary( '[Glossary( '诺巴提亚都长', 'GOVERNOR_OF_ASWAN_GLOSS' )]', 'LORD_OF_THE_MOUNTAIN_GLOSS' )][marianos.GetFirstName]的信件刚刚抵达。\n\n这封信似乎涉及一件紧急事务，[marianos.GetFirstNameNoTooltip]希望我着手调查。身为[ROOT.Char.GetTitleAsNameNoTooltip]我本有其他职责要处理，但既然事情紧急，那便是紧急的。"
 nubia.0144.a:0 "这到底是怎么回事？"
 nubia.0145.t:0 "[marianos.GetFirstNamePossessiveNoTooltip]的信"
 nubia.0145.desc:0 "我开始阅读这封信，开头写道：\n\n#italic 以[marianos.GetFaith.HighGodName]之名，向您致意。我希望您能缉拿[teniellasi.GetFirstNameNoTooltip]的逃亡奴隶，并将这些奴隶送还[teniellasi.GetHerHim]。\n\n[Glossary( '公证员', 'NOTARIOS_GLOSS' )]查尔图拉里奥斯向[mena.GetFirstNameNoTooltip]致敬！#!\n\n信中还包含关于奴隶外貌和姓名的详细信息，以协助我的搜查。如果我没记错，这位[teniellasi.GetFirstNameNoTooltip]是[GetTitleByKey('d_nobatia').GetName]当地的权贵，逃亡奴隶可能越境进入[GetGeographicalRegion('ghw_region_egypt').GetName]引发事端。然而，我还有其他重要职责需要优先处理……"
 nubia.0145.a:0 "我“迟早”会处理这个问题的……"
 nubia.0146.desc:0 "我已收到你的来信。我会抓住[teniellasi.GetFirstName]的逃亡奴隶，但我的资源有限。这可能需要些时间，因为我目前其他要事。"
 nubia.0146.a:0 "这么说……[mena.GetSheHe]根本不可能抓到那些奴隶对吧？"
 nubia.0147.desc:0 "我已收到你的信。我会追捕属于[teniellasi.GetFirstName]的逃亡奴隶，并尽我所能投入资源来处理此事。"
 nubia.0147.a:0 "太好了，希望[mena.GetFirstNameNoTooltip]可以顺利完成。"
 nubia.0148.t:0 "资源分配"
 nubia.0148.desc:0 "像我这样的边境官员经常处理追捕逃，甚至匪患等事情。\n\n我已向[marianos.GetFirstName]承诺，会将[teniellasi.GetTitledFirstNamePossessive]逃跑的奴隶作为优先事项，但我手头资源并不宽裕？\n\n我不可能真的将#italic 全部#!资源都用于搜寻这些奴隶。我还有其他行政任务要处理，其中一些也相当紧急。"
 nubia.0148.a:0 "为此事投入适量的资源。"
 nubia.0149.t:0 "失败：奴隶逃脱"
 nubia.0149.desc:0 "我们花了太多时间试图搜寻[teniellasi.GetTitledFirstNamePossessive]的奴隶，我不得不勉强得出这些奴隶现在很可能已经逃脱了……\n\n[Glossary( '山之主', 'LORD_OF_THE_MOUNTAIN_GLOSS' )][marianos.GetFirstName]为此肯定会感到不悦，毕竟[marianos.GetHerHis]职责就是管辖我们北部边境。我别无选择，只能向[marianos.GetHerHim]汇报这次失败，但不知是否该归咎于我……"
 nubia.0149.a:0 "作为[mena.GetTitleAsNameNoTooltip]，我需要承担责任。"
 nubia.0150.t:0 "$nubia.0149.t$"
 nubia.0150.desc:0 "唉，[mena.GetSheHe]报告说找不到那些奴隶了，他们现在很可能已经超出我们的管辖范围了。\n\n"
 nubia.0150.a:0 "算了，我又不是做慈善的。"
 nubia.0151.t:0 "意外找到"
 nubia.0151.desc:0 "好消息！\n\n我收到消息，在我寄给[mena.GetFirstName]关于[teniellasi.GetTitledFirstNamePossessive]逃亡奴隶的信件在送达[mena.GetHerHim]之前，别处的官员就已经找到这些奴隶了。我已迅速草拟了一封信给[mena.GetFirstNameNoTooltip]，告知[mena.GetHerHim]这些最新进展，并表示[mena.GetSheHe]无需再为此事耗费资源。"
 nubia.0151.a:0 "[teniellasi.GetFirstNameNoTooltip]，我有好消息要告诉你！"
 nubia.0152.t:0 "成功：逃亡奴隶被捕"
 nubia.0152.desc:0 "终于！我的官员们在奴隶即将越境前成功定位并抓获了他们。\n\n[teniellasi.GetFirstName]的奴隶[slave_1.GetFirstName]和[slave_2.GetFirstName]与[marianos.GetTitledFirstName]在[marianos.GetHerHis]给我的信中所提供的信息完全吻合。然而当他们被带到我面前时，果然不出所料地开始乞求宽恕，但现实是残酷的。奴隶终究是奴隶，他们是[teniellasi.GetFirstNamePossessiveNoTooltip]的财产，更何况我还有职责在身。\n\n我的下属们正等待着我下达后续指令，而奴隶们则惊恐地望着我，想知道我会如何决定他们的命运。"
 nubia.0152.a:0 "快滚。趁我还没改变主意赶紧消失。永远别回来！"
 nubia.0153.t:0 "$nubia.0149.t$"
 nubia.0153.desc:0 "奇怪的是，[mena.GetFirstNameNoTooltip]确实成功抓到了那些奴隶，但他们后来又逃走了，现在已经超出我们的管辖范围了。\n\n而且我觉得[mena.GetFirstNamePossessive]报告有些不对劲，关于奴隶逃跑的细节似乎有问题，一些官员指出[mena.GetFirstNameNoTooltip]可能在看守奴隶时过于松懈。总不可能是[mena.GetSheHe]故意让他们轻易逃脱的吧？\n\n好吧，我会把这些矛盾之处归因于[mena.GetFirstNameNoTooltip]的失败，我必须训斥[mena.GetHerHim]，但我首先要做的是将发生的事情告知[teniellasi.GetFirstNameNoTooltip]。"
 nubia.0154.t:0 "某种程度上……成功了？"
 nubia.0154.desc:0 "[mena.GetFirstNameNoTooltip]确实抓住那些奴隶，但却发生了奇怪又可接受的转折。\n\n出于某种原因，[mena.GetFirstNameNoTooltip]对这两名奴隶心生怜悯，买下了他们的自由并允许他们在[mena.GetHerHis]的领地上定居。[teniellasi.GetFirstNameNoTooltip]勉强同意了这一安排，毕竟[teniellasi.GetSheHe]至少获得了财产损失的补偿，而且可以用这笔钱买到更好的奴隶。"
 nubia.0154.a:0 "结果好就好。"
 nubia.0155.t:0 "$nubia.0152.t$"
 nubia.0155.desc:0 "我对[mena.GetFirstNameNoTooltip]的信任是正确的，逃亡奴隶随信抵达，[mena.GetSheHe]果然如承诺那般成功了。\n\n我满意地注视着这一切，同时寄信给[teniellasi.GetFirstNameNoTooltip]传达这个好消息，并将[teniellasi.GetHerHis]的财产归还给[teniellasi.GetHerHim]。\n\n边疆官员的工作虽充满挫折与阻碍，但也不乏成功，譬如今天。"
 nubia.0155.a:0 "这就解决了！"
