 RICE_nubia_aspiration_nahid_al_dawla_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$确保#V 纳西尔·道拉#!、#V 雅勒达库施#!、#V 伊尔德库兹#!和#V 巴德尔·贾迈利#!已死亡，或是你的[vassals|E]或[allies|E]，或未持有任何[titles|E]\n$EFFECT_LIST_BULLET$保持作为[GetTitleByKey('k_egypt').GetNameNoTier][vassal|E]\n$EFFECT_LIST_BULLET$确保非洲王母#V 拉莎蒂#!或你本人担任[GetTitleByKey('k_egypt').GetNameNoTier]的[regent|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey('k_egypt').GetNameNoTier][holder|E]必须遵循[completely_control|E][GetGeographicalRegion('custom_roman_aegyptus').GetName][region|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$若[RICE_baqt|E][situation|E]的埃及[region|E]处于[RICE_baqt_discord|E][situation_phase|E]，则自动推进至[RICE_baqt_accord|E][situation_phase|E]\n$EFFECT_LIST_BULLET$获得#V 2000#![special_troops|E]，包含部分[men_at_arms|E]\n$EFFECT_LIST_BULLET$获得一个[martial_lifestyle|E][perk|E]和一个[intrigue_lifestyle|E][perk|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$确保你或非洲王母#V 拉莎蒂#!是[GetTitleByKey('k_egypt').GetNameNoTier][entrenched_regent|E]（奖励：获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]）\n$EFFECT_LIST_BULLET$使你的[liege|E]对你有[opinion_i|E]#P 75#[opinion|E]或成为你的[friend|E]（奖励：获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]）\n$EFFECT_LIST_BULLET$与一位[king|E][rank|E]或更高的外国[ruler|E]建立[alliance|E]（奖励：获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]）"
 RICE_nubia_historical_aspiration_action_nahid_al_dawla:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论你动机为何，作为非洲军团的主帅，你都将不择手段，不仅要恢复尼罗河沿岸的秩序，更要铲除所有威胁非洲军团及其盟友——王太后拉莎蒂的势力。#!$RICE_nubia_aspiration_nahid_al_dawla_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_nahid_al_dawla:0 "[GetModifier('RICE_nubia_aspiration_become_egypts_military_dictator_nahid_al_dawla').GetNameWithTooltip]"
 RICE_nubia_aspiration_badr_al_jamali_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$确保#V 雅勒达库施#!、#V 纳西尔·道莱#!、#V 纳希德·道莱#!和#V 伊尔德库兹#!已死，或成为你的[vassals|E]或[allies|E]，或未拥有任何$RICE_nubia_aspiration_fatimid_turks_desc$[titles|E]"
 RICE_nubia_historical_aspiration_action_badr_al_jamali:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论你动机为何，你作为黎凡特地区领主，你都将不择手段铲除对手，恢复尼罗河沿岸的秩序，并成为哈里发国摄政。#!$RICE_nubia_aspiration_badr_al_jamali_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_badr_al_jamali:0 "[GetModifier('RICE_nubia_aspiration_become_egypts_military_dictator_badr_al_jamali').GetNameWithTooltip]"
 RICE_nubia_aspiration_defeat_the_traitor_and_the_bandit:0 "[RICE_aspiration|E]：击败叛徒与盗匪"
 RICE_nubia_aspiration_defeat_the_traitor_and_the_bandit_desc:0 "#italic 乔治斯国王派遣其侄子尼迪讨伐劫掠的军阀欧麦尔，但奸诈的尼迪竟已竖起叛旗。无论是智取、外交斡旋还是战场，必须让叛徒与匪首一一臣服，方能重振马库里亚的秩序！#!$RICE_nubia_aspiration_georgios_867_desc$\n\n"
 RICE_nubia_aspiration_take_over_makuria:0 "[RICE_aspiration|E]：接管并平定马库里亚"
 RICE_nubia_aspiration_take_over_makuria_desc:0 "#italic 尼迪的叔叔乔治斯派他率军讨伐肆虐的军阀欧麦尔，但他已看清这位叔父不过是昏聩无能的腐朽君主。马库里亚的王座当属精明能干之人——唯有击败欧麦尔，为马库里亚开创辉煌的新纪元！#!$RICE_nubia_aspiration_niuty_desc$\n\n"
 RICE_nubia_aspiration_ascend_bureaucracy_makuria:0 "[RICE_aspiration|E]：攀登马库里亚权利巅峰"
 RICE_nubia_aspiration_ascend_bureaucracy_makuria_desc:0 "#italic 起于[GetTitleByKey('c_sai').GetNameNoTier]微末农官，梅尔基已逐渐攀上马库里亚的行政阶梯——凭借其农业与财政才能，他志在攀登更高峰。#!$RICE_nubia_aspiration_merki_desc$\n\n"
 RICE_nubia_aspiration_daju_migration_into_darfur:0 "[RICE_aspiration|E]：领导达朱人迁徙至达尔富尔"
 RICE_nubia_aspiration_daju_migration_into_darfur_desc:0 "#italic 在你的领导下，达朱人已开始从努比亚向西迁徙。假以时日，达尔富尔必将成为达朱人的新家园。#!$RICE_nubia_aspiration_kusbur_desc$\n\n"
 RICE_nubia_aspiration_revive_nubia:0 "[RICE_aspiration|E]：复兴努比亚"
 RICE_nubia_aspiration_revive_nubia_desc:0 "#italic 摩西·乔治斯的王国因最近的埃及袭击而满目疮痍，努比亚正面临内外敌人的威胁。他深知努比亚亟需重建并做好准备，以抵御下一场危机。#!$RICE_nubia_aspiration_moses_georgios_desc$\n\n"
 RICE_nubia_aspiration_look_after_nubia_frontier:0 "[RICE_aspiration|E]：守护努比亚边疆"
 RICE_nubia_aspiration_look_after_nubia_frontier_desc:0 "#italic 法蒂玛王朝的崩溃以及近期埃及与努比亚之间的战事，使得边境变得脆弱。作为新任命的诺巴提亚都长的职责是守护努比亚的边疆，并加强努比亚与埃及的经济和外交联系。#!$RICE_nubia_aspiration_eparch_adam_desc$\n\n"
 RICE_nubia_aspiration_spread_stories_tribe_of_dan:0 "[RICE_aspiration|E]：传播但支派传说"
 RICE_nubia_aspiration_spread_stories_tribe_of_dan_desc:0 "#italic 一些犹太人相信伊利达是来自非洲内陆的但支派后裔，但其他人则持怀疑态度，认为他是个骗子。无论如何，他都希望走访世界各地的犹太社区，向他们讲述自己鼓舞人心且引人入胜的故事。#!$RICE_nubia_aspiration_eldad_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_nasir_al_dawla:0 "[RICE_aspiration|E]：成为埃及的军事独裁者"
 RICE_nubia_aspiration_become_egypts_military_dictator_nasir_al_dawla_desc:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论纳西尔·道莱动机为何，他作为突厥军团的主要指挥官，都要不择手段铲除对手，恢复尼罗河沿岸的秩序，并成为哈里发国摄政。#!$RICE_nubia_aspiration_nasir_al_dawla_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_yaldakush:0 "[RICE_aspiration|E]：成为埃及的军事独裁者"
 RICE_nubia_aspiration_become_egypts_military_dictator_yaldakush_desc:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论雅勒达库施动机为何，他作为突厥军团的主要指挥官，都要不择手段铲除对手，恢复尼罗河沿岸的秩序，并成为哈里发国摄政。#!$RICE_nubia_aspiration_yaldakush_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_ildekuz:0 "[RICE_aspiration|E]：成为埃及的军事独裁者"
 RICE_nubia_aspiration_become_egypts_military_dictator_ildekuz_desc:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论伊尔德库兹动机为何，他作为突厥军团的主要指挥官，都要不择手段铲除对手，恢复尼罗河沿岸的秩序，并成为哈里发国摄政。#!$RICE_nubia_aspiration_ildekuz_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_nahid_al_dawla:0 "[RICE_aspiration|E]：维护非洲部队的力量"
 RICE_nubia_aspiration_become_egypts_military_dictator_nahid_al_dawla_desc:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论伊尔德库兹动机为何，作为非洲军团的主帅，他都将不择手段恢复尼罗河沿岸的秩序，更要铲除所有威胁非洲军团及其盟友——王太后拉莎蒂的势力。#!$RICE_nubia_aspiration_nahid_al_dawla_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_badr_al_jamali:0 "[RICE_aspiration|E]：成为埃及的军事独裁者"
 RICE_nubia_aspiration_become_egypts_military_dictator_badr_al_jamali_desc:0 "#italic 法蒂玛王朝的统治正在崩溃，军队和派系为争夺埃及而展开内斗。无论巴德尔·贾迈利动机为何，他作为黎凡特地区领主，都要不择手段铲除对手，恢复尼罗河沿岸的秩序，并成为哈里发国摄政。#!$RICE_nubia_aspiration_badr_al_jamali_desc$\n\n"
 activity_RICE_nubia_banganarti_pilgrimage_host_an_a:0 "$host_activity_a$"
 activity_RICE_nubia_banganarti_pilgrimage:0 "前往班加纳提朝圣"
 activity_RICE_nubia_banganarti_pilgrimage_desc:0 "在$b_old_dongola$附近有个叫班加纳提的地方。那里的教堂建筑是[GetReligionByKey('christianity_religion').GetAdjective]朝圣地，与[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]密切相关——许多朝圣者甚至专程前往，希望能见到大天使。"
 activity_RICE_nubia_banganarti_pilgrimage_selection_tooltip:0 "前往位于[GetTitleByKey('b_old_dongola').GetNameNoTier]附近的班加纳提进行一次[local_pilgrimage|E]。\n\n$activity_RICE_nubia_banganarti_pilgrimage_context_tooltip$"
 activity_RICE_nubia_banganarti_pilgrimage_context_tooltip:0 "$RICE_nubia_rebuild_banganarti_church_context_tooltip$"
 activity_RICE_nubia_banganarti_pilgrimage_host_desc:0 "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$成功蕴梦后可能获得#P 正面#![character_modifier|E]"
 activity_RICE_nubia_banganarti_pilgrimage_guest_desc:0 "$activity_RICE_nubia_banganarti_pilgrimage_host_desc$"
 activity_RICE_nubia_banganarti_pilgrimage_province_desc:0 "班加纳提邻近[GetTitleByKey('b_old_dongola').GetNameNoTier]，是[GetReligionByKey('buddhism_religion').GetName]信徒的重要宗教圣地。"
 activity_RICE_nubia_banganarti_pilgrimage_destination_selection:0 "$activity_RICE_nubia_banganarti_pilgrimage_province_desc$"
 activity_RICE_nubia_banganarti_pilgrimage_guest_help_text:0 "$activity_RICE_nubia_banganarti_pilgrimage$"
 activity_RICE_nubia_banganarti_pilgrimage_predicted_cost:0 "前往[GetTitleByKey('b_old_dongola').GetNameNoTier]附近班加纳提的[local_pilgrimage|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_nubia_banganarti_pilgrimage_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName]活动已经结束了。亲眼见到这座献给圣拉斐尔的教堂，真是令人惊叹！"
 RICE_nubia_banganarti_dream_success_log_title:0 "梦见了大天使拉斐尔"
 RICE_nubia_banganarti_dream_success_log:0 "[CHARACTER.GetShortUIName|U]在拉斐尔圣殿休息时梦见了[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]。"
 RICE_nubia_banganarti_dream_failure_log_title:0 "没梦见拉斐尔"
 RICE_nubia_banganarti_dream_failure_log:0 "[CHARACTER.GetShortUIName|U]在拉斐尔圣殿休息时梦见了[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]。"
 TRAVEL_NAME_FOR_activity_RICE_nubia_banganarti_pilgrimage:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_nubia_banganarti_pilgrimage$"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type:0 "[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]预订"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_none:0 "稍作修整"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_none_desc:0 "$EFFECT_LIST_BULLET$蕴梦成功后不会获得#P 正面#![character_modifier|E]\n\n#weak 我的生活已足够忙碌，实在没有时间在班加纳提的[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]等候[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]赐我美梦。#!"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_small:0 "短暂留宿"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_small_desc:0 "$EFFECT_LIST_BULLET$成功蕴梦后，有#V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_small_chance')]%#!概率获得#P 正面#![character_modifier|E]\n$EFFECT_LIST_BULLET$成功概率基于[piety_level|E]与[virtue|E]及[sin|E][traits|E]\n$EFFECT_LIST_BULLET$额外获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_small_piety_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$本次[activity|E]时长将延长#V 1#! 个月\n\n#weak 我将在班加纳提的[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]待一段时间，但不会太久，只为看看能否让[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]赐我美梦。#!"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_large:0 "长期居住"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_large_desc:0 "$EFFECT_LIST_BULLET$成功蕴梦后，有#V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_large_chance')]%#!概率获得#P 正面#![character_modifier|E]\n$EFFECT_LIST_BULLET$成功概率基于[piety_level|E]与[virtue|E]及[sin|E][traits|E]\n$EFFECT_LIST_BULLET$额外获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_large_piety_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$本次[activity|E]时长将延长#V 3#! 个月\n\n#weak 我愿在班加纳提的[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]长居，希望[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]能赐我美梦。#!"
 activity_RICE_coptic_saint_anthony_pilgrimage_host_an_a:0 "$host_activity_a$"
 activity_RICE_coptic_saint_anthony_pilgrimage:0 "圣安东尼修道院朝圣"
 activity_RICE_coptic_saint_anthony_pilgrimage_desc:0 "尽管圣安东尼修道院位于埃及东部沙漠的绿洲中，但几个世纪以来始终是该地区重要的[GetReligionByKey('christianity_religion').GetAdjective]修道院和朝圣地。"
 activity_RICE_coptic_saint_anthony_pilgrimage_selection_tooltip:0 "前往圣安东尼修道院进行一次[local_pilgrimage|E]，该修道院位于[GetTitleByKey('b_quzlum').GetNameNoTier]以东。\n\n$activity_RICE_coptic_saint_anthony_pilgrimage_context_tooltip$"
 activity_RICE_coptic_saint_anthony_pilgrimage_context_tooltip:0 "xxxxxxxxxxxxxxxxxxxx"
 activity_RICE_coptic_saint_anthony_pilgrimage_host_desc:0 "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$获得与修行和禁欲相关的#P 正面#![character_modifiers|E]"
 activity_RICE_coptic_saint_anthony_pilgrimage_guest_desc:0 "$activity_RICE_coptic_saint_anthony_pilgrimage_host_desc$"
 activity_RICE_coptic_saint_anthony_pilgrimage_province_desc:0 "圣安东尼修道院，位于[GetTitleByKey('b_quzlum').GetNameNoTier]以东，是[GetReligionByKey('buddhism_religion').GetName]信徒的重要宗教圣地。"
 activity_RICE_coptic_saint_anthony_pilgrimage_destination_selection:0 "$activity_RICE_coptic_saint_anthony_pilgrimage_province_desc$"
 activity_RICE_coptic_saint_anthony_pilgrimage_guest_help_text:0 "$activity_RICE_coptic_saint_anthony_pilgrimage$"
 activity_RICE_coptic_saint_anthony_pilgrimage_predicted_cost:0 "前往圣安东尼修道院的[local_pilgrimage|E]成本与你选择的[activity_options|E]有关。"
 activity_RICE_coptic_saint_anthony_pilgrimage_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_coptic_saint_anthony_pilgrimage' ).GetName]已圆满结束。拜访与伟大的圣安东尼相关的圣地，是一次精神上的盛宴！"
 TRAVEL_NAME_FOR_activity_RICE_coptic_saint_anthony_pilgrimage:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_coptic_saint_anthony_pilgrimage$"
 activity_RICE_coptic_saint_catherine_pilgrimage_host_an_a:0 "$host_activity_a$"
 activity_RICE_coptic_saint_catherine_pilgrimage:0 "圣凯瑟琳修道院朝圣"
 activity_RICE_coptic_saint_catherine_pilgrimage_desc:0 "圣凯瑟琳修道院是西奈半岛[GetReligionByKey('christianity_religion').GetAdjective]最受尊敬的圣地之一，不仅与圣凯瑟琳有关，还与《圣经》中的摩西相关联，因此成为热门的朝圣地。"
 activity_RICE_coptic_saint_catherine_pilgrimage_selection_tooltip:0 "前往[GetTitleByKey('c_sinai').GetNameNoTier]的圣凯瑟琳修道院进行[local_pilgrimage|E]。\n\n$activity_RICE_coptic_saint_catherine_pilgrimage_context_tooltip$"
 activity_RICE_coptic_saint_catherine_pilgrimage_context_tooltip:0 "xxxxxxxxxxxxxxxxxxxx"
 activity_RICE_coptic_saint_catherine_pilgrimage_host_desc:0 "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$通过感受修道院或其历史的各个方面获得灵感，获得#P 正面#![character_modifiers|E]。"
 activity_RICE_coptic_saint_catherine_pilgrimage_guest_desc:0 "$activity_RICE_coptic_saint_catherine_pilgrimage_host_desc$"
 activity_RICE_coptic_saint_catherine_pilgrimage_province_desc:0 "位于[GetTitleByKey('c_sinai').GetNameNoTier]的圣凯瑟琳修道院是[GetReligionByKey('buddhism_religion').GetName]信徒的重要宗教圣地。"
 activity_RICE_coptic_saint_catherine_pilgrimage_destination_selection:0 "$activity_RICE_coptic_saint_catherine_pilgrimage_province_desc$"
 activity_RICE_coptic_saint_catherine_pilgrimage_guest_help_text:0 "$activity_RICE_coptic_saint_catherine_pilgrimage$"
 activity_RICE_coptic_saint_catherine_pilgrimage_predicted_cost:0 "前往圣凯瑟琳修道院的[local_pilgrimage|E]成本与你选择的[activity_options|E]有关。"
 activity_RICE_coptic_saint_catherine_pilgrimage_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_coptic_saint_catherine_pilgrimage' ).GetName]已圆满结束。如此古老的修道院，充满了如此丰富的精神与历史底蕴！"
