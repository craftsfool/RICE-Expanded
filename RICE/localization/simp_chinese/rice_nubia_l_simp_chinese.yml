 nubia.0210.e.tooltip:0 "获得#P 正面#![character_modifier|E]的几率取决于你的[learning_i|E][learning|E]、[piety_level|E]、[prestige_level|E]和[legitimacy_level|E]"
 nubia.0211.desc.bad:0 "长老与[ROOT.Char.Custom('DefaultPriestTitlePlural')]对祖先与[ROOT.Char.GetFaith.HighGodName]是否满意此次祭祀而争论，但我觉得总比没有好。"
 nubia.0211.desc.good:0 "长老和[ROOT.Char.Custom('DefaultPriestTitlePlural')]告诉我，祖先和[ROOT.Char.GetFaith.HighGodName]似乎对这次祭品很满意，他们会帮助我们解决问题。"
 nubia.0260.b:0 "还是鼓励他们建造渔船吧。"
 nubia.0260.c:0 "我们没有钱做这种事。"
 nubia.0261.b:0 "注重培训他们的[coptic.GetLanguage.GetNameNoTooltip]"
 nubia.0261.c:0 "注重培训他们的[greek.GetLanguage.GetNameNoTooltip]"
 nubia.0261.d:0 "注重培训他们的[arabic.GetLanguage.GetNameNoTooltip]"
 nubia.0262.tooltip:0 "你的大多数[courtiers|E]都获得了[GetModifier('RICE_nubia_prefers_byzantine_clothing').GetNameWithTooltip]或[GetModifier('RICE_nubia_prefers_indigenous_clothing').GetNameWithTooltip][character_modifier|E]，这反映了他们的时尚偏好。"
 nubia.0262.b:0 "[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]风格能流传至今，自有其道理！"
 nubia.0263.b:0 "无知的外邦人显然对我们一无所知。"
 nubia.0263.info:0 "#emphasis 历史背景：#!包括地理学家卡兹维尼（约公元1203‑1283年）与法蒂玛王朝外交官、什叶派传教士阿斯瓦尼（约公元十世纪）所著的多部中世纪穆斯林文献声称，努比亚统治者是绝对君主，依习俗有权随意将任何人立即贬为奴隶。尽管基督教努比亚确实存在奴隶制，但奴隶多来自对周边异教土地的劫掠，或是因法律惩罚等缘由丧失自由的本地努比亚人。此外，学界虽对中世纪努比亚行政体系的具体形态尚无定论，但可确定这些王国存在某种官僚机构，即便王权鼎盛亦需与之协同施政。"
 nubia.0264.b:0 "啊！我想起来了……真是美好的回忆。"
 nubia.0264.info:0 "#emphasis 历史背景：#!该事件灵感源自苏丹北部地区（特别是古马库里亚王国首都附近的栋古拉）至今仍流行的儿童游戏。虽无法考证该游戏起源于何时，但鉴于只需一根骨头与孩童即可进行，其在前现代时期便已存在的推测并非没有可能。"
 nubia.0265.b:0 "只要文书官恪尽职守，我一点也不介意。"
 nubia.0265.c:0 "确实……我会禁止使用#italic 希吉拉纪元#!"
 nubia.0265.info:0 "#emphasis 历史背景：#!中世纪埃及和努比亚的基督教文献常采用[Glossary( '殉道者纪年', 'ERA_OF_THE_MARTYRS_GLOSS' )]纪年法，但部分文献却使用了伊斯兰教的[Glossary( '希吉拉纪元', 'ERA_OF_THE_HEGIRA_GLOSS' )]。这种现象源于中世纪时期埃及穆斯林、埃及基督徒与努比亚基督徒之间密切的经济、政治及文化交流。但有趣的是，利用该纪元的埃及基督教文献可以相当准确地计算#italic 希吉拉#!的日期，而类似的努比亚文献则往往不太准确。"
 nubia.0266.b:0 "万万不可触碰砖块——我们决不能惊扰灵魂。"
 RICE_every_zealous_nubian_courtier_of_religion:0 "所有拥有[GetTrait('zealous').GetName( GetNullCharacter )]、[GetTrait('humble').GetName( GetNullCharacter )]、[GetTrait('paranoid').GetName( GetNullCharacter )]或[GetTrait('craven').GetName( GetNullCharacter )][traits|E]的[religion|E][courtier|E]"
 nubia.0267.desc.self:0 "\n\n有趣的是，他们似乎没认出我！"
 nubia.0267.b:0 "“啊，对，我听说过这位[ruler.GetTitledFirstNameNoTooltip]……”"
 nubia.0267.c:0 "希望[ruler.GetFirstNameNoTooltip]能继续关照你们。"
 nubia.0267.d:0 "[ruler.GetFirstNameNoTooltip]那么做只是为了赢得你们的好感。"
 nubia.0268.b:0 "我更想吃牛肉，但既然这样就只能这样了。"
 nubia.0268.c:0 "可怜的村民们！收下这些金子帮帮你们自己吧。"
 nubia.0268.info:0 "#emphasis 历史背景：#!在古代和中世纪的努比亚，由于牛具有极高的声望和价值，牛肉在努比亚精英阶层和城市居民中颇受欢迎。而考古证据表明，与之相反，在较贫困的农村聚落，相较于牛肉，羊肉的消费更为普遍。"
 nubia.0269.b:0 "或许我们可以鼓励僧侣专注于精神事务。"
 nubia.0270.b:0 "我祈祷拉斐尔与恶魔战斗并将其消灭。"
 nubia.0270.c:0 "拉斐尔现在真的还为我们做那么多事吗？"
 nubia.0271.b:0 "拉斐尔以不止一种方式守护着我们。"
 nubia.0271.c:0 "告诉我，你在旅途中还见过哪些艺术作品？"
 nubia.0272.b:0 "很荣幸能拜访这座[faith.HouseOfWorship]并分享一些猪肉。"
 nubia.0272.c:0 "牛肉在哪里？你们怎么能只靠猪肉过活？"
 nubia.0272.info:0 "#emphasis 历史背景：#!在现代苏丹，猪乃至食用猪肉都并不常见，因为该国主体为穆斯林。然而，在古努比亚，尤其是在该地区大部分居民为基督徒的中世纪时期（与古努比亚时期不同），猪的饲养日益普遍。尽管当时牛仍然是努比亚最重要的家畜，特别是在精英阶层中，但猪已成为下层阶级和宗教机构重要的食物来源。例如，我们有考古证据表明修道院和教会拥有大型猪群，而到访这些地方的朝圣者可能因此食用大量猪肉。"
 nubia.0273.b:0 "他们最好去帮助[ROOT.Char.GetFaith.HouseOfWorship]。"
 nubia.0274.b:0 "我不在乎你向谁祈祷，只要你是个好战士就行。"
