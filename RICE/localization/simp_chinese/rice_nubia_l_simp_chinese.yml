 RICE_baqt_frontier_fortify_name:0 "#Bold 巩固边防#!"
 RICE_baqt_frontier_fortify_desc:0 "$RICE_baqt_frontier_fortify_name$"
 RICE_baqt_frontier_fortify_tooltip:0 "#italic 尼罗河吸引了企图掠夺其财富的军队、土匪及其他不法之徒。河谷往来旅民的边境安全，皆系于人员充足、维护得当的边境要塞。#!"
 RICE_baqt_frontier_land_sales_name:0 "#Bold 监督土地交易#!"
