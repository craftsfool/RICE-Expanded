 RICE_the_tribe_of_dan_legend_name:0 "但支派"
 RICE_the_tribe_of_dan_legend_desc:0 "据说以色列十个失散支派之一的但支派后裔，在非洲深处的某个地方延续了数百年，[danite.GetTitledFirstName]便是延续至今的明证。"
 RICE_the_tribe_of_dan_legend_chapter_opening_new_title:0 "“耶和华在怒气，忿怒，大恼恨中将他们从本地拔出来，扔在别的地上，像今日一样。”很久很久以前，以色列王国覆灭时，十二支派中有十支被强行流放，据说再未回归。这些失落的支派之一便是但支派——在[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]降临之前，世间的[ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip]对其踪迹一无所知。"
 RICE_the_tribe_of_dan_legend_chapter_motivation_new_title:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]自称是但支派的后裔，热爱冒险，渴望见识更广阔的世界。然而[ROOT.Legend.GetProtagonist.GetHerHis]的抱负远不止于漫游。[ROOT.Legend.GetProtagonist.GetSheHe|U]在旅途中，亲眼见证了世界各地[ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip]族群蒙受的苦难，他们需要希望；他们需要鼓舞。"
 RICE_the_tribe_of_dan_legend_chapter_famous_deed_new_title:0 "但支派在远古时代逃入了库施的深处，而[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]正是从那里崛起。正如圣经上所记：“但那等候耶和华的，必从新得力。他们必如鹰展翅上腾，他们奔跑却不困倦，行走却不疲乏。”\n\n于是[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]如鹰翱翔，远走万里，用[ROOT.Legend.GetProtagonist.GetHerHis]冒险经历与但支派的传奇，激励、告知和款待着散居世界的犹太人。"
 RICE_the_tribe_of_dan_legend_chapter_extra_deed_new_title:0 "有人曾怀疑[ROOT.Legend.GetProtagonist.GetHerHis]传说的真实性，因为就连[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]都承认这些故事有时显得荒诞不经。但[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]始终坚守信念，因为[ROOT.Legend.GetProtagonist.GetHerHis]深深记得《箴言》中的教诲：“在你一切所行的事上都要认定祂，祂必指引你的路。”"
 RICE_the_tribe_of_dan_legend_chapter_conclusion_new_title:0 "凭借[ROOT.Legend.GetProtagonist.GetHerHis]雄辩的口才与坚定意志，以及对上帝的信仰和对全世界[ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip]社群智慧与决心的信赖——这些社区热情接纳了[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，并认真聆听[ROOT.Legend.GetProtagonist.GetSheHe]的故事——[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]最终成功完成了使命：既让失落的但支派重见天日，也为[ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip]子民揭示了新的希望——纵经万般苦难，未来依然期望，因上帝永伴他们身旁。"
