 RICE_nile_pastoralists_positive_modifier:0 "与尼罗河农牧民的关系得到改善"
 RICE_nile_pastoralists_positive_modifier_desc:0 "该[RICE_nile_river|E]沿岸的农耕社区对周边游牧群体持更为友善的态度。"
 RICE_nile_pastoralists_positive_modifier_enhanced:0 "与尼罗河农牧民的关系得到大幅改善"
 RICE_nile_pastoralists_positive_modifier_enhanced_desc:0 "该[RICE_nile_river|E]沿岸的农耕社区对周边游牧群体展现出前所未有的欢迎与友好态度，从而为所有人带来了更大的繁荣。"
 RICE_nile_pastoralists_negative_modifier:0 "与尼罗河农牧民的紧张关系"
 RICE_nile_pastoralists_negative_modifier_desc:0 "该[RICE_nile_river|E]沿岸的农耕社区对周边游牧群体持防备甚至敌队的态度。"
 RICE_nile_farmers_positive_modifier:0 "与尼罗河农民的关系得到改善"
 RICE_nile_farmers_positive_modifier_desc:0 "该[RICE_nile_river|E]沿岸的游牧民社区对周边农民群体持更为友善的态度。"
 RICE_nile_farmers_positive_modifier_enhanced:0 "与尼罗河农民的关系得到大幅改善"
 RICE_nile_farmers_positive_modifier_enhanced_desc:0 "该[RICE_nile_river|E]沿岸的游牧民社区对周边农民群体展现出前所未有的欢迎与友好态度，从而为所有人带来了更大的繁荣。"
 RICE_nile_farmers_negative_modifier:0 "与尼罗河农民的紧张关系"
 RICE_nile_farmers_negative_modifier_desc:0 "该[RICE_nile_river|E]沿岸的游牧民社区区往往剥削和掠夺该地区的农耕社区"
 RICE_nubia_expanded_nile_irrigation_networks:0 "扩建尼罗河灌溉网络"
 RICE_nubia_expanded_nile_irrigation_networks_desc:0 "当地社区正采用努比亚地区常用的成熟技术，例如[Glossary( '波斯轮', 'SAQIA_GLOSS' )]和特定挖渠方法，以扩大尼罗河水的灌溉范围。"
 RICE_nubia_maintained_hafirs:0 "维护哈菲尔水库"
 RICE_nubia_maintained_hafirs_desc:0 "当地社区要么在建造新的[Glossary( '哈菲尔水库', 'HAFIR_GLOSS' )]，要么更可能是在扩建现有的[Glossary( '哈菲尔水库', 'HAFIR_GLOSS' )]，并确保该地区始终有充足的水源供应。\n\n#EMP $RICE_nubia_agriculture_decision_hafir_effect_tooltip_1$#!"
 RICE_nubia_imported_cattle:0 "引进非努比亚牛种"
 RICE_nubia_imported_cattle_desc:0 "当地社区正在引进外来牛种，以增加该地区牛品种多样性，这与古老的努比亚牛种形成了鲜明对比。"
 RICE_nubia_bred_cattle:0 "努比亚牛的繁育"
 RICE_nubia_bred_cattle_desc:0 "当地社区正投入资源，繁育越来越多原本就在努比亚社会中占重要地位的现有牛种。"
 RICE_baqt_textiles_modifier:0 "纺织品"
 RICE_baqt_textiles_modifier_desc:0 "该角色根据[RICE_baqt|E]的某些协议，收到了来自埃及的纺织品，包括亚麻布、奢华衣物、地毯等。"
 RICE_baqt_foodstuffs_modifier:0 "食品"
 RICE_baqt_foodstuffs_modifier_desc:0 "该角色根据[RICE_baqt|E]的约定，从埃及获得了小麦、扁豆和蔬菜等食品。"
 RICE_baqt_olive_oil_modifier:0 "橄榄油"
 RICE_baqt_olive_oil_modifier_desc:0 "该角色根据[RICE_baqt|E]规定，获得来自埃及的橄榄油，无论这些油是在埃及还是地中海其他地区生产的。"
 RICE_baqt_wine_modifier:0 "葡萄酒"
 RICE_baqt_wine_modifier_desc:0 "该角色收到了来自埃及的酒，其中大部分是根据[RICE_baqt|E]的某些协定从远方进口的。"
 RICE_baqt_glass_modifier:0 "玻璃"
 RICE_baqt_glass_modifier_desc:0 "该角色根据[RICE_baqt|E]的某些协议，收到了来自埃及的玻璃制品，无论其原产地是否为埃及。"
 RICE_baqt_horses_modifier:0 "马匹"
 RICE_baqt_horses_modifier_desc:0 "该角色根据[RICE_baqt|E]的约定，从埃及获得了马匹。"
 RICE_baqt_exotic_beasts_modifier:0 "异域野兽"
 RICE_baqt_exotic_beasts_modifier_desc:0 "该角色根据[RICE_baqt|E]的约定，从努比亚获得了异域野兽，这些野兽大多捕获自非洲更南部的地方。"
 RICE_baqt_metals_modifier:0 "金属"
 RICE_baqt_metals_modifier_desc:0 "该角色根据[RICE_baqt|E]的约定，从努比亚获得了金属，比如黄金、矿石和宝石。"
 RICE_baqt_ebony_modifier:0 "乌木"
 RICE_baqt_ebony_modifier_desc:0 "该角色从努比亚获得了乌木，这些乌木采自非洲更南部的森林深处，是[RICE_baqt|E]的一部分。"
 RICE_baqt_slaves_modifier:0 "奴隶"
 RICE_baqt_slaves_modifier_desc:0 "该角色从努比亚获得了奴隶，这些奴隶是在非洲各地捕获的，是[RICE_baqt|E]的一部分。"
 RICE_baqt_ivory_modifier:0 "象牙"
 RICE_baqt_ivory_modifier_desc:0 "该角色从努比亚获得了象牙，这些象牙取自非洲更南边腹地的大象，是[RICE_baqt|E]的一部分。"
 RICE_baqt_animal_skins_modifier:0 "动物毛皮"
 RICE_baqt_animal_skins_modifier_desc:0 "该角色从努比亚获得动物毛皮，这些毛皮可能来自当地的动物，也可能来自非洲更深处，是[RICE_baqt|E]的一部分。"
 RICE_opinion_baqt_correspondence_good:0 "边境总督的良好沟通"
 RICE_opinion_baqt_correspondence_bad:0 "边境总督的互相诋毁"
 RICE_east_african_tattoo_decision:0 "接受避邪纹身"
 RICE_east_african_tattoo_decision_tooltip:0 "这些宗教纹身将保护我免受伤害"
 RICE_east_african_tattoo_decision_desc:0 "[ROOT.Char.GetCulture.GetName]的[ROOT.Char.GetFaith.GetAdherentNamePlural]通常会纹小型护身纹身，常常是神圣符号的形状，比如[ROOT.Char.GetFaith.ReligiousSymbol]。我应该也去纹一个这样的纹身。"
 RICE_east_african_tattoo_decision_effect_tooltip_1:1 "xxxxx"
 RICE_east_african_tattoo_decision_confirm:0 "该去纹身了！"
 RICE_east_african_tattoo_decision_context_tooltip:0 "#emphasis 历史背景：#!宗教纹身在东北非许多地区自古就具有重要意义，从古埃及到埃塞俄比亚皆是如此。例如，考古学家曾发现中世纪努比亚人的木乃伊遗骸上纹有圣米迦勒的花押字或十字架图案。即使在更近的年代，科普特基督徒也会在身上纹一个小十字架纹身，部分原因是为了强化他们在以穆斯林为主的社会中作为少数群体的身份认同，甚至在某些群体至今仍相信这些纹身具有神秘力量。"
 RICE_nubia_repaint_banganarti:0 "班加纳提重绘王室人物"
 RICE_nubia_repaint_banganarti_tooltip:0 "将你的前任画在班加纳提教堂群的墙壁上"
 RICE_nubia_repaint_banganarti_desc:0 "班加纳蒂多年来一直是[GetTitleByKey('b_old_dongola').GetNameNoTier]附近重要的朝圣中心，一直与该地区的王室有着密切联系，当地统治者有着把最近去世的前任统治者绘到教堂墙上的传统。"
 RICE_nubia_repaint_banganarti_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_repaint_banganarti_confirm:0 "轮到我给班加纳蒂留下印记了！"
 RICE_nubia_repaint_banganarti_context_tooltip:0 "#emphasis 历史背景：#!xxxxx"
 RICE_nubia_repaint_banganarti_predecessor_req:0 "前任[primary_title|E]已去世，去世时是一位[GetReligionByKey('christianity_religion').GetAdjective][faith|E]信徒"
 RICE_nubia_agriculture_decision:0 "参与努比亚尼罗河农业"
 RICE_nubia_agriculture_decision_tooltip:0 "我们拥有多种传统方法来提高尼罗河流域的农业产量。"
 RICE_nubia_agriculture_decision_desc:0 "自[ROOT.Char.GetCulture.GetCollectiveNoun]与我们的祖先居住在[GetGeographicalRegion('RICE_nile_river_valley').GetName]以来，我们一直运用多种传统方法来提高尼罗河流域的农业产量。"
 RICE_nubia_agriculture_decision_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_agriculture_decision_confirm:0 "感谢[ROOT.Char.GetFaith.HighGodName]馈赠我们尼罗河！"
 RICE_nubia_agriculture_decision_context_tooltip:0 "#emphasis 历史背景：#!努比亚与北方的埃及邻邦相似，当地居民采用了多种方法来充分利用境内的尼罗河洪水。其中许多方法需要整个地方的参与，或得到当地精英阶层的支持。"
 RICE_NUBIAN_AGRICULTURE_PICK_TYPE:0 "尼罗河永恒！"
 RICE_nubia_agriculture_decision_select_text:0 "我们应该如何提高[RICE_nile|E]沿岸的农业生产效率？\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_nubia_agriculture_expand_irrigation_name:0 "#Bold 扩建尼罗河灌溉网络#!"
 RICE_nubia_agriculture_expand_irrigation_desc:0 "$RICE_nubia_agriculture_expand_irrigation_name$"
 RICE_nubia_agriculture_expand_irrigation_tooltip:0 "#italic 自古以来，我们的祖先就运用各种方法扩大尼罗河水的灌溉范围，最大限度地提升这片土地的肥沃度。#!"
 RICE_nubia_agriculture_construct_hafirs_name:0 "#Bold 维护哈菲尔水库#!"
 RICE_nubia_agriculture_construct_hafirs_desc:0 "$RICE_nubia_agriculture_construct_hafirs_name$"
 RICE_nubia_agriculture_construct_hafirs_tooltip:0 "#italic [Glossary( '哈菲尔水库', 'HAFIR_GLOSS' )]自埃及[Glossary( '法老', 'PHARAOH_GLOSS' )]与库施[Glossary( '至尊', 'QORE_GLOSS' )]及[Glossary( '女王母亲', 'KANDAKE_GLOSS' )]时代起，便已在该地区修建。农民与牧民至今仍共同利用这些蓄水池。#!"
 RICE_nubia_agriculture_import_cattle_name:0 "#Bold 进口牧群#!"
 RICE_nubia_agriculture_import_cattle_desc:0 "$RICE_nubia_agriculture_import_cattle_name$"
 RICE_nubia_agriculture_import_cattle_tooltip:0 "#italic 一些努比亚社区正在利用长途贸易路线进口具有各种优良特性的新型牧群。#!"
 RICE_nubia_agriculture_breed_cattle_name:0 "#Bold 饲养牧群#!"
 RICE_nubia_agriculture_breed_cattle_desc:0 "$RICE_nubia_agriculture_breed_cattle_name$"
 RICE_nubia_agriculture_breed_cattle_tooltip:0 "#italic 牛自古以来一直是努比亚人生活中不可或缺的一部分，某些古老的牛种至今仍在繁育，并与宗教机构有着密切关联。#!"
 RICE_nubia_rebuild_banganarti_church:0 "重建班加纳提教堂"
 RICE_nubia_rebuild_banganarti_church_tooltip:0 "班加纳提的老教堂正在倒塌，应该建一座新的。"
 RICE_nubia_rebuild_banganarti_church_desc:0 "位于靠近[GetTitleByKey('b_old_dongola').GetNameNoTier]的班加纳提教堂，是当地人敬奉[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]的重要场所。然而，这座教堂正在逐渐坍塌，如果我们修复并重建这座教堂，也许能吸引更多的的[GetReligionByKey('christianity_religion').GetAdjective]信徒前来朝拜……"
 RICE_nubia_rebuild_banganarti_church_effect_tooltip_1:1 "[GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName][activity|E]将允许来自[GetTitleByKey('b_old_dongola').GetNameNoTier]附近更远范围的[rulers|E]参与。"
 RICE_nubia_rebuild_banganarti_church_effect_tooltip_2:1 "在[GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName][activity|E]期间，于[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]圣殿进行#V 蕴梦#!的成功率显著提升。"
 RICE_nubia_rebuild_banganarti_church_effect_tooltip_3:1 "解锁$RICE_nubia_banganarti_pilgrimage_dream_incubation_type_large$[activity_option|E]选项，用于[GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName][activity|E]，可进一步提升在[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]圣殿成功进行#V 蕴梦#!概率。"
 RICE_nubia_rebuild_banganarti_church_confirm:0 "赞美大天使拉斐尔！"
 RICE_nubia_rebuild_banganarti_church_context_tooltip:0 "#emphasis 历史背景：#!班加纳提位于马库里亚首都栋古拉附近，是中世纪晚期努比亚地区重要的基督教朝圣与信仰中心。该地深受马库里亚王室庇护（其艺术品中大量出现王室成员形象），与圣拉斐尔信仰紧密相连。其声名远播，甚至有史料记载曾有一位盲人穆斯林和一位说法语的加泰罗尼亚人慕名到访。"
 RICE_nubia_update_list_of_faras_bishops:0 "更新法拉斯主教座堂的主教名单"
 RICE_nubia_update_list_of_faras_bishops_tooltip:0 "法拉斯主教座堂的墙上挂着一份主教名单。"
 RICE_nubia_update_list_of_faras_bishops_desc:0 "宏伟的[GetTitleByKey('b_faras').GetNameNoTier]主教座堂是[GetReligionByKey('christianity_religion').GetName]首次传入[GetGeographicalRegion('RICE_greater_nubia_region').GetName]的见证，教堂墙壁上镌刻着历代主教的姓名与画像供人纪念。我们应当更新这份名录，让信徒能继续敬奉它。"
 RICE_nubia_update_list_of_faras_bishops_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_update_list_of_faras_bishops_confirm:0 "愿这座主教座堂长存于世！"
 RICE_nubia_update_list_of_faras_bishops_context_tooltip:0 "#emphasis 历史背景：#!根据传统记载，基督教最早于公元543年传入努比亚，当时北部的诺巴提亚王国皈依基督教，不过在此之前，可能已经有几十年的基督教化了。诺巴提亚首都法拉斯的主教堂作为努比亚基督教核心中心延续数世纪，即便在诺巴提亚被马库里亚吞并后依然如此。教堂内部分区域持续记录该城主教名录直至13世纪，这可能是努比亚人用于纪念或宗教仪式。"
 RICE_nubia_update_list_of_faras_bishops_req:0 "尚未采取[decision|E]"
 RICE_christian_commission_donor_portrait:0 "委托制作捐赠者肖像画"
 RICE_christian_commission_donor_portrait_tooltip:0 "在[GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip]的某一宗教建筑中委托他人为自己画像"
 RICE_christian_commission_donor_portrait_desc:0 "几个世纪以来，有权势且虔诚的[GetReligionByKey('christianity_religion').GetAdherentNamePlural]赞助并将自己肖像融入大型艺术作品（如教堂与主教座堂）的方式彰显信仰，我也希望能赞助一幅这样的个人画像。"
 RICE_christian_commission_donor_portrait_effect_tooltip_1:1 "你将根据你的[piety_level|E]和[rank|E]获得[piety_i|E][piety|E]、[prestige_i|E][prestige|E]以及[legitimacy_i|E][legitimacy|E]"
 RICE_christian_commission_donor_portrait_confirm:0 "以[GetPlayer.GetFaith.HighGodNameAlternate]之名！"
 RICE_christian_commission_donor_portrait_context_tooltip:0 "#emphasis 历史背景：#!在中世纪的基督教世界，从英格兰到埃塞俄比亚，人们会委托创作包含自己形象的基督教场景或主题艺术品。有时这种表现很隐晦，例如捐赠者可能以平民的形象出现在耶稣诞生图的角落。有时则更为直白，比如努比亚地区的王室成员常以巨幅精美壁画的形式出现在教堂墙壁上，画面醒目且庄严。"
 RICE_christian_donor_portrait_PICK_TYPE:0 "$RICE_christian_commission_donor_portrait_confirm$"
 RICE_christian_commission_donor_portrait_select_text:0 "捐赠者肖像画应该侧重哪一方面呢？\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_christian_donor_portrait_self_name:0 "#Bold 我自己#!"
 RICE_christian_donor_portrait_self_desc:0 "$RICE_christian_donor_portrait_self_name$"
 RICE_christian_donor_portrait_self_tooltip:0 "#italic 捐赠画像将以我本人为原型，彰显我的宗教虔诚。#!\n\n$EFFECT_LIST_BULLET$根据你的[rank|E]额外获得[legitimacy_i|E]#V [EmptyScope.ScriptValue('minor_legitimacy_gain')]#![legitimacy|E]\n$EFFECT_LIST_BULLET$根据你的[rank|E]额外获得[prestige_i|E][prestige|E]"
 RICE_christian_donor_portrait_family_name:0 "#Bold 至亲#!"
 RICE_christian_donor_portrait_family_desc:0 "$RICE_christian_donor_portrait_family_name$"
 RICE_christian_donor_portrait_family_tooltip:0 "#italic 捐赠画像将以我本人与我的至亲为主。#!\n\n$EFFECT_LIST_BULLET$增加[close_family|E]对你的[opinion_i|E][opinion|E]\n$EFFECT_LIST_BULLET$根据[rank|E]额外获得[dynasty_prestige_i|E][dynasty_prestige|E]"
 RICE_christian_donor_portrait_clergy_name:0 "#Bold 教士#!"
 RICE_christian_donor_portrait_clergy_desc:0 "$RICE_christian_donor_portrait_clergy_name$"
 RICE_christian_donor_portrait_clergy_tooltip:0 "#italic 捐赠画像将以我和[court|E]中的[clergy|E]为主。#!\n\n$EFFECT_LIST_BULLET$你的[court_chaplain|E]以及身为[clergy|E]的[courtiers|E]和[vassals|e]增加对你的[opinion_i|E][opinion|E]\n$EFFECT_LIST_BULLET$根据你的[rank|E]额外获得[piety_i|E][piety|E]"
 RICE_nile_pastoralists_positive_decision:0 "欢迎尼罗河牧民"
 RICE_nile_pastoralists_positive_decision_tooltip:0 "我们可以与牧民邻居合作。"
 RICE_nile_pastoralists_positive_decision_desc:0 "[RICE_nile_river|E]的肥沃水域几个世纪以来一直吸引着牧民，虽然我们之间关系起伏不断，但也存在合作的机会，我们应当邀请那些友好的群体进入我们的领地。"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_1:1 "#P 增加#!与临近[tribal|E]或[nomadic|E][government|E][rulers|E]的[opinion|E]"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_2:1 "你可以支付随机数量的[gold|E]，数额在[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_min')]#!和[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_max')]#!之间，从而获得额外的[special_troops|E]，其中包括一些[men_at_arms|E]"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_3:1 "拥有[GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip][county_modifier|E]的[counties|E]将替换为[GetModifier('RICE_nile_pastoralists_positive_modifier_enhanced').GetNameWithTooltip][modifier|E]"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_4:1 "该[decision|E]在[RICE_nile_river|E]当前遭遇[bad_nile_flood|E]时#P 减少#![gold_i|E][gold|E]消耗"
 RICE_nile_pastoralists_positive_decision_confirm:0 "团结互助，繁荣昌盛！"
 RICE_nile_pastoralists_positive_decision_context_tooltip:0 "#emphasis 历史背景：#!尼罗河沿岸农耕和游牧社区共存了数千年，有时和平相处、进行贸易，有时则互相敌对。不过多游牧民偶尔会从事农耕，以至于两者界限模糊，而尼罗河沿岸城市化程度较高地区的统治者有时与游牧群体保持着密切的联系。"
 RICE_nile_pastoralists_negative_decision:0 "抵制尼罗河牧民"
 RICE_nile_pastoralists_negative_decision_tooltip:0 "我们不应天真地信任我们的游牧邻居。"
 RICE_nile_pastoralists_negative_decision_desc:0 "肥沃的[RICE_nile_river|E]在几个世纪以来一直吸引着牧民和半牧民。虽然其中一些人可能是好人，但更多哪怕没有造成威胁也会带来麻烦，我们必须尽一切努力阻止他们进入我们的土地。"
 RICE_nile_pastoralists_negative_decision_effect_tooltip_1:1 "#N 减少#!与临近[tribal|E]或[nomadic|E][government|E][rulers|E]的[opinion|E]"
 RICE_nile_pastoralists_negative_decision_effect_tooltip_2:1 "该[decision|E]在[RICE_nile_river|E]当前处于[good_nile_flood|E]时#N 增加#![gold_i|E][gold|E]成本"
 RICE_nile_pastoralists_negative_decision_confirm:0 "我们必须警惕他们！"
 RICE_nile_pastoralists_negative_decision_context_tooltip:0 "$RICE_nile_pastoralists_positive_decision_context_tooltip$"
 RICE_nile_farmers_positive_decision:0 "保护尼罗河农民"
 RICE_nile_farmers_positive_decision_tooltip:0 "我们的农耕邻居更适合做朋友，而非迫害他们。"
 RICE_nile_farmers_positive_decision_desc:0 "一些牧民将[RICE_nile_river|E]沿岸定居的族群视为可供掠夺剥削的资源，但我们当中更明智的人认识到，如果我们支持他们，就可以成为合作伙伴和盟友而不是敌人从而共同繁荣。"
 RICE_nile_farmers_positive_decision_effect_tooltip_1:1 "#P 增加#!与临近非[tribal|E]或[nomadic|E][government|E][rulers|E]的[opinion|E]"
 RICE_nile_farmers_positive_decision_effect_tooltip_2:1 "拥有[GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip][county_modifier|E]的[counties|E]将替换为[GetModifier('RICE_nile_farmers_positive_modifier_enhanced').GetNameWithTooltip][modifier|E]"
 RICE_nile_farmers_positive_decision_effect_tooltip_3:1 "该[decision|E]在[RICE_nile_river|E]当前处于[good_nile_flood|E]时#N 减少#![gold_i|E][gold|E]消耗"
 RICE_nile_farmers_positive_decision_confirm:0 "团结互助，繁荣昌盛！"
 RICE_nile_farmers_positive_decision_context_tooltip:0 "$RICE_nile_pastoralists_positive_decision_context_tooltip$"
 RICE_nile_farmers_negative_decision:0 "劫掠尼罗河农民"
 RICE_nile_farmers_negative_decision_tooltip:0 "农耕人都是两脚猪，是我们的粮仓！"
 RICE_nile_farmers_negative_decision_desc:0 "[RICE_nile_river|E]沿岸那些定居的部落有时或许与我们保持友好关系，但有些人将他们视为可掠夺和剥削的资源。这些生活在我领土之下的族群，若想安居乐业，就必须向我们缴纳丰厚的贡品。"
 RICE_nile_farmers_negative_decision_effect_tooltip_1:1 "#N 减少#!与临近非[tribal|E]或[nomadic|E][government|E][rulers|E]的[opinion|E]"
 RICE_nile_farmers_negative_decision_effect_tooltip_2:1 "你将获得随机数量的[gold|E]，数额在[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_min')]#!和[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_max')]#!之间"
 RICE_nile_farmers_negative_decision_effect_tooltip_3:1 "你能获得的最大[gold|E]取决于你的[skills|E]以及你在[RICE_nile_river|E]沿岸拥有多少[counties|E]"
 RICE_nile_farmers_negative_decision_effect_tooltip_4:1 "该[decision|E]在[RICE_nile_river|E]当前处于[bad_nile_flood|E]时#N 增加#![gold_i|E][gold|E]成本"
