 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_climb_good_log:0 "艰苦跋涉到克津山后，[CHARACTER.GetShortUIName|U]感到精神焕发。"
 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_log_title:0 "拜访克津山"
 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_log:0 "[CHARACTER.GetShortUIName|U]在探索据说是圣安东尼曾经居住过的洞穴后受到了启发。"
 RICE_coptic_saint_anthony_pilgrimage_ascetics_log_title:0 "了解苦行僧"
 RICE_coptic_saint_anthony_pilgrimage_ascetics_log:0 "[CHARACTER.GetShortUIName|U]在深入了解圣安东尼修道院苦行僧的生活后获得了感悟。"
 RICE_coptic_saint_anthony_pilgrimage_prayer_log_title:0 "虔诚祈祷"
 RICE_coptic_saint_anthony_pilgrimage_prayer_log:0 "[CHARACTER.GetShortUIName|U]在圣安东尼修道院期间专注于祈祷和礼拜。"
 RICE_coptic_saint_catherine_pilgrimage_inspired_log_title:0 "灵感"
 RICE_coptic_saint_catherine_pilgrimage_inspired_log:0 "[CHARACTER.GetShortUIName|U]在圣凯瑟琳修道院参观时获得感悟"
 RICE_coptic_saint_anthony_pilgrimage_garden_inspired:0 "受圣安东尼花园的启发"
 RICE_coptic_saint_anthony_pilgrimage_garden_inspired_desc:0 "在前往圣安东尼修道院朝圣期间，该角色花时间参观著名的花园，学到了许多管理知识。该花园的果树、葡萄园和农田是[GetGeographicalRegion('ghw_region_egypt').GetName]所有修道院中规模最大的之一。"
 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_inspired:0 "受克津山启发"
 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_inspired_desc:0 "在前往圣安东尼修道院的朝圣途中，该角色艰难地徒步走到修道院附近的山洞和泉水边——那里曾是圣安东尼久居之地。这段旅程虽然体力消耗巨大，却给心灵带来很大的触动。"
 RICE_coptic_saint_anthony_pilgrimage_ascetics_inspired:0 "受苦行僧激励"
 RICE_coptic_saint_anthony_pilgrimage_ascetics_inspired_desc:0 "该角色前往圣安东尼修道院朝圣时，目睹数百年来这里始终聚居着紧密团结的苦修团体，深受激励。"
 RICE_nubia_belly_of_stones:0 "石腹河"
 RICE_nubia_belly_of_stones_desc:0 "#italic 石腹河#!，是尼罗河自第二瀑布向南延伸的一段水域。这片区域以其危险、贫瘠、多岩石的地貌而闻名，鲜有人居住，但在动荡时期，流放者与难民常逃至此地避难。数个世纪以来，明智的统治者在此地修建了小型堡垒、瞭望塔和关卡，以管控往来交通。"
 RICE_nubia_daju_migrations_modifier:0 "达朱迁徙"
 RICE_nubia_daju_migrations_modifier_desc:0 "近年来，来自努比亚的达朱人及其后裔不断涌入此地，彻底改变了该地区的政治、经济和文化格局。"
