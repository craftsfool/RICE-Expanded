 RICE_nubia_aspiration_eparch_adam_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持为[GetTitleByKey('k_nubia').GetNameNoTier]的[vassal|E]\n$EFFECT_LIST_BULLET$持有[GetTitleByKey('d_nobatia').GetNameNoTier][title|E]\n$EFFECT_LIST_BULLET$你或你的[liege|E][completely_control|E][GetTitleByKey('d_nobatia').GetNameNoTier]\n$EFFECT_LIST_BULLET$[GetTrait('RICE_lord_of_the_mountain').GetName( GetNullCharacter )][trait|E]达到#V 100#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$拥有至少@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![gold|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$[GetGeographicalRegion('RICE_nubia_frontier').GetName]内的每个[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#!\n$EFFECT_LIST_BULLET$升级你的[education_trait|E]\n$EFFECT_LIST_BULLET$获得一个[diplomacy_lifestyle|E][perk|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$与至少一位[GetReligionByKey('islam_religion').GetAdjective][ruler|E]签订[truce|E]或成为其[ally|E]（奖励：获得#V 500#![special_troops|E]，包括一些中东[men_at_arms|E]）\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高的[prestige_level|E]（奖励：获得一个[intrigue_lifestyle|E][perk|E]）"
 RICE_nubia_historical_aspiration_action_eparch_adam:0 "#italic 法蒂玛王朝的崩溃以及近期埃及与努比亚之间的战事，使我们北部边境防御薄弱。你作为新任命的诺巴提亚都长，你的职责是守护努比亚北部，并加强努比亚与埃及的经济和外交联系。#!$RICE_nubia_aspiration_eparch_adam_desc$"
