 building_RICE_nubia_throne_hall_of_dongola_desc:0 "$building_type_RICE_nubia_throne_hall_of_dongola_desc$"
 building_type_RICE_nubia_musawwarat_es_sufra:0 "苏丹狮子神庙"
 building_type_RICE_nubia_musawwarat_es_sufra_desc:0 "苏丹狮子神庙曾是古库施国宗教的重要圣地，至今遗址仍令人叹为观止，旁边修建的大型蓄水池，是史上最宏大的[Glossary( '哈菲尔', 'HAFIR_GLOSS' )]之一，至今仍为当地居民和途经此地的牧民所使用。"
 building_RICE_nubia_musawwarat_es_sufra:0 "$building_type_RICE_nubia_musawwarat_es_sufra$"
 building_RICE_nubia_musawwarat_es_sufra_desc:0 "$building_type_RICE_nubia_musawwarat_es_sufra_desc$"
 building_type_RICE_nubia_faras_cathedral:0 "法拉斯主教座堂"
 building_type_RICE_nubia_faras_cathedral_desc:0 "基督教于6世纪在努比亚的诺巴迪亚地区首次扎根；法拉斯主教座堂最初便建于该时期，作为科普特法拉斯教区的中心教堂。数个世纪以来，这座教堂历经多次改造与扩建，其内部精美的壁画艺术价值极高，描绘人物从圣徒到当时的国王与王后，构成了该建筑最显著的艺术特色。"
 building_RICE_nubia_faras_cathedral:0 "$building_type_RICE_nubia_faras_cathedral$"
 building_RICE_nubia_faras_cathedral_desc:0 "$building_type_RICE_nubia_faras_cathedral_desc$"
 building_type_RICE_nubia_pyramids_of_meroe:0 "麦罗埃金字塔群"
 building_type_RICE_nubia_pyramids_of_meroe_desc:0 "库施的王室陵墓位于其古都麦罗埃附近，库施国王建造了众多金字塔，其数量甚至超过了埃及。"
 building_RICE_nubia_pyramids_of_meroe:0 "$building_type_RICE_nubia_pyramids_of_meroe$"
 building_RICE_nubia_pyramids_of_meroe_desc:0 "$building_type_RICE_nubia_pyramids_of_meroe_desc$"
 building_type_RICE_nubia_nuba_mountain_mines_01:0 "努巴金矿"
 building_type_RICE_nubia_nuba_mountain_mines_01_desc:0 "自古以来，努比亚便是著名的黄金产地，被阿拉伯人称为#italic 阿赫丁#!的努巴山脉高地上，蕴藏着多处富饶的纯金与铁矿。"
 building_RICE_nubia_nuba_mountain_mines_01:0 "努巴山区采矿点"
 building_RICE_nubia_nuba_mountain_mines_01_desc:0 "$building_type_RICE_nubia_nuba_mountain_mines_01_desc$"
 building_RICE_nubia_nuba_mountain_mines_02:0 "努巴矿镇"
 building_RICE_nubia_nuba_mountain_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
 building_RICE_nubia_nuba_mountain_mines_03:0 "大型努巴矿镇"
 building_RICE_nubia_nuba_mountain_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_RICE_nubia_nuba_mountain_mines_04:0 "努巴矿城"
 building_RICE_nubia_nuba_mountain_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_type_RICE_nubia_soba_cathedral:0 "索巴主教座堂"
 building_type_RICE_nubia_soba_cathedral_desc:0 "索巴主教座堂基督教荣耀的见证，是远传非洲的福音奇迹。据说连异教徒都会对这些规模宏大、金碧辉煌的教堂赞叹不已。"
 building_RICE_nubia_soba_cathedral:0 "$building_type_RICE_nubia_soba_cathedral$"
 building_RICE_nubia_soba_cathedral_desc:0 "$building_type_RICE_nubia_soba_cathedral_desc$"
 building_type_RICE_nubia_khawr_nubt:0 "$b_khawr_nubt$墓地"
 building_type_RICE_nubia_khawr_nubt_desc:0 "$b_khawr_nubt$在几个世纪以来一直是该地区的权力中心，不同信仰的统治者及其他受人尊敬的领袖都安息于此处，尤其是在#italic 阿克塔赫#!式石冢，这充分证明了该地区宗教的多样性和经济的繁荣。"
 building_RICE_nubia_khawr_nubt:0 "$building_type_RICE_nubia_khawr_nubt$"
 building_RICE_nubia_khawr_nubt_desc:0 "$building_type_RICE_nubia_khawr_nubt_desc$"
 building_type_RICE_nubia_dar_wona:0 "达沃纳石宫"
 building_type_RICE_nubia_dar_wona_desc:0 "在当地的民间传说中，位于达尔富尔山区的达沃纳宫殿是由几百年前的传奇统治者所建，但名字如今几乎无人记得。其石墙气势恢宏，给人一种能经受时间考验的古老建筑的印象。"
 building_RICE_nubia_dar_wona:0 "$building_type_RICE_nubia_dar_wona$"
 building_RICE_nubia_dar_wona_desc:0 "$building_type_RICE_nubia_dar_wona_desc$"
 TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain:0 "\n\n#weak 只要持有$d_nobatia$，#!$TRAIT_FLAG_DESC_rice_egypt_nubia_frontier_traits_xp_gain$"
 trait_RICE_lord_of_the_mountain:0 "山之主"
 trait_RICE_lord_of_the_mountain_name:0 "山之主"
 trait_RICE_former_lord_of_the_mountain_name:0 "前任山之主"
 trait_RICE_lord_of_the_mountain_desc:0 "该角色曾担任[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]，负责维护埃及与努比亚边界并负责努比亚方面的[RICE_baqt|E]。\n\n#weak 该[trait|E]将授予拥有$d_nobatia$[duchy|E]的任何人。#!$TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain$"
 trait_RICE_lord_of_the_mountain_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]曾担任[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]，负责维护埃及与努比亚边界并负责努比亚方面的[RICE_baqt|E]。\n\n#weak 该[trait|E]将授予拥有$d_nobatia$[duchy|E]的任何人。#!$TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain$"
 trait_track_RICE_lord_of_the_mountain:0 "$trait_RICE_lord_of_the_mountain$"
 trait_track_RICE_lord_of_the_mountain_desc:0 "#italic 埃及与努比亚的关系受《[RICE_baqt_treaty|E]》条款约束，边境总督在维护该条约方面扮演着重要角色。#!"
 trait_RICE_lord_of_the_mountain_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是一位卓越的管理者和裁决者，这使其成为$trait_RICE_lord_of_the_mountain$的完美人选。"
 trait_RICE_lord_of_the_mountain_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]在管理领地方面经验丰富，尤其是作为$trait_RICE_lord_of_the_mountain$。"
 trait_RICE_lord_of_the_mountain_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]在担任$trait_RICE_lord_of_the_mountain$期间掌握了许多技能。"
 TRAIT_FLAG_DESC_rice_governor_of_aswan_xp_gain:0 "\n\n#weak 只要持有$c_aswan$，#!$TRAIT_FLAG_DESC_rice_egypt_nubia_frontier_traits_xp_gain$"
 trait_RICE_governor_of_aswan:0 "阿斯旺总督"
 trait_RICE_governor_of_aswan_name:0 "阿斯旺总督"
 trait_RICE_former_governor_of_aswan_name:0 "前任阿斯旺总督"
 trait_RICE_governor_of_aswan_desc:0 "该角色曾担任[Glossary( '阿斯旺总督', 'GOVERNOR_OF_ASWAN_GLOSS' )]一职，传统上作为上埃及总督管辖阿斯旺地区，负责维护埃及与努比亚的边界，并在埃及一侧监督[RICE_baqt|E]交易。\n\n#weak 该[trait|E]授予拥有$c_aswan$[county|E]的角色。#!$TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain$"
 trait_RICE_governor_of_aswan_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]曾担任[Glossary( '阿斯旺总督', 'GOVERNOR_OF_ASWAN_GLOSS' )]，负责维护埃及与努比亚的边境安全，并监督埃及方面的[RICE_baqt|E]。\n\n#weak 此[trait|E]将授予拥有$c_aswan$[county|E]的角色。#!$TRAIT_FLAG_DESC_rice_governor_of_aswan_xp_gain$"
 trait_track_RICE_governor_of_aswan:0 "$trait_RICE_governor_of_aswan$"
 trait_track_RICE_governor_of_aswan_desc:0 "$trait_track_RICE_lord_of_the_mountain_desc$"
 trait_RICE_governor_of_aswan_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是一位卓越的管理者和裁决者，这使其成为$trait_RICE_governor_of_aswan$的完美人选。"
 trait_RICE_governor_of_aswan_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]在管理领地方面经验丰富，尤其是作为$trait_RICE_governor_of_aswan$。"
 trait_RICE_governor_of_aswan_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]在担任$trait_RICE_governor_of_aswan$期间掌握了许多技能。"
 trait_RICE_the_danite:0 "但人"
 trait_RICE_the_danite_desc:0 "该角色声称自己是但支派的后裔，虽然来自非洲内陆，但其所讲述的故事得到部分犹太人的认同，不过并非所有犹太人都相信。"
 trait_RICE_the_danite_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]声称自己是但支派的后裔，虽然来自非洲内陆，但[ROOT.GetCharacter.GetSheHe]所讲述的故事得到部分犹太人的认同，不过并非所有犹太人都相信。"
 trait_track_RICE_the_danite_serpent:0 "蛇"
 trait_track_RICE_the_danite_serpent_desc:0 "#weak “但必作道上的蛇，路中的虺，咬伤马蹄，使骑马的坠落于后。”#!"
 trait_track_RICE_the_danite_justice:0 "法官"
 trait_track_RICE_the_danite_justice_desc:0 "#weak “但必判断他的民，作以色列支派之一。”#!"
 TRAIT_FLAG_DESC_rice_the_danite_unlock_decision:0 "解锁#bold $RICE_eldad_ha_dani_decision$#![decision|E]"
 TRAIT_FLAG_DESC_rice_the_danite_xp_gain:0 "[trait_level_track_xp|E]通过[decision|E]获得，更高的经验值也会影响[decision|E]的成功概率。"
 TRAIT_FLAG_DESC_rice_the_danite_upgrade:0 "完成$RICE_nubia_aspiration_spread_stories_tribe_of_dan$后升级为[GetTrait('RICE_the_danite_upgraded_serpent').GetName( GetNullCharacter )]或[GetTrait('RICE_the_danite_upgraded_justice').GetName( GetNullCharacter )][trait|E]"
 TRAIT_FLAG_DESC_rice_the_danite_removed:0 "该[trait|E]将在角色皈依$judaism_religion$之外的[faith|E]后永久#N 移除#!"
 TRAIT_FLAG_DESC_rice_the_danite_great_success:0 "在采用#bold $RICE_eldad_ha_dani_decision$#![decision|E]时，显著提高成功率"
 trait_RICE_the_danite_upgraded_serpent:0 "但人之蛇"
 trait_RICE_the_danite_upgraded_serpent_desc:0 "该角色声称自己是但支派的后裔，虽然来自非洲内陆，其那些充满奇幻色彩的故事激发了世界各地犹太人的想象力，让人们怀抱希望，相信但人将像一条威猛的巨蛇般，巧妙地带领犹太人战胜敌人。"
 trait_RICE_the_danite_upgraded_serpent_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]声称自己是但支派的后裔，虽然来自非洲内陆，[ROOT.GetCharacter.GetHerHis|U]那些充满奇幻色彩的故事激发了世界各地犹太人的想象力，让人们怀抱希望，相信但人将像一条威猛的巨蛇般，巧妙地带领犹太人战胜敌人。"
 trait_RICE_the_danite_upgraded_justice:0 "但人法官"
 trait_RICE_the_danite_upgraded_justice_desc:0 "该角色声称自己是但支派的后裔，虽然来自非洲内陆，其那些充满奇幻色彩的故事激发了世界各地犹太人的想象力，让人们怀抱希望，相信但人如同法官般，为犹太社群提供了习俗与传统的指引。"
 trait_RICE_the_danite_upgraded_justice_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]声称自己是但支派的后裔，虽然来自非洲内陆，[ROOT.GetCharacter.GetHerHis|U]那些充满奇幻色彩的故事激发了世界各地犹太人的想象力，让人们怀抱希望，相信但人如同法官般，为犹太社群提供了习俗与传统的指引。"
 RICE_nubia_aspiration_georgios_867_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_nubia').GetNameNoTier]的[independent|E][ruler|E]\n$EFFECT_LIST_BULLET$确保你的侄子尼迪未与你处于[war|E]状态，或处于死亡状态、不持有任何[titles|E]、正被[imprisoned|E]、是你的[ally|E]，是你的[vassal|E]且被你[intimidated|E]或[cowed|E]，对你的[opinion|E]至少达到[opinion_i|E]#P 75#!其中之一\n$EFFECT_LIST_BULLET$确保欧麦尔未与你处于[war|E]状态，或处于死亡状态、不持有任何[titles|E]、正被[imprisoned|E]、是你的[ally|E]，是你的[vassal|E]且被你[intimidated|E]或[cowed|E]，或对你的[opinion|E]至少达到[opinion_i|E]#P 75#!其中之一\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得一个[martial_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$升级你的[education_trait|E]\n$EFFECT_LIST_BULLET$获得#V 1000#![special_troops|E]，包括一些[men_at_arms|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('k_nubia').GetNameNoTier]（奖励：你在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]内[completely_control|E]的每个[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]）\n$EFFECT_LIST_BULLET$至少采用一次$RICE_nile_pastoralists_positive_decision$/$RICE_nile_pastoralists_negative_decision$[decision|E]（奖励：分别获得一个[stewardship_lifestyle|E][perk|E]和/或[intrigue_lifestyle|E][perk|E]）"
 RICE_nubia_historical_aspiration_action_georgios_867:0 "#italic 你派遣侄子尼迪率军征讨肆虐的欧麦尔，然而狡诈的他竟举旗反叛。无论是智取、外交斡旋还是战场，必须让叛徒与匪首一一臣服，方能重振马库里亚的秩序！#!$RICE_nubia_aspiration_georgios_867_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_georgios_867:0 "[GetModifier('RICE_nubia_aspiration_defeat_the_traitor_and_the_bandit').GetNameWithTooltip]"
 RICE_nubia_aspiration_niuty_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_nubia').GetNameNoTier]的[independent|E][ruler|E]\n$EFFECT_LIST_BULLET$确保你的叔叔乔治斯与你没处于[war|E]状态，或处于死亡状态、不持有任何[titles|E]、正被[imprisoned|E]、是你的[ally|E]，是你的[vassal|E]且被你[intimidated|E]或[cowed|E]，对你的[opinion|E]至少达到[opinion_i|E]#P 75#!其中之一\n$EFFECT_LIST_BULLET$确保欧麦尔与你没处于[war|E]状态，或处于死亡状态、不持有任何[titles|E]、正被[imprisoned|E]、是你的[ally|E]，是你的[vassal|E]且被你[intimidated|E]或[cowed|E]，对你的[opinion|E]至少达到[opinion_i|E]#P 75#!其中之一\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得一个[martial_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$升级你的[education_trait|E]\n$EFFECT_LIST_BULLET$获得#V 1000#![special_troops|E]，包括一些[men_at_arms|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('k_nubia').GetNameNoTier]（奖励：你在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]内[completely_control|E]的每一个[county|E]都将获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]）\n$EFFECT_LIST_BULLET$至少采用一次$RICE_nile_pastoralists_positive_decision$/$RICE_nile_pastoralists_negative_decision$[decision|E]（奖励：分别获得一个[stewardship_lifestyle|E][perk|E]和/或[intrigue_lifestyle|E][perk|E]）"
 RICE_nubia_historical_aspiration_action_niuty:0 "#italic 你的叔父乔治斯派你率军讨伐肆虐的匪首欧麦尔，但你已看清这位叔父不过是昏聩无能的腐朽君主。马库里亚的王座当属精明能干之人——唯有你才能击败欧麦尔，为马库里亚开创辉煌的新纪元！#!$RICE_nubia_aspiration_niuty_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_niuty:0 "[GetModifier('RICE_nubia_aspiration_take_over_makuria').GetNameWithTooltip]"
 RICE_nubia_aspiration_merki_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$继续作为[GetTitleByKey('k_nubia').GetNameNoTier][ruler|E]的[vassal|E]（或[vassal|E]的[vassal|E]）\n$EFFECT_LIST_BULLET$至少持有#V 3处#![counties|E]或#V 1个#![duchy|E]\n$EFFECT_LIST_BULLET$至少使用过一次$RICE_nubia_agriculture_decision$[decision|E]\n$EFFECT_LIST_BULLET$[piety_level|E]达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]及更高或[prestige_level|E]达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]及更高\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$升级你的[education_trait|E]\n$EFFECT_LIST_BULLET$升级[GetModifier('RICE_nubia_merki_modifier').GetNameWithTooltip][modifier|E]为[GetModifier('RICE_nubia_merki_upgraded_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![gold|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$与[GetTitleByKey('k_nubia').GetNameNoTier][ruler|E]成为[friends|E]或成为[councillor|E]，并确保其对你的好感至少为[opinion_i|E]#P 75#![opinion|E]（奖励：获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![gold|E]）\n$EFFECT_LIST_BULLET$至少使用过一次$RICE_nile_pastoralists_positive_decision$/$RICE_nile_pastoralists_negative_decision$[decision|E]（奖励：获得一个[diplomacy_lifestyle|E]/[intrigue_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$使用$RICE_nubia_agriculture_decision$[decision|E]超过一次（奖励：获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_tiny_resource_bonus')]#![prestige|E]）"
 RICE_nubia_historical_aspiration_action_merki:0 "#italic 从[GetTitleByKey('c_sai').GetNameNoTier]的卑微小官起步，你已在马库里亚的行政体系中逐步攀升——凭借农业与财政方面的才能，你渴望登上更高之位。#!$RICE_nubia_aspiration_merki_desc$"
