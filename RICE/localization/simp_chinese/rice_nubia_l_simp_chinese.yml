 RICE_baqt_frontier_land_sales_tooltip:0 "#italic 由于众多不同民族的交融，以及尼罗河流域农业用地利润丰厚的特性，让地方行政机构参与认证该地区的合法土地交易至关重要。#!"
 RICE_baqt_frontier_fortify_effect_1_tt:0 "任务的成功率取决于你的[martial_i|E][martial|E][skill|E]"
 RICE_baqt_frontier_scrutinize_name:0 "#Bold 审查旅行者#!"
 RICE_baqt_frontier_scrutinize_desc:0 "$RICE_baqt_frontier_scrutinize_name$"
 RICE_baqt_frontier_scrutinize_tooltip:0 "#italic 埃及与努比亚边境受到严密监控。我们需要阻止滋事者入境，并从边境另一侧引渡任何罪犯。#!"
