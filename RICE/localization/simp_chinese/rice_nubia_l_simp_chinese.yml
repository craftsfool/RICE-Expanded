 catalyst_situation_RICE_baqt_offer_gift_weaker:0 "向弱小的领主提供[RICE_baqt|E][RICE_baqt_gift|E][situation|E]诱因"
 catalyst_situation_RICE_baqt_offer_gift_weaker_desc:0 "向弱小的领主提供[RICE_baqt|E][RICE_baqt_gift|E]"
 RICE_nile_legend_chapter_opening_new_title:0 "尼罗河永恒不息，在尼罗河沿岸的土地上，各个王朝与王国也向尼罗河一样潮起潮落。然而，唯有天命所归的英雄——那些诞生于伟大血脉的后裔才能将尼罗河流域统一为强大而团结的帝国。而[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]正是这样的英雄。"
 RICE_nile_legend_chapter_motivation_new_title:0 "许多国王和女王曾试图征服整个尼罗河谷地，但大多以失败告终。将不同文化、宗教与生活方式的人们团结起来绝非易事。然而在众人失败时，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]却成功了，只因[ROOT.Legend.GetProtagonist.GetSheHe]"
 RICE_nile_legend_chapter_extra_deed_new_title:0 "[ROOT.Legend.GetProtagonist.GetSheHe|U]资助了这片土地上最杰出的工匠与学者，开启了一个知识的黄金时代。[ROOT.Legend.GetProtagonist.GetSheHe]改革了法律，确保王公贵族平民皆公平对待，而且[ROOT.Legend.GetProtagonist.GetSheHe]高尚的生活方式也赢得了众人的钦佩。"
 RICE_nile_legend_chapter_conclusion_new_title:0 "或许有一天，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]建立的帝国也会湮没在历史尘埃中，就如同尼罗河水涨落般兴衰，但若真有那一天，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]必将作为这片土地的伟大领袖被后世铭记——[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其"
 RICE_nile_abbasids_legend_name:0 "阿拔斯王朝的血脉"
 RICE_nile_abbasids_legend_desc:0 "阿拔斯家族，精神与世俗世界的绝对权威，鼎盛时期无人能及，他们从世界之都巴格达统治四方。传说其家族支系遍布四海，甚至深入非洲腹地，其后裔中就包括了[descendant.GetTitledFirstName]。"
 RICE_nile_abbasids_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_abbasids_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$受到了阿拔斯王朝先祖的繁荣与文化成就的启发。尼罗河畔将屹立的不仅是一个强大帝国，更是一个高度发达、博学多识的文明。"
 RICE_nile_abbasids_legend_chapter_famous_deed_new_title:0 "很久以前，阿拔斯王朝在底格里斯河与幼发拉底河畔建立了他们的首都巴格达，那里成为了世界的瑰宝。于是，作为阿拔斯王朝的远支后裔，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]汇集了来自四面八方的[ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip][ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人，在另一条河流——尼罗河，创造了新的世界瑰宝。正如底格里斯河与幼发拉底河滋养了昔日的阿拔斯王朝，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]深知，尼罗河也同样会滋养新生的阿拔斯王朝。"
 RICE_nile_abbasids_legend_chapter_extra_deed_new_title:0 "通过效仿[ROOT.Legend.GetProtagonist.GetHerHis]的先祖，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]为尼罗河之地带来了一个无与伦比的繁荣时代。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_abbasids_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——辉煌的阿拔斯王朝的伟大气魄。"
 RICE_nile_alexander_legend_name:0 "法老亚历山大的血脉"
 RICE_nile_alexander_legend_desc:0 "亚历山大大帝是一位如此传奇的征服者，数个世纪以来，从罗马到印度的伟大国王们都曾敬畏地念叨他的名字。直至今日，尼罗河畔的人们仍在传颂这位伟大法老的故事。他那冒险精神在其同样伟大的后裔[descendant.GetTitledFirstName]身上得以延续。"
 RICE_nile_alexander_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_alexander_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$效仿了亚历山大大帝，毕竟全世界的君主、将领与军阀至今仍在效仿他，渴望成为下一个亚历山大。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]也不例外。"
 RICE_nile_alexander_legend_chapter_famous_deed_new_title:0 "世界各地的王室都声称自己是这位显赫的马其顿国王后裔，但直到[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]出现之前，没有谁能达成亚历山大的半分荣光。然而与他人不同的是，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的确是亚历山大的后裔，此外[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]真正具备大征服者所需的能力、抱负与天赋。伟大帝国从来不是靠血脉继承，而是凭借#italic 实干#!铸就。"
 RICE_nile_alexander_legend_chapter_extra_deed_new_title:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]#italic 的确#!成为了下一个亚历山大，而且某种意义上，[ROOT.Legend.GetProtagonist.GetSheHe]甚至超越了亚历山大。因为亚历山大英年早逝，未能治理他征服的帝国；而[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]则相反，他活着并让帝国成长，再成长，达到更高的巅峰。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_alexander_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——征服者中的征服者，亚历山大大帝的雄才大略。"
 RICE_nile_candace_legend_name:0 "麦罗埃女王坎达凯后裔"
 RICE_nile_candace_legend_desc:0 "尽管早已失落，但知晓传奇人物[Glossary( '坎达凯', 'KANDAKE_GLOSS' )]的人都知道，这位麦罗埃的女王曾英勇抗击亚历山大大帝，成功阻止他入侵埃及以南的任何领土。她的后裔——[descendant.GetTitledFirstName]，至今仍尊崇着她那正义的遗产。"
 RICE_nile_candace_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_candace_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$效仿了麦罗埃女王坎达凯。毕竟鲜有人敢自称与亚历山大大帝军事才能相当，由此可见这位女王是何等非凡。如此辉煌的统治者，正是[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]学习效仿的典范。"
 RICE_nile_candace_legend_chapter_famous_deed_new_title:0 "远方傲慢之人遗忘，甚至诋毁埃及南部人民的伟大历史，然而坎达凯女王却因她的功绩而被载入亚伯拉罕诸典籍。同样，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]也通过[ROOT.Legend.GetProtagonist.GetHerHis]统一尼罗河流域的成就，让世人永记[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]之名。"
 RICE_nile_candace_legend_chapter_extra_deed_new_title:0 "如同坎达凯一般，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]是成为[ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]历代君主中最伟大的一位，并坚定守护着[ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip]信仰。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_candace_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——尊贵的麦罗埃女王坎达凯的伟大精神。"
 RICE_nile_cleopatra_seducer_legend_name:0 "“勾引者”克利奥帕特拉的血脉"
 RICE_nile_cleopatra_seducer_legend_desc:0 "几个世纪以来，人们一直将克利奥帕特拉女王贬低为荒淫暴君。然而像她这样的女性需要非凡的智慧才能生存并成为传奇，而她的遥远后裔——[descendant.GetTitledFirstName]，至今仍在颂扬她的机敏与谋略。"
 RICE_nile_cleopatra_seducer_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_cleopatra_seducer_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$体内流淌克利奥帕特拉之血。与她一样，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]深知抱负、力量与友谊一样重要，而且唯有凭借狡黠方能赢得最终胜利与成功。"
 RICE_nile_cleopatra_seducer_legend_chapter_famous_deed_new_title:0 "罗马人将伟大的克利奥帕特拉女王贬为娼妓，但[ROOT.Legend.GetProtagonist.GetFirstNameNicknamedNoTooltip]和[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人却知晓真相。罗马人视为罪恶与堕落的行径，在[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]及[ROOT.Legend.GetProtagonist.GetHerHis][ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip]和[ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]的追随者眼中，却是一种恪尽职守的睿智，那是超越敌人强势的远见卓识，是超脱凡俗欲望的赤子之爱，如同母亲对子女的眷顾，更是为苍生献身的牺牲之爱。"
 RICE_nile_cleopatra_seducer_legend_chapter_extra_deed_new_title:0 "确实，通过牺牲与谋略，正如[ROOT.Legend.GetProtagonist.GetHerHis]先祖克利奥帕特拉那般，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]将[ROOT.Legend.GetProtagonist.GetHerHis]的名字铭刻于史册。但与克利奥帕特拉不同，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]并非悲剧英雄而是胜利者；不同于她，[ROOT.Legend.GetProtagonist.GetSheHe]亲眼见证了[ROOT.Legend.GetProtagonist.GetHerHis]的帝国迈向愈加辉煌的巅峰。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_cleopatra_seducer_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——风华绝代的克利奥帕特拉女王的倾世权谋。"
 RICE_nile_hermes_legend_name:0 "“三重伟大者”赫耳墨斯的血脉"
 RICE_nile_hermes_legend_desc:0 "许多不同族裔与信仰的民族都尊崇伟大的[Glossary( '三重伟大的赫耳墨斯', 'HERMES_TRISMEGISTUS_GLOSS' )]，感念他为人类知识与智慧所做的贡献。有传言说，[descendant.GetTitledFirstName]身上就流淌着他的血脉。"
 RICE_nile_hermes_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_hermes_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$深受三重伟大的赫耳墨斯知识影响，世上不乏一些心胸狭隘且自命不凡的君主，他们凭借征服与物质财富自诩拥有至高无上的荣耀。然而，真正的荣耀源自知识与智慧，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]成为尼罗河的征服者，正是凭借这些品质而非仅靠[ROOT.Legend.GetProtagonist.GetHerHis]的勇武。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]深刻领悟了[ROOT.Legend.GetProtagonist.GetHerHis]先祖遗留的高深智慧。"
 RICE_nile_hermes_legend_chapter_famous_deed_new_title:0 "宇宙的奥秘不是为意志薄弱者准备的，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]不仅要努力掌握这些奥秘，还要利用它们统一尼罗河，使其在[ROOT.Legend.GetProtagonist.GetHerHis]的[ROOT.Legend.GetProperty( 'culture' ).Culture.GetName]子民和[ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip]信仰下归于一统。最终，这些努力得到了英勇的回报，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]成为了远近闻名的贤明统治者，犹如三重伟大的赫耳墨斯再世。"
 RICE_nile_hermes_legend_chapter_extra_deed_new_title:0 "诚然，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的功绩不胜枚举，然而[ROOT.Legend.GetProtagonist.GetHerHis]在征服方面的作为与[ROOT.Legend.GetProtagonist.GetHerHis]作为圣明君主的伟绩相比，实在黯然失色。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_hermes_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——圣贤中的圣贤，哲人中的哲人，赫耳墨斯·特里斯墨吉斯忒斯的博学多闻。"
 RICE_nile_sesostris_legend_name:0 "征服者法老塞索斯特利斯的血脉"
 RICE_nile_sesostris_legend_desc:0 "历史学家希罗多德曾记载一位名为塞索斯特利斯的[Glossary( '法老', 'PHARAOH_GLOSS' )]，他征服了东地中海大部分地区。[descendant.GetTitledFirstName]作为其后裔，也延续了这一传统，成为了一位强大的君主。"
 RICE_nile_sesostris_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_sesostris_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$效仿了古代国王塞索斯特利斯，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]亲率大军踏遍荒漠平原、山川河流，跨越尼罗河两岸建立了强大的帝国。"
 RICE_nile_sesostris_legend_chapter_famous_deed_new_title:0 "希罗多德曾对塞索斯特利斯一世写下的评价同样适用于[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]：“当他从那里返回埃及时，召集大军横贯大陆，所到之处皆臣服于其麾下。塞索斯特利斯是唯一同时统治埃塞俄比亚的埃及法老。”，显然再强大的人目睹[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的成就也会感到绝望！"
 RICE_nile_sesostris_legend_chapter_extra_deed_new_title:0 "当然，塞索斯特利斯也是一位睿智且勤勉的国王，正如希罗多德所记载的那样。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]同样因其作为而被铭记，尤其是在珍视[ROOT.Legend.GetProtagonist.GetHerHim]的[ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip][ROOT.Legend.GetProperty( 'culture' ).Culture.GetName]人。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_sesostris_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——古埃及最伟大的征服者塞索斯特利斯的雄才大略。"
 RICE_nile_surid_legend_name:0 "苏里德·伊本·萨胡克的血脉"
 RICE_nile_surid_legend_desc:0 "据[ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip][ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人的传说记载，生活在《圣经》大洪水之前的苏里德·伊本·萨胡克国王建造了金字塔，不仅作为自己的陵墓，更为了仁慈地保存洪水后埃及的全部知识。他的后裔[descendant.GetTitledFirstName]正以[descendant.GetHerHis]自己的方式延续着他的遗产。"
 RICE_nile_surid_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_surid_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$是建造者、决策者、守护者。征服一个国家容易，统治一个国家难，而传承给后世则更难。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]深知这一点，正如[ROOT.Legend.GetProtagonist.GetHerHis]在尼罗河沿岸建立伟大帝国的努力中所展现的那样。"
 RICE_nile_surid_legend_chapter_famous_deed_new_title:0 "大洪水之前，人类曾狂妄地相信文明将永世长存，正是由于苏里德这样有远见的统治者，文明才得以延续；大洪水之后，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]为人类承担了同样的职责。[ROOT.Legend.GetProtagonist.GetSheHe|U]不仅统治着诸多疆域，更致力于汇集世间一切知识，建造最不朽的丰碑，为后世子孙留下值得瞻仰与珍视的遗产。"
 RICE_nile_surid_legend_chapter_extra_deed_new_title:0 "正如苏里德在远古时代所做的那样，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]在赢得伟大统治者的称号做出了诸多功绩。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_surid_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——金字塔之父的伟大才能。"
 RICE_nile_umayyads_legend_name:0 "伍麦叶之血"
 RICE_nile_umayyads_legend_desc:0 "数代以来，伍麦叶宗族不断扩张哈里发国的疆域，但所有伟大帝国终将衰亡，伍麦叶家族也在阿拔斯家族的推翻下覆灭。阿拔斯家族力图铲除每一个伍麦叶成员，导致许多成员在随之而来的混乱中惨遭屠戮，不过仍有少数幸运的伍麦叶家族成员成功逃往远方，其中便包括[descendant.GetTitledFirstName]的先祖。"
 RICE_nile_umayyads_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_umayyads_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$曾统治大半个世界的伍麦叶家族，从伊比利亚海岸直至印度与东方帝国边疆。[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]家族曾丢失诸多领地，但这般境遇竟重塑荣光，正如[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]所昭示。[ROOT.Legend.GetProtagonist.GetHerHis|U]建立新帝国的努力不仅本身值得称颂，更因[ROOT.Legend.GetProtagonist.GetSheHe]让伍麦叶家族名字再度遍传世界，在衰落后重振了家族威望。"
 RICE_nile_umayyads_legend_chapter_famous_deed_new_title:0 "人们只能想象[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]伍麦叶家族先祖们感受到的恐惧——当他们拼命逃离唯一熟悉的故土，阿拔斯骑兵紧追不舍，像追杀牲畜般无情追剿这些幸存者。但最终他们抵达尼罗河畔，那里居住着众多支持他们的[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人，得以藏身并获得安全。在此地，他们的子孙繁衍昌盛，最终足以建立新的帝国。"
 RICE_nile_umayyads_legend_chapter_extra_deed_new_title:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]不仅是为了恢复[ROOT.Legend.GetProtagonist.GetHerHis]祖先的荣耀而征服。[ROOT.Legend.GetProtagonist.GetSheHe|U]还确保建立的帝国配得上其名号。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_umayyads_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——典范的伍麦叶家族的伟大气魄。"
 RICE_nubia_historical_aspiration_modifier_desc_eldad:0 "[GetModifier('RICE_nubia_aspiration_spread_stories_tribe_of_dan').GetNameWithTooltip]"
