 nubia.0020.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]纹身"
 nubia.0020.desc:0 "[ROOT.Char.GetCulture.GetName][ROOT.Char.GetFaith.GetAdherentNamePlural]有个传统，在身上会纹上重要宗教符号，比如[ROOT.Char.GetFaith.ReligiousSymbol]，以此保佑我们免受厄运与伤害。\n\n今天，我来到附近一处[ROOT.Char.GetFaith.HouseOfWorship]准备纹一个这样的图案。和纹身师讨论完图案细节后，我已经迫不及待要开始了。"
 nubia.0020.a:0 "愿纹身保护我！"
 nubia.0021.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]捐赠者肖像"
 nubia.0021.desc:0 "我已经联系过[ROOT.Char.GetCulture.GetName]的工匠和[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]，希望能委托他们绘制一幅肖像，将其放入当地[ROOT.Char.GetFaith.HouseOfWorship]，或许可以描绘出[ROOT.Char.GetFaith.ReligiousText]中的某个场景。\n\n虽然这件艺术品的核心当然是宗教主题，但我特别强调这幅画作的重点应当着力呈现"
 nubia.0021.a:0 "赞美[ROOT.Char.GetFaith.HighGodNameAlternate]！"
 nubia.0022.t:0 "[GetTitleByKey('b_faras').GetNameNoTierNoTooltip]的主教们"
 nubia.0022.desc:0 "在古代，[GetReligionByKey('christianity_religion').GetName]通过北方的诺巴提亚王国首次传入[GetGeographicalRegion('RICE_greater_nubia_region').GetName]，该王国以[GetTitleByKey('b_faras').GetNameNoTier]为中心。不久之后，[GetTitleByKey('b_faras').GetNameNoTier]主教座堂建成，成为该地区[GetReligionByKey('christianity_religion').GetAdjective]中心；因此，其主教自那时起便赢得了很高的威望。\n\n[GetTitleByKey('b_faras').GetNameNoTier]主教座堂的墙壁上详尽记载了曾驻守于此的每一位主教的名讳。许多前来教堂的信徒都会瞻仰这份伟岸的名录，并在名录旁绘制的古代主教画像前虔诚礼拜。\n\n最近，"
 nubia.0022.a:0 "这座大教堂必将屹立千秋万代。"
 nubia.0023.t:0 "猴面包树"
 nubia.0023.desc:0 "[GetGeographicalRegion('RICE_greater_darfur').GetName]的土地上生长着许多[Glossary( '猴面包树', 'TEBELDI_TREES_GLOSS' )]。这些树木的枝干中储存大量水分，这导致像我这样的地方统治者不仅被要求维护这些树木，更要将此视为责任。\n\n为此，我刚刚拨出部分资源用于持续维护这些树木——无论是凿空树干开辟新的储水点，还是保护照料现有树木，亦或是种植新树。"
 nubia.0023.a:0 "这是[ROOT.Char.GetTitleAsNameNoTooltip]无法推卸的责任。"
 nubia.0024.t:0 "派谁前往湖边？"
 nubia.0024.desc:0 "山间湖泊是蕴含强大灵性力量的地方，依照我们的传统，应当寻访这些湖泊并通过占卜探知未来。[lake_oracle_province.GetName]的一处湖泊已被确认为举行此仪式的合适地点。\n\n然而，要想从先祖与[ROOT.Char.GetFaith.HighGodName]处获得启示，我们必须派遣合适的人选。\n\n例如，派遣一位可靠的仆人就完全合适。"
 nubia.0024.a:0 "派遣一位可靠的仆人"
 nubia.0025.t:0 "湖预告了什么？"
 nubia.0025.desc:0 "我选派的人在睿智的[ROOT.Char.Custom('DefaultPriestTitlePlural')]陪同下，已抵达[lake_oracle_province.GetName]的山中湖泊，并全天凝视湖水以窥探领地未来，还向湖泊请教。在场众人皆小心避让湖水，因触碰此水可能招致常居湖边的邪魔侵害。\n\n我的代表记录了晨昏时分湖水的色泽，以及风拂过时湖面的涟漪。经内部商议后，他们认定湖中神谕预示着"
 nubia.0025.a:0 "正是如此，正是如此。"
 nubia.0026.t:0 "xxxxx"
 nubia.0026.desc:0 "xxxxx"
 nubia.0026.a:0 "xxxxx"
 nubia.0027.t:0 "舔舐[ROOT.Char.GetFaith.ReligiousText]"
 nubia.0027.desc:0 "《[ROOT.Char.GetFaith.ReligiousText]》是大智慧与大知识的源泉，蕴含着奇迹般的力量。[ROOT.Char.GetCulture.GetName]的[ROOT.Char.GetFaith.GetAdjective]信徒中流传着一项历史悠久的习俗：用可食用材料制成的墨水，在特制的木板上抄写[ROOT.Char.GetFaith.ReligiousText]的经文，再以清水涤去墨迹，将混合液体饮下。\n\n今日我拜访了当地一位精通医术与教义的[ROOT.Char.Custom('DefaultPriestTitle')]，让我也进体验这种习俗。“请喝，”[ROOT.Char.Custom('DefaultPriestTitle')]嘱咐道，“将[ROOT.Char.GetFaith.HighGodName]恩赐的《[ROOT.Char.GetFaith.ReligiousText]》中显现的大法力内化于心。这股力量全然源自祂的意志。”"
 nubia.0027.a:0 "赞美[ROOT.Char.GetFaith.HighGodName]赐予这些典籍！"
 nubia.0028.t:0 "xxxxx"
 nubia.0028.desc:0 "xxxxx"
 nubia.0028.a:0 "xxxxx"
 nubia.0029.t:0 "xxxxx"
 nubia.0029.desc:0 "xxxxx"
 nubia.0029.a:0 "xxxxx"
 nubia.0030.t:0 "扩大灌溉网络"
 nubia.0030.desc:0 "尼罗河是一条古老的河流，它的河水滋养着我们的文明。然而不采取任何措施来最大化利用这些水资源，那是多么愚不可及。\n\n多年来，我们[ROOT.Char.GetCulture.GetCollectiveNoun]人运用了多种方法和技术，例如[Glossary( '波斯轮', 'SAQIA_GLOSS' )]以及各种挖掘灌溉沟渠的方式，来扩展尼罗河水的覆盖范围，增加我们可利用的耕地面积。我身为[ROOT.Char.GetTitleAsNameNoTooltip]通过支持这些传统的[ROOT.Char.GetCulture.GetName]方法，可以让人民将在未来许多年里受益。"
 nubia.0030.a:0 "尼罗河是我们必须利用的资源。"
 nubia.0031.t:0 "维护哈菲尔水库"
 nubia.0031.desc:0 "我们[ROOT.Char.GetCulture.GetCollectiveNoun]人使用[Glossary( '哈菲尔水库', 'HAFIR_GLOSS' )]的历史已无法追溯。这些精妙的水库专为尼罗河沿岸的干旱地貌设计，对农民和牧民都大有裨益。\n\n如今维护先辈们早在古遗迹旁建造的古老#italic 哈菲尔水库#!十分正常，不过我们偶尔也会新建。无论如何，我已下令领地官员根据当地民众需求，维护或新建#italic 哈菲尔水库#!。"
 nubia.0031.a:0 "水安全问题不容忽视。"
 nubia.0032.t:0 "扩大养猪场"
 nubia.0032.desc:0 "尽管牛是[ROOT.Char.GetCulture.GetCollectiveNoun]人最主要的家畜，在我们民族中具有无可比拟的经济和文化重要性，但我听说即使是下层阶级吃猪肉比牛肉多，可见猪也很重要。\n\n在我们尼罗河沿岸的社区里，猪圈日益增多，尤其是在[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorshipPlural]，因为这些[ROOT.Char.Custom('DefaultPriestTitlePlural')]人常常养猪来招待访客、朝圣者以及他们自己。从长远来看，支持这些猪圈的扩张会给我们带来经济收益。"
 nubia.0032.a:0 "猪在这里仍然扮演着关键角色！"
 nubia.0033.t:0 "进口牛"
 nubia.0033.desc:0 "$nubia.0033.desc.intro$如今商路四通八达，使我们可以引进努比亚未曾有过的各类牛种。我因此已采取措施，支持将这些牛种引入我们的土地。"
 nubia.0033.a:0 "显然这将使我们长久受益"
 nubia.0034.t:0 "育种"
 nubia.0034.desc:0 "$nubia.0033.desc.intro$如今尼罗河上，数个世纪以来一直稳定培育着特定品种的牛群。支持它们的持续繁育既能保障这些牛群，也能让我们的子民继续受益。"
 nubia.0034.a:0 "如果没有牛，我们该怎么办？"
