 nubia.0120.t:0 "普通的官僚晋升"
 nubia.0120.desc:0 "我一直在等待的机会出现了！\n\n先前，我不过仅仅是个平庸的[Glossary( '公证员', 'NOTARIOS_GLOSS' )]，但通过我的努力，又或许上头认可我农业和财政事务能力，如今我已晋升至更高职位。\n\n但或许，我还能攀爬得更高，甚至国王的垂青？我是否具备这种抱负与才干？我认为我有！\n\n记住！这仅仅是[merki.GetFirstName]生涯的开端，我将竭尽所能确保多年后当我离世时，我的墓志铭将记载一位伟大[merki.GetWomanMan]的仕途，一位在这片福地上留下[merki.GetHerHis]印记的官员。"
 nubia.0120.a:0 "愿[merki.GetFaith.HighGodName]助我事业进步。"
 nubia.0121.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0121.desc:0 "回顾我在马库里亚王国担任官僚的生涯，我从一个充满抱负、精力充沛的年轻人从文书蜕变成备受众人敬重的权臣。这充满坎坷和起伏，经历了无数个日夜的奋斗，从应付文书工作到应对官僚与宫廷政治。\n\n看看我如今的成就！\n\n年轻时我常幻想人们在我死后会如何铭记我。如今随着年岁渐长，死亡日益临近，我确信我的墓志铭必将记载一位伟大的[merki.GetWomanMan]的仕途，一位在这片福地上留下[merki.GetHerHis]的印记的官员。"
 nubia.0121.a:0 "赞美[merki.GetFaith.HighGodName]在职业生涯中对我的指引。"
 nubia.0122.t:0 "[daju.GetNameNoTooltip]人大迁徙"
 nubia.0122.desc:0 "多年前由于种种灾祸，我们在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]的故土不宜居住，我们[daju.GetCollectiveNoun]人不得不迁徙并寻找新的家园。\n\n在我的领导下，我们向西迁移，远离尼罗河沿岸，穿越许多山脉和沙漠，直到我们到达了一个充满希望的土地——[GetTitleByKey('d_darfur').GetNameNoTier]，我们在那里可以耕种、放牧牲畜和狩猎。\n\n自我们来到这里以来，当地的[tora.GetName]部落一直对我们保持警惕。他们在山中建造了令人印象深刻的石制宫殿和堡垒，但我知道我们可以掌握并改进他们的方法。此外，我相信我们战士的力量，如果必须与这些[tora.GetCollectiveNoun]人发生战争，胜利必将属于我们。"
 nubia.0122.a:0 "我们将在此扎根，开辟新的家园。"
 nubia.0123.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0123.desc:0 "我们从[GetGeographicalRegion('RICE_greater_nubia_region').GetName]故土启程的旅程，并非在抵达[GetTitleByKey('d_darfur').GetNameNoTier]就已结束。建立新家园、为未来奠定根基，同样是这趟征程的一部分。\n\n我有理由相信，[daju.GetName]人为寻找和建立新家园所付出的代价终于迎来了终点。在我的领导下，我们已成为这片土地上最强大的势力，曾经主宰此地的[tora.GetCollectiveNoun]要么臣服于我们，要么离开这里。\n\n我们是这片山脉的新主人，而我是这片土地上第一位真正的国王。我坚信，我的英雄事迹将载入传奇，世世代代铭记！"
 nubia.0123.a:0 "愿我们的子孙后代在此世代繁衍生息！"
 nubia.0124.t:0 "短暂的喘息"
 nubia.0124.desc:0 "$nubia.0124.desc.intro$我与[saladin.GetNicknameNoTooltip]在数年前签订休战协议，恐怕只是短暂的喘息，战火或许有一天会再度降临这片土地。但短暂的喘息终究是喘息，我担任[ROOT.Char.GetTitleAsNameNoTooltip]已多年，我们必须抓住每一个机会，在近期动荡后重建努比亚，让努比亚再次繁荣昌盛。\n"
 nubia.0124.a:0 "虽然艰巨，但#italic 必须#!完成！"
 nubia.0125.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0125.desc:0 "有些努比亚人认为，当我们与由[saladin.GetNickname]率领的可怕的埃及军队作战时，是以卵击石。我并不责怪他们，但我们在战争中不也给埃及人带来了巨大的痛苦和恐惧吗？难道不是那位曾击败十字军的人——[saladin.GetNicknameNoTooltip]向寻求与我们停战吗？那时我们是强大的，现在我们依然强大！\n\n战争确实给我们带来了毁灭，但这也是重建努比亚的机会。我们恢复了城市和[ROOT.Char.GetFaith.HouseOfWorshipPlural]，利用尼罗河，振兴了我们的军队，并重新控制了那些开始质疑我们权威的小部落。\n\n在我的领导下，努比亚不仅生存下来，而且复兴了。像#italic 易货条约#!这样的和约永远无法带来持久的和平，但我们的繁荣和力量会让我们的邻居在背叛与我们的协议时三思而行。"
 nubia.0125.a:0 "努比亚比以往任何时候都更加强大！"
 nubia.0126.t:0 "$nubia.0124.t$"
 nubia.0126.desc:0 "$nubia.0124.desc.intro$双方都心知肚明，[moses_georgios.GetTitledFirstName]与[saladin.GetNicknameNoTooltip]数年前最终达成的休战不过是短暂喘息。我不久前被任命为[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]，[moses_georgios.GetFirstNameNoTooltip]对我寄予厚望，希望我恪尽职守保卫与埃及接壤的北部边疆并重建此地——无论埃及人是否带着和平而来。"
 nubia.0126.a:0 "我绝不会辜负[moses_georgios.GetTitleAsNameNoTooltip]！"
 nubia.0127.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0127.desc:0 "自签订[RICE_baqt_treaty|E]后，[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]便始终守护着努比亚的北部边疆。我们的地位如此显赫，权力仅次于所效忠的国王。\n\n虽然有人可能认为守卫边疆就是抵御袭击和侵略，但远不止如此。这是在强大的努比亚人与埃及人之间开展外交艺术——促进贸易、推动经济，处理文书都是都长单调乏味的琐碎日常。\n\n多年来，我与下属竭尽所能履行这些职责，如今终于见证了劳动成果。历经战乱与动荡，努比亚的北部边疆正在复苏，我坚信这片土地未来数年必将持续繁荣。"
 nubia.0127.a:0 "愿后来人以我为鉴。"
