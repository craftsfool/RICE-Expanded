 nubia.0100.t:0 "神秘的但人"
 nubia.0100.desc:0 "我是“[ROOT.Char.GetDynasty.GetName]”[ROOT.Char.GetFirstName]，是多年前逃往非洲的但支派的后裔，曾游历四方见多识广，至少我在旅途中遇到其他犹太人时，我是这么告诉他们的。\n\n或许我的故事有所夸大；或许其间还掺杂着些许杜撰。但我们犹太人难道不需要这样的故事来激励自己吗？来鼓舞我们吗？来向我们昭示我们肩负着更宏大的天命？\n\n不论其他犹太人是否相信我的故事，无论真假，我深知自己最初来自……"
 nubia.0100.a:0 "与非洲有着历史渊源的也门"
 nubia.0100.b:0 "埃及以南靠近阿比西尼亚的土地"
 nubia.0101.t:0 "$nubia.0100.t$"
 nubia.0101.desc:0 "我在#italic 库施王国土地上#!游历已有多年。我经历过海难、食人族和崇拜火焰的奴隶贩子，正是他们将我带到了[ROOT.Char.GetCurrentLocation.GetName]的市场，幸得一位途经的犹太商人赎身——我对他永远心存感激。\n\n经历了这些冒险之后，一个普通人或许会渴望退休，过上平静的生活，但我不会！我能走到今天，全靠[ROOT.Char.GetFaith.HighGodName]的恩典，祂护佑着我这个但支派的后裔穿越重重磨难。\n\n我已明白[ROOT.Char.GetFaith.HighGodNameAlternate]要我做的事：将所见所闻告知同胞，让我的故事激励选民奔赴更宏大的天命。"
 nubia.0101.a:0 "我将继续冒险，完成自己的使命。"
 nubia.0102.t:0 "xxxxx"
 nubia.0102.desc:0 "xxxxx"
 nubia.0102.a:0 "xxxxx"
 nubia.0103.t:0 "“但人”伊利达的故事"
 nubia.0103.desc:0 "在我联系了[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的[GetReligionByKey('judaism_religion').GetAdjective]领袖后，我抵达的消息已在此地犹太群体中传开。当他们在当地犹太会堂聚集准备聆听我的讲述，当我准备向他们诉说冒险奇遇并解释我的血脉时，我知道所有人都在想着同一件事。\n\n#italic 这位[ROOT.Char.GetFirstNameNoTooltip]·[ROOT.Char.GetDynasty.GetNameNoTooltip]当真来自但支派？#!\n\n我应该根据观众的接受程度，仔细决定要讲什么。"
 nubia.0103.a:0 "用我的奇遇故事使他们尽兴"
 nubia.0104.t:0 "伊利达的故事：成功"
 nubia.0104.a:0 "我很高兴找到了愿意倾听的听众！"
 nubia.0105.t:0 "伊利达的故事：失败"
 nubia.0105.a:0 "对我来说，听众不感兴趣并不是什么新鲜事！"
 nubia.0106.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0106.desc:0 "如今回顾一生，我深感欣慰，我的学识倾囊相授。通过我的努力，一度被认为失传的但支派传说，已在全世界[ROOT.Char.GetFaith.GetReligion.GetAdjective]社群中广为流传。\n\n"
 nubia.0106.a:0 "主啊，愿祢赐平安予我们及全体以色列人。"
