 nubia.0220.t:0 "尼罗河畔的新帝国"
 nubia.0220.desc:0 "并非人人都能整个[GetGeographicalRegion('RICE_nile_river_valley').GetName]统一于一个旗帜之下，并建立统治。\n\n然而我做到了！\n\n这是项伟大的成就，我的下一步便是为这个帝国选取新名。它必须是个好名字，纵然帝国未必永存，其名仍将永驻后世。"
 nubia.0220.a:0 "#bold 尼罗河#!帝国"
 nubia.0221.t:0 "$nubia.0220.t$"
 nubia.0221.desc:0 "只要有足够多的勇士，就算是傻子也能抢下几块地盘。但真正伟大的功业，只有那些血脉高贵、品德出众且无所畏惧的人才能做到。\n\n尼罗河的子民一定会永远记住我的名字，不只因为我是这个新生帝国的开国君主，更因为我那显赫的世系。我绝非那些卑微粗鄙的军阀，[ROOT.Char.GetFaith.WarGodName]之所以选择我成为强大的统治者自有其深意：因为我身上流淌着伟大的血脉，正是这份与生俱来的传承，给了我成就大业的力量与资格。\n\n我的血脉源自……"
 nubia.0221.a:0 "阿拔斯王朝"
 nubia.0222.t:0 "$nubia.0220.t$"
 nubia.0222.desc:0 "尼罗河永存，奈何王朝不是，它们兴衰更迭的速度仿佛尼罗河一般潮起潮落。\n\n然而时不时地就会有一个伟大的帝国沿[GetGeographicalRegion('RICE_nile_river_valley').GetName]崛起，其疆域从[GetGeographicalRegion('ghw_region_egypt').GetName]北部沼泽一直延伸到[GetGeographicalRegion('RICE_greater_nubia_region').GetName]南端的热带草原和山脉。\n\n目前[nile_conqueror.GetTitledFirstName]也成功建立了一个这样的帝国，并将其称为[GetTitleByKey('e_RICE_nile').GetName]。无论是出于真心相信还是出于政治原因，[nile_conqueror.GetFirstName]还声称自己出身自一个伟大血统——"
 nubia.0222.a:0 "这是尼罗河历史的新篇章。"
