 RICE_nubia_lake_oracle_decision_tooltip:0 "山间湖泊的水能向我们揭示许多关于未来的信息。"
 RICE_nubia_lake_oracle_decision_effect_tooltip_1:1 "你可能获得#P 正面#!或#N 负面#![character_modifiers|E]，这表明你[realm|E]潜在的未来。"
