 nubia.0210.t:0 "准备工作"
 nubia.0210.desc:0 "在我们的社会中，没有什么比牛更能彰显一个人的价值。拥有牛的人便拥有财富；拥有牛的人便拥有地位；拥有牛的人便是领袖。\n\n因此，那些寻求祖先与[ROOT.Char.GetFaith.HighGodName]指引与祝福的人，或只是想要举行任何宗教仪式的人，都必须献上他们最珍贵的财产——牛，来表明诚意。\n\n依照传统，我已准备好牛只，并与[ROOT.Char.Custom('DefaultPriestTitlePlural')]齐聚举行这场重要仪式。唯一的问题是，我究竟要向祖先和[ROOT.Char.GetFaith.HighGodName]祈求什么？"
 nubia.0210.a:0 "[diplomacy_i|E]和谐相处"
 nubia.0211.t:0 "仪式"
 nubia.0211.desc:0 "我已为今日的祭祀献上牛群，愿祖先与[ROOT.Char.GetFaith.HighGodName]会感到愉悦！\n\n当我们将灰烬撒在野兽身上时，长老与[ROOT.Char.Custom('DefaultPriestTitlePlural')]带领众人诵念祷文。随后，一人将用长矛刺入野兽的心脏，将其杀死。\n\n在更多的祈祷、仪式乐舞之后，我们将分食牛肉。祭祀结束后，"
 nubia.0211.a:0 "愿他们始终守护着我们。"
