 game_concept_RICE_baqt_african_ruler:0 "非洲统治者"
 game_concept_RICE_baqt_african_rulers:0 "非洲统治者"
 game_concept_RICE_baqt_african_rulers_desc:0 "在[RICE_baqt|E][situation|E]背景下，$game_concept_RICE_baqt_african_rulers$构成一个[situation_participant_group|E]，该群体由#bold #italic 属于#!#!撒哈拉以南[heritage|E][culture|E]的[rulers|E]组成，例如$heritage_east_african_name$或$heritage_somalian_name$[heritage|E]。他们只能与[RICE_baqt_egyptian_rulers|E]交换[RICE_baqt_goods|E]。"
 RICE_opinion_sibir_festival:0 "大瑟必尔庆典"
 nubia.0012.tooltip.intro:0 "#emphasis 历史背景：#!1060年代至1070年代初是法蒂玛埃及极为动荡的时期，后世称之为#italic 大危机#!，尽管一些近代学者推测（通常是后来的）历史资料将其夸大到世界末日的程度。\n\n在记载中，法蒂玛王朝饱受各军事派系之间内战的摧，其中最突出的是黑非洲和突厥部队之间的内战，而且饥荒与尼罗河洪水泛滥使局势更加恶化。最终，亚美尼亚裔将领#bold 巴德尔·贾迈利（Badr al‑Jamali）#!铲除对手后，秩序才得以恢复，法蒂玛哈里发#bold 穆斯坦绥尔#!任命其为维齐尔，并赋予其权力，使得成为#italic 终身且实际的#!军事独裁者。"
 nubia.0012.tooltip.al_mustansir:0 "$nubia.0012.tooltip.intro$\n\n穆斯坦绥尔哈里发于1036年开始执政时，国家初显繁荣稳定，但即便在早期他也几乎毫无实权。其执政初期真正的摄政者是他的母亲拉莎蒂，一位来自非洲的奴隶妾室，曾是他父亲的嫔妃。在他漫长的统治期间，始终无力制止朝廷与军队中各派系的内斗；据记载，法蒂玛内战期间，他的财富遭掠夺成性的军队洗劫一空，最终不得不依靠慈善捐助维持生计。\n\n1094年穆斯坦绥尔去世时，法蒂玛王朝陷入其两个儿子尼扎尔与穆斯塔利之间的继位之争。此时王朝的实际统治力早已大幅削弱。"
 nubia.0012.tooltip.rasad:0 "$nubia.0012.tooltip.intro$\n\n哈里发穆斯坦绥尔于1036年开始执政时，帝国初期繁荣稳定，但即便在早期他也几乎毫无实权，被其母亲拉莎蒂——一位来自非洲的奴隶，曾是他父亲的妾室。\n\n后来，由于法蒂玛军队中突厥派系势力崛起，拉莎蒂权力逐渐丧失。她试图通过支持法蒂玛军队中的非洲部队来制衡，但当后者在内战中落败后，她被迫逃亡至巴格达，此后的记载寥寥无几。"
 nubia.0012.tooltip.nasir_al_dawla:0 "$nubia.0012.tooltip.intro$\n\n#bold 纳西尔·道莱#!是突厥部队的指挥官，曾为法蒂玛帝国效力多时，甚至在战斗中手臂瘫痪。他并非突厥血统，而是10世纪曾控制叙利亚和美索不达米亚大部分地区的阿拉伯哈姆丹家族后裔。\n\n法蒂玛内战中，纳西尔·道莱率领突厥派系战胜非洲派系，成为穆斯坦绥尔的维齐尔。然而其残酷暴政导致突厥派系内部分裂，1073年他与家人遭敌对突厥势力刺杀身亡。"
 nubia.0012.tooltip.badr_al_jamali:0 "$nubia.0012.tooltip.intro$\n\n与其他参与法蒂玛内战的将领不同，巴德尔·贾迈利最初是埃及本土之外唯一的重要将领，在塞尔柱人的猛攻下坚守着法蒂玛帝国在黎凡特的最后领土。\n\n在担任维齐尔期间，巴德尔·贾迈利主导行政改革，资助了许多建筑项目，并击退了塞尔柱人对埃及的进一步进攻。他有效地拯救了法蒂玛政权，但直到1163年新一轮内斗期间——这场内斗最终导致了萨拉丁和阿尤布王朝的崛起，在此之前法蒂玛家族实际上始终是他家族及其他亚美尼亚裔将领的傀儡。"
 nubia.0012.tooltip.nahid_al_dawla:0 "$nubia.0012.tooltip.intro$\n\n#bold 纳西尔·道莱#!是法蒂玛内战期间非洲军团的主要将领。尽管非洲军团在人数上超过突厥部队，但他们大部分都是步成，在内战中落败，其中大部分士兵向南逃往上埃及的阿斯旺地区，与代表法蒂玛王朝统治埃及南部边境的巴努坎兹部落结盟。\n\n虽然非洲军团最终被消灭，但非洲士兵在此后数十年间仍持续为法蒂玛帝国效力。"
 nubia.0012.tooltip.banu_kanz:0 "$nubia.0012.tooltip.intro$\n\n#bold 巴努·坎兹#!曾代表法蒂玛王朝统治埃及南部边境数十年。该部落起源于巴努·哈尼法部落，于九世纪抵达埃及，并通过掌控埃及东部的金矿而繁荣起来。\n\n随着时间的推移，他们与贝贾族的哈达里巴部落通婚，成为该地区重要的权力掮客，如在法蒂玛内战期间。当阿尤布王朝推翻法蒂玛王朝时，巴努·坎兹部落同样被击败，向南迁徙至努比亚，并逐渐融入努比亚的生活方式。"
 nubia.0012.tooltip.ildekuz:0 "$nubia.0012.tooltip.intro$\n\n#bold 伊尔德库兹#!是法蒂玛内战期间突厥部队的指挥官，也是纳西尔·道莱的主要对手。他率领突厥派系取得胜利，但在1073年担任维齐尔期间因其暴政而遭刺杀。巴德尔·贾迈利恢复埃及秩序后，在清洗突厥派系过程中下令暗杀伊尔德库兹。"
 nubia.0012.tooltip.yaldakush:0 "$nubia.0012.tooltip.intro$\n\n#bold 雅勒达库施#! 是法蒂玛内战期间突厥军团的指挥官，也是纳西尔·道莱的主要对手。他率领突厥派系赢得胜利，但在1073年担任维齐尔期间因统治过于暴虐遭刺杀。巴德尔·贾迈利恢复埃及秩序后，在清洗突厥军官过程中下令刺杀了雅勒达库施。"
 nubia.0012.tooltip.kutama:0 "$nubia.0012.tooltip.intro$\n\n#bold 库塔马柏柏尔人#!是法蒂玛帝国军队的一个派系，在法蒂玛内战期间与突厥将领伊尔德库兹结盟。这些柏柏尔人最初是法蒂玛帝国军队的中流砥柱，因为法蒂玛王朝起源于马格里布以西更远的地方。"
 nubia.0012.tooltip.banu_sanin:0 "$nubia.0012.tooltip.intro$\n\n#bold 巴努·萨宁#!是埃及尼罗河三角洲地区的一个阿拉伯部落。法蒂玛帝国内战期间，他们与将领纳西尔·道莱结盟，后者曾率领突厥派系取得胜利，但在1073年因担任维齐尔期间遭刺杀。此前，当伊尔德库兹将纳西尔·道莱逐出开罗时，他曾受到巴努·萨宁部落的庇护。"
 nubia.0012.tooltip.lawata:0 "$nubia.0012.tooltip.intro$\n\n在尼罗河以西沿海和沙漠地区为据点的#bold 拉瓦塔柏柏尔人#!是法蒂玛帝国内战期间的重要派系。这些柏柏尔人最初是法蒂玛帝国军队的中流砥柱，因为法蒂玛王朝起源于马格里布以西更远的地方。"
 nubia.0012.tooltip.taj_al_maluk:0 "$nubia.0012.tooltip.intro$\n\n#bold 塔杰·马鲁克#!曾是法蒂玛帝国将领纳西尔·道莱的盟友。这位将领曾率领突厥派系取得胜利，但在1073年担任维齐尔期间遭刺杀。在此之前，纳西尔·道莱已任命塔杰·马鲁克作为其在法蒂玛帝国首都开罗的副手。"
 nubia.0016.b:0 "$nubia.0015.b$"
 nubia.0060.info:0 "#emphasis 历史背景：#!尽管我们对许多中世纪努比亚国王知之甚少，但有一位国王的资料相对丰富，那就是9世纪马库里亚的乔治斯国王。在其父扎哈里亚斯统治时期，他曾前往巴格达与阿拔斯王朝成功重新协商易货条约。后来乔治斯继位后，派遣侄子尼迪率军攻打活跃于东部沙漠地区的阿拉伯军阀欧麦尔，同时与马库里亚和埃及的图伦王朝为敌。然而尼迪在与欧麦尔达成停战协议后，竟转而反叛乔治奥斯。未料欧麦尔随后背弃尼迪，在尼迪兵败后，乔治斯再度发兵征讨欧麦尔，最终取胜。欧麦尔虽得以幸免，但最终被自己的部下所杀。"
 nubia.0101.info:0 "$RICE_eldad_ha_dani_decision_context_tooltip$"
 nubia.0103.desc.reception.very_skeptical:0 "#N 极度怀疑的态度#!，他们认为我是个编造但支派谎言的骗子。"
 nubia.0103.desc.reception.somewhat_skeptical:0 "#N 将信将疑的态度#!，他们不确定我是否真是但支派的后裔。"
 nubia.0103.desc.reception.neutral:0 "#V 中立平和的态度#!——总体看来他们觉得有趣好奇，但并未过度热衷。"
 nubia.0103.desc.reception.somewhat_enthusiastic:0 "#P 颇为热情的态度#!，他们似乎想聆听我作为但支派后裔的讲述。"
 nubia.0103.desc.reception.very_enthusiastic:0 "#P 极度热情的态度#!，他们无疑迫切想听我讲述旅途见闻与部族故事。"
 nubia.0103.desc.reception.informative_commentary:0 "\n\n或许我应该坚持采用#V 告知性讲述#!来说明但支派的习俗律法以消解疑虑，不过若运气够好，他们或许也会被我那些#V 奇遇故事#!所说服。"
 nubia.0103.desc.reception.fanciful_tales:0 "\n\n那么或许该用#V 奇遇故事#!来使他们尽兴，但若运气够好，即便我选择用#V 告知性讲述#!来说明但支派的习俗律法，他们也不会感到乏味。"
 nubia.0103.desc.reception.both_types:0 "\n\n既然他们看起来既不过度热衷也不排斥，无论是用#V 告知性讲述#!说明但支派习俗律法，还是用#V 奇遇故事#!讲述冒险经历，似乎都适合这个听众群体。"
 nubia.0103.b:0 "坚持说明但支派习俗律法的告知性讲述"
 nubia.0103.success:0 "当地犹太人为你和你的故事深受鼓舞"
 nubia.0103.failure:0 "当地犹太人怀疑你是个编造故事的骗子"
 nubia.0104.desc.intro:0 "值得庆幸的是，当我向[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的[GetReligionByKey('judaism_religion').GetAdjective]社区讲述时，他们#P 乐于倾听#!"
 nubia.0104.desc.informative_commentary:0 "关于我所出身的但支派的习俗与律法的告知性讲述，并将其与我所了解的[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]犹太人的习俗律法进行比较和对照。"
 nubia.0104.desc.fanciful_tales:0 "关于我在异国他乡和遥远海岸冒险的天马行空的故事，以及我与其他[GetReligionByKey('judaism_religion').GetAdjectiveNoTooltip]部落的相遇……就算我偶尔确实有些夸大其词。"
 nubia.0104.desc.conclusion:0 "\n\n社区的领袖们告诉我，我的到来相当鼓舞人心，他们有些人还凑了一笔资金来帮助我。对他们而言，得知但支派乃至世界各地的犹太人无论面对何种困境都能顽强生存并繁荣发展，是件倍感欣慰的事。\n\n毫无疑问，得益于我在此地的成功，关于我和我那些故事的传闻，将继续在世界各地的其他[GetReligionByKey('judaism_religion').GetAdjectiveNoTooltip]社区中流传。"
 nubia.0105.desc.intro:0 "不幸的是，当我向[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的[GetReligionByKey('judaism_religion').GetAdjective]社区讲述时，他们#N 不感兴趣#!"
 nubia.0105.desc.informative_commentary:0 "$nubia.0104.desc.informative_commentary$"
 nubia.0105.desc.fanciful_tales:0 "$nubia.0104.desc.fanciful_tales$"
 nubia.0105.desc.conclusion:0 "\n\n听众的反应从冷淡不感兴趣到显而易见的轻蔑，我毫不怀疑他们中许多人视我为江湖骗子。社区领袖们之后对我也不太友善，看来，我不该在此久留。\n\n尽管在此地遭遇失败，但我确信关于我的消息仍会传播到世界各地的其他[GetReligionByKey('judaism_religion').GetAdjectiveNoTooltip]社区——常言道，恶名也是名嘛！"
 nubia.0106.desc.serpent:0 "我们犹太人，不会再退缩，不会再躲藏。纵使我们未必总是选择正面迎敌，但我的故事激励了同胞们，他们将以各种或明或暗的方式持续抗争。\n\n正如经文所载：“#italic #V 但必作道上的蛇，路中的虺，咬伤马蹄，使骑马的坠落于后。#!#!”"
 nubia.0106.desc.justice:0 "由于时空的阻隔，散居世界的犹太族群日渐疏离，许多人早已遗忘身为犹太人的根本。但藉由我的故事，我帮助同胞重拾了历史记忆与古老智慧，使我们能比以前更加团结强盛。\n\n正如经文所载：“#italic #V 但必判断他的民，作以色列支派之一。#!#!”"
 nubia.0120.info:0 "#emphasis 历史背景：#!梅尔基是9世纪末麦罗埃一位鲜为人事的文职官员，其非凡仕途在墓志铭中得以证实。他从低微的乡村官员晋升为国王贴身随从成员，主管财政与农业事务，尽管其各职务的具体性质尚不明确。\n\n梅尔基的生平向学者提出了一个关于麦罗埃政府性质的有趣问题：他的晋升轨迹究竟表明麦罗埃存在一定程度的社会流动性，还是说他本就是特权贵族，只是经历了类似罗马“荣誉晋升体系”的、为贵族从政者预设的官职序列？"
 nubia.0122.info:0 "#emphasis 历史背景：#!达朱人关于自身起源及如何抵达达尔富尔的传说纷纭不一。其中一个版本提及他们的第三任国王扎拉夫（或哈拉夫）是来自东方的亚历山大大帝麾下将领。在另一些传说版本中，他们于某个时期（至12世纪时）从努比亚地区#italic 尚迪#!一带（靠近古库施王国首都麦罗埃）迁徙至达尔富尔。该传说的某个变体则称，率领这次迁徙并成为达朱人首任国王的统治者名为库斯布尔。"
 nubia.0124.info:0 "#emphasis 历史背景：#!摩西·乔治斯是一位有史料记载的努比亚国王，其统治时期从12世纪50年代中期持续至约1190年。基于多种证据，大多数学者认为他同时统治了马库里亚和阿洛迪亚两个王国，但对于这两个王国是如何联合的则不太确定。\n\n摩西·乔治斯生平中的一个重大事件，是努比亚与埃及萨拉丁统治下新兴的阿尤布王朝的战争。战争的起因尚不确定，可能源于双方的相互袭击，也可能是因为努比亚人希望援助已被萨拉丁推翻的法蒂玛王朝。据称，萨拉丁曾派遣一名使者去见摩西·乔治斯，要求他改信伊斯兰教，但这位国王对此一笑置之，并用热烙铁强行在使者的手上烙了一个十字架。\n\n多年的袭击和进攻给双方都造成了破坏和损失，其中包括一次对法拉斯的袭击，导致该城主教丧生。尽管阿尤布军队在其库尔德指挥官易卜拉欣·库尔迪试图渡过尼罗河时溺亡后最终撤退，但这场战争可能产生了长期的负面影响，成为努比亚在13至14世纪后期衰落的原因之一。"
 nubia.0126.info:0 "#emphasis 历史背景：#!在中世纪努比亚所有已知的官职中，除马库里亚国王外，文献证据最充分的或许当属[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]。他们负责管理努比亚与埃及的北部边境以及努比亚方面的[RICE_baqt|E]。亚当是12世纪80年代至90年代通过多份文献（如其女纽维西向当地妇女加波比购买土地契约）得以证实的诺巴提亚都长。现存大量与亚当相关的文献表明，他曾深度参与诺巴提亚的上层社会活动。"
 nubia.0140.info:0 "#emphasis 历史背景：#!在我们所知的中世纪努比亚所有官职中，除了马库里亚国王之外，文献证据最充分的可能就是[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]一职，他们负责管理努比亚与埃及的北部边境以及努比亚一侧的[RICE_baqt|E]。马里亚诺斯可能是11世纪末的诺巴提亚都长，他的存在也得到了一些文献的证实。\n\n本事件链是对马里亚诺斯书信中提及事件的推想——他通过其[Glossary( '公证人', 'NOTARIOS_GLOSS' )]安杰洛辛库达向副都长梅纳梅纳发送命令，要求追捕名为特涅拉西的男子所属的两名逃亡奴隶。我们不知道之后发生了什么，也不知道涉及其中的人员（不过另一份记录了多名奴隶姓名的文件可能与这封信有关）。\n\n总而言之，这封看似平凡的书信犹如一扇窥探中世纪努比亚社会的小窗——那里奴隶制司空见惯，文书广泛应用于各类事务，官员们则需履行官僚职责。"
 nubia.0240.desc.competition:0 "我还与其他组织者共同努力，策划了激动人心的竞赛——这绝非我们在档次较低的#italic 瑟比尔庆典#!中所见的那种业余赛事。我们格外用心地准备了一场盛大的"
 nubia.0240.desc.wrestling:0 "摔跤大赛，各村庄选派的勇武青年将在这项高尚运动中相互较量，角逐最强壮、最勇敢、最机敏的荣耀。\n\n"
 nubia.0240.desc.stick_fighting:0 "棍术比武，各村庄选派的勇武青年将在这场激烈乃至残酷的竞技中相互交锋，证明自己的胆魄与气概。\n\n"
 nubia.0240.desc.conclusion:0 "经过数周的准备，重要日子即将来临，数百人从各地村庄聚集而来。像我这样的社区富人和权贵，带来了许多将在活动中宰杀并食用的牛羊。"
 nubia.0241.desc.chaplain:0 "我的[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]作为主礼[ROOT.Char.Custom('DefaultPriestTitle')]亲临现场"
 nubia.0241.desc.no_chaplain:0 "主礼[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitle')]来自当地村落"
 nubia.0241.desc.conclusion:0 "我们四处举行魔法仪式，用白灰给山羊和牲畜做标记。此刻，众人齐聚，待宰的牲畜被牵来：人们兴高采烈地用长矛刺向它们，主礼[ROOT.Char.Custom('DefaultPriestTitle')]将牲血洒向人群，使我们得以领受[ROOT.Char.GetFaith.PantheonTerm]的祝福。\n\n欢腾的气氛弥漫四周，我们宴饮作乐，看着那些体魄强健、英勇无畏的年轻人在力量与体育竞技中相互较量。"
 nubia.0243.desc.wrestling:0 "今日出席这场体育竞赛的每位青年，都是各自村落为在摔跤比赛中展现力量与机敏而推选出的代表。\n\n比赛很快开始，每场较量都呈现精彩的攻防转换。两名参赛者赤裸相搏，竭力将对手摔倒在地。其间，所有人都在为自己支持的选手呐喊助威——尤其是同村乡亲——毕竟他们正肩负着展示本村实力与坚韧的使命！"
 nubia.0243.desc.stick_fighting:0 "今日出席这场体育竞赛的每位青年，都是各自村落为在棍术比赛中展现的力量与机敏而推选出的代表。\n\n比赛很快开始，每场对决都令人心跳加速。两名参赛者持棍盾相搏，许多人用厚布缠裹身体，甚至将泥浆抹在头顶以抵御攻击。与此同时，其他青年持续高歌，将心仪的选手赞颂为威猛的雄狮。"
 nubia.0244.desc.wrestling:0 "摔跤比赛落下帷幕：我们的青年们在激动人心的较量中相互角逐，其勇气与体魄毋庸置疑。\n\n"
 nubia.0244.desc.stick_fighting:0 "棍术比赛已告终结。尽管这类竞赛往往血腥残酷，但参赛青年们充分证明了自身实力。\n\n"
 nubia.0244.b:0 "[youth.GetHerHis|U]的村落更需要[youth.GetHerHim]。"
 nubia.0274.c:0 "我将以你为榜样，将自己奉献给依皮马卓斯！"
 Osmunda:0 "奥斯姆达"
 Bertin:0 "贝尔坦"
 Maholdis:0 "马霍迪斯"
 Zalaf:0 "扎拉夫"
 dynn_RICE_nubia_ashkeit:0 "阿什凯特"
 RICE_nubia_drank_holy_texts:0 "饮下墨水"
 RICE_nubia_drank_holy_texts_desc:0 "该角色最近参与了一项非洲习俗，饮用了用于书写宗教典籍经文的墨水。"
 RICE_nubia_drink_holy_text:0 "舔舐[ROOT.Char.GetFaith.ReligiousText]"
 RICE_nubia_drink_holy_text_tooltip:0 "饮用书写[ROOT.Char.GetFaith.ReligiousText]所用的墨水"
 RICE_nubia_drink_holy_text_desc:0 "在[ROOT.Char.GetCulture.GetName]的[ROOT.Char.GetFaith.GetAdherentNamePlural]中，存在着饮用书写[ROOT.Char.GetFaith.ReligiousText]典籍的墨水的习俗。人们相信这种墨水具有医疗和神奇的功效。"
 RICE_nubia_drink_holy_text_confirm:0 "[ROOT.Char.GetFaith.HighGodName]的祝福以多种形式降临。"
 RICE_nubia_drink_holy_text_context_tooltip:0 "#emphasis 历史背景：#! 撒哈拉以南非洲的一些穆斯林，特别是在苏丹或斯瓦希里地区等东非地区，有“饮用”《古兰经》的习俗。他们会用可食用的墨水将《古兰经》经文写在洁净的表面上，然后用水冲洗；这种墨水与水的混合物会被当作药物服用，以祈求祝福，或出于相信这有助于学习的信念。"
