 nubia.0090.t:0 "欢迎牧民"
 nubia.0090.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U]既有农耕，又有游牧群体。虽然我们与游牧民族的关系并非总是和睦，但也有一些人愿意与我们合作；我们可以互相交换有用的资源和服务，他们的存在可以震慑更具敌意的部落。此外，如果他们足够顺从，还可以为我们提供一些税收。\n\n为此，我已邀请附近沙漠的游牧氏族迁居至更靠近我们的领地，以便共同促进这片土地的繁荣。只要不生事端，他们无需畏惧我们。"
 nubia.0090.a:0 "我们感激他们的友谊与勤勉。"
 nubia.0091.t:0 "抵御游牧民族"
 nubia.0091.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U]既有农耕，又有游牧群体。虽然我们与游牧民族的关系并非总是和睦，但他们往往最多只能算是个麻烦——即便不对我们的定居点发动大规模袭击，他们也常因土地归属等问题与当地人产生冲突。\n\n因此，我不得不命令官员与士兵竭尽所能阻止附近沙漠的游牧部族过于靠近我们的村镇。无论是拒绝贸易往来、限制他们穿越领地，还是加强巡逻并攻击他们，都必须让他们明白——我们不欢迎他们的靠近。"
 nubia.0091.a:0 "必须与他们保持距离。"
 nubia.0092.t:0 "保护农民"
 nubia.0092.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U]既有农耕民，又有我们游牧民。虽然我们游牧者中或许有人视这些农人与城镇居民为可掠夺的对象，而且他们还经常对我们抱持怀疑——但与他们携手合作、共同抵御敌人，实则对双方皆有好处。\n\n我们彼此可以互通贸易，共享资源，共同繁荣。为此我已向若干当地定居社区承诺，只要他们秉持合作精神与我们共处，我必将护佑他们平安。\n\n只要他们不生事端，便无需畏惧我们。"
 nubia.0092.a:0 "我们必须成为好邻居，而不是宿敌。"
 nubia.0093.t:0 "掠夺农民"
 nubia.0093.desc:0 "xxxxx[GetGeographicalRegion('RICE_nile_river_valley').GetName|U]既有农耕民，又有我们游牧民。那些死守土地的家伙还经常对我们抱持怀疑。\n\n我已下令部属尽可能从这些定居群体手中夺取物资与资源，他们若自愿交出，我们便不再侵扰，不然我们也不惜采取暴力手段。\n\n和平需要付出代价——无论情愿与否，我相信这些人终会明白这个道理。"
 nubia.0093.a:0 "掠夺财富！"
