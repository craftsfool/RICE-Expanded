 RICE_baqt_frontier_process_name:0 "#Bold 处理文书#!"
 RICE_baqt_frontier_process_desc:0 "$RICE_baqt_frontier_process_name$"
 RICE_baqt_frontier_process_tooltip:0 "#italic 边境官员必须不断审核过境人员或拥有跨境资产以及大人物提出的投诉、请求和其他文件，真是无休无止的工作！#!"
 RICE_baqt_frontier_process_effect_1_tt:0 "与其他任务不同，这个任务没有成功或失败的结果，不过你会在相关的[traits|E]中获得#V 更多的#![trait_level_track_xp|E]"
 RICE_baqt_frontier_report_name:0 "#Bold 向上级发送报告#!"
 RICE_baqt_frontier_report_desc:0 "$RICE_baqt_frontier_report_name$"
 RICE_baqt_frontier_report_tooltip:0 "#italic 埃及与努比亚之间的边界常远离权力中心，因此首都高层必须了解该地区的动态，以便制定有效的地缘政治政策。#!"
 RICE_baqt_frontier_report_effect_1_tt:0 "任务的成功率取决于你的[learning_i|E][learning|E][skill|E]"
 RICE_baqt_frontier_traffic_positive_name:0 "#Bold 鼓励跨境交通#!"
