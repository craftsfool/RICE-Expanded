 nubia.0240.t:0 "着手准备"
 nubia.0240.desc:0 "#italic 瑟必尔庆典#!时间到了！\n\n作为当地杰出的[ROOT.Char.GetWomanMan]，我已与长老和领袖们携手，召集来自各个村庄的人们聚集在一起，庆祝我们的成功、美丽和力量。\n\n"
 nubia.0240.a:0 "虽然很吵闹，但热情是能真切感受到的！"
 nubia.0241.t:0 "牲祭"
 nubia.0241.desc:0 "#itailic 瑟比尔庆典#!终于到来，我们可以用社区的新成就来庆贺季节更迭。\n\n早些时候，"
 nubia.0241.a:0 "我们凝聚成了真正的共同体。"
 nubia.0242.t:0 "结束"
 nubia.0242.desc:0 "这场#italic 瑟比尔庆典#!可谓宴飨不绝，宾朋尽欢——不少人都对我说，这是场盛大空前的#italic 瑟比尔#!庆典，比大多数#italic 瑟比尔#!都精彩纷呈。毫无疑问，[ROOT.Char.GetFaith.PantheonTerm]深感欣慰。通过情感交融与社群力量勇气的展现，我们彼此间的关系也前所未有地紧密。\n\n唉，这场#italic 瑟比尔#!终究还是落下了帷幕，众人整装待归，即将重返平淡的日常生活。\n\n但四季轮转，未来仍有无数的#italic 瑟比尔#!等待我们参与。只要我们的生活方式延续不息，这般盛景必将长存。"
 nubia.0242.a:0 "这场庆典很圆满。"
 nubia.0243.t:0 "体育竞赛"
 nubia.0243.desc:0 "一群体魄强健、充满精力的年轻人出现在场地中央时，现场爆发出热烈的欢呼。他们结实的肌肉彰显着力量，而俊朗的外表也令多数人难以忽视。"
 nubia.0243.a:0 "但愿今天没人伤得太重！"
 nubia.0244.t:0 "有为青年"
 nubia.0244.desc:0 "事实上，有一位名叫[youth.GetFirstName]的年轻人尤其突出，在众多参赛者中脱颖而出，赢得了这场#italic 西伯利亚#!的竞赛。[youth.GetSheHe|U]要么身强体壮，要么聪慧过人，抑或二者兼备，才能从众多竞争者中夺得胜利。\n\n在展示了[youth.GetHerHis]的能力并感受到我对[youth.GetHerHim]的赞赏之后，[youth.GetFirstNameNoTooltip]甚至已宣誓效忠于我。"
 nubia.0244.a:0 "好极了！"
 nubia.0245.t:0 "激励社区"
 nubia.0245.desc:0 "我可以看到这些年轻人如何激励了参加这个#italic 瑟比尔庆典#!的当地人。欢呼声和各种赞美围绕着获胜者，我强烈感觉到我们的社区通过这些比赛焕发了活力，人们在自豪和喜悦的精神中团结在一起。"
