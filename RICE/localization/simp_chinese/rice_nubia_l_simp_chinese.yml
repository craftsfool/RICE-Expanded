 RICE_eldad_ha_dani_decision_confirm:0 "主让我传播圣言！"
 RICE_eldad_ha_dani_decision_context_tooltip:0 "#emphasis 历史背景：#!“但人”伊利达是9世纪一位神秘的犹太旅行者，曾游历美索不达米亚、北非和伊比利亚地区。他声称自己经历过诸多奇遇——例如在埃塞俄比亚被食人族俘虏，又在波斯与以萨迦支派共同生活过。最耐人寻味的是，他自称属于早已迁徙至非洲尼罗河深处（即努比亚或埃塞俄比亚某地）的但支派。即便在当时，同代人已怀疑他是骗子；现代学者对其离奇说法更持保留态度，有研究推测他可能与也门犹太社群存在关联。"
