 RICE_nubia_merki_modifier:0 "农业官员"
 RICE_nubia_merki_modifier_desc:0 "该角色拥有在马库里亚王国管理农业与财政的经验。"
 RICE_nubia_merki_upgraded_modifier:0 "资深农业官员"
 RICE_nubia_merki_upgraded_modifier_desc:0 "该角色在马库里亚王国管理农业与财政积累了丰富的官僚经验，这种专长实属罕见。"
 RICE_nubia_mariankuda_modifier:0 "马库里亚分封执政官"
 RICE_nubia_mariankuda_modifier_desc:0 "该角色在马库里亚王国的行政体系中曾担任或正担任分封执政官。"
 RICE_nubia_archbishop_georgios_modifier:0 "马库里亚大主教"
 RICE_nubia_archbishop_georgios_modifier_desc:0 "乔治斯身为马库里亚大主教，一直让努比亚摆脱拜占庭数百年影响，发展本土化的努比亚基督教。他倡导从服饰、继承制度到尊崇努比亚已故国王等方方面面全面推行“努比亚化”。"
