 RICE_nubia_tebeldi_trees_decision_desc:0 "维护我[GetGeographicalRegion('RICE_greater_darfur').GetName][region|E]领土内的[Glossary( '猴面包树', 'TEBELDI_TREES_GLOSS' )]、水井和甜瓜是我的职责，从而确保我的臣民拥有可靠的水源。"
