 RICE_nubia_baqt_real_document_excerpt_01:0 "我感谢至大、光荣且慷慨的[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，愿神确保[ROOT.Char.GetHerHis]的幸福，因为[ROOT.Char.GetSheHe]已仁慈地[Glossary( '放行船只', 'NUBIA_RELEASED_THE_BOATS_GLOSS' )]。"
 RICE_nubia_baqt_real_document_excerpt_02:0 "[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]因此需要保护我的人民并根权利照顾他们，尤其是那些受到保护、且为之服务的人。"
 RICE_nubia_baqt_real_document_excerpt_03:0 "[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]深知如何约束训诫[ROOT.Char.GetHerHis]的随从，并阻止那些以伤害与反对其的人。"
 RICE_nubia_baqt_real_document_excerpt_04:0 "我[random_different.Custom('GetDaughterSon')]的配偶，名叫[random_different.GetFirstNameNoTooltip]，是个商人，被一群称为[random_different_2.GetFirstNameNoTooltip]之子的无赖拖欠了[random_different.GetSheHe|U]不少钱，因此[random_different.GetSheHe|U]遭受了损失……"
 RICE_nubia_baqt_real_document_excerpt_05:0 "由感激[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]慷慨的朝圣者[random_same.GetFirstNameNoTooltip]寄出。"
 RICE_nubia_baqt_real_document_excerpt_06:0 "我希望向所有官员发送一封信函，请求他们保护[random_different.GetFirstNameNoTooltip]及其[random_different.GetHerHis]奴隶的场所，同样也保护我的场所和我的奴隶，毕竟奴隶们提供如此优质的服务。"
 RICE_nubia_baqt_real_document_excerpt_07:0 "我本打算派一名信使前往[ROOT.Char.GetLiege.GetTitledFirstName]，带上我为[ROOT.Char.GetLiege.GetHerHim]准备的礼物，以及我要向[ROOT.Char.GetLiege.GetSheHe]索要商品的名单。"
 RICE_nubia_baqt_real_document_excerpt_08:0 "我的奴隶[random_different_2.GetFirstNameNoTooltip]受到[random_different.GetFirstNameNoTooltip]的侮辱和冤枉来到了我这里。我已将因[random_different.GetFirstNamePossessiveNoTooltip]骇人行径告知你的[ROOT.Char.GetFaith.BishopNeuter][random_same.GetFirstNameNoTooltip]。\n\n请给我回信并将我的信函诵读给[ROOT.Char.GetFaith.BishopNeuter]听，毕竟我们之间一直保持着良好的关系。难道[random_different.GetFirstNameNoTooltip]是[Glossary( '国王', 'NUBIA_THE_KING_GLOSS' )]，我们就要谄媚？[random_different.GetFirstNameNoTooltip]才是挑起事端的罪魁祸首。"
 RICE_nubia_baqt_real_document_excerpt_09:0 "若您能仁慈地致函[ROOT.Char.GetLiege.GetTitledFirstName]——愿[ROOT.Char.GetFaith.HighGodName]护佑[ROOT.Char.GetHerHis]安的康。将我在信中提及的一切及我前往[ROOT.Char.GetHerHis]领地的意愿悉数转达，恳请务必办理。并请代我从[ROOT.Char.GetHerHim]处获取一封由[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]致您[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的信函……"
 RICE_nubia_baqt_real_document_excerpt_10:0 "至于你刚才提到的关于[ROOT.Char.GetLiege.GetTitledFirstName]服务一事，我们都是他的仆人，也是[ROOT.Char.GetLiege.GetHerHis]的属下。我是[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]的属下，而你则是[ROOT.Char.GetLiege.GetHerHis]的副手。"
 RICE_nubia_baqt_real_document_excerpt_11:0 "[ROOT.Char.GetLiege.GetTitledFirstName] 欠我两匹马。但[ROOT.Char.GetLiege.GetSheHe|U]却给我送来了两个一无是处、年迈的女奴和六第纳尔。"
 RICE_nubia_baqt_real_document_excerpt_12:0 "当你的仆人告诉我你需要那些货物时，我便将这名奴隶交给了经纪人，他将奴隶拍卖出去，得到了五个第纳尔的报价。随后，我找到你的仆人，就他的出售事宜与他商议，并以五个第纳尔的价格将他卖了出去，毕竟这地方人烟稀少，百姓们也都囊中羞涩。"
 RICE_nubia_baqt_real_document_excerpt_13:0 "女奴经过检查，售价为十第纳尔，但人们发现她身有残疾便将其退回。我曾以十二第纳尔七迪拉姆的价格，通过私下交易向一位女士推销过她。"
 RICE_nubia_baqt_real_document_excerpt_14:0 "至于贸易委托的情况，既然阁下有所询问，我一上岸便打听了一下货物，却未发现任何一件。我不愿怠慢此事，便派人北上到另一座城镇去采购了。"
 RICE_nubia_baqt_real_document_excerpt_15:0 "若货物涨价，我们将不会把它们卖给那些因通货膨胀而带着妇女躲进房屋里的人。市场上已经没有商品了。我刚才提到的市场上所有香料的价格都翻了一倍。"
 RICE_nubia_baqt_real_document_excerpt_16:0 "我请求宽恕。我已从伊拉克寄出一件条纹衣物代替现金支付。再次恳请您原谅。"
 RICE_nubia_baqt_real_document_excerpt_17:0 "[Glossary( '寒季将近', 'NUBIA_COLD_SEASON_GLOSS' )]，我无法继续我的生意，所以告诉他们赶快执行我的要求，把那个奴隶送到我这里来。"
 RICE_nubia_baqt_real_document_excerpt_18:0 "至于前面提到的女奴，她还没有到达我这里，所以我无法占有她，[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，我不会与你通信，也不会给你送布料作为礼物，直到我所要求的奴隶由你的仆人交给我为止。"
 RICE_nubia_baqt_real_document_excerpt_19:0 "至于你的那位官员，我曾有一天去拜访过他，他对我说：“我们会满足你的要求。”但从那以后我就再没见过他，他们也不允许我去见他。后来他又对我说：“等[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的信一到，我就会满足你的要求。”因此，我特地写这封信给你。"
 RICE_nubia_baqt_real_document_excerpt_20:0 "你的送货人携我的财物潜逃了，请你安排手下拿回，愿[random_different.GetFaith.HighGodName]保佑。"
 RICE_nubia_baqt_real_document_excerpt_21:0 "每年都有[Glossary( '大量船只', 'NUBIA_RELEASED_THE_BOATS_GLOSS' )]前往贵国领地，而你们却对他们百般苛待。今年我的人民受到了[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的双重阻碍：其一是当地民众施加的不公待遇，其二是物资匮乏。我已派出两艘船，船上所有货物皆属我所有，望您确保无人阻挠其通行。"
 RICE_nubia_baqt_real_document_excerpt_22:0 "我写信向你禀报我仆人的状况，[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]你却未作回应？我写信向你提及要送往我债主[random_different.GetFirstNameNoTooltip]处的两名奴隶的情况，你却未将他们遣来？我也不知你的仆人做到了，我的回信究竟在哪里呢？"
 RICE_nubia_baqt_real_document_excerpt_23:0 "我想告知[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的是，我的奴隶[random_different.GetFirstNameNoTooltip]已抵达[ROOT.Char.GetLiege.GetTitledFirstName]的宫廷，但[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]并未表示感激。自[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]如此对待奴仆以来，我们关系就这样恶化。"
 RICE_nubia_baqt_real_document_excerpt_24:0 "谨告知[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]——愿[random_different.GetFaith.HighGodName]长寿和安康。[ROOT.Char.GetHerHis]寄给我的信中提到了来自船只及其他旅客的状况。[ROOT.Char.GetSheHe|U]竭力改善此局面，并仁慈地[Glossary( '放行船只', 'NUBIA_RISING_OF_PRICES_GLOSS' )]，因深知国家正面临[Glossary( '物价上涨', 'NUBIA_RISING_OF_PRICES_GLOSS' )]困境，商人们也因此遭受了诸多苦难。"
 RICE_nubia_baqt_real_document_excerpt_25:0 "[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]是否有所需求？请让[ROOT.Char.GetHerHim]下达指令以便执行，若有[random_different.GetFaith.HighGodName]允准，我愿效劳。"
 RICE_nubia_baqt_real_document_excerpt_26:0 "[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]贵安，祝愿未来一切安好，若[ROOT.Char.GetFaith.HighGodName]安好，请务必及时来信告知近况。"
 RICE_nubia_baqt_real_document_excerpt_27:0 "[ROOT.Char.GetLiege.GetTitledFirstName]说，若有人反对并否认[ROOT.Char.GetLiege.GetHerHis]的言论，就让[Glossary( '圣依皮马卓斯', 'SAINT_EPIMACHOS_GLOSS' )]用长矛刺穿他们，让他们在[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]的诅咒中死去。"
 RICE_nubia_baqt_real_document_excerpt_28:0 "土地买卖的证人们在文书室内吃喝的包括：二十九个面包、四阿纳提、一罐吉德酒、四蒲式耳谷物（这些是我们给他的）、一阿纳皮提、四个面包、一帕拉尔吉德酒；给文书员的是两阿纳皮提、十个面包、一帕拉尔吉德酒。"
 RICE_nubia_baqt_real_document_excerpt_29:0 "[random_same.GetFirstNamePossessiveNoTooltip]的抄写员中若有谁敢诋毁我，声称我并非此文献的作者，愿他们被[ROOT.Char.GetFaith.HighGodName]所离弃，愿《启示录》第七印中的灾祸降临于他们身上。"
 RICE_nubia_baqt_real_document_excerpt_30:0 "我告知你，你的信是周日收到的。当你听到这个消息时，切勿沮丧，因我将离去，莫因我离去而气馁，否则我无法安眠。[random_same.GetFirstNameNoTooltip]致以问候。"
 RICE_nubia_baqt_real_document_excerpt_31:0 "来吧，履行你的职责，[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，这样我才能对你表达我的好，[ROOT.Char.GetLiege.GetTitledFirstName]已下令，你为什么不愿接手这项任务？你手下的仆从也不愿替你办事？从今以后，粮食的清点将由我来负责。"
 RICE_nubia_baqt_real_document_excerpt_32:0 "向[ROOT.Char.GetLadyLord]致敬。我想说，[random_same.GetFirstNameNoTooltip]曾向[ROOT.Char.GetLiege.GetTitledFirstName]告发[random_same_2.GetFirstNameNoTooltip]。[random_same.GetSheHe|U]还出卖了您的部下，试图取代您在北方的副手。愿[random_same.GetSheHe]惧怕我！"
 RICE_nubia_baqt_real_document_excerpt_33:0 "贵安，我告知你，我取了这20枚金币，它们是[random_same.GetFirstNamePossessiveNoTooltip]的。[random_same.GetSheHe|U]将其均分为两份。请交出这次分配中应得的那份。愿你能来为我完成此事。"
 RICE_nubia_baqt_real_document_excerpt_34:0 "向您的[ROOT.Char.GetLadyLord]配偶请安。[random_same.GetFirstNamePossessiveNoTooltip]儿子是通过[random_same_2.GetFirstNamePossessiveNoTooltip]寻求这一切吗？如果他们不接受，那么真的没必要。请写封信吧，不要犹豫了。"
 RICE_nubia_baqt_real_document_excerpt_35:0 "贵安，大人正使这些事临近。欢喜吧，那位能够进入的[ROOT.Char.GetWomanMan]正在促使它们被送来。而我，怀着坚定的决心接过它们，并未对任何人造成伤害。请欢喜吧，这份喜悦的文书。"
 RICE_nubia_baqt_real_document_excerpt_36:0 "[random_same.GetFirstNameNoTooltip]到底说了什么？唉，[random_same.GetSheHe]在诋毁你和你的族人。身边的人想方设法阻止我继续此事。我身处这片土地，承受着诽谤者的诅咒。倘若[ROOT.Char.GetFaith.HighGodName]始终庇护[random_same.GetHerHim]，这个[random_same.GetWomanMan]便会继续诋毁我们。"
 RICE_nubia_baqt_real_document_excerpt_37:0 "如果[random_same.GetFirstNameNoTooltip]那个恶棍看到这件事，我会通知[random_same_2.GetFirstNameNoTooltip]。而且我不能让同事带信，因为我写这封信时他们正在吃饭。"
 RICE_nubia_baqt_real_document_excerpt_38:0 "你的奴隶们站起身来，因他们听见劈柴声，听见锅灶备好的动静，听见谷物烹煮的声响。因为你就像一个乞丐。我对你的奴隶做了什么？"
 RICE_nubia_baqt_real_document_excerpt_39:0 "记住[ROOT.Char.GetLiege.GetTitledFirstName]所说的话：在[random_same.GetFirstNameNoTooltip]获得[ROOT.Char.GetFaith.HighGodName]的授权之前，任何人都不得站出来反对并否认我，因为所有人都在我庇护之下，他们前来宣扬[ROOT.Char.GetFaith.HighGodName]的圣名。"
 RICE_nubia_baqt_real_document_excerpt_40:0 "[county.GetNameNoTier]的一处黏土区：南界为[random_same.GetFirstNameNoTooltip]属地，北界为[random_same_2.GetFirstNameNoTooltip]属地……"
 RICE_nubia_baqt_real_document_excerpt_41:0 "[county.GetNameNoTier]的一架水车：南边的边界为[ROOT.Char.GetFaith.HouseOfWorship]属地，北边的边界为[ROOT.Char.Custom('DefaultPriestTitle')][random_same.GetFirstNameNoTooltip]的[ROOT.Char.GetFaith.HouseOfWorship]属地……"
 RICE_nubia_baqt_real_document_excerpt_42:0 "首先[random_same.GetFirstNamePossessiveNoTooltip]为1枚金币、20迪拉姆、葡萄酒。\n\n[random_same_2.GetFirstNamePossessiveNoTooltip]（来自[county.GetNameNoTier]）：6枚金币。"
 RICE_nubia_baqt_real_document_excerpt_43:0 "接收方是[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，[random_same.GetFirstNameNoTooltip]：22迪拉姆。[random_same.GetFirstNamePossessiveNoTooltip]女儿：12迪拉姆。[random_same_2.GetFirstNameNoTooltip]：16迪拉姆。[random_same_2.GetFirstNamePossessiveNoTooltip]儿子：4迪拉姆。[ROOT.Char.GetFaith.HouseOfWorship]的[ROOT.Char.Custom('DefaultPriestTitle')]：4金币。"
 RICE_nubia_baqt_real_document_excerpt_44:0 "我们可以保留新谷物，并出售37单位的[random_same.GetFirstNamePossessiveNoTooltip]旧谷物。至于另外12单位谷物，在[random_same.GetSheHe]为您清理后，若能以黄金或等值出售那将是最好的。"
 RICE_nubia_baqt_real_document_excerpt_45:0 "我们已经处理了香料商品，在当地我们并未找到商人按市价估算的这类商品。此外，我们也没有找到足够的资金来购买这些商品。"
 RICE_nubia_baqt_real_document_excerpt_46:0 "将军已致信表示其将抵达，并会为了你们的利益以及落实给予指示。他还提到需要保护子民，还提到了保护臣民和保护从社区前往你那里的商人。"
 RICE_nubia_baqt_real_document_excerpt_47:0 "[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]难道不认我和你亲近，是因为我[Glossary( '当场', 'NUBIA_IN_THE_PRESENCE_OF_GLOSS' )]在[ROOT.Char.Custom('DefaultPriestTitle')]面前提供补给并且始终效忠于[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]及保护你的同伴吗？"
 RICE_nubia_baqt_real_document_excerpt_48:0 "至于你在信中提到的购买商品的事宜，你可以将其交代给商人[random_different.GetFirstNameNoTooltip]。"
 RICE_nubia_baqt_real_document_excerpt_49:0 "这个卑微的奴隶在尊贵、辉煌且慷慨的[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]面前[Glossary( '亲吻地面', 'NUBIA_KISSES_THE_GROUND' )]并向[ROOT.Char.GetHerHim]报告说信已经到达且已阅读并理解了其中的内容"
 RICE_nubia_baqt_real_document_excerpt_50:0 "若你有任何需求，无论大小，写信告知于我，我都会尽力满足，前提是不违反[random_different.GetFaith.HighGodName]。"
