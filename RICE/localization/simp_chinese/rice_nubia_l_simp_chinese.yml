 RICE_nubia_aspiration_eldad_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持[GetReligionByKey('judaism_religion').GetAdjective][faith|E]信仰\n$EFFECT_LIST_BULLET$[GetTrait('RICE_the_danite').GetName( GetNullCharacter )][trait|E]的任一[trait_level_track|E]达到#V 100#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$达到[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]或更高的[piety_level|E]\n$EFFECT_LIST_BULLET$达到[GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]或更高的[prestige_level|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$根据你的$trait_track_RICE_the_danite_serpent$或$trait_track_RICE_the_danite_justice$[trait_level_track|E]其一是否满级，从而将[GetTrait('RICE_the_danite').GetName( GetNullCharacter )][trait|E]升级为[GetTrait('RICE_the_danite_upgraded_serpent').GetName( GetNullCharacter )]或[GetTrait('RICE_the_danite_upgraded_justice').GetName( GetNullCharacter )][traits|E]\n$EFFECT_LIST_BULLET$采用#bold $RICE_eldad_ha_dani_decision$#![decision|E]时增加成功概率\n$EFFECT_LIST_BULLET$解锁$RICE_the_tribe_of_dan_legend_name$[legend_seed|E]\n$EFFECT_LIST_BULLET$你的[faith|E]获得#V 20#![fervor|E]\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$根据你的$trait_track_RICE_the_danite_serpent$或$trait_track_RICE_the_danite_justice$[trait_level_track|E]其一是否满级，从而获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]#italic 或#!@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$保持[adventurer|E]身份（奖励：获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]）\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]或更高的[piety_level|E]（奖励：获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]）\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]或更高的[prestige_level|E]（奖励：根据你的$trait_track_RICE_the_danite_serpent$或$trait_track_RICE_the_danite_justice$[trait_level_track|E]其一是否满级，从而获得[intrigue_lifestyle|E][perk|E]或[learning_lifestyle|E][perk|E]）"
 RICE_nubia_historical_aspiration_action_eldad:0 "#italic 一些犹太人相信你是来自非洲内陆的但支派后裔，但其他人持怀疑态度，认为你是个骗子。无论如何，你都希望能走访世界各地的犹太社区，向他们讲述你鼓舞人心的故事。#!$RICE_nubia_aspiration_eldad_desc$"
 RICE_nubia_aspiration_fatimid_turks_desc:0 "\n\n$EFFECT_LIST_BULLET$保持作为[GetTitleByKey('k_egypt').GetNameNoTier]的[vassal|E]\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_egypt').GetNameNoTier]的[regent|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey('k_egypt').GetNameNoTier]的[holder|E]必须[completely_control|E][GetGeographicalRegion('custom_roman_aegyptus').GetName][region|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$若[RICE_baqt|E][situation|E]中的#V 埃及#![region|E]处于[RICE_baqt_discord|E][situation_phase|E]，则自动升级至[RICE_baqt_accord|E][situation_phase|E]\n$EFFECT_LIST_BULLET$获得#V 2000#![special_troops|E]，包含部分[men_at_arms|E]\n$EFFECT_LIST_BULLET$获得一个[martial_lifestyle|E][perk|E]和一个[intrigue_lifestyle|E][perk|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_egypt').GetNameNoTier]的[entrenched_regent|E]（奖励：获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]）\n$EFFECT_LIST_BULLET$你的[liege|E]对你拥有[opinion_i|E]#P 75#![opinion|E]或成为你的[friend|E]（奖励：获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]）\n$EFFECT_LIST_BULLET$与一位[king|E][rank|E]或更高级别的外国[ruler|E]建立[alliance|E]（奖励：获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]）"
 RICE_nubia_aspiration_nasir_al_dawla_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$确保#V 雅勒达库施#!、#V 伊尔德库兹#!、#V 纳希德·道莱#!和#V 巴德尔·贾迈利#!已死，或成为你的[vassals|E]或[allies|E]，或未拥有任何$RICE_nubia_aspiration_fatimid_turks_desc$[titles|E]"
