 nubia.0190.t:0 "前往西奈半岛"
 nubia.0190.desc:0 "圣凯瑟琳修道院闻名世界，原因有很多。它不仅是现存最古老的[christian.GetAdjective]修道院，还拥有许多圣迹与奇观，从摩西之井、燃烧的荆棘到圣凯瑟琳遗物。\n\n难怪它至今仍是广受欢迎的朝圣地。\n\n我也立志成为那些朝圣者中的一员，渴望获得启迪。我将勇敢地穿越西奈沙漠，无论如何都要抵达这座伟大的修道院。"
 nubia.0190.a:0 "我的旅程从今天开始——这将是一段多么精彩的旅程啊！"
 nubia.0191.t:0 "抵达"
 nubia.0191.desc:0 "我穿越西奈半岛前往圣凯瑟琳修道院的旅程，让我想起了《出埃及记》中的片段：摩西带领以色列人在西奈徘徊四十年，仅靠[ROOT.Char.GetFaith.HighGodName]赐予的鹌鹑和吗哪维生。\n\n相比之下，我旅途中的艰辛实在微不足道。不过，能最终抵达修道院，我依然心怀喜悦。\n\n光是想到这点，我便知道在此地还有许多事要做、许多东西要看、许多时光将用于祈祷。"
 nubia.0191.a:0 "但首先，我们得找个地方过夜。"
 nubia.0192.t:0 "第一天"
 nubia.0192.desc:0 "新的一天破晓，我发现自己醒在圣凯瑟琳修道院。能像几个世纪以来成千上万虔诚的[ROOT.Char.GetFaith.GetReligion.GetAdjective]朝圣者一样，置身于这片古老的圣地，感觉真是太棒了！\n\n这座圣地有许多值得观赏体验的趣事，首先我打算花上许多时间向[ROOT.Char.GetFaith.HighGodName]祈祷敬拜，进行冥想。或许之后还能花时间探索这座修道院的方方面面，加深对它的理解。"
 nubia.0192.a:0 "我起床并准备在这里度过我的第一个整天。"
 nubia.0193.t:0 "启迪"
 nubia.0193.desc:0 "我在圣凯瑟琳修道院度花了很多时间，祈祷和敬拜[ROOT.Char.GetFaith.HighGodName]。在修道院期间，有一件事特别引起了我的注意，并且极大地启发了我——即#V [GetPlayer.Custom('RICE_saint_catherine_monastery_inspiration_loc')]#!。\n\n[GetPlayer.Custom('RICE_saint_catherine_monastery_inspiration_desc_loc')]\n\n确实，这是一个古老的地方，充满了历史——而这段历史甚至早于修道院的历史。"
 nubia.0193.a:0 "这个地方在很多方面都非常深奥。"
 nubia.0194.t:0 "结束"
 nubia.0194.desc:0 "唉，我在圣凯瑟琳修道院的时光即将结束，毕竟我还是个[ROOT.Char.GetTitleAsNameNoTooltip]。\n\n不过我在这座修道院确实经历了一场鼓舞人心、发人深省的精神之旅。谁能想到，沙漠深处蕴藏着如此丰富的宗教历史与传说之地？\n\n我很高兴能在身体还健康的时候来这里旅行，回家的路上我会反思我所看到和做过的一切。"
 nubia.0194.a:0 "也许有一天，我还会回来。"
