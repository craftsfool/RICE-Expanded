 RICE_nubia_keeper_of_granaries_1187:0 "粮仓守护者"
 RICE_nubia_keeper_of_granaries_1187_desc:0 "该角色在其生平中的某个时刻，在马库利亚获得了[Glossary( '粮仓守护者', 'SHOUNG_GLOSS' )]的称号。"
 RICE_nubia_sunt_boats_character:0 "松特船"
 RICE_nubia_sunt_boats_character_desc:0 "该角色将造船业务承包给了当地尼罗河村民，这些村民以用[Glossary( '松特', 'SUNT_GLOSS' )]木制造优质船只而闻名。这将使其部队在尼罗河上下游行军更加便利。"
 RICE_nubia_sunt_boats_county:0 "松特造船业"
 RICE_nubia_sunt_boats_county_desc:0 "当地统治者支持居住在尼罗河该区域的造船工，因为他们以用[Glossary( '松特', 'SUNT_GLOSS' )]木制造高品质船只而闻名。这些船只中有许多用于在尼罗河上捕鱼。"
 RICE_nubia_scribes_studying_nubian:0 "学习努比亚语的抄写员"
 RICE_nubia_scribes_studying_coptic:0 "学习埃及语的抄写员"
 RICE_nubia_scribes_studying_greek:0 "学习希腊语的抄写员"
 RICE_nubia_scribes_studying_arabic:0 "学习阿拉伯语的抄写员"
 RICE_nubia_prefers_byzantine_clothing:0 "更喜欢拜占庭时尚"
 RICE_nubia_prefers_byzantine_clothing_desc:0 "该角色虽为努比亚出身，却偏爱拜占庭帝国曾经或当下盛行的时尚风格，这源于昔日拜占庭对努比亚的深远影响。"
 RICE_nubia_prefers_indigenous_clothing:0 "偏爱努比亚本土时尚"
 RICE_nubia_prefers_indigenous_clothing_desc:0 "该角色虽为努比亚出身，却偏爱本土努比亚时尚风格，与拜占庭风格形成鲜明对比。"
 RICE_nubia_similar_fashion_preferences:0 "相似的时尚品味"
 RICE_nubia_dissimilar_fashion_preferences:0 "不同的时尚品味"
 RICE_nubia_encouraging_era_of_hegira:0 "接受伊斯兰历的使用"
 RICE_nubia_encouraging_era_of_hegira_desc:0 "这位统治者允许文书中使用[Glossary( '希吉拉', 'ERA_OF_THE_HEGIRA_GLOSS' )]来纪年。"
 RICE_nubia_discouraging_era_of_hegira:0 "不鼓励使用伊斯兰历"
 RICE_nubia_discouraging_era_of_hegira_desc:0 "这位统治者不鼓励非穆斯林抄写员在文件中使用[Glossary( '希吉拉', 'ERA_OF_THE_HEGIRA_GLOSS' )]来纪年。"
 RICE_nubia_respects_local_spirits:0 "尊重当地神灵"
 RICE_nubia_disrespects_local_spirits:0 "激怒当地神灵"
 RICE_nubia_generous_to_commoners:0 "对平民慷慨"
 RICE_nubia_encouraging_monks_away_from_farming:0 "鼓励僧侣脱产"
 RICE_nubia_encouraging_monks_away_from_farming_desc:0 "该角色将[Glossary( '爸爸波门', 'ABBA_POEMEN_GLOSS' )]在[Glossary( '《沙漠之父箴言》', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]中的教诲铭记于心，并鼓励基督教僧侣放弃农耕及其他世俗，避免诱惑并专注于修行。"
 RICE_nubia_red_brick_mounds:0 "发现古代红砖土墩"
 RICE_nubia_raphael_inspiration_spiritual:0 "受圣拉斐尔精神所激励"
 RICE_nubia_raphael_inspiration_enemies:0 "受圣拉斐尔感召，与敌人战斗"
 RICE_nubia_cynical_ruler:0 "对宗教持怀疑态度"
 RICE_nubia_interested_in_foreign_art:0 "对外国艺术的兴趣"
 RICE_nubia_oikonomos_modifier:0 "前掌财官"
 RICE_nubia_oikonomos_modifier_desc:0 "该角色有在努比亚基督教修道院担任[Glossary( '掌财官', 'OIKONOMOS_GLOSS' )]的履历"
 RICE_nubia_saint_epimachos_devotee:0 "献身于圣依皮马卓斯"
 RICE_nubia_saint_epimachos_devotee_desc:0 "该角色从对[Glossary( '圣依皮马卓斯', 'SAINT_EPIMACHOS_GLOSS' )]的虔诚信仰中汲取力量，这位圣人在努比亚地区广受崇敬。"
 RICE_nubia_grew_pig_herds:0 "扩大养猪规模"
 RICE_nubia_grew_pig_herds_desc:0 "当地社区正在扩大定居点内的养猪数量，因其作为仅次于牛的肉食来源，在下层阶级中尤为受欢迎。"
 RICE_nubia_agriculture_grow_pigs_name:0 "#Bold 扩大养猪场#!"
 RICE_nubia_agriculture_grow_pigs_desc:0 "$RICE_nubia_agriculture_grow_pigs_name$"
 RICE_nubia_agriculture_grow_pigs_tooltip:0 "#italic 尽管牛是我们人民最受重视的牲畜，但猪对尼罗河沿岸社群也相当重要，尤其对下层民众和宗教机构而言。#!"
 RICE_baqt_frontier_report_success_1_tt:0 "#P 提高#!你与[liege|E]的[opinion_i|E][opinion|E]并有可能获得[liege|E]赠送的[gold_i|E][gold|E]"
 RICE_baqt_frontier_report_success_2_tt:0 "获得[legitimacy_i|E][legitimacy|E]"
 RICE_baqt_frontier_report_failure_1_tt:0 "#N 减少#!你与[liege|E]的[opinion_i|E][opinion|E]"
 RICE_baqt_frontier_report_failure_2_tt:0 "如果#bold 大失败#!将失去[legitimacy_i|E][legitimacy|E]"
 RICE_nubia_lake_oracle_decision_recent_req:0 "目前有一个山湖神谕[modifier|E]"
 nubia.0025.desc.positive:0 "一个#bold #P 大好的预言#!#!，只要我们抓住机遇，好事就会发生。\n\n无论这个领地繁荣昌盛，还是我们能经受住任何到来的挑战（只要我们遵循湖中神谕的建议），这对我来说都是悦耳的好消息。"
 nubia.0025.desc.negative:0 "一个#bold #N 不祥之兆#!#!。前方将有挑战，我的代表仔细聆听山湖告诉我们必须做些什么才能度过即将到来的挑战。\n\n我听到这个消息一点也不高兴。然而，这些神谕往往很可靠，所以我们必须听从它的警告。"
 nubia.0025.desc.nothing:0 "什么都没有，我的代表未能从湖中辨识出任何启示，无论是吉是凶。\n\n我本应为没有凶兆而松一口气，但缺乏吉兆却令人担忧。或许这种模糊性本身就是某种启示……"
 nubia.0033.desc.intro:0 "自古以来，牛便是[ROOT.Char.GetCulture.GetCollectiveNoun]人最宝贵的牲畜。任何[ROOT.Char.GetTitleAsNameNoTooltip]都深知，繁荣取决于能否在尼罗河上牧养充足的牛群。譬如显赫的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorshipPlural]与富庶的贵族，皆用牛群数量衡量自家财富。\n\n"
 nubia.0041.baqt.intro:0 "埃及与努比亚的统治者们几个世纪以来都有定期互赠贵重物品作为善意的外交姿态习惯，这一习俗源于古老的[RICE_baqt_treaty|E]。"
 nubia.0041.baqt.intro2:0 "在和[other.GetTitledFirstName]进行磋商后，我们的代表在位于[GetTitleByKey('c_aswan').GetNameNoTier]第一瀑布附近稍南处会面，这片地区一直被视为无人区，可以更好的履行#italic 易货条约#!。\n\n"
 nubia.0041.baqt.conclusion:0 "这样，和平将降临我们之间。我只能希望[other.GetHerHis]的意图是真诚的，也希望我们双方能继续保持互相尊重。"
 nubia.0041.desc.actor:0 "依据#italic 易货条约#!条款，经协商我们已达成公平物资交换。我将向[recipient.GetHerHim]提供[actor.Custom('RICE_nubia_baqt_good')]，而[recipient.GetSheHe]将向我提供[recipient.Custom('RICE_nubia_baqt_good')]。"
 nubia.0041.desc.recipient:0 "依据#italic 易货条约#!条款，经协商我们已达成公平物资交换。我将向[actor.GetHerHim]提供[recipient.Custom('RICE_nubia_baqt_good')]，而[actor.GetSheHe]将向我提供[actor.Custom('RICE_nubia_baqt_good')]。"
 nubia.0042.desc.actor:0 "依据我们商定的#italic 易货条约#!条款，我已向[recipient.GetFirstNameNoTooltip]赠予了[actor.Custom('RICE_nubia_baqt_good')]作为礼物"
 nubia.0042.desc.recipient:0 "依据我们商定的#italic 易货条约#!条款，[actor.GetFirstNameNoTooltip]已向我赠予了[actor.Custom('RICE_nubia_baqt_good')]作为礼物。"
 nubia.0043.desc.actor:0 "依据我们商定的#italic 易货条约#!条款，[recipient.GetFirstNameNoTooltip]已应我要求，向我进献了[recipient.Custom('RICE_nubia_baqt_good')]作为贡礼。"
 nubia.0043.desc.recipient:0 "依据我们商定的#italic 易货条约#!条款，我已应[actor.GetFirstNamePossessiveNoTooltip]要求，向[actor.GetHerHim]进献了[recipient.Custom('RICE_nubia_baqt_good')]作为贡礼。"
 nubia.0160.b:0 "发送信函并附上礼物以示善意。"
 nubia.0160.success.tooltip:0 "#bold #P 成功#!#!: 你的信函显得热情周到，对方更有可能给予积极回应"
 nubia.0160.neutral.tooltip:0 "#bold 不好不坏#!#!: 你的信函虽显正式却有些刻板，不会影响对方的回应倾向"
 nubia.0160.failure.tooltip:0 "#bold #N 失败#!#!: 你的信函显得居高临下，对方更有可能给予消极回应"
 nubia.0161.desc.intro:0 "来自对应方的[giver.GetTitledFirstName]派来了一位信使，带来一封信和一份虽小但得体的礼物，我们之间沟通对于维持我们两国和平至关重要，因此我迅速阅读了信件，开头如下：\n\n"
 nubia.0161.desc.good_letter:0 "#italic 我统治我的[receiver.Custom('SisterBrother')|U][receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，对于[receiver.Custom('RICE_nubia_egypt_border_official_type_loc')]来说，没有什么比[receiver.GetSheHe]在表达尊敬、善意和礼貌款待方面更为慷慨的了。#!"
 nubia.0161.desc.neutral_letter:0 "#italic 我告知[receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，此信持有者是我忠诚恭敬的仆人。请善待并正确对待，满足其需求。我向您致以美好祝愿与感激的问候。#!"
 nubia.0161.desc.bad_letter:0 "#italic 我告知[receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，关于领地状况所需告知之事均已记录于本函附件，静候回音。请致函于我，以示对[top_liege.GetTitledFirstName]的尊重且履行要求。#!"
 nubia.0161.desc.middle:0 "\n\n信件继续用着正式礼节话语展开，并讨论了与边境相关的事务"
 nubia.0161.desc.good:0 "信中的语言显得#V 热情#!，表明[giver.GetFirstNamePossessiveNoTooltip]希望打好关系。"
 nubia.0161.desc.neutral:0 "信中的语言#V 得体#!，虽有些生硬平庸，缺乏实质内容，看来是种官僚套话。"
 nubia.0161.desc.bad:0 "信中的语言#V 居高临下地#!，不知道[giver.GetFirstNameNoTooltip]是不是故意，但我还是觉得不爽。"
 nubia.0161.desc.gift:0 "[giver.GetFirstNameNoTooltip]随信附赠了一份小礼物。"
 nubia.0161.a.tooltip.bad:0 "你给[giver.GetTitledFirstName]回了一封友好的信。但由于[giver.GetHerHis]的信中带着居高临下的语气，这会让你显得软弱无能。"
 nubia.0161.a.tooltip.bad.giver:0 "[receiver.GetFirstName]给你回了一封友好的信。然而，由于你的信中语气显得高高在上，这让[receiver.GetHerHim]显得软弱无能。"
 nubia.0161.b.tooltip:0 "你向[giver.GetTitledFirstName]回寄了一封措辞强硬的信函。"
 nubia.0161.b.tooltip.bad:0 "你给[giver.GetTitledFirstName]回了一封措辞强硬的信。然而，由于[giver.GetHerHis]来信态度友善，这会让你显得不太懂得尊重。"
 nubia.0161.b.tooltip.bad.giver:0 "[receiver.GetFirstName]给你回了一封措辞强硬的信。然而由于你的信件语气友善，这反而让[receiver.GetHerHim]显得有失礼数。"
 nubia.0162.desc.intro:0 "在我以[giver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的身份致信[receiver.GetTitledFirstName]，且其以[receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]身份回应后，我已收到[receiver.GetHerHim]的礼节性回函。\n\n"
 nubia.0162.a.small_success:0 "这次是书信往来是#V #P 小成功#!#!"
 nubia.0162.a.large_success:0 "这次是书信往来结果上来看是#V #P 大成功#!#!"
 nubia.0163.a.small_failure:0 "这次是书信往来结果上来看是#V #N 小失败#!#!"
 nubia.0163.a.large_failure:0 "这次是书信往来结果上来看是#V #N 大失败#!#!"
 nubia.0164.b:0 "尽可能寻找更多资源。"
 nubia.0164.success:0 "你的努力#P 成功#!了"
 nubia.0164.failure:0 "你的努力没有#N 成功#!"
 nubia.0164.mixed:0 "你的努力#N 结果好坏参半#!"
 nubia.0165.desc.major:0 "看来我的手下们在最近的行动中表现非常出色。当地居民和行商都对我们所做的工作表示赞赏，他们尽力提供帮助，也明白可以为防御体系贡献力量。"
 nubia.0165.desc.minor:0 "总体而言，我的下属们在近期事务中表现得相当称职。即使一些当地人和商人对此感到不满，但我的官员们表示，他们最终理解了维护防御的重要性。"
 nubia.0166.desc.major:0 "我的下属在理论上实现了这些髠，但显然存在管理不善和后勤问题，这导致了重大失误。令人担忧的是，当地居民和行人对我们的行为相当敌视，有些人甚至会与那些剥削抢劫他们的人一一勾结，破坏我们的努力。"
 nubia.0166.desc.minor:0 "我的下属在理论上实现了这些髠，不过存在管理不善和后勤问题，更重要的是，当地居民和商人对我们的行为态度褒贬不一，甚至有传言称有人试图间接破坏我们所做的努力。"
 nubia.0167.b:0 "那我就相信[witness.GetFirstNamePossessiveNoTooltip]的判断吧。"
 nubia.0168.desc.major:0 "流程进展十分顺利，参与此次交易的当地显要人士对我们的付出与支持深表感激。他们为我们举办了一场简朴的宴席，并赠送了一些精美的小饰品作为礼物。"
 nubia.0168.desc.minor:0 "总的来说，过程顺利，没有出现任何问题，参与此次交易的当地显要人物举办了一场简朴的宴席并赠送了一些惯例的小饰品，以感谢我们付出的时间。要说有什么的话，只是有点无聊。"
 nubia.0169.desc.major:0 "相关方最终同意了一份经过大幅修改的交易方案，但这整件事让所有人都感到不愉快。说实话，当他们甚至没有按惯例为参与此事的我和[witness.GetFirstNameNoTooltip]举办简朴的宴席和赠送小饰品礼物时，我反而松了口气。"
 nubia.0169.desc.minor:0 "尽管相关方最终同意了一份修改后的交易方案，并且他们按惯例正式以简朴的宴席和一些小饰品礼物感谢了[witness.GetFirstNameNoTooltip]和我，但场面还是相当尴尬。"
 nubia.0170.b:0 "不妨也助[counterpart.GetFirstNameNoTooltip]一臂之力。"
 nubia.0171.desc.major:0 "我们掌握了许多有用的军事和政治情报，这将有助于我们长期管理边境。我们还抓获了许多从边境另一侧逃来的罪犯，并已根据[RICE_baqt_treaty|E]协议将他们遣返回[counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的领土——[counterpart.GetTitledFirstName]必定对此感激一二！"
 nubia.0171.desc.minor:0 "我们获得一些有用的军事和政治情报，我们甚至还抓获了几名从边境另一侧逃来的罪犯，并已根据[RICE_baqt_treaty|E]协议将他们遣返回[counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]的领土——[counterpart.GetTitledFirstName]会对此感到满意。"
 nubia.0172.desc.major:0 "\n我们收集情报的尝试都是徒劳的，因为我们的探子被虚假报告和信息严重误导。此外，似乎有许多来自[counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')][counterpart.GetTitledFirstName]领土的逃犯在未被察觉的情况下溜走了，这可不是什么好事，因为#italic 易货条约#!要求我们互相帮助抓捕此类逃犯。"
 nubia.0172.desc.minor:0 "\n我们收集情报的尝试都是徒劳的，只得到些无用的报告和信息。此外，似乎有许多来自[counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')][counterpart.GetTitledFirstName]领土的逃犯在未被察觉的情况下溜走了，[counterpart.GetSheHe]肯定会不满，因为#italic 易货条约#!要求我们互相帮助抓捕此类逃犯。"
 nubia.0173.opening:0 "致[counterpart.Custom('RICE_nubia_egypt_border_official_type_loc')]："
 nubia.0174.opening:0 "$nubia.0173.opening$"
 nubia.0175.b:0 "精心撰写一份详尽出色的报告。"
 nubia.0176.desc.intro:0 "一名来自[reporter.GetTitledFirstName]的信使已经抵达，带来一份关于[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]现状的报告。[reporter.GetHerHis]作为[reporter.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，维护我们[primary_title.GetTierAsNameNoTooltip]内的边境是职责，报告中还包含了[reporter.GetHerHis]近期履职情况。\n\n我花时间仔细阅读了这份报告。显然，"
 nubia.0176.a.toast:0 "小成功：领主认可报告"
 nubia.0176.b:0 "应当奖赏[reporter.GetFirstNameNoTooltip]的辛劳！"
 nubia.0176.b.toast:0 "大成功：领主高度赞赏报告"
 nubia.0177.a.toast:0 "小失败：领主对报告不满"
 nubia.0177.b:0 "就[reporter.GetHerHis]的失职行为予以训诫。"
 nubia.0177.b.toast:0 "大失败：领主对报告极为不满"
 nubia.0185.a.short_stay:0 "你在班加纳提停留#V 1#!个月，之后无论结果如何，[activity|E]都将结束。"
 nubia.0185.a.long_stay:0 "你在班加纳提停留#V 3#!个月，之后无论结果如何，[activity|E]都将结束。"
