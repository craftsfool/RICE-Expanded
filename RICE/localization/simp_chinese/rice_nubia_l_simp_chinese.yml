 building_type_RICE_nubia_throne_hall_of_dongola:0 "栋古拉王座厅"
 building_type_RICE_nubia_throne_hall_of_dongola_desc:0 "栋古拉王座厅——一座俯瞰尼罗河的两层宏伟建筑，它作为努比亚国王权力迎接着来自各地的高贵访客。王座厅本身位于二层，官方使团需登上宽阔阶梯方能抵达，大厅与阶梯皆饰有精美壁画。"
