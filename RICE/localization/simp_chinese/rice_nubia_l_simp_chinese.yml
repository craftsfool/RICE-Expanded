 RICE_nubia_aspiration_moses_georgios_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持[GetTitleByKey('k_nubia').GetNameNoTier]和[GetTitleByKey('k_alodia').GetNameNoTier]的[independent][ruler|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('k_nubia').GetNameNoTier]和[GetTitleByKey('k_alodia').GetNameNoTier]\n$EFFECT_LIST_BULLET$[GetTitleByKey('k_egypt').GetNameNoTier]的[ruler|E]未与你处于[war|E]状态，且必须与你[truce|E]，或是你的[vassal|E]、[ally|E]或[tributary|E]，或者该[title|E]不存在\n$EFFECT_LIST_BULLET$拥有至少@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$至少采用过一次$RICE_nubia_agriculture_decision$[decision|E]\n$EFFECT_LIST_BULLET$至少采用过一$RICE_nile_pastoralists_positive_decision$/$RICE_nile_pastoralists_negative_decision$[decision|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$你在[GetGeographicalRegion('RICE_greater_nubia_region').GetName][realm|E]内的每个[county|E]获得@development_icon!#V[EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n$EFFECT_LIST_BULLET$获得#V 1000#![special_troops|E]，包括部分[men_at_arms|E]\n$EFFECT_LIST_BULLET$[RICE_baqt|E][situation|E]的#V 努比亚#![region|E]获得重大[situation|E]诱因，使其在当前[situation_phase|E]结束后转向[RICE_baqt_accord|E][situation_phase|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高的[piety_level|E]，或达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高的[prestige_level|E]（奖励：获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![dynasty_prestige|E]）\n$EFFECT_LIST_BULLET$拥有至少一位[GetReligionByKey('islam_religion').GetAdjective][vassal|E]，且该封臣是你的[ally|E]、被你[intimidated|E]或[cowed|E]，或对你有至少[opinion_i|E]#P 75#![opinion|E]（奖励：获得#V 500#![special_troops|E]，包括部分中东[men_at_arms|E]）"
 RICE_nubia_historical_aspiration_action_moses_georgios:0 "#italic 你的王国因埃及近期的袭击而遍布废墟，努比亚正面临内外敌人的威胁。你清醒地意识到，努比亚亟需重建并做好准备，才能抵御下一次危机。#!$RICE_nubia_aspiration_moses_georgios_desc$"
