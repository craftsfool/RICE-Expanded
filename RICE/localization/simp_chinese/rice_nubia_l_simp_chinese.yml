 RICE_nile_cleopatra_scholar_legend_name:0 "“学者”克利奥帕特拉的血脉"
 RICE_nile_cleopatra_scholar_legend_desc:0 "罗马人及其后裔将克利奥帕特拉女王诽谤为淫乱的暴君，然而在中东地区，却流传着不同的传说：那是一位不仅是智慧公正的女王，更是才华横溢的学者与哲学家。[descendant.GetTitledFirstName]这样的后裔至今仍将这些传说铭记于心。"
 RICE_nile_cleopatra_scholar_legend_chapter_opening_new_title:0 "$RICE_nile_legend_chapter_opening_new_title$"
 RICE_nile_cleopatra_scholar_legend_chapter_motivation_new_title:0 "$RICE_nile_legend_chapter_motivation_new_title$体内流淌克利奥帕特拉之血，她后裔的回归意味着尼罗河迎来崭新时代，为一个更繁荣、更公正的社会带来新希望。"
 RICE_nile_cleopatra_scholar_legend_chapter_famous_deed_new_title:0 "罗马人贬低伟大的女王克利奥帕特拉为娼妓，但[ROOT.Legend.GetProtagonist.GetFirstNameNicknamedNoTooltip]人与[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人深知克利奥帕特拉的真正遗产在于她对艺术、科学与哲学的保护与精通。\n\n这使她足以与当时最伟大的学者比肩，以及她那令罗马人嫉妒的智慧与机敏，正是这些关于克利奥帕特拉的#italic 传说#!，虽在西方世界埋没却仍在别处流传，这些都被[ROOT.Legend.GetProtagonist.GetFirstNameNicknamedNoTooltip]效仿。"
 RICE_nile_cleopatra_scholar_legend_chapter_extra_deed_new_title:0 "通过统一[ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip]信徒与[ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]部族，继而统一尼罗河谷其余地区，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]竭力效仿克利奥帕特拉的理想。$RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_cleopatra_scholar_legend_chapter_conclusion_new_title:0 "$RICE_nile_legend_chapter_conclusion_new_title$[ROOT.Legend.GetProtagonist.GetHerHis]真正继承了其先祖——学术女王克利奥帕特拉的伟大智慧。"
 activity_RICE_nubia_nilotic_bovine_sacrifice_host_an_a:0 "$host_activity_a$"
 activity_RICE_nubia_nilotic_bovine_sacrifice:0 "尼罗河牛祭"
 activity_RICE_nubia_nilotic_bovine_sacrifice_desc:0 "牛群是我们最珍贵的财产。因此，向祖先和[GetPlayer.GetFaith.PantheonTerm]献祭牛群，是任何人所能做出的最大供奉。"
 activity_RICE_nubia_nilotic_bovine_sacrifice_selection_tooltip:0 "向祖先和[GetPlayer.GetFaith.PantheonTerm]献祭牛。\n\n$activity_RICE_nubia_nilotic_bovine_sacrifice_context_tooltip$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_context_tooltip:0 "#emphasis 历史背景：#!在东非的诸多民族中，例如丁卡人和马赛人等尼罗特语族族群，牛是地位与财富的象征。因此，尽管不同族群的献祭频率存在差异，但献祭牛通常都具有重要意义，毕竟这是一个人所能献出的最珍贵的祭品。"
 activity_RICE_nubia_nilotic_bovine_sacrifice_host_desc:0 "\n$BULLET_WITH_TAB$根据你的[intent|E]，获得随机数量的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]（数值在#V 25#!至#V 200#!之间）\n$BULLET_WITH_TAB$减少[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$根据你的[skills|E]、[piety_level|E]、[prestige_level|E]和[legitimacy|E]，有一定概率获得#P 正面#!的[character_modifier|E]"
 activity_RICE_nubia_nilotic_bovine_sacrifice_guest_desc:0 "$activity_RICE_nubia_nilotic_bovine_sacrifice_host_desc$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_province_desc:0 ""
 activity_RICE_nubia_nilotic_bovine_sacrifice_destination_selection:0 "$activity_RICE_nubia_nilotic_bovine_sacrifice_province_desc$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_guest_help_text:0 "$activity_RICE_nubia_nilotic_bovine_sacrifice$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_predicted_cost:0 "祭祀成本主要取决于你的[income|E]。"
 activity_RICE_nubia_nilotic_bovine_sacrifice_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_nubia_nilotic_bovine_sacrifice' ).GetName]已圆满结束。愿先祖与[ROOT.Char.GetFaith.PantheonTerm]继续指引我们！"
 RICE_nubia_nilotic_bovine_sacrifice_sacrifice_phase:0 "献祭"
 RICE_nubia_nilotic_bovine_sacrifice_sacrifice_phase_desc:0 "是时候献祭牲畜了。"
 RICE_nubia_nilotic_bovine_sacrifice_completed_log_title:0 "完成牛祭"
 RICE_nubia_nilotic_bovine_sacrifice_completed_log:0 "[CHARACTER.GetShortUIName|U]完成了牛祭的相应仪式与典礼。"
 TRAVEL_NAME_FOR_activity_RICE_nubia_nilotic_bovine_sacrifice:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_nubia_nilotic_bovine_sacrifice$"
 RICE_nubia_sudanese_culture_decision:0 "建立苏丹文化"
 RICE_nubia_sudanese_culture_decision_tooltip:0 "一个崭新的苏丹民族将傲立尼罗河畔。"
 RICE_nubia_sudanese_culture_decision_east_african_desc:0 "如果更多$heritage_east_african_name$部落持续定居在[GetGeographicalRegion('ghw_region_egypt').GetName]的肥沃土地上，我们应该建立新的#V 苏丹#!认同以巩固他们的存在。"
 RICE_nubia_sudanese_culture_decision_arabic_desc:0 "如果更多$heritage_arabic_name$部落持续定居在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]的肥沃土地上，我们应该建立新的#V 苏丹#!认同以巩固他们的存在。"
 RICE_nubia_sudanese_culture_decision_neutral_desc:0 "随着时间的推移，$heritage_arabic_name$和$heritage_arabic_name$部族可能分别迁徙至[GetGeographicalRegion('ghw_region_egypt').GetName]和[GetGeographicalRegion('RICE_greater_nubia_region').GetName]的肥沃土地。我们能否通过塑造新的#V 苏丹#!身份来影响发展进程？"
 RICE_nubia_sudanese_culture_decision_effect_tooltip_1_arabic:1 "在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]地区的其他[rulers|E]（尤其是$heritage_arabic_name$[heritage|E]），更有可能皈依#V 苏丹#![culture|E]"
 RICE_nubia_sudanese_culture_decision_effect_tooltip_1_east_african:1 "在[GetGeographicalRegion('ghw_region_egypt').GetName]地区的其他[rulers|E]（尤其是$heritage_east_african_name$[heritage|E]），更有可能皈依#V 苏丹#![culture|E]"
 RICE_nubia_sudanese_culture_decision_confirm:0 "一个新的民族将在尼罗河畔崛起！"
 RICE_nubia_sudanese_culture_decision_context_tooltip:0 "#emphasis 历史背景：#!虽然努比亚基督教王国的历史衰落与现代苏丹阿拉伯身份认同的兴起是一个多层面且复杂的话题，但阿拉伯部落的增多以及随之而来的努比亚大部分地区的阿拉伯化和伊斯兰化可能是这一进程中的一个因素。尽管苏丹阿拉伯人占苏丹人口的绝大多数，但在苏丹以及埃及南部仍有相当数量的努比亚少数民族。"
 RICE_nile_empire_decision:0 "统一尼罗河流域"
 RICE_nile_empire_decision_tooltip:0 "建立新帝国，统治尼罗河两岸。"
 RICE_nile_empire_decision_desc:0 "从[GetGeographicalRegion('ghw_region_egypt').GetName]三角洲北部沼泽，到[GetGeographicalRegion('RICE_greater_nubia_region').GetName]南端的大草原与丘陵地带，整个[GetGeographicalRegion('RICE_nile_river_valley').GetName]都将由信奉[GetPlayer.GetFaith.GetAdjective]的[GetPlayer.GetCulture.GetCollectiveNoun][GetPlayer.GetDynasty.GetName][dynasty|E]王朝实现统一！"
 RICE_nile_empire_decision_effect_tooltip_1:1 "你可以选择[GetTitleByKey('e_RICE_nile').GetName]在几个不同的名称中命名"
 RICE_nile_empire_decision_effect_tooltip_2:1 "你将在不同的[legend_seeds|E]之间进行选择，宣告你的[dynasty|E]出身，以及追封埃及或努比亚历史上的祖先。"
 RICE_nile_empire_decision_confirm:0 "尼罗河与我们的帝国将永世长存！"
 RICE_nile_empire_decision_context_tooltip:0 "#emphasis 历史背景：#!埃及和努比亚在历史上曾多次统一在一个帝国之下。例如，在古埃及的历史中，埃及法老曾在不同时间控制了努比亚，而努比亚国王也征服了埃及，建立了埃及第二十五王朝。在中世纪晚期，马穆鲁克征服或使努比亚部分地区成为附庸。"
 nubia.0200.t:0 "前往圣安东尼修道院"
 nubia.0200.desc:0 "很久以前，在教会的早期，圣安东尼成为[christian.GetAdjective]最伟大的人物之一，正因如此，建于他隐居地附近的圣安东尼修道院，多年来已成为热门的朝圣地。\n\n作为一名朝圣者，我如今踏上了前往圣地艰苦旅程。"
 nubia.0200.a:0 "愿[ROOT.Char.GetFaith.HighGodNameAlternate]保佑我旅途平安！"
 nubia.0201.t:0 "抵达"
 nubia.0201.desc:0 "又累又渴，急需休息，我和同伴们终于抵达了圣安东尼修道院。我们漫长的沙漠之旅终于结束了，如释重负，可以好好歇一歇了，我们终于来到了这里！\n\n#italic 这里是#![GetGeographicalRegion('ghw_region_egypt').GetName]最伟大的修道院之一，能够踏着圣安东尼这位伟大圣人的足迹前行，实在令人激动不已。\n\n我们先找个地方安顿下来，明天再真正开始感受这里的氛围。"
 nubia.0201.a:0 "感谢[ROOT.Char.GetFaith.HighGodName]，我们终于到了。"
 nubia.0202.t:0 "有趣的景点"
 nubia.0202.desc:0 "过去几天，我一直在圣安东尼修道院祈祷和敬拜。这片偏远之地自圣安东尼时代起，就经受住了岁月的考验与磨难，至今仍屹立不倒，成为我们[GetReligionByKey('christianity_religion').GetAdjective]信仰荣耀的坚定见证，这难道不令人惊叹吗？\n\n我已经花时间完成了祈祷和敬拜，修道院里还有不少值得探索的趣事或事物，或许等我该去瞧瞧？"
 nubia.0202.a:0 "修道院的花园看起来美丽而整洁。"
 nubia.0203.t:0 "结束"
 nubia.0203.desc:0 "我在这里待了相当长一段时间，是时候离开回去履职了。\n\n虽然我不知道自己是否以及何时会再次回到这座修道院，但这段经历令我焕然一新。我要向圣安东尼致以崇高的赞美，他至今仍激励着我们！"
 nubia.0203.a:0 "是时候收拾东西，准备回家了。"
