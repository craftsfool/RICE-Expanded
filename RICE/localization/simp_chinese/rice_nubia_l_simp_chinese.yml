 RICE_nubia_aspiration_kusbur_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持为#V 达朱#![culture|E]或其衍生的[culture|E]\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('d_dar_daju').GetNameNoTier]的[independent][ruler|E]\n$EFFECT_LIST_BULLET$在[GetGeographicalRegion('RICE_greater_darfur').GetName][region|E]至少拥有#V 4个#![counties|E]\n$EFFECT_LIST_BULLET$至少执行一次#bold $RICE_nubia_tebeldi_trees_decision$#![decision|E]\n$EFFECT_LIST_BULLET$拥有[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高的[piety_level|E]#italic 亦或#!达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高的[prestige_level|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$你在[GetGeographicalRegion('RICE_greater_darfur').GetName][realm|E]的每个[county|E]将获得持续#V50#!年的[GetModifier('RICE_nubia_daju_migrations_modifier').GetNameWithTooltip][modifier|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$拥有至少一位[count|E][rank|E]的[direct_vassal|E]，且其文化为#bold 托拉#![culture|E]或其衍生的[culture|E]（奖励：获得#V 500#![special_troops|E]，包含部分[men_at_arms|E]）\n$EFFECT_LIST_BULLET$拥有至少一位[count|E][rank|E]的[direct_vassal|E]，且其文化为#bold 达朱#![culture|E]或其衍生的[culture|E]（奖励：获得#V500#![special_troops|E]，包含部分[men_at_arms|E]）\n$EFFECT_LIST_BULLET$至少采用过一次#V $RICE_nubia_lake_oracle_decision$#![decision|E]（奖励：获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）"
 RICE_nubia_historical_aspiration_action_kusbur:0 "#italic 在你的领导下，达朱部落已开始从努比亚向西迁徙。假以时日，达尔富尔将成为你族人的新家园。#!$RICE_nubia_aspiration_kusbur_desc$"
