 activity_RICE_nubia_sibir_festival_host_an_a:0 "$host_activity_a$"
 activity_RICE_nubia_sibir_festival:0 "瑟必尔庆典"
 activity_RICE_nubia_sibir_festival_desc:0 "瑟必尔庆典是源自努巴山脉的各类庆典活动，通常会在不同季节的开端举行，比如收获季或耕种季，期间常伴有不同村庄青年之间的体育竞赛。"
 activity_RICE_nubia_sibir_festival_selection_tooltip:0 "参加瑟必尔庆典\n\n$activity_RICE_nubia_sibir_festival_context_tooltip$"
 activity_RICE_nubia_sibir_festival_context_tooltip:0 "#emphasis 历史背景：#!努巴山脉的许多不同氏族每年都会定期举行#italic 瑟必尔庆典#!，这些庆典标志着一年中不同的时节。例如，最重要的瑟必尔庆典之一就是火之瑟必尔庆典，通常会在耕作季节结束后举行。每个氏族还拥有各自独特的瑟必尔庆典节日历。"
 activity_RICE_nubia_sibir_festival_host_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$有概率获得#P 正面#![character_modifiers|E]或[county_modifiers|E]\n$BULLET_WITH_TAB$有概率获得拥有高[prowess_i|E][prowess|E]的[courtiers|E]"
 activity_RICE_nubia_sibir_festival_guest_desc:0 "$activity_RICE_nubia_sibir_festival_host_desc$"
 activity_RICE_nubia_sibir_festival_province_desc:0 ""
 activity_RICE_nubia_sibir_festival_destination_selection:0 "$activity_RICE_nubia_sibir_festival_province_desc$"
 activity_RICE_nubia_sibir_festival_guest_help_text:0 "$activity_RICE_nubia_sibir_festival$"
 activity_RICE_nubia_sibir_festival_predicted_cost:0 "[activity|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_nubia_sibir_festival_conclusion_desc:0 "[GetActivityType( 'activity_RICE_nubia_sibir_festival' ).GetName]已圆满落幕，我们都度过了一段美好的时光！"
 RICE_nubia_sibir_festival_sports_competition_type:0 "体育竞赛"
 RICE_nubia_sibir_festival_sports_competition_type_none:0 "无"
 RICE_nubia_sibir_festival_sports_competition_type_none_desc:0 "$BULLET_WITH_TAB$没有概率获得[character_modifiers|E]、[county_modifiers|E]或高[prowess_i|E][prowess|E]的[courtier|E]\n\n#weak 虽然有些人可能会失望，但我们并不需要正式的体育竞赛。#!"
 RICE_nubia_sibir_festival_sports_competition_type_wrestling:0 "摔跤"
 RICE_nubia_sibir_festival_sports_competition_type_wrestling_desc:0 "$BULLET_WITH_TAB$获得#P 正面#![character_modifiers|E]或[county_modifiers|E]的概率更高\n$BULLET_WITH_TAB$获得高[prowess_i|E][prowess|E]的[courtier|E]的概率较低\n\n#weak 我盛大摔跤比赛有助于增进人民之间的联系，让我们勇敢的年轻人展示他们的体能与技巧。#!"
 RICE_nubia_sibir_festival_sports_competition_type_stick_fighting:0 "棍棒比赛"
 RICE_nubia_sibir_festival_sports_competition_type_stick_fighting_desc:0 "$BULLET_WITH_TAB$更高概率获得高[prowess_i|E][prowess|E]的[courtier|E]\n$BULLET_WITH_TAB$较低概率获得#P 正面#![character_modifiers|E]、[county_modifiers|E]\n\n#weak 虽然我们的棍棒比赛赛可能很残酷，甚至致命，但它展示了我们年轻人的力量。#!"
 RICE_nubia_sibir_festival_celebration_phase:0 "庆祝"
 RICE_nubia_sibir_festival_celebration_phase_desc:0 "让我们庆祝季节的更替，以及我们的团结与力量！"
 RICE_nubia_sibir_festival_fun_intent_header:0 "享乐："
 RICE_nubia_sibir_festival_fun_intent:0 "享乐"
 RICE_nubia_sibir_festival_fun_intent_desc:0 "在这些激动人心的庆典中玩得开心，额外失去[stress_i|E] [stress|E]，如果你有[GetTrait('gregarious').GetName( GetNullCharacter )|U]或[GetTrait('lustful').GetName( GetNullCharacter )]特质，则会失去更多。"
 RICE_nubia_sibir_festival_community_intent_header:0 "交际："
 RICE_nubia_sibir_festival_community_intent:0 "交际"
 RICE_nubia_sibir_festival_community_intent_desc:0 "利用这次机会和他人打交道，所有参与者对你[opinion_i|E]#P +10#![opinion|E]。如果你有[GetTrait('diligent').GetName( GetNullCharacter )|U]或[GetTrait('just').GetName( GetNullCharacter )]特质，则会额外失去[stress_i|E][stress|E]。"
 RICE_nubia_sibir_festival_competition_intent_header:0 "比试："
 RICE_nubia_sibir_festival_competition_intent:0 "比试"
 RICE_nubia_sibir_festival_competition_intent_desc:0 "激励青年展现勇敢与英勇。获得额外[legitimacy_i|E][legitimacy|E]。若你有[GetTrait('brave').GetName( GetNullCharacter )|U] 或 [GetTrait('ambitious').GetName( GetNullCharacter )]特质，则会额外失去[stress_i|E][stress|E]。"
