 nubia.0159.desc:0 "xxxxx"
 nubia.0159.a:0 "xxxxx"
 nubia.0160.t:0 "致[receiver.Custom('RICE_nubia_egypt_border_official_type_loc')]的信函"
 nubia.0160.desc:0 "作为[giver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，我的职责是维护努比亚与埃及在[GetTitleByKey('c_aswan').GetNameNoTier]附近的边界。这是份吃力不讨好的差事，我与边境对面共事的[receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]一同合作。\n\n我已许久未与现任[receiver.Custom('RICE_nubia_egypt_border_official_type_loc')][receiver.GetTitledFirstName]直接通信。为避免不必要的冲突与紧张，保障人员货物在[GetTitleByKey('c_aswan').GetNameNoTierNoTooltip]的安全流通，流通至关重要。\n\n为此我草拟了一封正式信函致[receiver.GetFirstNameNoTooltip]，详述近期边境相关事务，并向[receiver.GetHerHim]通报[realm_title.GetNameNoTier]的最新动态。或许我该趁此机会送[receiver.GetHerHim]一份薄礼……"
 nubia.0160.a:0 "发送正式信函——这只是例行公事。"
 nubia.0161.t:0 "来自[giver.Custom('RICE_nubia_egypt_border_official_type_loc')]的信函"
 nubia.0161.a:0 "代我回复我非常感谢[receiver.GetHerHis]。"
 nubia.0161.a.tooltip:0 "你给[giver.GetTitledFirstName]回了一封友好的信。"
 nubia.0161.b:0 "显然[receiver.GetSheHe|U]就是看低我们！给我起草回去！"
 nubia.0162.t:0 "来自[receiver.Custom('RICE_nubia_egypt_border_official_type_loc')]的回复"
 nubia.0162.desc:0 "看来[receiver.GetFirstNameNoTooltip]收到了我的示好，并以同样友好礼貌的方式回应了我，至少现在是如此。[receiver.GetHerHis]信使携带的信函告知我边界彼端的种种动向，并表示[receiver.GetSheHe]也对我们之间的坦诚沟通表示赞赏。"
 nubia.0162.a:0 "很高兴收到[receiver.GetHerHim]的回复。"
 nubia.0163.t:0 "$nubia.0162.t$"
 nubia.0163.desc:0 "看来[receiver.GetFirstNameNoTooltip]收到了我的示好，但似乎有些误解了我，[receiver.GetHerHis]的信使携带的信函告知我边界彼端的种种动向，同时也在指责我在信中的傲慢，称我需要在通信中表现得更为恭敬。"
 nubia.0163.a:0 "什么？我并不是有意冒犯[receiver.GetHerHim]！"
 nubia.0164.t:0 "加强边疆"
 nubia.0164.desc:0 "[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]作为重要边疆，在军事、政治和经济等多方面都有战略意义。身为[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，我的职责是抵御任何沿[GetGeographicalRegion('RICE_nile_river_valley').GetName]而来的敌军。\n\n为此我已调拨资源用于修缮旧堡垒和哨站，根据需要建造新据点，为往来这些地点的信使与巡逻队提供支援，并派遣部队清剿此地的匪徒与沙漠游掠部落。\n\n然而，有时当地人或旅行商人可能会对我们的行为保持警惕，所以我可能不得不投入一些额外的资源来确保一切顺利进行。"
 nubia.0164.a:0 "我们的资源很充足。"
 nubia.0165.t:0 "$nubia.0164.t$成功"
 nubia.0165.desc:0 "我收到下属报告，我们在[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]边境的防御工事建设进展顺利。我们成功维护了防御工事，保障了信使与巡逻队的运作，并在该地区俘获或消灭了多股匪徒与袭击者。\n\n"
 nubia.0165.a:0 "这将使我们在目前得到很好的防御。"
 nubia.0166.t:0 "好坏参半"
 nubia.0166.desc:0 "我收到下属报告，我们在[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]沿线加固边境的进展并不顺利。尽管我们竭尽全力维持防御、支援信使与巡逻队，并在此区域清剿匪徒与掠夺者，但仍遭遇诸多挫折。\n\n"
 nubia.0166.a:0 "至少我们的防御已经得到了加固。"
 nubia.0167.t:0 "边境土地交易"
 nubia.0167.desc:0 "当然，私人土地的买卖在许多地方都会发生，并不仅限于[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]。但由于边境地区的政治环境，这些交易常常受到质疑，因此像我这样的[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]不得不经常介入这些事务。\n\n在我管理的边境领土上，即将发生一宗重大的土地交易，卖家要求我在签署销售文件时担任见证人。\n\n而[witness.GetFirstNameNoTooltip]因与交易相关方有联系也被邀请担任见证人，[witness.GetSheHe]建议我们投入额外资源以确保交易顺利进行，以防出现法律纠纷或其他复杂情况。"
 nubia.0167.a:0 "得了，这不过是例行程序罢了。"
 nubia.0168.t:0 "$nubia.0167.t$成功"
 nubia.0168.desc:0 "应[top_liege.GetTitledFirstName]的要求，[witness.GetTitledFirstName]与我在[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]领地的土地交易中担任见证人。依照常规行政程序，我们签署的文件首列[top_liege.GetTitledFirstName]为土地最高管辖者，其余官员按位阶顺序排列。\n\n"
 nubia.0168.a:0 "这将很好地展示我是个多好的[ROOT.Char.Custom('RICE_nubia_egypt_border_official_type_loc')]！"
 nubia.0169.t:0 "$nubia.0167.t$失败"
 nubia.0169.desc:0 "$nubia.0168.desc$但过程出了意外，因为参与方就某些法律细节或个人分歧争论不休——老实说，我甚至记不清具体细节了，因为连[witness.GetFirstNameNoTooltip]和我也开始为某些事争执起来。\n\n"
 nubia.0169.a:0 "我当时只想尽快离开那里！"
 nubia.0170.t:0 "审查旅行者"
 nubia.0170.desc:0 "身为[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，我负责监管埃及与努比亚之间的跨境往来。这些旅行者中既有商人、外交使节等人员，也不乏盗匪与逃亡奴隶之类的不法之徒。\n\n我认为需要投入更多资源来加强对旅行者的规管力度，并驱逐那些具有危险倾向的人员。通过这种方式，我的下属还能直接或间接地获取有价值的情报。\n\n我们还可以将其中一些资源用于帮助[counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')][counterpart.GetTitledFirstName]，抓捕来自他们边境的任何犯罪逃犯，这将成为加强旅客审查带来的附加效益。"
 nubia.0170.a:0 "我们应该专注于自己的事务。"
 nubia.0171.t:0 "成功审查旅行者"
 nubia.0171.desc:0 "我们加强对往来于[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]边境旅行者事宜已见成效。据官员报告，目前抓获的罪犯与匪徒数量远超以往，而合法通行者也大多予以配合。\n\n得益于这些举措，"
 nubia.0171.a:0 "干得好，务必通知[counterpart.GetFirstNameNoTooltip]。"
 nubia.0172.t:0 "审查旅行者失败"
 nubia.0172.desc:0 "我们对往来于[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]的旅行者审查举措并未达到预期成效。官员们报告称，我们不仅未能抓获更多罪犯与匪徒，连合法旅行的商人也对我们的意图心存戒备甚至拒不配合，最终导致边境通行量下降。"
 nubia.0172.a:0 "我希望[counterpart.GetFirstNameNoTooltip]能理解……"
 nubia.0173.desc:0 "“特此告知贵国，我们近期在[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]我方一侧加强安全方面取得成效。因此我们抓获了一些来自贵国的逃犯，根据#italic 易货条约#!的规定我们将把这些逃犯遣返回贵国。”"
 nubia.0173.a:0 "做得好啊！"
 nubia.0174.desc:0 "“我们最近试图在[GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]一侧加强防御，但没能成功。有消息称贵方境内的几名逃犯潜入了我方，我们没能抓捕，而且很可能为时已晚，我深表歉意。”"
 nubia.0174.a:0 "对面那个蠢货搞砸了！"
 nubia.0175.t:0 "向[liege.GetTitledFirstNameNoTooltip]报告"
 nubia.0175.desc:0 "作为负责维护我们[primary_title.GetTierAsNameNoTooltip]境内埃及与努比亚边境的[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]，我必须定期向上级[liege.GetTitledFirstName]呈交报告。如此一来[liege.GetSheHe]便能及时掌握这片土地的最新动态。\n\n此刻我正在撰写这样一份报告，但由于还需处理其他事务，无法在此耗费过多时间。另一方面，我又应当精心斟酌这份报告，既要向[liege.GetFirstNameNoTooltip]展现我与手下的作为，又需避免显得过分张扬或刻意隐瞒过失。"
 nubia.0175.a:0 "写一份正常的报告，不需要过于华丽。"
 nubia.0176.t:0 "来自[reporter.Custom('RICE_nubia_egypt_border_official_type_loc')]的报告"
 nubia.0176.desc:0 "$nubia.0176.desc.intro$一切进展顺利，至少目前如此，[reporter.GetFirstNamePossessiveNoTooltip]报告用着尊重且恰当的文本提供了我需要了解的所有细节。[reporter.GetFirstNameNoTooltip]显然清楚当前局势，并且正在尽[reporter.GetHerHis]所能完成[reporter.GetHerHis]的工作。"
 nubia.0176.a:0 "派出信使告诉对方我已经收到。"
 nubia.0177.t:0 "$nubia.0176.t$"
 nubia.0177.desc:0 "$nubia.0176.desc.intro$一切看似顺利，但从信件的语气以及我其他官员和探子汇报的情况来看，事实并非如此。\n\n往好了说，[reporter.GetFirstNameNoTooltip]可能是误解了边境现状，往坏了说，[reporter.GetHerHis]说不定是在刻意隐瞒过失，或者想讨好我。"
 nubia.0177.a:0 "委婉提醒[reporter.GetHerHim]应恪尽职守。"
 nubia.0178.t:0 "文书吏的日常"
 nubia.0178.desc:0 "文书永远处理不完！[ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]！[GetGeographicalRegion('ghw_region_egypt').GetName]与[GetGeographicalRegion('RICE_greater_nubia_region').GetName]之间的边境受到双方严密监控，我和手下不得不处理各种语言的文件——从投诉到法律纠纷、到礼貌的申请函，再到下属提交的报告。唉，#italic 总得有人#!来处理这些文书工作。\n\n我叹了口气，继续读着桌上的文件："
 nubia.0178.a:0 "如何是头啊……"
 nubia.0179.t:0 "xxxxx"
 nubia.0179.desc:0 "xxxxx"
 nubia.0179.a:0 "xxxxx"
 nubia.0180.t:0 "前往班加纳提"
 nubia.0180.desc:0 "在[GetTitleByKey('b_old_dongola').GetNameNoTier]以南不远处，尼罗河东岸坐落着一个名为班加纳提的村落。这里看似平凡无奇，却拥有一座宏伟的教堂，那里是整个[GetGeographicalRegion('RICE_greater_nubia_region').GetName][GetReligionByKey('christianity_religion').GetAdjective]崇拜的中心，供奉着[Glossary( '圣拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]。\n\n世代以来，远近的信徒纷纷前来此地，寻求这位大天使所赐予的疗愈与神迹。有些人甚至在此驻留数周乃至数月，期盼能获得来自他的灵启之梦。\n\n无论我能否亲身获得这样的梦境，仍愿追寻拉斐尔的祝福，不日即将启程奔赴班加纳提朝圣。"
 nubia.0180.a:0 "前往班加纳提教堂！"
 nubia.0181.t:0 "抵达"
 nubia.0181.desc:0 "当我们登上山丘，遥望远方的班加纳提时，迎接我们的是沙漠微风的轻语呢喃，以及脚下壮阔的尼罗河景观。\n\n我们终于抵达了目的地！这真是令人欣慰的景象。\n\n现在该去教堂附近的[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]寻个住处歇息，而后才能在教堂里进行祈祷、冥想与疗愈。"
 nubia.0181.a:0 "赞美[Glossary( '圣拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]"
 nubia.0182.t:0 "进入教堂"
 nubia.0182.desc:0 "在[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]休整一段时间后，我和随行人员充满精力地准备前往班加纳提的教堂向[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]致敬并礼拜[faith.HighGodName]。\n\n虽然我知道班加纳提的教堂即便在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]地区不算什么宏伟壮观的教堂，但它也绝非简陋。我能感受到它悠久的历史以及无数先于我而来的朝圣者的足迹。\n\n当我们接近并走进教堂时，映入眼帘的是成百上千，甚至可能数以千计的先前朝圣者留在教堂墙壁上的铭文，其中大部分是用[greek.GetLanguage.GetName]或[nubian.GetLanguage.GetName]书写的。\n\n当我经过时，也看到有些朝圣者正在教堂墙壁上刻写这类神圣绘画，向世人展现他们的虔诚，留作后世传颂。或许以后我会留下自己的印记。"
 nubia.0182.a:0 "进去教堂吧……"
 nubia.0183.t:0 "祈祷"
 nubia.0183.desc:0 "和大多数来此的人一样，我花了很长时间在班加纳提教堂内敬拜并向[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]祈祷，期盼祂能治愈我身心疾苦，指引我这个[ROOT.Char.GetTitleAsNameNoTooltip]如何去成就伟大而高尚的事迹。\n\n或许我的祈祷终将被聆听，不过有些人也是这样想，这些朝圣者会在附近的[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]待上几周，期盼能获得大天使的托梦启示。"
 nubia.0183.a:0 "是时候离开了。"
 nubia.0184.t:0 "结束"
 nubia.0184.desc:0 "我的班加纳提朝圣之旅已近尾声，我站在班加纳提教堂外凝视着尼罗河对岸——不知以后还能否有机会再来。\n\n想到自己既非首位也非最后一位来此的朝圣者，心中涌起庄严肃穆之感，这里虽不及[GetTitleByKey('b_jerusalem').GetNameNoTier]或[GetTitleByKey('b_alexandria').GetNameNoTier]的圣地古老，却仍是[GetGeographicalRegion('RICE_greater_nubia_region').GetName]最受尊崇的圣地之一。我们这些朝圣者无论能不能蒙受[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]的托梦启示，许多人在这里都得到了改变，甚至治愈\n\n我最后瞥了一眼教堂，转身走向[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]收拾行装。"
 nubia.0184.a:0 "该回家了。"
 nubia.0185.t:0 "留宿"
 nubia.0185.desc:0 "并非人人都有幸在班加纳提的[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]连续住上数周来获得[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]托梦。哪怕长期居住于此，也未必能获得托梦。\n\n但我衷心希望自己正是这样的幸运儿——我计划在班加纳提留宿数周。现在一切安排妥当，我只需等待。"
 nubia.0185.a:0 "我肯定很快就能适应这里的床。"
 nubia.0186.t:0 "夜复一夜"
 nubia.0186.desc:0 "在班加纳提待了这么久，在[Glossary( '接待客栈', 'XENODOCHIUM_GLOSS' )]夜复一夜休息，希望[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]能托梦，但这次朝圣之旅很快就要结束了，因为"
 nubia.0186.desc.no_success:0 "我在班加纳提待了太久，却没有收到哪怕最微弱的托梦。\n\n很明显，我现在不会在这里得到关于圣拉斐尔的启迪。虽然在这里白费了这么多时间让人失望，但也许这正是命中注定的。"
 nubia.0186.desc.success:0 "我被托梦了！\n\n我记得梦中出现了#Bold [ROOT.Char.Custom('RICE_tuareg_dream_subject')]#!，并且我#Bold [ROOT.Char.Custom('RICE_tuareg_dream_action')]#!。当然，大天使拉斐尔也在梦中出现，还与我交谈。当我向班加纳提的[ROOT.Char.Custom('DefaultPriestTitlePlural')]询问此事时，他们认为这个梦是[ROOT.Char.Custom('RICE_nubia_dream_type')]"
 nubia.0186.a:0 "正是如此。"
