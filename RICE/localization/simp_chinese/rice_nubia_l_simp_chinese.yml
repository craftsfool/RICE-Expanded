 RICE_nubia_encouraged_my_religiosity:0 "鼓励我追求宗教目标"
 RICE_nubia_soulou_political:0 "索卢重心：政治事务"
 RICE_nubia_soulou_political_desc:0 "该角色正使用[Glossary( 'soulou', 'SOULOU_GLOSS' )]来处理敏感的政治信息。"
 RICE_nubia_soulou_personal:0 "索卢重心：私人事务"
 RICE_nubia_soulou_personal_desc:0 "该角色正使用[Glossary( 'soulou', 'SOULOU_GLOSS' )]来处理私人事务。"
 RICE_nubia_soulou_correspondence:0 "索卢重心：高效通信"
 RICE_nubia_soulou_correspondence_desc:0 "该角色正使用[Glossary( 'soulou', 'SOULOU_GLOSS' )]来更快速高效地与他人通信交流。"
 RICE_nubia_hermits_in_ancient_tomb:0 "基督教隐士重新利用古墓"
 RICE_nubia_helped_christian_hermits:0 "援助基督教隐士"
 RICE_nubia_accused_of_being_slave:0 "被指控为奴隶"
 RICE_nubia_accused_of_being_slave_desc:0 "该非洲角色声称自己是自由民，在埃及被奴隶贩子掳掠为奴，但其陈述真假难辨。"
 RICE_nubia_inspired_by_saint_hilaria:0 "受圣希拉里亚感召"
 RICE_nubia_inspired_by_saint_hilaria_desc:0 "[Glossary( '圣希拉里亚', 'SAINT_HILARIA_GLOSS' )]的事迹深深坚定了这位女性的信仰。"
 RICE_nubia_enjoying_ful_medames:0 "享受埃及蚕豆餐 "
 RICE_nubia_enjoying_ful_medames_desc:0 "该角色养成了每天早餐享用一碗美味可口的[Glossary( '埃及焖蚕豆', 'FUL_MEDAMES_GLOSS' )]习惯。"
 RICE_nubia_ancient_pottery_workshops:0 "扶持古陶器作坊"
 RICE_nubia_encountered_an_ablemba:0 "遭遇阿勒姆巴"
 RICE_nubia_encountered_an_ablemba_desc:0 "该角色声称其最近在努比亚的一些古迹附近遇到了[Glossary( '阿勒姆巴', 'ABLEMBA_GLOSS' )]，这种超自然遭遇让其感到非常不安。"
 RICE_nubia_archers_emulating_ancestors:0 "效仿射瞳者"
 RICE_nubia_archers_emulating_ancestors_desc:0 "该角色正激励麾下弓箭手效仿历代努比亚神射手的传奇事迹。"
 RICE_nubia_archers_discourage_foreigners:0 "射瞳者的故事"
 RICE_nubia_archers_discourage_foreigners_desc:0 "该角色正通过传扬历代努比亚神射手的传奇故事，震慑敌人使其不敢劫掠或进犯其疆域。"
 RICE_nubia_respects_powerful_women:0 "尊崇有影响力的女性"
 RICE_nubia_respects_powerful_women_desc:0 "该角色尊崇女性，因为努比亚基督徒认为她们承载着某种类似圣母玛利亚的神圣性。"
 RICE_nubia_protective_pots:0 "护佑陶罐"
 RICE_nubia_protective_pots_desc:0 "该角色家中的部分陶罐上写有基督教天使与圣徒之名，例如[Glossary( '拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]与[Glossary( '依皮马卓斯', 'SAINT_EPIMACHOS_GLOSS' )]，据信此举可使陶罐免受世俗与超自然力量的损害。"
 RICE_nubia_very_protective_pots:0 "庇佑陶罐"
 RICE_nubia_very_protective_pots_desc:0 "该角色家中大多数乃至全部陶罐都写有基督教天使与圣徒之名，例如[Glossary( '拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]与[Glossary( '依皮马卓斯', 'SAINT_EPIMACHOS_GLOSS' )]，据信此举可使陶罐免受世俗与超自然力量的损害。"
 RICE_nubia_saqia_dispute_opinion:0 "关于波斯轮的争论"
 RICE_nubia_investing_in_local_saqia:0 "投资本地波斯轮"
 RICE_nubia_investing_in_local_saqia_desc:0 "该角色将资源投入到了一个或多个本地[Glossary( '波斯轮', 'SAQIA_GLOSS' )]中。"
 RICE_nubia_learning_about_nile_seasons:0 "了解尼罗河季节"
 RICE_nubia_learning_about_nile_seasons_desc:0 "该角色近期获得了关于季节如何影响尼罗河生活的知识，例如了解[Glossary( '寒季', 'NUBIA_COLD_SEASON_2_GLOSS' )]如何影响沿河贸易路线。"
 RICE_nubia_sayings_of_the_desert_fathers_political:0 "受《沙漠之父箴言》启发"
 RICE_nubia_sayings_of_the_desert_fathers_political_desc:0 "该角色是最近在阅读[Glossary( '沙漠之父箴言', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]时获得启发，并正试图将其中的教诲运用到自己的政治中。"
 RICE_nubia_sayings_of_the_desert_fathers_spiritual:0 "受沙漠之父箴言启发"
 RICE_nubia_sayings_of_the_desert_fathers_spiritual_desc:0 "该角色是最近在阅读《[Glossary( '沙漠之父箴言', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]》时获得启发，因此希望在精神层面上有所提升。"
 RICE_nubia_learning_about_gossi_grain_silos:0 "了解戈西谷物筒仓"
 RICE_nubia_learning_about_gossi_grain_silos_desc:0 "该角色最近对所谓的$innovation_RICE_gossi_grain_silos$有了一些新的认识，包括这些泥筒粮仓的制作方法，以及它们如何改善农业和粮食储存。"
 RICE_nubia_fellow_raphael_devotee:0 "圣拉斐尔信徒"
 RICE_nubia_enthusiastic_saint_raphael_devotee:0 "圣拉斐尔狂信徒"
 RICE_nubia_enthusiastic_saint_raphael_devotee_desc:0 "该角色虔诚地向[Glossary( '圣拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]祈祷，坚信这以奇迹般的方式改善了自身健康，若其身体欠佳，则至少阻止了健康状况进一步恶化。"
 RICE_nubia_casual_saint_raphael_devotee:0 "圣拉斐尔泛信徒"
 RICE_nubia_casual_saint_raphael_devotee_desc:0 "该角色向[Glossary( '圣拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]祈祷的次数比多数人更频繁，但未到痴迷程度。他们相信这样做对健康产生了轻微但切实的积极影响。"
 RICE_nubia_buried_infant_under_servants_quarters:0 "将婴儿埋葬在仆人房间下"
 RICE_nubia_buried_infant_under_servants_quarters_desc:0 "当一名仆人的婴儿夭折后，该角色允许悲痛的双亲将婴儿埋葬在仆人房间下方，这遵循了当地古老习俗，人们相信此举能安抚婴儿灵魂并提高母亲受孕几率。然而并非所有人都对此感到心安。"
 RICE_nubia_drinking_karkade:0 "喜爱喝洛神花茶"
 RICE_nubia_drinking_karkade_desc:0 "该角色最近总是喝一些[Glossary( '洛神花茶', 'KARKADE_GLOSS' )]。"
 RICE_nubia_enjoys_making_karkade:0 "喜欢制作洛神花茶"
 RICE_nubia_enjoys_making_karkade_desc:0 "该角色喜欢和仆人们一起制作[Glossary( '洛神花茶', 'KARKADE_GLOSS' )]，全然不顾这是否符合其身份地位。"
 RICE_nubia_agriculture_decision_hafir_effect_tooltip_1:1 "当使用#bold $RICE_nile_farmers_positive_decision$#!或#bold $RICE_nile_pastoralists_positive_decision$#![decisions|E]时，若[county|E]有[GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip][modifier|E]，则额外获得增益。"
 nubia.0002.desc.baqt_accord:0 "两地的统治者更愿意恪守埃及与努比亚统治者早年缔结的《[RICE_baqt_treaty|E]》，积极开展外交与经贸往来。这片受尼罗河生命之水滋养的土地，有望在未来数年迎来繁荣与安定。"
 nubia.0002.desc.baqt_discord:0 "两地的统治者愈发不愿遵守埃及与努比亚早年达成的《[RICE_baqt_treaty|E]》。冲突与分歧日渐频发，人们担忧，即便有尼罗河的生命之水滋养，如果遭遇艰难时日也不足以哺育这片土地与其人民。"
 nubia.0015.b:0 "我们仍视自己为[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]。"
 nubia.0141.a.tooltip:0 "你将派遣一名出身低下的信使前往[target_province.GetName]送信，#N 降低#![mena.GetFirstName]成功率。"
 nubia.0141.b:0 "[angelosinkouda.GetFirstNameNoTooltip]，带好这封信——别让我失望！"
 nubia.0141.b.tooltip:0 "[angelosinkouda.GetFirstName]将[travel|E]前往[target_province.GetName]递送信件，#P 提升#![mena.GetFirstName]成功率。"
 nubia.0144.desc.courtier:0 "[angelosinkouda.GetFirstName]，我的[GetTitleByKey('d_nobatia').GetName]同僚之一，"
 nubia.0144.desc.messenger:0 "一位服务于[GetTitleByKey('d_nobatia').GetName]官员的信使，"
 nubia.0145.a.tooltip:0 "你致函[marianos.GetFirstNameNoTooltip]正式承诺处理此事，但很明显，你会将其列为低优先等级，最后很可能不了了之。"
 nubia.0145.b:0 "是时候去追捕一些奴隶了。"
 nubia.0145.b.tooltip:0 "你致函[marianos.GetFirstNameNoTooltip]正式承诺处理此事，并强调将列为优先要务，保证#italic 必定#!缉拿逃奴归案。"
 nubia.0146.opening:0 "我以[mena.GetFaith.HighGodName]之名向您致意并告知："
 nubia.0147.opening:0 "$nubia.0146.opening$"
 nubia.0147.a.tooltip:0 "[mena.GetFirstNameNoTooltip]将开始追捕行动，你只需静候佳音。"
 nubia.0148.b:0 "无论如何，我们都要竭尽全力找到这些奴隶！"
 nubia.0148.failure:0 "你未找到奴隶。"
 nubia.0148.success:0 "你成功找到并抓捕了那些奴隶。"
 nubia.0149.b:0 "是我的下属办事不力，责任在他们！"
 nubia.0149.tooltip:0 "[mena.GetTitledFirstNameNoTooltip]将得知你的失败。"
 nubia.0150.desc.intro:0 "今天我收到了[mena.GetTitledFirstName]关于[mena.GetHerHis]追查[teniellasi.GetTitledFirstNamePossessive]的奴隶的进展的信函。"
 nubia.0150.desc.blame_others:0 "有意思的是，[mena.GetFirstNameNoTooltip]声称过错主要在于[mena.GetHerHis]的下属，指责他们在搜寻奴隶时未能尽职尽责。我不确定这是事实，还是[mena.GetFirstNameNoTooltip]在试图推卸责任。"
 nubia.0150.desc.blame_self:0 "有意思的是，[mena.GetFirstNameNoTooltip]将这次失败完全归咎于[mena.GetHerselfHimself]自己，而非[mena.GetHerHis]的下属。[mena.GetSheHe|U]表示，总结起来，是[mena.GetHerHis]未能妥善调配资源和领导此次行动导致了这一结果。我想，我得赞扬[mena.GetHerHim]的责任感。"
 nubia.0150.desc.conclusion:0 "\n\n尽管如此，尽管这让我感到沮丧，但[teniellasi.GetFirstNameNoTooltip]无疑会对这个消息更加不满。话虽如此，尽管这严格来说是涉及[teniellasi.GetHerHis]私有财产的问题，但我考虑过对[teniellasi.GetHerHim]进行经济补偿以弥补损失，让[teniellasi.GetHerHim]好受一些。"
 nubia.0150.b:0 "补偿[teniellasi.GetHerHim]是我力所能及的事。"
 nubia.0152.b:0 "我会赎买你们的自由，条件是你们在此定居。"
 nubia.0152.c:0 "我的职责就是将你们送还原主。"
 nubia.0178.info:0 "#emphasis 历史背景：#!该事件中的风味文本是从大量中世纪努比亚或埃及真实文献摘录中随机选取的。这些摘录反映了努比亚或埃及官员可能接触的各类人物，以及他们可能卷入的种种境遇。"
 nubia.0220.b:0 "#bold $e_RICE_greater_egypt$#!帝国"
 nubia.0220.c:0 "#bold $e_RICE_greater_nubia$#!帝国"
 nubia.0220.d:0 "#bold $e_RICE_greater_kemet$#!帝国"
 nubia.0220.e:0 "#bold $e_RICE_greater_kush$#!帝国"
 nubia.0220.tooltip:0 "[GetTitleByKey('e_RICE_nile').GetName]将更名为你选择的名称"
 nubia.0221.b:0 "亚历山大大帝"
 nubia.0221.c:0 "麦罗埃女王坎达凯"
 nubia.0221.d:0 "“学者”克利奥帕特拉"
 nubia.0221.e:0 "“勾引者”克利奥帕特拉"
 nubia.0221.f:0 "三重伟大的赫耳墨斯"
 nubia.0221.g:0 "塞索斯特利斯"
 nubia.0221.h:0 "苏里德·伊本·萨胡克"
 nubia.0221.i:0 "伍麦叶王朝"
 nubia.0222.desc.abbasids:0 "伟大的哈里发国的一个遥远分支——#bold 阿拔斯家族#!"
 nubia.0222.desc.alexander:0 "古代最伟大的征服者——#bold 亚历山大大帝#!。"
 nubia.0222.desc.candace:0 "成功抵抗了亚历山大军队的麦罗埃女王——#bold 坎达凯#!。"
 nubia.0222.desc.cleopatra_the_scholar:0 "在中东地区以学术女王而闻名的——#bold 克利奥帕特拉#!。"
 nubia.0222.desc.cleopatra_the_seducer:0 "能与罗马势力抗衡的狡黠魅惑者——#bold 克利奥帕特拉#!。"
 nubia.0222.desc.hermes_trismegistus:0 "才华横溢的传奇哲学家——#bold 三重伟大的赫耳墨斯#!。"
 nubia.0222.desc.sesostris:0 "埃及最伟大的战士法老之一——#bold 塞索斯特利斯#!"
 nubia.0222.desc.surid_ibn_salhouk:0 "这位传说中在洪水前建造了金字塔的国王——#bold 苏里德·伊本·萨胡克#!"
 nubia.0222.desc.umayyads:0 "逃往尼罗河边境的一支#bold 伍麦叶家族#!分支。"
 nubia.0222.desc.backup:0 "强大的埃及[Glossary( '法老', 'PHARAOH_GLOSS' )]与库施的[Glossary( '至尊', 'QORE_GLOSS' )]及[Glossary( '女王母亲', 'KANDAKE_GLOSS' )]生活在遥远的古代。"
 nubia.0275.b:0 "专注处理个人私密事务"
 nubia.0275.c:0 "专注处理快速通信事务"
 nubia.0276.b:0 "我会捐赠一些资源帮助他们。"
 nubia.0276.info:0 "#emphasis 历史背景：#!尽管埃及和苏丹在中世纪早期就已基督教化，但人们仍然会利用该地区的古老纪念碑。例如，古墓就被隐士们改造为宗教礼拜和苦修的场所。中世纪文献中记载的此类行为，未必是为了展示或炫耀基督教对埃及和苏丹旧有异教信仰的优越性，因为这些古老宗教当时已不再奉行，也并非对基督教构成制度性威胁。相反，占据这些墓穴很可能是出于实用原因，因为它们通常是相当坚固耐用的建筑，既与聚居区保持距离，又相对靠近。"
 nubia.0277.b:0 "[african.GetFirstNameNoTooltip]，我信你所言，必将护你自由。"
 nubia.0277.c:0 "你可以重获自由，但我会补偿你先前的主人。"
 nubia.0277.d:0 "自由可以给你，但有个条件：成为我的廷臣。"
 nubia.0277.info:0 "#历史背景：#!中世纪埃及生活着大量来自撒哈拉以南非洲的居民，其中许多是奴隶，但也有自由人，如商人、雇佣兵、朝圣者或获释奴隶。原始文献记载了涉及自由非洲人在埃及境内可能遭受非法绑架并被强制为奴的法律案件。例如，10世纪故事集[Glossary( '《印度奇闻录》', 'KITAB_AJA_IB_AL_HIND_GLOSS' )]指出，独自在尼罗河沿岸行走且无人陪伴或保护的黑人非洲旅客，往往很容易成为贪婪奴隶贩子的猎物。"
 nubia.0278.b:0 "我怀疑[courtier.GetFirstNameNoTooltip]的虔诚。"
 nubia.0278.c:0 "在我看来，[courtier.GetFaith.GetReligion.GetName]是一种愚蠢的宗教。"
 nubia.0280.b:0 "我明白，但我们还有更要紧的事情"
 nubia.0280.info:0 "#emphasis 历史背景：#!在库施帝国鼎盛时期（约公元前8世纪至公元4世纪），其境内拥有许多繁荣的陶器作坊。即使在库施帝国最终崩溃之后，这些作坊（或其继承者）仍持续运转数百年，在后期库施文明中心——阿洛迪亚（即南努比亚）地区更是始终延续着相似的陶器风格。这一实证充分说明了古代库施人与中世纪努比亚人之间存在着显著的延续性，尽管两者在宗教、语言和政治背景方面存在差异。"
 nubia.0281.b:0 "那想必是邻村的零星灯火。"
 nubia.0282.b:0 "我会付钱让这些人继续住下去。"
 nubia.0283.b:0 "这些故事将阻止外国人攻击我们。"
 nubia.0284.b:0 "我怀疑并非所有女性都如此神圣……"
 nubia.0284.info:0 "#emphasis 历史背景：#!数个世纪以来，女性在努比亚社会中始终占有崇高地位，尽管其角色与权益随时代变迁多有更易。例如，史料记载了多位努比亚远古女王，但中世纪未见女性担任执政女王的证据；尽管如此，女王母亲在中世纪努比亚政坛扮演关键角色，且大量文献表明该时期努比亚女性可独立拥有、买卖土地财产，并成为基督教修道院与教堂的重要资助人。特别是在中世纪时期，圣母玛利亚作为耶稣基督之母的角色，常被用以佐证女性崇高地位的合理性。直至现代，通常信奉伊斯兰教的努比亚人仍将其尊重女性的习俗归因于昔日对圣母玛利亚的基督教崇敬传统。"
 nubia.0285.b:0 "我认为#italic 所有#!罐子都应该刻上这些名字！"
 nubia.0285.c:0 "他们应该停止这种无效的胡闹。"
 nubia.0285.info:0 "#emphasis 历史背景：#!在中世纪基督教努比亚，天使崇拜极为盛行。这一点通过该地区考古遗址中发现的大量铭文得到证实，此外建筑墙壁、人类木乃伊的纹身以及陶器器皿上遍布着各类大天使与圣徒之名。埃及文献亦曾提及此类努比亚习俗。当时人们相信，在这些物体表面呼唤这些宗教人物的名字，是抵御邪恶力量的强大武器。"
 nubia.0286.b:0 "赞美天使长米迦勒！愿祂赐福你们！"
 nubia.0286.c:0 "[ROOT.Char.GetFaith.HighGodName]会更好地保护你，但这并不重要。"
 nubia.0287.b:0 "[courtier_1.GetFirstNameNoTooltip]说得对，[courtier_2.GetFirstNameNoTooltip]正在逃避[courtier_2.GetHerHis]的职责。"
 nubia.0287.c:0 "[courtier_2.GetFirstNameNoTooltip]说得对，[courtier_1.GetFirstNameNoTooltip]就是想占便宜。"
 nubia.0287.d:0 "你们俩肯定能就这个问题达成一致吧？"
 nubia.0287.d.tooltip:0 "尽力帮助他们解决纠纷"
 nubia.0287.d.bad:0 "你未能成功调解他们的纠纷。"
 nubia.0287.d.good:0 "你成功调解了他们的纠纷。"
 nubia.0288.b:0 "你能再详细给我讲讲寒季和风向吗？"
 nubia.0289.b:0 "运用这份智慧来提升我的精神世界。"
 nubia.0290.b:0 "这是你的纹身，但我们会看看它是否有用。"
 nubia.0290.info:0 "$RICE_east_african_tattoo_decision_context_tooltip$"
 nubia.0291.b:0 "我应该问问我的仆人们这些具体是怎么运作的。"
 nubia.0292.a.nothing:0 "你感觉不到什么变化。"
 nubia.0292.a.casual:0 "你确实感觉好些了"
 nubia.0292.a.enthusiastic:0 "你奇迹般地感觉比以前健康多了"
 nubia.0292.b:0 "当然，我们每天都祈祷。"
 nubia.0293.b:0 "抱歉，但你必须把孩子安葬在墓地里。"
 nubia.0293.info:0 "#emphasis 历史背景：#!将死婴或幼儿埋葬在房屋下的大罐中的做法，在尼罗河沿岸的埃及和苏丹地区已有数千年历史，因为人们相信这能帮助母亲生育更多子女，还认为将死婴独自留在墓地是不妥当的。例如在苏丹有可追溯至中世纪时期的考古遗址中，既发现了安葬在常规墓地的婴儿，也发现了埋在房屋下方的婴儿。这种习俗在世界其他许多地区不同历史时期同样存在，比如古希腊。"
 nubia.0294.b:0 "看完他们，然后我便启程"
