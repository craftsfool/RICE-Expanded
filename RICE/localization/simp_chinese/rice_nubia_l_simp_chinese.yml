 RICE_nubia_nilotic_bovine_sacrifice_honor_the_ancestors_intent:0 "纪念祖先"
 RICE_nubia_nilotic_bovine_sacrifice_honor_the_ancestors_intent_desc:0 "通过这次祭祀向先祖与[GetPlayer.GetFaith.PantheonTerm]表达敬意。结束时获得[piety_i|E][piety|E]。若你拥有[GetTrait('diligent').GetName( GetNullCharacter )]、[GetTrait('humble').GetName( GetNullCharacter )]或[GetTrait('zealous').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]。"
 RICE_nubia_nilotic_bovine_sacrifice_communion_intent_header:0 "交往："
 RICE_nubia_nilotic_bovine_sacrifice_communion_intent:0 "交往"
 RICE_nubia_nilotic_bovine_sacrifice_communion_intent_desc:0 "强化社区成员之间联系。结束时获得[prestige_i|E][prestige|E]。若你拥有[GetTrait('ambitious').GetName( GetNullCharacter )]、[GetTrait('gregarious').GetName( GetNullCharacter )]或[GetTrait('just').GetName( GetNullCharacter )]特质则额外失去[stress_loss_i|E][stress|E]。"
