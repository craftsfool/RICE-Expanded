 RICE_nubia_bestow_kanz_al_dawla:0 "授予“国家珍宝”头衔"
 RICE_nubia_bestow_kanz_al_dawla_tooltip:0 "xxxxx"
 RICE_nubia_bestow_kanz_al_dawla_desc:0 "现任[GetTrait('RICE_governor_of_aswan').GetName( GetNullCharacter )]一直为我尽心效力。为表嘉奖，我决定授予其[Glossary( '国家珍宝', 'KANZ_AL_DAWLA_GLOSS' )]头衔，来表彰其忠诚服务，以及在管理埃及与努比亚边境、处理[RICE_baqt_treaty|E]事务中日益重要的角色。"
 RICE_nubia_bestow_kanz_al_dawla_desc_self:0 "难道我没有好好侍奉[ROOT.Char.GetLiege.GetTitledFirstName]吗？正是我承担了日益繁重的职责，为国家管理着埃及与努比亚边境以及[RICE_baqt_treaty|E]。"
