 nubia.0012.t:0 "尼罗河上的惨案"
 nubia.0012.desc:0 "尼罗河沿岸正陷入混乱，摄政女王母亲[rasad.GetFirstName]对埃及的控制正在减弱。由于埃及遭受饥荒，政府无力支付军饷，法蒂玛军队公开肆意劫掠。\n\n目前有两支法蒂玛军队派系崛起成为最强势力，突厥派系以精锐骑兵为核心骨干，其最强大的指挥官是冷酷无情的[nasir_al_dawla.GetNickname]，为成为埃及#italic 军事独裁者#!不惜一切代价；而非洲派系则主要由[nahid_al_dawla.GetNickname]率领的黑人战士组成。[rasad.GetFirstNameNoTooltip]将自己的命运托付给了自己的同胞，希望他们能帮助其继续掌权。\n\n当这两大势力激烈交锋时，其他力量正作壁上观——包括黎凡特地区最能干的法蒂玛将领[badr_al_jamali.GetFirstName]，以及镇守埃及与努比亚边境的将领世家[banu_kanz.GetDynastyName]宗族。"
 nubia.0012.a:0 "这是埃及的一场浩劫……"
 nubia.0013.t:0 "班加纳提第二教堂"
 nubia.0013.desc:0 "班加纳提邻近[GetTitleByKey('b_old_dongola').GetNameNoTier]，多年来一直是当地供奉[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]的宗教中心，吸引着附近的[GetReligionByKey('christianity_religion').GetAdjective]朝圣者。然而随着时间流逝，班加纳提最初[GetReligionByKey('christianity_religion').GetName]初传至[GetGeographicalRegion('RICE_greater_nubia_region').GetName]时修建的建筑——已因年久失修而逐渐坍塌。\n\n[rebuilder.GetTitledFirstName]意识到这一令人痛心的现状，便出资在旧教堂之上为班加纳提建造了一座新教堂。让新教堂规模更宏伟，装饰更华美，并设有能满足前来礼拜的信众宗教需求的设施。\n\n尼罗河沿岸的人们都在谈论班加纳提的这一转变，其名声也越来越大。毫无疑问，这将在长期内吸引更多朝圣者。"
 nubia.0013.a:0 "班加纳提将从此次重建中获益良多。"
 nubia.0014.t:0 "[culture.GetCollectiveNounNoTooltip]人的崛起"
 nubia.0014.desc:0 "几个世纪以来，[GetGeographicalRegion('ghw_region_egypt').GetName]与[GetGeographicalRegion('RICE_greater_nubia_region').GetName]之间的关系一直受[RICE_baqt_treaty|E]约束，理论上包括对两地间人员往来的管制，但实际上，大批人口无论是否获得许可都频繁越境。\n\n"
 nubia.0014.a:0 "尼罗河沿岸正经历着巨大的变化。"
 nubia.0015.t:0 "$nubia.0014.t$"
 nubia.0015.desc:0 "多年来$heritage_east_african_name$势力在[GetGeographicalRegion('ghw_region_egypt').GetName]存在最终形成一种新的[culture.GetName]身份认同，即便他们不占多数，却已成为一股不可忽视的强大力量。\n\n或许现在我们也该将自己视为这个不断壮大的社区的一部分了……"
 nubia.0015.a:0 "我们也将拥抱这个新的[culture.GetCollectiveNounNoTooltip]人身份！"
 nubia.0016.t:0 "$nubia.0014.t$"
 nubia.0016.desc:0 "多年来$heritage_arabic_name$势力在[GetGeographicalRegion('ghw_region_egypt').GetName]存在最终形成一种新的[culture.GetName]身份认同，即便他们不占多数，却已成为一股不可忽视的强大力量。\n\n或许现在也该轮到我们，将自己视为这个不断壮大的社区的一部分了……"
 nubia.0016.a:0 "$nubia.0015.a$"
