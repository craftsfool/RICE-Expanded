 RICE_baqt_frontier_decision_confirm:0 "又到了处理文书的时候了……"
 RICE_baqt_frontier_decision_context_tooltip:0 "#emphasis 历史背景：#!自法老时代起，阿斯旺周边的第一瀑布便是埃及与努比亚的传统边界。当阿拉伯人与努比亚人在7世纪达成[RICE_baqt_treaty|E]并重申此边界后，[Glossary( '阿斯旺', 'GOVERNOR_OF_ASWAN_GLOSS' )]与[Glossary( '诺巴提亚都长', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]便分别成为负责埃及和努比亚易货条约与守卫边境的官员。考古学家发现了大量的文献，证实了这些人、其下属以及与之往来者的活动。这些文献内容广泛，从商人的投诉，到枯燥的物资清单，再到土地买卖的契约。"
