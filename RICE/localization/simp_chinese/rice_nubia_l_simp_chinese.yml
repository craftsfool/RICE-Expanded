 game_concept_RICE_baqt_egyptian_rulers_desc:0 "在[RICE_baqt|E][situation|E]背景下，$game_concept_RICE_baqt_egyptian_rulers$构成一个[situation_participant_group|E]，该群体由#bold #italic 不属于#!#!撒哈拉以南[heritage|E][culture|E]的[rulers|E]组成，例如$heritage_arabic_name$或$heritage_byzantine_name$[heritage|E]。他们只能与[RICE_baqt_african_rulers|E]交换[RICE_baqt_goods|E]。"
