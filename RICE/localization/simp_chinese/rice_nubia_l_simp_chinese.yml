 nubia.0001.t:0 "永恒的尼罗河"
 nubia.0001.desc.intro:0 "埃及与努比亚的心脏是尼罗河，土地是它的身躯，人民是它的血脉。珍贵的尼罗河清澈水流中孕育着生机，有时它赐予人们丰收与富足；有时却以饥荒降下诅咒。自埃及自埃及[Glossary( '法老', 'PHARAOH_GLOSS' )]与库施的[Glossary( '至尊', 'QORE_GLOSS' )]及[Glossary( '女王母亲', 'KANDAKE_GLOSS' )]时代起便是如此。"
 nubia.0001.desc.baqt:0 "几代人之前，刚刚征服埃及的正统哈里发国军队在马库里亚和努比亚这两个地区的边境发生了冲突，最终，双方达成了一项协议——即[RICE_baqt|E]。自那时起，这项协议就规定尼罗河沿岸的政治与贸易格局，但它能否像尼罗河一样长久延续呢？\n\n"
 nubia.0001.desc.conclusion:0 "无论未来如何，这里有一个不可否认的事实，只要尼罗河存在，它的人民就会继续生存下去。"
 nubia.0001.a:0 "我们生死皆系尼罗河"
 nubia.0002.t:0 "易货条约：[my_subregion.GetCurrentPhase.GetName]"
 nubia.0002.desc:0 "由于近期政治、经济和文化格局的变化，[GetGeographicalRegion('ghw_region_egypt').GetName]与[GetGeographicalRegion('RICE_greater_nubia_region').GetName]正逐渐进入#V [my_subregion.GetCurrentPhase.GetName]#!。\n\n"
 nubia.0002.a:0 "尼罗河永恒，但人民却始终在变化。"
