 nubia.0064.desc.georgios:0 "\n\n[georgios.GetFirstNameNoTooltip]派使者向我献上大笔黄金，希望能拉拢我支持[georgios.GetHerHis]一方。"
 nubia.0064.desc.niuty:0 "\n\n[niuty.GetFirstNameNoTooltip]派使者向我献上大笔钱财，希望我不仅遵守休战约定，更能加入[niuty.GetHerHis]的阵营。"
 nubia.0064.desc.both:0 "\n\n[georgios.GetFirstNameNoTooltip]与[niuty.GetFirstNameNoTooltip]都派使者向我献上大笔黄金，希望我能直接出兵助其作战。"
 nubia.0064.desc.neither:0 "\n\n[georgios.GetFirstNameNoTooltip]与[niuty.GetFirstNameNoTooltip]都未曾以外交赠礼等方式明确拉拢我，但显然双方都希望我直接介入战争，为其提供支援。"
 nubia.0064.desc.conclusion:0 "\n\n这或许是个从天而降的黄金时机，能让我从努比亚攫取更多利益……但真的值得吗？"
 nubia.0064.b:0 "我将站在[niuty.GetFirstNameNoTooltip]一方。"
 nubia.0064.c:0 "我暂时……两不相帮……"
 nubia.0065.desc.niuty:0 "[umari.GetFullName]选择了我！\n\n不知是被金钱诱惑，还是出于战略考量，[umari.GetFirstNameNoTooltip]帮我攻打我叔叔[georgios.GetFirstName]，我深知[umari.GetFirstName]是个奸诈之徒，我们都明白彼此在相互利用；但我确信，待我叔叔被解决后，我同样能收拾这个毒蛇。"
 nubia.0065.desc.georgios:0 "选择我那背信弃义的侄儿[niuty.GetFirstName]。\n\n不知是被金钱诱惑，还是出于战略考量，[umari.GetFirstNameNoTooltip]已决定全力支持我的侄儿推翻我！虑到他们签署的“停战协议”，这并不令人意外，不过他们俩迟早会反目成仇——希望越快越好。"
 nubia.0066.desc.niuty:0 "选择我那[georgios.GetFirstName]叔叔。\n\n不知是被金钱诱惑，还是出于战略考量，[umari.GetFirstNameNoTooltip]已决定撕毁我们的停战协议，与我叔叔的结盟！我早就知道不能太相信那个强盗，[umari.GetSheHe]比我预想的更早背叛了我。不过我也知道[umari.GetSheHe]迟早会背叛我叔叔，这让我感到些许安慰。"
 nubia.0066.desc.georgios:0 "背叛了我那侄子[niuty.GetFirstName]。\n\n不知是被金钱诱惑，还是出于战略考量，[umari.GetFirstName]已决定撕毁与我侄儿的停战协议，转而直接支持我！我深知[umari.GetFirstNameNoTooltip]是个奸诈之徒，我们都明白彼此在相互利用；但我确信，待我侄儿被解决后，我同样能收拾这个毒蛇。"
 nubia.0067.desc.niuty:0 "帮助我那愚蠢的叔叔[georgios.GetFirstName]。"
 nubia.0067.desc.georgios:0 "帮助我那叛徒侄子[niuty.GetFirstName]。"
 nubia.0067.desc.conclusion:0 "\n[umari.GetSheHe]竟然保持#italic 中立#!！\n\n[umari.GetFirstName]已向双方表示，[umari.GetSheHe]暂时不会介入这场战争。这条狡猾的毒蛇，大概盘算着目前这对[umari.GetHerHim]而言是最佳选择……毋庸置疑，待这场战争结束后，[umari.GetFirstNameNoTooltip]也必须被处理掉。"
 nubia.0090.b:0 "或许甚至能说服一些人替我们而战。"
 nubia.0124.desc.intro:0 "只有傻瓜才会相信任何规定两个王国之间和平的协议能长久维持。埃及与努比亚之间的[RICE_baqt_treaty|E]就是绝佳例证。\n\n由[saladin.GetNickname]率领的埃及人与我们努比亚人之间的战争由谁挑起并不重要。尽管双方仍受数百年前先祖签署的#italic 易货条约#!约束，但我们的土地却都因掠夺与袭击而满目疮痍——甚至我们的首都也一度遭受破坏。\n\n"
 nubia.0183.desc.dreaming:0 "尽管我有职责在身，我还是抽出了一些时间留在班加纳提，希望能有这样的一个梦。在接下来的几周里，我会白天去这座教堂祈祷，晚上睡觉时期盼拉斐尔能在梦中降临。"
 nubia.0183.desc.no_dreaming:0 "不幸的是，我的职责让我没有足够的时间留在班加纳提，真是烦人！但这就是现实，我希望[ROOT.Char.GetFaith.HighGodNameAlternate]至少对我能来到这里感到满意。"
 nubia.0202.b:0 "我应该徒步前往克津山的圣安东尼洞"
 nubia.0202.c:0 "这里的苦行僧非常有趣"
 nubia.0202.d:0 "更频繁的祈祷和敬拜会更合适"
 RICE_upper_egypt_every_nile_county_no_pork_desc:0 "你在[GetGeographicalRegion('RICE_nile_river_valley').GetName]拥有的每个[county|E]不将猪视为禁忌的[faith|E]"
