 RICE_cattle_compensation_hook:0 "牧群赔偿"
 RICE_saint_catherine_ashtiname_of_muhammad:0 "《圣约》"
 RICE_saint_catherine_ashtiname_of_muhammad_desc:0 "#bold 《圣约》#!，或称《先知穆罕默德和基督教徒的契约》，是一份令状，上面写着先知穆罕默德授予圣凯瑟琳修道院基督教僧侣的保护与特权，这份原始文件至今仍由该修道院妥善保存。"
 RICE_saint_catherine_bedouin_guards:0 "贝都因卫队"
 RICE_saint_catherine_bedouin_guards_desc:0 "尽管存在宗教差异，有过紧张或冲突，但圣凯瑟琳修道院几个世纪以来一直受到#bold 贝都因卫队#!的保护，他们抵御各种袭击和攻击——甚至包括来自其他贝都因部落的袭击。"
 RICE_saint_catherine_burning_bush:0 "燃烧的荆棘"
 RICE_saint_catherine_burning_bush_desc:0 "圣凯瑟琳修道院内有一株古老的荆棘，据传正是#bold 燃烧的荆棘#!，上帝通过荆棘任命摩西带领以色列人脱离埃及的奴役，前往迦南获得自由。"
 RICE_saint_catherine_collection_of_icons:0 "修道院圣像"
 RICE_saint_catherine_collection_of_icons_desc:0 "几个世纪以来，圣凯瑟琳修道院收集了大量#bold 圣像#!，这些圣像采用多种艺术风格，代表了不同的基督教派别，并反映了圣经中多样的基督教主题和事件。"
 RICE_saint_catherine_monasterys_library:0 "修道院图书馆"
 RICE_saint_catherine_monasterys_library_desc:0 "圣凯瑟琳修道院的#bold 图书馆#!已有数百年历史，馆内收藏着用各种语言撰写的手稿，其中部分是由来自遥远国度的朝圣者和虔诚基督徒捐赠的。"
 RICE_saint_catherine_path_of_moses:0 "摩西之路"
 RICE_saint_catherine_path_of_moses_desc:0 "所谓的#bold 摩西之路#!始于圣凯瑟琳修道院，穿过两道拱门——狮子门与律法门，可以沿着摩西当年为从上帝手中领取十诫而走进附近群山的足迹前行。"
 RICE_saint_catherine_relics_of_saint_catherine:0 "圣凯瑟琳的圣物"
 RICE_saint_catherine_relics_of_saint_catherine_desc:0 "圣凯瑟琳修道院得名于数个世纪前，当时在修道院附近发现了#bold 亚历山大的加大肋纳（即圣凯特琳）#!——这位大殉道者的圣髑。自那时起，这些圣髑便一直在修道院中妥善保存。"
 RICE_saint_catherine_well_of_moses:0 "摩西之井"
 RICE_saint_catherine_well_of_moses_desc:0 "圣凯瑟琳修道院内有一口井，据说就是所谓的#bold 摩西之#!，当年摩西来到米甸人之地时，就是在这里遇见了未来的妻子西坡拉。时至今日，这口井仍是修道院的水源。"
 RICE_nubia_dream_type_health:0 "一个#V 治愈#!的梦，象征着圣拉斐尔为治愈我的各种疾病（无论是身体上的、精神上的还是灵魂上的）所做的努力。"
 RICE_nubia_dream_type_prophetic:0 "一个#V 预言#!的梦，象征着圣拉斐尔意在告诫我未来需要警惕的危险，或是即将降临的良机与祝福。"
 RICE_nubia_dream_type_inspiring:0 "一个#V 激励#!的梦，象征着圣拉斐尔希望赋予我动力与自律，助我达成正义的目标。"
 RICE_nubia_dream_type_advice:0 "来自圣拉斐尔的#V 建议#!，为我提供明智的指导，教我如何处理生活中的各种事务，尤其是那些曾给我带来诸多困扰的问题。"
 game_concept_nile_flood_short:0 "泛滥"
 RICE_nile_situation_concepts_title:0 "检查每个图标\n从而更好地理解#V 尼罗河谷#!的情况"
 game_concept_RICE_nile:0 "尼罗河泛滥"
 game_concept_RICE_nile_river:0 "尼罗河泛滥"
 game_concept_RICE_nile_river_desc:0 "$game_concept_RICE_nile_river$是代表尼罗河泛滥的[situation|E]，自法老时代以来这一直是埃及生活中至关重要的一部分。每年尼罗河会泛滥特定程度（或不泛滥），表现为[situation_phase|E]。\n\n大多数情况下，泛滥会是[good_nile_flood_short|E]，但有时会是[bad_nile_flood_short|E]，分别带来不同的增益和减益。\n\n虽然任何领土沿[GetGeographicalRegion('RICE_nile_river_valley').GetName][ruler|E]都会自动参与这一[situation|E]，但某些[cultural|E][traditions|E]会解锁额外的[decisions|E]或[activities|E]，从而获得与尼罗河相关的进一步增益。"
 game_concept_RICE_baqt_treaty:0 "易货契约"
 game_concept_RICE_baqt:0 "易货条约"
 game_concept_RICE_baqt_desc:0 "$game_concept_RICE_baqt$是一种[situation|E]，描绘了[RICE_baqt_egyptian_rulers|E]（多为穆斯林）与[RICE_baqt_african_rulers|E]（多为基督教徒）统治者之间的政治经济关系，其基础是七世纪正统哈里发国试图征服努比亚未果后签署的传奇条约。\n\n$game_concept_RICE_baqt$分为埃及和努比亚两个区域，代表这两方，[situation|E]会在每个区域以不同的[situation_phase|E]形式摇摆（[RICE_baqt_accord|E]和[RICE_baqt_discord|E][situation_phases|E]），反映各方对易货契约的理解与态度。\n\n该[situation|E]的核心机制是[RICE_baqt_egyptian_rulers|E]和[RICE_baqt_african_rulers|E]通过三种[interactions|E]与对方交换、索取或提供[RICE_baqt_goods|E]。若对方[ruler|E]接受，双方将获得彼此间的[truce|E]。这些[interactions|E]的接受概率、奖励及代价会受多种因素影响，包括各区域当前的[situation_phase|E]。"
 game_concept_RICE_baqt_good_short:0 "货物"
 game_concept_RICE_baqt_goods_short:0 "货物"
 game_concept_RICE_baqt_good:0 "易货条约货物"
 game_concept_RICE_baqt_goods:0 "易货条约货物"
 game_concept_RICE_baqt_goods_desc:0 "$game_concept_RICE_baqt_goods$是[RICE_baqt|E][situation|E]中[rulers|E]通过三种不同[interactions|E]获得的增益[character_modifiers|E]，分别是：\n\n$BULLET_WITH_TAB$$RICE_nubia_baqt_propose_exchange$\n$BULLET_WITH_TAB$$RICE_nubia_baqt_offer_gift$\n$BULLET_WITH_TAB$$RICE_nubia_baqt_demand_payment$\n\n[ruler|E]可提供某一物资类型（即[modifiers|E]），具体取决于其[capital|E]位于[RICE_baqt|E]两大[situation_sub_regions|E]——埃及与努比亚之一位置。这些[interactions|E]还能让[rulers|E]彼此建立[truce|E]，而其他[rulers|E]接受这些[interactions|E]的概率取决于多种因素，包括当前[RICE_baqt|E]所处的[situation_phase|E]。\n\n这些[interactions|E]#V 只能#!发生在[RICE_baqt_egyptian_rulers|E]和[RICE_baqt_african_rulers|E]之间。"
 game_concept_good_nile_flood:0 "好的尼罗河泛滥"
 game_concept_good_nile_flood_desc:0 "如果[RICE_nile_river|E]处于以下[situation_phases|E]之一，则认为发生了好的泛滥：\n\n$BULLET_WITH_TAB$@RICE_nile_flood_normal_icon!$nile_normal_flood$\n$BULLET_WITH_TAB$@RICE_nile_flood_high_icon!$nile_high_flood$\n$BULLET_WITH_TAB$@RICE_nile_flood_very_high_icon!$nile_very_high_flood$"
 game_concept_bad_nile_flood:0 "坏的尼罗河泛滥"
 game_concept_bad_nile_flood_desc:0 "如果[RICE_nile_river|E]处于以下[situation_phases|E]之一，则认为发生了坏的泛滥：\n\n$BULLET_WITH_TAB$@RICE_nile_flood_overflooding_icon!$nile_overflooding_flood$\n$BULLET_WITH_TAB$@RICE_nile_flood_low_icon!$nile_low_flood$\n$BULLET_WITH_TAB$@RICE_nile_flood_very_low_icon!$nile_very_low_flood$"
 game_concept_RICE_baqt_gift_full:0 "$RICE_nubia_baqt_offer_gift$"
