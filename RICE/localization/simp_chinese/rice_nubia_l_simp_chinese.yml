 game_concept_RICE_baqt_interactions_desc:0 "$game_concept_RICE_baqt_goods_desc$"
 game_concept_RICE_cattle_raid_intent:0 "盗牛"
 game_concept_RICE_cattle_raid_intent_desc:0 "拥有$tradition_RICE_cattle_economy_name$[tradition|E]的[cultures|E]可使用独特的[raid_intent|E]——#bold $RICE_cattle_raid_intent$#!。成功完成[raid|E]后，获得少量[legitimacy_i|E][legitimacy|E]。"
 situation_RICE_nubia_baqt_situation:0 "易货条约"
 situation_RICE_nubia_baqt_situation_desc:0 "[SITUATION.GetType.GetDesc]"
 situation_type_RICE_nubia_baqt_situation:0 "易货条约"
 situation_type_RICE_nubia_baqt_situation_desc:0 "7世纪时，努比亚基督徒与阿拉伯穆斯林签署了[RICE_baqt_treaty|E]，该条约基于努比亚人与罗马人之间更早的先例协议，[RICE_baqt|E]影响了该地区的政治与社会，尽管人们往往并未严格遵守它。"
 RICE_nubia_baqt_situation_sub_region_egypt:0 "埃及"
 RICE_nubia_baqt_situation_sub_region_nubia:0 "努比亚"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_nubian_rulers:0 "非洲统治者"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_nubian_rulers_desc:0 "这位坚定果敢、外交手腕娴熟的[RICE_baqt_african_rulers|E]统治者来自尼罗河中游，统治着繁荣富饶的领地，是古埃及法老王朝、库施王国与早期基督教会神父遗产的继承者。"
 RICE_nubia_baqt_situation_RICE_nubia_baqt_nubian_rulers:0 "#weak （该地区的努比亚统治者）#!"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_egyptian_rulers:0 "埃及统治者"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_egyptian_rulers_desc:0 "这些发源于尼罗河北部的[RICE_baqt_egyptian_rulers|E]统治者，所掌控的国土见证过无数伟大文明的兴衰轮回；他们地处地中海、非洲与中东的十字路口。"
 RICE_nubia_baqt_situation_RICE_nubia_baqt_egyptian_rulers:0 "#weak （该地区的埃及统治者）#!"
 baqt_ascendancy:0 "主导"
 RICE_nubia_baqt_situation_baqt_ascendancy_situation_phase:0 "$baqt_ascendancy$"
 situation_RICE_nile_river_situation:0 "尼罗河"
 situation_RICE_nile_river_situation_desc:0 "[SITUATION.GetType.GetDesc]"
 situation_type_RICE_nile_river_situation:0 "尼罗河局势"
 situation_type_RICE_nile_river_situation_desc:0 "[RICE_nile_river|E]自古埃及[Glossary( '法老', 'PHARAOH_GLOSS' )]与库施[Glossary( '至尊', 'QORE_GLOSS' )]及[Glossary( '女王母亲', 'KANDAKE_GLOSS' )]时代起，就一直是埃及与努比亚生活中不可或缺的一部分，因为正是尼罗河养育了这些土地。"
 RICE_nile_river_situation_sub_region_RICE_nile_river_valley:0 "尼罗河谷"
 RICE_nile_river_situation_participant_group_RICE_nile_pastoralist_rulers:0 "农耕游牧混居"
 RICE_nile_river_situation_participant_group_RICE_nile_pastoralist_rulers_desc:0 "尽管[RICE_nile|E]通常与定居民族联系在一起，但游牧民族在这里也会有零星的农耕，因此在这片土地的历史中也扮演了重要角色。"
 RICE_nile_river_situation_RICE_nile_pastoralist_rulers:0 "[RICE_nile_river|E]#weak （该地区的游牧统治者）#!"
 RICE_nile_river_situation_participant_group_RICE_nile_agrarian_rulers:0 "农耕"
 RICE_nile_river_situation_participant_group_RICE_nile_agrarian_rulers_desc:0 "生活在[RICE_nile|E]沿岸的人都深知这条河流的重要性，正是它让农业乃至文明成为可能。"
 RICE_nile_river_situation_RICE_nile_agrarian_rulers:0 "[RICE_nile_river|E]#weak （该地区的农耕统治者）#!"
 nile_normal_flood:0 "正常水位"
 nile_normal_flood_desc:0 "尼罗河水位涨至十六腕尺，这是一次适度的泛滥，意味着今年埃及和努比亚将风调雨顺。"
 nile_high_flood:0 "高水位"
 nile_high_flood_desc:0 "尼罗河水位上涨至十七腕尺，这是一次不错的泛滥，意味着今年埃及和努比亚的收成将十分好。"
 nile_very_high_flood:0 "极高水位"
 nile_very_high_flood_desc:0 "尼罗河水位上涨至十七腕尺，这是一次极好的泛滥，意味着今年埃及和努比亚的收成将极其丰饶。"
 nile_low_flood:0 "低水位"
 nile_low_flood_desc:0 "尼罗河的水位涨至十四、五肘尺，这是一次低于平均水平的泛滥，意味着今年埃及和努比亚的收成将会歉收。"
 nile_very_low_flood:0 "极低水位"
 nile_very_low_flood_desc:0 "尼罗河的水位甚至未能达到十四肘尺，这极低的泛滥水位意味着今年埃及和努比亚地区的收成将极为糟糕甚至颗粒无收。"
 nile_overflooding_flood:0 "洪水"
 nile_overflooding_flood_desc:0 "尼罗河水位上涨至19腕尺甚至更高，这是一场危险的大洪水，很可能淹没农田，导致今年埃及和努比亚的收成毁于一旦。"
