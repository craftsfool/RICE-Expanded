 nubia.0260.t:0 "松特木"
 nubia.0260.desc:0 "在[GetGeographicalRegion('RICE_nile_river_valley').GetName]沿岸地区，人们历来使用[Glossary( '松特木', 'SUNT_GLOSS' )]造船。这种木材不仅以比其他木材更不易渗透，还可以在材料有限下快速批量建造船只。\n\n[councilor.GetTitledFirstName]表示，[councilor.GetSheHe]最近与[county.GetNameNoTier]的一些村庄建立了联系，这些村庄以用#italic 松特木#!造船而闻名。\n\n“钱到位，我就能疏通关系，”[councilor.GetFirstNameNoTooltip]提议道，“让我们雇佣他们按需快速廉价地制造优质船只。”"
 nubia.0260.a:0 "好主意。就这么办吧。"
 nubia.0261.t:0 "使用不同语言"
 nubia.0261.desc:0 "传统上，我们[nubian.GetCollectiveNoun]在书写中使用三种语言：[nubian.GetLanguage.GetName]、[coptic.GetLanguage.GetName]与[greek.GetLanguage.GetName]。鉴于我们与[GetReligionByKey('islam_religion').GetName]信徒的往来，也在较小程度上使用[arabic.GetLanguage.GetName]。\n\n我的文书需要具备所有这些语言的能力，因为我们往往在不同情境下使用它们——例如[coptic.GetLanguage.GetNameNoTooltip]常用于宗教典籍。但我的[chancellor.GetCouncilTitle][chancellor.GetTitledFirstName]提出担忧，认为部分文书官对某些语言不够精通。\n\n“应当加强对文书官的培训，”[chancellor.GetFirstNameNoTooltip]建议道，“以保证我们的文书质量。”"
 nubia.0261.a:0 "注重培训他们的[nubian.GetLanguage.GetNameNoTooltip]"
 nubia.0262.t:0 "守旧还是从新？"
 nubia.0262.desc:0 "数个世纪以来，我们[ROOT.Char.GetCulture.GetCollectiveNoun]人始终从繁荣强盛的[GetTitleByKey('e_byzantium').GetNameNoTier]汲取经验。譬如我们的宫廷与宗教服饰，就深受[GetTitleByKey('e_byzantium').GetNameNoTierNoTooltip]影响。\n\n然而近来，一些人却对更具本土特色的服饰感兴趣，还将我们的时尚风格融入此类元素加以改造。甚至我在宫廷中也留意到有人偏爱这类本土服饰，但另一些人则坚持[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]风格的传统华服。"
 nubia.0262.a:0 "我觉得我们本土风格的服装更有吸引力。"
 nubia.0263.t:0 "暴虐的[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]人？"
 nubia.0263.desc:0 "我正在接见几位来自[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的[ROOT.Char.GetCulture.GetName]商人，他们刚结束旅途归来，向我禀告异国见闻，里面既有对我有用的情报，也有旅途趣事——其中有些是关于我们[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]人，或者说，是人们#italic 眼中#!的我们。\n\n比如据说有人战战兢兢地私下议论[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]人，认为我们是由暴君统治的民族，因为我们法律规定国王可以将任何人贬为奴隶，而所有人都毫无怨言地接受。\n\n荒谬至极，但实在可笑！我们的奴隶可是债户、罪犯或战俘呢。"
 nubia.0263.a:0 "很好！其他人应该带着敬畏看待我们。"
 nubia.0264.t:0 "森林守护者"
 nubia.0264.desc:0 "我在庭院边缘坐下，看着夕阳沉下，夜幕降临。\n\n几个仆人的孩子和我的[child.Custom('GetDaughterSon')][child.GetFirstName]正追逐嬉笑，争抢着一根兽骨。我依稀记得童年时玩过类似游戏，却想不起规则，便询问站在身旁的[ROOT.Char.Custom('lowly_servant_type')]这究竟是什么游戏，毕竟其孩子也在跟着玩耍。\n\n“[ROOT.Char.GetLadyLord]，”仆人恭敬地躬身答道，“这是#italic 森林守护者#!。您看孩子们分成了两队——一队扮作狮子，另一队扮作狼。注意到地上画的两个大圆圈了吗？每队都要设法把兽骨带回自己的圆圈。”"
 nubia.0264.a:0 "哼，一个傻乎乎的小孩游戏罢了。"
 nubia.0265.t:0 "希吉拉纪元"
 nubia.0265.desc:0 "自[arabic.GetHeritage.GetName]民族征服并接管[GetGeographicalRegion('ghw_region_egypt').GetName]后，我们就互有往来。从那时起，我们的一些文书官学会了用[arabic.GetLanguage.GetName]读写；甚至连部分行政文书和[ROOT.Char.GetFaith.GetAdjective]宗教文献也以该语言撰写。\n\n[arabic.GetLanguage.GetNameNoTooltip]的影响深远，以致我的一些文书官惯于使用[Glossary( '希吉拉纪元', 'ERA_OF_THE_HEGIRA_GLOSS' )]纪年，而非我们传统的[Glossary( '殉道者纪年', 'ERA_OF_THE_MARTYRS_GLOSS' )]。\n\n信仰[zealot.GetFaith.GetName]的[zealot.GetTitledFirstName]就一直在向我抗议书吏们这种趋势。“适应另一种语言明智且务实，”[zealot.GetSheHe]有一天告诉我，“但为何要采用[GetReligionByKey('islam_religion').GetAdjective]异教徒的历法？尤其是在使用 [arabic.GetLanguage.GetNameNoTooltip]以外的语言书写时候？我们的祖先会为我们如此轻易地抛弃自己的信仰和价值观而感到羞愧！”"
 nubia.0265.a:0 "你知道[liege.GetTitledFirstName]信仰[GetReligionByKey('islam_religion').GetNameNoTooltip]吧？"
 nubia.0266.t:0 "红砖废墟"
 nubia.0266.desc:0 "在[GetGeographicalRegion('RICE_greater_nubia_region').GetName]地区，人们常常能在尼罗河沿岸某处发现看似随意掩埋的红砖土丘。其中一些可能是古老[ROOT.Char.GetFaith.GetAdjective]的[ROOT.Char.GetFaith.HouseOfWorshipPlural]遗址，甚或是[Glossary( '至尊', 'QORE_GLOSS' )]及[Glossary( '女王母亲', 'KANDAKE_GLOSS' )]时期建造的建筑遗存。\n\n这些土堆零散分布，但最近在[county.GetNameNoTier]地区发现多处红砖土堆，其规模足以利用于改造多个建筑。不过民间始终流传着这些土堆里栖息着远古恶灵的传说——若我们惊扰这些魂灵与其居所，必将触怒它们……"
 nubia.0266.a:0 "但愿这些砖块能物尽其用！"
 nubia.0267.t:0 "$travel_event_prefix$在哈菲尔水库休息"
 nubia.0267.desc:0 "我们很幸运，在[ROOT.Char.GetCurrentLocation.GetName]发现了一座未受破坏、维护良好的[Glossary( '哈菲尔水库', 'HAFIR_GLOSS' )]。我们用水库中的水补充了储备，这里的水无疑比尼罗河中偶尔出现的劣质水更洁净清爽。\n\n在那里，我们遇到了一些同样来取水的当地牧民，并与他们聊了起来。其中一人告诉我：“我们赞颂有远见的[ruler.GetTitledFirstName]，投入资源维护这些#italic 哈菲尔水库#!。”"
 nubia.0267.a:0 "“啊！你说的那个人，就是我！”"
 nubia.0268.t:0 "$travel_event_prefix$牛肉在哪儿？"
 nubia.0268.desc:0 "我与随从途经[ROOT.Char.GetCurrentLocation.GetName]的一处[culture.GetName]人村落借宿，友善的村民极为好客，将所剩无几的食粮都拿出来招待我们。人们面如土色，这无疑是个穷困的村庄。\n\n“抱歉，[ROOT.Char.GetLadyLord]，但这已是我们能拿出的最好食物了，”看着村民们正呈上少得可怜的山羊肉和绵羊肉，长老惶恐地告诉我。\n\n“像您这般尊贵强大的[ROOT.Char.GetWomanMan]，我们实在拿不出牛肉款待，”长老继续说道，“此地耕牛极为稀少。愿……这不会冒犯到您。”"
 nubia.0268.a:0 "“当然不会！这些羊肉很好吃！”"
 nubia.0269.t:0 "波门爸爸的箴言"
 nubia.0269.desc:0 "[chaplain.GetTitledFirstName]语气坚定地重申道：“关于这一点，《[Glossary( '沙漠之父箴言', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]》表述得非常清楚。[Glossary( '爸爸波门', 'ABBA_POEMEN_GLOSS' )]告诉我们，[GetReligionByKey('christianity_religion').GetAdjective]的修士不应参与农务，更不应拥有农田，因为这些本应是集体劳动，容易使修士受到诱惑，而他们本该远离俗世。”\n\n又来了！这已经不是[chaplain.GetFirstNameNoTooltip]第一次对我大发牢骚了。\n\n“作为你的[chaplain.GetCouncilTitle],”[chaplain.GetSheHe]接着说道，“我知道我们无法禁止修士们这样做。毕竟，我们太多教会都拥有土地，如果改变这一点，将会摧毁我们的经济，而且我承认修士们偶尔也确实需要这些资金。但是……这实在令人沮丧。我们到底还能做些什么呢？”"
 nubia.0269.a:0 "现实有时会令人失望，但这在所难免。"
 nubia.0270.t:0 "圣拉斐尔的尊号"
 nubia.0270.desc:0 "[chaplain.GetTitledFirstName]今日正以[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]为题布道，这位大天使深受[GetReligionByKey('christianity_religion').GetAdjective][ROOT.Char.GetCulture.GetCollectiveNoun]崇敬，其程度或许超越世上任何民族。\n\n[chaplain.GetFirstNameNoTooltip]满怀热忱地列举我们在本土俗语[ROOT.Char.GetCulture.GetLanguage.GetName]与教会正式用语[greek.GetLanguage.GetName]中赋予圣拉斐尔的诸多尊称，以此向我们强调这位大天使的诸多美德：“圣徒之主宰”、“救赎者”、“全人类之助佑者”“#italic 生之律法#!”、“#italic 无偿治愈者#!”以及“#italic 至高智慧#!”。\n\n“聆听这些尊名！”[chaplain.GetFirstNameNoTooltip]高声宣道，“拉斐尔不仅引领教会，还能驯服敌人和恶魔！”"
 nubia.0270.a:0 "拉斐尔在这些艰难时期给予我们精神上的指引。"
 nubia.0271.t:0 "拉斐尔无处不在"
 nubia.0271.desc:0 "今天有一位来自遥远国度的[GetReligionByKey('christianity_religion').GetAdherentName]商人访问我的宫廷，尽管相隔万里、文化各异，却依然对[ROOT.Char.GetFaith.HighGodName]怀有如此坚定的信仰，实在令人深受鼓舞。\n\n在我们交谈中，这位商人提到，他在游历我国疆域时发现了一个有趣的现象。\n\n“我并不觉得这是什么坏事，但我注意到，在许多[ROOT.Char.GetFaith.HouseOfWorshipPlural]里，那些精美的艺术作品似乎格外热衷于描绘[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]，” 商人指出，“我倒觉得你们对祂如此虔诚实在令人着迷——当然，这绝不是什么坏事！我很少见到其他大天使能像祂这样，被画在这些地方。”"
 nubia.0271.a:0 "我不太清楚是怎么开始的，但我们就是这样。"
 nubia.0272.t:0 "$travel_event_prefix$哼哼，哼哼！"
 nubia.0272.desc:0 "我在[ROOT.Char.GetCurrentLocation.GetName]的一座朴素的[faith.GetAdjective][faith.HouseOfWorship]稍作停留时，当地僧侣饲养了大量猪让我大吃一惊。\n\n“这里经常有许多朝圣者和游客前来，”当我们被请进屋内后，其中一位僧侣解释道，“与牛相比，猪贱好饲养，因此对于我们这些谦卑的[culture.GetName]人来说，猪肉一直是方便易得的食物。”\n\n他话音刚落，我们便听到外面传来一阵阵响亮的哼叫声。僧侣轻笑着说道：“待久了，你就会习惯猪的叫声了，这跟住在有牲畜的农场没什么两样。对了，你们想尝尝猪肉吗？”"
 nubia.0272.a:0 "由于我信仰[ROOT.Char.GetFaith.GetAdjective]，我必须拒绝。"
 nubia.0273.t:0 "掌财官"
 nubia.0273.desc:0 "[chaplain.GetTitledFirstName]向我推荐了一位非常适合协助我的优秀人选。\n\n“在我担任[chaplain.GetCouncilTitle]时，”[chaplain.GetSheHe]说道，“我不断从多位[ROOT.Char.GetFaith.GetAdjective]信仰的[ROOT.Char.Custom('DefaultPriestTitlePlural')]口中听到这位[Glossary( '掌财官', 'OIKONOMOS_GLOSS' )]的事迹。[oikonomos.GetHerHis|U]的名字叫[oikonomos.GetFirstName]，据我所知，[oikonomos.GetSheHe]学识渊博，尤其擅长数字方面的工作，并且曾在附近的一处[ROOT.Char.GetFaith.HouseOfWorshipPlural]任职。如果我们不招募这样一位才华横溢的人才，那可就太可惜了。”"
 nubia.0273.a:0 "有意思，就让这家伙来宫廷看看。"
 nubia.0274.t:0 "圣依皮马卓斯的信徒"
 nubia.0274.desc:0 "我的一位$knight_culture_player_plural_no_tooltip_lowercase$[knight.GetTitledFirstName]，多次展现出对[knight.GetFaith.HighGodName]与[knight.GetFaith.GetAdjective]信仰的虔诚。[knight.GetSheHe|U]近来对[Glossary( '圣依皮马卓斯', 'SAINT_EPIMACHOS_GLOSS' )]产生了极大狂热，将[knight.GetHerHis]生命的得救与战争技艺皆归功于这位圣徒。\n\n在[knight.GetCulture.GetCollectiveNoun]之中，尽管依皮马卓斯远不如诸如[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]那般广受尊崇，他依然享有非常崇高的声望。"
 nubia.0274.a:0 "愿依皮马卓斯指引你，我的$knight_culture_player_no_tooltip_lowercase$！"
 nubia.0275.t:0 "索卢"
 nubia.0275.desc:0 "我最近又聘用了一些[ROOT.Char.GetCulture.GetName]人[Glossary( '索卢', 'SOULOU_GLOSS' )]。他们在传递敏感信件、担任我与下属之间信使的职责时，已经展现了其高度的谨慎与专业素养。\n\n我应当善用这些他们的勤勉，让他们的服务集中用于最能发挥效率与谨慎的具体事务上……"
 nubia.0275.a:0 "专注处理微妙的政治事务"
 nubia.0276.t:0 "入住古墓"
 nubia.0276.desc:0 "我收到消息，一群[faith.GetAdjective]隐士在[county.GetNameNoTier]的荒野中发现了一座古墓，并已在此建筑内定居。\n\n在[GetGeographicalRegion('RICE_nile_river_valley').GetName]一带，这类事情时有发生，毕竟此地众多久远以前建造的古老纪念碑至今仍保存相对完好。退隐到一个充满精神上的平和与慰藉之地，置身于过往时代的艺术与建筑之中，这想法本身就蕴含着某种深意。"
 nubia.0276.a:0 "我相信隐士们在那里会过得很好。"
 nubia.0277.t:0 "自由民，还是奴隶？"
 nubia.0277.desc:0 "“我是自由民——求您以正直[ROOT.Char.GetTitleAsNameNoTooltip]应有的公正仁心行事，我的[ROOT.Char.GetLadyLord]！”[african.GetFirstName]在讲述完自身经历后恳求道。\n\n我仔细端详着[african.GetHerHim]，试图从[african.GetHerHis]眼中捕捉是否藏有一丝欺瞒，同时深思着眼前这道难题。这位[african.GetFirstNameNoTooltip]真如[african.GetSheHe]所言，是途经[county.GetNameNoTier]时遭凶残奴隶贩子非法掳掠的自由[african.GetCulture.GetName][african.GetWomanMan]？抑或只是个狡黠的奴隶，正编造故事企图逃离[african.GetHerHis]的主人？\n\n此事难有定论，但我必须做出决断。"
 nubia.0277.a:0 "将这满口谎言的奴隶送归其主人。"
 nubia.0278.t:0 "圣希拉里亚：女性的楷模"
 nubia.0278.desc:0 "[courtier.GetTitledFirstName]向我讲述了她近日造访附近一座[courtier.GetFaith.GetAdjective]礼拜堂的经历。在那里，她读到经堂藏书中的一卷卷轴，其中记载着[Glossary('圣希拉里亚','SAINT_HILARIA_GLOSS')]的故事——这位罗马皇帝芝诺的女儿因仰慕[GetTitleByKey('b_wadi_natrun').GetNameNoTier]的修士们，竟伪装成宦官加入修行。\n\n虽然[courtier.GetSheHe]早已知晓这个传说，但在礼拜堂这般神圣之地重读经典，仍令她深感震撼、备受鼓舞。[courtier.GetSheHe]立志要以圣希拉里亚为榜样，度过贞洁虔敬的一生。"
 nubia.0278.a:0 "愿你能实现恪守美德的心愿。"
 nubia.0279.t:0 "焖蚕豆"
 nubia.0279.desc:0 "啊……早上一盘美味的[Glossary( '埃及焖蚕豆', 'FUL_MEDAMES_GLOSS' )]唤醒美好的一天。\n\n一大早，仆人和厨师们就按照我昨晚的要求，为我准备了这道令人垂涎的咸香美食。他们将蚕豆与大蒜、洋葱、小茴香及其他香料混合在一起，最后再配上一个水煮蛋，并点缀少许柠檬汁。"
 nubia.0279.a:0 "赞美[ROOT.Char.GetFaith.HighGodName]，虽说简单，但胜在#italic 好吃#!。"
 nubia.0280.t:0 "古老的陶器作坊"
 nubia.0280.desc:0 "[councilor.GetTitledFirstName]，我的[councilor.GetCouncilTitle]，提请我注意，[county.GetNameNoTier]的[culture.GetName]陶器作坊目前经营状况良好，但还有提升的空间。\n\n“这些作坊，与[GetGeographicalRegion('RICE_greater_nubia_region').GetName]地区的许多其他作坊一样，得益于我们的支持，多年来一直很活跃，将其产品远销四方，”[councilor.GetFirstNameNoTooltip]提醒我，“它们已经运营了不知多久——或许已经长达数个世纪。然而，言归正传，我认为这里的作坊需要更多的支持，因为它们对外国商人的销售情况不佳。扶持本地经济将有助于我们所有人的繁荣。”"
 nubia.0280.a:0 "好主意！我们应该支持这个产业。"
 nubia.0281.t:0 "夜间出没之物"
 nubia.0281.desc:0 "当我看到[courtier.GetTitledFirstName]时，[courtier.GetSheHe]显得面容憔悴且坐立不安。憔悴我能理解——昨晚[courtier.GetSheHe]失踪时我们都很担心，但发现[courtier.GetSheHe]只是从附近村庄返家途中迷路后就松了口气。但坐立不安？这就有些奇怪了。\n\n“我在村庄时太靠近古老的[culture.GetName]遗迹了，”[courtier.GetFirstNameNoTooltip]解释道，“我看见远处有亮光，为安全起见就朝它走去，这才迷了路。那肯定是[Glossary( '阿勒姆巴', 'ABLEMBA_GLOSS' )]！我发誓那光芒看起来像个人形女子，但光影很快就消散了。这种邪恶的[old_faith.GetReligion.GetAdjective]精怪不遵从我们的[courtier.GetFaith.GetReligion.GetAdjective][courtier.GetFaith.ReligiousText]，所以我拼命向[courtier.GetFaith.HighGodName]祈祷寻求庇护。”"
 nubia.0281.a:0 "[ROOT.Char.GetFaith.HighGodName]确实护佑了你。"
 nubia.0282.t:0 "待客之道"
 nubia.0282.desc:0 "我们很高兴能抵达[ROOT.Char.GetCurrentLocation.GetName]这座[culture.GetName]风格的[faith.HouseOfWorship]，这意味着我们今晚有了落脚之处。\n\n[faith.GetAdjective][faith.AltPriestTermPlural]十分好客，告诉我们能在此待上几天。正当我们安顿下来时，却看见几个衣衫褴褛的旅人正离开此地。\n\n当我询问缘由时，其中一位[faith.AltPriestTermPlural]告诉我：\"我们从不拒绝访客，但能力有限。按习俗，访客可以在靠近大门的房间住几天，但不可久留。毕竟往来过客众多，我们实在没有足够空间容纳所有人。\""
 nubia.0282.a:0 "“没事，我可以理解。”"
 nubia.0283.t:0 "射瞳者"
 nubia.0283.desc:0 "很久以前，我们的祖先与来自北方的[arabic.GetHeritage.GetName]民族曾多次交战，我们的祖先依靠令人畏惧的箭术成功击退了入侵者，并与之签订了[RICE_baqt_treaty|E]。\n\n直至今日，[arabic.GetHeritage.GetName]民族仍称我们[nubian.GetCollectiveNoun]人为“射瞳者”。传说在那远古战役中，我们的祖先曾刻意瞄准[arabic.GetHeritage.GetNameNoTooltip]的眼睛使其失明。\n\n这类传说近来令我深感兴趣。我毫不怀疑，倘若紧要关头，我们当代的弓箭手定能重现先祖的绝技。"
 nubia.0283.a:0 "我应该激励我的弓箭手们效仿先辈。"
 nubia.0284.t:0 "尊崇女性"
 nubia.0284.desc:0 "[chaplain.GetCouncilTitle][chaplain.GetTitledFirstNamePossessive]今日的布道关乎荣耀的圣母玛利亚，以及她在我们生命中的重要地位。\n\n“我们[nubian.GetCollectiveNoun]人与其他许多民族不同，”[chaplain.GetFirstNameNoTooltip]宣告道，“始终铭记尊崇生活中的女性。正是通过她们，我们得以忆起玛利亚的神圣，而她们身为女性的存在本身，亦承载着这份神圣。”"
 nubia.0284.a:0 "没错，敬重我们的母亲并不可耻！"
 nubia.0285.t:0 "陶器上的圣人"
 nubia.0285.desc:0 "我的几位[nubian.GetName]仆人养成了习惯，在我的陶器上刻下例如[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]和[Glossary( '圣徒依皮马卓斯', 'SAINT_EPIMACHOS_GLOSS' )]的名字。\n\n这些仆人是勤勉虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]，他们坚信此类举措能保护我们免受邪魔袭扰。不过，在这么多陶罐上刻名字或许有些过度，尤其是我还需将部分陶器用于宴会及其他重要事务。"
 nubia.0285.a:0 "好好赏赐他们，有比没有好。"
 nubia.0286.t:0 "天使长米迦勒之名"
 nubia.0286.desc:0 "在[ROOT.Char.GetCurrentLocation.GetName]的村庄休息时，不知是想讨好我，还是他们本就生性热情，村里的长老们带我们参观了村子，讲解他们的生活方式与近况，途中我注意到几位村民正在房屋上雕刻着什么。\n\n“那边的男孩们正在把大天使米迦勒的名字刻在那些新建房屋的墙上，”一位陪同我的长老注意到我的好奇心，脸上露出一丝微笑解释道。“我们[culture.GetName]人大多不识字，但我们是善良的[faith.GetAdherentNamePlural]，虔诚地向[faith.HighGodName]祈祷，并且知道只要我们呼唤大天使的名字，他们就会保佑我们。”"
 nubia.0286.a:0 "有意思。请继续带我们参观吧。"
 nubia.0287.t:0 "权责不明"
 nubia.0287.desc:0 "[courtier_1.GetTitledFirstName]与[courtier_2.GetTitledFirstName]最近就[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的一处[Glossary( '波斯轮', 'SAQIA_GLOSS' )]发生了激烈争执，想请我来裁决。根据[ROOT.Char.GetCulture.GetName]的习俗与律法，二人同为这架#italic 波斯轮#!的出资人，在建造与维护过程中承担了同等份额的责任。\n\n然而[courtier_1.GetFirstNameNoTooltip]声称[courtier_2.GetFirstNameNoTooltip]未能履行[courtier_2.GetHerHis]应尽的出资义务，在[courtier_1.GetFirstNameNoTooltip]看来，这不过是维系装置运转的绳索维护等小额修缮。而[courtier_2.GetFirstNameNoTooltip]则反驳称[courtier_1.GetFirstNameNoTooltip]怠惰，企图让[courtier_2.GetHerHim]不公平地承担所有修缮工作。"
 nubia.0287.a:0 "[Glossary( '波斯轮', 'SAQIA_GLOSS' )]这样的小事也拿来烦我？"
 nubia.0288.t:0 "尼罗河的寒季"
 nubia.0288.desc:0 "商人的生活并非总是光鲜亮丽的冒险。今日几位途经此地、前来宫廷致意的商人让我深刻领悟到这个道理。\n\n这些商人在[GetGeographicalRegion('ghw_region_egypt').GetName]与[GetGeographicalRegion('RICE_greater_nubia_region').GetName]两地皆有生意往来，常需驾驶自己的船只在尼罗河上来回航行。然而然而今年因种种缘由，他们在[Glossary( '寒季', 'NUBIA_COLD_SEASON_2_GLOSS' )]期间遭遇货物运输延误。\n\n“全怪#italic 风向#!！”一位商人叹道，“这批货怕是难以如期送达。虽说是我们规划不周，这笔生意亏了不少钱！真是闹心。”"
 nubia.0288.a:0 "“一切[ROOT.Char.GetFaith.HighGodNameAlternate]注定。”"
 nubia.0289.t:0 "沙漠之父箴言"
 nubia.0289.desc:0 "最近，我花时间阅读了[Glossary( '《沙漠之父箴言》', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]，在这些为[ROOT.Char.GetFaith.GetReligion.GetName]做出巨大贡献的沙漠神父的故事中找到了极大慰藉。\n\n我发现即便在当今时代，这些故事传授的教诲仍蕴含许多智慧——这些智慧能运用于我的日常生活，正如历代[ROOT.Char.GetFaith.GetAdherentNamePlural]所做的那样。"
 nubia.0289.a:0 "运用这份智慧，成为更出色的[ROOT.Char.GetTitleAsNameNoTooltip]"
 nubia.0290.t:0 "[courtier.GetFirstNamePossessiveNoTooltip]辟邪纹身"
 nubia.0290.desc:0 "几天前，[courtier.GetTitledFirstName]前往[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]附近的一座[courtier.GetFaith.HouseOfWorship]，在[courtier.GetHerselfHimself]身上基于[courtier.GetCulture.GetName][courtier.GetFaith.GetAdherentNamePlural]的习俗纹了一个[courtier.GetFaith.ReligiousSymbol]图案。\n\n当我今天请[courtier.GetFirstNameNoTooltip]展示纹身时，[courtier.GetSheHe]一边笑着向我展示，一边这样说道，“希望这能保佑我远离疾病和厄运！”"
 nubia.0290.a:0 "我确信它会保护你免受伤害。"
 nubia.0291.t:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]泥筒"
 nubia.0291.desc:0 "今天，我正在观察一些仆人为我的住所建造新的#italic 戈西谷物筒仓#!。\n\n我自然了解这种可靠卓越的储粮方法，毕竟我们[ROOT.Char.GetCulture.GetCollectiveNoun]人已使用此法多时。\n\n看到这些巨大的泥仓提前建成，真是令人欣慰。我毫不怀疑这些新筒仓将能很好地为家族服务。"
 nubia.0291.a:0 "这种东西确保了我们的食物安全！"
 nubia.0292.t:0 "拉斐尔之荣耀"
 nubia.0292.desc:0 "近来，[courtier.GetTitledFirstName]四处宣称[courtier.GetHerHis]的健康状况显著改善，不仅身无大病，还感到前所未有的精力充沛。\n\n秘诀何在？[courtier.GetSheHe]声称是向[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]祈祷的效果。\n\n在[courtier.GetCulture.GetName][courtier.GetFaith.GetAdherentNamePlural]中，这类轶事并不罕见，这位大天使的治愈之力在我们中享有盛誉。\n\n“向拉斐尔祈祷吧，”[courtier.GetFirstNameNoTooltip]劝说我，“只要虔诚祷告，你定能感受到生命的蜕变！”"
 nubia.0292.a:0 "说的有道理！我也要多向拉斐尔祈祷了！"
 nubia.0293.t:0 "与婴共室？"
 nubia.0293.desc:0 "我的[ROOT.Char.Custom('OppositeGenderedLowlyServantType')]不到一年前刚生下的孩子不幸夭折了。\n\n按照我们[ROOT.Char.GetCulture.GetCollectiveNoun]人的习俗，这位悲痛的仆人谦卑地请求我允许[ROOT.Char.Custom('GetHerHimOpposite')]将婴儿安葬在其房间地板下的一个大罐子里，因为这样做可以能增加[ROOT.Char.Custom('GetHerHisOpposite')]未来怀上孩子概率。\n\n[ROOT.Char.Custom('GetHerHisOpposite')]请求时严肃地告诉我的那样，“我已经接受了孩子的死亡，但作为父母，我实在不忍心让这可怜的孩子独自躺在冰冷的墓园里。”\n\n最终这由我决定，毕竟[ROOT.Char.Custom('OppositeGenderedLowlyServantType')]在我的宫廷里，但有些人可能会对这种古老习俗感到不适。"
 nubia.0293.a:0 "节哀，当然可以安葬在那里。"
 nubia.0294.t:0 "洛神花茶"
 nubia.0294.desc:0 "我路过厨房时，看见几个仆人正在准备[ROOT.Char.GetCulture.GetName]风味的[Glossary( '洛神花茶', 'KARKADE_GLOSS' )]，最近我也特别爱喝。他们正在将干燥的洛神花瓣浸泡在水中，稍后会将其煮沸，待冷却后再加入一些薄荷叶。"
 nubia.0294.a:0 "过去看看如何制作#italic 洛神花茶#!"
