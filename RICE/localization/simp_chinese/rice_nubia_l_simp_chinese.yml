 RICE_nubia_lake_oracle_decision_confirm:0 "准备派人去山间湖泊！"
 RICE_nubia_lake_oracle_decision_context_tooltip:0 "#emphasis 历史背景：#!在达尔富尔的一些民族中，高山上的湖泊被视为拥有灵力。当地人对这些湖泊怀有敬畏，拒绝触碰湖水，统治者则会派代表前往这些湖泊进行占卜。即使在达尔富尔已基本伊斯兰化的现代，人们仍然坚信这些地方居住着强大的诸灵。"
