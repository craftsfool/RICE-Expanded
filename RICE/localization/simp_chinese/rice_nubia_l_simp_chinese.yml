 nubia.0060.t:0 "尼罗河上的惨案"
 nubia.0060.desc:0 "年轻时，我曾前往[abbasid.GetHouse.GetName]宫廷重新谈判[RICE_baqt|E]——这是我已故的父亲[father.GetTitledFirstName]引以为豪的事情。\n\n现在我年纪大了，也懂得更多，再也不是更愣头青，我希望世界不要那么充满冒险，而残忍的[umari.GetFaith.GetReligion.GetAdjective][umari.GetFullName]多年来一直是努比亚和埃及的眼中钉。我派能干的侄子[niuty.GetFirstName]带兵去杀这个军阀——结果[niuty.GetSheHe]却与[umari.GetFirstNameNoTooltip]达成了“休战”协议？！[niuty.GetFirstNameNoTooltip]说[niuty.GetSheHe]没有背叛，还为我们赢得了和平，但很明显，[niuty.GetSheHe]是在争取时间准备推翻我。\n\n显然[niuty.GetFirstNameNoTooltip]正在与[umari.GetFirstNameNoTooltip]密谋来削弱我的权力，虽然他们可能会像贪婪的狗一样互相撕咬，但我最好立即处理[niuty.GetFirstNamePossessiveNoTooltip]的叛乱。"
 nubia.0060.a:0 "派兵逮捕叛徒[niuty.GetFirstNameNoTooltip]！"
 nubia.0060.a.umari:0 "探子报告称[umari.GetFirstNameNoTooltip]目前将保持中立。或许他打算日后支持[niuty.GetFirstNamePossessiveNoTooltip]叛乱，但未来我们或许有机会用合适的价格拉拢像[umari.GetHerHim]这样毫无荣誉感的亡命之徒加入我方阵营。"
 nubia.0060.b:0 "我暂时接受与[umari.GetFirstNameNoTooltip]的“休战”协议……"
 nubia.0061.t:0 "$nubia.0060.t$"
 nubia.0061.desc:0 "我的叔叔[georgios.GetFirstName]自称[georgios.GetTitleAsNameNoTooltip]，但[georgios.GetSheHe]已是个老眼昏花的[georgios.GetWomanMan]，而我们的王国四面遭受侵袭劫掠。\n\n[georgios.GetFirstNameNoTooltip]派我率军去对付其中的[umari.GetFullName]，这个匪首一直是埃及和努比亚的眼中钉。然而我顿悟到一个真相：若想在这个时代保住王国，必须由一位有抱负、果敢决断的领袖统领，显然非我莫属。\n\n于是我暂时与[umari.GetFirstNameNoTooltip]达成停战协议，并反抗我的叔叔。有人说我鲁莽，但等我胜利重整王国之时，他们自会改口。我只希望在我推翻叔叔期间，[umari.GetFirstNameNoTooltip]能遵守停战约定；毕竟像[umari.GetHerHim]这样的毒蛇，就算能信任也维持不了多久。"
 nubia.0061.a:0 "唯有果敢才能成为[georgios.GetTitleAsNameNoTooltip]！"
 nubia.0062.t:0 "战胜强盗？"
 nubia.0062.desc:0 "我与我那愚蠢的叔叔[georgios.GetFirstName]的战争拖得越久就越发困难。\n\n更糟糕的是[umari.GetTitledFirstName]至今仍置身事外。甚至只要价格合适，[umari.GetFirstNameNoTooltip]可能愿意撕毁我们的停战协议，站到我叔叔那边。\n\n或许我可以给[umari.GetFirstNameNoTooltip]提供黄金，让他直接提供军事支持。但我必须迅速行动，以免我叔叔向[umari.GetFirstNameNoTooltip]示好，导致[umari.GetFirstNameNoTooltip]的倒戈。"
 nubia.0062.a:0 "为什么要给一个两面三刀的强盗送钱？"
 nubia.0063.t:0 "$nubia.0062.t$"
 nubia.0063.desc:0 "我与我那叛逆的侄子[niuty.GetFirstName]的战争拖得越久就越发危险。\n\n值得庆幸的是[umari.GetTitledFirstName]至今仍在袖手旁观，但有迹象表明，只要价码合适，[umari.GetFirstNameNoTooltip]或许愿意打破与[niuty.GetFirstNameNoTooltip]的停战约定。\n\n或许我可以出钱收买[umari.GetFirstNameNoTooltip]，让这个见风使舵的毒蛇去攻打[niuty.GetFirstNameNoTooltip]。但我必须尽快行动，因为[niuty.GetFirstNameNoTooltip]很可能也会向[umari.GetFirstNameNoTooltip]示好，怂恿[umari.GetHerHim]再次直接进攻我。"
 nubia.0063.a:0 "$nubia.0062.a$"
 nubia.0064.t:0 "诱人的抉择"
 nubia.0064.desc:0 "不久前，我的死敌[georgios.GetFirstName]派[georgios.GetHerHis]侄子[niuty.GetFirstName]率军攻打我。不料这个野心勃勃的家伙竟转头和我停战，还背叛[niuty.GetHerHis]的叔叔，企图推翻[georgios.GetHerHim]。\n\n到目前为止，我一直坐山观虎斗，挑拨双方的矛盾。不过介入这场战争或许对我有利，这样可以进一步摧毁努比亚，它将成为日后掠袭与剥削的绝佳目标。"
 nubia.0064.a:0 "我将站在[georgios.GetFirstNameNoTooltip]一方。"
 nubia.0065.t:0 "已选立场"
 nubia.0065.desc:0 "从[umari.GetFullName]那里传来了消息！看起来[umari.GetSheHe]已经决定在这场战争中站队了，"
 nubia.0065.a:0 "战争仍在继续……而我#italic 必将#!获胜！"
 nubia.0066.t:0 "$nubia.0065.t$"
 nubia.0066.desc:0 "$nubia.0065.desc$"
 nubia.0066.a:0 "$nubia.0065.a$"
 nubia.0067.t:0 "$nubia.0065.t$"
 nubia.0067.desc:0 "从[umari.GetFullName]那里传来了消息！看起来[umari.GetSheHe]已经决定在这场战争中站队了，"
 nubia.0067.a:0 "$nubia.0065.a$"
 nubia.0068.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0068.desc:0 "我一生漫长，先为王子，后为国王，这些年，我经历了诸多挑战，如今终结我那叛逆的侄子[niuty.GetFirstName]和匪首[umari.GetFirstName]的威胁，不过是我所克服的诸多挑战中的一小部分。\n\n但克服这些挑战的不仅是我个人——更是整个马库里亚王国。我知道这些战争给这片土地和人民带来了创伤。\n\n如今王国重归稳定，是时候让我专注于重建这片土地，为人民带来繁荣了。不过或许我自己也该找个时间好好休息一下了，毕竟我已经不再年轻了。"
 nubia.0068.a:0 "马库利亚迎来了新的和平。"
 nubia.0069.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0069.desc:0 "我的叔叔[georgios.GetFirstName]活了很长的岁月，但[georgios.GetSheHe]已经变成了一个无用的老[georgios.GetWomanMan]，既没有精力也没有性格来应对我们马库里亚王国当前面临的挑战，尤其是匪首[umari.GetFullName]的威胁。\n\n如今只有我具备看清局势所需的狡黠与抱负，因此夺取马库里亚王位是必要的，而我成功击败了叔叔并瓦解了[umari.GetFirstName]的势力。\n\n如今王国重归稳定，是时候让我专注于重建这片土地、为子民带来繁荣了。我毫不怀疑自己将会成为比叔叔更伟大的统治者。"
 nubia.0069.a:0 "$nubia.0068.a$"
