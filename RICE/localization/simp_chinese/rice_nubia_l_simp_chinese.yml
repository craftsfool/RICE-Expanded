 nubia.0080.t:0 "[courtier.GetCulture.GetNameNoTooltip]流浪者"
 nubia.0080.desc:0 "[GetGeographicalRegion('RICE_nubia_and_ethiopia').GetName]以外的土地是那些我们多年来与之打过交道的部落的家园，无论是和平相处还是战争。\n\n有时，他们的人会来到我们的土地上，为我这样的[ROOT.Char.GetTitleAsNameNoTooltip]提供服务，或是与他们达成某种协议。\n\n今天，一位名叫[courtier.GetFirstName]的人来到了我的宫廷，他来自遥远的[courtier.GetCulture.GetCollectiveNoun]部落，希望与我们的[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]建立更紧密的联系。[courtier.GetSheHe|U]强调了[GetPlayer.Custom('RICE_nilotic_type_loc')]所具备的技能。"
 nubia.0080.a:0 "让我们在人民之间建立联系！"
 nubia.0080.b:0 "你愿意留下来促进这些联系吗？"
 nubia.0080.c:0 "我们对与你们这种人打交道没有兴趣。"
