 nubia.0210.d:0 "[intrigue_i|E]为社区所有人提供健康"
 nubia.0210.d.tooltip:0 "获得#P 正面#![character_modifier|E]的概率取决于你的[intrigue_i|E][intrigue|E]、[piety_level|E]、[prestige_level|E]和[legitimacy_level|E]"
