 RICE_nubia_lake_oracle_decision_desc:0 "我们自古就对高山上的湖泊带有敬畏，因为它们拥有灵性，可以预知未来。我应当派遣一位使者前往其中一处湖泊，探询我的未来命运。"
 nubia.0002.desc.conclusion:0 "\n\n这些趋势的长期影响仍有待观察。[RICE_baqt_treaty|E]已存续至今，而且肯定还会继续存在下去。"
 nubia.0014.desc.sudanese_arabic:0 "[GetGeographicalRegion('RICE_greater_nubia_region').GetNameNoTooltip]如今正见证这一趋势的顶峰。大量$heritage_arabic_name$部落现已定居于此，并在[sudanese_ruler.GetTitledFirstName]的领导下，甚至发展出了全新的独特身份——[culture.GetCollectiveNoun]。\n\n这些[culture.GetLanguage.GetName]使用者在第一瀑布以南的存在，正在改变该地区的政治、经济和文化格局——究竟会带来更好还是更坏的影响，唯有时间能给出答案。"
 nubia.0014.desc.sudanese_nubian:0 "[GetGeographicalRegion('ghw_region_egypt').GetName]如今正见证这一趋势的顶峰。大量$heritage_east_african_name$部落现已定居于此，并在[sudanese_ruler.GetTitledFirstName]的领导下，甚至发展出了全新的独特身份——[culture.GetCollectiveNoun]。\n\n这些[culture.GetLanguage.GetName]语使用者出现在第一瀑布以北，已在改变该地区的政治、经济和文化格局——至于这种改变是好是坏，唯有时间能给出答案。"
 nubia.0021.desc.self:0 "我的个人形象，这样可以更好地展示我对[ROOT.Char.GetFaith.HighGodName]的热忱，并激励所有看到这幅肖像的人。"
 nubia.0021.desc.clergy:0 "我与宫廷司祭。我希望他人在观赏这幅作品时能明白——宗教虔诚不限于某个人，我是那种会向智者寻求指引的[ROOT.Char.GetTitleAsNameNoTooltip]。"
 nubia.0021.desc.family:0 "我与家人们。愿所有目睹这件艺术品的人都能欣赏到，我的家族中充满了虔诚之人。[ROOT.Char.GetHouse.GetName]家族应永远与对[ROOT.Char.GetFaith.HighGodName]的深切虔诚联系在一起。"
 nubia.0022.desc.not_updater:0 "[updater.GetTitledFirstName]捐资不仅将名录修缮至往日风采，更增补了新近资料与诸位主教的艺术画像。[updater.GetHerHis|U]此举充分彰显了[updater.GetHerHis]的虔诚信仰，以及这座大教堂的重要意义。"
 nubia.0022.desc.updater:0 "我捐资不仅将名录修复至往日风采，更增补了新近资料与多位主教的艺术画像。想到通过自己的贡献，我也能成为这座大教堂悠久历史的一部分，实在倍感欣慰。"
 nubia.0024.desc.courtier:0 "与此同时，[courtier.GetTitledFirstName]主动请缨代我前往，热切希望在此事上助我一臂之力。考虑到[courtier.GetSheHe]比区区仆从更为尊贵，或许更为妥当。"
 nubia.0024.desc.clergy:0 "[clergy.GetTitledFirstName]也主动要求前往[lake_oracle_province.GetNameNoTooltip]，相信[clergy.GetHerHis]的宗教经历会对此行有所助益。"
 nubia.0024.b:0 "派遣[courtier.GetFirstNameNoTooltip]"
 nubia.0024.b.tooltip:0 "[courtier.GetFirstNameNoTooltip]将[travel|E]前往[lake_oracle_province.GetName]，小幅提升获得#P 正面#![modifier|E]而非#N 负面#![modifier|E]的概率"
 nubia.0024.c:0 "派遣[clergy.GetFirstNameNoTooltip]"
 nubia.0024.c.tooltip:0 "[clergy.GetFirstNameNoTooltip]将[travel|E]前往[lake_oracle_province.GetName]，大幅提升获得#P 正面#![modifier|E]而非#N 负面#![modifier|E]的概率"
 nubia.0062.a.tooltip:0 "这不会影响[umari.GetFirstName]在[war|E]中加入你的概率。"
 nubia.0062.b:0 "给[umari.GetFirstNameNoTooltip]送些钱财来赢得[umari.GetHerHim]的好感"
 nubia.0062.b.tooltip:0 "这在一定程度上增加了[umari.GetFirstName]加入你的[war|E]的概率。"
 nubia.0062.c:0 "给[umari.GetFirstNameNoTooltip]送#italic 大笔#!钱财来赢得[umari.GetHerHim]的好感"
 nubia.0062.c.tooltip:0 "这大幅增加了[umari.GetFirstName]加入你的[war|E]的概率。"
