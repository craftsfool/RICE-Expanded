 RICE_nubia_nilotic_herders:0 "与尼罗特牧民的联系"
 RICE_nubia_marianos_focused_on_other_work:0 "重点行政调整"
 RICE_nubia_marianos_focused_on_other_work_desc:0 "该角色不会如某些人所想的那样逃避责任，而是更倾向于调整工作重心，将精力集中于关键任务，以此提升工作效率。"
 RICE_nubia_rasad_modifier:0 "非洲王母"
 RICE_nubia_rasad_modifier_desc:0 "拉莎蒂最初是法蒂玛哈里发阿里·扎希尔的奴隶侍妾，作为丈夫最宠爱的妃子，以及在他去世后成为太后，她凭借自己的手腕和人脉，成为该地区一位举足轻重的政治人物。"
 RICE_banganarti_health_dream:0 "班加纳提蕴梦（健康）"
 RICE_banganarti_health_dream_desc:0 "在前往班加纳提朝圣的途中，该角色途中梦见[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]，祂治愈了其身上疾病。"
 RICE_banganarti_prophetic_dream:0 "班加纳提蕴梦（预言）"
 RICE_banganarti_prophetic_dream_desc:0 "在前往班加纳提朝圣的途中，该角色途中梦见[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]，祂预言了其未来将发生之事。"
 RICE_banganarti_inspiring_dream:0 "班加纳提蕴梦（灵感）"
 RICE_banganarti_inspiring_dream_desc:0 "在前往班加纳提朝圣的途中，该角色途中梦见[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]，祂给予了灵感。"
 RICE_banganarti_advice_dream:0 "班加纳提蕴梦（启迪）"
 RICE_banganarti_advice_dream_desc:0 "在前往班加纳提朝圣的途中，该角色途中梦见[Glossary( '大天使拉斐尔', 'ARCHANGEL_RAPHAEL_GLOSS' )]，祂就生活中的各种重要事务给予了明智的建议。"
 RICE_nubia_crusader_states_connection:0 "来自圣地的努比亚人"
 RICE_nubia_crusader_states_connection_desc:0 "尽管该角色出身努比亚，但在一定程度上融入了十字军国家的上层圈子。他们与地中海及欧洲的基督徒以及努比亚人之间的联系，在各方面都为其带来了诸多作用。"
