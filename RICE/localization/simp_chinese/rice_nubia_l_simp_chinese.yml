 innovation_RICE_gossi_grain_silos:1 "戈西谷物筒仓"
 innovation_RICE_gossi_grain_silos_desc:1 "戈西谷物筒仓是一种起源于尼罗河谷南部地区的泥筑粮仓，用于储存谷物。这种粮仓能有效储存作物而不改变其物理和化学特性，并能防止虫害侵袭。"
 innovation_RICE_tetracycline:1 "四环霉素"
 innovation_RICE_tetracycline_desc:1 "尽管对其抗菌特性知之甚少，但几个世纪以来，尼罗河地区的许多社群发现，某些用于酿造啤酒或制作面包的发酵谷物能够改善健康状况并预防疾病。"
 innovation_RICE_state_sanctioned_treasure_hunting:1 "国家特许寻宝"
 innovation_RICE_state_sanctioned_treasure_hunting_desc:1 "尼罗河流域的古老文明孕育了许多湮没于黄沙之下的古迹，其中蕴藏着珍宝与失落的智慧。明智的统治者应当资助并规范寻宝行业，使社会能从这些古物中获得最大效益。"
