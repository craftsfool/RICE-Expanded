 nubia.0210.b:0 "[martial_i|E]保护我们自己的力量"
 nubia.0210.b.tooltip:0 "获得#P 正面#![character_modifier|E]的概率取决于你的[martial_i|E][martial|E]、[piety_level|E]、[prestige_level|E]和[legitimacy_level|E]"
