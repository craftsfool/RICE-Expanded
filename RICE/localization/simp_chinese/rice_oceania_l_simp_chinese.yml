 oceania.0030.t:0 "[courtier.GetCulture.GetNameNoTooltip]旅者"
 oceania.0030.desc:0 "一个声称自大洋彼岸长途跋涉而来的陌生人抵达了[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]，在当地引起了不小的轰动。\n\n我接见了这位引起轰动的奇人，其名叫作[courtier.GetFirstName]，自称是[courtier.GetCulture.GetName]人。据说，[courtier.GetHerHis]族人掌握着代代相传的非凡智慧，或许能对我们大有裨益……"
 oceania.0030.a:0 "请教给我你的知识！"
 oceania.0030.b:0 "你愿意为我效力吗？"
 oceania.0030.c:0 "故事很有趣，但我并不感兴趣。"
