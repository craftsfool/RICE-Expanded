 RICE_oceania_turtle_meat_and_shells:0 "海龟肉与龟甲"
 RICE_oceania_sago_pearls:0 "享用西米露"
 RICE_oceania_sago_pearls_desc:0 "该角色最近喜欢上了以[Glossary( '西米露', 'SAGO_GLOSS' )]为主要食材的菜肴。"
 RICE_oceania_sago_offerings:0 "祭品西米露"
 RICE_oceania_sago_offerings_desc:0 "四处都摆下了各种食物作为祭品，以[Glossary( '西米', 'SAGO_GLOSS' )]为主，期望寻求善神的帮助。"
 RICE_oceania_cockatoo_modifier:0 "流行的凤头鹦鹉"
 RICE_oceania_cockatoo_modifier_desc:0 "该地区出口的凤头鹦鹉在其他地区广受欢迎。"
 RICE_oceania_supports_cockatoo_trade:0 "支持凤头鹦鹉贸易"
 RICE_oceania_harvesting_more_megapode_eggs:0 "大规模冢雉蛋采集"
 RICE_oceania_harvesting_more_megapode_eggs_desc:0 "尽管有限制收集数量的传统，但这里[Glossary( '冢雉', 'MEGAPODE_GLOSS' )]蛋的收成增加了。"
 RICE_oceania_restrained_harvest_of_megapode_eggs:0 "有节制的冢雉蛋采集"
 RICE_oceania_restrained_harvest_of_megapode_eggs_desc:0 "尽管有人呼吁加大采集[Glossary( '冢雉', 'MEGAPODE_GLOSS' )]蛋的力度，不过领导者仍决定遵循传统习俗，严格限制可采集的蛋数。"
 RICE_oceania_birds_of_paradise_modifier:0 "暴利的极乐鸟出口"
 RICE_oceania_ancestor_bonus_naval:0 "祖先祝福"
 RICE_oceania_ancestor_bonus_naval_desc:0 "据说该角色被先祖赐予其力量，以便在战斗中对抗敌人。"
 RICE_oceania_ancestor_bonus_mystical:0 "$RICE_oceania_ancestor_bonus_naval$"
 RICE_oceania_ancestor_bonus_mystical_desc:0 "据说该角色被先祖赐予其庇佑，使其免遭敌人的阴谋诡计。"
 RICE_oceania_ancestor_bonus_prosperity:0 "$RICE_oceania_ancestor_bonus_naval$"
 RICE_oceania_ancestor_bonus_prosperity_desc:0 "人们相信是当地头人的祖先赐福这片土地，使其肥沃富饶。"
 RICE_oceania_courtier_modifier_island:0 "太平洋的纽带与知识"
 RICE_oceania_courtier_modifier_island_desc:0 "该角色与太平洋的一些民族有联系，并从中接触到"
 RICE_oceania_courtier_modifier_island_agriculture:0 "$RICE_oceania_courtier_modifier_island$农业知识"
 RICE_oceania_courtier_modifier_island_agriculture_desc:0 "$RICE_oceania_courtier_modifier_island_desc$太平洋岛屿上独特的耕作方法。"
 RICE_oceania_courtier_modifier_kava:0 "$RICE_oceania_courtier_modifier_island$卡瓦醉椒汁仪式"
 RICE_oceania_courtier_modifier_kava_desc:0 "$RICE_oceania_courtier_modifier_island_desc$饮用卡瓦醉椒汁的仪式和精神意义。\n\n#Emp 可以使用#V $RICE_stress_loss_drink_kava_decision$#![decision|E]，并有可能获得[GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )|U][trait|E]，且不受[heritage|E]限制#!"
 RICE_oceania_courtier_modifier_recruit_islanders:0 "$RICE_oceania_courtier_modifier_island$岛屿战术"
 RICE_oceania_courtier_modifier_recruit_islanders_desc:0 "$RICE_oceania_courtier_modifier_island_desc$太平洋岛屿上使用的战术。\n\n#Emp 可无视[heritage|E]招募[GetMaA('RICE_pacific_warriors').GetName][men_at_arms|E]#!"
 RICE_oceania_courtier_modifier_ancient_stories:0 "$RICE_oceania_courtier_modifier_island$古老传说"
 RICE_oceania_courtier_modifier_ancient_stories_desc:0 "$RICE_oceania_courtier_modifier_island_desc$太平洋上的传奇和传说，使其更加珍视生命与自然。"
 RICE_oceania_courtier_modifier_social_organization:0 "$RICE_oceania_courtier_modifier_island$社会组织"
 RICE_oceania_courtier_modifier_social_organization_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方的社区如何运作，以及不同群体的人们如何相互交流。\n\n\n\n#Emp 使用#V $RICE_oceania_meeting_houses_decision$#![decision|E]时，如果满足其他条件，则获得额外的[legitimacy_i|E][legitimacy|E]。#!"
 RICE_oceania_courtier_modifier_political_leadership:0 "$RICE_oceania_courtier_modifier_island$领导技巧"
 RICE_oceania_courtier_modifier_political_leadership_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方的社群在政治上如何组织，以及他们认为怎样的领导才是贤明的。"
 RICE_oceania_courtier_modifier_spiritual_restrictions:0 "$RICE_oceania_courtier_modifier_island$禁忌行为"
 RICE_oceania_courtier_modifier_spiritual_restrictions_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方文化和宗教禁忌以及其他种类的禁令和行为规则。"
 RICE_oceania_courtier_modifier_consequential_feasts:0 "$RICE_oceania_courtier_modifier_island$带目的的盛宴"
 RICE_oceania_courtier_modifier_consequential_feasts_desc:0 "$RICE_oceania_courtier_modifier_island_desc$其领袖在盛宴进行祭祀、宗教与政治之目的。"
 RICE_oceania_courtier_modifier_dance_ceremonies:0 "$RICE_oceania_courtier_modifier_island$舞蹈仪式"
 RICE_oceania_courtier_modifier_dance_ceremonies_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方的舞蹈传统，尤其是那些具有仪式意义的舞蹈。"
 RICE_oceania_courtier_modifier_oceanic_cuisine:0 "$RICE_oceania_courtier_modifier_island$大洋洲美食"
 RICE_oceania_courtier_modifier_oceanic_cuisine_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方的菜肴，包括其烹饪方法和常用食材。"
 RICE_oceania_courtier_modifier_herbal_medicine:0 "$RICE_oceania_courtier_modifier_island$草药知识"
 RICE_oceania_courtier_modifier_herbal_medicine_desc:0 "$RICE_oceania_courtier_modifier_island_desc$太平洋岛屿上独特的医药知识。"
 RICE_oceania_courtier_modifier_oceanic_stargazing:0 "$RICE_oceania_courtier_modifier_island$海洋星相学"
 RICE_oceania_courtier_modifier_oceanic_stargazing_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方那堪称一流的天文学知识，为在太平洋的陆地与海域间航行提供了极大便利。"
 RICE_oceania_courtier_modifier_artwork:0 "$RICE_oceania_courtier_modifier_island$艺术品"
 RICE_oceania_courtier_modifier_artwork_desc:0 "$RICE_oceania_courtier_modifier_island_desc$对方历来所擅长的各类工艺与艺术。"
 RICE_oceania_quarry_stone_money:0 "获取石币"
 RICE_oceania_quarry_stone_money_tooltip:0 "[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]是彰显个人价值和社会地位的象征。"
 RICE_oceania_quarry_stone_money_desc:0 "我们社会中所使用的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]都是通过海上探险，从特定的岛屿或陆地开采而来。航路越是凶险，带回的石币就越是价值连城。"
 RICE_oceania_quarry_stone_money_effect_tooltip_1:1 "你的成功概率为#V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_success_chance')|0]%#!，这取决于你的[traits|E]与[skills|E]，尤其是[diplomacy_i|E][diplomacy|E]与[stewardship_i|E][stewardship|E]。"
 RICE_oceania_quarry_stone_money_effect_tooltip_2:1 "你的船员可能会在冒险中#N 丧生#!，这取决于你的[traits|E]与[skills|E]，尤其是[martial_i|E][martial|E]与[learning_i|E] [learning|E]。"
 RICE_oceania_quarry_stone_money_effect_tooltip_3:1 "冒险启航前，你可以投入额外的[gold_i|E][gold|E]以筹备物资，提升冒险成功率及船员的生还概率。"
 RICE_oceania_quarry_stone_money_effect_tooltip_4:1 "如果航行成功，你将获得随机数量的[prestige_i|E|E][prestige|E]（最多 #V [prestige_i|E][GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_max_prestige_gain_value')|0]#!）、[gold_i|E][gold|E]（最多 #V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_max_gold_gain_display_value')|0]#!），以及[GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U][trait|E]特质的[trait_level_track_xp|E]经验值（最多 #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_large_trait_xp_gain_value')|0]#!）。"
 RICE_oceania_quarry_stone_money_effect_tooltip_5:1 "死亡船员数量会影响你从[GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U][trait|E]中获得的[gold_i|E][gold|E]、[prestige_i|E][prestige|E]和[trait_level_track_xp|E]数值，以#N 消耗#![piety_i|E][piety|E]"
 RICE_oceania_quarry_stone_money_confirm:0 "有些人可能会死，但这是必要的牺牲。"
 RICE_oceania_quarry_stone_money_context_tooltip:0 "#emphasis 历史背景：#!$YAP_STONE_MONEY_GLOSS$"
 RICE_stress_loss_chew_betel_nuts_decision:0 "咀嚼槟榔"
 RICE_stress_loss_chew_betel_nuts_decision_tooltip:1 "咀嚼槟榔是宣泄[stress_loss_i|E][stress|E]的一种方式……"
 RICE_stress_loss_chew_betel_nuts_decision_desc:0 "我只需嚼上几口槟榔，便能感到神清气爽、飘飘欲仙，浑身散发着融融暖意。不过，往地上吐残渣时得看好地方。"
 RICE_stress_loss_chew_betel_nuts_decision_effect_tooltip_1:1 "你有较小概率获得[GetTrait('betel_chewer').GetName( GetNullCharacter )|U][trait|E]。每使用一次[decision|E]，此概率都会叠加。"
 RICE_stress_loss_chew_betel_nuts_decision_confirm:0 "该嚼槟榔了！"
 RICE_stress_loss_chew_betel_nuts_decision_context_tooltip:0 "#emphasis 历史背景：#!嚼槟榔有刺激和麻醉作用，在亚洲和太平洋大部分地区广泛流行几千年。它以成瘾性和危险的健康影响著称，会导致牙齿上的红色污渍（在流行地区常被认为不卫生）到各种癌症。"
 RICE_stress_loss_drink_kava_decision:0 "饮用卡瓦醉椒汁"
 RICE_stress_loss_drink_kava_decision_tooltip:1 "饮用卡瓦醉椒汁是消除[stress_loss_i|E][stress|E]和与他人社交的好方法。"
 RICE_stress_loss_drink_kava_decision_desc:0 "卡瓦醉椒汁是一种好喝又提神的饮品，很多人都对它敬重有加。我们[ROOT.Char.GetCulture.GetCollectiveNoun]世世代代都在饮用它。"
 RICE_stress_loss_drink_kava_decision_effect_tooltip_1:1 "你有较小的概率获得[GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )|U][trait|E]。每次执行[decision|E]时，获得概率都会增加。"
 RICE_stress_loss_drink_kava_decision_confirm:0 "让我们聚在一起享用一些卡瓦醉椒汁吧！"
 RICE_stress_loss_drink_kava_decision_context_tooltip:0 "#emphasis 历史背景：#!卡瓦醉椒汁是大洋洲许多地区（特别是波利尼西亚、密克罗尼西亚和美拉尼西亚）的一种传统致幻饮料，对这些民族中的许多人而言，它具有重要的社会、政治和宗教作用，不过其具体功能因族群而异。"
 RICE_oceania_recruit_biak_adventurers:0 "与比亚克冒险者建立联系"
 RICE_oceania_recruit_biak_adventurers_tooltip:0 "与[RICE_biak|E]冒险者合作互利"
 RICE_oceania_recruit_biak_adventurers_desc:0 "爱好冒险的[RICE_biaks|E]有时会航行到[GetGeographicalRegion('RICE_eastern_southeast_asia_region').GetName]的海岸和岛屿寻找冒险。支持他们的事业并与之合作，可能对双方都有利。"
 RICE_oceania_recruit_biak_adventurers_desc_biak:0 "我们这些纵横四海的[RICE_biaks|E]向来居无定所，为了冒险不惜深入远洋。寻找志同道合的[RICE_biak|E]伙伴并肩作战，对双方都有利。"
 RICE_oceania_recruit_biak_adventurers_effect_warriors_tooltip_1:1 "获得[GetModifier('RICE_oceania_ties_with_biak_warriors').GetNameWithTooltip][modifier|E]以及一部分[soldier_i][special_troops|E]（具体取决于你愿意额外向他们提供多少[gold_i|E][gold|E]）。"
 RICE_oceania_recruit_biak_adventurers_effect_warriors_tooltip_2:1 "只要该[modifiers|E]处于激活状态，你就可能触发随机事件，从而获得比如[gold_i|E][gold|E]、[soldier_i][special_troops|E]、[control_i|E][control|E]和[courtiers|E]等丰厚奖励！"
 RICE_oceania_recruit_biak_adventurers_effect_traders_tooltip_1:1 "获得[GetModifier('RICE_oceania_ties_with_biak_traders').GetNameWithTooltip][modifier|E]以及[legitimacy_i|E][legitimacy|E]、[barter_goods_i][barter_goods|E]、[provisions_i|E][provisions|E]或[prestige_i|E][prestige|E]（取决于你的[government|E]以及你愿意额外支付多少[gold_i|E][gold|E]）"
 RICE_oceania_recruit_biak_adventurers_effect_traders_tooltip_2:1 "只要[modifiers|E]处于生效状态，你可能会获得随机事件以及不同的奖励，例如[gold_i|E] [gold|E]、[prestige_i|E] [prestige|E]、[development_i|E] [development|E]、[courtiers|E]等等。"
 RICE_oceania_recruit_biak_adventurers_effect_general_tooltip_1:1 "[RICE_biaks|E]可能会索要额外的[gold|E]甚至[titles|E]，一旦交涉破裂，他们必将产生极度负面的敌对反应！"
 RICE_oceania_recruit_biak_adventurers_confirm:0 "联系这些冒险家！"
 RICE_oceania_recruit_biak_adventurers_context_tooltip:0 "#emphasis 历史背景：#!比亚克人来自巴布亚西北群岛。在近代早期乃至荷兰殖民时期，他们在东印度尼西亚的历史中扮演了重要角色，这些比亚克人是出色的航海家，他们崇尚那些能够出海冒险的人，无论是和平贸易、与马鲁古苏丹国保持外交关系，还是进行掠夺、从他人那里学习新思想、殖民遥远的岛屿都会受到敬佩，而在中世纪时期甚至更早，他们很可能也从事过类似的活动。"
 RICE_oceania_recruit_biak_adventurers_type:0 "选择招募哪种[RICE_biak|E]冒险者"
 RICE_oceania_recruit_biak_adventurers_type_gui:0 "$RICE_oceania_recruit_biak_adventurers_type$"
 RICE_oceania_recruit_biak_adventurers_warriors_option:0 "#Bold 战士#!"
 RICE_oceania_recruit_biak_adventurers_warriors_option_desc:0 "邀请军事冒险家"
 RICE_oceania_recruit_biak_adventurers_warriors_option_tooltip:0 "#italic 几个世纪以来，[RICE_biak|E]战士们驾驶着轻捷的[Glossary( '战船', 'WAIRON_GLOSS' )]，作为海盗、猎头者和骁勇的斗士令敌人闻风丧胆。然而，为了财富或名誉，其中一些人也乐于接受雇佣，效忠于他人。#!"
 RICE_oceania_recruit_biak_adventurers_traders_option:0 "#Bold 商人#!"
 RICE_oceania_recruit_biak_adventurers_traders_option_desc:0 "邀请军事冒险家"
 RICE_oceania_recruit_biak_adventurers_traders_option_tooltip:0 "#italic 几个世纪以来，[RICE_biak|E]商人们驾驶着庞大的[Glossary( '商船', 'WAIMANSUSU_GLOSS' )]，在海洋上运送着大量货物。在此过程中，他们编织起庞大的政商网络，甚至在遥远的土地上建立殖民地。#!"
 RICE_welcome_visitors_from_oceania:0 "迎接来自大洋洲的访客"
 RICE_welcome_visitors_from_oceania_tooltip:1 "在浩瀚大洋彼岸，我们可能会遇见谁？"
 RICE_welcome_visitors_from_oceania_desc:0 "东边无垠的大洋彼端，散落着无数群岛与陆地。虽然路途遥远，但那里确实存在着繁衍不息的文明。他们的智慧与见识，能否为我们所用？"
 RICE_welcome_visitors_from_oceania_effect_tooltip_1:1 "在该[modifier|E]激活期间，吸引[RICE_oceanic|E][courtiers|E]前来投奔的概率将会显著增加。"
 RICE_welcome_visitors_from_oceania_effect_tooltip_2:1 "有较小概率触发一个吸引[RICE_oceania|E][courtier|E]前来的特殊事件。"
 RICE_welcome_visitors_from_oceania_confirm:0 "让我们试着接触他们！"
 RICE_welcome_visitors_from_oceania_context_tooltip:0 "#emphasis 历史背景：#!有一些证据表明，在殖民时期之前，大洋洲各民族与旧世界其他地区之间存在有限的联系，例如有证据显示雅浦岛或比亚克岛等岛屿与巴布亚内陆以及印度尼西亚其他地区之间存在零星的贸易。甚至越来越有希望的证据表明，澳大利亚北部的一些原住民与印度尼西亚人之间偶尔会有接触，不够这种接触的程度在学术界尚有争议。"
 RICE_oceania_meeting_houses_decision:0 "资助社区集会所"
 RICE_oceania_meeting_houses_decision_palauan:0 "资助社会结社"
 RICE_oceania_meeting_houses_decision_tooltip:1 "让我们巩固我们社会的基石"
 RICE_oceania_meeting_houses_decision_desc:0 "世代以来，[GetPlayer.GetCulture.GetCollectiveNoun]都在建造属于自己的社区集会所。集会所在仪式、社交、经济和政治上拥有极高的重要性，是维系我们人民生活的核心。扶持这些集会所及使用它们的人，将大大提高我作为[GetPlayer.GetTitleAsNameNoTooltip]的名望和权威。"
 RICE_oceania_meeting_houses_decision_palauan_desc:0 "世代以来，[GetPlayer.GetCulture.GetCollectiveNoun]通过[Glossary( '结社', 'CHELDEBECHEL_GLOSS' )]来维系社区秩序。扶持这些社团和他们的活动，将大大提高我作为[GetPlayer.GetTitleAsNameNoTooltip]的名望和权威。"
 RICE_oceania_meeting_houses_decision_effect_tooltip_1:1 "你将选择资助的力度，这会决定你获得多少[prestige_i|E] [prestige|E]和[legitimacy_i|E] [legitimacy|E]，以及你所获得[character_modifier|E]的持续时间。#weak （最低成本：@gold_icon!#V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_meeting_houses_cost_small')]#!）#!"
 RICE_oceania_meeting_houses_decision_effect_tooltip_2:1 "由于你拥有$tradition_RICE_palau_clubs_name$[tradition|E]，通过此[decision|E]你将获得相比正常情况下更多的[prestige_i|E][prestige|E]、[legitimacy_i|E][legitimacy|E]以及更长的[modifier|E]持续时间。你还需要决定支持男性还是女性的[Glossary( '社团', 'CHELDEBECHEL_GLOSS' )]。"
 RICE_oceania_meeting_houses_decision_effect_tooltip_3:1 "你的[culture_possessive|E][ethos|E]决定了你所获得[modifier|E]的效果。"
 RICE_oceania_meeting_houses_decision_confirm:0 "我们是一家人！"
 RICE_oceania_meeting_houses_decision_context_tooltip:0 "#emphasis 历史背景：#!在许多南岛语系文化中（从印度尼西亚到波利尼西亚），公共议事厅虽然在建筑风格和艺术表现上各有不同，但在生活中扮演着重要角色，是宗教、仪式、社会和政治活动与互动的中心。"
