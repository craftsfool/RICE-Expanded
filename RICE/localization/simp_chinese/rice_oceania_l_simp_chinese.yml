 RICE_oceania_ties_with_biak_warriors:0 "与比亚克战士的关系"
 RICE_oceania_ties_with_biak_warriors_desc:0 "该角色与来自巴布亚西北部群岛的比亚克部落建立了联系，特别是与那些乘坐迅捷的[Glossary('战船','WAIRON_GLOSS')]扬帆出海，令敌人心生畏惧的战士。"
 RICE_oceania_ties_with_biak_traders:0 "与比亚克商人的联系"
 RICE_oceania_ties_with_biak_traders_desc:0 "该角色与来自巴布亚西北部群岛的比亚克部落建立了联系，特别是与那些驾驶大型[Glossary( '船只', 'WAIMANSUSU_GLOSS' )]进行贸易和外交活动的商人们"
 RICE_oceania_settled_biak_warriors:0 "定居的比亚克战士"
 RICE_oceania_settled_biak_warriors_desc:0 "该地区居住着一支比亚克人的聚落，他们来自巴布亚西北部的一个群岛，由一群令人胆寒的战士所主导，他们乘着迅捷的[Glossary( '战船', 'WAIRON_GLOSS' )]出海，令敌人闻风丧胆。"
 RICE_oceania_settled_biak_traders:0 "定居的比亚克商人"
 RICE_oceania_settled_biak_traders_desc:0 "该地区居住着一支比亚克人的聚落，他们来自巴布亚西北部的一个群岛，由一群商人所主导，他们乘着大型[Glossary( '船只', 'WAIMANSUSU_GLOSS' )]进行贸易和外交活动。"
 RICE_oceania_biak_piracy_modifier:0 "比亚克海盗"
 RICE_oceania_biak_piracy_modifier_desc:0 "该地区近期遭受了来自巴布亚西北的比亚克海盗的袭击，这些海盗乘坐着快速的[Glossary( '战船', 'WAIRON_GLOSS' )]快速袭扰。"
