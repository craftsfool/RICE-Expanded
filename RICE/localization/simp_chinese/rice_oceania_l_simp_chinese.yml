 oceania.0040.t:0 "另一场萨西仪式"
 oceania.0040.desc:0 "[Glossary( '萨西', 'SASI_GLOSS' )]是我们的传统，作为[ROOT.Char.GetCulture.GetName]人，我们会定期指定一些资源在一段时间内不可收获，以保存这些资源供未来使用。当然，#italic 萨西#!会伴有相应的[ROOT.Char.GetFaith.GetReligion.GetAdjective]习俗。\n\n"
 oceania.0040.desc.land:0 "我们即将在[location.GetName]推行#italic 土萨西#!，我将出席仪式以颁布#italic 禁令#!。此后，一段时间内人们将被禁止进入并利用该处的资源。"
 oceania.0040.desc.water:0 "我们即将在[location.GetName]执行#italic 水萨西#!，我将出席仪式以颁布#italic 禁令#!。此后，一段时间内人们将被禁止进入并利用该处的资源。"
 oceania.0040.a:0 "让我们立刻启程！"
 oceania.0041.t:0 "抵达"
 oceania.0041.desc:0 "到达[location.GetName]的村庄后，那里将举行[Glossary( '萨西仪式', 'SASI_GLOSS' )]，当地人以以盛大的排场与满心的喜悦迎接我们。\n\n仪式将在未来几天内举行。不过，在此期间，或许我可以找点别的事情分散一下注意力……"
 oceania.0041.a:0 "虔诚地向[ROOT.Char.GetFaith.HighGodName]祈祷"
 oceania.0041.b:0 "与社区领袖商讨地方事务"
 oceania.0041.c:0 "放松身心，欣赏此地的美丽风景"
 oceania.0042.t:0 "萨西仪式落幕"
 oceania.0042.desc:0 "今日的仪式一结束，[Glossary( '萨西', 'SASI_GLOSS' )]将依据我和诸位地方首领所达成的条款予以关闭。我们祈求[ROOT.Char.GetFaith.PantheonTerm]保佑我们，并庇护我们所守护的资源。\n\n"
 oceania.0042.desc.land:0 "此时，我们齐聚在村子附近的[ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')]树下。在该#italic 萨西仪式#!禁捕区内发现的任何资源，包括动物、植物和矿物，都将受到神圣保护，任何人不得染指。"
 oceania.0042.desc.water:0 "此时，我们齐聚在村子附近的[ROOT.Char.Custom('IndefiniteBodyOfWater')]畔。从游鱼、珊瑚到其他水生动植物及矿物，任何人都不得采捕受到#italic 萨西仪式#!限制的自然资源。"
 oceania.0042.desc.conclusion:0 "\n\n仪式在伴随祈祷的欢歌热舞中圆满落幕，当地民众也对我的大力支持表达了由衷的谢意。"
 oceania.0042.a:0 "我们的自然资源将得以长期留存。"
 oceania.0043.t:0 "xxxxx"
 oceania.0043.desc:0 "xxxxx"
 oceania.0043.a:0 "xxxxx"
 oceania.0044.t:0 "xxxxx"
 oceania.0044.desc:0 "xxxxx"
 oceania.0044.a:0 "xxxxx"
 oceania.0045.t:0 "解禁萨西仪式"
 oceania.0045.desc:0 "此前，在地方领袖的倡导下，[sasi_open_county.GetNameNoTier]曾被实施了水域[Glossary( 'sasi', 'SASI_GLOSS' )]禁捕。在此期间，任何人都被严禁捕捞受到#italic 萨西仪式#!限制的水生资源直到今天。\n\n今天，我们举行了隆重的解禁#italic 萨西仪式#!。在漫长的封锁期内，那些未受惊扰的自然资源数量已经得到了大量补充。"
 oceania.0045.a:0 "耐心最终为人民带来了无尽的繁荣！"
 oceania.0046.t:0 "xxxxx"
 oceania.0046.desc:0 "xxxxx"
