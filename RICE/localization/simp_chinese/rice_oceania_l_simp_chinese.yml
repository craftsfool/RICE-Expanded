 oceania.0050.t:0 "石币"
 oceania.0050.desc:0 "拥有[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]是[yap_culture.GetCollectiveNoun]衡量[ROOT.Char.Custom('WomanManPossessive')]财富与价值的方式。但如何获得这种用特定石灰岩雕刻而成的石头呢？\n\n当然是从其他能找到这种石灰岩的岛屿上获取，尤其是#italic 帕劳岛#!。现在，我正要派遣一支远征队前往东方海域，为自己弄来这样一块石头。\n\n前往这些岛屿的航行、获得当地人的许可、获取石头并返航的远征，已经持续了数百年。这些航行风险极高，人们时常受伤甚至丧命。然而，一块石头的价值不仅在于它的大小，更在于它背后的故事——包括获取它所付出的努力。"
 oceania.0050.a:0 "我祝愿远征队的诸位一路顺风。"
 oceania.0050.b:0 "远征队还需要更多资源。"
 oceania.0050.b.tooltip:0 "#bold 小幅#!#P 增加#!你可能获得的[gold_i|E] [gold|E]数量，以及#bold 小幅#!#V 减少#!可能阵亡的船员人数。"
 oceania.0050.c:0 "这次远征还#斜体需要#italic 多得多#!的资源。"
 oceania.0050.c.tooltip:0 "#bold 大幅#!#P 增加#!你可能获得的[gold_i|E] [gold|E]数量，以及##bold 大幅#!#V 减少#!可能阵亡的船员人数。"
 oceania.0051.t:0 "$oceania.0050.t$"
 oceania.0051.desc.success:0 "我的前往东方海域获取[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]冒险已经#P 圆满返回#!，他们带回来一块雕刻精美的巨大圆盘状石头！\n\n随着船员的归来，我们得知了他们的旅程，以及他们经历的困难，从航行穿越海洋，到如何与当地人谈判获得这块石头。\n\n"
 oceania.0051.desc.failure:0 "数日来，我对于派往东方海域为我获取一块[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]的冒险一直感到不安。\n\n今天我的不安化为现实，当地水手发现了#N 冒险队失败的遗骸#!。多么不幸！虽然我们永远无法确切知晓他们旅途上发生了什么，但至少我们得到了某种答案。\n\n"
 oceania.0051.desc.low:0 "损失相对较小，大多数船员安全返回。由于故事不够有趣，因此#italic 石币#!的价值也随之降低。\n\n尽管如此，随着时间的推移，#italic 石币#!仍有可能增值，因为其口头传承会随着关于主人的有趣故事而不断丰富。"
 oceania.0051.desc.medium:0 "船员中出现了一定程度的损失，死伤人数不算太多，处于这类探险活动的预期范围内，并且已计入#italic 石币#!的价值。\n\n不过#italic 石币#!的长期价值仍可能有所变化，因为它的口述历史随着有关其主人的有趣传说而不断丰富。"
 oceania.0051.desc.high:0 "船员伤亡惨重，能活着回来的已是奇迹。好在这也让这颗#italic 石币#!身价倍增，全凭它那跌宕起伏的传奇故事。\n\n不过这颗#italic 石币#!的长远价值究竟如何，仍是未知数。眼下我们只能从它那惊心动魄的来历讲起，至于其历代主人的口耳相传是否同样引人入胜，还得走着瞧。"
 oceania.0051.a.failure:0 "愿[ROOT.Char.GetFaith.DeathDeityName]善待他们的亡灵……"
 oceania.0051.a.success:0 "干得漂亮！船员们真是英勇无畏。"
