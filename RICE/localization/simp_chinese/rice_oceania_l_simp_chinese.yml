 oceania.0020.t:0 "咀嚼槟榔"
 oceania.0020.desc:0 "难道这世上还有比嚼槟榔更让人惬意的事吗？一嚼，一吐，轻松又自在……"
 oceania.0020.a:0 "但愿我的嘴巴不会因此变得太红。"
 oceania.0021.t:0 "槟榔成瘾"
 oceania.0021.desc:0 "牙齿开始变红、腐烂……牙龈也开始萎缩……连身体也感觉不对劲……\n\n有人说这是因为我嚼了太多槟榔。但这怎么可能呢？明明嚼槟榔才能让我感觉舒服点。"
 oceania.0021.a:0 "这怎么能算是坏事呢？"
 oceania.0021.liege.message:0 "新槟榔成瘾者"
 oceania.0022.t:0 "饮用卡瓦醉椒"
 oceania.0022.desc:0 "我们像先祖一样欢聚一堂，斟满一杯杯卡瓦醉椒汁，供所有人一同享用。我们依次传递饮用，由地位最尊贵的人开席，随后依次向下传递，直到每一个人都喝到尽兴。"
 oceania.0022.desc.ceremonial:0 "\n\n每个人都深知卡瓦醉椒汁在重大场合时的意义。为了向祖先和[ROOT.Char.GetFaith.PantheonTerm]致敬，我们必须严格遵循一系列正确的传统步骤。"
 oceania.0022.desc.medicinal:0 "\n\n祖先们早已知晓卡瓦醉椒汁的治愈功效，并将其传承给我们，这样一起喝，我们可以享受药效。"
 oceania.0022.desc.social:0 "\n\n我们一边畅饮卡瓦，一边闲聊着各种事情，倾诉着彼此生活中的喜怒哀乐。没有什么比卡瓦更懂得如何拉近我们的距离了！"
 oceania.0022.a:0 "卡瓦只应天上有。"
 oceania.0023.t:0 "$oceania.0022.t$"
 oceania.0023.desc:0 "大家都知道我极其热衷于卡瓦文化。能让每个人都看出我有多重视这种古老饮品，感觉真不赖！"
 oceania.0023.a:0 "来吧！让我们共饮卡瓦！"
 oceania.0023.liege.message:0 "知名卡瓦饮用者"
 oceania.0024.t:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]人议事厅"
 oceania.0024.t.palauan:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]结社"
 oceania.0024.desc.intro:0 "世代以来，公共议事厅在[ROOT.Char.GetCulture.GetName]社会中都扮演着举足轻重的核心角色。"
 oceania.0024.desc.normal:0 "\n\n作为[GetPlayer.GetTitleAsNameNoTooltip]，多方扶持这些公共议事厅是我的天职。我可以为宗教祭祀提供资源，为宴会和政治典礼提供支持，亦或是提供修缮、重建这些建筑及其艺术装饰所需的工料。"
 oceania.0024.desc.palauan:0 "它们常常作为聚会场所，供[Glossary( '结社', 'CHELDEBECHEL_GLOSS' )]成员们交流往来或处理事务。\n\n作为[GetPlayer.GetTitleAsNameNoTooltip]，我有能力支持这些不同男女成员的#italic 结社#!，让它们发挥着至关重要的作用。"
 oceania.0024.a:0 "支持宗教仪式集会"
 oceania.0024.b:0 "支持宴席及其他政治典礼"
 oceania.0024.c:0 "支持这些大厅的维护和建设。"
 oceania.0024.d:0 "支持男性结社"
 oceania.0024.e:0 "支持女性结社"
