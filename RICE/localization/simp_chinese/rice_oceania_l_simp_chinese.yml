 game_concept_RICE_biaks:0 "比亚克"
 game_concept_RICE_biak:0 "比亚克"
 game_concept_RICE_biak_desc:0 "比亚克[culture|E]的[courtiers|E]有时可能会生成在地图东南边缘。为体现比亚克人的历史冒险经历，地图东部边缘的[rulers|E]可通过#Bold $RICE_oceania_recruit_biak_adventurers$#![decision|E]，让地图东部边缘的角色通过与比亚克商人或战士合作，获得正面[modifiers|E]及其他收益。"
 game_concept_RICE_papuans:0 "巴布亚"
 game_concept_RICE_papuan:0 "巴布亚"
 game_concept_RICE_papua:0 "巴布亚"
 game_concept_RICE_papua_desc:0 "巴布亚[courtiers|E]偶尔会在地图东南边缘生成。历史上，一些巴布亚族群与西边的印尼民族有过贸易或外交关系。"
 game_concept_RICE_micronesians:0 "密克罗尼西亚"
 game_concept_RICE_micronesian:0 "密克罗尼西亚"
 game_concept_RICE_micronesia:0 "密克罗尼西亚"
 game_concept_RICE_micronesia_desc:0 "密克罗尼西亚[courtiers|E]可能会偶尔出现在地图的东南边缘。尽管只是零星的，但一些密克罗尼西亚族群可能曾与印度尼西亚和巴布亚的社区有过贸易往来或接触。"
 game_concept_RICE_melanesians:0 "美拉尼西亚"
 game_concept_RICE_melanesian:0 "美拉尼西亚"
 game_concept_RICE_melanesia:0 "美拉尼西亚"
 game_concept_RICE_melanesia_desc:0 "美拉尼西亚[courtiers|E]偶尔会在地图的东南边缘生成。这些多样化的族群居住于巴布亚和美拉尼西亚诸岛，历史上曾与波利尼西亚人、密克罗尼西亚人和巴布亚人等众多人群有过接触。"
 game_concept_RICE_polynesians:0 "波利尼西亚"
 game_concept_RICE_polynesian:0 "波利尼西亚"
 game_concept_RICE_polynesia:0 "波利尼西亚"
 game_concept_RICE_polynesia_desc:0 "允许波利尼西亚[courtiers|E]极罕见地在地图东南边缘生成的可选游戏规则。在中世纪时期，波利尼西亚社群的影响力已遍布太平洋，远及美拉尼西亚和密克罗尼西亚，尽管这些区域并不在当前地图的边界之内。"
 game_concept_RICE_south_americans:0 "南阿美利加"
 game_concept_RICE_south_american:0 "南阿美利加"
 game_concept_RICE_south_america:0 "南阿美利加"
 game_concept_RICE_south_america_desc:0 "通过一项可选游戏规则，南美裔[courtiers|E]可能会以极低的概率在地图东南边缘生成。尽管在前哥伦布时期南美洲与印度尼西亚及巴布亚之间并无接触记录，但越来越多的证据表明波利尼西亚人与南美洲之间可能存在过联系。"
 game_concept_RICE_indigenous_australians:0 "澳大利亚原住民"
 game_concept_RICE_indigenous_australian:0 "澳大利亚原住民"
 game_concept_RICE_australians:0 "澳大利亚"
 game_concept_RICE_australian:0 "澳大利亚"
 game_concept_RICE_australia:0 "澳大利亚"
 game_concept_RICE_australia_desc:0 "尽管澳大利亚并不在游戏地图之内，但澳大利亚原住民[courtiers|E]可能极其偶尔地在地图东南边缘生成。从历史角度看，越来越多的证据表明，在欧洲殖民之前，印度尼西亚与澳大利亚之间可能存在过接触。"
 game_concept_RICE_oceanic:0 "大洋洲"
 game_concept_RICE_oceania:0 "大洋洲"
 game_concept_RICE_oceania_desc:0 "大洋洲囊括了太平洋上东南亚以东的诸多陆地与岛屿。\n\n虽然大部分区域在游戏中位于地图外，但各种大洋洲各种[cultures|E]和[faiths|E][courtiers|E]可能会在地图东南边缘生成，以代表这些地区在历史上与东南亚的零星联系。这些事件也让你有概率获得这些民族的知识（通过[modifiers|E]的形式出现）。使用#bold $RICE_welcome_visitors_from_oceania$#![decision|E]能增加这些遭遇出现的概率。\n\n默认情况下，你可能会看到的大洋洲[courtiers|E]类型取决于你的游戏规则，包括：\n\n$EFFECT_LIST_BULLET$偶尔：西[RICE_papuan|E]与西[RICE_micronesian|E]\n$EFFECT_LIST_BULLET$稀有：中[RICE_papuan|E]与中[RICE_micronesian|E]\n$EFFECT_LIST_BULLET$非常稀有：东[RICE_micronesian|E]、东[RICE_papuan|E]、[RICE_indigenous_australian|E]与西[RICE_melanesian|E]\n$EFFECT_LIST_BULLET$非常稀有（启用游戏规则）：[RICE_polynesian|E]与东[RICE_melanesian|E]\n$EFFECT_LIST_BULLET$极其稀有（启用游戏规则）：[RICE_south_american|E]"
 rule_RICE_oceania_frequency:0 "RICE[RICE_oceanic|E][courtiers|E]频率"
 setting_RICE_oceania_frequency_rare:0 "稀有(默认)"
 setting_RICE_oceania_frequency_rare_desc:0 "[RICE_oceanic|E][courtiers|E]以默认速率在地图东南边缘生成。"
 setting_RICE_oceania_frequency_uncommon:0 "#high 罕见#!"
 setting_RICE_oceania_frequency_uncommon_desc:0 "[RICE_oceanic|E][courtiers|E]在地图东南边缘生成得更频繁，但仍然相当罕见。"
 setting_RICE_oceania_frequency_common:0 "#high 常见#!"
 setting_RICE_oceania_frequency_common_desc:0 "[RICE_oceanic|E][courtiers|E]在地图的东南边缘频繁地生成，但总体而言仍颇为稀少。"
 setting_RICE_oceania_frequency_off:0 "#high 关闭#!"
 setting_RICE_oceania_frequency_off_desc:0 "[RICE_oceanic|E][courtiers|E]将永远不会生成，即便是那些在历史上完全说得通的也不例外，此举将覆盖其他相关游戏规则。"
 rule_RICE_remote_oceania:0 "RICE偏远[RICE_oceanic|E][courtiers|E]"
 setting_RICE_remote_oceania_off:0 "禁用（默认）"
 setting_RICE_remote_oceania_off_desc:0 "[RICE_polynesian|E]与东[RICE_melanesian|E][courtiers|E]绝不会在地图的东南边缘生成。"
 setting_RICE_remote_oceania_on:0 "#high 启用#!"
 setting_RICE_remote_oceania_on_desc:0 "虽然比其他[RICE_oceanic|E][courtiers|E]更罕见，但东[RICE_melanesian|E]和[RICE_polynesian|E][courtiers|E]可以在地图东南边缘[Glossary( '不合史实地', 'POLYNESIA_HISTORY_GLOSS' )]生成。"
 rule_RICE_south_america:0 "RICE[RICE_south_american|E][courtiers|E]"
 setting_RICE_south_america_off:0 "禁用（默认）"
 setting_RICE_south_america_off_desc:0 "[RICE_south_american|E][courtiers|E]绝不会在地图的东南边缘生成。"
 setting_RICE_south_america_on:0 "#high 启用#!"
 setting_RICE_south_america_on_desc:0 "虽然比[RICE_oceanic|E][courtiers|E]更为罕见，但[RICE_south_american|E][courtiers|E]可以[Glossary( '不合史实地', 'SOUTH_AMERICA_HISTORY_GLOSS' )]在地图东南边缘生成。"
 building_type_RICE_oceania_caves_of_fakfak:0 "法克法克洞穴"
 building_type_RICE_oceania_caves_of_fakfak_desc:0 "法克法克地区位于博姆贝赖半岛西端，其海岸线上的众多洞穴和悬崖壁上装饰着古老的岩画，描绘了动物、人物形象以及手印。这些岩画因使用红色颜料而被称为“血画”，当地人相信这是他们远古祖先的作品，用来标记这些地点，用以标记那些供奉守护神灵的圣地，同时也作为安葬逝者的墓地。"
 building_RICE_oceania_caves_of_fakfak:0 "$building_type_RICE_oceania_caves_of_fakfak$"
 building_RICE_oceania_caves_of_fakfak_desc:0 "$building_type_RICE_oceania_caves_of_fakfak_desc$"
 building_type_RICE_oceania_kabui_bay:0 "卡布伊湾"
 building_type_RICE_oceania_kabui_bay_desc:0 "拉贾安帕特群岛拥有一系列令人叹为观止的景观，这里星罗棋布着众多美不胜收的喀斯特小岛——其中卡布伊湾尤为瞩目，其将瓦伊格欧岛与甘岛分隔开来。这片的秘境宛如一幅斑斓的画卷，由浓翠、湛蓝交织而成，点缀着五彩缤纷的植被与珊瑚，不仅承载着代代相传的民间传说，更被视作当地族群的发源之地。在某些时期，海湾周边的天然洞穴还曾用作葬礼庇所。"
 building_RICE_oceania_kabui_bay:0 "$building_type_RICE_oceania_kabui_bay$"
 building_RICE_oceania_kabui_bay_desc:0 "$building_type_RICE_oceania_kabui_bay_desc$"
 trait_RICE_stone_money:0 "雅浦岛石币持有者"
 trait_RICE_stone_money_desc:0 "人们口耳相传该角色至少持有一块价值适中的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]。"
 trait_RICE_stone_money_character_desc:0 "人们口耳相传[ROOT.GetCharacter.GetFirstNameNoTooltip]至少持有一块价值适中的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]。"
 trait_RICE_stone_money_2:0 "雅浦岛石币之主"
 trait_RICE_stone_money_2_desc:0 "人们口耳相传该角色至少持有若干[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]。"
 trait_RICE_stone_money_2_character_desc:0 "人们口耳相传[ROOT.GetCharacter.GetFirstNameNoTooltip]至少持有若干[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]。"
 trait_RICE_stone_money_3:0 "雅浦岛石币富豪"
 trait_RICE_stone_money_3_desc:0 "人们口耳相传该角色拥有价值非凡的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]。"
 trait_RICE_stone_money_3_character_desc:0 "人们口耳相传[ROOT.GetCharacter.GetFirstNameNoTooltip]拥有价值非凡的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]。"
 trait_RICE_stone_money_4:0 "雅浦岛石币巨擘"
 trait_RICE_stone_money_4_desc:0 "人们口耳相传该角色持有的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]数量堪称世间一绝。"
 trait_RICE_stone_money_4_character_desc:0 "人们口耳相传[ROOT.GetCharacter.GetFirstNameNoTooltip]持有的[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]数量堪称世间一绝。"
 trait_track_RICE_stone_money:0 "$trait_RICE_stone_money$"
 trait_track_RICE_stone_money_desc:0 "每个[Glossary( '石币', 'YAP_STONE_MONEY_GLOSS' )]的价值不仅基于石头的大小和数量，还基于其主人的地位及其历史——譬如人们为获取它所冒的风险，还有它历来的主人。"
 trait_betel_chewer:0 "嚼槟榔者"
 trait_betel_chewer_desc:0 "该角色终日无所事事，只顾着咀嚼槟榔，导致满口牙龈常染成赤红之色。"
 trait_betel_chewer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]终日无所事事，只顾着咀嚼槟榔，导致[ROOT.GetCharacter.GetHerHis]的满口牙龈常染成赤红之色。"
 trait_RICE_kava_drinker:0 "卡瓦醉椒汁饮者"
 trait_RICE_kava_drinker_desc:0 "该角色素以嗜饮卡瓦醉椒而闻名，无论什么场合，无论是与家人、朋友还是陌生人在一起，其都会尽情畅饮。"
 trait_RICE_kava_drinker_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]素以嗜饮卡瓦醉椒汁而闻名，无论什么场合，无论是与家人、朋友还是陌生人在一起，[ROOT.GetCharacter.GetSheHe]都会尽情畅饮。"
 activity_RICE_oceania_sasi_ceremony_host_an_a:0 "$host_activity_a$"
 activity_RICE_oceania_sasi_ceremony:0 "萨西仪式"
 activity_RICE_oceania_sasi_ceremony_desc:0 "通过禁止在指定区域开采自然资源，我们可以保护自然资源。违抗此命令者不仅要缴纳罚款，还将受到愤怒的先祖之灵惩罚。"
 activity_RICE_oceania_sasi_ceremony_selection_tooltip:0 "在[county|E]中开始[Glossary( '萨西仪式', 'SASI_GLOSS' )]。\n\n$activity_RICE_oceania_sasi_ceremony_context_tooltip$"
 activity_RICE_oceania_sasi_ceremony_context_tooltip:0 "#emphasis 历史背景：#!$SASI_GLOSS$"
 activity_RICE_oceania_sasi_ceremony_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$根据[county|E]的[development_i|E][development|E]获得[legitimacy_i|E][legitimacy|E]\n$BULLET_WITH_TAB$举行此[activity|E]的[county|E]将获得一个[GetModifier('RICE_oceania_sasi_closed_modifier').GetNameWithTooltip][modifier|E]，该效果将在#V 1‑3#!年后被更有利的[GetModifier('RICE_oceania_sasi_open_modifier').GetNameWithTooltip][modifier|E]取代，持续#V 10#!年。"
 activity_RICE_oceania_sasi_ceremony_guest_desc:0 "$activity_RICE_oceania_sasi_ceremony_host_desc$"
 activity_RICE_oceania_sasi_ceremony_province_desc:0 ""
 activity_RICE_oceania_sasi_ceremony_destination_selection:0 "$activity_RICE_oceania_sasi_ceremony_province_desc$"
 activity_RICE_oceania_sasi_ceremony_guest_help_text:0 "$activity_RICE_oceania_sasi_ceremony$"
 activity_RICE_oceania_sasi_ceremony_predicted_cost:0 "[activity|E]的费用主要取决于你的[income|E]。"
 activity_RICE_oceania_sasi_ceremony_conclusion_desc:0 "[GetActivityType( 'activity_RICE_oceania_sasi_ceremony' ).GetName]已完成，萨西仪式现在正在执行。"
 RICE_oceania_sasi_ceremony_type:0 "萨西仪式类型"
 RICE_oceania_sasi_ceremony_type_water:0 "水萨西"
 RICE_oceania_sasi_ceremony_type_water_desc:0 "一旦[Glossary( '萨西', 'SASI_GLOSS' )]在1‑3年后开启，受影响[county|E]的[ruler|E]将获得：\n\n$EFFECT_LIST_BULLET$额外[prestige_i|E|E][prestige|E]\n$EFFECT_LIST_BULLET$[county|E]获得[GetModifier('RICE_oceania_sasi_water_modifier').GetNameWithTooltip] [modifier|E]\n\n#weak 水源自大海、河流与降雨，它都滋养着生命，因此我们必须谨慎管理用水。#!"
 RICE_oceania_sasi_ceremony_type_land:0 "土萨西"
 RICE_oceania_sasi_ceremony_type_land_desc:0 "一旦[Glossary( '萨西', 'SASI_GLOSS' )]在1‑3年后开启，受影响[county|E]的[ruler|E]将获得：\n\n$EFFECT_LIST_BULLET$额外[piety_i|E|E][piety|E]\n$EFFECT_LIST_BULLET$[county|E]获得[GetModifier('RICE_oceania_sasi_land_modifier').GetNameWithTooltip][modifier|E]\n\n#weak 我们善用土地上的植物和动物来，因此必须谨慎控制这些资源的消耗。#!"
 RICE_oceania_sasi_ceremony_prohibition_phase:0 "禁令"
 RICE_oceania_sasi_ceremony_prohibition_phase_desc:0 "[Glossary( '萨西', 'SASI_GLOSS' )]仪式正在进行中。"
 RICE_oceania_sasi_ceremony_conservation_intent_header:0 "保护："
 RICE_oceania_sasi_ceremony_conservation_intent:0 "保护"
 RICE_oceania_sasi_ceremony_conservation_intent_desc:0 "向所有相关人员强调在神灵的庇护下节约资源的重要性。获得额外[prestige_i|E][prestige|E]。拥有[GetTrait('temperate').GetName( GetNullCharacter )|U]、[GetTrait('patient').GetName( GetNullCharacter )|U]和[GetTrait('diligent').GetName( GetNullCharacter )]特质的角色额外失去[stress_loss_i|E][stress|E]。"
 RICE_oceania_sasi_ceremony_ritual_intent_header:0 "仪式："
 RICE_oceania_sasi_ceremony_ritual_intent:0 "仪式"
 RICE_oceania_sasi_ceremony_ritual_intent_desc:0 "通过此仪式，专注于向当地鬼神表达敬意。获得额外的[piety_i|E][piety|E]。拥有[GetTrait('zealous').GetName( GetNullCharacter )|U]、[GetTrait('just').GetName( GetNullCharacter )|U]和[GetTrait('humble').GetName( GetNullCharacter )]特质的角色额外失去[stress_loss_i|E][stress|E]。"
 RICE_oceania_sasi_ceremony_completed_log_title:0 "萨西仪式已完成"
