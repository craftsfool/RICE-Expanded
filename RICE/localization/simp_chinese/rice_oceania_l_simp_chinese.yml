 oceania.0061.t:0 "[biak_culture.GetNameNoTooltip]战士"
 oceania.0061.desc.intro.peaceful:0 "[biak_culture.GetName]的战士们乘坐[Glossary( '战船', 'WAIRON_GLOSS' )]而来，这些船只看似纤细光滑，实则船头雕刻着可怕的面孔，彰显着其主人无畏的冒险精神。"
 oceania.0061.desc.intro.tense:0 "幸好[biak_leader.GetFirstName]不太贪婪，同意了我们的重新协商条款。\n\n尽管我们开局颇为坎坷，但眼下还无法完全信任他们，"
 oceania.0061.desc.peaceful:0 "$oceania.0061.desc.intro.peaceful$\n\n所幸，我所接触到的一位名为[biak_leader.GetFirstName]的首领率领的战士团，其人既友善，也愿意为我们这些外来者而战。只要付以酬劳，他们便能为家乡的部族赢得荣耀与尊严。"
 oceania.0061.desc.biak:0 "$oceania.0061.desc.intro.peaceful$\n\n作为同为[biak_culture.GetCollectiveNoun]的伙伴，我们深知一位勇士在历险途中所需具备的力量、智谋与胆识。我所接触到的、由[biak_leader.GetFirstName]领导的战士们完全符合这些要求，并且只要他们能分享战利品，他们就很乐意与我合作。"
 oceania.0061.desc.tense:0 "$oceania.0061.desc.intro.tense$\n\n他们似乎心甘情愿为我而战。作为报酬，他们将为家乡的部族赢得荣耀与尊严。"
 oceania.0061.a:0 "“很好，让我们一起合作吧。”"
 oceania.0061.b:0 "“你们中有些人也可以在我们的土地上定居。”"
 oceania.0061.c:0 "“你也能亲自与我们合作吗？”"
 oceania.0061.d:0 "“我倒是可以找个像你这样的同伴。”"
 oceania.0062.t:0 "[biak_culture.GetNameNoTooltip]商人"
 oceania.0062.desc.intro.peaceful:0 "[biak_culture.GetName]商人乘坐[Glossary( '贸易船只', 'WAIMANSUSU_GLOSS' )]到来——这些船只很大，拥有足够空间容纳大量货物，证明了其主人无畏的商业头脑。"
 oceania.0062.desc.intro.tense:0 "$oceania.0061.desc.intro.tense$"
 oceania.0062.desc.peaceful:0 "$oceania.0062.desc.intro.peaceful$\n\n与我接触的那群商人由一名叫[biak_leader.GetFirstName]的人率领，其向我保证，只要获得我的支持，他们就能广泛开展贸易，将财富带回我所统治的港口。这样一来，他们也将为自己在家乡赢得荣耀与声望。"
 oceania.0062.desc.biak:0 "$oceania.0062.desc.intro.peaceful$\n\n作为同属[biak_culture.GetCollectiveNoun]的伙伴，我们深知成功的冒险不仅仅是在战斗中考验勇气。贸易和外交上的成就同样令人钦佩，而我所接触到的以[biak_leader.GetFirstName]为首的商人们似乎在这些方面经验丰富。只要我们互相帮助，他们很乐意与我合作。"
 oceania.0062.desc.tense:0 "$oceania.0061.desc.intro.tense$他们已同意与我们合作，通过贸易互惠互利。这样做，他们也将为家乡的氏族带来荣耀。"
 oceania.0062.a:0 "$oceania.0061.a$"
 oceania.0062.b:0 "$oceania.0061.b$"
 oceania.0062.c:0 "$oceania.0061.c$"
 oceania.0062.d:0 "$oceania.0061.d$"
 oceania.0063.t:0 "[biak_culture.GetNameNoTooltip]的要求"
 oceania.0063.desc.warriors:0 "$oceania.0061.desc.intro.peaceful$\n\n不过我们试图与他们谈判，让他们在我的旗帜下征战，但他们要求我提供更多黄金，并威胁说如果我不服从，就会对我领地进行劫掠作为报复。\n\n唉，他们#italic 也#!以海盗行径闻名，因此我们必须谨慎行事……"
 oceania.0063.desc.traders:0 "$oceania.0062.desc.intro.peaceful$\n\n不过我们试图与他们谈判，让他们在我的旗帜下征战，但他们要求我提供更多黄金，并威胁说如果我不服从，就会对我领地进行劫掠作为报复。\n\n唉，他们虽然是优秀的商人和外交家，#italic 但也以#!海盗行径闻名，因此我们必须谨慎行事……"
 oceania.0063.desc.fallback:0 "我们与[biak_culture.GetCollectiveNoun]冒险者的谈判失败了。\n\n他们威胁说，如果我们不提供更多黄金，就会袭击我们。"
 oceania.0063.a:0 "好吧，你会得到额外的报酬。"
 oceania.0063.b:0 "不可能！你#italic 必须#!接受我们的最初方案。"
 oceania.0063.b.failure:0 "他们拒绝并打算进行海盗行为。"
 oceania.0063.b.success:0 "他们退让了，并同意了最初的提议"
 oceania.0064.t:0 "[biak_culture.GetNameNoTooltip]海盗"
 oceania.0064.desc.original:0 "我们尝试与[biak_leader.GetFirstName]领导的[biak_culture.GetName]团体谈判，但已告失败。\n\n[biak_leader.GetFirstNameNoTooltip]和[biak_leader.GetHerHis]的人民现在正沿[target_duchy.GetNameNoTier]的水路行进，攻击并掠夺他们能接触到的一切。虽然他们能造成的破坏有限，但他们的劫掠行为却令我颜面尽失。"
 oceania.0064.desc:0 "[original_negotiator.GetTitledFirstName]最近试图招募由[biak_leader.GetFirstName]领导的[biak_culture.GetName]冒险者队伍。\n\n然而，谈判破裂，结果[biak_leader.GetFirstNameNoTooltip]和[biak_leader.GetHerHis]族人现在正沿[target_duchy.GetNameNoTier]的水路前进，攻击并掠夺他们能碰到的一切。虽然他们能造成的破坏有限，但我的领土也遭受了劫掠，我们原本与此事毫无瓜葛！"
 oceania.0064.a:0 "哎呀...."
 oceania.0064.b:0 "[original_negotiator.GetFirstNameNoTooltip]！你这个蠢货！你都干了些什么？！"
