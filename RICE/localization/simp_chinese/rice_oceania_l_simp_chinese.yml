 oceania.0080.t:0 "猎龟者"
 oceania.0080.desc:0 "一位年轻的[local_culture.GetName][hunter.GetWomanMan]，名叫[hunter.GetFirstName]来到我面前，献上一只 [hunter.GetSheHe]最近出海时亲手杀死的海龟。\n\n[local_culture.GetCollectiveNounNoTooltip]素来珍视这等威严的生灵，唯有胆识过人、德才兼备者方能将其击倒，并与众人共享其肉与甲壳。\n\n[hunter.GetFirstNameNoTooltip]将此献给我是一份厚礼，显然[hunter.GetSheHe]希望[hunter.GetHerHis]功绩得到认可。"
 oceania.0080.a:0 "这是一份不错的礼物，但捕猎乌龟可不值得表彰。"
 oceania.0080.b:0 "感谢！你无畏的勇气将会被广为传颂！"
 oceania.0080.c:0 "我需要像你一样勇敢的[hunter.GetWomenMen]为我服务。"
 oceania.0080.info:0 "#emphasis 历史背景:#!世界各地历来都有猎龟的传统，且由于捕猎这种动物颇具难度、其肉又常被视为珍馐，这一活动往往承载着重要的仪式或社会功能。例如，在许多大洋洲社区，狩猎海龟既被视为慷慨之举（将肉分赠他人），也是勇气与男子气概的象征。"
 oceania.0081.t:0 "无歌舞，毋宁死"
 oceania.0081.desc:0 "我们民族有一句古老的谚语，[ROOT.Char.GetCulture.GetName]常说：“无歌舞，毋宁死。”\n\n当然，这不是字面意思；相反，表演舞蹈和歌曲，尤其是在重要仪式上——这不正是人类的精华吗？不正是与他人共同生活在社区中的意义吗？"
 oceania.0081.a:0 "是的，确实如此。"
 oceania.0081.b:0 "大多数情况下是的，但并非总是如此。"
 oceania.0082.t:0 "西米露"
 oceania.0082.desc:0 "仆人给我端来一碗新鲜的[Glossary( '西米露', 'SAGO_GLOSS' )]，拌了椰奶和糖。在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]这暖洋洋的日子里，有它作伴，真是清爽！"
 oceania.0082.a:0 "啊！真清爽！"
 oceania.0083.t:0 "祭品西米露"
 oceania.0083.desc:0 "我的[chaplain.GetCouncilTitle][chaplain.GetFirstName]向我禀报了一件关于当地神灵的要事。[chaplain.GetSheHe]觉察到，在[county.GetNameNoTier]那些树林密布的荒野地带，有些神灵是可以安抚的——只要我们按传统的[ROOT.Char.GetFaith.GetAdjective]仪式，献上[Glossary( '西米', 'SAGO_GLOSS' )]和其他祭品。\n\n[chaplain.GetFirstNameNoTooltip]相信，要是那些神灵对#italic 西米#!满意，它们甚至会在暗中帮我们的忙。"
 oceania.0083.a:0 "好主意！我们就这样做。"
 oceania.0083.b:0 "我们不需要这些神灵的帮助。"
 oceania.0084.t:0 "凤头鹦鹉"
 oceania.0084.desc:0 "前段时间，为了更好地了解我领地的经济状况，我要求在[county.GetNameNoTier]一带经营的商人提交关于他们商业活动以及进出口货物的报告。\n\n有趣的是，凤头鹦鹉似乎是[county.GetNameNoTierNoTooltip]的一种热门出口商品。我进一步询问原因，商人们说，尽管凤头鹦鹉的出口数量不多，但由于它们性情温顺且能模仿人语，在其他地区的权贵阶层中极受欢迎。"
 oceania.0084.a:0 "太有意思了！听到这个真是太好了。"
 oceania.0084.b:0 "他们应该尝试多捕捉一些并出售。"
 oceania.0084.info:0 "#emphasis 历史背景：#! 数世纪以来，凤头鹦鹉一直作为珍禽出口到其原生栖息地以外的地区，并深受人们的喜爱。它们在欧洲最早的形象记录出现于13世纪神圣罗马帝国皇帝腓特烈二世撰写的驯鹰术著作——#italic 《驯鹰的艺术》#!中；另一个例子是，在日本近世早期，它们有时也会出现在佛教题材的绘画里。"
 oceania.0085.t:0 "极乐鸟"
 oceania.0085.desc:0 "极乐鸟的羽毛在数个世纪以来一直是一项利润丰厚的出口商品。近期，在[county.GetNameNoTier]捕获的此类鸟类的羽毛品质声名鹊起，正以高于寻常的价格售出。"
 oceania.0085.a:0 "绝佳的消息！"
 oceania.0085.info:0 "#emphasis 历史背景：#! 为了获取羽毛而猎捕极乐鸟的历史源远流长。尽管这些鸟类仅分布于新几内亚、马鲁古群岛和澳大利亚，但它们的羽毛曾广泛行销于整个旧大陆——从中国到中东，再到欧洲。例如，有确凿证据表明，中世纪的欧洲骑士曾将这些羽毛装饰在他们的头盔上。"
 oceania.0086.t:0 "$travel_event_prefix$鹤鸵"
 oceania.0086.desc:0 "“小心！”[traveler.GetTitledFirstName]大声警告道，“千万别离那家伙太近！”\n\n我们在[ROOT.Char.GetCurrentLocation.GetName]的旅程突然中断了，因为我们撞见了一只不会飞的巨鸟。它有着漆黑的羽毛、斑斓的面部，以及冷峻的目光。即便相隔甚远，也能明显看出它的体型足有一个矮小的成年人那么大。\n\n“鹤鸵是一种非常危险的鸟，”[traveler.GetFirstNameNoTooltip]一边说，一边示意我们退后，“它们那粗壮的爪子能直接撕开你的喉咙。我们还是绕道走吧。”"
 oceania.0086.a:0 "这家伙没那么可怕，况且我们手里有武器！"
 oceania.0086.b:0 "安全第一。还是绕道走吧。"
 oceania.0087.t:0 "冢雉蛋"
 oceania.0087.desc:0 "在[county.GetNameNoTier]各处都可以找到多种[Glossary( '冢雉', 'MEGAPODE_GLOSS' )]。\n\n由于它们的蛋对当地[county_culture.GetCollectiveNoun]来说是美味佳肴和身份象征，因此它们筑巢地点历来受到保护；人们只有在特定的条件下才能采集它们的蛋，以确保长期稳定的蛋供应。\n\n然而，当地人对他们#italic 能够#!收获多少蛋最近产生了争议。一些人认为应该采集更多的蛋作为食物和礼物来建立关系。另一些人则认为这种贪婪是可耻的，并且违背了与这些蛋相关的习俗。"
 oceania.0087.a:0 "采集更多鸟蛋！"
 oceania.0087.b:0 "我们不需要更多鸟蛋。"
