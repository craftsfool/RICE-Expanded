 oceania.0047.t:0 "$oceania.0045.t$"
 oceania.0047.desc:0 "此前，在地方领袖的倡导下，[sasi_open_county.GetNameNoTier]曾被实施了[Glossary( '萨西', 'SASI_GLOSS' )]禁捕。在此期间，任何人都被严禁采伐受到#italic 萨西仪式#!限制的陆地资源直到今天。\n\n今天，我们举行了隆重的解禁#italic 萨西仪式#!。在漫长的封锁期内，那些未受惊扰的自然资源数量已经得到了大量补充。"
