 RICE_pacific_warriors_flavor:0 "#F 在太平洋的诸岛上，英勇的勇士为荣誉与荣耀而战，展现精湛的近身格斗技艺和对多样地形的谙熟。#!"
 RICE_mambri:0 "曼布里"
 RICE_mambri_flavor:0 "#F 曼布里（Mambri）是勇敢、狡黠且野心勃勃的冒险家与剑客代名词，他们远赴异域寻觅奇遇，只为将荣耀、名声、财富与知识带回故土。#!"
 RICE_kwaraae_ramo:0 "拉莫"
