 oceania.0010.t:0 "天涯海角之外"
 oceania.0010.desc:0 "东边辽阔的大洋并非只有荒凉的咸水。在天涯海角之外，存在着岛屿和人民——我们深知这一点，因为这些人偶尔会向西航行而来。\n\n我们将竭尽全力散播消息，表明这些来自东海的旅者和冒险家在我们的土地上深受欢迎，任何渴望与我们贸易并分享其知识的人，都将在[ROOT.Char.GetPrimaryTitle.GetBaseName]中找到朋友！"
 oceania.0010.a:0 "他们何时才会抵达我们的海岸？是否真的会来？"
