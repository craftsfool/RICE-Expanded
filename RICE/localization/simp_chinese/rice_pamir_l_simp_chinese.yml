 pamir.0111.t:0 "布拉灰人到来"
 pamir.0111.desc:0 "几代人以来，大量达罗毗荼语系的部落从印度中部的原始家园向北迁徙。他们被称为#V 布拉灰人#!，分几波在俾路支省部分地区定居，并吸收了一些当地部落，最近还皈依了伊斯兰教。在那里他们为自己找到了一个新的家园，在那里他们继续着半游牧民族的传统生活方式。他们与当地统治者的关系如何，还有待观察。"
 pamir.0111.a:0 "了解这些真有意思……"
 RICE_pamir_brahui_migrations_happened_text:0 "#V 布拉灰人#!完成了向俾路支省的迁徙，现在，布拉灰人[courtiers|E]有几率在当地[rulers|E]的宫廷出现"
 pamir.0112.t:0 "xxxxx"
 pamir.0112.desc:0 "xxxxx"
 pamir.0112.a:0 "xxxxx"
 pamir.0113.t:0 "纳西尔·霍斯劳"
 pamir.0113.desc:0 "多年来，我听说过一个被称为[nasir_khusraw.GetFullName]的穆斯林圣人，一生中他不断流离失所。但是他是一位伟大的诗人和学者，因其成就而闻名整个伊斯兰世界，然而他至今都没有找到一个合适的家——直到现在。\n\n我收到消息，他已经抵达波多叉拿地区，并在[nasir_khusraw_county.GetNameNoTier]崎岖、偏僻的地方安了家。看来他在正义而博学的[nasir_khusraw_buddy.GetTitledFirstName]中找到了自己的朋友和赞助人，他欣赏[nasir_khusraw.GetFullName]的精神和哲学见解。\n\n想象一下，这样一位著名的人物，如今在这个偏远的地方。现在[nasir_khusraw.GetFullName]希望在那里传播伊斯兰教的光芒，他能成功吗？"
 pamir.0113.a:0 "听起来很有意思"
 pamir.0113.tooltip:0 "[nasir_khusraw_buddy.GetTitledFirstName]能否协助[nasir_khusraw_buddy.GetHerHis]的朋友和导师[nasir_khusraw|E]将伊斯兰的光芒带到波多叉拿？只有时间会告诉我们。"
 pamir.0114.t:0 "xxxxx"
 pamir.0114.desc:0 "xxxxx"
 pamir.0114.a:0 "xxxxx"
 pamir.0115.t:0 "精灵王子回归天堂"
 pamir.0115.desc:0 "[azur_jamshid.GetTitledFirstName]，[gilgit_county.GetNameNoTier]的救世主及国王最近去世了。多年前，他带领[gilgit_county.GetNameNoTier]的人民推翻并杀死了食人暴君国王[shri_badat.GetTitledFirstName]，然后被推选为国王。然而虽然他已经不在了，但当地人很可能会在未来几代人中继续庆祝他的胜利"
 pamir.0115.a:0 "有意思……"
 pamir.0115.tooltip:0 "[azur_jamshid|E]已经去世，若[county_modifier|E][GetModifier('RICE_pamir_shri_badats_palace').GetNameWithTooltip]也通过#V 拆毁室利巴达特之宫#![decision|E]移除了，则#V 帕米尔#!和#V 拉达克#![duchies|E]的[rulers|E]可以采用#V 资助土石岭节#!的[decision|E]"
 pamir.0115.tooltip.evil_azur_jamshid:0 "虽然[azur_jamshid|E]已经去世了，但他背叛了最初他拯救的人民，并继续继承了残忍的室利巴达特的想法，变成了一个暴君，并翻新了以前的暴君宫殿，他将在未来的几代人中被消极地记住。因此帕米尔拉达克的[duchies|E]的[rulers|E]将永远无法解锁#V 资助土石岭节#![decision|E]"
 pamir.0115.tooltip.evil_not_azur_jamshid:0 "虽然[azur_jamshid|E]已经去世了，他可能在当地的民间传说中被记住，但残忍的室利巴达特的意志仍在继续。室利巴达特的宫殿不仅还在，而且还被翻修过，当地人生活在恐惧之中。因此帕米尔拉达克的[duchies|E]的[rulers|E]将永远无法解锁#V 资助土石岭节#![decision|E]"
 pamir.0115.desc.evil_azur_jamshid:0 "[azur_jamshid.GetTitledFirstName]，[gilgit_county.GetNameNoTier]的曾经救世主已经去世了。多年前，他带领[gilgit_county.GetNameNoTier]的人们推翻并杀死了食人暴君国王[shri_badat.GetTitledFirstName]，然后被推选为国王。然而他拥抱了心中的黑暗，并开始效仿被他打败的人，自己变成了一个令人恐惧和厌恶的压迫者。谁知道是什么导致他走上这条黑暗之路？\n\n现在，随着他的死亡，也许[gilgit_county.GetNameNoTier]的人们将获得一些慰藉，也许他们不会。但是无论如何他都将被唾弃。"
 pamir.0115.desc.evil_not_azur_jamshid:0 "[azur_jamshid.GetTitledFirstName]，[gilgit_county.GetNameNoTier]的救世主已经去世了。几年前，他带领[gilgit_county.GetNameNoTier]的人民推翻并杀死了食人暴君国王[shri_badat.GetTitledFirstName]，从而获得了更好、更光明的未来。不幸的是，在[azur_jamshid.GetFirstName]安养生息时，出现了一个新的暴君，这个暴君延续了[shri_badat.GetTitledFirstName]的可怕遗产。虽然[azur_jamshid.GetTitledFirstName]可能会被人们深情地记住，但他很可能会从当地人的记忆中淡出。"
 pamir.0116.t:0 "xxxxx"
 pamir.0116.desc:0 "xxxxx"
 pamir.0116.a:0 "xxxxx"
 pamir.0117.t:0 "哈拉吉崛起"
 pamir.0117.desc:0 "在几个世纪里，诸民族在东伊朗世界来来往往，起起伏伏，拜崎岖地形所赐，财富、战争和宗教于此交织在一起。\n\n嚈哒帝国崩溃后，[hephthalite.GetCollectiveNoun]的继承者们在这一地区建立了许多残纯国家，时过境迁，不同民族的存在改变了这一地区的政治、文化和民族，无论他们是外来者还是当地人。\n\n曾经强大的[hephthalite.GetCollectiveNounNoTooltip]人统治的土地上，最近出现了一个新的民族——[my_new_culture.GetName]。尽管难分起源，但肯定包括我们的同胞[old_culture.GetCollectiveNoun]人，不过主要面孔是$heritage_turkic_name$人，不过也有$heritage_iranian_name$人在其中。"
 pamir.0117.a:0 "壮哉我大[my_new_culture.GetNameNoTooltip]！"
