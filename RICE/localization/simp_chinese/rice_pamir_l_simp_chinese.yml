 pamir.0150.t:0 "组织乔莫斯节"
 pamir.0150.desc:0 "冬至快到了，这意味着几乎到了庆祝乔莫斯节的时候。作为诸神的信徒，以[ROOT.Char.GetFaith.GetAdjective]的方式，我必须参加这一活动，因为这是一年中的一个神圣时刻，我们要举行必要的仪式来引导今年进入下一年，并正确地划分出纯洁和不纯洁的事情\n\n我和显贵将召集附近城镇的人们，我们将一起努力为今年准备一个盛大的乔莫斯节，我们必须认真对待这一切，并尽最大努力确保活动获得成功。"
 pamir.0150.a:0 "是时候工作了！"
 pamir.0151.t:0 "班德克"
 pamir.0151.desc:0 "今年的乔莫斯节筹备工作正在进行中，但按照惯例，我和其他几个d当地名贵需要参加#italic 班德克（Bandek）#!仪式。在这一年中，无法避免地有人去世，而#italic 班德克（Bandek）#!是我们邀请死者亲属结束哀悼期并重新融入部族的机会。我需要花一些时间挨家挨户地去拜访这些当地人的房子，并正式请求他们参加乔莫斯节。"
 pamir.0151.a:0 "让我们行动起来吧！这是乔莫斯节的一环！"
 pamir.0151.b:0 "我不需要亲自前往，有人会替我去。"
 pamir.0152.t:0 "萨拉查"
 pamir.0152.desc:0 "乔莫斯节正式开始于#italic 萨拉查#!仪式，该仪式围绕桧柏，这是我们许多净化仪式中使用的神圣的植物。我以及其他贵族、村民、旅行者和[ROOT.Char.Custom('DefaultPriestTitlePlural')]等人已经聚集在指定地点，见证#italic 萨拉查#!。在这个仪式中，年轻的男孩和女孩根据性别分成两组，在比赛中点燃手中的桧柏树枝，看谁能创造出最多的烟雾，所有这些都是献给英雄巴鲁曼的。"
 pamir.0152.desc.boy:0 "\n\n今年似乎男孩们赢了，因为他们制造的烟雾显然比女孩们的更多！在#italic 萨拉查#!完成后，[ROOT.Char.Custom('DefaultPriestTitlePlural')]手持桧柏，进行祈祷。祈祷完成后，就是#italic 萨拉查#!的最后部分，孩子们兴奋地拿着桧柏枝在村子里跑来跑去，用这些桧柏枝敲开每家的门，为大家的祈祷。"
 pamir.0152.desc.girl:0 "\n\n今年似乎女孩们赢了，因为她们制造的烟雾显然比男孩们的更多！在#italic 萨拉查#!完成后，[ROOT.Char.Custom('DefaultPriestTitlePlural')]手持桧柏，进行祈祷。祈祷完成后，就是#italic 萨拉查#!的最后部分，孩子们兴奋地拿着桧柏枝在村子里跑来跑去，用这些桧柏枝敲开每家的门，为大家的祈祷。"
 pamir.0152.a:0 "太好了！"
 pamir.0153.t:0 "Kuta'mru"
 pamir.0153.desc:0 "今天是#italic Kuta’mru#!，这是一个重要的日子，野性和理性在精神上联系最紧密的时刻。\n\n早上，孩子们聚集在当地的寺庙周围，参加#italic Chutayak#!仪式，他们在寺庙的墙壁、门和柱子上画上山脉、星星、各种动物等图像，这一切都在完全安静的情况下进行。\n\n下午每个人都专注于用面粉制作雕塑。这些面粉将被烘烤，并在第二天清晨展示在牧场上，象征着它们迁移到田野里吃草，然后再卖给非信徒，因为我们不允许吃它们。通常情况下，这些雕塑样子都是牧羊人或各种动物，今年我应该做个什么样子的雕塑呢？"
 pamir.0153.a:0 "守护着我们的牲畜的牧羊犬"
 pamir.0153.b:0 "居住在帕米尔高原上的野生雄鹿。"
 pamir.0153.c:0 "为我们提供食物、牛奶和皮革的奶牛。"
 pamir.0153.d:0 "谦卑而勤奋的牧羊人。"
 pamir.0153.e:0 "山羊，因为它们是我们最神圣的动物。"
 pamir.0154.t:0 "马达赫克"
 pamir.0154.desc:0 "乔莫斯节的下一个仪式是#italic 马达赫克#!，这一天我们纪念死去的祖先。在寺庙外，我们准备了一个微型的木制堡垒，称为#italic Chilikotik#!\n\n在那里我们放置了许多食物。这座食物堡垒被点燃后，我们立马抬入寺庙，以便让先祖能享受到。在寺庙内，一位长老喊道：“哦，先祖们，来尽情的吃喝吧，然后安详的离开吧！”\n\n等#italic Chilikotik#!和所有的食物完全被烧成灰烬后，我们就从庙里出来了。"
 pamir.0154.a:0 "想必，老祖宗今年很满意。"
 pamir.0155.t:0 "索韦利克·哈里"
 pamir.0155.desc:0 "现在是举行#italic 索韦利克·哈里#!仪式的时候了！在这个仪式上，我们要摆丢弃旧东西用新的东西代替。更有趣的是，现在是进行戏剧表演的时间，讽刺上一年发生的事件，部族的大伙都被逗乐了，每个人都笑得前仰后合（当然都是善意的幽默）。早些时候，当我们组织乔莫斯节的时候，我们都在讨论今年表演主题是什么？"
 pamir.0155.a:0 "我做的各种事迹（或不端行为）"
 pamir.0155.b:0 "当地村民生活中的琐事"
 pamir.0155.c:0 "在远方发生的重大消息"
 pamir.0156.t:0 "Goshnik"
 pamir.0156.desc:0 "今天是#italic Goshnik#!，是乔莫斯节的一个关键部分活动，因为今天是我们正式欢迎孩童们加入我们的部族的时刻，正式成为[ROOT.Char.GetFaith.GetAdjective]信仰的追随者。\n\n七、八岁左右的男孩和女孩要经过#italic Chailaksambaik#!，他们穿上传统的衣服，将动物的血被洒在男孩身上。而年龄较大的男孩则要经历一个类似的仪式，称为#italic Butsambaik#!"
 pamir.0156.desc.child:0 "\n\n今年的孩子中，有我的后代！现在他们和其他孩子一起，正式的加入了我们，也和我一起追随我们的神灵！"
 pamir.0156.a:0 "很高兴看到下一代人长大了。"
 pamir.0157.t:0 "Ghona Chanja"
 pamir.0157.desc:0 "今晚是#italic Ghona Chanja#!之夜！英雄巴鲁曼神会从[ROOT.Char.GetFaith.DivineRealm]骑着他的天马来到这里为我们祈福。虽然祂不是主神，但祂是我们神圣的保护者，祂在很久以前就教会了如何生活和如何膜拜神明。\n\n午夜时分，我们去村子附近的一个高点，那里矗立着一个特殊的祭坛，即#italic 英德兰#!。在那里我们向大英雄巴鲁曼献祭食物和动物，由[ROOT.Char.Custom('DefaultPriestTitle')]带领我们进行祈祷。我应该要求巴鲁曼帮助我什么？"
 pamir.0157.a:0 "我希望巴鲁曼也保佑我。"
 pamir.0158.t:0 "狐狸之日"
 pamir.0158.desc:0 "在#italic Ghona Chanja之夜#!后，下一个仪式是#italic Lawak Bii'rik#!，即狐狸的日子。狐狸是一种狡猾的动物，它们要对上一年不幸和今年的运气负责。作为这个仪式的一部分，年轻人在清晨开始在附近的山上和森林里寻找狐狸，在狐狸居住的洞穴附近敲响响亮的鼓和音乐，将它们赶出来。如果他们看到的第一只狐狸跑上坡，往山里的住所跑，那么下一年的好运就会降临到所有人身上；如果它往山下跑，那么就会有不幸的事情发生。如果没有发现狐狸.........那么说明它们今年变得更狡猾了。"
 pamir.0158.a:0 "狐狸会往哪边跑呢？"
 pamir.0158.toast.good:0 "狐狸往山上跑了！！"
 pamir.0158.toast.neutral:0 "没发现狐狸……"
 pamir.0158.toast.bad:0 "狐狸往山下跑了"
 pamir.0159.t:0 "最后的舞蹈"
 pamir.0159.desc:0 "Lawak Bii'rik仪式完成后，在中午时分，每个人都回到村子里，在那里举行最后和最大的庆祝活动。虽然有食物和舞蹈，但有一项表演占据了活动的大头。\n\n在村里的广场中央，许多人都用面具遮住了他们的脸。不仅如此他们中的许多人无论是否戴着面具都打扮成异性，一些男人打扮成女人，一些女人打扮成男人。同时“男人们”被分为两组，一组“纯洁”的男人唱着庄严而尊贵的歌曲，一组”邪恶“的男人则唱着节奏狂野的淫秽的旋律。这就是乔莫斯节的高潮，所有的界限被打破又重新建立！"
 pamir.0159.a:0 "棒极了！"
 pamir.0160.t:0 "乔莫斯节结束"
 pamir.0160.desc:0 "终于，所有的乔莫斯节仪式都得到了适当的执行，为期数周的庆祝活动也告一段落。我们都留下了多么美好的回忆啊！ 新的一年即将来临，让我们希望它是一个富饶且和平的一年。"
 pamir.0160.a:0 "下次再见！"
