 RICE_pamir_restore_hephthalite_empire:0 "重建嚈哒帝国"
 RICE_pamir_restore_hephthalite_empire_tooltip:0 "白匈奴将再次崛起！"
 RICE_pamir_restore_hephthalite_empire_desc:0 "几个世纪前，嚈哒帝国让波斯和印度人民感到恐惧。然而我们的祖先并不是无知的野蛮人——他们也是创造美丽纪念碑的工匠和有学识的思想家，我们甚至和中国、罗马有关系并与其贸易。现在是我们不仅要继承祖先的遗产，还要重建先祖的伟大帝国！"
 RICE_pamir_restore_hephthalite_empire_confirm:0 "让我们开始着手恢复匈奴！"
 RICE_pamir_restore_hephthalite_empire_context_tooltip:0 "#emphasis 历史背景：#!嚈哒帝国，有时也被称为白匈奴，是4、5世纪时进入波斯和印度的一大波“匈人”部落入侵者。他们与匈尼特人和寄多罗人等“匈人”群体的关系，以及这些群体间是否存在民族差异，以及他们的来源，至今仍是学术界争论不休的话题。但可以简单地说，他们的起源很可能受到了伊朗和突厥的影响，而且他们的祖地可能就是帕米尔高原。约公元560年，波斯和突厥联盟将他们击溃，嚈哒帝国自此四分五裂。在这些嚈哒的残余势力中，最为突出的是突厥沙希王朝和他们的樽比勒王朝。"
 RICE_pamir_reclaim_hephthalite_homeland:0 "收复嚈哒核心区域"
 RICE_pamir_reclaim_hephthalite_homeland_tooltip:0 "$RICE_pamir_restore_hephthalite_empire_tooltip$"
 RICE_pamir_reclaim_hephthalite_homeland_desc:0 "曾经强大的嚈哒人现在如同蒲公英一样四散，沦为印度和波斯之间腹地的残余酋长国。为了夺回我们的帝国荣耀，我们需要在嚈哒帝国的旧核心重新建立我们的存在，在帕米尔高原重建帝国！"
 RICE_pamir_reclaim_hephthalite_homeland_confirm:0 "嚈哒人的春天将再次来临。"
 RICE_pamir_reclaim_hephthalite_homeland_context_tooltip:0 "$RICE_pamir_restore_hephthalite_empire_context_tooltip$"
 RICE_pamir_restore_hephthalite_restored_culture_conversion:0 "在#bold $k_hephthalite_restored$#!附近重建伯爵领"
 RICE_pamir_reclaim_hephthalite_homeland_effect_tooltip_1:0 "解锁#Bold $RICE_pamir_restore_hephthalite_empire$#![decision|E]"
