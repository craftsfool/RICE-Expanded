 pamir.0005.t:0 "帕米尔高原的命运"
 pamir.0005.desc:0 "随着阿拔斯王朝的衰落，帕米尔地区的军阀乱作一团，他们试图利用这里的财富，特别是青金石，一种来自萨里桑青矿脉的矿石。虽然萨曼王朝名义上统治着这些高地，但他们的权威受限于巴尼朱尔王朝以及自嚈哒时代以来一直统治这里的小酋长们。"
 pamir.0005.a:0 "我的故事不在于这些军阀中的任何一个。"
 pamir.0005.b:0 "我们的故事是与巴尼朱尔王朝有关……"
 pamir.0005.c:0 "我们的故事是与勃特山酋长有关……"
 pamir.0005.d:0 "我们的故事是与瓦罕酋长有关……"
 pamir.0005.e:0 "我们的故事是与识匿酋长有关……"
 pamir.0005.f:0 "我们的故事是与卡伦酋长一起……"
 pamir.0005.g:0 "我们的故事是与阿苏尔·贾姆希德一个……"
 pamir.0005.tooltip.no:0 "你将继续扮演[THIS.Char.GetTitledFirstNameNoTooltip]。但是请注意，[badakhshan_duchy.GetNameNoTier]的[duchy|E]中的[counties|E]仍将在各种小酋长手上，他们要么是佛教徒，要么是异教徒。"
 pamir.0005.tooltip:0 "[badakhshan_duchy.GetNameNoTier][duchy|E]的[counties|E]已经被各种小酋长分割，他们要么是佛教徒，要么是异教徒。如果你选择扮演他们中的一员，你能在这些崎岖不平的山路上逆境生存吗？"
 pamir.0005.tooltip.banijurid:0 "你将选择扮演巴尼朱尔王朝的某人，他们现在拥有帕米尔以西的领土。"
 pamir.0005.tooltip.azur_jamshid:0 "你将扮演[azur_jamshid.GetTitledFirstName]，传说中的精灵和吉尔吉特的拯救者。"
 pamir.0005.info.banijurid:0 "\n#emphasis 历史背景：#!巴尼朱尔王朝是一个伊朗王朝，从公元847年至948年作为萨曼王朝的附庸统治巴尔赫，并在胡勒布克（或胡塔尔）建都。他们可能在萨曼王朝的领地内拥有一定的权力，因为他们显然没有向萨曼王朝缴纳税款，而且还铸造了自己的钱币。\n\n巴尼朱尔王朝的好运并没有持续，因为他们在948年支持了一场反对萨曼王朝的叛乱，导致了他们的灭亡。然而，奇怪的是，他们似乎在伽色尼王朝的统治下幸存到了11世纪初。"
 pamir.0005.info.puteshan:0 "\n#emphasis 历史背景：#!“勃特山”是8世纪新罗高僧慧超在他的旅行记录对巴达赫尚的音译。他指出，这些人是虔诚的佛教徒，但受阿拉伯人的统治。"
 pamir.0005.info.wakhan:0 "\n#emphasis 历史背景：#!根据8世纪新罗高僧慧超的说法，在他旅行的时候，瓦罕是一个在阿拉伯人统治下的弱小佛教王国。"
 pamir.0005.info.shughnan:0 "\n#emphasis 历史背景：#!根据8世纪新罗高僧慧超的说法，识匿被分为九个小王国，在RICE模组中代表识匿酋长和卡伦酋长。\n\n奇怪的是，慧超还说，此时的识匿还没有佛教，也许暗示他们信奉各种本土信仰。"
 pamir.0005.info.azur_jamshid:0 "\n#emphasis 历史背景：#!根据传说，中世纪和近代的吉尔吉特统治者是来自波斯的精灵王子阿苏尔·贾姆希德的后裔。他在暴君的女儿努尔·巴赫特的帮助下，杀死了一个食人暴君室利巴达特。他在继承王位后统治了几年，然后把王位让给了他的妻子，后来她又把王位让给了他们的儿子加尔格。\n\n后来，他们的后代把他们的姓氏从凯扬改为特剌汗，并且他们的不同分支去统治了附近的一些山谷。"
 pamir.0006.t:0 "xxxxx"
 pamir.0006.desc:0 "xxxxx"
 pamir.0006.a:0 "xxxxx"
 pamir.0007.t:0 "波多叉拿，青金石之乡"
 pamir.0007.desc.puteshan:0 "我的祖先，勃特山国王，世代统治着[badakhshan_duchy.GetNameNoTier]，甚至在一个世纪前被朝鲜半岛高僧慧超等旅行者赞不绝口。事实上我们最著名的是对佛教的赞助，随着对青金石矿的控制，这个地区肯定会繁荣起来，但是我们必须对外来者保持警惕，无论是波斯人、阿拉伯人、吐蕃人、突厥人、中国人，还是其他什么人。\n\n"
 pamir.0007.desc.non_puteshan:0 "我的家族是曾经强大的嚈哒游牧民族的最后残余之一。因为嚈哒分支已经在[badakhshan_duchy.GetNameNoTier]这个地方统治了很多代，这里的酋长和长老们认为我是他们中最有声望的人，是他们的领袖。由于我们处于丝绸之路的中心位置，我们必须警惕那些试图剥削我们的外来者，无论是波斯人、阿拉伯人、吐蕃人、突厥人、中国人，还是其他完全不同的人。\n\n"
 pamir.0007.desc:0 "一个世纪前，唐朝和吐蕃军队从该地区撤出，留下了权力真空，但在[badakhshan_duchy.GetNameNoTier]的偏远山谷中，只要我们不给穆斯林霸主带来任何麻烦，我们就相对不受干扰。很难说这样的状态会持续多久，所以未来的路会很艰难。从我在世界这个偏远角落的权力基地，我希望我能够胜任保护它的任务！"
 pamir.0007.a:0 "帕米尔人的历史就此翻开了新的篇章……"
 pamir.0008.t:0 "帕米尔高原的命运"
 pamir.0008.desc:0 "大呼罗珊的土地已经落入两个强大的突厥王朝的统治之下，即塞尔柱人和伽色尼人。然而在帕米尔高原和兴都库什山脉的高原上，他们的掌控力很弱，那里的山谷和山口之间居住着凶猛的独立部落和军阀。世代以来，这个地区一直是不同信仰、文化和语言的融合地。\n\n在[badakhshan_duchy.GetNameNoTier]，我听说那里住着一位睿智而受人尊敬的穆斯林圣人，名叫[nasir_khusraw.GetFullName]。他的赞助人和长期挚友是正直而博学的[ali_ibn_asad.GetTitledFirstName]，他在精神和哲学问题上有共同的兴趣。\n\n总之，谁知道帕米尔地区的未来还有什么？"
 pamir.0008.a:0 "作为[ROOT.Char.GetTitledFirstName]，我与这个地区的未来有关系。"
 pamir.0008.b:0 "我的故事是与知识分子[ali_ibn_asad.GetTitledFirstName]有关……"
 pamir.0008.c:0 "实际上，我的故事与[gilgit_county.GetNameNoTier]的卡亚尼斯有关……"
 pamir.0008.tooltip.no:0 "你将继续以[THIS.Char.GetTitledFirstNameNoTooltip]的身份游戏。然而请注意[badakhshan_duchy.GetNameNoTier]仍将被[ali_ibn_asad.GetTitledFirstName]拥有。"
 pamir.0008.tooltip.yes:0 "[badakhshan_duchy.GetNameNoTier]的[duchy|E]是由聪明的[ali_ibn_asad.GetTitledFirstName]统治的。如果你选择扮演他，你是否能够协助你的朋友以及导师[nasir_khusraw|E]将伊斯兰教的光芒带到这些土地上？"
 pamir.0008.tooltip.kayani:0 "靠近[gilgit_county.GetNameNoTier]的领土由[nur_kayani.GetTitledFirstName]统治，他是传奇英雄阿苏尔·贾姆希德的后代。他能继承他祖先的遗产吗？"
 pamir.0009.t:0 "阿里·伊本·阿萨德与纳西尔·霍斯劳"
 pamir.0009.desc:0 "我是[ROOT.Char.GetTitledFirstName]，[badakhshan_duchy.GetNameNoTier]偏远山区和山谷的统治者，这里是#italic Dar al‑Islam（意为伊斯兰协约区）#!的边疆，与#italic 卡菲勒#!的土地接壤。这里的许多人仍然坚持他们古老信仰。不过我已经获得了一个知名学者、思想开放的统治者的声誉。\n\n例如，我的朋友[nasir_khusraw.GetFullName]在其他穆斯林统治者的土地上面临着许多困难，尽管他被什叶派和逊尼派的平民们尊重为正义的圣人，但是这些军阀把他的[nasir_khusraw.GetFaith.GetAdjective]信条视为异端。但我有不同的看法，于是在我的土地上给了他庇护。\n\n自从他到来后，我们进行了许多精彩的思想交流。我觉得他是能将伊斯兰教之光带入这片土地的人。事实上，我不禁怀疑我目前的[ROOT.Char.GetFaith.GetAdjective]信仰是否正确。也许[nasir_khusraw.GetFaith.GetAdjective]的真相就是我一直在寻找的东西。"
 pamir.0009.a:0 "我尊重我的朋友，[nasir_khusraw.GetFullName]，但我们对信仰的看法不同。"
 pamir.0009.b:0 "[nasir_khusraw.GetFullName]让我看到了曙光！我必须改变我的信条。"
 pamir.0009.info:0 "\n#emphasis 历史背景：#!纳西尔·霍斯劳是一位学者、旅行家和圣人，他比他的朋友阿里·伊本·阿萨德更为人所知，后者是11世纪中叶巴达赫尚的统治者。在阿里的请求下，纳西尔·霍斯劳写了他的最后一部作品《哲学与宗教的调和》，或称#italic 《智慧双合》#!，并于公元1070年左右或之后去世。"
