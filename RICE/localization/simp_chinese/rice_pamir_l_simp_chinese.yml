 RICE_hephthalite_legend_new_title_name: "嚈哒人的回归"
 RICE_hephthalite_legend_new_title_desc: "在不远的过去，就在波斯和印度，白匈奴是一个能止小儿夜啼的名字。[original_culture.GetCollectiveNoun]虽然早已不复存在，但在[founder.GetTitledFirstName]领导下，他们的后代又回来了！而且比之前要更加强大、更加富有、更加恐怖！"
 RICE_hephthalite_legend_chapter_opening_new_title: "帕米尔高原的群山中，生活着[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]人。他们以此为基地，洗劫波斯和印度肥沃的田土、繁华的城市。他们有如天谴般恐怖，便是丝绸之路附近的其他游牧部族亦畏之如虎。人们给[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]人取了很多名字，比如白匈奴。但除[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]以外，又有多少事物能亘古长存？古老的[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]人，终于被敌人击败，成了一盘散沙。"
 RICE_hephthalite_legend_chapter_motivation_new_title: "[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]的后裔啊，一片散沙似乎是他们的命运！他们散落在丝绸之路附近的乡村中，散落在丝绸之路附近的城市里和山脉中，各自为政。乱世，则必出英雄，总是有人没有忘记祖先的荣耀！[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]虽然只是[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]诸部之一的首领，但重建一个属于[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]人帝国的野心之火却从未在[ROOT.Legend.GetProtagonist.GetHerHis]心中熄灭！"
 RICE_hephthalite_legend_chapter_famous_deed_new_title: "虽然在外人眼中，[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]人似乎个个都是凶神恶煞的杀人狂魔，但他们也是商人、城市的建设者和工匠。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]自然不会像外人想象的那样以智慧、商业和科学为耻，相反，[ROOT.Legend.GetProtagonist.GetSheHe|U]鼓励贸易、兴建[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]的[ROOT.Legend.GetProtagonist.GetFaith.HouseOfWorshipPlural]，致力于全面发展。"
 RICE_hephthalite_legend_chapter_extra_deed_new_title: "当然，外界的刻板印象也不是空穴来风。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]毕竟是[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]的后裔，武功当然是[ROOT.Legend.GetProtagonist.GetHerHis]最引以为傲的！无数的部落、无尽的城市、和几乎所有所谓的国王都向[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]臣服纳贡：聪明的人识时务地投降了，因为他们知道抵抗是愚蠢的；而那些不撞南墙不死心的愚者只有洗干净脖子等死这条路可走了！"
 RICE_hephthalite_legend_chapter_conclusion_new_title: "俗话说，冬天总不会是永远的，毕竟春日的温暖终会融化冬日的积雪。雪#italic 终有#!化的一天，就像帕米尔的群山，那里是[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]人的祖地。现在，他们的后裔[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人在[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的带领下，如雪崩般从帕米尔的群山奔腾而下、蔓延开来。然而，就像融化的雪变成了生命之水一样，新的[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]不仅仅有着破坏性的使命，还有着建设性的使命。古老[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]的复兴却在丝绸之路上开创了一个更加繁荣的新时代！"
