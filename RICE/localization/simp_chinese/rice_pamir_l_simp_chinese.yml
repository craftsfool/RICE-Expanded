 pamir.0250.t:0 "收复嚈哒核心区域"
 pamir.0250.desc:0 "他们曾经惧怕我们，称我们为#bold 白匈奴#!。我们确实是一个出身神秘的民族，但在追求荣耀和权力的过程中团结一致。但我们并不是野蛮的征服者；我们鼓励贸易，建造城市，并将我们所统治的许多民族整合成一个有文化、繁荣的王国。然而看看现在嚈哒人吧！我们变成了争吵不休的小酋长，像受惊的羊群一样依附在高原荒野上。\n\n但是现在不是了！我已经开始通过恢复我们对帕米尔高原旧嚈哒国家核心地区统治来恢复并加强我们的身份。我们将不再统治我们昔日辉煌的荒凉废墟！\n\n但仍有许多工作要做。我们需要集中精力扩嚈哒人的影响。但问题是，首先从在哪里开始？"
 pamir.0250.a:0 "北方，去广阔的草原和山脉，我们来自那里！"
 pamir.0250.a.tooltip:0 "如果你或其他统治者后来成功地恢复了嚈哒帝国，你将获得与战争和军事有关的#P 奖励#!。#Bold #X 此选择不可更改，请谨慎选择#!#!"
 pamir.0250.a.tooltip.zunist:0 "如果你或其他统治者后来成功地恢复了嚈哒帝国，你将获得与战争和军事有关的#P 奖励#!，如果你仍然追随[ROOT.Char.GetFaith.GetName]，那么还将获得[GetDoctrineType('rice_zun_hephthalite_warriors_doctrine').GetBaseName][doctrine|E]。#Bold #X 此选择不可更改，请谨慎选择#!#!"
 pamir.0250.b:0 "向南，进入波斯和印度，在那里我们学习贸易和文化。"
 pamir.0250.b.tooltip:0 "如果你或其他统治者后来成功地恢复了嚈哒帝国，你将获得与商业和文化有关的#P 奖励#!。#Bold #X 此选择不可更改，请谨慎选择#!#!"
 pamir.0250.b.tooltip.zunist:0 "如果你或其他统治者后来成功地恢复了嚈哒帝国，你将获得与商业和文化有关的#P 奖励#!，如果你仍然追随[ROOT.Char.GetFaith.GetName]，那么还将获得[GetDoctrineType('rice_zun_hephthalite_culture_doctrine').GetBaseName][doctrine|E]。#Bold #X 此选择不可更改，请谨慎选择#!#!"
 pamir.0251.t:0 "收复嚈哒核心区域"
 pamir.0251.desc.intro:0 "几个世纪以前，嚈哒人在波斯和印度各地给许多人带来了恐惧，赢得了#bold 白匈奴#!的称号。然而时代变了，他们分裂成小规模的残余酋长国，有些远离他们在帕米尔的中心地带。"
 pamir.0251.desc.northern:0 "\n\n然而时局发生了变化。足智多谋的[hephthalite_homeland_reclaimer.GetTitledFirstName]声称[hephthalite_homeland_reclaimer.GetHerselfHimself]继承了嚈哒帝国的遗产，并重新建立了对帕米尔地区的控制。[hephthalite_homeland_reclaimer.GetSheHe|U]已经开始将目光投向北方的大草原，通过战争和力量重建嚈哒帝国，[hephthalite_homeland_reclaimer.GetSheHe]认为这是他们最初力量的来源。虽然有人说这只是垂死的嚈哒人的最后一搏，但其他了解这段历史的人知道得更多——他们恐惧嚈哒帝国卷土重来。"
 pamir.0251.desc.southern:0 "\n\n然而时局发生了变化。足智多谋的[hephthalite_homeland_reclaimer.GetTitledFirstName]声称[hephthalite_homeland_reclaimer.GetHerselfHimself]继承了嚈哒帝国的遗产，并重新建立了对帕米尔地区的控制。[hephthalite_homeland_reclaimer.GetSheHe|U]已经开始将目光投向南方的繁荣城市，通过贸易、艺术和外交来重建嚈哒帝国，虽然有人说这只是垂死的嚈哒人的最后一搏，但其他了解这段历史的人知道得更多——他们恐惧嚈哒帝国卷土重来。"
 pamir.0251.desc.conclusion:0 "\n\n毕竟，冬天不会永远持续下去。春天来了雪就融化了。雪#italic 总是#!会融化。"
 pamir.0251.a:0 "这是嚈哒人的春天吗？"
 pamir.0252.t:0 "重生的嚈哒帝国"
 pamir.0252.desc.intro:0 "他们曾经知道我们是#bold白匈奴#!。作为袭击者、掠夺者、毁灭者。但他们也曾知道我们是商人、工匠、外交官。然后就像这样......伟大的嚈哒帝国逐渐消失了，四分五裂，只在民间传说和学者的著作中被记住。\n\n然而，对我们辉煌的过去的记忆并没有被熄灭。我们在偏远的山区和山谷中以小部族的身份生存下来。在那里，我们重新积累财富，并在帕米尔地区收回了我们的心脏地带。那么现在呢？"
 pamir.0252.desc.northern:0 "\n\n嚈哒帝国重生了，而我已被加冕为大汗。我们不再是逝去的历史，世界将在我们骑兵的马蹄下颤抖，人们将再次对世界各地的嚈哒人发出敬畏的低语。"
 pamir.0252.desc.southern:0 "\n\n嚈哒帝国重生了，而我已被授予沙阿的称号。我们不再是消逝的历史，我们通过贸易、艺术来重现辉煌，再一次让全世界的人们对嚈哒人充满了敬畏。"
 pamir.0252.a:0 "我们从祖先的灰烬中重生！"
 pamir.0253.t:0 "重生的嚈哒帝国"
 pamir.0253.desc.intro:0 "几个世纪前，他们被称为#bold 白匈奴#!并被许多人所惧怕。然后嚈哒帝国在时间长河中消失了，因为它崩溃了，分裂为众多的酋长国。\n\n然而，尽管嚈哒人越来越多地与当地居民同化，但他们仍然记得曾经的荣耀。不久前，他们在帕米尔地区收回古嚈哒帝国的中心地带。现在，他们又迈出了夺回昔日荣耀的一步。"
 pamir.0253.desc.northern:0 "\n\n[hephthalite_emperor.GetTitledFirstName]已经加冕为[hephthalite_emperor.GetHerselfHimself]重生嚈哒帝国的可汗。嚈哒人的力量和影响力再次扩大，现在很明显他们的军队，以令人畏惧的战士的身份接受先祖的遗产。"
 pamir.0253.desc.southern:0 "\n\n[hephthalite_emperor.GetTitledFirstName]已加冕为嚈哒帝国的皇帝。几个世纪以来，嚈哒人学会了在山谷和山区建造繁荣的城市，现在他们打算通过贸易和艺术为未来的繁荣奠定基础。"
 pamir.0253.desc.conclusion:0 "\n\n住在帕米尔高原这样的雪山的人都知道，冬天不会永远持续下去。春天来了，雪已经融化了"
 pamir.0253.a:0 "嚈哒人的一个新春天来临了。"
