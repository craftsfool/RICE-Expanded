 pamir.0101.t:0 "纳西尔·霍斯劳逝世"
 pamir.0101.desc:0 "我收到消息，伟大的[nasir_khusraw.GetFullName]刚刚去世了。他不仅是一位雄辩的诗人和杰出的学者，还是一位圣人，他试图将伊斯兰教（特别是[nasir_khusraw.GetFaith.GetAdjective]教派）的光芒传播到阿富汗东部的[badakhshan_duchy.GetNameNoTier]的土地。正因为如此，他受到了什叶派和逊尼派穆斯林的敬重。\n\n由于[nasir_khusraw.GetFullName]晚年大部分时间都以隐士身份生活在离[badakhshan_county.GetNameNoTier]的亚姆干地区不远的地方，他的追随者将他的尸体带到那里埋葬。他们正在为他建立一个小祠堂，而且已经有消息说，有朝圣者希望前往亚姆干地区向这位受人爱戴的圣人表示敬意。"
 pamir.0101.a:0 "愿真主保佑他"
 pamir.0101.tooltip:0 "随着[nasir_khusraw|E]的去世，[badakhshan_county.GetNameNoTier][county|E]的[ruler|E]可以采取#V 扩建纳西尔·霍斯劳灵寝#!的[decide|E]。一旦完成，居住在[badakhshan_duchy.GetName]或附近的穆斯林将解锁[go_on_a_pilgrimage_to_nasir_khusraws_shrine|E]。"
 pamir.0102.t:0 "纳西尔·霍斯劳灵寝"
 pamir.0102.desc:0 "自从伟大的[nasir_khusraw.GetFullName]去世后，来自各教派（包括什叶派和逊尼派）的穆斯林涌向他的坟墓，向这位诗人、学者和圣人表示敬意。在那里，这些朝圣者受到了激励，通过悼念他而感到更接近真主。他的墓在亚姆干地区附近，该地区位于我在[badakhshan_county.GetNameNoTier]的领土内。\n\n正因为如此，我决定拿出一些资金，在他的坟墓周围建造一个简陋而完善的祠堂。现在他将有一个合适的安息地，而且更符合他的身份。这应该会给这个地区带来更多的朝圣者，并帮助刺激当地的经济，当然这是题外话，毕竟向这位圣人致敬也无妨。"
 pamir.0102.a:0 "我很高兴我能这样做。"
 RICE_pamir_enable_nasir_khusraw_pilgrimage_desc:0 "居住在[badakhshan_county.GetName]或附近的穆斯林现在可以采取[go_on_a_pilgrimage_to_nasir_khusraws_shrine|E]"
 pamir.0103.t:0 "纳西尔·霍斯劳灵寝"
 pamir.0103.desc:0 "自从伟大的[nasir_khusraw.GetFullName]去世后，来自各教派的穆斯林涌向他的坟墓，向这位诗人、学者和圣人表示敬意。在那里，这些朝圣者受到了激励，通过悼念他而感到更接近真主主。他的坟墓位于[badakhshan_county.GetNameNoTier]的亚姆干地区附近，目前由[badakhshan_ruler.GetTitledFirstName]统治。\n\n不管是出于对纳西尔·霍斯劳的真正钦佩，还是一些世俗的目的，[badakhshan_ruler.GetTitledFirstName]已经决定拿出一些资金，在纳西尔·霍斯劳的坟墓周围建造一个简陋而完善的祠堂。这样纳西尔·霍斯劳将有一个适当的安息处，一个适合像他这样受人尊敬的圣人的地方。"
 pamir.0103.a:0 "有趣的消息……"
 pamir.0104.t:0 "如何调和宗教与哲学？"
 pamir.0104.desc:0 "最近，我一直在想我很久之前读到的这首长诗。这首诗是由一位名叫海什木的不起眼的波斯学者写的，诗上提出了一系列具有挑战性的哲学和宗教问题，它让我重新思考自己的信仰。特别是我认为自己是一个受过教育的人，但我很难调和这首诗所讨论的宗教和古典哲学之间的问题。\n\n我决定就这个问题去询问[nasir_khusraw.GetFullName]，因为大家都知道他充满了智慧。事实上我告诉他，我委托他为海什木的诗写一篇回应。令我欣慰的是，他说他愿意做这样一件事。"
 pamir.0104.a:0 "我期待最终的结果！"
 pamir.0105.t:0 "xxxxx"
 pamir.0105.desc:0 "xxxxx"
 pamir.0105.a:0 "xxxxx"
 pamir.0106.opening:0 "对知识分子[ROOT.Char.GetTitleAsNameNoTooltip][ROOT.Char.GetFirstNameNoTooltip]："
 pamir.0106.desc:0 "不久前，你要求我回应你提供海什木的诗中提出的问题。我花了很多晚上思考他提出的问题，并写下我的想法。\n\n我的这份手稿，我称之为#italic 《哲学与宗教的调和》#!，这里面包含了我对这些问题的答案。我希望你在阅读它时，你的疑虑会被消除，你对真主的信仰会得到加强。"
 pamir.0106.a:0 "这是多么引人深思的见解啊！我等不及想要读完了！"
 pamir.0107.t:0 "纳西尔·霍斯劳的遗作"
 pamir.0107.desc:0 "[nasir_khusraw.GetFullName]最近去世了，我们都很难过，因为我不仅失去了一位具有伟大智慧和虔诚的人，也失去了一位挚友。\n\n不久前，我委托他写篇回应海什木的诗中问题的文章，因为海什木的诗让我对自己的信仰和在这个世界上的地位产生了怀疑。如今[nasir_khusraw.GetFullName]已经不在大地上继续指导我了，我是否还能找到我想要的答案....\n\n然而，也许是真主的恩赐，他的一个追随者发现了他去世前正在写的一份手稿。它的标题是#italic 《哲学与宗教的调和》#!，令我感到振奋的是它完美地回答了海什木的诗所提出的问题，这简直就好像[nasir_khusraw.GetFullName]从天堂中向我对话一样!"
 pamir.0107.a:0 "纳西尔·霍斯劳.....我的挚友...现在我的疑虑被消除了，我的思想被照亮了，我对真主的信仰被加强了！"
