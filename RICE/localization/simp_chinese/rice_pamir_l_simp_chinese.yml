 pamir.0029.desc:0 "xxxxx"
 pamir.0029.a:0 "xxxxx"
 pamir.0030.t:0 "温泉之旅"
 pamir.0030.desc:0 "帕米尔山脉有许多温泉，所谓的法蒂玛之泉是该地区比较有名的温泉之一。\n\n它位于瓦罕山谷，以伊斯兰教先知穆罕默德的女儿命名，因为这里的一些穆斯林中存在着将她与之联系起来的传说，以至于现在连非穆斯林都知道它的这个名字。\n\n特别是这里的泉水被认为不仅具有治疗作用，而且还能提高人的生育能力。我决定去拜访这些泉水，放松一下。"
 pamir.0030.a:0 "去温泉咯！"
 pamir.0031.t:0 "法蒂玛"
 pamir.0031.desc:0 "我来到了法蒂玛之泉。温泉本身相当小，而且很偏僻，尽管附近有一些建筑，以方便接待我这样的游客。按照当地的习俗，男人和女人是分开洗澡的，所以我去了温泉的相应部分。\n\n我现在浸泡在温泉里，在这些富含矿物质的水中放松。我想知道关于这些水能提高人的生育能力的传言是否属实？\n\n总之，泡完我就去附近的村庄休息了。"
 pamir.0031.a:0 "到休息时候了"
 pamir.0031.toast.fertile:0 "温泉（据说）可以提高你的生育能力！"
 pamir.0031.toast.normal:0 "温泉似乎并不能提高你的生育能力！"
 pamir.0032.t:0 "法蒂玛之泉"
 pamir.0032.desc:0 "随着最近伊斯兰教的兴起，穆斯林旅行者、商人和冒险家已经走进帕米尔山区。与几个世纪以来在这里生活的许多人一样，穆斯林也很好地利用了该地区的众多温泉。\n\n其中一些穆斯林似乎对一个温泉特别着迷，他们现在称之为法蒂玛之泉并流传着这样的故事：他们的先知穆罕默德的一个女儿曾在某个时候徒步穿过这些温泉。正因为如此，这些泉水不仅开始具有神奇的治疗和药用价值，而且还能提高人的生育能力。\n\n因此这些泉水甚至在非穆斯林当地人中也获得了很大的名气，并开始吸引来自远方的游客。"
 pamir.0032.a:0 "我将挤出一天来拜访它。"
 pamir.0033.t:0 "瓦罕岗哨"
 pamir.0033.desc:0 "横跨帕米尔山脉的瓦罕走廊是丝绸之路重要部分。几个世纪以来，从当地的国王到吐蕃再到唐朝，它们一直在狭窄的长谷中维持着一个防御性的哨岗哨网络，以保护商队并观察邻国军事动向。虽然仍在使用，但这些古老的岗哨已处于年久失修状态，可以使用一些资金来修复和加强它们。"
 pamir.0033.a:0 "花费少量的资金"
 pamir.0033.b:0 "花费适中的资金"
 pamir.0033.c:0 "花费大量的资金"
 pamir.0034.t:0 "喀喇昆仑山岗哨"
 pamir.0034.desc:0 "帕米尔山脉以南的喀喇昆仑山口是丝绸之路重要部分。几个世纪以来，从当地的王国到吐蕃再到唐朝，它们一直在狭窄的长谷中维持着一个防御性的哨岗哨网络，以保护商队并观察邻国军事动向。虽然仍在使用，但这些古老的岗哨已处于年久失修状态，可以使用一些资金来修复和加强它们。"
 pamir.0034.a:0 "花费少量的资金"
 pamir.0034.b:0 "花费适中的资金"
 pamir.0034.c:0 "花费大量的资金"
 pamir.0035.t:0 "准备献祭"
 pamir.0035.desc:0 "根据我们的传统[ROOT.Char.GetFaith.GetAdjective]信仰，山羊被高度重视，甚至被认为是神圣的，因为它们代表着纯洁。这更不用说山羊对我们的生存和繁荣的重要性了，因此作为一个[ROOT.Char.GetTitleAsNameNoTooltip]，将山羊献给上天是我能做的最大的奉献。"
 pamir.0035.a:0 "做好献祭准备"
 pamir.0035.tooltip:0 "你祭祀的山羊数量将决定部族对你的祭祀的看法，且神灵会对数量进行一定的反馈。"
 pamir.0036.t:0 "献祭山羊！"
 pamir.0036.desc.zun:0 "作为一个[ROOT.Char.GetFaith.GetAdjective]，有一个主神[ROOT.Char.GetFaith.HighGodName]，我们主要供奉祂。我们会把山羊带到当地某个比较偏远的山谷或山区的神殿献祭，因为在那里更圣洁，在那里我们可以更接近[ROOT.Char.GetFaith.HighGodName]。"
 pamir.0036.desc.normal:0 "首先我现在需要选择祭祀的神祇。我们将把山羊带到当地供奉该神的神殿，一般是位于较偏远山区的某个地方，那里是圣洁神殿，我们也可以更接近神祇，然后我们将在那里洒下山羊的血。"
 pamir.0036.a:0 "愿[ROOT.Char.GetFaith.HighGodName]接受我的祭品。"
 pamir.0036.b:0 "愿[ROOT.Char.GetFaith.NightGodName]接受我的献祭！"
 pamir.0036.c:0 "愿[ROOT.Char.GetFaith.WealthGodName]接受我的献祭！"
 pamir.0036.d:0 "愿[ROOT.Char.GetFaith.HouseholdGodName]接受我的献祭！"
 pamir.0036.e:0 "愿[ROOT.Char.GetFaith.KnowledgeGodName]接受我的献祭！"
 pamir.0036.f:0 "愿[ROOT.Char.GetFaith.FertilityGodName]接受我的献祭！"
 pamir.0036.nothing:0 "你的献祭似乎不够"
 pamir.0036.nothing.tooltip:0 "唉，你的献祭没有得到任何恩赐。"
 pamir.0036.something:0 "你虔诚的献祭得到了应有的重视！"
 pamir.0037.t:0 "xxxxx"
 pamir.0037.desc:0 "xxxxx"
 pamir.0037.a:0 "xxxxx"
 pamir.0038.t:0 "尊之像"
 pamir.0038.desc:0 "在许久之前，我们的先祖在[zamindawar_county.GetNameNoTier]建造了一个美丽的尊神像，尊日信徒们可以在那里赞美他，并接受居住在那里的祭司的祝福。然而黑暗的日子很快就降临到我们身上，我们作为尊的忠实追随者不得不在阴影中等待，希望有一天他能再次得到适当的膜拜。\n\n今天这个时代已经到来。随着对尊的崇拜在该地区的复兴，我已经拨出资金，组织了一次重建神像的工程。这座巨大而有气势的雕像是由纯金打造的，并配有从波多叉拿偏远的红宝石矿中提取的红宝石作为眼睛。它像以前一样被放置在神圣的朱纳吉尔山上，在那里傲然挺立。"
 pamir.0038.a:0 "赞美尊！"
 pamir.0038.tooltip:0 "现在，[idol_of_zun|E]再次骄傲地矗立在扎明达瓦尔，当地的[zun_idol_restorer.GetFaith.GetAdjective][rulers|E]可以采取#V 向尊献上财富#![decision|E]，并获得[piety|E]、[prestige|E]和[dynasty_prestige|E]加成。"
 pamir.0039.t:0 "夺回阿鲁纳山"
 pamir.0039.desc:0 "几百年前，尊曾经居住在离[kabul_county.GetNameNoTier]不远的阿鲁纳山上。在那里我们有一个壮观的尊神殿，里面有美丽的尊神像，但可惜的是，我们被信仰苏利耶的婆罗门教徒强行赶走。\n\n然而我们现在有机会扭转这一悲剧。对尊的崇拜不仅在恢复，而且在这个地方蓬勃发展，我们尊者再次控制了阿鲁纳山周围的地区。由于我们已经恢复了扎明达瓦尔的朱纳吉尔山的伟大神像，我拨出资金并组织工匠在阿鲁纳山做同样的工作是非常恰当的。与扎明达瓦尔的神像一样，这尊神像也将由黄金打造，并拥有美丽的红宝石眼睛，这些红宝石同样来自波多叉拿的红宝石矿区。"
 pamir.0039.a:0 "为这一胜利而赞美尊。"
 pamir.0039.tooltip:0 "随着新的[idol_of_zun|E]在阿鲁纳山上傲然屹立，当地的[zun_mount_aruna_relcaimer.GetFaith.GetAdjective][rulers|E]可以采取#V 向尊献上财富#!的[decision|E]，并获得[piety|E]、[prestige|E]和[dynasty_prestige|E]加成。与在扎明达瓦尔的决议相比，奖励略有不同。"
 pamir.0040.t:0 "恢复的尊神像"
 pamir.0040.desc:0 "几个世纪以前，尊的神像骄傲地矗立在[zamindawar_county.GetNameNoTier]，作为尊的象征，以及祂的追随者的奉献和虔诚。现在在[zun_idol_restorer.GetTitledFirstName]的努力下，这尊伟大的金色雕像，装饰着来自波多叉拿的红宝石眼睛，已经重新矗立。这无疑是[zun_idol_restorer.GetFaith.GetAdjective]复苏的标志"
 pamir.0040.a:0 "太好了！"
 pamir.0041.t:0 "为尊夺回阿鲁纳山"
 pamir.0041.desc:0 "很久以前，位于[kabul_county.GetNameNoTier]附近的阿鲁纳山，据说是伟大的正义之神尊的居所。可惜的是，祂的追随者被崇拜苏利耶的婆罗门教徒赶出了这座山。然而由于[zun_mount_aruna_relcaimer.GetTitledFirstName]的努力，阿鲁纳山现在再次被[zun_mount_aruna_relcaimer.GetFaith.GetAdjective]牢牢控制，并且在那里竖起了一个新的尊神像。"
 pamir.0041.a:0 "棒极了！"
 pamir.0042.t:0 "对“卡菲勒”的恳求"
 pamir.0042.desc:0 "帕米尔高原和兴都库什山脉凶猛的异教徒被穆斯林称为“卡菲勒”，他们一直坚定地抵抗来自更发达邻国的入侵，甚至那些同为异教徒的人。\n\n不过，该地区的格局正在发生变化，因为有更多像我这样的领主与他们信仰相似，这些卡菲勒部族在这个世界上不再是孤立无援的，我相信我们可以建立一种牢固的关系。我想与一些生活在我名义上统治的领土上的“卡菲勒人”进行谈判，也许能找到一种方法来鼓励他们与邻居融合。"
 pamir.0042.a:0 "与[munjan_county.GetNameNoTier]中的部族进行谈判。"
 pamir.0042.b:0 "与[chitral_county.GetNameNoTier]中的部族进行谈判。"
 pamir.0042.c:0 "与[yasin_county.GetNameNoTier]中的部族进行谈判。"
 pamir.0042.d:0 "与[gilgit_county.GetNameNoTier]中的部族进行谈判。"
 pamir.0042.e:0 "与[golaghmuli_county.GetNameNoTier]中的部族进行谈判。"
 pamir.0043.t:0 "愈合开始了"
 pamir.0043.desc.generic:0 "虽然[shri_badat.GetTitledFirstName]已经不在了，但这个肮脏的食人暴君的遗产仍然毒害着这片土地。他那非自然的、令人毛骨悚然的宫殿仍然矗立在[gilgit_county.GetNameNoTier]。但不再是了!\n\n我召集了一些当地的农民，命令他们带上火把、铲子、锤子和任何他们能找到的工具。一旦聚集了足够多的人，在巨大的酣畅淋漓的欢呼声中，我们向宫殿进军，并迅速用我们的工具将其拆毁。"
 pamir.0043.desc.azur_jamshid:0 "虽然[shri_badat.GetTitledFirstName]已经不在了，但这个肮脏的食人暴君的遗产仍然毒害着这片土地。他那非自然的、令人毛骨悚然的宫殿仍然矗立在[gilgit_county.GetNameNoTier]。但不再是了!\n\n我召集了一些当地的农民，命令他们带上火把、铲子、锤子和任何他们能找到的工具。一旦聚集了足够多的人，在巨大的酣畅淋漓的欢呼声中，我们向宫殿进军，并迅速用我们的工具将其拆毁。\n\n我和我可爱的妻子[nur_bakht.GetTitledFirstName]一起，我们看着宫殿被烧毁。虽然这件事让她很难过，因为[shri_badat.GetTitledFirstName]毕竟是她的父亲，但她告诉我，她明白这是必须要做的。"
 pamir.0043.a:0 "现在这块土地开始慢慢恢复。"
 pamir.0044.t:0 "多赫塔尔·努什尔万"
 pamir.0044.desc:0 "几百年前，在离[bamian_county.GetNameNoTier]不远处统治的当地酋长赞助在科尔姆山谷的一个地方建立了一个岩石神殿群，被称为多赫塔尔·努什尔万。它供奉的是当地的[ROOT.Char.GetFaith.HighGodName]，被称为乌许斯‑尊或瓦赫什‑尊，并有一幅描绘正义之神的美丽壁画，是该地区最大的壁画之一。可惜的是这个曾经美丽岩石雕刻的[ROOT.Char.GetFaith.HighGodName]的崇拜中心已经年久失修。\n\n现在我亲自出面赞助整修，希望恢复这个曾经伟大的神殿，使它能够再次受到尊重，成为[ROOT.Char.GetFaith.HighGodName]的伟大神殿。我聘请了大量有波斯血统的工匠，已经尽最大努力恢复了原作的鲜活风格。"
 pamir.0044.a:0 "一个伟大的工程，我相信[ROOT.Char.GetFaith.HighGodName]会欣赏我的努力。"
 pamir.0045.t:0 "准备祭品"
 pamir.0045.desc:0 "我决定现在是时候以传统的[ROOT.Char.GetFaith.HighGodName]方式向[ROOT.Char.GetFaith.GetAdjective]表示我的虔诚，向正义使者的神像献上一定数量的财富。我需要为我的神像之行做准备。由于我是一个[ROOT.Char.GetTitleAsNameNoTooltip]，这一定会有一个盛大的仪式。"
 pamir.0045.desc.choose:0 "\n\n鉴于有两个伟大的尊神像，一个在扎明达瓦尔，一个在阿鲁纳山上，我也应该做出选择，我想去拜访哪一个神像，并向其供奉。"
 pamir.0045.a:0 "去扎明达瓦尔！"
 pamir.0045.b:0 "去阿鲁纳山！"
 pamir.0045.a.tooltip:0 "虽然你会同时获得[piety|E]和[prestige|E]，但是如果你选择在#V 扎明达瓦尔#!供奉，那么你将会获得更多的#Y 虔诚#!。"
 pamir.0045.b.tooltip:0 "虽然你会同时获得[piety|E]和[prestige|E]，但是如果你选择在#V 阿鲁纳山#!供奉，那么你将会获得更多的#Y 威望#!。"
 pamir.0046.t:0 "财富"
 pamir.0046.desc:0 "既然我已经开始计划前往尊的神像，我也需要确定我将向[ROOT.Char.GetFaith.HighGodName]奉献多少财富。我提供的越多，就越能体现我的虔诚。"
 pamir.0046.a:0 "一个可观但适度的数额就可以了。"
 pamir.0046.b:0 "大量财富"
 pamir.0046.c:0 "巨额财富！！"
 pamir.0046.tooltip:0 "你获得的[piety|E]和[prestige|E]是随机的，但受你奉献的[gold|E]数量的影响（包括你的[traits|E]等其他因素也会影响）。"
 pamir.0047.t:0 "尊之像"
 pamir.0047.desc.zamindawar:0 "最后，我终于来到了存放扎明达瓦尔[ROOT.Char.GetFaith.HighGodName]神像的圣地。这是一个奇妙的、令人敬畏的场景，这个黄金雕像有一双美丽的红宝石眼睛。几乎同样令人敬畏的是围绕着雕像的一大堆黄金和其他财宝，都是别人送的供品。\n\n我打手势让我的仆人把我带来的财富放在神像前。我说了我的祷告，并希望[ROOT.Char.GetFaith.HighGodName]会对我的供品感到满意。"
 pamir.0047.desc.mount_aruna:0 "最后，我终于来到了阿鲁纳山上存放[ROOT.Char.GetFaith.HighGodName]神像的神殿。这是一个奇妙的、令人敬畏的场景，这个黄金雕像有一双美丽的红宝石眼睛。几乎同样令人敬畏的是围绕着雕像的一大堆黄金和其他财宝，都是别人送的供品。\n\n我打手势让我的仆人把我带来的财富放在神像前。我说了我的祷告，并希望[ROOT.Char.GetFaith.HighGodName]会对我的供品感到满意。"
 pamir.0047.a:0 "愿赞美归于[ROOT.Char.GetFaith.HighGodName]，正义的赐予者"
 pamir.0047.message:0 "你的奉献表明你对[ROOT.Char.GetFaith.HighGodName]的虔诚！"
 pamir.0048.t:0 "xxxxx"
 pamir.0048.desc:0 "xxxxx"
 pamir.0048.a:0 "xxxxx"
 pamir.0049.t:0 "室利巴达特的遗产"
 pamir.0049.desc:0 "起初，我也相信这些谎言。但我逐渐明白，[shri_badat.GetFirstName]是一个被误解的人。他知道在这个世界上，#X #bold 权力#!#!和#X #bold 财富#!#!才是最重要的，强权即是真理。杀死他并没有改变这一现实。\n\n有传言说他的灵魂还在这里上空飘荡。有天晚上我梦见他在我耳边低语，告诉我作为一个[ROOT.Char.GetTitleAsNameNoTooltip]如何才能成功。我必须效仿他，拥抱我心中的黑暗。\n\n如今，我已下令翻修他的旧宫，那座宫殿直至现在仍然奇迹般地仍然屹立不倒。我要将恐惧植入这些贱民中，他们会在我面前畏缩，因为他们缺乏力量。只有用力量和恐惧，才能重塑这片土地！！才能彰显我的伟大！！！"
 pamir.0049.a:0 "让所有人在我面前颤抖吧！"
 pamir.0049.tooltip:0 "#Weak 然而......当我拥抱黑暗的时候，我听到一个微弱的声音....“[THIS.Char.GetFirstNameNoTooltip]，[THIS.Char.GetFirstNameNoTooltip]，不要！！”#!"
 pamir.0050.t:0 "着手准备"
 pamir.0050.desc:0 "奇尼尔节是生活在帕米尔高原的许多民族传统节庆，以迎接收获季节的开始，这是一个鼓励社会互动、分享食物和欢乐的节日。节日的日子很快就要到了，我决定今年去见见老百姓，为活动做点贡献"
 pamir.0050.a:0 "马上就要到收获的季节了！"
 pamir.0051.t:0 "收获季"
 pamir.0051.desc:0 "奇尼尔节刚刚开始，我已经到达当地的一个小镇参加庆典。奇尼尔节一个欢乐的时刻，因为它标志着所谓的饥饿月的结束，在收获之前，当地人必须分享互相的食物让大家饱腹。"
 pamir.0051.a:0 "终于到了收获的季节"
 pamir.0052.t:0 "奇尼尔"
 pamir.0052.desc:0 "作为一家之主，我走到田间地头，拿起一小部分收割的大麦，送到当地的磨坊磨成面粉。然后我把这些面粉按仪式抹在我家的柱子上，并把大麦的残余部分绑在#italic chikish#!，即厨房的柱子上。\n\n之后，我和我的整个家庭聚集在一个碗周围，这个碗的名字同样是#italic 奇尼尔（chinir）#!，里面装满了酸奶。我们低下头，向[ROOT.Char.GetFaith.HighGodName]祈祷，念道[ROOT.Char.GetFaith.GetAdjective]。祈祷完后每个人都吃了一点酸奶。"
 pamir.0052.a:0 "新的开始"
 pamir.0053.t:0 "盛大宴会"
 pamir.0053.desc:0 "奇尼尔节的下一部分是一个同性大聚会。作为一个[ROOT.Char.GetWomanMan]，我与部族的其他几个同性别的人，无论高低贵贱都会聚在一起，举办一场盛大的宴会。"
 pamir.0053.a:0 "这些食物闻起来真不错！"
 pamir.0054.t:0 "访问"
 pamir.0054.desc:0 "在奇尼尔节宴席之后，按照惯例，像我这样的[ROOT.Char.GetWomanMan]要去拜访部族里的同性，分享食物，并从每家的Chinir碗里分一些酸奶。我已经拜访了几户人家，还有时间再拜访一户。现在我决定去拜访……"
 pamir.0054.a:0 "谦虚、勤奋的农民"
 pamir.0054.b:0 "勤劳的工匠"
 pamir.0054.c:0 "睿智、能辩的学者"
 pamir.0054.d:0 "强大的本地贵族[ROOT.Char.GetWomanMan]"
 pamir.0055.t:0 "收不收获？"
 pamir.0055.desc:0 "在奇尼尔节结束时，人们习惯于象征性地协助农民收割农作物。毕竟每个人都要展示他们与部族的联系，即使是我，一个[ROOT.Char.GetTitleAsNameNoTooltip]也应该参与其中。反正我也不是在做真正的农活。"
 pamir.0055.a:0 "我不会做贱民的事情！"
 pamir.0055.b:0 "太多工作要忙了……我没时间做这个！"
 pamir.0055.c:0 "简单的帮一下吧，不会帮助太多"
 pamir.0055.d:0 "我想今天一整天都帮助他们。"
 pamir.0056.t:0 "割谷子"
 pamir.0056.desc:0 "在奇尼尔节的协助农民收割仪式中，男女老少都会参加，并且不同性别需要进行不同劳动。男人会用被称为#italic thutr#!的小镰刀割谷子，而女人则把谷杆捆成一捆准备脱粒。我花几个小时做这些事，然后再回到庆祝活动中去。"
 pamir.0056.a.male:0 "帮忙收割是我作为男性应尽的职责。"
 pamir.0056.a.female:0 "捆好谷秆是我作为女性应尽的义务。"
 pamir.0057.t:0 "收获季结束"
 pamir.0057.desc:0 "奇尼尔节终于结束了。我度过了一段美好的时光，我在期间与其他参加活动的人分享了食物，进行了一些愉快的讨论，并留下了快乐的回忆。希望将来我还能再做这样的事。"
 pamir.0057.a:0 "丰收的季节！收获的季节！"
 pamir.0058.t:0 "xxxxx"
 pamir.0058.desc:0 "xxxxx"
 pamir.0058.a:0 "xxxxx"
 pamir.0059.t:0 "最后一口"
 pamir.0059.desc:0 "在奇尼尔节宴席上，食物是在集体的碗里一同分享。我正准备拿起一个碗里的最后一块肉，但另一个人也把手伸去拿了。我们尴尬地看着对方，不知道该怎么做。"
 pamir.0059.a:0 "你拿走吧，享受它，我的朋友。"
 pamir.0059.b:0 "这是属于我的！我是[ROOT.Char.GetTitleAsNameNoTooltip]！"
 pamir.0060.t:0 "分享食物"
 pamir.0060.desc:0 "在奇尼尔节期间，人们习惯于把自己家做的一碗甜麦粥带到宴席上，再加上一些面包和肉类，拿给其他家庭分享。作为部族的领导者，如果我在宴席上表现出慷慨，会给我带来好印象。"
 pamir.0060.a:0 "难道不是他们给我食物吗？"
 pamir.0060.b:0 "我只带了适量的食物来。"
 pamir.0060.c:0 "我为大家带来了很多好吃的东西！"
 pamir.0060.d:0 "我带了这么多食物，真太荒谬了。"
 pamir.0061.t:0 "祈祷还是社交？"
 pamir.0061.desc:0 "部族中较为虔诚信徒们通常会在节日期间口中发出许多祈祷。然而有些人认为这与节日中与部族成员互动和分享的精神相悖。"
 pamir.0061.a:0 "我更喜欢向[ROOT.Char.GetFaith.GetAdjective]祷告。"
 pamir.0061.b:0 "平衡两者我觉得很重要。"
 pamir.0061.c:0 "社交当然重要！不然我们怎么团结其他人！"
 pamir.0062.t:0 "分享就是关怀"
 pamir.0062.desc:0 "在奇尼尔节期间举行主要宴会的原因是鼓励人们之间的分享，并让每个人记住只有人们相互依赖，部族才能生存。现在，宴会上大家聚在一起分享生活中的美好事物。"
 pamir.0062.a:0 "这些是我必须尽力记住的经验。"
 pamir.0063.t:0 "酸牦牛奶酪"
 pamir.0063.desc:0 "#italic 酸牦牛奶酪#!，一种来自帕米尔地区的凝乳奶酪，是一种流行的小吃或配菜，包括在奇尼尔节。在节日前，老年妇女习惯用它来挑逗男人，特别是年轻和新婚的男人，让他们吃很多#italic 酸牦牛奶酪#!，因为人们认为它能增加男人的亲热欲望。"
 pamir.0063.a:0 "我当然会吃一些！"
 pamir.0063.b:0 "我没心情吃"
 pamir.0063.c:0 "我会在这件事上取笑他。"
 pamir.0064.t:0 "摩卡"
 pamir.0064.desc:0 "奇尼尔节宴会上最受欢迎的菜肴之一是#italic 摩卡#!，它是由奶酪凝块与水混合后浇在煮熟的蔬菜上的一道菜。这道菜很受欢迎，因为人们认为它有利于温暖身体，在寒冷的秋冬季节保持人的体力。"
 pamir.0064.a:0 "吃了就觉得暖和了！"
 pamir.0065.t:0 "漂亮的房子"
 pamir.0065.desc:0 "在参加奇尼尔节宴席时，我观察我所在的房子。这所房子的主人按照习俗用谷物来装饰它，让它充满了别致的美感。"
 pamir.0065.a:0 "（带着好奇静静地观察）"
 pamir.0065.b:0 "当着大家的面赞美主人。"
 pamir.0066.t:0 "生命的故事"
 pamir.0066.desc:0 "在奇尼尔节盛宴期间，我与一位与长者进行了一次谈话。我们在交换故事和分享我们对生活的想法时，了解了很多彼此的经历。"
 pamir.0066.a:0 "非常有趣，我的朋友！"
 pamir.0067.t:0 "帮助他人"
 pamir.0067.desc:0 "虽然我很享受奇尼尔节宴席，但不是每个人都能来。那些过于年老体弱或者生病的人，往往由于各种的原因不能到场。因此按照惯例，需要一些人在节日期间自愿为老人和病人送去食物。不过这可能是一件很辛苦的事情，因为我担心如果我帮忙可能会染上别人的病和晦气。"
 pamir.0067.a:0 "希望有人能帮忙，但不是我。"
 pamir.0067.b:0 "我将自愿参加！我必须树立一个榜样。"
 pamir.0067.toast:0 "我染上了一场小病！"
 pamir.0068.t:0 "对话"
 pamir.0068.desc:0 "奇尼尔节期间会见到来自各行各业的不同的人，他们在宴会上高谈论阔，我从这些对话中，以及从偷听到的其他对话中，学到了很多东西。"
 pamir.0068.a:0 "有趣有趣"
 pamir.0069.t:0 "尼根和巴特"
 pamir.0069.desc:0 "我正在享受一些#italic 尼根#!（面粉粥）和#italic 巴特#!（一种奶油）。虽然是一餐简单的饭菜，但对庆祝活动来说是不可或缺的。"
 pamir.0069.a:0 "味道可能很简单，但真的很丰盛而且很好吃！"
 pamir.0069.b:0 "我不爱吃农家饭，但我必须保持威严。"
 pamir.0070.t:0 "昆达"
 pamir.0070.desc:0 "在奇尼尔节的收获季节，妇女和儿童正在将水果收集到篮子里，这些水果将被用于许多方面。例如有些水果会被制成#italic 昆达#!，一种粘稠的水果酱，用于涂抹在各种食物上。村里的一位妇女给了我一些昆达，让我品尝，说实话它很美味。"
 pamir.0070.a:0 "甜入心口！"
 pamir.0071.t:0 "山羊肉"
 pamir.0071.desc:0 "在奇尼尔节期间，每当一个人帮助其家庭以外的人收割谷子时，被帮助的人就会提供一些羊肉给他。现在被帮助的农民也送了一些山羊肉给我。"
 pamir.0071.a:0 "谢谢你！"
 pamir.0072.t:0 "农学"
 pamir.0072.desc:0 "通过在奇尼尔节期间协助农民收割谷物，我对农业和乡村生活的各个方面有了相当的了解。"
 pamir.0072.a:0 "真是读万卷书不如行万里路！"
 pamir.0073.t:0 "拾取树叶"
 pamir.0073.desc:0 "在收获季节，人们习惯于开始采集树叶并将其装入麻袋。然后在冬天，把这些作为动物的饲料。这项工作最早可以在奇尼尔节开始，我想知道我是否应该帮助村里被分配到这项任务的人。毕竟这是一件重要的事情，所以也许我应该做些贡献。"
 pamir.0073.a:0 "当然，为什么不呢？这听起来很有趣"
 pamir.0073.b:0 "高贵之人为何做低贱之事？"
 pamir.0074.t:0 "水果园"
 pamir.0074.desc:0 "在收获季时，妇女和儿童到果园里收集装满水果的篮子。我在旁边仔细的观察了他们，丰满的杏子和桑葚似乎在农村特别受欢迎，可能这是一个更轻松的劳动部分，妇女和儿童在这里慢慢加深彼此间感情。"
 pamir.0074.a:0 "我将观察并享受风景。"
 pamir.0074.b:0 "该帮帮她们了。"
 pamir.0074.c:0 "帮她们，因为我是个男人！"
 pamir.0075.t:0 "杏子"
 pamir.0075.desc:0 "在收获季节，妇女和儿童开始从果园和小树林中收获水果后，人们会在合理的范围内采摘的成熟的水果，当为零食来填肚，这是可以接受的。我看到一个装满杏子的篮子，我很想吃一些。"
 pamir.0075.a:0 "拿一些吧，毕竟我也看饿了！"
 pamir.0075.b:0 "克制自己，浅尝一个"
 pamir.0076.t:0 "xxxxx"
 pamir.0076.desc:0 "xxxxx"
 pamir.0076.a:0 "xxxxx"
 pamir.0077.t:0 "xxxxx"
 pamir.0077.desc:0 "xxxxx"
 pamir.0077.a:0 "xxxxx"
 pamir.0078.t:0 "xxxxx"
 pamir.0078.desc:0 "xxxxx"
 pamir.0078.a:0 "xxxxx"
 pamir.0079.t:0 "xxxxx"
