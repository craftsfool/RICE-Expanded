 activity_RICE_pamir_chinir_festival_conclusion_desc: "今年的[GetActivityType( 'activity_RICE_pamir_chinir_festival' ).GetName]已经告一段落，庆祝丰收的节日是一个如此喜庆、令人兴奋的时刻"
 RICE_pamir_chinir_festival_porridge_amount_none: "绝无"
 RICE_pamir_chinir_festival_porridge_amount_none_desc: "奇尼尔节结束时，没有获得额外的[prestige_i|E][prestige|E]。\n\n#weak 我已经做了很多事情来帮助当地人准备今年的奇尼尔节。为什么他们要指望我提供更多呢？#!"
 RICE_pamir_chinir_festival_porridge_amount_small: "小份"
 RICE_pamir_chinir_festival_porridge_amount_small_desc: "奇尼尔节结束时，额外获得[prestige_i|E]#V 50#!\n\n#weak 在奇尼尔节期间，人们习惯在奇尼尔宴上带着一碗自己家做的甜麦粥，以及一些面包和肉类，与其他家庭分享。#!"
 RICE_pamir_chinir_festival_porridge_amount_medium: "中份"
 RICE_pamir_chinir_festival_porridge_amount_medium_desc: "奇尼尔节结束时，额外获得[prestige_i|E]#V 100#!\n\n#weak 通过在奇尼尔节期间为其他家庭提供适量的粥（以及其他食物），我可以证明自己是一个慷慨和体贴的领主。#!"
 RICE_pamir_chinir_festival_porridge_amount_large: "大份"
 RICE_pamir_chinir_festival_porridge_amount_large_desc: "奇尼尔节结束时，额外获得[prestige_i|E]#V 150#!\n\n#weak 作为这片土地的统治者，我难道没有义务为我子民提供食物吗？奇尼尔节上其他人只管吃！全算我的！#!"
