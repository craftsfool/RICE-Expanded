 pamir.0130.t:0 "着手准备"
 pamir.0130.desc:0 "我已经开始计划到[badakhshan_county.GetNameNoTier]的亚姆干村进行一次简短的朝圣。事实上，我并不是要去亚姆干本身，而是要去它附近的一个圣地——存放着著名的[nasir_khusraw.GetFullName]，伟大的诗人、学者和圣人的坟墓的圣地。尽管他生前是伊斯玛仪派学者，但他仍然受到该地区什叶派和逊尼派穆斯林的敬仰。这里的许多人利用机会参观他的圣地，我也打算这样做。\n\n我希望通过参观这位伟人的圣地，并效仿他，来加强我的信仰，更接近真主。"
 pamir.0130.a:0 "这对我来说将是一个很好的精神之旅"
 pamir.0131.t:0 "去亚姆干"
 pamir.0131.a:0 "向前！向前！向前！"
 pamir.0132.t:0 "到达"
 pamir.0132.desc:0 "经过漫长而艰辛的跋涉，在经过亚姆干村之后，我终于来到了祠堂所在地。与其说这是一个小祠堂，但充其量只是一间简陋的房子，不过我觉得这与纳西尔·霍斯劳的形象完美地契合，因为这里安息的并不是什么富家子弟，而是一位谦逊、仁慈的真主的仆人。\n\n不过，天色已晚，我得先休息一下，明天再进入圣地。考虑到这一点，我沿着土路走到另一栋建筑前，这是一个朝圣者的小屋，旁边是一个食物摊。在那里，我将与其他游客没有任何区别，我的等级、地位、财富，甚至我所信奉的伊斯兰教派都没有任何意义，因为所有教派的穆斯林都认为纳西尔·霍斯劳是个圣人。"
 pamir.0132.a:0 "真主面前众生平等"
 pamir.0133.t:0 "进入祠堂"
 pamir.0133.desc:0 "早晨来临了。今天，我进入纳西尔·霍斯劳灵寝。我首先绕着灵寝走了很多圈，做了各种祈祷。\n\n完成后，我来到里面，看到有几个房间，都和外墙一样看起来很简陋。我从一些人那里听说，这栋建筑据说是纳西尔·霍斯劳居住多年的地方，他在这里写诗之类的。我还注意到墙上有许多切口，这是多年来虔诚的朝圣者留下的证据。\n\n我终于进入了有纳西尔·霍斯劳坟墓的房间，果然还是很简陋的坟墓，但奇怪的是，这使我充满了灵感和喜悦。里面只有几个其他的朝圣者，他们在祷告而无瑕理会我。"
 pamir.0133.a:0 "我在房间里找了个空地。"
 pamir.0134.t:0 "祈祷"
 pamir.0134.desc:0 "在我开始祷告之前，我再次环顾房间，感受一下这个环境。虽然它的外观很简陋，但它仍然装饰得很好，我发现了几个圣物。例如，神龛上有一个香炉和灯，更显眼的是一本据说是由纳西尔·霍斯劳亲手抄写的《古兰经》。\n\n我重新集中注意力，提醒自己，我来这里不是为了欣赏建筑，而是为了崇拜真主，思考纳西尔·霍斯劳的神圣生活和事迹。在我开始祈祷之前，我闭上眼睛休息了一会儿。"
 pamir.0134.a:0 "赞美真主，最仁慈的，最善良的……"
 pamir.0135.t:0 "留下印记"
 pamir.0135.desc:0 "在我离开灵寝之前，我还可以做最后一件事，按照这里的习俗，像我这样的朝圣者会在墙上留下一些文字。有些人嘲笑这是对圣地的涂鸦，但许多人认为这是对他们的访问的一种纪念，对真主和纳西尔·霍斯劳的尊敬，并且寻求的祝福。多年来，有几种不同风格的诗写在墙上。如果我想在这些墙上写点什么，现在正是时候，所以我悄悄地走到我觉得很有吸引力的建筑物的角落，准备写……"
 pamir.0135.a:0 "一首纳西尔·霍斯劳曾经写过的诗"
 pamir.0135.b:0 "创作一首赞美真主，并希望善的胜利的诗"
 pamir.0135.c:0 "关于世俗事务的诗"
 pamir.0135.d:0 "为我的亲友祈祷，特别是为死者祈祷。"
 pamir.0135.e:0 "什么都不写，因为毫无意义，我应该多祷告而不是这样。"
 pamir.0135.message:0 "纳西尔·霍斯劳精神上激励了你！"
 pamir.0136.t:0 "捐赠？"
 pamir.0136.desc:0 "我从灵寝出来，浑身激动的在不停颤抖，头脑中嗡嗡作响，充满了灵感和喜悦。现在我开始准备回家。\n\n然而我记得按照惯例，当富有的或有权势的人访问纳西尔·霍斯劳的祠堂时，他们会在离开前向其他朝圣者（尤其是比他们更不幸的人）施舍和分享食物，以示敬意。作为一个[ROOT.Char.GetTitleAsNameNoTooltip]，也许我应该利用这个机会在离开这里之前展示我的仁慈。"
 pamir.0136.a:0 "我将做一次恰好的施舍和分享。"
 pamir.0136.b:0 "尽可能多地施舍和分享！"
 pamir.0136.c:0 "我为什么要这样做？我已经做了足够的慈善。"
 pamir.0137.t:0 "打道回府"
 pamir.0137.desc:0 "在帕米尔高原崎岖不平的荒野中又跋涉了一段时间后，是时候离开[nasir_khusraw.GetFullName]墓了。我学到了很多，也经历了很多，肯定不会很快忘记这次经历。"
 pamir.0137.a:0 "这就是真主的旨意！这是非常值得的。"
