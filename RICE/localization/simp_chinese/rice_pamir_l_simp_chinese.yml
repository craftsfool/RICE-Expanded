 pamir.0180.t:0 "准备土石岭节"
 pamir.0180.desc:0 "虽然每年初冬都会定期举行土石岭节，而我最近正式资助附近村庄的举办这个节日。对于那些生活在帕米尔地区高处的人来说，特别是在[gilgit_county.GetNameNoTier]附近，这是一个重要的活动，以纪念英雄[azur_jamshid.GetTitledFirstName]的传说，以及他如何推翻了曾经统治和压迫[gilgit_county.GetNameNoTier]人民的食人暴君[shri_badat.GetTitledFirstName]。"
 pamir.0180.a:0 "让我们准备！"
 pamir.0181.t:0 "土石岭节开始"
 pamir.0181.desc:0 "土石岭节快到了！在它开始的前几天，肉已经被腌制并晒干。虽然这个节日是为了庆祝[azur_jamshid.GetTitledFirstName]在[gilgit_county.GetNameNoTier]战胜[shri_badat.GetTitledFirstName]，但这也是一个重要的仪式，确保当地村民有足够的食物度过冬天。"
 pamir.0181.a:0 "我希望今年冬天不要太残酷……"
 pamir.0182.t:0 "大篝火"
 pamir.0182.desc:0 "今天，准确的说是今晚是土石岭节。太阳一落山，许多人就从村子里涌出来，举着火把，哼着歌，把它们扔进一个大篝火里。\n\n相传，残忍的[shri_badat.GetTitledFirstName]有一颗黄油做的心脏，所以为了打败他，[azur_jamshid.GetTitledFirstName]和当地人收集了许多火把，堆在[shri_badat.GetTitledFirstName]居住的宫殿周围，摧毁他的心脏。有人说这杀死了暴君，但还有很多人说这只是削弱了他的力量，让他躲在其中一个山谷里，时不时地用肮脏的咒语来诅咒民众，这就是为什么重新演绎这一事件的必要性。"
 pamir.0182.a:0 "谁知道他是否还活着呢？"
 pamir.0183.t:0 "唱歌和庆祝"
 pamir.0183.desc:0 "当我们都满意地看着大篝火燃烧时，村民们开始唱各种关于[azur_jamshid.GetTitledFirstName]战胜[shri_badat.GetTitledFirstName]的歌曲，其中一些歌曲据说可以追溯到那个时代。例如有一首歌曲，据说是一个村民在[azur_jamshid.GetTitledFirstName]指示他和其他平民摧毁[shri_badat.GetTitledFirstName]的宫殿时唱的。\n\n#italic 室利巴达特曾说：“我天生是坚硬的金属”。\n但我霍托，是农民登·辛格的儿子，是最坚硬的人。\n我用这把铁铲把你的宫殿夷为平地。\n现在请看，虽然你是被诅咒的种族，但你的宫殿已经推平\n我是登·辛格的儿子，比你更坚硬\n因为我用这铁铲铲平你的宫殿。\n小心！小心！#!"
 pamir.0183.a:0 "大家尽情享受吧！"
