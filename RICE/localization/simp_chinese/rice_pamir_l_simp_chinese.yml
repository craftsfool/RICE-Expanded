 pamir.0013.t:0 "精灵王子的故事"
 pamir.0013.desc:0 "[gilgit_county.GetNameNoTier]是一片美丽富饶的土地，但多年来，它被[shri_badat.GetTitledFirstName]的残忍所玷污，他被称为#italic 食人魔#!。我只是众多来自波斯的冒险家之一，许多人试图逃离他的领土，从我们的阿拉伯霸主阿拔斯王朝那里寻求庇护，我只不过是在正确的时间来到正确的地方，毕竟谁能抵挡命运的推动呢？不知何时，我坐在[gilgit_county.GetNameNoTier]的宝座上，被宣布为新的统治者。"
 pamir.0013.a:0 "我是如何卷入这一切的？"
 pamir.0014.t:0 "精灵王子的故事"
 pamir.0014.desc:0 "当我第一次来到[gilgit_county.GetNameNoTier]时，我作为一个卑微的工匠而生活，虽然这与我出身相差甚远。但是过去是过去，在这里，我将过上一种新的、简单的生活。不过命运似乎有所安排。\n\n[shri_badat.GetTitledFirstName]的女儿[nur_bakht.GetTitledFirstName]爱上了我，我也回应了她的感情。与她父亲不同的是，她的心灵是如此纯洁。我们相恋后人们知道了我的身世（有些人甚至认为我是来自天上的精灵王子！），于是恳求我把他们从[shri_badat.GetTitledFirstName]的压迫中解救出来。甚至大臣，[jataylotu.GetTitledFirstName]，也来找我!"
 pamir.0014.a:0 "最后，我回应了他们的请求。"
 pamir.0015.t:0 "精灵王子的故事"
 pamir.0015.desc:0 "虽然我不愿意扮演英雄，但我们夫妻还是一起协力诛杀了[shri_badat.GetTitledFirstName]，彻底终结了他的残暴统治。虽然一些迷信的农民相信他们的前国王有类似女巫的力量，并且还活着，现在只是暂时的躲藏起来，但是[gilgit_county.GetNameNoTier]的新一天已经来临，唉食人暴君对这片土地造成了巨大的伤害，其基础设施和经济也是一塌糊涂。我承认，这是一片我需要了解的土地和民族；在最初的欣喜过后，我必须赢得人民的信任，这样我们才能一起努力将[gilgit_county.GetNameNoTier]恢复到它以前的辉煌。"
 pamir.0015.a:0 "我在波斯学到了很多东西，可以把我祖先的教诲用在这！"
 pamir.0015.b:0 "我将采用这片土地上以前的统治者所遵循的那种佛教。"
 pamir.0015.c:0 "我将在这里适应平民的信仰，皈依他们的崇拜。"
 pamir.0015.d:0 "我寻求了解这个新的信仰——伊斯兰教，也许它能为我们提供答案。"
 pamir.0016.t:0 "精灵王子的子嗣"
 pamir.0016.desc:0 "几百年前，我的祖先[azur_jamshid.GetTitledFirstName]战胜了残忍的食人魔国王[shri_badat.GetTitledFirstName]，在[gilgit_county.GetNameNoTier]这里建立了新的统治王朝。人们仍然非常敬重我的祖先，所以人们定期举行庆祝活动纪念他，纪念推翻暴君的壮举。然而随着来自帕米尔高原和兴都库什山脉以西的强大突厥游牧民族——塞尔柱人和伽色尼人的到来，时代正在发生变化。我们要想生存下去，就必须小心翼翼地行事。"
 pamir.0016.a:0 "维护我祖先的传统将是我们的力量所在！"
 pamir.0016.b:0 "我应该皈依平民的信仰，以接近他们。"
 pamir.0016.c:0 "我们最好适应并理解伊斯兰教，因为它是新崛起的信仰。"
 pamir.0017.t:0 "最后的樽比勒王国血裔"
 pamir.0017.desc:0 "两个多世纪以来，面对穆斯林对扎布列斯坦的入侵，樽比勒人团结曾经争吵不休的部族并进行了顽强的抵抗......直到最近，樽比勒人遇到了毕生对手——强大的[saffarid.GetTitledFirstName]。\n\n虽然击溃强敌后，一些樽比勒人如[RICE_zunbil_cousin.GetFirstName]，还是同意臣服[saffarid.GetFirstName]。还有一些樽比勒人如[RICE_last_zunbil.GetFirstName]，最后一位樽比勒国王的儿子，仍然信仰旧的[RICE_last_zunbil.GetFaith.GetAdjective]，藐视萨法尔王朝的权威，不过被监禁了。\n\n有传言说[RICE_last_zunbil.GetFirstName]逃脱了囚禁，在樽比勒的家乡组建了一支庞大的部队，维持名义上的独立。也有传言说[RICE_zunbil_cousin.GetFirstName]正在等待时机，准备在萨法尔王朝与塔希尔王朝的冲突中纠缠不休的时候造反，毫无疑问这片土地将再次出现战火....\n\n现在人们只能想知道谁才会笑到最后，是臣服于萨法尔的[RICE_zunbil_cousin.GetFirstName]，还是最后樽比勒国王之子[RICE_last_zunbil.GetFirstName]？这是伟大的樽比勒人崛起，还是白匈奴人的谢幕狂欢？"
 pamir.0017.a:0 "我已经选择了我的立场，樽比勒人的命运很快就会被裁定！"
 pamir.0017.info:0 "\n#emphasis 历史背景：#!萨法尔王朝在9世纪中叶试图平定曾经被樽比勒王国统治的土地，但遭到了强烈的抵抗。例如，867年，樽比勒家族的一个后裔，在萨法尔王朝的任命下担任鲁赫哈季（al‑Rukhhaj，即坎大哈）的总督，却发动了叛乱。两年后，869年，阿拉伯史料中称为菲鲁兹·伊本·卡博克的最后一位樽比勒王，逃脱了萨法尔王朝的囚禁，召集了追随者，与穆斯林作战。\n\n樽比勒王国在870年结束了它的历史，当时菲鲁兹被萨法尔王朝的军队击败。"
 pamir.0018.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 pamir.0018.desc:0 "我承认。我没想到能走到这一步。当我开始抵抗萨法尔时，我的主要目标只是确保我们的地位，抵御他们可怕的军队和其他试图消灭我们的敌军。\n\n然而，我们在此见证了樽比勒王国重获新生。敌军丢盔弃甲而尊大获全胜。\n\n未来的征程将充满挑战。我们是一片有着不同起源和背景的土地，有着古老文化和王朝的遗产。然而，我们已经成功地重建了我们的王国，并为繁荣的未来奠定了基础。我们将在这崎岖的山脉和肥沃的山谷中，再次建立起伟大的文明。"
 pamir.0018.a:0 "赞美太阳，正义的赐予者！"
 pamir.0019.t:0 "xxxxx"
 pamir.0019.desc:0 "xxxxx"
 pamir.0019.a:0 "xxxxx"
 pamir.0020.t:0 "勃律勇士"
 pamir.0020.desc:0 "一位名叫[RICE_burusho_warrior_spawn.GetTitledFirstName]的战士，他来自勃律部族，打算效忠于我。勃律人生活在帕米尔高原和喀喇昆仑山中，说着一种不同于其他民族的独特语言。他们是一个与世隔绝的民族，大多独来独往，但以凶猛而顽强的战士著称。"
 pamir.0020.a:0 "欢迎他！他会很好的服务我们！"
 pamir.0020.b:0 "顽固不是好事，我们会礼貌地拒绝。"
 pamir.0021.t:0 "勃律访客"
 pamir.0021.desc:0 "一些属于勃律氏族的人来到我的宫廷，打算效忠于我。他们的名字是[RICE_burusho_courtier_spawn_1.GetTitledFirstName]和[RICE_burusho_courtier_spawn_2.GetTitledFirstName]。勃律人生活在帕米尔高原和喀喇昆仑山中，说着一种不同于其他民族的独特语言。他们是一个与世隔绝的民族，大多独来独往，但以凶猛而顽强的战士著称。让来自这样部族的人向我效忠这是一件好事吗……"
 pamir.0021.a:0 "欢迎他们来到我们的宫廷。他们会提供很大的帮助！"
 pamir.0021.b:0 "凶猛和坚韧？听起来很危险。算了吧"
 pamir.0022.t:0 "卡菲里斯坦的勇士"
 pamir.0022.desc:0 "一位名叫[RICE_kafir_warrior_spawn.GetTitledFirstName]的异教徒战士，他来自所谓的卡菲里斯坦（异教徒土地）的一个部落，这是一个位于阿富汗和克什米尔之间的山区，他已经来到我的宫廷，打算效忠于我。居住在这些原始山谷和高地的这些部落因强烈抵抗其他宗教信徒（无论是穆斯林、佛教徒、印度教、祆教等）的任何影响或占领而臭名昭著。让一个来自这样一个部落的战士向我效忠这是一件好事吗……"
 pamir.0022.a:0 "我很高兴他们效忠于我而不是与我作对！"
 pamir.0022.b:0 "我不需要心怀鬼胎异教徒效忠……"
 pamir.0023.t:0 "卡菲里斯坦的访客"
 pamir.0023.desc:0 "有几个人属于所谓的卡菲里斯坦（异教徒的土地）的一个部落，该地区位于阿富汗和克什米尔之间的山区，他们来到我的宫廷，打算效忠于我。他们的名字是[RICE_kafir_courtier_spawn_1.GetTitledFirstName]和[RICE_kafir_courtier_spawn_2.GetTitledFirstName]。居住在这些原始山谷和高地的这些部落因强烈抵抗其他宗教信徒（无论是穆斯林、佛徒、印度教、祆教等）的任何影响或占领而臭名昭著。让来自这样部族的人向我效忠这是一件好事吗……"
 pamir.0023.a:0 " 欢迎他们来到我的宫廷。"
 pamir.0023.b:0 "我没有兴趣让他们留在身边。"
 pamir.0024.t:0 "布拉灰人勇士"
 pamir.0024.desc:0 "一个名叫[RICE_brahui_warrior_spawn.GetTitledFirstName]的勇士来到我的宫廷，打算效忠于我。布拉灰人是一群大多为游牧或半游牧的部落，据说他们在几代人之前就迁移到了俾路支省。他们是一个分裂的、分散的群体，没有统一在任何领袖之下，尽管他们有时会与周围更多的定居民族进行交流。让一个来自这样一个部落的战士向我效忠这是一件好事吗... "
 pamir.0024.a:0 "我想我可以很好地利用这个人。"
 pamir.0024.b:0 "我不需要不可靠的游牧民族。"
 pamir.0025.t:0 "布拉灰部族访客"
 pamir.0025.desc:0 "几个来自布拉灰部族的部落成员来到我的宫廷，打算效忠于我。他们的名字是[RICE_brahui_courtier_spawn_1.GetTitledFirstName]和[RICE_brahui_courtier_spawn_2.GetTitledFirstName]。布拉灰人是一群主要为游牧或半游牧的部落，据说他们在几代人之前就迁移到了俾路支省。他们是一个分裂的、分散的群体，没有统一在任何领袖之下，尽管他们有时会与周围的定居民族进行交流。让来自这样一个部落的人向我效忠这是一件好事吗……"
 pamir.0025.a:0 "欢迎！我需要各种人才！"
 pamir.0025.b:0 "分散的野蛮人？不感兴趣。"
 pamir.0026.t:0 "xxxxx"
 pamir.0026.desc:0 "xxxxx"
 pamir.0026.a:0 "xxxxx"
