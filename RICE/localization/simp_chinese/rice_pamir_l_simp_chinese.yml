 k_hephthalite_restored:0 "嚈哒王国"
 k_hephthalite_restored_adj:0 "嚈哒"
 trait_RICE_hephthalite_emperor_khan:0 "白可汗"
 trait_RICE_hephthalite_emperor_khan_desc:0 "该角色是恢复嚈哒帝国的现任可汗，继承了嚈哒帝国分散的残部战士，这些战士仍然继续让丝绸之路上的许多人心生恐惧。"
 trait_RICE_hephthalite_emperor_khan_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是恢复嚈哒帝国的现任可汗，继承了嚈哒帝国分散的残部战士，这些战士仍然继续让丝绸之路上的许多人心生恐惧。"
 trait_RICE_hephthalite_emperor_shah:0 "白匈奴沙阿"
 trait_RICE_hephthalite_emperor_shah_desc:0 "该角色是恢复后嚈哒帝国的现任可汗，其继承了一个强大而繁荣的王国的遗产，他不仅擅长战争，而且还擅长贸易、文化和城市建设。"
 trait_RICE_hephthalite_emperor_shah_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是恢复嚈哒帝国的现任可汗，继承了嚈哒帝国分散的残部战士，这些战士仍然继续让丝绸之路上的许多人心生恐惧。"
 game_concept_pilgrimage_to_nasir_khusraws_shrine:0 "纳西尔·霍斯劳灵寝朝圣"
 game_concept_go_on_a_pilgrimage_to_nasir_khusraws_shrine:0 "前往纳西尔·霍斯劳灵寝朝圣"
 game_concept_pilgrimage_to_nasir_khusraws_shrine_desc:0 "穆斯林角色可以在波多叉拿地区中进行[GetActivityType( 'activity_RICE_pamir_nasir_khusraw_pilgrimage' ).GetName]活动\n\n最初，该[activity|E]是不可用的，因为纳西尔·霍斯劳还活着。然而，一旦他去世，[GetModifier('RICE_pamir_nasir_khusraw_shrine').GetNameWithTooltip][county_modifier|E]将出现在波多叉拿[county|E]，并启用这一活动。\n\n在前往纳西尔·霍斯劳墓朝圣时，你可能会得到各种好处，比如[character_modifiers|E]，但如果你信仰#V 伊斯玛仪派#!会获得更多。"
 game_concept_repair_the_pamir_watchposts:0 "修复岗哨"
 game_concept_repair_singular_pamir_watchposts:0 "修复"
 game_concept_repair_past_tense_pamir_watchposts:0 "已修复"
 game_concept_repair_the_pamir_watchposts_desc:0 "这个[counties|E]在#V 瓦罕走廊#!和#V 吉尔吉特#!位于帕米尔山脉之中，有一个独特的[county_modifier|E]代表分散在崎岖偏远地形上的岗哨网络。如果你拥有这些[counties|E]中的一个或两个，你将获得一个[decision|E]去$game_concept_repair_the_pamir_watchposts$，这将获得另一个特殊的[county_modifier|E]从而提供军事奖励以及[control|E]和[development|E]加成。"
 game_concept_nasir_khusraw:0 "纳西尔·霍斯劳"
 game_concept_nasir_khusraw_s:0 "纳西尔·霍斯劳"
 game_concept_nasir_khusraw_desc:0 "$game_concept_nasir_khusraw$是一个[character|E]，他历史上生活在公元1004年至1080年左右。他是一位著名的诗人、圣人和伊斯玛仪派学者和传教士，被认为为波多叉拿的伊斯兰化奠定了基础。尽管他信仰什叶派分支之一，但他也受到逊尼派的尊敬。\n\n在游戏中他出现在1066年剧本中，而如果你从 867 年剧本开始，他将在公元1000年的某个时候在波多叉拿的一个穆斯林领土出生。如果他在波多叉拿一位穆斯林[ruler|E]的[court|E]，该[ruler|E]可以[decide|E]委托#V 协调哲学和宗教#!（前提是他还活着）。\n\n只要纳西尔·霍斯劳去世，同一位统治者采取[decide|E]委托 #V 修建纳西尔·霍斯劳灵寝#!。在修建过程中，波多叉拿或附近的所有穆斯林都可以获得进行[GetActivityType( 'activity_RICE_pamir_nasir_khusraw_pilgrimage' ).GetName][activity|E]。"
 game_concept_azur_jamshid:0 "阿苏尔·贾姆希德"
 game_concept_azur_jamshid_s:0 "阿苏尔·贾姆希德的"
 game_concept_azur_jamshid_desc:0 "$game_concept_azur_jamshid$是一位#V 吉尔吉特#!的传奇[ruler|E]，传说在克什米尔，一位从天而降的王子杀死了食人暴君室利巴达特，建立了卡亚尼王朝，后来被称为特拉坎人。要在867年开局时扮演他，请在区域中选择一个[ruler|E]以获得弹出事件,他有几个特点。\n\n首先，你可以选择在游戏开始时皈依佛教或伊斯兰教，或者保持祆教徒的身份。在现实生活中，特拉罕人可能是突厥人（或突厥化的当地人），直到中世纪晚期才皈依伊斯兰教。\n\n其次，在游戏开始时，吉尔吉特的[county|E]有一个[county_modifier|E]，传说中#V 室利巴达特宫#!会产生一些不好的负面影响，就像在传说中一样，作为$game_concept_azur_jamshid$或他的继任者，你需要采取[decision|E]来摧毁它。\n\n一旦你摧毁了宫殿，并且$game_concept_azur_jamshid$已经去世，那么任何帕米尔[duchy|E]的[ruler|E]都将可以举办[GetActivityType( 'activity_RICE_pamir_tumshiling_festival' ).GetName][activity|E]。"
 game_concept_idol_of_zun:0 "尊之像"
 game_concept_idols_of_zun:0 "尊之像"
 game_concept_restore_the_idol_of_zun:0 "修复尊之像"
 game_concept_idol_of_zun_desc:0 "历史资料提到在#V 扎明达瓦尔#!，并且存在一个$game_concept_idol_of_zun$，它是一个巨大的金色雕像，装饰着红宝石的眼睛。在这里，尊的追随者会来这里向他们的最高神致敬，其起源不确定，在学术界有争议，各种理论表明尊的起源可能是印度教、祆教、白匈奴和印度—伊朗土著（或其某种组合）。在迦布罗附近的#V 阿鲁纳山上#!，可能还有另一个尊的主要崇拜场所。\n\n作为一个信仰尊的[ruler|E]，你可以选择采取[decision|E]，在扎明达瓦尔里#V 恢复尊的神像#!。这样做为扎明达瓦尔获得一个[county_modifier|E]，并给你一个[character_modifier|E]，除其他外，使你更容易改革[faith|E]。并且获得一个[decision|E]在迦布罗的阿鲁纳山上的神像也得以恢复。\n\n一旦神像恢复，你和附近的其他尊信仰[rulers|E]就可以举办[GetActivityType( 'activity_RICE_pamir_offer_riches_to_zun' ).GetName][activity|E]。"
 building_type_RICE_pamir_lapis_lazuli_mines_01:0 "萨里桑青金矿"
 building_type_RICE_pamir_lapis_lazuli_mines_01_desc:0 "该地区是著名的萨里桑青金矿山的所在地。几个世纪以来，它生产了世界上绝大多数的青金石，这是一种美丽的蓝色石头，自古以来就受到世界各地文化的高度重视。"
 building_RICE_pamir_lapis_lazuli_mines_01:0 "青金石采矿定居点"
 building_RICE_pamir_lapis_lazuli_mines_01_desc:0 "萨里桑在山谷中的一些小型定居点是矿工的家园，他们日夜在这个世界上青金石的主要来源地辛勤工作。"
 building_RICE_pamir_lapis_lazuli_mines_02:0 "青金石矿"
 building_RICE_pamir_lapis_lazuli_mines_02_desc:1 "这里的采矿作业变得更加复杂，大量的青金石正在出口。已聘请工程师来改善矿山的生产，商人已开设商店以加快青金石的运输。"
 building_RICE_pamir_lapis_lazuli_mines_03:0 "大型青金石矿"
 building_RICE_pamir_lapis_lazuli_mines_03_desc:0 "该地区的村庄为世界市场生产大量青金石，为该地区带来了大量财富。"
 building_RICE_pamir_lapis_lazuli_mines_04:0 "青金石采矿综合镇"
 building_RICE_pamir_lapis_lazuli_mines_04_desc:0 "这个地区的聚居地其规模和人口是自古代法老和凯撒时代以来从未见过的，为世界开采了大量的青金石。"
 building_type_RICE_pamir_ruby_mines_01:0 " 库伊拉红宝石矿"
 building_type_RICE_pamir_ruby_mines_01_desc:0 "该地区是库伊拉红宝石矿的所在地，该矿脉已活跃了多个世纪。"
 building_RICE_pamir_ruby_mines_01:0 "红宝石矿场"
 building_RICE_pamir_ruby_mines_01_desc:0 "当地山谷中的一些小定居点是矿工的家园，他们日夜辛勤地开采红宝石。"
 building_RICE_pamir_ruby_mines_02:0 "红宝石矿脉"
 building_RICE_pamir_ruby_mines_02_desc:1 "这里的采矿作业变得越来越复杂，出口的红宝石数量也越来越多。工程师们被引进来改善矿山的生产，商人也开设了商店以加快红宝石的运输。"
 building_RICE_pamir_ruby_mines_03:0 "大型红宝石矿脉"
 building_RICE_pamir_ruby_mines_03_desc:0 "该地区的村庄为世界市场生产大量红宝石，为该地区带来大量财富。"
 building_RICE_pamir_ruby_mines_04:0 "红宝石采矿综合镇"
 building_RICE_pamir_ruby_mines_04_desc:0 "该地区规模庞大且繁荣的定居点开采了大量的红宝石，这些红宝石出口到世界各地的市场。"
 building_type_RICE_pamir_khewra_salt_mines_01:0 "克乌拉盐矿"
 building_type_RICE_pamir_khewra_salt_mines_01_desc:0 "克乌拉盐矿是旁遮普盐区的一个主要盐矿，以生产粉红色的喜马拉雅盐而闻名。"
 building_RICE_pamir_khewra_salt_mines_01:0 "盐矿镇"
 building_RICE_pamir_khewra_salt_mines_01_desc:0 "在这里发现的盐矿附近存在许多定居点，此时定居者采集的盐量相对较少。"
 building_RICE_pamir_khewra_salt_mines_02:0 "盐矿"
 building_RICE_pamir_khewra_salt_mines_02_desc:1 "盐矿开采开始扩大，盐的采购量也在增加。一个适当带有隧道的采矿系统正在开始形成。"
 building_RICE_pamir_khewra_salt_mines_03:0 "大型盐矿"
 building_RICE_pamir_khewra_salt_mines_03_desc:0 "随着这里采矿需求的增长，对额外基础设施、住房等的需求也在增加。商人也开始在这里扩大业务。"
 building_RICE_pamir_khewra_salt_mines_04:0 "大型综合盐矿镇"
 building_RICE_pamir_khewra_salt_mines_04_desc:0 "有一个大型、组织良好的采矿综合镇，每天都在这里开采大量的盐。天下各处的商人汇聚此处来采购这种盐。"
 RICE_pamir_land_of_the_kafirs:0 "卡菲勒人之地"
 RICE_pamir_land_of_the_kafirs_desc:0 "几代人以来，该地区的一些山谷和山口居住着各种异教部落，这些部落强烈抵制分别来自有组织的佛教、祆教、印度教或穆斯林征服州。他们是如此凶猛，以至于他们经常从非异教徒的邻居们那里定期索要贡品。明智的统治者通常不会打扰他们，因此他们古老的生活方式大多不受干扰。总而言之，阿富汗、印度北部和吐蕃之间的这些高地被穆斯林嘲笑为“卡菲勒斯坦”，即异教徒的土地。"
 RICE_pamir_nasir_khusraw:0 "纳西尔·霍斯劳"
 RICE_pamir_nasir_khusraw_desc:0 "纳西尔·霍斯劳被广泛认为是波斯最伟大的诗人之一。虽然他最初是一名塞尔柱官员，过着奢华、颓废的生活方式，后来他有一个梦想，改变了他对世界的看法。经过一些考验和磨难，以及多次前往麦加朝圣，他成为波斯诗人，哲学家，伊斯玛仪派学者，旅行者和最伟大的文学家之一"
 RICE_pamir_wakhan_watchposts_default:0 "瓦罕走廊的岗哨"
 RICE_pamir_wakhan_watchposts_default_desc:0 "几个世纪以来，瓦罕走廊沿线的岗哨网络一直被各种势力使用，包括当地统治者以及吐蕃和中华帝国。他们守卫着丝绸之路沿线的几个关键关口和路线，以确保该地区的安全和繁荣。"
 RICE_pamir_karakoram_watchposts_default:0 "喀喇昆仑山脉的岗哨"
 RICE_pamir_karakoram_watchposts_default_desc:0 "几个世纪以来，喀喇昆仑山脉的哨所网络一直被各种势力使用，包括当地统治者以及吐蕃和中华帝国。他们守卫着丝绸之路沿线的几个关键关口和路线，以确保该地区的安全和繁荣。"
 RICE_pamir_visited_bibi_fatima_fertility:0 "法蒂玛之泉提高了生育能力"
 RICE_pamir_visited_bibi_fatima_fertility_desc:0 "该角色最近去了帕米尔山脉的法蒂玛之泉。就像很多当地的民间传说所说的那样，在水中沐浴可以提高此人的生育能力。"
 RICE_pamir_visited_bibi_fatima_fertility_muslim:0 "法蒂玛之泉提高了生育能力"
 RICE_pamir_visited_bibi_fatima_fertility_muslim_desc:0 "该穆斯林（或曾经的穆斯林）角色最近去了帕米尔山脉的法蒂玛之泉。就像很多当地的民间传说所说的那样，在水中沐浴可以提高此人的生育能力。"
 RICE_pamir_brahui_tribes:0 "布拉灰人部落"
 RICE_pamir_brahui_tribes_desc:0 "布拉灰人是一个讲达罗毗荼语系的游牧和半游牧部落群体，许多世代前移居到这个地区。他们有自己的传统和习俗，当地统治者通常建立羁縻统治。"
 RICE_pamir_wakhan_recently_repaired_small:0 "最近对瓦罕岗哨的小规模修复"
 RICE_pamir_wakhan_recently_repaired_medium:0 "最近对瓦罕岗哨的大规模修复"
 RICE_pamir_wakhan_recently_repaired_large:0 "最近对瓦罕岗哨的重新翻修"
 RICE_pamir_karakoram_recently_repaired_small:0 "最近对喀喇昆仑岗哨的小规模修复"
 RICE_pamir_karakoram_recently_repaired_medium:0 "最近对喀喇昆仑岗哨的大规模修复"
 RICE_pamir_karakoram_recently_repaired_large:0 "最近对喀喇昆仑岗哨的重新翻修"
 RICE_pamir_nasir_khusraw_shrine:0 "纳西尔·霍斯劳灵寝"
 RICE_pamir_nasir_khusraw_shrine_desc:0 "在著名的伊斯玛仪派圣人、学者和诗人纳西尔·霍斯劳的坟墓周围建造了一座相当大的神殿。各教派穆斯林来此朝觐，瞻仰他，反思自己的精神历程。"
 RICE_pamir_illuminated_by_nasir_khusraw:0 "受纳西尔·霍斯劳启示"
 RICE_pamir_illuminated_by_nasir_khusraw_desc:0 "该角色不再怀疑他们的信仰。伟大的诗人、学者和圣人纳西尔·霍斯劳应他们的要求写了一本名为《哲学与宗教的调和》的文本，以回答他们对宇宙提出的一些具有挑战性的问题。"
 RICE_pamir_nasir_khusraw_final_work:0 "完成最终作品"
 RICE_pamir_nasir_khusraw_final_work_desc:0 "经过一生的精神崇拜、指导和教导，伟大的诗人和学者纳西尔·霍斯劳正在努力写作，这可能是他最终的文学成就。"
 RICE_pamir_zun_blessing_small:0 "尊神的祝福（小）"
 RICE_pamir_zun_blessing_small_desc:0 "他们说该角色得到了正义者尊的小祝福！"
 RICE_pamir_zun_blessing_medium:0 "尊神的祝福（重要）"
 RICE_pamir_zun_blessing_medium_desc:0 "他们说该角色得到了正义者尊的重要祝福！"
 RICE_pamir_zun_blessing_large:0 "尊神的祝福（巨大）"
 RICE_pamir_zun_blessing_large_desc:0 "他们说该角色得到了正义尊者的极大祝福！"
 RICE_pamir_dezaw_blessing_small:0 "德佐的祝福（小）"
 RICE_pamir_dezaw_blessing_small_desc:0 "他们说该角色从伟大的造物之神德佐那里得到了小​​小的祝福。"
 RICE_pamir_dezaw_blessing_medium:0 "德佐的祝福（重要）"
 RICE_pamir_dezaw_blessing_medium_desc:0 "他们说该角色从伟大的造物之神德佐那里得到了重大祝福。"
 RICE_pamir_dezaw_blessing_large:0 "德佐的祝福（极大）"
 RICE_pamir_dezaw_blessing_large_desc:0 "他们说该角色从伟大的造物之神德佐那里得到了极大的祝福。"
 RICE_pamir_mahandeo_blessing_small:0 "马汉多的祝福（小）"
 RICE_pamir_mahandeo_blessing_small_desc:0 "他们说该角色从看守庄稼的战神马汉多那里得到了小​​小的祝福。"
 RICE_pamir_mahandeo_blessing_medium:0 "马汉多的祝福（重大）"
 RICE_pamir_mahandeo_blessing_medium_desc:0 "他们说该角色从看守庄稼的战神马汉多那里得到了重大的祝福。"
 RICE_pamir_mahandeo_blessing_large:0 "马汉多的祝福（极大）"
 RICE_pamir_mahandeo_blessing_large_desc:0 "他们说该角色从看守庄稼的战神马汉多那里得到了极大的祝福。"
 RICE_pamir_indra_blessing_small:0 "英德拉的祝福（小）"
 RICE_pamir_indra_blessing_small_desc:0 "他们说该角色得到了神牛之主、彩虹之王英德拉的小小祝福。"
 RICE_pamir_indra_blessing_medium:0 "英德拉的祝福（重大）"
 RICE_pamir_indra_blessing_medium_desc:0 "他们说该角色得到了神牛之主、彩虹之王英德拉的重大祝福。"
 RICE_pamir_indra_blessing_large:0 "英德拉的祝福（极大）"
 RICE_pamir_indra_blessing_large_desc:0 "他们说该角色得到了神牛之主、彩虹之王英德拉极大的祝福。"
 RICE_pamir_dezalik_blessing_small:0 "德扎莉克的祝福（小）"
 RICE_pamir_dezalik_blessing_small_desc:0 "他们说该角色从德佐之妹、妇孺与壁炉守护者德扎莉克那里得到了小​​小的祝福。"
 RICE_pamir_dezalik_blessing_medium:0 "德扎莉克的祝福（重大）"
 RICE_pamir_dezalik_blessing_medium_desc:0 "他们说该角色从德佐之妹、妇孺与壁炉守护者德扎莉克那里得到了重大的祝福。"
 RICE_pamir_dezalik_blessing_large:0 "德扎莉克的祝福（极大）"
 RICE_pamir_dezalik_blessing_large_desc:0 "他们说该角色从德佐之妹、妇孺与壁炉守护者德扎莉克那里得到了极大的祝福。"
 RICE_pamir_balumain_blessing_small:0 "巴鲁曼的祝福（小）"
 RICE_pamir_balumain_blessing_small_desc:0 "他们说该角色得到了巴鲁曼小小的祝福，巴鲁曼是一位教导人类如何生活和做礼拜的英雄。"
 RICE_pamir_balumain_blessing_medium:0 "巴鲁曼的祝福（重大）"
 RICE_pamir_balumain_blessing_medium_desc:0 "他们说该角色得到了巴鲁曼重大的祝福，巴鲁曼是一位教导人类如何生活和做礼拜的英雄。"
 RICE_pamir_balumain_blessing_large:0 "巴鲁曼的祝福（极大）"
 RICE_pamir_balumain_blessing_large_desc:0 "他们说该角色得到了巴鲁曼极大的祝福，巴鲁曼是一位教导人类如何生活和做礼拜的英雄。"
 RICE_pamir_jestak_blessing_small:0 "耶丝塔珂的祝福（小）"
 RICE_pamir_jestak_blessing_small_desc:0 "他们说该角色得到了家庭与婚姻女神耶丝塔珂的小小的祝福。"
 RICE_pamir_jestak_blessing_medium:0 "耶丝塔珂的祝福（重大）"
 RICE_pamir_jestak_blessing_medium_desc:0 "他们说该角色得到了家庭与婚姻女神耶丝塔珂重大的祝福。"
 RICE_pamir_jestak_blessing_large:0 "耶丝塔珂的祝福（极大）"
 RICE_pamir_jestak_blessing_large_desc:0 "他们说该角色得到了家庭与婚姻女神耶丝塔珂极大的祝福。"
 RICE_pamir_recently_attended_chinir:0 "最近参加了奇尼尔节"
 RICE_pamir_recently_attended_chinir_desc:0 "这是一个丰收的季节！"
 RICE_pamir_recently_attended_chawmos:0 "最近参加了乔莫斯节"
 RICE_pamir_nasir_khusraw_inspiration_diplomatic:0 "纳西尔·霍斯劳的精神启迪（外交）"
 RICE_pamir_nasir_khusraw_inspiration_martial:0 "纳西尔·霍斯劳的精神启迪（军事）"
 RICE_pamir_nasir_khusraw_inspiration_stewardship:0 "纳西尔·霍斯劳的精神启迪（管理）"
 RICE_pamir_nasir_khusraw_inspiration_intrigue:0 "纳西尔·霍斯劳的精神启迪（谋略）"
 RICE_pamir_nasir_khusraw_inspiration_learning:0 "纳西尔·霍斯劳的精神启迪（学识）"
 RICE_pamir_nasir_khusraw_pilgrimage_done:0 "前往纳西尔·霍斯劳灵寝朝圣"
 RICE_pamir_chailaksambaik:0 "柴拉克桑巴克"
 RICE_pamir_chailaksambaik_desc:0 "这个孩子最近完成了柴拉克桑巴克仪式，这是欢迎他们成年后进入社会的一个步骤。"
 RICE_pamir_butsambaik:0 "布桑拜克"
 RICE_pamir_butsambaik_desc:0 "这个孩子最近完成了布桑拜克仪式，这是欢迎他们成年后进入社会的一个步骤。"
 RICE_pamir_chawmos_fox_good:0 "狐狸发现上坡路"
 RICE_pamir_chawmos_fox_good_desc:0 "最近在这里举行的乔莫斯节期间，发现一只狐狸正在上山，这意味着该地区有一段时间的好运。"
 RICE_pamir_chawmos_fox_bad:0 "狐狸发现下坡路"
 RICE_pamir_chawmos_fox_bad_desc:0 "最近在这里举行的乔莫斯节期间，发现一只狐狸正在下山，预示着该地区有一段时间不好运。"
 RICE_pamir_recently_organized_chawmos:0 "最近举办了一次乔莫斯节"
 RICE_pamir_zun_idol_is_restored:0 "尊之像"
 RICE_pamir_zun_idol_is_restored_desc:0 "该地区的尊教教徒建造了一个巨大黄金尊之像，上面布满了美丽的红宝石眼睛，取自波多叉拿的红宝石矿。"
 RICE_pamir_restored_zun_idol:0 "恢复了尊的神像"
 RICE_pamir_ali_ibn_asad_converted:0 "伊斯兰教的守护者"
 RICE_pamir_ali_ibn_asad_converted_desc:0 "阿里·伊本·阿萨德作为一个统治者，一直在努力保护伊斯玛仪派不受其他伊斯兰教派的影响。他已经成为一名坚定的信徒，并且以其知识分子的眼光，成为纳西尔·霍斯劳等伊斯玛仪派传教士和思想家的重要赞助人。"
 RICE_pamir_ali_ibn_asad_unconverted:0 "思想开放的埃米尔"
 RICE_pamir_ali_ibn_asad_unconverted_desc:0 "阿里·伊本·阿萨德被认为是一个在教派纷争的时代相当宽容的领导人。作为一个统治者，他为任何希望在他的土地上安家的穆斯林，无论是逊尼派还是什叶派，都提供便利，并尊重不同出身的学者。"
 RICE_pamir_purity_of_youth:0 "青春的纯洁"
 RICE_pamir_purity_of_youth_desc:0 "对于那些追随这个的宗教的人来说，青春期前是纯洁的象征，是神圣的。是可以亲眼目睹宇宙仁慈的活生生的化身是何等的敬畏！"
 RICE_pamir_collected_juniper:0 "收集了一些桧柏"
 RICE_pamir_nomad_clans_good:0 "游牧民族最近迁入"
 RICE_pamir_nomad_clans_good_desc:0 "一些游牧部落最近迁徙到帕米尔山脉一带。他们与当地人相处融洽，为当地做出贡献。"
 RICE_pamir_nomad_clans_bad:0 "游牧民族最近迁入"
 RICE_pamir_nomad_clans_bad_desc:0 "一些游牧部落最近迁徙到帕米尔山脉的这一部分。他们和当地人经常发生争执和冲突，导致当地不太稳定。"
 RICE_pamir_nomad_clans_training:0 "游牧民训练当地部队"
 RICE_pamir_burusho_feud:0 "勃律世仇"
 RICE_pamir_burusho_feud_desc:0 "该地区的几个当地的勃律氏族正在进行一场大规模的世仇冲突"
 RICE_pamir_ate_baht_porridge:0 "吃了铢糊"
 RICE_pamir_fairy_advice:0 "收到来自佩里的建议"
 RICE_pamir_fairy_advice_desc:0 "据说该角色在当地萨满的帮助下得到了 佩里的帮助——Peri是一种在帕米尔和勃律民族的民间传说和神话中常见的仙灵的名字。"
 RICE_pamir_ate_kurut_cheese:0 "吃酸牦牛奶酪"
 RICE_pamir_horny_bowls:0 "盘羊角碗"
 RICE_pamir_horny_bowls_desc:0 "该角色最近得到了用帕米尔地区土生土长的绵羊品种的角制作的大碗。在帕米尔，这种羊它们被称为nakhjipar或帕米尔盘羊。"
 RICE_pamir_mulberry_jam_syrup:0 "拥有大量的桑葚果酱和糖浆"
 RICE_pamir_mulberry_pikht:0 "拥有大量用于制作面包的桑树髓（面粉）。"
 RICE_pamir_admiring_buddhist_rock_art:0 "欣赏佛教岩画"
 RICE_pamir_accused_belas:0 "被指控为贝拉斯"
 RICE_pamir_accused_belas_desc:0 "这个女人被指控为贝拉斯，是帕米尔山区民间传说中的一种复仇精魂。"
 RICE_pamir_opinion_saved_me_belas:0 "救了我"
 RICE_pamir_hephthalite_war_inspiration:0 "受古代嚈哒战士启发"
 RICE_pamir_hephthalite_peace_inspiration:0 "受古代嚈哒商人和探险家启发"
 RICE_pamir_ate_moch:0 "吃了很多摩卡"
 RICE_pamir_ate_moch_desc:0 "摩卡是帕米尔地区的一种传统汤，将奶酪凝乳与水混合，然后浇在煮熟的蔬菜上。它被认为可以增强一个人的力量，特别是在寒冷的月份。"
 RICE_pamir_chinir_minor_illness:0 "在奇尼尔节期间得了小病"
 RICE_pamir_offering_to_zun_small:0 "献给尊一些宝物"
 RICE_pamir_offering_to_zun_medium:0 "献给尊大量宝物"
 RICE_pamir_offering_to_zun_large:0 "献给尊无数宝物"
 RICE_pamir_zun_idol_is_restored_mount_aruna:0 "阿鲁纳山上的尊神像"
 RICE_pamir_zun_idol_is_restored_mount_aruna_desc:0 "该地区尊的追随者们在几代人之后收回了阿鲁纳山，并在那里恢复了他们的尊神金像。与扎明达瓦尔的神像一样，神像上有许多美丽的红宝石眼睛，这些红宝石来自波多叉拿的红宝石矿区。"
 RICE_pamir_restored_zun_mount_aruna_idol:0 "恢复了阿鲁纳山上尊的神像"
 RICE_pamir_kafir_concessions:0 "向卡菲勒让步"
 RICE_pamir_kafir_concessions_desc:0 "鉴于他们共同的文化和信仰，这一地区的这一代“卡菲勒”与其他人融合并对更发达的邻国友好。"
 RICE_pamir_is_azur_jamshid:0 "精灵王子"
 RICE_pamir_is_azur_jamshid_desc:0 "传说中他是仙女的儿子，他从天而降。他打败了吉尔吉特的人民的暴君，并把他们从食人魔王室利巴达特的暴政中解放出来。"
 RICE_pamir_shri_badats_palace:0 "室利巴达特之宫"
 RICE_pamir_shri_badats_palace_desc:0 "虽然室利巴达特之宫不再被其臭名昭著的食人暴君（已被正义的王子诛杀）占据，但他的宫殿现在仍然存在。虽然只是一座建筑，但它象征着他对当地人造成的可怕的统治，以及他是如何把土地榨干的。"
 RICE_pamir_dynasty_azur_jamshid:0 "精灵王子之子"
 RICE_pamir_sponsored_tumshiling:0 "赞助土石岭节"
 RICE_pamir_dokhtar_i_noshirwan_refurbished:0 "在多赫塔尔·努什尔万翻新的尊神殿"
 RICE_pamir_dokhtar_i_noshirwan_refurbished_desc:0 "在梵衍那以北的多赫塔尔·努什尔万，有一座著名的祠堂，里面有许多壁画，其中描绘的是乌许斯·尊，是当地与波斯东部古神乌许斯或瓦赫什有关的尊神的变体。"
 RICE_pamir_shri_badats_palace_renovated:0 "重建室利巴达特之宫"
 RICE_pamir_shri_badats_palace_renovated_desc:0 "吉尔吉特出现了一个新的暴君，食人暴君室利巴达特之宫已经重建。这种黑暗、不祥的结构一如既往地可怕。当地人会找到和平吗？"
 RICE_pamir_continuing_shri_badats_legacy:0 "继续室利巴达特的遗产"
 RICE_pamir_continuing_shri_badats_legacy_desc:0 "该角色试图模仿吉尔吉特的前暴君和食人之王室利巴达特，也许他甚至在残酷方面超过了室利巴达特。"
 RICE_pamir_continuing_shri_badats_legacy_azur_jamshid:0 "黑暗精灵王子"
 RICE_pamir_continuing_shri_badats_legacy_azur_jamshid_desc:0 "“你是精灵王子！你应该给吉尔吉特带来平衡，而不是让它陷入黑暗！”"
 RICE_pamir_hephthalite_reclaimer_honors_zun:0 "保护尊的子民"
 RICE_pamir_hephthalite_reclaimer_honors_zun_desc:0 "该角色在将嚈哒人恢复到曾经嚈哒帝国心脏地带的过程中，尊崇尊这个伟大的神祇，祂是几代嚈哒人所崇拜的伟大神祇。现在对尊的崇拜，对太阳本身的崇拜，可以再次在嚈哒人曾经的山脉中出现。"
 RICE_pamir_hephthalite_reclaimer_zun_chosen:0 "以尊之名选帝"
 RICE_pamir_hephthalite_reclaimer_zun_chosen_desc:0 "该角色引领了嚈哒帝国的复兴，并为尊这个伟大的神祇带来了荣耀，祂是几代嚈哒人所崇拜的伟大神祇。不管该角色信不信，很多信奉尊的人都相信这个统治者是尊的神选，并且通过其的不懈努力，这个世界上的所有人都会知道尊的强大，尊的无误，尊的伟业！"
 RICE_pamir_hephthalite_focus_north:0 "北嚈哒领土"
 RICE_pamir_hephthalite_focus_north_desc:0 "这位将嚈哒人领土恢复到帕米尔高原腹地的角色，现在正朝北扩张。虽然嚈哒人后来适应了他们所征服的民族的许多习俗和文化，但嚈哒人曾经被敌人称为——白匈奴，其本质还是可怕的战士，所以该角色认为他们的命运在于草原和崎岖的山脉。"
 RICE_pamir_hephthalite_focus_south:0 "南嚈哒领土"
 RICE_pamir_hephthalite_focus_south_desc:0 "这位将嚈哒人领土恢复到帕米尔高原腹地的人物，现在正在向南扩张。尽管许多人称他们为白匈奴、战士和可怕的侵略者，但嚈哒人也是技艺精湛的工匠和精通贸易的商人，该角色相信他们的命运在于世代统治下的许多民族的优秀品质。"
 RICE_pamir_visit_bibi_fatima:0 "参观法蒂玛之泉"
 RICE_pamir_visit_bibi_fatima_tooltip:0 "你将参观瓦罕的法蒂玛之泉"
 RICE_pamir_visit_bibi_fatima_effect_tooltip:0 "你将花时间前往法蒂玛之泉，可能会失去[stress|E]，并且增加你的[fertility|E]"
 RICE_pamir_visit_bibi_fatima_effect_2_tooltip:0 "作为一个[ROOT.Char.GetFaith.GetAdjective]的信徒，你也可能获得[piety|E]。"
 RICE_pamir_visit_bibi_fatima_desc:0 "虽然许多人从远方来前来参观这些泉水，因为我住在附近，所以我应该利用这个机会来放松一下。"
 RICE_pamir_visit_bibi_fatima_confirm:0 "让我们做好准备！"
 RICE_pamir_visit_bibi_fatima_context_tooltip:0 "#emphasis 历史背景：#!法蒂玛之泉位于今天塔吉克斯坦的瓦罕山谷，以先知穆罕默德的女儿命名，据说这些温泉可以提高生育能力。"
 RICE_pamir_attend_chinir_festival:0 "参加奇尼尔节"
 RICE_pamir_attend_chinir_festival_tooltip:0 "你将参加当地的奇尼尔节"
 RICE_pamir_attend_chinir_festival_effect_tooltip:0 "你参加奇尼尔节"
 RICE_pamir_attend_chinir_festival_desc:0 "帕米尔地区一些讲波斯语的民族长期以来一直在庆祝一个名为“Chinir”的丰收节，现在是我参加这样一个节日的时候了!"
 RICE_pamir_attend_chinir_festival_confirm:0 "快到收获季节了！"
 RICE_pamir_attend_chinir_festival_context_tooltip:0 "#emphasis 历史背景：#!奇尼尔节（Chinir）是瓦罕人的一个传统节日，意为庆祝收获的开始。瓦罕人是主要居住在瓦罕走廊的农民和牧民，是帕米尔地区讲东波斯语的几个群体之一。"
 RICE_pamir_nasir_khusraw_pilgrimage:0 "前往纳西尔·霍斯劳灵寝朝圣"
 RICE_pamir_nasir_khusraw_pilgrimage_tooltip:0 "你将[go_on_a_pilgrimage_to_nasir_khusraws_shrine|E]在波多叉拿"
 RICE_pamir_nasir_khusraw_pilgrimage_effect_tooltip:0 "你将[go_on_a_pilgrimage_to_nasir_khusraws_shrine|E]，并有可能获得各种加成，如[piety|E]和[prestige|E]"
 RICE_pamir_nasir_khusraw_pilgrimage_desc:0 "[nasir_khusraw|E]确实是一位杰出的圣人，所以我向他表示敬意是合适的。"
 RICE_pamir_nasir_khusraw_pilgrimage_confirm:0 "准备旅程"
 RICE_pamir_nasir_khusraw_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!纳西尔·霍斯劳灵寝位于今阿富汗巴达赫尚省，几个世纪以来，这里一直是当地人热衷的朝圣地。尽管他是伊斯玛仪派的传教士，但该地区的什叶派和逊尼派穆斯林都对他十分敬重。"
 RICE_pamir_repair_watchposts_wakhan:0 "修复瓦罕走廊的哨所"
 RICE_pamir_repair_watchposts_wakhan_tooltip:0 "你将在瓦罕走廊中[repair_the_pamir_watchposts|E]"
 RICE_pamir_repair_watchposts_wakhan_effect_tooltip:0 "你将在#V 瓦罕#!的[county|E]里[repair_the_pamir_watchposts|E]"
 RICE_pamir_repair_watchposts_wakhan_desc:0 "瓦罕走廊的哨所网络长久无人修缮，已经残碎不堪。如果我们[repair_singular_pamir_watchposts|E]，我们将保护通过该地区山谷和山口的丝绸之路贸易路线，并加强当地防御。"
 RICE_pamir_repair_watchposts_wakhan_confirm:0 "让我们开始行动吧。"
 RICE_pamir_repair_watchposts_wakhan_context_tooltip:0 "#emphasis 历史背景：#!尽管地处偏远，瓦罕走廊在几个世纪里一直是丝绸之路上的一条重要通道。包括汉人和藏人在内的各个政权在这一地区建立了一系列的哨站，当地的统治者当然也这么做。"
 RICE_pamir_wakhan_recently_repaired_req:0 "瓦罕走廊的岗哨最近没有[repair_past_tense_pamir_watchposts|E]"
 RICE_pamir_repair_watchposts_karakoram:0 "修复喀喇昆仑山脉的岗哨"
 RICE_pamir_repair_watchposts_karakoram_tooltip:0 "你将在喀喇昆仑山脉中[repair_the_pamir_watchposts|E]"
 RICE_pamir_repair_watchposts_karakoram_effect_tooltip:0 "你将在#V 吉尔吉特#!的[county|E]中[repair_the_pamir_watchposts|E]"
 RICE_pamir_repair_watchposts_karakoram_desc:0 "喀喇昆仑山的岗哨网络长久无人修缮，已经残碎不堪。如果我们[repair_singular_pamir_watchposts|E]，我们将保护通过该地区山谷和山口的丝绸之路贸易路线，并加强当地的防御。"
 RICE_pamir_repair_watchposts_karakoram_confirm:0 "让我们开始行动吧。"
 RICE_pamir_repair_watchposts_karakoram_context_tooltip:0 "#emphasis 历史背景：#!尽管地处偏远，喀喇昆仑山的山口和山谷在几个世纪里一直是丝绸之路上的一条重要通道。包括汉人和藏人在内的各个政权在这一地区建立了一系列的哨站，当地的统治者当然也这么做。"
 RICE_pamir_karakoram_recently_repaired_req:0 "喀喇昆仑山脉的岗哨最近没有[repair_past_tense_pamir_watchposts|E]"
 RICE_pamir_watchpost_costs_tooltip:0 "修缮的强度和修缮持续时长取决于提供多少资金#weak （最低花费：@gold_icon!80）#!"
 RICE_pamir_expand_nasir_khusraws_shrine:0 "扩建纳西尔·霍斯劳灵寝"
 RICE_pamir_expand_nasir_khusraws_shrine_tooltip:0 "你将提供资金以扩建[nasir_khusraw_s|E]的休息场所！"
 RICE_pamir_expand_nasir_khusraws_shrine_effect_tooltip:0 "在波多叉拿附近的#V 穆斯林#!现在可以[go_on_a_pilgrimage_to_nasir_khusraws_shrine|E]"
 RICE_pamir_expand_nasir_khusraws_shrine_desc:0 "已故的[nasir_khusraw|E]仍然受到该地区所有教派的穆斯林敬仰，朝圣者开始涌向他的埋葬地。我们应该建立一个适当的圣地来纪念这位圣人，同时建立一些基础设施来帮助各地的朝圣者。"
 RICE_pamir_expand_nasir_khusraws_shrine_confirm:0 "让工作开始吧！"
 RICE_pamir_expand_nasir_khusraws_shrine_context_tooltip:0 "#emphasis 历史背景：#!纳西尔·霍斯劳逝世后被埋葬在巴达赫尚的延干地区，后来在那里建起了一座灵寝。尽管纳西尔·霍斯劳是伊斯玛仪派的信徒，但他的灵寝却成为了该地区什叶派和逊尼派朝圣者的热门朝圣地。"
 RICE_pamir_nasir_khusraw_passed_away:0 "[nasir_khusraw|E]现在去世了"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage:0 "前往纳西尔·霍斯劳灵寝朝圣"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_tooltip:0 "你[go_on_a_pilgrimage_to_nasir_khusraws_shrine|E]"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_effect_tooltip:0 "你将前往波多叉拿，作为[pilgrimage_to_nasir_khusraws_shrine|E]"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_desc:0 "追其一生，[nasir_khusraw|E]作为一位谦虚好学且博学多才的圣人，将伊斯兰之光带到了波多叉拿。也许参观他的圣地会我也会受到一些启发和激励。"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_confirm:0 "着手准备"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!纳西尔·霍斯劳去世后，位于巴达赫尚省延干地区的纳西尔·霍斯劳灵寝将成为当地什叶派和逊尼派穆斯林的朝圣地。"
 RICE_pamir_nasir_khusraw_pilgrimage_distance_req:0 "你的[capital|E]靠近#V 波多叉拿#!的[county|E]"
 RICE_pamir_comission_nasir_khusraw_work:0 "委托纳西尔·霍斯劳创作"
 RICE_pamir_comission_nasir_khusraw_work_tooltip:0 "你将一些哲学问题和精神上的问题向[nasir_khusraw_s|E]请求帮助。"
 RICE_pamir_comission_nasir_khusraw_work_effect_tooltip:0 "你将要求[nasir_khusraw|E]撰写一篇文章，以来回答关于哲学和精神之间的关系。"
 RICE_pamir_comission_nasir_khusraw_work_desc:0 "我看到一位名叫海什木的不知名学者写了一首诗，诗上提出了一系列具有挑战性的哲学和宗教问题。它使我感到困惑，但我对此又很感兴趣。也许著名的圣人纳西尔·霍斯劳能给我启发，帮助我找到这些问题的答案。"
 RICE_pamir_comission_nasir_khusraw_work_confirm:0 "我的这些问题的答案是什么？"
 RICE_pamir_comission_nasir_khusraw_work_context_tooltip:0 "#emphasis 历史背景：#!虽然不如他早期的著作那样广为人知，《哲学与宗教的和解》（《智慧双合》）是纳西尔·霍斯劳的最后一部作品，由巴达赫尚的埃米尔——阿里·伊本·阿萨德赞助，他本人也是一位非常有才华的人。"
 RICE_pamir_nasir_khusraw_passed_away_req:0 "[nasir_khusraw|E]现在去世了"
 RICE_pamir_nasir_khusraw_at_court_req:0 "[nasir_khusraw|E]现在你的[court|E]里"
 RICE_pamir_attend_chawmos_festival:0 "参加乔莫斯节"
 RICE_pamir_attend_chawmos_festival_tooltip:0 "你将会庆祝乔莫斯节"
 RICE_pamir_attend_chawmos_festival_effect_tooltip:0 "你庆祝乔莫斯节"
 RICE_pamir_attend_chawmos_festival_desc:0 "冬至快到了！这是我们宗教最重要的庆祝节日。我们通过仪式重申对信仰的虔诚并重新确立纯洁和不纯洁的边界。"
 RICE_pamir_attend_chawmos_festival_confirm:0 "让我们着手准备"
 RICE_pamir_attend_chawmos_festival_context_tooltip:0 "#emphasis 历史背景：#!在卡拉什人中，乔莫斯节是一年中最重要的节日。事实上称其为节日并不恰当，因为它是卡拉什人中最大的庆典活动，而且具有很多的意义。"
 RICE_decision_chawmos_month_requirement:0 "你需要在九月和十一月之间开始准备工作"
 RICE_pamir_sacrifice_goats:0 "将山羊献给神明"
 RICE_pamir_sacrifice_goats_tooltip:0 "你将山羊献祭给神明"
 RICE_pamir_sacrifice_goats_effect_tooltip:0 "你将一只山羊献给你选择的神祇或者精怪"
 RICE_pamir_goat_sacrifice_costs_tooltip:0 "潜在的加成取决于你献祭的程度 #weak （最低花费：@gold_icon! 50）#!"
 RICE_pamir_sacrifice_goats_desc:0 "我们寻求神明的祝福，而这样做的方式是通过献祭我们最神圣和纯洁的动物——山羊。"
 RICE_pamir_sacrifice_goats_confirm:0 "给我那些山羊！"
 RICE_pamir_sacrifice_goats_context_tooltip:0 "#emphasis 历史背景：#!在阿富汗和巴基斯坦北部的卡拉什人文化里，山羊通常被认为是神圣的，因此是适合献给神明的动物。"
 RICE_pamir_restore_the_idol_of_zun:0 "恢复扎明达瓦尔的尊之像"
 RICE_pamir_restore_the_idol_of_zun_tooltip:0 "你将[restore_the_idol_of_zun|E]在扎明达瓦尔"
 RICE_pamir_restore_the_idol_of_zun_desc:0 "[idol_of_zun|E]曾经自豪地矗立在扎明达瓦尔，作为尊神权威的象征——让我们重新复原它！"
 RICE_pamir_restore_the_idol_of_zun_confirm:0 "召集工匠！"
 RICE_pamir_restore_the_idol_of_zun_context_tooltip:0 "#emphasis 历史背景：#!有几个同时代的史料，比如七世纪的佛教高僧和朝圣者玄奘，以及九世纪的穆斯林历史学家拜拉祖里，都描述了一个金色的神像，它是祭祀尊（或称樽、樽那、苏那）的一座著名神庙里的主要供品。这座神庙位于扎明达瓦尔地区的朱纳吉尔山上，由樽比勒王国赞助建造。据拜拉祖里记载，当阿拉伯指挥官阿卜杜勒·拉赫曼·本·萨穆拉在公元653年至654年袭击樽比勒王国时，他故意打断了神像的手，拔掉了它的红宝石眼睛，以此向当地人证明他们的神明是无能的。"
 RICE_pamir_conciliate_kafir_tribes:0 "调解卡菲勒部族群"
 RICE_pamir_conciliate_kafir_tribes_tooltip:0 "你向卡菲尔部族们提出请求"
 RICE_pamir_conciliate_kafir_tribes_effect_tooltip:0 "#V 卡菲勒人的土地#![county_modifier|E]将从你的一个[counties|E]中移除，而#V 对卡菲勒人让步#![county_modifier|E]将被临时添加到你选择的[county|E]中"
 RICE_pamir_conciliate_kafir_tribes_desc:0 "被穆斯林称为“卡菲勒”的部落居民世代以来都是当地领主的眼中钉肉中刺。作为一个强大且受人尊敬并追随类似[religion|E]的[ruler|E]，也许我可以与生活在我的领土上的卡菲勒部族谈判达成协议。"
 RICE_pamir_conciliate_kafir_tribes_confirm:0 "我们开始谈判？"
 RICE_pamir_conciliate_kafir_tribes_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，帕米尔高原和兴都库什山脉的所谓“卡菲勒”一直抵抗着各种有组织的宗教信徒的侵略，从穆斯林到佛教徒和印度教徒。这些“卡菲勒”甚至在维多利亚时代的大部分时间里，从他们的领土发动了诸多袭击。"
 RICE_pamir_reclaim_mount_aruna:0 "为遵夺回阿鲁纳山"
 RICE_pamir_reclaim_mount_aruna_tooltip:0 "你恢复了尊在阿鲁纳山的应有地位"
 RICE_pamir_reclaim_mount_aruna_desc:0 "很久以前，在迦布罗北部，阿鲁纳山上有另一个宏伟的[idol_of_zun|E]神像，后来我们被信仰苏利耶的婆罗门教徒赶走了。现在是时候在这里[restore_the_idol_of_zun|E]了，这样尊就可以在这里再次受到膜拜了！"
 RICE_pamir_reclaim_mount_aruna_confirm:0 "征集工匠和祭司！"
 RICE_pamir_reclaim_mount_aruna_context_tooltip:0 "#emphasis 历史背景：#!中国的史料提到在喀布尔附近有一座阿鲁纳山，根据著名的佛教高僧玄奘转述的一个传说，尊和苏利耶争夺谁能居住在这座山上，最后尊不得不南迁到扎布里斯坦。这个故事可能是对历史事件的神话化描述：要么是尊的信徒试图侵占崇拜苏利耶的婆罗门教徒控制的山峰，要么（更有可能的是）这座山原本是尊日教教徒的领地，后来被苏利耶崇拜者驱逐了。"
 RICE_pamir_zun_restored_req:0 "在扎明达瓦尔恢复[idol_of_zun|E]"
 RICE_pamir_zun_restored_aruna_req:0 "阿鲁纳山上的[idol_of_zun|E]已被恢复。"
 RICE_pamir_offer_riches_to_zun:0 "向尊献祭钱财"
 RICE_pamir_offer_riches_to_zun_tooltip:0 "你收集宝物和奢侈品来献给[idol_of_zun|E]"
 RICE_pamir_offer_riches_to_zun_desc:0 "以世俗财富的形式向尊进贡是我们传统的习俗，没有比在尊神像面前提供这些财物更好的取悦方式了！"
 RICE_pamir_offer_riches_to_zun_effect_tooltip:0 "获得[piety|E]和[prestige|E]取决于你献祭多少财富 #weak （最低花费@gold_icon! 100）#!"
 RICE_pamir_offer_riches_to_zun_confirm:0 "我将拜访尊的神像"
 RICE_pamir_offer_riches_to_zun_context_tooltip:0 "#emphasis 历史背景：#!一些中国的史料记载了祭祀尊神的圣地所拥有的大量金银财宝。例如，《隋书》中提到，聪灵山（可能是喀布尔附近的阿鲁纳山）的尊神殿用金银做成屋顶，并有银质地板。玄奘也提到，人们常常把羊、马等牲畜献给尊神。"
 RICE_pamir_zun_offer_riches_region_req:0 "[realm_capital|E]靠近阿富汗的尊日教徒心脏地带"
 RICE_pamir_hold_tumshiling_festival:0 "赞助土石岭节"
 RICE_pamir_hold_tumshiling_festival_tooltip:0 "你把当地人聚集在一起，庆祝击败室利巴达特"
 RICE_pamir_hold_tumshiling_festival_desc:0 "很久以前，吉尔吉特的食人暴君室利巴达特被英勇的精灵王子[azur_jamshid|E]征服。让我们用土石岭节来纪念这一伟大的事件吧!"
 RICE_pamir_hold_tumshiling_festival_effect_tooltip:0 "你赞助了当地的土石岭节活动"
 RICE_pamir_hold_tumshiling_festival_confirm:0 "让我们开始吧！"
 RICE_pamir_hold_tumshiling_festival_context_tooltip:0 "#emphasis 历史背景：#!根据传说，吉尔吉特曾经被一个食人的暴君——佛教徒室利巴达特所统治，直到他被自己的女儿努尔·巴赫特和她的爱人兼丈夫——来自波斯的精灵王子阿苏尔·贾姆希德击败。当地人每年都会以土石岭节的节日来庆祝这一事件。这个故事很可能是一个神话，因为喜马拉雅山脉各地都有类似的庆祝活动，它们都是基于有着相似情节的传说，而这些传说可能最终源于（具有讽刺意味的）佛教本生故事。"
 RICE_decision_tumshiling_month_requirement:0 "月份必须在十月和十二月之间"
 RICE_pamir_raze_shri_badats_palace:0 "拆除室利巴达特的宫殿"
 RICE_pamir_raze_shri_badats_palace_tooltip:0 "谢天谢地！"
 RICE_pamir_raze_shri_badats_palace_desc:0 "食人魔室利巴达特已经不在了，他被精灵王子[azur_jamshid|E]率领的受压迫的臣民杀死了，但他的宫殿仍然存在。为了摒弃对这个暴君和他令人发指的行为的记忆，我应该下令摧毁这座宫殿。"
 RICE_pamir_raze_shri_badats_palace_effect_tooltip:0 "若[azur_jamshid|E]已经去世，帕米尔和希加里[duchies|E]的[rulers|E]或吉德拉尔[county|E]的[rulers|E]可以做出#V 资助土石岭节#![decision|E]"
 RICE_pamir_raze_shri_badats_palace_confirm:0 "拆除它！"
 RICE_pamir_raze_shri_badats_palace_context_tooltip:0 "#emphasis 历史背景：#!相传，阿苏尔·贾姆希德帮助吉尔吉特的当地人推翻并杀死了室利巴达特，并被推选为国王，然后他下令将暴君的宫殿夷为平地。"
 RICE_pamir_refurbish_dokhtar_i_noshirwan:0 "翻新多赫塔尔·努什尔万的壁画"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_tooltip:0 "这个尊的壁画应该进行一些修缮"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_desc:0 "在离梵衍那不远的多赫塔尔·努什尔万遗址，有一个古老的岩石建筑群，里面有一幅描绘我们伟大的尊神的壁画。由于它已经年久失修，我们应该采取措施恢复它以前的辉煌。"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_confirm:0 "找些工匠来做吧！"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_context_tooltip:0 "#emphasis 历史背景：#!多赫塔尔·努什尔万（又名尼加尔）是一处位于阿富汗的考古遗址，其建造年代可追溯到公元8世纪初期，其中包含了阿富汗最大的一幅伊斯兰化前壁画。这幅壁画的视觉元素显示了粟特人、匈人/嚈哒人和阿富汗南部的混合影响。这幅壁画可能是由粟特艺术家应当地突厥人或土著人的要求而制作的，也可能是对巴克特里亚神话中的瓦赫什神或乌许斯神的一种表现，这位神在东伊朗世界很受欢迎，可能与尊神有联系或融合，形成了乌许斯‑尊的形象——不过，这些都是推测。"
 RICE_pamir_renovate_shri_badats_palace:0 "翻新室利巴达特的宫殿"
 RICE_pamir_renovate_shri_badats_palace_tooltip:0 "老实说，他有一些不错的想法……"
 RICE_pamir_renovate_shri_badats_palace_desc:0 "食人魔室利巴达特已经不在了，但他的宫殿仍然存在。那座建筑和他的黑暗行为激励着我，有传言说他的恶魔精神仍在延续。我深知我必须做的事：完成他所开创的事业！"
 RICE_pamir_renovate_shri_badats_palace_effect_tooltip:0 "#N 这样做将使你或其他任何人在未来无法采取#Bold 资助土石岭节#![decision|E]#!"
 RICE_pamir_renovate_shri_badats_palace_effect_special_tooltip:0 "作为阿苏尔·贾姆希德，你本应拯救吉尔吉特，你本应该拯救它的人民。但现在……食人魔已经重生了……"
 RICE_pamir_renovate_shri_badats_palace_confirm:0 "每个人都会惧怕我！"
 RICE_pamir_renovate_shri_badats_palace_context_tooltip:0 "$RICE_pamir_raze_shri_badats_palace_context_tooltip$"
 RICE_pamir_investigate_bibi_fatima:0 "调查法蒂玛之泉"
 RICE_pamir_investigate_bibi_fatima_tooltip:0 "我听到了一些有趣的传言……"
 RICE_pamir_investigate_bibi_fatima_desc:0 "我听说帕米尔地区的伊斯兰旅行者经常会去参观一个温泉，他们称之为“法蒂玛之泉”。我想派一些官员去调查这个温泉，也许还可以投资一些资金在那里建设基本的基础设施。"
 RICE_pamir_investigate_bibi_fatima_effect_tooltip:0 "拥有[badakhshan_duchy.GetNameNoTier]和[pamir_duchy.GetNameNoTier]两个[duchies|E]领土的[rulers|E]可以采取#Bold 访问法蒂玛之泉#!的[decision|E]"
 RICE_pamir_investigate_bibi_fatima_confirm:0 "是什么使它如此独特？"
