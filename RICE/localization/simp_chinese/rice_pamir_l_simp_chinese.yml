 pamir.0200.t:0 "桧柏"
 pamir.0200.desc:0 "我和我的随行人员在我的王国的帕米尔高原和兴都库什山脉旅行时，在一片森林中迷失了。幸运的是，我们遇到了大量的桧柏，它生长在这个地区的许多地方。我决定收集一些，用于各种宗教和草药用途。"
 pamir.0200.a:0 "从某种意义上来说，我们迷路是件好事。"
 pamir.0201.t:0 "猎人们"
 pamir.0201.desc:0 "帕米尔高原有一些地方非常崎岖，没有人类居住，只有附近的当地村庄的猎人才会来这里。最近两名猎人在这些偏远地区之一发生了混战，并声称对方偷走了对方的猎物。这事已经引起了我的注意，他们希望我能够对此事作出裁决。"
 pamir.0201.a:0 "来自北方的猎人给了个更有说服力的理由。"
 pamir.0201.b:0 "来自南方的猎人给了个更有说服力的理由。"
 pamir.0201.c:0 "他们都是骗子，为了一个破事来烦我！"
 pamir.0201.d:0 "我没有时间来处理这些平民的问题。"
 pamir.0202.t:0 "青金石"
 pamir.0202.desc:0 "青金石，珍贵的蓝色宝石，自古以来就受人推崇！世界上的大部分供应来自帕米尔高原的波多叉拿，因此当地人通常会像今天一样，以青金石的形式向我赠送贡品。"
 pamir.0202.a:0 "非常感谢你的礼物"
 pamir.0203.t:0 "萨里桑"
 pamir.0203.desc:0 "今天，我正在巡查萨里桑的青金石矿，这是该当地的财政来源。一些矿工向我诉说，监工冷酷无情，让他们工作过度，甚至在还鞭打旷工。由于无处求助，只能找到我。现在双方都陈述了自己的观点，但双方都很有说服力，唉"
 pamir.0203.a:0 "监工你做错了，你不能让人过度劳累！"
 pamir.0203.b:0 "很明显是矿工们错了，他们懒惰只是想要更少的工作！"
 pamir.0203.c:0 "在发生任何冲突之前，协调双方达成共识"
 pamir.0204.t:0 "库伊拉"
 pamir.0204.desc:0 "今天，我正在视察库伊拉的红宝石矿，这是该当地的财政来源。一些矿工向我诉说，监工冷酷无情，让他们工作过度，甚至在还鞭打旷工。由于无处求助，只能找到我。现在双方都陈述了自己的观点，但双方都很有说服力，唉"
 pamir.0204.a:0 "监工你做错了，你不能让人过度劳累！"
 pamir.0204.b:0 "很明显是矿工们错了，他们懒惰只是想要更少的工作！"
 pamir.0204.c:0 "在发生任何冲突之前，协调双方达成共识"
 pamir.0205.t:0 "青金石走私者"
 pamir.0205.desc:0 "在库伊拉的青金石矿区，一些矿工被指控秘密走私珍贵的青金石，并在黑市上出售，但是被捕了，现在由我来决定必须对这些罪犯采取什么措施。"
 pamir.0205.a:0 "他们只是想养家糊口，放他们走吧。"
 pamir.0205.b:0 "监禁将是对罪行的公平惩罚"
 pamir.0205.c:0 "处决他们！杀鸡儆猴！"
 pamir.0206.t:0 "红宝石走私者"
 pamir.0206.desc:0 "在库伊拉的红宝石矿区，一些矿工被指控秘密走私珍贵的宝石，并在黑市上出售，但是被捕了，现在由我来决定必须对这些罪犯采取什么措施。"
 pamir.0206.a:0 "他们只是想养家糊口，放他们走吧。"
 pamir.0206.b:0 "监禁将是对罪行的公平惩罚"
 pamir.0206.c:0 "处决他们！杀鸡儆猴！"
 pamir.0207.t:0 "帕米尔温泉"
 pamir.0207.desc:0 "帕米尔高原上有许多温泉，我决定今天去前往一个不太出名的温泉，甚至在当地人中都不怎么受欢迎，我前往主要是为了不受干扰。安静的温泉浸泡着我，这真的很让人放松，可以帮助我忘掉一些事情，哪怕只是一小会儿。"
 pamir.0207.a:0 "我很高兴能来一趟。"
 pamir.0208.t:0 "一个美丽的湖"
 pamir.0208.desc:0 "尽管有些人可能难以想象，但在帕米尔高原和兴都库什山脉中可以找到风景如画的湖泊。今天我在帕米尔高原上的某个地方时遇到了一个湖泊。这个湖呈现天蓝色，就像青金石或天空一样，周围是高大的植物景观。"
 pamir.0208.a:0 "这就是大自然的奇妙之处。"
 pamir.0209.t:0 "岩画"
 pamir.0209.desc:0 "岩画是帕米尔高原和兴都库什山脉的一个常见景观。几个世纪以来，人们一直通过这一地区，因此我在旅行中遇到这样的石画并不奇怪。这幅画上似乎画着猎人、动物以及太阳和树木等大自然的各个方面。尽管它很简单，但有一种永恒的魅力。"
 pamir.0209.a:0 "这是前人在世上的证明"
 pamir.0210.t:0 "难以辨认……"
 pamir.0210.desc:0 "岩画是帕米尔高原和兴都库什山脉的一个常见景观。几个世纪以来，人们一直通过这一地区，因此我在旅行中遇到这样的石画并不奇怪。这幅画似乎是最近才有的，描绘了人们在做他们的事情，上面还包括一些我们都不认识的文字。"
 pamir.0210.a:0 "这些文字已近斑驳，破碎难辨。"
 pamir.0211.t:0 "瓦罕"
 pamir.0211.desc:0 "瓦罕走廊似乎是地球上最偏远也是最令人敬畏的地方之一。今天当我经过这里前往我王国的一个聚居地时，我看着淡蓝色的天空，眼前是一望无际的绿色和黄褐色的平原，在我的两侧，是两座气势恢宏的古老山峰，隔断了山脉……"
 pamir.0211.a:0 "几个世纪以来，有那么多的人经过这里……"
 pamir.0212.t:0 "帕米尔地区的游牧民"
 pamir.0212.desc:0 "最近有几个游牧民族的部族搬到了[nomad_county.GetNameNoTier]的一个山谷里。这种情况并不少见，因为该地区的夏季对这些游牧民来说往往是有吸引力葱郁牧场。有时当地聚居地会对此无所谓，甚至可能与游牧民交好。有时，这两个群体之间会产生冲突。"
 pamir.0212.a:0 "希望一切顺利。"
 pamir.0212.toast.good:0 "游牧民族和平迁入！"
 pamir.0212.toast.bad:0 "游牧民族搬进来了，但是造成了紧张的局势！"
 pamir.0213.t:0 "向游牧民提供帮助？"
 pamir.0213.desc:0 "有一族游牧民迁入我在帕米尔高原的管辖地，具体在[nomad_county.GetNameNoTier]。那里有大量的夏季牧场，通常会吸引这类游牧民，这里经常发生这种情况，但这一族的游牧民在战争中很有经验，他们愿意为你提供服务，成为我手下的战士。这是一个很有吸引力的提议，但是一个当地人质疑游牧民的忠诚。"
 pamir.0213.a:0 "他们可以作为辅军为我战斗"
 pamir.0213.b:0 "他们还是作为民兵帮我训练一下当地部队吧。"
 pamir.0213.c:0 "我暂时不需要他们的服务。"
 RICE_pamir_nomad_spawn_event_troops:0 "帕米尔游牧民辅军"
 pamir.0214.t:0 "盘羊角碗"
 pamir.0214.desc:0 "原产于帕米尔地区的绵羊品种，在当地被称为#italic 帕米尔盘羊#!，以其大角而闻名。这里的牧羊人经常用这种角制作简单而漂亮的大碗。今天当地人刚给了我几个，我可以在宴会上用它们。"
 pamir.0214.a:0 "它们绝对是漂亮的碗。"
 pamir.0215.t:0 "巨角"
 pamir.0215.desc:0 "我在帕米尔山脉的一部分地区旅行，在当地一个牧民的住所休息了一会儿。他高兴地与我讨论他的羊群，这些羊是当地的品种，在当地人的口中被称为#italic 帕米尔盘羊#!，它们以大角著称。这些羊角非常大，以至于他用来围住羊群的围栏就是用这些羊角做成的。"
 pamir.0215.a:0 "有趣的知识"
 pamir.0216.t:0 "勃律世仇"
 pamir.0216.desc:0 "勃律族，帕米尔高原上的一个小而彪悍的民族，以战斗力强而闻名。不幸的是，在我的领地内，特别是在[burusho_county.GetNameNoTier]的两个勃律部族正在开始进行争斗。如果任其蔓延，很可能会导致当地人之间血腥混战。"
 pamir.0216.a:0 "难道我们什么都做不了么？让他们停下来！"
 pamir.0216.b:0 "我会用我的外交技巧来解决冲突。"
 pamir.0216.c:0 "我会用谋略来解决这一冲突"
 pamir.0216.d:0 "我会用军事威胁来解决这一冲突"
 pamir.0216.toast.bad:0 "我们试图解决世仇的努力失败了"
 pamir.0216.toast.good:0 "我们成功化解了他们的世仇"
 pamir.0217.t:0 "狄兰·费蒂包"
 pamir.0217.desc:0 "我经过[burusho_county.GetNameNoTier]的一个偏远的帕米尔山谷，那里居住着勃律人。在那里我在土路上遇到了一个贫穷的农民，他看起来像是一个农民或一个牧民。他热诚的招待了我，并给我了半个面包，被称为#italic 狄兰·费蒂糊（diram fitti）#!，这是勃律人传统的甜味小麦面包，是用发芽的小麦面粉制成的面包并加入黄油、杏仁油或杏仁油来调味，这是他除了背上的衣服以外的全部家当。"
 pamir.0217.a:0 "谢谢你！毫无疑问，你是个好人。"
 pamir.0217.b:0 "我不能接受这些，你比我更需要这些食物。"
 pamir.0217.c:0 "是什么熊心豹子胆让你敢送这样的“礼物”给我？ 滚吧！"
 pamir.0217.d:0 "容我拒绝，拿着这些黄金去养活你的家人吧。"
 pamir.0218.t:0 "勃律菜肴"
 pamir.0218.desc:0 "我正在拜访[burusho_county.GetNameNoTier]的一个勃律族村庄的长老。勃律人世世代代生活在帕米尔地区的偏远山谷中，我与生活在我的领土上的人建立良好的关系是很重要的。头人给你提供了一些勃律人的美食，如#italic mamtu#!（羊肉馅的辛辣饺子），#italic 哈里萨辣酱#!，以及简单的纯酸奶。"
 pamir.0218.a:0 "非常感谢，让我们先享受这道美食吧！"
 pamir.0218.b:0 "我没心情吃饭，我们谈正事吧"
 pamir.0219.t:0 "铢糊"
 pamir.0219.desc:0 "我突然想吃#italic 铢糊粥#!，这是帕米尔波斯人的传统美食，尽管其性质简单。它是用#italic rush‑kakh#!制作的，这是一种稀有的红小麦，只生长在帕米尔山脉的特定地区。它的味道是甜的，以一种微妙而丰富的方式，但由于这种小麦的稀有性，对我的厨师来说，制作它并不便宜。"
 pamir.0219.a:0 "转念一想，算了吧。"
 pamir.0219.b:0 "没错！马上给我做！"
 pamir.0220.t:0 "用桑葚做饭"
 pamir.0220.desc:0 "桑葚在帕米尔伊朗人中很受欢迎，有时较贫穷的家庭可能连续几周完全靠它来维持生计。我刚刚为自己收到了一大批货物，我的厨师们都在问我们应该用其中的大部分来做什么，因为桑葚有很多外人可能不知道的好东西。"
 pamir.0220.a:0 "我们应该尽快吃到新鲜的东西！"
 pamir.0220.b:0 "加点果酱或者糖是极好的！"
 pamir.0220.c:0 "拿来磨成粉然后制作#italic 桑葚面包#!"
 pamir.0221.t:0 "新屋仪式"
 pamir.0221.desc:0 "一位帕米尔当地的贵族即将开始建造他的新住宅。按照帕米尔地区伊朗人的习俗，他必须在开始施工前在该地种植一棵桑树。我作为他的贵宾之一，在那里见证了这个仪式。"
 pamir.0221.a:0 "我希望一切顺利。"
 pamir.0222.t:0 "希罗甘"
 pamir.0222.desc:0 "我正在访问我的领地内的一个帕米尔伊朗村庄。这里的居民很穷，但却很热情好客。他们给我提供了几道简陋的菜肴，如奥什（osh），用各种谷物和豆子做的面条，以及著名的#italic 希罗甘（shiroghan）#!，这是一道牛奶和黄油做成的菜肴，由于它与这个地区的一个关于慷慨和谦逊的重要性的寓言有关，所以被视为神圣。"
 pamir.0222.a:0 "我高兴地接受他们的食物。"
 pamir.0222.b:0 "为什么我不能吃到更可口的食物？"
 pamir.0223.t:0 "奥斯顿树"
 pamir.0223.desc:0 "在我的王国位于帕米尔山脉的部分地区，经常可以看到所谓的#italic 奥斯顿（ostons）#!（当地人就这么喊得），这些孤独的树木被认为具有精神力量，并挂上布条或美丽的石头作为装饰。我在旅行中遇到过一棵奥斯顿，也许在这棵奥斯顿旁留下一些东西，以便从[ROOT.Char.GetFaith.HighGodName]那里获得一些祝福，可能是明智之举？"
 pamir.0223.a:0 "继续前进，不留下任何东西"
 pamir.0223.b:0 "留下一条布条"
 pamir.0223.c:0 "留下一些普通的石头"
 pamir.0223.d:0 "留下一些珍贵的奇石"
 pamir.0224.t:0 "卡丹戈"
 pamir.0224.desc:0 "在我的领地内由帕米里波斯人主导的地区旅行时，当我们遇到一个#italic 卡丹戈（qadamgoh）#!时，当地导游就会阻止我们。这些地方据说是当地圣徒或圣人几代人前去的地方，通常在小树林或岩石上有特殊标记。我们的导游赶紧走到标记的地方，向[ROOT.Char.GetFaith.HighGodName]做了一些祈祷。"
 pamir.0224.a:0 "不耐烦地等待祈祷结束"
 pamir.0224.b:0 "与导游一起做一些祈祷"
 pamir.0225.t:0 "佛教石雕"
 pamir.0225.desc:0 "据说在很多很多代以前，帕米尔高原和兴都库什山脉的国王是这片土地上最虔诚的佛教徒，直到今天还能看到他们留下的痕迹。我在去帕米尔高原和兴都库什山脉地区的一个当地村庄时，路过一个古老的岩石雕刻，上面刻着一尊佛。"
 pamir.0225.a:0 "祈祷一下，然后继续前进。"
 pamir.0225.b:0 "无视它，继续前进。"
 pamir.0225.c:0 "异教徒的亵渎行为！呸！"
 pamir.0225.d:0 "真是一件令人着迷的艺术作品！"
 pamir.0226.t:0 "帕里"
 pamir.0226.desc:0 "我前往我治下的帕米尔高原一个较大的勃律族村落。勃律族是一个遥远而独特的民族，但在勃律族人确实努力与我建立良好的关系。例如，我目前正在拜访他们的一个巫师，或者说是一个#italic dayal#!。他一旦进入恍惚状态，他就会与一个#italic 帕里#!（在这片土地上被意为仙女）进行交流，而#italic 帕里#!说它想给我一些来自[ROOT.Char.GetFaith.HighGodName]的重要建议。"
 pamir.0226.a:0 "我礼貌地拒绝了这个提议，听起来很亵渎我的信仰！"
 pamir.0226.b:0 "很好！请告诉我我必须知道的事情。"
 pamir.0227.t:0 "她是贝拉斯？"
 pamir.0227.desc:0 "一个来自我的王国村庄的女孩被带到我面前。当地人指责她是一个#italic 贝拉斯（Belas）#!，根据帕米尔地区的民间传说，这是复仇幽魂，她在晚上攻击她所憎恨的男人和女人。这个女孩发誓她是无辜的，她是被她的对手陷害的。她的未婚夫解除了他们的婚约，她现在被村子里的人排斥，村子里的人要求对她进行惩罚。"
 pamir.0227.a:0 "这种迷信的愚蠢行为与我无关！"
 pamir.0227.b:0 "她一定是无辜的。让她走，不要打扰她。"
 pamir.0227.c:0 "没错！她就是一个#italic 贝拉斯（Belas）#!！囚禁她！"
 pamir.0227.d:0 "这个可怜的女孩正处于危险之中，她可以和我呆在一起。"
 pamir.0228.t:0 "帕里的后裔？"
 pamir.0228.desc:0 "我在巡查治下的一个村庄时，村长给我讲了一个故事，说他的先祖据说是如何遇到并爱上了一个#italic 帕里#!（在这片土地上被意为仙女），她为他生了几个儿子后就消失了。\n\n“我不确定这个故事是否真实，”这位先生笑着说，“但我愿意认为它是真实的！”"
 pamir.0228.a:0 "这解释了为什么你和你的家人是如此的英俊美丽！"
 pamir.0228.b:0 "的确，这可能只是一些虚幻的幻想。"
 pamir.0229.t:0 "嚈哒人的遗产"
 pamir.0229.desc:0 "我听到当地的长者告诉我关于伟大且强大的嚈哒的故事。嚈哒部落曾经把帕米尔高原和兴都库什山脉称为他们的家园，但现在他们已经不复存在，这个民族的数量在减少，并被民族同化。"
 pamir.0229.a:0 "他们是令人敬畏的战士，很少有人能与之匹敌。"
 pamir.0229.b:0 "他们也是商人和探险者。"
 pamir.0230.t:0 "大地之魂"
 pamir.0230.desc:0 "“每块土地都有它的#italic 胡克（huk）#!，[ROOT.Char.GetTitleAsNameNoTooltip]，”村里的长者拍着我的手臂解释道。\n\n我在帕米尔高原的某个村庄里处理一些官方事务。现在我正在休息，并与当地的一位长者进行交谈。\n\n他继续说：“在我们的语言中，这意味着土地的精神。#italic 胡克（huk）#!可以来自于水，也可以来自于土壤。村里的每个人，无论男女老少，都有自己的#italic 胡克（huk）#!。#italic 胡克（huk）#!的不同解释了为什么我们村的人温柔、聪明、有礼貌，而下游村的人却粗鲁、蛮横、愤怒。”"
 pamir.0230.a:0 "真是一个对#italic 胡克（huk）#!的高明见解，亲爱的长老"
 pamir.0230.b:0 "我参观了另一个村子，他们不是这样的！"
 pamir.0230.c:0 "这听起来像是一些愚蠢的农民迷信。"
 pamir.0231.t:0 "一个美丽河谷"
 pamir.0231.desc:0 "虽然帕米尔高原和兴都库什山脉可能是寒冷和荒凉的，但它也有隐藏的美。有一天你在领土上旅行时，你遇到了一个山谷，葱绿的植物布满在山谷之中里面充满了盛开的鲜花，还有几个湖泊，湖水清澈见底。你敬畏地注视着眼前的天堂景象，这种景象只有在世界屋脊上才能看到。"
 pamir.0231.a:0 "不可思议！"
