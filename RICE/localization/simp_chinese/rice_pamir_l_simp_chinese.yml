 RICE_pamir_aspiration_zunbil_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_zabulistan').GetNameNoTier]\n$EFFECT_LIST_BULLET$成为一名独立的[king|E][rank|E][ruler|E]或者至少拥有#V 12块#![counties|E]\n$EFFECT_LIST_BULLET$保持尊日教信仰\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得#V 500人#!的[GetMaA('RICE_pamir_tribesmen').GetName][special_troops|E]\n$EFFECT_LIST_BULLET$每个位于[GetTitleByKey('d_zabulistan').GetNameNoTier]的[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$至少直接杀死萨法尔三兄弟雅各布、阿姆尔和阿里中的一位（完成奖励：每杀死一人可获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![dynasty_prestige|E]）\n$EFFECT_LIST_BULLET$使用$RICE_pamir_restore_the_idol_of_zun$[decision|E]（完成奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）#!"
 RICE_pamir_historical_aspiration_action_zunbil: "#italic 你必须挺身而出，成为真正的尊之神选，确保樽比勒人的长期生存，以及你的人民的古老生活方式——并冲破万难。#!$RICE_pamir_aspiration_zunbil_desc$"
