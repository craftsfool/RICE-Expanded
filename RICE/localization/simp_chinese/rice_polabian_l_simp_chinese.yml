 activity_RICE_polabian_drowning_marzanna:0 "水淹[GetPlayer.Custom('RICE_marzanna')]"
 activity_RICE_polabian_drowning_marzanna_desc:0 "冬日将去：最好的庆祝方式当然是火烧[GetPlayer.Custom('RICE_marzanna')]的稻草人，并把它扔到河里！"
 activity_RICE_polabian_drowning_marzanna_selection_tooltip: "以传统的斯拉夫祭祀庆祝冬天的结束。\n\n$activity_RICE_polabian_drowning_marzanna_context_tooltip$"
 activity_RICE_polabian_drowning_marzanna_context_tooltip: "#emphasis 历史背景：#!在尚未基督教化的时候，玛扎娜或称莫拉娜是西斯拉夫人的死亡、重生以及生命女神。冬去春至，为了迎接春天的到来，传统上人们会制作一个玛扎娜的稻草人，然后将其焚烧并扔入水中。在斯拉夫人基督教化后，教会曾多次试图禁止这一仪式，但在波兰、捷克和斯洛伐克等国，这一仪式一直持续至今。不过，如今这一仪式已经失去了宗教意义，更多的是一种娱乐活动，尤其是对儿童而言。"
 activity_RICE_polabian_drowning_marzanna_host_desc: "\n$BULLET_WITH_TAB$如果你是斯拉夫真理教徒，则获得[piety_i][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$你拥有的每个[county|E]都有机会获得[GetModifier('RICE_polabian_drowning_marzanna_county_modifier').GetNameWithTooltip][county_modifier|E]\n$BULLET_WITH_TAB$有较小几率获得#N 恶兆#![character_modifier|E]，尤其是你的[piety_level|E]较低时"
 activity_RICE_polabian_drowning_marzanna_guest_desc: ""
 activity_RICE_polabian_drowning_marzanna_province_desc: "有一条河流，那里是进行水淹理想场所。"
