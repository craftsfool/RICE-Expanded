 polabian.0060.t:0 "着手准备"
 polabian.0060.desc.intro:0 "冬天是一年中最荒凉、凄冷的季节。"
 polabian.0060.desc.culture:0 "因此，许多[GetPlayer.GetCulture.GetCollectiveNoun]人"
 polabian.0060.desc.not_culture:0 "因此，我治下的许多人"
 polabian.0060.desc:0 "每年都会举办扎普斯特节，以驱赶冬天的严寒，及与之相关的恶魔和邪恶势力。不过，在很多时候，这只是大家聚在一起寻欢作乐的“借口”罢了。\n\n今年我要参加当地的扎普斯特节，现在已经到达了举行节日的小镇。每个来来往往的人都在忙着为节日做准备，我已经迫不及待地想要开始庆祝活动了，尤其是节日中的游行活动。"
 polabian.0060.a:0 "虽然很冷，但值得等待！"
 polabian.0061.t:0 "游行开始了"
 polabian.0061.desc:0 "扎普斯特节到了！\n\n冬风虽冷，却吹不散人们心中的火热。从平民到贵族，甚至是我自己，都穿上了自己最好的衣服，聚集在城镇的中心。尤其是那些未婚的青年男女，身上满是五颜六色的鲜花和丝带，展示着他们的青春活力。\n\n公开致辞一结束，盛大的游行队伍便开始了穿越小镇，音乐家们尽可能大声地演奏音乐，每个人经过时都欢呼跳舞，发出巨大的声音。游行队伍的领队拿着一根饰有彩色丝带的木棍，引导游行队伍拜访并感谢我这样有地位的人给予他们捐赠。"
 polabian.0061.a:0 "这是捐赠给你们的。"
 polabian.0061.b:0 "这才是给庆典#italic 真正的#!捐赠！"
 polabian.0062.t:0 "游行结束了"
 polabian.0062.desc:0 "游行队伍继续前进，为观众提供酒水、糖果和其他小吃，整场气氛变得越来越喧闹，但并不是坏事！\n\n最后，人们似乎都忘记了现在还是冬天，因为许多当地人都在队伍旁边跳舞庆祝，跟着队伍绕着整个城镇转圈。\n\n当游行队伍回到镇中心的起点后，所有人都会参加今晚的盛宴，人们将大吃大喝，尽情跳舞——寒冷的季节里，这里将温暖人们的心！"
 polabian.0062.a:0 "大家度过了一段欢乐的时光。"
 polabian.0063.t:0 "结束"
 polabian.0063.desc:0 "不得不说，昨晚的庆祝活动让我感到非常疲惫。不过，显然大家都玩得很开心。\n\n无论如何，扎普斯特节现已结束。虽然现在还是冬天，但感觉离春天又近了许多。尽管春天来得还不够快，但我觉得大多数人都会嫌庆典结束的太快。"
 polabian.0063.a:0 "但确实很有趣！"
