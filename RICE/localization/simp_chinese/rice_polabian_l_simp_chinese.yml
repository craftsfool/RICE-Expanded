 polabian.0020.t:0 "着手准备"
 polabian.0020.desc.culture:0 "每年冬季结束时，[GetPlayer.GetCulture.GetCollectiveNoun]"
 polabian.0020.desc.not_culture:0 "每年冬季结束时，当地人"
 polabian.0020.desc:0 "都会举行水淹[GetPlayer.Custom('RICE_marzanna')]的仪式——或者，准确来说是水淹[GetPlayer.Custom('RICE_marzanna')]的稻草人。\n\n我尽所能得提供资金和人力，以确保仪式取得成功。到目前为止，我观察到当地人正在辛勤地为这一天做准备，特别是拿稻草仔细地用白布、丝带和项链装饰，以制作稻草人。\n\n"
 polabian.0020.desc.non_pagan:0 "[GetPlayer.Custom('RICE_marzanna')]在过去是掌管死亡、重生和生命的女神，虔诚的[ROOT.Char.GetFaith.GetAdjective][GetPlayer.GetFaith.PriestNeuterPlural]可能会将这一传统斥之为异端迷信。不过，安全总比遗憾好，更何况这是一项有趣的活动！"
 polabian.0020.desc.pagan:0 "这一传统已传承了几代人，我们每年都必须进行这一仪式。[GetPlayer.Custom('RICE_marzanna')]是死亡、重生和生命女神，通过溺死祂的草人，我们可以加快春天的到来，确保丰收。"
 polabian.0020.a:0 "很快，我们将水淹稻草人"
 polabian.0021.t:0 "稻草人游行"
 polabian.0021.desc:0 "最后，[GetPlayer.Custom('RICE_marzanna')]的稻草人终于完成了！当地的年轻人抬着这个用布条和其他装饰品装饰得美轮美奂的稻草人像在城里游行，场面十分壮观。当地人聚集在一起的欢呼雀跃，庆祝冬天即将过去，春天即将来临！\n\n随着时间的推移，稻草人被高高举起，在四处游行，经过每家每户，它甚至会被浸泡在沿途的水坑里。\n\n到了傍晚，我们一起来到镇子附近的河边。"
 polabian.0021.a:0 "是时候水淹[GetPlayer.Custom('RICE_marzanna')]了！"
 polabian.0022.t:0 "扔到水里去！"
 polabian.0022.desc:0 "很快，[GetPlayer.Custom('RICE_marzanna')]的稻草人就被带到附近河边。几个人试图点燃它，很快就烧了起来，大家就欢呼着把稻草人扔进河里。\n\n但是，我们只能在这里逗留一段时间，因为稻草人带着死亡的气息，据说留在这里会带来厄运。我们必须返回村子，确保不要碰触稻草人，也不要回头看它。"
 polabian.0022.a:0 "我们赶紧回去吧。"
 polabian.0022.tooltip:0 "仪式结束后，你会招来厄运"
 polabian.0023.t:0 "结束"
 polabian.0023.desc:0 "在城里，人们为我准备了丰盛的宴席。毕竟我不是每天都来，而今天是个特殊的日子。\n\n当我坐下来享用一些粗淡的饺子、夸克奶酪和浓汤时，我回想起今年参加水淹[GetPlayer.Custom('RICE_marzanna')]的经历。那真是一个有趣而又严肃的活动，因为每个人不仅希望，而且需要春天快点到来，毕竟人的生活离不开春天。"
 polabian.0023.a:0 "希望明年能有个好收成！"
