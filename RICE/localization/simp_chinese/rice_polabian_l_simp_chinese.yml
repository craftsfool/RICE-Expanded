 polabian.0050.t:0 "给斯韦托维德的献礼"
 polabian.0050.desc:0 "多年来，伟大的斯韦托维德神像始终屹立于[GetTitleByKey('c_rugen').GetNameNoTier]岛的阿尔科纳神殿中。这座四头神像气势恢宏，无与伦比，右手拿着一个巨大的空心角，左手拿着一把弓。\n\n来自四面八方的人们来此敬献贡品，以求展现己之虔诚，获斯韦托维德赐福。我也不例外，向[GetTitleByKey('c_rugen').GetNameNoTierNoTooltip]岛敬献了贡品。\n\n临近年底，斯韦托维德的祭司举行了一个盛大的典仪，进行各种仪式，以预测未来。我希望我的贡品会让斯韦托维德满意。"
 polabian.0050.a:0 "我们热切地等待着来自[GetTitleByKey('c_rugen').GetNameNoTierNoTooltip]的最新消息！"
 polabian.0050.tooltip:0 "$RICE_polabian_gift_to_svetovit_decision_effect_tooltip_2$"
 polabian.0051.t:0 "神谕的结果"
 polabian.0051.desc:0 "我收到消息，[GetTitleByKey('c_rugen').GetNameNoTier]岛阿尔科纳神殿的斯韦托维德祭司今年举行了传统的占卜仪式，包括献祭牲畜。按照古老的传统，他们会在前一天晚上把酒装进神像右手的角中；第二天再进入神庙，神谕的结果取决于角里还剩多少酒。之后，祭司们将酒倒在斯韦托维德的脚下，祈求繁荣昌盛。\n\n"
 polabian.0051.desc.bad:0 "今年的占卜结果很糟糕，角里的酒明显比以前少了。唉，这不仅意味着即将歉收甚至绝收，而且今年向斯韦托维德上供之人也可能遭到不幸，包括我自己。"
 polabian.0051.desc.good:0 "今年占卜的结果很不错，角里装满了酒。该地区将会有丰收，而且今年所有给斯韦托维德上供之人也将获得赐福，包括我自己。"
 polabian.0051.a:0 "无论如何，斯韦托维德已经开口了！"
 polabian.0052.t:0 "一无所获"
 polabian.0052.desc:0 "异教蛮族洗劫不反洗劫了[GetTitleByKey('c_rugen').GetNameNoTier]岛上的阿尔科纳神庙，还推倒了那里曾经辉煌无比的斯韦托维德神像。我之前敬献给斯韦托维德的礼品都打了水漂，因为收礼的神像都没了。"
 polabian.0052.a:0 "我的贡品白献了！"
 polabian.0052.tooltip:0 "你无法从$RICE_polabian_gift_to_svetovit_decision$[decision|E]中得到任何收益。"
 polabian.0053.t:0 "摒弃神像"
 polabian.0053.desc:0 "不久前，我向[GetTitleByKey('c_rugen').GetNameNoTier]岛阿尔科纳神庙中的斯韦托维德神像敬献了礼物。然而，我最近皈依了[ROOT.Char.GetFaith.GetName]，因为我不愿将这种渎神的贡品来支持斯韦托维德纵容、欺诈、贪婪的牧师。\n\n虽然我无法改变过去，但我将从此与斯韦托维德神一刀两断。"
 polabian.0053.a:0 "谢天谢地！我这就向[ROOT.Char.GetFaith.HighGodName]祈祷。"
 polabian.0054.t:0 "xxxxx"
 polabian.0054.desc:0 "xxxxx"
 polabian.0054.a:0 "xxxxx"
 polabian.0055.t:0 "推倒斯韦托维德神像"
 polabian.0055.desc:0 "多年来，斯韦托维德神像始终屹立于[GetTitleByKey('c_rugen').GetNameNoTier]岛的阿尔科纳神殿中。\n\n今天对所有信仰[arkona_destroyer.GetFaith.GetName]的人来说都是个大日子。[GetTitleByKey('c_rugen').GetNameNoTier]的统治者将对斯韦托维德的崇拜列为非法。无论[arkona_destroyer.GetTitledFirstName]是对是错，恶人乞求这位“神明”来满足他们扭曲的欲望，邪恶的祭司诱骗天真的傻瓜，以神明的名义索取钱，只有被欺骗的人在崇拜这个偶像，这也是为什么[arkona_destroyer.GetTitledFirstName]将斯韦托维德像视作一块破木头。\n\n[arkona_destroyer.GetFirstNameNoTooltip]命令[arkona_destroyer.GetHerHis]的[chaplain.GetCouncilTitle][chaplain.GetFirstName]去将斯韦托维德神像推倒并砍成碎片。从今往后，人们将跟随[arkona_destroyer.GetFaith.HighGodName]之光。"
 polabian.0055.a:0 "斯韦托维德信徒的末日到了吗？"
 polabian.0056.t:0 "重塑斯韦托维德的神像"
 polabian.0056.desc:0 "多年来，伟大的斯韦托维德神像始终屹立于[GetTitleByKey('c_rugen').GetNameNoTier]岛的阿尔科纳神殿中。但异教徒摧毁了它，扬言此神像乃对他们信仰的亵渎。异教暴君试图以暴力统治斯韦托维德的信众。\n\n如今，沧海桑田，此地现任[arkona_restorer.GetFaith.GetAdjective]统治者，[arkona_restorer.GetTitledFirstName]，已命令[arkona_restorer.GetHerHis]的[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]带领当地人重建一个新的斯韦托维德神像，一个与旧神像一样伟岸的神像。\n\n如今，人人都可以如从前那样崇拜斯韦托维德，向其敬献贡品以祈求赐福。"
 polabian.0056.a:0 "这一次，神像还能继续存续吗？"
