 RICE_polabian_temple_of_arkona_modifier: "斯韦托维德神像"
 RICE_polabian_temple_of_arkona_modifier_desc: "#EMP 如有[idol_of_svetovit|E]，附近[landed|E]的斯拉夫[faith|E][rulers|E]就可以使用$RICE_polabian_gift_to_svetovit_decision$[decision|E]。每年该[modifier|E]会根据该[county|E]的统治者是否为斯拉夫真理教进行判定，从而获得#P 增益#!或#N 减益#!加成，非斯拉夫真理教徒可使用[decision|E]来摧毁神像。#!\n\n"
