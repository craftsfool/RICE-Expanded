 activity_RICE_polabian_zapust_festival:0 "扎普斯特节"
 activity_RICE_polabian_zapust_festival_desc:0 "冬季将至，而扎普斯特节亦同将至。我们应该参加今年的扎普斯特节，在这个寒冷的冬季寻找一些欢乐和温暖！"
 activity_RICE_polabian_zapust_festival_selection_tooltip: "庆祝扎普斯特节。\n\n$activity_RICE_polabian_zapust_festival_context_tooltip$"
 activity_RICE_polabian_zapust_festival_context_tooltip: "#emphasis 历史背景：#!在现代，扎普斯特节（索布语意为“忏悔节”）是德国东部卢萨蒂亚地区索布人的庆典，它举行于四旬斋前，但这一习俗在其基督教化之前便已有先例。作为最后幸存的波拉比亚斯拉夫人，扎普斯特节等传统对于索布人保持其身份和文化非常重要。当然现在的扎普斯特节受到现代活动的影响，曾经的许多资料已经无法考证。"
 activity_RICE_polabian_zapust_festival_host_desc: "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$你拥有的每个[county|E]都有机会获得[GetModifier('RICE_polabian_zapust_festival_county_modifier').GetNameWithTooltip][county_modifier|E]"
