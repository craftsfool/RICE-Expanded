 RICE_polabian_zapust_festival_county_modifier: "成功举办扎普斯特节"
 RICE_polabian_zapust_festival_county_modifier_desc: "该地区最近成功举办了盛大的扎普斯特节。它将生活在这里的人们聚集在一起，加强了彼此之间的社会纽带联系。"
 RICE_polabian_drowning_marzanna_county_modifier: "成功举办水淹玛扎娜活动"
 RICE_polabian_drowning_marzanna_county_modifier_desc: "该地区最近举行了传统庆祝活动，将[GetPlayer.Custom('RICE_marzanna')]的稻草人溺死。当地人认为，这个仪式非常顺利，保证了该地区所有居民的丰收。"
 RICE_polabian_marzanna_superstition_1: "碰了水里的玛扎娜稻草人"
 RICE_polabian_marzanna_superstition_2: "回头看了玛扎娜的稻草人"
 RICE_polabian_marzanna_superstition_3: "水淹玛扎娜后在回去路上摔倒"
 RICE_polabian_destroy_arkona_idol_modifier: "摧毁斯韦托维德神像"
 RICE_polabian_restore_arkona_idol_modifier: "重建斯韦托维德神像"
 RICE_polabian_renovated_slavic_ringfort: "修复斯拉夫环形堡垒"
 RICE_polabian_beef_dumplings_horseradish_sauce: "吃配辣根酱的牛肉饺子"
 RICE_polabian_graben_modifier: "统治者帮助马群抵御格拉本"
 RICE_polabian_powerful_svetovit_priests: "权势滔天的斯韦托维德祭司"
 RICE_polabian_powerful_svetovit_priests_desc: "由于阿尔科纳的斯韦托维德神庙的显赫地位，那里的祭司影响力极大，削弱了世俗领主在该地的权威。"
 RICE_polabian_oppressing_svetovit_priests: "试图压制斯韦托维德的祭司们"
 RICE_polabian_oppressing_svetovit_priests_desc: "由于阿尔科纳的斯韦托维德神庙的显赫地位，那里的祭司获得了太多的权力，压制了世俗领主。世俗领主正竭尽所能地遏制祭司的影响力，试图重新树立自己的权威。"
 RICE_polabian_cooperating_svetovit_priests: "与斯韦托维德祭司和解"
 RICE_polabian_cooperating_svetovit_priests_desc: "由于阿尔科纳的斯韦托维德神庙的显赫地位，那里的祭司影响力极大，因而与世俗领主的关系紧张，但双方都设法达成和解，并为改善该地区的状况而共同努力。"
 RICE_polabian_spreewald: "施普雷瓦尔德"
 RICE_polabian_spreewald_desc: "#italic 施普雷瓦尔德#!是施普雷河的内陆大三角洲。该地区到处都是森林、沼泽和草地，此外还有天然和人工水道、运河和灌溉系统。几个世纪以来，当地部族很好地适应了这一独特的地貌。"
 RICE_polabian_destroy_arkona_temple:0 "拆除阿尔科纳神像"
 RICE_polabian_destroy_arkona_temple_tooltip:0 "此等异教神像的存在是对[ROOT.Char.GetFaith.HighGodName]的侮辱！"
 RICE_polabian_destroy_arkona_temple_desc:0 "多年来，[GetTitleByKey('c_rugen').GetNameNoTier]岛上的阿尔科纳神殿一直被用作崇拜异教神[svetovit_short|E]。为彻底清除斯韦托维德及其邪恶的祭司对该地的影响，我们当摧毁放在阿尔科纳神殿中心的[idol_of_svetovit|E]。"
 RICE_polabian_destroy_arkona_temple_confirm:0 "必须摧毁岛上的神像！"
 RICE_polabian_destroy_arkona_temple_effect_tooltip_1:0 "斯拉夫真理教[rulers|E]将不能使用去[arkona_short|E]$RICE_polabian_gift_to_svetovit_decision$[decision|E]"
 RICE_polabian_destroy_arkona_temple_context_tooltip:0 "#emphasis 历史背景：#!吕根岛上（今德国境内）的阿尔科纳神殿是中世纪早期斯拉夫真理教的主要宗教场所。这里供奉着著名的斯韦托维德神像，斯韦托维德神是该地人普遍信仰的神明，其强大的祭司通过举行仪式预测下一次收获的结果。公元1168年，丹麦国王瓦尔德马一世和主教阿布萨隆率丹麦军队攻占阿尔科纳，拆毁了神像，该岛亦逐渐基督教化。"
 RICE_polabian_restore_arkona_temple:0 "重建阿尔科纳神像"
 RICE_polabian_restore_arkona_temple_tooltip:0 "我们必须恢复人民曾经崇拜的神像！"
 RICE_polabian_restore_arkona_temple_desc:0 "多年来，[GetTitleByKey('c_rugen').GetNameNoTier]岛上的阿尔科纳神殿一直被用作崇拜伟大的[svetovit_short|E]神。但那些邪恶无知的蛮子摧毁了神殿的大部，甚至还推倒了伟大的[idol_of_svetovit|E]。现在，我们重新征服了这里。我们应当重建[svetovit_idol_short|E]。"
 RICE_polabian_restore_arkona_temple_confirm:0 "古老诸神当回归阿尔科纳！"
 RICE_polabian_restore_arkona_temple_effect_tooltip_1:0 "斯拉夫真理教[rulers|E]现在又可以使用去[arkona_short|E]$RICE_polabian_gift_to_svetovit_decision$[decision|E]了"
 RICE_polabian_restore_arkona_temple_context_tooltip:0 "$RICE_polabian_destroy_arkona_temple_context_tooltip$"
 RICE_polabian_gift_to_svetovit_decision:0 "向斯韦托维德献礼"
 RICE_polabian_gift_to_svetovit_decision_tooltip:0 "向[idol_of_svetovit|E]献礼，以求在今年晚些时候获得[modifiers|E]。"
 RICE_polabian_gift_to_svetovit_decision_desc:0 "[GetTitleByKey('c_rugen').GetNameNoTier]岛上的阿尔科纳神殿中矗立着伟大的[idol_of_svetovit|E]。礼赞旧日诸神并向[svetovit_short|E]献礼之人或将得赐福。"
 RICE_polabian_gift_to_svetovit_decision_confirm:0 "准备献给斯韦托维德的贡品"
 RICE_polabian_gift_to_svetovit_decision_effect_tooltip_1:0 "你将选择要献给[idol_of_svetovit|E]的贡品的多少，这将影响你获得的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]的多少。"
 RICE_polabian_gift_to_svetovit_decision_effect_tooltip_2:0 "你将在#bold 十一月#!收到神谕占卜是否为吉兆（#V 50%#!几率）的通知。如果是吉兆，你将获得额外奖励，包括根据贡品多少获得增益[character_modifier|E]的几率。"
 RICE_polabian_gift_to_svetovit_decision_context_tooltip:0 "$RICE_polabian_destroy_arkona_temple_context_tooltip$"
 RICE_polabian_gift_to_svetovit_decision_type:0 "选择贡品的多少"
 RICE_polabian_gift_to_svetovit_decision_gui:0 "选择献給[svetovit_short|E]的贡品"
 RICE_polabian_gift_to_svetovit_decision_small_option:0 "#Bold 适度的贡品#!"
 RICE_polabian_gift_to_svetovit_decision_small_option_desc:0 "$RICE_polabian_gift_to_svetovit_decision_small_option$"
 RICE_polabian_gift_to_svetovit_decision_small_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_small_cost')]#!#!\n\n$EFFECT_LIST_BULLET$占卜结果有#P [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_modifier_chance_small')]%#!的概率是吉兆。若是，你将获得增益[modifier|E]\n$EFFECT_LIST_BULLET$获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_small_bonus')]#![piety|E]。如果占卜结果是吉兆，还将额外获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_small_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_small_bonus')]#![prestige|E]"
 RICE_polabian_gift_to_svetovit_decision_medium_option:0 "#Bold 大额的贡品#!"
 RICE_polabian_gift_to_svetovit_decision_medium_option_desc:0 "$RICE_polabian_gift_to_svetovit_decision_medium_option$"
 RICE_polabian_gift_to_svetovit_decision_medium_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_medium_cost')]#!#!\n\n$EFFECT_LIST_BULLET$占卜结果有#P [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_modifier_chance_medium')]%#!的概率是吉兆。若是，你将获得增益[modifier|E]\n$EFFECT_LIST_BULLET$获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_medium_bonus')]#![piety|E]。如果占卜结果是吉兆，还将额外获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_medium_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_medium_bonus')]#![prestige|E]"
 RICE_polabian_gift_to_svetovit_decision_large_option:0 "#Bold 巨额的贡品#!"
 RICE_polabian_gift_to_svetovit_decision_large_option_desc:0 "$RICE_polabian_gift_to_svetovit_decision_large_option$"
 RICE_polabian_gift_to_svetovit_decision_large_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_large_cost')]#!#!\n\n$EFFECT_LIST_BULLET$占卜结果有#P [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_modifier_chance_large')]%#!的概率是吉兆。若是，你将获得增益[modifier|E]\n$EFFECT_LIST_BULLET$获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_large_bonus')]#![piety|E]。如果占卜结果是吉兆，还将额外获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_large_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_polabian_svetovit_offering_large_bonus')]#![prestige|E]"
