 game_concept_idol_of_svetovit:0 "斯韦托维德神像"
 game_concept_idol_of_svetovit_desc:0 "历史上，德国东北吕根岛上的阿尔科纳曾是斯拉夫真理教的主要宗教场所。那里的神殿中供奉着一个大型神像，游戏中有几个玩法与之有关。\n\n吕根（或罗尼）的[county|E]将获得[GetModifier('RICE_polabian_temple_of_arkona_modifier').GetNameWithTooltip][county_modifier|E]。根据此地的[ruler|E]是否信仰斯拉夫真理教提供#P 正面#!或#N 负面#!修正。只要有该[modifier|E]，附近的斯拉夫真理教徒就可以使用$RICE_polabian_gift_to_svetovit_decision$[decision|E]，获得多种加成。\n\n不信仰斯拉夫真理教的[ruler|E]可使用$RICE_polabian_destroy_arkona_temple$[decision|E]，以移除该[modifier|E]，阻止斯拉夫真理教使用斯韦托维特[decision|E]。若之后斯拉夫真理教成功夺回了此地，则可以使用$RICE_polabian_restore_arkona_temple$[decision|E]。"
 RICE_polabian_aspiration_budivoj_henry_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_nordmark').GetNameNoTier]\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('d_nordmark').GetNameNoTier]的[ruler|E]\n$EFFECT_LIST_BULLET$克鲁托伊已死亡或没有[titles|E]\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$[dynasty|E]获得[GetModifier('RICE_polabian_scions_of_saint_gottschalk').GetNameWithTooltip][modifier|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$保持基督教信仰（奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）\n$EFFECT_LIST_BULLET$作为兄弟中的任意一方直接杀死克鲁托伊（奖励：@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]）#!"
 RICE_polabian_historical_aspiration_action_budivoj_henry: "#italic 你的父亲被异教叛军杀害。为了给父亲报仇，你和你的兄弟必须智取被叛军推举为新王公的克鲁托伊。#!$RICE_polabian_aspiration_budivoj_henry_desc$"
 RICE_polabian_historical_aspiration_modifier_desc_budivoj_henry: "[GetModifier('RICE_polabian_aspiration_gottschalk_sons_revenge').GetNameWithTooltip]"
 RICE_polabian_aspiration_krutoj_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_nordmark').GetNameNoTier]\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('d_nordmark').GetNameNoTier]的[ruler|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_holstein').GetNameNoTier]或[GetTitleByKey('d_ostmark').GetNameNoTier]\n$EFFECT_LIST_BULLET$保持斯拉夫真理教信仰\n$EFFECT_LIST_BULLET$布迪沃伊和亨里克已死亡\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$[dynasty|E]获得[GetModifier('RICE_polabian_defenders_of_svetovit').GetNameWithTooltip][modifier|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$至少使用一次$RICE_polabian_gift_to_svetovit_decision$[decision|E]（奖励：@piety_icon!#V 200#![piety|E]一次，#V 1000#![piety_i|E]封顶）\n$EFFECT_LIST_BULLET$至少杀死布迪沃伊和亨里克中的一人（奖励：@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![dynasty_prestige|E]一人）#!"
 RICE_polabian_historical_aspiration_action_krutoj: "#italic 奥博特里特贵族推翻了基督徒古茨卡尔克的统治，你因此上台执政，但你需要杀死古茨卡尔克幸存的儿子——布迪沃伊和亨里克来确保万无一失。#!$RICE_polabian_aspiration_krutoj_desc$"
