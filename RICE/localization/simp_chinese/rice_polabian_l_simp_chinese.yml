 polabian.0030.t:0 "碰触玛扎娜的不幸"
 polabian.0030.desc:0 "啊该死！\n\n回家路上，我不小心迷了路，走回了河边，而且很不幸地碰到了水中[GetPlayer.Custom('RICE_marzanna')]的稻草人。\n\n也许是不幸中的万幸吧，至少我没掉到河里去，也没碰到稻草人被烧的那部分。\n\n相传认一旦稻草人已被扔入水中，触摸它的任何部分都是不吉利的。我发现一些人都不大敢看我，还有一些人忧心忡忡地盯着我的手，因为据说碰触过水中的[GetPlayer.Custom('RICE_marzanna')]稻草人的手会枯萎。"
 polabian.0030.a:0 "希望我的手不会因此枯萎。"
 polabian.0031.t:0 "别回头看！"
 polabian.0031.desc:0 "我在想什么呢？\n\n在我们返回镇子的路上，我听到身后有响动，便本能地回头看了一眼。我刚一回头，就听到离我最近的人在低声窃窃私语，还有小声的喘息声。\n\n有一种古老的迷信说法，认为[GetPlayer.Custom('RICE_marzanna')]的稻草人被扔到水里后，人们不应该往后看。据说这样做的人会在不久的将来患上各种疾病。"
 polabian.0031.a:0 "我相信会没事的……我想……"
 polabian.0032.t:0 "一个失误"
 polabian.0032.desc:0 "该死！\n\n回去的路上，我一个踉跄，摔了个大跟头。我的几个仆人急忙把我扶起来，但在场的所有人都看到了刚刚发生的一切。\n\n如果这事只是尴尬也就罢了。但很多人都相信一种迷信，即在水淹[GetPlayer.Custom('RICE_marzanna')]稻草人后在回家的路上摔倒，就会招致厄运，甚至可能导致自己或身边的人死亡。"
 polabian.0032.a:0 "噢天哪，天哪……"
