 polabian.0010.t:0 "圣[gottschalk.GetFirstNameNoTooltip]的子嗣"
 polabian.0010.desc:0 "几个月前，奥博特里特的[christian.GetAdjective]领主[gottschalk.GetFirstName]在起义中为斯拉夫真理教部落杀死。起义者推荐[krutoj.GetFirstName]为新的奥博特里特王公。\n\n对于信仰[christian.GetAdjectiveNoTooltip]的奥博特里特人来说，他们仍寄希望于[gottschalk.GetFirstNamePossessiveNoTooltip]的两个儿子，[budivoj.GetFirstName]和[henry.GetFirstName]，他们在乱军中幸存了下来，流亡在外。他们要为死去的父亲报仇，但亦意识到自己处于弱势地位，于是与萨克森的统治者[ordulf.GetFirstName]及[ordulf.GetFirstName]的儿子[magnus.GetFirstName]结盟，等待时机。此时，[krutoj.GetFirstNameNoTooltip]已意识到这对兄弟是对[krutoj.GetHerselfHimself]和那些坚决反对[christian.GetName]的奥博特里特人的长期威胁。\n\n无论是通过战争、阴谋还是其他手段，双方迟早都会实现自己的愿望——消灭对方。"
 polabian.0010.a:0 "父亲，我们将为你复仇，夺回我们的土地！"
 polabian.0010.tooltip:0 "#bold 布迪沃伊和亨里克的[RICE_aspiration|E]：为圣古茨卡尔克复仇#!$RICE_polabian_aspiration_budivoj_henry_desc$\n"
 polabian.0011.t:0 "文德人[krutoj.GetFirstNameNoTooltip]"
 polabian.0011.desc:0 "$polabian.0010.desc$"
 polabian.0011.a:0 "[gottschalk.GetFirstNamePossessiveNoTooltip]的子嗣是我们不会忽视的威胁！"
 polabian.0011.tooltip:0 "#bold 克鲁托伊的[RICE_aspiration|E]：消灭古茨卡尔克的子嗣#!$RICE_polabian_aspiration_krutoj_desc$\n"
 polabian.0012.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 polabian.0012.desc:0 "我还记得，我们亲爱的父亲[gottschalk.GetTitledFirstName]被狂热的异端叛军杀害，随后，叛军推举丑恶的[krutoj.GetFirstName]成为[GetTitleByKey('d_nordmark').GetNameNoTier]的新“统治者”。我和[brother.GetFirstName]不得不逃走。\n\n现在，我们最近得胜归来，不仅要夺回我们作为这片土地统治者的先天权利，还要为我们的父亲报仇。"
 polabian.0012.desc.alive:0 "在命运的奇妙转折中，现在是[krutoj.GetFirstNameNoTooltip]像个懦夫一样流亡在外。"
 polabian.0012.desc.direct:0 "[krutoj.GetFirstNameNoTooltip]因其罪孽而被我们亲手杀死。我们终于报了血海深仇！"
 polabian.0012.desc.indirect:0 "我们没有直接杀死[krutoj.GetFirstNameNoTooltip]，但我不会抱怨这一[ROOT.Char.GetFaith.PantheonTerm]的赐福。"
 polabian.0012.desc.one_brother:0 "\n\n我只希望我的兄弟[brother.GetFirstNameNoTooltip]能在此见证这一刻。不过，我会尽我所能，继承我们父亲的遗志，成为这片土地上贤明而正直的统治者。"
 polabian.0012.desc.both_brothers:0 "\n\n我的兄弟[brother.GetFirstNameNoTooltip]和我，以及我们的人民，现在可以拥有更美好的未来了。我们将竭尽全力继承父亲的遗志。"
 polabian.0012.a:0 "我们圣洁的父亲从[ROOT.Char.GetFaith.PositiveAfterLife]中微笑着！"
 polabian.0013.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 polabian.0013.desc:0 "我和其他斯拉夫真理教联军击败[gottschalk.GetFirstName]后，夺取[GetTitleByKey('d_nordmark').GetNameNoTier]的控制权，恢复了我们的传统，他那两个儿子[budivoj.GetFirstName]和[henry.GetFirstName]一直是我们的眼中钉。这两兄弟在我们这里有不少支持者，主要是那些和他们一样追随[christian.GetName]的人。除非将这两人除掉，否则该地区永无安宁。\n\n虽然我们仍面临着更大的威胁，比如[christian.GetAdjective]国家的侵扰，但我已经保护了领地的安全，并确保这两兄弟不再给我们带来任何麻烦。"
 polabian.0013.desc.direct:0 "经过不懈的努力，我终于杀掉了这两兄弟，把他们送进了[ROOT.Char.GetFaith.NegativeAfterLife]的黑暗深渊。"
 polabian.0013.desc.indirect:0 "虽然这#italic 两兄弟#!的死亡与我没有直接责任，但我并不会抱怨来自[ROOT.Char.GetFaith.PantheonTerm]的赐福。"
 polabian.0013.a:0 "我们现在必须为未来的威胁做好准备。"
