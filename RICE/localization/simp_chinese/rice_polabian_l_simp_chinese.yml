 polabian.0080.t:0 "向斯韦托维德致敬"
 polabian.0080.desc:0 "[GetTitleByKey('c_rugen').GetNameNoTier]岛上的阿尔科纳神庙里供奉着一尊斯韦托维德神像。那里的祭司拥有强大的政治权力，他们不仅接受所有当地人（从平民到酋长）的贡品，而且还贪婪到以斯韦托维德特的名义向在该地区活动的过往旅行者和外国商人征税。\n\n总之，我听说来自[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]的[ROOT.Char.GetFaith.GetAdjective]商人，只要在岛上做生意，都要缴纳这笔税款，这些商人说这是做生意所必需的，就像其他关税一样，但宫廷有人质疑，崇拜[ROOT.Char.GetFaith.HighGodName]的[ROOT.Char.GetFaith.GetAdherentName]怎么能把钱交给那些假神的骗子祭司呢？"
 polabian.0080.a:0 "我们必须惩罚这些亵渎神明的商人！"
 polabian.0080.b:0 "这有什么问题？生意就是生意。"
 polabian.0081.t:0 "旧斯拉夫环形堡垒"
 polabian.0081.desc:0 "在[county.GetNameNoTier]有一个废弃的环形堡垒，是某个不知名的斯拉夫部族在几代人之前建造的。我们不知道这个部落是迁徙到了别处，还是被敌人打败了，抑或是被现在的居民同化了。\n\n总之，虽然堡垒的状况不是很好，但我们不难想象它全盛时期的样子，与世界上其他地方一些更宏伟的防御工事相比，它的确很简陋，但却是一个不错防御建筑，可以保护着居住在这里的斯拉夫部落。更重要的是，由于堡垒的土墙和木质城墙仍然相当坚固，只要稍加修缮，堡垒就可以再次使用。"
 polabian.0081.a:0 "是的，我们需要在该地区建立更多的防御工事。"
 polabian.0081.b:0 "重建它既浪费时间又浪费资源。"
 polabian.0082.t:0 "悼念斯韦托维德"
 polabian.0082.desc:0 "[GetTitleByKey('c_rugen').GetNameNoTier]岛上的阿尔科纳神庙里供奉着一尊斯韦托维德神像。那里的祭司拥有强大的政治权力，他们不仅接受所有当地人（从平民到酋长）的贡品，而且还贪婪到以斯韦托维德特的名义向在该地区活动的过往旅行者和外国商人征税。\n\n作为[GetTitleByKey('c_rugen').GetNameNoTierNoTooltip]的统治者，我与这些祭司合作，有时也会收到一些礼品，作为我们合作的基础。今天，我就收到了！"
 polabian.0082.a:0 "荣耀归于斯韦托维德！"
 polabian.0083.t:0 "殴打公鸡"
 polabian.0083.desc:0 "打公鸡是[ROOT.Char.GetCulture.GetName]的一种古老习俗，今天我在路过[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]附近的一个[ROOT.Char.GetCulture.GetNameNoTooltip]村庄时，恰好有机会目睹当地人参与其中。\n\n一只公鸡被埋在一个铺满树枝的坑里，大家欢声笑语，蒙着眼睛的年轻人轮流用连枷将公鸡打死。我站在远远地地方看着这场喧闹的活动一直持续到公鸡死去，之后公鸡被卖给出价最高的人。\n\n不得不说看到平民参与古朴的传统活动，不失为一种快乐。"
 polabian.0083.a:0 "这样杀一只鸡确实很有趣！"
 polabian.0083.b:0 "不过……这也太残忍了吧。"
 polabian.0084.t:0 "格拉本"
 polabian.0084.desc:0 "在[county.GetNameNoTier]的[ROOT.Char.GetCulture.GetName]村庄里一个关于#italic 格拉本#!最近出没并杀害当地人的马匹的消息最近传到我耳边。\n\n根据[ROOT.Char.GetCulture.GetNameNoTooltip]传说，这些生物长着马腿，住在洞穴和森林里，经常化身为人。更重要的是它们喜欢吃马。\n\n一些官员认为，这只是当地家族之间的纠纷而已，毕竟，心怀不满的农民可能会杀死邻居的马。但也有人认为，这些消息可能有一定的真实性，我们应该让当地卫兵采取必要的措施，帮助村民保护他们的马匹。"
 polabian.0084.a:0 "让卫兵过去帮助当地人保护他们的马匹"
 polabian.0084.b:0 "这只是一些迷信的无稽之谈。"
 polabian.0085.t:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]牛肉饺子"
 polabian.0085.desc:0 "我正在巡察当地的一个[ROOT.Char.GetCulture.GetName]城镇。当地人竭尽全力为我提供美食，其中的最著名的菜肴是传统的[ROOT.Char.GetCulture.GetNameNoTooltip]辣根汁牛肉饺子。"
 polabian.0085.a:0 "太美味了，谢谢你！"
 polabian.0086.t:0 "权势滔天的祭司"
 polabian.0086.desc:0 "[GetTitleByKey('c_rugen').GetName]岛上的阿尔科纳神庙供奉着斯韦托维德神像，受到该地区许多人的敬仰。\n\n斯韦托维德的祭司权势滔天。尽管我在名义上统治着[GetTitleByKey('c_rugen').GetNameNoTier]，但我必须忍让他们。\n\n最近，这些祭司的权力和影响力不断扩大，让在岛上的官员们抱怨说，如果哪个祭司和他们意见不合，他们就很难开展工作。"
 polabian.0086.a:0 "我们不能反对他们，至少不能公开反对。"
 polabian.0086.b:0 "这些祭司#italic 将#!尊重我的权威。"
 polabian.0086.c:0 "我们可以与他们达成协议。"
