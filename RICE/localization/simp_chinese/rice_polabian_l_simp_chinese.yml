 RICE_polabian_temple_of_arkona_modifier_non_pagan_desc: "$RICE_polabian_temple_of_arkona_modifier_desc$"
 RICE_polabian_aspiration_gottschalk_sons_revenge: "[RICE_aspiration|E]：为圣古茨卡尔克复仇"
 RICE_polabian_aspiration_gottschalk_sons_revenge_desc: "#italic 布迪沃伊和亨里克的父亲被异教叛军杀害。为了给父亲报仇，他们必须智取被叛军推举为新王公的克鲁托伊。#!$RICE_polabian_aspiration_budivoj_henry_desc$\n"
 RICE_polabian_aspiration_krutoj_finish_job: "[RICE_aspiration|E]：消灭古茨卡尔克之子"
 RICE_polabian_aspiration_krutoj_finish_job_desc: "#italic 奥博特里特贵族推翻了基督徒古茨卡尔克的统治，共同推选克鲁托伊上台，但他需要杀死古茨卡尔克幸存的儿子——布迪沃伊和亨里克来确保万无一失。#!$RICE_polabian_aspiration_krutoj_desc$\n\n"
 RICE_polabian_scions_of_saint_gottschalk: "圣古茨卡尔克后裔"
 RICE_polabian_scions_of_saint_gottschalk_desc: "该宗族的圣古茨卡尔克是[GetTitleByKey('d_nordmark').GetNameNoTier]的合法统治者，但他被叛乱的异教徒推翻了。他的儿子布迪沃伊和亨里克成功为父报仇，从异教徒克鲁托伊手中夺回了祖先的领地。"
 RICE_polabian_defenders_of_svetovit: "斯韦托维德之盾"
 RICE_polabian_defenders_of_svetovit_desc: "该宗族的克鲁托伊击败了他的对手——基督徒博迪沃伊和亨利（圣古茨卡尔克的儿子），成功抵御了基督教对[GetTitleByKey('d_nordmark').GetNameNoTier]的入侵。"
 RICE_polabian_svetovit_oracle_modifier_1: "斯韦托维德的吉兆"
 RICE_polabian_svetovit_oracle_modifier_1_desc: "该角色最近向[arkona_short|E]的[idol_of_svetovit|E]献上了祭品。在接下来的丰收节上，斯韦托维特神的祭司预言来年有吉兆，该角色及所有曾向[svetovit_short|E]献祭的角色都将获得赐福。"
 RICE_polabian_svetovit_oracle_modifier_2: "$RICE_polabian_svetovit_oracle_modifier_1$"
 RICE_polabian_svetovit_oracle_modifier_2_desc: "$RICE_polabian_svetovit_oracle_modifier_1_desc$"
