 RICE_nemesis_reason_krutoj_murder:0 "[CHARACTER.GetShortUIName|U]参加了异教叛乱，推翻并杀死了[TARGET_CHARACTER.GetShortUINamePossessive]的父亲古茨卡尔克，让[CHARACTER.GetHerselfHimself]自己登上了王位。现在，双方都有消灭对方的[RICE_aspirations|E]。"
