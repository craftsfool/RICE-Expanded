 red_sea.0050.t:0 "孤苦伶仃"
 red_sea.0050.desc:0 "[sulayhid.GetFullName]骗了我们的父亲[najah.GetFirstNameNicknamed]，派一名女奴毒害了他，企图篡夺[GetTitleByKey('k_yemen').GetNameNoTier]，这些恶行让我们无比怨恨，哪怕一向沉稳内敛的[jayyash.GetFirstName]也是如此，甚至长兄[mu_arik.GetFirstName]因此事一时冲动自尽……\n\n唉……如今诛灭[sulayhid.GetDynasty.GetName]家族的重担落在我的身上。然而，我们如今栖身于遥远的[GetTitleByKey('c_dahlak').GetNameNoTier]，那里的统治者曾向先父纳贡，眼下也暂且收留了我们……"
 red_sea.0050.a:0 "下一步该怎么办是好？"
 red_sea.0051.t:0 "背叛？"
 red_sea.0051.desc:0 "[dahlak_ruler.GetLadyLord][GetTitleByKey('c_dahlak').GetNameNoTier]的统治者[dahlak_ruler.GetFirstName]为我们提供了庇护，但[dahlak_ruler.GetSheHe]是个软弱无能的蠢货。#italic 我#!完全可以成为更好的统治者！这座岛屿虽然不大，却具有极其重要的经济和军事价值。它将是我们向[sulayhid.GetDynasty.GetName]开战的绝佳作战基地。\n\n我集结了同伙，准备对那个愚不可及的[dahlak_ruler.GetFirstNameNoTooltip]发动政变，但我的兄弟[jayyash.GetFirstName]试图阻止我。[jayyash.GetSheHe|U]满口胡言，说什么荣誉，指责我狂妄自大，忘记了为父报仇的主要目标。难道他不明白，这场政变#italic 正是#!实现那个目标的一步吗？"
 red_sea.0051.a:0 "在我们对峙之后，[jayyash.GetFirstNameNoTooltip]阻止了我发动政变。"
 red_sea.0052.t:0 "政变被挫败"
 red_sea.0052.desc:0 "“[jayyash.GetFirstName]，你这个蠢货！”\n\n“没有资源、没有兵员、没有稳固的根据地，我们根本无法击败敌人！就算夺取一座小岛又如何？我们的终极目标始终是为父报仇！”\n\n在我那次失败的政变之后，我本该痛骂[jayyash.GetFirstNameNoTooltip]，可他毕竟还是我的兄弟，只是被那些荣誉和仁慈的迂腐观念误导了。\n\n不过也无妨。这不过是又一道障碍而已。我们又一次被迫四处逃亡，我仍会另寻他法，为父报仇，并让那可憎的[sulayhid.GetDynasty.GetName]家族遭受报应！只盼下次我再拿出新计谋时，那个软弱的[jayyash.GetFirstName]能站在我这一边……"
 red_sea.0052.a:0 "“父亲，您的仇我必报！”"
 red_sea.0053.t:0 "政变"
 red_sea.0053.desc:0 "[jayyash.GetFirstName]或许被他那套荣誉与仁慈的观念误导了，但就连[jayyash.GetSheHe]也不得不勉强同意我的观点：没有资源、士兵和土地，我们根本无法击败敌人。所以哪怕我们通过不那么光彩的手段夺取某个小岛，那又如何？我们的最终目标依然是光荣的——为父亲复仇。\n\n随着[dahlak_ruler.GetFirstName]被逐出[GetTitleByKey('c_dahlak').GetNameNoTier]，我现在掌控了整个群岛。它的行政体系、士兵，以及贸易都将服务于同一个目标：为父亲复仇，并让可憎的[sulayhid.GetDynasty.GetName]家族付出惨痛代价。\n\n[jayyash.GetFirstName]，你这心慈手软的懦夫，别再纠结这次政变是否正当了。作为你的兄弟，我希望有一天你能明白这一切背后的深意。"
 red_sea.0053.a:0 "$red_sea.0052.a$"
 red_sea.0054.t:0 "$red_sea.0052.t$"
 red_sea.0054.desc:0 "[GetTitleByKey('k_yemen').GetNameNoTier]的[najah.GetFirstNameNicknamed]被[sulayhid.GetDynasty.GetName]家族背信弃义地刺杀后，我仁慈地收容了他的子女。\n\n如今我心中充满悲痛与愤怒，因为我得知其中一个儿子[said.GetFirstName]竟也试图行背叛之事。他非但没有感谢我、向我表达感激，反而试图通过政变推翻我，并夺取[GetTitleByKey('c_dahlak').GetNameNoTier]，只为了将这片群岛作为对抗杀父仇人的行动基地。\n\n我本欲处死[najah.GetFirstNameNoTooltip]，但[said.GetFirstNamePossessiveNoTooltip]兄弟[jayyash.GetFirstName]冒着巨大风险成功阻止了政变发生，这让我收回了手。我知道[jayyash.GetFirstNameNoTooltip]是位可敬之人，我在想他是否能约束他那愚蠢兄弟的冲动……"
 red_sea.0054.a:0 "是我太过仁慈了？把他们驱逐走！"
 red_sea.0055.t:0 "$red_sea.0053.t$"
 red_sea.0055.desc:0 "[GetTitleByKey('k_yemen').GetNameNoTier]的[najah.GetFirstNameNicknamed]被[sulayhid.GetDynasty.GetName]家族背信弃义地刺杀后，我仁慈地收容了他的子女。\n\n如今我心中充满悲痛与愤怒，因为我得知其中一个儿子[said.GetFirstName]竟也试图行背叛之事。他非但没有感谢我、向我表达感激，反而试图通过政变推翻我，并夺取[GetTitleByKey('c_dahlak').GetNameNoTier]，只为了将这片群岛作为对抗杀父仇人的行动基地。\n\n我还听说[jayyash.GetFirstName]竟也被说服“勉强”支持了自己的兄弟，我本以为他是他们中更为正直稳重的人，也许是[said.GetFirstName]以不要杀我和放我一马为条件，但这些都令我痛心"
 red_sea.0055.a:0 "这些可耻的败类，我不会再有瓜葛了！"
