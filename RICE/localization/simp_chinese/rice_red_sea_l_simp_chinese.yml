 red_sea.0060.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 red_sea.0060.desc:0 "历经数年，我们终于在[GetTitleByKey('k_yemen').GetNameNoTier]地区瓦解了[sulayhid.GetDynasty.GetName]家族势力，为我们敬爱的父亲[najah.GetFirstNameNicknamed]报了仇，还夺得大权。\n\n这些许久前甚至不敢奢望的伟业，如今都被我们做到了，无论手段如何，但毫无疑问的是，[ROOT.Char.GetFaith.HighGodName]正眷顾着我们家族。\n\n但前路依然漫长！这片土地仍饱受连年战乱与动荡之苦。我们必须着手重建……可该从何入手呢？"
 red_sea.0060.a:0 "父亲若是在世，必定会对我们微笑。"
