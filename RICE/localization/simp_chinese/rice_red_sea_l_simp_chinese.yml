 RICE_red_sea_aspiration_al_umari_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为一名[independent|E][king|E]或者[emperor|E][rank|E][ruler|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('c_aswan').GetNameNoTier]、[GetTitleByKey('c_qus').GetNameNoTier]、[GetTitleByKey('c_qurta').GetNameNoTier]和[GetTitleByKey('c_naqis').GetNameNoTier]\n$EFFECT_LIST_BULLET$国库里至少有[gold_i|E]#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#!\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$你的[realm|E]内每个位于[GetGeographicalRegion('world_africa_east').GetName]的[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$至少拥有@dread_icon!#V 80#![dread|E]（完成奖励：获得一个[martial_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$拥有至少两名[rivals|E]或者[nemeses|E]（完成奖励：获得一个[intrigue_lifestyle|E][perk|E]）"
