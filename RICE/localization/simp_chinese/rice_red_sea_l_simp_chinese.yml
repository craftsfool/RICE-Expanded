 RICE_red_sea_aspiration_avenge_najah_desc:0 "#italic 纳贾出身是前埃塞俄比亚奴隶，后来统治也门大片土地，但被贪婪的苏莱希德家族的一名女奴刺杀。尽管他幸存的子女已流亡在外，但他们希望有朝一日能为父亲复仇，并夺回他们的权利。#!$RICE_red_sea_aspiration_said_jayyash_desc$\n\n"
