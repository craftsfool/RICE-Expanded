 RICE_red_sea_aspiration_said_jayyash_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$你或你的兄弟姐妹[completely_controlled|E][GetTitleByKey('d_taizz').GetNameNoTier]与[GetTitleByKey('d_sanaa').GetNameNoTier]，且为[independent|E][ruler|E]\n$EFFECT_LIST_BULLET$确保你的[nemesis|E]苏莱赫家族的阿里已死亡、不持有任何[titles|E]或被[imprisoned|E]\n$EFFECT_LIST_BULLET$确保你所有的兄弟姐妹对你的[opinion_i|E]#bold 至少#!达到[opinion|E]#P 25#!\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$每一位在世的兄弟姐妹获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$若为[landed|E]统治者，则获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]\n$EFFECT_LIST_BULLET$你与你在世的兄弟姐妹获得[GetModifier('RICE_red_sea_heirs_of_najah_modifier').GetNameWithTooltip][character_modifier|E]\n$EFFECT_LIST_BULLET$若为[landed|E]统治者，额外获得#V 1000#![special_troops|E]，其中包括一些[men_at_arms|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$确保苏莱赫家家族的阿里及其所有子女均已死亡（奖励：获得一个[intrigue_lifestyle|E][perk|E]以及@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]）\n$EFFECT_LIST_BULLET$直接拥有[GetTitleByKey('c_dahlak').GetNameNoTier]（奖励：获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [gold|E]）（与下方的额外奖励互斥）\n$EFFECT_LIST_BULLET$使[GetTitleByKey('c_dahlak').GetNameNoTier]成为你的[vassal|E]或[tributary|E]（奖励：[GetTitleByKey('d_taizz').GetNameNoTier]与[GetTitleByKey('d_sanaa').GetNameNoTier]境内的每一个[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]）（与上方的额外奖励互斥）"
 RICE_red_sea_historical_aspiration_action_said_jayyash:0 "#italic 我们的父亲纳贾曾统治也门土地，却被贪婪的苏莱赫德家族的一名女奴刺杀。尽管我们被迫流亡，但我和兄弟姐妹们终将有一天为父报仇，夺回我们与生俱来的权利。#!$RICE_red_sea_aspiration_said_jayyash_desc$"
