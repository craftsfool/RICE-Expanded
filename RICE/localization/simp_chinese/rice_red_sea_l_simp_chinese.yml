l_simp_chinese:
 RICE_red_sea_al_umari_spawn_event_troops:0 "欧麦尔的追随者"
 RICE_indian_ocean_legacy_2_requirement_desc:0 "家族传承中#V 海贸传承#!的#V 繁荣港口#!获得额外收益"
 game_concept_red_sea_ferry:0 "红海渡口"
 game_concept_red_sea_ferries:0 "红海渡口"
 game_concept_red_sea_ferry_desc:0 "在红海沿岸的几个伯爵领，即#V 艾扎卜#!、#V 萨瓦金#!以及#V 吉达#!有一个名为$game_concept_red_sea_ferry$的[special_building|E]，提供各种收益，这些港口是希望穿越红海的朝圣者的主要通道。\n\n作为艾扎卜或者萨瓦金的[ruler|E]会获得一个对沿途的朝圣者征收#V 额外税#!的[decision|E]。不过这样做也会带来负面的后果。因为艾扎卜和者萨瓦金是竞争港口，在其中一个城市增加税收会把一些朝圣者赶到另一个城市。"
 building_type_RICE_red_sea_mount_smaragdus_mines_01:0 "斯马拉格达斯山的祖母绿矿脉"
 building_type_RICE_red_sea_mount_smaragdus_mines_01_desc:0 "自古埃及人时代起，东部沙漠的这部分矿区（罗马人称为斯马拉格达斯山）就提供了世界上绝大多数的祖母绿。"
 building_RICE_red_sea_mount_smaragdus_mines_01:0 "祖母绿采矿定居点"
 building_RICE_red_sea_mount_smaragdus_mines_01_desc:0 "这里是世界上为数不多的祖母绿产地之一，成群结队的奴隶和劳工生活在这小小的定居点里面日夜辛劳"
 building_RICE_red_sea_mount_smaragdus_mines_02:0 "祖母绿矿区"
 building_RICE_red_sea_mount_smaragdus_mines_02_desc:1 "随着附近定居点的发展，越来越多的祖母绿被开采出来。工匠们被请来提高产量，商人们也开起了商店，以加快祖母绿的运输。"
 building_RICE_red_sea_mount_smaragdus_mines_03:0 "大型祖母绿矿区"
 building_RICE_red_sea_mount_smaragdus_mines_03_desc:0 "由于与尼罗河谷和红海都有紧密的联系，该地区的村庄为世界市场生产了大量的祖母绿。"
 building_RICE_red_sea_mount_smaragdus_mines_04:0 "祖母绿采矿综合镇"
 building_RICE_red_sea_mount_smaragdus_mines_04_desc:0 "这个地区的定居点，其规模和人口是自古法老和凯撒时代以来从未见过的，为世界开采了大量的祖母绿。"
 building_type_RICE_red_sea_wadi_allaqi_mines_01:0 "阿拉吉干河金矿"
 building_type_RICE_red_sea_wadi_allaqi_mines_01_desc:0 "阿拉吉干河金矿曾经被古代的法老们开采过，现在仍然为埃及等邻近地区提供相当数量的黄金。"
 building_RICE_red_sea_wadi_allaqi_mines_01:0 "阿拉吉干河采矿点"
 building_RICE_red_sea_wadi_allaqi_mines_01_desc:0 "$building_rammelsberg_mines_01_desc$"
 building_RICE_red_sea_wadi_allaqi_mines_02:0 "阿拉吉干河矿井"
 building_RICE_red_sea_wadi_allaqi_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
 building_RICE_red_sea_wadi_allaqi_mines_03:0 "阿拉吉干河大矿井"
 building_RICE_red_sea_wadi_allaqi_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_RICE_red_sea_wadi_allaqi_mines_04:0 "阿拉吉干河矿业综合体"
 building_RICE_red_sea_wadi_allaqi_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_type_RICE_red_sea_al_baha_mines_01:0 "巴哈矿脉"
 building_type_RICE_red_sea_al_baha_mines_01_desc:0 "巴哈地区有许多金、银、铜矿藏，已被各个阿拉伯国家开采。这些金属通常在附近的定居点进行加工，特别是在区域中心的阿沙姆。"
 building_RICE_red_sea_al_baha_mines_01:0 "巴哈矿镇"
 building_RICE_red_sea_al_baha_mines_01_desc:0 "$building_rammelsberg_mines_01_desc$"
 building_RICE_red_sea_al_baha_mines_02:0 "巴哈矿区"
 building_RICE_red_sea_al_baha_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
 building_RICE_red_sea_al_baha_mines_03:0 "大型巴哈矿区"
 building_RICE_red_sea_al_baha_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_RICE_red_sea_al_baha_mines_04:0 "巴哈采矿综合镇"
 building_RICE_red_sea_al_baha_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_type_RICE_red_sea_ferry_01:0 "红海渡口"
 building_type_RICE_red_sea_ferry_01_desc:0 "穆斯林朝圣者在朝圣时有几条主要路线。其中一条比较流行的路线是乘船穿越红海，这里的一个主要聚居地已经成为朝圣者在前往麦加途中的一个主要休息站。"
 building_RICE_red_sea_ferry_01:0 "沙漠站点"
 building_RICE_red_sea_ferry_01_desc:0 "建立了基本的基础设施——如水井、简陋的住宿设施以及警惕贝都因人袭击的小型瞭望塔——这些设施以便为乘船往返麦加的朝圣者提供最低水平的援助。"
 building_RICE_red_sea_ferry_02:0 "朝圣者码头"
 building_RICE_red_sea_ferry_02_desc:1 "资源被用于发展更广泛的基础设施，以支持抵达该港口的朝圣者商队，当然这也使当地的经济受益良多。"
 building_RICE_red_sea_ferry_03:0 "红海旅店"
 building_RICE_red_sea_ferry_03_desc:0 "作为希望通过海路旅行的朝圣者的主要中转站，这个定居点现在有专门为这些朝圣者服务并提供各种方便的住宿。"
 building_RICE_red_sea_ferry_04:0 "朝圣者商队"
 building_RICE_red_sea_ferry_04_desc:0 "这个沿海港口因定期通过其港口的大量朝圣者而闻名。一个由渡船、客栈、堡垒和市场组成的庞大而有序的系统为这些商队提供了舒适、安全和贸易机会。"
 building_type_RICE_red_sea_pearl_industry_01:0 "珍珠行业"
 building_type_RICE_red_sea_pearl_industry_01_desc:0 "这个地区的沿海地区盛产珍珠，是其利润的主要来源。"
 building_RICE_red_sea_pearl_industry_01:0 "珍珠采集员"
 building_RICE_red_sea_pearl_industry_01_desc:0 "虽然这个地区的采珠活动已经持续了几个世纪，但现在是以一种更有组织的方式进行。"
 building_RICE_red_sea_pearl_industry_02:0 "珍珠贸易商"
 building_RICE_red_sea_pearl_industry_02_desc:0 "随着该地区珍珠业的发展，商人和地方政府对扩大基础设施以支持珍珠业产生了兴趣。"
 building_RICE_red_sea_pearl_industry_03:0 "珍珠产业中心"
 building_RICE_red_sea_pearl_industry_03_desc:0 "这个地区被认为是珍珠业中最有利可图的地区之一，这里的珍珠被运往世界的各个角落，从爱尔兰到中国无人不晓。"
 building_type_RICE_red_sea_al_radrad_mines_01:0 "雷德矿镇"
 building_type_RICE_red_sea_al_radrad_mines_01_desc:0 "雷德（又称吉巴利）村位于一个有水的山谷中，里面点缀着许多棕榈树，靠近重要的银矿资源。采矿场最初是由波斯矿工建立的，现在仍有许多用于冶炼矿石的冶金炉，据说靠近矿场的鸟儿都会因为炉子的巨大火光和烟雾而死。"
 building_RICE_red_sea_al_radrad_mines_01:0 "雷德矿区定居点"
 building_RICE_red_sea_al_radrad_mines_01_desc:0 "$building_rammelsberg_mines_01_desc$"
 building_RICE_red_sea_al_radrad_mines_02:0 "雷德矿镇"
 building_RICE_red_sea_al_radrad_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
 building_RICE_red_sea_al_radrad_mines_03:0 "大型雷德矿镇"
 building_RICE_red_sea_al_radrad_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_RICE_red_sea_al_radrad_mines_04:0 "雷德采矿综合镇"
 building_RICE_red_sea_al_radrad_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 RICE_red_sea_egypt_textile_industry:0 "埃及纺织业制造中心"
 RICE_red_sea_egypt_textile_industry_desc:0 "自法老时代以来，纺织品一直是埃及的主要出口产品。这些工艺精湛的产品在世界各地都有很高的需求，并经常通过地中海和红海沿岸的港口运往遥远的地方。"
 RICE_red_sea_is_al_umari:0 "学者、商人及军阀"
 RICE_red_sea_is_al_umari_desc:0 "欧麦尔出生于麦地那，是一个冷酷无情的学者和商人，他希望在埃及东部的沙漠中为自己开辟一块私人领地，特别是确保其有利可图的矿区。他狡猾而残忍，但又有教养，有魅力，而且非常虔诚，他的追随者与他的敌人一样多。"
 RICE_red_sea_allaqi_mines_rediscovered:0 "阿拉吉干河的淘金热"
 RICE_red_sea_allaqi_mines_rediscovered_desc:0 "阿拉吉干河的古代金矿最近被重新发现并开采，导致该地区出现淘金热。然而当地领导人需要花费大量的投资和时间，才能对这块危险的边境地区建立起可控的局面。"
 RICE_red_sea_aswan_investors:0 "来自阿斯旺的投资"
 RICE_red_sea_aswan_investors_desc:0 "阿拉吉干河的金矿最近收到了来自阿斯旺的富有精英的投资，他们希望获得该地区的黄金。"
 RICE_red_sea_gold_rush_rivals:0 "争夺阿拉吉干河的金矿"
 RICE_red_sea_aydhab_increased_pilgrims:0 "朝圣者人数增加"
 RICE_red_sea_aydhab_increased_pilgrims_desc:0 "萨瓦金的统治者目光短浅，他们对那些利用港口穿越红海前往麦加的朝圣者征收备受诟病的过路税。因此，一些朝圣者如今更愿意选择艾扎卜港口，这个与萨瓦金相抗衡的港口。然而，艾扎卜的统治者是否能长久保持他们的慷慨，尚需时间的检验……"
 RICE_red_sea_suakin_increased_pilgrims:0 "朝圣者人数增加"
 RICE_red_sea_suakin_increased_pilgrims_desc:0 "艾扎卜的统治者目光短浅，他们对那些利用港口穿越红海前往麦加的朝圣者征收备受诟病的过路税。因此，一些朝圣者如今更愿意选择萨瓦金港口，这个与艾扎卜相抗衡的港口。然而，萨瓦金的统治者是否能长久保持他们的慷慨，尚需时间的检验……"
 RICE_red_sea_aydhab_extra_hajj_taxes:0 "对朝圣者征收的额外税"
 RICE_red_sea_aydhab_extra_hajj_taxes_desc:0 "目光短浅的艾扎卜统治者已决定对试图利用其港口穿越红海到达麦加的朝圣者征收额外的过路税。人们不禁要问，艾扎卜的传统对手——萨瓦金的权贵们对这项新政策有什么看法……"
 RICE_red_sea_suakin_extra_hajj_taxes:0 "对朝圣者征收的额外税"
 RICE_red_sea_suakin_extra_hajj_taxes_desc:0 "萨瓦金的目光短浅统治者已决定对试图利用其港口穿越红海到达麦加的朝圣者征收额外的过路税。人们不禁要问，萨瓦金的传统对手——艾扎卜的权贵们对这项新政策有什么看法……"
 RICE_red_sea_expanding_mining_operations:0 "专注于采矿业务"
 RICE_red_sea_expanding_eastern_desert_mining_infrastruture:0 "东部沙漠中的采矿业大肆扩张"
 RICE_red_sea_chinese_ceramics:0 "拥有一套来自中国的全新瓷器"
 RICE_red_sea_gazelles_nearby:0 "羚羊在住所附近吃草"
 RICE_red_sea_gazelles_meat:0 "享受美味的羚羊肉"
 RICE_red_sea_beautiful_ostrich_egg:0 "鸵鸟蛋装饰品"
 RICE_red_sea_bought_dairy:0 "最近购买的山羊、牛奶和黄油"
 RICE_red_sea_bought_ostrich_egg:0 "最近购买的鸵鸟蛋"
 RICE_red_sea_bought_slave:0 "最近买了一个讨人喜欢的奴隶"
 RICE_red_sea_bought_camels:0 "最近购买结实、强壮的骆驼"
 RICE_red_sea_massawa_mosque:0 "同伴清真寺"
 RICE_red_sea_massawa_mosque_desc:0 "在马萨瓦有一座清真寺，虽然规模不大，也不显眼，但对当地的穆斯林来说非常重要，因为它被认为是世界上最早建造的清真寺之一。根据传说，当先知穆罕默德因受迫害而离开麦加时，他的一些追随者在马萨瓦寻求庇护，在那里建造了这座清真寺。"
 RICE_red_sea_seek_investors_from_aswan:0 "从阿斯旺寻求投资者"
 RICE_red_sea_seek_investors_from_aswan_tooltip:0 "作为阿拉吉干河的[ruler|E]，你将为里面的矿脉寻找投资"
 RICE_red_sea_seek_investors_from_aswan_effect_tooltip:0 "你将在阿斯旺寻找投资者，寻求协助开发阿拉吉干河里的金矿"
 RICE_red_sea_seek_investors_from_aswan_effect_tooltip_2:0 "这可能会#N 减少#!埃及[ruler|E]对你的[opinion|E]"
 RICE_red_sea_seek_investors_from_aswan_desc:0 "最近在我统治的埃及东部沙漠的部分地区发现了主要的黄金矿藏。为了使这些采矿业务长期盈利，我需要埃及，特别是附近的阿斯旺的关系良好的商人和精英的投资。"
 RICE_red_sea_seek_investors_from_aswan_confirm:0 "写信给阿斯旺的商人！"
 RICE_red_sea_seek_investors_from_aswan_context_tooltip:0 "#emphasis 历史背景：#!埃及法老曾经在阿拉吉干河开采金矿。到了10世纪，这些金矿的重新发现引发了一场淘金热，给该地区带来了巨大的繁荣，尤其是与之相连的重要贸易中心，如艾扎卜和阿斯旺等。"
 RICE_red_sea_sudan_gold_rush_happening:0 "阿拉吉干河的[county|E]目前欧#V 淘金热#![county_modifier|E]"
 RICE_red_sea_increase_taxes_aydhab:0 "对艾扎卜的朝圣者增加税收"
 RICE_red_sea_increase_taxes_aydhab_tooltip:0 "作为艾扎卜的[ruler|E]，你将对通过那里的[red_sea_ferry|E]的朝圣者征收额外的税。"
 RICE_red_sea_increase_taxes_aydhab_desc:0 "每天，穆斯林朝圣者的商队在往返麦加的路上都要经过艾扎卜的[red_sea_ferry|E]。也许我们可以对这些旅行者征收一些额外的税，鉴于从非洲到麦加只有这么点安全可靠的路线，我想他们别无选择。不过这样做可能会使艾扎卜的竞争港口萨瓦金成为对朝圣者更具吸引力的目的地……"
 RICE_red_sea_increase_taxes_aydhab_confirm:0 "让我们开始行动吧！"
 RICE_red_sea_increase_taxes_aydhab_context_tooltip:0 "#emphasis 历史背景：#!那时，只有几个主要的港口——例如艾扎卜——会运输朝觐者穿越红海往返麦加，而有时候其统治者会向朝觐者征收额外的税款。不过，他们必须当心别做过火，不然朝觐者就会转而选择其首要竞争对手——萨瓦金。"
 RICE_red_sea_hajj_extra_taxes_aydhab_trigger_desc:0 "目前在#V 艾扎卜#!没有征收额外的税收！"
 RICE_red_sea_increase_taxes_suakin:0 "对萨瓦金的朝圣者增加税收"
 RICE_red_sea_increase_taxes_suakin_tooltip:0 "作为萨瓦金的[ruler|E]，你将对经过那里的[red_sea_ferry|E]朝圣者征收额外的税款。"
 RICE_red_sea_increase_taxes_suakin_desc:0 "每天，穆斯林朝圣者的商队在往返麦加的路上都要经过萨瓦金的[red_sea_ferry|E]。也许我们可以对这些旅行者征收一些额外的税，鉴于从非洲到麦加只有这么点安全可靠的路线，我想他们别无选择。不过这样做可能会使萨瓦金的竞争港口艾扎卜成为对朝圣者更有吸引力的目的地……"
 RICE_red_sea_increase_taxes_suakin_confirm:0 "让我们开始行动吧！"
 RICE_red_sea_increase_taxes_suakin_context_tooltip:0 "#emphasis 历史背景：#!那时，只有几个主要的港口——例如萨瓦金——会运输朝觐者穿越红海往返麦加，而有时候其统治者会向朝觐者征收额外的税款。不过，他们必须当心别做过火，不然朝觐者就会转而选择其首要竞争对手——艾扎卜。"
 RICE_red_sea_hajj_extra_taxes_suakin_trigger_desc:0 "目前在#V 萨瓦金#!没有征收额外的税收!"
 RICE_red_sea_organized_the_red_sea_ferries:0 "组织红海渡轮"
 RICE_red_sea_organized_the_red_sea_ferries_tooltip:0 "往返于麦加的朝圣者应该得到安全的旅行。"
 RICE_red_sea_organized_the_red_sea_ferries_effect_tooltip:0 "[aydhab_county.GetNameNoTier]和[suakin_county.GetNameNoTier]的[rulers|E]可以采用对使用[red_sea_ferries|E]的朝圣者#V 提高税收#!的[decision|E]"
 RICE_red_sea_organized_the_red_sea_ferries_desc:0 "对任何虔诚的穆斯林来说，朝觐是一个危险但重要的旅程。为了使朝圣者的旅程更加安全，我和该地区的其他穆斯林领导人应该协调努力，为可靠的[red_sea_ferries|E]提供资金，以运送人们穿越危险的水域。"
 RICE_red_sea_organized_the_red_sea_ferries_confirm:0 "这将有助于许多朝圣者，一切归于上帝的旨意"
 RICE_red_sea_organized_the_red_sea_ferries_context_tooltip:0 "#emphasis 历史背景：#!在中世纪时期，穿越红海往返麦加的穆斯林朝觐者，如果想要安全地旅行，只有几个港口可以选择。这些港口主要是红海西岸的萨瓦金和艾扎卜，以及红海东岸的吉达。这些港口都是重要的贸易和文化中心，也是连接非洲和阿拉伯半岛的通道。"
 red_sea.0000.t:0 "xxxxx"
 red_sea.0000.desc:0 "xxxxx"
 red_sea.0000.a:0 "xxxxx"
 red_sea.0001.t:0 "来自阿斯旺的投资"
 red_sea.0001.desc:0 "[wadi_allaqi_region.GetNameNoTier]的地区已经开始开采金矿，但我们已经寻求来自埃及[aswan_region.GetNameNoTier]的投资者的投资，这样我们可以引更多定居者进入这些采矿点，雇用士兵来保卫这些定居点，还是发展当地的基础设施\n\n"
 red_sea.0001.desc.egypt_ruler:0 "作为埃及的统治者，我希望这些投资将增加这个王国的繁荣。也许有一天我的财富将与古代法老的财富相媲美！。"
 red_sea.0001.desc.not_egypt_ruler:0 "然而，这引起了埃及现任统治者[egypt_ruler.GetTitledFirstName]的愤怒，我们与他的关系已经很不稳定，因为[egypt_ruler.GetSheHe]认为我们的努力是在抢走[egypt_ruler.GetHerHim]的收益。"
 red_sea.0001.a:0 "这毕竟是一个暴利的活！"
 red_sea.0002.t:0 "独立采矿运营"
 red_sea.0002.desc:0 "我注意到[gold_miner.GetTitledFirstName]一直在联系上埃及的当地精英和商人，特别是[aswan_region.GetNameNoTier]并谈论投资[wadi_allaqi_region.GetNameNoTier]的金矿。作为全埃及的统治者，我有权监督和分配这个矿区的资源和利益，然而[gold_miner.GetFirstNameNoTooltip]的行为却破坏了我的权威！我应该怎么办呢！"
 red_sea.0002.a:0 "[gold_miner.GetFirstNameNoTooltip]让我如芒在背"
 red_sea.0003.t:0 "为穆斯林朝圣者提供的红海轮渡"
 red_sea.0003.desc:0 "伊斯兰教是一个年轻的信仰，然而我们的信仰已经在全世界迅速传播。例如，每天都有大量来自非洲的穆斯林朝圣者抵达麦加；这些顽强的信徒冒着撒哈拉沙漠的危险和更多的危险，只为参加朝圣。\n\n为了帮助这些虔诚的穆斯林完成艰巨的旅程，该地区的穆斯林领导人汇集了资源，在红海沿岸的主要港口组织了几条渡船。以前，穿越红海是一件无序和分散的事情；现在，我们有了一个组织得更好的基础设施，朝圣者可以在一定程度上舒适和安全地穿越这些水域。虽然总是有改进的余地，但这仍然是一个重要的成就。"
 red_sea.0003.a:0 "赞美真主！"
 red_sea.0003.b:0 "明白了……"
 red_sea.0004.t:0 "同伴清真寺"
 red_sea.0004.desc:0 "随着穆斯林在红海的势力不断扩张，[massawa_county.GetNameNoTier]的许多穆斯林都在回忆他们的信仰土壤不稳固的艰难日子。正是在那个时期，包括先知穆罕默德在内的一小群穆斯林，在港口城市避难，并在那里建立了一座小型清真寺。有些人甚至声称这座至今仍在的建筑是世界上第一座清真寺。\n\n无论如何，这座清真寺现在被称为同伴清真寺。因为与之相关的这些传说，在穆斯林世界获得了更大的名声和声誉。这预示着[massawa_county.GetNameNoTier]在该地区的声望。"
 red_sea.0004.a:0 "有意思！"
 red_sea.0005.t:0 "嚼巧茶"
 red_sea.0005.desc:0 "我们席地而坐，身旁堆着一大摞#italic 巧茶#!叶。我们愉快地嚼着叶子，谈天说地，真是惬意的一天啊。"
 red_sea.0005.a:0 "这些巧茶叶真不错。"
 red_sea.0006.t:0 "巧茶成瘾"
 red_sea.0006.desc:0 "我每天嚼巧茶……没有它我就感觉不到世界的美好，我需要它给我享受的能量……"
 red_sea.0006.a:0 "我离不开它！"
