 RICE_red_sea_rubbans_option:0 "引路人"
 RICE_red_sea_rubbans_option_desc:0 "红海引路人（Rubbans）是一种习惯于在红海旅行的熟练商人。他们知道哪些地方是危险的，以及如何穿越危险的地带。在没有他们的情况下想在红海航行的人都要承担自己的风险！"
 RICE_red_sea_region:0 "红海地区"
 RICE_red_sea_geographical_req:0 "你拥有一个[county|E]在[GetGeographicalRegion('RICE_red_sea_region').GetName]"
