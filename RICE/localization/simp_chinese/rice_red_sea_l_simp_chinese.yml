 red_sea.0030.t:0 "穆利姆和鲁本"
 red_sea.0030.desc:0 "一对在红海地区知名探险家正在访问我的宫廷。他们是深海中熟练的航海家，被称为#italic 穆利姆#!。他们正在向我解释他们技艺的一些基本知识。这些人毕生致力于掌握天文知识，并将其用于印度洋港口之间的旅行。\n\n我注意到这些#italic 穆利姆#!对在红海航行有经验的当地船长#italic 鲁本#!持轻视态度。然而这里的许多人都知道#italic 鲁本#!了解当地情况，如红海中的各种礁石和岛屿以及如何穿越它们。归根结底似乎这些#italic 穆利姆#!认为#italic 鲁本#!的知识没他们渊博。"
 red_sea.0030.a:0 "任何人都能记住地理知识，但是了解星辰又是另一回事"
 red_sea.0030.b:0 "这些都是同样宝贵的知识，那些人太骄傲了。"
 red_sea.0031.t:0 "红海海难"
 red_sea.0031.desc:0 "商船在红海遇难是很常见的事。一艘这样的船刚刚在我的领土上被冲上岸；它有大量的战利品，而船主和船员都是外国的异教徒。我的士兵扣留了船长并怀疑这些商人的动机，因为他们可能是来自其他国家的间谍或传教徒！他建议我奴役这些野蛮人并拿走他们的货物。毕竟这是这个地区的普遍做法，所以我仔细考虑了他的建议。"
 red_sea.0031.a:0 "很好，掠夺他们的货物与奴役他们！"
 red_sea.0031.b:0 "奴役太麻烦了，我们就把他们的货物拿走吧。"
 red_sea.0031.c:0 "没必要这么残忍，护送他们到最近的港口。"
 red_sea.0032.t:0 "中国瓷器"
 red_sea.0032.desc:0 "中国的陶瓷在红海是很受欢迎的奢侈品，尽管它们来自如此遥远的东方。或许，这正是它们如此受欢迎的原因。我在当地市场上逛了逛，想到了[ceramic_lover.GetTitledFirstName]，她最近对用瓷器装饰屋内非常感兴趣。也许我可以展示我慷慨和体贴的一面？"
 red_sea.0032.a:0 "当然！买一些作为礼物是个好主意。"
 red_sea.0032.b:0 "我更想为自己买一些瓷器。"
 red_sea.0032.c:0 "我想[ceramic_lover.GetSheHe]没有我的帮助也可以买瓷器。"
 red_sea.0033.t:0 "傲慢的朝圣者"
 red_sea.0033.desc:0 "一位来自远方的著名穆斯林贵族正在参加朝觐，途经红海路线，并在我的土地上停留。我的宫廷里有人建议，当他在这里的时候，我应该接待这个人，说不定他会在路途说我的好话。然而，这个人是个自命不凡的势利眼。具有讽刺意味的是，他正在朝圣，却似乎没有表现出任何谦逊，真是可笑！"
 red_sea.0033.a:0 "我没有兴趣接待这样一个浮夸的人。"
 red_sea.0033.b:0 "没问题！为他准备一场华丽的盛宴吧!"
 red_sea.0034.t:0 "瞪羚"
 red_sea.0034.desc:0 "自记事以来，瞪羚一直生活在红海周围的旱地上。它们是一种和平且温顺的生物，最近有一些羚羊迁徙至离我住所不远的地方。更重要的是，这些瞪羚看起来相当温顺，似乎并不太害怕我的存在。"
 red_sea.0034.a:0 "来自[ROOT.Char.GetFaith.HighGodName]的征兆！让它们在这里繁衍吧。"
 red_sea.0034.b:0 "这十分容易猎杀他们为食"
 red_sea.0034.c:0 "我不喜欢它们，将它们赶出我的眼线外！"
 red_sea.0035.t:0 "鸵鸟蛋"
 red_sea.0035.desc:0 "鸵鸟在整个红海周围的地区都可以找到。在这些地方的传统，鸵鸟蛋会被用作小物品的容器，甚至作为水袋的替代品，它们是一种相当受欢迎的出口产品。今天，在我的统治下，一些当地人送给我一个这样的蛋，上面装饰着美丽、多彩的图案，作为礼物。"
 red_sea.0035.a:0 "灿烂的礼物！"
 red_sea.0036.t:0 "鬣狗袭击"
 red_sea.0036.desc:0 "我控制着埃及东部沙漠的一些领地，在尼罗河和红海之间旅行的商人和朝圣者的大篷车经常使用这里。最近一个由当地著名商人拥有的这样一个商队，在夜间露营时被一群鬣狗袭击，这在这个地区经常发生。这种鬣狗袭击一般不会对人造成太大的伤害，但会对生意造成破坏。事实上，这个商人是做食品贸易的，鬣狗吃了他不少的食物。不管怎么说，既然这个人比较有名，我可以表现出一些慷慨的态度帮助他，说不定日后有回报。"
 red_sea.0036.a:0 "他已经很有钱了，我相信他不会有事的。"
 red_sea.0036.b:0 "我会慷慨解囊!"
 red_sea.0037.t:0 "晕船的朝圣者"
 red_sea.0037.desc:0 "我正在接待一位著名的穆斯林贵族，他刚刚结束了在麦加的朝圣之旅，现在正在回家的路上。当我请他告诉我他的冒险经历时，他告诉我旅程中最可怕的部分是乘坐渡船穿越红海。\n\n他解释道：“我以前从未出过海！因此我不得不紧紧抓住我的奴隶，以防止自己一直在呕吐。她出生在沿海地区，你看，她习惯于在船上，她嘲笑我的软弱——如果不是因为我对她的喜爱，我可能当时就会鞭打这个傲慢婢女......或者也许我只是太难受了，无法回应......”"
 red_sea.0037.a:0 "对于那些从未出过海的人来说，这并不容易。"
 red_sea.0037.b:0 "要庆幸你的奴隶是忠诚的，在那场磨难中帮助了你"
 red_sea.0037.c:0 "我也会发笑，你看起来像个凄惨软蛋"
 red_sea.0038.t:0 "红海珊瑚"
 red_sea.0038.desc:0 "今天我决定在红海边的沙滩上散步。在我领地的这一部分，有许多珊瑚礁。它们是多么美丽啊！真是一场令人惊叹的视觉盛宴！"
 red_sea.0038.a:0 "我应该多做这事"
 red_sea.0039.t:0 "红海之滨的邂逅"
 red_sea.0039.desc:0 "几个世纪以来，红海一直有人居住，既有游牧民族，也有来自王国的殖民地。今早当我们沿着红海沿岸穿越我的领地时，我们在海岸边遇到某种古老建筑，那是一座废弃的小茅屋或泥地和芦苇。谁知道它是十年前，还是几个世纪前建造的？\n\n在那里休息的时候，一大群牧民经过。他们正在前往附近的城镇与当地商人进行贸易，并提出与我们交换一些货物。"
 red_sea.0039.a:0 "我想购买你的几只山羊，还有一些牛奶和黄油。"
 red_sea.0039.b:0 "那些鸵鸟蛋看起来很漂亮，我可以用它们来盛水吗？"
 red_sea.0039.c:0 "你的奴隶看起来不错，多少钱卖？"
 red_sea.0039.d:0 "你的骆驼看起来相当结实和强壮!"
 red_sea.0039.e:0 "我对交易没有兴趣，但祝你旅行愉快。"
