 RICE_red_sea_chew_khat_confirm:0 "我太需要这个了！"
 RICE_red_sea_chew_khat_context_tooltip:0 "#emphasis 历史背景：#!巧茶（或称阿拉伯茶）是一种原产于东非和也门地区的植物叶片，当地人通过咀嚼其叶片来提神醒脑。巧茶在好几个世纪中都充当当地社会文化的重要角色，其使用记载最早可追溯至中世纪时期。然而巧茶具有成瘾性，被世界卫生组织确定的II类软性毒品。"
 red_sea.0006.liege.message:0 "$red_sea.0006.t$"
 red_sea.0050.info:0 "#emphasis 历史背景：#! 也门的纳贾希德王朝由纳贾创立，他最初是齐亚德王朝的一名埃塞俄比亚籍奴隶士兵，该王朝曾统治也门西部直至公元1018年。纳贾终结了随后的政治混乱，并一直统治到约1060年被其苏莱赫家族刺杀，后者信奉什叶派，与纳贾的逊尼派信仰形成对比。纳贾的长子穆阿里克自杀后，他的另外两个儿子赛义德和贾亚什逃亡至达赫拉克群岛（今厄立特里亚海岸附近）避难，当地曾是纳贾的附庸。"
 red_sea.0051.b:0 "[jayyash.GetFirstNameNoTooltip]勉强同意支持我。"
 red_sea.0051.info:0 "#emphasis 历史背景：#!尽管达赫拉克苏丹对他们热情款待，赛义德却背信弃义地试图夺取达赫拉克的控制权。然而，他的兄弟贾亚什阻止了他的行动，贾亚什以比赛义德更谦逊、更高尚的品性而闻名，盛怒之下，冲动自负的赛义德便率众前往也门。"
