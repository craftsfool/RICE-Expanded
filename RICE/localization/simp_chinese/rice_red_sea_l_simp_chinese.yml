 red_sea.0010.t:0 "艾扎卜的额外税收"
 red_sea.0010.desc:0 "通过[aydhab_region.GetNameNoTier]的重要港口往返麦加的大量朝圣者商队已经是我的主要收入来源，他们为安全渡过红海支付了税款。虽然有些人可能认为我对这些朝圣者征收额外税款是残酷和不公正的，但我决定有必要为我的国库带来更多的财富，而且[aydhab_region.GetNameNoTier]的许多精英都赞同这个想法。无论如何我知道[suakin_region.GetNameNoTier]的精英们，即红海沿岸[aydhab_region.GetNameNoTier]的传统对手他们的想法"
 red_sea.0010.a:0 "我还不如从艾扎卜的朝圣者那里获得更多的利益!"
 red_sea.0011.t:0 "艾扎卜的额外税收"
 red_sea.0011.desc:0 "我最近收到消息，[aydhab_region.GetNameNoTier]的统治者[extra_taxer.GetTitledFirstName]最近决定对任何在往返麦加途中经过该港口的朝圣者征收额外税款。从务实的角度来看，这并不是一个残酷的政策，因为对于来自非洲、试图穿越红海的朝圣者来说很少安全和可靠的港口。\n\n然而，我统治的[suakin_region.GetNameNoTier]确实是那些#italic 少有的#!港口之一。事实上[suakin_region.GetNameNoTier]的精英们普遍认为[aydhab_region.GetNameNoTier]是他们的竞争对手。"
 red_sea.0011.desc.no_tax:0 "其中一些精英告诉我，[extra_taxer.GetFirstNamePossessiveNoTooltip]政策是目光短浅的，因为它反而会吸引更多的朝圣者到[suakin_region.GetNameNoTier]。还有人说我们自己也对任何路过的朝圣者征收额外的税，这也许不是一个坏主意!"
 red_sea.0011.desc.tax:0 "公平地说，我们自己一直在对经过[suakin_region.GetNameNoTier]的朝圣者征收额外的税，所以看起来[extra_taxer.GetTitledFirstNameNoTooltip]只是在复制我们政策。"
 red_sea.0011.a:0 "不管如何这些都是艾扎卜的有趣发展。"
 red_sea.0012.t:0 "萨瓦金的额外税收"
 red_sea.0012.desc:0 "通过[suakin_region.GetNameNoTier]的重要港口往返麦加的大量朝圣者商队已经是我的主要收入来源，他们为安全渡过红海支付了税款。虽然有些人可能认为我对这些朝圣者征收额外税款是残酷和不公正的，但我决定有必要为我的国库带来更多的财富，而且[suakin_region.GetNameNoTier]的许多精英都赞同这个想法。无论如何我知道[aydhab_region.GetNameNoTier]的精英们，即红海沿岸[suakin_region.GetNameNoTier]的传统对手他们的想法……"
 red_sea.0012.a:0 "我还不如从萨瓦金的朝圣者那里获得更多收益！"
 red_sea.0013.t:0 "萨瓦金的额外税收"
 red_sea.0013.desc:0 "我最近收到消息，[suakin_region.GetNameNoTier]的统治者[extra_taxer.GetTitledFirstName]最近决定对任何在往返麦加途中经过该港口的朝圣者征收额外税款。从务实的角度来看，这并不是一个残酷的政策，因为对于来自非洲、试图穿越红海的朝圣者来说很少安全和可靠的港口。\n\n然而，我统治的[aydhab_region.GetNameNoTier]确实是那些#italic 少有的#!港口之一。事实上[aydhab_region.GetNameNoTier]的精英们普遍认为[suakin_region.GetNameNoTier]是他们的竞争对手。"
 red_sea.0013.desc.no_tax:0 "其中一些精英告诉我，[extra_taxer.GetFirstNamePossessiveNoTooltip]政策是目光短浅的，因为它反而会吸引更多的朝圣者到[aydhab_region.GetNameNoTier]。还有人说我们自己也对任何路过的朝圣者征收额外的税，这也许不是一个坏主意！"
 red_sea.0013.desc.tax:0 "公平地说，我们自己一直在对经过[aydhab_region.GetNameNoTier]的朝圣者征收额外的税，所以看起来[extra_taxer.GetTitledFirstNameNoTooltip]只是在复制我们政策。"
 red_sea.0013.a:0 "不管如何这些都是萨瓦金的有利发展。"
