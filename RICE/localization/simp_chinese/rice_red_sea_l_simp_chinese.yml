 red_sea.0020.t:0 "欧麦尔的故事"
 red_sea.0020.desc:0 "面对封臣的劝谏，我笑了。\n\n他们说我太愚蠢、我太贪婪、我太嗜血了。可笑！\n\n当然，我对最近的挫折感到抱歉，但他们难道没有感受到我的热情和虔诚？我可是为了哈里发的荣耀而控制东部沙漠的腹地！以前的哈里发总督和官员没有意识到[wadi_allaqi_region.GetNameNoTier]中蕴藏的巨大的、未开发的财富，但当我来到这片土地时，我看到了不同的情况。"
 red_sea.0020.a:0 "怎么会到这一步了呢？！"
 red_sea.0021.t:0 "欧麦尔的出身"
 red_sea.0021.desc:0 "我多年前出生在麦地那，一开始并不是习武之人，也不是一个富家子弟，而是一个有思想和学问的学者。尽管我的敌人认为我冷酷无情，但我内心仍觉得我是一个学者，我是一个深入研究过#italic 圣训#!的人！我可以毫不停歇地吟诵诗歌！旅行使我走遍了名义上由阿拔斯王朝统治的土地，从我学习多年的福斯塔特到凯鲁万的神殿。这些经历塑造了我，使我成为现在的我，特别是……"
 red_sea.0021.a:0 "我在麦地那的童年，我深深地记得，尽管那是很久以前。"
 red_sea.0021.b:0 "当我在福斯塔特的老师教给我很多关于生命、哲学和信仰的知识。"
 red_sea.0021.c:0 "在凯鲁万大清真寺我不仅遇到了学者，还有商人和冒险家"
 red_sea.0022.t:0 "欧麦尔的计划"
 red_sea.0022.desc:0 "通过一系列的机缘巧合，我来到了东部沙漠地带，一片位于尼罗河和红海之间的旱地。由于我是一个博学而虔诚的学者，有大批追随者跟随我，他们帮助我在[wadi_allaqi_region.GetNameNoTier]建立了一个根据地，在那里我们开始了大规模的采矿，这里最多的就是黄金，它利润是巨大的。然而我的存在被埃及的穆斯林总督们视为一种威胁，哪怕我和士兵们在南方抵挡住了异教徒。\n\n最终，我卷入了这些苏丹酋长的斗争中，我蹂躏了他们的土地还掠夺了他们的定居点的奴隶，同时也与埃及总督[ibn_tulun.GetTitledFirstName]多次发生冲突。但该死的我失败了，我被赶回我在[wadi_allaqi_region.GetNameNoTier]山区的破窝，那里有许多有利可图的矿场。\n\n现在我准备东山再起，但有些人警告我不要自不量力，现在傻子已经不知我已更老成更聪明了，下一步行动计划早在我脑子里了！"
 red_sea.0022.a:0 "[ibn_tulun.GetTitledFirstName]将会接受我的[ibn_tulun.GetHerHis]和平，如果[ibn_tulun.GetHerHis]不犯傻的话"
 red_sea.0022.b:0 "我将继续从苏丹异教徒中获利。"
 red_sea.0022.c:0 "也许[ibn_tulun.GetTitledFirstName]会和我可以达成协议，一起合作！"
 red_sea.0022.d:0 "我需要专注于扩大采矿业，财富高于一切！"
 red_sea.0023.t:0 "欧麦尔的野望"
 red_sea.0023.desc:0 "这次我不会再重蹈覆辙，我将变得比以前更伟大！我是哈里发的后裔! 我是精通#italic 圣训#!和诗歌的学者! 我的士兵让北方的图鲁尼人和南方的苏丹异教徒感到恐惧! 我是一个冒险家！我的智慧让东部沙漠从贫瘠的沙石空地变成了繁荣的矿区！每天都有商队将黄金和祖母绿运往尼罗河的城市和红海的港口！"
 red_sea.0023.desc.focus_tulun:0 "\n\n我将集中精力消除[ibn_tulun.GetTitledFirstName]带来的威胁。作为埃及的统治者，[ibn_tulun.GetSheHe]对我控制红海和东部沙漠的这些土地感到愤怒，并会在我采取的每一步行动中谋划反对我。虽然我已经两次打败了[ibn_tulun.GetHerHim]，但我必须保持警惕，因为正如我是[ibn_tulun.GetHerHis]的达摩克利斯之剑，[ibn_tulun.GetSheHe]同样如此。"
 red_sea.0023.desc.focus_nubia:0 "\n\n我将集中精力，继续对苏丹异教徒进行袭扰。多年来，我掠夺他们的奴隶，并且获得如同金矿开采一样的收益。我确实犯了一个错误，就是低估了这些野蛮人的实力。然而奴隶贸易是一个暴利行业，所以我会从以前的错误中吸取教训后变得更加聪明。"
 red_sea.0023.desc.focus_allies:0 "\n\n我将集中精力试图与[ibn_tulun.GetTitledFirstName]达成某种协议。鉴于我两次击败了[ibn_tulun.GetHerHim]，[ibn_tulun.GetSheHe]如果拒绝，那就说明其不过是个庸人罢了。承认失败并不可怕，但我相信[ibn_tulun.GetSheHe]和我有共同的利益以及共同的敌人，如果我们能调和我们的分歧，也许我们能共同繁荣和共同对抗南方的异教徒。"
 red_sea.0023.desc.focus_build:0 "\n\n我将集中精力发展[wadi_allaqi_region.GetNameNoTier]的矿脉。我必须承认，我的一些手下之前告诫过我过于鲁莽，他们是对的。现在我吸取了教训，我将通过积累财富和吸引追随者加入我的事业来建立我的力量。只有保本，我才能对抗[ibn_tulun.GetTitledFirstName]和苏丹的异教徒。"
 red_sea.0023.a:0 "这一次，我将成功，并成为该地区最伟大的君主"
 red_sea.0023.info:0 "#emphasis 历史背景：#!当欧麦尔在公元850年代的某个时候到达埃及时，他已经积累了相当多的财富，这些财富是他作为学者、冒险家和商人多年积累的。\n\n欧麦尔投资了奴隶贸易以及阿拉吉干河的矿场，并在阿斯旺建立了一个基地，卷入了当地的政治冲突。他的采矿业务靠着他对努比亚臭名昭著的奴隶掠夺来维持。奴隶被捕获的数量如此之多，以至于马穆鲁克时代的一位历史学家马克里兹声称，阿斯旺男性的大多数侧室都是努比亚奴隶。随着时间的推移，他获得了冷血暴君的名声。\n\n欧麦尔在埃及的存在引起了新任阿拔斯王朝的埃及总督伊本·突伦的极大关注，他正试图集中埃及的权力。公元868年，突伦王朝派出了一支部队，试图制服欧麦尔，但却惨败。最终，欧麦尔的残暴造就了他的毁灭；他的手下暗杀了他，并把他的头送给了伊本·突伦。尽管伊本·突伦可能私下里对他的对手的死亡感到高兴，但他公开防腐并尊敬地埋葬了欧麦尔的头，并简单处决了那些送来他的头颅的人。\n\n总而言之，欧麦尔的一生反映了这个时代的军阀们日益增长的权力，他们试图以阿拔斯王朝的代价为自己获得私人的财富和权力。"
 red_sea.0024.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 red_sea.0024.desc:0 "很久以前，我来到炎热、尘土飞扬的东部沙漠。但我知道，这片土地不仅仅只有沙子和岩石。\n\n我的智慧、狡诈和无情造就了今天的我。我现在控制着红海的很大一部分，努比亚的矿山和奴隶为我提供了数不尽的财富。我的敌人不再与我交战，他们要么在我面前畏缩不前，要么已经死去。\n\n多年的努力，多年的辛劳，多年的血汗.......一切都有了回报。我不再是一个小角色，而是一个伟大的[ROOT.Char.GetTitleAsNameNoTooltip]！"
 red_sea.0024.a:0 "如今只有傻瓜才胆敢挑战我。"
