 mijikenda_pagan_adherent_plural:0 "卡雅信徒"
 mijikenda_pagan_desc:0 "#italic 卡雅#!是对圣林及自然环境的称谓，是仪式、文化及人类灵性的源泉。通过保护卡雅，在其四周居住，人们可以与长眠此地的祖先与魂灵们交流。"
