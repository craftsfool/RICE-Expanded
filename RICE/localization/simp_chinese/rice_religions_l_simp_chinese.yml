 harranian_pagan_old_adherent:1 "旧哈兰多神教信徒"
 harranian_pagan_old_adherent_plural:0 "旧哈兰多神教信徒"
 harranian_pagan_desc:0 "尽管他们选择认同《古兰经》中提到的拜星教，以至于被他们的穆斯林邻居称为“有经人”，但哈兰多神教是一个独特的教派。他们的做法包括对古代美索不达米亚和希腊神祇的崇拜，以及著名学者对神秘事物的追求，他们观察所有的星星，并遵循植根于古典新柏拉图主义和赫尔墨斯主义的哲学。"
 heliopolitan_pagan:0 "太阳神崇拜"
 heliopolitan_pagan_adj:0 "太阳神崇拜"
 heliopolitan_pagan_adherent:1 "太阳神信徒"
 heliopolitan_pagan_adherent_plural:0 "太阳神信徒"
 heliopolitan_pagan_old:0 "旧太阳神崇拜"
 heliopolitan_pagan_old_adj:0 "旧太阳神崇拜"
 heliopolitan_pagan_old_adherent:1 "旧太阳神信徒"
 heliopolitan_pagan_old_adherent_plural:0 "旧太阳神信徒"
 heliopolitan_pagan_desc:0 "三位一体的崇拜是罗马和迦南多神教的一种融合形式，它崇拜所有神之上的三位一体包括：众神之王朱庇特，与主神巴尔或风暴神哈达德和太阳神赫利俄斯等同；爱神维纳斯，与爱神阿斯塔蒂等同；神使墨丘利，与父神阿东等同。它在巴勒贝克或赫利奥波利斯尤为突出，直到7世纪阿拉伯人征服埃及之前，这里仍然是近东最后的多神教据点之一（除了哈兰）。"
 nabataean_pagan:0 "杜沙拉教"
