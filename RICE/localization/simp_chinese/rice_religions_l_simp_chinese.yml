 vedda_religion_adj:1 "吠陀教"
 vedda_religion_adherent:1 "吠陀教徒"
 vedda_religion_adherent_plural:1 "吠陀教徒"
 vedda_religion_desc:1 "在众多灵魂中，$k_lanka$的原住民非常尊敬一个名为#italic 耶迦#!的，它既包含又不仅限于是原住民的先祖。"
 vedda_pagan:0 "耶迦信仰"
