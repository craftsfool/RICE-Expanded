 rice_west_iranian_kurdish_pagan_doctrine_name:0 "密特拉"
 rice_west_iranian_kurdish_pagan_doctrine_desc:0 "有许多神祇必须受到崇拜，但真理之神、正义之神和太阳神密特拉是最重要的神祇之一，因为祂是在世界诞生之初献祭一头公牛而创造了世界的神祇。"
