 minaro_pagan_adherent:1 "博诺尼亚教徒"
 minaro_pagan_adherent_plural:0 "博诺尼亚教徒"
 minaro_pagan_desc:0 "博诺尼亚是一些达尔德人崇拜的神灵之一，他们通过献祭来表达敬意，其中山羊祭祀效果最佳。"
