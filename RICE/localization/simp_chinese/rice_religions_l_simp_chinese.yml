 makonde_pagan_adherent:1 "弗亚玛派信徒"
 makonde_pagan_adherent_plural:0 "弗亚玛派信徒"
 makonde_pagan_desc:0 "马孔德人认为诸灵都围绕着我们的世界，#italic 弗亚玛#!组织能跳起请神灵附身的舞蹈，能帮助我们与神灵交流。"
