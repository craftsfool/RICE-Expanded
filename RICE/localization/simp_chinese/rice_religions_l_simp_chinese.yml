 west_himalayan_religion_adherent_plural:1 "西喜马拉雅宗教信徒"
 west_himalayan_religion_desc:1 "吐蕃和印度交界的山区人民崇拜许多本土神灵。这些神灵必须得到应有的尊重和信仰，因为祂们变化无常，尤其是强大的山神，祂们对凡人的看法决定一个村庄是繁荣富足还是贫困多灾。"
 kinnaur_pagan:0 "金什信仰"
 kinnaur_pagan_adj:0 "金什信仰"
 kinnaur_pagan_adherent:1 "金什信徒"
 kinnaur_pagan_adherent_plural:0 "金什信徒"
 kinnaur_pagan_desc:0 "这个世界有很多神灵，而山神乃其中伟力最强大。这些神灵通常放置在村庙中供人膜拜，这些神像在各种仪式中会放在轿子里抬出来。每个家庭都有自己个人保护神#italic 金什#!，必须定期祭拜。"
