 rice_doctrine_kava_role_name:0 "卡瓦醉椒汁的角色"
 rice_doctrine_kava_role_desc:0 "饮用卡瓦醉椒汁在众多大洋洲社会中扮演着重要角色。"
 rice_kava_role_social_doctrine_name:0 "卡瓦醉椒汁：社会角色"
 rice_kava_role_social_doctrine_desc:0 "虽然有时会出现在各种政治和宗教仪式中，但饮用卡瓦醉椒汁并不被视为这些仪式的必要组成部分，其最重要的作用是促进社交互动。"
 rice_kava_role_ceremonial_doctrine_name:0 "卡瓦醉椒汁：仪式性角色"
 rice_kava_role_ceremonial_doctrine_desc:0 "饮用卡瓦醉椒汁是各种政治和宗教仪式中的关键环节，这些仪式赋予领导人权威以合法性，并促进社区的宗教和谐与繁荣。"
 rice_kava_role_medicinal_doctrine_name:0 "卡瓦醉椒汁：医学角色"
 rice_kava_role_medicinal_doctrine_desc:0 "虽然有时会出现在各种政治和宗教仪式中，也偶尔用于促进社交互动，但饮用卡瓦酒最重要的原因，是它被认为具有药用和精神上的益处。。"
