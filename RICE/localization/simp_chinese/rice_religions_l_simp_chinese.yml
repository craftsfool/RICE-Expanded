 special_doctrine_is_west_iranian_faith_name:0 "西伊朗正教"
 is_west_iranian_faith_name:0 "$special_doctrine_is_west_iranian_faith_name$"
 special_doctrine_is_west_iranian_faith_desc:0 "由于与世隔绝且地形崎岖，美索不达米亚北部、伊朗西部和安纳托利亚东部的高地和山谷是许多异教的发源地。虽然这些教派的宗教起源不同，但它们有许多共同的做法、信仰和思想。"
