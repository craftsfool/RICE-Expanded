 makua_pagan_adherent:1 "穆鲁古教信徒"
 makua_pagan_adherent_plural:0 "穆鲁古教信徒"
 makua_pagan_desc:0 "穆鲁古是创造地球的马库阿创世神。然而，由于穆鲁古地处偏远，不参与人类的日常事务，我们的祖先是我们与穆鲁古之间的中介。"
