 doctrine_parameter_rice_theravada_deities:0 "无法使用$RICE_select_personal_deity_buddhist_decision$[decision|E]（$heritage_burman_name$或$heritage_tibetan_name$[heritage|E]角色可以不受影响使用不同的[decisions|E]）。"
 doctrine_parameter_rice_pudgalavada_deities:0 "$doctrine_parameter_rice_theravada_deities$"
 rice_doctrine_bon_deities_name:0 "供奉神祇"
 rice_doctrine_bon_deities_desc:0 "[GetGeographicalRegion('world_himalaya').GetName][region|E]是众多神灵的家园，祂们与人类彼此之间的关系，以及在宇宙中的角色，因地而异。"
 rice_bon_deities_old_doctrine_name:0 "自古神祇"
 rice_bon_deities_old_doctrine_desc:0 "神祇与精灵，在我们的土地上居住的历史无人能记清。它们拥有强大的力量，有时甚至会带来危险，即使是在帮助我们的时候，也变化无常，难以完全预测。因此，我们必须通过仪式和诚挚的敬畏来安抚它们。"
 rice_bon_deities_new_doctrine_name:0 "护法神祇"
 rice_bon_deities_new_doctrine_desc:0 "这些神灵和精魂曾经很强大，但要么更强的存在驯服，要么自愿新的宗教教义，如今他们成为护法神，而其中许多教义被尊师们隐藏起来，等待时机成熟时再被发现。"
 doctrine_parameter_rice_no_piety_cost_deities:0 "#bold $RICE_select_personal_deity_tibet_decision$#![decision|E]不需要花费[piety_i|E][piety|E]"
 doctrine_parameter_rice_unlocks_terton_content:0 "[Glossary( '伏藏师', 'TERTON_GLOSS' )]机制可以让角色获得[GetTrait('RICE_terton').GetName( GetNullCharacter )][trait|E]"
 rice_light_purification_doctrine_name:0 "明既归于大明，暗亦归于积暗"
 rice_light_purification_doctrine_desc:0 "至于出入四生，迴还六道。无不顾己爱身，视阴昔日。智惠莫之留，神力不能保。\n清净光明大力惠，我今至心普称叹，慈父明子净法风，并及一切善法相。\n而大慈应世，法轮既转。群生於是迴向，庶类所以归依。"
 doctrine_parameter_rice_bema_feast_activity_unlocked_active:0 "解锁[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]"
 doctrine_parameter_rice_manichean_manuscript_unlocked_active:0 "可以做出委托撰写典籍[decision|E]"
 doctrine_parameter_rice_manichean_weekly_confession_unlocked_active:0 "可以采用$RICE_manichean_confession_decision$[decision|E]"
 special_doctrine_rice_doctrine_late_manicheism_abandon_name:0 "晦暗之光"
 rice_doctrine_late_manicheism_abandon_name:0 "$special_doctrine_rice_doctrine_late_manicheism_abandon_name$"
 special_doctrine_rice_doctrine_late_manicheism_abandon_desc:0 "暗既侵眀，恣情驰逐；眀来入暗，委质推移。\n教化事毕，真妄归根。"
 doctrine_parameter_rice_unlock_manichean_mechanics_cost_more_gold:0 "委托撰写典籍[decisions|E]和$RICE_manichean_confession_decision$以及[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]的[gold_i|E][gold|E]成本上升"
 doctrine_parameter_rice_unlock_manichean_manuscripts_lower_learning_req:0 "采用委托撰写典籍[decision|E]时，自己撰写典籍的[learning|E]要求从[learning_i|E]#V 12#!降至[learning_i|E]#V 8#!"
 special_doctrine_rice_doctrine_late_manicheism_support_name:0 "繁盛之光"
 rice_doctrine_late_manicheism_support_name:0 "$special_doctrine_rice_doctrine_late_manicheism_support_name$"
 special_doctrine_rice_doctrine_late_manicheism_support_desc:0 "光明信仰，饱受摧残；[Glossary( '阿罗缓', 'ELECT_GLOSS' )]者，亦受诽谤。\n前后际者，俱升宝舟，同济彼岸。"
 doctrine_parameter_rice_unlock_manichean_bema_festival_legitimacy_bonus:0 "完成[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]后获得少量[legitimacy_i|E][legitimacy|E]"
 special_doctrine_rice_doctrine_late_manicheism_reform_name:0 "重燃光明"
 rice_doctrine_late_manicheism_reform_name:0 "$special_doctrine_rice_doctrine_late_manicheism_reform_name$"
 special_doctrine_rice_doctrine_late_manicheism_reform_desc:0 "近年来，摩尼教历经苦难，其领袖意识到有必要听取[Glossary('教内电那勿们', 'DINAVARIYA_GLOSS')]的警告，不能过于松懈和放任腐败，亟需的改革，重燃光明，击碎黑暗！"
 doctrine_parameter_rice_unlock_manichean_improved_sin_loss_chances:0 "$RICE_manichean_confession_decision$[decision|E]或参加[GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName][activity|E]时，失去坏[traits|E]的概率#P 翻倍#!"
