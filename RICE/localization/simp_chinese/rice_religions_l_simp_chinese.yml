 peristani_religion_desc:1 "居住在帕米尔和兴都库什山脉一线的印度‑伊朗多神教徒信奉诸多神明，这种情况让人想起信奉吠陀教前的印度人和信奉琐罗亚斯德教前的伊朗人。在这一信仰中纯洁和杂质是重要的概念，对被称为般离萨的精灵或仙子的信仰很强烈。"
