 nguni_pagan_adherent_plural:0 "阿马德洛齐派信徒"
 nguni_pagan_desc:0 "阿马德洛齐大神是恩古尼人的先祖，祂会在我们需要时被召唤出来。先祖的智慧和娴熟的巫师与药师一同指导我们的生活。"
