 vedda_pagan_adherent_plural:0 "耶迦信徒"
 vedda_pagan_desc:0 "世界充满了名为#italic 耶迦#!的灵魂，他们有好有坏，居于自然之中。祖先的灵魂会以各种方式照顾和帮助他们的后代。"
