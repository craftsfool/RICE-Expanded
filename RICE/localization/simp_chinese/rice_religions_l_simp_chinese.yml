 east_bantu_religion_adherent:1 "东班图宗教信徒"
 east_bantu_religion_adherent_plural:1 "东班图宗教信徒"
 east_bantu_religion_desc:1 "班图人的精神信仰有很多相似之处，比如对祖先崇拜的重视。东班图人尽管与基督教和伊斯兰教社会有接触，但仍然保留着他们的传统。"
