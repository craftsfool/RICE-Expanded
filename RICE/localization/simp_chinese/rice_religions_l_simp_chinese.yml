 special_doctrine_is_austroasiatic_faith_name:0 "南亚根源"
 is_austroasiatic_faith_name:0 "$special_doctrine_is_austroasiatic_faith_name$"
 special_doctrine_is_austroasiatic_faith_desc:0 "纵使时移世易，南亚语系的诸民和受其影响之民的信仰仍然有着许多相似之处，比如对虎神和米神的崇拜或畏惧。"
 doctrine_parameter_hostility_override_special_doctrine_is_austroasiatic_faith:0 "具有$special_doctrine_is_austroasiatic_faith_name$[doctrine|E]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$或$hostility_evil_tooltippable$"
 doctrine_parameter_rice_unlocks_tiger_spirits_content:0 "解锁$rice_doctrine_austroasiatic_tiger_god_name$[doctrines|E]和$RICE_austroasiatic_tiger_god_decision$[decision|E]"
 rice_doctrine_austroasiatic_tiger_god_name:0 "虎灵"
 rice_doctrine_austroasiatic_tiger_god_desc:0 "尽管老虎崇拜遍布世界，但作为南亚[faiths|E]共同传承的一部分，强大的虎神或虎灵在当地的宇宙观和精神生活中都有着重大的意义。在这些信仰中，传说人类甚至能在某些情况下化身为虎。"
 rice_austroasiatic_wise_tiger_name:0 "智慧虎灵"
 rice_austroasiatic_wise_tiger_desc:0 "尽管虎灵严厉而可怕，但他们终归是仁慈的，传说他们在古时曾赐予我们神圣的学识。"
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_wisdom:0 "$RICE_austroasiatic_tiger_god_decision$[decision|E]提供[GetModifier('RICE_austroasiatic_wise_tiger_modifier').GetNameWithTooltip][modifier|E]"
 rice_austroasiatic_majestic_tiger_name:0 "英武虎灵"
 rice_austroasiatic_majestic_tiger_desc:0 "我们畏惧虎灵，但其恐怖只是天性使然，他们依然是庄严而公正的存在，我们给予他们尊重，他们或许也会予我们回报。"
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_majesty:0 "$RICE_austroasiatic_tiger_god_decision$[decision|E]提供[GetModifier('RICE_austroasiatic_majestic_tiger_modifier').GetNameWithTooltip][modifier|E]"
 rice_austroasiatic_retributive_tiger_name:0 "施惩虎灵"
 rice_austroasiatic_retributive_tiger_desc:0 "虎灵潜于荒野，伺机猎杀生人，他们尤其针对那些无德或打破禁忌的应受惩罚之人。他们应当被以适当的祭祀安抚。"
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_danger:0 "$RICE_austroasiatic_tiger_god_decision$[decision|E][GetModifier('rice_austroasiatic_retributive_tiger_modifier').GetNameWithTooltip][modifier|E]"
 rice_austroasiatic_savage_tiger_name:0 "凶残虎灵"
 rice_austroasiatic_savage_tiger_desc:0 "无论是试图与虎灵讲理，还是想要控制他们，都堪称是难过登天。他们会纠缠摧溃一切胆敢无备离家的愚夫，尤其是那些无德或触碰禁忌之人。"
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_savagery:0 "$RICE_austroasiatic_tiger_god_decision$[decision|E]提供[GetModifier('RICE_austroasiatic_savage_tiger_modifier').GetNameWithTooltip][modifier|E]"
 rice_austroasiatic_no_tiger_name:0 "虎灵衰微"
 rice_austroasiatic_no_tiger_desc:0 "也许老虎有些法力，但就算真有虎灵这种东西，他们也不值得被崇拜或惧怕——#italic 我们#!不该害怕丛林和它的恩赐。"
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_disabled:0 "$RICE_austroasiatic_tiger_god_decision$[decision|E]不可用"
 holy_site_chau_phong_name:0 "峰州"
 holy_site_chau_phong_effect_name:0 "来自[holy_site|E]#weak （$holy_site_chau_phong_name$）#!"
 game_concept_yazata_desc:0 "在$zoroastrianism_religion$中，亚扎塔意为“值得被崇拜者”，是祆教中神祇的统称。对一些人来说，祂们是独特的神祇；对另一些人来说，祂们是至高神的发源。\n\n$zoroastrianism_religion_adj$[faiths|E]可以有不同的[doctrines|E]，代表了由于历史、文化、地理以及与周围信仰体系的接触等原因而产生重要意义的一组亚扎塔。\n\n除了那些拥有$rice_zoroastrian_no_yazatas_doctrine_name$[doctrine|E]的[faith|E]外，所有$zoroastrianism_religion_adj$[rulers|E]都可以获得$RICE_khwarezm_worship_yazata$[decision|E]，它可以根据你选择的亚扎塔给你带来临时的[character_modifier|E]，可选的亚扎塔取决于你的亚扎塔[doctrine|E]。\n\n某些亚扎塔[doctrines|E]甚至可以让你获得建立[zoroastrian_cult_center|E][decision|E]，使朝拜亚扎塔获得更多好处。"
