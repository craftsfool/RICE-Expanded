 rice_doctrine_west_iranian_desc:0 "我们的虔诚应侧重于重要的神祇，尽管我们对祂们的性质、传说、确切身份可能会有不同的看法，但正确的行为，在瞻仰祂们时是最重要的。"
 rice_west_iranian_yazidi_doctrine_name:0 "七天使"
 rice_west_iranian_yazidi_doctrine_desc:0 "#italic 永恒之神#!创造了宇宙和祂的七位天使。居于首位的是孔雀天使，由神授予了管理世界的权柄。"
