 doctrine_parameter_rice_kava_cheaper:0 "#V 饮用卡瓦醉椒汁#!的[decision|E]会花费更少[gold_i|E][gold|E]"
 doctrine_parameter_rice_kava_expensive:0 "#V 饮用卡瓦醉椒汁#!的[decision|E]会花费更多[gold_i|E][gold|E]"
 rice_doctrine_west_papuan_ancestor_focus_name:0 "祖先的化身"
 rice_doctrine_west_papuan_ancestor_focus_desc:0 "祖先对我们来说意味着什么？他们又怎样在日常生活中帮到我们？"
 rice_west_papuan_ancestor_focus_gosimo_name:0 "位置"
 rice_west_papuan_ancestor_focus_gosimo_desc:0 "祖先守护着我们的土地和海洋；只要我们给予他们适当的尊重，在他们常居之处，他们就会以信息的形式、在仪式中协助我们，或以其他方式，为我们提供指引和建议。"
 rice_west_papuan_ancestor_focus_wor_name:0 "雕刻雕像"
 rice_west_papuan_ancestor_focus_wor_desc:0 "#italic 沃卡木雕#!中容纳着逝者的灵魂，有时甚至还安放着他们的头骨。它们是祭拜先祖、与之沟通的重要载体。"
 rice_west_papuan_ancestor_focus_wuon_name:0 "秘密传说"
 rice_west_papuan_ancestor_focus_wuon_desc:0 "先祖之灵传授于我们神圣的奥义与智慧，当隐秘相传，我们应该秘密地传授给值得的人。"
 rice_west_papuan_ancestor_focus_matutuo_name:0 "蜥蜴"
 rice_west_papuan_ancestor_focus_matutuo_desc:0 "我们的图腾祖先为半蜥蜴半人类的伟大神灵，我们在洞穴中向他们献祭，尤以沿海的洞窟为甚，而祂们则回馈我们丰饶的渔获与无尽的财富。"
 doctrine_parameter_rice_unlocks_ancestor_activity:0 "无论[culture|E]或[religion|E]如何，均可解锁[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName][activity|E]"
