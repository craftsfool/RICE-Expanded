 sotho_pagan:0 "莫迪莫派"
 sotho_pagan_adj:0 "莫迪莫派"
 sotho_pagan_adherent:1 "莫迪莫派信徒"
 sotho_pagan_adherent_plural:0 "莫迪莫派信徒"
 sotho_pagan_desc:0 "莫迪莫是索托人和茨瓦纳人的至高神。祂创造了人类和其他神等的一切。祂居住在地下的洞穴之中。人们死后也会居住在此，因此人们来自大地，又去往大地。"
