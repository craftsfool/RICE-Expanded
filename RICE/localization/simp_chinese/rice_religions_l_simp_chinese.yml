 doctrine_parameter_rice_ancestor_activity_bonus_naval:0 "[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName][activity|E]会提供一个[character_modifier|E]，包含[health|E]和军事加成（例如对[raiding|E]的加成），持续#V 10#!年。"
 doctrine_parameter_rice_ancestor_activity_bonus_mystical:0 "[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName][activity|E]会提供一个[character_modifier|E]，其加成与@scheme_icon![schemes|E]相关，持续#V 10#!年。"
 doctrine_parameter_rice_ancestor_activity_bonus_prosperity:0 "[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName][activity|E]为举办地提供一个[county_modifier|E]，给予与[gold_i|E][tax|E]相关的加成，持续#V 10#!年"
