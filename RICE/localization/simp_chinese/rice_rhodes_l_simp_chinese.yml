 rhodes.0020.t:0 "着手准备"
 rhodes.0020.desc:0 "虽然罗得岛巨像已不复存在，但仍有许多人来到[rhodes_barony.GetNameNoTier]参观，并对它的遗迹肃然起敬，它是如此壮观，人类工程史伟大成就，即使是它的废墟也是一道奇特的风景线！\n\n我已经计划在不久的将来亲自去参观这个古老遗迹。毕竟这是世界七大奇迹之一！一座伟大的雕像还在我们身边的时候，我要亲眼目睹它。"
 rhodes.0020.a:0 "我等不及想近距离看到巨像废墟！"
 rhodes.0021.t:0 "巨像"
 rhodes.0021.desc:0 "我已经到了罗得岛巨像遗址的废墟，离[rhodes_barony.GetNameNoTier]的海边不太远。我看到了雕像，它的膝盖处已经断裂，它的残骸躺在基座四周，然而即使如此残碎也令人印象深刻。很少有人能用手臂环绕雕像的拇指，站在废墟旁边，我觉得自己很渺小。\n\n当我绕着雕像走时，我思考着关于雕像建造的传说，它是被献给罗得岛的主神赫利俄斯的，以庆祝他们战胜了入侵者。然而几个世纪后的今天，我和许多人一样，想知道它在全盛时期是什么样子。"
 rhodes.0021.a:0 "这座雕像奠定了罗得岛的声誉和名声！"
 rhodes.0021.a.tooltip:0 "你有概率获得#P 灵感#!同时思考巨像在整个古代世界的威望。这个概率取决于你的[diplomacy_skill|E]和你目前专注在[diplomacy_lifestyle|E]。"
 rhodes.0021.a.toast.tooltip:0 "巨像启发了你"
 rhodes.0021.b:0 "古代的罗得岛人一定是勇武的士兵。"
 rhodes.0021.b.tooltip:0 "你有概率获得#P 灵感#!同时思考罗得岛人抵御战术。这个概率取决于你的[martial_skill|E]和你目前专注在[martial_lifestyle|E]"
 rhodes.0021.b.toast.tooltip:0 "$rhodes.0021.a.toast.tooltip$"
 rhodes.0021.c:0 "我想知道他们用什么技术来建造这个？"
 rhodes.0021.c.tooltip:0 "你有概率获得#P 灵感#!同时思考建造巨像工程的技术。这个概率取决于你的[stewardship_skill|E]和你目前专注在[stewardship_lifestyle|E]。"
 rhodes.0021.c.toast.tooltip:0 "$rhodes.0021.a.toast.tooltip$"
 rhodes.0021.d:0 "推倒巨像的地震一定很可怕。"
 rhodes.0021.d.tooltip:0 "你有概率获得#P 灵感#!同时思考巨像是如何被地震摧毁。这个几率取决于你的[intrigue_skill|E]和你目前专注在[intrigue_lifestyle|E]。"
 rhodes.0021.d.toast.tooltip:0 "$rhodes.0021.a.toast.tooltip$"
 rhodes.0021.e:0 "在当下巨像到底激励我们什么呢？"
 rhodes.0021.e.tooltip:0 "你有概率获得#P 灵感#!同时思考巨像遗留至今的精神遗产。这个几率取决于你的[learning_skill|E]和你目前专注在[learning_lifestyle|E]。"
 rhodes.0021.e.toast.tooltip:0 "$rhodes.0021.a.toast.tooltip$"
 rhodes.0022.t:0 "巨像之影"
 rhodes.0022.desc.has_rhodes:0 "虽然我统治着罗得岛，但并不是每天都有机会仔细参观巨像，花时间去参观是个好主意。"
 rhodes.0022.desc.no_rhodes:0 "我的罗得岛之行即将结束，我只能叹息和思索我所目睹深刻的事情。我对决定参观巨像之旅感到庆幸。"
 rhodes.0022.desc:0 "\n\n我环顾四周，即使在遥远的地方也可以隐隐约约看到巨像的废墟。近距离观看它是一次令人惊叹的经历，即使它如今已经变成废墟但是被认为是世界上的奇观之一！"
 rhodes.0022.a:0 "从某种意义上来说，我仍然觉得自己处于巨像的阴影之下。"
