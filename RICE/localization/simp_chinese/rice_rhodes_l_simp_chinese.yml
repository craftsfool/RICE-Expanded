 rhodes.0050.t:0 "卡利地亚"
 rhodes.0050.desc:0 "今天我在卡利地亚，一个位于[rhodes_county.GetNameNoTier]的小村庄。我为了它的泉水特地前往，因为医生希波克拉底声称这些水有很好的药用价值。"
 rhodes.0050.a:0 "啊......这些正是我所需要的。"
 rhodes.0051.t:0 "费乐摩斯"
 rhodes.0051.desc:0 "我已经到达了费乐摩斯，这是[rhodes_county.GetNameNoTier]岛上的一个山顶位置并依偎在一些宁静的松树林之间。\n\n几个世纪以来，许多人都来过这个地方，因为它的战略位置十分重要而且也可以作为放松之地。这里有一个小小的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]，还有一个小而强大的堡垒，以及几栋别墅，许多当地的贵族都来这里的树荫下放松。\n\n不过这些所有建筑都使用了散落在岛上的老建筑的石头和大理石，有些甚至可以追溯到几个世纪前。"
 rhodes.0051.a:0 "在这个美丽的地方花时间祈祷是一个好主意。"
 rhodes.0051.b:0 "我会检查堡垒，看看它的防御能力如何。"
 rhodes.0051.c:0 "重要的是我在这些别墅里和其他有地位的人一起放松。"
 rhodes.0052.t:0 "露头堡垒 "
 rhodes.0052.desc:0 "[rhodes_county.GetNameNoTier]一直以天险而闻名。然而最近我注意到，该岛的防御工事可能需要一些改进。\n\n岛上有一个地区的地形相当崎岖，那里有一个废弃的堡垒遗址。如果我们有合适的资源，也许我们可以把石头和木头从这些山坡上拖到这个岩石上，建造一个新的小堡垒。"
 rhodes.0052.a:0 "没错，这听起来是个好主意。"
 rhodes.0052.b:0 "转念一想……我们并不需要这样。"
 rhodes.0053.t:0 "卡帕玛"
 rhodes.0053.desc:0 "我拜访了一位住在[rhodes_county.GetNameNoTier]当地贵族，并品尝岛上不同美味菜肴组成的宴席。这场盛宴的亮点一定是罗得岛的#italic 卡帕玛#!，这是用米、肉末、洋葱和其他草药或香料炒羊肉。"
 rhodes.0053.a:0 "美味至极"
 rhodes.0054.t:0 "软芝麻糖包"
 rhodes.0054.desc:0 "在前往[rhodes_county.GetNameNoTier]的一些村庄巡查时，向导向我提供了#italic 软芝麻糖包#!，一种用芝麻和蜂蜜制成的传统罗得岛小吃。它很简单但十分美味，一个人在旅行食用这个可以回复很多体力。"
 rhodes.0054.a:0 "我很好，不需要它。"
 rhodes.0054.b:0 "听起来很美味且十分健康"
 rhodes.0055.t:0 "检阅林多斯"
 rhodes.0055.desc:0 "我目前正在对[rhodes_county.GetNameNoTier]的林多斯卫城的防御工事进行检查。人们很容易理解为什么几个世纪以来人们要在这个地方设防，因为它位于天险。在这里经常可以看到古代和现代的结构、建筑、艺术自由地混合在一起。\n\n我现在正好路过一个古罗得岛人的石质浮雕，这在当地人中是一个有点著名的地标。在林多斯卫城的脚下，这个美丽而雄伟的浮雕是几个世纪前雕刻的，但是现在看起来还比较完整。"
 rhodes.0055.a:0 "我也希望能像古人一样保卫这个岛屿。"
 rhodes.0056.t:0 "阿斯普里·佩特拉"
 rhodes.0056.desc:0 "科斯岛位于[rhodes_county.GetNameNoTier]的北部。我并不总是能去参观，但我每隔一段时间就会因公务和欣赏风景而来。今天我冒险徒步出城去看一个叫阿斯普里·佩特拉的石窟。去这个地方的人不多，所以这是一个很好的休闲场所。"
 rhodes.0056.a:0 "想象它一直在这里，直至世界毁灭"
 rhodes.0057.t:0 "阿塔维罗斯山"
 rhodes.0057.desc:0 "在[rhodes_county.GetNameNoTier]岛上的最高点被称为阿塔维罗斯山。它被一些当地人认为是一个具有重要精神意义的地方，有一些人时不时就会勇敢地进行艰苦的跋涉爬上山顶。据那些去过那里的人说，在晴朗的日子里，从山顶可以看到多德卡尼斯群岛的许多其他岛屿，但我听说有人声称他们可以看到“众神之父”宙斯的故乡克里特岛。"
 rhodes.0057.a:0 "我对此表示怀疑，不过这确实是放松的好去处。"
 rhodes.0057.b:0 "如果我能有时间去那个神奇的地方就好了"
 rhodes.0057.c:0 "为什么不去那一次小小的巡查呢？我很快就会去做的！"
 rhodes.0058.t:0 "卡林诺斯岛海绵经济"
 rhodes.0058.desc:0 "来自[rhodes_county.GetNameNoTier]以北的卡林诺斯岛的海绵潜水员所收获的海绵在全世界都很有名，它们一直为该岛带来巨大的利润。然而，最近，海绵产业的发展并不顺利，因为岛上的销量变低了。"
 rhodes.0058.a:0 "我希望他们的情况能有所改善"
 rhodes.0059.t:0 "卡林诺斯岛海绵经济"
 rhodes.0059.desc:0 "来自[rhodes_county.GetNameNoTier]以北的卡林诺斯岛的海绵潜水员所收获的海绵在全世界都很有名，它们一直为该岛带来巨大的利润。然而，最近，海绵产业的发展甚至比平时更好，销量也更高。"
 rhodes.0059.a:0 "这对当地的经济有好处！"
