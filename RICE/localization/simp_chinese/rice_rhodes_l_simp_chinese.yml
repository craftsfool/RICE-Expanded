 Kassia:0 "卡西亚"
 dynn_kassia_of_kasos:0 "卡索斯"
 RICE_rhodes_gift_kalymnian_sponges:0 "卡林诺斯岛海绵礼品"
 RICE_rhodes_gift_kalymnian_sponges_desc:1 "送一份来自卡林诺斯岛的海绵礼物"
 RICE_rhodes_gift_kalymnian_sponges_self:0 "买一个卡林诺斯岛的海绵"
 RICE_rhodes_gift_kalymnian_sponges_self_desc:1 "给自己买一些卡林诺斯岛海绵"
 building_type_RICE_rhodes_fortifications_01:0 "罗得岛的防御工事"
 building_type_RICE_rhodes_fortifications_01_desc:0 "自古以来，罗得岛就以其强大的防御网络而闻名。目前的城墙和防御设施是经过几代人的努力才建成的。虽然部分防御工事因为几个世纪前的地震而毁，但是防御工事总体被维持在一个可接受的水平。通过一些投资让这些古老的防御系统有一天可以变成更伟大的东西。"
 building_RICE_rhodes_fortifications_01:0 "$building_type_RICE_rhodes_fortifications_01$"
 building_RICE_rhodes_fortifications_01_desc:0 "$building_type_RICE_rhodes_fortifications_01_desc$"
 building_RICE_rhodes_fortifications_02:0 "扩建罗得岛的防御工事"
 building_RICE_rhodes_fortifications_02_desc:0 "由于罗得岛对控制爱琴海的贸易路线至关重要，其统治者可以通过扩大和加强罗得岛古老的城墙，确保它继续得到良好的保护。使用前沿的建筑设计和最新的防御技术来建造，这些防御工事将被证明是对任何愚蠢的入侵者的挑战。"
 RICE_rhodes_sponge_divers_of_kalymnos:0 "卡林诺斯岛的海绵潜水采集员"
 RICE_rhodes_sponge_divers_of_kalymnos_desc:0 "几个世纪以来，卡林诺斯岛一直是著名的海绵产地。这个位于科斯北部的小而简陋的岛屿因为海绵贸易实现了巨大的繁荣。卡利诺岛的海绵采集员经常使用传统技术从海床上采集这些海绵，他们的收获被销往整个地中海地区。\n\n#italic 罗得岛[county|E]的[rulers|E]可以使用一个特殊的[character_interaction|E]，将卡利诺岛海绵赠送他人，也可以为自己采集。#!"
 RICE_rhodes_reveres_hippocrates:0 "崇敬希波克拉底"
 RICE_rhodes_reveres_hippocrates_desc:0 "该角色对希波克拉底这位古代著名医师及治疗师有着深深的敬意，决心在家乡科斯岛以希波克拉底的名义竖立一座小纪念碑。"
 RICE_rhodes_hippocrates_monument_built:0 "希波克拉底纪念碑"
 RICE_rhodes_hippocrates_monument_built_desc:0 "在罗得岛以北的科斯岛有一棵梧桐树，据说是著名的古代医者希波克拉底曾经给他的学生上课的地方。为了纪念希波克拉底，人们在那里建立了一个小型简陋的纪念碑，少数旅行者偶尔会去参观，向这位所谓的医学之父表示敬意。"
 RICE_rhodes_renovated_kassia_tomb:0 "修缮卡西亚之墓"
 RICE_rhodes_renovated_kassia_tomb_desc:0 "该角色决定通过提供必要的资金来纪念卡西亚，以修缮她在科斯岛的坟墓，这样才可以配得上这位杰出的女性。卡西亚被科斯岛当地人视为圣人，她是一位杰出的女修道院院长、诗人，她一生中大部分时间都在科斯岛，她的赞美诗继续激励着该地区虔诚的基督徒。"
 RICE_rhodes_kassia_tomb_renovated:0 "卡西娅之墓最近被翻修"
 RICE_rhodes_kassia_tomb_renovated_desc:0 "一位虔诚的基督教统治者最近决定出资对卡西亚的坟墓进行一些重要的修缮，卡西亚是一位杰出的女修道院院长、诗人和赞美诗作者，她一生中大部分时间都在科斯岛度过，她的赞美诗继续激励着该地区虔诚的基督徒。像她这样一位杰出的女性，被科斯岛的当地人视为圣人，毕竟应该有一个值得埋葬的地方。"
 RICE_rhodes_kassia_of_kasos:0 "科斯岛的卡西亚"
 RICE_rhodes_kassia_of_kasos_desc:0 "希腊女修道院院长，诗人，赞美诗作者。她是个了不起的女人，充满智慧、热衷于坚定地捍卫正统、反对偶像崇拜。有传言说她年轻时是个大美人，曾被视为未来皇帝狄奥斐卢斯的潜在新娘，但当她当面伤了皇帝的自尊心时，所以皇帝没选择她。"
 RICE_rhodes_character_kalymnian_sponges:0 "卡林诺斯岛海绵"
 RICE_rhodes_character_kalymnian_sponges_desc:0 "这个人物要么被赠送，要么为自己购买了大量来自卡林诺斯岛的海绵。这个不起眼的小岛自古以来就是海绵贸易的中心，它的海绵采集员闻名于世。能拥有这么多卡利姆诺斯的海绵是相当奢侈的事"
 RICE_rhodes_opinion_gifted_kalymnian_sponges:0 "赠予我的卡林诺斯岛海绵"
 RICE_rhodes_inspired_colossus_diplomacy:0 "受罗得岛太阳神巨像启发"
 RICE_rhodes_inspired_colossus_diplomacy_desc:0 "该角色最近参观了罗得岛的巨像，在沉思它在古代的名声和声誉之后，受到了这座古迹的启发，不经感叹不愧是古代世界七大奇迹之一！"
 RICE_rhodes_inspired_colossus_martial:0 "受罗得岛太阳神巨像启发"
 RICE_rhodes_inspired_colossus_martial_desc:0 "该角色最近参观了罗得岛的巨像，看着这个古老的纪念碑，思考古代罗得岛人如何成功地保卫他们的岛屿、抵御强大的敌人之后，获得了启发。"
 RICE_rhodes_inspired_colossus_stewardship:0 "受罗得岛太阳神巨像启发"
 RICE_rhodes_inspired_colossus_stewardship_desc:0 "该角色最近参观了罗得岛的巨像，看着这个古老的纪念碑思考当初建造巨像的辉煌工程和工艺之后，获得了启发。"
 RICE_rhodes_inspired_colossus_intrigue:0 "受罗得岛太阳神巨像启发"
 RICE_rhodes_inspired_colossus_intrigue_desc:0 "该角色最近参观了罗得岛的巨像，在沉思这个巨像它是如何在地震中被摧毁的而废墟又如何保留了几个世纪之后，受到了启发。"
 RICE_rhodes_inspired_colossus_learning:0 "受罗得岛太阳神巨像启发"
 RICE_rhodes_inspired_colossus_learningdesc:0 "该角色最近参观了罗得岛的巨像，在沉思这个古老的纪念碑如何让变成废墟后仍然让人们感到惊奇之后获得了启发。"
 RICE_rhodes_visited_filerimos_prayer:0 "在费乐摩斯祈祷"
 RICE_rhodes_visited_filerimos_fort:0 "视察费乐摩斯的堡垒"
 RICE_rhodes_visited_filerimos_villa:0 "在费乐摩斯的庄园中放松身心"
 RICE_rhodes_new_rhodes_fort:0 "露头上的新堡垒"
 RICE_rhodes_hiked_mount_attavyros:0 "徒步旅行阿塔维罗斯山"
 RICE_rhodes_sponge_economy_bad:0 "卡林诺斯岛海绵经济收益不佳"
 RICE_rhodes_sponge_economy_good:0 "卡林诺斯岛海绵经济收益很好"
 RICE_rhodes_visit_colossus_ruins:0 "参观巨像遗址"
 RICE_rhodes_visit_colossus_ruins_tooltip:0 "如此宏伟的雕像......如今已成废墟。"
 RICE_rhodes_visit_colossus_ruins_desc:0 "虽然它已不复存在，但仍有许多来自各地的人参观巨像废墟。我希望能亲自去参观废墟欣赏古人的技艺"
 RICE_rhodes_visit_colossus_ruins_effect_tooltip_1:0 "你将进行一次短途旅行，前往罗得岛巨像，并获得一定数量的[prestige|E]"
 RICE_rhodes_visit_colossus_ruins_effect_tooltip_2:0 "由于你是[THIS.Char.GetFaith.GetAdherentName]，所以你也会获得一定的[piety|E]"
 RICE_rhodes_visit_colossus_ruins_effect_tooltip_3:0 "你可能会受到巨像的#P 启发#!，让你获得几个不同的[character_modifiers|E]"
 RICE_rhodes_visit_colossus_ruins_confirm:0 "去太阳神巨像"
 RICE_rhodes_visit_colossus_ruins_context_tooltip:0 "#emphasis 历史背景：#!罗得岛巨像，是古代七大奇迹之一，也是古代世界最高的雕像。它是为了纪念罗得岛在公元前280年战胜安提柯王朝而建造的，并用来纪念太阳神赫利俄斯。它在公元前226年的一次地震中倒塌，但仍然十分壮观，吸引了许多人前来观赏它的废墟。据中世纪的编年史记载，这座雕像的残骸在公元653年被未来的伍麦叶王朝哈里发穆阿维叶率领的阿拉伯军队摧毁。"
 RICE_decision_rhodes_colossus_distance_req:0 "[realm_capital|E]靠近罗得岛"
 RICE_rhodes_erect_hippocrates_monument:0 "竖立希波克拉底纪念碑"
 RICE_rhodes_erect_hippocrates_monument_tooltip:0 "医学之父理应受到尊重"
 RICE_rhodes_erect_hippocrates_monument_desc:0 "在罗得岛以北的科斯岛，有一棵梧桐树，据说是伟大的古代医者希波克拉底曾经授课的地方。这个地方目前没有得到妥善的维护，也许我可以改变这种状况，以便我们纪念医学之父。"
 RICE_rhodes_erect_hippocrates_monument_effect_tooltip:0 "你将与当地人合作，建立希波克拉底纪念碑。"
 RICE_rhodes_erect_hippocrates_monument_confirm:0 "伟大的医者就应该有一个伟大的纪念碑。"
 RICE_rhodes_erect_hippocrates_monument_context_tooltip:0 "#emphasis 历史背景：#!尽管希波克拉底作为医生的声誉和成就在后来的历史和现代资料中被神化了，但他仍然是医学史上的传奇人物。他出生在科斯岛；相传，那里有一棵树是他教授医术的地方。现在这个地点的树已经有大约500年的历史了，但有可能是原来的树的后裔；它旁边是由圣约翰骑士团建造的科斯城堡，以及一座18世纪的奥斯曼清真寺，和一个由奥斯曼帝国总督建造的刻有阿拉伯文的白色水龙头。"
 RICE_rhodes_renovate_kassia_tomb:0 "修缮卡西亚墓"
 RICE_rhodes_renovate_kassia_tomb_tooltip:0 "这样一位杰出而圣洁的女性应该有一个值得纪念的墓地。"
 RICE_rhodes_renovate_kassia_tomb_desc:0 "卡西亚是一位女修道院院长也是当时最杰出的女性之一，她被埋葬在罗得岛西南的卡索斯岛上，一些当地人已经把她当作圣人。虽然[ROOT.Char.GetFaith.GetAdjective]教会没有正式封圣，但这并不意味着我不能修缮她的坟墓以纪念她和她的成就。"
 RICE_rhodes_renovate_kassia_tomb_confirm:0 "一个传奇的女人，一个传奇的人生。"
 RICE_rhodes_renovate_kassia_tomb_context_tooltip:0 "#emphasis 历史背景：#!卡西亚，又名卡西妮，是9世纪东罗马的一位女修道院院长、圣人、赞美诗作者和诗人，也是西方音乐史上最早被记载的女性之一；她的赞美诗至今仍是东正教礼拜仪式的重要组成部分。传说她美貌与才华并存，但因为伤害了皇帝狄奥斐卢斯的自尊而被他拒绝为妻。讽刺的是，卡西亚是一位坚定的圣像崇拜者，而狄奥斐卢斯却是一位激进的圣像破坏派。她最终定居在卡索斯岛，于9世纪末去世。她在很久以后才被封为圣人，其墓地仍然保存在卡索斯岛上。"
