 rhodes.0011.t:0 "卡西亚逝世"
 rhodes.0011.desc:0 "我刚刚收到来自[kassia_of_kasos.GetFullName]的消息，在[kassia_of_kasos.GetCulture.GetName]人之中有名的修道院院长、诗人、赞美诗作者和基督教正统观念的坚定捍卫者已经去世了。据说她生前不仅聪明、漂亮还很虔诚。\n\n由于[kassia_of_kasos.GetFirstName]晚年大部分时间是在卡索斯岛度过的，该岛位于[rhodes_county.GetNameNoTier]的西南方，她将被埋在那里。有趣的是已经有一些当地人相信她是一个圣人。"
 rhodes.0011.a:0 "明白了……"
 rhodes.0011.tooltip:0 "[rhodes_county.GetNameNoTier]的[ruler|E]可以使用[decision|E]来#EMP 修缮卡西亚墓#!"
 rhodes.0012.t:0 "卡西亚之墓"
 rhodes.0012.desc:0 "虽然[kassia_of_kasos.GetFullName]已经不在世上但她的影响和名声依然存在。作为那个时代最伟大的赞美诗作者、诗人和教会的捍卫者之一，她是一位拥有虔诚与智慧并存的女修道院院长和修女。在卡索斯（[rhodes_county.GetNameNoTier]西南的一个小岛）的居民中，她被认为是当地的圣人，她在那里度过了大部分的生命，甚至在卡索斯之外，她也是整个地区的一个传奇人物。\n\n我为纪念她而尽自己的一份力量是很恰当的。因此我提供了一些资金来修缮她在卡索斯的坟墓，使其符合她的身份。"
 rhodes.0012.a:0 "愿她继续在天堂保佑我们。"
 rhodes.0013.t:0 "医学之父"
 rhodes.0013.desc:0 "据说古代伟大医生希波克拉底出生在科斯岛，该岛在[rhodes_county.GetNameNoTier]的北部。那里有一棵梧桐树，据说就是这位著名医生曾在树下传授医学知识。\n\n即使在这个时代，希波克拉底也是一个值得我们尊敬的人，所以我知道我必须以某种方式纪念这位医学之父。我最终决定在那棵树周围为他竖起一座不大但美丽纪念碑。我希望希波克拉底将继续激励我们在医学上不断前行。"
 rhodes.0013.a:0 "如果我能够见到他本人就好了！"
 rhodes.0014.t:0 "卡林诺斯岛海绵"
 rhodes.0014.desc:0 "[rhodes_county.GetNameNoTier]以北的卡林诺斯岛自古以来就是著名的海绵主要出口地，鉴于获取海绵的难度，海绵贸易为该岛带来了很多财富。无论如何，由于我控制了这个岛，我决定给[recipient.GetTitledFirstName]一些这些著名的卡利姆诺斯海绵作为礼物。它们的高品质和地位应确保这是一份合适的礼物。"
 rhodes.0014.a:0 "我希望[recipient.GetSheHe]能好好利用这些海绵！"
 rhodes.0015.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 rhodes.0015.desc:0 "作为[rhodes_county.GetNameNoTier]以北卡林诺斯岛的统治者，我希望在这封信中送上一份卡利姆诺斯海绵，它是一种奢华品，因其质量而受到全世界的追捧，所以我认为这是一份适合送给你这种身份的礼物。我希望你能为它们找到一个好的用途！"
 rhodes.0015.a:0 "多么贴心的礼物。"
