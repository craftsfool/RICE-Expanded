 RICE_sardinia_ties_reason_placeholder:0 "[CHARACTER.GetShortUIName|U]和[TARGET_CHARACTER.GetShortUIName]共同在[GetGeographicalRegion('RICE_sardinia_region').GetName]和[GetGeographicalRegion('world_africa_north').GetName]之间建立联系。"
