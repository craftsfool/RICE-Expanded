 choose_civic_name: "民政纪念"
 choose_civic_desc: "$choose_civic_name$"
 choose_civic_tooltip: "著名的[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier][palio|E]将为纪念该地区历史上一个重大的事件而举行。通过缅怀过去的荣光，我们在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]地区建立了一种前所未有的团体意识，在这种精神的鼓励下，人们将奋不顾身，追求卓越。"
 choose_dynastic_name: "宗族庆典"
 choose_dynastic_desc: "$choose_dynastic_name$"
 choose_dynastic_tooltip: "著名的[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier][palio|E]将为纪念当地统治者[rulers|E]的成就和胜利而举行。在这期间，居住在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]的人们会更加尊崇那些承担起统治者重任的卓越领袖。"
 RICE_saridinia_sardaniya_decision:0 "欢迎撒丁岛基督教移民"
 RICE_saridinia_sardaniya_decision_tooltip:0 "一些来自撒丁岛的基督徒希望定居在[GetGeographicalRegion('RICE_ifriqiya_region').GetName]"
 RICE_saridinia_sardaniya_decision_desc:0 "[GetReligionByKey('christianity_religion').GetName]在[GetGeographicalRegion('RICE_ifriqiya_region').GetName]已经存在了许多个世纪。为了增加这里信徒群体的人数，一些来自[GetGeographicalRegion('RICE_sardinia_region').GetName]的[GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip]移民希望在[GetGeographicalRegion('RICE_ifriqiya_region').GetName]的某处定居。他们中的一些人甚至还是几世纪前迁移离开的北非人的后裔。"
 RICE_saridinia_sardaniya_decision_confirm:0 "也许我们可以达成一个有利的协议？"
 RICE_saridinia_sardaniya_decision_effect_tooltip_1:0 "撒丁岛的基督徒[courtiers|E]有很小的几率在拥有或靠近撒丁人最后定居的[county|E]的[rulers|E]的[court|E]中生成。"
 RICE_saridinia_sardaniya_decision_effect_tooltip_2:0 "在你的[domain|E]中的一个随机[county|E]将会获得一个[GetModifier('RICE_sardinia_north_african_settlement_modifier').GetNameWithTooltip]的永久[modifier|E]，并且会略微获得[development_i|E][development|E]提升。"
 RICE_saridinia_sardaniya_decision_context_tooltip:0 "#emphasis 历史背景：#!中世纪的穆斯林文献中提到了一个名为撒丁尼亚的城镇，据说这是由一群中世纪撒丁人建立的。它位于北非的凯鲁万不远处，并持续存在了几个世纪。有猜测认为他们可能是几代前逃往撒丁岛的北非基督徒的后裔。"
 RICE_ifriqiya_region_geographical_req:0 "至少在[GetGeographicalRegion('RICE_ifriqiya_region').GetName]拥有一个[county|E]"
 RICE_sardinia_catholic_decision:0 "在撒丁岛接应拉丁教会"
 RICE_sardinia_catholic_decision_tooltip:0 "[GetGeographicalRegion('RICE_sardinia_region').GetName]急需受过教育的拉丁修士"
 RICE_sardinia_catholic_decision_desc:0 "自从[GetGeographicalRegion('RICE_sardinia_region').GetName]转向西方拉丁世界以来，这座岛像我一样的[rulers|E]持续不断地改革这里的[GetPlayer.GetFaith.GetReligion.GetAdjective]教会。为了实现这一目标，我认为与罗马教廷合作，将教会引入这里并重建宗教建筑会是一个好方法。"
 RICE_sardinia_catholic_decision_confirm:0 "发展撒丁岛教会"
 RICE_sardinia_catholic_decision_effect_tooltip_1:0 "附近的[GetGeographicalRegion('RICE_sardinia_region').GetName]以外的[GetReligionByKey('christianity_religion').GetAdjective][ruler|E]将有一个很小的概率获得撒丁岛上的一个[counties|E]的一个[unpressed_claim|E]。"
 RICE_sardinia_catholic_decision_effect_tooltip_2:0 "[GetFaithByKey('catholic').GetAdjective][GetFaithByKey('catholic').PriestMale][courtier|E]将有小概率出现。"
 RICE_sardinia_catholic_decision_effect_tooltip_3:0 "你获得的[piety|E]取决于你的[faith|E]是否[GetFaithByKey('catholic').GetName]，或者是否拥有[GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName][doctrine|E]，或者是否是其他的[GetReligionByKey('christianity_religion').GetAdjective][faith|E]。"
 RICE_sardinia_catholic_decision_context_tooltip:0 "#emphasis 历史背景：#!直到11世纪，撒丁岛教会仍然深受东正教的影响。然而，随着拜占庭权威的衰落，在1054年的教会大分裂背景下，罗马教廷在11世纪末重新与撒丁岛建立了联系，试图对当地的神职人员施加权威，并改革撒丁岛的宗教基础设施，使其更符合天主教会的整体要求，但最初的结果并不尽如人意。比萨共和国，以及其他基督教国家如热那亚共和国，也积极参与了这一宗教行为，不过他们这么做的部分原因是为了扩大他们对该岛的影响力。"
 RICE_sardinia_orthodox_decision:0 "复兴撒丁岛的拜占庭行政机构"
 RICE_sardinia_orthodox_decision_tooltip:0 "[GetGeographicalRegion('RICE_sardinia_region').GetName]需要改善法律和官僚体制"
 RICE_sardinia_orthodox_decision_desc:0 "自从[GetGeographicalRegion('RICE_sardinia_region').GetName]转向东方希腊以来，岛上像我这样的[rulers|E]，持续不断地重建几个世纪以来因战争、冲突和忽视而破败的行政基础设施。得益于新的法律、宪章、官方任命和政府程序，撒丁岛将变得繁荣昌盛。"
 RICE_sardinia_orthodox_decision_confirm:0 "延续罗马传统"
 RICE_sardinia_orthodox_decision_effect_tooltip_1:0 "[GetTitleByKey('e_byzantium').GetNameNoTier]或者[GetTitleByKey('h_roman_empire').GetNameNoTier]的[ruler|E]或者他们的一个[vassals|E]，将有一个很小的概率获得一个针对你的（强或弱）[hook_i|E][hook|E]"
 RICE_sardinia_orthodox_decision_effect_tooltip_2:0 "拜占庭行政官员将有小概率作为[courtier|E]出现"
 RICE_sardinia_orthodox_decision_effect_tooltip_3:0 "你获得的[prestige|E]取决于[GetTitleByKey('e_byzantium').GetNameNoTier]或者[GetTitleByKey('h_roman_empire').GetNameNoTier]的[ruler|E]对你的[opinion|E]"
 RICE_sardinia_orthodox_decision_context_tooltip:0 "#emphasis 历史背景：#!公元456年，罗马帝国败给汪达尔人，被迫失去了撒丁岛。但该岛于公元534年被查士丁尼重新征服。在接下来的几个世纪中，它一直是罗马统治的西部藩篱，尤其是在7世纪阿拉伯人征服北非之后。然而，到了公元1000年，它已不再属于拜占庭的势力范围。对发生这一情况的原因，学者们展开了激烈的争论。尽管如此，拜占庭对撒丁岛宗教、法律和文化的影响是不可否认的。"
 RICE_sardinia_north_african_decision:0 "扩展撒丁岛与北非网络"
 RICE_sardinia_north_african_decision_tooltip:0 "[GetGeographicalRegion('RICE_sardinia_region').GetName]和[GetGeographicalRegion('RICE_ifriqiya_region').GetName]变得更紧密"
 RICE_sardinia_north_african_decision_desc:0 "自从[GetGeographicalRegion('RICE_sardinia_region').GetName]转向[GetGeographicalRegion('RICE_ifriqiya_region').GetName]后，岛上像我这样的[rulers|E]，一直在探索不同的方式来建立我们与该地区的联系。北非作为古罗马帝国的粮仓，可以为我们提供很多东西。"
 RICE_sardinia_north_african_decision_confirm:0 "撒丁岛将连接地中海。"
 RICE_sardinia_north_african_decision_effect_tooltip_1:0 "你和[GetGeographicalRegion('RICE_ifriqiya_region').GetName]中的随机[ruler|E]彼此有可能会改善[opinion|E]，甚至成为[friends|E]。"
 RICE_sardinia_north_african_decision_effect_tooltip_2:0 "在[GetGeographicalRegion('RICE_sardinia_region').GetName]中拥有的每个[county|E]都有小概率获得[GetModifier('RICE_sardinia_north_african_option_piracy').GetNameWithTooltip][modifier|E]"
 RICE_sardinia_north_african_decision_effect_tooltip_3:0 "北非商人将有小概率作为[courtier|E]出现"
 RICE_sardinia_north_african_decision_effect_tooltip_4:0 "你获得的[prestige|E]和[piety|E]取决于[rank|E]"
 RICE_sardinia_north_african_decision_context_tooltip:0 "#emphasis 历史背景：#!撒丁岛自古以来就与北非联系在一起，比如迦太基人殖民该岛部分地区的时候。另一个例子是，在公元456年至534年的汪达尔统治期间，汪达尔人将一些柏柏尔人驱逐到该岛。希腊和罗马的资料通常认为撒丁人起源于北非，这个假说在中世纪的资料中也被重复，例如在12世纪安达卢西亚地理学家和学者伊德里西的著作中。"
 RICE_saridnia_north_african_decision_effect.message:0 "[pirate_county.GetNameNoTierNoTooltip]出现海盗！ "
 RICE_sardinia_none_decision:0 "强化撒丁岛防卫"
 RICE_sardinia_none_decision_tooltip:0 "[GetGeographicalRegion('RICE_sardinia_region').GetName]要如铁桶一般牢固！"
 RICE_sardinia_none_decision_desc:0 "自[GetGeographicalRegion('RICE_sardinia_region').GetName]独立以来，岛上像我这样的[rulers|E]，一直在努力保卫我们心爱的小岛免受内外威胁。"
 RICE_sardinia_none_decision_confirm:0 "我们将以生命捍卫我们的岛！"
 RICE_sardinia_none_decision_effect_tooltip_1:0 "具有高[education_trait|E]的本地人有可能作为[courtier|E]出现"
 RICE_sardinia_none_decision_effect_tooltip_2:0 "你获得的[prestige|E]和[piety|E]取决于[rank|E]"
 RICE_sardinia_none_decision_context_tooltip:0 "#emphasis 历史背景：#!撒丁岛其在地中海历史的大部分时间里都是尴尬的存在，一方面它是位于地中海中心，但它也是一个边缘岛，岛上居住着一些人，无论其出身如何，在外人看来都是野蛮人。例如，罗马人西塞罗就认为撒丁人是不守规矩的盗贼。几个世纪后，12世纪的安达卢西亚地理学家和学者穆罕默德·伊德里西也同样将撒丁人描述为顽固且野蛮的人。虽然中世纪的撒丁人受到了一些罗马和北非的影响，但他们与古罗马之前的撒丁人并不相同，几个世纪以来的资料来源似乎都采用了类似的比喻，无论谁实际上住在那里。"
 RICE_saridnia_none_decision_effect.message:0 "[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]出现海盗！ "
 RICE_sardinia_condaghe_decision:0 "重组家庭的行政文书"
 RICE_sardinia_condaghe_decision_tooltip:0 "我们已经有一段时间没有重修#italic 我们的家庭行政文书#!"
 RICE_sardinia_condaghe_decision_desc:0 "#italic 行政文书#!是与宗教财产或机构有关的[GetPlayer.GetCulture.GetName]行政文件。我们应该检查[GetPlayer.GetDynasty.GetBaseName][dynasty|E]的#italic 行政文书#!是否缺编，以备不时之需。"
 RICE_sardinia_condaghe_decision_confirm:0 "重修#italic 行政文书#!！"
 RICE_sardinia_condaghe_decision_effect_tooltip_1:0 "你将获得介于[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_sardinia_condaghe_prestige_gain_min')]#!和[prestige_i|E]#V [EmptyScope.ScriptValue('RICE_sardinia_condaghe_prestige_gain_max')]#!之间的随机[prestige|E]"
 RICE_sardinia_condaghe_decision_effect_tooltip_2:0 "根据[stewardship|E]和[learning|E]有#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_condaghe_chance')]%#!的概率获得一本#V 行政文书#![artifact|E]"
 RICE_sardinia_condaghe_decision_context_tooltip:0 "#emphasis 历史背景：#!行政文书是中世纪撒丁岛司法中使用的一种行政文件，通常用于与教堂或修道院等宗教机构有关的金融和法律行为。它们甚至在编订出来几个世纪后还用于法律案件。尽管现在很少有实物留存下来，但是对于那些想要了解撒丁岛中世纪历史和萨丁尼亚语的学者来说，它们仍然是一种宝贵的资源。"
 RICE_sardinia_invest_in_palio_horses:0 "投资帕里奥节"
 RICE_sardinia_invest_in_palio_horses_tooltip:0 "如果我们投资马匹，[GetPlayer.GetHouse.GetNameNoTooltip]就能赢得[palio_races|E]"
 RICE_sardinia_invest_in_palio_horses_desc:0 "[GetPlayer.GetCulture.GetName]世家一般都会拥有几匹专门用于赛马的马，以彰显地位。如果我们想在任何[palio_races|E]中取得好成绩，就必须确保我们的骑师拥有最好的马匹。"
 RICE_sardinia_invest_in_palio_horses_confirm:0 "为马匹预留资金"
 RICE_sardinia_invest_in_palio_horses_effect_tooltip_1:0 "你会根据你投资的[gold_i|E][gold|E]随机获得一定数量的[prestige_i|E][prestige|E]和[dynasty_prestige_i|E][dynasty_prestige|E]"
 RICE_sardinia_invest_in_palio_horses_effect_tooltip_2:0 "\n[GetPlayer.GetHouse.GetName][house|E]将会获得一个持续时间在#V 5#!到#V 15#!年之间的[modifier|E]。你投入的[gold_i|E][gold|E]越多，[modifier|E]也会随之增强：\n$EFFECT_LIST_BULLET$增加每月[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$降低骑兵[men_at_arms|E]维护费\n$EFFECT_LIST_BULLET$提高在[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]获胜的概率\n"
 RICE_sardinia_invest_in_palio_horses_context_tooltip:0 "#emphasis 历史背景：#!在中世纪晚期和文艺复兴时期的意大利，强大的宗族是赛马的重要拥有者，他们通过掌控赛马的所有权，以期在诸如帕里奥之类的赛马比赛中击败自己的竞争对手。到了15世纪，来自北非的#italic 柏布马#!成为意大利帕里奥中常见的马种，但其他品种也并非闻所未闻，比如来自奥斯曼帝国的#italic 土耳其马#!。例如，在文艺复兴时期的意大利，以赛马质量著称的曼图亚的贡扎加家族，就从奥斯曼帝国进口了许多赛马，据说，他们一族与奥斯曼帝国有着密切的外交联系。"
 RICE_sardinia_invest_in_palio_horses_type:0 "选择要投资的金额"
 RICE_sardinia_invest_in_palio_horses_gui:0 "选择要在[palio|E]赛马上投资的金额"
 RICE_sardinia_invest_in_palio_horses_small_option:0 "#Bold 小额投资#!"
 RICE_sardinia_invest_in_palio_horses_small_option_desc:0 "$RICE_sardinia_invest_in_palio_horses_small_option$"
 RICE_sardinia_invest_in_palio_horses_small_option_tooltip:0 "投入：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_small_cost')]#!#!\n\n$EFFECT_LIST_BULLET$将会获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_small_min')]#!到[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_small_max')]#![prestige|E]之间的收益\n$EFFECT_LIST_BULLET$[GetPlayer.GetDynasty.GetName][dynasty|E]将会获得[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_small_min')]#!到[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_small_max')]#![dynasty_prestige|E]之间的收益\n$EFFECT_LIST_BULLET$[GetPlayer.GetHouse.GetName][house|E]将会获得#V 5#!到#V 15#!年的[GetModifier('RICE_sardinia_palio_horse_investment_small_modifier').GetNameWithTooltip][modifier|E]"
 RICE_sardinia_invest_in_palio_horses_medium_option:0 "#Bold 中额投资#!"
 RICE_sardinia_invest_in_palio_horses_medium_option_desc:0 "$RICE_sardinia_invest_in_palio_horses_medium_option$"
 RICE_sardinia_invest_in_palio_horses_medium_option_tooltip:0 "投入：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_medium_cost')]#!#!\n\n$EFFECT_LIST_BULLET$将会获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_medium_min')]#!和[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_medium_max')]#![prestige|E]之间的收益\n$EFFECT_LIST_BULLET$[GetPlayer.GetDynasty.GetName][dynasty|E]将会获得[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_medium_min')]#!和[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_medium_max')]#![dynasty_prestige|E]之间的收益\n$EFFECT_LIST_BULLET$[house|E][GetPlayer.GetHouse.GetName]将会获得为期#V 5#!到#V 15#!年的[GetModifier('RICE_sardinia_palio_horse_investment_medium_modifier').GetNameWithTooltip][modifier|E]"
 RICE_sardinia_invest_in_palio_horses_large_option:0 "#Bold 大额投资#!"
 RICE_sardinia_invest_in_palio_horses_large_option_desc:0 "$RICE_sardinia_invest_in_palio_horses_large_option$"
 RICE_sardinia_invest_in_palio_horses_large_option_tooltip:0 "投入：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_large_cost')]#!#!\n\n$EFFECT_LIST_BULLET$将会获得[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_large_min')]#!和[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_large_max')]#![prestige|E]之间的收益\n$EFFECT_LIST_BULLET$[GetPlayer.GetDynasty.GetName][dynasty|E]将会获得[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_large_min')]#!和[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_large_max')]#![dynasty_prestige|E]之间的收益\n$EFFECT_LIST_BULLET$[house|E][GetPlayer.GetHouse.GetName]将会获得为期#V 5#!到#V 15#!年的[GetModifier('RICE_sardinia_palio_horse_investment_large_modifier').GetNameWithTooltip][modifier|E]"
 RICE_sardinia_palio_horses_recent_req:0 "你的[house|E]目前没有[palio|E]赛马[modifier|E]"
 RICE_saridinia_algherese_decision:0 "派遣一名[GetPlayer.GetCulture.GetNameNoTooltip]定居者前往阿尔盖罗"
 RICE_saridinia_algherese_decision_tooltip:0 "我们应当让[GetPlayer.GetCulture.GetNameNoTooltip]定居者在[GetGeographicalRegion('RICE_sardinia_region').GetName]落地生根"
 RICE_saridinia_algherese_decision_desc:0 "随着[GetGeographicalRegion('RICE_sardinia_region').GetName]地区的$heritage_iberian_name$的数量不断增加，我们发现[control|E]岛上不守规矩的原住民变得越来越困难，我们需要一些[GetPlayer.GetCulture.GetName]定居者来补救这种情况，港口城市[GetTitleByKey('b_alghero').GetNameNoTier]是实施这一计划的最佳地点。"
 RICE_saridinia_algherese_decision_effect_tooltip_1:0 "一个建设了贸易港建筑的额外[building|E]槽位将会被添加到[GetTitleByKey('b_alghero').GetNameNoTier]，如果已经存在贸易港建筑，那么会升级原有建筑。"
 RICE_saridinia_algherese_decision_confirm:0 "邀请[GetPlayer.GetCulture.GetNameNoTooltip]定居者"
 RICE_saridinia_algherese_decision_context_tooltip:0 "#emphasis 历史背景：#!建于公元1102年的现代城市阿尔盖罗，多年来一直是地中海战略港口。阿拉贡王国于14世纪征服了撒丁岛，在该地区发生了一些叛乱之后，阿拉贡人驱逐了当地居民，并引进了加泰罗尼亚殖民者，将阿尔盖罗变成了阿拉贡人的统治中心。阿尔盖语——殖民者后代所说的加泰罗尼亚语方言，如今在意大利被官方承认为少数民族语言。"
