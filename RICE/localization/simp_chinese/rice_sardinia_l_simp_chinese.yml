 sardinia.0003.title:0 "[county.GetNameNoTierNoTooltip]的疟疾"
 sardinia.0003.tooltip:0 "[GetModifier('RICE_sardinia_malaria_modifier').GetNameWithTooltip]发生在[county.GetNameNoTier]"
 sardinia.malaria.tooltip:0 "\n[GetGeographicalRegion('RICE_sardinia_region').GetName]作为疟疾的温床而臭名昭著。"
 sardinia.0004.t.catholic:0 "拉丁裁判官"
 sardinia.0004.t.orthodox:0 "拜占庭裁判官"
 sardinia.0004.t.north_african:0 "北非裁判官"
 sardinia.0004.t.none:0 "自主裁判官"
 sardinia.0004.t.backup:0 "裁判官"
 sardinia.0004.desc:0 "自从罗马帝国权威在[GetGeographicalRegion('RICE_sardinia_region').GetName]逐渐衰落，岛上的统治者#italic 裁判官们#!一直在努力维持稳定。尽管与世隔绝，但西方拉丁世界、东方希腊世界，甚至北非世界都以武力或非武力的方式影响着它的发展轨迹。\n\n在岛上有很大影响力的[sardinia_leader.GetTitledFirstName]明白[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]的未来取决于与地中海其他地区的关系。\n"
 sardinia.0004.desc.catholic:0 "[sardinia_leader.GetFirstNameNoTooltip]和[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]上的其他#italic 裁判官#!已向[GetFaithByKey('catholic').GetAdjective]教会示好，支持他们加强其在岛上势力，希望通过让[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]倒向西方拉丁世界，而获得朋友和保护者。"
 sardinia.0004.desc.orthodox:0 "[sardinia_leader.GetFirstNameNoTooltip]和[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]上的其他#italic 裁判官#!，希望通过重建罗马旧行政机构，从而回归东方希腊世界，并寄希望于通过在稳定的罗马管理体系下恢复[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]秩序。"
 sardinia.0004.desc.north_african:0 "[sardinia_leader.GetFirstNameNoTooltip]和[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]上的其他#italic 裁判官#!都明白他们与南部大陆之间联系的重要性。通过倒向北非，让这些联系将变得更加紧密，让[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]的土地繁荣昌盛。"
 sardinia.0004.desc.none:0 "[sardinia_leader.GetFirstNameNoTooltip]和[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]上的其他#italic 裁判官#!都知道他们不能依靠任何人，毕竟在西方拉丁世界、东方希腊世界，甚至北非世界都自在乎自己的利益而不会在乎[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]的理由，因此独立自主是唯一选择，尽管是受到[GetPlayer.Custom('RICE_sardinia_none_ending_type')]的影响，但还是有望避免外部势力的操纵和剥削。"
 sardinia.0004.a:0 "我也应该接受[sardinia_leader.GetFaith.GetNameNoTooltip]，以完成这个过程……"
 sardinia.0004.b:0 "$sardinia.0004.a$"
 sardinia.0004.c:0 "只有时间才能够回答……"
 sardinia.0004.catholic.tradition:0 "所有拥有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]，其传统已升级为$tradition_RICE_judicati_catholic_name$[tradition|E]"
 sardinia.0004.orthodox.tradition:0 "所有拥有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]，其传统已升级为$tradition_RICE_judicati_orthodox_name$[tradition|E]"
 sardinia.0004.north_african.tradition:0 "所有拥有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]，其传统已升级为$tradition_RICE_judicati_north_african_name$[tradition|E]"
 sardinia.0004.none.tradition:0 "所有拥有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]，其传统已升级为$tradition_RICE_judicati_none_name$[tradition|E]"
 sardinia.0005.t:0 "[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]及更大独立性"
 sardinia.0005.desc:0 "近来，[GetGeographicalRegion('RICE_sardinia_region').GetName]的裁判官和我一样，都认为撒丁岛应该有更好的前景。\n\n因为这里与地中海其他地区有着千丝万缕的联系。我作为岛上最重要的统治者，是时候决定撒丁岛未来的方向了，是否从西方拉丁世界、东方希腊世界，还是北非世界吸取灵感，从而不被其文化所吞并，让我们自己有自立的力量。"
 sardinia.0005.a:0 "西方拉丁世界——罗马文化与当地文化的熔炉"
 sardinia.0005.a.tooltip:0 "$RICE_sardinia_decide_sardinia_orientation_effect_tooltip.catholic.1$"
 sardinia.0005.b:0 "东方希腊世界——毕竟我们是罗马遗产的继承者"
 sardinia.0005.b.tooltip:0 "$RICE_sardinia_decide_sardinia_orientation_effect_tooltip.orthodox.1$"
 sardinia.0005.c:0 "北非世界——一片多姿多彩、崎岖不平的民族之地"
 sardinia.0005.c.tooltip:0 "$RICE_sardinia_decide_sardinia_orientation_effect_tooltip.north_african.1$"
 sardinia.0006.t:0 "新的阿尔盖罗社区"
 sardinia.0006.desc:0 "[alghero_settlement_liege.GetTitledFirstNamePossessive]对[GetGeographicalRegion('RICE_sardinia_region').GetName]的控制一直很脆弱，受到来自各处的当地人抵抗，然而，[alghero_settlement_liege.GetHerHis|U]官员和顾问提出了解决这一问题的办法，并付诸实施……\n\n许多来自[GetGeographicalRegion('world_europe_west_iberia').GetName]的[culture.GetCollectiveNoun]都有意在岛上定居，其中[GetTitleByKey('b_alghero').GetNameNoTier]是一个完美的地点，因为它是一个港口城市，可以作为[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]和[GetGeographicalRegion('world_europe_west_iberia').GetNameNoTooltip]之间的连接点。\n\n为了防止该地区将来出现任何抵抗，[alghero_settlement_liege.GetFirstNameNoTooltip]再将[culture.GetNameNoTooltip]定居者引入城市之前，已经驱逐了大部分当地居民。现在，城市里到处都是说[culture.GetLanguage.GetName]语言的[culture.GetNameNoTooltip]人，所以他们更容易接受[alghero_settlement_liege.GetFirstNameNoTooltip][alghero_settlement_liege.GetHerHis]的统治。"
 sardinia.0006.a:0 "[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]正在发生变化。"
 sardinia.0007.t:0 "新的帕里奥传统"
 sardinia.0007.desc:0 "自从帕里奥比赛流行起来后，它就成了人们欢聚一堂、庆祝的绝佳场合。\n\n各个城市都会举办自己的帕里奥和其他重大活动，但有时可能是临时性的。我已经与[capital.GetNameNoTier]的知名人士合作，在那里举办了一次大型的帕里奥，并且建立一个新的传统今后将定期举行，用来增强当地人自豪感，让[capital.GetNameNoTierNoTooltip]在该地区声名远播。\n\n特别是，帕里奥将举办在"
 sardinia.0007.desc.religious:0 "当地民众非常喜欢的一个重要宗教节日期间。因此，这一新的帕里奥传统将带有浓厚的宗教色彩，通过将信仰与节日相结合来激励当地人。"
 sardinia.0007.desc.civic:0 "纪念[capital.GetNameNoTierNoTooltip]历史上的一个重大历史事件期间，这样可以凝聚我们的自豪感。"
 sardinia.0007.desc.dynastic:0 "纪念[ROOT.Char.GetHouse.GetName]家族历史上重大事件期间，与当地人紧密联系在一起，共同庆祝我们的胜利。"
 sardinia.0007.a:0 "愿这一传统长久不衰！"
 sardinia.0008.t:0 "xxxxx"
 sardinia.0008.desc:0 "xxxxx"
 sardinia.0008.a:0 "xxxxx"
 sardinia.0009.t:0 "xxxxx"
 sardinia.0009.desc:0 "xxxxx"
 sardinia.0009.a:0 "xxxxx"
 sardinia.0010.t:0 "撒丁尼亚"
 sardinia.0010.desc:0 "我听说有一些[christianity.GetAdjective][sardinian.GetCollectiveNoun]人想要从[GetGeographicalRegion('RICE_sardinia_region').GetName]移民到[GetGeographicalRegion('RICE_ifriqiya_region').GetName]。\n\n可能是因为时局不稳，也可能是单纯地渴望冒险和在其他地方获得更多的机会，甚至我还听说，他们中有些人是多年前逃离[GetGeographicalRegion('RICE_ifriqiya_region').GetNameNoTooltip]的[african_roman.GetName]难民后裔。\n\n无论如何，他们的领主希望在这个地区，尤其是在[sardaniya_location.GetNameNoTier]建立一个名为#italic 撒丁尼亚#!的地方来保留自己的习俗和信仰，虽然他们的人数不多，但也能为我们带来一些政治和经济利益。"
 sardinia.0010.a:0 "愿撒丁尼亚人在我们的保护下繁荣昌盛。"
 sardinia.0010.tooltip:0 "撒丁岛基督教[courtiers|E]有小概率在拥有[sardaniya_location.GetNameNoTier][county|E]或其附近的[rulers|E]的[court|E]中生成。"
 sardinia.0011.t:0 "xxxxx"
 sardinia.0011.desc:0 "xxxxx"
 sardinia.0011.a:0 "xxxxx"
 sardinia.0012.t:0 "来自撒丁尼亚"
 sardinia.0012.desc:0 "[GetGeographicalRegion('RICE_ifriqiya_region').GetName]是许多民族的家园，其中[sardaniya_county.GetNameNoTier]是一个充满活力的基督徒社区，他们的祖先最初来自[GetGeographicalRegion('RICE_sardinia_region').GetName]。\n\n一位名叫[courtier.GetFullName]的[sardinian_culture.GetName][courtier.GetWomanMan]同样来自#italic 撒丁尼亚#!，[courtier.GetHerHis]想为我提供服务，也许我可以继续用[courtier.GetHerHis]这样的人才……"
 sardinia.0012.a:0 "欢迎[courtier.GetSheHe]来我的宫廷！"
 sardinia.0012.b:0 "我不需要[courtier.GetHerHis]的服务"
 sardinia.0013.t:0 "[afro_roman.GetCollectiveNounNoTooltip]"
 sardinia.0013.desc:0 "在古代，[GetGeographicalRegion('RICE_ifriqiya_region').GetName]曾是大量[GetReligionByKey('christianity_religion').GetAdjective][afro_roman.GetCollectiveNoun]的家园，他们讲自己的拉丁方言。自从[GetReligionByKey('islam_religion').GetName]出现后，这个社区要么改信他教要么移民到了其他地方，也逐渐衰落。\n\n而[courtier.GetTitledFirstName]是这一古老群体的幸存者之一，其来到我的宫廷，希望为我效力。"
 sardinia.0013.desc.north_africa:0 "由于[courtier.GetSheHe]是[GetGeographicalRegion('RICE_ifriqiya_region').GetNameNoTooltip]的本地人，[courtier.GetSheHe]希望能协助我们处理当地事务。"
 sardinia.0013.desc.other:0 "与[courtier.GetHerHis]的一些兄弟一样，[courtier.GetSheHe]也在[GetGeographicalRegion('RICE_ifriqiya_region').GetNameNoTooltip]以外的地方寻找更好的机会。"
 sardinia.0013.a:0 "$sardinia.0012.a$"
 sardinia.0013.b:0 "$sardinia.0012.b$"
 sardinia.0014.t:0 "加强教会"
 sardinia.0014.desc.intro:0 "拉丁礼教会继续在[GetGeographicalRegion('RICE_sardinia_region').GetName]扩展，但还需要做更多的工作。因此，我最近邀请了[catholic.GetAdjective]神职人员来到这里，重建了礼拜场所，并拨出专款支持那里的宗教基础设施。\n\n"
 sardinia.0014.desc.pope:0 "[pope.GetTitledFirstName]对我的行动特别满意"
 sardinia.0014.desc.priest:0 "事实上，[GetFaithByKey('catholic').PriestNeuterPlural]中的一位[priest.GetFirstName]甚至加入了我的宫廷，帮助我促进教会在[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]的发展。\n\n"
 sardinia.0014.desc.opportunist:0 "该死的！到来的神职人员中，有很多都得到了[opportunist.GetFullName]的赞助，而[opportunist.GetHerHis]通过这些关系，获得对我的领地，尤其是[claimed_county.GetNameNoTier]的影响！\n\n在[ROOT.Char.GetFaith.HighGodName]的恩典下，[opportunist.GetFirstNamePossessiveNoTooltip]不光彩的操纵行为不会被忽视，也不会不受惩罚，更不会影响我的虔诚行为。"
 sardinia.0014.desc.conclusion:0 "所作所为，皆为繁荣与虔诚。"
 sardinia.0014.a:0 "愿[ROOT.Char.GetFaith.HighGodNameAlternate]指引并保护我们！"
 sardinia.0015.t:0 "振兴行政"
 sardinia.0015.desc.intro:0 "[GetGeographicalRegion('RICE_sardinia_region').GetName]是罗马帝国最早的行省之一，但随着帝国西部的崩溃，它逐渐成为一个被忽视的地区。\n\n虽然现在情况已经有了很大改善，但仍有必要恢复罗马行政管理。因此我已采取措施重组岛上的官僚机构，颁布新的法律和章程，并改革政体程序。"
 sardinia.0015.desc.emperor:0 "[emperor.GetFirstName][emperor.GetHerselfHimself]派了许多官员来协助我。"
 sardinia.0015.desc.no_emperor:0 "我是[ROOT.Char.GetTitleAsNameNoTooltip]，我有很多官员可以帮助我"
 sardinia.0015.desc.official:0 "其中一位[official.GetFirstName]甚至加入了我的宫廷，帮助我更好地协调这些工作。"
 sardinia.0015.desc.opportunist:0 "\n\n[opportunist.GetTitledFirstName]似乎让[opportunist.GetHerselfHimself]极大地参与了这一努力，操纵局势，为[opportunist.GetHerHis]自己谋利。[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]将从我的行动中获益，但我必须在[opportunist.GetFirstNameNoTooltip]周围小心行事。"
 sardinia.0015.desc.conclusion:0 "\n\n我所做的一切[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]会成为一个稳定繁荣的岛屿。"
 sardinia.0015.a:0 "我相信，[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]一定会蒸蒸日上。"
 sardinia.0016.t:0 "拓展北非网络"
 sardinia.0016.desc.intro:0 "自从[GetGeographicalRegion('RICE_sardinia_region').GetName]倒向北非世界，加强了与地中海的联系之后。因此，我努力邀请定居者、互设使馆、鼓励贸易等方式与北非世界建立联系。\n\n"
 sardinia.0016.desc.north_african_ruler:0 "我的努力并没有被[north_african_ruler.GetFullName]忽视，他也为加强[north_african_ruler.GetHerHis]领土与[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]的联系做了很多工作，这对我们双方都有益。"
 sardinia.0016.desc.no_north_african_ruler:0 "希望北非的领主和其他人会欣赏我的努力，即使我们隔海相望，即使信仰和文化都不同。"
 sardinia.0016.desc.merchant:0 "此外，一位来自[county.GetNameNoTier]的[north_african_culture.GetName]商人[merchant.GetFirstName]也来到了我的宫廷，帮助改善我们之间的关系。"
 sardinia.0016.desc.conclusion:0 "\n\n繁荣可能会引起贪婪的海盗和不法之徒的注意，他们试图劫掠夺[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]，甚至在上面安营扎寨作为基地，从而更好地掠夺，但是我们的利益足以抵消这种损失。"
 sardinia.0016.a:0 "地中海真是一片充满机遇的海洋。"
 sardinia.0017.t:0 "加固岛屿"
 sardinia.0017.desc.intro:0 "自从[GetGeographicalRegion('RICE_sardinia_region').GetName]决定自主独立后，当地一直在努力保护该岛免受外来入侵，我也不例外，通过使用[GetPlayer.Custom('RICE_sardinia_none_ending_type')]技艺重建或新增岛上的防御工事，并对居民进行培训，使他们做好应对任何袭击的准备。"
 sardinia.0017.desc.local:0 "\n\n许多当地人都对我的参与感到高兴。甚至一位来自[county.GetNameNoTier]的名人[local.GetFirstName]也加入我的宫廷协助我。"
 sardinia.0017.desc.conclusion:0 "\n\n只要我们保持警惕，[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]将在地中海保持超然和独立的地位，不会受制于任何外来势力。"
 sardinia.0017.a:0 "[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]万岁！"
 sardinia.0018.t:0 "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]的行政文书"
 sardinia.0018.desc:0 "随着时间的流逝，[ROOT.Char.GetCulture.GetName]人们广泛使用#italic 行政文书#!来跟踪捐款、捐赠、租赁、购买、诉讼以及与宗教相关的其他财务和法律活动。\n\n大多数[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]世家（包括[ROOT.Char.GetDynasty.GetBaseName]），都起草了一些#italic 行政文书#!。然而，这些#italic 行政文书#!分散在各处——有些保存在住所和办公室，有些存放在当地[ROOT.Char.GetFaith.HouseOfWorship]，但是它们没有收到妥善的保管。\n\n因此，我下令我们尽可能多地找到我们家的#italic 行政文书#!并重新修订它们，这对我们未来有很大的用处。"
 sardinia.0018.a:0 "我们现在这样做是一件好事！"
 sardinia.0019.t:0 "投资帕里奥用马"
 sardinia.0019.desc.intro:0 "像[GetPlayer.GetHouse.GetName]家族这样的伟大[GetPlayer.GetCulture.GetName]家族理应拥有一批精良饲养的赛马，以备在帕里奥节赛马比赛中与其他家族竞争。\n\n这就是为什么"
 sardinia.0019.desc.investor:0 "我主动"
 sardinia.0019.desc.other:0 "[ROOT.Char.Custom2('RelationToMe', palio_horse_investor)]主动"
 sardinia.0019.desc.conclusion:0 "投资家族的赛马，无论是从马场繁育，亦是从国外购买，又或者两者兼而有之。如果策略得当，我们将在未来许多年内统治该地区的赛马比赛！"
 sardinia.0019.a:0 "这些马儿将带我们胜利！"
 sardinia.0019.small.tooltip:0 "只要[house|E]中拥有[GetModifier('RICE_sardinia_palio_horse_investment_small_modifier').GetNameWithTooltip][modifier|E]，则赢得[palio_race|E]的概率就会增加一点点"
 sardinia.0019.medium.tooltip:0 "只要[house|E]中拥有[GetModifier('RICE_sardinia_palio_horse_investment_medium_modifier').GetNameWithTooltip][modifier|E]，则赢得[palio_race|E]的概率就会增加一点"
 sardinia.0019.large.tooltip:0 "只要[house|E]中拥有[GetModifier('RICE_sardinia_palio_horse_investment_large_modifier').GetNameWithTooltip][modifier|E]，则赢得[palio_race|E]的概率就会适度增加"
 sardinia.0020.t:0 "准备离开"
 sardinia.0020.desc:0 "当我得知[host.GetTitledFirstName]将在[location.GetName]举办盛大的帕里奥赛马会时，我知道我必须参加。因为整个地区的贵族都可能出席观摩这场赛马会，这对每个人来说都将是一个欢庆的时刻。\n\n做好准备后，就可以前往帕里奥了。"
 sardinia.0020.a:0 "我希望这会很有趣！"
 sardinia.0021.t:0 "参加帕里奥？"
 sardinia.0021.desc:0 "帕里奥节赛马比赛的同时，我也在思考，像[ROOT.Char.GetHouse.GetName]这样的伟大家族来说，这些比赛是一个赢得声誉和名声的绝佳机会......只要我们带着家族的一匹赛马参加比赛，但另一方面为这样的比赛准备赛马无疑是巨大开销。"
 sardinia.0021.a:0 "这就是为什么我们这次只在这里观看。"
 sardinia.0021.a.tooltip:0 "你的[house|E]将不会赞助任何骑师参加[palio_race|E]，并且#N 放弃#!从[palio_race|E]获胜中获得奖励。"
 sardinia.0021.b:0 "我们的马已经为这个场合做好了准备。"
 sardinia.0021.b.tooltip:0 "你的[house|E]有默认的概率赢得[palio_race|E]，但如果[house|E]中的某个人采用了#V $RICE_sardinia_invest_in_palio_horses$#![decision|E]，获胜概率会提升。"
 sardinia.0021.c:0 "我投入了很多，以确保我们能赢得这场比赛！"
 sardinia.0021.c.tooltip:0 "你的[house|E]有#P 更高的#!概率赢得[palio_race|E]，但如果[house|E]中的某个人采用了#V $RICE_sardinia_invest_in_palio_horses$#![decision|E]，获胜概率会进一步提升。"
 sardinia.0022.t:0 "到达"
 sardinia.0022.desc:0 "我一刻也不嫌早得就呆在[actual_location.GetName]，这里的人们兴奋不已，来回奔走，为即将举行的比赛做准备，远近的游客也纷至沓来。\n\n帕里奥并不仅仅是比赛本身，毕竟比赛只是一个庆典活动的高潮，因此需要做的事情还有很多。这次举行目的是"
 sardinia.0022.desc.religious.christian:0 "庆祝[actual_location.GetName]一位受欢迎的[faith.GetAdjective]圣人的节日"
 sardinia.0022.desc.religious.non_christian:0 "庆祝宗教场合，以纪念当地的[faith.GetAdjective]圣人"
 sardinia.0022.desc.civic:0 "以纪念[actual_location.GetName]历史上的一个时刻"
 sardinia.0022.desc.dynastic:0 "纪念[host.GetHouse.GetName]家族最近的事件和胜利。"
 sardinia.0022.desc.horses:0 "\n\n我还检查了马匹和骑师的情况，他们稍后将参加帕里奥比赛。目前看来，他们一切都好，希望他们这次能赢！"
 sardinia.0022.a:0 "着手准备最后的工作。"
 sardinia.0023.a:0 "让我们开始吧！"
 sardinia.0024.t:0 "赞助晚会"
 sardinia.0024.desc:0 "所有人，不论是[actual_location.GetName]本地人的还是外来的游客，今晚都必须参加#italic [host.GetFaith.GetAdjective]赞助会#!——那些未能参加的当地居民会处以罚款！\n\n会后，游行队伍穿过城镇，来到市政大厅。那里举办了盛大的宴会——所有人，不论是[actual_location.GetName]本地人的还是外来的游客，都可以参加！"
 sardinia.0024.a:0 "一个美妙而欢乐的时刻!"
 sardinia.0026.t:0 "帕里奥开始了！"
 sardinia.0026.desc.intro.christian:0 "圣人日的早晨"
 sardinia.0026.desc.intro:0 "假期的早晨"
 sardinia.0026.desc:0 "我们必须先目睹另一场盛大的游行，然后在[actual_location.GetName]的主要[host.GetFaith.HouseOfWorship]处献上敬意。这一切都很美好，也很有趣，但与帕里奥上激动人心的比赛相比，就相形见绌了。\n\n比赛即将开始时，街道两旁挤满了人们，有乞丐和农民，也有像我这样的商人和贵族。当马匹排成一列时，"
 sardinia.0026.desc.horses:0 "我看到代表我们[ROOT.Char.GetHouse.GetName]的骑师，身上穿着我们的族徽！我和家臣们疯狂地欢呼，鼓励骑师。"
 sardinia.0026.desc.none:0 "我看到许多骑师穿着不同族徽的衣服，其中大部分是贵族，但也有一些是平民的，不过每个人都在为他们疯狂欢呼。"
 sardinia.0026.desc.conclusion:0 "\n\n随着号角声响起，比赛开始了，马匹飞一般的跑了出去！"
 sardinia.0026.a:0 "上上上！"
 sardinia.0026.info:0 "#emphasis 历史背景：#!锡耶纳的帕里奥是现存最古老的赛马节，比赛通常在#italic 田野广场#!周围举行，在17世纪之前，锡耶纳的赛马不会迂回进行。相反，他们从城门或城外出发，穿过城市，最后抵达田野广场。"
 sardinia.0028.t:0 "到达终点！"
 sardinia.0028.desc:0 "空气中传来雷鸣般的马蹄声，还来自激动的人群的欢呼声和叫喊声，然后——一匹马冲过终点线！\n\n"
 sardinia.0028.desc.house_host:0 "[palio_winner.GetHouse.GetName][house|E]获胜了！！我情不自禁地欢呼大笑起来！其他贵族肯定会羡慕地看着我们，因为其他人都会敬畏地说出我们家族的名字是胜者！"
 sardinia.0028.desc.house_other:0 "[palio_winner.GetHouse.GetName][house|E]获胜了，[palio_winner.GetTitledFirstName]及其家臣对这个结果极为满意。"
 sardinia.0028.desc.merchant:0 "一个商人家庭赢得了比赛，显然他们为此付出了高昂的代价。毕竟他们不像我们一样是贵族，但我不得不承认，他们的成就仍然令人印象深刻。"
 sardinia.0028.desc.patrician:0 "[actual_location.GetNameNoTooltip]中的一个小贵族家族赢得了比赛。这无疑将是他们家族历史上伟大的一天。"
 sardinia.0028.desc.conclusion:0 "\n\n获胜的骑师走向官员那接受胜利者旗帜，在接过的那刹那，雷鸣般的声音淹没了整个城市，每个人都鼓掌欢呼庆祝。"
 sardinia.0028.a:0 "帕里奥比赛结束了，但还有更多活动！"
 sardinia.0028.b:0 "甜美的胜利还没完，还有庆祝活动！"
 sardinia.0028.info:0 "#emphasis 历史背景：#!中世纪和文艺复兴时期帕里奥的获胜骑师通常会得到报酬。有些是妇女，甚至是儿童，后者是因为他们的体型较小。例如，1581年8月15日在锡耶纳举行的一场帕里奥比赛中，12岁的牧羊女弗吉尼亚·塔奇获胜。她不仅被诗人们视为不朽的女战士，而且，由于锡耶纳当时被佛罗伦萨统治，她成为当地的骄傲和反抗佛罗伦萨统治的象征。"
 sardinia.0030.t:0 "盛宴"
 sardinia.0030.desc.intro:0 "随着比赛的结束，整个城市陷入一片混乱。不过不是糟糕的混乱，而是喜悦的混乱，是狂欢和盛宴的热潮，席卷过每一个在场的人。一旦帕里奥的角逐尘埃落定，像这样的传统节日就是一个新的开始。\n\n地方官员也会花时间进行慈善捐赠。"
 sardinia.0030.desc.host:0 "我捐赠的"
 sardinia.0030.desc.guest:0 "由[host.GetTitledFirstName]捐赠的"
 sardinia.0030.desc.conclusion:0 "善款被分发给穷人和有需要的人。嫁妆也通过彩票的形式被赠送给贫困的年轻妇女，一些囚犯也得到赦免和释放。\n\n毫无疑问，没有人会忘记[ROOT.Char.GetFaith.HighGodName]的仁慈和优雅。在这里，充满着欢乐的氛围，每个人都活力四射，每个人都玩得很开心！"
 sardinia.0030.a:0 "[actual_location.GetNameNoTooltip]真会办派对！"
 sardinia.0030.info:0 "#emphasis 历史背景：#!因为帕里奥通常在宗教节日举行，这期间通常也是整个城市的一次契机，无论是谁组织的帕利奥赛马，在最后都会进行慈善行为。这些也让地方政府在维护公共秩序方面发挥了明显的作用。例如，向年轻妇女提供嫁妆可以帮助她们避免因绝望而成为妓女，释放囚犯可以减少监狱的过度拥挤等等。"
 sardinia.0031.t:0 "市集"
 sardinia.0031.desc:0 "节日和帕里奥都已经结束了，远方的客人开始收拾行李，当地的行会和商人建立了一个宏大的#italic 市集#!来展示他们的商品。\n\n这里办市集的传统对我这样的人来说可谓是一个很好的机会，可以去购买一些小饰品，将兴奋的心情放回去。\n\n想到过去几天的欢乐时光，如今转瞬即逝，竟然会让人觉得如释重负，真是奇怪……"
 sardinia.0031.a:0 "还是算了。"
 sardinia.0031.b:0 "临走前还是买些东西吧！"
