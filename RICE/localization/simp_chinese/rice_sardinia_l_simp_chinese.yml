 RICE_fervor_gain_sardinia_fervor: "撒丁岛效忠"
 innovation_RICE_condaghes:0 "行政文书"
 innovation_RICE_condaghes_desc:0 "#italic 行政文书（condaghe）#!是撒丁岛一种独特的行政文件，由贵族保存，用于记录继承、购买、捐赠、交易和诉讼，主要是与宗教有关的情况。这些记录的主要目的是在发生法律纠纷时提供精确的日期，是撒丁岛从拜占庭帝国继承下来的官僚作风的演变。"
 innovation_RICE_palio_races:0 "帕里奥赛马节"
 innovation_RICE_palio_races_desc:0 "随着意大利城市化的发展，一些城市和城镇在世俗场合，特别是宗教场合，开始举办自己的赛马会，被称为#italic 帕里奥赛马节#!。这些赛马节已成为当地文化的一部分，无论其社会阶层或地位如何，都会为此骄傲。"
