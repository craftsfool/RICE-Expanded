 opinion_attended_palio_host:0 "参加我的帕里奥"
 RICE_sardinia_alghero_modifier:0 "阿尔盖罗社区"
 RICE_sardinia_alghero_modifier_desc:0 "阿尔盖罗居住着伊比利亚入侵者的后裔，他们讲伊比利亚语的方言，随后演变为阿尔盖罗语。由于该社区与伊比利亚的联系，该地已成为重要的贸易和海上交通中心。"
 RICE_sardinia_bad_casu_marzu:0 "活蛆乳酪消化问题"
 RICE_sardinia_seadas:0 "品尝美味的撒丁岛海鲜"
 RICE_sardinia_bidemortos_marked:0 "来自比德莫托斯的警告"
 RICE_sardinia_bidemortos_marked_desc:0 "#italic 比德莫托斯#!是撒丁岛民间传说中一个能看到死者的人，据说他在死者队伍中看到了某人，这意味着那人很快就会死去。"
 RICE_sardinia_aradia_bad_dream:0 "梦中被阿拉蒂娅惩罚"
 RICE_sardinia_aradia_bad_dream_desc:0 "撒丁岛民间传说中的人物阿拉蒂娅曾在梦中拜访过这位妇女。据说她因为懒于纺纱织布而受到了惩罚。"
 RICE_sardinia_aradia_good_dream:0 "梦中被阿拉蒂娅奖赏"
 RICE_sardinia_aradia_good_dream_desc:0 "撒丁岛民间传说中的人物阿拉蒂娅曾在梦中拜访过这位妇女。据说她勤于纺纱织布而受到了奖励。"
 RICE_sardinia_public_prayers_to_saint_saturninus:0 "公开向圣萨图尼努斯祈祷"
 RICE_sardinia_transformed_nuraghe:0 "将努拉盖改造为礼拜堂"
 RICE_sardinia_shepherds_paths:0 "探索撒丁岛的牧羊人之路"
 RICE_sardinia_decide_sardinia_orientation:0 "确定撒丁岛方向"
 RICE_sardinia_decide_sardinia_orientation_tooltip:0 "长期以来，西方拉丁世界与东方希腊世界一直在争夺影响[GetGeographicalRegion('RICE_sardinia_region').GetName]，该岛需要确定自己的未来的站位。"
 RICE_sardinia_decide_sardinia_orientation_desc:0 "从古至今，[GetGeographicalRegion('RICE_sardinia_region').GetName]夹杂在西方拉丁世界与东方希腊世界之间，左右逢源，#italic 裁判官#!作为地中海中心的边缘地带决策者，应该绝对我们彻底倒向哪边了……"
 RICE_sardinia_decide_sardinia_orientation_confirm:0 "命运在等待着撒丁岛！"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.catholic.1:0 "所以具有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]都会自动转为#bold $heritage_latin_name$#![heritage|E]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.catholic.2:0 "在[GetGeographicalRegion('RICE_sardinia_region').GetName]中的[rulers|E]会解锁#bold $RICE_sardinia_catholic_decision$#![decision|E]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.orthodox.1:0 "所以具有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]都会自动转为#bold $heritage_byzantine_name$#![heritage|E]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.orthodox.2:0 "在[GetGeographicalRegion('RICE_sardinia_region').GetName]中的[rulers|E]会解锁#bold $RICE_sardinia_orthodox_decision$#![decision|E]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.north_african.1:0 "所以具有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]都会自动转为#bold $heritage_berber_name$#![heritage|E]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.north_african.2:0 "在[GetGeographicalRegion('RICE_sardinia_region').GetName]中的[rulers|E]会解锁#bold $RICE_sardinia_north_african_decision$#![decision|E]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.none.1:0 "所有具有$tradition_RICE_judicati_name$[tradition|E]的[cultures|E]都可以根据自己的需要更变为#bold $heritage_latin_name$#!、#bold $heritage_byzantine_name$#!或#bold $heritage_berber_name$#![heritage|E]其中之一"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.none.2:0 "在[GetGeographicalRegion('RICE_sardinia_region').GetName]中的[rulers|E]会解锁#bold $RICE_sardinia_none_decision$#![decision|E]"
 RICE_sardinia_decide_sardinia_orientation_context_tooltip:0 "#emphasis 历史背景：#!虽然撒丁岛如今是意大利的一部分，但在古代和中世纪，它与地中海的许多其他地区都有联系。几个世纪以来，撒丁岛轮流受到布匿人、希腊人、罗马人、汪达尔人、拜占庭人、阿拉伯人、柏柏尔人、意大利人和伊比利亚人的影响，或与这些社会发生过互动。"
 CHOOSE_SARDINIA_ORIENTATION:0 "$RICE_sardinia_decide_sardinia_orientation_confirm$"
 choose_catholic_name: "西方拉丁"
 choose_catholic_desc: "$choose_catholic_name$"
 choose_catholic_tooltip: "[GetTitleByKey('b_roma').GetNameNoTier]比[GetTitleByKey('b_constantinople').GetNameNoTier]更接近[GetGeographicalRegion('RICE_sardinia_region').GetName]，而且后者长期以来一直忽视该地区。我们可以通过支持[GetFaithByKey('catholic').GetAdjective]在岛上传播影响力，改善与西方拉丁世界的关系，并为未来找到新的希望。"
 choose_orthodox_name: "东方希腊"
 choose_orthodox_desc: "$choose_orthodox_name$"
 choose_orthodox_tooltip: "在[GetReligionByKey('islam_religion').GetName]失去北非后，[GetGeographicalRegion('RICE_sardinia_region').GetName]成为了一个[GetTitleByKey('e_byzantium').GetNameNoTier]的重要前哨站，尽管[GetTitleByKey('b_constantinople').GetNameNoTier]与这座岛屿在物理上的距离无法弥补，但是我们必须持续加强与东方希腊的联系，已维持这片地区的繁荣。"
 choose_north_african_name: "北非世界"
 choose_north_african_desc: "$choose_north_african_name$"
 choose_north_african_tooltip: "尽管我们一直遭受来自[GetGeographicalRegion('world_africa_north').GetName]的袭击，然而他们和[GetTitleByKey('b_roma').GetNameNoTier]以及[GetTitleByKey('b_constantinople').GetNameNoTier]那些阴险狡诈、自吹自擂的领主相比，又有多大的区别？多年来，我们与非洲的经济、文化和政治联系日益密切，我们应该求同存异、互通有无而不是互为仇寇。"
 choose_none_name: "独立自主"
 choose_none_desc: "$choose_none_name$"
 choose_none_tooltip: "当[GetTitleByKey('e_byzantium').GetNameNoTier]撤退回他们温暖的老家，回到君士坦丁堡时，他们把[GetGeographicalRegion('RICE_sardinia_region').GetName]丢给了狼群，如今我们四周强敌环伺，既不能信任[GetTitleByKey('k_papal_state').GetDefinitiveName]和它贪婪的走狗，也不能投靠[GetGeographicalRegion('world_africa_north').GetName]贪婪残暴的军阀。我们必须重新定位这个岛屿，走向一条全新的道路。"
 RICE_sardinia_inaugurate_major_palio:0 "举办一场大型帕里奥"
 RICE_sardinia_inaugurate_major_palio_tooltip:0 "让我们在这片土地上树立一个伟大的传统！"
 RICE_sardinia_inaugurate_major_palio_desc:0 "在[GetPlayer.GetCulture.GetName]的每个市中心，举办[palio_races|E]在风俗已经成为一项风尚。[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetName]应当举办一场一年一度的热闹非凡，光彩夺目，宏伟壮观的[palio|E]，这将在未来成为整个地区[palios|E]的典范。"
 RICE_sardinia_inaugurate_major_palio_confirm:0 "让我们开始吧！"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_1:0 "在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]未来举行的[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName][activities|E]，如果是#V 宗教#![activity_option|E]，那么[host|E]和参与者将会获得#P +50%#!的基础[prestige_i|E][prestige|E]和[piety_i|E][piety|E]加成。"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_2:0 "在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]未来举行的[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName][activities|E]，如果是#V 民政#![activity_option|E]，则[host|E]和参与者将会获得#P +50%#!的基础[prestige_i|E][prestige|E]和[piety_i|E][piety|E]加成。"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_3:0 "在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]未来举行的[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName][activities|E]，如果是#V 宗族#![activity_option|E]，则[host|E]和参与者将会会获得#P +50%#!的基础[prestige_i|E][prestige|E]和[piety_i|E][piety|E]加成。"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_4:0 "@warning_icon!#X 每个[de_jure|E][duchy|E]只能举行#V 一场#!大型帕里奥！#!"
