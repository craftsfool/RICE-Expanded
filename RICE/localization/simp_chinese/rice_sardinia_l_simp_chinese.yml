 RICE_sardinia_palio_race_civic_province_desc:0 "\n#P ++在此[county|E]有著名的[palio_race|E]传统。#!\n\n#italic 如果举行#V 有关民俗#!的[palio|E]，这将比其他潜在地点获得更多奖励。#!"
 RICE_sardinia_palio_race_dynastic_province_desc:0 "\n#P ++在此[county|E]有著名的[palio_race|E]传统。#!\n\n#italic 如果举行#V 有关家族#!的[palio|E]，这将比其他潜在地点获得更多奖励。#!"
 RICE_sardinia_palio_race_religious_modifier:0 "宗教类帕里奥传统"
 RICE_sardinia_palio_race_religious_modifier_desc:0 "该地区有一个著名的赛马节，常常纪念当地的圣人。这一传统活动吸引了远近各地的观众，提高了当地的知名度，尤其是在宗教层面。\n\n#EMP 当在此[county|E]举行[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]时，如果选择#bold 宗教类#![activity_option|E]，[host|E]和参加者将追加获得#P +50%#!的基础[prestige_i|E][prestige|E]和[piety_i|E][piety|E]。#!"
 RICE_sardinia_palio_race_civic_modifier:0 "民俗类帕里奥传统"
 RICE_sardinia_palio_race_civic_modifier_desc:0 "该地区有一个著名的赛马节，常常庆祝传统。这一传统活动吸引了远近各地的观众，提高了当地的知名度，并以其社交而闻名。\n\n#EMP 当在此[county|E]举行[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]时，如果选择#bold 民俗类#![activity_option|E]，[host|E]和参加者将追加获得#P +50%#!的基础[prestige_i|E][prestige|E]和[piety_i|E][piety|E]。#!"
 RICE_sardinia_palio_race_dynastic_modifier:0 "王朝兴衰类帕里奥传统"
 RICE_sardinia_palio_race_dynastic_modifier_desc:0 "该地区有一个著名的赛马节，常常过去统治者的统治。这一传统活动吸引了远近各地的观众，提高了当地的知名度以及对其历史和神话的了解。\n\n#EMP 当在此[county|E]举行[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]时，如果选择#bold 王朝兴衰类#![activity_option|E]，[host|E]和参加者将追加获得#P +50%#!的基础[prestige_i|E][prestige|E]和[piety_i|E][piety|E]。#!"
 RICE_sardinia_north_african_settlement_modifier:0 "撒丁尼亚"
 RICE_sardinia_north_african_settlement_modifier_desc:0 "北非地区有一个由撒丁岛基督教移民建立的小镇，以其故乡的名字命名为“撒丁尼亚”。该镇以水果闻名，尽管存在文化或宗教差异，但与当地领主结成了牢固的联盟。\n\n#EMP 撒丁岛基督教[courtiers|E]有很小的概率在拥有该[county|E]或靠近这个[county|E]的[rulers|E][court|E]中出现。#!"
 RICE_is_ali_ibn_mujahid:0 "穆贾希德之子"
 RICE_is_ali_ibn_mujahid_desc:0 "公元1015年，阿里的父亲穆贾希德入侵撒丁岛。比萨人和热那亚人击败了他，并俘虏了年幼的阿里，将他带到神圣罗马帝国皇帝的宫廷，在那里他接受了基督教教育。博学而正直的阿里重新皈依了伊斯兰教，但仍然同情基督徒。\n\n以[GetTitleByKey('d_sardinia').GetNameNoTier]及其[counties|E]上的[unpressed_claim|E]开局"
 RICE_sardinia_malaria_modifier:0 "撒丁岛疟疾疫情"
 RICE_sardinia_malaria_modifier_desc:0 "自古以来，撒丁岛就是疟疾温床。目前该地区正在爆发这种疾病。"
 RICE_sardinia_latin_monks:0 "撒丁岛拉丁修士"
 RICE_sardinia_opinion_pope_catholic_decision:0 "撒丁岛上受支持的天主教堂"
 RICE_sardinia_byzantine_administration:0 "撒丁岛上复兴的拜占庭行政机构"
 RICE_sardinia_opinion_roman_emperor_decision:0 "复兴撒丁岛行政管理"
 RICE_sardinia_north_african_networks:0 "在撒丁岛拓展北非网络"
 RICE_sardinia_north_african_option_piracy:0 "撒丁岛海盗活动增加"
 RICE_sardinia_north_african_option_piracy_desc:0 "撒丁岛连接着北非和西欧，其经济重要性引起了地中海两岸海盗的注意。小型海盗藏身处散布在这一地区，掠夺当地居民和过往商船。"
 RICE_sardinia_none_fortifications:0 "撒丁岛要塞"
 RICE_sardinia_north_african_decision_opinion_lesser:0 "撒丁岛与北非的弱联系"
 RICE_sardinia_north_african_decision_opinion_greater:0 "撒丁岛与北非的强联系"
 RICE_sardinia_cagliari_salt_modifier:0 "卡利亚里盐田"
 RICE_sardinia_cagliari_salt_modifier_desc:0 "撒丁岛卡利亚里附近有许多盐田。这些盐田自罗马时代起就开始开采，并为当地领主带来丰厚的利润。"
