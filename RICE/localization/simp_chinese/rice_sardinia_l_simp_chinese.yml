 RICE_sardinia_palio_victory_minor_desc:0 "该[house|E]最近赢得了当地的[palio_race|E]比赛。作为胜利的奖励，他们赢得了一面标准的[palio|E]横幅。"
 RICE_sardinia_palio_victory_major:0 "帕里奥大横幅"
 RICE_sardinia_palio_victory_major_desc:0 "该[house|E]最近赢得了当地的[palio_race|E]比赛。作为胜利的奖励，他们赢得了一面精美的[palio|E]横幅。"
 RICE_sardinia_palio_victory_great:0 "帕里奥巨大横幅"
 RICE_sardinia_palio_victory_great_desc:0 "该[house|E]最近赢得了当地的[palio_race|E]比赛。作为胜利的奖励，他们赢得了一面巨大且精美的[palio|E]横幅。"
 RICE_sardinia_mercato_trinkets:0 "来自市集的小饰品"
 RICE_sardinia_mercato_trinkets_desc:0 "该角色最近在[palio_race|E]之后举办的公共市场上购买了许多珠宝等奢侈品。"
 RICE_sardinia_palio_modifier_gold_small:0 "小型帕里奥"
 RICE_sardinia_palio_modifier_gold_small_desc:0 "最近这里举行了一场地方赛马节。参赛马匹之间的激烈角逐、奖品，以及其他各种有趣的活动，使这次比赛成为一次值得纪念的盛会，从而激励了当地人。"
