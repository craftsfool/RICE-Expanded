 RICE_capital_coastal_county:0 "你的首都是沿海[county|E]"
 RICE_sardinia_condaghe_artifact_name:0 "[condaghe_person.GetTitledFirstNameNoTooltip]行政文书"
 RICE_sardinia_condaghe_artifact_desc:0 "这份#italic 行政文书#!是根据[condaghe_person.GetTitledFirstName]的要求，为[condaghe_person.GetHerHis]家族（[condaghe_person.GetDynasty.GetName][dynasty|E]）所书写。与其他撒丁岛的#italic 行政文书#!一样，上面写满其家族与教会和财产有关的各种财务和法律行为。"
 building_type_RICE_sardinia_su_nuraxi:0 "苏·努拉西石垒"
 building_type_RICE_sardinia_su_nuraxi_desc:0 "在撒丁岛上，可以找到许多#italic 石塔状建筑物遗址#!。其中苏·努拉西石垒可能是最令人印象深刻的一个。不管最初的建造者是谁，如今早化为尘土，但他们建造的建筑仍偶尔被人使用，无论是作为住所还是建筑材料。"
 building_RICE_sardinia_su_nuraxi:0 "$building_type_RICE_sardinia_su_nuraxi$"
 building_RICE_sardinia_su_nuraxi_desc:0 "$building_type_RICE_sardinia_su_nuraxi_desc$"
 game_concept_palio_races:0 "帕里奥赛马节"
 game_concept_palio_race:0 "帕里奥赛马节"
 game_concept_palios:0 "帕里奥"
 game_concept_palio:0 "帕里奥"
 game_concept_palio_desc:0 "$game_concept_palio$是指在意大利地区流行的一种赛马。解锁$innovation_RICE_palio_races$[innovation|E]的文化可举办[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName][activity|E]。该活动对参与者们来说，是一个获取[prestige_i|E][prestige|E]，[piety_i|E][piety|E]，和[dynasty_prestige_i|E][dynasty_prestige|E]的大好机会。此外，该[activity|E]还会给予举办者一项[county_modifier|E]。\n\n帕里奥有三种不同的类型，分别提供不同奖励：宗教类、民俗类和王朝兴衰类。更具野心的[rulers|E]可以采用[decision|E]来$RICE_sardinia_inaugurate_major_palio$。这会让你的首都获得一个[county_modifier|E]，并提高自帕里奥上获得的收益，不过该修正每个[duchy|E]仅能拥有一个。\n\n在帕里奥赛马节[activity|E]中，举办者和来参加的各家族[house_heads|E]均可以选择赞助一位骑手和一匹马参赛，以期赢得那象征着荣耀的#bold 帕里奥大旗#!。[rulers|E]可以采用[decision|E]来$RICE_sardinia_invest_in_palio_horses$，借此提高他们获胜的几率。"
 activity_RICE_sardinia_palio_race:0 "帕里奥赛马节"
 activity_RICE_sardinia_palio_race_desc:0 "让我们在城里举行一场盛大的[palio_race|E]吧。这些惊心动魄的赛马赛可以作为重大宗教节日或世俗场合的核心活动。"
 activity_RICE_sardinia_palio_race_selection_tooltip: "在[domain|E]中主持一场[palio_race|E]\n\n$activity_RICE_sardinia_palio_race_context_tooltip$"
 activity_RICE_sardinia_palio_race_context_tooltip:0 "#emphasis 历史背景：#!帕里奥和撒丁岛的萨萨蒂利亚节等类似习俗是意大利的一种赛马。有关帕里奥的最早记录可追溯到中世纪，不过它们的前身可能是罗马时代。在中世纪和文艺复兴时期，赛马是重要的宗教和民间活动，通常与圣徒的节日有关。现存最古老、最著名的赛马会是锡耶纳的赛马节，其现代形式可追溯到公元1633年。不过早在1239年的一份文件中就有记载，其中详细讨论了帕里奥的规则，这表明在此之前，帕里奥已经存在多年。"
 activity_RICE_sardinia_palio_race_host_desc: "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]及[piety_i|E][piety|E]，并根据你的[intent|E]和[activity_options|E]，有可能获得[dynasty_prestige_i|E][dynasty_prestige|E]\n$BULLET_WITH_TAB$[activity|E][location|E]的[county|E]获得#P 正面#![county_modifier|E]\n$BULLET_WITH_TAB$增加其他参与者的[opinion|E]\n$BULLET_WITH_TAB$参加并赢得[palio_race|E]可获得更多奖励"
 activity_RICE_sardinia_palio_race_guest_desc: "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]及[piety_i|E][piety|E]，取决于你的[intent|E]和主办方选择的[activity_options|E]\n$BULLET_WITH_TAB$如果你是[house_head|E]，参加并赢得[palio_race|E]比赛会获得更多奖励"
 activity_RICE_sardinia_palio_race_province_desc: ""
 activity_RICE_sardinia_palio_race_destination_selection: "$activity_RICE_sardinia_palio_race_province_desc$"
 activity_RICE_sardinia_palio_race_guest_help_text: "$activity_RICE_sardinia_palio_race$"
 activity_RICE_sardinia_palio_race_predicted_cost: "这次参与费用根据你的[income|E]和选择的[activity_options|E]而定。"
 activity_RICE_sardinia_palio_race_conclusion_desc: "[GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]已结束，真是一场扣人心弦的盛会！"
 RICE_sardinia_palio_race_religious: "虔诚"
 RICE_sardinia_palio_race_religious_desc: "$EFFECT_LIST_BULLET$[palio|E]将为纪念当地的圣人或宗教人物而举行\n$EFFECT_LIST_BULLET$与其他选项相比，额外获得#P +25%#!的[piety_i][piety|E]\n$EFFECT_LIST_BULLET$举行[palio|E]的[county|E]更可能获得增加[gold_i|E][tax|E]的[county_modifier|E]\n$EFFECT_LIST_BULLET$如果[activity|E][location|E]的[county|E]有[GetModifier('RICE_sardinia_palio_race_religious_modifier').GetNameWithTooltip][county_modifier|E]，将额外获得#P +50%#!的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]奖励\n\n#weak 如此神圣的节日理应齐聚一堂观看赛马！#!"
 RICE_sardinia_palio_race_civic: "团结"
 RICE_sardinia_palio_race_civic_desc: "$EFFECT_LIST_BULLET$[palio|E]将为纪念该地区历史上的一个重大事件而举行\n$EFFECT_LIST_BULLET$与其他选项相比，额外获得#P +25%#!的[prestige_i][prestige|E]\n$EFFECT_LIST_BULLET$举行[palio|E]的[county|E]更可能获得增加[development_i|E][development|E]的[county_modifier|E]\n$EFFECT_LIST_BULLET$如果[activity|E][location|E]的[county|E]有[GetModifier('RICE_sardinia_palio_race_civic_modifier').GetNameWithTooltip][county_modifier|E]，将额外获得#P +50%#!的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]奖励\n\n#weak 让我们齐聚一堂观看赛马！庆贺我们历史上的成就！#!"
 RICE_sardinia_palio_race_dynastic: "威望"
 RICE_sardinia_palio_race_dynastic_desc: "$EFFECT_LIST_BULLET$[palio|E]将庆祝[GetPlayer.GetDynastyNameNoTooltip]家族对该地区的统治\n$EFFECT_LIST_BULLET$与其他选项相比，额外获得#P +25%#!的[dynasty_prestige_i|E][dynasty_prestige|E]\n$EFFECT_LIST_BULLET$举行[palio|E]的[county|E]更可能获得降低[building|E]成本的[county_modifier|E]\n$EFFECT_LIST_BULLET$如果[activity|E][location|E]的[county|E]有[GetModifier('RICE_sardinia_palio_race_dynastic_modifier').GetNameWithTooltip][county_modifier|E]，将额外获得#P +50%#!的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]奖励\n\n#weak 让我们通过这次赛马来提高家族威望，向大家展示我们在这里建设了多么伟大的成就！#!"
 RICE_sardinia_palio_race_banner_type: "帕里奥横幅"
 RICE_sardinia_palio_race_banner_small: "中幅"
 RICE_sardinia_palio_race_banner_small_desc: "$EFFECT_LIST_BULLET$[palio|E]后获得额外#V 100#!的基础[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$无法提升[palio|E][county_modifiers|E]\n$EFFECT_LIST_BULLET$如果一个有土地的[house|E]赢得[palio|E]，则会获得[GetModifier('RICE_sardinia_palio_victory_minor').GetNameWithTooltip][modifier|E]，且其宗族获得[dynasty_prestige_i|E]#V [EmptyScope.ScriptValue('RICE_sardinia_palio_horse_race_dynasty_prestige_victory_small')]#![dynasty_prestige|E]\n\n#weak 赞助工匠做一个不大不小的横幅足以庆贺。#!"
 RICE_sardinia_palio_race_banner_medium: "大幅"
 RICE_sardinia_palio_race_banner_medium_desc: "$EFFECT_LIST_BULLET$[palio|E]后获得额外#V 200#!的基础[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$有概率获得更好的[palio|E][county_modifiers|E]\n$EFFECT_LIST_BULLET$如果一个有土地的[house|E]赢得[palio|E]，则会获得[GetModifier('RICE_sardinia_palio_victory_minor').GetNameWithTooltip][modifier|E]，且其宗族获得[dynasty_prestige_i|E]#V [EmptyScope.ScriptValue('RICE_sardinia_palio_horse_race_dynasty_prestige_victory_medium')]#![dynasty_prestige|E]\n\n#weak 赞助工匠做一个大横幅能够很好地反映我们的荣耀。#!"
 RICE_sardinia_palio_race_banner_large: "巨幅"
 RICE_sardinia_palio_race_banner_large_desc: "$EFFECT_LIST_BULLET$[palio|E]后获得额外#V 300#!的基础[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$大概率获得更好的[palio|E][county_modifiers|E]\n$EFFECT_LIST_BULLET$如果一个有土地的[house|E]赢得[palio|E]，则会获得[GetModifier('RICE_sardinia_palio_victory_minor').GetNameWithTooltip][modifier|E]，且其宗族获得[dynasty_prestige_i|E]#V [EmptyScope.ScriptValue('RICE_sardinia_palio_horse_race_dynasty_prestige_victory_large')]#![dynasty_prestige|E]\n\n#weak 不惜一切代价委托的工匠将制作一面宏伟的旗帜，激励人们赢得赛马节。#!"
 RICE_sardinia_palio_race_charity_type: "慈善捐赠"
 RICE_sardinia_palio_race_charity_small: "义务"
 RICE_sardinia_palio_race_charity_small_desc: "$EFFECT_LIST_BULLET$[palio|E]后获得额外#V 100#!的基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$参加此[activity|E]的每个[character|E]不会获得额外的[opinion|E]\n\n#weak 我们将在这次活动中向穷人、需要帮助的人和妇女提供义务捐赠#!"
 RICE_sardinia_palio_race_charity_medium: "慷慨"
 RICE_sardinia_palio_race_charity_medium_desc: "$EFFECT_LIST_BULLET$[palio|E]后获得额外#V 200#!的基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$参加此[activity|E]的每个[character|E]额外获得#P 10#![opinion|E]\n\n#weak 在此期间，我们将竭尽全力为穷人、有需要的人和妇女提供捐赠。#!"
 RICE_sardinia_palio_race_charity_large: "十分慷慨"
 RICE_sardinia_palio_race_charity_large_desc: "$EFFECT_LIST_BULLET$[palio|E]后获得额外#V 300#!的基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$参加此[activity|E]的每个[character|E]额外获得#P 20#![opinion|E]\n\n#weak 这是社会各界欢聚的时刻！我们必须在这一时刻向穷人、贫困者和妇女广泛捐赠。#!"
 RICE_sardinia_palio_race_preparations_type: "比赛准备"
 RICE_sardinia_palio_race_preparations_none: "不参与"
 RICE_sardinia_palio_race_preparations_none_desc: "$EFFECT_LIST_BULLET$你的[house|E]不会赞助任何骑师参加[palio_race|E]\n$EFFECT_LIST_BULLET$你将#N 放弃参加#![palio_race|E]\n\n#weak 参加比赛费用高昂，资金最好首先用于组织活动。#!"
 RICE_sardinia_palio_race_preparations_basic: "基本"
 RICE_sardinia_palio_race_preparations_basic_desc: "$EFFECT_LIST_BULLET$你的[house|E]将默认有机会赢得[palio_race|E]\n$EFFECT_LIST_BULLET$[house|E]内有人采取#V $RICE_sardinia_invest_in_palio_horses$#![decision|E]就会增加概率\n\n#weak 我们的骑师和马匹应做好准备工作！#!"
 RICE_sardinia_palio_race_preparations_extensive: "大力支持"
 RICE_sardinia_palio_race_preparations_extensive_desc: "$EFFECT_LIST_BULLET$你的[house|E]将#P 更大#!概率赢得[palio_race|E]\n$EFFECT_LIST_BULLET$[house|E]内有人采取#V $RICE_sardinia_invest_in_palio_horses$#![decision|E]就会增加概率\n\n#weak 如果我们要赢得这项赛事，就必须竭尽全力，确保骑师和马匹取得胜利！#!"
 RICE_sardinia_palio_race_palio_phase: "帕里奥"
 RICE_sardinia_palio_race_palio_phase_desc: "一场激动人心的赛马比赛，让所有人拭目以待！"
