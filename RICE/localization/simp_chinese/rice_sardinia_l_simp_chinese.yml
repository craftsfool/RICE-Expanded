 sardinia.0050.t:0 "一种非常危险，特殊的奶酪"
 sardinia.0050.desc:0 "现在，我正在#italic 因斯帕题诺#!上，这是[ROOT.Char.GetCulture.GetName]传统中的一种小型宴会。人民通过这种方式来加强联系，回报别人过去的帮助。这次的宴会是为了纪念我帮助当地知名人士[ROOT.Char.GetTitleAsNameNoTooltip]而举办的。\n\n这里的食物很美味，餐点都具有[ROOT.Char.GetCulture.GetNameNoTooltip]乡村的风味。肉食和面食经过各种各样的烘烤、煮和炖，最终呈现到餐桌上。这场盛宴的亮点是#italic 卡苏马苏乳酪#!——一种带有活蛆的腐烂羊奶酪。\n\n外国人可能会觉得这种奶酪令人厌恶，或者对这一餐点冷嘲热讽，但是我们当地人对它有着更深的“体会”。这真的很好吃！说起来，在吃之前把奶酪放在袋子里让蠕动的幼虫窒息并不丢脸，尽管其他人更喜欢活着吃。"
 sardinia.0050.a:0 "我不是胆小鬼，我要吃奶酪！"
 sardinia.0050.b:0 "我先把奶酪放进袋子里。"
 sardinia.0050.c:0 "转念一想，外国人说的也有一定道理……"
 sardinia.0050.info:0 "#emphasis 历史背景：#!#italic 卡苏马苏乳酪#!可以说是撒丁岛传统菜肴中最臭名昭著的一道菜。因为奶酪中的蛆可能会引起消化道的寄生虫感染，所以意大利禁止出售这种奶酪，但是它仍然被大规模生产和消费。\n\n可以说，食用蛆虫并不是撒丁岛菜肴独有的传统。现在已经有证据表明，在古代，蛆虫被作为一种食物的来源。例如，罗马作家老普林尼曾提到，在他那个时代，蛆被视为一种奢侈的食物。因此，#italic 卡苏马苏乳酪#!可能有着比人们想象的更为古老的历史。"
 sardinia.0050.bad.toast:0 "你的胃在发生诡异的蠕动"
 sardinia.0051.t:0 "喜达思"
 sardinia.0051.desc:0 "当访问[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]下面一个[culture.GetName]村庄时，当地人向我呈上了#italic 喜达思#!，一种传统的[culture.GetNameNoTooltip]甜点。它是用羊乳干酪、柠檬和橙汁、果皮、猪油和蜂蜜、糖和盐混合之后炸制而成的。尽管它是平民的食物，但却是一道美味佳肴。"
 sardinia.0051.a:0 "香甜可口的糖油混合物！"
 sardinia.0052.t:0 "神秘的努拉盖"
 sardinia.0052.desc:0 "#italic 努拉盖#!是[GetGeographicalRegion('RICE_sardinia_region').GetName]地区随处可见的奇妙景观。这些巨石建筑可以说是随处可见。\n\n然而，没有人真正知道它们来自哪里。我一直在和我的一些廷臣们讨论这个话题，他们都提出了不同的理论。"
 sardinia.0052.a:0 "显然是一群灭绝已久的巨人建造了它们！"
 sardinia.0052.b:0 "这些建筑物一定是古代统治者的城堡。"
 sardinia.0052.c:0 "它们一定是远古时期的[ROOT.Char.GetFaith.GetAdjectiveNoTooltip][ROOT.Char.GetFaith.HouseOfWorshipPlural]"
 sardinia.0052.d:0 "说实话，我不知道它们是什么，我也不在乎。"
 sardinia.0052.info:0 "#emphasis 历史背景：#!努拉盖是一种古老的巨石结构，遍布撒丁岛。它们主要建于岛上的青铜时代和铁器时代。它们的一般功能是不确定的，可能有不同的努拉盖，如统治者的宫殿，堡垒，普通的房屋，礼拜场所，等等。\n\n尽管显赫一时的努拉吉文明被布匿人、希腊人和罗马人的统治所取代，但是他们的文化元素在之后仍然存在。直到中世纪时期，人们仍然偶尔会重新使用这些石头，将它们用于建筑工程，或者作为教堂等新建筑的基础，或者用它们作为庇护所。"
 sardinia.0053.t:0 "一个不祥的预兆"
 sardinia.0053.desc:0 "在[ROOT.Char.GetCulture.GetName]民间传说中，有些人被认为是#italic 睹魂者#!传说中他们可以看到死者。确切地说，他们可以看到所谓的希罗底之主，一只在月下或者在午夜前进的死者游行队伍。\n\n我们收到了与此相关的令人震惊的消息。一个当地的#italic 睹魂者#!群体声称在乡下旅行时，他们看到了[doomed.GetTitledFirstName]在一只游行队伍中。这通常被认为是一种噩兆，据说像这样在游行队伍中被看到的活人，无论是谁都会在一年内死去。"
 sardinia.0053.a:0 "[doomed.GetFirstNameNoTooltip]，你向[ROOT.Char.GetFaith.HighGodName]祈祷吧！"
 sardinia.0053.a.tooltip:0 "如果[doomed.GetFirstNameNoTooltip]祈祷得足够虔诚，可能[GetPlayer.GetFaith.HighGodName]会拯救[doomed.GetHerHim]免于[ROOT.Char.GetFaith.DeathDeityName]的伤害。"
 sardinia.0053.b:0 "这些#italic 睹魂者#!是愚蠢的，这只是迷信而已。"
 sardinia.0053.b.tooltip:0 "[doomed.GetFirstNameNoTooltip]没什么好怕的！当然，那些#italic 睹魂者#!们看到了什么东西，当然不会有什么坏事发生，当然。"
 sardinia.0053.info:0 "#emphasis 历史背景：#!在撒丁岛的民间传说中，#italic 睹魂者#!是那些据说有能力看到死者游行队伍的人。这支队伍被称为#italic 长途列车#!，#italic 死者之主#!，或者在撒丁岛东北部的加卢拉被称为#italic 希罗底之主#!后者的名字可能与希罗底的基督教传说有关，希罗底是犹太的一位公主，据说她是处决圣施洗约翰的罪魁祸首。"
 sardinia.0054.t:0 "预兆成真"
 sardinia.0054.desc:0 "看起来，似乎有什么事情发生了。\n\n那些#italic 睹魂者#!最终被证明是对的，我刚刚收到消息，[doomed.GetTitledFirstName]与昨晚突发恶疾过世了。"
 sardinia.0054.a:0 "真令人不安。"
 sardinia.0055.t:0 "正义阿拉蒂娅"
 sardinia.0055.desc:0 "[dreamer.GetTitledFirstName]说正义阿拉蒂娅于昨晚在她的梦中显灵了。\n\n在[ROOT.Char.GetCulture.GetName]故事中，她是#italic 善良的精灵#!们的领袖，他们居住在遍布岛上的洞穴和石碑里。她与她的邪恶对手恶魔阿拉蒂娅互相对立。\n\n在传说中，#italic 善良的精灵#!奖励努力进行纺织工作的妇女，惩罚那些懒惰的妇女。这样的故事鼓励女性们更加努力地工作。不过，[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]说这些都是迷信。\n\n不管如何，[dreamer.GetFirstNameNoTooltip]声称[dreamer.GetSheHe]做的关于阿拉蒂娅的梦是……"
 sardinia.0055.desc.bad:0 "一场噩梦"
 sardinia.0055.desc.good:0 "一个好梦"
 sardinia.0055.a:0 "我相信阿拉蒂娅是出现来指点你的。"
 sardinia.0055.b:0 "听起来像是骗人的把戏。"
 sardinia.0055.info:0 "#emphasis 历史背景：#!阿拉蒂娅是撒丁岛神话中的一个人物，她在中世纪时期从意大利被带到这个岛上。\n\n阿拉蒂娅融合了古罗马女神戴安娜和希罗底王妃的元素，希罗底王妃被认为是处决圣施洗约翰的罪魁祸首。在到达中世纪的撒丁岛后，阿拉蒂娅分裂成两个不同的人物——一个是好的（正义阿拉蒂娅），一个是坏的（恶魔阿拉蒂娅）——但是教会当局不鼓励人们相信这样的故事。\n\n与一些人的说法相反，阿拉蒂娅不太可能是撒丁岛上某种古代异教存在的证据。相反，阿拉蒂娅的不断发掘展示了随着时间的推移，神话和传说发生的迷人演变，反映了基督教民间宗教的特殊情况。"
 sardinia.0056.t:0 "圣萨图尼努斯"
 sardinia.0056.desc:0 "我的[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]建议我更加虔诚地向卡利亚里的圣萨图尼努斯祷告。\n\n“他不仅仅是[GetTitleByKey('b_cagliari').GetNameNoTier]的赞助人，从某种意义上说还是整个[GetGeographicalRegion('RICE_sardinia_region').GetName]岛的守护者，”[chaplain.GetFirstNameNoTooltip]在我耳边强调，“他会保护您，让您在人间更好地践行[ROOT.Char.GetFaith.HighGodName]的意志，当地人民也会感激您的。”"
 sardinia.0056.a:0 "我可以在各处做一些私下里的祷告。"
 sardinia.0056.b:0 "公开向圣萨图尼努斯祈祷是好事。"
 sardinia.0056.info:0 "#emphasis 历史背景：#!根据传说，卡利亚里的萨图尼努斯在罗马皇帝戴克里先统治期间（284年‑305年）被罗马人杀害。他是撒丁岛的圣徒之一，一直受到当地人的崇敬。与之形成鲜明对比的是，中世纪时期，撒丁岛的圣徒更多地与希腊东正教会联系在一起，而在与西方天主教结盟后，名气有所下降。"
 sardinia.0057.t:0 "虚假的公章"
 sardinia.0057.desc:0 "在最近的案件中，一家属于一所[ROOT.Char.GetFaith.HouseOfWorship]的农奴宣称[ROOT.Char.GetFaith.HouseOfWorship]无权拥有他们，因为他们是自由的。而且他们居然拿出一封盖有我自己的#italic 公章（bullatoriu）#!的信来证明这事，毫无疑问这是伪造的。\n\n竟然拿一个#italic 裁判官#!来糊弄！我应该对这些自以为是且愚蠢的农民判刑！然而，我的一些廷臣认为这样的判罚有些苛刻了。为了弘扬[ROOT.Char.GetFaith.HighGodName]的荣光，我应当仁慈一些。"
 sardinia.0057.a:0 "原谅那些农奴，把他们送回[ROOT.Char.GetFaith.HouseOfWorship]。"
 sardinia.0057.b:0 "这会开创一个不好的先例，处决他们。"
 sardinia.0057.info:0 "#emphasis 历史背景：#!这一事件是基于撒丁岛阿波利亚裁判官领发生的一起真实事件。这起事件被记录在12世纪#italic 博纳尔卡多圣玛丽亚修道院的行政文书#!中。这份文件是阿波利亚地区少有且流传至今的#italic 行政文书#!，是研究中世纪撒丁地区历史的重要文献。\n\n这封#italic 行政文书#!记录了七个兄弟姐妹（农奴）声称他们实际上是自由人，修道院对他们没有所有权。\n\n这件事被提交到法庭，兄弟姐妹们提供了一封来自撒丁岛法官科米塔的信作为证据，信密封且加盖了公章（bullatoriu）。\n\n据#italic 行政文书#!记载，这封信很快被发现是伪造的，科米塔法官宣判了这七个人死刑。在临刑的前一刻，由于科米塔的母亲安娜的干预，这些农奴被从死刑中救了出来。安娜成功地说服科米塔放过他们来弘扬圣母玛利亚的荣光。农奴们最后被送回了修道院。"
 sardinia.0058.t:0 "真的还是假的？"
 sardinia.0058.desc:0 "在[ROOT.Char.GetCulture.GetCollectiveNoun]中，#italic 康达格#!是整理法律案件时的有效记录。当然，这意味着有时这些文件是伪造的。\n\n此时，我就因此陷入了两难的境地。一位贵族和一个当地的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitle')]正在为一个农奴的所有权而陷入争论。贵族出示了一封来自他父亲那个时期的#italic 康达格#!，声称这封文件为他的说法提供了依据。不幸的是，在这封#italic 康达格#!是签字的所有人都已经不在人世了。[ROOT.Char.Custom('DefaultPriestTitle')]就此认为，这封#italic 康达格#!是伪造的。\n\n随着审理的持续推进，现在是作为[ROOT.Char.GetTitleAsNameNoTooltip]的我做出决定的时候了。我的目光扫过#italic 康达格#!，最终决定……"
 sardinia.0058.a:0 "这位贵族的#italic 康达格#!似乎是合法的。"
 sardinia.0058.b:0 "[ROOT.Char.Custom('DefaultPriestTitle')]是对的，没有在世的目击者这一现象很可疑。"
 sardinia.0058.info:0 "#emphasis 历史背景：#!这一事件是基于撒丁岛阿波利亚裁判官领发生的一起真实事件。这起事件被记录在12世纪#italic 博纳尔卡多圣玛丽亚修道院的康达格#!中。这份文件是阿波利亚地区少有的幸存的#italic 康达格#!，是研究中世纪撒丁地区历史的重要文献。\n\n178‑179号卡片记录了尼古拉的前任和戈坦·德·索戈斯之间的一场审判，他们为了一个仆人的所有权而争斗。在法庭上，戈坦出示了一份来自他父亲时期的#italic 康达格#!作为证据。可惜的是，当时在上面签字的目击者都已经过世了。\n\n因此，在场的人都认为这份#italic 康达格#!是伪造的。"
 sardinia.0059.t:0 "捐赠"
 sardinia.0059.desc:0 "我发现附近有一个[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]可以利用一些动物和仆人的捐赠。捐赠完成后，这些行为可以用[ROOT.Char.GetCulture.GetLanguage.GetName]语记录在#italic 康达格#!上。这样的话，全世界都会记住我的慷慨解囊，以及[ROOT.Char.GetHouse.GetName]家族对子孙后代们的乐善好施。"
 sardinia.0059.a:0 "准备进行捐赠吧！"
 sardinia.0059.b:0 "我负担不起这笔开支。"
 sardinia.0060.t:0 "“声名显赫”"
 sardinia.0060.desc:0 "今天，我将要在我的宫廷中接待来自远方的[ROOT.Char.GetCapitalLocation.GetName]，他会是我的一位重要贵宾。然而，他告诉我说，考虑到撒丁岛作为疾病和野蛮人聚集地的名声，他对这次来访持谨慎态度。这类谣言在外面的世界并不少见。"
 sardinia.0060.a:0 "如你所见，我们的岛屿很美丽。"
 sardinia.0060.b:0 "不，你怀着错误的偏见。"
 sardinia.0060.c:0 "是的，我们的岛屿#italic 是#!一个可怕的地方。"
 sardinia.0060.info:0 "#emphasis 历史背景：#!在古典和中世纪时期，撒丁岛由于疟疾流行而声名狼藉，岛上的居民（无论他们来自哪里）被刻板地认为是相当凶猛和顽固的，甚至有犯罪倾向。\n\n例如，比萨大主教弗雷德里克·维斯康蒂在1263年准备访问比萨岛时说：“在那片充满恐怖和孤独的土地上，人们去那里只是为了赚钱，我们该怎么办？”\n\n“撒丁岛病了，确实是疾病的化身，因为每个离开这个地方的人很快就会生病。”"
 sardinia.0061.t:0 "一个未来可期的努拉吉"
 sardinia.0061.desc:0 "我领地中的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]在[county.GetNameNoTier]发现了一个#italic 努拉吉#!。他们认为，这可以被改造作为附近宗教活动使用的小型神龛。他们希望我能提供资金把这里改造成一个合适的宗教场所。\n\n这些古老的石头纪念碑经常以这种方式被重新利用，无论是处于宗教原因还是商业原因，当地人经常在它们旁边汇集。把这样的地方变成本地的[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]场所是一个明智的行为。"
 sardinia.0061.a:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')]将获得这项工作所需的资金。"
 sardinia.0061.b:0 "我现在帮不了他们。"
 sardinia.0062.t:0 "[culture.GetNameNoTooltip]喉音唱法"
 sardinia.0062.desc:0 "今天，一些来自[county.GetNameNoTier]的[culture.GetName]平民来到了我的宫廷为我献艺。他们精擅#italic 男声四重唱牧歌#!，这是[GetGeographicalRegion('RICE_sardinia_region').GetName]一种古老而又独特的喉音唱法。\n\n在大部分的演出中，四位歌手围成一个圈站着，其中一个为主唱，负责唱诗，而其他三个歌手作为伴奏合唱。他们的歌声悦耳动听，曲目的题材也是包罗万象。\n\n在演出结束时，我按照预期的那样，为这些有才华的歌手发放奖励。"
 sardinia.0062.a:0 "感谢你们出色的表演。"
 sardinia.0062.b:0 "这样技艺高超的歌手应该得到的不仅仅是一份简单的礼物！"
 sardinia.0062.info:0 "#emphasis 历史背景：#!#italic Cantu a tenore#!也即#italic 男声四重唱牧歌#!，是撒丁岛特有的一种喉音唱法，在撒丁岛中部尤为流行，通常由四个男歌手组成的团体演唱。这一特殊的表演既可以在非正式场合表演，也可以在婚礼和宗教节日等正式集会上表演。"
 sardinia.0063.t:0 "牧羊人之路"
 sardinia.0063.desc:0 "牧羊人可以在整个[GetGeographicalRegion('RICE_sardinia_region').GetName]找到。最近，我花时间去探索散布在[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]各地蜿蜒穿过崎岖的山脉、峡谷、河流的所谓的牧羊人之路。\n\n这是一次轻松的旅行，了解附近的地形，让我的官员和士兵在周边地区可以自由穿行十分重要。"
 sardinia.0063.a:0 "这些信息会派上用场的。"
 sardinia.0064.t:0 "贾亚拉马群"
 sardinia.0064.desc:0 "漫步在[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]的乡村，我们遇到了一小群#italic 贾亚拉#!马。只要时刻留心，就能在岛上找到这些小型野马的群落。它们无拘无束地在岛上崎岖不平的土地上随心所欲地奔驰，让欣赏它们的人也能体会到自由的美好。"
 sardinia.0064.a:0 "它们可能比较小，但仍然是一道壮丽的风景！"
 sardinia.0064.info:0 "#emphasis 历史背景：#!#italic 贾亚拉#!马是撒丁岛上常见的一种小型马。目前还不清楚它们是岛上土生土长的古老品种，还是后来由布匿人或罗马定居者引进撒丁岛的马的后代。无论哪种方式，几个世纪以来，野生#italic 贾亚拉#!马群遍布撒丁岛。然而，目前它们的数量已经削减到只剩几百只，它们囿居在撒丁岛南部的#italic 贾亚拉高原#!地区"
