 activity_RICE_siberia_reindeer_sacrifice:0 "驯鹿祭祀"
 activity_RICE_siberia_reindeer_sacrifice_desc:0 "我们可以在娴熟的巫师协助下，进行驯鹿献祭，以得到当地诸神或灵魂的建议。"
 activity_RICE_siberia_reindeer_sacrifice_selection_tooltip:0 "组织驯鹿祭祀活动\n\n$RICE_hold_reindeer_sacrifice_context_tooltip$"
 activity_RICE_siberia_reindeer_sacrifice_host_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得#P 正面#![character_modifiers|E]（取决于你的选择）"
 activity_RICE_siberia_reindeer_sacrifice_guest_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]"
