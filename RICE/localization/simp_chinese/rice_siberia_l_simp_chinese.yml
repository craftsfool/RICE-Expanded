 siberia.0004.desc.basic:0 "\n\n因此，[scope_RICE_siberian_learner.GetTitledFirstName]已经对这种传统知识有了基本的了解。"
 siberia.0004.desc.master:0 "\n\n因此，[scope_RICE_siberian_learner.GetTitledFirstName]现在对这些传统知识有了一定程度的掌握。"
