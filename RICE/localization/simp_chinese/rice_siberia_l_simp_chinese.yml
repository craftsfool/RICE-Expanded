 activity_RICE_siberia_reindeer_sacrifice_predicted_cost:0 "旅行的费用主要取决于你的[income|E]。"
 activity_RICE_siberia_reindeer_sacrifice_conclusion_desc:0 "[GetActivityType( 'activity_RICE_siberia_reindeer_sacrifice' ).GetName]已结束。人们只能希望[GetPlayer.GetFaith.HighGodName]对贡品感到满意！"
 RICE_siberia_reindeer_sacrifice_health:0 "健康"
 RICE_siberia_reindeer_sacrifice_health_desc:0 "$EFFECT_LIST_BULLET$你将向神灵寻求关于你自己、子民和土地上的驯鹿的健康建议。\n\n#weak 神灵是我们了解如何在困难时期也能保持自己和驯鹿群活力的窗口！#!"
 RICE_siberia_reindeer_sacrifice_realm:0 "领地"
 RICE_siberia_reindeer_sacrifice_realm_desc:0 "$EFFECT_LIST_BULLET$你将向神灵寻求关于领土丰收的建议。\n\n#weak 神灵与这些土地息息相关，正是祂们能指导我们充分利用资源，以确保我们的后代繁荣！#!"
 RICE_siberia_reindeer_sacrifice_spirits:0 "众灵"
 RICE_siberia_reindeer_sacrifice_spirits_desc:0 "$EFFECT_LIST_BULLET$你将向神灵寻求如何与祂们共处，共同发展的建议。\n\n#weak 众灵不是我们的敌人，至少祂们中的大多数不应该是，我们必须始终保持敬畏，确保我们不会互相侵犯#!！"
 RICE_siberia_reindeer_sacrifice_ritual_phase:0 "祭祀"
 RICE_siberia_reindeer_sacrifice_ritual_phase_desc:0 "新山药节是一个喜庆的时刻，但它也有重要的仪式和规则，我们都必须遵守。"
 RICE_siberia_reindeer_sacrifice_devotion_intent_header:0 "纪念："
 RICE_siberia_reindeer_sacrifice_devotion_intent:0 "纪念"
 RICE_siberia_reindeer_sacrifice_devotion_intent_desc:0 "我们希望通过这一献祭来纪念[GetPlayer.GetFaith.HighGodName]。"
