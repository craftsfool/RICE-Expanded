 siberia.0040.t:0 "长牙野兽的残骸"
 siberia.0040.desc:0 "该地区的猎人最近发现了一个长着獠牙的巨大生物的遗骸。西伯利亚人认为这些是巨大的、类似鼹鼠的动物的尸体，它们在试图钻到地表时死亡，而其他文化的人有时认为这些是原始巨兽的尸体。不管怎么说，由于这些遗体是在我的领土内发现的，由我来决定应该如何处理它们，特别是那些有利可图的獠牙。"
 siberia.0040.a:0 "把獠牙卖给任何路过的商人。"
 siberia.0040.b:0 "将獠牙卖给商人，以获得丰厚的利润。"
 siberia.0040.c:0 "保留獠牙以用于制作传统艺术品。"
 siberia.0040.d:0 "也许这些獠牙可以雕刻一个宝座给我？"
 siberia.0040.e:0 "我们可以尝试吃它的肉吗？我想知道它是什么味道的。"
 siberia.0040.e.good:0 "奇怪的肉味道不错"
 siberia.0040.e.bad:0 "奇怪的肉很难吃"
 siberia.0041.t:0 "库尔干"
 siberia.0041.desc:0 "该地区的当地人偶然发现了一个库尔干（构建于坟墓上的坟冢），坟墓是西伯利亚的一个不知名的古人。我们不知道这个墓穴是什么时候建造的，也没有人认识到用来装饰墓穴的艺术风格或其中的各种物品。[ROOT.Char.Custom('DefaultPriestTitlePlural')]说幸运的是盗墓者没有清空这个地方，我应该用[ROOT.Char.GetFaith.GetAdjective]的仪式来安抚亡灵，并且不打扰他们。"
 siberia.0041.a:0 "封锁该区域，并让[ROOT.Char.Custom('DefaultPriestTitlePlural')]为神灵祈祷。"
 siberia.0041.b:0 "我们的[ROOT.Char.Custom('DefaultPriestTitlePlural')]和学者们可以研究古墓"
 siberia.0041.c:0 "盗墓？不错的主意。让我们清空并卖掉这些遗物。"
 siberia.0041.d:0 "我们可以拿走一些这些陪葬品，把它们作为我的房屋装饰。"
 siberia.0042.t:0 "熊袭击"
 siberia.0042.desc:0 "尽管棕熊倾向于避免与人类发生冲突，但在西伯利亚地区，袭击事件偶尔会发生。不幸的是，最近在我居住的地方附近发生了一次这样的袭击，在这个过程中几个当地人被熊杀死了。"
 siberia.0042.a:0 "这很可悲，但我也无能为力。"
 siberia.0042.b:0 "帮助悲伤的家庭解决问题。"
 siberia.0043.t:0 "黄鼬毛皮"
 siberia.0043.desc:0 "黄鼬是居住在西伯利亚的小型食肉动物，一些当地的猎人给我带来了他们最近狩猎的黄鼬毛皮。虽然被认为比更有价值的动物物种的毛皮质量低，但它们聊胜于无，有时还被故意用来作为其他物种毛皮的替代品。捕捉和杀死黄鼬总是一个艰巨的过程，因为一旦被陷阱抓住，这些野兽往往会发出响亮的尖叫声，让人分心，并它还会分泌出一种刺鼻的气味，需要几个星期才能消失。因此猎人费了很大劲才把这些东西带到我身边。"
 siberia.0043.a:0 "谢谢你的礼物，我会好好利用它们"
 siberia.0043.b:0 "把皮毛卖了换钱，是个不错的生意。"
 siberia.0043.c:0 "我不需要这些礼物，麻烦你了！"
 siberia.0044.t:0 "鹿角冢"
 siberia.0044.desc:0 "今天在野外，我在一个小土丘上发现了似乎是鹿角的残骸，鹿角还没有一个孩子高。我很快意识到，这一定是埋葬某人的地方，因为在西伯利亚，把驯鹿角放在埋葬某人的地方上面，是古老的传统。我环顾四周，没有看到任何驯鹿皮或蹄子挂在树上，这也是这些地方的另一个传统殡葬习俗。我断定不管是谁被埋在这里，一定是很久以前就去世了。"
 siberia.0044.a:0 "为埋葬在这里的人祷告几句。"
 siberia.0044.b:0 "缅怀先人"
 siberia.0045.t:0 "冷冻饺子"
 siberia.0045.desc:0 "今天我在我的王国的寒冷荒野中外出旅行。当我和我的同伴们休息吃午饭时，我们拿出了我们的饺子袋，里面装满了肉末和蘑菇。这些饺子会被放在外面冷冻，保存起来，这样可以成为在西伯利亚针叶林区的寒冷地区进行长期旅行时携带的重要补给。现在我们把饺子放在一锅沸水中，等到它们煮完。"
 siberia.0045.a:0 "尽管很简单，但很美味。"
 siberia.0046.t:0 "刨冰鱼"
 siberia.0046.desc:0 "今天有客来访，我们一道享用了来自西伯利亚的传统佳肴——鱼刨。做法是将冻鱼肉刨成薄片，生吃，有条件的话佐以些许盐巴和胡椒，风味更佳。"
 siberia.0046.a:0 "它与酒的搭配也很好！"
 siberia.0047.t:0 "驯鹿石"
 siberia.0047.desc:0 "当地人最近在我的西伯利亚领土上找到了一块驯鹿石。这些大型花岗岩或绿石板，通常朝向东方，上面刻有各种图像，从人脸到鸟、老虎和几何图案，但最常见的是驯鹿的图案。许多人认为，这些石头曾经被许久以前居住在这里的人使用的。无论如何，如果我们愿意，我们可以重新使用这些古老的遗址，即使这些石头太大，通常无法移动。"
 siberia.0047.a:0 "别管这些石头了，最好不要打扰古人。"
 siberia.0047.b:0 "用它来埋葬当地著名人物。"
 siberia.0047.c:0 "维护一下它，以后用于祭祀和其他萨满教仪式。"
 siberia.0048.t:0 "西伯利亚动物脂肪"
 siberia.0048.desc:0 "我们最近得到了一群当地人赠送的驯鹿和麋鹿脂肪。在西伯利亚北部，它被认为是一种有价值的产品，可以用来烹饪各种食物。"
 siberia.0048.a:0 "听起来很美味。"
 siberia.0049.t:0 "草本茶"
 siberia.0049.desc:0 "在西伯利亚地区，人们习惯喝一种由柳兰制作的凉茶。据说它能帮助增强人的体质。最近，我就一直在喝这种凉茶。"
 siberia.0049.a:0 "希望这对我有好处。"
 siberia.0050.t:0 "白桦屑"
 siberia.0050.desc:0 "在西伯利亚部分地区，妇女经常会收集桦树树苗，并从中收集大量的桦树屑制成麻袋。这些桦树屑可以用来清洁人的手和其他表面，以保持卫生。我的女仆们最近获得了很多桦树屑。"
 siberia.0050.a:0 "听到这真是高兴。"
 siberia.0051.t:0 "驯鹿雪橇比赛"
 siberia.0051.desc:0 "由于西伯利亚人民世世代代都在饲养驯鹿，并用它们来拉雪橇，所以当地人之间经常会举行驯鹿雪橇比赛。今天附近的村庄正在举行这样的一场比赛，我有机会去看看。"
 siberia.0051.a:0 "现在，驯鹿雪橇比赛要开始了！"
 siberia.0051.b:0 "我今天宁愿宅在家里。"
