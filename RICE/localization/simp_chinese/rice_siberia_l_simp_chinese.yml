 building_type_RICE_siberia_orkhon_inscriptions:0 "鄂尔浑碑铭"
 building_type_RICE_siberia_orkhon_inscriptions_desc:0 "鄂尔浑碑铭是古突厥人在鄂尔浑河谷为纪念阙特勤和毗伽可汗而立，上面的碑文用古突厥语和汉语书写，讲述了突厥人的历史和歌颂古突厥人盛世权力。"
