 RICE_siberia_yeniseian_wanderer_desc:0 "该角色最初来自西伯利亚苔原和针叶林深处的叶尼塞部落。"
 RICE_siberia_yukaghir_wanderer:0 "来自西伯利亚的尤卡吉尔旅行者"
 RICE_siberia_yukaghir_wanderer_desc:0 "该角色最初来自西伯利亚苔原和针叶林深处的尤卡吉尔部落。"
 RICE_siberia_expanded_reindeer_herd_small:0 "驯鹿群扩张（小）"
 RICE_siberia_expanded_reindeer_herd_small_desc:0 "在过去的几年里，该地区的驯鹿群规模适度增长，为该地区带来了更多的繁荣。"
 RICE_siberia_expanded_reindeer_herd_medium:0 "驯鹿群扩张（中）"
 RICE_siberia_expanded_reindeer_herd_medium_desc:0 "在过去的几年里，该地区的驯鹿群规模相当大，为该地区带来了更多的繁荣。"
 RICE_siberia_expanded_reindeer_herd_large:0 "驯鹿群扩张（大）"
