l_simp_chinese:
 innovation_RICE_taiga_survival:0 "针叶林生存之道"
 innovation_RICE_taiga_survival_desc:0 "自古以来，西伯利亚人民就在极北的冻土上生活、生存和发展。他们对这些地区的生死知识将对他们大有裨益。"
 activity_hold_reindeer_sacrifice:0 "献祭驯鹿"
 activity_hold_reindeer_sacrifice_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]献祭驯鹿"
 RICE_siberia_decision_reindeer_herd_requirement:0 "有省份首府是针叶林地形"
 RICE_hold_reindeer_sacrifice_context_tooltip:0 "#emphasis 历史背景：#!驯鹿在许多西伯利亚文化中曾经和现在都是极为珍贵的。因此，献祭驯鹿被视为一种表达深切虔诚的方式，因为这意味着放弃了本可以用于其他用途的宝贵资源。"
 RICE_expand_reindeer_herd_context_tooltip:0 "#emphasis 历史背景：#!西伯利亚人在几千年前就驯化了驯鹿，并将其用于各种用途，从食物到用于雪橇运输等。"
 RICE_siberian_hunters:0 "西伯利亚猎人"
 RICE_siberian_hunters_flavor:0 "#F 这些西伯利亚猎人接受过在针叶林追踪和猎杀猎物的训练，无论猎物是动物还是人。#!"
 game_concept_siberian_courtier:0 "西伯利亚廷臣"
 game_concept_siberian_courtiers:0 "西伯利亚廷臣"
 game_concept_siberian_character:0 "西伯利亚角色"
 game_concept_siberian_characters:0 "西伯利亚角色"
 game_concept_siberian_courtier_desc:0 "偶尔，一个$game_concept_siberian_courtier$可以随机出现在北方王国的[rulers|E]宫廷。他们是来自西伯利亚北部的旅行者，不在地图上，他们有一个特殊的[character_modifier|E]，根据他们的[culture|E]给予他们奖励，他们可能是尼夫赫人、鄂温克人、雅库特人、叶尼塞人或尤卡吉尔人\n\n如果你允许这个$game_concept_siberian_courtier$加入你的[court|E]，有可能最终他们会根据他们[culture|E]的传统知识，给你或你的其他[courtiers|E]上宝贵的课程。每种知识都是一个[character_modifier|E]，有两个级别，即基础和大师。有些传统知识可以由任何$game_concept_siberian_courtier$传授，而有些则是某一文化所特有的。"
 RICE_siberia_lessons_hunting_1:0 "学习西伯利亚智慧（狩猎和追踪）"
 RICE_siberia_lessons_hunting_1_desc:0 "一位来自西伯利亚的旅行者教给该角色各种与狩猎和追踪有关的技能，就像在寒冷的北方的北部苔原和针叶林传统上所做的那样。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_hunting_2:0 "掌握西伯利亚智慧（狩猎和追踪）"
 RICE_siberia_lessons_hunting_2_desc:0 "一位来自西伯利亚的旅行者教给该角色各种与狩猎和追踪有关的技能，就像在寒冷的北方的北部苔原和针叶林传统上所做的那样。该角色已经精通这些事情了。"
 RICE_siberia_lessons_gathering_1:0 "学习西伯利亚智慧（采集和觅食）"
 RICE_siberia_lessons_gathering_1_desc:0 "一位来自西伯利亚的旅行者向该角色传授了与采集和觅食有关的各种技能，就像在寒冷的北方苔原和针叶林传统上所做的那样。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_gathering_2:0 "掌握西伯利亚智慧（采集和觅食）"
 RICE_siberia_lessons_gathering_2_desc:0 "一位来自西伯利亚的旅行者教给该角色各种与采集和觅食有关的技能，就像在寒冷的北方的北部苔原和针叶林传统上所做的那样。该角色已经精通这些事情了。"
 RICE_siberia_lessons_music_1:0 "学习西伯利亚智慧（仪式和音乐）"
 RICE_siberia_lessons_music_1_desc:0 "一位来自西伯利亚的旅行者向该角色传授了来自北方苔原和寒冷北方针叶林的传统乐器、歌曲和灵性修行。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_music_2:0 "掌握西伯利亚智慧（仪式和音乐）"
 RICE_siberia_lessons_music_2_desc:0 "一位来自西伯利亚的旅行者向该角色传授了来自北方苔原和寒冷北方针叶林的传统乐器、歌曲和灵性修行。该角色已经精通这些事情了。"
 RICE_siberia_lessons_evenk_1:0 "学习鄂温克人的智慧（驯鹿育种）"
 RICE_siberia_lessons_evenk_1_desc:0 "一位来自西伯利亚的旅行者向该角色传授了鄂温克人的驯鹿繁殖方法——尽管许多西伯利亚部落都饲养着驯鹿群，鄂温克人被认为是驯鹿方面最重要的专家。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_evenk_2:0 "掌握了鄂温克人的智慧（驯鹿饲养 ）"
 RICE_siberia_lessons_evenk_2_desc:0 "一位来自西伯利亚的旅行者传授了鄂温克人的驯鹿饲养策略，虽然西伯利亚许多部落都饲养驯鹿，但鄂温克人被认为是最优秀的驯鹿专家，已经获得了熟练的知识。"
 RICE_siberia_lessons_nivkh_1:0 "习得了尼夫赫人的智慧（垂钓与待客）"
 RICE_siberia_lessons_nivkh_1_desc:0 "一个来自西伯利亚的旅行者向该角色传授了关于尼夫赫人的捕鱼方法，以及他们的文化价值观，他们高度重视与他人，甚至会给陌生人分享鱼等材料和食物，该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_nivkh_2:0 "掌握了尼夫赫人的智慧（垂钓与待客）"
 RICE_siberia_lessons_nivkh_2_desc:0 "一个来自西伯利亚的旅行者向该角色传授了关于尼夫赫人的捕鱼方法，以及他们的文化价值观，他们高度重视与他人，甚至会给陌生人分享鱼等材料和食物，该角色已经精通这些事情了。"
 RICE_siberia_lessons_yakut_1:0 "学习雅库特智慧（北方驯化）"
 RICE_siberia_lessons_yakut_1_desc:0 "一位来自西伯利亚的旅行者向该角色传授了雅库特人的做法，他们最初从温暖的南部土地迁徙过来，饲养马、牛和狗以抵御北方寒冷的气候。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_yakut_2:0 "掌握雅库特人的智慧（北方驯化）"
 RICE_siberia_lessons_yakut_2_desc:0 "一位来自西伯利亚的旅行者向该角色传授了雅库特人的做法，他们最初从温暖的南部土地迁移过来，饲养马、牛和狗以抵御北方寒冷的气候。该角色已经精通这些事情了。"
 RICE_siberia_lessons_yeniseian_1:0 "学习叶尼塞人的智慧（萨满民间传说）"
 RICE_siberia_lessons_yeniseian_1_desc:0 "一位来自西伯利亚的旅行者向该角色讲述了叶尼塞部落的传说和信仰，叶尼塞部落的长老和萨满都非常了解北方的精神和传说。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_yeniseian_2:0 "掌握了叶尼塞人的智慧（萨满民间传说）"
 RICE_siberia_lessons_yeniseian_2_desc:0 "一位来自西伯利亚的旅行者向该角色讲述了叶尼塞部落的传说和信仰，叶尼塞部落的长老和萨满都非常了解北方的精神和传说。该角色已经精通这些事情了。"
 RICE_siberia_lessons_yukaghir_1:0 "学习尤卡吉尔人的智慧（游牧路线）"
 RICE_siberia_lessons_yukaghir_1_desc:0 "一位来自西伯利亚的旅行者向该角色介绍了尤卡吉尔人用来确定如何充分利用他们的游牧流浪的方法——在哪里可以找到好的食物和水，要避开哪些地方等等。该角色现在对这些事情略知一二。"
 RICE_siberia_lessons_yukaghir_2:0 "掌握了尤卡吉尔人的智慧（游牧路线）"
 RICE_siberia_lessons_yukaghir_2_desc:0 "一位来自西伯利亚的旅行者向该角色介绍了尤卡吉尔人用来确定如何充分利用他们的游牧流浪的方法——在哪里可以找到好的食物和水，要避开哪些地方等等。该角色已经精通这些事情了。"
 RICE_siberia_evenk_wanderer:0 "来自西伯利亚的鄂温克旅行者"
 RICE_siberia_evenk_wanderer_desc:0 "该角色最初来自西伯利亚苔原和针叶林深处的鄂温克部落。"
