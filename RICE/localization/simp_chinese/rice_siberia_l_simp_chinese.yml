 siberia.0000.t:0 "xxxxx"
 siberia.0000.desc:0 "xxxxx"
 siberia.0000.a:0 "xxxxx"
 siberia.0001.t:0 "来自西伯利亚的流浪汉"
 siberia.0001.desc:0 "一位名叫[scope_RICE_siberian.GetTitledFirstName]的旅行者从[scope_RICE_siberian.GetCulture.GetName]人民寒冷的北方土地来到我的宫廷，提供[scope_RICE_siberian.GetHerHis]的服务。"
 siberia.0001.desc.evenk:0 "鄂温克人是一群居住在贝加尔湖和阿穆尔河之间的许多不同部落组成，是牧民和狩猎采集者的混合体。虽然许多西伯利亚人已经驯化了驯鹿，但在这方面没有一个比鄂温克人做得更好。"
 siberia.0001.desc.nivkh:0 "尼夫赫人是一群生活在满洲和库页岛沿岸的部落。作为一个大多和平和好客的民族，他们偶尔会向更强大的南方邻居致敬，但除此之外，他们大部分时间都对自己保持沉默。"
 siberia.0001.desc.yakut:0 "雅库特人是突厥牧民部落，与其他突厥近亲不同，他们几个世纪以来向北迁移到西伯利亚。虽然他们保留了来自温暖南方的祖先智慧，但他们也学会了掌握在寒冷的北方发展壮大所需的技能。"
 siberia.0001.desc.yeniseian:0 "主要居住在叶尼塞河沿岸的叶尼塞人世代都在西伯利亚恶劣的条件下生存。叶尼塞部落不时卷入他们更南方的游牧邻居的事务。"
 siberia.0001.desc.yukaghir:0 "尤卡吉尔人是西伯利亚北部的古老部落，他们曾经居住在最南边的贝加尔湖，但几个世纪以来一直被其他民族逼向越来越遥远的东方和北方。他们过着游牧生活，在荒凉的亚北极和北极地区漫游以寻找食物和住所。"
 siberia.0001.a:0 "欢迎[scope_RICE_siberian.GetTitledFirstName]来到我们的宫廷！"
 siberia.0001.b:0 "虽然我很欣赏这个提议，但我现在不需要[scope_RICE_siberian.GetHerHis]的帮助。"
 siberia.0001.tooltip:0 "如果这个[siberian_character|E]加入你的宫廷，其有概率传授在西伯利亚的冬季之地中幸存下来的技能给你的廷臣甚至你自己！ 还可以帮助你在领土上驯养一批驯鹿群。"
 siberia.0001.courtier_effect.1:0 "[scope_RICE_siberian.GetTitledFirstName]，作为[siberian_courtier|E]，可能会将[scope_RICE_siberian.GetSheHe]在西伯利亚的冬日中学到的各种技能传授给你或你的廷臣。"
 siberia.0001.courtier_effect.2:0 "[scope_RICE_siberian.GetTitledFirstName]，作为[siberian_courtier|E]，如果你满足要求，也可以帮助你更好地在你的领土上驯养大量的驯鹿群。"
 siberia.0002.t:0 "xxxxx"
 siberia.0002.desc:0 "xxxxx"
 siberia.0002.a:0 "xxxxx"
 siberia.0003.t:0 "西伯利亚传统教学"
 siberia.0003.desc:0 "[scope_RICE_siberian_teacher.GetTitledFirstName]一直在教我[scope_RICE_siberian_teacher.GetHerHis][scope_RICE_siberian_teacher.GetCulture.GetName]祖先使用的传统技巧"
 siberia.0003.desc.hunting:0 "在西伯利亚寒冷的荒野中追踪、捕捉和杀死动物。虽然这些方法主要涉及狩猎过程，但它们也有许多其他应用，例如在荒野中追踪敌军，或者在需要时能够在野外独自生存。"
 siberia.0003.desc.gathering:0 "在西伯利亚无情的寒冷地带采集食物和基本必需品。了解哪些浆果或蘑菇可食用且无毒，能够识别水源和避难所——这些都是可以挽救生命的重要技能。"
 siberia.0003.desc.music:0 "通过音乐和歌曲与精神世界进行交流，并获得对宇宙和世界更加深入的了解。西伯利亚北部的传说和知识可以让人了解这片土地的性质和这个广阔地区的社会。"
 siberia.0003.desc.evenk:0 "培育他们的驯鹿群。鄂温克人对驯鹿驯化的掌握程度超过了极北地区的其他民族，这些信息不仅对维持一个人的驯鹿群非常有用，而且在土地利用和其他动物的饲养等其他问题上也很有用。"
 siberia.0003.desc.nivkh:0 "从寒冷的西伯利亚河流和海岸捕获和烹饪鱼类。鱼是尼夫赫人饮食的中流砥柱，尼夫赫人以热情好客而闻名，他们经常为其他人——甚至是陌生人——提供大量的鱼。因此，这些课程不仅是关于捕鱼和食物的，还包括对同伴的慷慨。"
 siberia.0003.desc.yakut:0 "在北极地区饲养马、牛和狗等动物。雅库特人最初从更温和的南部地区向北迁移。当他们向北移动时，他们制定了巧妙的策略来培育他们驯养的动物以抵御寒冷的气候。"
 siberia.0003.desc.yeniseian:0 "复述和传递叶尼塞民族的古老故事。作为居住在西伯利亚地区的一些最古老的部落，叶尼塞人几个世纪以来一直通过萨满教的民间传说和习俗了解自己和世界。"
 siberia.0003.desc.yukaghir:0 "在这片土地上漫游以寻找食物、住所和资源。游牧民族不会随意游荡：尤卡吉尔人世代以游牧民族的身份生活在北方寒冷的森林和苔原上，他们掌握了知道去哪里以及何时去的必要技术。"
 siberia.0003.desc.basic:0 "\n\n最终，我对这一传统知识有了基本的了解。"
 siberia.0003.desc.master:0 "\n\n最终，我现在对这种传统知识有了一定程度的掌握。"
 siberia.0003.desc.upgrade:0 "\n\n我以前对这些事情已经有了一些经验，所以我现在对这种传统知识有了一定程度的掌握。"
 siberia.0003.a:0 "太棒了！"
