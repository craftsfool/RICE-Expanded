 siberia.0020.t:0 "驯鹿祭祀的准备工作"
 siberia.0020.desc:0 "我已经决定献祭一些驯鹿，以安抚当地的神灵。希望这样做能给我的家族和我的人民带来幸福和繁荣。然而这样的仪式不能一时兴起，需要先做一些准备。\n\n在咨询了几个巫师后，我们决定了一个好日子进行祭祀。虽然这是一个小型的公共活动，但我需要通知该地区的几个显赫家族，传统上有两种方式沟通，一个是通过一根有缺口的棍子，或者一根有结的绳子。"
 siberia.0020.a:0 "每一个缺口表示距离祭祀的天数。"
 siberia.0020.b:0 "受邀者每天解开一个结，计算时间，直到献祭之时。"
 siberia.0021.t:0 "哪……？"
 siberia.0021.desc:0 "作为驯鹿祭祀活动过程的一部分，一种被称为chirta‑ko的萨满需要选择合适的地点。我带来的chirta‑ko告诉我，在他的梦中出现了祭祀的吉利地点。"
 siberia.0021.a:0 "我检查了荒野中的站点，发现它很有前途。"
 siberia.0022.t:0 "驯鹿献祭前"
 siberia.0022.desc:0 "驯鹿献祭的时间很快就到了。我连同我的家人、廷臣和一些当地显赫的家族，已经抵达临时营地，我们稍后将在那里献祭驯鹿。虽然长达数天的仪式要到晚上才开始，但人们在等待时参加各种社交活动或友好的比赛和游戏是传统的做法。也许我也应该参加。"
 siberia.0022.a:0 "帮忙照看周围玩耍的小孩子。"
 siberia.0022.b:0 "前往竞争力量、敏捷和狡猾的比赛。"
 siberia.0022.c:0 "欣赏我身边的自然风景。"
 siberia.0023.t:0 "占卜仪式"
 siberia.0023.desc:0 "夜幕降临，又到了准备仪式的时间。首先是占卜，在我们吃晚饭之前进行。Chirta‑ko向神灵唱和跳各种歌曲，与此同时这段时间是所有在场的人问问题的时候，这些问题可能会被回答。作为那里最高贵的人，我首先发出提问。在我和大家提出问题之后，chirta‑ko就会吃下大量的蘑菇，进入恍惚状态，这样他就能找到我们所寻求的答案。"
 siberia.0023.a:0 "应该怎样做才能让人和驯鹿都繁荣壮大起来？"
 siberia.0023.b:0 "应该怎么做才能让这个王国给我们带来财富？"
 siberia.0023.c:0 "我们应该如何取悦神灵？"
 siberia.0024.t:0 "Chirta‑Ko的忠告"
 siberia.0024.desc.start:0 "在chirta‑ko吃完蘑菇后，他疯狂地唱歌和跳舞，仿佛神灵已经进入他的身体，与他融为一体。我们都好奇地看着，看是否有其他人会受此影响，毕竟恍惚状态人传人并非闻所未闻。"
 siberia.0024.desc.self:0 "\n\n令我惊讶的是，我开始感觉到内心骚动，眼前闪过灿烂、生动的图像，我被选中了吗？在不知道为什么的情况下，我开始敲打我的头，向其他人表示我感觉很奇怪。有人递给我一个鼓，在没有人提示的情况下，我疯狂地敲打着鼓，开始和chirta‑ko一起唱歌。后来当我平静下来，回到现实时，我意识到神灵直接回答了我的问题。"
 siberia.0024.desc.courtier:0 "\n\n突然，[scope_RICE_siberia_reindeer_high_courtier.GetTitledFirstName]拍打[scope_RICE_siberia_reindeer_high_courtier.GetHerHis]的头，表示[scope_RICE_siberia_reindeer_high_courtier.GetSheHe]感到有东西从[scope_RICE_siberia_reindeer_high_courtier.GetHerHim]体内传来。随即，[scope_RICE_siberia_reindeer_high_courtier.GetSheHe]拿到了一个鼓，并开始疯狂地敲打它，和chirta‑ko一起唱歌甚至更加大声。他们一起唱出了神灵给我的问题的答案，以及我可以做什么。"
 siberia.0024.desc.none:0 "\n\n最后，似乎没有人进入恍惚状态。这不一定是件坏事，但当它真的发生时总是很有趣。不管怎么说，chirta‑ko唱出了神灵给我的问题的答案，以及我可以做什么。"
 siberia.0024.a:0 "希望这些建议会有所帮助"
 siberia.0025.t:0 "准备祭坛"
 siberia.0025.desc:0 "在占卜、晚餐和睡眠之后，我们都在第二天清晨醒来。我们和一些驯鹿一起从营地出发，赶往祭祀的地点。\n\n到达祭坛后，我们为图鲁姆与其他神和神灵献上了一些物品，如食物、金属和宝石，以及各种日常用品。同时附近的几个人点起了火。\n\n最后，要献祭的驯鹿被带到祭坛前。每个参加祭祀的家族都至少提供一头驯鹿。"
 siberia.0025.a:0 "当然，我提供了最多的驯鹿。"
 siberia.0026.t:0 "驯鹿祭祀"
 siberia.0026.desc:0 "multeh‑ko是专门负责仪式事宜的萨满，他带领大家进行祈祷，偶尔用“wo‑wo‑wo”的吟唱来补充祈祷内容。我们还向太阳鞠躬，一些被指派的年轻人则用绳索套住附近的树苗顶端，以带来好运。\n\n最后驯鹿被带到祭坛前，杀死并献祭。紧接着每头驯鹿都被剥皮和屠宰。这个过程很迅速，每个人都很小心，防止把血溅到雪上，因为这是传统。然后我们把驯鹿肉献给神灵。"
 siberia.0026.a:0 "神灵会为此感到高兴！"
 siberia.0027.t:0 "怀孕的驯鹿被献祭"
 siberia.0027.desc:0 "好消息！看来被牺牲的驯鹿其中有一头实际上是怀孕了。真不错，这样一来我们就是牺牲了两头驯鹿，而不仅仅是一头。有几个人被指派去小心翼翼地把驯鹿胎儿埋在一段距离之外。"
 siberia.0027.a:0 "这确实是一个美好的祝福。"
 siberia.0028.t:0 "驯鹿盛宴"
 siberia.0028.desc:0 "祭祀结束后，我们回到营地，用刚刚被祭祀的驯鹿肉和内脏做一顿饭，确保任何部分都不会被浪费，每个人感觉很兴奋。之后我们都做了祈祷以示感恩。Chirta‑ko带着一块红布回来，他用这块红布触摸在场每个人的额头。完成后，他向神灵祈祷，并把布扔进火里。"
 siberia.0028.a:0 "就这样，祭祀仪式的主要部分就结束了。"
 siberia.0029.t:0 "驯鹿祭祀结束"
 siberia.0029.desc:0 "第二天是专门为祭祀后的清理工作。有些人被分配到仪式上处理祭坛，有些人则把被献祭驯鹿的皮挂在树上，作为对神灵的最后献礼。最后我们大家在晚上最后一次聚集在一起，chirta‑ko再次进入恍惚状态，与神灵沟通，告诉祂们我们的祭祀并请求祂们接受"
 siberia.0029.a:0 "驯鹿祭祀就这样结束了"
