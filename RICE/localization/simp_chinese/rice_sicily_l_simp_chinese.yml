 sicily.0230.t:0 "[GetTitleByKey('b_syracusa').GetNameNoTierNoTooltip]的复兴"
 sicily.0230.desc:0 "昔日[GetTitleByKey('b_syracusa').GetNameNoTier]曾被认为是地中海最伟大的城市之一，与[GetTitleByKey('b_roma').GetNameNoTier]和[GetTitleByKey('b_athens').GetNameNoTier]齐名，甚至为拜占庭抵御外敌入侵。\n\n但如今[GetTitleByKey('b_palermo').GetNameNoTier]的光芒盖住了它，随着罗马再度统治[GetTitleByKey('d_sicily').GetNameNoTier]，这座城市也再次复苏，重拾繁荣。得益于[syracuse_restorer.GetTitledFirstName]，[GetTitleByKey('b_syracusa').GetNameNoTierNoTooltip]再次成为该地区首府，吸引源源不断的贸易和移民。\n\n[GetTitleByKey('b_syracusa').GetNameNoTierNoTooltip]再次成为地中海屹立不倒的明珠！"
 sicily.0230.a:0 "这座城市全新又美好一天。"
 sicily.0231.t:0 "[GetTitleByKey('b_catania').GetNameNoTierNoTooltip]大象"
 sicily.0231.desc:0 "随着[GetTitleByKey('b_catania').GetNameNoTier]的地位越来越高，当地市民们一直在要求把当地著名的大象雕像#italic 乌·利奥特罗#!宣布为当地标志，而我已经接受了这一请求。\n\n虽然这是形式，但是这座城市一直被昵称为“大象之城”，有关传说也广为流传。\n\n有人说这是卡塔尼亚的赫利奥多罗斯施展黑魔法的结果，他在被[GetReligionByKey('christianity_religion').GetAdjective]主教击败之前，曾对其施展法术，此后这座雕像一直保护城市免受伤害，而今它将成为这座城市的象征。"
 sicily.0231.a:0 "它也将一如既往地保护城市！"
 sicily.0232.t:0 "[GetPlayer.Custom('RICE_almadraba')]"
 sicily.0232.desc:0 "每年春夏两季，渔民们都会从港口出发，前往[GetGeographicalRegion('RICE_west_mediterranean').GetName]，使用古老[GetPlayer.Custom('RICE_almadraba')]技术来捕捞金枪鱼，在那里布下精心制作的渔网，捕捉从地中海洄游到大西洋的金枪鱼。\n\n几个世纪以来，像我这样有魄力的统治者一直在支持这些渔民，为他们提供设备、补给和瞭望塔，并通知他们金枪鱼洄游时间等等。通过投资这些渔民，可以从这个利润丰厚的行业中获利。"
 sicily.0232.a:0 "的确是门有利可图的行当！"
 sicily.0233.t:0 "$RICE_sicily_struggle$"
 sicily.0233.desc:0 "我在[GetGeographicalRegion('custom_sicily').GetName]上花了很多时间，在来回旅行中了解了这片美丽土地上的一切。\n\n虽然我不知道自己是否想在这里安家，但不可否认的是，我已经融入了[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]。统治者和平民都越来越多地知晓我的名字，无论我声誉如何，他们都不会把我当作一个陌生人，而是把我视为该地区的一份子。\n\n我与该地区的人民和文化影响有着特别密切的联系。"
 sicily.0233.a:0 "拉丁世界"
 sicily.0234.t:0 "来自$RICE_sicily_struggle$的难民"
 sicily.0234.desc:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]是一片充满冒险，却也充斥着混乱与冲突的边疆之地。有人向我汇报一些因[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]近期动荡而逃离的[courtier.GetFaith.GetAdjective][courtier.GetCulture.GetName]难民已抵达我的领地。他们由一位名为[courtier.GetFullName]的人率领，希望我能施以仁慈，援助[courtier.GetHerHis]的族人。\n\n我的官员指出，[courtier.GetFirstNamePossessiveNoTooltip]这支队伍主要由[GetPlayer.Custom('RICE_sicilian_refugee_type_loc')]组成，人数规模为[GetPlayer.Custom('RICE_sicilian_refugee_size_loc')][ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]。"
 sicily.0234.a:0 "很好！欢迎你来，[courtier.GetFirstNameNoTooltip]。"
 sicily.0235.t:0 "一位天赋异禀的移民来到$RICE_sicily_struggle$"
 sicily.0235.desc:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]是一片充满机遇的地区，大量野心勃勃才华横溢的角色前来闯荡，近日却听闻我一位尤为出众的人物——[courtier.GetFullName]已来到我的领地，希望在此谋得一职。\n\n当这位[courtier.GetCulture.GetName][courtier.GetWomanMan]被带到我面前觐见时，[courtier.GetFirstName]表示，[courtier.GetSheHe]原本来自[county.GetNameNoTier]，出身于一个[GetPlayer.Custom('RICE_sicilian_migrant_type_loc')]社区。"
 sicily.0235.a:0 "你的技艺会很好得为我效劳。"
