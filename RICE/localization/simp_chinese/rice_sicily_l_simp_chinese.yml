 sicily.0030.t:0 "与据点谈判"
 sicily.0030.t.latin:0 "与拉丁裔据点谈判"
 sicily.0030.t.greek:0 "与希腊裔据点谈判"
 sicily.0030.t.arabic:0 "与阿拉伯‑柏柏尔裔据点谈判"
 sicily.0030.desc.intro:0 "领内拥兵自重的据点甚多。"
 sicily.0030.desc.latin:0 "尤以拉丁据点为最。"
 sicily.0030.desc.greek:0 "尤以希腊据点为最。"
 sicily.0030.desc.arabic:0 "尤以阿拉伯‑柏柏尔据点为最。"
 sicily.0030.desc:0 "我努力与他们展开谈判，终于有所斩获。其中一位显赫的领袖——信奉[sicily_faith.GetAdjective]的[sicily_culture.GetName][representative.GetWomanMan]的[representative.GetFirstName]，被派遣前来作为其方代表。\n\n在初轮谈判后，[representative.GetFirstNameNoTooltip]建议我向[representative.GetHerHis]的人民支付[gold_i|E]#V [ROOT.Char.MakeScope.Var('bargain_amount').GetValue]#!或等值货物。作为交换，他们承诺在未来数年内不会劫掠或骚扰其据点所在地区的居民。\n\n若从负面角度来看，这似乎是另一种进贡的形式，但从别的视角来看，这或许能在长远上为双方带来裨益。"
 sicily.0030.a:0 "很好，就这么说定了。"
 sicily.0030.b:0 "我同意，但你得多给我点好处。"
 sicily.0030.b.failure:0 "谈判没有进一步的进展，你只能接受最初的协议。"
 sicily.0030.b.success:0 "谈判取得进展，你得到了更多的让步。"
 sicily.0030.c:0 "荒谬！我拒绝！"
 sicily.0031.desc:0 "在[representative.GetFirstName]提出初步建议后，我方随即提出了更进一步的要求。毕竟，原先的协议稍显薄弱，不足以令人安心——于是我告知[representative.GetFirstNameNoTooltip]，为了确保[representative.GetHerHis]的人民的善意，我需要更多的保障方能达成共识。\n\n"
 sicily.0031.desc.failure:0 "然而，纵使我们费尽心力，最终仍未能从[representative.GetFirstNameNoTooltip]那里争取到更多的好处。\n\n[representative.GetSheHe]确实是一位难缠的谈判者！[representative.GetHerHis]或许已经察觉到我们迫切希望削弱其势力范围、不惜一切代价的决心。"
 sicily.0031.desc.prestige:0 "经过一番深思，[representative.GetFirstNameNoTooltip]最终同意让据点中的几位领袖前来我的庭院，正式致敬并确认我们的协议。\n\n尽管我更期望得到实质性的让步，但这个象征性的举动也是可喜的，它应能向全区昭示这些据点已然臣服于我——至少目前如此。"
 sicily.0031.desc.gold:0 "尽管[representative.GetFirstNameNoTooltip]起初略显犹豫，但[representative.GetSheHe]最终还是同意减少我们所欠其人的黄金数额。\n\n当然，我依然得先送上一些黄金以平息这些难缠之人的要求，但我很庆幸自己冒险继续谈判，而非直接接受最初的协议。"
 sicily.0031.desc.troops:0 "随后，[representative.GetFirstNameNoTooltip]承诺[representative.GetHerHis]的据点中的一些士兵将向我宣誓效忠，并在我的旗帜下抗击任何威胁我们的敌人。\n\n事实上，我一直期望能够达成这样的结果；若我能将他们的破坏欲望从我身上引导至我的敌人身上，那将是再好不过的结局。毕竟，他们的战士#italic 确实#!以卓越的战斗技巧闻名，不仅是在与我军交锋时。"
 sicily.0031.desc.county:0 "[representative.GetFirstNameNoTooltip]思虑再三，最终表示愿意与其他据点的领袖共同商讨如何促进该地区的贸易与商业。毕竟，他们的势力不仅延伸至所在地区之外，还能为经过据点的商路提供保护。\n\n这确实是一个不错的提议。他们的关系网或将大有裨益，而他们的海外联系以及对保护我方道路的承诺，必将使商业更加繁荣昌盛。"
 sicily.0031.a:0 "那行吧。谈判结束了。"
