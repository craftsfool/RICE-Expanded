 RICE_sicily_north_african_famine_desc:0 "该地区多年来一直饱受饥荒之苦，严重依赖于从其他地方，尤其是从西西里岛进口粮食。\n\n#EMP 每年会有#V [EmptyScope.ScriptValue('RICE_sicily_north_african_famine_disappearance_base_chance')]%#!概率移除该[county_modifier|E]，如果该[county|E][ruler|E]通过[sicily_grain|E][interaction|E]获得[GetModifier('RICE_sicily_grain_shipments').GetNameWithTooltip][modifier|E]，则概率上升到#V [EmptyScope.ScriptValue('RICE_sicily_north_african_famine_disappearance_real_chance')]%#!#!"
