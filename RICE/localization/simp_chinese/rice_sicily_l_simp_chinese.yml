 RICE_sicily_aspiration_find_jewish_refuge_desc:0 "#italic 安德烈亚曾是基督教的巴里大主教，但上帝将摩西律法启迪于他。如今基督教世界已经不再安全了，现在他必须前往中东，前往犹太人中心，在那里会更安全，在那里其他犹太人会被他的英雄之旅激励！#!$RICE_sicily_aspiration_andreas_desc$\n\n"
 RICE_sicily_andreas_archbishop_of_bari_modifier:0 "前巴里大主教"
 RICE_sicily_andreas_archbishop_of_bari_modifier_desc:0 "该角色曾是巴里的大主教，享有荣耀，然而他却毅然皈依了犹太教，放弃了荣耀背叛其他基督徒，但据说他受到了奇迹守护，因为在万般艰难中活了下来，这一点是其他任何人都无法比拟的。"
 RICE_sicily_embed_into_sicily:0 "融入西西里社会"
 RICE_sicily_embed_into_sicily_tooltip:0 "我在[RICE_sicily_struggle_adjective|E]中是重要利益相关者！"
 RICE_sicily_embed_into_sicily_desc:0 "虽然我不是[landed|E][ruler|E]，但我已经付出大量时光在[RICE_sicily_struggle|E]中，是[GetGeographicalRegion('custom_sicily').GetName]当地政治和社会的重要参与者，我应该加强与这里居民的联系。"
 RICE_sicily_embed_into_sicily_effect_tooltip_1:0 "你将在你的[GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )][trait|E]中所选的[sicily_latin_dominance_i|E][sicily_latin|E]、[sicily_greek_dominance_i|E][sicily_greek|E]或者[sicily_arabic_dominance_i|E][sicily_arabic|E][trait_level_track|E]中获得#V [EmptyScope.ScriptValue('RICE_sicily_signore_trait_xp_gain_medium')]#![trait_level_track_xp|E]"
