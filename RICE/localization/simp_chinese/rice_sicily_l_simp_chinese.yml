 sicily.0188.b:0 "我发现[GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip]的教义极具说服力，因此皈依了。"
 sicily.0188.info:0 "#emphasis 历史背景：#! 康斯坦丁是11世纪来自北非的商人，他略通医术，因经商前往意大利，据称他对当时意大利低劣的医学水平深感震惊，遂毕生致力于在当地传播希腊化与伊斯兰医学，最终以修士身份定居于著名的卡西诺山修道院。现代学界尚不确定他究竟是皈依基督教的穆斯林，还是北非逐渐衰落的本土基督教社区的一员，这个社区直到中世纪后期仍然使用一种北非的罗曼语。"
 sicily.0189.b:0 "我找到了作为僧侣的使命。"
 sicily.0189.info:0 "#emphasis 历史背景：#!非洲的康斯坦丁在其一生中的某个时刻成为了一名本笃会修士，他于1077年加入了著名的卡西诺修道院，在那里翻译和撰写医学著作，并得到多位学生的协助。根据他的著作记载，他最亲近的两名学生，他像对待儿子或朋友一样对待他们，一个是卡西诺修道院的僧侣阿托，另一个是可能从穆斯林阿拉伯人皈依基督教的约翰·阿夫拉奇乌斯，他的原名可能是叶哈雅·伊本·阿弗拉。"
