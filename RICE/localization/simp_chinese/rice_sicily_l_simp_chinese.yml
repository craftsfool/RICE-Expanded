 RICE_sicily_volcanic_minerals:0 "火山地区产品"
 RICE_sicily_volcanic_minerals_desc:0 "该地区周围遍布火山，是各种珍贵矿物和岩石的重要产地，最近这些产品的贸易量成倍增长，促进了当地经济的发展。"
