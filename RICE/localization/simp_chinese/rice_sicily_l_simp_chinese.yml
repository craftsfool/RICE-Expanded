 sicily.0140.t:0 "[GetTitleByKey('b_salerno').GetNameNoTierNoTooltip]的医学院"
 sicily.0140.desc:0 "[GetTitleByKey('b_salerno').GetNameNoTier]的医学院是本地最富盛名的医学教学机构之一。\n\n通过赞助这所学校，我不仅履行了传播医学知识和培养高水平医师的使命，更提高了自己在教育界和医学界的声誉。"
 sicily.0140.desc.extras:0 "\n\n有趣的是，对该院的长期赞助，能够给我带来更加丰厚的回报。"
 sicily.0140.a:0 "毕竟，医学对于社会至关重要。"
 sicily.0140.a.extras:0 "嗯？还有什么好消息？"
 sicily.0141.t:0 "$sicily.0140.t$"
 sicily.0141.desc:0 "如果消息可靠，我对[GetTitleByKey('b_salerno').GetNameNoTier]的赞助使得人们将我视为博学慎思的[ROOT.Char.GetTitleAsNameNoTooltip]。不少人认为我与学院的关系势头良好，也许未来我可以充分挖掘这份关系的潜力。"
 sicily.0141.a:0 "喜不自胜！"
 sicily.0142.t:0 "$sicily.0140.t$"
 sicily.0142.desc:0 "看来我对[GetTitleByKey('b_salerno').GetNameNoTier]医学院的赞助，推动了其与我首都[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]的医师学者圈，建立起更为广泛紧密的纽带。两方互帮互助、交流分享，无疑会产生更加深远积极的影响。促进医学知识传播，加快科技创新，进一步提升了当地医疗水平。"
 sicily.0142.a:0 "合作使得医学事业迈向新的高度！"
 sicily.0143.t:0 "$sicily.0140.t$"
 sicily.0143.desc:0 "作为赞助[GetTitleByKey('b_salerno').GetNameNoTier]的回礼，该校的一些学者和医师赠与了我一本该校撰写且备受追捧的珍贵医学著作。\n\n其中一些是对其他地区（尤其是地中海东部和中东）医学文献或古籍的翻译；还有些是对这些前人思想的原创注解；剩下的则是兼而有之。无论如何，于本人及宫廷医师来说都是无价之宝。"
 sicily.0143.a:0 "一份完美的礼物！"
 sicily.0144.t:0 "$sicily.0140.t$"
 sicily.0144.desc:0 "我对[GetTitleByKey('b_salerno').GetNameNoTier]医学院的赞助引得不少人登门拜谢。当然我也乐于设宴相迎。\n\n"
 sicily.0144.desc.old_physician:0 "到访期间，不少来宾还抽空与我的[GetCourtPositionType('court_physician_court_position').GetName()]，[physician.GetTitledFirstName]亲切会面。[physician.GetSheHe|U]赞许道这是一次非常有启迪意义的经历，并提高了[physician.GetHerHis]对医学的各方面认识。"
 sicily.0144.desc.new_physician:0 "其中，一位名为[physician.GetFirstName]的[sicily_culture.GetName]医师令我印象深刻，[physician.GetSheHe]希望能留在我的宫廷，担任我的[GetCourtPositionType('court_physician_court_position').GetName()]。"
 sicily.0144.a:0 "听起来不错！"
