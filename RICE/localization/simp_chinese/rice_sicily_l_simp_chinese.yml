 RICE_sicily_admirals_bridge_recently_built:0 "最近建成的海军上将桥"
 RICE_sicily_admirals_bridge_recently_built_desc:0 "当地领主最近在巴勒莫附近资助建造海军上将桥。海军上将桥将跨越一条主要河流，连接城市的各个部分和周边地区，是荣耀和繁荣的象征。"
 RICE_sicily_substrate_latin:0 "拉丁文化基层"
 RICE_sicily_substrate_latin_desc:0 "常年战争导致经济衰退，西西里变成了地中海的[struggle_phase_sicily_periphery_simple|E]。在此期间，拉丁裔的宗教和文化更加广泛的影响该地区的基层平民。\n\n"
