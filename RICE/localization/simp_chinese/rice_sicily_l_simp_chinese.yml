 RICE_sicily_second_pavia_county_modifier:0 "第二帕维亚"
 RICE_sicily_second_pavia_county_modifier_desc:0 "在伦巴第王国被加洛林王朝征服之前，帕维亚曾是伦巴第王国的首都。多年后的今天，伦巴第人将再次在“第二帕维亚”中崛起！"
