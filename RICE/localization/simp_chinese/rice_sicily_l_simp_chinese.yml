 RICE_sicily_constantine_the_african_modifier_upgraded_desc:0 "在基督徒中被称为非洲的康斯坦丁的他，原本是北非一位受过良好教育的商人，后来通过撰写#italic 《医学全书》#!将医学知识传播至意大利各地。这是最早的拉丁语综合医学文本之一，汇集了希腊和伊斯兰世界的医学知识，为西方拉丁世界带来了深远影响。"
