 RICE_sicily_stronghold_faction_effect:0 "$EFFECT_LIST_BULLET$一个[sicily_stronghold|E][faction|E]可以发动起义，反对本[county|E]的[ruler|E]，即使他们拥有相同的[culture|E]或[faith|E]。"
