 sicily.0015.message:0 "[sicily_stronghold|E]劫掠[county.GetNameNoTierNoTooltip]"
 sicily.0016.t:0 "[siculo_arabic.GetNameNoTooltip]的兴起"
 sicily.0016.desc:0 "自首批阿拉伯与柏柏尔移民踏足[GetGeographicalRegion('custom_sicily').GetName]，岁月如梭，已过多年。此地因移民的到来，增添了新的文化与宗教气息，丰富了这片多元之地。\n\n时光流转，这些移民及其后裔不仅在[county_to_change.GetNameNoTier]落地生根，还与当地人相互交融，彼此影响深远。\n\n由于人群、风俗与信仰的交汇，[county_to_change.GetNameNoTierNoTooltip]的主流文化早已不再是[old_culture.GetName]，而化为别具风韵的[siculo_arabic.GetName]。"
 sicily.0016.a:0 "有意思！"
 sicily.0017.t:0 "跨越奥雷托河的大桥"
 sicily.0017.desc:0 "[GetTitleByKey('b_palermo').GetNameNoTier]在[GetGeographicalRegion('custom_sicily').GetName]诸城中独占鳌头，繁华如画，然而它的潜力尚未尽显。\n\n昔日，奥雷托河曾是其发展的绊脚石，使得主城区与周边郊区的交通多有不便。为此，我下令修筑一座宏伟的桥梁，横跨两岸，贯通南北。\n\n此桥不仅将大大改善城内交通，还将带来丰厚的过桥税利。如今，市民已将此桥唤作“海军上将桥”。"
 sicily.0017.a:0 "或许这将惠及[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]几代人！"
 sicily.0018.t:0 "新部队"
 sicily.0018.desc.latin:0 "我已向拉丁社群传达讯息，无论他们身处我境，还是远在异国他乡，我正在征募拉丁士兵加入我的军队。外界或许有人认为他们中有些人粗野未开，但无论此说真假，几乎无人能否认他们的勇猛善战。"
 sicily.0018.desc.greek:0 "我已向希腊社群传达讯息，无论他们身处我境，还是远在异国他乡，我正在广募希腊士卒归于麾下。虽在敌人眼中，他们被视为狡诈的叛徒，然于他们自身，却认定为伟大罗马的正统传人。"
 sicily.0018.desc.arabic:0 "我已向阿拉伯‑柏柏尔社群广传讯令，无论他们身在何方，我正召募阿拉伯‑柏柏尔勇士归于麾下。虽敌人视他们为冷酷无情的掠袭者，然我深信，他们必为善待之人奋勇效力，忠诚无畏，誓死不渝。"
 sicily.0018.desc.none:0 "我已向各地社群广布消息，无论远近，只要心怀从军之志，皆可应募入我麾下，共赴沙场。"
 sicily.0018.desc:0 "\n\n无论是充满朝气的新兵，抑或久经沙场的老将，他们的数量与才能必将壮大我军之势。\n\n[GetGeographicalRegion('custom_sicily').GetName]自古便为文明交汇的边疆之地，来自四海八方的士兵在此汇聚不足为奇。在这片蕴藏无限可能的土地上，那些勇于迎接挑战、融入新文化的军人，必能大展身手。"
 sicily.0018.a:0 "他们会是我麾下的好士兵。"
