 sicily.0120.t:0 "前往那波利隧道"
 sicily.0120.desc:0 "在[GetTitleByKey('b_napoli').GetNameNoTier]，有一条#italic 那波利隧道#!，传说伟大的[roman.GetName]诗人兼魔法师#V 维吉尔#!的墓穴便静卧在它的近旁。至今，依然有无数人敬仰着他的传奇与他用[roman.GetLanguage.GetName]创作的诗篇。\n\n如同无数仰慕者一般，我亦心向往之，渴望一睹这位伟人的遗迹，遂早已整装待发，踏上敬仰之旅。"
 sicily.0120.a:0 "我们去[GetTitleByKey('b_napoli').GetNameNoTierNoTooltip]吧!"
 sicily.0121.t:0 "抵达"
 sicily.0121.desc:0 "我已抵达[GetTitleByKey('b_napoli').GetNameNoTier]的#italic 那波利隧道#!，难道这真是传说中伟大的[roman.GetName]诗人兼魔法师#V 维吉尔#!的长眠之地吗？\n\n隧道幽幽，深邃莫测，仿佛无尽的黑暗吞噬了前方的光明。据传，维吉尔曾凭借他神秘的魔法天赋，独力开凿出这条通途。虽并非#italic 所有人#!都愿信服这些古老的传说，然而即便是心怀疑念者，也不禁趋前致敬，毕竟，维吉尔的文采几近无可争辩，尤其那传世之作——#italic 《埃涅阿斯纪》#!，更是令人叹为观止。"
 sicily.0121.a:0 "我将启程，踏入那幽深的隧道，并前往隧道旁那座静谧的小教堂。"
 sicily.0122.t:0 "在隧道中"
 sicily.0122.desc:0 "最初穿越隧道的黑暗之时，步履颇为艰难，但最终，我抵达了一座凿于岩石中的小教堂。教堂内，壁画装饰古朴典雅，几位虔诚之人正默默祈祷。\n\n在这片寂静祥和的氛围中，维吉尔那不朽的#italic 《埃涅阿斯纪》#!诗句在我心中回响。我亦在此驻足片刻，缅怀这位伟大的诗人、卓绝的魔法师——他至今仍以其智慧光辉照耀着后世。\n\n良久，我决定启程离去。踏出隧道，回归尘世之时，心中却涌起一丝异样之感，仿佛方才离开的是一处充满奇迹与灵性力量的圣地。"
 sicily.0122.a:0 "再见了，维吉尔。感谢你容我来此一访。"
 sicily.virgil.miracle:0 "你目睹了维吉尔的奇迹！"
 sicily.virgil.inspired:0 "你大受维吉尔启发！"
 sicily.0123.t:0 "维吉尔诗签"
 sicily.0123.desc:0 "用#italic 维吉尔诗签#!来占卜这一古老的艺术形式源自罗马时期。千百年来，人们一直依仗诗人#V 维吉尔#!的智慧诗句，试图揭开未来的神秘面纱。\n\n今日，我亦决意借助这位伟大诗人的诗篇一探天机。我找来维吉尔的不朽巨著——#italic 《埃涅阿斯纪》#!，怀着敬畏之心，随手翻开一页，静候命运的启示。\n\n"
 sicily.0123.desc.negative:0 "我所翻开的那一段……透着一股不祥之气。这绝非吉兆。我只能暗自祈祷，愿未来的困厄不至于过于严峻。然而，这诗句究竟预示着何等的危险呢？这谜团让我心生不安。"
 sicily.0123.desc.positive:0 "幸好，所选的段落并无不祥之兆。若我能细心解读这段文字，或许能够从中领悟出在当前境遇下的启示与建议。"
 sicily.0123.a:0 "我细细品读这些文字……"
