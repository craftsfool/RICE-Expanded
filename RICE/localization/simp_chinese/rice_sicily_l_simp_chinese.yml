 RICE_sicily_aspiration_disseminate_modern_medicine_desc:0 "#italic 康斯坦丁原本是来自非洲的商人，他对意大利医学知识的匮乏感到忧虑，即便是在伟大的萨莱诺医学院也是如此。他在故乡学习了一些医学知识，因此将传播希腊和伊斯兰医学知识到意大利作为自己一生的使命。#!$RICE_sicily_aspiration_constantine_desc$\n\n"
