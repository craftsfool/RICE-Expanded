 RICE_sicily_almadraba_modifier:0 "投资地中海金枪鱼捕捞业"
 RICE_sicily_almadraba_modifier_desc:0 "当地统治者在财政上支持金枪鱼捕捞业，这种捕捞业依赖[GetPlayer.Custom('RICE_almadraba')]方法，在每年金枪鱼从地中海洄游到大西洋的部分时间，设置一系列精心制作的渔网，来诱捕大量金枪鱼。"
 RICE_sicily_spawn_early_latin_mercenaries_tt:0 "你将获得#V 200名#!至#V 1000名#![special_troops|E]，至少包括一个[GetMaA('RICE_arimanni').GetName][regiment|E][men_at_arms|E]"
