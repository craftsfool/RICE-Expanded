 RICE_sicily_salerno_medical_text_artifact_name:0 "萨莱诺医学典籍"
 RICE_sicily_salerno_medical_text_artifact_desc:0 "这本医学著作出自[GetTitleByKey('c_salerno').GetNameNoTier]著名医学院的医师之手，这些典籍包含其他地区医学文献的翻译，前辈知识汇总。"
 RICE_sicily_ayo_visto_lo_mappamundi_name:0 "[ROOT.Char.Custom('RICE_sicily_ayo_visto_lo_mappamundi_song_name')]"
 RICE_sicily_ayo_visto_lo_mappamundi_desc:0 "这是[ROOT.Char.Custom('RICE_sicily_ayo_visto_lo_mappamundi_song_name')]的副本手稿，是[alfonso.GetTitledFirstName]统治时期[GetGeographicalRegion('custom_sicily').GetName]的一首流行民歌，这首歌赞美了西西里的美景。"
 building_type_RICE_sicily_mount_etna:0 "埃特纳火山"
 building_type_RICE_sicily_mount_etna_desc:0 "埃特纳火山作为地中海最伟大的火山之一，数百年来一直是传说的主题。在古时，埃特纳火山更是具有宗教意义，因为人们相信赫菲斯托斯在埃特纳火山下有锻炉，不过因火山活动产生的火山灰使附近地区成为西西里岛最肥沃的地区之一。"
 building_RICE_sicily_mount_etna:0 "$building_type_RICE_sicily_mount_etna$"
 building_RICE_sicily_mount_etna_desc:0 "$building_type_RICE_sicily_mount_etna_desc$"
 building_type_RICE_sicily_monte_cassino:0 "卡西诺山"
 building_type_RICE_sicily_monte_cassino_desc:0 "卡西诺山修道院坐落在卡西诺山顶，由努西亚的圣本笃于529年建造，是第一座本笃会修道院。几个世纪以来，经历风雨，几经遗弃，但拥有一座规模宏大的图书馆，还是成为欧洲最重要的文化和学习中心之一，作为#italic 圣本笃之地#!，这里有戒备森严的防御工事来保护。"
 building_RICE_sicily_monte_cassino:0 "$building_type_RICE_sicily_monte_cassino$"
 building_RICE_sicily_monte_cassino_desc:0 "$building_type_RICE_sicily_monte_cassino_desc$"
 building_type_RICE_sicily_palace_of_palermo:0 "巴勒莫王宫"
 building_type_RICE_sicily_palace_of_palermo_desc:0 "巴勒莫是西西里的政治、文化和经济中心，而巴勒莫王宫更是融合了伊斯兰、东方希腊和西方拉丁世界的艺术风格，是西西里历史的见证。"
 building_RICE_sicily_palace_of_palermo:0 "$building_type_RICE_sicily_palace_of_palermo$"
 building_RICE_sicily_palace_of_palermo_desc:0 "$building_type_RICE_sicily_palace_of_palermo_desc$"
 building_type_RICE_sicily_salerno_medical_school:0 "萨莱诺医学院"
 building_type_RICE_sicily_salerno_medical_school_desc:0 "相传拉丁人萨勒努斯、希腊人庞图斯、犹太人赫利努斯和阿拉伯人阿卜杜拉四位医师在萨莱诺偶然相遇并结为好友，随后在此建立了一所医学院。不管真假与否，自那时起，萨莱诺一直是欧洲最重要的医学源泉，在其庞大的图书馆中积累了令人印象深刻的医学典籍。"
 building_RICE_sicily_salerno_medical_school:0 "$building_type_RICE_sicily_salerno_medical_school$"
 building_RICE_sicily_salerno_medical_school_desc:0 "$building_type_RICE_sicily_salerno_medical_school_desc$"
 RICE_sicily_salerno_medical_school_effect_desc:0 "解锁$RICE_sicily_support_salerno_medical_school$[decision|E]"
 building_type_RICE_sicily_arch_of_trajan:0 "图拉真拱门"
 building_type_RICE_sicily_arch_of_trajan_desc:0 "五贤帝之一图拉真在罗马帝国各地建造了许多宏伟壮观的凯旋门，以庆祝他使罗马帝国达到了鼎盛的功绩。图拉真拱门是这些凯旋门中保存最完好的，上面的浮雕描绘了图拉真和他的功绩。"
 building_RICE_sicily_arch_of_trajan:0 "$building_type_RICE_sicily_arch_of_trajan$"
 building_RICE_sicily_arch_of_trajan_desc:0 "$building_type_RICE_sicily_arch_of_trajan_desc$"
 building_type_RICE_sicily_sassi_of_matera_01:0 "马泰拉石头城"
 building_type_RICE_sicily_sassi_of_matera_01_desc:0 "虽然地中海各地都有洞窟民居，但很少有像马泰拉这样壮观且连绵，当地不断扩大的洞窟民居网络包括地下建筑、市场、堡垒、作坊、农舍、礼拜堂以及各种水利设施等等。"
 building_RICE_sicily_sassi_of_matera_01:0 "$building_type_RICE_sicily_sassi_of_matera_01$"
