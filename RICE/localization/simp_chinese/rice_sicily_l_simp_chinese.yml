 Abu_Muhammad:0 "阿布·穆罕默德"
 nick_ibn_hamdis:0 "伊本·哈姆迪斯"
 RICE_sicily_william_of_apulia_modifier:0 "与拜占庭保持友好关系"
 RICE_sicily_william_of_apulia_modifier_desc:0 "尽管这位诗人兼编年史家来自西方拉丁世界，却对拜占庭的语言、历史、风俗等了如指掌。"
 RICE_sicily_restored_syracuse_person:0 "恢复锡拉库萨的古老荣耀"
 RICE_sicily_syracuse_restoration:0 "锡拉库萨的复兴"
 RICE_sicily_syracuse_restoration_desc:0 "随着拜占庭统治锡拉库萨，这座城市再度复兴，吸引着远方的贸易，并重建成昔日著名的大都市。\n\n#EMP $RICE_sicily_administer_frontier$[decision|E]成本减少[gold_i|E][gold|E]，且为[GetTitleByKey('c_siracusa').GetNameNoTier][rulers|E]提供少量[legitimacy_i|E][legitimacy|E]奖励。#!"
 RICE_sicily_ibn_hamdis:0 "伟大的西西里诗人"
 RICE_sicily_ibn_hamdis_desc:0 "伊本·哈姆迪斯是当今伊斯兰世界最杰出的诗人之一。他来自西西里岛，不过当地已经被基督教征服，他的大部分诗歌都围绕着对故土的怀念和热爱。"
 RICE_sicily_catania_elephant_statue:0 "乌·利奥特罗"
 RICE_sicily_catania_elephant_statue_desc:0 "卡塔尼亚城有一座名为#italic “乌·利奥特罗”#!的古老大象雕像，据说这座起源神秘的雕像能够保护这座城市免受伤害，因此深受人们的喜爱，随着它成为这座城市的官方标志，在附近声名鹊起，被称为“大象之城”。"
 RICE_sicily_byzantine_syracuse_decision:0 "恢复$c_siracusa$的荣耀"
 RICE_sicily_byzantine_syracuse_decision_tooltip:0 "曾经是[GetTitleByKey('d_sicily').GetNameNoTier]首都的[GetTitleByKey('c_siracusa').GetNameNoTier]再次成为一座宏伟的城市！"
 RICE_sicily_byzantine_syracuse_decision_desc:0 "[GetTitleByKey('c_siracusa').GetNameNoTier]是古代地中海的一颗璀璨明珠，多国觊觎的贸易和文化中心。而今它已不复当年的风采，随着罗马人再度控制[GetTitleByKey('d_sicily').GetNameNoTier]，我们应该将西西里的首府迁回[GetTitleByKey('c_siracusa').GetNameNoTierNoTooltip]，让它再次成为文明灯塔！"
 RICE_sicily_byzantine_syracuse_decision_confirm:0 "让西西里旧都再次回归！"
 RICE_sicily_byzantine_syracuse_decision_effect_tooltip_1:0 "$RICE_sicily_administer_frontier$[decision|E]成本减少[gold_i|E][gold|E]，且为[GetTitleByKey('c_siracusa').GetNameNoTier][rulers|E]提供少量[legitimacy_i|E][legitimacy|E]奖励。（只要[GetModifier('RICE_sicily_syracuse_restoration').GetNameWithTooltip][county_modifier|E]存在则一直有效。）"
 RICE_sicily_byzantine_syracuse_decision_context_tooltip:0 "#emphasis 历史背景：#!锡拉库萨是古地中海的大城市之一，西塞罗曾将其描述为“希腊最伟大、最美丽的城市”。而在东罗马早期，帝国失去非洲行省之后，锡拉库萨仍是重镇。甚至在公元663至669年期间，锡拉库萨甚至一度成为帝国的首都。而后穆斯林征服西西里岛，878年锡拉库萨的陷落，让西西里岛中心转移到了巴勒莫，虽然在此期间锡拉库萨仍然是岛上的一个主要城市，但它再也没有恢复以前的卓越地位。"
 RICE_sicily_catania_elephant_decision:0 "选定乌·利奥特罗大象为[GetTitleByKey('b_catania').GetNameNoTierNoTooltip]标志"
 RICE_sicily_catania_elephant_decision_tooltip:0 "深受广大[GetTitleByKey('b_catania').GetNameNoTierNoTooltip]市民喜爱的#italic 乌·利奥特罗#!大象雕像值得尊重！"
 RICE_sicily_catania_elephant_decision_desc:0 "随着[GetTitleByKey('b_catania').GetNameNoTier]地位水涨船高，其公民们强烈要求有一个合适的标志来代表他们。他们中的许多人认为存在了几个世纪的#italic “乌·利奥特罗”#!大象雕像是一个不错的选择。"
 RICE_sicily_catania_elephant_decision_confirm:0 "大家都在赞美大象！"
 RICE_sicily_catania_elephant_decision_context_tooltip:0 "#emphasis 历史背景：#!#italic “乌·利奥特罗”#!大象雕像是卡塔尼亚的著名标致。这个名字来源于赫利奥多罗斯的音译，八世纪的卡塔尼亚的赫利奥多罗斯在同时期被指控为巫师并修炼死灵法术，在被卡塔尼亚的圣利奥击败之前，曾对其施展法术。 阿拉伯人称卡塔尼亚为“大象之城”，曾在西西里国王罗杰二世宫廷工作过的地理学家穆罕默德·伊德里西认为雕像是迦太基人或罗马人制作的，卡塔尼亚人认为雕像具有魔力，能够保护他们免受埃特纳火山爆发的伤害。1239年，这座雕像被选为城市的标志，后毁于地震，雕像于1737年被改建为喷泉。"
