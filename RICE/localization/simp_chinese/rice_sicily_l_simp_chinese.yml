 game_concept_RICE_sicily_struggle_adjective:1 "西西里争雄"
 game_concept_RICE_sicily_struggle_short:1 "西西里争雄"
 game_concept_RICE_sicily_struggle:1 "西西里争雄"
 game_concept_RICE_sicily_struggle_desc:2 "$game_concept_RICE_sicily_struggle$是一个反复进行的[struggle|E]，重现了南意大利在数百年间政治、文化与宗教的激烈变迁。南意大利正处于[sicily_three_worlds|E]的交汇之地：[sicily_latin|E][sicily_latin_dominance_i|E]世界、[sicily_greek|E][sicily_greek_dominance_i|E]世界，以及[sicily_arabic|E][sicily_arabic_dominance_i|E]世界。\n\n在这个身份、信仰和忠诚界限模糊的动荡边疆，[struggle_involved|E]的[rulers|E]会获得[GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )][trait|E]，象征他们与[sicily_three_worlds|E]的深厚关联。同时，[sicily_three_worlds|E]的影响力则通过[sicily_dominance|E]展现。\n\n[struggle|E]的进程在[struggle_phase_sicily_borderland_simple|E]与[struggle_phase_sicily_colony_simple|E][struggle_phase_phases|E]之间不断更替，并可能在[struggle_phase_sicily_periphery_simple|E]或[struggle_phase_sicily_imperial_simple|E]阶段暂时终结。然而，[struggle|E]可以再度掀起。因此，要想彻底结束这场[struggle|E]，必须通过[decisions|E]，将这片边疆转化为$RICE_sicily_struggle_ending_dominion_decision$或$RICE_sicily_struggle_ending_crossroads_decision$。"
 game_concept_struggle_phase_sicily_borderland_simple:1 "边疆之地"
 game_concept_struggle_phase_sicily_borderland:1 "边疆之地阶段"
 game_concept_struggle_phase_sicily_borderland_desc:1 "西西里存在着不同的[faiths|E]、[cultures|E]和[realms|E]，许多野心之辈在此地大动兵戈。无论[rulers|E]出身何方，只要强大且有能力都可以把[GetGeographicalRegion('custom_sicily').GetName]变成一个繁荣地区从而进入[struggle_phase_sicily_colony_simple|E]。若是战争持续不断有可能使该地区遭受彻底破坏，并将这片昔日繁荣的土地变成[sicily_three_worlds|E]之间的[struggle_phase_sicily_periphery_simple|E]。"
 game_concept_struggle_phase_sicily_colony_simple:1 "定居移民"
 game_concept_struggle_phase_sicily_colony:1 "定居移民阶段"
 game_concept_struggle_phase_sicily_colony_desc:1 "临近的大国虽试图安定西西里岛，但其仍易受内外纷争的波及，若不能稳固此地，必将引来贪婪的入侵者，助长当地军阀之势，使[GetGeographicalRegion('custom_sicily').GetName]沦为[sicily_three_worlds|E]的[struggle_phase_sicily_borderland_simple|E]。"
 game_concept_struggle_phase_sicily_periphery_simple:1 "边缘地带"
 game_concept_struggle_phase_sicily_periphery:1 "边缘地带阶段"
 game_concept_struggle_phase_sicily_periphery_desc:1 "延绵不断的战争破坏了西西里岛，使[GetGeographicalRegion('custom_sicily').GetName]成为一片废墟，也许有一天，一位雄心勃勃的[ruler|E]会重建这片被[sicily_three_worlds|E]撕裂的土地。"
 game_concept_struggle_phase_sicily_imperial_simple:1 "帝国荫庇"
 game_concept_struggle_phase_sicily_imperial:1 "帝国荫庇阶段"
 game_concept_struggle_phase_sicily_imperial_desc:1 "西西里与一个竭力剥削其资源并依赖其战略位置的大都会息息相关。然而，这种局面终究难以长久维持，因其暗藏的不稳定因素随时可能爆发；当下的统一或将再度瓦解，随着近远方雄心勃勃的[rulers|E]们争夺对[GetGeographicalRegion('custom_sicily').GetName]的掌控，局势愈发紧张。"
 game_concept_sicily_expedition_s:1 "西西里远征"
 game_concept_sicily_expeditions:1 "西西里远征"
 game_concept_sicily_expedition:1 "西西里远征"
 game_concept_sicily_expedition_desc:1 "在[struggle_phase_sicily_borderland|E]期间，在[RICE_sicily_struggle|E]中[struggle_involved|E][rulers|E]可以请求离[RICE_sicily_struggle_short|E]地区不太远的外国[rulers|E]帮助其对抗[RICE_sicily_struggle|E]中的对手，具体是通过特殊的[interaction|E]请求他们对对手发动[war|E]。如果外国[ruler|E]获胜，其会获得领土，或让其中一位[courtiers|E]成为新的[ruler|E]。\n\n你甚至可以请求其他[faiths|E]的[rulers|E]这样做，不过成功率不大，若是支付[gold|E]或提供军事援助会增加外国[ruler|E]同意的概率。\n\n如果外国[ruler|E]属于[RICE_sicily_struggle|E]中[sicily_latin|E]、[sicily_greek|E]或[sicily_arabic|E][sicily_worlds|E]的一员，远征成功也会使目标领地获得一个[sicily_stronghold|E]。"
 game_concept_sicily_grain_short:1 "谷物"
 game_concept_sicily_grain:1 "西西里的谷物"
 game_concept_sicily_grain_desc:1 "从古典时代直至中世纪，西西里岛一直是地中海世界著名的粮仓，这种经济上影响当然的在政治上有所体现。[rulers|E]可以采取一些与此相关的[interactions|E]。\n\n如果[rulers|E]在#italic 西西里岛#!上至少拥有一个[county|E]，就可以$RICE_sicily_give_wheat_shipments$给其他[rulers|E]，相反，西西里岛外的[rulers|E]也可以$RICE_sicily_request_wheat_shipments$。\n\n这些[interactions|E]会给双方带来各种收益，接受粮船方的[ruler|E]的[counties|E]会有正面[county_modifiers|E]，无论是接受或拒绝粮食交易都会对[ruler|E]的[counties|E]或[court|E]产生正面或负面的政治修正。"
 game_concept_sicily_strongholds_short:1 "据点"
 game_concept_sicily_stronghold_short:1 "据点"
 game_concept_sicily_strongholds:1 "西西里据点"
 game_concept_sicily_stronghold:1 "西西里据点"
 game_concept_sicily_stronghold_desc:1 "[RICE_sicily_struggle_adjective|E]据点是一种特殊[county_modifiers|E]，是与[RICE_sicily_struggle|E][struggle|E]相关的机制。据点本身代表当地的权力中心、军事重地和各个族群的残余根据地，它们本身没有任何直接加成，但可以解锁[decisions|E]、触发事件等等。\n\n据点的分属均能与[RICE_sicily_struggle_short|E]中[sicily_three_worlds|E]之一相对应：[sicily_latin|E][sicily_worlds|E]风格、[sicily_greek|E][sicily_worlds|E]风格和[sicily_arabic|E][sicily_worlds|E]风格。\n\n而且西西里据点可以通过[decision|E]解锁招募其所属[sicily_world|E]的士兵，但它们也可能导致[control|E]和[development|E]下降。为了避免后者，你可以通过$RICE_sicily_bargain_with_stronghold$[decision|E]来解决上述问题。"
 game_concept_sicily_dominance:1 "统治势力"
 game_concept_sicily_world:1 "世界"
 game_concept_sicily_worlds:1 "世界"
 game_concept_sicily_three_worlds:1 "三个世界"
 game_concept_sicily_three_worlds_desc:1 "历史上，中世纪的西西里受到[sicily_latin|E]、[sicily_greek|E]和[sicily_arabic|E]这“三个世界”的影响，在游戏中，它们分别用蓝色、紫色和绿色表示。\n\n三个世界的影响力体现在每个世界的#bold 统治势力#!，[rulers|E]不能直接改变统治势力数值，这些数值仅仅反映[RICE_sicily_struggle_short|E]中每个世界的[rulers|E]、[counties|E]或[RICE_sicily_struggle_short|E]的数量，以及[rulers|E]中[GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )][trait|E]的[trait_level_track_xp|E]。"
 game_concept_sicily_latin:1 "拉丁"
 game_concept_sicily_latin_dominance_i:1 "@RICE_sicily_latin_icon!"
 game_concept_sicily_latin_dominance:1 "拉丁统治势力"
 game_concept_sicily_latin_desc:1 "西方拉丁[sicily_world|E]象征着与#bold 西方欧洲#!相关的一切，涵盖人民、思想、信仰等，并涉及[RICE_sicily_struggle|E]中的其他元素。与东方希腊世界相对，即曾经属于罗马帝国的西部地区。\n\n要在游戏中被视为拉丁世界的一部分，[character|E]或[county|E]的[culture|E]必须来自属于$heritage_latin_name$、$heritage_frankish_name$或$heritage_iberian_name$[heritage|E]，或者信奉以$k_papal_state$为[head_of_faith|E]的[faith|E]。\n\n请注意，这些要求可能会因使用的修正不同而有所差异。此外，[ruler|E]有可能是多个世界的一部分。"
 game_concept_sicily_greek:1 "希腊"
 game_concept_sicily_greek_dominance_i:1 "@RICE_sicily_greek_icon!"
 game_concept_sicily_greek_dominance:1 "希腊统治势力"
 game_concept_sicily_greek_desc:1 "东方希腊[sicily_world|E]象征着与#bold 拜占庭#!相关的一切，涵盖人民、思想、信仰等，并涉及[RICE_sicily_struggle|E]中的其他元素。与西方拉丁世界相对，即曾经属于罗马帝国的东部地区。\n\n在游戏中，若要被视为东方希腊世界的一部分，[character|E]或[county|E]必须源自具有$heritage_byzantine_name$[heritage|E]的[culture|E]，或信奉以$k_orthodox$为[head_of_faith|E]的[faith|E]，或属于$hellenism_religion_adj$[religion|E]。\n\n请注意，根据所用模组的不同，这些要求可能会有所变动。此外，[ruler|E]可能同时归属于多个世界。"
 game_concept_sicily_arabic:1 "阿拉伯‑柏柏尔"
 game_concept_sicily_arabic_dominance_i:1 "@RICE_sicily_arabic_icon!"
 game_concept_sicily_arabic_dominance:1 "阿拉伯‑柏柏尔统治势力"
 game_concept_sicily_arabic_desc:1 "阿拉伯‑柏柏尔[sicily_world|E]涵盖该地区的人民、思想、信仰等，并涉及[RICE_sicily_struggle|E]中的其他元素。代表着#bold 伊斯兰#!或#bold 中东#!在[RICE_sicily_struggle|E]的势力。\n\n要在游戏中被视为阿拉伯‑柏柏尔世界的一部分，[character|E]或[county|E]的[culture|E]必须来自属于$heritage_berber_name$或$heritage_arabic_name$[heritage|E]，或者信奉$islam_religion_adj$、$amazigh_religion_adj$或$semitic_religion_adj$[religions|E]。\n\n请注意，这些要求可能会因使用的修正不同而有所差异。此外，[ruler|E]有可能是多个世界的一部分。"
 game_concept_sicily_frontier_raids:1 "边疆袭扰"
 game_concept_sicily_frontier_raid:1 "边疆袭扰"
 game_concept_sicily_frontier_raid_desc:1 "边疆袭扰是[RICE_sicily_struggle|E]中[struggle_involved|E][rulers|E]之间的一种特殊[war|E]类型，攻击方的目标是[siege|E]与[realm|E]接壤的特定敌方[county|E]。\n\n[war_leader|E]占领[war_target|E]会获得[gold|E]，其[war_target|E]则会失去[development|E]和[control|E]，[buildings|E]也可能被摧毁（占领方会额外获得更多[gold|E]），发生概率随着[development|E]和[siege|E][army|E]规模的增加而增加。在[occupying|E][war_target|E]后，进攻方将迅速获得[war_score|E]。\n\n虽然这个[casus_belli|E]与[iberian_struggle|E]中的[border_raid|E]类似，但区别是如果进攻方获胜，且他们来自[sicily_three_worlds|E]之一，那么目标[county|E]就有可能获得一个[sicily_stronghold_short|E]，反之，如果进攻方与[sicily_stronghold_short|E]不属于同一个[sicily_world|E]，[casus_belli|E]也有几率移除现有的[sicily_stronghold_short|E]。"
