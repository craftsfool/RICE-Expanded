 RICE_sicily_local_officials_victory:0 "受提拔且重用的当地官员"
 RICE_sicily_local_officials_victory_desc:0 "当地人最近拒绝领主派来的官员，并提出要求提拔当地人当选，而领主不仅接受了这一提议，还允许当地人以他们的名义统治这一地区。"
 RICE_sicily_local_officials_denied:0 "被拒绝的当地官员"
