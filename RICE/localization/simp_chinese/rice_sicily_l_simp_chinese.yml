 sicily.0150.t:0 "前往圣米迦勒圣所"
 sicily.0150.desc:0 "靠近[GetTitleByKey('b_vieste').GetNameNoTooltip]的加尔加诺岬是一处与圣米迦勒有着紧密联系的地方。多年来，成群结队的[christian.GetAdjective]朝圣者们前往那里朝拜大天使长。甚至不少前往如[GetTitleByKey('c_roma').GetNameNoTier]和[GetTitleByKey('c_jerusalem').GetNameNoTier]等地的朝圣队伍也会选择途径此处。\n\n如同许多虔诚的[faith.GetAdherentNamePlural]一般，我也准备前往那里的圣米迦勒圣所朝圣。"
 sicily.0150.a:0 "为了圣米迦勒的荣耀！"
 sicily.0151.t:0 "抵达"
 sicily.0151.desc:0 "我终于抵达了位于加尔加诺岬南坡的圣天使山镇，靠近[GetTitleByKey('b_vieste').GetNameNoTooltip]。很难想象，我会在这原本不起眼的小镇上，被形形色色的[christian.GetAdjective]朝圣者和旅人给包围了。\n\n现在，我们必须找个住的地方安顿下来。不过，我们很快就会出发前往圣米迦勒天使长圣殿，那里是通往著名石窟的入口，也是这次朝圣活动的重点。"
 sicily.0151.a:0 "傍晚了，该睡了。"
 sicily.0152.t:0 "进入石窟"
 sicily.0152.desc:0 "据传多年前，一个农夫丢了头牛。找了几小时，在一处山洞中找到了它。然而无论他做什么，甚至朝它射箭，它都纹丝不动。\n\n农夫觉得奇怪，便求助于当地主教。主教走进去，看到圣米迦勒显圣，旁边还有个祭坛。就这样，加尔加诺成了一处重要的朝圣地。\n\n今天，我也登临加尔加诺岬，来到了这座圣殿。"
 sicily.0152.a:0 "该去石窟里向圣米迦勒祷告了。"
 sicily.0153.t:0 "石窟"
 sicily.0153.desc:0 "岩洞是处宏伟之地。虽既非大教堂或城堡般直冲霄汉，也非大都会般广袤无垠。而是一处由上天，尤其是圣米迦勒赐福，灵能四溢、静谧玄妙之地。\n\n古时主教发现圣米迦勒显圣的地方摆放着圣坛。我脚下的地板被附近的圣泉浸湿，许多朝圣者拼命舔舐圣泉以求赐福 ；其他朝圣者也纷纷祭坛旁虔诚祷告，寻求救赎。\n\n我径直走向圣坛，屈膝，祈祷。"
 sicily.0153.a:0 "愿主赐我圣洁与健康"
 sicily.0153.a.toast:0 "圣米迦勒保佑你"
 sicily.0153.b:0 "愿主赐我勇气与力量"
 sicily.0153.b.toast:0 "$sicily.0153.a.toast$"
 sicily.0154.t:0 "离开石窟"
 sicily.0154.desc:0 "在祭坛上供后，我走出石窟，回到圣米迦勒天使长圣殿。我感觉自己脱胎换骨，全新的[ROOT.Char.GetWomanMan]诞生了——至少，我的同伴们是这么说的。\n\n世界各地都有圣米迦勒，但绝无一处能媲美加尔加诺岬！\n\n有幸踏足此地，这段回忆毕生难忘！"
 sicily.0154.a:0 "在这里歇歇脚后，我们将踏上返程。"
