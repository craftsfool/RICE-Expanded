 RICE_sicily_liber_pantegni_name:0 "医学全书"
 RICE_sicily_liber_pantegni_desc:0 "这是由学者兼医生[constantine.GetTitledFirstName]编纂的医学文本的抄本，被视作[constantine.GetHerHis]毕生杰作。作为有史以来最全面的医学著作之一，这部巨著汇集了古希腊时期及更晚近的伊斯兰医学成果，并并被翻译成[roman_culture.GetLanguage.GetName]，涵盖了从解剖学、外科手术、生理学和治疗学等诸多领域。"
 RICE_sicily_aspiration_constantine_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$作为[adventurer|E]留在[GetGeographicalRegion('world_europe_south_italy').GetName]，或在该[region|E]内拥有至少一个[county|E]\n$EFFECT_LIST_BULLET$在[GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )][trait|E]的@RICE_sicily_latin_icon![sicily_latin|E]路径上至少有#V 75点#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$在[GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )][trait|E]的@RICE_sicily_greek_icon![sicily_greek|E]和@RICE_sicily_arabic_icon![sicily_arabic|E]路径上至少有#V 50点#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$在[GetTrait('lifestyle_physician').GetName( GetNullCharacter )][trait|E]的[trait_level_track_xp|E]提升至#V 100#!\n$EFFECT_LIST_BULLET$完成至少#V 10#!次$RICE_sicily_constantine_the_african_decision$[decision|E]\n$EFFECT_LIST_BULLET$[piety_level|E]至少达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高，或[prestige_level|E]至少达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得#V 《医学全书》#![artifact|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$提升你的[education_trait|E]\n$EFFECT_LIST_BULLET$升级[GetModifier('RICE_sicily_constantine_the_african_modifier').GetNameWithTooltip][modifier|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$保持[GetReligionByKey('christianity_religion').GetAdjective][faith|E]（获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![piety|E]和@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![gold|E]）\n$EFFECT_LIST_BULLET$成为一位[landed|E][ruler|E]的[friend|E]或[best_friend|E]（获得一个[diplomacy_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$在[GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )][trait|E]的@RICE_sicily_latin_icon![sicily_latin|E]路径上达到#V 100点#![trait_level_track_xp|E]（获得一个[stewardship_lifestyle|E][perk|E]）"
 RICE_sicily_historical_aspiration_action_constantine:0 "#italic 你原本是来自非洲的商人，对意大利医学知识的匮乏感到忧虑，即便是在著名的萨莱诺医学院也是如此。不过你曾在故乡学习过一些医学知识，你毕生的使命便是在意大利传播希腊与伊斯兰的医学智慧。#!$RICE_sicily_aspiration_constantine_desc$"
