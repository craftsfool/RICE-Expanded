 RICE_sicily_palermo_tomb_visit_aristotle_desc:0 "$EFFECT_LIST_BULLET$获得[GetModifier('RICE_sicily_aristotle_tomb_visit').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_piety_gain')|0]#![piety|E]\n$EFFECT_LIST_BULLET$如果你有[GetTrait('calm').GetName( GetNullCharacter )]、[GetTrait('patient').GetName( GetNullCharacter )]、[GetTrait('erudite').GetName( GetNullCharacter )]或[GetTrait('theologian').GetName( GetNullCharacter )][traits|E]，则额外失去[stress_loss_i|E][stress|E]\n\n#weak 据说著名哲学家亚里士多德的棺材挂在[GetTitleByKey('c_palermo').GetNameNoTierNoTooltip]的一座大礼拜堂的木梁上。#!"
