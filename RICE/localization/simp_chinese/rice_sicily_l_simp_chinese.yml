 RICE_sicily_recruit_soldiers_choose_arabic_tooltip:0 "阿拉伯和柏柏尔氏族被敌人称为冷酷无情的撒拉森劫掠者，他们已在意大利南部扎根，谁若善待他们，他们就会为其效忠。"
