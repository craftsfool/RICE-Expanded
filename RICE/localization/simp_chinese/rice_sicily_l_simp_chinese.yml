 RICE_sicily_struggle_dominion_ender_name:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]之主"
 RICE_sicily_struggle_dominion_ender_desc:0 "位于地中海中心，这片大海文明的前哨，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]，它从未主宰过自己的命运，但上天垂青，让伟大的[struggle_ender.GetFirstName]平定四方，将其置于统治之下。"
 RICE_sicily_struggle_dominion_legend_chapter_opening_struggle:0 "数世纪以来，[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]纷争不断，无人问鼎。西方拉丁世界、东方希腊世界以及伊斯兰世界三方交锋，杀戮有时，医治有时，斗争与掠夺无止境也。而今，天生[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，[ROOT.Legend.GetProtagonist.GetHersHis]将一统西西里。"
 RICE_sicily_struggle_dominion_legend_chapter_motivation_struggle:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]眼看这边疆动荡不安，民不聊生，为何？只因西西里未得正主。"
 RICE_sicily_struggle_dominion_legend_chapter_famous_deed_generic:0 "可惜，说容易，做却难。古老的西西里，丰饶的西西里，养育当地人，吸引外来人，只看他们争执，乱为一团，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]必须结束这混乱时局，成为千古一君。"
 RICE_sicily_struggle_dominion_legend_chapter_extra_deed_struggle:0 "机略频出，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]令[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]诸军阀归于[ROOT.Legend.GetProtagonist.GetHerHis]麾下。精诚合作者，[ROOT.Legend.GetProtagonist.GetSheHe]怀诸侯，柔远人，齐归于[ROOT.Legend.GetProtagonist.GetHerHis]；冥顽不化者，[ROOT.Legend.GetProtagonist.GetSheHe]不遗一矢，伏炮机发，尽破之。"
 RICE_sicily_struggle_dominion_legend_chapter_conclusion_ended_struggle:0 "这虽非轻易之事，然最终，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]将那[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]归于一统，奠下了[ROOT.Legend.GetProtagonist.GetDynasty.GetName]之永世基业，赢得了[ROOT.Legend.GetProperty( 'culture' ).GetFlagName]与[ROOT.Legend.GetProperty( 'faith' ).GetFlagName]贵胄的忠诚归心。待至边疆安定，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]终得黎明初现，掌握其命运之缰。"
 RICE_sicily_struggle_crossroads_ender_name:0 "合纵连横[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]"
 RICE_sicily_struggle_crossroads_ender_desc:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]乃一片充满矛盾之地，虽身处地中海核心，却始终是诸文明的边陲之地。此地命运多舛，终至[struggle_ender.GetFirstName]驯服这荒凉边疆，将其化为繁荣交汇之所，方才掌握了自己的命运。"
 RICE_sicily_struggle_crossroads_legend_chapter_opening_struggle:0 "数世纪以来，[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]如同无尽的漩涡，牵动着诸方势力争夺，却无人能真正掌控。这片土地既为西方拉丁、东方希腊与伊斯兰世界的交汇点，亦为战火频仍的角斗场——时而和平共生，时而战火纷飞，冲突与掠夺如潮汐般交替上演。然而，这混乱的局面终因[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的降临而告终，其以智慧与力量，将这古老之土化为繁荣之枢纽，使昔日的战场重焕生机，万物俱兴。"
 RICE_sicily_struggle_crossroads_legend_chapter_motivation_struggle:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]目睹了这片边疆的动荡与无序，明白其如沉重枷锁，束缚了这片土地及其子民的进步与繁荣。[ROOT.Legend.GetProtagonist.GetSheHe]深知，唯有使[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]之人民充分展现其多样性之长，方能使这片家园焕发出应有的光辉与荣耀，迈向真正的昌盛。"
 RICE_sicily_struggle_crossroads_legend_chapter_famous_deed_generic:0 "尽管那历经战火蹂躏的边疆之地，欲使其重获新生，实属艰难之事，然[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]之滋生，却是地中海诸多势力与万千族群，共同砥砺之硕果。栖息于[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]之民——不论是外来侵略者，抑或古之居者，乃至其后裔——虽屡陷纷争之局，然[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]洞察此地之多元，知其为强盛之基。此多元之力，不仅维系民众之紧密纽带，亦使其与外界息息相通。是以，此博学睿智、远见卓识之[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，终成此地有史以来最伟大之君主。"
 RICE_sicily_struggle_crossroads_legend_chapter_extra_deed_struggle:0 "凭借[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]人民之间以及与地中海其他地区的经济、政治、文化和宗教网络，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]着手改造[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]。[ROOT.Legend.GetProtagonist.GetSheHe|U]倾注巨大的心力，派遣并接待外交官、商人、学者、工匠和农学家前往[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的各地统治者之处，以促进土地的耕作与全方位的繁荣。同时，[ROOT.Legend.GetProtagonist.GetSheHe|U]还大力推动与外部地区的贸易与外交关系，使得这一地区日益兴盛。"
 RICE_sicily_struggle_crossroads_legend_chapter_conclusion_ended_struggle:0 "此事绝非易举，然而在[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]那宛如明烛破暗的英明领导下，[ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]终于化为地中海的关键枢纽。此枢纽虽由[ROOT.Legend.GetProtagonist.GetDynasty.GetName]宗族所主导，并得[ROOT.Legend.GetProperty( 'culture' ).GetFlagName]与[ROOT.Legend.GetProperty( 'faith' ).GetFlagName]精英之鼎力相助，然此功德乃为全体居民所共享之无价珍宝。边疆既定，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]终迎来曙光初现之时，命运之舵已然掌握于己手。"
