 sicily.0060.t_alt_ME:0 "西西里的命运"
 sicily.0060.desc.muslim_alt_ME:0 "如今，[norman.GetNameNoTooltip]冒险者征服了南意大利的[greek.GetName]和[lombard.GetName]各城，而[roger.GetFirstNameNoTooltip]打算更进一步，为[roger.GetHerselfHimself]征服整个[GetGeographicalRegion('custom_sicily').GetName]。日薄西山的[spotlight_muslim.GetDynasty.GetName]诸邦摇摇欲坠，一些本地[GetReligionByKey('islam_religion').GetAdjective]已然放弃抵抗，短视地欢迎起[roger.GetFirstNameNoTooltip]，认为异教徒的稳定也好过混乱。\n\n然而，尽管影响已然式微，[spotlight_muslim.GetFirstNameNoTooltip]和他的父亲[zirid_father.GetFirstNameNoTooltip]在[roger.GetFirstNameNoTooltip]面前依然不屈不挠。人们不禁好奇岛屿的命运将会如何……"
 sicily.0060.desc.christian_alt_ME:0 "随着[al_thumna.GetFirstNamePossessiveNoTooltip]死去，岛屿无休的战事揭开了新篇章。对于[roger.GetFirstNameNoTooltip]来说，唯有整个岛屿都归于[GetReligionByKey('christianity_religion').GetAdjective]治下，秩序才算是得到重建——毫无疑问的是，这岛屿十分有利可图。\n\n许多异教徒仍高举着[spotlight_muslim.GetDynasty.GetName]的旗帜，在[zirid_father.GetFirstNameNoTooltip]和他的儿子[spotlight_muslim.GetFirstNameNoTooltip]麾下负隅顽抗。然而许多人已然欢迎[roger.GetFirstNamePossessiveNoTooltip]的到来，无论是因为他们认为[roger.GetFirstNameNoTooltip]能够稳定岛屿，或是因为他们乃是[roger.GetHerHis]死去的盟友[al_thumna.GetFirstNameNoTooltip]的忠实追随者。人们不禁好奇岛屿的命运将会如何……"
 sicily.0060.desc.fallback_alt_ME:0 "随着[al_thumna.GetFirstNamePossessiveNoTooltip]死去，这些雇佣兵兄弟试图为他们自己控制整个岛屿，为他们死去的朋友报仇或是趁虚而入……也许兼而有之。\n\n许多[GetReligionByKey('islam_religion').GetAdherentNamePlural]仍在虚弱的[spotlight_muslim.GetDynasty.GetName]王朝旗下坚持抵抗，他们担心到来的入侵者冷酷无情；然而许多其他居民——无论信仰如何——将这些[norman.GetCollectiveNounNoTier]视为和平与稳定的使者。人们不禁好奇岛屿的命运将会如何……"
