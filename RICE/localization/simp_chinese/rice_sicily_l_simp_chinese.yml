 RICE_sicily_struggle_ending_dominion_decision:0 "山河一统"
 RICE_sicily_struggle_ending_dominion_decision_tooltip:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]将成为一片繁盛的土地"
 RICE_sicily_struggle_ending_dominion_decision_desc:0 "长久以来，分裂使得[GetGeographicalRegion('custom_sicily').GetName]兵戈不止，盗匪横生。若想复兴这片血与蜜之地，非将这里一统于一个民族、一个信仰、一个旗帜之下不可！"
 RICE_sicily_struggle_ending_dominion_decision_confirm:0 "西西里归我们统治！"
