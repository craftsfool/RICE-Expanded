 activity_RICE_sicily_virgil_tomb_visit:0 "参观那波利隧道"
 activity_RICE_sicily_virgil_tomb_visit_desc:0 "有人说维吉尔不仅是一位伟大的诗人，还是一位创造奇迹的人，他奇迹般地开凿了#italic 那波利隧道#!"
