 RICE_sicily_recruit_soldiers_decision_desc:0 "动荡的西西里从来不乏善战之人，寻求财富的冒险者到保卫家园的当地老兵，只要薪酬管够，总有人愿意为像我这样的[rulers|E]而战。"
 RICE_sicily_recruit_soldiers_decision_confirm:0 "招募潜在新兵！"
 RICE_sicily_recruit_soldiers_decision_effect_tooltip_1:0 "拥有对应西西里[sicily_stronghold|E]将降低其成本并增加你将获得[men_at_arms|E]的数量"
 RICE_sicily_recruit_soldiers_decision_context_tooltip:0 "#emphasis 历史背景：#!中世纪的西西里是各民族与政体角力的舞台。因其多样性和部分势力的外来性，忠诚的界限常常模糊不清，种族与宗教的少数群体有时反而成为领主最狂热的支持者，因为他们依赖这些领主的庇护以免遭受多数群体的压迫。例如，穆斯林士兵忠诚地为西西里当权的国王效力，即便在13世纪被强制迁至卢切拉后依然如此。同样，在11世纪诺曼人初次入侵西西里时，当地的穆斯林与基督徒常与诺曼人保持着亦敌亦友的关系。"
