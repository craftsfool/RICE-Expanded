 RICE_sicily_stronghold_latin:0 "拉丁裔据点"
 RICE_sicily_stronghold_latin_desc:0 "[GetGeographicalRegion('custom_sicily').GetName]的部分地区是拉丁裔家园，他们居住在一处易守难攻的据点。无论他们是当地的多数派还是少数派，他们都会保卫自己的据点，也会发动袭击，甚至是针对他们的同教或同胞。\n\n#EMP $EFFECT_LIST_BULLET$为$RICE_sicily_recruit_soldiers_decision$[decision|E]解锁招募拉丁裔的选项，并使其更便宜\n$RICE_sicily_stronghold_decision_effect$\n$RICE_sicily_stronghold_trait_effect$\n$RICE_sicily_stronghold_frontier_raid_effect$\n$EFFECT_LIST_BULLET$增强[RICE_sicily_struggle|E]中的[sicily_latin_dominance|E]。\n（当前为[sicily_latin_dominance_i|E]#V [GetGlobalVariable('RICE_sicily_latin_dominance').GetValue|0]#!）"
 RICE_sicily_stronghold_greek:0 "希腊裔据点"
 RICE_sicily_stronghold_greek_desc:0 "[GetGeographicalRegion('custom_sicily').GetName]的部分地区是希腊裔家园，他们居住在一处易守难攻的据点。无论他们是当地的多数派还是少数派，他们都会保卫自己的据点，也会发动袭击，甚至是针对他们的同教或同胞。\n\n#EMP $EFFECT_LIST_BULLET$为$RICE_sicily_recruit_soldiers_decision$[decision|E]解锁招募希腊裔的选项，并使其更便宜\n$RICE_sicily_stronghold_decision_effect$\n$RICE_sicily_stronghold_trait_effect$\n$RICE_sicily_stronghold_frontier_raid_effect$\n$EFFECT_LIST_BULLET$增强[RICE_sicily_struggle|E]中的[sicily_greek_dominance|E]。\n（当前为[sicily_greek_dominance_i|E]#V [GetGlobalVariable('RICE_sicily_greek_dominance').GetValue|0]#!）"
 RICE_sicily_stronghold_arabic:0 "阿拉伯‑柏柏尔裔据点"
 RICE_sicily_stronghold_arabic_desc:0 "[GetGeographicalRegion('custom_sicily').GetName]的部分地区是阿拉伯‑柏柏尔裔家园，他们居住在一处易守难攻的据点。无论他们是当地的多数派还是少数派，他们都会保卫自己的据点，也会发动袭击，甚至是针对他们的同教或同胞。\n\n#EMP $EFFECT_LIST_BULLET$为$RICE_sicily_recruit_soldiers_decision$[decision|E]解锁招募阿拉伯‑柏柏尔裔的选项，并使其更便宜\n$RICE_sicily_stronghold_decision_effect$\n$RICE_sicily_stronghold_trait_effect$\n$RICE_sicily_stronghold_frontier_raid_effect$\n$EFFECT_LIST_BULLET$增强[RICE_sicily_struggle|E]中的[sicily_arabic_dominance|E]。\n（当前为[sicily_arabic_dominance_i|E]#V [GetGlobalVariable('RICE_sicily_arabic_dominance').GetValue|0]#!）"
 RICE_sicily_stronghold_latin_negotiations:0 "与拉丁裔据点谈判"
