 sicily.0050.t:0 "粮船"
 sicily.0050.desc:0 "我已下令将我在[GetGeographicalRegion('custom_sicily').GetName]的大批粮食运送给[recipient.GetTitledFirstName]，以示善意。毕竟，这片沃土出产的丰饶农物向来为外邦所垂涎，我深信[recipient.GetSheHe]定会对此心存感激。\n\n总而言之，这批粮食应很快便能送达。"
 sicily.0050.a:0 "这是[recipient.GetFirstNameNoTooltip]无法拒绝的提议！"
 sicily.0051.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 sicily.0051.desc:0 "请您收下这批来自我的[GetGeographicalRegion('custom_sicily').GetName]的粮食。不论我们之间存有何种分歧，我希望这些粮食能滋养您的民众，减轻他们的苦难。如此慷慨的馈赠，我相信您不会拒之门外。"
 sicily.0051.a:0 "这确实是我无法拒绝的提议！"
 sicily.0052.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 sicily.0052.desc:0 "虽然我非常感激您愿意将来自[GetGeographicalRegion('custom_sicily').GetName]的粮食送给我的臣民，但目前我们不得不婉谢您的好意。我不愿让我的人民过于依赖外援，想必您能理解我的立场。"
 sicily.0052.a:0 "我还觉得这提议[actor.GetSheHe]不会拒绝呢！"
 sicily.0053.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 sicily.0053.desc:0 "我非常高兴能将我在[GetGeographicalRegion('custom_sicily').GetName]的粮食送予您。十分感谢您的黄金，这批粮食应很快就会抵达。"
 sicily.0053.a:0 "棒极了！"
 sicily.0054.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 sicily.0054.desc:0 "非常感谢您同意从您在[GetGeographicalRegion('custom_sicily').GetName]领地运送粮食到我的领地。我的子民对您的慷慨深表感激，铭记于心。"
 sicily.0054.a:0 "很高兴听到粮船安然到港的消息。"
 sicily.0055.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 sicily.0055.desc:0 "虽然我十分感激您提供的黄金，但实在抱歉，我无法从我的[GetGeographicalRegion('custom_sicily').GetName]领地调运粮食。这些粮食已有他用，相信您会理解我的处境。"
 sicily.0055.a:0 "我还觉得这提议[recipient.GetSheHe]不会拒绝呢！"
