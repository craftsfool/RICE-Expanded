 sicily.0182.b:0 "我很乐意赞助这样一位诗人！"
 sicily.0182.info:0 "#emphasis 历史背景：#!伊本·哈姆迪斯（1050~1130年）是一位穆斯林诗人，来自西西里岛的锡拉库扎，被认为是当时最伟大的诗人之一，精通阿拉伯语。1072年诺曼人征服后，他逃离出西西里。他一生受到不同统治者的庇护，包括北非和安达卢西亚的统治者。他诗歌的一个共同主题是对故土的怀念。"
