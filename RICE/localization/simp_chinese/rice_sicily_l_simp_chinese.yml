 activity_RICE_sicily_virgil_tomb_visit_context_tooltip:0 "#emphasis 历史背景：#!#italic 那不勒斯隧道#!是一条古罗马隧道，中世纪传说中，是古罗马诗人维吉尔创造的，他用魔法建造了这条隧道，而且据说他的坟墓就在隧道附近。由于这条隧道和所谓的陵墓被当作礼拜场所而广为流传，甚至受到基督徒的追捧，许多人慕名前去参观。"
