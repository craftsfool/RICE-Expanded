 RICE_sicily_dominion_outsider:0 "外来势力统治"
 RICE_sicily_dominion_outsider_desc:0 "在[RICE_sicily_struggle|E]中外来势力将[sicily_latin|E]势力、[sicily_greek|E]势力和[sicily_arabic|E]势力击溃成为统治者，使该[county|E]成为西西里的新中心。"
 RICE_sicily_dominion_outsider_capital_modifier:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的外来势力权力中心"
 RICE_sicily_dominion_outsider_capital_modifier_desc:0 "[RICE_sicily_struggle|E]中外来势力击败[sicily_latin|E]势力、[sicily_greek|E]势力和[sicily_arabic|E]势力成为胜者，使得这一地区成为新的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]中心。"
 RICE_sicily_crossroads_victory_modifier:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]十字要道之主"
 RICE_sicily_crossroads_victory_modifier_desc:0 "该[dynasty|E]是[RICE_sicily_struggle|E]中的一霸，并通过开明统治在整个地中海地区建立经济、文化和政治联系，为这片血与蜜之地带来了秩序和稳定。"
 RICE_sicily_crossroads_county_modifier:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]交汇点"
 RICE_sicily_crossroads_county_modifier_desc:0 "曾经动荡的西西里已发展成为地中海中心，这也让该[county|E]从日益增长的经济、文化和政治联系中获益。"
 RICE_sicily_crossroads_capital_modifier:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]交汇中心"
 RICE_sicily_crossroads_capital_modifier_desc:0 "西西里被改造成地中海重要交汇处后，该地区成为新的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]中心和枢纽。"
 RICE_sicily_crossroads_victory_ruler_modifier:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]交汇处领主"
 RICE_sicily_crossroads_victory_ruler_modifier_desc:0 "该角色是[RICE_sicily_struggle|E]中与[sicily_arabic|E]世界密切相连的[ruler|E]，当前过渡时期[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]正转变为地中海的十字要道。"
 RICE_sicily_second_pavia_character_modifier:0 "建立第二帕维亚"
