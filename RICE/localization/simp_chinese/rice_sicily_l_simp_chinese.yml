 sicily.0181.t:0 "[ROOT.Char.Custom('RICE_sicily_ayo_visto_lo_mappamundi_song_name')]"
 sicily.0181.desc:0 "最近，一首名为[ROOT.Char.Custom('RICE_sicily_ayo_visto_lo_mappamundi_song_name')]的民谣在[GetGeographicalRegion('custom_sicily').GetName]全境广为传唱。这首歌的歌词对[alfonso.GetTitledFirstName]治下[GetGeographicalRegion('custom_sicily').GetName]的赞美之词溢于言表。\n\n的确，这首歌在我的宫廷内也大受欢迎。"
 sicily.0181.desc.copy:0 "我甚至有幸得到了此歌手抄副本。"
 sicily.0181.desc.lyrics:0 "\n\n这首歌开头是这样的：\n\n#italic 快来看那海图哩，\n就在那航海家包里。\n美丽的西西里呀，\n与我同高的西西里呀！#!"
 sicily.0181.a:0 "天籁赠仙境。"
 sicily.0181.info:0 "#emphasis 历史背景：#!#italic 《世界如我所见》#!是一首阿拉贡的阿方索五世统治南意大利时期，其西西里宫廷中脍炙人口的民谣。\n\n这首歌是对佛罗伦萨诗人费奥·贝尔卡里（1410‑1484）创作的劳达（中世纪和文艺复兴时期意大利的一种方言宗教歌曲）的戏仿，两首歌曲调相同。歌词提及了其他美丽的土地，但都没有给叙述者留下像西西里那样深刻的印象。歌词中还巧妙地运用了西西里和塞西莉亚之间的双关语，后者既指圣塞西莉亚，也指叙述者的爱人。\n\n西班牙作曲家胡安·科尔纳戈（约1400‑1475）根据这首歌的曲调创作了一首弥撒曲，这是我们了解这首歌原始旋律的唯一来源，学者们最近才重现了这首歌的原版，可以前往b站搜索牛奶上传（关键词：世界如我所见）的视频聆听。"
 sicily.0182.t:0 "伊本·哈姆迪斯"
 sicily.0182.desc:0 "一位著名诗人和学者#bold 伊本·哈姆迪斯#!从[GetGeographicalRegion('RICE_insular_sicily').GetName]前来，并请求与我会面，可能他认为我可能会成为一个很好的赞助人，毕竟我爱好科学与艺术的名声在外。"
 sicily.0182.a:0 "我不需要他这样的诗人。"
 sicily.0183.t:0 "伊本·哈姆迪斯"
 sicily.0183.desc:0 "才华横溢的伊本·哈姆迪斯给我留下了深刻的印象，他出口成章，文采飞扬。\n\n这位诗人多年前出生在[GetGeographicalRegion('custom_sicily').GetName]，但[norman.GetCollectiveNoun]来后不得不离开故土。我们今天会面时，他只朗诵了他的一小部分诗歌，其中很多都表达了故土的思念，在他看来，这片土地曾经是[GetReligionByKey('islam_religion').GetName]的天堂。\n\n若有如此一人在我的宫廷里，显然会提升我在世界中的地位。"
 sicily.0183.a:0 "欢迎，欢迎！"
