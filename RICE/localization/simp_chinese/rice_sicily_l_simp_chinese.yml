 activity_RICE_sicily_monte_gargano_pilgrimage:0 "加尔加诺岬朝圣"
 activity_RICE_sicily_monte_gargano_pilgrimage_desc:0 "圣米迦勒天使长圣殿是数个世纪朝圣者的目的地，它作为[GetReligionByKey('christianity_religion').GetName]中最古老的朝圣地之一，吸引了远近的信徒来此。"
 RICE_sicily_monte_gargano_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!相传公元5世纪，加尔加诺附近的一位农民丢失了一头公牛，不过他最终在一个洞穴旁发现了这头公牛，但公牛却纹丝不动，他不得不寻求当地主教的帮助，主教发现了公牛是圣米迦勒的显灵，于是围绕着山洞建造了圣米迦勒天使长圣殿，随后成为了基督教朝圣的重要地点，尤其是对于一波波陆续来到意大利南部的伦巴第人和诺曼人。随着对圣米迦勒的崇拜在中世纪日益盛行，加尔加诺的圣所成为了供奉圣米迦勒建筑网的一部分，其中最著名的除了加尔加诺，还有法国北部的圣米歇尔山。"
 activity_RICE_sicily_monte_gargano_pilgrimage_selection_tooltip:0 "前往[GetTitleByKey('c_foggia').GetNameNoTier]中的大天使米迦勒圣殿朝圣\n\n$RICE_sicily_monte_gargano_pilgrimage_context_tooltip$"
