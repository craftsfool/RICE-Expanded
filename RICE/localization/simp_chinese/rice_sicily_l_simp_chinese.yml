 sicily.0100.t:0 "提拔[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的官员"
 sicily.0100.desc:0 "作为[GetGeographicalRegion('custom_sicily').GetName]的[ROOT.Char.GetTitleAsNameNoTooltip]，我依赖众多地方官员来辅佐治理疆土。岁月流转，部分官员以卓越表现赢得了我的信赖，将他们擢升至宫廷，成为我的左膀右臂，实乃对他们忠诚与勤勉的公正回报。\n\n我的臣僚来自五湖四海，甚至不乏异国他乡之士。擢升他们，不仅彰显了我的胸襟广阔，亦是巩固与各族群关系的明智之举。\n\n至于此次提拔，我该提拔哪些族裔？"
 sicily.0100.a:0 "[sicily_latin_dominance_i|E]拉丁裔"
 sicily.0100.b:0 "[sicily_greek_dominance_i|E]希腊裔"
 sicily.0100.c:0 "[sicily_arabic_dominance_i|E]阿拉伯‑柏柏尔裔"
 sicily.0100.d:0 "[ROOT.Char.GetCulture.GetNameNoTooltip]"
 sicily.0101.t:0 "$sicily.0100.t$"
 sicily.0101.desc:0 "在提拔来自[GetGeographicalRegion('custom_sicily').GetName]的官员时，我应当充分考量他们的专长与才能。毕竟，这不仅是为了他们职业生涯的发展，更是为了弥补我在治理中的短板，确保政务的顺利推进。\n\n那么，我该寻求哪方面的人才呢？"
 sicily.0101.a:0 "[diplomacy_i|E]外交"
 sicily.0101.b:0 "[martial_i|E]军事"
 sicily.0101.c:0 "[stewardship_i|E]管理"
 sicily.0101.d:0 "[intrigue_i|E]谋略"
 sicily.0101.e:0 "[learning_i|E]学识"
 sicily.0102.t:0 "$sicily.0100.t$"
 sicily.0102.desc:0 "我的宫廷已经确认了两名符合我之前要求的[sicily_culture.GetName]官员，他们分别是[official_1.GetFullName]和[official_2.GetFullName]，两人都展现出了晋升的巨大潜力。\n\n当然，如果资源允许，我完全可以同时提拔他们，充分利用他们的才能为我所用。"
 sicily.0102.a:0 "提拔[official_1.GetFirstNameNoTooltip]"
 sicily.0102.b:0 "提拔[official_2.GetFirstNameNoTooltip]"
 sicily.0102.c:0 "提拔两位候选人"
 sicily.0103.t:0 "更新[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的官僚文书"
 sicily.0103.desc:0 "在[GetGeographicalRegion('custom_sicily').GetName]这个动荡不安的边疆地区，保持良好的行政档案实属不易——这些档案可能会遗失、被毁，甚至遭人篡改。\n\n因此，我的官员们需要定期更新我们在[GetGeographicalRegion('custom_sicily').GetName]领地内的各类档案，包括遗嘱、财产契约、贵重物品的购买记录等。\n\n我的[councillor.GetCouncilTitle][councillor.GetFirstName]正在协助这一工作，并建议我们借用该地区的拉丁人、希腊人或阿拉伯‑柏柏尔人的档案进行整理，以提高工作效率，确保信息的准确性与可靠性。"
 sicily.0103.a:0 "基于拉丁人档案"
 sicily.0103.b:0 "基于希腊人档案"
 sicily.0103.c:0 "基于阿拉伯‑柏柏尔人档案"
 sicily.0104.t:0 "改革[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的政府"
 sicily.0104.desc:0 "[GetGeographicalRegion('custom_sicily').GetName]几个世纪以来一直是多民族杂居之地。那里的官员们常常沿袭前人留下来的各种行政习惯，呈现出一种混杂的状态。\n\n然而，有时我们需要对[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的行政管理进行改革。我的[councillor.GetCouncilTitle][councillor.GetFirstName]，经过仔细调查后，已经找到了三个可能为我们的行政改革提供灵感的来源：\n"
 sicily.0104.desc.latin:0 "\n$EFFECT_LIST_BULLET$[latin_ruler.GetFullName]的拉丁行政规程"
 sicily.0104.desc.no_latin:0 "\n$EFFECT_LIST_BULLET$[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]中拉丁社群的历史成例"
 sicily.0104.desc.greek:0 "\n$EFFECT_LIST_BULLET$[greek_ruler.GetFullName]的希腊行政规程"
 sicily.0104.desc.no_greek:0 "\n$EFFECT_LIST_BULLET$[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]中希腊社群的历史成例"
 sicily.0104.desc.arabic:0 "\n$EFFECT_LIST_BULLET$[arabic_ruler.GetFullName]的阿拉伯‑柏柏尔行政规程"
 sicily.0104.desc.no_arabic:0 "\n$EFFECT_LIST_BULLET$[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]中阿拉伯‑柏柏尔社群的历史成例"
 sicily.0104.a:0 "@RICE_sicily_latin_icon!基于拉丁成法进行改革"
 sicily.0104.b:0 "@RICE_sicily_greek_icon!基于希腊成法进行改革"
 sicily.0104.c:0 "@RICE_sicily_arabic_icon!基于阿拉伯‑柏柏尔成法进行改革"
 sicily.0105.t:0 "筑防[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]"
 sicily.0105.desc:0 "像[GetGeographicalRegion('custom_sicily').GetName]这样的地区，历来动荡不安，且是各方势力争夺的焦点。因此，我的领地必须具备足够的能力，防范任何捣乱者的攻击和突袭。\n\n近日，我指示官员们与当地社区密切合作，增强我们在[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的防御。通过这些努力，我们那里的定居点将更为坚固，从而更好地抵御外敌入侵。"
 sicily.0105.desc.soldier:0 "\n\n此外，似乎我们的努力已初见成效。我的官员接触到了一位当地颇有声望的[sicily_culture.GetName]士兵，名叫[soldier.GetFullName]，愿意来到我的宫廷效力，协助我处理军事事务，进一步加强领内的防御力量。"
 sicily.0105.a:0 "我们将保护自己，不惧任何威胁！"
 sicily.0106.t:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的艺术和科学"
 sicily.0106.desc:0 "[GetGeographicalRegion('custom_sicily').GetName]几世纪以来一直是各族文化和传统的交汇点。在这里，艺术与科学得以蓬勃发展——前提是有一位开明的统治者愿意支持这些事业。\n\n我自认为是一位开明的[ROOT.Char.GetTitleAsNameNoTooltip]，因此已计划从国库中拨出更多资金，资助那些博学多才且富有文化的人，并邀请他们来到我的宫廷。\n\n不过，博闻饱学之士自四面八方而来。我应当充分利用[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]内现有的网络，吸引特定的艺术家和学者前来，共同繁荣这一文化盛世……"
 sicily.0106.a:0 "@RICE_sicily_latin_icon!吸引拉丁艺术家和学者"
 sicily.0106.b:0 "@RICE_sicily_greek_icon!吸引希腊艺术家和学者"
 sicily.0106.c:0 "@RICE_sicily_arabic_icon!吸引阿拉伯‑柏柏尔艺术家和学者"
 sicily.0106.tooltip:0 "$RICE_sicily_frontier_agenda_arts_and_sciences_effect_tt_3$"
 sicily.0107.t:0 "在[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的[sicily_culture.GetNameNoTooltip]学者"
 sicily.0107.desc:0 "我在[GetGeographicalRegion('custom_sicily').GetName]推动学术与文化发展的努力已见显著成效，甚至引起了一位名叫[scholar.GetFullName]的学者的关注。\n\n这位博学的[sicily_faith.GetAdjective][sicily_culture.GetName]学者来自[county.GetNameNoTier]，听闻我的政策后，特意造访我的宫廷，并对所见所闻深感佩服（或至少[scholar.GetSheHe]表现得极为赞赏）。\n\n虽然最初有些波折，但我最终成功说服[scholar.GetHerHim]暂时留在此地。[scholar.GetFirstNamePossessiveNoTooltip]的智慧必将成为我们的一大助力。"
 sicily.0107.a:0 "欢迎到新家！"
 sicily.0108.t:0 "改进带式装载港口"
 sicily.0108.desc:0 "自古以来，谷物一直是西西里岛的重要出口商品。多年来，这里逐渐形成了一种名为#italic 带式装载港口#!的特殊港口系统，专门负责集中分配和将谷物出口至国际市场。\n\n鉴于谷物贸易对西西里的重要性，像我这样有远见的统治者，必须不断投资于这些港口的维护和改进，正如我最近所做的那样。\n\n这不仅是保障经济命脉的必要之举，更是我与参与这项贸易的外国商人及其国家建立联系的绝佳契机。"
 sicily.0108.a:0 "@RICE_sicily_latin_icon!鼓励同拉丁人的贸易"
 sicily.0108.b:0 "@RICE_sicily_greek_icon!鼓励同希腊人的贸易"
 sicily.0108.c:0 "@RICE_sicily_arabic_icon!鼓励同阿拉伯‑柏柏尔人的贸易"
 sicily.0109.t:0 "移民[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]"
 sicily.0109.desc:0 "作为一个长期以来的边疆，[GetGeographicalRegion('custom_sicily').GetName]充满了活力，虽然有时不免显得不太稳定，但对于那些愿意在此定居的人而言，这里蕴藏着无尽的机遇。几个世纪以来，人们从地中海各地，甚至更远的地方，纷纷涌向这片土地。\n\n为了扩大我的权威并发展[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的经济，我决定推行一项政策，鼓励来自远方的移民在此定居。\n\n虽然这些移民的数量不多，可能永远无法与当地居民相比，但他们的到来必将为这一地区注入新的活力，带来无限的可能。"
 sicily.0109.a:0 "邀请拉丁移民"
 sicily.0109.b:0 "邀请希腊移民"
 sicily.0109.c:0 "邀请阿拉伯‑柏柏尔移民"
 sicily.0109.d:0 "邀请[ROOT.Char.GetCulture.GetNameNoTooltip]移民"
