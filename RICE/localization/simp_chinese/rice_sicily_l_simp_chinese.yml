 sicily.0060.t:0 "西西里的泰法们"
 sicily.0060.desc:0 "多年前，[kalbid.GetFirstName]逝世后，[kalbid.GetDynasty.GetName]王朝失去了对[GetGeographicalRegion('custom_sicily').GetName]的控制，岛上局势随之陷入混乱，[GetReligionByKey('islam_religion').GetAdjective]军阀们为争夺这片丰饶之地展开了激烈的斗争。\n\n在这些被称为#italic 泰法#!的诸侯之间，战火愈演愈烈，无休止的纷争撕裂了这片土地。其中一位军阀，[al_thumna.GetFullName]，不得不求助于由两兄弟[robert.GetFirstName]和[roger.GetFirstName]领导的[norman.GetName]雇佣兵。\n\n"
 sicily.0060.desc.muslim:0 "如今，这些[norman.GetNameNoTooltip]冒险者试图重演他们在意大利南部对[greek.GetName]与[lombard.GetName]诸城的征服，因[roger.GetFirstNameNoTooltip]意图将整个[GetGeographicalRegion('custom_sicily').GetName]纳入自己的版图。一些厌倦战火的[GetReligionByKey('islam_religion').GetAdjective]当地人，目光短浅地欢迎[roger.GetHerHim]的到来，认为在异教徒的统治下，至少能换来一时的安定，胜过眼前的动荡。\n\n然而，亦有勇者挺身而出，誓死抵抗[roger.GetFirstNameNoTooltip]的侵略，比如强大的[benavert.GetFirstNameNicknamed]。不禁令人深思，这座岛屿的命运究竟会如何演变……"
 sicily.0060.desc.christian:0 "随着[al_thumna.GetFirstNamePossessiveNoTooltip]的去世，岛上的无休止战争进入了新的阶段。对于[roger.GetFirstNameNoTooltip]而言，唯有将整个岛屿纳入[GetReligionByKey('christianity_religion').GetAdjective]的统治之下，方能恢复秩序——更何况，这片土地还蕴藏着无尽的财富。\n\n一些异教徒仍在奋力抵抗[norman.GetCollectiveNounNoTooltip]的侵略，如[benavert.GetFirstNameNicknamed]，但也有些人出于不同的动机欢迎[roger.GetFirstNamePossessiveNoTooltip]的到来。有些是因为他们相信[roger.GetFirstNameNoTooltip]能够使岛屿重获安定，有些则因忠于[roger.GetHerHis]已故的盟友[al_thumna.GetFirstNameNoTooltip]而选择支持。不禁让人深思，这座岛屿的命运将如何演变……"
 sicily.0060.desc.fallback:0 "[al_thumna.GetFirstNamePossessiveNoTooltip]逝去后，这对雇佣兵兄弟图谋独霸全岛。不论是为亡友复仇，还是趁机中饱私囊，抑或两者皆然，他们皆抱定决心，誓以不择手段达成所愿。\n\n虽有[GetReligionByKey('islam_religion').GetAdjective]统治者，尤其是[benavert.GetFirstNameNicknamed]，竭力抗拒外敌，岛上众多居民也因畏惧这些冷酷的侵略者而心生怨惧；但亦有些岛民——不分信仰——视这些[norman.GetCollectiveNounNoTier]为带来和平与稳定的希望之光。岛屿的命运，究竟将走向何方，令人不禁掩卷沉思……"
 sicily.0060.a:0 "这个三大世界交汇的岛屿上，下一幕会上演什么？"
 sicily.0060.tooltip:0 "#emphasis 历史背景：#!尽管卡勒卜埃米尔国早已衰败，但其在公元1040年的崩溃还是预示着穆斯林统治下的西西里陷入新的内战与割据的乱局。与伊比利亚半岛有些#italic 泰法#!发展为繁荣的区域中心不同，西西里的#italic 泰法#!却势弱难支，难以独立掌控局势，只得依赖外部力量以对抗群雄，北非的齐里德王朝便在数十年间频频干涉西西里的政局。\n\n在这样的背景下，锡拉库萨的统治者伊本·提姆纳于公元1061年向诺曼人寻求军事援助，此举并不显得过于反常。然而，提姆纳在1062年辞世，使得诺曼人在罗杰的率领下趁势征服全岛。值得注意的是，提姆纳的追随者继续作为罗杰的盟友并肩作战，而部分当地基督徒则毅然加入了抵抗诺曼人的行列。\n\n其后，锡拉库萨的另一位统治者伊本·阿巴德，被基督教文献称为贝纳韦尔特，率领了对诺曼人最后的抵抗。然而，天命难违，在1086年的一场激战中，他战死沙场。西西里的诺曼征服也随着1091年诺托的沦陷而尘埃落定。"
 sicily.0061.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sicily.0061.desc:0 "[GetGeographicalRegion('custom_sicily').GetName]终归#italic 我手#!。\n\n随着我们完成对整个岛屿的征服，这片土地上的所有人——无论是拉丁人、希腊人，还是阿拉伯人，无论是基督徒、穆斯林，还是犹太教徒——皆须向我俯首称臣。从此，纷争止息，混乱不再。\n\n"
 sicily.0061.desc.benavert_converted:0 "连曾经令人闻风丧胆的敌人[benavert.GetFirstNameNicknamed]也终于目睹了上帝的光辉，皈依了[christian.GetName]。我深信，岛上众多异教徒终将追随他的脚步，归向真理。\n\n"
 sicily.0061.desc.benavert_dead:0 "曾经令我畏惧的敌人[benavert.GetFirstNameNicknamed]也已授首。随着[benavert.GetHerHis]的逝去，那些抵抗我征服的人已士气全无，彻底瓦解。\n\n"
 sicily.0061.desc.ending:0 "如今，经过多年的征战，这片古老的土地终于将成为我家族真正的权力基石。我深信，在未来的岁月里，我们将在地中海地区持续掌握巨大的权力与影响力，令世人仰望。"
 sicily.0061.a:0 "这座美丽的岛屿，现在真的像是我们的家了。"
 sicily.0062.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sicily.0062.desc.intro:0 "终于，历经多年的军阀割据与残暴的[norman.GetName]军一波又一波的无情攻势后，[GetGeographicalRegion('custom_sicily').GetName]岛再度实现了统一，这一次是在[uniter.GetFirstNameNicknamed]和[uniter.GetDynasty.GetName]家族的旗帜之下。"
 sicily.0062.desc.roger_converted:0 "\n\n令人惊异的是，曾被视为异教徒的[norman.GetCollectiveNoun]领袖[roger.GetTitledFirstName]竟皈依了[faith.HighGodName]，并改名为[roger.GetFaith.GetName]！"
 sicily.0062.desc.roger_dead:0 "\n\n曾经令人畏惧的[norman.GetNameNoTooltip]入侵者，在他们那位强大的领袖[roger.GetTitledFirstName]去世后，仿佛失去了方向，陷入迷茫。"
 sicily.0062.desc.ending:0 "\n\n总而言之，岛屿的稳定与秩序正渐渐回归，或许不久之后，昔日的繁荣将再现其辉。\n\n然而，我们的使命远未终结，切不可有丝毫松懈。岛屿仍然面临着地中海异教徒的侵袭与内忧的威胁。复兴之路虽漫漫其修远，但已迈出坚定的#italic 第一步#!。"
 sicily.0062.a:0 "于是，这片美丽的岛屿将继续谱写它的壮丽篇章……"
 sicily.0063.t:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]统一（暂时）"
 sicily.0063.desc:0 "历经多年动荡，[GetGeographicalRegion('custom_sicily').GetName]岛终于在[uniter.GetTitledFirstName]的领导下实现了一统。凭借巧妙的政治手腕，再辅以强大的军事力量，[uniter.GetSheHe]终使这片自[kalbid.GetDynasty.GetName]埃米尔国崩溃以来首次统一的岛屿归于一人之掌。\n\n有人视此为新的黎明，相信在[uniter.GetFaith.GetAdjective][uniter.GetCulture.GetName]统治下，和平与繁荣将再度降临于此。然而，亦有人对此心存疑虑，认为这只是异教暴政的不公回归。\n\n这片美丽而令人垂涎的岛屿，矗立在多元文化的交汇处，从未缺乏机遇与挑战。传说中的[GetGeographicalRegion('custom_sicily').GetName]，其未来将如何演绎，唯有时间能揭晓。"
 sicily.0063.a:0 "我们要看看[uniter.GetDynasty.GetName]的统治能持续多久。"
 sicily.0064.t:0 "#italic 伊斯兰世界#!的边疆"
 sicily.0064.desc:0 "我统治着#italic 伊斯兰世界#!的边疆，这里是真主的最后屏障。\n\n然而，尽管我们为守护[islam.GetName]在[GetGeographicalRegion('world_europe_south_italy').GetName]的领土，洒下了无数鲜血、汗水与泪水，[islam.GetAdjectiveNoTooltip]世界却依旧对我们漠不关心。我们耗费数十载光阴，[abbasid.GetHouse.GetName]的哈里发才勉强承认我为此地总督，并给予了些许象征性的支持。在他们眼中，我们几乎已被视作败局已定，尤其当[louis.GetTitledFirstName]的[christian.GetAdjective]大军已逼近边境时。\n\n然而，边疆往往也暗藏机遇。那些威胁我们的异教徒，也许能通过谈判，甚至以些许黄金为代价，转而成为我们的盟友。毕竟，只要我们有共同的敌人，我们与他们之间也能展开富有成效的贸易与外交。\n\n无论结局如何，我深知，[islam.GetNameNoTooltip]在这片半岛上的命运，终将在我的掌舵下得以定夺。"
 sicily.0064.a:0 "[islam.GetAdjectiveNoTooltip]世界有朝一日会为我们的牺牲而心怀感激。"
 sicily.0064.tooltip:0 "#emphasis 历史背景：#!巴里埃米尔国，曾是意大利地区威震一方的伊斯兰政权，由阿拉伯与柏柏尔冒险者于公元847年奠基，历经二十四载，直至公元871年终被法兰克皇帝路易二世的大军攻破。约在公元857年，巴里的第三任君主索丹掌权；其身世扑朔迷离，有人认为他是西西里人、阿拉伯人、柏柏尔人，甚至可能来自撒哈拉以南的非洲。\n\n巴里埃米尔国位处动荡的边疆，始终未获伊斯兰世界的鼎力相助。例如，索丹耗费多年方才被阿拔斯正式承认为总督——这一职位早在其前任穆法拉格时便已申请。\n\n对于索丹的形象，史料记载纷繁复杂。基督教文献中，他被描绘为暴虐无道、阴险如蛇的暴君；而穆斯林与犹太史料则颂扬他为博学、公正且政绩斐然的统治者，与犹太学者阿布·亚伦更是相知如故。\n\n公元871年，巴里沦陷，索丹的最终结局成谜。他或许被处死，或逃往塔兰托，亦或被路易囚禁，后成为其顾问。据传，若为后者，他曾一度离间路易与伦巴第人，挑拨离间，搅动风云。"
 sicily.0065.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sicily.0065.desc:0 "虽历经万难，我终在[GetGeographicalRegion('RICE_mainland_southern_italy').GetName]大地为[islam.GetName]奠下坚固根基。作为一位强大的[islam.GetAdjectiveNoTooltip][ROOT.Char.GetTitleAsNameNoTooltip]，如今无论异教徒或信徒，皆对我敬畏有加。\n\n曾视此地为无望之境，任由异教徒宰割的[islam.GetAdjectiveNoTooltip]世界，终于开始给予我与我勇士们应有的关注与尊重。若非我们浴血奋战，舍生忘死，这片土地早已沦为异教徒掌中之物。\n\n如今，我等已在此半岛稳固根基，伟大的机遇正向我等招手。我们可继续北伐，直捣[christian.GetName]的心脏；亦可开拓繁荣的贸易网络，发展我们的城池，将文明之光照耀这片饱受战火摧残的土地。这片美丽的大地对我等而言机遇无穷，而未来，则充满了光辉的希望。"
 sicily.0065.a:0 "漫长年月后，南意大利终于融入了#italic 伊斯兰世界#!。"
 sicily.0065.a.tooltip:0 "$RICE_sicily_administer_frontier$[decision|E]花费永远降低"
 sicily.0066.t:0 "巴里埃米尔国——凯旋"
 sicily.0066.desc:0 "许多年前，当一群来自地中海各地的[islam.GetAdjective]冒险者建立[GetTitleByKey('c_bari').GetNameNoTier]埃米尔国时，几乎无人预料到它会崛起为[GetGeographicalRegion('custom_sicily').GetName]最强大的政权之一。\n\n在贤明而卓越的[sawdan.GetFirstName]治理下，[islam.GetNameNoTooltip]不仅成功击退了[christian.GetAdjective]敌人的进攻（尤为值得一提的是，有时竟得到了[christian.GetAdjectiveNoTooltip]盟友或雇佣兵的支援）；他更在这片土地上创建了一个繁荣昌盛的国家，并在宫廷中培育出浓厚的学术氛围。\n\n如今，索丹的丰功伟绩再也无法为[islam.GetAdjectiveNoTooltip]世界所忽视，许多信徒将他誉为当世最伟大的统治者之一。而与此同时，[christian.GetAdjectiveNoTooltip]世界则因他在意大利和希腊核心地带构成的威胁而惶恐不安。"
 sicily.0066.a:0 "这狂野的边疆上还会跑出来什么？"
 sicily.0067.t:0 "索丹过往"
 sicily.0067.desc:0 "我们怀揣不同目的来到[GetGeographicalRegion('custom_sicily').GetName]，而我若是想要问鼎成为此处的[GetReligionByKey('islam_religion').GetAdjective]领袖更是要历经千辛万苦。\n\n我们当中一些人早已在[GetGeographicalRegion('RICE_insular_sicily').GetName]落地生根，他们有来自[GetGeographicalRegion('custom_andalusian').GetName]、[GetGeographicalRegion('ghw_region_egypt_et_al').GetName]、[GetGeographicalRegion('RICE_ifriqiya_region').GetName]、$heritage_berber_name$腹地以及非洲更远处，而我是来自……"
 sicily.0067.a:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]#weak （默认）#!"
 sicily.0068.t:0 "索丹的野望"
 sicily.0068.desc:0 "我继承前人的事业，统治这片土地多年，然而，该死的[louis.GetTitledFirstName]军队，想扫平我们的生存空间，即使[louis.GetSheHe]败了，后面还有更多的军队，到时候所努力都可能付诸东流。\n\n我们皆是笃信的[ROOT.Char.GetFaith.HighGodName]信徒，若我等不竭尽全力保护、安定[GetGeographicalRegion('world_europe_south_italy').GetName]，何以传播[ROOT.Char.GetFaith.HighGodName]正信？"
 sicily.0068.a:0 "我们将与[GetReligionByKey('islam_religion').GetAdjective]建立关系"
 sicily.0069.t:0 "xxxxx"
 sicily.0069.desc:0 "xxxxx"
 sicily.0069.a:0 "xxxxx"
 sicily.0070.t:0 "xxxxx"
 sicily.0070.desc:0 "xxxxx"
 sicily.0070.a:0 "xxxxx"
 sicily.0071.t:0 "[abu_aaron.GetFirstNameNoTooltip]准备离开"
 sicily.0071.desc:0 "一位名为[abu_aaron.GetFirstName]的犹太学者，已在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]多年，近日[abu_aaron.GetSheHe]宣布将返回[GetGeographicalRegion('world_mesopotamia').GetName]的故乡。\n\n多年前，[abu_aaron.GetHerHis]因与父亲——那里的犹太教#italic 首领#!或高官——发生激烈争执而离家，遂四处游历，遍访名师，在世界各地的顶尖学者门下求学，增广见闻。\n\n如今，岁月催人老，[abu_aaron.GetSheHe]愈发思念故土，愿在年迈之前回归家园。我领地内，无论犹太人或非犹太人，皆深知[abu_aaron.GetHerHis]的智慧与神秘学识，纷纷恳求[abu_aaron.GetSheHe]留下。甚至有人请求我强行挽留[abu_aaron.GetHerHim]，以期大众继续受益于[abu_aaron.GetHerHis]的教诲。"
 sicily.0071.desc.sawdan:0 "\n\n作为经常拜访[abu_aaron.GetHerHis]的朋友，得知这个消息让我倍感难过。然而，作为朋友，我确实#italic 应该#!尊重[abu_aaron.GetHerHis]的心愿。"
 sicily.0071.a:0 "不让[abu_aaron.GetHerHim]归乡未免太残忍了，祝好！"
 sicily.0071.b:0 "除了强留[abu_aaron.GetHerHim]，我别无选择。"
 sicily.0071.b.failure:0 "[abu_aaron.GetFirstNameNoTooltip]设法逃避追捕"
 sicily.0071.b.success:0 "[abu_aaron.GetFirstNameNoTooltip]被强行拘留"
 sicily.0072.t:0 "[abu_aaron.GetFirstNameNoTooltip]还乡了"
 sicily.0072.desc:0 "据我所知，一位名叫[abu_aaron.GetFirstName]的伟大犹太学者和神秘主义者，正在返回我位于[GetGeographicalRegion('world_mesopotamia').GetName]的领地。\n\n多年前，由于与其父亲——当地犹太人的#italic 首领#!（高官）——发生激烈争执，[abu_aaron.GetHerHis]离家出走，开启了多年漫游之旅，遍访世界各地的名师，博览群书。如今，随着年岁渐长，[abu_aaron.GetSheHe]思乡之情愈发浓烈，渴望在垂暮之年重返故土。\n\n[abu_aaron.GetFirstNameNoTooltip]已离开了[abu_aaron_original_liege.GetTitledFirstName]的宫廷，[abu_aaron.GetHerHim]曾在那长留，而今[abu_aaron.GetSheHe]终于踏上归乡的旅途，回归故里。"
 sicily.0072.a:0 "听起来很有意思……"
