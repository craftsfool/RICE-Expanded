 RICE_sicily_struggle_ending_dominion_latin_name:0 "拉丁世界统治"
 RICE_sicily_struggle_ending_dominion_latin_desc:0 ""
 RICE_sicily_struggle_ending_dominion_latin_tooltip:0 "[GetGeographicalRegion('custom_sicily').GetName]将蒙承[GetPlayer.GetFaith.HighGodName]的恩典，再次作为忠诚和正义之地回归西方拉丁世界，并成为新的权力与威望中心。\n$struggle_persia_ending_foundation_decision_option_second_tooltip$"
 RICE_sicily_struggle_ending_dominion_greek_name:0 "希腊世界统治"
 RICE_sicily_struggle_ending_dominion_greek_desc:0 ""
 RICE_sicily_struggle_ending_dominion_greek_tooltip:0 "作为罗马帝国的第一个行省，[GetGeographicalRegion('custom_sicily').GetName]的失落和衰败一直是帝国的耻辱，而今它将被重新夺回。\n$struggle_persia_ending_foundation_decision_option_second_tooltip$"
 RICE_sicily_struggle_ending_dominion_arabic_name:0 "阿拉伯‑柏柏尔世界统治"
 RICE_sicily_struggle_ending_dominion_arabic_desc:0 ""
 RICE_sicily_struggle_ending_dominion_arabic_tooltip:0 "多年前，第一批阿拉伯‑柏柏尔先民抵达了[GetGeographicalRegion('custom_sicily').GetName]，如今是时候充分发挥这片富饶土地潜力的时候了。\n$struggle_persia_ending_foundation_decision_option_second_tooltip$"
 RICE_sicily_struggle_ending_dominion_outsider_name:0 "新势力统治"
 RICE_sicily_struggle_ending_dominion_outsider_desc:0 ""
 RICE_sicily_struggle_ending_dominion_outsider_tooltip:0 "拉丁人，希腊人，阿拉伯人如孩童争夺玩具般争夺[GetGeographicalRegion('custom_sicily').GetName]，现在是应该让他们认识认识谁才是#italic 真正的主人#!了。\n$struggle_persia_ending_foundation_decision_option_second_tooltip$"
