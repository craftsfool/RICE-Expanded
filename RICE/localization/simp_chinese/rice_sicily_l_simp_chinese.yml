 sicily.0186.info:0 "\n#emphasis 历史背景：#!安德烈亚在中世纪欧洲的基督教高层中，以其改宗犹太教之举而独树一帜。他曾是巴里大主教，约在1066年转变信仰。尽管在那时，改宗犹太教并非绝无仅有，但像安德烈亚这样的显赫人物改宗却极为罕见，几乎可以说是前所未闻。\n\n关于安德烈亚的生平，我们所掌握的资料寥寥无几，但这些有限的信息均源自一位名叫“改宗者”俄巴底亚的12世纪人物——他是一位从基督教转投犹太教的信徒，也是一位曾经的意大利‑诺曼修士。俄巴底亚对安德烈亚怀有深深的敬意，并表示正是安德烈亚的故事激发了自己的信仰转变。\n\n俄巴底亚记载，安德烈亚在1066年左右逃至君士坦丁堡，并在那里接受了割礼；随后，经过一系列的旅行，他最终在法蒂玛王朝的穆斯坦绥尔统治时期抵达埃及，并选择在那里度过余生。据传，在他的旅途中，安德烈亚成功引导了许多人皈依犹太教。"
