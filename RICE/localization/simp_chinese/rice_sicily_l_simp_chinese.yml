 RICE_sicily_aspiration_benavert_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]：#!\n$EFFECT_LIST_BULLET$成为[independent|E][GetTitleByKey('d_sicily').GetNameNoTier][ruler|E]\n$EFFECT_LIST_BULLET$作为独立[ruler|E][completely_control|E][GetTitleByKey('d_sicily').GetNameNoTier]\n$EFFECT_LIST_BULLET$至少达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L][piety_level|E]\n$EFFECT_LIST_BULLET$至少达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L][prestige_level|E]\n$EFFECT_LIST_BULLET$保持穆斯林[faith|E]\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$[head_of_faith|E]对你#P +25#![opinion|E]（倘若存在的话）\n$EFFECT_LIST_BULLET$在[GetGeographicalRegion('RICE_insular_sicily').GetName]的每个[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]：#!\n$EFFECT_LIST_BULLET$至少达到[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L][piety_level|E]或[GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L][prestige_level|E]（奖励：@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]）\n$EFFECT_LIST_BULLET$至少直辖#V 8个#![counties|E]（奖励：获得#V 400名#![GetMaA('RICE_sicily_bowmen').GetName]和#V 100名#![GetMaA('conrois').GetName][special_troops|E]）\n$EFFECT_LIST_BULLET$让欧特维尔皈依穆斯林[faith|E]或死亡（奖励：获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![dynasty_prestige|E]，若是将其皈依则额外获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![piety|E]，若是其已死亡则额外获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![prestige|E]）"
