 sicily.0090.t:0 "去巴亚！"
 sicily.0090.desc:0 "自古以来，坐落于[GetTitleByKey('b_napoli').GetNameNoTier]附近坎皮佛莱格瑞火山地区的巴亚浴场，便是闻名遐迩的大型度假胜地。如今，正是前往那里享受短暂假期的绝佳时机！\n\n巴亚浴场不仅因其疗愈功效而著称，周边的度假区更以派对之城的美名远扬四方。无论等待我的是何种体验，我毫无疑问将尽情享受这场欢乐之旅。"
 sicily.0090.desc.gender:0 "\n\n当然，也许有一些虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]会不赞成一位[ROOT.Char.GetWomanMan]在这样的地方尽情享乐，因为据说这里纵容所谓“女性”的罪恶与各种感官的放纵。然而，我才不会理会那些扫兴的卫道士呢。"
 sicily.0090.a:0 "走走走，找乐子去！"
 RICE_sicily_baia_modifier.travel.dominant:0 "$RICE_sicily_baia_modifier.dominant$\n\n因此，[GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName][activity|E]结束后，您将正常获得[GetModifier('RICE_sicily_visit_baia_normal').GetNameWithTooltip][character_modifier|E]。"
 RICE_sicily_baia_modifier.travel.non_dominant:0 "$RICE_sicily_baia_modifier.non_dominant$\n\n因此，[GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName][activity|E]结束后，您所获得[GetModifier('RICE_sicily_visit_baia_normal').GetNameWithTooltip][character_modifier|E]的[opinion_i|E][opinion|E]和[piety_i|E][piety|E]的#N 减益效果#!将加倍。"
 RICE_sicily_baia_modifier.travel.dont_care:0 "$RICE_sicily_baia_modifier.dont_care$\n\n因此，[GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName][activity|E]结束后，您所获得[GetModifier('RICE_sicily_visit_baia_hedonist').GetNameWithTooltip][character_modifier|E]将提供[opinion_i|E][opinion|E]和[piety_i|E][piety|E]的#P 增益效果#!而非减益。"
 sicily.0091.t:0 "抵达巴亚"
 sicily.0091.desc:0 "我已抵达坎皮佛莱格瑞火山地区，这里正是著名的巴亚浴场所在地。即使在今日，人们仍能体会到为何它被誉为该地区最顶级的浴场胜地。\n\n此地遍布浴场与温泉，自古希腊和罗马时代以来便精心维护，至今吸引着络绎不绝的游客。\n\n此外，这里还有丰富多彩的娱乐活动。沿海区域人潮涌动，人们尽情享受海滩与美景；而那些寻求智力或精神满足的人，则可探访附近的古老建筑与宗教遗址，追寻历史的足迹。"
 sicily.0091.a:0 "我想先在浴场放松下。"
 sicily.0091.b:0 "让我们到海滩上享受下日光！"
 sicily.0091.c:0 "观光听起来不错。"
 RICE_sicily_baia_enjoy_yourself_tt:0 "有些人对在巴亚的享乐颇有微词。"
 RICE_sicily_baia_modifier.dominant:0 "由于[GetPlayer.GetFaith.GetName]的[gender_doctrines|E]，像你这样的[GetPlayer.GetWomanMan]在巴亚享乐时，人们会更加宽容。"
 RICE_sicily_baia_modifier.non_dominant:0 "由于[GetPlayer.GetFaith.GetName]的[gender_doctrines|E]，像你这样的[GetPlayer.GetWomanMan]在巴亚享乐时，人们会更加严格。"
 RICE_sicily_baia_modifier.dont_care:0 "然而，[GetPlayer.GetFaith.GetName]的信徒对此类批评不以为然，对于任何人沉迷于巴亚的享乐亦无异议。"
