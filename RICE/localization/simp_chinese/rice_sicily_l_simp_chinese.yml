 RICE_sicily_bargain_with_stronghold_tooltip:0 "[sicily_strongholds|E]虽然麻烦，但可以与商讨。"
 RICE_sicily_bargain_with_stronghold_desc:0 "荒芜的西西里到处都是[sicily_strongholds|E]，从堡垒到古老文化残部什么都有。虽然他们对平民和[rulers|E]来说都是眼中钉，但这并不意味着不能与他们谈判，甚至可以从中获利。"
 RICE_sicily_bargain_with_stronghold_confirm:0 "提出他们不能拒绝的条件。"
 RICE_sicily_bargain_with_stronghold_context_tooltip:0 "#emphasis 历史背景：#!中世纪的西西里岛在经历了数世纪的冲突、移民与文化同化后，逐渐形成了一个多元化的地区。一些定居点选址于防御坚固之地，虽可能对当地领主构成威胁，却也潜藏利益。例如，加利格里阿诺河畔的穆斯林据点一直存在至915年，其间频繁袭扰附近的基督教领土，甚至包括罗马。然而，这些穆斯林有时也与某些基督教领主结盟，共同抵御外敌。"
