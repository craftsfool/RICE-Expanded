 sicily.0010.t:0 "占领[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]"
 sicily.0010.desc.periphery:0 "多年前，[GetGeographicalRegion('custom_sicily').GetName]边疆饱受战火蹂躏，内忧外患接踵而至，既有内乱的纷争，也有外敌的袭扰。随着经济的日渐凋敝和大批当地人的外迁，这片土地的衰败愈加显而易见。\n\n"
 sicily.0010.desc.imperial:0 "多年前，[GetGeographicalRegion('custom_sicily').GetName]边疆被远方强大帝国纳入麾下，自此，这片地区逐渐陷入停滞。随着资源被掠夺一空，当地人纷纷迁徙至更为繁荣的土地，昔日的活力也随之消散殆尽。\n\n"
 sicily.0010.desc:0 "随着[sicily_struggle_restarter.GetFirstName]的崛起，局势正在悄然改变。这位来自[sicily_struggle_restarter.GetPrimaryTitle.GetName]的异国[sicily_struggle_restarter.GetTitleAsNameNoTooltip]正试图扩大[sicily_struggle_restarter.GetHerHis]对[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的掌控。[sicily_struggle_restarter.GetSheHe|U]已经在这片土地上增强了[sicily_struggle_restarter.GetHerHis]的军事、政治与经济影响力，使得当地的军阀和贵族们对[sicily_struggle_restarter.GetHerHis]的野心深感不安。"
 sicily.0010.desc.conclusion:0 "\n\n像[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]这样的边疆之地，向来难以长久维持稳定与和平。尽管眼下局势已有所转变，但从长远来看，是否能带来真正的改变，仍是未解之谜。"
 sicily.0010.a:0 "在这片三大世界交汇的土地上，波澜再起，风云涌动。"
 sicily.0011.t:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]"
 sicily.0011.t.periphery:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的复兴"
 sicily.0011.t.imperial:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的复兴"
 sicily.0011.desc:0 "随着[sicily_struggle_restarter.GetFirstName]——[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的一位举足轻重的[sicily_struggle_restarter.GetTitleAsNameNoTooltip]的崛起，这片土地上的局势正悄然变化。"
 sicily.0011.desc.periphery:0 "[sicily_struggle_restarter.GetSheHe|U]正竭力稳定[GetGeographicalRegion('custom_sicily').GetName]边疆，试图重振这片土地昔日于地中海的部分财富与影响力——即便无法惠及整个地区，至少要使[sicily_struggle_restarter.GetHerHis]的领地重新焕发生机与繁荣。"
 sicily.0011.desc.imperial:0 "[sicily_struggle_restarter.GetSheHe|U]野心勃勃，不仅致力于振兴[GetGeographicalRegion('custom_sicily').GetName]边疆，还希望为其争取更大的独立，摆脱外来者的掌控。"
 sicily.0011.a:0 "$sicily.0010.a$"
