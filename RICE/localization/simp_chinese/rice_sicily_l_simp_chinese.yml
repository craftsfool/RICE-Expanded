 RICE_sicily_aspiration_andreas_desc:0 "\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$移动[camp|E]或成为[ruler|E]到属于[GetReligionByKey('judaism_religion').GetAdjective][faith|E]的[county|E]上，亦或者前往[GetTitleByKey('c_alexandria').GetNameNoTier]、[GetTitleByKey('c_cairo').GetNameNoTier]、[GetTitleByKey('c_baghdad').GetNameNoTier]、[GetTitleByKey('c_shiraz').GetNameNoTier]、[GetTitleByKey('c_isfahan').GetNameNoTier]、[GetTitleByKey('c_sanaa').GetNameNoTier]、[GetTitleByKey('c_jerusalem').GetNameNoTier]\n$EFFECT_LIST_BULLET$[piety_level|E]达到[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]或更高\n$EFFECT_LIST_BULLET$保持[GetReligionByKey('judaism_religion').GetAdjective][faith|E]\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')][piety|E]\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_sicily_andreas_aspiration_achieved_gold_value')]#![gold|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$获得[GetTrait('pilgrim').GetName( GetNullCharacter )][trait|E]（奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![piety|E]和一个[learning_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$至少有三个[GetReligionByKey('judaism_religion').GetAdjective][faith|E]且不属于你的[dynasty|E]/[spouse|E]/[child|E]的[followers|E]或[courtiers|E]（奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![piety|E]和一个[diplomacy_lifestyle|E][perk|E]）"
 RICE_sicily_historical_aspiration_action_andreas:0 "#italic 你曾是基督教的巴里大主教，但上帝将摩西律法启迪于你。基督教世界已经不再安全了，现在你必须前往中东，前往犹太人中心，在那里会更安全，在那里其他犹太人会被你的英雄之旅激励！#!$RICE_sicily_aspiration_andreas_desc$"
