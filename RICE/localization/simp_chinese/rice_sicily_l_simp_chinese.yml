 RICE_sicily_almadraba_decision_tooltip:0 "钓金枪鱼利润丰厚！"
 RICE_sicily_almadraba_decision_desc:0 "每年，无畏的渔民们都会到[GetGeographicalRegion('RICE_west_mediterranean').GetName]海域[GetPlayer.Custom('RICE_almadraba')]金枪鱼，而支持这一行为的[rulers|E]将从中获利颇丰。"
 RICE_sicily_almadraba_decision_effect_tooltip_1:0 "该[decision|E]的[gold_i|E][gold|E]成本取决于你在[GetGeographicalRegion('RICE_west_mediterranean').GetName]中拥有多少个#V 沿海#![counties|E]。"
 RICE_sicily_almadraba_decision_confirm:0 "海里有的是鱼！"
 RICE_sicily_almadraba_decision_context_tooltip:0 "#emphasis 历史背景：#!围网捕捞（Almadraba）技术是设置一整系列网具，用以捕捉那些在地中海与大西洋间洄游的金枪鱼。这一捕鱼技艺源远流长，这种捕鱼技艺不仅在伊比利亚和北非广为流传（在伊比利亚半岛被称为#italic 围网捕捞（Mattanza）#!，），也在意大利的西地中海地区盛行，其历史或许可以追溯到遥远的古代。众多统治者通过支持并垄断这一贸易而获利丰厚，历史上，15和16世纪的梅迪纳‑西多尼亚公爵便是最好的写照。"
