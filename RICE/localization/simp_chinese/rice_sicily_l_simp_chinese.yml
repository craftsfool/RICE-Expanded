 FACTION_DEMAND_RICE_sicily_arabic_stronghold_desc_non_infidel:0 "您身为领主，但毫无领主风范，如同野兽一般，我们身处此地自给自足，仍被视为威胁。\n\n这种情况日复一日，毫无改善，现在我们要求您给予我们更大的自由，负责别怪我们自己夺回权利！"
