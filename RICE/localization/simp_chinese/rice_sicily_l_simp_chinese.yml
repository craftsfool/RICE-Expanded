 sicily.0186.t:0 "[GetTitleByKey('c_bari').GetNameNoTierNoTooltip]前大主教——安德烈亚"
 sicily.0186.desc:0 "我身为[GetTitleByKey('c_bari').GetNameNoTier]的[GetReligionByKey('christianity_religion').GetAdjective]大主教，享有荣华富贵。然而[ROOT.Char.GetFaith.HighGodNameAlternate]，将对摩西律法的神谕启迪于我，于是我成了[GetReligionByKey('judaism_religion').GetAdjective]。\n\n但我知晓我曾经的教胞与其他外人的想法，他们会毫不犹豫地羞辱我、折磨我，甚至杀死我，我必须逃，逃，逃去[GetTitleByKey('b_constantinople').GetNameNoTier]。\n\n在诸城之女皇，我接受了割礼，但太多人知晓我，仇视我，伤害我，我别无他法只能继续逃。当地的[GetReligionByKey('judaism_religion').GetAdherentNamePluralNoTooltip]看到了我的义举，同情我的困境，告诉我[GetGeographicalRegion('world_middle_east').GetName]大城市，在那里我们这些同胞生活得相对安宁。他们说，去那里避难会更安全。\n\n我还要忍受这些苦难多久？"
 sicily.0186.a:0 "我必须收拾行囊，再次出发。"
 sicily.0187.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sicily.0187.desc:0 "祈求祢，[ROOT.Char.GetFaith.HighGodName]啊，让我在磨难中幸存下来，祢是这样爱我，我也是这样存活。\n\n我来到了位于[GetGeographicalRegion('world_middle_east').GetName]的[GetReligionByKey('judaism_religion').GetAdherentNamePlural]避难所，在这里，我们人数众多，社区巨大。但这里从来都不是真正安全的家园，因为我们的安全和生命都取决于当地统治者的态度，不过总比[GetTitleByKey('c_bari').GetNameNoTier]时要好。\n\n虽然我的一些[GetReligionByKey('judaism_religion').GetAdherentNamePluralNoTooltip]同胞怀疑我皈依的诚意，因为我#italic 曾是#!一位[GetReligionByKey('christianity_religion').GetAdjective]大主教，但更多的人欢迎我。他们被我激励，当我向他们讲述我的艰辛时，他们落泪；当我向他们讲述我的成功时，他们欢呼雀跃；当我讲述祢，[ROOT.Char.GetFaith.HighGodNameAlternate]，对我乃至我们所有人的爱时，他们像家人一样拥抱我。\n\n我终于找到了真正的家。"
 sicily.0187.a:0 "感谢[ROOT.Char.GetFaith.HighGodName]祢拯救了我。"
 sicily.0188.t:0 "迦太基医师"
 sicily.0188.desc:0 "我来自[GetGeographicalRegion('custom_roman_africa').GetName]，靠近迦太基城。虽然我是个商人，但也通晓不同学问。然而，当我追求财富来到[GetGeographicalRegion('world_europe_south_italy').GetName]时，却被当地医学知识的匮乏所震惊，于是将传播所学医道定为此生目标。\n\n我返回故土尽可能搜集希腊与伊斯兰的学术典籍，可惜归途遭遇风暴。虽人员无恙，但许多典籍却已损毁。\n\n所幸我在此地仍受到部分人士礼遇，尤其是贵族与神职人员。我身为来自[GetReligionByKey('islam_religion').GetName]主导的[GetReligionByKey('christianity_religion').GetAdherentName]，我的出身令他们颇感兴味，我听说有人在猜测我是否是皈依者，或者来自日渐式微的古老[african_roman_culture.GetName]社群。"
 sicily.0188.a:0 "我是迦太基与[GetGeographicalRegion('custom_roman_africa').GetNameNoTooltip]的骄傲子民！"
 sicily.0189.t:0 "$sicily.0188.t$"
 sicily.0189.desc:0 "重返[GetGeographicalRegion('world_europe_south_italy').GetName]的我不过是将古今医学教义传播给这片土地上的学者与医师。\n\n我之所以专程来到[GetTitleByKey('c_salerno').GetNameNoTier]，正是因为此地拥有声名显赫的医学院，而学院的师生们也欣然接纳了我。在此过程中，我还招收了两位很有前途的学生，一位是来自著名的卡西诺山修道院的修士[atto.GetFirstName]，另一位则是先前皈依[GetReligionByKey('christianity_religion').GetName]的北非人[johannes.GetFirstName]。\n\n当我开启人生的新篇章时，不禁思忖是否也该成为一名修士，这样才能全神贯注于毕生的事业……"
 sicily.0189.a:0 "在世俗拥有人脉也有一些好处。"
 sicily.0190.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sicily.0190.desc:0 "我无数个日夜蜷缩在烛光微弱的旧手稿前；搜寻着关于书籍和卷轴的传闻中；辛劳、忧虑质疑地询问[ROOT.Char.GetFaith.HighGodName]究竟是否真是我命中注定的使命……\n\n我的工作永无止境，因为我尽我所能向[GetGeographicalRegion('world_europe_south_italy').GetName]传播尽可能多的医学知识。总有更多的事情要做，以确保未来的学者和医生能够在前辈伟人的基础上继续前行。\n\n不过，既然我已经完成了#italic 《医学全书》#!，我的工作将会轻松一些。这是一部将希腊和伊斯兰医学知识汇编而成的著作，并已翻译成[roman_culture.GetLanguage.GetName]。哪怕有人可能会批评翻译的质量或文笔，但又有哪位学者曾以如此全面的方式编纂过这样的信息呢？"
 sicily.0190.a:0 "我们后辈将因此受益！"
 sicily.0191.t:0 "《医学全书》"
 sicily.0191.desc:0 "来自[GetGeographicalRegion('custom_roman_africa').GetName]的学者兼医师[constantine.GetFullName]，其故乡邻近古城迦太基。近年来，[constantine.GetHerselfHimself]在[GetGeographicalRegion('world_europe_south_italy').GetName]以教师、译者和医学知识传播者的身份声名鹊起。\n\n最近，[constantine.GetHerHis]完成了#italic 《医术全书》#!，这是一部汇集了希腊化和伊斯兰医学的著作，并翻译成了[roman_culture.GetLanguage.GetName]。此前从未有西方学者编纂过如此全面的医学知识集，甚至我也收到了一份副本，以便我的领地内的医生和学者能够从中受益。"
 sicily.0191.a:0 "此人的辛勤努力将减轻许多人的痛苦。"
 sicily.0192.t:0 "拉丁文翻译"
 sicily.0192.desc:0 "$sicily.0192.intro$我最近发现了一些需要翻译的医学典籍，但我尚未找到这些典籍的优秀[roman_culture.GetLanguage.GetNameNoTooltip]译本。若想在本地区传播医学知识，我必须亲自着手翻译这些文献。"
 sicily.0192.a:0 "开始翻译吧……"
 sicily.0193.t:0 "希腊医学"
 sicily.0193.desc:0 "$sicily.0192.intro$我最近找到了一些古希腊医学文献的抄本，需要花些时间研读，看看能从中学到什么知识。如果这些信息对医学有用，我将尽最大努力传播它。"
 sicily.0193.a:0 "$sicily.0192.a$"
 sicily.0194.t:0 "伊斯兰医学"
 sicily.0194.desc:0 "$sicily.0192.intro$我最近找到了一些伊斯兰医学文献的抄本，需要花些时间研读，看看能从中学到什么知识。如果这些信息对医学有用，我将尽最大努力传播它。"
 sicily.0194.a:0 "$sicily.0192.a$"
