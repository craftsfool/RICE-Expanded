 trait_RICE_sicilian_ruler_desc:0 "该角色是[RICE_sicily_struggle|E]中举足轻重的大人物。$trait_RICE_sicilian_ruler_info$"
 trait_RICE_sicilian_ruler_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是[RICE_sicily_struggle|E]中举足轻重的大人物。$trait_RICE_sicilian_ruler_info$"
 trait_track_RICE_sicilian_ruler_latin:0 "拉丁裔"
 trait_track_RICE_sicilian_ruler_latin_desc:0 "罗马虽失其鹿，但它带来的庞大拉丁裔居民并不会从西西里消失，也正是他们的存在拉近了西西里同西欧的距离。"
 trait_track_RICE_sicilian_ruler_arabic:0 "阿拉伯‑柏柏尔裔"
 trait_track_RICE_sicilian_ruler_arabic_desc:0 "自迦太基时期起，无数的北非族裔涌入了[RICE_sicily_struggle|E]，他们始终与海那边的故土保持着密切的经济和政治联系。"
 trait_track_RICE_sicilian_ruler_greek:0 "希腊裔"
 trait_track_RICE_sicilian_ruler_greek_desc:0 "古典时代起，希腊人就登陆并定居于西西里，并称为#italic 大希腊#!，尽管被拉丁人统治了几个世纪，但希腊人仍举足轻重，并与东方希腊世界保持着密切联系。"
