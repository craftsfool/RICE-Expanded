 activity_RICE_sicily_palermo_tomb_visit_desc:0 "[GetGeographicalRegion('custom_sicily').GetName]是一片古老的土地，据说有几名重要的古人在这里安息，据说一部分埋在[GetTitleByKey('c_palermo').GetNameNoTier]中。"
