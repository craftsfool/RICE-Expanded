 FACTION_DEMAND_RICE_sicily_latin_stronghold:1 "至[ROOT.Char.Custom('InsultAdjective')]的[ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_RICE_sicily_latin_stronghold_desc_non_infidel:0 "您身为领主，但毫无领主风范，如同野兽一般，我们身处此地自给自足，仍被视为威胁。\n\n这种情况日复一日，毫无改善，现在我们要求您给予我们更大的自由，负责别怪我们自己夺回权利！"
 FACTION_DEMAND_RICE_sicily_latin_stronghold_desc_infidel:0 "我们与你们达成协议，但你们心怀芥蒂，一直把我们视为威胁。\n\n这种情况日复一日，毫无改善，现在我们要求您给予我们更大的自由，负责别怪我们自己夺回权利！"
 FACTION_DEMAND_RICE_sicily_latin_stronghold_ACCEPT:0 "有问题好商量，就照着最初协议修改吧。"
 FACTION_DEMAND_RICE_sicily_latin_stronghold_REFUSE:0 "真是可笑！还想威胁我？"
