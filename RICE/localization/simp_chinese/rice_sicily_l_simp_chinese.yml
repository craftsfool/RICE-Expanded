 sicily.0014.t:0 "第二帕维亚"
 sicily.0014.desc:0 "自从[lombard.GetCollectiveNoun]在加洛林王朝的打击下败退，失去了辉煌的都城[GetTitleByKey('c_pavia').GetNameNoTier]，他们的后代在曾经统治的[GetGeographicalRegion('world_europe_south_italy').GetName]上历经重重苦难。曾几何时，他们寄希望于[GetGeographicalRegion('custom_sicily').GetName]的强大诸侯，但这些公国也因内乱和纷争而相继瓦解。\n\n然而，如今古老[lombard.GetCollectiveNounNoTooltip]后裔的命运似乎正在复苏，因为一位名叫[second_pavia_founder.GetTitledFirstName]的人物已然崛起，成为[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]地区的杰出统治者。在[second_pavia_founder.GetHerHis]的领导下，[second_pavia_founder.GetHerHis]的首府——[second_pavia.GetName]已经成为这个地区的经济、政治与文化中心。\n\n正如[second_pavia_founder.GetFirstNameNoTooltip]所言，[second_pavia.GetNameNoTier]俨然已是“第二帕维亚”。这是古老[lombard.GetCollectiveNounNoTooltip]后裔的新纪元吗？抑或只是又一次虚幻的希望？无论未来如何，[second_pavia.GetNameNoTier]毫无疑问将长期屹立为地中海的一座伟大城市。"
 sicily.0014.a:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的新一幕……"
