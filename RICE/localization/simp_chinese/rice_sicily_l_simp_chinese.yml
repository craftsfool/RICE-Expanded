 RICE_sicily_officials_outreach_latin_locals:0 "改善与当地拉丁裔的关系"
 RICE_sicily_officials_outreach_latin_locals_desc:0 "尽管来自不同的背景，但该地区的官员正在努力学习当地[sicily_latin|E]裔的语言、习俗和文化。"
 RICE_sicily_officials_outreach_greek_locals:0 "改善与当地希腊裔的关系"
 RICE_sicily_officials_outreach_greek_locals_desc:0 "尽管来自不同的背景，但该地区的官员正在努力学习当地[sicily_greek|E]裔的语言、习俗和文化。"
