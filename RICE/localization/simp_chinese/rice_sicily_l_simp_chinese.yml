 activity_RICE_sicily_palermo_tomb_visit_context_tooltip:0 "#emphasis 历史背景：#!无论是否巧合，但西西里岛被认为是许多著名历史人物的最后安息地。中世纪传说认为其中一些人物被埋葬在巴勒莫市附近，其中包括亚里士多德、盖伦或各种穆斯林圣战者。"
