 RICE_sicily_occupy_sicilian_frontier_effect_tooltip_3:0 "[GetGeographicalRegion('custom_sicily').GetName]中所有代表#V 基层主流#!或#V 统治势力#!的[county_modifiers|E]均将移除"
 RICE_sicily_occupy_sicilian_frontier_confirm:0 "西西里边疆是我们的了！"
 RICE_sicily_occupy_sicilian_frontier_context_tooltip:0 "#emphasis 历史背景：#!尽管南意大利地处地中海核心，数世纪以来，它却始终是一个边陲之地，汇聚着多种文化的交融。在中世纪，这片土地成为了西方拉丁、东方希腊与伊斯兰文明的交汇点：有时展现出富有成效的#italic 共存#!精神，另一些时候则陷入持久纷争。然而，即便在冲突时期，生活在这片边疆的人们依然展现出多变的身份与忠诚，进一步复杂了这里的民族与宗教版图。"
 RICE_sicily_stabilize_sicilian_frontier:0 "振兴西西里边疆"
 RICE_sicily_stabilize_sicilian_frontier_imperial:0 "振兴西西里边疆"
 RICE_sicily_stabilize_sicilian_frontier_tooltip:0 "[RICE_sicily_struggle|E]的争夺又开始了！"
 RICE_sicily_stabilize_sicilian_frontier_desc:0 "[RICE_sicily_struggle|E]长期以来被世间强权所忽视，最多不过是个无足轻重的边缘之地。是否会有真正的[GetPlayer.Custom('GetDaughterSon')]从[GetGeographicalRegion('custom_sicily').GetName]中崛起，将这片古老的土地重塑为地中海的熔炉，再度成为众所争夺的边疆？"
 RICE_sicily_stabilize_sicilian_frontier_effect_tooltip_1:0 "以[struggle_phase_sicily_borderland|E]阶段的[RICE_sicily_struggle|E][struggle|E]"
 RICE_sicily_stabilize_sicilian_frontier_effect_tooltip_2:0 "$RICE_sicily_occupy_sicilian_frontier_effect_tooltip_2$"
 RICE_sicily_stabilize_sicilian_frontier_effect_tooltip_3:0 "$RICE_sicily_occupy_sicilian_frontier_effect_tooltip_3$"
 RICE_sicily_stabilize_sicilian_frontier_confirm:0 "$RICE_sicily_occupy_sicilian_frontier_confirm$"
 RICE_sicily_stabilize_sicilian_frontier_context_tooltip:0 "$RICE_sicily_occupy_sicilian_frontier_context_tooltip$"
 RICE_sicily_admirals_bridge_decision:0 "建造海军上将桥"
 RICE_sicily_admirals_bridge_decision_tooltip:0 "一座横跨[GetTitleByKey('b_palermo').GetNameNoTier]的大桥对定居点发展裨益良多！"
 RICE_sicily_admirals_bridge_decision_desc:0 "[GetTitleByKey('b_palermo').GetNameNoTier]是[GetGeographicalRegion('custom_sicily').GetName]政治和贸易中心。虽然已有许多桥梁将沿岸定居点同岛上连接起来，但我们的工程师找到了一处很有潜力的地点，准备架设一座本地区最兼具美学和战略价值的桥梁。"
 RICE_sicily_admirals_bridge_decision_confirm:0 "来！架桥！"
 RICE_sicily_admirals_bridge_decision_context_tooltip:0 "#emphasis 历史背景：#!海军上将桥是位于西西里岛巴勒莫的一座中世纪桥梁。其杰出的工程设计和险要的地理位置（连接皇家设施）使其成为这座城市的象征；在意大利统一时期，更是朱塞佩·加里波第的军队与两西西里王国的著名战斗地点。据传，它是由西西里国王罗杰二世的海军将领安条克的乔治于12世纪建成，但最新研究表明，它的历史可能更为久远。"
 RICE_sicily_support_salerno_medical_school:0 "支持$building_type_RICE_sicily_salerno_medical_school$"
 RICE_sicily_support_salerno_medical_school_tooltip:0 "给予$building_type_RICE_sicily_salerno_medical_school$资金和政策倾斜"
 RICE_sicily_support_salerno_medical_school_desc:0 "自建校以来，$building_type_RICE_sicily_salerno_medical_school$一直是欧洲的医学研究中心。我作为[ROOT.Char.GetTitleAsNameNoTooltip]，[GetTitleByKey('c_salerno').GetNameNoTier]的赞助人，理当予以资金和政策倾斜。"
 RICE_sicily_support_salerno_medical_school_confirm:0 "大伙们好好干！"
 RICE_sicily_support_salerno_medical_school_effect_tooltip_1:0 "根据你的[traits|E]和[skills|E]，有#V [GetPlayer.MakeScope.ScriptValue('RICE_sicily_salerno_medical_extra_chance')|0]#!的概率给予#P 正面#!的[modifiers|E]和[artifacts|E]，并提升你的[GetCourtPositionType('court_physician_court_position').GetName()]能力，如果尚未雇佣，则推荐一名[GetCourtPositionType('court_physician_court_position').GetName()]。"
 RICE_sicily_support_salerno_medical_school_effect_tooltip_2:0 "如果你拥有[GetTitleByKey('c_salerno').GetNameNoTier]，获得更好奖励的概率提高"
 RICE_sicily_support_salerno_medical_school_context_tooltip:0 "#emphasis 历史背景：#!在中世纪，萨莱诺曾是一所著名医学院的所在地。据传，该校始建于公元9世纪，当时四位医生——希腊人庞图斯、意大利人萨莱诺、阿拉伯人阿卜杜拉和犹太人赫利努斯——在萨莱诺旅行时偶然相遇，并在此留宿。随后，他们决定共同创办这所学校。尽管这很可能只是个传说，但它也的确反映了该校的多样性：学校接纳来自欧洲和地中海各地的教师和学生，其中包括女性，并教授希腊、拉丁、阿拉伯和犹太传统医学。"
 RICE_sicily_sponsor_liber_pantegni:0 "赞助《医学全书》的创作"
 RICE_sicily_sponsor_liber_pantegni_tooltip:0 "[GetTitleByKey('b_salerno').GetNameNoTier]的医者能用得上我们的帮助"
 RICE_sicily_sponsor_liber_pantegni_desc:0 "[GetTitleByKey('b_salerno').GetNameNoTier]是著名医学院的所在地。该学院的学者提议，我们可以资助编纂一本综合性的医学教科书，汇聚伊斯兰、东方希腊、西方拉丁和犹太传统的精华——这些传统深刻影响了这所学府。"
 RICE_sicily_sponsor_liber_pantegni_effect_tooltip_1:0 "你将要求#V 非洲的康斯坦丁#!编纂#V 《医学全书》#!"
 RICE_sicily_sponsor_liber_pantegni_effect_tooltip_2:0 "你将要求[nasir_khusraw|E]撰写一篇文章，以来回答关于哲学和精神之间的关系。"
 RICE_sicily_sponsor_liber_pantegni_effect_tooltip_3:0 "书籍的创作将花费#V 5年#!时间，你将会获得书籍[artifact|E]、[prestige_i|E][prestige|E]以及[piety_i|E][piety|E]"
 RICE_sicily_sponsor_liber_pantegni_confirm:0 "召集学者和医生！"
 RICE_sicily_sponsor_liber_pantegni_context_tooltip:0 "#emphasis 历史背景：#!$RICE_sicily_support_salerno_medical_school_context_tooltip$"
 RICE_sicily_virgil_divination_decision:0 "求取维吉尔诗签"
 RICE_sicily_virgil_divination_decision_tooltip:0 "先贤诗人维吉尔的诗歌内蕴乾坤"
 RICE_sicily_virgil_divination_decision_desc:0 "维吉尔是著名的罗马诗人、魔法师和预言家。人们有通过其诗歌，尤其是#italic 《埃涅阿斯纪》#!，占卜吉凶、预测未来的传统。"
 RICE_sicily_virgil_divination_decision_confirm:0 "是时候搞点占卜了！"
 RICE_sicily_virgil_divination_decision_effect_tooltip_1:0 "根据占卜结果，你会收到或#P 正面#!或#N 负面#!的[modifiers|E]"
 RICE_sicily_virgil_divination_decision_effect_tooltip_2:0 "[modifiers|E]结果好坏的几率取决于你的[traits|E]、[piety_level|E]、[diplomacy_i|E][diplomacy]以及[learning_i|E][learning|E]"
 RICE_sicily_virgil_divination_decision_effect_tooltip_3:0 "如果你完成了[GetActivityType( 'activity_RICE_sicily_virgil_tomb_visit' ).GetName][activity|E]，则获得更好结果的几率提升"
 RICE_sicily_virgil_divination_decision_context_tooltip:0 "#emphasis 历史背景：#!#italic 维吉尔诗签#!是一种占卜术，利用维吉尔的诗歌，尤其是他的《埃涅阿斯纪》来预测未来。这种占卜方式在维吉尔去世一个世纪后开始流行，并持续到中世纪和现代早期。例如，英王查理一世在英国内战时期曾用维吉尔诗签来预测未来——他在《埃涅阿斯纪》中得出一句相当不详的话，预示着其会战败并被处死。"
 RICE_sicily_virgil_divination_decision_activity_req:0 "至少完成一次[GetActivityType( 'activity_RICE_sicily_virgil_tomb_visit' ).GetName][activity|E]"
 RICE_sicily_second_pavia_decision:0 "建立第二帕维亚"
 RICE_sicily_second_pavia_decision_tooltip:0 "伦巴第人的遗产将在新的中心续写辉煌。"
 RICE_sicily_second_pavia_decision_desc:0 "随着伦巴第王国灭亡，辉煌的首都帕维亚沦陷，伦巴第人的后裔流散至意大利南部，艰难求生。如今，将[GetPlayer.GetCapitalLocation.GetTitle.GetNameNoTier]打造成“第二帕维亚”，将成为复兴[GetPlayer.GetCulture.GetName]人民命运的关键一步。"
 RICE_sicily_second_pavia_decision_confirm:0 "愿我们能夺回那长久失落的荣耀！"
 RICE_sicily_second_pavia_decision_context_tooltip:0 "#emphasis 历史背景：#!伦巴第王国曾定都帕维亚，在6世纪至8世纪间统治意大利，直至被加洛林法兰克人击败。随后，伦巴第的继承者在意大利南部崛起，其中贝内文托因其繁荣与重要地位，被誉为“第二帕维亚”。然而，讽刺的是，这些伦巴第政权常常受到北方法兰克人的控制。更南部的伦巴第人则始终保持独特的身份，直至12、13世纪的诺曼西西里时代。"
 RICE_sicily_second_pavia_decision_activity_req:0 "至少完成一次[GetActivityType( 'activity_RICE_sicily_virgil_tomb_visit' ).GetName][activity|E]"
 sicily.0000.t:0 "xxxxx"
 sicily.0000.desc:0 "xxxxx"
 sicily.0000.a:0 "xxxxx"
 sicily.0001.t:0 "$RICE_sicily_struggle$"
 sicily.0001.desc:0 "“西西里是我们最早的行省；西西里最早教会了我们的祖先，统治他人是多么光辉的事业。”伟大的罗马人西塞罗早在罗马西部衰落之前便如此说道。\n\n西西里，地中海的熔炉，如今成为一片蛮荒的边疆，伊斯兰、拜占庭与西方拉丁三大世界在此交汇。许多人垂涎西西里及其丰饶的资源，但那些企图征服和定居的人往往发现，这片天堂背后是一个边缘地带，在这里，文化、信仰和忠诚之间的界限往往模糊不清。"
 sicily.0001.desc.involved:0 "然而，无论发生什么，西西里依然是我们美丽而挚爱的家园。"
 sicily.0001.desc.interloper:0 "或许在未来，那美丽的西西里将成为我们的新家园。"
 sicily.0001.desc.uninvolved:0 "美丽的西西里确实潜藏满了危险与混乱。"
 sicily.0001.a:0 "[ROOT.Char.GetHouse.GetNameNoTooltip]家族将征服西西里边疆！"
 sicily.0002.t:0 "xxxxx"
 sicily.0002.desc:0 "xxxxx"
 sicily.0002.a:0 "xxxxx"
 sicily.0003.t:0 "$RICE_sicily_struggle$：边缘地带"
 sicily.0003.desc:0 "[GetGeographicalRegion('custom_sicily').GetName]这片边境之地，如今只能在动荡的风雨中勉力支撑，终将难逃衰败的宿命。岁月的长河中，它因经济凋敝、人口锐减，族群离散，内忧外患交织，早已伤痕累累。\n\n在这变革的时代，#V [GetPlayer.Custom('RICE_sicily_periphery_type')]#!的强势介入如同强心剂，短暂地为这片废墟注入了一丝生机，筑起了社会与文化的基石。然而，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的命运依旧未能逆转：这片曾是地中海核心的土地，最终却沦为贫困的#V 边缘#!，命运多舛，令人唏嘘。\n\n或许有朝一日，雄心勃勃的统治者将重燃其昔日的辉煌。但在此之前，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]只能在无关紧要的处境中徘徊，徒然等待命运的再一次垂青。"
 sicily.0003.a:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的历史如潮起潮落，波澜壮阔，充满了跌宕与变幻……"
 sicily.0004.t:0 "$RICE_sicily_struggle$：帝国荫庇"
 sicily.0004.desc:0 "[GetGeographicalRegion('custom_sicily').GetName]，这片文明交汇的边疆之地，犹如蜜糖般引来无数外来者趋之若鹜。多年来，地中海彼岸的国度们在军事、政治、宗教与经济领域竞相角逐这片神奇而富饶的土地。\n\n#V [GetPlayer.Custom('RICE_sicily_imperial_type')|U]#!已然成为[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的最强主宰，当地的统治阶层，大多源自此地，或至少与之密切相连。可以说，在这#V 帝国荫庇#!下，这片边疆暂得一时的安稳。\n\n然而，这种统治不过是徒有其表，实则[GetGeographicalRegion('custom_sicily').GetName]的资源与活力早已被榨取殆尽。表面上的稳定，难掩这片边疆多变而难测的本质。或许不久的将来，外敌的贪婪入侵，或内争的刀光剑影，抑或内外交困，[GetGeographicalRegion('custom_sicily').GetName]这片边疆终将再次沦为地中海命运的风暴眼。"
 sicily.0004.a:0 "$sicily.0003.a$"
 sicily.0005.t:0 "$RICE_sicily_struggle$：统治"
 sicily.0005.desc.intro:0 "[GetGeographicalRegion('custom_sicily').GetName]位于地中海的心脏地带，这既是主的恩赐，亦是它的诅咒：它在历史的长河中时而兴盛，时而又沦为各民族与国度欲望和贪婪的猎物。近年来，这片土地成了西方拉丁、拜占庭与伊斯兰三大文明交汇的边疆。然而，[GetGeographicalRegion('custom_sicily').GetName]却始终未曾掌握自己的命运……直到此刻。\n"
 sicily.0005.desc.latin:0 "在[RICE_sicily_struggle_ender.GetTitledFirstName]的英明领导下，#V 拉丁世界#!在意大利南部奠定了至高无上的地位。[RICE_sicily_struggle_ender.GetSheHe]#V 统治#!着一片前所未有的强大领地，如此权势在当地统治者中实属空前。[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]再也不屈从于外族的统治与欲望，尽管它依然与西方拉丁保持着深厚的联系。\n\n拉丁人治下的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]如今已蜕变为一片独立而强大的领地。"
 sicily.0005.desc.greek:0 "在[RICE_sicily_struggle_ender.GetTitledFirstName]的英明领导下，#V 希腊世界#!在意大利南部奠定了至高无上的地位。[RICE_sicily_struggle_ender.GetSheHe]#V 统治#!着一片前所未有的强大领地，如此权势在当地统治者中实属空前。[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]再也不屈从于外族的统治与欲望，尽管它依然与拜占庭保持着深厚的联系。\n\n希腊人治下的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]如今已蜕变为一片独立而强大的领地。"
 sicily.0005.desc.arabic:0 "在[RICE_sicily_struggle_ender.GetTitledFirstName]的英明领导下，#V 阿拉伯‑柏柏尔世界#!在意大利南部奠定了至高无上的地位。[RICE_sicily_struggle_ender.GetSheHe]#V 统治#!着一片前所未有的强大领地，如此权势在当地统治者中实属空前。[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]再也不屈从于外族的统治与欲望，尽管它依然与中东及伊斯兰世界保持着深厚的联系。\n\n阿拉伯‑柏柏尔人治下的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]如今已蜕变为一片独立而强大的领地。"
 sicily.0005.desc.outsider:0 "在[RICE_sicily_struggle_ender.GetTitledFirstName]的英明领导下，这股崭新的力量——不再与此前在此地占据主导地位的拉丁、希腊或阿拉伯‑柏柏尔世界有任何瓜葛——在意大利南部迅速崛起。[RICE_sicily_struggle_ender.GetSheHe]#V 统治#!着一片前所未有的强大领地，如此权势在当地统治者中实属空前。[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]再也不屈从于外族的统治与欲望。\n\n[RICE_sicily_struggle_ender.GetCulture.GetName]与[RICE_sicily_struggle_ender.GetFaith.GetAdjective]治下的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]如今已蜕变为一片独立而强大的领地。"
 sicily.0005.desc.conclusion:0 "[RICE_sicily_struggle_ender.GetFirstNamePossessiveNoTooltip]的继承人无疑将在未来的岁月中继续掌控这片土地。这片曾经蛮荒的边疆，如今已被彻底驯服，化为安定之所。"
 sicily.0005.a:0 "这是[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]崭新的一天。"
 sicily.0006.t:0 "$RICE_sicily_struggle$：关键枢纽"
 sicily.0006.desc:0 "$sicily.0005.desc.intro$\n在[RICE_sicily_struggle_ender.GetTitledFirstName]的统治下，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]已然蜕变为地中海的#V 重要枢纽#!。尽管[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]自古以来便是这一地区的中心，过去却仅是外部势力角逐的战场。然而，[RICE_sicily_struggle_ender.GetTitledFirstNameNoTooltip]通过精心编织与地中海其他地区的联系，并扶持多元民族发展，彻底摆脱了[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]软弱、受制于人的形象。\n\n如今，作为一个日渐崛起的国际商业与思想交流中心，[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]不再只是一个#italic 十字路口#!，它更是地中海的重要枢纽。[RICE_sicily_struggle_ender.GetFirstNamePossessiveNoTooltip]的继承人无疑将在此享受多年繁荣。这片曾经的蛮荒边疆，现已被完全驯服，成为一片安定之地。"
 sicily.0006.a:0 "$sicily.0005.a$"
