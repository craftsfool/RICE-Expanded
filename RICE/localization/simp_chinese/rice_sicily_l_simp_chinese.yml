 RICE_sicily_recruit_soldiers_choose_latin_tooltip:0 "西欧的拉丁裔可能会被敌人蔑称为未开化的野蛮人，但他们的军事能力毋容置疑。他们长期驻扎在意大利南部，既以宗教的名义出征，也因更世俗的原因出战。"
 RICE_sicily_recruit_soldiers_choose_greek_name:0 "希腊裔战士"
 RICE_sicily_recruit_soldiers_choose_greek_desc:0 "$RICE_sicily_recruit_soldiers_choose_greek_name$"
 RICE_sicily_recruit_soldiers_choose_greek_tooltip:0 "希腊裔常常被敌人诋毁为狡诈的叛徒，但他们却是防御好手，而且昔日罗马帝国的余晖无不提醒着他们曾经的强大。"
