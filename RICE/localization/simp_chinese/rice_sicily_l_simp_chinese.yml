 RICE_sicily_aspiration_sawdan_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[independent|E]的[GetTitleByKey('d_apulia').GetNameNoTier][ruler|E]\n$EFFECT_LIST_BULLET$在[GetGeographicalRegion('RICE_mainland_southern_italy').GetName]地区直辖或让[vassals|E]掌控#V 8个#![counties|E]\n$EFFECT_LIST_BULLET$至少达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L][piety_level|E]或至少达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L][prestige_level|E]\n$EFFECT_LIST_BULLET$至少使用过一次$RICE_sicily_administer_frontier$[decision|E]\n$EFFECT_LIST_BULLET$保持穆斯林[faith|E]\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]\n$EFFECT_LIST_BULLET$获得#V 1000名#![special_troops|E]（其中包括[men_at_arms|E]）\n$EFFECT_LIST_BULLET$[head_of_faith|E]对你#P +25#![opinion|E]（倘若存在的话）\n$EFFECT_LIST_BULLET$$RICE_sicily_administer_frontier$[decision|E]成本永久降低\n\n#bold [historical_aspiration_bonus_objectives|E]：#!\n$EFFECT_LIST_BULLET$至少采用一次$RICE_sicily_recruit_soldiers_decision$[decision|E]（奖励：获得[martial_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$成为[king|E]或[emperor|E]，或持有至少#V 3个#![duchy|E][titles|E]（奖励：获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![dynasty_prestige|E]）\n$EFFECT_LIST_BULLET$控制[GetTitleByKey('c_roma').GetNameNoTier][county|E]（奖励：获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]）"
 RICE_sicily_historical_aspiration_action_sawdan:0 "#italic 随着阿拔斯帝国陷入混乱，大多数穆斯林都认为巴里埃米尔国是伊斯兰世界的边疆地带，倘若想在意大利永久建立伊斯兰政权，就必须带头保卫巴里这块穆斯林边陲地带，抵御各种敌人的入侵。#!$RICE_sicily_aspiration_sawdan_desc$"
 RICE_sicily_historical_aspiration_modifier_desc_sawdan:0 "[GetModifier('RICE_sicily_aspiration_establish_islam_in_southern_italy').GetNameWithTooltip]"
 RICE_sicily_aspiration_roger_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]：#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_sicily').GetNameNoTier]\n$EFFECT_LIST_BULLET$至少达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L][prestige_level|E]\n$EFFECT_LIST_BULLET$保持基督教[faith|E]\n\n#bold 奖励：#!\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$[head_of_faith|E]对你#P +25#![opinion|E]（倘若存在的话）\n$EFFECT_LIST_BULLET$在[GetGeographicalRegion('RICE_insular_sicily').GetName]的每个[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!：\n$EFFECT_LIST_BULLET$至少达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L][piety_level|E]（奖励：获得@legitimacy_icon!#V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#![legitimacy|E]）\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('d_sicily').GetNameNoTier][duchy|E]的[ruler|E]，或控制至少#V 10个#![counties|E]（奖励：获得[special_troops|E]：#V 400名#![GetMaA('RICE_sicily_bowmen').GetName]和#V 100名#![GetMaA('conrois').GetName]）\n$EFFECT_LIST_BULLET$让贝纳韦尔特皈依基督教[faith|E]或者让其死亡（奖励：获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#![dynasty_prestige|E]，若是将其皈依则额外获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]，若是其已死亡则额外获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]）"
 RICE_sicily_historical_aspiration_action_roger:0 "#italic 西西里岛被交战的穆斯林泰法势力分裂，但他们曾雇佣诺曼人作为雇佣兵，现在你和诺曼人同胞正可借此机会南下，征服这座美丽富饶的岛屿！#!$RICE_sicily_aspiration_roger_desc$"
