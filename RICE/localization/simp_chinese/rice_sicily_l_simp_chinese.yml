 sicily.0130.t:0 "[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]之旅"
 sicily.0130.desc.intro:0 "[GetGeographicalRegion('custom_sicily').GetName]，这片古老的土地，承载着悠久而传奇的历史。数百年来，许多名垂青史的伟人曾在此生活、奋斗，他们中的一些，如今安息在这座美丽的岛屿上，永远与这片土地相依为伴。\n"
 sicily.0130.desc.aristotle:0 "例如，著名的[greek.GetName]哲学家#bold 亚里士多德#!的棺椁，曾被悬挂在[GetTitleByKey('b_palermo').GetNameNoTier]一座主要的[palermo_faith.GetAdjective][palermo_faith.HouseOfWorshipPlural]的木梁之上。传说，这样的悬挂方式竟延续了数个世纪。"
 sicily.0130.desc.galen:0 "例如，传说中，著名的[greek.GetName]医生#bold 盖伦#!就长眠于[GetTitleByKey('b_palermo').GetNameNoTier]的郊外。据说，他已在那片静谧之地安息了数个世纪。"
 sicily.0130.desc.muslim:0 "据说，许多曾为对抗不公与异教徒而战的#bold 圣战士#!，如今长眠于[GetTitleByKey('b_palermo').GetNameNoTier]的郊外。这些坟墓据说散发着某种#italic baraka#!——一种神圣的祝福，辐射四方，守护着这片土地。"
 sicily.0130.desc:0 "\n\n我也将前往那里，追随前人的足迹，表达我深深的敬意。"
 sicily.0130.a:0 "去[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]！"
 sicily.0131.t:0 "抵达"
 sicily.0131.desc:0 "[GetTitleByKey('b_palermo').GetNameNoTier]一片繁忙，街头巷尾尽是熙熙攘攘的身影。从当地的工匠与农民，到自地中海各地远道而来的旅行者与商人，纷纷汇聚于此。然而，今日我来到这座城市，心中只有一个目的："
 sicily.0131.desc.aristotle:0 "向亚里士多德致敬。\n\n亚里士多德的学说传遍四方，举世的学者无不受其启迪。据传，这位哲人的遗体被安置在[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]一座主要的[palermo_faith.GetAdjective][palermo_faith.HouseOfWorshipPlural]的木梁之上。我穿过熙攘的人群，径直前往这座[palermo_faith.HouseOfWorship]，心怀敬仰。"
 sicily.0131.desc.galen:0 "向盖伦致敬。\n\n盖伦是医学史上的伟大人物，即使在今天，医生们仍然在学习他的著作。据说，这位医生被埋葬在[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]和该市郊区米西尔梅里之间的道路旁。无论如何，我很快就会离开这闷热的城市，前往乡间，探访盖伦的墓地。"
 sicily.0131.desc.muslim:0 "向那些在[GetGeographicalRegion('custom_sicily').GetName]陨落的圣战士致敬。\n\n当最初的穆斯林抵达这座岛屿时，这里尚且是个混乱的边疆地带，穆斯林派系之间争斗不断，同时还需抵御异教入侵者。据传，在[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]，遍布着这些早期虔诚战士的墓地。我正前往一座特别的城堡——#italic 萨德堡#!，它因安葬了众多这些战士的英魂而闻名于世。"
 sicily.0131.a:0 "我很快就会抵达。"
 sicily.0132.t:0 "亚里士多德"
 sicily.0132.desc:0 "终于，我来到了安放亚里士多德遗体的[palermo_faith.GetAdjective][palermo_faith.HouseOfWorship]。\n\n自然，我并非这里唯一的访客。虔诚的[palermo_faith.GetAdherentNamePlural]在此静默祈祷，还有几位像我一样，特意前来瞻仰亚里士多德棺木的游客。或许他们也在祈求他的庇佑，因为在[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]流传着一种古老的“传统”：向这位哲人祷告，能带来好运与丰沛的雨水。\n\n眼前的景象，或许在外人看来有些平淡无奇——一根悬挂着这位伟大思想家遗体的木梁。然而，站在这位古老人物的面前，面对留下无数传世之作的伟人，心中仍不禁升起一种深沉的敬意。"
 sicily.0132.a:0 "我在此静静沉思了片刻，随后才起身告别此地。"
 sicily.0133.t:0 "盖伦"
 sicily.0133.desc:0 "终于，我抵达了盖伦的墓地，坐落于[GetTitleByKey('b_palermo').GetNameNoTier]与米西尔梅里之间，稍稍偏东。\n\n这片地方显然比[GetTitleByKey('b_palermo').GetNameNoTierNoTooltip]的市中心要宁静许多，毕竟这里身处城市郊外。虽人迹稀少，但仍有几位旅人，或许和我一样，前来向这位伟大的医者致敬。\n\n眼前的景象，或许在外人看来有些平凡无奇——一座简朴而显眼的墓地，安息着这位医学巨匠。然而，站在这位古老人物的墓前，面对这位留下无数传世之作的伟人，心中依然涌起一种深深的敬意。"
 sicily.0133.a:0 "$sicily.0132.a$"
 sicily.0134.t:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的圣战士"
 sicily.0134.desc:0 "终于，我伫立在#italic 萨德堡#!前，这座城堡在[GetReligionByKey('islam_religion').GetAdjective]信徒中享有盛名。这里不仅安葬了许多在[GetGeographicalRegion('custom_sicily').GetName]为信仰而牺牲的高贵战士，据说还散发着某种#italic baraka#!，一种神圣的祝福，延展至四方。\n\n我并非独自前来表达敬意，周围还有其他人也在向这些勇敢忠诚的英雄致以崇高的敬意。我还特意前往附近的泉水#italic 狂人之泉#!，因为传言这泉水也蕴含着神圣之力。\n\n眼前的景象或许看似平凡无奇——一座座神圣战士的墓地，安卧在一个简朴的环境中。然而，站在这些令人敬仰的英雄面前，心中依然升腾起一股深深的敬意，久久不散。"
 sicily.0134.a:0 "$sicily.0132.a$"
