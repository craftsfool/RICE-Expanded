 RICE_sicily_palermo_tomb_visit_muslim_desc:0 "$EFFECT_LIST_BULLET$获得[GetModifier('RICE_sicily_muslim_tomb_visit').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$获得[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_piety_gain')|0]#![piety|E]\n$EFFECT_LIST_BULLET$如果你有[GetTrait('zealous').GetName( GetNullCharacter )]、[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]、[GetTrait('brave').GetName( GetNullCharacter )]或[GetTrait('gallant').GetName( GetNullCharacter )][traits|E]，则额外失去[stress_loss_i|E][stress|E]\n\n#weak [GetTitleByKey('c_palermo').GetNameNoTierNoTooltip]埋葬着许多圣战士，据说当地散发着祝福。#!"
