 sicily.0200.t:0 "法律机会主义"
 sicily.0200.desc:0 "我收到的报告称近来[county.GetNameNoTier]的[culture.GetName]平民倾向于回避奉行[culture.GetNameNoTooltip]法的法院，来解决他们的法律问题。\n相反，他们倾向于前往给非[culture.GetNameNoTooltip]群体服务的法院。他们觉得这能得到更好的结果。\n\n虽不是什么新鲜事，但它已经变得越来越普遍，而且我的[culture.GetNameNoTooltip]官员抱怨道这有损王国司法权威。当地的神职人员也认为这种宗教身份的模糊性和投机主义势必导致地区的神性衰退。"
 sicily.0200.a:0 "让他们更难去“其他”法院！"
 sicily.0200.b:0 "没事。这很务实，无可厚非。"
 sicily.0200.info:0 "#emphasis 历史背景：#!在中世纪，由于法律传统的多样性，多元文化地区往往有不同的法院，来为不同民族和宗教的群体服务。在中世纪早期的西西里，有一种趋势是当地人会前往对其最有利的法庭，而不管其是否“属于”那个群体。也就是说，一个穆斯林阿拉伯人，会去希腊基督徒法庭解决法律纠纷，反之亦然。\n\n这类情况的频繁发生表明了几点。首先，人们的身份人为可塑且摇摆不定，至少在法律意义上是如此。其次，人们意识到不同宗教和民族差异。最后，这些不同群体的法庭有足够的权威依据其自身的传统进行司法。"
 sicily.0201.t:0 "圣战之港"
 sicily.0201.desc:0 "一名[county.GetNameNoTier]的[GetReligionByKey('islam_religion').GetAdjective]知名学者被指控发表针对当地非[GetReligionByKey('islam_religion').GetAdjectiveNoTooltip]人口及我统治的煽动性言论。\n\n当这名学者被带至庭前审问时，这位学者，[scholar.GetFirstName]，辩称只是一个误会。[scholar.GetSheHe|U]只是提到[GetGeographicalRegion('custom_sicily').GetName]在[GetReligionByKey('islam_religion').GetAdjectiveNoTooltip]的政治理论中指的是#italic 圣战之港#!，“众所周知，”[scholar.GetSheHe]继续说道，”它指的是[GetReligionByKey('islam_religion').GetNameNoTooltip]与其他宗教的缓冲带，在那里每个人都有一定的法律期望“。\n\n我的一名廷臣[courtier.GetFirstName]，素来不喜[scholar.GetFirstNamePossessive]的文章及论点，声称[scholar.GetFirstNameNoTooltip]是在给[scholar.GetHerHis]自己开脱，事实上[scholar.GetSheHe]解释的法律期望一词也可理解为对异教徒或其庇护者的军事行动，换而言之是对我！\n\n在这种情况下，很难说谁是没有成见的。"
 sicily.0201.a:0 "[scholar.GetFirstNameNoTooltip]看起来挺有学问的，伴侍我左右吧。"
 sicily.0201.b:0 "[scholar.GetFirstNameNoTooltip]，罚款，就这样吧。"
 sicily.0201.c:0 "来人，将这个反贼押入[county.GetNameNoTierNoTooltip]地牢！"
 sicily.0201.info:0 "#emphasis 历史背景：#!在中世纪的伊斯兰教中，西西里岛被认为是介于#italic 伊斯兰世界#!和#italic 不信者之境#!的缓冲地带，有时候#italic 圣战之港#!亦指此地。\n\n例如，西西里阿拉伯诗人伊本·哈米斯（公元1056‑1133年）在其诗歌中援引该词。他年轻时因诺曼入侵而逃至西西里岛，他的诗歌常常勾起人们对天堂般故土的思念。\n\n然而，抛开这些术语神学和意识形态理解，现实中，伊斯兰世界对于如何在这类土地上生活行事，莫衷一是。"
 sicily.0202.t:0 "吾心吾行澄如明镜"
 sicily.0202.desc:0 "不少诽谤的流言传进了我的耳朵，一些[ROOT.Char.GetFaith.GetReligion.GetAdjective]冒险者、云游学者以及朝圣者对我在[GetGeographicalRegion('custom_sicily').GetName]的统治妄加非议。\n\n其中有一部分人，贬损了我和我的人民，指责我们陷入迷途，与异端和异教徒混在一起。毕竟异端一般是无知且有罪的。\n\n当然，这些全是不实的谎言。我深知他们会如何误解在[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]这样一个多元之地的边境，小心谨慎地与其他信仰的不信者和谐共处的行为。"
 sicily.0202.a:0 "这不是软弱！这是务实和谦卑！"
 sicily.0202.b:0 "我们是[ROOT.Char.GetFaith.GetName]的忠实信徒！"
 sicily.0202.info:0 "#emphasis 历史背景：#!一些中世纪的基督徒#italic 以及#!穆斯林史料用贬损的文字描述其西西里的同教者，认为他们宗教宽容或是缺乏虔信且愚昧无知。\n\n例如，10世纪的穆斯林学者和旅者伊本·霍卡尔对西西里的穆斯林评价奇低：评价他们愚蠢、贪婪，渴望与基督徒交往、通婚。他还嘲笑西西里穆斯林学者离经叛道，忘记了伊斯兰的基本教义。\n\n后来的13世纪，神罗皇帝腓特烈二世在西西里长大并将其视为权力中心，因此得名“受洗的苏丹”。一些基督徒#italic 和#!穆斯林鉴于其与伊斯兰世界的联系以及他对阿拉伯语和伊斯兰教的了解，认为他是一名地下穆斯林。\n\n身处像西西里岛这般不羁的边境地区，一定程度的宽容或者说至少愿意接触其他“世界”是立身之本。然而不了解这般复杂境地的局外人，总会持怀疑态度看待这份实用主义，甚至认为这是叛教和道德沦丧的迹象。"
 sicily.0203.t:0 "强龙不压地头蛇"
 sicily.0203.desc:0 "震惊！我委派给[county.GetNameNoTier]部分地区的官员被赶出了城镇。当地居民，在本地知名乡绅[leader.GetTitledFirstName]的领头下，要求我任命本地候选人继任！\n\n这般无礼行径放其他地方本应受到严惩。然而在[GetGeographicalRegion('custom_sicily').GetName]还真不新鲜。这样的边境之地，有时维持名义统治已属不易。\n\n一个机敏的[ROOT.Char.GetTitleAsNameNoTooltip]必须谨小慎微，以免触怒当地人引发民怨。更何况他们完全有可能拿自己人开刀，撵出城外。届时，他们还会要求我把之前的官员给派回来。"
 sicily.0203.a:0 "行行行，就安排他们想要的地方官。"
 sicily.0203.b:0 "这么想要，就让[leader.GetFirstNameNoTooltip]自己去管[county.GetNameNoTierNoTooltip]！"
 sicily.0203.c:0 "岂有此理！我可是[ROOT.Char.GetTitleAsNameNoTooltip]！"
 sicily.0203.info:0 "#emphasis 历史背景：#!这个事件的灵感来自阿格拉布以及继任者法蒂玛和卡勒卜王朝试图加强西西里地区领土的统治。该岛有时边境混乱，当地的西西里人（穆斯林及非穆斯林）逐渐建立起独立且自主的身份，常与北非高层政见不合。这些当地西西里人有时甚至会推翻自己以前支持的统治者。\n\n一个有趣的例子，发生在法蒂玛王朝第一次于北非掌权的时候。当地的西西里军队驱逐了最初派来管理的法蒂玛总督。公元913年，他们选举一名阿格拉布王朝的西西里总督伊本·古尔布为新总督。\n\n总之，伊本·古尔布宣誓效忠什叶派法蒂玛王朝的对手：巴格达的逊尼派阿拔斯哈里发。然而，在伊本·古尔布被法蒂玛王朝击败后（也许是在拜占庭的帮助下），许多西西里城市叛逃至法蒂玛阵营，最终在其试图逃回安达卢斯时被原支持者们抓获，并交由法蒂玛王朝处决。"
 sicily.0204.t:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的筑巢引凤"
 sicily.0204.desc:0 "[councillor.GetCouncilTitle]，[councillor.GetFirstName]提出在我[GetGeographicalRegion('custom_sicily').GetName]领内颁布一项政令。[councillor.GetSheHe|U]认为像[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]这样的边疆地区移民越多越好。\n\n“那么，怎样才能吸引移民呢？”[councillor.GetFirstName]在我们的内阁会议议程中说道。“简单，我们可以给新移民免征一段时间土地税。额，我想定居已久的本地人可能会不太高兴，毕竟我考虑的是长远利益”"
 sicily.0204.a:0 "值得一试，着手制定吧。"
 sicily.0204.b:0 "我宁可不得罪现有领民。"
 sicily.0204.info:0 "#emphasis 历史背景：#!中世纪意大利南部不断变动的国境使得当地统治者绞劲脑汁吸引新的定居者，来壮大和发展自身。举例来说，公元1035年，西西里的卡勒卜埃米尔国提出对“伊夫里基亚人”—也就是从北非迁入的新移民，免征土地税，而此举对“西西里人”——也就是久居此地的人并不适用。"
 sicily.0205.t:0 "向[ROOT.Char.GetFaith.PantheonTerm]祈祷"
 sicily.0205.desc:0 "今日在[ROOT.Char.GetCurrentLocation.GetName]处理公务时，我们突然感到脚下地动山摇。尽管这般情景在[GetGeographicalRegion('custom_sicily').GetName]并不少见，但这次震感更加强烈。在场的诸多廷臣和仆从都惊慌失措，认为大地震要来了。\n\n然而，当[courtier.GetFirstNameNoTooltip]镇定自若地喝到“让我们向上帝祈祷，虔信徒必将得到慰藉”后，众人纷纷放下心来。\n\n[courtier.GetHerHis|U]命令般的口吻阻止了恐慌的蔓延。但事后，不少廷臣对[courtier.GetFirstNameNoTooltip]向除[ROOT.Char.GetFaith.PantheonTerm]之外的其他神明祈祷的不敬颇有微词，即便只是间接地提到——毕竟[ROOT.Char.GetFaith.GetName]#italic 是#!我们宫廷的官方信仰。"
 sicily.0205.a:0 "[courtier.GetFirstNameNoTooltip]也没做错啥。"
 sicily.0205.b:0 "我会教教[courtier.GetFirstNameNoTooltip][courtier.GetHerHis]，什么是谨言慎行。"
 sicily.0205.info:0 "#emphasis 历史背景：#!该事件基于12世纪穆斯林旅行学者伊本·朱拜尔所记载的一则轶事。相传在1180年代，墨西拿王宫感受到地震颤动，年轻的国王威廉二世对宫中侍从所说的原话与此事件完全一致。\n\n无论真假，此事反映出尽管其宫廷名义上信奉基督教，但国王深知许多侍从并非基督徒。多年来，西西里国王对大量侍从私下信奉伊斯兰教的事实视而不见，这正是该地区悠久的宗教多元历史写照。"
 sicily.0206.t:0 "埃特纳冰鲜"
 sicily.0206.desc:0 "“哈，我等不及了！”当我的仆人端上冰糕时，我兴奋地说道。真的，从埃特纳火山带来的冰雪能制作最美味的甜点——当然，需要将其与恰当的水果、果汁和糖浆搭配！\n\n我急切地端起冰糕，大快朵颐，享受着甜蜜与清爽交织的双重感官盛宴。"
 sicily.0206.a:0 "美味！！！"
 sicily.0206.info:0 "#emphasis 历史背景：#!自古以来，人们就有用冰雪制作消暑甜品的文化传统。冰雪贸易在伊斯兰世界的历史上不可或缺，提取和储存冰雪的技术可能是伴随穆斯林征服和殖民而传入中世纪西西里的。从埃特纳火山凿出的冰被运送整个岛屿，并用以制作冰糕的前身。\n\n随着时间的推移，西西里将专门收集冰雪的职业称之为“nivaroli”。直至18世纪，利润丰厚的冰雪贸易还使得参与经营的当地贵族，时常陷入政法纠纷。nivaroli在20世纪被工业制冰行业取代，逐渐没落。"
 sicily.0207.t:0 "书吏和日历"
 sicily.0207.desc:0 "一天当我视察时，一名高官向我抱怨越来越多的书吏在行政文书的日期标注上频繁出错。\n\n“[ROOT.Char.GetLadyLord]，正如您所见，”官员说道，“[GetGeographicalRegion('custom_sicily').GetName]是个多元之地，我们需要确保不同信仰、不同起源的人都能看懂文件，这意味着书吏们标注日期时必须通晓多种历法。”\n\n官员担心这样下去，书吏们政事驰废，标注日期时马虎到使用非官方[ROOT.Char.GetCulture.GetCollectiveNoun]日历。哎，我的官员也不知如何是好。"
 sicily.0207.a:0 "哈，在其他日历上做数学题听起来就挺烦的。"
 sicily.0207.b:0 "做不好就开除他们，再雇些新的！"
 sicily.0207.info:0 "#emphasis 历史背景：#!鉴于中世纪意大利南部的文化多样性，西西里的伊斯兰埃米尔国或诺曼王国行文时使用的惯例也各式各样。例如，公文包括多种日期或历法、不同语言下的成文法术语共存等等。"
 sicily.0208.t:0 "[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的多语言"
 sicily.0208.desc:0 "这些天来，我听到越来越多有关我就职于[GetGeographicalRegion('custom_sicily').GetName]的[ROOT.Char.GetCulture.GetName]裔官员的非[ROOT.Char.GetCulture.GetLanguage.GetName]语言水平明显匮乏。该地区一直以来多民族杂居，统治者理应使用双语。\n\n我的[councillor.GetCouncilTitle]，[councillor.GetFirstName]，认为我们应当严格要求在职官员并且[councillor.GetSheHe|U]勒令他们加强学习，至少掌握一门[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]的外语，或者雇佣其他精通多门语言的。或者双管齐下！"
 sicily.0208.a:0 "他们应当集中精力学习拉丁语。"
 sicily.0208.b:0 "他们应当集中精力学习希腊语。"
 sicily.0208.c:0 "他们应当集中精力学习阿拉伯‑柏柏尔语。"
 sicily.0208.d:0 "我觉得当下这都不重要…"
 sicily.0209.t:0 "传统法"
 sicily.0209.desc:0 "[councillor.GetCouncilTitle][councillor.GetFirstName]带着一个有趣的提议找到我。\n\n“[GetGeographicalRegion('custom_sicily').GetName]治下多元杂居，有些既不属于[ROOT.Char.GetCulture.GetName]也不像您一般信仰[ROOT.Char.GetFaith.GetAdjective]的人担心，是否会被废除他们的传统法，”[councillor.GetSheHe]解释道，“当然，我们至少能保证尊重他们的传统法，但如果您能发表一些布告，承诺保护他们的传统法，将有助于缓解这份恐惧，并减少一些人的不臣之心”"
 sicily.0209.a:0 "这主意不错。起草布告吧。"
 sicily.0209.b:0 "我岂能如此软弱！"
 sicily.0209.info:0 "#emphasis 历史背景：#!在中世纪西西里这般多元地区，臣民起源不同，统治者发现保留传统法行之有效。例如，西西里的第一任国王，罗杰二世（公元1095‑1154）在1140年颁布了第一部法典（通常被错误的称为阿里亚诺法令），在其引言中宣布“新法……如是万民皆从。然吾治下千里异俗，土法亦然。法之存废，非轻易之举，苟非与吾地之法令大相径庭，则不可轻言废黜。”"
 sicily.0210.t:0 "危险的[GetGeographicalRegion('custom_sicily').GetNameNoTooltip]"
 sicily.0210.desc:0 "今天，一位外国旅者来到了我的宫廷，为我讲述其云游四海的冒险故事。\n\n他首先讲述了来此的不易：“虽说我早有了万事开头难的觉悟，但那么多人都劝告我‘[GetGeographicalRegion('custom_sicily').GetName]是一片美丽却危险的土地’还是令我踌躇。”不仅如此，他认识的其他旅者也都或出于恐惧、或出于敬畏，对[GetGeographicalRegion('custom_sicily').GetName]退避三舍。\n\n“[ROOT.Char.GetLadyLord]，”旅者继续讲道，“我本以为这会是片充满火山爆发、地震、风暴及船难的土地。我是做好了埋骨他乡的准备方敢来此的。”"
 sicily.0210.a:0 "但你没死不是么——这片土地与别处一般安全。"
 sicily.0210.b:0 "你可以说我们这儿民风剽悍，坚强勇毅。"
 sicily.0211.t:0 "巴亚：好地方还是坏地方？"
 sicily.0211.desc:0 "今天，我偶然听见[lover.GetTitledFirstName]与[hater.GetTitledFirstName]有关巴亚浴场附近[GetTitleByKey('b_napoli').GetNameNoTier]的古老辩论。\n\n“[hater.GetFaith.HighGodName]肯定不会宽恕任何去过巴亚的人，”[hater.GetFirstNameNoTooltip]说道，”古人有云，这般罪恶行径将招致已婚通奸、良善堕落，歹人作恶！“\n\n[lover.GetFirstNameNoTooltip]则辩称：”虽然不少古人像你一样扫兴，但更多的都明白巴亚温泉和浴场的重要性。那是个疗养圣地！有罪的是人，关巴亚啥事。“\n\n两人齐齐转向我，期待我的态度。"
 sicily.0211.a:0 "无所谓，我不在乎。"
 sicily.0211.b:0 "巴亚是个放松的不错去处。"
 sicily.0211.c:0 "诚然，巴亚鼓励罪行。"
 sicily.0211.info:0 "#emphasis 历史背景：#!尽管巴亚自远古或中古时期便是闻名的度假胜地，其所谓的疗养价值甚至在宗教领域也颇受推崇，却也饱受非议。\n\n许多史料严厉谴责巴亚为不道德之地。例如，罗马政治家兼法学家西塞罗在其律师生涯中，曾将一名贵妇的淫行与巴亚联系起来，以此破坏对方证词的可信度。\n\n甚至一些野史也提及其恶名。14世纪意大利作家乔瓦尼·薄伽丘（以其《十日谈》闻名）在小说#italic 《菲亚梅塔夫人的挽歌》#!中，将巴亚作为背景。主人公前往巴亚是为放松心神，逃避出轨的事实，岂料事与愿违。因为在巴亚，“即便最贞洁的烈女也会忘却妇道，比在任何地方都更为放纵”。\n\n无论如何，巴亚在中世纪早已家喻户晓，尽管众说纷纭。部分中世纪史料甚至借鉴了远古的记录，如维吉尔的作品。"
 sicily.0212.t:0 "[county.GetNameNoTierNoTooltip]的火山产品"
 sicily.0212.desc:0 "#emphasis 历史背景：#!自古以来，[county.GetNameNoTier]周边的火山地区就是各种炙手可热的珍稀矿物和石料来源。最近，这些产品的需求愈加旺盛，更高的利润使得当地经济蓬勃发展。"
 sicily.0212.a:0 "真是个好消息！"
 sicily.0213.t:0 "宝药"
 sicily.0213.desc:0 "在[GetTitleByKey('c_malta').GetNameNoTier]岛上，有一种特殊真菌，据说有许多神奇的药用功效——中东居民甚至称之为“宝药”。据传其原产地世所罕见，在欧洲和地中海，它只在一座[GetTitleByKey('c_malta').GetNameNoTierNoTooltip]附近的海岛上大量生长可供收获。\n\n今天，一些到访我宫廷的旅者想把这所谓的马耳他真菌送给我。它有多种用途，从伤口痊愈、避孕到治疗呕吐和痢疾，无所不能。"
 sicily.0213.a:0 "得此至宝！甚好！"
 sicily.0213.info:0 "#emphasis 历史背景：#!#italic 锁阳#!是开花科植物的一个属，被错误地称为马耳他真菌或马耳他蘑菇。历史上称其有多种药用功效，特别是用于伤口愈合。在近代早期，由于这种植物在欧洲和地中海地区的稀缺，中世纪后期统治马耳他的骑士团对其生产和出口做了严格限制。"
 sicily.0214.t:0 "舌石"
 sicily.0214.desc:0 "[GetTitleByKey('c_malta').GetNameNoTier]是舌石的主要出口地，舌石是一种形如蛇舌的罕见石头。许多人相信这种石头具有药用价值，特别是用以防毒。\n\n近来，[county.GetNameNoTier]的商人们期望与当地采收舌石的达成利润可观的贸易协定。考虑到这种产品的实用性，我也想投上一笔。"
 sicily.0214.a:0 "[county.GetNameNoTierNoTooltip]的商人可真聪明啊！"
 sicily.0214.info:0 "#emphasis 历史背景：#!中世纪的马耳他是鲨鱼牙齿化石的主要供应地，这些牙齿在当地被称为“舌石”或“蛇舌”。在中世纪时期，舌石在医疗用途中，主要用以防毒或疗毒。当地有一种传统，宴会时将舌石挂到餐桌的装饰树上，客人可以将其浸入他们的葡萄酒或饮料中，以确保不会中毒。"
 sicily.0215.t:0 "奶油甜馅煎饼卷"
 sicily.0215.desc:0 "今天晚饭后，有人给了我一大盆#italic 奶油甜卷#!。我好久没吃到这么美味可口的奶油糕点了！\n\n没有什么比[culture.GetName]古法制作的老式甜卷更好吃的了。真让人好奇，是哪个[GetGeographicalRegion('custom_sicily').GetName]的天才发明了它！"
 sicily.0215.a:0 "嗯呢，好吃极了！"
 sicily.0215.info:0 "#emphasis 历史背景：#!奶油甜卷是一种管状的油酥糕点，里面填充了奶油状里科塔奶酪，在西西里很受欢迎，具有很强的地域性。像多数人气食物一般，奶油甜卷的起源无从考究。不少传说声称奶油甜卷可能起源于西西里的穆斯林统治者后宫，或者生活在岛的修道院修女，但这些民间传说的真实性值得推敲。"
