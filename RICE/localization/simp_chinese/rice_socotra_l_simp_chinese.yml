 RICE_socotra_draft_bawarij_pirates:0 "招募信德海盗中的亡命徒"
 RICE_socotra_draft_bawarij_pirates_tooltip:0 "你将招募一些[bawarij_pirates|E]去为你战斗，即使这可能会产生意想不到的后果。"
 RICE_socotra_draft_bawarij_pirates_desc:0 "虽然印度洋的统治者与[indian_ocean_local_pirates|E]合作是很常见的事，但有时我们必须提供比平时更多的东西，尤其是像信德海盗这样令人畏惧而强大的海盗团体，作为帮助我们的动力。"
 RICE_socotra_draft_bawarij_pirates_confirm:0 "非常时期需要非常措施。"
 RICE_socotra_draft_bawarij_pirates_context_tooltip:0 "#emphasis 历史背景：#!与海盗黄金时代的欧洲私掠者类似，中世纪印度洋的海盗经常与国家合作，以实现互利互惠，其中包括提供军事援助。"
 RICE_socotra_draft_bawarij_pirates_requirement:0 "索科特拉岛地区目前没有#V 信德海盗侵扰#![county_modifier|E]"
 RICE_socotra_host_poetry_competition:0 "举办诗歌比赛"
 RICE_socotra_host_poetry_competition_tooltip:0 "你将以南阿拉伯民族的传统方式举办一次诗歌比赛。"
 RICE_socotra_host_poetry_competition_desc:0 "我应该把那些精通诗歌的人聚集在一起，看看他们中哪些人最能说会道!"
 RICE_socotra_host_poetry_competition_effect_tooltip:0 "各行各业的男男女女将聚集在你的首都，参加一场盛大的比赛，他们中谁能即兴创作出最伟大的诗歌？"
 RICE_socotra_host_poetry_competition_confirm:0 "诗歌是灵魂的语言！"
 RICE_socotra_host_poetry_competition_context_tooltip:0 "#emphasis 历史背景：#!虽然诗歌对于许多文化都很重要，但南阿拉伯地区的诗歌传统，如索科特拉岛人的诗歌，与阿拉伯半岛其他地方的阿拉伯诗歌有着显著的不同。在索科特拉岛上，人们经常举办诗歌比赛，看谁能根据给定的主题或话题即兴创作出最佳的诗篇。"
 RICE_socotra_moon_sacrifice:0 "举行祭月"
 RICE_socotra_moon_sacrifice_tooltip:0 "你将以传统的索科特拉岛方式向月神献祭。"
 RICE_socotra_moon_sacrifice_desc:0 "月神将一如既往地保护和引导索科特拉岛，只要我们做出令人满意的牺牲。"
 RICE_socotra_moon_sacrifice_effect_tooltip_1:0 "索科特拉岛得到一个正面或负面的状态，这取决于你的[traits|E]和你愿意牺牲多少"
 RICE_socotra_moon_sacrifice_effect_tooltip_2:0 "更大的祭品需要花费更多的[gold|E]，如果你不是多神教信徒的话，还需要花费[piety|E]"
 RICE_socotra_moon_sacrifice_effect_tooltip_3:0 "如果你做出这个决定，你的[court_chaplain|E]（或[realm_priest|E]）将对你有一个#N 负面看法#!！"
 RICE_socotra_moon_sacrifice_confirm:0 "愿月神指引并保护我们"
 RICE_socotra_moon_sacrifice_context_tooltip:0 "#emphasis 历史背景：#!尽管索科特拉岛在中世纪的中东被视为基督教的一个前哨站，但它很可能是一个宗教多元的岛屿，同时受到了穆斯林和多神教的影响。有记载说，索科特拉岛上有一种奇特的月祭传统——也许是当地原住民在基督教或伊斯兰教出现之前的一种习俗——一直延续到近代，这种祭祀可能涉及牺牲一个人的手，特别是在困难的时候。"
 RICE_socotra_moon_sacrifice_requirement_1:0 "是多神教信徒"
 RICE_socotra_moon_sacrifice_requirement_2:0 "索科特拉岛现在没有祭月选项"
 RICE_socotra_form_socotra_kingdom:0 "组建索科特拉王国"
 RICE_socotra_form_socotra_kingdom_tooltip:0 "你将把索科特拉岛改革成一个独立的[kingdom|E]。"
 RICE_socotra_form_socotra_kingdom_desc:0 "我们索科特拉岛人出身各异，有的是[bawarij_pirates|E]，有的是逃亡的奴隶，有的是来自远方的商人，我们自豪地作为一个独立王国站在一起。现在是印度洋上的其他国家承认我们的力量的时候了!"
 RICE_socotra_form_socotra_kingdom_confirm:0 "命运在等待着我们心爱的岛屿！"
 RICE_socotra_form_socotra_kingdom_context_tooltip:0 "#emphasis 历史背景：#!尽管索科特拉岛从未成为一个强大的国家，有时还被邻近强国占领，但也有时因为它偏远荒凉的地理位置而保持了独立。"
 RICE_socotra_indian_ocean_legacy_track_name:0 "海贸传承"
 RICE_socotra_indian_ocean_legacy_track_desc:0 "控制印度洋的贸易路线以获得更大的财富和影响力"
 RICE_socotra_indian_ocean_legacy_1_name:1 "东方贵族"
 RICE_socotra_indian_ocean_legacy_2_name:1 "繁荣港口"
 RICE_socotra_indian_ocean_legacy_3_name:0 "香料流动"
 RICE_socotra_indian_ocean_legacy_4_name:0 "海岸彼端"
 RICE_socotra_indian_ocean_legacy_5_name:0 "海权主义"
 RICE_socotra_indian_ocean_legacy_1_effect:0 "#V 投资索科特拉岛贸易品#!的[decision|E]在一生中可用多次。"
 RICE_socotra_indian_ocean_legacy_2_effect_1:0 "增加索科特拉岛[bawarij_pirate|E][courtiers|E]的生成概率。"
 RICE_socotra_indian_ocean_legacy_2_effect_2:0 "#V 信德海盗廷臣#! 现在可以在西印度洋的非索科特拉岛宫廷中生成了"
 RICE_socotra_indian_ocean_legacy_3_effect:0 "通过一个特殊的[decision|E]——#V 与印度洋海盗的合作#!，可以建立一个#V 印度洋海盗窝#!，如果你领土中还没有的话。"
 RICE_socotra_indian_ocean_legacy_5_effect:0 "解锁#V 印度洋海盗窝#!建筑链中的最后一座建筑"
 building_type_RICE_pirate_den_01:1 "印度洋海盗窝"
 building_type_RICE_pirate_den_01_desc:1 "武装商人和海盗之间的界限往往是模糊的。简单的掠夺往往不是一个可行的长期目标，因此在印度洋等许多海洋地区，精英们往往为了利益和收益与海盗合作，并削弱作为经济竞争对手的共同敌人。"
 building_RICE_pirate_den_01:0 "盗贼藏身处"
 building_RICE_pirate_den_01_desc:1 "尽管海盗们现在得到了国家的间接补贴，以掠夺共同的敌人，但这一地区的海盗们才刚刚开始在印度洋的这一部分建立立足点。"
 building_RICE_pirate_den_02:0 "黑市"
 building_RICE_pirate_den_02_desc:1 "这个地区的海盗正与当地的领主紧密合作，从竞争对手那里偷货，然后走私到其他地方。这是一种有利的安排，在印度洋上并不少见。"
 building_RICE_pirate_den_03:0 "海盗港"
 building_RICE_pirate_den_03_desc:1 "在地区统治者的帮助下，这里的海盗团伙已经积累了足够的财富和影响力，以维持他们自己的避难所，在那里他们可以管理他们的船队和从事贸易。"
 building_RICE_pirate_den_04:0 "海上要塞"
 building_RICE_pirate_den_04_desc:1 "这里有一个强大的要塞来保护这些海岸，恐吓那些胆敢违抗居住在这里的海盗和支持他们的当地统治者的人。无论是填满他们的金库，还是对抗敌人，这两个集团的利益是一致的。"
 building_type_RICE_bawarij_den_01:1 "信德海盗窝"
 building_type_RICE_bawarij_den_01_desc:1 "信德海盗是印度洋上最可怕的海盗团体之一，他们传统上是在索科特拉岛的基地开展活动的。多年来，他们有远见地与索科特拉岛当地的统治者合作，以实现共同利益，无论是公开的还是秘密的。"
 building_RICE_bawarij_den_01:0 "信德海盗藏身处"
 building_RICE_bawarij_den_01_desc:1 "虽然来自印度的信德海盗几个世纪以来一直把索科特拉岛作为行动基地，但这个岛与其说是一个有组织的总部，倒不如说是一个方便的避难所，信德海盗可以在这里藏身、并对商船进行掠夺。"
 building_RICE_bawarij_den_02:0 "信德海盗中转港"
 building_RICE_bawarij_den_02_desc:1 "信德海盗已经开始在索科特拉岛更长久地立足，根据需要与当地的领主合作（偶尔也会发生冲突），同时也从事贸易活动。"
 building_RICE_bawarij_den_03:0 "信德海盗港"
 building_RICE_bawarij_den_03_desc:1 "在积累了越来越多的财富和权力后，信德海盗和他们在索科特拉岛的合作者现在都可以维持更大的舰队以及一个相当大的贸易海港。"
 building_RICE_bawarij_den_04:0 "信德海盗堡垒"
 building_RICE_bawarij_den_04_desc:1 "在他们的商业伙伴和坚定的盟友，索科特拉岛的统治者的帮助下，信德海盗必将作为印度洋上最令人畏惧和最著名的海盗团体之一继续生存下去，因为他们从他们的基地派出了由战舰和武装商船组成的巨大舰队。"
 building_type_RICE_socotra_dragon_blood_forest_01:0 "龙血森林"
 building_type_RICE_socotra_dragon_blood_forest_01_desc:0 "龙血树是索科特拉岛最独特的植物之一，这些蘑菇状的树产生的红色汁液自古以来就闻名于世。"
 building_RICE_socotra_dragon_blood_forest_01:0 "龙血森林"
 building_RICE_socotra_dragon_blood_forest_01_desc:0 "索科特拉岛的荒野上点缀着许多龙血树。虽然分散在各处，但当地村庄的人们有从这些树中提取珍贵的红色汁液的古老方法。"
 building_RICE_socotra_dragon_blood_forest_02:0 "龙血丛林"
 building_RICE_socotra_dragon_blood_forest_02_desc:0 "随着索科特拉岛的不断发展和繁荣，为了满足对龙血树红色汁液的需求，更有效获得龙血树汁液方法正在发展。"
 building_RICE_socotra_dragon_blood_forest_03:0 "龙血树种植园"
 building_RICE_socotra_dragon_blood_forest_03_desc:0 "索科特拉岛上有大量的龙血树，现在是一个更系统化的产业的一部分，也是索科特拉岛经济的一个组成部分，尽管岛上仍然到处有这种植物的野生森林。"
