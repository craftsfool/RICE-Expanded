 socotra.0120.t:0 "[sorcerer.GetCulture.GetNameNoTooltip]巫术：强化力量"
 socotra.0120.desc:0 "据称[sorcerer.GetTitledFirstName]运用了传统的[sorcerer.GetCulture.GetLanguage.GetName]巫术增强了我们氏族成员的力量与体魄。毫无疑问，[sorcerer.GetSheHe]期盼着通过我们能进一步推动[sorcerer.GetDynasty.GetName]氏族的利益。"
 socotra.0120.a:0 "这就是巫术的威力！"
 socotra.0121.t:0 "[sorcerer.GetCulture.GetNameNoTooltip]巫术：赋予智慧"
 socotra.0121.desc:0 "据说[sorcerer.GetTitledFirstName]运用传统的[sorcerer.GetCulture.GetLanguage.GetName]巫术提升了我们氏族成员的整体智慧与审慎。显然我们[sorcerer.GetDynasty.GetName]家族谋求自身利益之时必将深受这份智慧的悉心指引。"
 socotra.0121.a:0 "$socotra.0120.a$"
 socotra.0122.t:0 "[sorcerer.GetCulture.GetNameNoTooltip]巫术：强化运势"
 socotra.0122.desc:0 "据称[sorcerer.GetTitledFirstName]运用传统的[sorcerer.GetCulture.GetLanguage.GetName]巫术能提升我们氏族成员的个人运势与世俗财富。毫无疑问，在这个危机四伏的世界里，[sorcerer.GetDynasty.GetName]氏族需要竭尽所能获取一切资源来守护自身利益。"
 socotra.0122.a:0 "$socotra.0120.a$"
