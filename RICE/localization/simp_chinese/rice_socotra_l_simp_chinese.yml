 socotra.0110.intro:0 "[ROOT.Char.GetCulture.GetCollectiveNoun]的巫术虽为外人所畏惧，却也可用于行善。我本人对这些咒语与法术也略知一二。\n\n"
 socotra.0110.t:0 "[ROOT.Char.GetCulture.GetName]巫术：振兴氏族"
 socotra.0110.desc:0 "$socotra.0110.intro$若想让我们[sorcerer.GetDynasty.GetName]家族在这严酷的世界中存续，仅凭些许巫术或许无法确保胜利，但它必将极大地助力我们达成目标。\n\n我应当准备施展恰当的巫术，并思忖如何壮大我的家族。"
 socotra.0110.a:0 "增强实力"
 socotra.0110.b:0 "获得智慧"
 socotra.0110.c:0 "赐予财运"
 socotra.0110.strong:0 "这巫术具有#Bold 强大#!的效果。"
 socotra.0110.normal:0 "这巫术具有#Bold 一般#!的效果。"
 socotra.0110.weak:0 "这巫术具有#Bold 微弱#!的效果。"
 socotra.0111.t:0 "[ROOT.Char.GetCulture.GetName]巫术：削弱敌人"
 socotra.0111.desc:0 "$socotra.0110.intro$总有一些人恨不得置我于死地，或是让我吃点苦头，不管是来虚的还是来实的。虽说巫术并非万无一失的护身之法，无法彻底抵御敌人的种种阴谋诡计，但它#italic 可以#!派上用场。\n\n我将着手准备施展相应的巫术，以应对敌人锋利的刀刃、阴险的谗言以及黑暗的邪术。"
 socotra.0111.a:0 "$socotra.0120.a$"
 socotra.0111.strong:0 "$socotra.0110.strong$"
 socotra.0111.normal:0 "$socotra.0110.normal$"
 socotra.0111.weak:0 "$socotra.0110.weak$"
 socotra.0112.t:0 "[ROOT.Char.GetCulture.GetName]巫术：祈水"
 socotra.0112.desc:0 "$socotra.0110.intro$众所周知，水对于生命、滋养作物和牲畜至关重要。巫术最伟大且最古老的用途之一，便是借助降雨、井水及其他地下水源，确保水源源源不断、持续不断。\n\n我已准备好施展一些魔法，祈求[ROOT.Char.GetFaith.HighGodName]聆听我的祷告，并赐予我的土地繁荣所需的水源。"
