 TRAIT_FLAG_DESC_rice_socotra_sorcery_decision_unlock: "解锁独特的[RICE_socotra_sorcery|E]机制，例如无论[culture|E]如何，都能使用#V $RICE_socotra_cast_insular_sorcery$#![decision|E]。"
 TRAIT_FLAG_DESC_rice_socotra_sorcery_decision_bonus: "提升[trait_level_track_xp|E]可降低#V $RICE_socotra_cast_insular_sorcery$#![decision|E]所需的[gold_i|E][gold|E]与[piety_i|E][piety|E]#V 成本#!及#V 冷却时间#!。"
 RICE_socotra_aspiration_rahabhan_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$保持作为[GetTitleByKey('c_socotra').GetNameNoTier]的[independent|E][ruler|E]\n$EFFECT_LIST_BULLET$拥有至少[gold_i|E]#V [EmptyScope.ScriptValue('RICE_aspiration_tiny_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$[piety_level|E]达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高，或者[prestige_level|E]达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高\n$EFFECT_LIST_BULLET$至少拥有一位[adult|E]子女，且其至少一项[skill|E]达到#V 12#!\n$EFFECT_LIST_BULLET$至少使用一次#V $RICE_socotra_cast_insular_sorcery$#![decision|E]\n$EFFECT_LIST_BULLET$确保你的外国妻子对你的[opinion|E]至少为[opinion_i|E]#P 50#!（前提是仍然在世）\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$获得@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]（前提是[prestige_level|E]达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高）\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]（前提是[piety_level|E]达到[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]或更高）\n$EFFECT_LIST_BULLET$获得@gold_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![gold|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_socotra').GetNameNoTier]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_socotra_rahabhan_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$成为你外国妻子的[friend|E]、[best_friend|E]、[lover|E]或[soulmate|E]中的身份之一（前提是她仍然在世）（奖励：终身获得[GetModifier('RICE_socotra_rahabhan_wife_relationship_modifier').GetNameWithTooltip][modifier|E]）\n$EFFECT_LIST_BULLET$至少执行一次$RICE_socotra_moon_sacrifice$[decision|E]（奖励：获得一个[intrigue_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$将[GetTrait('RICE_socotra_sorcerer').GetName( GetNullCharacter )][trait|E]的[trait_level_track_xp|E]提升至#V 50#!（奖励：获得一个[learning_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$至少使用一次$RICE_socotra_draft_bawarij_pirates$[decision|E]（奖励：获得#V 1000#![special_troops|E]，包括一些[men_at_arms|E]）"
 RICE_socotra_historical_aspiration_action_rahabhan: "#italic 凭借智谋驱逐外敌后，我在索科特拉岛上赢得了众人的敬重。在我那位自称拥有魔法的异国妻子协助下，我将统御岛上其他部族，并巩固这座龙血岛，以抵御未来的入侵。#!$RICE_socotra_aspiration_rahabhan_desc$"
 RICE_socotra_historical_aspiration_modifier_desc_rahabhan: "[GetModifier('RICE_socotra_aspiration_conslidate_clan').GetNameWithTooltip]"
 RICE_socotra_aspiration_conslidate_clan: "[RICE_aspiration|E]：巩固氏族对索科特拉岛的影响"
 RICE_socotra_aspiration_conslidate_clan_desc: "#italic 通过智谋驱逐了外来入侵者后，拉赫班赢得了索科特拉岛上许多人的尊敬。在他自称拥有魔法的外国妻子的协助下，他意图统治索科特拉岛的其他部族，并加强龙血岛的防御以抵御未来的入侵。#!$RICE_socotra_aspiration_rahabhan_desc$\n\n"
