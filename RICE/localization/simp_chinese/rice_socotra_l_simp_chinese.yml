 game_concept_indian_ocean_local_pirate:0 "本地海盗"
 game_concept_indian_ocean_local_pirates:0 "本地海盗"
 game_concept_indian_ocean_pirate_desc:0 "印度洋的[RICE_pirates|E]和私掠者在游戏中以几种不同的方式表现出来。首先，在印度洋沿岸满足一定条件的统治者可以采用[decision|E]，建造一个名为“印度洋海盗窝”的[special_building|E]。它有一些军事和经济方面的奖励，有几个[counties|E]甚至在游戏开始时就已经有了这个建筑，通常是那些历史上以接纳海盗或与海盗合作而闻名的国家。\n\n索科特拉岛有一个[special_building|E]，叫做“信德海盗窝”，代表了可怕的信德海盗，他们是在索科特拉岛生活的印度海盗。“索科特拉岛”的一些机制甚至围绕着信德海盗。例如，索科特拉岛[county|E]的[rulers|E]可以在战争中采用[decision|E]招募信德海盗，以一个破坏性的负面[county_modifier|E]为代价来增强军队实力。如果他们把“信德海盗窝”提升到适当的水平，他们还可以采用[decision|E]成立索科特拉[kingdom|E]。\n\n最后，信德海盗有时可能会通过事件以[courtiers|E]的身份出现。这仅限于索科特拉岛的[rulers|E]和印度洋的[rulers|E]，他们的王朝已经在海上贸易中解锁了[GetDynastyPerk('RICE_socotra_indian_ocean_legacy_2').GetName][dynasty_perk|E]。这些人都是强有力的强者，他们往往是优秀的[knights|E]或[commanders|E]。\n\n$RICE_pirate_indian_ocean_decision$的[decision|E]还有几个选项。大多数选项都可以通过在你的领地上拥有一个印度洋海盗窝或$RICE_pirate_indian_ocean_connections_modifier$[modifier|E]来解锁，后者可以通过上述[decision|E]]中的$RICE_pirate_establish_relations_name$选项获得。"
 RICE_socotra_pirate_infestation:0 "海盗侵扰"
 RICE_socotra_pirate_infestation_desc:0 "地区统治者已经开始主动与当地海盗合作，通过允许他们在这些土地上建立永久基地来进行抢劫和贸易，实现互惠互利。然而，海盗首领要想控制他们的海盗同伴，并将他们融入附近的社区和地方权力结构，还需要一段时间。"
 RICE_socotra_invest_myrrh:0 "对索科特拉岛没药的投资"
 RICE_socotra_invest_myrrh_desc:0 "该角色最近投资于索科特拉岛的贸易出口，特别是没药。由没药树的树脂制成，这种物质自古以来就被用作香水、熏香和药物，有许多令人愉快的特性。"
 RICE_socotra_county_invest_myrrh:0 "对索科特拉岛没药的投资"
 RICE_socotra_county_invest_myrrh_desc:0 "索科特拉岛的统治者最近投资于该岛的贸易商品之一，没药。这种物质由没药树的树脂制成，自古以来就被用作香水、香精和药物，具有许多令人愉悦的特性。"
 RICE_socotra_invest_socotrine_aloe:0 "对索科特拉岛东非芦荟的投资"
 RICE_socotra_invest_socotrine_aloe_desc:0 "该角色最近投资了一种贸易出口的索科特拉岛荟。这种芦荟品种是索科特拉岛独有的，自古以来就因其药用和治疗特性而闻名，特别是作为一种泻药。"
 RICE_socotra_county_invest_socotrine_aloe:0 "对索科特拉岛东非芦荟的投资"
 RICE_socotra_county_invest_socotrine_aloe_desc:0 "索科特拉岛的统治者最近投资了岛上的一种贸易商品，索科特拉岛芦荟。这种芦荟品种是索科特拉岛有的，自古以来就因其药用和治疗特性而闻名，特别是作为一种泻药。"
 RICE_socotra_invest_frankincense:0 "对索科特拉乳香的投资"
 RICE_socotra_invest_frankincense_desc:0 "该角色最近投资了一项出口索科特拉岛乳香的贸易，尽管索科特拉岛的乳香种植园不像古代那么大，但在需求量最大的时候，他们仍然赚了不少钱。乳香树脂在世界各地被用于宗教和医疗目的。"
 RICE_socotra_county_invest_frankincense:0 "对索科特拉乳香的投资"
 RICE_socotra_county_invest_frankincense_desc:0 "索科特拉岛的统治者最近投资了该岛的贸易商品之一，乳香。尽管索科特拉岛的乳香种植园不像古代那么大，但在需求量最大的时候，他们仍然赚了不少钱。乳香树脂在世界各地被用于宗教和医疗目的。"
 RICE_socotra_invest_desert_rose:0 "对索科特拉沙漠玫瑰的投资"
 RICE_socotra_invest_desert_rose_desc:0 "该角色最近投资了一个索科特拉岛的出口贸易，即沙漠玫瑰。虽然沙漠玫瑰是一种生长在整个非洲和阿拉伯地区的灌木，但索科特拉岛有一种独特的变种，它不仅比其他沙漠玫瑰大，而且有一个树干状的底部茎，可以容纳大量的水分。据称，它有一些药用价值。"
 RICE_socotra_county_invest_desert_rose:0 "对索科特拉沙漠玫瑰的投资"
 RICE_socotra_county_invest_desert_rose_desc:0 "索科特拉岛的统治者最近投资了这个岛屿的贸易商品之一，沙漠玫瑰。虽然沙漠玫瑰是一种生长在非洲和阿拉伯的灌木，但索科特拉岛有一种独特的植物变种，它不仅比其他沙漠玫瑰大，而且有一个树干状的底部茎，可以容纳大量的水分。据说它有一些药用价值。"
 RICE_socotra_invest_dragons_blood:0 "对索科特拉龙血竭的投资"
 RICE_socotra_invest_dragons_blood_desc:0 "该角色最近投资了索科特拉岛的龙血竭贸易出口。这种树脂是索科特拉岛最著名和最有利可图的出口产品之一，它是通过砍伐蘑菇状的龙血树（这种树在世界上其他地方都没有生长）并仔细提取树液而制成的。它被用作药物、染料、清漆、香，用于魔法仪式和炼金术。"
 RICE_socotra_county_invest_dragons_blood:0 "对索科特拉龙血竭的投资"
 RICE_socotra_county_invest_dragons_blood_desc:0 "索科特拉岛的统治者最近投资于该岛的贸易商品之一，龙血竭。龙血竭是索科特拉岛最著名和最有利可图的出口产品之一，这种树脂是通过砍伐蘑菇状的龙血树（这种树在世界上其他地方都没有生长）并仔细提取树液制成的。它被用作药物、染料、清漆、香，用于魔法仪式和炼金术。"
 RICE_socotra_invest_ambergis:0 "对索科特拉龙涎香的投资"
 RICE_socotra_invest_ambergis_desc:0 "该角色最近投资了索科特拉龙涎香的贸易出口。这种物质是由鲸鱼分泌的，所以通常必须通过捕猎这些大型危险生物才能获得，索科特拉岛其以龙涎香的品质而闻名。它有多种用途，如制造香水、食品、饮料、药物和壮阳药。"
 RICE_socotra_county_invest_ambergis:0 "对索科特拉龙涎香的投资"
 RICE_socotra_county_invest_ambergis_desc:0 "该角色最近投资了索科特拉岛的龙涎香贸易出口。这种物质是由鲸鱼分泌的，所以通常必须通过捕猎这些大型危险生物才能获得，索科特拉岛其以龙涎香的品质而闻名。它被制造香水、食品、饮料、药物和壮阳药。"
 RICE_socotra_bawarij_infestation:0 "信德海盗侵扰"
 RICE_socotra_bawarij_infestation_desc:0 "由于过去的协议，索科特拉岛当地的统治者被迫对信德海盗参与的一些可疑的活动视而不见，即使这些活动不利于索科特拉岛。"
 RICE_socotra_bawarij_character_modifier:0 "曾为信德海盗"
 RICE_socotra_bawarij_character_modifier_desc:0 "这位勇士曾经是信德海盗的一员，这是一个臭名昭著的海盗团体，起源于印度次大陆，以索科特拉岛为基地。他和他的战友们在印度洋各地航行，掠夺沿岸地区，袭击商船，以获取财富和恶名。"
 RICE_socotra_former_slave_modifier:0 "曾为奴隶"
 RICE_socotra_former_slave_modifier_desc:0 "该角色曾是一个奴隶，但最终要么成功逃脱，要么被他们的前主人释放，从那时起他们开始了新的生活。"
 RICE_socotra_opinion_moon_heathen:0 "进行亵渎的月神祭祀"
 RICE_socotra_zahra_modifier:0 "诗人扎赫拉"
 RICE_socotra_zahra_modifier_desc:0 "这位索科特拉岛贵族妇女因维护当地穆斯林社区而出名，她在诗歌方面的口才和能力也因此而出名。她真是一个令人敬畏和鼓舞人心的女人!"
