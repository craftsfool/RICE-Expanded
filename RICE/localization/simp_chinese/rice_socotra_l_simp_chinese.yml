 RICE_socotra_muslim_concessions:0 "对索科特拉岛穆斯林的让步"
 RICE_socotra_indian_ocean_merchant_modifier:0 "印度洋商人"
 RICE_socotra_indian_ocean_merchant_modifier_desc:0 "该角色最初是海上丝绸之路上一个有进取心的商人。"
 RICE_socotra_indian_ocean_sailor_modifier:0 "印度洋水手"
 RICE_socotra_goats_overgrazing:0 "索科特拉岛山羊过度放牧"
 RICE_socotra_learning_about_dragons_blood:0 "关于龙血竭的宝贵知识"
 RICE_socotra_bawarij_out_of_control:0 "信德海盗缺乏纪律"
 RICE_socotra_bawarij_out_of_control_desc:0 "信德海盗的首领一直无法平息其队伍中日益增长的不满情绪和缺乏纪律的情况，这使他和索科特拉岛的统治者都感到头痛。"
 RICE_socotra_dolphin_sightings:0 "在索科特拉岛发现海豚"
 RICE_socotra_dolphin_sightings_desc:0 "该角色物最近在索科特拉岛海岸看到了海豚。根据索科特拉岛的民间传说，这是好运的象征！"
 RICE_socotra_shipwreck_distribution:0 "海难救助"
 RICE_socotra_shipwreck_distribution_desc:0 "最近，由几艘商船组成的船队在索科特拉岛海岸附近遭遇海难。当地统治者很慷慨地决定让当地人尽可能多地打捞船只和货物。"
 RICE_socotra_chameleons_curse:0 "变色龙的诅咒"
 RICE_socotra_chameleons_curse_desc:0 "该角色最近说话有点困难。也许这只是一个巧合，他们的演讲和修辞技能已经不像以前那样了。但也有人说，该角色在遇到索科特拉岛变色龙时被诅咒了，这是索科特拉岛的一种常见迷信。"
 RICE_socotra_opinion_cave_picnic:0 "索科特拉岛山洞野餐"
 RICE_socotra_eating_lots_of_urchins:0 "大量供食索科特拉岛海胆"
 RICE_socotra_eating_lots_of_crab:0 "大量供食索科特拉岛螃蟹"
 RICE_socotra_eating_lots_of_fish:0 "大量供食索科特拉鱼"
 RICE_socotra_good_frankincense:0 "乳香的利润"
 RICE_socotra_good_frankincense_desc:0 "最近乳香贸易很好，给索科特拉岛带来了比以往更多的利润。"
 RICE_socotra_stumbled_on_cave:0 "探索索科特拉岛的古洞穴"
 RICE_socotra_stumbled_on_cave_desc:0 "该角色曾经迷失在索科特拉岛的一个古老洞穴里，目睹了索科特拉岛古代居民留下的艺术。"
 RICE_socotra_knowledge_of_socotran_history:0 "索科特拉岛历史知识"
 RICE_socotra_turtle_hunting_good:0 "索科特拉岛捕龟业繁荣"
 RICE_socotra_admiring_Socotras_beauty:0 "欣赏索科特拉岛的美景"
 RICE_socotra_new_kingdom:0 "索科特拉岛出现了一个新王国"
 RICE_socotra_collaborate_with_pirates:0 "与印度洋海盗合作"
 RICE_socotra_collaborate_with_pirates_tooltip:0 "你将与[indian_ocean_local_pirate|E]进行谈判，允许他们在你的领土上维持一个活动基地，以换取他们的利润分成，并承诺不骚扰你保护下的商人。"
 RICE_socotra_collaborate_with_pirates_desc:0 "当你们可以一起从共同的敌人身上获利时，为什么还要去对抗这些[indian_ocean_pirates|E]呢？"
 RICE_socotra_collaborate_with_pirates_effect_tooltip:0 "你的首都获得了[special_building|E]#V 海盗窝#!， #V 海盗窝#!提供各种强大的军事和经济奖励，并可以进一步升级。（@warning_icon!#X 这将阻止其他[special_buildings|E]出现在此[province|E]）"
 RICE_socotra_collaborate_with_pirates_confirm:0 "让我们为互惠互利进行谈判！"
 RICE_socotra_collaborate_with_pirates_requirement_1:0 "首都位于印度洋沿岸且没有[special_buildings|E]"
 RICE_socotra_collaborate_with_pirates_requirement_2:0 "你的[dynasty|E]已解锁[GetDynastyPerk('RICE_socotra_indian_ocean_legacy_3').GetName][dynasty_perk|E]"
 RICE_socotra_collaborate_with_pirates_requirement_3:0 "没有一个地区存在海盗窝"
 RICE_socotra_collaborate_with_pirates_context_tooltip:0 "#emphasis 历史背景：#!武装商人和海盗之间的界限常常模糊不清。简单的掠夺往往不是一个可持续的长期目标。因此，历史上在印度洋等许多海洋地区，许多精英经常与海盗合作，以谋求利益和收益，并削弱作为经济竞争对手的共同敌人。"
 RICE_socotra_invest_in_socotran_trade_goods:0 "投资索科特拉岛贸易商品"
 RICE_socotra_invest_in_socotran_trade_goods_tooltip:0 "你将投资于来自索科特拉岛的几种稀有贸易品中的一种。"
 RICE_socotra_invest_in_socotran_trade_goods_desc:0 "几代人以来，索科特拉岛一直以拥有多种稀有珍贵资源而闻名。这些给该岛带来了很多利润。"
 RICE_socotra_invest_in_socotran_trade_goods_effect_tooltip:0 "你将在代表不同的索科特拉岛贸易货物的几个中选择一个"
 RICE_socotra_invest_in_socotran_trade_goods_confirm:0 "我们投资什么？"
 RICE_socotra_invest_in_socotran_trade_goods_context_tooltip:0 "#emphasis 历史背景：#!由于地处偏远，索科特拉岛拥有许多稀有的植物和动物。它也曾经是乳香和没药的主要出口国。"
