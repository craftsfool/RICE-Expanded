 socotra.0041.t:0 "赞美月亮"
 socotra.0041.desc:0 "月亮是一个强大的实体，能够带来巨大的祝福和巨大的诅咒。自古以来，索科特兰人就为它举行祭祀活动。我们认为这些做法与对[ROOT.Char.GetFaith.HighGodName]的崇拜之间没有冲突，外国人认为这些祭祀活动说的好听是巫术，说得难听就是恶魔祭祀。\n\n我已经安排了今晚向月亮举行的大祭祀，许多人都会参与其中。当地的一位长老将在那里解释我的祭祀结果。现在，我为月亮安排了什么样的祭祀？"
 socotra.0041.a:0 "一个标准的水果和肉类祭品"
 socotra.0041.b:0 "盛大而奢侈的祭月活动"
 socotra.0041.c:0 "按照古老的传统，一个普通人献出了自己的手"
 socotra.0041.pos_major:0 "月神为你送上许多祝福！"
 socotra.0041.pos_minor:0 "月神为你送上一份小小的祝福！"
 socotra.0041.neg_minor:0 "月神给你送来了一个小小的诅咒！"
 socotra.0041.neg_major:0 "月神给你送来了巨大的诅咒！"
