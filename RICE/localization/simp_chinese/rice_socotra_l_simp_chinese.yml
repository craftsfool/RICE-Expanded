 socotra.0112.normal:0 "$socotra.0110.normal$"
 socotra.0112.weak:0 "$socotra.0110.weak$"
 socotra.0113.t:0 "[ROOT.Char.GetCulture.GetName]巫术：隔绝海岸"
 socotra.0113.desc:0 "$socotra.0110.intro$关于我们巫术力量的传说在[Glossary( '七海', 'SEVEN_SEAS_GLOSS' )]间悄然流传，其中许多故事都涉及我们能通过操控天气、令岛屿与海岸线凭空消失，以及施放强大的魔法攻击，重创那些胆敢侵入我方疆域的来犯之敌\n\n经过一番准备，我已准备好施展必要的巫术来守护我们的海岸。"
 socotra.0113.a:0 "$socotra.0120.a$"
 socotra.0113.strong:0 "$socotra.0110.strong$"
 socotra.0113.normal:0 "$socotra.0110.normal$"
 socotra.0113.weak:0 "$socotra.0110.weak$"
 socotra.0114.t:0 "[ROOT.Char.GetCulture.GetName]巫术：祝福船只"
 socotra.0114.desc:0 "$socotra.0110.intro$抵达我方港口的友好船只通常会受到古老传统仪式的欢迎，以感谢[ROOT.Char.GetFaith.HighGodName]保佑其平安抵达，并祈求继续得到庇佑。\n\n无论是渔船、商船还是保卫我们海岸的战舰，这些船只都能通过巫术获得保护。"
 socotra.0114.a:0 "$socotra.0120.a$"
 socotra.0114.strong:0 "$socotra.0110.strong$"
 socotra.0114.normal:0 "$socotra.0110.normal$"
 socotra.0114.weak:0 "$socotra.0110.weak$"
