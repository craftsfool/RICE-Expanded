 RICE_socotra_rahabhan_wife_relationship_modifier:0 "忠心耿耿且传奇的异国妻子"
 RICE_socotra_rahabhan_wife_relationship_modifier_desc:0 "尽管拉赫班来自相对偏远的索科特拉岛，他却成功迎娶了一位以所谓魔法能力闻名的外国妻子。他与妻子之间的默契关系在许多场合都给予了他帮助。"
 RICE_socotra_cast_insular_sorcery:0 "施放岛屿魔法"
 RICE_socotra_cast_insular_sorcery_tooltip:1 "我们的人民早已了解魔法的力量。"
 RICE_socotra_cast_insular_sorcery_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun]世代研习[RICE_socotra_sorcery|E]。尽管外人对此心存畏惧，但[RICE_socotra_sorcery|E]既可造福众生，亦能降下灾厄。"
 RICE_socotra_cast_insular_sorcery_effect_tooltip_1:1 "根据你的[piety_i|E][piety_level|E]、[GetTrait('RICE_socotra_sorcerer').GetName(GetNullCharacter)][trait|E]中的[trait_level_track_xp|E]以及[skills|E]（尤其是[learning_i|E][learning|E]），巫术将赋予你#Bold 微弱#!、#Bold 一般#!或#Bold 强大#!的加成。"
 RICE_socotra_cast_insular_sorcery_effect_tooltip_2:1 "根据[RICE_socotra_sorcery|E]的强度，获得[GetTrait('RICE_socotra_sorcerer').GetName(GetNullCharacter)][trait|E]的[trait_level_track_xp|E]，若尚未拥有该[trait|E]，则有一定几率获得。"
 RICE_socotra_cast_insular_sorcery_confirm:0 "他们必将畏惧我们的巫术！"
 RICE_socotra_cast_insular_sorcery_context_tooltip:0 "#emphasis 历史背景：#!许多古代与中世纪文献都提及索科特拉（及与之相关的马赫里等民族）似乎擅长巫术，例如马可·波罗与伊本·穆贾维尔等穆斯林史料曾宣称索科特拉人能召唤狂风驱离船只。尽管这些记载显然存在夸张成分，但巫术与魔法在索科特拉民间传说中确实占据重要地位，这可能反映了历史上索科特拉基督教与伊斯兰教曾与当地信仰习俗相互融合的痕迹。"
 RICE_SOCOTRA_SORCERY_PICK_TYPE:0 "$RICE_socotra_cast_insular_sorcery_confirm$"
 RICE_socotra_cast_insular_sorcery_type:0 "我们的[RICE_socotra_sorcerers|E]该怎么做呢？"
 RICE_socotra_cast_insular_sorcery_select_text:0 "$RICE_socotra_cast_insular_sorcery_type$\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_socotra_cast_insular_sorcery_rejuvenate_clan_name: "#V #Bold 振兴氏族#!#!"
 RICE_socotra_cast_insular_sorcery_rejuvenate_clan_desc: "$RICE_socotra_cast_insular_sorcery_rejuvenate_clan_name$"
 RICE_socotra_cast_insular_sorcery_rejuvenate_clan_tooltip: "#italic 我们的族人需要疗愈与强化，以应对未来的挑战。#!"
 RICE_socotra_cast_insular_sorcery_rejuvenate_clan_effect_tooltip_1: "在三种方式中选择一项[modifiers|E]，以提升你[dynasty_members|E]的[skills|E]：\n$EFFECT_LIST_BULLET$#bold 力量#!：[fertility|E]、@health_icon![health|E]、[martial_i|E][martial|E]、[prowess_i|E][prowess|E]\n$EFFECT_LIST_BULLET$#bold 智慧#!：[opinion_i|E][opinion|E]、[piety_i|E][piety|E]、[diplomacy_i|E][diplomacy|E]、[learning_i|E][learning|E]\n$EFFECT_LIST_BULLET$#bold 财富#!：[gold_i|E][income|E]、[prestige_i|E][prestige|E]、[stewardship_i|E][stewardship|E]、[intrigue_i|E][intrigue|E]"
 RICE_socotra_cast_insular_sorcery_impair_enemies_name: "#V #Bold 削弱敌人#!#!"
 RICE_socotra_cast_insular_sorcery_impair_enemies_desc: "$RICE_socotra_cast_insular_sorcery_impair_enemies_name$"
 RICE_socotra_cast_insular_sorcery_impair_enemies_tooltip: "#italic 我们将削弱对手的力量，用幻象和恐怖的景象迷惑他们。#!"
 RICE_socotra_cast_insular_sorcery_impair_enemies_effect_tooltip_1: "获得一个[modifier|E]，降低针对你的[hostile_schemes|E]的效果，提升[advantage|E]，并可能提升你自身[hostile_schemes|E]的效果，同时增加敌人在[battles|E]中的[casualties|E]。"
 RICE_socotra_cast_insular_sorcery_pray_for_water_name: "#V #Bold 祈水#!#!"
 RICE_socotra_cast_insular_sorcery_pray_for_water_desc: "$RICE_socotra_cast_insular_sorcery_pray_for_water_name$"
 RICE_socotra_cast_insular_sorcery_pray_for_water_tooltip: "#italic 愿我们所依赖的河流、溪水、湖泊与水洞，赐予我们滋养作物、牲畜及自身的生命之水。#!"
 RICE_socotra_cast_insular_sorcery_pray_for_water_effect_tooltip_1: "你拥有的每个[county|E]都将获得一个[modifier|E]，提升[development_i|E][development|E]和[gold_i|E][tax|E]，并可能提升[control_i|E][control|E]与[opinion_i|E][county_opinion|E]。"
 RICE_socotra_cast_insular_sorcery_insulate_coasts_name: "#V #Bold 海岸隔离#!#!"
 RICE_socotra_cast_insular_sorcery_insulate_coasts_desc: "$RICE_socotra_cast_insular_sorcery_insulate_coasts_name$"
 RICE_socotra_cast_insular_sorcery_insulate_coasts_tooltip: "#italic 凭借我们的巫术，我们将召唤狂风、浓雾与风暴，驱逐敌意的外来者，守护我们的海岸线免遭威胁。#!"
 RICE_socotra_cast_insular_sorcery_insulate_coasts_effect_tooltip_1: "你拥有的每个#V 沿海#![county|E]都将获得一个[modifier|E]，提升[fort_level_i|E][fort_level|E]与[epidemic_i|E][epidemic_resistance|E]，并可能提升防御方[command_modifier_i|E][holding|E][advantage|E]以及@toughness_icon![stationed|E][men_at_arms|E][toughness|E]。"
 RICE_socotra_cast_insular_sorcery_bless_ships_name: "#V #Bold 祝福舰队#!#!"
 RICE_socotra_cast_insular_sorcery_bless_ships_desc: "$RICE_socotra_cast_insular_sorcery_bless_ships_name$"
 RICE_socotra_cast_insular_sorcery_bless_ships_tooltip: "#italic 海上危机四伏，因此确保我们及盟友的舰船能够安全启航并平安返航至关重要。#!"
 RICE_socotra_cast_insular_sorcery_bless_ships_effect_tooltip_1: "获得一个提升[prestige_i|E][prestige|E]、[piety_i|E][piety|E]和[legitimacy_i|E][legitimacy|E]获取的[modifier|E]。"
 RICE_socotra_cast_insular_sorcery_bless_ships_effect_tooltip_2: "在接下来的#V 10#!年内，每年你都有概率获得大约[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_piety_gain')|0]#![prestige|E][piety|E]、[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('minor_prestige_gain')|0]#![prestige|E]以及[legitimacy_i|E]#V [GetPlayer.MakeScope.ScriptValue('miniscule_legitimacy_gain')|0]#![prestige|E][legitimacy|E]。"
 socotra.0100.t:0 "异乡人"
 socotra.0100.desc:0 "不久前，一群外来袭击者乘着骇人的船只，携带着武器，来到了[GetTitleByKey('c_socotra').GetNameNoTier]的海岸。我们的人民因恐惧而退向内陆。\n\n岛民们惊恐万分，纷纷向内陆撤退，我作为岛上领袖，我决定亲自处理此事。我趁一对男女落单时抓住了他们，将他们带到一个山洞里。我把那女人和一只山羊一起藏在毯子下，然后杀了山羊，当着那男人的面生吃了几块羊肉，并将羊血涂在身上，声称那女人相当美味。\n\n我故意放走了那个男人，他逃回同伴那里，声称我们的岛上满是会巫术的食人族。自此，那些外来者再未现身——这可大大恼坏了那位自称拥有魔力的女子。她不得不承认，我的计谋不仅让她心生敬畏，更保住了她的性命。而据她所言，这些来犯之敌乃是……"
 socotra.0100.a:0 "法兰克人，或许是迷路的十字军战士。"
 socotra.0100.b:0 "罗马人，他们以另一种方式敬拜神祇。"
 socotra.0100.c:0 "波斯人，他们常在这些海域进行贸易往来。"
 socotra.0100.d:0 "印度人，那些经常利用我们岛屿作为藏身之处的海盗。"
 socotra.0100.e:0 "非洲人，来自遥远港口城市的水手。"
 socotra.0101.t:0 "索科特拉岛的未来"
 socotra.0101.desc:0 "无论如何，入侵者已经离开了，只留下了那个女子[rahabhan_wife.GetFirstName]，我娶她为妻。虽然我不确定她的动机，也不知道她的巫术是否真的存在，但她确实帮了不少忙，甚至还生了一个儿子……奇怪的是，这孩子看起来比一般婴儿要大得多。\n\n既然外乡人已经离开了我们的海岸，我现在可以专注于壮大我们氏族的力量了。在战胜了外来者之后，身边又多了一位神秘而强大的妻子，我在这片地区已经成了某种英雄，或许我可以好好利用这一点……"
 socotra.0101.a:0 "我们的岛屿将迎来辉煌的未来！"
 socotra.0101.info:0 "#emphasis 历史背景：#!拉赫班是索科特拉岛民间传说中的英雄人物，据传他曾驱逐欧洲入侵者，并娶了其中一名女子为妻——这一轶事在之前的事件中已有提及。有学者指出，该传说可能早于欧洲殖民时期，考虑到索科特拉岛数个世纪以来曾多次遭受不同族群的定居或侵袭，更古老的传说版本中可能以非欧洲人作为敌对角色。另有一则传说提及，拉赫班之子赫格虽体型肥胖，却以灵活矫健的身手证明了自己配得上继承父亲的地位。据称，尽管有其异族妻子施法相助，拉赫班最终仍战死于与另一索科特拉氏族的争斗之中。"
 socotra.0102.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 socotra.0102.desc:0 "在外人眼中，索科特拉岛是一片神秘之地，长满奇异的树木，居住着传说中的可怕巫师与海盗。然而对我们这些岛民而言，这只是家园。\n\n如今，岛上星罗棋布的众多氏族都已承认我们[ROOT.Char.GetDynasty.GetName]家族的至高地位与影响力。我们凭借力量、财富与机遇，共同拓展了势力范围。当然，我和妻子习得的巫术技艺也为此助力良多。\n\n无论未来有何变数，想到我的功绩将成为索科特拉人民传颂数世纪的传奇，我便深感欣慰……"
 socotra.0102.a:0 "现在还有许多工作需要做。"
