 game_concept_RICE_socotra_sorcery:0 "巫术"
 game_concept_RICE_socotra_sorcery_desc:0 "拥有$tradition_RICE_sorcerous_corsairs_name$[tradition|E]的[cultures|E]（例如游戏开局的$south_arabian$[culture|E]）能够使用与$game_concept_RICE_socotra_sorcery$相关的机制，这些法术据称流传于使用[Glossary( '南阿拉伯语支', 'MODERN_SOUTH_ARABIAN_LANGUAGES_GLOSS' )]（请勿与[Glossary( '古南阿拉伯语', 'OLD_SOUTH_ARABIAN_LANGUAGES_GLOSS' )]混淆）的各个族群之中。\n\n最重要的是，此[tradition|E]将解锁#V $RICE_socotra_cast_insular_sorcery$#![decision|E]，该[decision|E]提供五种不同选项，可带来各类增益效果。每次执行此[decision|E]时，增益效果会出现#V 弱效#!、#V 正常#!或#V 强效#!三种结果。\n\n该[decision|E]与[GetTrait('RICE_socotra_sorcerer').GetName( GetNullCharacter )][trait|E]相关联。通过执行此[decision|E]可积累[trait_level_track_xp|E]，积累越多，执行[decision|E]的消耗就越低。"
