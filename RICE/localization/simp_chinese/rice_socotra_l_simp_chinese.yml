 RICE_socotra_legend_new_title_name: "索科特拉岛之主"
 RICE_socotra_legend_new_title_desc: "虽然[GetTitleByKey('k_socotra').GetNameNoTier]是一个不起眼的小岛，但它一直是传说中的宝地，而现在有一位同样传奇的统治者[founder.GetName]把它变成了一个伟大国度。"
 RICE_socotra_legend_chapter_opening_new_title: "[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]是一个充满传奇和神话的国度，这里有古老的民族和令人惊叹的风景。然而，这片土地上长久被信德海盗占领，不过[ROOT.Legend.GetProtagonist.GetNameNoTooltip]驱逐了海盗，重建这座岛屿。"
 RICE_socotra_legend_chapter_motivation_new_title: "印度洋是[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]所在地的一部分，这里有机遇，也有冲突，国王、贵族、海盗领主等等在这块区域相互博弈。[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]只是棋盘中的一颗棋子，然而[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]知道这座岛屿不能只是一个棋子，它有更宏大的使命，只需要有人将其引向正确的方向。"
 RICE_socotra_legend_chapter_famous_deed_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]首先努力争取岛上不同势力的支持，无论这些势力出身如何，都是可以团结的力量。"
 RICE_socotra_legend_chapter_extra_deed_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]通过智慧和武力驱逐那些贪婪无情的海盗，从此内忧解决后只需一致对外。[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]广施仁政为百姓带来了和平与繁荣，治下百姓无一不歌颂[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的伟业。"
 RICE_socotra_legend_chapter_conclusion_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]在岛上人民的心目已神化，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的伟业让[ROOT.Legend.GetProtagonist.GetHerHis]和[ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]都在史书上留下浓重一笔。"
