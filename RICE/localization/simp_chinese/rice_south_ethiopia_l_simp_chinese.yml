 south_ethiopia.0002.t:0 "[GetFaithByKey('fandaanano').GetAdjectiveNoTooltip]的生活方式"
 south_ethiopia.0002.desc:0 "山高路远坑深，多年来，[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]孕育了许多不尽相同的宗教信仰。\n\n比如新近出现的[GetFaithByKey('fandaanano').GetAdjective]，它是一种融合了原始[GetReligionByKey('sidamic_religion').GetAdjective]、[GetReligionByKey('waaqism_religion').GetAdjective]，以及与世隔绝的高原部落所奉行的[GetReligionByKey('islam_religion').GetName]元素的混合信仰。他们认为自己与亚伯拉罕诸教同属正教，因为他们信奉独一的创世真主，称之为$fandaanano_high_god_name$，以此驳斥那些称他们为#italic 伊柏格（伊布格）#!，即异教徒的人。\n\n此外，蓬勃发展的[GetFaithByKey('fandaanano').GetAdjectiveNoTooltip]在[fandaanano_creator.GetTitledFirstName]那里找到了强大的盟友和信徒。由于[fandaanano_creator.GetTitledFirstName]的努力和[GetFaithByKey('fandaanano').GetAdjectiveNoTooltip]祭司（即$fandaanano_priest_plural$）们的帮助，[GetFaithByKey('fandaanano').GetAdjectiveNoTooltip]开始在该地区的一些部族中传播。"
 south_ethiopia.0002.a:0 "一切赞颂，全归$fandaanano_high_god_name$与诸善灵！"
 south_ethiopia.0002.b:0 "有趣的消息……"
 south_ethiopia.0002.c:0 "这种新的生活方式似乎很有意思……"
 south_ethiopia.0003.t:0 "悬铃木"
 south_ethiopia.0003.desc:0 "悬铃木蕴藏着强大的灵力，甚至据说[GetPlayer.Custom('RICE_mideast_spirit_plural')]常栖居于此。只要献上充足且令人愉悦的祭品，那些遵循[ROOT.Char.GetFaith.GetReligion.GetAdjective]律法与习俗的[GetPlayer.Custom('RICE_mideast_spirit_plural')]便可能在我们需要时给予指引。\n\n在[ROOT.Char.Custom('DefaultPriestTitlePlural')]、家眷及其他显贵的陪同下，我携祭品来到附近一棵悬铃木前，据说此地居住着一位仁慈的本地[GetPlayer.Custom('RICE_mideast_spirit')]。向[ROOT.Char.GetFaith.HighGodName]祈祷后，我们献上祭品，我恳求这位[GetPlayer.Custom('RICE_mideast_spirit')]给予建议与帮助。"
 south_ethiopia.0003.a:0 "[diplomacy_i|E]荣誉"
