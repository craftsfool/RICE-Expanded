 south_ethiopia.0020.t:0 "备数日"
 south_ethiopia.0020.desc.intro:0 "对[ROOT.Char.GetCulture.GetName]人来说，牛越多就越受人尊敬。想向人们展示自己庞大的牛群，最好的方法便是举行数牛仪式。\n\n"
 south_ethiopia.0020.desc.dala:0 "因为这是我第一次举行数牛仪式，所以我只能举行#italic 达拉#!仪式，以证明我至少有一百头牛。即使我有更多的牛，也必须先举行这个仪式。"
 south_ethiopia.0020.desc.lika:0 "我已举行过#italic 达拉#!仪式，向人们展现了我拥有的上百头牛。现在，我将举行#italic 利卡#!仪式，向人们展现了我拥有的上千头牛。"
 south_ethiopia.0020.desc:0 "\n\n#italic 备数日（Keeroo‑Gallasa）#!到了！这预⽰着我数⽜仪式的准备⼯作也要开始了。我邀请了亲朋好友，以及曾参加过仪式的长者前来，讨论数⽜仪式的准备⼯作，清点相关的财物，顶下日期。一些受邀而来者承诺会出钱出力，助我完成数牛仪式。"
 south_ethiopia.0020.a:0 "万分感谢！"
 south_ethiopia.0021.t:0 "着手准备"
 south_ethiopia.0021.desc.dala:0 "今天是举行#italic 达拉#!仪式的日子，我将向人们展示我拥有的那上百头牛！"
 south_ethiopia.0021.desc.lika:0 "今天是举行#italic 利卡#!仪式的日子，我将向人们展示我拥有的那上千头牛！"
 south_ethiopia.0021.desc:0 "按传统，我穿上白色的衣服，为数牛仪式做着准备。\n\n我的牛沿着村里的主路被牵到一个神圣的围栏前。即使是我借给别人的牛也会被赶到这里来，怀孕或生病的牛除外，它们会用特殊的绳子代表。\n\n那里聚集了很多人，更加热闹非凡，大家都在翘首期盼着仪式的开始。"
 south_ethiopia.0021.a:0 "数牛人应该很快就会到了……"
 south_ethiopia.0022.t:0 "莫拉纳到达"
 south_ethiopia.0022.desc:0 "负责数牛的人被称作#italic 莫拉纳#!。我选的#italic 莫拉纳#!是当地一位德高望重的老人。[ROOT.Char.GetSheHe]身穿#italic 筘勒#!，手里拿着一片用来数牛的叶子。\n\n开始数牛前，我们须见证#italic 莫拉纳#!将叶子浸入盛有羊血、牛血、牛奶、黄油和蜂蜜的锅中。然后，#italic 莫拉纳#!将把金属片，即#italic 达拉#!分别系在一头牛和我拥有的第一头公牛的脖子上。"
 south_ethiopia.0022.a:0 "很好，很好！"
 south_ethiopia.0023.t:0 "为演讲做准备"
 south_ethiopia.0023.desc:0 "#italic 莫拉纳#!忙着数牛的时候，我则在忙数牛仪式的下一个重要环节。骑着马的男男女女将为绕着围栏转圈，鼓动我依着惯例发表一场精彩的演讲。这场演讲将让人们发自真心地尊重我。\n\n深深吸了一口气，我站在马背上，望向人群。"
 south_ethiopia.0023.a:0 "开讲！"
 south_ethiopia.0023.a.fair:0 "你的演讲马马虎虎。"
 south_ethiopia.0023.a.good:0 "你的演讲中规中矩。"
 south_ethiopia.0023.a.excellent:0 "你的演讲惊艳全场。"
 south_ethiopia.0024.t:0 "演讲"
 south_ethiopia.0024.desc:0 "我站在马背上，用歌一般的语言颂扬我的光荣事迹和诸多美德，以及我的祖先、我的家人和支持我的朋友们的光荣事迹和美德。我说，在智慧上、财富上、办到的大事上，很少有人能与我相提并论，我竭尽全力向在场的众人证明，我是一个值得效仿的在世传奇。\n\n与此同时，在我演讲的同时，我的家人和朋友也不断为我喝彩，并在关键时刻高声赞颂[ROOT.Char.GetFaith.HighGodName]，为我的演讲锦上添花。\n\n从人们的反应来看，"
 south_ethiopia.0024.desc.fair:0 "他们似乎在其他点牛仪式上见过更好的夸耀。不过，肃然有人觉得这很乏味，我也会尽我所能，为我自己、我的家人和我的朋友争光！"
 south_ethiopia.0024.desc.good:0 "人们听进去了我的演讲。我每说一句，他们都会欢呼鼓掌。从其中可以看到人们对我的尊敬与日俱增。"
 south_ethiopia.0024.desc.excellent:0 "人们对我的演讲赞不绝口，兴奋不已。他们大声欢呼，满脸崇拜，把我当成了在世的传奇！"
 south_ethiopia.0024.a:0 "我的威名传四方！"
 south_ethiopia.0025.t:0 "呼陆口"
 south_ethiopia.0025.desc:0 "与#italic 达拉#!仪式不同，#italic 利卡#!仪式多了一项重要步骤，即#italic 呼陆口#!\n\n在围栏附近，挖出一个小隧道形状的洞，在隧道中装满牛奶、黄油和蜂蜜。然后，我手持长矛，宰杀一头牛和一只羊，将它们的血加入其中。\n\n之后，我脱掉内衣，在亲戚朋友的搀扶下，游过这条装满这些液体的隧道。在欢呼声中，我手持长矛，再次讲述我的丰功伟绩。"
 south_ethiopia.0025.a:0 "这样做简直让我成了古时的英雄人物！"
 south_ethiopia.0026.t:0 "盛宴"
 south_ethiopia.0026.desc.dala:0 "#italic 莫拉纳#!数牛结束，证实我有上百头牛后，一顿盛宴为#italic 达拉#!画上了一个圆满的句号！"
 south_ethiopia.0026.desc.lika:0 "#italic 莫拉纳#!数牛结束，证实我有上千头牛后，一顿盛宴为#italic 利卡#!仪式画上了一个圆满的句号！"
 south_ethiopia.0026.desc:0 "毕竟，如果我不能向人们展现自己是多么的富有和睿智，不能花钱为每个人准备一桌丰盛的宴席，我的数牛与演讲与锦衣夜行又有什么区别呢？\n\n宴席上有几头刚刚数过的牛的肉，都是现杀现做的。此外还有许多其他菜肴和饮料，如用埃塞蕉做的面包、其他动物的肉等等。\n\n不出所料，宴席上，每个人都在谈论我，音乐和舞蹈让每个人都心情大好，激励着人们努力奋斗，以期成为我这样的成功人士。"
 south_ethiopia.0026.a:0 "愿我能起表率作用。"
 south_ethiopia.0027.t:0 "结束"
 south_ethiopia.0027.desc.dala:0 "#italic 达拉#!仪式进入了尾声。"
 south_ethiopia.0027.desc.lika:0 "#italic 利卡#!仪式进入了尾声。"
 south_ethiopia.0027.desc:0 "虽然这种荣誉一辈子就一次，但这以此就足以光宗耀祖！更令我高兴的是，在相当长的一段时间里，我都将是族群中的热门话题。"
 south_ethiopia.0027.a:0 "多么光荣的时刻！"
