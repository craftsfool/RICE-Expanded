 south_ethiopia.0080.t:0 "埃塞蕉丰收"
 south_ethiopia.0080.desc:0 "岁枯岁荣，[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]人世世代代都在种下与收获#bold 埃塞蕉#!中度过。其抗旱性极强，且可以在生命的任何阶段随时收获。\n\n因此，我已经命令我领地内种植埃塞蕉的村庄现在收获，以保证最近的时日食品无虞。\n\n有些人可能会抱怨现在而非更晚收获毁了再成熟一点时收获的大好光景，但是谁也不知道，干旱、饥荒或是其他什么灾祸何时爆发。"
 south_ethiopia.0080.a:0 "这是未雨绸缪。"
 south_ethiopia.0081.t:0 "维护圣林"
 south_ethiopia.0081.desc:0 "对[culture.GetName]人来说，负责照顾祖先传承的圣树圣林者，往往受人尊敬。\n\n我拿出了一部分钱专门用来维护圣林。这样，我不反会为人尊敬，更能宣扬我们[ROOT.Char.GetDynasty.GetName]宗族的伟大！\n\n"
 south_ethiopia.0081.desc.small:0 "这些资源将用于维护我们的#italic 曼俄‑哈拉#!——我们家族的圣林。"
 south_ethiopia.0081.desc.medium:0 "这一次，我打算将资源用于维护#italic 松戈‑哈拉#!。这些圣林由我们族群和该地区其他相关氏族共同维护，常用于部族集会。"
 south_ethiopia.0081.desc.large:0 "我将努力维护我们的#italic 戈萨‑哈拉#!，这片最神圣的树林，是我的部落和许多其他部落世世代代共有的伟大祖先的埋葬之地。考虑到这地方的重要性，整个部族都会参与进来。"
 south_ethiopia.0081.a:0 "我们有义务照顾好这些圣林！"
