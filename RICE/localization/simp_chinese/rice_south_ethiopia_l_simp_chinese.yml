 tradition_RICE_south_ethiopian_walls_name:0 "农用墙"
 tradition_RICE_south_ethiopian_walls_desc:0 "#F 该文化经常修建石墙，以保持土壤不被侵蚀，同时方便灌溉。其中一些负有远见卓识领导人还想到利用这种技术及其背后的社会制度来保卫自己的边界，抵御敌人的袭击和入侵。#!"
 tradition_RICE_great_rift_valley_name:0 "东非大裂谷商人"
 tradition_RICE_great_rift_valley_desc:0 "#F 该文化起源于南埃塞俄比亚，历史上一直是东非内陆、红海及印度洋海上城市和埃塞俄比亚北部的王国间贸易的中间人。他们中较强大的部落和王国经常通过进贡贵重物品和奢侈品的方式扩大自己的商业影响力。#!"
 innovation_RICE_enset:0 "埃塞蕉种植系统"
 innovation_RICE_enset_desc:0 "#italic 埃塞蕉#!，又名“假香蕉”，是一种原产于南埃塞俄比亚的作物。当地人世世代代与之共生活，开发出了许多方法以最大限度地发挥其价值。作为一种抗旱而高产的作物，它的茎能做饭，纤维能作绳、可当线，本身还能用来盖房子，甚至还有药用价值。"
 RICE_enset_decision_unlock:0 "解锁#V $RICE_south_ethiopia_enset_decision$#![decision|E]"
 innovation_RICE_south_ethiopian_walls:0 "高地农用墙"
 innovation_RICE_south_ethiopian_walls_desc:0 "在南埃塞俄比亚的山区和谷地里，人们经常修建石墙，以保持土壤不被侵蚀，同时方便灌溉。其中一些负有远见卓识领导人还想到利用这种技术及其背后的社会制度来保卫自己的边界，抵御敌人的袭击和入侵。"
 tradition_RICE_cattle_counting_ceremonies_name:0 "数牛仪式"
 tradition_RICE_cattle_counting_ceremonies_desc:0 "#F 该文化非常重视牛的经济和社会价值，一个人拥有的牛越多越受人尊敬。其传承的数牛仪式，如用以夸耀男性的#italic 达拉（dala）#!、#italic 利卡（lika）#!仪式，以及用以夸耀女性的#italic 吉穆瓦（gimuwa）#!仪式，这些仪式可以让人们证明夸耀自己的财富，赢得地位与名声。#!"
 culture_parameter_unlock_rice_cattle_counting_trait:0 "牛主[traits|E]将有额外增益"
 culture_parameter_unlock_rice_cattle_counting_activity:0 "解锁[GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName][activity|E]，通过举办[GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName]可获得和升级牛主[traits|E]"
 culture_parameter_unlock_rice_sidama_maintain_trees:0 "解锁$RICE_south_ethiopia_sidama_groves_decision$[decision|E]"
 tradition_RICE_halale_name:0 "哈拉莱"
 tradition_RICE_halale_desc:0 "#F #italic 哈拉莱（Halale）#!，意即真理，是对该文化的社会、宗教、政治体系以及世界观、道德观的称呼。而敬崇祖先、保护圣树圣林这些原则正是#italic 哈拉莱#!的体现，其由德高望重的长者负责解释和执行，他们都是值得尊敬、广受认可之士。#!"
 tradition_RICE_gadaa_name:0 "盖达体系"
 tradition_RICE_gadaa_desc:0 "#F 该文化的社会秩序建立在#italic 盖达#!体系之上，共分十个等级，每8年上升一个级别，从出生开始，直到离开第十级别退休，为一个循环。十个级别又划分为前后40年两个时期，前40年结束后获得父亲身份（dannisa），而进入后40年的首个级别——第六级别则是接管权力的8年。但也有根据其父亲之级别决定其代别归属的方式。同时每8年选举一次，选出领袖阿巴盖达。这是一套包含政治、宗教和军事的体系，既有解决冲突的机制、面对威胁的军事组织，也有对正义的鼓励！#!"
 innovation_RICE_cloth_currency:0 "布币"
 innovation_RICE_cloth_currency_desc:0 "在非洲的许多地方，布不仅是一个人的身份地位的象征，还可以作为货币使用。"
 innovation_RICE_iron_currency:0 "铁币"
 innovation_RICE_iron_currency_desc:0 "从货币的角度上讲，与通行于东非的#italic 阿莫莱#!盐块相比，还是铁块更可靠。"
 culture_parameter_unlock_rice_iron_currency_innovation:0 "该传统使[culture|E]能够在$culture_era_early_medieval$[era|E]解锁#V $innovation_RICE_iron_currency$#![innovation|E]"
 culture_parameter_unlock_rice_rift_valley_courtier_spawn:0 "[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]生成地图外东非[cultures|E][courtiers|E]的几率增加，获得此类廷臣得到的正面[county_modifier|E]时间延长一倍"
 trait_RICE_cattle_owner_1:0 "百牛主"
 trait_RICE_cattle_owner_2:0 "千牛主"
 trait_RICE_cattle_owner_1_desc:0 "该角色举行了#italic 达拉#!仪式，展现了其对上百头牛的所有权，社会地位亦因此提升，成为了族群中受人敬仰的头面人物。"
 trait_RICE_cattle_owner_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]举行了#italic 达拉#!仪式，展现了其对上百头牛的所有权，社会地位亦因此提升，成为了族群中受人敬仰的头面人物。"
 trait_RICE_cattle_owner_2_desc:0 "该角色举行了#italic 利卡#!仪式，展现了其对上千头牛的所有权，社会地位亦因此提升。如此庞大的牛群使其成为了族群中最为受人敬仰的头面人物之一。"
 trait_RICE_cattle_owner_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]举行了#italic 利卡#!仪式，展现了其对上千头牛的所有权，社会地位亦因此提升。如此庞大的牛群使[ROOT.GetCharacter.GetSheHe]成为了族群中最为受人敬仰的头面人物之一。"
 trait_RICE_cattle_owner_spouse:0 "牛主背后的女人"
 trait_RICE_cattle_owner_spouse_desc:0 "该角色举行了#italic 吉穆瓦#!仪式。这种荣誉只授予完成#italic 达拉#!或#italic 利卡#!仪式者的妻子或母亲，因为她们是牛主——那些拥有了上百头、上千头牛的人——背后的女人。不过，此后她们将不得去市场买卖货物，必须由助手协助完成所有任务。"
 trait_RICE_cattle_owner_spouse_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]举行了#italic 吉穆瓦#!仪式。这种荣誉只授予完成#italic 达拉#!或#italic 利卡#!仪式者的妻子或母亲，因为她们是牛主——那些拥有了上百头、上千头牛的人——背后的女人。不过，此后她们将不得去市场买卖货物，必须由助手协助完成所有任务。"
 trait_RICE_cattle_owner:0 "$trait_RICE_cattle_owner_1$"
 trait_RICE_cattle_owner_desc:0 "$trait_RICE_cattle_owner_1_desc$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony:0 "数牛仪式"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_desc:0 "想要在族群中受人尊敬，最好的方式便是展示自己拥有的庞大牛群。而要展示自己拥有的庞大牛群，唯一的办法就是举行数牛仪式。"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_selection_tooltip:0 "获得或升级[GetTrait('RICE_cattle_owner_1').GetName( GetNullCharacter )][trait|E]\n\n$activity_RICE_south_ethiopia_cattle_counting_ceremony_context_tooltip$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_context_tooltip:0 "#emphasis 历史背景：#!沃莱塔人，同其他的许多文化一样，对牛很是重视。数牛仪式正式正是这种重视的体现。同时，这也是沃莱塔男人在族群中炫耀实力、受人尊重的重要方式。主要仪式有：数上百头牛的#italic 达拉#!仪式、数上千头牛的#italic 利卡#!。还有#italic 吉穆瓦#!仪式，因为她们是牛主——那些拥有了上百头、上千头牛的人——背后的女人，比如妻子或母亲。"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_host_desc:0 "\n$BULLET_WITH_TAB$获得或升级[GetTrait('RICE_cattle_owner_1').GetName( GetNullCharacter )][trait|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$获得[dynasty_prestige_i|E][dynasty_prestige|E]\n$BULLET_WITH_TAB$选定的[spouse|E]或异性[close_family|E]会获得[GetTrait('RICE_cattle_owner_spouse').GetName( GetNullCharacter )][trait|E]"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_guest_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_province_desc:0 ""
 activity_RICE_south_ethiopia_cattle_counting_ceremony_destination_selection:0 "$activity_RICE_south_ethiopia_cattle_counting_ceremony_province_desc$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_guest_help_text:0 "$activity_RICE_south_ethiopia_cattle_counting_ceremony$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_predicted_cost:0 "[activity|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName]终于结束，你向人们展示了你那庞大的牛群！"
 RICE_south_ethiopia_cattle_counting_ceremony_counting_phase:0 "数牛"
 RICE_south_ethiopia_cattle_counting_ceremony_counting_phase_desc:0 "会有多少只牛呢？"
 RICE_south_ethiopia_cattle_counting_ceremony_status_intent_header:0 "提升地位："
 RICE_south_ethiopia_cattle_counting_ceremony_status_intent:0 "提升地位"
 RICE_south_ethiopia_cattle_counting_ceremony_status_intent_desc:0 "你希望籍此成为那些受人尊敬者。仪式中通过演讲获得的[dynasty_prestige_i|E][dynasty_prestige|E]翻倍。拥有[GetTrait('ambitious').GetName( GetNullCharacter )|U]和[GetTrait('arrogant').GetName( GetNullCharacter )][traits|E]的角色将失去额外的[stress|E]。"
 RICE_south_ethiopia_cattle_counting_ceremony_community_intent_header:0 "交际："
 RICE_south_ethiopia_cattle_counting_ceremony_community_intent:0 "交际"
 RICE_south_ethiopia_cattle_counting_ceremony_community_intent_desc:0 "你希望向所有人展示你的慷慨，而非仅仅是只是炫耀那庞大的牛群。从宴会中获得的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]#P +50%#!。拥有[GetTrait('generous').GetName( GetNullCharacter )|U]和[GetTrait('compassionate').GetName( GetNullCharacter )][traits|E]的角色将失去额外的[stress|E]。"
 RICE_south_ethiopia_cattle_counting_ceremony_observation_intent_header:0 "观礼："
 RICE_south_ethiopia_cattle_counting_ceremony_observation_intent:0 "观礼"
 RICE_south_ethiopia_cattle_counting_ceremony_observation_intent_desc:0 "你是来观看数牛仪式的。"
 RICE_south_ethiopia_cattle_counting_ceremony_completed_log_title:0 "$activity_RICE_south_ethiopia_cattle_counting_ceremony$结束"
 RICE_south_ethiopia_cattle_counting_ceremony_completed_log:0 "[CHARACTER.GetShortUIName|U]完成了[CHARACTER.GetHerHis]的数牛仪式"
 TRAVEL_NAME_FOR_activity_RICE_south_ethiopia_cattle_counting_ceremony:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_south_ethiopia_cattle_counting_ceremony$"
 RICE_special_guest_gimuwa:0 "吉穆瓦"
 RICE_special_guest_gimuwa_for_host:0 "$RICE_special_guest_gimuwa$"
 RICE_special_guest_gimuwa_desc:0 "作为牛主背后的女人（比如他的#bold 妻子#!或#bold 母亲#!），$RICE_special_guest_gimuwa$也会在[GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName]上受人赞颂。她们因而有了自己的仪式，即#italic 吉穆瓦#!仪式。他们对举办者的[opinion|E]得到提升。同时，[activity|E]结束时，其将获得[prestige_i|E][prestige|E]及[GetTrait('RICE_cattle_owner_spouse').GetName( GetNullCharacter )][trait|E]\n\n#N 要成为$RICE_special_guest_gimuwa$，其必须是举办者的无地配偶或母亲，且至少年满30岁。#!"
 RICE_special_guest_gimuwa_desc_for_host:0 "$RICE_special_guest_gimuwa_desc$"
 RICE_south_ethiopia_cattle_counting_ceremony_gimuwa_log_title:0 "吉穆瓦仪式"
 RICE_south_ethiopia_cattle_counting_ceremony_gimuwa_log:0 "#italic 吉穆瓦#!仪式后，[CHARACTER.GetShortUIName|U]成为了#italic 吉穆瓦#!。"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_fair_log_title:0 "演讲"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_fair_log:0 "[CHARACTER.GetShortUIName|U]发表了合适的演讲，列举了[CHARACTER.GetHerHis]以及[CHARACTER.GetHerHis]祖先的美德。"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_good_log_title:0 "演讲"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_good_log:0 "[CHARACTER.GetShortUIName|U]发表了精彩的演讲，列举了[CHARACTER.GetHerHis]以及[CHARACTER.GetHerHis]祖先的美德。"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_excellent_log_title:0 "演讲"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_excellent_log:0 "[CHARACTER.GetShortUIName|U]发表的演讲技惊四座，列举了[CHARACTER.GetHerHis]以及[CHARACTER.GetHerHis]祖先的美德。"
 RICE_south_ethiopia_cattle_counting_ceremony_dala:0 "达拉仪式"
 RICE_south_ethiopia_cattle_counting_ceremony_dala_desc:0 "$EFFECT_LIST_BULLET$你将获得[GetTrait('RICE_cattle_owner_1').GetName( GetNullCharacter )][trait|E]\n$EFFECT_LIST_BULLET$完成达拉仪式，将解锁#italic 利卡#!仪式，可通过举办之获得[GetTrait('RICE_cattle_owner_2').GetName( GetNullCharacter )][trait|E]\n\n#weak 展示你拥有的上百头牛，迈出成为[GetPlayer.GetCulture.GetName]人中人上人的第一步。#!"
 RICE_south_ethiopia_cattle_counting_ceremony_lika:0 "利卡仪式"
 RICE_south_ethiopia_cattle_counting_ceremony_lika_desc:0 "$EFFECT_LIST_BULLET$你将获得[GetTrait('RICE_cattle_owner_2').GetName( GetNullCharacter )][trait|E]\n$EFFECT_LIST_BULLET$与#italic 达拉#!仪式相比，利卡将获得更多[dynasty_prestige_i|E][dynasty_prestige|E]、[prestige_i|E][prestige|E]以及[piety_i|E][piety|E]。\n\n#weak 展示你拥有的上千头牛，让你和你的家族在[GetPlayer.GetCulture.GetName]人的历史中名垂青史。#!"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_type:0 "宴会"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_small:0 "小型"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_small_desc:0 "$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_small_base')]#!基础[prestige_i|E][prestige|E]和#V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_small_base')]#!基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$参加此[activity|E]的每个[character|E]额外获得#P 5#![opinion|E]\n\n#weak 按惯例，参加数牛仪式的人可以美食一顿。#!"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_medium:0 "中型"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_medium_desc:0 "$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_medium_base')]#!的基础[prestige_i|E][prestige|E]和#V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_medium_base')]#!的基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$每个参加此[activity|E]的[character|E]额外获得#P 10#![opinion|E]\n\n#weak 这个向族群展露财富的机会谁都不愿放过，这也是为什么数牛仪式总会给人们带来一顿饕餮盛宴。#!"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_large:0 "大型"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_large_desc:0 "$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_large_base')]#!基础[prestige_i|E][prestige|E]和#V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_large_base')]#!基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$每个参加此[activity|E]的[character|E]额外获得#P 15#![opinion|E]\n\n#weak 每个人都期待着我在数牛仪式后会提供一顿丰盛的宴席，但我不会这样做。相反，这顿饕餮盛宴会让他们不敢想象！#!"
 RICE_south_ethiopia_lika_ceremony:0 "利卡仪式"
 RICE_south_ethiopia_cattle_counting_feast_amount:0 "宴会"
 RICE_south_ethiopia_new_year_generic_celebration_phase:0 "庆祝"
 RICE_south_ethiopia_new_year_generic_celebration_phase_desc:0 "新年到了！"
 RICE_south_ethiopia_new_year_generic_reconciliation_intent_header:0 "和解："
 RICE_south_ethiopia_new_year_generic_reconciliation_intent:0 "和解"
 RICE_south_ethiopia_new_year_generic_reconciliation_intent_desc:0 "获得额外[piety_i|E][piety|E]，每一位参与者对你的[opinion|E]#P 提升#!。若你拥有[GetTrait('forgiving').GetName( GetNullCharacter )|U]和[GetTrait('humble').GetName( GetNullCharacter )][trait|E]，还将失去额外[stress_loss_i|E][stress|E]。"
 RICE_south_ethiopia_new_year_generic_fun_intent_header:0 "享乐："
 RICE_south_ethiopia_new_year_generic_fun_intent:0 "享乐"
 RICE_south_ethiopia_new_year_generic_fun_intent_desc:0 "获得额外[prestige_i|E][prestige|E]，失去更多[stress_loss_i|E][stress|E]。若你拥有[GetTrait('gregarious').GetName( GetNullCharacter )|U]和[GetTrait('generous').GetName( GetNullCharacter )][trait|E]，则会额外失去[stress_loss_i|E][stress|E]。"
 activity_RICE_south_ethiopia_gifaataa_festival:0 "吉发踏节"
 activity_RICE_south_ethiopia_gifaataa_festival_desc:0 "吉发踏（Gifaataa）节，是[GetReligionByKey('omotic_religion').GetAdjective]的新年。吉发踏意为“开始”，此时，一元复始，万象更新，人们卸下了一年的忧愁与重担，辞旧迎新！"
 activity_RICE_south_ethiopia_gifaataa_festival_selection_tooltip:0 "与其他人一同庆祝新年。\n\n$activity_RICE_south_ethiopia_gifaataa_festival_context_tooltip$"
 activity_RICE_south_ethiopia_gifaataa_festival_context_tooltip:0 "#emphasis 历史背景：#!沃莱塔人的新年被称作吉发踏（Gifaataa）节。到了现代，它的宗教色彩逐渐淡化，变得更加世俗、更具文化性而非宗教性。节日的另一个重要意义则是和解：这是人们冰释前嫌、搁置冲突的时刻。"
