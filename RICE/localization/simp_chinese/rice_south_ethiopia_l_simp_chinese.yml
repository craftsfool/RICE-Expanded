 RICE_south_ethiopia_gimuwa_opinion:0 "选我作吉穆瓦"
 RICE_south_ethiopia_reconciliation_opinion:0 "纳迦和平观"
 RICE_south_ethiopia_capital_req:0 "[capital|E]位于[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]"
