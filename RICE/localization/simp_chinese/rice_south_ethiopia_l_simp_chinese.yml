 RICE_south_ethiopia_gifaataa_gift_small_desc:0 "$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_small_base')]#!基础[prestige_i|E][prestige|E]和#V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_small_base')]#!基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$你可能会受到会收到最多#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#![gold|E]的礼物\n\n#weak 本着同族互助的精神，吉发踏节期间人们会互赠礼物。#!"
 RICE_south_ethiopia_gifaataa_gift_medium:0 "中份"
 RICE_south_ethiopia_gifaataa_gift_medium_desc:0 "$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_medium_base')]#!基础[prestige_i|E][prestige|E]和#V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_medium_base')]#!基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$你可能会受到会收到最多#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#![gold|E]的礼物\n\n#weak 如果我想真正践行“吉发踏”的精神，我就应该慷慨地赠予他人礼物。#!"
 RICE_south_ethiopia_gifaataa_gift_large:0 "大份"
 RICE_south_ethiopia_gifaataa_gift_large_desc:0 "$EFFECT_LIST_BULLET$获得#V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_large_base')]#!基础[prestige_i|E][prestige|E]和#V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_large_base')]#!基础[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$你可能会受到会收到最多#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#![gold|E]的礼物\n\n#weak 新年伊始，向族群的所有人赠予礼物，以促进大同，促进“吉发踏”，此正是当有所作为之时。#!"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival:0 "珐齐‑阿姆巴拉节"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_desc:0 "珐齐‑阿姆巴拉节标志着新一年的开始。#italic 埃言透（Ayyaanto）#!，即占星师们，通过对星象的观测，为这个盛大的节日和新的一年确定日期、定下历法。"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_selection_tooltip:0 "与其他人一同庆祝新年。\n\n$activity_RICE_south_ethiopia_fichee_chambalaalla_festival_context_tooltip$"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_context_tooltip:0 "#emphasis 历史背景：#!锡达玛人将新年称作“珐齐‑阿姆巴拉”。其日期由锡达玛人的占星师#italic 埃言透（Ayyaanto）#!确定。传说中，该节日起源于一位名叫珐蔻（Ficho）的妇女，她出嫁后，每年都会做一些卜瑞塞姆（buurisame）——一种将黄油、牛奶以及埃塞蕉相混合的菜——回娘家拜访父母和邻居。她死后，她的邻居们便以她的名字命名新年的前夜——“珐齐（Fichee）”。"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_host_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[GetModifier('RICE_south_ethiopia_fichee_chambalaalla_festival_modifier').GetNameWithTooltip][character_modifier|E]\n$BULLET_WITH_TAB$若人们采纳了你作为领袖的建议，则有几率获得#P 正面#![character_modifier|E]"
