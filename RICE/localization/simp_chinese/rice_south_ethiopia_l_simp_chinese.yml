 south_ethiopia.0040.t:0 "古利亚‑戈沙"
 south_ethiopia.0040.desc:0 "刚刚，天文学家及族中老人通知我们，根据[ROOT.Char.GetFaith.GetAdjective]历法，#italic #bold 吉发踏节#!#!就要到了。\n\n准备工作正在有条不紊地进行着，首先是开展#italic 古利亚‑戈沙（Guliya‑Gosha）#!，即绑树仪式。#italic 吉发踏节#!是一个充满爱与和平的节日，人人都试图借此挥去过去一整年的郁结——我也不例外！\n\n很快，整个族群都将齐聚一堂，共庆佳节！"
 south_ethiopia.0040.a:0 "这一定会是个美好的#italic 吉发踏节#!！"
 south_ethiopia.0041.t:0 "舒哈‑沃加"
 south_ethiopia.0041.desc:0 "今天是#italic 舒哈‑沃加#!，是大年初一，是#italic 吉发踏节#!开始的日子！\n\n族群中的每个人，甚至像我这样伟大的[ROOT.Char.GetTitleAsNameNoTooltip]，都来参加这次庆祝活动。在新的一年里，我们的精神和身体将焕然一新，我们都会尽力保持良好的心态，鼓励彼此和平相处。什么龌龊、什么郁结，都将成为过去。\n\n据说，为了促进爱与和平的精神，这段时间善灵将拜访每家每户，以确保每家每户都有充足的食物。"
 south_ethiopia.0041.a:0 "新年新气象！笑对新年吧！"
 south_ethiopia.0042.t:0 "戈洛‑埃杰塔"
 south_ethiopia.0042.desc:0 "今年的#italic 吉发踏节#!照旧以#italic 戈洛‑埃杰塔#!仪式作结。此时，拜访过各家各户的善灵应该要离开了，据说他们会在各家各户停留 35 天，直到确认每一家有足够的食物才会满意离去。\n\n我们欢聚一堂，举行欢送仪式，点燃火把，一边跳着欢快的舞蹈，一边把火把抛来抛去。每个人都喜气洋洋，希望接下来的一年中这份喜气能一直在。"
 south_ethiopia.0042.a:0 "愿新年能遇好事。"
 south_ethiopia.0043.t:0 "节礼"
 south_ethiopia.0043.desc:0 "#italic 吉发踏节#!期间，人们要向亲朋好友赠送礼物，从精美的珠宝，到漂亮的衣服，等等等等。当然，我早已为大家准备好了礼物，我也会依次收到自己的礼物。\n\n老人常言，来往来往，有来有往，这样才能维持一个好的人际关系。毕竟，一个社会如果没有和谐的人际关系，就什么也不是。"
 south_ethiopia.0043.a:0 "谢谢你送的节礼！"
 south_ethiopia.0044.t:0 "美食和美酒"
 south_ethiopia.0044.desc:0 "#italic 吉发踏节#!向来是宴饮作乐的好时候，这次也不例外！\n\n#italic 吉发踏节#!期间，我吃了很多传统美食，比如黄油、蜂蜜、牛肉、烤埃塞蕉作的面饼和#italic 阿绍#!——一种生肉。"
 south_ethiopia.0044.a:0 "真是美味！"
 south_ethiopia.0045.t:0 "和解"
 south_ethiopia.0045.desc:0 "#italic 吉发踏节#!向来是泯弃恩仇的好时候。作为[ROOT.Char.GetTitleAsNameNoTooltip]，我借此机会调解两个当地人之间的矛盾。\n\n现在，他们泯弃了恩仇，达成了和解。虽然困难重重，但我还是成功帮他们冰释前嫌。"
 south_ethiopia.0045.a:0 "这正是#italic 吉发踏节#!精神之所在！"
 south_ethiopia.0046.t:0 "载歌载舞"
 south_ethiopia.0046.desc:0 "人们纷纷前往#italic 伽兹雅#!，去唱歌，去跳舞。#italic 吉发踏节#!期间，伽兹雅将专门用于辞旧迎新，庆祝新年。每个人都在这里尽情地演奏乐器、唱着欢快的歌曲、跳着快活的舞蹈，将烦恼一扫而光。"
 south_ethiopia.0046.a:0 "我来！"
 south_ethiopia.0046.b:0 "算了，看看就得了。"
 south_ethiopia.0047.t:0 "讨论时政国是"
 south_ethiopia.0047.desc:0 "#italic 吉发踏节#!期间，传统上，当地青年会会纷纷前往一个被称作#italic 伽齐亚（Gaziyaa）#!的地方，伽齐亚虽然叫歌舞院，但那并非只是人们唱歌跳舞的地方，还是人们讨论时政国是的地方。籍此，人们通过共同讨论族群所面临的共同问题，找出了解决这些问题的方法，以及如何解决族群内部矛盾的方法。"
 south_ethiopia.0047.desc.youth:0 "\n\n我，一名青年，当然也参与了这些讨论。我虚心求教，求同存异。无论我们的观点如何，多认识些人总是好的。"
 south_ethiopia.0047.a:0 "这能让我们的国变得更好。"
 south_ethiopia.0048.t:0 "还钱"
 south_ethiopia.0048.desc:0 "#italic 吉发踏节#!是一个富有爱与和平、和解的节日，但这也是“年关”。\n\n不久前，我借了些钱和物给给当地的平民。今天，本着#italic 吉发踏节#!的精神，他们来还钱了！"
 south_ethiopia.0048.a:0 "谢谢你的“节礼”！"
 south_ethiopia.0048.b:0 "都是兄弟姊妹，谈什么钱！"
 south_ethiopia.0049.t:0 "改过自新"
 south_ethiopia.0049.desc:0 "#italic 吉发踏节#!是对未来充满乐观和希望的展望时刻，因此，很多人试图在这个关头扭转自己的坏习惯，改过自新。\n\n有一个以无教养著称的本地人现在宣布，他要改变自己，做个好人，尊重我们珍视的品德和价值，留心于[ROOT.Char.GetFaith.HighGodName]想让我们做到的事情。"
 south_ethiopia.0049.a:0 "很难相信他的话。"
 south_ethiopia.0049.b:0 "浪子回头金不换！"
 south_ethiopia.0050.t:0 "找对象"
 south_ethiopia.0050.desc:0 "#italic 吉发踏节#!是相亲的好时候。年节中，我注意到很多青年男女及他们代表的家庭公开会面。为了寻一个好姻缘，有时甚至直接就开始一步到位安排嫁娶了。"
 south_ethiopia.0050.a:0 "我们的家庭也会继续发展壮大。"
 south_ethiopia.0051.t:0 "老人言"
 south_ethiopia.0051.desc:0 "没有我们长辈的长辈，也就没有我们的长辈，更没有我们的今日了。像#italic 吉发踏节#!这样的节日是我们拜访老人和从他们那里学习的机会。\n\n我现在出席了其中一个这样的见面会，很多我们这里的人聚集在几个老人周围。这些睿智的长者将他们的毕生所知传授给我们，也携带着希望我们善用这些知识的期许。"
 south_ethiopia.0051.a:0 "他们传授了我们许多有价值的洞见。"
