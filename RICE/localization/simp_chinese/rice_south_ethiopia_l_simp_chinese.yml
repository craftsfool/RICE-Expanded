 RICE_south_ethiopia_pray_to_a_sycamore_tree:0 "向悬铃木祈祷"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_tooltip:1 "我们的人民长久以来一直尊崇悬铃木。"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_desc:0 "自古以来，[ROOT.Char.GetCulture.GetCollectiveNoun]人便知晓悬铃木所蕴含的强大灵力。此刻，我将向其中一棵祈祷，愿栖居期间的[GetPlayer.Custom('RICE_mideast_spirit_plural')]能运用指引我，并实现我的愿望。"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_effect_tooltip_1:1 "你可能会获得#P 正面#![character_modifiers|E]，这些修正会提升你的[skills|E]并带来其他加成，具体效果取决于你的[traits|E]（尤其是[virtues|E]和[sins|E]）以及你的[piety_level|E]。"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_confirm:0 "准备献祭！"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_context_tooltip:0 "#emphasis 历史背景：#! 在东非多个民族，尤其是库希特语系族群中，悬铃木无花果被认为拥有强大的灵力。即使是穆斯林或基督教信徒，仍会沿袭与这些悬铃木相关的古老仪式，例如贝贾人至今仍会向特定的悬铃木献祭或供奉。"
 RICE_south_ethiopia_sycamore_tree_neutral:0 "[GetPlayer.Custom('RICE_mideast_spirit_plural')]无视了你。"
 RICE_south_ethiopia_sycamore_tree_neutral_tooltip:0 "$RICE_south_ethiopia_sycamore_tree_neutral$"
 RICE_south_ethiopia_sycamore_tree_bad:0 "[GetPlayer.Custom('RICE_mideast_spirit_plural')]不喜欢你的祭品。"
 RICE_south_ethiopia_sycamore_tree_bad_short:0 "#N 坏兆头#!"
 RICE_south_ethiopia_sycamore_tree_good:0 "[GetPlayer.Custom('RICE_mideast_spirit_plural')]对你的供奉感到满意。"
 RICE_south_ethiopia_sycamore_tree_good_short:0 "#P 好兆头#!"
 RICE_south_ethiopia_sycamore_tree_neutral_short:0 "#N 无事发生#!"
