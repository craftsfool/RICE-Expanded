 south_ethiopia.0060.t:0 "确定日期"
 south_ethiopia.0060.desc:0 "[ROOT.Char.GetFaith.GetReligion.GetAdjective]族的新年——#italic 珐齐‑阿姆巴拉节#!马上就要到了。我们最富智慧的占星家#italic 埃言透#!通过观察月亮和#italic 布撒（buusa）#!星座中的五颗星的运行情况，以确定今年#italic 珐齐‑阿姆巴拉节#!的日期。\n\n#italic 埃言透#!选定日期后，我和族群的长老聚集在一起，讨论如何庆祝新年。之后，我们便各自去各家的市场。在那里，我们把一张羊皮挂在长矛上，告知族群今年#italic 珐齐‑阿姆巴拉节#!的日期。"
 south_ethiopia.0060.a:0 "诸君，喜迎#italic 珐齐‑阿姆巴拉节#!吧！"
 south_ethiopia.0061.t:0 "斋戒"
 south_ethiopia.0061.desc:0 "#italic 珐齐‑阿姆巴拉节#!马上就要到了。不过，过节前还有一系列传统仪式亟待施行。\n\n在过#italic 珐齐#!——每年的最后一天——之前，我们须自这日往前十五天开始斋戒，直到#italic 珐齐#!前九天开斋，届时我们将举办#italic 萨福捷‑凯塔拉（safote ketaala，当地歌舞活动）#!"
 south_ethiopia.0061.a:0 "是时候斋戒了。"
 south_ethiopia.0062.t:0 "呼陆卡"
 south_ethiopia.0062.desc:0 "#italic 珐齐#!日终于到了！首先，我们将举办#italic 呼陆卡#!仪式——在房前用树木搭起一座拱门，我们家里的所有成员和牲畜将一一经过拱门。当然了，从我开始。\n\n在迎接新的一年时，我们会提醒自己丢掉去年的晦气，带着喜气走向新的一年。"
 south_ethiopia.0062.a:0 "好心情，喜气来！"
 south_ethiopia.0063.t:0 "盛宴"
 south_ethiopia.0063.desc:0 "#italic 珐齐#!那天的傍晚，我和家人会聚在一起吃个团圆饭。团圆饭最重要的那道菜就是#italic 卜瑞塞姆（buurisame）#!——那道珐蔻回娘家时做的菜。它由黄油、牛奶以及埃塞蕉混合而成，盛在一个叫#italic 沙喜塔#!的陶锅里。\n\n作为身份最尊者，我有幸揭开宴席的序幕，一边说着祝福的话，一边把一些食物撒在地上。这样做是为了感谢大地赐予我们这些食物。\n\n吃完后，我们就挨个去附近的人家分享食物。"
 south_ethiopia.0063.a:0 "愿新的一年吉星照航，家宅吉祥！"
 south_ethiopia.0064.t:0 "卡瓦兰喀"
 south_ethiopia.0064.desc:0 "#italic 珐齐#!过后的第一给早上，也是新年的第一个早上，被称作#italic 卡瓦兰喀#!。这一天，人们会举行盛大的#italic 阿姆巴拉#!仪式\n\n我带领家人用温水洗漱，涂抹黄油。当太阳缓缓升上天空时，当地村子里的孩子们会按照传统，恭祝大家新年快乐，说：“#italic 阿亚德阿姆巴拉（阿姆巴拉节快乐）#!”\n\n同样的，我们也会给孩子以美好的祝福，比如祝他们长命百岁，并给孩子大量的#italic 卜瑞塞姆#!吃"
 south_ethiopia.0064.a:0 "现在，让我们来看看其他的大型活动吧。"
 south_ethiopia.0065.t:0 "共聆忠告"
 south_ethiopia.0065.desc:0 "年节期间（从#italic 阿姆巴拉#!日开始的一星期），处处有活动。例如，给牛喂一种叫做#italic 布尔（boole）#!的盐渍土的仪式。还有许多的舞会，比如#italic 基塔拉（Keetaala）#!，许多未婚青年男女在这里找到了自己的爱情。\n\n在#italic 基塔拉#!歌舞表演期间，每个人都聚集在#italic 咕都马尔#!，坐下来接受我这个领袖的祝福。今年，我准备了很多忠告给族群，告诉他们如何善小为之，恶小不为。"
 south_ethiopia.0065.a:0 "希望大家都能牢记我的建议。"
 south_ethiopia.0065.tooltip:0 "若你的建议反响良好，那么你得到的[character_modifier|E]会受你的[skills|E]的影响。"
 south_ethiopia.0065.a.bad.toast:0 "平平无奇的建议"
 south_ethiopia.0065.a.bad:0 "你的建议反响平平。"
 south_ethiopia.0065.a.good.toast:0 "鼓舞人心的建议"
 south_ethiopia.0065.a.good:0 "你的建议反响良好。"
 south_ethiopia.0066.t:0 "珐契‑富洛"
 south_ethiopia.0066.desc:0 "唉，所有美好的事物都有结束的一天，#italic 珐齐‑阿姆巴拉节#!也将随着#italic 沙西伽（Shaashiga）#!（一种#italic 基塔拉舞#!的特殊类型）的结束而落幕。这是特殊结束仪式的一部分——#italic 珐契‑富洛#!，每个人都聚在这里载歌载舞。\n\n最后，长者们祝福我们，并以“#italic 珐齐#!万岁”的欢呼宣告了年节的结束。"
 south_ethiopia.0066.a:0 "新的一年开始了！"
