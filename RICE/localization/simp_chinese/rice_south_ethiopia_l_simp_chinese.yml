 south_ethiopia.0090.t:0 "牛主[courtier.GetFirstNamePossessiveNoTooltip]"
 south_ethiopia.0090.desc:0 "最近，[courtier.GetFirstName]举办了[courtier.GetCulture.GetName]传统的数牛仪式，展现了我那远超常人的庞大牛群！\n\n藉此，[courtier.GetFirstName]成了族群中的红人。虽然我是[courtier.GetHerHis]的[ROOT.Char.GetTitleAsNameNoTooltip]，也不由羡慕[courtier.GetSheHe]的牛主之名。"
 south_ethiopia.0090.a:0 "恭喜恭喜！"
 south_ethiopia.0090.b:0 "那又如何，我可是[courtier.GetHerHis]的[ROOT.Char.GetTitleAsNameNoTooltip]！"
 south_ethiopia.0090.c:0 "你可真行，快赶上我了！"
 south_ethiopia.0091.t:0 "埃塞蕉树种"
 south_ethiopia.0091.desc:0 "对[ROOT.Char.GetCulture.GetCollectiveNoun]人来说，埃塞蕉是他们用来充饥的好伙伴！传统上，人们将其分为数个品类。\n\n今天，我拜访了当地的一些农民，他们向我解释了如何区分不同品种的埃塞蕉。从大的层面来说，有所谓的“公”和“母”之分，其依据是传统上是男的还是女的负责的收获它们。\n\n农民们解释说，公埃塞蕉往往更老更成熟，抗病和抗伤害能力更强，而母埃塞蕉很快就能收获，更适合烹饪和食用。因此，两者都有其实际用途。"
 south_ethiopia.0091.a:0 "长远来看，“公树”似乎更可靠。"
 south_ethiopia.0091.b:0 "看起来“母树”对喂饱每个人更重要。"
 south_ethiopia.0092.t:0 "农用转军用"
 south_ethiopia.0092.desc:0 "[ROOT.Char.GetCulture.GetName]人把常见的农用墙变成了保卫领地的城墙。墙的建设由族群长老负责的组织实施。\n\n今天，我将与一些长老讨论近期墙的建设问题。即使我们有这样那样的分歧，但有一点共识是确定的——这些墙是整个族群群力群策的结果。"
 south_ethiopia.0092.a:0 "让我们好好规划规划！"
 south_ethiopia.0093.t:0 "不洁工匠"
 south_ethiopia.0093.desc:0 "我收到过一些当地人的投诉，说该地区的陶工、皮匠和铁匠住得离他们太近了。\n\n[ROOT.Char.GetCulture.GetName]人认为，这些人是不洁的，因为他们吃的是不干净的野兽肉，从事的工作迫使他们接触泥土、矿石和黑曜石等脏物。因此，干净的正常人需要不惜一切代价避开他们。\n\n无论如何，当地人声称这些工匠需要被强制搬迁到其他地方，以防止侵占他人的土地。"
 south_ethiopia.0093.a:0 "很好，把工匠们迁到其他地方去。"
 south_ethiopia.0093.b:0 "毫无意义的抱怨，工匠们已经住得很远了。"
 south_ethiopia.0094.t:0 "丹拿乌‑巴图"
 south_ethiopia.0094.desc:0 "即使我们[ROOT.Char.GetCulture.GetCollectiveNoun]人传统上允许和鼓励每个我们的成员拥有自己的土地，每个社群也有他们的公社土地，叫做“#italic 丹拿乌‑巴图（dannawu baato）#!”，它被用于集体放牧，或者用作年轻夫妻、新来者之类还没有获得自己土地时的份地。\n\n因为这种集体土地的使用权总是变换，作为族群的领袖，我不得不经常出席会议商讨——就像今天要做的这样——去决定怎么使用和分配这些公社土地。"
 south_ethiopia.0094.a:0 "让议事会的其他人决定怎么做"
 south_ethiopia.0094.b:0 "用我的立场影响其他人的决策"
 south_ethiopia.0095.t:0 "科乔"
 south_ethiopia.0095.desc:0 "今天，我正在享用一些#italic 科乔#!，这是一种埃塞蕉发酵烤制的糕饼。它虽然制作简单但是[ROOT.Char.GetCulture.GetName]菜式中的一道美味，让我能够饱餐一顿，就着肉和香料更是馋嘴。"
 south_ethiopia.0095.a:0 "美味又健康！"
 south_ethiopia.0096.t:0 "种植埃塞蕉"
 south_ethiopia.0096.desc:0 "最近，我的一些仆役对我提议在我的宅子边种植更多埃塞蕉。它不仅是良好的食物来源，而且它在干旱条件下的耐受性能够提供阴凉、应急食物，以及在阻止可能的入侵者时的额外一点防御。"
 south_ethiopia.0096.a:0 "善！去种埃塞蕉！"
 south_ethiopia.0096.b:0 "不用，我们没必要现在搞这个。"
