 south_ethiopia.0030.t:0 "吉穆瓦仪式开始"
 south_ethiopia.0030.desc:0 "在这次数牛仪式上，我选择我的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gimuwa'))][gimuwa.GetTitledFirstName]来做#italic 吉穆瓦#!。这样，[gimuwa.GetSheHe|U]将分享我的荣耀，受到人们的尊敬。\n\n在数牛仪式和庆祝宴会结束后的周末，今天，#italic 吉穆瓦#!仪式就开始了！"
 south_ethiopia.0030.a:0 "[gimuwa.GetFirstNameNoTooltip]，希望你做好准备了！"
 south_ethiopia.0031.t:0 "吉穆瓦仪式结束"
 south_ethiopia.0031.desc:0 "我们自豪地看着[gimuwa.GetFirstNameNoTooltip]穿着特制的衣服，头插鸵鸟羽，在同性亲友的陪同下骑在马上。\n\n进到集市里，[gimuwa.GetFirstNameNoTooltip]同之前的我一眼，自豪地夸耀[gimuwa.GetSheHe]和[gimuwa.GetHerHis]的亲戚、朋友以及祖先的丰功伟绩。演讲完毕，观众们拍手叫好；现在，[gimuwa.GetSheHe]需要打破一个装满啤酒的大锅。[gimuwa.GetFirstNameNoTooltip]对此兴致勃勃，在马背上就把它打碎了。然后，我将酒壶拿起，先递给[gimuwa.GetSheHe]喝，然后大家分着喝。接着，[gimuwa.GetFirstNameNoTooltip]开始向大家发喜钱，包括穷人。"
 south_ethiopia.0031.a:0 "好极了！我们回家大吃一顿吧！"
