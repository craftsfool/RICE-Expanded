 RICE_south_ethiopia_fichee_advice_diplomacy_desc:0 "珐齐‑阿姆巴拉节期间，作为族群的领袖，该角色向族群提出的建议得到了全体成员的普遍认可。该角色将引领社区沿着这些建议指明的方向大步向前。"
