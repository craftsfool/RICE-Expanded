 RICE_south_ethiopia_relocated_artisan_communities:0 "迁走低种姓工匠"
 RICE_south_ethiopia_relocated_artisan_communities_desc:0 "最近，当地人要求该角色将属于低种姓的工匠社群迁走。该角色接受了他们的要求，因为他知道这些低贱的工匠会对其他人造成污染。"
 RICE_south_ethiopia_did_not_relocate_artisan_communities:0 "拒绝迁走低种姓工匠"
 RICE_south_ethiopia_did_not_relocate_artisan_communities_desc:0 "最近，当地人要求该角色将属于低种姓的工匠社群迁走。该角色接受了他们的要求，认为这没有必要。虽然知道这些低贱的工匠会对其他人造成污染，但他们已经住得足够远了。"
 RICE_south_ethiopia_planted_enset_trees_around_house:0 "在房子旁种更多的埃塞蕉树"
 RICE_south_ethiopia_enset_decision:0 "收获埃塞蕉以缓解饥荒"
 RICE_south_ethiopia_enset_decision_tooltip:0 "埃塞蕉抗旱性极强，对应对饥荒有重大作用。"
 RICE_south_ethiopia_enset_decision_desc:0 "岁枯岁荣，[ROOT.Char.GetCulture.GetName]人世世代代都在种下与收获#V 埃塞蕉#!中度过。其抗旱性极强，且可以在生命的任何阶段随时收获，这也是为什么几个世纪以来，它一直是[ROOT.Char.GetCulture.GetName]人应对饥荒的关键。我应该命令当地村庄现在就收获一些，以提高我们的粮食安全。"
 RICE_south_ethiopia_enset_decision_effect_tooltip_1:0 "该[decision|E]的成本取决于你的[stewardship_i|E][stewardship|E]以及拥有多少个[cultures|E]含$innovation_RICE_enset$[innovation|E]的[counties|E]"
 RICE_south_ethiopia_enset_decision_confirm:0 "开割！"
 RICE_south_ethiopia_enset_decision_context_tooltip:0 "#emphasis 历史背景：#!埃塞蕉，又名“假香蕉”，几世纪以来一直是沃莱塔和锡达玛等民族的主食。它有多种用途，茎能做饭，纤维能作绳、可当线，本身还能用来盖房子，甚至还有药用价值。由于其极强的抗旱性，可以在生命的任何阶段随时收获，因此几个世纪以来，它一直是该地区应对饥荒的关键——这在该[innovation|E]解锁的[decision|E]中也会有体现。"
 RICE_south_ethiopia_sidama_groves_decision:0 "维护传承圣林"
 RICE_south_ethiopia_sidama_groves_decision_tooltip:0 "圣林传承就是我们民族的传承"
 RICE_south_ethiopia_sidama_groves_decision_desc:0 "[ROOT.Char.GetCulture.GetName]人的圣林是由父母传给子女的，整个族群都会出于政治、社会和宗教的需要去维护这些圣林。作为[ROOT.Char.GetDynasty.GetName]的一员，我有疑问尽自己的一份力量来维护我所继承的圣林。"
 RICE_south_ethiopia_sidama_groves_decision_effect_tooltip_1:1 "你将获得[piety_i|E][piety|E]、[dynasty_prestige_i|E][dynasty_prestige|E]，以及为期#V 10#!的[character_modifier|E]，其奖励取决于你选择的维护的圣林类型。"
 RICE_south_ethiopia_sidama_groves_decision_effect_tooltip_2:1 ""
 RICE_south_ethiopia_sidama_groves_decision_confirm:0 "快来维护我们的圣林！"
 RICE_south_ethiopia_sidama_groves_decision_context_tooltip:0 "#emphasis 历史背景：#!锡达玛人不论信仰什么宗教，都有维护和祭拜圣树、圣林的习俗。圣树或圣林往往是由父母传给子女的，因而维护这些树成为了一项的重要责任；这不仅仅是一项宗教责任，也是出于“维护”自己的地位和名声的考虑——部族中，那些负责维护那些重要的、大的圣树的人往往受人尊敬。"
 RICE_south_ethiopia_sidama_groves_decision_type:0 "选择要维护的圣林种类"
 RICE_south_ethiopia_pick_grove_option:0 "$RICE_south_ethiopia_sidama_groves_decision_type$"
 RICE_south_ethiopia_sidama_groves_decision_small_option:0 "#Bold #V 曼俄‑哈拉#!#!\n$RICE_south_ethiopia_sidama_groves_decision_small_option_desc$"
 RICE_south_ethiopia_sidama_groves_decision_small_option_desc:0 "家族圣林"
 RICE_south_ethiopia_sidama_groves_decision_small_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_decision_small_cost')]#!#!\n\n获得如下效果：\n\n$EFFECT_LIST_BULLET$[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_piety_gain_small')]#![piety|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_dynasty_prestige_gain_small')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$持续#V 10#!年的[GetModifier('RICE_south_ethiopia_maintained_groves_small_modifier').GetNameWithTooltip][character_modifier|E]"
 RICE_south_ethiopia_sidama_groves_decision_medium_option:0 "#Bold #V 松戈‑哈拉#!#!\n$RICE_south_ethiopia_sidama_groves_decision_medium_option_desc$"
 RICE_south_ethiopia_sidama_groves_decision_medium_option_desc:0 "公用圣林"
 RICE_south_ethiopia_sidama_groves_decision_medium_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_decision_medium_cost')]#!#!\n\n获得如下效果：\n\n$EFFECT_LIST_BULLET$[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_piety_gain_medium')]#![piety|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_dynasty_prestige_gain_medium')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$持续#V 10#!年的[GetModifier('RICE_south_ethiopia_maintained_groves_medium_modifier').GetNameWithTooltip][character_modifier|E]"
 RICE_south_ethiopia_sidama_groves_decision_large_option:0 "#Bold #V 戈萨‑哈拉#!#!\n$RICE_south_ethiopia_sidama_groves_decision_large_option_desc$"
 RICE_south_ethiopia_sidama_groves_decision_large_option_desc:0 "祖坟圣林"
 RICE_south_ethiopia_sidama_groves_decision_large_option_tooltip:0 "花费：@gold_icon!#V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_decision_large_cost')]#!#!\n\n获得如下效果：\n\n$EFFECT_LIST_BULLET$[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_piety_gain_large')]#![piety|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_dynasty_prestige_gain_large')]#![dynasty_prestige|E]\n$EFFECT_LIST_BULLET$持续#V 10#!年的[GetModifier('RICE_south_ethiopia_maintained_groves_large_modifier').GetNameWithTooltip][character_modifier|E]"
 RICE_south_ethiopia_fandaanano_decision:0 "培植凡丹纳诺教"
 RICE_south_ethiopia_fandaanano_decision_tooltip:0 "一种新的宗教正在[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]高原流传开来。"
 RICE_south_ethiopia_fandaanano_decision_desc:0 "从古至今，许多[faiths|E]自[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]高原起源。近来，一个新的教派——[GetFaithByKey('fandaanano').GetAdjective]，认为自己与亚伯拉罕[faiths|E]同为正教，虽然其融合了传统的[GetReligionByKey('sidamic_religion').GetAdjective]信仰和有本地特色的[GetReligionByKey('islam_religion').GetName]元素。我对它的教义很感兴趣。"
 RICE_south_ethiopia_fandaanano_decision_effect_tooltip_1:0 "[GetGeographicalRegion('RICE_south_ethiopia_region').GetName]的[counties|E]和[rulers|E]，尤其是那些[faith|E]为[GetReligionByKey('sidamic_religion').GetAdjective]和[GetReligionByKey('islam_religion').GetAdjective]的[counties|E]和[rulers|E]，将更有可能皈依[GetFaithByKey('fandaanano').GetName]"
 RICE_south_ethiopia_fandaanano_decision_effect_tooltip_2:0 "现在可以皈依[GetFaithByKey('fandaanano').GetName]"
 RICE_south_ethiopia_fandaanano_decision_confirm:0 "我们当遵循[GetFaithByKey('fandaanano').GetNameNoTooltip]之教诲！"
 RICE_south_ethiopia_fandaanano_decision_context_tooltip:0 "#emphasis 历史背景：#!凡丹纳诺教是一种融合了伊斯兰教和库希特原始信仰的混合宗教。该宗教曾在讲锡达莫语的哈迪亚人中广泛流传，但也通过传教士传播到其他民族。凡丹纳诺教于15世纪在南埃塞俄比亚兴起，且很可能来自高原的穆斯林部族。由于政局不稳，这些部族在地理上与伊斯兰世界隔绝。尽管教义与伊斯兰教有分歧，但许多凡丹纳诺教信徒仍认为自己是穆斯林。该信仰现已消亡，但它对现代哈迪亚人（无论其宗教信仰如何）仍有重大影响。"
