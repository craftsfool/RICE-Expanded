 south_ethiopia.0010.t:0 "[courtier.GetCulture.GetNameNoTooltip]流浪者"
 south_ethiopia.0010.base:0 "东非内陆是许多部落和王国的家园，他们因祖先的关系与贸易而联系在一起。\n\n一位名叫[courtier.GetFirstName]的[courtier.GetCulture.GetName][courtier.GetWomanMan]来到我的领地，希望成为我廷臣。[courtier.GetSheHe|U]和[courtier.GetSheHe|U]老家的兄弟仍有紧密的联系，这或许会派上用场。\n\n"
 south_ethiopia.0010.desc:0 "$south_ethiopia.0010.base$[courtier.GetCulture.GetNameNoTooltip]是一群分散生活在奥莫河旁高地和图尔卡纳湖北部的部落。虽然他们人数众多且不团结，但却是这一带首屈一指的战士、牧民和商人，这些技能会让我们受益匪浅。"
 south_ethiopia.0010.a:0 "欢迎欢迎，热烈欢迎！"
 south_ethiopia.0010.b:0 "这些人能成什么事。"
 south_ethiopia.0011.t:0 "$south_ethiopia.0010.t$"
 south_ethiopia.0011.desc:0 "$south_ethiopia.0010.base$[courtier.GetCulture.GetNameNoTooltip]的部落占据了图尔卡纳湖以南的大片领土。他们以精湛的艺术和建筑技艺著称，控制着通往该地的贸易路线，获得他们的友谊会让我们受益匪浅。"
