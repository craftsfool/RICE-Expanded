 sri_lanka.0150.pattini_games_intro:0 "在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]，传统习俗是在特殊场合为女神[GetPlayer.Custom('RICE_pattini')]举办祭祀游戏。\n\n参加这些游戏的两支队伍通常都是男性，这也是男人们大显身手的好机会。一队代表女神，另一队代表女神的配偶或其他男性神祇。如果女神的队伍获胜，就能确保这一年的风调雨顺，但两支队伍都要认真比赛，这样才可取悦神明。\n\n"
 sri_lanka.0150.t:0 "安支梨耶"
 sri_lanka.0150.desc:0 "$sri_lanka.0150.pattini_games_intro$\n我听说最近[county.GetNameNoTier]的村庄里举行了#italic 安支梨耶#!比赛。比赛中，两队都有一个挂在树上的号角，必须用绳子把号角拉断。最先完成的队伍当然就是胜利者。"
 sri_lanka.0150.a:0 "不知道这次是哪一队赢了？"
 sri_lanka.0150.a.failure:0 "钵底尼球队输掉游戏"
 sri_lanka.0150.a.success:0 "钵底尼球队赢得游戏"
 sri_lanka.0151.t:0 "布罗瞿离耶"
 sri_lanka.0151.desc:0 "$sri_lanka.0150.pattini_games_intro$\n我听说最近[county.GetNameNoTier]的村庄里举行了椰子游戏——#italic 布罗瞿离耶#!。两队每次都有个别队员对阵，两名队员同时向对方投掷椰子，试图砸碎对方的椰子。砸碎对方椰子最多的队伍获胜。"
 sri_lanka.0151.a:0 "$sri_lanka.0150.a$"
 sri_lanka.0151.a.failure:0 "$sri_lanka.0150.a.failure$"
 sri_lanka.0151.a.success:0 "$sri_lanka.0150.a.success$"
 sri_lanka.0152.t:0 "乳母"
 sri_lanka.0152.desc:0 "我最近参加了一个向当地乳母献祭的仪式。这个传统的[ROOT.Char.GetCulture.GetName]活动由七位符合特定标准（如贤惠、品德高尚）的当地妇女参与，她们在仪式中扮演女神[GetPlayer.Custom('RICE_pattini')]。她\n\n在仪式上，妇女们会吃到富含牛奶的食物，从而变成“奶妈”。据说供奉[GetPlayer.Custom('RICE_pattini')]可以帮助人们解决任何与生育和子女有关的问题。"
 sri_lanka.0152.a:0 "愿帕缇妮指引并保护我们"
 sri_lanka.0152.info:0 "#emphasis 历史背景：#!邀请乳母在黎明前举行仪式，供奉斯里兰卡唯一的女性主神钵底尼，即使在今天也是一种常见的做法。这种仪式通常有很多人参与，甚至被选为乳母的妇女也会参与准备仪式中使用的食物。\n\n作为斯里兰卡一种以女性为主的民间宗教形式，这些仪式是私人事务，不同于官方佛教机构组织的仪式，但也有相似之处。例如，吟诵巴利文佛经对两者都很重要，宗教布道通常由乳母主讲，就像僧侣一样。"
 sri_lanka.0153.t:0 "令人憎恶的罪犯"
 sri_lanka.0153.desc:0 "一个当地[noble.GetCulture.GetName]贵族名为[noble.GetFullName]，最近犯下了十分严重的罪行，根据法律和信仰，[noble.GetSheHe]理应受到比死亡更严苛的惩罚。因此，我适当地判处这个罪犯成为#italic 罗迪#!种姓。\n\n#italic 罗迪#!是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中最受人鄙视的群体之一。通常通过强迫最严重的罪犯加入#italic 罗迪#!种姓来惩罚他们。据说最初的#italic 罗迪#!是被古代国王惩戒的食人族后裔。一些传说甚至有说该王的女儿与食人族有一段恋情，所以她也被打入#italic 罗迪#!。\n\n无论如何，[noble.GetFirstNameNoTooltip]向我乞求怜悯，说[noble.GetSheHe]宁愿以最痛苦的方式被折磨和处决，也不愿成为#italic 罗迪#!。"
 sri_lanka.0153.a:0 "你命该如此。卫兵，带走这只害虫！"
 sri_lanka.0153.b:0 "很好！如你所愿，酷刑和处决！"
 sri_lanka.0153.c:0 "这次我就饶了你，但你欠了我一个大人情。"
 sri_lanka.0153.info:0 "#emphasis 历史背景：#!关于#italic 卢提#!或#italic 卢提耶#!种姓及其起源的历史和民间传说，其资料可以追溯到很久以前。例如，访问斯里兰卡的英国船长罗伯特·诺克斯就在他1681年出版的旅行记录中谈到了#italic 卢提#!。他还提到，当贵妇被国王惩罚成为#italic 卢提#!时，习惯上会先将这些新#italic 卢提#!送到河边，作为一种仁慈的姿态。这是因为如果妇女们想不以该身份死去，可以自行淹死在河里。"
 sri_lanka.0154.t:0 "在阿波娄摩中休息"
 sri_lanka.0154.desc:0 "今天，我去[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]附近的乡间小游。\n\n我们在一个#italic 阿波娄摩中#!停了下来！这是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]道路两旁典型的木制建筑之一，为旅行者尤其是朝圣者提供住所。\n\n今天的天气平静祥和，#italic 阿波娄摩中#!旁的风景令人叹为观止。我决定在这里多待一会儿，以便欣赏美景，享受大自然。"
 sri_lanka.0154.a:0 "幸好我决定今天去那里。"
 sri_lanka.0155.t:0 "交感[vedda.GetCollectiveNounNoTooltip]之美"
 sri_lanka.0155.desc:0 "[vedda.GetCollectiveNoun]是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的古老居民，他们是熟练的猎人和觅食者，经常与当地交换捕获的动物或食物。因此，[vedda.GetCollectiveNounNoTooltip]和周围的关系相对和谐的情况。\n\n现在当地[vedda.GetCollectiveNoun]和[county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun]的[county.GetNameNoTier]之间的关系近来愈发亲近，甚至比往常还要好。这促进了当地经济的发展，真是一件好事。"
 sri_lanka.0155.a:0 "希望这样的好时光能一直持续下去！"
 sri_lanka.0156.t:0 " 庇立得法会仪式"
 sri_lanka.0156.desc:0 "今天，我将参加[ROOT.Char.GetFaith.GetReligion.GetAdjective]地区[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]世代相传的#italic 庇立得法会仪式#!\n\n仪式的规模和复杂程度各不相同，但这次我与当地著名寺庙的僧侣一同举办，持续时间长达一周。在我的住所里建造了一个特别的亭子——#italic 庇立得亭#!，并在那里摆放了一张铺着白布的圆桌，供僧伽们举行仪式。\n\n仪式本身包括公开诵读祷文，当高僧告诉我们跟着他们诵读时仪式就开始了："
 sri_lanka.0156.a:0 "愿一切苦难都被毁灭！"
 sri_lanka.0157.t:0 "献花礼佛"
 sri_lanka.0157.desc:0 "在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]有许多[ROOT.Char.GetFaith.GetAdherentNamePlural]传统仪式。最近，我花了很多时间去献花礼佛，并在心中默念\n\n#italic 愿以此功德，普及于一切。\n我等与众生，皆共成佛道。\n愿以此功德，平等施一切，\n同发菩提心，往生安乐国。#!\n\n我觉得这能让人平静和放松，并鼓励我更加虔诚和行善积德。"
 sri_lanka.0157.a:0 "愿以此功德普及于一切，我等与众生皆共成佛道"
 sri_lanka.0158.t:0 "异端佛派？"
 sri_lanka.0158.desc:0 "虽然我是[ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')]佛派的支持者，但我仍需履行[ROOT.Char.GetTitleAsNameNoTooltip]的职责，有时还要在位于岛上的[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]领地，赞助或与其他主要[ROOT.Char.GetFaith.GetReligion.GetAdjective]佛派和教派合作。\n\n不过，也有一些坚定的[ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')]僧侣声称，与他们认为是异端的人来往，往好了说是不明智的，往坏了说就等于自己沉溺于异端。这些强硬派说，我应该尽量避免与其他佛派来往。"
 sri_lanka.0158.a:0 "他们仍然是佛陀的信徒，即使被误导了。"
 sri_lanka.0158.b:0 "也许我#italic 应该#!减少与异端寺院的互动。"
 sri_lanka.0159.t:0 "揵摩竺婆仪式"
 sri_lanka.0159.desc:0 "今天我将赞助一场#italic 揵摩竺婆仪式#!。\n\n一些正统[ROOT.Char.GetFaith.GetReligion.GetAdjective]学者可能会因此不悦，但[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的人们多年来一直在举行这种仪式。而且正是通过这种仪式，我们可以祈求上天帮助我们抵御疾病，确保好运、个人和农业的风调雨顺，这有何不妥呢？\n\n不管怎么说，这个仪式上充满活力，有许多舞蹈和鼓乐伴奏。我们在祭坛上摆放食物，然后摆放植物、动物和人物的陶俑，并在祭坛上祈祷。然后，随着仪式的进行，我们将它们打成碎片。"
 sri_lanka.0159.a:0 "希望我们的祭品能让上天满意。"
 sri_lanka.0159.info:0 "#emphasis 历史背景：#!早在公元第一个千年初期的几个世纪，就有证据表明在阿努拉德普拉（这一时期该岛的主要中心）举行过揵摩竺婆仪式。在那里进行的考古工作发现了一些陶俑碎片，这些陶俑与现在通常用于揵摩竺婆仪式的陶俑非常相似。该仪式是斯里兰卡各种仪式的一个范例，这些仪式不一定符合正统的佛教或印度教习俗，但对当地的宗教文化却非常重要。"
 sri_lanka.0160.t:0 "来自[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]的奇珍异宝"
 sri_lanka.0160.desc:0 "[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]位于多条海上贸易路线沿线，所以几个世纪以来一直是印度洋上重要的商业中心，而我这种强大的[ROOT.Char.GetWomenMen]，理所当然的可以享用从远方带来的许多奢侈品。\n\n现在，我就有机会向途经此地的商人购买贵重物品。我可以从波斯和美索不达米亚买到装饰精美的罐子，罐子内衬沥青，可以防水。或者应该买一些珍贵的宝石？还是中国的釉陶？可供选择的东西太多了！"
 sri_lanka.0160.a:0 "想了想，我还是省点钱吧。"
 sri_lanka.0160.b:0 "罐子！是最好的！"
 sri_lanka.0160.c:0 "还是买点宝石吧！"
 sri_lanka.0160.d:0 "还是买下那些可爱的釉陶吧。"
 sri_lanka.0161.t:0 "囤积的古钱币"
 sri_lanka.0161.desc:0 "村民们最近在[county.GetNameNoTier]发现了一大批古钱币，上面的图案奇特而怪异。不过并不奇怪，几个世纪以来[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的贸易往来让各种钱币经过于此，谁知道是哪些古代商人把钱币带到了这里？\n\n不管怎么说，村民们还算讲道义，把钱币上供于我，现在我必须决定如何处理这些钱币。"
 sri_lanka.0161.a:0 "这些正直的村民应该保留这些钱币。"
 sri_lanka.0161.b:0 "这些钱币将进入我的金库。"
 sri_lanka.0161.c:0 "我想和村民们平分钱币。"
 sri_lanka.0161.info:0 "#emphasis 历史背景：#!由于地处海上丝绸之路的重要位置，岛上发现了不同年代和来源的古钱币，其中最著名的是古罗马钱币。六世纪一位出生在埃及的希腊商人科斯马斯（曾航行至印度）在其关于外国的著作#italic 《基督教地志》#!中讲述了与此相关的有趣轶事。\n\n在科斯马斯的轶事中，一个罗马人和一个波斯人——可能是政要或高级商人——来到斯里兰卡国王的宫廷。因为罗马和波斯是彼此敌对的强大帝国，所以国王问他们谁的国王更伟大。波斯人首先奢言波斯沙阿的权力。然后，罗马人说，罗马国王和波斯国王已经在他们旁边了，斯里兰卡国王可以亲眼看看。国王困惑地问这怎么可能。\n\n罗马人随后要求得到两枚钱币，一枚罗马钱币，一枚波斯钱币。每枚钱币上都印有各自国王的面孔，而罗马的金币比波斯的银币更加华丽。就这样，国王被罗马人的机智和他们精美的钱币所折服，给予了罗马人丰厚的奖赏，而波斯人则羞愧地离开了。"
