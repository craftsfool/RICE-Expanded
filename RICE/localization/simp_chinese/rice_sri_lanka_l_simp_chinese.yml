 RICE_sri_lanka_bappa_beary_desc: "这位商人虽出身穆斯林，却因建造了一座名为波般遏的杜尔迦女神庙而闻名南印度。据说其遭遇海难时，杜尔迦女神在他面前显灵，将他从毁灭中拯救出来，出于对杜尔迦女神的感激，因此才建造了这座寺庙。"
