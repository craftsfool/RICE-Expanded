 RICE_sri_lanka_vijayabahu_reward_budal:0 "授予部荼特权"
 RICE_sri_lanka_vijayabahu_reward_budal_tooltip:0 "若非部荼的英勇努力，吾不可能幸存下来。"
 RICE_sri_lanka_vijayabahu_reward_budal_desc:0 "作为一名年轻的王子，我只是一个被迫在荒野中求生的孩子，还要躲避珠利耶入侵者的追捕。在那段困难时期，部荼是我的保护者和向导。我理应让他和他的后人免受一切形式的惩罚和报复。"
 RICE_sri_lanka_vijayabahu_reward_budal_confirm:0 "我永远感激他！"
 RICE_sri_lanka_vijayabahu_reward_budal_effect_tooltip_1:0 "部荼将得到一件特别的[artifact|E]——波那迦头婆铜板，来体现这一特殊命令的铜板"
 RICE_sri_lanka_vijayabahu_reward_budal_effect_tooltip_2:0 "部荼将获得你的一个[perpetual_hook|E]"
 RICE_sri_lanka_vijayabahu_reward_budal_context_tooltip:0 "#emphasis 历史背景：#!公元1017年，笈多王朝征服斯里兰卡后，一直在努力维护其在斯里兰卡的权威。在这段混乱的时期，年轻的毗阇耶婆呼作为旧王室的远房表亲，一直在躲避朱罗王朝军队的追捕。战士兼将军的部荼是毗阇耶婆呼最早的支持者和保护者之一；毗阇耶婆呼在1070年战胜朱罗王朝后，于1082年或1083年授予部荼及其后裔许多法律特权。1948年发现的所谓波那迦头婆铜板上就有这方面的记录。"
 RICE_sri_lanka_is_vijayabahu_req:0 "是毗阇耶婆呼"
 RICE_sri_lanka_is_vijayabahu_dead_req:0 "毗阇耶婆呼已死"
 RICE_sri_lanka_is_vijayabahu_dynasty_req:0 "有和毗阇耶婆呼同样的[dynasty|E]"
 RICE_sri_lanka_is_budal_dead_req:0 "部荼还活着"
 RICE_sri_lanka_polonnaruwa_capital:0 "迁都至布烂那卢婆"
 RICE_sri_lanka_polonnaruwa_capital_tooltip:0 "需要为$k_lanka$寻找一个新首都"
 RICE_sri_lanka_polonnaruwa_capital_desc:0 "[GetTitleByKey('b_anuradhapura').GetNameNoTier]，曾经[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的旧都，如今已成为一片废墟。多年动荡造成了巨大损失。现在，随着岛屿的统一，我们不能再沉浸在昔日辉煌的废墟中了，[GetTitleByKey('b_polonnaruwa').GetNameNoTier]将是一个更好、更坚不可摧的首都。"
 RICE_sri_lanka_polonnaruwa_capital_confirm:0 "为迁都做准备！"
 RICE_sri_lanka_polonnaruwa_capital_effect_tooltip_1:0 "如果[GetTitleByKey('b_polonnaruwa').GetNameNoTier][holding|E]当前没有其他[special_building|E]，则立即获得[GetBuilding('generic_university').GetName]。"
 RICE_sri_lanka_polonnaruwa_capital_effect_tooltip_2:0 "你可以选择是否将首都更名为#bold 毗阇耶罗阇补罗#!"
 RICE_sri_lanka_polonnaruwa_capital_context_tooltip:0 "#emphasis 历史背景：#!虽然考古证据表明，11世纪朱罗王朝对斯里兰卡的征服并没有像佛寺历史记载的那样对该岛的古都阿努拉德普拉造成大规模破坏，但很明显，这座城市在被入侵后大大衰落了。朱罗王朝将布烂那卢婆建成了全岛的政治、经济和宗教中心。毗阇耶婆呼将朱罗王朝赶出斯里兰卡后，没有返回阿努拉德普拉，而是在防御能力更强的波隆纳鲁瓦建都。"
 RICE_sri_lanka_worship_local_deities:0 "向室利楞伽的守护神们祈祷"
 RICE_sri_lanka_worship_local_deities_tooltip:0 "向$k_lanka$的主守护神之一祈祷"
 RICE_sri_lanka_worship_local_deities_desc:0 "在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中，[ROOT.Char.GetFaith.GetAdherentNamePlural]和那些信奉其他[religions|E]的人崇拜许多神祇。其中最强大的则被奉为岛上的守护神，我应该寻求他们的帮助。"
 RICE_sri_lanka_worship_local_deities_confirm:0 "准备椰奶饭祭品！"
 RICE_sri_lanka_worship_local_deities_effect_tooltip_1:0 "你将从多个守护神中选择一个，并获得持续#V 10#!年的相应[character_modifier|E]，"
 RICE_sri_lanka_worship_local_deities_effect_tooltip_2:0 "[RICE_sri_lanka_s|E][RICE_sri_lanka_monasteries|E]的[RICE_sri_lanka_prominence|E]将因#V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_loss_minor')|0]#!而减少"
 RICE_sri_lanka_worship_local_deities_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，斯里兰卡人民一直崇拜着各种共同的神祇，无论他们是佛教徒还是印度教徒，或者是僧伽罗人、泰米尔人以及吠陀教徒。其中许多神祇是印度教、佛教和本土宗教人物的融合形式，在不同的群体有不同的名称，其崇拜方式也往往与印度本土截然不同。有些甚至是斯里兰卡的历史人物，如国王变成了神祇。对于岛上的佛教徒来说，虽然佛陀被认为高于这些“较低级”的神祇，但后者却经常被用来解决更多的世俗问题。"
 RICE_sri_lanka_worship_local_deities_type:0 "选择一位神祇进行祈祷"
 RICE_sri_lanka_worship_local_deities_gui:0 "选择哪位神祇进行祈祷"
