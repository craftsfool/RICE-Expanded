 RICE_sri_lanka_panakaduwa_copper_plate_name:0 "波那迦头婆铜板"
 RICE_sri_lanka_panakaduwa_copper_plate_desc:0 "这块铜板是应[vijayabahu_equivalent.GetTitledFirstName]的要求制作的，不仅是为了纪念[budal.GetTitledFirstName]的功绩，也是为了正式记录[vijayabahu_equivalent.GetFirstNameNoTooltip]给予[budal.GetFirstNameNoTooltip]和[budal.GetHerHis]后代的非凡法律和政治特权。当[vijayabahu.GetFirstNameNoTooltip]还是一个年幼王子，为了躲避珠利耶王朝大军的入侵而四处逃亡，在荒野中苟延残喘时，[budal.GetFirstNameNoTooltip]一直守护[vijayabahu.GetFirstNamePossessiveNoTooltip]左右。因此，很少有人会质疑[budal.GetFirstNamePossessiveNoTooltip]在战胜珠利耶大军和统一[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的功绩。"
 RICE_sri_lanka_pali_literature_basic:0 "这部巴利文文献由[ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')]大寺的僧伽撰写，是受[ROOT.Char.GetTitledFirstName]委托而作。"
 RICE_sri_lanka_pali_literature_kavya_legends_name:0 "巴利文文献（#italic 大诗#!）"
 RICE_sri_lanka_pali_literature_kavya_legends_desc:0 "$RICE_sri_lanka_pali_literature_basic$，这是一首#italic 大诗#!，是梵语宫廷的一种诗歌形式，起源于两大史诗，后被改编为巴利文。尽管其风格感性，但这首叙事诗利用这种世俗来激励佛教教众更加虔诚地信奉宗教，例如通过解释修行或过有德行的生活的好处，还讲述佛陀、菩萨或历史上的僧伽等著名人物的佛教传说。"
 RICE_sri_lanka_pali_literature_grammatical_aid_name:0 "巴利文文献（语法集）"
 RICE_sri_lanka_pali_literature_grammatical_aid_desc:0 "$RICE_sri_lanka_pali_literature_basic$，里面是一篇论文，旨在帮助读者学习和掌握巴利文和梵语的语法。根据这本书解释，掌握这些语言关乎智商，更是一个精神发展问题，因为它能让人理解用这些语言写成的圣典和注释。"
 RICE_sri_lanka_pali_literature_doctrinal_manual_name:0 "巴利文文献（教义）"
 RICE_sri_lanka_pali_literature_doctrinal_manual_desc:0 "$RICE_sri_lanka_pali_literature_basic$，上面写着有关佛学、哲学、僧伽规范等各种问题的摘要。对重要、复杂思想的汇编和阐释，有助于任何希望了解佛法之人。"
 RICE_sri_lanka_pali_literature_historical_chronicle_name:0 "巴利文文献（#italic 编史#!）"
 RICE_sri_lanka_pali_literature_historical_chronicle_desc:0 "$RICE_sri_lanka_pali_literature_basic$，这是一部#italic 编史#!，讲述了与佛史有关的各种国王、僧伽、将军、官员和其他重要人物的生平和时代。展示了过去佛教中德高望重的英雄事迹，以及恶棍和异教徒因无法摆脱贪、嗔、痴三毒而遭受的苦难。"
 RICE_sri_lanka_pali_literature_sub_commentaries_name:0 "巴利文文献（#italic 注释#!）"
 RICE_sri_lanka_pali_literature_sub_commentaries_desc:0 "$RICE_sri_lanka_pali_literature_basic$，上面的注释阐述了很久以前写成的文献，其中讨论了佛学、哲学和宗教等问题。此类注释可能内容繁杂，有助于读者深入了解原文的含义和目的。"
 building_type_RICE_sri_lanka_ruins_of_anuradhapura:0 "阿㝹罗陀补罗古城"
 building_type_RICE_sri_lanka_ruins_of_anuradhapura_desc:0 "阿㝹罗陀补罗曾是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的首都，是佛教学习和海上贸易的中心。然而，在战争和政治双重动荡之后，这座城市失去了往日的辉煌，大部分地区被遗弃。剩下的居民生活在巨大的废墟中，让人不禁想起这座城市昔日的辉煌。"
 building_RICE_sri_lanka_ruins_of_anuradhapura:0 "$building_type_RICE_sri_lanka_ruins_of_anuradhapura$"
 building_RICE_sri_lanka_ruins_of_anuradhapura_desc:0 "$building_type_RICE_sri_lanka_ruins_of_anuradhapura_desc$"
 trait_RICE_indian_ocean_merchant:0 "印度洋航海家"
 trait_RICE_indian_ocean_merchant_desc:0 "该角色是海上丝绸之路的杰出商人，拥有在海上和季风中航行的经验，人脉遍布四海，从斯瓦希里海岸一直到远东港口之间都有联系。"
 trait_RICE_indian_ocean_merchant_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是海上丝绸之路的杰出商人，[ROOT.GetCharacter.GetSheHe]拥有在海上和季风中航行的经验，人脉遍布四海，从斯瓦希里海岸一直到远东港口之间都有联系。"
 trait_RICE_mahavihara_trait_1:0 "大寺派布施者"
 trait_RICE_mahavihara_trait_2:0 "大寺派施主"
