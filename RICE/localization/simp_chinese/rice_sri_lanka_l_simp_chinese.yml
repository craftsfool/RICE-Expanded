 game_concept_mahavihara_i:0 "@RICE_mahavihara_icon!"
 game_concept_mahavihara:0 "大寺派"
 game_concept_mahavihara_desc:0 "大寺派与[abhayagiri|E]、[jetavana|E]是[RICE_sri_lanka_struggle|E]中的三大[RICE_sri_lanka_monasteries|E]（在游戏中，大寺派以橙色图标@RICE_mahavihara_icon!表示）\n\n如果你想完成[RICE_sri_lanka_short|E][struggle|E]，就需要通过不同的[decisions|E]、[activities|E]等来提高或降低大寺派的[RICE_sri_lanka_prominence|E]，期间可以使用$RICE_sri_lanka_choose_monastic_sect$[decision|E]来获得[GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )][trait|E]。\n\n在历史上大寺派是比较“传统”的佛派，对上座部佛教的诠释较为克制。大寺派僧侣通常对大乘和金刚乘思想持怀疑态度，并通过严谨的学术著作和文献来捍卫自己教派的立场，而最终他们是“赢得了”其他佛派。"
 game_concept_abhayagiri_i:0 "@RICE_abhayagiri_icon!"
 game_concept_abhayagiri:0 "无畏山派"
 game_concept_abhayagiri_desc:0 "无畏山派与[mahavihara|E]、[jetavana|E]是[RICE_sri_lanka_struggle|E]中的三大[RICE_sri_lanka_monasteries|E]（在游戏中，无畏山派以橙色图标@RICE_abhayagiri_icon!表示）\n\n如果你想完成[RICE_sri_lanka_short|E][struggle|E]，就需要通过不同的[decisions|E]、[activities|E]等来提高或降低无畏山派的[RICE_sri_lanka_prominence|E]，期间可以使用$RICE_sri_lanka_choose_monastic_sect$[decision|E]来获得[GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )][trait|E]。\n\n在历史上无畏山派对上座部佛教采取创新的态度。无畏山派僧侣通常愿意接受并融入大乘和金刚乘思想，同时仍保持其上座部佛教的根基，这让他们一度成为岛上的主流佛派。"
 game_concept_jetavana_i:0 "@RICE_jetavana_icon!"
 game_concept_jetavana:0 "柢陀林派"
 game_concept_jetavana_desc:0 "柢陀林派与[mahavihara|E]、[abhayagiri|E]是[RICE_sri_lanka_struggle|E]中的三大[RICE_sri_lanka_monasteries|E]（在游戏中，柢陀林派以橙色图标@RICE_jetavana_icon! 表示）\n\n如果你想完成[RICE_sri_lanka_short|E][struggle|E]，就需要通过不同的[decisions|E]、[activities|E]等来提高或降低柢陀林派的[RICE_sri_lanka_prominence|E]，期间可以采用$RICE_sri_lanka_choose_monastic_sect$[decision|E]来获得[GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )][trait|E]。\n\n历史上柢陀林派在诠释上座部教时走的是一条中间道路，与[abhayagiri|E]类似。虽然诋毁者指责他们对大乘和金刚乘思想过于宽容，但柢陀林派僧侣认为自己任是上座部教捍卫者，他们是三个佛派中规模最小、影响力最小的一个，不过，在他们的主要寺院所在地有一座大舍利塔名为#italic 祗陀林佛塔#!，它曾一度是继金字塔之后世界上最高的建筑（祗陀林佛塔高112米）。"
 game_concept_RICE_sri_lanka_prominence:0 "名望"
 game_concept_RICE_sri_lanka_prominence_desc:0 "名望代表了[RICE_sri_lanka_monasteries|E]或佛教三大[RICE_sri_lanka_struggle|E]（[abhayagiri_i|E][abhayagiri|E]、[jetavana_i|E][jetavana|E]、[mahavihara_i|E][mahavihara|E]）的影响力。\n\n这些数值在[RICE_sri_lanka_short|E]中的[struggle|E]中起着重要作用，因为要结束[struggle|E]，就必须使它们达到一定的数值。名望可以通过[decisions|E]、[activities|E]、事件等来提高或降低，且如果你拥有三大寺之一相关的[trait|E]，这种影响数值变化会更大。这种[trait|E]可以通过$RICE_sri_lanka_choose_monastic_sect$[decision|E]获得。\n\n赞助佛派可以保持较高名望，而且每年都会随机获得少量[piety_i|E][piety|E]和[prestige_i|E][prestige|E]，具体数值取决于佛派名望"
