 sri_lanka.0050.t:0 "抵达罗摩桥"
 sri_lanka.0050.desc:0 "历经万难，我终于来到了#bold 罗摩桥#!的所在地。\n\n尽管并非所有人都同意这一说法，但许多人相信，这里正是伟大的#italic 《罗摩衍那》#!提到的地方，而罗摩在猴子帮助下建成了罗摩桥并连接[GetGeographicalRegion('world_india').GetName]和[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]，后救回妻子\n\n正因为如此，这里多年来这里一直是朝圣者的主要目的地。而今，我自己也深陷在成群结队的朝圣者中，他们都是来罗摩那吒师梵伊神庙朝圣的，那湿婆朝圣地的中心。"
 sri_lanka.0050.a:0 "稍做休息后，我们就前往神庙吧"
 sri_lanka.0051.t:0 "罗摩那吒师梵伊神庙"
 sri_lanka.0051.desc:0 "今天，我走进了罗摩那吒师梵伊神庙。走在这些宏伟的走廊上，让我心潮澎湃，相传这是[GetGeographicalRegion('world_india').GetName]中最长的神庙。\n\n我来到寺庙里的主要#italic 林伽#!前，它们是湿婆神的神圣象征。随后我来到被称为#italic 毗婆林迦#!前，据说，神猴哈奴曼和罗摩的追随者将它从魔拉伐带到了这里，指示罗摩必须先祭拜这座灵塔。\n\n在参加了一些祈祷和仪式后，我又去了#italic 拉曼伶甘#!塔，它是罗摩和悉多用沙子建造的。"
 sri_lanka.0051.a:0 "这里真是个好地方。"
 sri_lanka.0052.t:0 "提婆达"
 sri_lanka.0052.desc:0 "我现在准备参观一些与罗摩那吒师梵伊神庙有关的#italic 提婆达#!或圣水。这些圣水通常是朝圣者前往罗摩桥的热门地点，因为据说在这些圣水中沐浴可以获得诸多益处，包括赦免罪孽。\n\n有些提婆达在寺庙外，如勒尼·梨曇，它位于寺庙东面的海滩上。其他的提尔塔则在寺庙内。\n\n现在我在这些提尔塔沐浴时，我应该记得专注于精神方面的事情，并向湿婆顶礼膜拜。"
 sri_lanka.0052.a:0 "是时候忏悔了。"
 sri_lanka.0051.a.tooltip:0 "你从体验中得到精神启迪"
 sri_lanka.0053.t:0 "离开罗摩桥"
 sri_lanka.0053.desc:0 "我的罗摩那吒师梵伊神庙之行，也就是罗摩桥之行已经结束。参观这个在#italic 《罗摩衍那》#!中占有重要地位的地方，回味罗摩、悉多、哈努曼等人的英雄气概和美德，以及能够向湿婆神献身，是一次伟大的精神体验。\n\n总之，罗摩桥之行让我终生难忘。"
 sri_lanka.0053.a:0 "是时候开始返程了。"
