 RICE_sri_lanka_change_monastic_sect_desc:0 "在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中的[RICE_sri_lanka_sangha|E]隶属于不同[RICE_sri_lanka_monasteries|E]，其中最重要的三个是[mahavihara|E]、[abhayagiri|E]和[jetavana|E]。我目前赞助的是[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]，但现在我希望支持其他佛派。"
 RICE_sri_lanka_change_monastic_sect_united_desc:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的[RICE_sri_lanka_sangha|E]如今全部归一在[GetPlayer.Custom('RICE_sri_lanka_unified_monastery_game_concept')]寺院的领导下。现在我明智的做法应该是转换信仰并光顾他们。"
 RICE_sri_lanka_change_monastic_sect_confirm:0 "改信为妙！"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_1:0 "你将选择[GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )]或[GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )][traits|E]其一"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_2:0 "你将选择[GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )]或[GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )][traits|E]"
