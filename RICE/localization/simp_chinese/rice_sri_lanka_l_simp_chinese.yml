 game_concept_RICE_land_grants_desc:0 "信仰$buddhism_religion_adj$、$hinduism_religion_adj$或$jainism_religion_adj$[faiths|E]的[rulers|E]能[decide|E]$RICE_india_land_grant_decision$。\n\n当选择此[decision|E]时，你需要向三个[religions|E]之一授予土地。这意味着可以向你未信仰的[religion|E]授土。\n\n做出这些授予，你会获得一个[character_modifier|E]来增长此[religion|E]的信徒的你的[opinion|E]，并且给你的[counties|E]添加一些增益性的[county_modifiers|E]。[county_modifier|E]会降低[tax|E]但会增加[development_growth|E]。如果你信仰你一个所选择的[religion|E]的[faith|E]，那么[modifier|E]也会提高[county_opinion|E]；如果并非你所信仰，那么作为替代，[modifier|E]会提高更多的[development_growth|E]。符合拥有[church_holding|E]的要求的[counties|E]会获得更为强大的[modifier|E]。\n\n另外，受影响的[counties|E]，[decision|E]有很小的几率使[counties|E][faith|E]皈依此你的[religion|E]"
