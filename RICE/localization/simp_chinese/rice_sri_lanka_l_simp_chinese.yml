 RICE_muallim_option_desc:0 "在印度洋，阿拉伯语#italic 麻拉目（mu'allim）#!表示航海大师。他们精通算术、几何、地理、计量学等知识，这些知识都是从阅读古籍和实践经验中获得的。在公海旅行时，他们即使不是关键人物，也是不可或缺的。"
