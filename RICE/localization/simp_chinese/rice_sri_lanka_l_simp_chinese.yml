 innovation_RICE_velakkara_guards:0 "毗勒迦罗卫队"
 innovation_RICE_velakkara_guards_desc:0 "毗勒迦罗兵源通常来自泰米尔族群，但隶属于不同的种姓和社区。他们以卫队的形式组织起来，通过大型集会管理，其高超的战斗技艺让一些王室和贵族会雇用毗勒迦罗整队作为皇家侍卫或圣地的保护者。"
 RICE_velakkara:0 "毗勒迦罗"
 RICE_velakkara_flavor:0 "#F 毗勒迦罗兵源通常来自泰米尔族群，但隶属于不同的种姓和社区，其高超的战斗技艺让一些王室和贵族会雇用毗勒迦罗整队作为皇家侍卫或圣地的保护者。#!"
 RICE_bantu_warriors:0 "班图勇者"
 RICE_bantu_warriors_flavor:0 "#F 班图的勇者们都拥有丰富的战斗经验，无论是防御还是进攻，满腔热血只为他们的族人#!"
