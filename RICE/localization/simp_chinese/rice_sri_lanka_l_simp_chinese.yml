 sri_lanka.0030.t:0 "支持[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]"
 sri_lanka.0030.desc.buddhist:0 "我作为[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]佛派的赞助人，我必须与他们共进退，在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]推进[buddhism.GetName]的事业，提升功德。"
 sri_lanka.0030.desc.non_buddhist:0 "虽然我不信奉[buddhism.GetName]，但我仍然是[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]佛派的赞助人。对我来说，与他们合作开发[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的土地非常重要。"
 sri_lanka.0030.desc.foreign:0 "虽然我远离[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的僧团，但我相信我作为[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]的赞助人，我有责任通过支持[buddhism.GetAdjective]群体来加强我在那里的权威。"
 sri_lanka.0030.desc.almsgiving:0 "下至农民上至领主，无论信不信[buddhism.GetAdjective]，都会经常布施僧侣，何况我是[ROOT.Char.GetTitleAsNameNoTooltip]。据说这样做能获得巨大的功德，虽然我已经捐出布施，但我想向[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的僧侣们捐出比平时多得多。"
 sri_lanka.0030.desc.gavu_pillars:0 "我已下令在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]领地内建造一些新的#Bold 迦乌柱#!，并对现有石柱进行维修。这些路边石柱以固定的间隔标示距离，帮助旅行者安全快捷地旅行，尤其是往返于岛上众多宗教场所的朝圣者。而且这些石柱上会歌颂我和我所支持佛派，为我们赢得荣誉和支持。"
 sri_lanka.0030.desc.ritual_deposits:0 "在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]上，这是一种常见的[buddhism.GetAdjectiveNoTooltip]做法，与这里强大的寺院（如[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]有着密切的联系。许多人认为，在我选择的庙宇中埋葬物品，可以增强所在地的力量，并获得大量功德。"
 sri_lanka.0030.desc.ambalamas:0 "我下令在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]领地内建造几座新的#italic 阿波娄摩#!，并对现有的进行翻新。几个世纪以来，旅行者们一直在使用这些看似简单的驿站，它们与前往岛上众多宗教场所的朝圣者有着密切的联系。对于那些希望礼敬佛陀、践行佛法和提升功德的人来说，有了#italic 阿波娄摩#!道路将变得更加安全。"
 sri_lanka.0030.desc.ordination_ceremonies:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的僧侣团体一直在招收新的初出家僧尼，他们渴望用自己有生之年来实践佛陀的教诲，努力开悟。我寻求赞助[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中一些僧尼的剃度仪式，身边有更多这样的人只会是件好事。"
 sri_lanka.0030.desc.pali_literature:0 "在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的一些寺院里，僧伽们正在辛勤地撰经文，从佛法注释，再到充满伤感风格的梵文#italic 大诗#!，激励人们的功德行为和思想。我也希望通过资助其中一些文本的写作，获得一些功德。"
 sri_lanka.0030.desc.frontier_monks:0 "我的领地[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中的一些边境地区缺少僧侣。我计划资助一些僧侣迁入这些地区，以扩大我和[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]的威望。我还打算资助当地的#italic 苦行僧#!，因为他们深受当地人的尊敬，可以协助我们的工作。"
 sri_lanka.0030.desc.parivena_schools:0 "与[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]的所有大寺一样，[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]也维持着一个#italic 建波梨毗陀学院#!。而我决定再新建一座，进一步扩大[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]影响力。"
 sri_lanka.0030.desc.senior_guides:0 "在[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]，我觉得我们没有足够的智慧和博学的大师来领导我们的[buddhism.GetAdjective]群体。$k_lanka$的僧侣在许多国家都受到信徒的尊敬，通过与他们接触，我们可以将一些僧侣和尼姑请到这里来教授我们自己的僧侣和尼姑，并在我们自己的人民中传播佛法。"
 sri_lanka.0030.a.buddhist:0 "以佛门三宝之名！"
 sri_lanka.0030.a.non_buddhist:0 "僧伽们会对此感到高兴的！"
 sri_lanka.0031.t.buddhist:0 "净化僧伽"
 sri_lanka.0031.t.non_buddhist:0 "迫害僧伽"
 sri_lanka.0031.desc:0 "我已将[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中领地内的官员排序为"
 sri_lanka.0031.desc.burn_books:0 "查出岛上[buddhism.GetAdjective]佛派中目前存放的任何鼓吹庸俗思想和不道德的书籍。\n\n长期以来，这些佛派中的一些僧侣以宗教为由，阴险地为撰写和传播这些邪恶的佛典辩护。现在到此为止了！我的官员将没收并烧毁他们发现的任何异端书籍。"
 sri_lanka.0031.desc.defrock_heretics_buddhist:0 "调查[buddhism.GetAdjective]诸多僧侣的道德状况，并惩罚任何不守清规的人。\n\n最近出现了很多僧侣，他们像庸俗的平民一样生活，干着偷鸡摸狗的事，这还是僧伽吗？这会让人蔑视僧侣！不守清规的僧侣将被迫还俗，或者如果他们想多获得一次机会，那么就从低级的沙弥做起。"
 sri_lanka.0031.desc.defrock_heretics_non_buddhist:0 "调查[buddhism.GetAdjective]诸多僧侣的道德状况，并惩罚任何不守清规的人。\n\n最近出现了很多僧侣，他们像庸俗的平民一样生活，干着偷鸡摸狗的事。我身为一个[ROOT.Char.GetFaith.GetAdherentName]，但像这样不守清规的秃驴会在领地内制造混乱和纷争。因而我要惩戒他们，不守清规僧侣将被迫还俗，财产将被没收。"
 sri_lanka.0031.desc.plunder_wealth_buddhist:0 "要求那里的[buddhism.GetAdjective]寺院将贵重物品交给我们。如果寺院拒绝，那怪不得我了。\n\n这些寺院贪婪地积累了财富。为了佛陀教义，这些僧侣必须放弃这些世俗财产。"
 sri_lanka.0031.desc.plunder_wealth_non_buddhist:0 "要求那里的[buddhism.GetAdjective]寺院将贵重物品交给我们。如果寺院拒绝，那怪不得我了。\n\n这些寺院贪婪地积累了财富，显然只有[ROOT.Char.GetFaith.GetName]的教诲才可以让神职人员保持谦卑，现在这些财富归于我们了！"
 sri_lanka.0031.desc.seize_land:0 "派兵夺取当地[buddhism.GetAdjective]寺院的土地。附属于他们的农民、奴隶、建筑物、以及#italic 旱地梯级池塘村庄#!等现在都属于我们。\n\n早先的领主曾将这些土地中的大部分赠与寺院，以帮助它们。而今有些寺院已堕落成为贪婪商人和军阀，是时候拨乱反正将这些土地收回了！他们不配拥有这么多土地！"
 sri_lanka.0031.desc.ransack_monastery:0 "派兵摧毁佛寺，抢走任何值钱的东西，凡违者斩。\n\n长期以来，这些傲慢、麻烦的[buddhism.GetAdjective]寺院助长了纷争和混乱。该把这些秃驴一网打尽，并没收他们的财富了！"
 sri_lanka.0031.desc.buddhist:0 "\n\n有人说我是出于贪婪，也有人说我是政治，还有人相信我的话，说我希望通过清除异端、捍卫正法来净化[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中的[RICE_sri_lanka_sangha|E]。哼，真相？无需重要\n"
 sri_lanka.0031.desc.non_buddhist:0 "\n\n[buddhism.GetAdjective][RICE_sri_lanka_sangha|E]可能不满我的行为，但我是一个[ROOT.Char.GetFaith.GetAdherentName]。如果他们希望生活在[ROOT.Char.GetDynasty.GetName]的统治之下，那么他们就需要学会服从与我。"
 sri_lanka.0031.a:0 "继续按计划行事。"
 sri_lanka.0032.t:0 "巴利文文献"
 sri_lanka.0032.desc:0 "不久前，我资助了一些巴利文作品创作。令我惊喜的是我很快获得了丰厚的回报。虽然资助是为了帮助更广大的[buddhism.GetAdjective]群体，但[ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')]僧伽们向我提供了他们创作的精美文本。\n\n他们为此特别编撰出了"
 sri_lanka.0032.desc.kavya_legends:0 "旨在激励听众更加虔诚地信奉[buddhism.GetNameNoTooltip]的#bold 大诗#!\n\n这种宫廷诗最初来自非[buddhism.GetAdjectiveNoTooltip]印度君主的宫廷，用梵文书写，由于其感性风格而备受争议。不过，许多人认为，如果运用得当，并将重点放在宗教主题上，这种体裁就能超越其表面的世俗外衣，帮助他人领悟佛陀的教诲，对僧伽尊重，更多参与精神修行，并在通往觉悟的道路上前行。"
 sri_lanka.0032.desc.grammatical_aid:0 "旨在帮助学习[buddhism.GetAdjectiveNoTooltip]语言的#bold 语法册#!\n\n巴利语分成两部分，其一是本身，是礼仪语言。其次是梵文，梵文不仅用于其他佛教教派的文典中，也用于宗教和世俗文学中，即使是巴利教也不例外。掌握了这些语言，也就掌握了这些尊贵的典籍。"
 sri_lanka.0032.desc.doctrinal_manual:0 "涉及[buddhism.GetAdjectiveNoTooltip]神学、哲学的#bold 感悟集#!\n\n承认对[buddhism.GetAdjectiveNoTooltip]之道的无知并不可耻，只要从权威来源寻求帮助即可。因此在学习了这些经文之后，就可以学习更复杂、更深入的注释，以及[buddhism.GetAdjectiveNoTooltip]原始经文。"
 sri_lanka.0032.desc.historical_chronicle:0 "讲述了与[buddhism.GetAdjectiveNoTooltip]有关的各种重要人物的生平和时代的#bold 编史#!\n\n虽然其目的是教育他人，了解那些捍卫佛法和僧伽并因此获得功德的[buddhism.GetAdjectiveNoTooltip]之人，以及那些因放不下贪、嗔、痴三毒而受苦受难的恶棍和异教徒。读过此书的人都会受到启发，立志行善积德！"
 sri_lanka.0032.desc.sub_commentaries:0 "阐述一个或多个现有的著名[buddhism.GetAdjectiveNoTooltip]文典的#bold 注释#!\n\n众所周知，[buddhism.GetAdjectiveNoTooltip]注释有时和所讨论的原始经文一样晦涩难懂。因此试图解释和理解这些注释，并最终理解佛陀教义的人来说，#italic 注释#!也是一个知识宝库。"
 sri_lanka.0032.a:0 "这真是一部鼓舞人心的作品！"
 sri_lanka.0032.tooltip.pali_literature:0 "你将获得一本巴利文[artifact|E]。#weak 质量取决于你的[learning|E]，其次是[diplomacy|E]#!"
