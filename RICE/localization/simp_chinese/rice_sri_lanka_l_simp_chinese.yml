 RICE_sri_lanka_persecute_monastery_tooltip:0 "打压[RICE_sri_lanka_sangha|E]中的落伍者，无论是出于宗教还是世俗原因"
 RICE_sri_lanka_persecute_monastery_desc_purify:0 "在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]的[ROOT.Char.GetFaith.GetReligion.GetAdjective][RICE_sri_lanka_sangha|E]中，有一些腐败、不守清规的僧侣。为了减少他们的影响，我们应针对那些宣扬他们的恶习和异端思想的佛派，即使有些人声称只有贪婪、渴望权力的[rulers|E]才会这样做。"
 RICE_sri_lanka_persecute_monastery_desc_persecute:0 "[RICE_sri_lanka_s_sangha|E]不受清规的佛教僧侣经常在我们的人民中间挑起事端，散布危险的思想。如果我们直接打压他们佛派，就能削弱他们的影响力，也能充实我们的国库，不过会让[realm|E]中的佛教徒不会高兴。"
 RICE_sri_lanka_persecute_monastery_confirm:0 "我们必须这样做！"
 RICE_sri_lanka_persecute_monastery_effect_tooltip_1:0 "你将在[RICE_sri_lanka_short|E]中选择对佛派的迫害程度，并获得[gold|E]"
