 RICE_nakhudas_option_desc:0 "#italic 那弗答（Nakhudas）#!或#italic 瑙毗多迦（Nauvittakas）#!是印度沿海地区一个具有不同文化和宗教背景的商人阶层。他们的联系可以帮助任何希望安全及时地远行的旅行者。"
