 game_concept_RICE_sri_lanka_struggle_desc:2 "#bold $game_concept_RICE_sri_lanka_struggle$#!是影响[GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName][region|E]的[struggle|E]。大概描述了室利楞伽这个岛屿上佛教变迁的历史。\n\n几个世纪以来，佛教尤其是三个称为[mahavihara_i|E][mahavihara|E]、[abhayagiri_i|E][abhayagiri|E]和[jetavana_i|E][jetavana|E]的佛派，不仅在昙跛槃尼，还在整个南亚和东南亚互相争夺精神和世俗的[RICE_sri_lanka_prominence|E]。这种持续数个世界的[struggle|E]让僧伽们在[struggle_phase_sri_lanka_accumulation_simple|E]财富的同时，一些僧伽犯了[struggle_phase_sri_lanka_degeneration_simple|E]，而另一半批又想[struggle_phase_sri_lanka_purification_simple|E]这些佛门败类，从而循环往复。\n\n无论[rulers|E]是[struggle_involved|E]还是[struggle_interloper|E]，甚至附近地区的佛教徒，都可以通过各种[decisions|E]和其他机制来参与到[struggle|E]之中，通过提高或降低三佛派的[RICE_sri_lanka_prominence|E]（#V 0#!至#V 1000#!），只有足够高亦或者足够低才可以结束[struggle|E]。"
