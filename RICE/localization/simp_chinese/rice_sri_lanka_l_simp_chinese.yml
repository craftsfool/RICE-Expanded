 sri_lanka.0080.t:0 "众信一山"
 sri_lanka.0080.desc:0 "来到[GetPlayer.Custom('RICE_sri_pada')]后，我愈发注意到这里受到许多不同信仰的追随者的尊重，而非仅有[ROOT.Char.GetFaith.GetAdherentNamePlural]追捧。\n\n例如，有些其他信仰的信徒称这座山为[GetPlayer.Custom('RICE_sri_pada_opp')]，而不是像我们一样称它为[GetPlayer.Custom('RICE_sri_pada')]。也不是每个人都相信[GetPlayer.Custom('RICE_sri_pada_footprint_person')]在山顶留下了脚印。\n\n尽管如此，这里不同群体之间的关系仍然十分紧张，但看到这么多信仰不同的人，包括那些因信仰相互争吵的人，共享这个神圣之地，真是令人着迷。"
 sri_lanka.0080.a:0 "这是我在这里时需要思考的问题。"
 sri_lanka.0081.t:0 "避免开荤"
 sri_lanka.0081.desc:0 "在[GetPlayer.Custom('RICE_sri_pada')]附近和[GetPlayer.Custom('RICE_sri_pada')]上，人们通常会避免开荤，至少许多[buddhism.GetAdjective]和[hinduism.GetAdjective]信徒会这样做。即使那些不忌口的教派也会减少食用肉类，据说这样可以让人们更好地专注于朝圣和崇拜[ROOT.Char.GetFaith.HighGodName]。"
 sri_lanka.0081.a:0 "在这我需要避免开荤。"
 sri_lanka.0081.b:0 "在这我不需要避免开荤。"
