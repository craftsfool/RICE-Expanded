 RICE_sri_lanka_sangha_uniter_modifier: "统合室利楞伽的僧伽"
 RICE_sri_lanka_sangha_uniter_modifier_desc: "该宗族在[RICE_sri_lanka_struggle|E]中的统合佛派中发挥了重要作用。无论如今宗族成员们是否仍为佛教徒，其先辈功绩都赢得了该地区佛教徒永远的感激。"
 RICE_sri_lanka_sangha_destroyer_modifier: "灭佛倒法者"
 RICE_sri_lanka_sangha_destroyer_modifier_desc: "该宗族在[RICE_sri_lanka_struggle|E]中为摧毁争斗不休的佛派贡献不少力量。即使他们成为了佛教徒，其令人发指的行为也使他们受到了该地区佛教徒（如果仍有残余僧伽的话）永远的仇视。"
 RICE_sri_lanka_sangha_reviver_modifier: "佛教护法"
 RICE_sri_lanka_sangha_reviver_modifier_desc: "在[RICE_sri_lanka_struggle|E]后佛教式微，但该宗族在复兴佛教发挥了重要作用，在其所控的领土上建立了一个新的佛教学习和信仰中心，因此被僧伽们尊为“护法”"
 RICE_sri_lanka_relic_bodhi_modifier: "对菩提树的崇拜（微）"
 RICE_sri_lanka_relic_tooth_modifier: "对佛齿的崇拜（微）"
 RICE_sri_lanka_relic_dharmadhatu_modifier: "对《赞法界颂》的崇拜（微）"
 RICE_sri_lanka_relic_bodhi_great_modifier: "对菩提树的崇拜（盛）"
 RICE_sri_lanka_relic_tooth_great_modifier: "对佛齿的崇拜（盛）"
 RICE_sri_lanka_relic_dharmadhatu_great_modifier: "对菩提树的崇拜（盛）"
 RICE_sri_lanka_relic_bodhi_shrine_modifier: "菩提树寺"
 RICE_sri_lanka_relic_bodhi_shrine_modifier_desc: "这里的寺庙中供奉着佛陀成道的那棵菩提树的枝干。随着[RICE_sri_lanka_struggle|E]的落幕，这里已成为[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]及其他地区佛教徒崇拜和敬仰的主要场所。"
 RICE_sri_lanka_relic_tooth_shrine_modifier: "佛齿寺"
 RICE_sri_lanka_relic_tooth_shrine_modifier_desc: "佛齿寺供奉着从佛陀火化骨灰中提取的佛牙舍利。随着[RICE_sri_lanka_struggle|E]的落幕，这里已成为[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]及其他地区佛教徒崇拜和敬仰的主要场所。"
 RICE_sri_lanka_relic_dharmadhatu_shrine_modifier: "法界寺"
 RICE_sri_lanka_relic_dharmadhatu_shrine_modifier_desc: "这里的寺庙中供奉着各种佛经和抄本。随着[RICE_sri_lanka_struggle|E]的落幕，这里已成为[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]及其他地区佛教徒崇拜和敬仰的主要场所。"
 RICE_sri_lanka_frontier_monks_wilderness: "云游僧"
 RICE_sri_lanka_frontier_monks_non_wilderness: "庙宇扩张"
 RICE_sri_lanka_sri_lankan_monk_advisors: "来自室利楞伽的僧人顾问"
 RICE_sri_lanka_sri_lankan_monks: "来自室利楞伽的僧人"
 RICE_sri_lanka_gavu_pillars: "迦乌柱"
 RICE_sri_lanka_gavu_pillars_desc: "在佛寺的支持下，当地领主最近在这一地区建造或修复了一些#italic 迦乌柱#!。这些石柱是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]地区道路上的常见景观，旨在帮助旅行者记录路程，尤其是前往岛上众多宗教场所朝。"
 RICE_sri_lanka_ambalamas: "阿波娄摩"
 RICE_sri_lanka_ambalamas_desc: "在佛寺的支持下，当地领主最近建造且翻新了该地区的一些#italic 阿波娄摩建筑#!。这些木制建筑尽管风格简单，但这是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中朝圣者和旅行者的传统休息场所，有着重要的作用。"
 RICE_sri_lanka_book_burnings_buddhist: "焚书"
 RICE_sri_lanka_book_burnings_buddhist_desc: "该领主最近下令，没收其领土上发现的某些佛教典籍，甚至要求烧毁。其认为这些佛经散布了曲解佛陀的异端思想，是对佛法的不当诠释，会在僧团内部散布纷争。"
 RICE_sri_lanka_book_burnings_buddhist_purification: "$RICE_sri_lanka_book_burnings_buddhist$"
 RICE_sri_lanka_book_burnings_buddhist_purification_desc: "$RICE_sri_lanka_book_burnings_buddhist_desc$"
 RICE_sri_lanka_book_burnings_non_buddhist: "$RICE_sri_lanka_book_burnings_buddhist$"
 RICE_sri_lanka_book_burnings_non_buddhist_desc: "该领主最近下令，没收其领土上发现的某些佛教典籍，甚至要求烧毁。其认为佛教僧伽正在通过这些经书鼓励危险的异端思想，甚至威胁领主权威。"
 RICE_sri_lanka_defrock_heretics_buddhist: "整顿异端"
 RICE_sri_lanka_defrock_heretics_buddhist_desc: "该领主最近下令整顿腐败和异端僧侣教籍。那些被认为不守誓言、不道德和传播异端思想的妖僧将被没收财产，让他们要么可以回归俗世生活，要么可以在该领主认可的寺庙下重修誓言。"
 RICE_sri_lanka_defrock_heretics_buddhist_purification: "$RICE_sri_lanka_defrock_heretics_buddhist$"
 RICE_sri_lanka_defrock_heretics_buddhist_purification_desc: "$RICE_sri_lanka_defrock_heretics_buddhist_desc$"
 RICE_sri_lanka_defrock_heretics_non_buddhist: "$RICE_sri_lanka_defrock_heretics_buddhist$"
 RICE_sri_lanka_defrock_heretics_non_buddhist_desc: "该领主最近下令整顿腐败和异端修僧侣教籍，其认为这些僧侣中包含反叛者，并无视领主权威并被没收僧侣财产，勒令他们要么还俗，要么在其认可的佛寺下重新发愿。"
 RICE_sri_lanka_plunder_wealth_buddhist: "掠夺僧伽蓝的财富"
 RICE_sri_lanka_plunder_wealth_buddhist_desc: "该领主最近下令让其境内的某些佛寺交出财宝，虽然其声称这样做是因为觉得出家人无须身外之物，但也有人认为这位领主只是贪婪，或者充其量只是想削弱佛教地位。"
 RICE_sri_lanka_plunder_wealth_buddhist_purification: "$RICE_sri_lanka_plunder_wealth_buddhist$"
 RICE_sri_lanka_plunder_wealth_buddhist_purification_desc: "$RICE_sri_lanka_plunder_wealth_buddhist_desc$"
 RICE_sri_lanka_plunder_wealth_non_buddhist: "$RICE_sri_lanka_plunder_wealth_buddhist$"
 RICE_sri_lanka_plunder_wealth_non_buddhist_desc: "该领主最近下令让其境内的某些佛寺交出财宝，虽然其声称这样做是因为觉得出家人无须身外之物，但也有人认为非佛教徒领主只是贪婪，或者充其量只是想削弱佛教地位。"
 RICE_sri_lanka_seize_land_buddhist: "没收土地"
 RICE_sri_lanka_seize_land_buddhist_desc: "该领主最近下令没收其境内佛教寺院的一些土地。有人说这是该统治者认为这些僧侣因为要管理世俗事务而偏离了佛道，但也有人说这是出于政治原因或纯粹的贪婪。"
 RICE_sri_lanka_seize_land_buddhist_purification: "$RICE_sri_lanka_seize_land_buddhist$"
 RICE_sri_lanka_seize_land_buddhist_purification_desc: "$RICE_sri_lanka_seize_land_buddhist_desc$"
 RICE_sri_lanka_seize_land_non_buddhist: "$RICE_sri_lanka_seize_land_buddhist$"
 RICE_sri_lanka_seize_land_non_buddhist_desc: "该领主最近下令令没收属于其境内佛寺一些土地。也许，作为一个非佛教徒，其感到了这些寺院影响力的威胁，亦或者只是贪婪。"
 RICE_sri_lanka_ransack_monasteries_buddhist: "遭洗劫的僧伽蓝"
 RICE_sri_lanka_ransack_monasteries_buddhist_desc: "该领主最近下令彻底摧毁其境内的佛寺，并拿走其中财宝。尽管名义上该领主是佛教徒（至少在这么做的时候是佛教徒），但很明显，该领主要么不在乎灾业，要么只是想削弱其认为的腐朽僧团。"
 RICE_sri_lanka_ransack_monasteries_buddhist_purification: "$RICE_sri_lanka_ransack_monasteries_buddhist$"
 RICE_sri_lanka_ransack_monasteries_buddhist_purification_desc: "$RICE_sri_lanka_ransack_monasteries_buddhist_desc$"
 RICE_sri_lanka_ransack_monasteries_non_buddhist: "$RICE_sri_lanka_ransack_monasteries_buddhist$"
 RICE_sri_lanka_ransack_monasteries_non_buddhist_desc: "该领主最近下令彻底摧毁其境内的佛寺，并拿走其中财宝。虽然该领主不是佛教徒，但这肯定不会给佛教臣民或外国佛教领主带来好的影响，其贪婪和无情肯定会被人们记住。"
 RICE_sri_lanka_budal_dynasty_privileges: "部荼后裔特权"
 RICE_sri_lanka_budal_dynasty_privileges_desc: "当未来国王毗阇耶婆呼还是一个为了躲避入侵者而迷失在荒野中的男孩时，他最伟大、最英勇的保护者就是部荼。为了感谢部荼的英勇和美德，以及肯定其随后的功勋，毗阇耶婆呼赐予他和他的后代极大的特权。"
 RICE_funded_irrigation_tank_small:0 "资助建造小型灌溉水库"
 RICE_funded_irrigation_tank_small_desc:0 "该角色最近捐赠了一些资金，与当地精英和宗教合作，在领地修建灌溉水库。这些经过精心设计的水库系统遍布印度各地，在生活中发挥着重要作用，因为它们可以收集和保存雨水。"
 RICE_irrigation_tank_constructed_small:0 "最近修建的小型灌溉水库"
 RICE_irrigation_tank_constructed_small_desc:0 "该地区的领主最近与当地长老和宗教机构合作，在该地区赞助新建了一个规模不大的灌溉水库。这些灌溉水库遍布印度各地，为农业、饮用水、沐浴和仪式提供了可靠的水源。"
 RICE_funded_irrigation_tank_medium:0 "资助建造一座中型灌溉水库"
 RICE_funded_irrigation_tank_medium_desc:0 "$RICE_funded_irrigation_tank_small_desc$"
 RICE_irrigation_tank_constructed_medium:0 "最近修建的中型灌溉水库"
 RICE_irrigation_tank_constructed_medium_desc:0 "该地区的领主最近与当地长老和宗教机构合作，在该地区赞助新建了一个规模不小的灌溉水库。这些灌溉水库遍布印度各地，为农业、饮用水、沐浴和仪式提供了可靠的水源。"
 RICE_funded_irrigation_tank_large:0 "资助建造一座大型灌溉水库"
 RICE_funded_irrigation_tank_large_desc:0 "$RICE_funded_irrigation_tank_small_desc$"
 RICE_irrigation_tank_constructed_large:0 "最近修建的大型灌溉水库"
 RICE_irrigation_tank_constructed_large_desc:0 "该地区的领主最近与当地长老和宗教机构合作，在该地区赞助新建了一个大型的灌溉水库。这些灌溉水库遍布印度各地，为农业、饮用水、沐浴和仪式提供了可靠的水源。"
 RICE_funded_irrigation_tank_grand:0 "资助建造一座巨型灌溉水库"
 RICE_funded_irrigation_tank_grand_desc:0 "$RICE_funded_irrigation_tank_small_desc$"
 RICE_irrigation_tank_constructed_grand:0 "最近修建的巨型灌溉水库"
 RICE_irrigation_tank_constructed_grand_desc:0 "该地区的领主最近与当地长老和宗教机构合作，在该地区赞助新建了一个巨型的灌溉水库。这些灌溉水库遍布印度各地，为农业、饮用水、沐浴和仪式提供了可靠的水源。"
 RICE_sri_lanka_decline_of_anuradhapura:0 "阿㝹罗陀补罗的没落"
 RICE_sri_lanka_decline_of_anuradhapura_desc:0 "阿㝹罗陀补罗曾是$k_lanka$引以为豪的明珠，也曾是贸易、宗教和学术中心，但在公元九世纪末遭受珠利耶国入侵中遭到洗劫，导致经济、政治和文化的衰落，如今阿㝹罗陀补罗已成为一个空壳。"
 RICE_sri_lanka_polonnaruwa_capital_modifier:0 "布烂那卢婆王国"
 RICE_sri_lanka_polonnaruwa_capital_modifier_desc:0 "随着$k_lanka$的旧都——阿㝹罗陀补罗被摧毁，以及珠利耶入侵的结束，该岛的统治者们决定将首都迁至一个全新的易守难攻之地——布烂那卢婆。它现在是岛上的贸易、宗教和教育中心，就像曾经的阿㝹罗陀补罗那样。"
 RICE_sri_lanka_sri_pada_abrahamic_modifier:0 "亚当峰朝圣之旅（亚伯拉罕宗教组）"
 RICE_sri_lanka_sri_pada_buddhist_modifier:0 "圣足山朝圣之旅（佛教）"
 RICE_sri_lanka_sri_pada_hindu_modifier:0 "圣足山朝圣之旅（印度教）"
 RICE_sri_lanka_sri_pada_other_eastern_modifier:0 "圣足山朝圣之旅（东方宗教组）"
 RICE_sri_lanka_sri_pada_pagan_modifier:0 "圣足山朝圣之旅（其他信仰）"
 RICE_sri_lanka_ramasetu_inspiration_desc:0 "在前往连接印度和室利楞伽的陆桥——罗摩犀都朝圣时，这个角色被#italic 《罗摩衍那》#!中与罗摩犀都有关的故事所启发。他们尤其有感于"
 RICE_sri_lanka_ramasetu_inspiration_ravana_war:0 "被对抗十首魔王罗波那的大战所激励"
 RICE_sri_lanka_ramasetu_inspiration_ravana_war_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$圣洁的罗摩王子为了营救他的妻子悉多而对邪恶的魔王罗波那发动的大战的情节。"
 RICE_sri_lanka_ramasetu_inspiration_nala_nila:0 "被那拉和尼拉的故事所激励"
 RICE_sri_lanka_ramasetu_inspiration_nala_nila_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$一对神圣的孪生猴子，他们协助英雄罗摩建造了一座跨海大桥，使罗摩以前魔王罗波那救回悉多。"
 RICE_sri_lanka_ramasetu_inspiration_vibhishana:0 "被维毗沙那的故事所激励"
 RICE_sri_lanka_ramasetu_inspiration_vibhishana_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$维毗沙那，魔王罗波那的胞弟。虽然他是罗波那的亲戚，但与罗波那不同的是，祂正义而善良，并决定协助罗摩在大战中对抗罗波那；之后，祂被罗摩推举为罗波那的继任者。"
 RICE_sri_lanka_ramasetu_inspiration_sita:0 "被悉多的故事所激励"
 RICE_sri_lanka_ramasetu_inspiration_sita_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$悉多，她是英雄罗摩勇敢、善良且纯洁的伴侣。她也是理想中的女儿、妻子与母亲，被魔王罗波那绑架遭到囚禁，但最终被罗摩救出。"
 RICE_sri_lanka_ramasetu_inspiration_rama:0 "被罗摩的故事所激励"
 RICE_sri_lanka_ramasetu_inspiration_rama_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$罗摩，#italic 《罗摩衍那》#!名义上的主角，也是毗湿奴的第七化身。他经历了许多艰辛，特别是他的妻子悉多被魔王罗波那俘虏，尽管当然他最终救了她。他的美德、智慧和力量使他成为所有人的榜样。"
 RICE_sri_lanka_ramasetu_inspiration_hanuman:0 "被哈努曼的故事所激励"
 RICE_sri_lanka_ramasetu_inspiration_hanuman_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$哈努曼，一只神猴，是罗摩忠实的随从。祂神通广大，但一心向善，且忠诚于罗摩。"
 RICE_sri_lanka_new_center_of_buddhism:0 "新兴的佛教文化中心"
 RICE_sri_lanka_new_center_of_buddhism_desc:0 "随着[RICE_sri_lanka_struggle|E]的减少，这个地区及附近的其他地区，成为佛学教育与信仰的主要中心。"
 RICE_sri_lanka_upulvan:0 "崇拜优弗梵/毗楼末"
 RICE_sri_lanka_kataragama:0 "崇拜迦陀罗伽摩/牟卢犍"
 RICE_sri_lanka_saman:0 "崇拜沙漫"
 RICE_sri_lanka_pattini:0 "崇拜钵底尼/犍那祇·阿漫"
 RICE_sri_lanka_natha:0 "崇拜那他"
 RICE_sri_pada_different_faiths_respect:0 "不同信仰的圣足山"
 RICE_sri_pada_different_faiths_respect_desc:0 "该角色最近前往室利楞伽的圣足山（又称亚当峰）朝圣时，对所有不同信仰的人都来到这个圣地感到好奇。虽然有时气氛很紧张，但不同的群体一般都能接受彼此的存在，这让该角色思考不同信仰的人如何能够和睦相处。"
 RICE_sri_pada_avoided_meat:0 "圣足山斋戒"
 RICE_vedda_county_modifier:0 "与吠陀部族合作"
 RICE_vedda_county_modifier_desc:0 "这里的吠陀人与当地领主保持良好关系，双方贸易来往颇多，经常开展各种建设项目，并协助追踪和打击土匪、叛军和敌军。"
 RICE_sayabiga_easter_egg_modifier:0 "娑耶毗迦后裔"
 RICE_sayabiga_easter_egg_modifier_desc:0 "该角色血缘可以追溯至巽他群岛移民（阿拉伯人称其为#italic 娑耶毗迦#!），其先祖与印度其他民族一起，应萨珊王朝和早期穆斯林的邀请，定居在美索不达米亚。有些人后来被拜占庭人俘虏，并在安纳托利亚重新定居，因擅长军事后勤和使用水牛农耕而经常当地被雇佣为士兵"
 RICE_sri_lanka_rodi_noble_modifier:0 "犯下滔天罪行"
 RICE_sri_lanka_pattini_team_wins_ankeliya:0 "钵底尼队伍赢得安支梨耶"
 RICE_sri_lanka_pattini_team_wins_porakeliya:0 "钵底尼队伍赢得布罗瞿离耶"
 RICE_sri_lanka_milk_mothers_ceremony_modifier:0 "乳母仪式"
 RICE_sri_lanka_good_relationship_with_veddas:0 "与吠陀人的良好关系"
 RICE_sri_lanka_good_relationship_with_veddas_desc:0 "室利楞伽的原住民吠陀人目前与该地区的非吠陀领主保持着良好的关系。鼓励这些族群之间开展贸易和其他形式的合作，为所有人带来更多繁荣。"
 RICE_sri_lanka_pirit_ceremony:0 " 庇立得法会仪式"
 RICE_sri_lanka_respects_other_buddhist_sects:0 "尊重其他佛派"
 RICE_sri_lanka_respects_other_buddhist_sects_desc:0 "该角色尊重其他佛派，甚至是其他观点的人，或者至少其希望被当成这样的人。"
 RICE_sri_lanka_avoids_heretical_buddhist_sects:0 "只谈风月"
 RICE_sri_lanka_avoids_heretical_buddhist_sects_desc:0 "该角色是一个避免支持或与观点相左的佛教教派交往的人。"
 RICE_sri_lanka_gammaduva_ceremony_modifier:0 "揵摩竺婆仪式"
 RICE_sri_lanka_waterproof_jars:0 "伊朗和美索不达米亚的防水罐"
 RICE_sri_lanka_precious_gems:0 "来自阿富汗的珍贵宝石"
 RICE_sri_lanka_glazed_ceramics:0 "中原釉陶"
 RICE_sri_lanka_generous_to_villagers:0 "为村民慷慨解囊"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision:0 "万法归一"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision_tooltip:0 "三大[RICE_sri_lanka_monasteries|E]将合而为一"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision_desc:0 "[RICE_sri_lanka_struggle|E]争论已久分裂已久。如今在我们协助下曾经的主流[RICE_sri_lanka_monasteries|E]，无论是[mahavihara|E]、[abhayagiri|E]还是[jetavana|E]都必须恢复秩序，遵循正确的观点和做法，并改革岛上的[RICE_sri_lanka_sangha|E]。"
 RICE_sri_lanka_struggle_ending_uniter_pali_canon_doctrine_effect_tt:1 "具有[GetDoctrineType('rice_theravada_canon_doctrine').GetBaseName][doctrine|E]的佛教[faiths|E]会根据赞助的[RICE_sri_lanka_monastery|E]获得特殊的[doctrine|E]：\n$EFFECT_LIST_BULLET$[mahavihara_i|E][mahavihara|E]获得：[GetDoctrineType('rice_theravada_canon_mahavihara_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[abhayagiri_i|E][abhayagiri|E]获得：[GetDoctrineType('rice_theravada_canon_abhayagiri_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[jetavana_i|E][jetavana|E]获得：[GetDoctrineType('rice_theravada_canon_jetavana_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_uniter_phase_doctrine_effect_tt:1 "具有[GetDoctrineType('rice_theravada_canon_doctrine').GetBaseName][doctrine|E]的佛教[faiths|E]会获得一种特殊的[doctrine|E]，这取决于[struggle|E]以何种[struggle_phase|E]结束：\n$EFFECT_LIST_BULLET$[struggle_phase_sri_lanka_degeneration_simple|E]获得：[GetDoctrineType('rice_theravada_degeneration_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[struggle_phase_sri_lanka_accumulation_simple|E]获得：[GetDoctrineType('rice_theravada_accumulation_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[struggle_phase_sri_lanka_purification_simple|E]获得：[GetDoctrineType('rice_theravada_purification_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_uniter_relic_effect_tt:0 "你将从[GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName][activity|E]中选择三个主要遗物之一，使其比其他遗物更受尊崇，从而在进行该[activity|E]时加成更多。"
 RICE_sri_lanka_struggle_ending_unite_decision_mahavihara_tt:0 "[mahavihara_i|E][mahavihara|E][RICE_sri_lanka_prominence|E]至少达到#V 900#!"
 RICE_sri_lanka_struggle_ending_unite_decision_abhayagiri_tt:0 "[abhayagiri_i|E][abhayagiri|E][RICE_sri_lanka_prominence|E]至少达到#V 900#!"
 RICE_sri_lanka_struggle_ending_unite_decision_jetavana_tt:0 "[jetavana_i|E][jetavana|E][RICE_sri_lanka_prominence|E]至少达到#V 900#!"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision_confirm:0 "$RICE_sri_lanka_struggle$"
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision:0 "佛法寂灭"
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision_tooltip:0 "岛上的佛法寺庙将被剥夺一切权力和影响力"
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision_desc:0 "[RICE_sri_lanka_struggle|E]？邪门歪理罢了！正是因为这些所谓的[RICE_sri_lanka_monasteries|E]，尤其是[mahavihara|E]、[abhayagiri|E]和[jetavana|E]这三个，争论不休地助长了纷争和混乱，使[ROOT.Char.GetDynasty.GetName]宗族难以在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]建立统治，如今我们必须革除这些异端邪说在这个岛上的影响和势力！"
 RICE_sri_lanka_struggle_ending_uniter_destroyer_doctrine_effect:1 "有[GetDoctrineType('rice_theravada_canon_doctrine').GetBaseName][doctrine|E]的佛教[faiths|E]获得特殊的[GetDoctrineType('rice_theravada_destruction_of_sangha_doctrine').GetBaseName][doctrine|E]"
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision_confirm:0 "摧毁$RICE_sri_lanka_struggle$之争"
 RICE_sri_lanka_struggle_ending_destroy_decision_mahavihara_tt:0 "[mahavihara_i|E][mahavihara|E][RICE_sri_lanka_prominence|E]低于#V 100#!"
 RICE_sri_lanka_struggle_ending_destroy_decision_abhayagiri_tt:0 "[abhayagiri_i|E][abhayagiri|E][RICE_sri_lanka_prominence|E]低于#V 100#!"
 RICE_sri_lanka_struggle_ending_destroy_decision_jetavana_tt:0 "[jetavana_i|E][jetavana|E][RICE_sri_lanka_prominence|E]低于#V 100#!"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision:0 "复兴[GetPlayer.GetFaith.GetAdjectiveNoTooltip]僧伽"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision_tooltip:0 "建立新的佛教圣地时候到了！"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision_desc:0 "无论是[mahavihara|E]、[abhayagiri|E]还是[jetavana|E]，三大[RICE_sri_lanka_monasteries|E]都在进行无用的[RICE_sri_lanka_struggle|E]。显然，[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]注定不会成为佛教的中心。相反，[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]应该引领佛教[RICE_sri_lanka_sangha|E]的复兴。"
 RICE_sri_lanka_struggle_ending_everywhere_unlock_effect:1 "以前锁定在[GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName]中的与[RICE_sri_lanka_struggle|E]相关的机制，现在无论位于何地，任何佛教[faiths|E]的[rulers|E]都可以使用[GetDoctrineType('rice_theravada_canon_doctrine').GetBaseName][doctrine|E]"
 RICE_sri_lanka_struggle_ending_county_bonus_effect:1 "[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetName]的每个[county|E]获得[GetModifier('RICE_sri_lanka_new_center_of_buddhism').GetNameWithTooltip][county_modifier|E]"
 RICE_sri_lanka_struggle_ending_uniter_outsider_doctrine_effect_tt:1 "拥有[GetDoctrineType('rice_theravada_canon_doctrine').GetBaseName][doctrine|E]的佛教[faiths|E]获得[GetDoctrineType('rice_theravada_outsider_doctrine').GetBaseName][doctrine|E]"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision_confirm:0 "重振$RICE_sri_lanka_struggle$"
 RICE_sri_lanka_not_in_sri_lanka_req:0 "你在[GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName]#N 没有#![county|E]"
 RICE_sri_lanka_struggle_not_involved:0 "你在[RICE_sri_lanka_struggle|E]中#N 不是#![struggle_involved|E]"
 RICE_sri_lanka_struggle_no_kings_req:0 "在[RICE_sri_lanka_struggle|E]中[struggle_interloper|E]或[struggle_involved|E]的其他[rulers|E]都不[king|E]或[emperor|E][rank|E]"
 RICE_sri_lanka_choose_monastic_sect:0 "与室利楞伽大寺结盟"
 RICE_sri_lanka_choose_monastic_sect_united:0 "选择[GetPlayer.Custom('RICE_sri_lanka_unified_monastery')]"
 RICE_sri_lanka_choose_monastic_sect_tooltip:0 "在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中选择正式支持三大[RICE_sri_lanka_monasteries|E]之一"
 RICE_sri_lanka_choose_monastic_sect_desc:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中的[RICE_sri_lanka_sangha|E]隶属于许多不同寺院。其中三个寺院最为重要，分别是[mahavihara|E]、[abhayagiri|E]和[jetavana|E]，它们拥有很大的世俗和宗教权力。如果我公开支持其中之一，从而提高其[RICE_sri_lanka_prominence|E]，这对双方都有利。"
 RICE_sri_lanka_choose_monastic_sect_united_desc:0 "在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中的[RICE_sri_lanka_sangha|E]由[GetPlayer.Custom('RICE_sri_lanka_unified_monastery_game_concept')]寺庙主导，该寺拥有很大的世俗和宗教权力。如果我公开支持它，从而提高它的[RICE_sri_lanka_prominence|E]，这对双方都有利。"
 RICE_sri_lanka_choose_monastic_sect_confirm:0 "是时候布施一座佛寺了"
 RICE_sri_lanka_choose_monastic_sect_effect_tooltip_1:0 "将在[GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )]、[GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )]和[GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )]之间选择其一[traits|E]"
 RICE_sri_lanka_choose_monastic_sect_effect_tooltip_2:0 "你将获得[decisions|E]以支持所选择的[RICE_sri_lanka_monastery|E]，并提高其[RICE_sri_lanka_prominence|E]，这是解决[RICE_sri_lanka_struggle|E]中的冲突至关重要的一步"
 RICE_sri_lanka_choose_monastic_sect_context_tooltip:0 "#emphasis 历史背景：#!在古典晚期和中世纪时期，斯里兰卡的#italic 僧伽#!由三大派主导：大寺派、无畏山派和柢陀林派。几个世纪以来，这三个佛派一直在争夺王室和其他精英的赞助，直到1165年，波罗迦罗摩巴忽一世国王支持的宗教改革，其他佛派在大寺派寺的领导下联合起来。"
 RICE_sri_lanka_change_monastic_sect:0 "与另一个佛派结盟"
