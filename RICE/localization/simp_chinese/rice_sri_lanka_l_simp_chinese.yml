 activity_RICE_sri_lanka_ramasetu_pilgrimage:0 "罗摩桥朝圣"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_desc:0 "罗摩桥（又称亚当桥），是连接[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]和印度的一条细长陆地。它是一些印度教派信徒的朝圣地，与伟大的史诗#italic 《罗摩衍那》#!有关。"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_selection_tooltip: "在[GetTitleByKey('c_madurai').GetNameNoTier]前往罗摩桥[local_pilgrimage|E]\n\n$activity_RICE_sri_lanka_ramasetu_pilgrimage_context_tooltip$"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!罗摩桥（在西方称为亚当桥），如今是斯里兰卡西北部沿海的一系列浅滩和岛屿。历史上，它曾是一座陆桥，在15世纪暴风不断加深了水道之前，行人甚至可以步行其上。寺院纪录显示罗摩桥原本完全在海平面以上，直到公元1480年遭到气旋破坏，变成了现在的模样。罗摩桥一直与古梵文史诗#italic 《罗摩衍那》#!中的一个情节有关，当时罗摩王子为救被魔拉伐掳走的爱妻悉多，得到神猴哈奴曼帮助，由猴军花了5天筑出罗摩桥，终得深入斯里兰卡与魔王拉伐大战救回爱妻。"
