 sri_lanka.0100.t:0 "$RICEmisc.0011.t$"
 sri_lanka.0100.desc:0 "我现在前往[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]，瞻仰神圣的"
 sri_lanka.0100.desc.bodhi:0 "#bold 菩提树#!。"
 sri_lanka.0100.desc.tooth:0 "佛祖的#bold 佛牙舍利#!"
 sri_lanka.0100.desc.dharmadhatu:0 "埋在这里的#bold 赞法界颂#!"
 sri_lanka.0100.desc.conclusion:0 "\n\n来自[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]各地的[buddhism.GetAdjective]们来到这个神圣的地方，瞻仰这颗舍利，以此来纪念佛、法、僧三宝。作为一个[faith.GetAdherentName]，这无疑将是一次美妙的精神体验。"
 sri_lanka.0100.a:0 "愿佛门三宝保护我们一路平安。"
 sri_lanka.0101.t:0 "到达[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 sri_lanka.0101.desc:0 "终于，我来到了[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]，瞻仰神圣的"
 sri_lanka.0101.desc.bodhi:0 "菩提树。\n\n这棵树是很多年前种下的，当时伟大的阿育王的女儿僧伽蜜多来到[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]向当地人传播佛法。她带来了佛祖成道时所坐的那棵树的树枝，这就是这里菩提树的由来。\n\n从那时起，许多人都来参加沐浴、护理和供奉菩提树的仪式，以纪念这棵树。我现在在这里也渴望做同样的事情"
 sri_lanka.0101.desc.tooth:0 "佛牙\n\n佛陀圆寂荼毗后，阿难等弟子从灰尽中得到佛陀舍利，并将其交由八国国王保管。当佛牙舍利所在的寺庙受到战争威胁时，保护它的僧侣将它带到了[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]，并一直保存至今。\n\n岛上最著名的庆典活动之一就是佛牙游行。这是纪念和瞻仰佛陀的重要时刻，我将观摩游行，以纪念和瞻仰佛陀。"
 sri_lanka.0101.desc.dharmadhatu:0 "《赞法界颂》\n\n这部阐述各种神学和哲学的宗教论著是多年前从印度带到[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的。从那时起，岛上的佛教徒们就开始推崇这本博大精深、鼓舞人心的经文，因为许多人相信它可以了解心的本性，并随后将其供奉在一座佛塔中。\n\n如今，人们定期为《赞法界颂》举行一个重要仪式——一个以该其游行为中心的节日。我希望参加这一活动，以获得它的庇佑。"
 sri_lanka.0101.a:0 "让我们先休息一下，做好准备。"
 sri_lanka.0102.t.bodhi:0 "菩提树"
 sri_lanka.0102.t.tooth:0 "佛牙舍利"
 sri_lanka.0102.t.dharmadhatu:0 "《赞法界颂》"
 sri_lanka.0102.desc.bodhi:0 "[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中的佛教寺庙通常都有菩提树，而#italic 菩提法会#!供奉菩提树的仪式也很常见。\n\n然而，[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]中的这棵树可不是普通的树。它是最初的菩提树，高耸入云，其古老、庄严、美丽，周围围绕着许多虔诚的信徒。\n\n和聚集在这里的其他信徒一样，我参加了各种仪式，从祈祷到绕树一周，再到留下椰子油灯和如鲜花、水果、香、用藏红花水洗过的钱等其他吉祥物。我还会在树枝上挂上彩旗，希望自己的愿望能够实现。"
 sri_lanka.0102.desc.tooth:0 "佛牙舍利巡游是一场盛大而华丽的盛典，我在这里目睹了全程。\n\n僧侣们秘密砍伐一棵年幼波罗蜜树为开始。树干被一劈为四，分别安放在附近四位守护神[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的庙宇中：那他、毗湿奴、卡达拉加玛和女神钵底尼。\n\n之后的五天里，这些寺庙会举行各种仪式，音乐、诵经和击鼓声此起彼伏。完成这些仪式后，游行就可以开始了。"
 sri_lanka.0102.desc.dharmadhatu:0 "在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]各地，将圣物埋葬或封闭在[buddhism.GetAdjective]地点是一种重要的宗教习俗。人们对那些被认为具有神圣物品进行供奉，以提醒我们注意佛陀及其教义。\n\n《赞法界颂》就是其中一个比较受人尊敬的例子。它被放置在一座特殊的房子里，旁边是一座巨大的舍利塔，这是一座令人印象深刻的石头建筑，周围长满了草和树。每天都有许许多多的信徒，在佛塔周围绕行。\n\n无论如何，我都要在这里参加《赞法界颂》祭祀仪式。"
 sri_lanka.0102.a.bodhi:0 "不过，在菩提树下沐浴佛道是最重要的仪式。"
 sri_lanka.0102.a.tooth:0 "我等不及想看到它了！"
 sri_lanka.0102.a.dharmadhatu:0 "希望我们能尽快开始。"
 sri_lanka.0103.t.bodhi:0 "$sri_lanka.0102.t.bodhi$"
 sri_lanka.0103.t.tooth:0 "$sri_lanka.0102.t.tooth$"
 sri_lanka.0103.t.dharmadhatu:0 "$sri_lanka.0102.t.dharmadhatu$"
 sri_lanka.0103.desc.bodhi:0 "菩提树下有一群僧侣和热心的俗家弟子，他们每天为菩提树浇水、打扫，以积累众多的功德。不过，这与我和其他信徒正在进行的沐浴仪式不同。\n\n我们用香水洗树，就像清洗佛祖本人一样。毕竟，我们并不崇拜树本身，而是将其作为佛陀的象征来敬奉。\n\n仪式结束后，我们再次绕树一周，念诵各种祷文。我决定背诵一段偈文：\n\n#italic 敬礼菩提树！\n世尊坐此处，\n降服诸魔军，\n证得一切智。\n礼敬大菩提，\n世尊所曾赞；\n敬礼菩提王！\n顶礼最胜尊。#!"
 sri_lanka.0103.desc.tooth:0 "最后，到了游行佛牙舍利的时候了。大象引领着游行队伍，所有人都能看到放置在其身上的圣物匣。大象后面跟着各式各样的艺人，有歌手、杂技演员、鼓手、舞者和旗手，真是一场精彩的表演和视觉盛宴！\n\n其余四座寺庙的游行队伍汇聚在一起，加入主游行队伍，每支队伍都带着各自寺庙的徽记，他们的舞蹈反映了其各自的神祇。\n\n无论如何，游行的最后都要在附近的河里举行一个泼水仪式。在这里，一位被选中的僧侣首领会用剑划开河水，将纯净和不纯净的水分开。"
 sri_lanka.0103.desc.dharmadhatu:0 "诵经声响彻云霄，人和大象齐头并进，游行和朝拜开始了。\n\n我们一边祈祷，一边随行法身宝座，以提醒佛、法、僧三宝的重要性。我一边供奉一边反思法身慧命。"
 sri_lanka.0103.a.bodhi:0 "真的，好像佛陀就在这里！"
 sri_lanka.0103.a.tooth:0 "愿所有人都能得到佛陀的保佑！"
 sri_lanka.0103.a.dharmadhatu:0 "毫无疑问，这是一个令人振奋的仪式！"
 sri_lanka.0104.t:0 "是时候回家了"
 sri_lanka.0104.desc:0 "前往[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]进行遗物瞻仰的活动结束了。多么快乐，多么充实，多么平静，多么满足！\n\n然而，正如佛陀所教导的，万事万物都是无常的，包括这次旅行。是时候回家反思一下发生的一切了。"
 sri_lanka.0104.a:0 "总之，我很高兴能抽出时间来做这件事。"
