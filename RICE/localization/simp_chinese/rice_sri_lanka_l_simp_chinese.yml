 sri_lanka.0014.t:0 "奖励[budal.GetTitledFirstNameNoTooltip]"
 sri_lanka.0014.desc.not_vijayabahu_intro:0 "多年前，[vijayabahu.GetTitledFirstName]还是一个年幼的王子，珠利耶入侵者和当地军阀时刻威胁着[vijayabahu.GetHerHis]的安全。在那些艰苦岁月里，英勇的[budal.GetTitledFirstName]一直在保护[vijayabahu.GetHerHim]。\n\n可谓是没有[budal.GetFirstNamePossessiveNoTooltip]就没有后来统一[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的[vijayabahu.GetTitledFirstName]"
 sri_lanka.0014.desc.not_budal_reward:0 "[budal.GetHerHim]和[budal.GetHerHis]的后代永享有非凡的法律和政治特权。\n\n这些特权已经刻在一块铜板上，并正式赐予[budal.GetFirstNameNoTooltip]，任何人不得质疑。"
 sri_lanka.0014.desc.vijayabahu:0 "多年前，当我还是一个年幼的王子，珠利耶入侵者和当地军阀时刻威胁着我的安全。在那些艰苦岁月里，英勇的[budal.GetTitledFirstName]一直在保护我。\n\n没有[budal.GetFirstNamePossessiveNoTooltip]的帮助，我不可能活到统一[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的那一天。而今为表我对[budal.GetFirstNameNoTooltip]的深厚感情，也为了表彰[budal.GetHerHis]的巨大贡献，我授予了$sri_lanka.0014.desc.not_budal_reward$。"
 sri_lanka.0014.desc.vijayabahu_equivalent:0 "$sri_lanka.0014.desc.not_vijayabahu_intro$\n虽然我不是[vijayabahu.GetFirstNameNoTooltip]，但我仍想感谢[budal.GetFirstNamePossessiveNoTooltip]为这片土地带来和平与稳定的功绩。因此，我赐予$sri_lanka.0014.desc.not_budal_reward$作为嘉奖。"
 sri_lanka.0014.desc.budal:0 "多年前，[vijayabahu.GetTitledFirstName]还是一个年幼的王子，[vijayabahu.GetHerHis]与我前途渺茫，珠利耶入侵者和当地军阀一直无休止地威胁着[vijayabahu.GetHerHis]的安全。在那些艰苦岁月里，我竭尽全力保护尊贵的[vijayabahu.GetHerHim]不受伤害。\n\n而今一份御令下来，表彰我为这片土地带来和平与稳定，[vijayabahu_equivalent.GetTitledFirstName]赐予我和我的后代一份永久的非凡的法律和政治特权。\n\n这些特权已经刻在一块铜板上，任何人不得质疑。"
 sri_lanka.0014.desc.other:0 "$sri_lanka.0014.desc.not_vijayabahu_intro$为了表彰[budal.GetFirstNamePossessiveNoTooltip]的伟大成就，也许是出于一种感激之情，[vijayabahu_equivalent.GetTitledFirstNameNoTooltip]授予了$sri_lanka.0014.desc.not_budal_reward$奖赏。"
 sri_lanka.0014.a.not_budal:0 "伟大的[budal.GetWomanMan]应该为伟大的事迹而获得丰厚的回报。"
 sri_lanka.0014.a.budal:0 "我有幸能获得如此丰厚的奖励！"
 sri_lanka.0015.t:0 "灌溉水库"
 sri_lanka.0015.desc:0 "灌溉水库是[GetGeographicalRegion('world_india').GetName]精心设计的人工水库系统，数百年来一直是可靠的水源。\n\n我希望与当地宗教机构和社区中其他知名人士合作，建造一个这样的灌溉水库。它将满足当地人的需求，包括农业、沐浴、宗教仪式等。当然，灌溉水库上还将装饰有歌颂[ROOT.Char.GetFaith.HighGodName]和包括我在内的资助人的艺术作品。\n\n现在，这个灌溉水库应该得有多大？"
 sri_lanka.0015.a:0 "小型"
 sri_lanka.0015.b:0 "中型"
 sri_lanka.0015.c:0 "大型"
 sri_lanka.0015.d:0 "巨型"
 sri_lanka.0016.t:0 "新首都"
 sri_lanka.0016.desc.vijayabahu:0 "很难想象，多年前我还是个孩子时，是如何在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的荒野中历尽艰辛，躲避可怕的珠利耶大军。现在，我已经实现了我毕生的目标，那就是挣脱珠利耶的枷锁，平定当地军阀，在这个岛上建立一个新的王国。"
 sri_lanka.0016.desc.not_vijayabahu:0 "很难想象，[GetTitleByKey('b_anuradhapura').GetNameNoTier]落入珠利耶大军之手后，地方军阀和珠利耶国王争权夺利的混乱局面已经结束。我们在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]建立了一个由我统治的新王国。"
 sri_lanka.0016.desc:0 "\n\n唉，[GetTitleByKey('b_anuradhapura').GetNameNoTier]的故都大部分已沦为废墟。虽然有人希望我恢复其往昔的辉煌，但它已不再是昔日的宏伟城市。即使是这样，我也担心我们在南印度的敌人或叛乱的地方军阀将来会发动攻击。我需要一个可以保卫的首都。\n\n[GetTitleByKey('b_polonnaruwa').GetNameNoTier]将因此成为更好的首都。珠利耶王朝将其发展成为岛上新的经济、文化和政治中心，而且它的防御能力更强。从现在起，我们的未来就取决于[GetTitleByKey('b_polonnaruwa').GetNameNoTierNoTooltip]！"
 sri_lanka.0016.a:0 "新首都应有新名称，就叫#bold 毗阇耶罗阇补罗#!吧！"
 sri_lanka.0016.b:0 "这座城市和名字同它本身一样出色。"
 sri_lanka.0016.c:0 "这是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]的新一天。"
 sri_lanka.0016.d:0 "$sri_lanka.0016.c$"
 sri_lanka.0017.t:0 "[county.GetNameNoTierNoTooltip]的[vedda.GetCollectiveNounNoTooltip]"
 sri_lanka.0017.desc:0 "[vedda.GetCollectiveNoun]居住在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]已经很久了，也许比其他民族都早。每隔一段时间，[vedda.GetCollectiveNounNoTooltip]就会出于各种原因协助像我这样的强大统治者。\n\n最近，我与[county.GetNameNoTier][courtier.GetFirstName]的一位[vedda.GetName]领袖建立了关系。如果我通过[courtier.GetHerHim]努力改善与当地[vedda.GetCollectiveNounNoTooltip]的关系，我的领地就会繁荣昌盛，因为他们会和我的人民开展贸易、合作建设项目，甚至协助我打击胆敢进攻我领地的土匪或叛军。"
 sri_lanka.0017.a:0 "让我们与[county.GetNameNoTierNoTooltip]的[vedda.GetCollectiveNounNoTooltip]合作！"
 sri_lanka.0017.b:0 "希望[courtier.GetFirstNameNoTooltip]也可以留在我的宫廷里。"
 sri_lanka.0017.b.tooltip:0 "如果选择此选项，[county_modifier|E]将持续更长时间"
 sri_lanka.0017.c:0 "我没时间陪这些野蛮的怪人。"
 sri_lanka.0018.t:0 "xxxxx"
 sri_lanka.0018.desc:0 "xxxxx"
 sri_lanka.0018.a:0 "xxxxx"
 sri_lanka.0019.t:0 "吸引[ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetFaith.GetAdjectiveNoTooltip]僧侣"
 sri_lanka.0019.desc:0 "我积极尽自己的一份力量支持[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的[ROOT.Char.GetFaith.GetReligion.GetAdjective]#italic 僧伽#!。然而，岛上[ROOT.Char.GetCulture.GetName][ROOT.Char.GetFaith.GetAdjective]僧侣的数量相对较少，这阻碍了我与岛上宗教机构的关系发展，尤其是我赞助的[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]。\n\n我正在与[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]合作，在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中培养更多的[ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetFaith.GetAdjectiveNoTooltip]僧侣。无论我们是为居住在这里并希望成为[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]僧侣的[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]僧侣授戒，还是从国外引进此类僧侣，或者两者兼而有之。这样，希望我们能更多地参与岛上的#italic 僧伽#!。\n\n在这些新僧侣融入现有群体的过程中，起初无疑会出现一些紧张关系，我相信，从长远来看，这只会加强[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]中[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]的基础。"
 sri_lanka.0019.a:0 "愿#italic 僧伽#!不断发展壮大。"
 sri_lanka.0020.t:0 "三大派"
 sri_lanka.0020.desc.sri_lankan:0 "现在是时候让我支持在[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中争夺影响力的主要[buddhism.GetAdjective]佛派之一了，这将产生甚远政治影响，我需要谨慎选择。"
 sri_lanka.0020.desc.non_sri_lankan:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]是强大的[buddhism.GetAdjective]佛派的所在地，不管我的个人观点如何，支持其中一个佛派可能是明智之举。"
 sri_lanka.0020.desc:0 "\n#bold 大寺派#!是最古老守旧的佛派，他们拒绝接受在他们看来非正统思想；#bold 无畏山派#!大乘和金刚乘融合在一起，以创新的方式处理[theravada.GetNameNoTooltip]；#bold 柢陀林派#!是较为年轻的佛派，对大乘和金刚乘兼容并蓄。"
 sri_lanka.0020.a:0 "支持大寺派"
 sri_lanka.0020.a.tooltip:0 "从今开始，你所做的各种[decisions|E]以及行为，都会增加或减少[RICE_sri_lanka_s|E][RICE_sri_lanka_monasteries|E][RICE_sri_lanka_prominence|E]，#italic 尤其是#![mahavihara_i|E][mahavihara|E][RICE_sri_lanka_prominence|E]"
 sri_lanka.0020.b:0 "支持无畏山派"
 sri_lanka.0020.b.tooltip:0 "从今开始，你所做的各种[decisions|E]以及行为，都会增加或减少[RICE_sri_lanka_s|E][RICE_sri_lanka_monasteries|E][RICE_sri_lanka_prominence|E]，#italic 尤其是#![abhayagiri_i|E][abhayagiri|E][RICE_sri_lanka_prominence|E]"
 sri_lanka.0020.c:0 "支持柢陀林派"
 sri_lanka.0020.c.tooltip:0 "从今开始，你所做的各种[decisions|E]以及行为，都会增加或减少[RICE_sri_lanka_s|E][RICE_sri_lanka_monasteries|E][RICE_sri_lanka_prominence|E]，#italic 尤其是#![jetavana_i|E][jetavana|E][RICE_sri_lanka_prominence|E]"
 sri_lanka.0020.non_sri_lankan.tooltip:0 "由于你不是[RICE_sri_lanka_struggle|E][struggle_involved|E]，因此就算你支持[RICE_sri_lanka_monastery|E]，也无法解锁[RICE_sri_lanka_struggle|E]的所有机制。"
 sri_lanka.0021.t:0 "三大派"
 sri_lanka.0021.desc:0 "由于各种原因，我意识到我应该支持[GetPlayer.Custom('RICE_sri_lanka_sangha_location')]中的另一个佛派。我不认为我目前支持的[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]有能力领导[RICE_sri_lanka_sangha|E]，而且我越来越怀疑他们对[buddhism.GetName]的解释是否正确……"
 sri_lanka.0021.a:0 "支持大寺派"
 sri_lanka.0021.mahavihara.tooltip:0 "[mahavihara|E]失去[mahavihara_i|E][EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0][RICE_sri_lanka_prominence|E]。"
 sri_lanka.0021.b:0 "支持无畏山派"
 sri_lanka.0021.abhayagiri.tooltip:0 "[abhayagiri|E]失去[abhayagiri_i|E][EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0][RICE_sri_lanka_prominence|E]。"
 sri_lanka.0021.c:0 "支持柢陀林派"
 sri_lanka.0021.jetavana.tooltip:0 "[jetavana|E]失去[jetavana_i|E][EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0][RICE_sri_lanka_prominence|E]。"
