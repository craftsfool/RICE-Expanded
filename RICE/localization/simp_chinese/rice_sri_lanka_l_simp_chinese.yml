 RICE_sri_lanka_aspiration_vijayabahu_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_lanka').GetNameNoTier]的[king|E]\n$EFFECT_LIST_BULLET$执行$RICE_sri_lanka_polonnaruwa_capital$[decision|E]\n$EFFECT_LIST_BULLET$保持佛教信仰\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得#V 500人#!的[GetMaA('RICE_velakkara').GetName][special_troops|E]\n$EFFECT_LIST_BULLET$每个位于[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的[county|E]获得@development_icon!#V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#![development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$至少使用一次$RICE_india_irrigation_tank_decision$[decision|E]（完成奖励：@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]）\n$EFFECT_LIST_BULLET$至少使用一次$RICE_sri_lanka_support_monastery$[decision|E]（完成奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）"
 RICE_sri_lanka_historical_aspiration_action_vijayabahu: "#italic 数十年来，僧伽罗军阀和珠利耶军队在$k_lanka$争斗不休，你希望恢复秩序，重获和平，并建立一个新王国。#!$RICE_sri_lanka_aspiration_vijayabahu_desc$"
 RICE_sri_lanka_historical_aspiration_modifier_desc_vijayabahu: "[GetModifier('RICE_sri_lanka_aspiration_rule_sri_lanka').GetNameWithTooltip]"
 RICE_sri_lanka_aspiration_rule_sri_lanka: "[RICE_aspiration|E]：建立布烂那卢婆王国"
 RICE_sri_lanka_aspiration_rule_sri_lanka_desc: "#italic 数十年来，僧伽罗军阀和珠利耶军队在$k_lanka$争斗不休，毗阇耶婆呼希望恢复秩序，重获和平，并建立一个新王国。#!$RICE_sri_lanka_aspiration_vijayabahu_desc$\n\n"
 sri_lanka.0001.vijayabahu.tooltip:0 "#bold 毗阇耶婆呼的[RICE_aspiration|E]：建立布烂那卢婆王国#!$RICE_sri_lanka_aspiration_vijayabahu_desc$\n"
 RICE_sri_lanka_ender_name: "重修正道"
 RICE_sri_lanka_ender_desc: "佛陀圆寂，入灭百年，佛法二分，$k_lanka$既分为三派，诸僧伽争辩不已，惟[struggle_ender.GetFirstName]所至，赋改大寺，革易其学，复建佛门正统。"
 RICE_sri_lanka_legend_chapter_opening_struggle: "自佛陀入灭，$k_lanka$分诸寺，各寺竞称皆乃佛门正统。佛统分裂，人心渐离，$k_lanka$日衰，至[ROOT.Legend.GetProtagonist.GetNameNoTooltip]出。"
 RICE_sri_lanka_legend_chapter_motivation_struggle: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]叹曰：“$k_lanka$僧侣不精典籍，不识大字，乃至道德不足，无以开导岛人，亦无以教化异国之从佛者。”"
 RICE_sri_lanka_legend_chapter_famous_deed_generic: "虽[ROOT.Legend.GetProtagonist.GetSheHe]非最通于佛者，然亦知其不可久也。"
 RICE_sri_lanka_legend_chapter_extra_deed_struggle: "[ROOT.Legend.GetProtagonist.GetHerHis]以权印，善舞，仰息之间使众僧集于$k_lanka$，其[GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip]更来自于佛国内外，志革故鼎新。(故)乃以灭忝列、弘正信、纳长策、革尸位、赏有德，终得佛之大者。"
 RICE_sri_lanka_legend_chapter_conclusion_ended_struggle: "佛陀尝与众生说法，曰“万物无常”。然广大佛法亦有衰退之期，与世寂灭。而今佛法无圆，皆因[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]之无量功德。神州大地，众皆奉其为佛陀转世，可证三宝。"
