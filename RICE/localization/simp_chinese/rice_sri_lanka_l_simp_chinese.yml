 sri_lanka.0001.t:0 "$RICE_sri_lanka_struggle$"
 sri_lanka.0001.desc:0 "自阿育王时代起，[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]就一直以[buddhism.GetAdjective]圣岛而闻名于世，受到佛教徒的尊崇。然而，由于几个世纪以来岛上的三大佛派[mahavihara|E]、[abhayagiri|E]和[jetavana|E]之间相互争夺信徒、地位、土地和赞助，岛上的#italic 僧伽#!一直处于分裂状态。\n\n"
 sri_lanka.0001.desc.buddhist:0 "在[ROOT.Char.GetHouse.GetNameNoTooltip]家族的统治下，我们将辨别真假，保护正道并惩治异端，甚至总有一天会团结[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的#italic 僧伽#!！"
 sri_lanka.0001.desc.non_buddhist:0 "我们这些非佛教徒经常与#italic 僧伽#!合作，甚至为他们提供赞助。我们能否帮助他们团结起来，更好地为[ROOT.Char.GetHouse.GetNameNoTooltip]家族服务，还是说，我们将摆脱那些麻烦的僧侣？"
 sri_lanka.0001.a:0 "芸芸众生的#italic 业#!，如今交织在一起……"
 sri_lanka.0001.b:0 "这座岛屿的命运将会如何？"
