 RICE_india_land_grant_decision:0 "向寺庙和僧伽蓝赠地"
 RICE_india_land_grant_decision_tooltip:0 "向$buddhism_religion_adj$、$hinduism_religion_adj$或$jainism_religion_adj$[RICE_grants|E]"
 RICE_india_land_grant_decision_desc:0 "我希望将领土上的一些土地赠与[GetGeographicalRegion('world_india').GetName]的当地寺庙和僧院，它们在开垦教化未开发的领土上发挥着重要作用。从现在起，我正式[RICE_land_grant|E]，将这片土地及其收益将归他们所有。"
 RICE_india_land_grant_decision_confirm:0 "准备赠土！"
 RICE_india_land_grant_decision_effect_tooltip_1:0 "你将向你[domain|E]内的[religion|E][RICE_grant|E]"
 RICE_india_land_grant_decision_effect_tooltip_2:0 "你直辖的每个[county|E]都会获得一个[county_modifier|E]，减少[tax|E]，但增加[development_growth|E]，且[counties|E]其中如果拥有一个[church_holding|E]则效果更强。"
 RICE_india_land_grant_decision_effect_tooltip_3:0 "如果你信奉佛教[faith|E]，[modifier|E]给予额外的[county_opinion|E]；如果你不信奉相同的[religion|E]，则会给予额外的[development_growth|E]"
 RICE_india_land_grant_decision_effect_tooltip_4:0 "你的[counties|E]有极小概率皈依你随机选择的[faith|E]中的[religion|E]"
 RICE_india_land_grant_decision_effect_tooltip_5:0 "你最多将获得#V 300#!的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]，具体取决于有多少[counties|E]受到影响，以及有多少[church_holdings|E]"
 RICE_india_land_grant_decision_context_tooltip:0 "#emphasis 历史背景：#!在古典晚期和中世纪时期，向宗教机构赠予土地是印度历史上经常出现的一种重要做法。这些土地可以是个别地块，甚至是整个村庄。统治者会资助许多不同的教派，并且这些赠地被视为一种工具，可以将统治者和宗教机构的影响力扩展到以前控制较弱的边疆地区。"
 RICE_india_land_grant_type:0 "选择授予土地的对象"
 RICE_india_land_grant_type_gui:0 "选择谁将接受[RICE_land_grant|E]"
