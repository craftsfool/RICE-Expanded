 sri_lanka.0005.t:0 "团结[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]的僧伽"
 sri_lanka.0005.desc.intro:0 "几个世纪以来，[buddhism.GetAdjective]僧伽或是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的僧侣群体已因三大寺院的纷争分裂成：大寺派、无畏山派和柢陀林派。\n\n虽然三座寺院有许多共同的信仰，如信奉[GetDoctrineType('rice_theravada_canon_doctrine').GetBaseName]，但他们在教义、仪式等方面也各不相同。佛教和非佛教的上层人士则火上浇油，偏袒某个教派，将斗争变成了政治问题。\n"
 sri_lanka.0005.desc:0 "$sri_lanka.0005.desc.intro$最近，[sri_lanka_struggle_ender.GetTitledFirstName]利用[sri_lanka_struggle_ender.GetHerHis]的权力召集了一次宗教会议，以彻底解决这一问题，并将岛上的僧伽们统一在#bold [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]#!麾下！现在，所有僧侣都必须遵守[sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]的教义，否则就会被斥为异端。#bold [GetPlayer.Custom('RICE_sri_lanka_unified_sangha_relic')]#!也被确认为该岛的圣迹，是其新团结的象征。\n\n"
 sri_lanka.0005.desc.buddhist:0 "[sri_lanka_struggle_ender.GetFirstNameNoTooltip]声称[sri_lanka_struggle_ender.GetSheHe]利用[sri_lanka_struggle_ender.GetHerHis]作为强大的[sri_lanka_struggle_ender.GetFaith.GetAdjective][sri_lanka_struggle_ender.GetTitleAsNameNoTooltip]的权威来改革僧伽。但事实上，[sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]近年来声名日隆，这只是时间问题。"
 sri_lanka.0005.desc.non_buddhist:0 "[sri_lanka_struggle_ender.GetFirstNameNoTooltip]虽然不是[sri_lanka_struggle_ender.GetFaith.GetAdjective][sri_lanka_struggle_ender.GetTitleAsNameNoTooltip]，但他看到了与有影响力的[sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]合作改革僧伽的价值。"
 sri_lanka.0005.desc.conclusion:0 "并不是每个人都对这些巨大的变化感到满意，但世界各地的[buddhism.GetAdjective]群体都将感受到其影响。"
 sri_lanka.0005.a:0 "该区域[buddhism.GetNameNoTooltip]的新时代即将来临。"
 sri_lanka.0006.t:0 "僧伽的象征"
 sri_lanka.0006.desc:0 "在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的[buddhism.GetAdjective]内部经过几个世纪的论道冲突之后，最终岛上的各个佛派同意在我和我赞助的[GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]佛派的主持下重新团结起来。\n\n如今我们现在需要一个让僧伽们团结在一起的象征。僧伽们中一些人声称，岛上最受尊崇的宗教圣物之一注定会成为这样的象征。他们说，围绕着圣物应该得到美化，以纪念佛陀、弘扬佛法，并激励新团结起来的僧伽。\n\n现在的问题是，究竟哪个宝物注定要发挥这样的作用？"
 sri_lanka.0006.a:0 "菩提树"
 sri_lanka.0006.a.tooltip:0 "从现在起，#bold 菩提树#!在[GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName]始终提供强大的[GetModifier('RICE_sri_lanka_relic_bodhi_great_modifier').GetNameWithTooltip][modifier|E]"
 sri_lanka.0006.b:0 "佛牙"
 sri_lanka.0006.b.tooltip:0 "从现在起，#bold 佛牙#!在[GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName]始终提供强大的[GetModifier('RICE_sri_lanka_relic_tooth_great_modifier').GetNameWithTooltip][modifier|E]"
 sri_lanka.0006.c:0 "《赞法界颂》"
 sri_lanka.0006.c.tooltip:0 "从现在起，#bold 赞法界颂#!在[GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName]始终提供强大的[GetModifier('RICE_sri_lanka_relic_dharmadhatu_great_modifier').GetNameWithTooltip][modifier|E]"
 sri_lanka.0006.enshrine_decision_tooltip:0 "#bold 重新供奉#![decision|E]可以让任何持有的[county|E]并持有该圣物的人获得[modifier|E]\n"
 sri_lanka.0007.t:0 "摧毁[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]的僧伽"
 sri_lanka.0007.desc:0 "$sri_lanka.0005.desc.intro$\n三个佛派互相征伐，虚弱不堪。最终，一个名为[sri_lanka_struggle_ender.GetFirstName]强大的[sri_lanka_struggle_ender.GetFaith.GetAdjective][sri_lanka_struggle_ender.GetTitleAsNameNoTooltip]\n利用[sri_lanka_struggle_ender.GetHerHis]权势压迫岛上的[buddhism.GetAdjective]寺院，掠夺财富，毁坏经文，甚至[sri_lanka_struggle_ender.GetHerHis]还勒令不和其要求的僧侣还俗等等。\n\n如今世界上很多人都谴责[sri_lanka_struggle_ender.GetFirstNameNoTooltip]是一个无恶不作的统治者，但事实上，佛派之间的冲突、自大和贪婪才是导致衰落的主要原因。[sri_lanka_struggle_ender.GetFirstNameNoTooltip]只是最后推了一把罢了，现在三大佛派已经永远的成为历史了"
 sri_lanka.0007.a:0 "只有时间才能证明[buddhism.GetAdjectiveNoTooltip]僧伽们能否适应。"
 sri_lanka.0008.t:0 "[sri_lanka_struggle_ender.GetFaith.GetAdjectiveNoTooltip]僧伽复兴"
 sri_lanka.0008.desc:0 "$sri_lanka.0005.desc.intro$\n一位名叫[sri_lanka_struggle_ender.GetFirstName]的[sri_lanka_struggle_ender.GetFaith.GetAdjective][sri_lanka_struggle_ender.GetTitleAsNameNoTooltip]为了确保佛陀的教义能够开花结果，不仅不在 [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]，甚至在 [sri_lanka_struggle_ender.GetPrimaryTitle.GetName]。\n\n[sri_lanka_struggle_ender.GetFirstNameNoTooltip]通过与岛上#bold [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]#!佛派联盟，[sri_lanka_struggle_ender.GetSheHe]广泛赞助该佛派，让其僧伽的复兴，从现在起，[sri_lanka_struggle_ender.GetPrimaryTitle.GetNameNoTooltip]将成为[buddhism.GetNameNoTooltip]的新圣地。"
 sri_lanka.0008.a:0 "$sri_lanka.0005.a$"
 sri_lanka.0009.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sri_lanka.0009.desc:0 "我在[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的荒山野岭和丛林中度过了数年，逃避珠利耶军队，躲过肆无忌惮的当地僧伽罗军阀的魔爪。岛屿四分五裂，[buddhism.GetName]僧伽日渐衰落，战争和苦难肆虐。\n\n正是在这些年里，于我年轻之时，我把成为整个岛屿的统治者作为自己的人生目标，这样我就能为这片曾经繁荣的土地带来和平，重振[buddhism.GetNameNoTooltip]。随着我登上以布烂那卢婆为中心的新王国的宝座，我已然做到了这一点。\n\n愿[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]及其人民迎来一个更崭新、更光明的时代。"
 sri_lanka.0009.a:0 "我们的岛屿将会变得前所未有的繁荣！"
 sri_lanka.0010.t:0 "[religion.GetAdjectiveNoTooltip]授地"
 sri_lanka.0010.desc:0 "我作为[GetGeographicalRegion('world_india').GetName][ROOT.Char.GetTitleAsNameNoTooltip]，我获得支持和示好的最好方法是向寺庙等赠送土地，即使是与我信仰不同的宗教。这样，他们就会开垦荒地，并在经济和政治上向我靠拢。\n\n我决定向领地内的一些[religion.GetAdjective]寺庙赠送一些土地，想必居住在那里的[religion.GetAdjectiveNoTooltip]信徒们会非常高兴。\n\n虽然财政可能吃紧，但这是必要手段。至少，在我领土内[religion.GetAdjectiveNoTooltip]人士眼中，我这样做无疑是向他们示好。"
 sri_lanka.0010.a:0 "愿能得到足够的回报！"
