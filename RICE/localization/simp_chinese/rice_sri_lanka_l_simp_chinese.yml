 trait_track_RICE_jetavana_trait_desc:0 "柢陀林派在诠释上座部教时走的是一条中间道路。虽然诋毁者指责他们对大乘和金刚乘思想过于宽容，但柢陀林派僧侣认为自己是严肃但开放的上座部教捍卫者。"
 RICE_sri_lanka_struggle:0 "僧伽论道"
 RICE_sri_lanka_struggle_desc:0 "我的品位独一无二，无趣的你不会明白的~\n我的品位独一无二，无趣的你不会明白的~"
 struggle_RICE_sri_lanka_phase_degeneration:0 "堕罪"
 struggle_RICE_sri_lanka_phase_degeneration_desc:0 "在室利楞伽佛法乃至[RICE_sri_lanka_sangha|E]本身都日渐式微。也许是在[struggle_phase_sri_lanka_purification|E]期间试图清理[RICE_sri_lanka_monasteries|E]中不道德、不守佛法的妖僧的努力失败了。亦或者在[struggle_phase_sri_lanka_accumulation|E]期间，[RICE_sri_lanka_monasteries|E]的财富和影响力吸引了贪婪的外域异教徒的无情劫掠或被肆无忌惮、贪婪的地方贵族没收。\n\n然而，正如佛陀所教导的那样，#italic 万事无常#!。随着正直的僧侣、学者和领主清除[RICE_sri_lanka_sangha|E]中的腐败和堕落之人可能会走向[struggle_phase_sri_lanka_purification|E]。或者，当地精英可能会汇集足够的资源，在[struggle_phase_sri_lanka_accumulation|E]中复兴[RICE_sri_lanka_monasteries|E]，为岛屿带来新的繁荣时代。"
 struggle_RICE_sri_lanka_phase_accumulation:0 "厚积"
 struggle_RICE_sri_lanka_phase_accumulation_desc:0 "由于得到贵族和平民的支持，[RICE_sri_lanka_struggle|E]积累了大量的权力和影响力。也许是[struggle_phase_sri_lanka_purification|E]使普通人更加尊重[RICE_sri_lanka_monasteries|E]，亦或是[struggle_phase_sri_lanka_degeneration|E]的纷争和混乱鼓励普通人支持[RICE_sri_lanka_monasteries|E]\n \n然而，[RICE_sri_lanka_monasteries|E]发展总是伴随挑战，一方面僧伽们可能会变得自满和懒惰，需要[struggle_phase_sri_lanka_purification|E]来清除[RICE_sri_lanka_sangha|E]的异端思想和不道德行为。更糟糕的是，这座富饶的岛屿可能会吸引贪婪的外国异教徒和当地统治者，来掠夺[RICE_sri_lanka_sangha|E]，摧毁[RICE_sri_lanka_monasteries|E]。这会导致僧伽们进一步堕落，无法激励人民，从而迈入[struggle_phase_sri_lanka_degeneration|E]。"
 struggle_RICE_sri_lanka_phase_purification:0 "净化"
 struggle_RICE_sri_lanka_phase_purification_desc:0 "无论[RICE_sri_lanka_struggle|E]是在[struggle_phase_sri_lanka_accumulation|E]之后纪律和道德的日益缺失，还是在[struggle_phase_sri_lanka_degeneration|E]期间因外部威胁和内部堕化，如今[RICE_sri_lanka_struggle|E]都已今非昔比。现在是恢复[RICE_sri_lanka_monasteries|E]、清除[RICE_sri_lanka_sangha|E]中的异端和堕僧的时候了。\n\n如果这一过程顺利，[RICE_sri_lanka_s_sangha|E]就会在[struggle_phase_sri_lanka_accumulation|E]中繁荣昌盛。然而，如果这一过程不成功，那么僧伽可能会进一步堕化，从而引发[struggle_phase_sri_lanka_degeneration|E]"
