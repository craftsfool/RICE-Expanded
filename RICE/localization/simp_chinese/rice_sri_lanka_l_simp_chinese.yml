 activity_RICE_sri_lanka_sri_pada_pilgrimage_conclusion_desc: "我们的[GetActivityType( 'activity_RICE_sri_lanka_sri_pada_pilgrimage' ).GetName]之旅终于结束，这座山及其闻名遐迩的足迹令人心潮澎湃，难怪有如此之多不同信仰的人都会去瞻仰它！"
