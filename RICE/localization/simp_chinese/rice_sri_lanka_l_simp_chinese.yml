 sri_lanka.0040.t:0 "圣歌与祷文"
 sri_lanka.0040.desc:0 "我决定举办一场[ROOT.Char.GetFaith.GetAdjective]祈祷仪式，以祈求神灵的帮助。当我们祭拜[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中一位神祇时，圣歌充满了整个[ROOT.Char.GetFaith.HouseOfWorship]："
 sri_lanka.0040.desc.upulvan:0 "#bold [GetPlayer.Custom('RICE_upulvan')]#!\n\n#italic 手持金弓，\n光辉四射，\n炽热蓝光，\n照耀四方，\n噫！\n[GetPlayer.Custom('RICE_upulvan')]！\n吾等于此，见证神临。\n\n头戴金冠，身披神饰，身着蓝衣，\n手持金弓，威风凛凛，\n手捧花杯，其色金黄，\n哦，强大的[GetPlayer.Custom('RICE_upulvan')]！攀上迦楼罗，向您的信徒展示伟业吧！#!"
 sri_lanka.0040.desc.kataragama:0 "#bold [GetPlayer.Custom('RICE_kataragama')]#!\n\n#italic [GetPlayer.Custom('RICE_kataragama')]！无尽伟业！\n其身六面，昔日功绩，日月可鉴。\n其右臂神力无敌，\n天眼之神鲁胡纳，吾等于此，见证神临。\n\n祂正举着阿修罗形的旗帜而来，\n祂坐与孔雀上，注视着鲜花，\n祂穿过戒备森严的地区，赐予我们祝福，\n我们在此向神献上鲜花、香水和槟榔叶。#!"
 sri_lanka.0040.desc.saman:0 "#bold [GetPlayer.Custom('RICE_saman')]#!\n\n#italic 室利波陀，山巅居神，\n敬拜圣迹，祈祷繁荣。\n虔信之主，神王[GetPlayer.Custom('RICE_saman')]，\n福乐庇佑，祛邪护身。\n\n金戈金矢，金座金伞，\n钟鼓管磬，羽籥干戚，\n屈伸俯仰，缀兆舒疾，\n鲜花美玉，以供奉祂。#!"
 sri_lanka.0040.desc.pattini:0 "#bold [GetPlayer.Custom('RICE_pattini')]#!\n\n#italic 挥袖之际，烈焰升腾，\n不信之人，与城俱焚，\n[GetPlayer.Custom('RICE_pattini')]神，威能显现，\n桂殿兰宫，化作烟尘。\n\n林中诸神，荣耀汇集，\n细雨缓降，淅淅沥沥，\n地母怒吼，奔涌江河,\n摩菟来城，至此火熄。#!"
 sri_lanka.0040.desc.natha:0 "#bold [GetPlayer.Custom('RICE_natha')]#!\n\n#italic 祂右手执着镶嵌宝石之瓶，\n察看来自兜率天的吉兆，\n犹如明月穿破云层，\n从南天行至花苑。\n\n祂主宰楞伽的支兰耶城，\n以其荣耀之力降伏邪灵，\n已知来世将成佛，\n如宝石般的[GetPlayer.Custom('RICE_natha')]大神从天降临。#!"
 sri_lanka.0040.a:0 "愿我们的祈祷得到回应！"
 sri_lanka.0040.upulvan.tooltip:0 "\n#emphasis 历史背景：#!活动文本节选自僧伽罗学者和作家W.A.德·席尔瓦记录的一首宗教歌曲。德席尔瓦在1920年讲述了优弗梵神的故事，在现代，优弗梵神通常与印度教的毗湿奴神联系在一起，泰米尔人称他为毗楼末。据说他全身皆蓝，佛陀委托他保护斯里兰卡。\n\n学者们对优弗梵的历史争论不休；不同的学者认为优弗梵最初与佛教的观世音菩萨、吠陀神话中的伐楼拿神或罗摩神，甚至祆教的阿胡拉·马兹达神有关，也有学者认为优弗梵起源于斯里兰卡本土。为简单起见，这里将优弗梵与毗湿奴联系起来。\n"
 sri_lanka.0040.kataragama.tooltip:0 "\n#emphasis 历史背景：#!活动文本节选自僧伽罗学者和作家W.A.德·席尔瓦记录的一首宗教歌曲。德席尔瓦在1920年讲述了僧伽罗语中的迦陀罗伽摩神或泰米尔语中的牟卢犍神。他是一位战神，据说有六张面孔，经常被描绘成骑着孔雀的样子。\n\n斯里兰卡南部的迦陀罗伽摩寺是一个著名的朝圣地，印度教徒、佛教徒、吠陀教徒、穆斯林等多种信仰的信徒都经常来此朝圣，但在过去几十年中，佛教徒越来越多地在此占据主导地位，导致人们对当今的迦陀罗伽摩/牟卢犍崇拜产生了疑问和争论。\n"
 sri_lanka.0040.saman.tooltip:0 "\n#emphasis 历史背景：#!活动文本节选自僧伽罗学者和作家W.A.德·席尔瓦记录的一首宗教歌曲。德席尔瓦在1920年讲述了沙漫神的故事，据说沙漫是斯里兰卡中部圣足山的保护神，这座山被多种宗教奉为圣山。\n\n根据佛教传说，佛陀访问斯里兰卡时，应沙漫的请求在圣足山留下了一个脚印，以便佛陀不在时人们有东西可以瞻仰。相比之下，印度教徒认为著名的岩石脚印是湿婆创造的，而基督徒和穆斯林则认为是亚当创造的。\n"
 sri_lanka.0040.pattini.tooltip:0 "\n#emphasis 历史背景：#!活动文本节选自僧伽罗学者和作家W.A.德·席尔瓦记录的一首宗教歌曲。德席尔瓦在1920年讲述了钵底尼神，相当于泰米尔语中的犍那祇·阿漫女神。她是斯里兰卡最重要的女神，或许也是岛上最受人爱戴的神祇之一。\n\n传说她曾是一个凡人女子，由于丈夫软弱、不忠，将所有钱财都浪费在妓女身上而受尽折磨；当丈夫试图改过自新时，却被摩菟来城的国王不公正地处死了。然后，她变成了愤怒的女神，盛怒之下，她扯下自己的一只乳房，扔进了城市，导致城市燃起熊熊大火。尽管发生了这起暴力事件，但她最终还是前往斯里兰卡，并在那里成为了治疗女神和弱者与病人的保护神。\n"
 sri_lanka.0040.natha.tooltip:0 "\n#emphasis 历史背景：#!活动文本节选自僧伽罗学者和作家W.A.德·席尔瓦记录的一首宗教歌曲。德席尔瓦在1920年讲述了那他神。他是斯里兰卡版的观世音菩萨，是最受欢迎的佛教菩萨或神祇之一，有多种形态和变体，如中国的“观音”。\n\n尽管那他是观世音菩萨的地方版本，但现在人们通常把他与弥勒佛联系在一起，据说弥勒佛是下一位佛陀。\n"
