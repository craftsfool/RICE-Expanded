 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka:0 "吸引更多[ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetFaith.GetAdjectiveNoTooltip]僧侣"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_tooltip:0 "我们需要更多可以在[RICE_sri_lanka_struggle|E]与我和我的人民产生共鸣的僧侣"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_desc:0 "[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]缺少[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetCulture.GetName]出身的僧侣。如果岛上能有更多理解我们的佛教僧侣，我们就能进一步改善关系，并在[RICE_sri_lanka_struggle|E][struggle_involved|E]其中"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_confirm:0 "岛上的#italic 僧伽#!将会壮大！"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_effect_tooltip_1:0 "如果[GetTitleByKey('b_polonnaruwa').GetNameNoTier][holding|E]当前没有其他[special_building|E]，则立即获得[GetBuilding('generic_university').GetName]。"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_effect_tooltip_2:0 "你可以选择是否将首都更名为#bold 毗阇耶罗阇补罗#!"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_context_tooltip:0 "#emphasis 历史背景：#!虽然斯里兰卡经常被描绘成僧伽罗上座部佛教的堡垒，但从历史上看，岛上的佛教徒受到了该地区其他佛教徒的影响。有证据表明，在古典和中世纪时期曾有过大乘佛教和金刚乘佛教的修行，岛上的寺院与缅甸和印度尼西亚等地的其他佛教机构也有交流。例如，根据传说，11世纪斯里兰卡统一后，国王毗阇耶婆呼一世不得不邀请缅甸僧侣到斯里兰卡，以助重建佛教界。"
