 activity_RICE_sri_lanka_sri_pada_pilgrimage:0 "[GetPlayer.Custom('RICE_sri_pada')]朝圣"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_desc:0 "[GetPlayer.Custom('RICE_sri_pada')]是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中的圣山之一，受到许多不同信仰的人追封。最著名的是山顶上的一个脚印，至于是哪位宗教人物留下的脚印，就要取决于你问的是谁的[faith|E]"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_selection_tooltip: "前往[GetTitleByKey('c_kandy').GetNameNoTier]的[GetPlayer.Custom('RICE_sri_pada')]进行[local_pilgrimage|E]\n\n$activity_RICE_sri_lanka_sri_pada_pilgrimage_context_tooltip$"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!圣足山（对基督徒和穆斯林而言叫亚当峰）是斯里兰卡中部一座著名的圣山，最引人注目的是山顶上的脚印。佛教徒认为这是佛陀留下的，佛祖曾在此传道；印度教徒认为脚印是湿婆留下的；而基督徒和穆斯林则认为是亚当留下的。无论如何，几个世纪以来，这座山峰一直是朝圣之地，法西安、马可·波罗和伊本·白图泰等著名旅行家都曾提到过它，后者还曾登上过它。"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_host_desc: "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$取决于[religion|E]或[religious_family|E]获得[modifier|E]\n$TAB$$BULLET_WITH_TAB$亚伯拉罕信仰会获得：[GetModifier('RICE_sri_lanka_sri_pada_abrahamic_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$佛教信仰会获得：[GetModifier('RICE_sri_lanka_sri_pada_buddhist_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$印度教信仰会获得：[GetModifier('RICE_sri_lanka_sri_pada_hindu_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$东方信仰会获得：[GetModifier('RICE_sri_lanka_sri_pada_other_eastern_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$其他非东方信仰会获得：[GetModifier('RICE_sri_lanka_sri_pada_pagan_modifier').GetNameWithTooltip]"
