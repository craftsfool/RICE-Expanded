 sri_lanka.0070.t:0 "去[GetPlayer.Custom('RICE_sri_pada')]！"
 sri_lanka.0070.desc:0 "今天，我开始了前往[GetPlayer.Custom('RICE_sri_pada')]的旅程。这将是一段艰苦之旅，要穿越绵延数英里的荒野，更不用攀登上山。不过，这一切都是值得的。\n\n[GetPlayer.Custom('RICE_sri_pada')]是[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]中最神圣的地方。以至于所有宗教的信徒都会去那里朝圣，而不仅仅是[ROOT.Char.GetFaith.GetAdherentNamePlural]。\n\n据[ROOT.Char.GetFaith.GetAdjectiveNoTooltip][ROOT.Char.Custom('DefaultPriestTitlePlural')]称，去攀登主要是看山顶上的一个大脚印，据说是[GetPlayer.Custom('RICE_sri_pada_footprint_person')]留下的。前往瞻仰无疑是向[ROOT.Char.GetFaith.HighGodName]表达我的虔诚之心的最佳方式！\n"
 sri_lanka.0070.a:0 "该上山了！"
 sri_lanka.0071.t:0 "到达"
 sri_lanka.0071.desc:0 "最后，我抵达了[GetPlayer.Custom('RICE_sri_pada')]。远远望去，山峰高耸入云，周围是一望无际的翠绿树冠。它看起来令人生畏，但我已经一路走到了这里。没有退路！\n\n但现在，我和我的随行人员需要恢复体力。上山的路将会很艰难，所以我们需要休息好身心，才能顺利到达山顶。\n\n在我们准备休息过夜时，我们穿过成群的朝圣者——一些是[ROOT.Char.GetFaith.GetAdherentNamePlural]，还有其他信仰的信徒。不同信仰的人们都对这座山怀有崇敬之情，更难能可贵的是，他们彼此之间保持着相对和平的关系。"
 sri_lanka.0071.a:0 "看到那座山了吗？我#italic 会#!攀登它！"
 sri_lanka.0071.info:0 "#emphasis 历史背景：#![activity|E]中有关朝圣的描述，由伊本·白图泰（一位14世纪著名的摩洛哥穆斯林探险家，足迹遍布马里、中国、西班牙，当然还有斯里兰卡）详细记载。\n\n伊本·白图泰于公元1344年前往斯里兰卡。他受到了贾夫纳国王马尔坦达·辛凯里扬的热烈欢迎，并得到了他在岛上旅行的慷慨支持。当伊本·白图泰亲自前往圣足山朝圣时，国王为他提供了一顶由自己的奴隶抬着的轿子，并且探险家的随从中有几位印度婆罗门。\n\n无论如何，由于圣足山如今仍是一个重要的朝圣地，并且几个世纪以来该地以及前往该地的人们所发生的变化，[activity|E]和事件链中的描述很可能与现在的情况有所不同。"
 sri_lanka.0072.t:0 "上山"
 sri_lanka.0072.desc:0 "我们已经开始徒步攀登[GetPlayer.Custom('RICE_sri_pada')]。前往主峰有两条主要路线。\n\n一条被称为#italic 麽麽路（Mama）#!，另一条则是#italic 巴巴路（Baba）#!\n\n沿途有许多铁链沿着台阶往上爬，帮助朝圣者登上台阶。我还没走到一半，就已经感觉筋疲力尽了！"
 sri_lanka.0072.a:0 "我会慢慢来，不要过度劳累。"
 sri_lanka.0072.b:0 "这是一场斗争，但我会坚持到底。"
 sri_lanka.0073.t:0 "在顶峰"
 sri_lanka.0073.desc:0 "终于，我登上了[GetPlayer.Custom('RICE_sri_pada')]的山顶！啊！多么壮观的景色啊！在蓝天映衬下，向下望去，只见纯白的云朵环绕着山峰，中间夹杂着常绿的树冠，所有这些都遮住了山脚。\n\n但我不是来欣赏风景的。我匆匆穿过山顶，来到其他大多数朝圣者聚集的地方：在一块巍峨的黑色岩石上，一个脚印的跨度大得惊人。\n\n终于，我的眼前出现了[GetPlayer.Custom('RICE_sri_pada_footprint_person')]很久以前留下的脚印。在我们返回之前，我们将花上几天时间祈祷，但在此之前，按照惯例，[ROOT.Char.GetFaith.GetAdherentNamePlural]会捐出一些黄金和珍贵物品以示虔诚"
 sri_lanka.0073.desc.abrahamic:0 "向引领我们来到这个圣地的向导致敬。"
 sri_lanka.0073.desc.non_abrahamic:0 "作为祭品，留在刻在脚上的九个洞里。"
 sri_lanka.0073.a:0 "我会捐出一些象征性的小饰品。"
 sri_lanka.0073.b:0 "我会捐出一大笔钱！"
 sri_lanka.0074.t:0 "准备离开"
 sri_lanka.0074.desc:0 "在祈祷几日后，我们开始沿着[GetPlayer.Custom('RICE_sri_pada')]的小路走，但下山仍然很艰苦，当我们到达山脚下时，我们已经筋疲力尽了。\n\n正等我们喘气歇息时，我注意到了山脚下那棵著名的古树。据传它的叶子永远不会掉落，一些隐士甚至声称吃了树叶就能返老还童。不管真相如何，这颗古树十分的壮阔美丽，也是我们结束旅程的一道美妙风景。"
 sri_lanka.0074.a:0 "看到那座山了吗？我#italic 确实#!爬上去了！"
