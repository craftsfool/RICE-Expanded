 activity_RICE_sri_lanka_relic_veneration:0 "圣物瞻礼"
 activity_RICE_sri_lanka_relic_veneration_desc:0 "[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]作为佛法圣地，拥有许多重要的佛教遗迹。我可以参加为追悼圣僧舍利而举行的佛教仪式。"
 activity_RICE_sri_lanka_relic_veneration_selection_tooltip: "瞻礼[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]主要[RICE_sri_lanka_monasteries|E]寺院中的一颗舍利子。\n\n$activity_RICE_sri_lanka_relic_veneration_context_tooltip$"
 activity_RICE_sri_lanka_relic_veneration_context_tooltip: "#emphasis 历史背景：#!斯里兰卡是许多佛教圣物的故乡，其中最突出的是佛牙舍利，甚至有控制佛牙舍利则视为岛上国王的说法。在现代，佛牙舍利游行可以说是斯里兰卡最著名的仪式和庆祝活动，但其目前的形式实际上相对较新，几个世纪以来经历了许多变化。具有讽刺意味的是，在CK3时间线中，佛牙舍利最初被最终成为大寺派主导的斯里兰卡嗤之以鼻，因为佛牙舍利与他们的竞争对手无畏山派有着紧密的联系，而大寺派则将崇敬集中在其他舍利上，尤其是阿努拉德普拉的菩提树上。"
 activity_RICE_sri_lanka_relic_veneration_host_desc: "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$基于舍利子获得不同的[character_modifiers|E]\n$BULLET_WITH_TAB$获得[RICE_sri_lanka_prominence|E]，尤其是岛上被赞助过的[RICE_sri_lanka_monasteries|E]对你赞赏有加"
 activity_RICE_sri_lanka_relic_veneration_guest_desc: "$activity_RICE_sri_lanka_relic_veneration_host_desc$"
