 RICE_sri_lanka_relic_veneration_type: "圣物"
 RICE_sri_lanka_relic_veneration_type_tooth: "佛齿"
 RICE_sri_lanka_relic_veneration_type_tooth_desc: "$EFFECT_LIST_BULLET$增加[abhayagiri_i|E][abhayagiri|E][RICE_sri_lanka_monastery|E]，如果拥有对应佛派布施特质则获得更多\n$EFFECT_LIST_BULLET$减少[mahavihara_i|E][mahavihara|E][RICE_sri_lanka_prominence|E]和[jetavana_i|E][jetavana|E][RICE_sri_lanka_prominence|E]\n$EFFECT_LIST_BULLET$如果你不是[abhayagiri|E]布施人的话则获得[GetModifier('RICE_sri_lanka_relic_tooth_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$如果你是[abhayagiri|E]守护者，或者在[RICE_sri_lanka_struggle|E]统一后，佛齿舍利被供奉在[GetModifier('RICE_sri_lanka_relic_tooth_shrine_modifier').GetNameWithTooltip]中，则可以获得[GetModifier('RICE_sri_lanka_relic_tooth_great_modifier').GetNameWithTooltip][modifier|E]\n\n#weak 城中又起佛牙精舍，皆七室作——佛齿常以三月中出之。未出前十日，王装校大象，使一辩说人着王衣，骑象上击鼓唱言......却后十日，佛齿当出至无畏精舍，国内道俗欲值 福者，各各平冶道路，严饰巷陌，中道而行，随路供养到无畏精舍佛堂上。道俗云集，烧香燃灯，种种法事，尽夜不息。满十五日，乃还城内精舍。至齐日则开门户，礼敬如法#!"
 RICE_sri_lanka_relic_veneration_type_bodhi: "大菩提树"
 RICE_sri_lanka_relic_veneration_type_bodhi_desc: "$EFFECT_LIST_BULLET$增加[mahavihara_i|E][mahavihara|E][RICE_sri_lanka_prominence|E]，如果拥有对应佛派布施特质则获得更多\n$EFFECT_LIST_BULLET$减少[abhayagiri_i|E][abhayagiri|E][RICE_sri_lanka_prominence|E]和[jetavana_i|E][jetavana|E][RICE_sri_lanka_prominence|E]\n$EFFECT_LIST_BULLET$如果你不是[mahavihara|E]布施人的话则获得[GetModifier('RICE_sri_lanka_relic_bodhi_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$如果你是[mahavihara|E]守护者，或者在[RICE_sri_lanka_struggle|E]统一后，菩提舍利被供奉在[GetModifier('RICE_sri_lanka_relic_bodhi_shrine_modifier').GetNameWithTooltip]中，则可以获得[GetModifier('RICE_sri_lanka_relic_bodhi_great_modifier').GetNameWithTooltip][modifier|E]\n\n#weak 金刚座上菩提树者，即毕钵罗之树也。昔佛在世，高数百尺，屡经残伐，犹高四五丈。佛坐其下成等正觉，因谓之菩提树焉。茎干黄白，枝叶青翠，冬夏不凋，光鲜无双。#!"
 RICE_sri_lanka_relic_veneration_type_dharmadhatu: "《赞法界颂》"
 RICE_sri_lanka_relic_veneration_type_dharmadhatu_desc: "$EFFECT_LIST_BULLET$增加[jetavana_i|E][jetavana|E][RICE_sri_lanka_prominence|E]，如果拥有对应佛派布施特质则获得更多\n$EFFECT_LIST_BULLET$减少[mahavihara_i|E][mahavihara|E][RICE_sri_lanka_prominence|E]和[abhayagiri_i|E][abhayagiri|E][RICE_sri_lanka_prominence|E]\n$EFFECT_LIST_BULLET$如果你不是[jetavana|E]布施人的话则获得[GetModifier('RICE_sri_lanka_relic_dharmadhatu_modifier').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$如果你是[jetavana|E]守护者，或者在[RICE_sri_lanka_struggle|E]统一后，法界舍利被供奉在[GetModifier('RICE_sri_lanka_relic_dharmadhatu_shrine_modifier').GetNameWithTooltip]中，则可以获得[GetModifier('RICE_sri_lanka_relic_dharmadhatu_great_modifier').GetNameWithTooltip][modifier|E]\n\n#weak 以此心体，法尔具足一切诸法，故言法界#!"
