 RICE_india_irrigation_tank_decision:0 "建造灌溉水库"
 RICE_india_irrigation_tank_decision_tooltip:0 "赞助修建灌溉水库"
 RICE_india_irrigation_tank_decision_desc:0 "几个世纪以前，[GetGeographicalRegion('world_india').GetName]的人们掌握了建造水库和其他连接水系的技术，以收集和保存雨水。这种灌溉水库通常与当地的宗教机构有关，赞助建造一些水库会给我带来很好的影响。"
 RICE_india_irrigation_tank_decision_confirm:0 "准备施工！"
 RICE_india_irrigation_tank_decision_effect_tooltip_1:0 "你的[county_capital|E]将获得一个持续十年的[county_modifier|E]，而你将获得相应的[character_modifier|E]以及一些[prestige_i|E][prestige|E]和[piety_i|E][piety|E]"
 RICE_india_irrigation_tank_decision_effect_tooltip_2:0 "这些增益的强度取决于提供了多少资金"
 RICE_india_irrigation_tank_decision_effect_tooltip_3:0 "你的[culture|E]有减少建造灌溉水库花费的[tradition|E]"
 RICE_india_irrigation_tank_decision_effect_tooltip_4:0 "你的[culture|E]有从建造灌溉水库中增加[prestige|E]和[piety|E]获得的[tradition|E]"
 RICE_india_irrigation_tank_decision_effect_tooltip_5:0 "你资助的任一[RICE_sri_lankan|E][RICE_sri_lanka_monastery|E]的[RICE_sri_lanka_prominence|E]都会增加，增加数值取决于建造的灌溉水库大小"
 RICE_india_irrigation_tank_decision_context_tooltip:0 "#emphasis 历史背景：#!灌溉水库是斯里兰卡和印度大部分地区历史上建造的人工水库（大小不一）。它们通常由多个水库、渠道和土堤组成，旨在收集和保存雨水。有些是当地世家的项目，有些则由宗教组织、贵族和国王赞助。印度西部著名的阶井和斯里兰卡的水井都是水力系统与灌溉水池技术相结合的典范。"
 RICE_sri_lanka_enshrine_relic:0 "重塑[GetPlayer.Custom('RICE_sri_lanka_unified_sangha_relic')]"
 RICE_sri_lanka_enshrine_relic_tooltip:0 "是时候将[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]的圣物转移至新的地方"
 RICE_sri_lanka_enshrine_relic_desc:0 "[RICE_sri_lanka_struggle|E]被[GetPlayer.Custom('RICE_sri_lanka_unified_monastery')]统一之下后，[GetPlayer.Custom('RICE_sri_lanka_unified_sangha_relic')]被视为[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]上最重要的[GetPlayer.GetFaith.GetReligion.GetAdjective]圣迹而受到极大的尊崇，不过，我认为它应该有一个新家，并希望把它搬到那儿去。"
