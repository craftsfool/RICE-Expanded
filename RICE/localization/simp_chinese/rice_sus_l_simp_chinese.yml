 sus.0050.t:0 "德拉枣"
 sus.0050.desc:0 "今天我正在享受一些来自[draa_county.GetNameNoTier]河谷的枣。这个地区以其丰富的各种枣子而闻名。仅仅是品尝它们的美味甜味，就使我觉得自己是在天堂里!"
 sus.0050.a:0 "也许我应该多吃……"
 sus.0051.t:0 "塔吉"
 sus.0051.desc.is_berber:0 "啊，#italic 塔吉#!。所有人都喜欢的[ROOT.Char.GetCulture.GetName]菜系中的一大佳肴。我今天吃的这份肉类和蔬菜炖肉，比平时已经更美味了。"
 sus.0051.desc.is_not_berber:0 "啊，#italic 塔吉#!。北非美食中的一大佳肴，人人都喜欢。而且我今天吃的这份肉类和蔬菜炖肉，比平时更美味了。"
 sus.0051.a:0 "也许我心情好？"
 sus.0052.t:0 "兰塔皮革"
 sus.0052.desc:0 "最近，我结识了一些出售皮革和兽皮的商人，特别是由北非羚羊制成的坚韧的#italic 兰塔#!皮革。它们非常坚韧，可以用来制作盾牌和盔甲。总之这些商人说他们愿意以一个好价钱卖给我一些他们库存的兽皮。如果我会部队装备这些......军队战斗力可能会提升"
 sus.0052.a:0 "转念一想，我的军队已经很强了。"
 sus.0052.b:0 "好，我将购买你的一些皮革。"
 sus.0052.c:0 "你肯定能给我一个更好的价格。"
 sus.0053.t:0 "克萨的扩建"
 sus.0053.desc:0 "附近的一个#italic 克萨#!已经发展到如此程度，以至于它被认为是当地贸易路线上的一个防御堡垒。这些设防的村庄对于保护穿越沙漠的跨撒哈拉贸易路线至关重要。"
 sus.0053.a:0 "我希望有更多的大篷车商队将安全通过！"
 sus.0054.t:0 "新坎儿井"
 sus.0054.desc:0 "在一些当地领导人指导下，附近修建了一条新的#italic 坎儿井#!。这些渠道有些在地下已经用了几个世纪，坎儿井将河流或泉水分配到聚居地的干燥区域。我们可以预计，这个#italic 坎儿井#!服务的地区在农业生产力方面会扩大。"
 sus.0054.a:0 "让我们祈祷坎儿井做好它的本职"
 sus.0055.t:0 "一个壮观的克萨"
 sus.0055.desc:0 "今天，我正在访问我的王国的一个干旱地区的一个#italic 克萨#!（一种北非形式的“设防村庄”），它在几个世纪前建成，以保护当地人和任何经过的商人。\n\n当我检查这个宏伟的克萨结构时，我对所有建筑之间无缝连接的方式印象深刻，从房屋到粮仓到商店、浴室和当地的[ROOT.Char.GetFaith.HouseOfWorship]都是如此美妙。"
 sus.0055.a:0 "这个地方很有气势！只有蠢材才敢进攻它。"
 sus.0055.b:0 "有这样一个安全的克萨，我相信这里的人们会生活得很好。"
 sus.0056.t:0 "修缮坎儿井"
 sus.0056.desc:0 "我刚刚收到一位官员的报告，附近的一个#italic 坎儿井#!最近干涸了。这些水渠或渡槽在该地区已经使用了几个世纪，因此有许多这样的水渠，有些能勉强使用，有些已经无法使用，比如这个。虽然这条水道本身并不重要，但它是对附近另一条#italic 坎儿井#!的补充，拿出一些资金来修复它，使其重新发挥作用，可能是一个不错的选择。"
 sus.0056.a:0 "如果没用了，那又何必麻烦呢？"
 sus.0056.b:0 "好主意，让我们开始维修吧。"
 sus.0056.c:0 "我不仅要修理它，还要出资建造另一个。"
 sus.0057.t:0 "克萨维护"
 sus.0057.desc:0 "我从一位官员那里收到了一份令人震惊的报告，附近的几个#italic 克萨#!都需要进行大规模的维护。这些在马格里布地区常见的防御性村庄通常由原土制成，因此很容易受到风、雨等因素的影响，这意味着它们需要不断维护。\n\n虽然当地人能够根据需要继续维护他们的#italic 克萨#!，但他们的时间和资源可能是有限的。由于这些村庄在保护当地的贸易路线和确保该地区的秩序和稳定方面非常重要，我的官员告诉我，通过从其他地方为他们提供资源和人力来帮助当地人是可行的，因为他们在这里不一定有这些资源。"
 sus.0057.a:0 "如果他们自己能做，我认为没有必要把资源给他们。"
 sus.0057.b:0 "这些村庄保持良好状态至关重要，我会提供资源。"
 sus.0058.t:0 "克萨的内部"
 sus.0058.desc:0 "我今天要去拜访我的领地内的一个较大的#italic 克萨#!，该克萨由相互连接的土坯结构和小巷组成，是北非贸易路线的基石村庄，可以保护他们所在的地区免受强盗和侵略者的侵扰。当我走过蜿蜒的街道时，我几乎要进入一条街道，这时陪同我的导游告诫我不要前往那边。\n \n“那是......#italic 那种#!外人住的地方”我问为什么时，一个人告诉我“就是那些做不干净工作的人，我们还没有筹集到资金来建立一扇门，将他们分离开，污染你的眼睛我很抱歉。”"
 sus.0058.a:0 "这没有关系，你知道谁是谁，分清等级是好事。"
 sus.0058.b:0 "他们仍然是这里一份子，所以我也会去看望他们，看看他们过得怎么样，仅此而已。"
 sus.0058.c:0 "你说没有足够的资金来建造大门吗？如果我提供一些帮助呢？"
 sus.0059.t:0 "米德拉里亚"
 sus.0059.desc:0 "今天我正在巡察#italic 米德拉里亚#!，这条古老的主要运河直接流经[sijilmasa_county.GetNameNoTier]。在运河的尽头是一个相当大的绿洲，也是同一个名字。无论如何，这条运河一直是重要的水源，并被用于各种用途，如几个世纪以来对附近农业的灌溉。\n\n我仔细听着一些负责维护运河的专家解释目前确保运河保持良好状态的一些问题。显然他们担心运河在未来几年的状况，并要求我提供一些额外的资源，以协助运河的持续运作。"
 sus.0059.a:0 "我相信现有的资源是足够的。其他地方还有其他需求。"
 sus.0059.b:0 "很好，你将获得这些资源。好好利用它们。"
 sus.0060.t:0 "锡吉勒马萨的钱币"
 sus.0060.desc:0 "一位来访的旅行者告诉我，在他的家乡人们对[sijilmasa_county.GetNameNoTier]的铸币厂生产的钱币评价很高。\n\n他说：“真的！这里铸造的钱币质量最好。难怪它们在世界各地都被使用！”"
 sus.0060.a:0 "我们对此感到非常自豪，我的朋友。"
 sus.0061.t:0 "金匠"
 sus.0061.desc:0 "很多来自西非的黄金经过[sijilmasa_county.GetNameNoTier]到达地中海其他地区的市场。因此在这个城市有一个相当大的金匠社区，他们长期以来一直在从事他们的工艺。最近有几个人在这里定居下来，加强了现有的工匠群体技艺，并通过接受一些当地精英的委托来帮助提高城市的繁荣。"
 sus.0061.a:0 "也许这些天我有时间可以自己委托制作一些东西。"
 sus.0062.t:0 "锡吉勒马萨陶瓷"
 sus.0062.desc:0 "很多有价值的商品来自西非，经过[sijilmasa_county.GetNameNoTier]到达地中海的市场。然而人们说这个城市不出口自己的产品，而某些产品在西非人民中需求量很大。例如来自锡耶尔马萨的釉面陶瓷，受到了更多南部地区许多人的赞扬，最近这个行业出现了一些繁荣，我们的工匠能够以比以前更好的价格出售更多的产品。"
 sus.0062.a:0 "听到这消息真是高兴。"
 sus.0063.t:0 "山羊和摩洛哥坚果"
 sus.0063.desc:0 "今天，我正巡视领土里的摩洛哥坚果森林。当地的一位妇女正在向我解释，爬到树上吃果实的山羊在提取摩洛哥坚果植物的宝贵种子方面是最有用的，这些种子可以用来制作油、食品等。像她这样的妇女通常是与这些摩洛哥坚果树打交道的人。\n\n“有些人认为山羊的粪便是这一切的关键，”这位妇女笑着说，“因为羊吃了这些果实进去然后拉出粪便这样帮助我们敲开了摩洛哥坚果的外壳。虽然这是个肮脏的产业，我的[ROOT.Char.GetLadyLord]，但我们女人为我们的工作感到自豪。”"
 sus.0063.a:0 "能用就行。"
 sus.0064.t:0 "阿姆鲁"
 sus.0064.desc:0 "今天我经过我领地内的一个村庄，那里以摩洛哥坚果森林而闻名。当地人赠送给我一些摩洛哥坚果油，以纪念这一时刻。这种油的一个常见用途是制作#italic 阿姆鲁#!，这是一种将摩洛哥坚果与蜂蜜以及经过烤制和粉碎的杏仁结合起来的涂抹物。"
 sus.0064.a:0 "我期待着看到我的厨师们将如何利用这个东西!"
