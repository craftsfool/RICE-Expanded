 sus.0030.t:0 "一个跨撒哈拉的阿拉伯商人"
 sus.0030.desc.intro_networker:0 "最近，我努力与在横跨撒哈拉沙漠、连接地中海和萨赫勒地区的跨撒哈拉贸易路线上做生意的商人接触和建立联系。我的努力没有白费，因为我已经结识了一位名叫[RICE_trans_saharan_merchant_spawn.GetFullName]的商人"
 sus.0030.desc.intro_normal:0 "几个世纪以来，商人们沿着连接地中海和萨赫勒地区的跨撒哈拉贸易路线，在撒哈拉沙漠上纵横交错，交易从黄金和盐到奴隶、象牙和可乐果等贸易品。我最近认识了一个这样的商人，名叫[RICE_trans_saharan_merchant_spawn.GetFullName]。"
 sus.0030.desc:0 "\n\n[RICE_trans_saharan_merchant_spawn.GetFirstNameNoTooltip]是[RICE_trans_saharan_merchant_spawn.GetCulture.GetName]人，来自该地区众多阿拉伯社区之一。像[RICE_trans_saharan_merchant_spawn.GetHerHim]这样的商人与整个中东、印度和其他地区的其他阿拉伯商人都有联系。\n\n总之经过一些交流，[RICE_trans_saharan_merchant_spawn.GetSheHe]提出让我与其他阿拉伯商人群体建立联系，以促进我的王国的贸易增长。我甚至考虑将[RICE_trans_saharan_merchant_spawn.GetHerHim]雇佣在我的宫廷里，这样我们就可以在未来紧密合作。"
 sus.0030.a:0 "在我们完成这里的工作后，你愿意加入我的宫廷吗，[RICE_trans_saharan_merchant_spawn.GetFirstName]？"
 sus.0030.b:0 "一笔好买卖。很高兴与你合作，[RICE_trans_saharan_merchant_spawn.GetFirstName]。"
 sus.0030.c:0 "思来想去，我对这样做不感兴趣。"
 sus.0031.t:0 "一个跨撒哈拉的西非商人"
 sus.0031.desc:0 "\n\n[RICE_trans_saharan_merchant_spawn.GetFirstNameNoTooltip]是[RICE_trans_saharan_merchant_spawn.GetCulture.GetName]人，来自该地区众多西非社区中的一员。黄金和盐是他们交易的主要商品，但是他们也交易其他商品。\n\n总之经过一些交流，[RICE_trans_saharan_merchant_spawn.GetSheHe]主动提出为我与其他西非商人社区建立联系，以促进我领土贸易。我甚至考虑将[RICE_trans_saharan_merchant_spawn.GetHerHim]雇佣在我的宫廷里，以便我们在未来能够紧密合作。"
 sus.0031.a:0 "xxxxx"
 sus.0032.t:0 "一位跨撒哈拉的柏柏尔商人"
 sus.0032.desc:0 "\n\n[RICE_trans_saharan_merchant_spawn.GetFirstNameNoTooltip]，他是[RICE_trans_saharan_merchant_spawn.GetCulture.GetName]，来自遍布该地区的许多柏柏尔社区之一。北非柏柏尔部族在该地区的贸易繁荣中发挥了重要作用。\n\n总之经过一些交流，[RICE_trans_saharan_merchant_spawn.GetSheHe]提出让我与其他柏柏尔商人社区建立联系，以促进我领土贸易。我甚至考虑将[RICE_trans_saharan_merchant_spawn.GetHerHim]雇佣在我的宫廷里，这样我们就可以在未来紧密合作。"
 sus.0032.a:0 "xxxxx"
 sus.0033.t:0 "一个跨撒哈拉的犹太商人"
 sus.0033.desc:0 "\n\n[RICE_trans_saharan_merchant_spawn.GetFirstNameNoTooltip]是[RICE_trans_saharan_merchant_spawn.GetCulture.GetName]人，来自该地区的众多犹太社区之一。虽然分散在北非和欧亚大陆，但这些犹太社区彼此之间有着密切的联系。\n\n总之经过一番交流，[RICE_trans_saharan_merchant_spawn.GetSheHe]提出让我与其他犹太商人社区建立联系，以促进我领土贸易。我甚至考虑将[RICE_trans_saharan_merchant_spawn.GetHerHim]雇佣在我的宫廷里，这样我们就可以在未来紧密合作。"
