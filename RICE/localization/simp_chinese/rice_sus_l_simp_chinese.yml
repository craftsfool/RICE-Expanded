 RICE_trans_saharan_merchants_option:0 "跨越撒哈拉的商人"
 RICE_trans_saharan_merchants_option_desc:0 "虽然与大型商队一起旅行可能会拖慢行程，但人多力量大，也很安全。这些商人在穿越非洲不同地形方面很有经验，与他们一起旅行可能会获得商业订单！ "
 RICE_trans_saharan_geographical_req:0 "你在[GetGeographicalRegion('RICE_trans_saharan_trade_region').GetName]拥有[county|E]或[domicile|E]"
 trait_RICE_trans_saharan_merchant:0 "跨越撒哈拉的商人"
 trait_RICE_trans_saharan_merchant_desc:0 "该角色是横跨非洲的撒哈拉贸易路线上的一个著名商人，其在贸易、旅行和谈判方面有丰富的经验。"
 trait_RICE_trans_saharan_merchant_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是横跨非洲的撒哈拉贸易路线上的一个著名商人，[ROOT.GetCharacter.GetSheHe|U]在贸易、旅行和谈判方面有丰富的经验。"
 RICE_african_merchants_option_effect_1:0 "每次你进入一个[barony|E]，都有#V [GetPlayer.MakeScope.ScriptValue('RICE_african_merchant_travel_option_event_chance')]%#!概率从贸易交易中获得少量[gold_i|E][gold|E]，这取决于你的[diplomacy|E]和[stewardship|E]。"
 RICE_trans_saharan_merchant_recruited_tt:0 "[RICE_merchant.GetNamePossessive]商队已作为随行人员加入。"
 sus.0001.b:0 "我会讨价还价，争取更多。"
 sus.0001.b.failure:0 "讨价还价#N 失败#!了！"
 sus.0001.b.success:0 "讨价还价#P 成功#!了！"
 trait_RICE_trans_saharan_merchant_2:0 "著名跨撒哈拉商人"
 trait_RICE_trans_saharan_merchant_2_desc:0 "$trait_RICE_trans_saharan_merchant_desc$"
 trait_RICE_trans_saharan_merchant_2_character_desc:0 "$trait_RICE_trans_saharan_merchant_character_desc$"
 trait_RICE_trans_saharan_merchant_3:0 "传奇跨撒哈拉商人"
 trait_RICE_trans_saharan_merchant_3_desc:0 "$trait_RICE_trans_saharan_merchant_desc$"
 trait_RICE_trans_saharan_merchant_3_character_desc:0 "$trait_RICE_trans_saharan_merchant_character_desc$"
 trait_track_RICE_trans_saharan_merchant:0 "$trait_RICE_trans_saharan_merchant$"
 trait_track_RICE_trans_saharan_merchant_desc:0 "非洲有着热带草原、沙漠和森林是一片富饶的大陆，对于熟悉其民族、诸邦以及贸易的智者和狡诈之徒来说，这里充满了机遇。"
 RICE_trans_saharan_trade_legacy_1_effect_2:0 "当选择$RICE_trans_saharan_merchants_option$[travel_option|E]时，增加获得贸易事件的概率，并从中获得[gold|E]。"
 RICE_trans_saharan_trade_legacy_2_effect_3:0 "当选择$RICE_trans_saharan_merchants_option$[travel_option|E]时，增加获得[GetTrait('RICE_trans_saharan_merchant').GetName( GetPlayer )][trait|E]的概率。"
 RICE_trans_saharan_trade_legacy_5_effect_1:0 "现在，即使没有任何成功交易的经验，也可以在使用$RICE_trans_saharan_merchants_option$[travel_option|E]时获得[GetTrait('RICE_trans_saharan_merchant').GetName( GetPlayer )][trait|E]"
 RICE_trans_saharan_merchant_trait_gain_tooltip:0 "#weak 你曾在非洲贸易路线上签署过#V [GetPlayer.MakeScope.Var('RICE_trans_saharan_merchant_success_count').GetValue]#!贸易协定。你签的越多，越有可能获得[GetTrait('RICE_trans_saharan_merchant').GetName( GetNullCharacter )][trait|E]。#!"
 RICE_trans_saharan_number_of_successes_tooltip:0 "#weak 你曾在非洲贸易路线上签署过#V [GetPlayer.MakeScope.Var('RICE_trans_saharan_merchant_success_count').GetValue]#!贸易协定。#!"
 RICE_sus_sijilmasa_legend_name:0 "撒哈拉之门"
 RICE_sus_sijilmasa_legend_desc:0 "“撒哈拉，开门！”每每看到[title.GetNameNoTier]，看到这片大沙漠中最大的、最繁华的绿洲，人们总会情不自禁地说出这句话。啊，伟大的[ruler.GetDynastyName]；啊，伟大的对[ruler.GetTitledFirstName]！你的臣民歌颂你的丰功伟绩，过路的旅人称颂你的传说故事；是你，化腐朽为神奇，让荒原变林海。除了[ruler.GetDynastyName]，除了[ruler.GetTitledFirstName]，谁能为此般神迹！"
 RICE_sus_sijilmasa_legend_chapter_opening_new_title:0 "有人说，“千里马常有，而伯乐不常有。”而那些跨撒哈拉商人则说，“绿洲常有，而[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]不常有。”[GetGeographicalRegion('world_africa_sahara').GetNameNoTooltip]里有的是绿洲，怎么偏偏是[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]成了那“千里马”？这都要感谢那“伯乐”，感谢[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]！没有您，就没有[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]！"
 RICE_sus_sijilmasa_legend_chapter_motivation_new_title:0 "在很久很久以前，[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]动荡不安，群雄相争，直到[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的祖先呕心沥血、披荆斩棘统之为一。当时，他的敌人发出诅咒，“……代之后，而族必亡”。据说，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]就是那应咒的一代。但[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]并不相信什么诅咒，[ROOT.Legend.GetProtagonist.GetSheHe]相信，自己绝不会为那虚无缥缈的诅咒所束缚！[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]是对的，[ROOT.Legend.GetProtagonist.GetSheHe]将这里建成了[GetGeographicalRegion('world_africa_sahara').GetNameNoTooltip]的“世界渴望之城”！"
 RICE_sus_sijilmasa_legend_chapter_famous_deed_new_title:0 "在[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的领导下，济兹河水被引来灌溉田地，城墙拔地而起，保护[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]免受攻击。[ROOT.Legend.GetProtagonist.GetSheHe]保护和发展商业，使[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]声名远扬，连[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]的货币都成了撒哈拉内外的硬通货。这里，就是沙漠中的一颗明珠，就是沙漠中的人间天堂，就是那叙利亚人赞美诗中的“圣子的珍珠”！"
 RICE_sus_sijilmasa_legend_chapter_extra_deed_new_title:0 "[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]的领袖，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]，你的人民向你致敬！一位创业者，伟大的领袖，伟大[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]的[ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip]！"
 RICE_sus_sijilmasa_legend_chapter_conclusion_new_title:0 "虽只是口口相传，[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTierNoTooltip]的雄美壮丽仍然美名远扬。沙漠中的明珠，[GetGeographicalRegion('world_africa_sahara').GetNameNoTooltip]中的“世界渴望之城”，这都是[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的恩情！不论谁来问，当地人都会心怀感激地说出对[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]赞美！"
