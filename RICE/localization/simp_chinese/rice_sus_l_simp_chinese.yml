 sus.0001.desc:0 "通过与[merchant.GetFirstName]和[merchant.GetHerHis]的商队一起旅行，我获得了其他方式无法遇到的商机。\n\n在[ROOT.Char.GetCurrentLocation.GetName]，我们能够与在那里遇到的商人达成有利的贸易协议。我可以照单全收，也可以冒险讨价还价，但他们也可能拒绝，这样交易将会落空。"
 sus.0001.a:0 "最初的协议毫无问题。"
