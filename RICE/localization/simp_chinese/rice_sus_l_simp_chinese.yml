 sus.0010.t:0 "锡吉勒马萨的全新开始？"
 sus.0010.desc:0 "虽然[abu_muntasir.GetTitledFirstName]，也被称为#V 阿布·蒙塔西尔#!，是[sijilmasa_county.GetNameNoTier]的一个无情的暴君，但同时又手腕高明，他使治下人民保持团结，并使其达到经济和文化的顶峰。可惜自从他多年前去世后，[sijilmasa_county.GetNameNoTier]就被无尽内耗而困扰；不仅因为他的后继无人，而且锡吉勒马萨因其混乱的宗教与文化而分裂并内斗\n\n直到现在！\n\n我们已经厌倦了这种毫无意义的争执。不管是通过阴谋、财富、力量，还是全部组合起来，我已经说服了这些争执中的各方坐在一起谈判达成一个脆弱的和平。尽管我们有分歧，但我们把这片绿洲当作家园，我们不同的出身可以再次为城市的力量奠定基础。"
 sus.0010.a:0 "我们可以而且必须重建[sijilmasa_county.GetNameNoTier]"
 sus.0011.t:0 "锡吉勒马萨的全新开始？"
 sus.0011.desc:0 "很久以前，当无冷酷无情且颇有能力的[abu_muntasir.GetTitledFirstName]，也被称为#V 阿布·蒙塔西尔#!，统治[sijilmasa_county.GetNameNoTier]时，这个城市被撒哈拉西部所羡慕的。在这个#italic 伊斯兰世界#!的前哨，由不同教派和文化的民族组成并建立了一个繁荣的城市。然而随着他的死亡，这座城市也陷入了困境，为内耗和教派纷争所困扰。\n\n然而有些人宣称，现在局势正在发生变化，[sijilmasa_county.GetNameNoTier]正在缓慢但确凿地恢复旧日荣光。[sijilmasa_ruler.GetTitledFirstName]已经将这些争斗中的各方聚集在一起，继续和平谈判。然而[sijilmasa_ruler.GetHerHis]是否能够恢复绿洲的强权？或者它是否已经衰弱到足以成为该地区其他崛起势力的目标？这还有待观察……"
 sus.0011.a:0 "我们得看看[sijilmasa_county.GetNameNoTier]的情况"
 sus.0012.t:0 "锡吉勒马萨的造币厂"
 sus.0012.desc:0 "[sijilmasa_county.GetNameNoTier]位于一个相当重要的战略位置，至少在经济上如此。很多跨撒哈拉的贸易都要经过这个城市，这意味着很多在西非开采的黄金都要运到这里，更不用说附近的当地银矿了。我和[sijilmasa_county.GetNameNoTier]的其他领导人已经为在这里建立一个铸币厂奠定了基础。用西非的黄金和当地的白银制作的这些钱币将在整个北非和其他地区使用。"
 sus.0012.a:0 "这将提高该城在全世界的地位。"
 sus.0013.t:0 "锡吉勒马萨的造币厂"
 sus.0013.desc:0 "自古以来，[sijilmasa_county.GetNameNoTier]一直是马格里布西部跨撒哈拉贸易路线上的一个重要站点。很多在西非开采的黄金都流经这里，而且它还位于在一些银矿附近。因此，[sijilmasa_ruler.GetTitledFirstName]主动在[sijilmasa_county.GetNameNoTier]建立一个铸币厂，这一点并不奇怪。关于这里铸造的钱币的质量，已经传得沸沸扬扬。"
 sus.0013.a:0 "[sijilmasa_county.GetNameNoTier]的繁荣，使其成为军阀们的目标。"
 sus.0014.t:0 "济兹河沿岸的水利工程"
 sus.0014.desc:0 "[sijilmasa_county.GetNameNoTier]的聚居地位于济兹河沿岸，几个世纪以来，当地一直有一些水利工程来扩大城市的供水量。在几位地方长老的敦促下，我决定投资协调这些工程项目，并带头开展新的工程项目，以最大限度地利用现有的潜在水资源。这些项目包括水坝、运河、地下管道和改变齐兹河本身的流向等等。"
 sus.0014.a:0 "毕竟，水赋予了这些干旱的土地生命。"
 sus.0015.t:0 "济兹河沿岸的水利工程"
 sus.0015.desc:0 "[sijilmasa_county.GetNameNoTier]是马格里布西部最大的城市之一，长期以来一直依靠齐兹河和其他附近的水源满足其用水需求。现在[sijilmasa_ruler.GetTitledFirstName]正在监督该城市水资源的巨大扩张，加强任何现有的水利工程，并实施新的项目。这将为该城市的居民提供更多的水，并使其在未来几代人中不断成长和繁荣。"
 sus.0015.a:0 "这座城市的繁荣与日俱增。"
 sus.0016.t:0 "锡吉勒马萨周围的城墙"
 sus.0016.desc:0 "虽然[sijilmasa_county.GetNameNoTier]本身有一些多年来建立的防御网络，但有许多较小的郊区、农场和市场区域在城市核心区之外。这些外面的一些地区在一定程度上受到#italic 克萨#!（一种北非形式的“设防村庄”）的保护，但我和其他社区领导人决定需要一种更永久和持久的保护形式。\n\n因此，我已下令在绿洲本身的大部分地区建造围墙，并以几个大门作为进入锡吉勒马萨的入口。这些雄伟的防御工事与锡吉勒马萨这样繁荣的绿洲相称，将起到保护、威慑和激励的作用。"
 sus.0016.a:0 "很好！"
 sus.0017.t:0 "锡吉勒马萨周围的城墙"
 sus.0017.desc:0 "几代人以来，[sijilmasa_county.GetNameNoTier]一直是连接西非和撒哈拉与摩洛哥其他地区的门户。然而，相当长的一段时间以来，当地人认为该地区现有的防御设施是不够的。\n\n因此，在[sijilmasa_ruler.GetTitledFirstName]和其他社区领导人的指导下，已经建立了一个更坚固的防御系统——包括一堵墙和几个大门——以包围锡吉勒马萨所在的绿洲的大部分地区。锡吉勒马萨现在得到了更好的保护，游客可以敬畏地看着保护这个繁荣的绿洲的强大防御系统。"
 sus.0017.a:0 "有意思……"
 sus.0018.t:0 "一个跨撒哈拉地区的港口"
 sus.0018.desc:0 "最近大量的人从其他地方来到北非的偏远沙漠。有些是难民或逃亡者，无论是通过躲避战争还是被迫勒令离开，他们被敌人称为异端。还有一些是冒险家、雇佣兵和大胆的商人，他们寻求财富和名声。\n\n我已经努力招募和吸纳这些人中的许多人和他们的家人在[sijilmasa_county.GetNameNoTier]定居。尽管在过去的几个世纪里，地中海地区发生了很多动荡，但地中海和撒哈拉以南非洲之间的贸易实际上正在增加，而[sijilmasa_county.GetNameNoTier]正迅速成为这些贸易网络的一个主要停靠点。从现在开始，[sijilmasa_county.GetNameNoTier]的繁荣程度将超出我们最疯狂的想象！"
 sus.0018.a:0 "这些定居者拥有不同的思想和技能，他们将帮助这个城市繁荣发展。"
 sus.0019.t:0 "一个跨撒哈拉地区的港口"
 sus.0019.desc:0 "最近来自其他地方的冲突促使许多人在北非寻求他们的财富。由于[sijilmasa_county.GetNameNoTier]努力吸纳他们，大量的这些人——从战争难民到宗教异见者到冒险家和商人，都决定在[sijilmasa_ruler.GetTitledFirstName]定居。\n\n尽管在过去的几个世纪里，地中海地区发生了很多动荡，但地中海和撒哈拉以南非洲之间的贸易实际上正在增加，而[sijilmasa_county.GetNameNoTier]正迅速成为这些贸易网络的一个主要停靠点。很明显，有远见的[sijilmasa_ruler.GetFirstName]知道，为[sijilmasa_ruler.GetHerHim]投资，为潜在的辉煌未来奠定基础是很重要的。"
 sus.0019.a:0 "也行[sijilmasa_county.GetNameNoTier]有一天会成为一个繁荣的转口港"
