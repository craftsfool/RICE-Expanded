l_simp_chinese:
 RICE_sus_sijilmasa_mint_decision_requirement_desc:0 "只能通过[decision|E]来#V 建立锡吉勒马萨矿场#!，不过需要完成前置决议#V 解决锡吉勒马萨的冲突#!"
 game_concept_sijilmasa_prosperity:0 "锡吉勒马萨的繁华"
 game_concept_sijilmasa_prosperity_desc:0 "锡吉勒马萨的[county|E]常驻一个[county_modifier|E]，名为$game_concept_sijilmasa_prosperity$，代表其作为西马格里布最重要贸易中心之一的经济和政治影响力。\n\n这个常驻加成有不同的级别，为了提高它的级别，你需要采取各种[decisions|E]来改善锡吉勒马萨，如果你是867开局游玩，那么将要求你完成#V 建立锡吉勒马萨矿场#!、#V 改道并建立济兹河坝#!、#V 在塔菲拉勒特绿洲筑墙#!。除了增加$game_concept_sijilmasa_prosperity$，以上任务还提供各种加成。"
 game_concept_trans_saharan_merchant:0 "跨越撒哈拉的商人"
 game_concept_trans_saharan_merchants:0 "跨越撒哈拉的商人"
 game_concept_trans_saharan_merchants_desc:0 "如果你在[GetGeographicalRegion('world_africa').GetName]拥有领土，将会有$game_concept_trans_saharan_merchant$时不时地在你的[court|E]出现。你可以选择利用他们的关系，这将为你提供一个[character_modifier|E]，并提高你的[income|E]，并给予其他奖励，这取决于他们来自哪个文化或种族群体（柏柏尔、阿拉伯、西非或犹太人）。即使你没有邀请他们进入你的宫廷，你也可以获得这些奖励。\n\n#V 跨撒哈拉贸易#!的家族传承有一些[dynasty_perks|E]可以加强这一机制，第一个即#V 沙漠之舟#!，可以增加这些事件的触发机会。第三个即#V 黄金与盐#!，可以解锁[decision|E]#V “跨撒哈拉商人网络”#!，在短时间内增加这些事件的触发几率，同时提供其他经济奖励。"
 building_type_RICE_sus_argan_forest_01:0 "摩洛哥坚果森林"
 building_type_RICE_sus_argan_forest_01_desc:0 "摩洛哥坚果树是摩洛哥南部特有的一种树，具有广泛的实际用途。"
 building_RICE_sus_argan_forest_01:0 "摩洛哥坚果森林"
 building_RICE_sus_argan_forest_01_desc:0 "摩洛哥坚果树是摩洛哥南部某些地区特有的一种特殊树木。几个世纪以来，当地人用其木材和果实做柴火、食用、榨油等等。这棵树还吸引了山羊，它们会爬上树吃果实；当这些果实被吐出或排泄出来时，它们就更容易被加工。"
 building_RICE_sus_argan_forest_02:0 "摩洛哥坚果树林"
 building_RICE_sus_argan_forest_02_desc:0 "在这个地区，摩洛哥坚果树现在正以一种更加系统和有组织的方式进行管理，鉴于其稀有性，当地人可以从其产品中获得更大的利润。"
 building_RICE_sus_argan_forest_03:0 "阿尔甘花园"
 building_RICE_sus_argan_forest_03_desc:0 "整个地区都可以找到摩洛哥坚果森林，由整个村庄维护并用于各种目的，从本地使用到出口到国外。因此这些树木带来了很多财富。"
 building_type_RICE_sus_sijilmasan_mints_01:0 "锡吉勒马萨铸币所"
 building_type_RICE_sus_sijilmasan_mints_01_desc:0 "锡吉勒马萨连接着马格里布和西非，那里开采着大量的黄金。当地统治者利用流经这里的大量黄金，将锡吉勒马萨变成一个铸币中心。这里生产的钱币因其质量而闻名整个北非。"
 building_RICE_sus_sijilmasan_mints_01:0 "$building_type_RICE_sus_sijilmasan_mints_01$"
 building_RICE_sus_sijilmasan_mints_01_desc:0 "$building_type_RICE_sus_sijilmasan_mints_01_desc$"
 RICE_sus_draa_dates:0 "德拉山谷的枣园"
 RICE_sus_draa_dates_desc:0 "德拉谷是摩洛哥的枣篮，里面盛产大量多汁的枣子，几代人在这里种植了不同品种的海枣。"
 RICE_sus_sijilmasa_prosperity_0:0 "[sijilmasa_prosperity|E]：不佳（0）"
 RICE_sus_sijilmasa_prosperity_0_desc:0 "自从冷酷无情且颇有能力的领主阿布·蒙塔西尔于公元823年去世后，锡吉勒马萨一直遭受着政治不稳定的困扰。他的后人之间为了权利争执不休，不断地从一个继承人换成另一个继承人。因此该地区的经济和生活水平都在下降。"
 RICE_sus_sijilmasa_prosperity_1:0 "[sijilmasa_prosperity|E]：低（1）"
 RICE_sus_sijilmasa_prosperity_1_desc:0 "锡吉勒马萨的未来看起来很有希望，因为起领主大力发展城市的基础设施，并将其贸易网络扩展到整个撒哈拉地区。虽然这需要时间，但该地慢慢的步入正轨。"
 RICE_sus_sijilmasa_prosperity_2:0 "[sijilmasa_prosperity|E]：中等（2）"
 RICE_sus_sijilmasa_prosperity_2_desc:0 "随着经济的迅速发展，锡吉勒马萨的人们生活变得滋润。商人们开始涌向这座城市，一些有学识、有技能的人在这里定居，他们之间有各种背景。"
 RICE_sus_sijilmasa_prosperity_3:0 "[sijilmasa_prosperity|E]：高（3）"
 RICE_sus_sijilmasa_prosperity_3_desc:0 "锡吉尔马萨有段美好时光，作为马格里布西部的一个主要贸易纽带，成群结队的商人经常经过这个城市，而且它正迅速成为一个主要的学术中心。"
 RICE_sus_sijilmasa_prosperity_4:0 "[sijilmasa_prosperity|E]：宏大（4）"
 RICE_sus_sijilmasa_prosperity_4_desc:0 "锡吉勒马萨确实是世界上令人羡慕的城市。很少有人会质疑否认锡吉勒马萨是跨撒哈拉贸易路线上最丰富和最有影响力的大都市之一。"
 RICE_sus_ziz_hydraulics:0 "锡吉勒马萨的水资源扩大"
 RICE_sus_ziz_hydraulics_desc:0 "扩建济兹河边的一些水利基础设施项目，如水坝、运河等，扩大了锡吉勒马萨居民的用水池，并将济兹河本身以及当地小水域与整个绿洲相连。"
 RICE_sus_ziz_hydraulics_person:0 "济兹河沿岸的水力协调项目"
 RICE_sus_ziz_hydraulics_person_desc:0 " 这位领导人在规划和管理济兹河沿岸的一些重要水利工程方面尽了自己的职责，如水坝、运河、齐兹河改道等等。这条河是马格里布西部锡主要经济中心吉——勒马萨地理环境的重要组成部分。"
 RICE_sus_currently_trans_saharan_networking:0 "与跨撒哈拉的商人建立联系"
 RICE_sus_apprentice_trans_saharan_merchant:0 "跨越撒哈拉的商人"
 RICE_sus_apprentice_trans_saharan_merchant_desc:0 "该角色最初是一名商人，沿着北非和萨赫勒的跨撒哈拉贸易路线做生意。"
 RICE_sus_experienced_trans_saharan_merchant:0 "成功的跨撒哈拉商人"
 RICE_sus_experienced_trans_saharan_merchant_desc:0 "该角色原本是一个商人，沿着北非和萨赫勒的跨撒哈拉贸易路线做生意。他在生意上很有能力，在这段时间里为自己赚取不少财富。"
 RICE_sus_master_trans_saharan_merchant:0 "著名的跨撒哈拉商人"
 RICE_sus_master_trans_saharan_merchant_desc:0 "该角色最初是一个商人，沿着北非和萨赫勒的跨撒哈拉贸易路线做生意，其被认为是当时的大商人之一，在那段时间里积累了巨额财富。"
 RICE_sus_trade_deal_arab_merchants:0 "促进与阿拉伯商人的跨撒哈拉贸易"
 RICE_sus_trade_deal_berber_merchants:0 "促进与柏柏尔商人的跨撒哈拉贸易"
 RICE_sus_trade_deal_jewish_merchants:0 "促进与犹太商人的跨撒哈拉贸易"
 RICE_sus_trade_deal_west_african_merchants:0 "促进与西非商人的跨撒哈拉贸易"
 RICE_sus_wall_tafilalt:0 "塔菲拉勒特绿洲的城墙和城门"
 RICE_sus_wall_tafilalt_desc:0 "塔菲拉勒特绿洲大部分地区都有令人印象深刻的城墙和城门，甚至延伸到锡吉勒马萨地区。这种防御工事有助于保护通过这里的贸易。"
 RICE_sus_lamta_leather:0 "装备兰塔皮盾和盔甲的部队"
 RICE_sus_growing_ksar:0 "克萨的扩建"
 RICE_sus_growing_ksar_desc:0 "这个地区的一个#italic 克萨#!（一种北非形式的“设防村庄”）最近有了很大的扩建。它正在保护当地的贸易路线，并阻止袭击者。"
 RICE_sus_new_foggara:0 "最近建成新坎儿井"
 RICE_sus_repaired_local_foggara:0 "当地的坎儿井被修缮过"
 RICE_sus_expanded_local_foggara:0 "当地的坎儿井扩建"
 RICE_sus_repaired_local_foggara_character:0 "提供资金用于维修当地的坎儿井"
 RICE_sus_expanded_local_foggara_character:0 "为扩建当地的坎儿井提供资金"
 RICE_sus_ksar_maintenance_issues:0 "破旧的克萨"
 RICE_sus_ksar_maintenance_issues_desc:0 "当地人没有足够的资源和资金来维持这个地区的几个#italic 克萨#!（一种北非形式的“设防村庄”）。因此当地的贸易路线更容易受到土匪和袭击者的影响。"
 RICE_sus_midrariya_issues:0 "米德拉里亚的问题"
 RICE_sus_midrariya_issues_desc:0 "米德拉里亚——锡吉勒马萨的中央运河，该运河对于提供清洁水和协助提高土地肥力至关重要，但是当地人目前没有足够的资源来维护它。"
 RICE_sus_sijilmasa_goldsmiths:0 "金匠最近在锡吉勒马萨开店了"
 RICE_sus_sijilmasa_glazed_ceramics:0 "锡吉勒马萨对陶瓷的需求量很大"
 RICE_sus_eating_amlu:0 "吃大量的阿姆鲁"
 RICE_sus_eating_amlu_desc:0 "该角色的厨师有大量的摩洛哥坚果油库存，于是他们将烤杏仁与蜂蜜一起压碎和揉捏并加入摩洛哥坚果油，创造出一种名为#italic 阿姆鲁#!的美味酱料！"
 RICE_sus_sijilmasa_newly_arrived_settlers:0 "锡吉勒马萨的新定居者"
 RICE_sus_sijilmasa_newly_arrived_settlers_desc:0 "一群冒险家、流亡者、商人、难民、受宗教迫害者以及其他人从许多遥远的地方聚集到新兴的城市——锡吉勒马萨。虽然他们是一群被遗弃的人和不受欢迎的人，但他们带来了不同思想和技能。起初他们很难和平共处，但如果他们能学会合作，毫无疑问，他们可以为锡吉勒马萨的未来繁荣播下种子。"
 RICE_sus_resolve_conflicts_in_sijilmasa:0 "解决锡吉勒马萨长期存在的冲突"
 RICE_sus_resolve_conflicts_in_sijilmasa_tooltip:0 "内耗已经困扰锡吉勒马萨太久了！"
 RICE_sus_resolve_conflicts_in_sijilmasa_desc:0 "自从阿布·蒙塔西尔在公元823年去世后，锡吉勒马萨就一直遭受着不断的派系斗争和内耗。许多当地人对此越来越感到厌倦，我认为现在是建立一持久和平的时候。"
 RICE_sus_resolve_conflicts_in_sijilmasa_effect_tooltip:0 "[sijilmasa_prosperity|E]水平不断增加"
 RICE_sus_resolve_conflicts_in_sijilmasa_effect_tooltip_2:0 "解锁以下[decisions|E]：#V 建立锡吉勒马萨矿场#!、#V 改道并建立济兹河坝#!、#V 在塔菲拉勒特绿洲筑墙#!"
 RICE_sus_resolve_conflicts_in_sijilmasa_confirm:0 "是时候召集杰出的当地人会面了"
 RICE_sus_resolve_conflicts_in_sijilmasa_context_tooltip:0 "#emphasis 历史背景：#!阿布·蒙塔塞尔治下的锡吉勒马萨可以说是一个黄金时代。然而，他于公元823年去世后，这座城市的命运就走下坡路，遭受政治分裂和内战的困扰，直到公元870年代才稍有缓和。即便如此，损失已经造成，米德拉尔王朝很快就在公元909年被法蒂玛王朝所灭，尽管该家族的一些成员仍然在法蒂玛王朝的统治下管理着这座城市，直到公元976年。"
 RICE_sus_establish_sijilmasa_mints:0 "建造锡吉勒马萨矿场"
 RICE_sus_establish_sijilmasa_mints_tooltip:0 "下令建造铸币厂，生产钱币"
 RICE_sus_establish_sijilmasa_mints_desc:0 "锡吉勒马萨一方面位于马格里布地区，另一方面位于开采大量黄金的西非地区，使其成为未来造币厂的最佳候选地。"
 RICE_sus_establish_sijilmasa_mints_effect_tooltip:0 "$RICE_sus_resolve_conflicts_in_sijilmasa_effect_tooltip$"
 RICE_sus_establish_sijilmasa_mints_requirement:0 "你的[dynasty|E]已经解锁了[GetDynastyPerk('RICE_trans_saharan_trade_legacy_2').GetName][dynasty_perk|E]"
 RICE_sus_establish_sijilmasa_mints_confirm:0 "做好这方面的准备。"
 RICE_sus_establish_sijilmasa_mints_context_tooltip:0 "#emphasis 历史背景：#!在中世纪时期，锡吉勒马萨因其位于马格里布和西非之间的战略位置，控制了从西非开采的大部分金币的铸造。这些金币（阿拉伯语称为#italic 第纳尔#!）以其纯度而闻名。银币（阿拉伯语称为#italic 第拉姆#!）也大量生产，可能来自当地的银矿。这进一步增加了这座城市作为跨撒哈拉贸易中心的财富。"
 RICE_sus_divert_and_dam_ziz_river:0 "对济兹河进行改道和筑坝"
 RICE_sus_divert_and_dam_ziz_river_tooltip:0 "控制济兹河的流向可能有好处。"
 RICE_sus_divert_and_dam_ziz_river_desc:0 "多年来，锡吉勒马萨的居民不断扩大其水资源。现在我的工程师们提出了几个水利工程的新想法，这将使我们能够更好地控制锡吉勒马萨的齐兹河。这将使可耕地最大化，并为当地人提供更多的水。"
 RICE_sus_divert_and_dam_ziz_river_effect_tooltip:0 "$RICE_sus_resolve_conflicts_in_sijilmasa_effect_tooltip$"
 RICE_sus_divert_and_dam_ziz_river_confirm:0 "让我们协调这些工作。"
 RICE_sus_divert_and_dam_ziz_river_context_tooltip:0 "#emphasis 历史背景：#!根据地理、历史、考古证据，中世纪锡吉勒马萨周边地区拥有相当规模的水利系统，包括运河、水坝、水库、管道等。这一系统在穆拉比特王朝时期及其后不断扩建，使锡吉勒马萨人能够增加可利用的水资源。据当地民间传说，这一系统最著名的部分是提米德林泉，它被一个绰号“黑苏丹”的暴君所毁，导致了这座城市的衰落。"
 RICE_sus_network_with_trans_saharan_merchants:0 "与跨撒哈拉的商人建立网络"
 RICE_sus_network_with_trans_saharan_merchants_tooltip:0 "与当地商人建立更好的关系"
 RICE_sus_network_with_trans_saharan_merchants_desc:0 "许多商人在我们的领土上沿着跨撒哈拉的贸易路线旅行，所以我们应该花时间与他们建立联系。与有兴趣、有抱负的商人建立富有成效的关系可以使我们双方受益。"
 RICE_sus_network_with_trans_saharan_merchants_effect_tooltip:0 "只要[character_modifier|E]持续存在（或有商人产生），在未来5年内，[trans_saharan_merchant|E]将有很大几率在你的宫廷中产生并向你提供一笔生意。这个机会取决于你的[traits|E]、[skills|E]以及其他因素"
 RICE_sus_network_with_trans_saharan_merchants_confirm:0 "是时候建立关系网了！"
 RICE_sus_network_with_trans_saharan_merchants_context_tooltip:0 "#emphasis 历史背景：#!自古以来，贸易路线就纵横交错地穿越撒哈拉沙漠，连接地中海和萨赫勒地区。在古典晚期，骆驼的广泛使用和伊斯兰教的传播促进了这些贸易网络的进一步发展。在这些路线上，最珍贵的两种商品是黄金和盐，不过商人们也交易其他物品，如奴隶和象牙。"
 RICE_network_trans_saharan_decision_region_requirement:0 "在[GetGeographicalRegion('world_africa').GetName]拥有一处[county|E]"
 RICE_sus_network_dynasty_perk_requirement:0 "你的[dynasty|E]已经解锁了[GetDynastyPerk('RICE_trans_saharan_trade_legacy_3').GetName][dynasty_perk|E]"
 RICE_sus_trade_networks_decision_once_requirement:0 "尚未采取[decision|E]"
 RICE_sus_wall_the_oasis:0 "塔菲拉勒特绿洲城墙"
 RICE_sus_wall_the_oasis_tooltip:0 "我们需要在锡吉勒马萨地区周围进行充分的防御。"
 RICE_sus_wall_the_oasis_desc:0 "虽然锡吉勒马萨的防御设施没什么可嘲笑的，但它们还可以进一步改进。当地人建议我们扩大城市的防御工事，以包围塔菲拉勒特绿洲的大部分地区。"
 RICE_sus_wall_the_oasis_effect_tooltip:0 "$RICE_sus_resolve_conflicts_in_sijilmasa_effect_tooltip$"
 RICE_sus_wall_the_oasis_requirement:0 "你的[dynasty|E]已经解锁[GetDynastyPerk('RICE_trans_saharan_trade_legacy_4').GetName][dynasty_perk|E]"
 RICE_sus_wall_the_oasis_confirm:0 "理应如此"
 RICE_sus_wall_the_oasis_context_tooltip:0 "#emphasis 历史背景：#!随着锡吉勒马萨因贸易而兴盛，一套巍峨的防御体系逐渐建立起来，环抱了塔菲拉勒特绿洲的大半。虽已风化破败，但这些古老的城墙和城门，有的至今犹存。其中最为完好且著名的城门，便是#italic 非斯门#!，这是马林王朝为纪念他们在非斯的胜利而于13世纪所建。"
 RICE_sus_attract_settlers_to_sijilmasa:0 "吸引定居者到锡吉勒马萨"
 RICE_sus_attract_settlers_to_sijilmasa_tooltip:0 "锡吉勒马萨是一个很有前途的贸易地点……"
 RICE_sus_attract_settlers_to_sijilmasa_desc:0 "最近，各种冲突促使许多人从其他地方逃到摩洛哥。也许我可以鼓励其中一些冒险家、商人、难民和更多的人在锡吉勒马萨沙定居。尽管他存在分歧，但但他们的不同观点可以帮助城市发展和繁荣。锡吉勒马萨作为一个潜在的贸易中心可是有巨大前景，所以以贸易这种方式主导撒哈拉的贸易路线将是相当有利的。"
 RICE_sus_attract_settlers_to_sijilmasa_effect_tooltip_1:0 "为[sijilmasa_county.GetNameNoTier]解锁[sijilmasa_prosperity|E]机制"
 RICE_sus_attract_settlers_to_sijilmasa_effect_tooltip_2:0 "$RICE_sus_resolve_conflicts_in_sijilmasa_effect_tooltip_2$"
 RICE_sus_attract_settlers_to_sijilmasa_confirm:0 "让我们开始行动吧！"
 RICE_sus_attract_settlers_to_sijilmasa_context_tooltip:0 "#emphasis 历史背景：#!据说，锡吉勒马萨是8世纪由逃离穆斯林世界其他地方冲突的哈瓦利吉派难民建立的。这座城市迅速吸引了各种文化和宗教的人们，这既是一种紧张的源头，也为城市的未来繁荣奠定了基础。这座城市的第一位选举出来的领导人是伊萨·本·马齐德·阿斯瓦德，他后来被指控贪污并被当地人处决，由阿布·盖西姆接替，并建立了米德拉尔王朝。"
 RICE_sus_attract_settlers_to_sijilmasa_req:0 "你的[dynasty|E]已经解锁[GetDynastyPerk('RICE_trans_saharan_trade_legacy_1').GetName][dynasty_perk|E]"
