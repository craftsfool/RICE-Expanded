 RICE_tarim_basin_gift_silk_road_ideas_1:0 "从丝绸之路沿途文明中得到的小灵感"
 RICE_tarim_basin_gift_silk_road_ideas_1_desc:0 "该角色最近与来自丝绸之路沿途的有学识外族学者成员进行了一些富有成效的交谈。这些学者最终帮助这个橘色在生活的各个方面激发了一些想法。"
 RICE_tarim_basin_gift_silk_road_ideas_2:0 "从丝绸之路沿途文明中得到的重要灵感"
