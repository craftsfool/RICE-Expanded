 tarim_basin.0053.a:0 "xxxxx"
 tarim_basin.0054.t:0 "张议潮逝世"
 tarim_basin.0054.desc:0 "[yichao.GetFullNamePossessive]的英勇领导将被世代铭记。然而现在他已去世。作为中华文明的真正拥护者，他在几十年前就带领敦煌人民推翻了吐蕃，将他们的土地恢复到盛唐的版图。如今敦煌地区出现了权力真空，并且有人对他的继承人持怀疑态度。\n\n尽管敦煌的世家来参加张议潮的葬礼，并表示他们尽心尽力地服侍张氏家族，但有传言说，这些世家中的一些人正在密谋自己夺取归义军控制权。没有一个有魅力的领袖来引导人民，这个地区将再次兵戈相见，还是会有另一个像张议潮一样的伟大英雄走上世界历史的舞台？"
 tarim_basin.0054.a:0 "毫无疑问，我们生活在有趣的时代。"
 tarim_basin.0054.tooltip:0 "如果没有一个强有力的拥护者，在中国局势日益不稳定的情况下，归义军的[ruler|E]将不再得到唐廷的任何恩惠和礼物。"
 tarim_basin.0055.t:0 "$tarim_basin.0054.t$"
 tarim_basin.0055.desc:0 "从唐朝传来消息：伟大的[yichao.GetFullName]已经去世了!\n\n[yichao.GetFullNamePossessive]的英勇领导将被世代铭记。然而现在他已去世。作为中华文明的真正拥护者，他在几十年前就带领敦煌人民推翻了吐蕃，将他们的土地恢复到盛唐的版图。如今敦煌地区出现了权力真空，并且有人对他的继承人持怀疑态度。\n\n尽管敦煌的世家来参加张议潮的葬礼，并表示他们尽心尽力地服侍张氏家族，有传言说，这些世家中的一些人正在密谋自己夺取归义军控制权。没有一个有魅力的领袖来引导人民，这个地区将再次兵戈相见，还是会有另一个像张议潮一样的伟大英雄走上世界历史的舞台？"
 tarim_basin.0055.a:0 "$tarim_basin.0054.a$"
 tarim_basin.0056.t:0 "xxxxx"
 tarim_basin.0056.desc:0 "xxxxx"
 tarim_basin.0056.a:0 "xxxxx"
 tarim_basin.0057.t:0 "朝廷使节团"
 tarim_basin.0057.desc:0 "今天大唐朝廷的一个官方使节团来见我和我的家人，我们以及几位重要的官员和将军都以最大的热情迎接使团，因为我们接受了朝廷的慷慨援助。\n\n"
 tarim_basin.0057.desc.gold:0 "这一次，唐朝给了我们几个大箱子，里面装满了丝绸、黄金和其他珍贵的奢侈品。这些都是赠送给我们！"
 tarim_basin.0057.desc.troops:0 "这一次，唐朝已经指示驻扎在归义军附近的节度使派兵过来协助我们保卫和维持边境治安。这个地区的政治局势总是不确定的，所以在发生战争时有更多的士兵总是有帮助的。"
 tarim_basin.0057.desc.prestige:0 "这一次，唐朝决定授予我以及我的一些官员和将军各种头衔和职务，虽然都是虚职，但是朝廷对我们的承认还是很重要的。"
 tarim_basin.0057.desc.economic:0 "这一次，唐朝告知我们，他们已经颁布了一些与我们地区相关的经济和货币政策。希望这些政策能够协助我们地区的发展，并确保人民能够过上繁荣和幸福的生活。"
 tarim_basin.0057.desc.military:0 "这一次，唐朝告知我们，其他节度使击败西域诸国或者平定西域诸国的消息。我们也得到了军事情报以及军事物资和装备，还有来自中原的幕僚。"
 tarim_basin.0057.desc.political:0 "这一次，唐朝希望向我们给予归义军官员各种政治任命，以及带来一些人才。他们希望这些能够帮助我们处理地方事务。"
 tarim_basin.0057.desc.conclusion:0 "\n\n使者卷起卷轴总结说“因此，皇帝已经下令”。\n虽然我们与唐朝的关系不是最好的，甚至可能很紧张，但我们很高兴他们愿意与我们合作，帮助我们维持各地区的繁荣。"
 tarim_basin.0057.a:0 "我们对朝廷的帮助表示感谢。"
 tarim_basin.0058.t:0 "准备一日游"
 tarim_basin.0058.desc:0 "现在是我适当访问敦煌附近的月牙泉的一个好时机。在那里花上一天时间放松一下的机会并不是经常有的。\n\n总之，我已经做了准备工作，现在是时候去那里了。"
 tarim_basin.0058.a:0 "我都等不及了！"
 tarim_basin.0059.t:0 "月牙湖"
 tarim_basin.0059.desc:0 "今天，我终于来到了敦煌的月牙泉放松自己。关于这个湖是如何形成的，有很多传说，有人说是一位中国将军为他的部队挖了一口井，所以创造了这个湖；还有人说是[ROOT.Char.GetFaith.HighGodName]的功劳，甚至还有其他许多不同的传说。\n\n目前我已经看到有相当多的人因为和我一样的原因来到这里。在这样一个大湖，人们可以做很多活动。例如，我可以去附近那个会唱歌的沙丘——鸣沙山，敬畏地听着从沙子里发出的“音乐”。我还可以去附近的[ROOT.Char.GetFaith.HouseOfWorshipPlural]，在一个宁静的环境中祈祷。当然我还应该花时间在湖边，饮用湖水，欣赏鱼，在湖边野餐。\n\n如此多的选择...现在先做什么？"
 tarim_basin.0059.a:0 "去鸣沙山吧！"
 tarim_basin.0059.b:0 "去[ROOT.Char.GetFaith.HouseOfWorshipPlural]吧！"
 tarim_basin.0059.c:0 "在这里休息是首要目的！"
 tarim_basin.0060.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 tarim_basin.0060.desc:0 "多年来，[GetTitleByKey('k_hexi').GetNameNoTier]在无能的统治者和所谓的敦煌精英之间的争吵与阴谋下陷入衰退。\n\n因此我不得不夺取归义军的控制权，以确保我们能够在西域的混乱中生存下来。凭借我的经验和技能，我已经开始采取措施稳定内政，控制吵闹的敦煌精英，加强与邻国的友好关系，并确保边界安全。通过我的领导，归义军将在这个动荡的边疆中成为文明的堡垒。\n\n唐朝已经自身难保，现在是归义军自己掌握命运的时候了！"
 tarim_basin.0060.a:0 "我已经安抚了该地区，但工作仍将继续。"
