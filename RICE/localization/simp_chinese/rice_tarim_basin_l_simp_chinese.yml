 tarim_basin.0246.info:0 "#emphasis 历史背景：#!耶律乙辛是11世纪的辽朝大臣，在道宗耶律洪基时期掌权。他因为辩术与学问受到皇帝恩宠，但当他作为朝中要员开始扩大其对朝政的掌控时，并大肆腐败。\n\n皇后萧观音与太子耶律濬是他的主要政敌。在1075年，他骗皇后作了一首乱情诗（《十香词》），并以此为据诬陷皇后与宫中伶人赵惟一通奸。皇后迅速被赐死，太子也被废并于1077年处死。\n\n耶律乙辛的倒台开始于他对道宗之孙——未来的天祚帝耶律延禧的失败刺杀。道宗因此察觉耶律乙辛的腐败并将他下狱。1083年，耶律乙辛试图叛逃宋朝，但事败伏诛。在1102年，他的家人与杀害萧观音皇后的同谋一并被处决，本人也被开棺戮尸。"
