 RICE_tarim_basin_fight_cattle_good_county_desc:0 "该地区的一位统治者最近主办了一系列斗牛比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，这片土地将拥有良好的作物产量和肥硕的动物群。"
 RICE_tarim_basin_fight_horses_good_county_desc:0 "该地区的一位统治者最近主办了一系列斗马比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，这片土地将拥有良好的作物产量和肥硕的动物群。"
 RICE_tarim_basin_fight_camels_good_county_desc:0 "该地区的一位统治者最近主办了一系列斗骆驼比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，这片土地将拥有良好的作物产量和肥硕的动物群。"
 RICE_tarim_basin_fight_goats_good_county_desc:0 "该地区的一位统治者最近主办了一系列斗山羊比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，这片土地将拥有良好的作物产量和肥硕的动物群。"
 RICE_tarim_basin_fight_cattle_great_county_desc:0 "该地区的一位统治者最近主办了一系列斗牛比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，这片土地上的庄稼和畜群将迎来巨大的财富和繁荣！"
 RICE_tarim_basin_fight_horses_great_county_desc:0 "该地区的一位统治者最近主办了一系列斗马比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，这片土地上的庄稼和畜群将迎来巨大的财富与繁荣！"
 RICE_tarim_basin_fight_camels_great_county_desc:0 "该地区的一位统治者最近主办了一系列斗骆驼比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，这片土地上的庄稼和畜群将迎来巨大的财富与繁荣！"
 RICE_tarim_basin_fight_goats_great_county_desc:0 "该地区的一位统治者最近主办了一系列斗山羊比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，这片土地上的庄稼和畜群将迎来巨大的财富与繁荣！"
