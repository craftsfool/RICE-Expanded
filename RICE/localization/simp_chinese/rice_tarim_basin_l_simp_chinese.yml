 RICE_dunhuang_start_intro.zhang:0 "#emphasis 历史背景：#!8世纪中叶安史之乱后，唐廷无法维持西域边界防御，吐蕃趁机征服了中亚的大部分前唐领土，包括敦煌（或沙州）。848年，张议潮乘吐蕃内乱之机，率众驱逐沙州的吐蕃镇将，经多年潜心运营逐步收复唐朝故土。\n\n因为节度使质子制度，张议潮主动派遣其兄张议潭和州人李明达、李明振，押衙吴安正等二十九人入朝。咸通八年（867年），其兄张议潭于长安病逝，六十九岁的张议潮离开沙州，前往长安为质。张议潮入京后，遥领河西节度使，以张议潭之子张淮深担任留后。\n\n张议潮入京为质后，因唐廷深陷内耗无力支援归义军。张淮深在任期间多次击败甘州回鹘。大顺元年（890年）二月廿二，张淮深死，死因成谜。"
 RICE_dunhuang_start_intro.cao:0 "#emphasis 历史背景：#!曹氏虽是敦煌世家，但其最有名的成员曹议金乃是粟特后裔，和中原曹氏的关系无从考证。不过曹议金可能想强调其与更著名的曹操的联系，以提高其直系亲属的声望。\n\n无论如何，曹议金原为张议潮任内高官，并且为张议潮外孙婿。不过914年张承奉卒，他篡夺了张家的权力，但与其他敦煌氏族的政变不同，他的政变更为成功和持久。\n\n曹议金继承了归义军时权力和领地大为缩减。尽管如此，他还是一个能干的统治者：曹氏归义军政权吸取了张承奉失败的教训，他们努力改善与周边少数民族政权的关系，通过联姻等办法与甘州回鹘、西州回鹘、于阗等少数民族政权友好往来，以图共存。曹议金发展农业，赞助重大佛教宗教项目等等。935年他去世后，他的家族一直掌权，直到1036年归义军降于西夏。"
 RICE_dunhuang_start_intro.suo:0 "#emphasis 历史背景：#!敦煌索氏是敦煌最古老的望族之一，是晋代学者和官员索靖（239‑303年）的后裔，他是中国书法史上最重要的人物之一。\n\n有了这样一个显赫的血统，索氏被认为是最有影响力的敦煌望族之一，一份当代资料将索氏列为敦煌主要家族中的第一等级，许多人在张议潮归义军中担任要职。其中，索忠顗为张议潮的亲随；索勋为张议潮的女婿。\n\n张议潮的侄子和继承人张淮深在890年死因不明。关于他的死亡，一个主要观点是他被索勋所杀，也许是和张议潮另一个儿子张淮鼎一起，因为这两个人可能在张议潮死前共享一段时间的权力。索勋又独自统治了几年，直到他自己在894年的一次反政变中被李明振的儿子们杀死，李明振是张议潮的另一个女婿。\n\n尽管如此，索氏家族仍在敦煌政治中发挥着作用。例如他们的成员之一索子权，在956年率领一个重要的使节团访问于阗国王。"
 RICE_dunhuang_start_intro.li:0 "#emphasis 历史背景：#!陇西李氏是李氏家族的一个分支，位于现在的甘肃省。他们的后裔包括著名的汉朝将军李广、他的孙子李陵，以及唐廷先祖。在敦煌，几个世纪以来，他们在该地区的政治中发挥了重要作用。例如李广后裔李暠（同时被唐朝皇室尊为先祖）建立了短命的西凉，从400年到421年统治着敦煌。\n\n陇西李氏是敦煌起义军张议潮及其家族的坚定支持者。当时，他们最主要的代表人物是李明振，他是张议潮的女婿之一。他曾一度担任张议潮的使者，利用他所谓的与唐朝皇帝的共同祖先来提高他的可信度，并说服他们给张议潮一个梦寐以求的#italic 节度使#!或者兵部尚书头衔。\n\n李明振的家属在敦煌也有重要作用，例如他的两个兄弟在归义军中担任要职，其中一个兄弟李明达在他前往唐朝时陪同他。同时在李明珍于890年去世后，他的四个儿子将对索勋发动政变，将该地区恢复为张氏统治。"
 RICE_dunhuang_start_intro.zhai:0 "#emphasis 历史背景：#!公元6世纪，翟氏已在敦煌显贵。唐初642年，敦煌翟氏的翟通，资助开凿莫高窟第220窟。该洞是莫高窟已知最早的仅作为家族祠堂供奉的洞窟之一，也是为数不多的能够比较可靠地确定年代的洞窟之一。三百年之间翟氏后人多次重建洞窟。\n\n在张议潮统治时期，敦煌翟氏显赫人物是翟法荣，他是一名僧医，被敦煌人称之为“医王”。曾任河西地区佛教界的负责人。他的一个亲戚翟信（或翟华信）后来成为归义军中小官。\n\n翟信之子是翟氏最有名的后裔，翟通第九代孙翟奉达。翟奉达是五代时期沙州曹氏归义军中的重要人物，他以学识渊博而著称，尤其是在天文学方面，曾私自制作日历。"
 RICE_dunhuang_start_intro.yin:0 "#emphasis 历史背景：#!至少从4世纪开始，阴氏就是敦煌望族之一。在前凉（320‑376年）期间，惹恼了前凉郡公张轨，导致该家族的一个重要成员阴鉴被赐死，而阴鉴的弟弟阴澹曾任敦煌太守。\n\n几个世纪以来，阴氏继续在敦煌发展，参与了该地区的政治。例如在武则天统治时期，他们是武则天的坚定支持者；据传说阴家的一个子孙梦见了各种吉兆，肯定了武则天统治的合法性。\n\n到了归义军时期，他们在协助张议潮从吐蕃手中夺回敦煌也发挥了作用。例如张议潮的女婿阴文通是他的主要将领之一，该家族的另一个成员阴吉峰后来成为凉州太守。"
 RICE_dunhuang_start_intro.zhang_wenche:0 "#emphasis 历史背景：#!张文彻是一位诗人，在公元887年奉归义军节度使张淮深之命去率领一批使节前往唐朝的两位官员之一，另一位是宋闰盈。\n\n使节们的任务是要求唐廷正式授予归义军重要的头衔——#italic 节度使#!，并在该地区政治局势恶化的情况下，使其统治合法化。当唐廷对此拖延了数周后，使节们发生了争执，宋闰盈认为他们必须耐心等待；张文彻则认为这毫无意义，而且他还侮辱张淮深是个无能的太守，不配拥有这个称号。不管怎么说这群人都是空手而归。\n\n有一种说法是，张文彻是在892年真正下令刺杀张淮深的人，而不是后来篡权的索勋。但是张文彻成为后来的归义军节度使张承奉的宰相，并帮助说服张承奉在唐朝灭亡后于910年自立西汉金山国。但张承奉志大才疏，东西树敌，又为甘州回鹘所仇视，公元911年，张承奉被甘州回鹘击败，张承奉由西汉金山国白衣天子改称敦煌国天王，成为甘州回鹘可汗的儿皇帝。张承奉之后，归义军被曹议金所据，不过此时张文彻已经去世了。"
 RICE_dunhuang_start_intro.song_runying:0 "#emphasis 历史背景：#!宋闰盈是归义军官员之一，在公元887年奉归义军节度使张淮深之命去率领一批使节前往唐朝的两位官员之一，另一位是张文彻。\n\n使节们的任务是要求唐廷正式授予归义军重要的头衔——#italic 节度使#!，并在该地区政治局势恶化的情况下，使其统治合法化。当唐朝廷对此拖延了数周后，使节们发生了争执，宋闰盈认为他们必须耐心等待；张文彻则认为这毫无意义，而且他还侮辱张淮深是个无能的太守，不配拥有这个称号。不管怎么说这群人都是空手而归。"
 RICE_dunhuang_start_intro.yan:0 "#emphasis 历史背景：#!像敦煌的许多世家一样，在吐蕃从唐朝手中征服河西走廊后，阎家既是合作者又是抵抗者。\n\n这种矛盾的关系也许可以通过该家族最著名的成员，将军阎超的军旅生涯看出来，他在770年代和780年代组织了对吐蕃入侵的抵抗。由于得不到唐朝的援助，他被迫向吐蕃人投降，条件是敦煌不受任何掠夺和破坏。吐蕃人可能因为惧怕阎超，所以他们在阎超前往逻些正式拜见吐蕃赞普的途中毒死了他。\n\n阎英达是张议潮政权中最杰出的宗室成员，在9世纪初，他成为吐蕃人手下最高级别的中国官员。然而他最终为张议潮的起义做出了贡献，并在某个时候被任命为瓜州太守。"
 RICE_dunhuang_start_intro.gao_jinda:0 "#emphasis 历史背景：#!高进达是张议潮起义期间的下属军官。起义成功后，张议潮当即派遣使者，赴京师告捷，当时凉州等地仍控制在吐蕃手中，东道受阻，张议潮所派十队使者，只有高进达护送高僧悟真所率的一支绕过大漠成功入京。\n\n有趣的是，尽管高进达一路上面临着危险，但他的随行人员是一个只有10名士兵的小型护卫队。当时凉州等地仍控制在吐蕃手中，因此高进达队伍不得不使用一条迂回的路线，穿过沙漠到达唐朝境内，这段旅程花了两年时间。\n\n不过他们使节一定是以失望告终的，因为唐廷并没有因为这个消息而显得兴高采烈，只有唐宣宗大力褒奖张议潮等人的忠勇和功勋，擢升他为沙州防御使，也许是对他的成就的礼节性承认。大中五年（851年）八月，张议潮第二次向长安派出使团，以其兄张议潭和州人李明达、李明振，押衙吴安正等二十九人入朝，献上瓜、沙等十一州图籍，京师震惊，追封张议潮为#italic 节度使#!"
 RICE_dunhuang_start_intro.sogdian:0 "#emphasis 历史背景：#!粟特人是一个以贸易技能著称的东波斯民族，在古典和中世纪时期，他们在敦煌和河西走廊有着重要的影响力。许多粟特人在敦煌的上层社会中崭露头角，参与了归义军的军政要务。\n\n例如，安景旻一定是一位颇有地位的粟特人，因为他参与了张议潮的起义，并被任命为归义军的副手之一，从而成为张议潮二把手。\n\n康氏是敦煌另一个著名的粟特望族。他们在张议潮政权中的主要代表包括河东走廊几个城镇的县令康同信和康世俊等官员，康世俊在某个时期担任瓜州的县令。"
 RICE_dunhuang_start_intro.wenmo:0 "作为温末的[ruler|E]，你一开始就有一些[special_troops|E]。\n\n#emphasis 历史背景：#!温末也可以称为六谷部，政权结构成员主要来自河西节度使后裔及其部将后裔、隋末李轨割据时期的凉州四部鲜卑后裔，吐蕃、慕容吐谷浑汉化的后裔的一个政治联盟政权，这些人都是能征善战，便习兵事，本身就是天下精兵，故可在大乱中自保。\n\n温末一直是归义军的眼中钉，他们于884年在凉州建立政权。\n\n游戏中折逋云是虚构的，但是折逋嘉施是真实人物，他于948至949年成为河西节度使控制凉州。1004年厮铎督被西夏攻陷，凉州易手。"
