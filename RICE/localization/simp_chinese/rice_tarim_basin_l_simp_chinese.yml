 tarim_basin.0100.t:0 "为新年准备"
 tarim_basin.0100.desc:0 "每年年初，在春季之前，[culture_scope.GetName]人的习俗是举行各种动物的比赛和游戏，为期七天。这些比赛的结果被用来预测我们畜群的生育能力和近期的收成结果。\n\n今年，我希望能举办一次大型活动。通常情况下，有一些动物在这类比赛中很受欢迎，而今年，我决定重点赞助一种动物之间的比赛："
 tarim_basin.0100.a:0 "牧群"
 tarim_basin.0100.a.tooltip:0 "一个#P 正面#!预测可能会帮助你在丰收有关的事项上取得进展。"
 tarim_basin.0100.b:0 "马"
 tarim_basin.0100.b.tooltip:0 "一个#P 正面#!预测可能会帮助你在军务有关的事项上取得进展。"
 tarim_basin.0100.c:0 "骆驼"
 tarim_basin.0100.c.tooltip:0 "一个#P 正面#!预测可能会帮助你在贸易有关的事项上取得进展。"
 tarim_basin.0100.d:0 "山羊"
 tarim_basin.0100.d.tooltip:0 "一个#P 正面#!预测可能会帮助你在防御有关的事项上取得进展。"
 tarim_basin.0100.tooltip:0 "你将开始为庆祝活动做准备，庆祝活动很快会开始。"
 tarim_basin.0101.t:0 "是时候战斗了！"
 tarim_basin.0101.desc.intro:0 "现在是一年的开始，随着春天的到来，到处都充满了庆祝和欢呼的气氛。当然为期七天的大型动物搏斗和游戏。一些精通传统[culture_scope.GetName]占卜艺术的当地人准备根据比赛的结果对我们的庄稼和动物群的生育能力进行预测。"
 tarim_basin.0101.desc.cattle:0 "\n\n今年我汇集了资源，举办了一场#bold 牛群#!间的连续七天竞技比赛！我们将让本地区最凶猛、最强悍的公牛在血腥的战斗中相互较量，这将是暴力的、残酷的、血腥的，但这将是惊心动魄的一幕!"
 tarim_basin.0101.desc.horses:0 "\n\n今年我汇集了资源，举办了一场#bold 马群#!间的连续七天竞技比赛！这些美丽的马匹，从王国的各个角落带来进行比赛，表演体操，甚至在战斗中相互厮杀。"
 tarim_basin.0101.desc.camels:0 "\n\n今年我汇集了资源，举办了一场#bold 骆驼#!间的连续七天竞技比赛！从农民拥有的虚弱骆驼到外国商人拥有的强壮骆驼，将聚集在一起，在激动人心的戏剧性比赛中相互竞赛和战斗"
 tarim_basin.0101.desc.goats:0 "\n\n今年我汇集了资源，举办了一场#bold 山羊#!间的连续七天竞技比赛！这些顽强、固执的动物将大量聚集在一起，以便我们都能看到它们进行许多令人瞠目结舌、令人瞠目结舌的相互争斗。"
 tarim_basin.0101.desc.conclusion:0 "\n\n这些比赛的结果将是什么？只有一个办法可以找到答案……"
 tarim_basin.0101.a:0 "愿如我们所愿"
 tarim_basin.0102.t:0 "战斗结束"
 tarim_basin.0102.desc.intro:0 "按照惯例，七天之后，年初的传统庆祝活动就会逐渐结束。"
 tarim_basin.0102.desc.cattle:0 "\n\n节日活动的核心当然是上演的动物争斗，特别是我今年上演的#bold 牛群#!之间的许多争斗和游戏，大家都认为他们的表演相当有趣，但问题是占卜者对这些比赛的结果有何看法。"
 tarim_basin.0102.desc.horses:0 "\n\n节日活动的核心当然是上演的动物争斗，特别是我今年上演的#bold 马匹#!之间的许多争斗和游戏，大家都认为他们的表演相当有趣，但问题是占卜者对这些比赛的结果有何看法。"
 tarim_basin.0102.desc.camels:0 "\n\n节日活动的核心当然是上演的动物争斗，特别是我今年上演的#bold 骆驼#!之间的许多争斗和游戏，大家都认为他们的表演相当有趣，但问题是占卜者对这些比赛的结果有何看法。"
 tarim_basin.0102.desc.goats:0 "\n\n节日活动的核心当然是上演的动物争斗，特别是我今年上演的#bold 山羊#!之间的许多争斗和游戏，大家都认为他们的表演相当有趣，但问题是占卜者对这些比赛的结果有何看法。"
 tarim_basin.0102.desc.nothing:0 "\n\n节日活动的核心当然是上演的动物争斗，特别是我今年上演的#bold 动物大混战#!，大家都认为他们的表演相当有趣，但问题是占卜者对这些比赛的结果有何看法。"
 tarim_basin.0102.desc.good:0 "\n\n据精通占卜艺术的当地人说，这些比赛的结果是#bold 吉#!。听到这个消息，大家都松了一口气，毫无疑问这意味着我们的农作物将产生可喜的产量，我们的动物群将继续增长。"
 tarim_basin.0102.desc.great:0 "\n\n据精通占卜艺术的当地人说，这些比赛的结果是#bold 大吉#!。听到这个消息，大家都松了一口气，毫无疑问这意味着我们的农作物将产生巨大的产量，我们的动物群将大幅。"
 tarim_basin.0102.a:0 "就这样，又是一年开始了……"
