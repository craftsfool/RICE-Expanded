 trait_track_RICE_silk_road_merchant:0 "$trait_RICE_silk_road_merchant$"
 trait_track_RICE_silk_road_merchant_desc:0 "无论是走陆路还是海路，要追寻丝绸之路上代代旅行者、冒险家和商人的足迹，都不是一件简单的事！"
 RICE_tarim_basin_silk_road_scroll_east_african_name:0 "来自东非的卷轴"
 RICE_tarim_basin_silk_road_scroll_east_african_desc:0 "一幅朴素而美丽的卷轴，其中包含一些传统东非风格的绘画艺术，以及一些东非语言的文字，非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话。\n\n非洲被无知者讥讽为缺乏文化的国度，但事实上，非洲是许多充满活力的多元文明的发源地。从阿比西尼亚的吉兹字母到源于阿拉伯语的斯瓦希里字母，种种文字塑造了众多古老的识字传统。"
 RICE_tarim_basin_silk_road_scroll_southeast_asian_name:0 "来自东南亚的卷轴"
 RICE_tarim_basin_silk_road_scroll_southeast_asian_desc:0 "一幅朴素而美丽的卷轴，其中包含一些传统东南亚风格的绘画艺术，以及一些东南亚语言的文字，非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话。\n\n东南亚同时受到南亚和东亚文化的许多影响，但也保有了自己的文化特色。在文化的交融中，该地区的许多文化创造了许多将这些外部影响与自己独特的思想完美地融合在一起的文学。"
 RICE_tarim_basin_silk_road_legacy_1_effect_2:0 "使用$RICE_silk_road_merchants_option$[travel_option|E]时，增加发生交易事件、获得[gold|E]的几率"
 RICE_tarim_basin_silk_road_legacy_2_effect_3:0 "使用$RICE_silk_road_merchants_option$[travel_option|E]时，增加获得[GetTrait('RICE_silk_road_merchant').GetName( GetPlayer )][trait|E]的几率"
 RICE_tarim_basin_silk_road_legacy_5_effect_4:0 "现在，即使未曾成功交易，使用$RICE_silk_road_merchants_option$[travel_option|E]也可能获得[GetTrait('RICE_silk_road_merchant').GetName( GetPlayer )][trait|E]"
 RICE_tarim_basin_east_african_contacts:0 "与东非[silk_road_communities_short|E]接触"
 RICE_tarim_basin_east_african_contacts_desc:0 "该角色与丝绸之路上的东非人有联系，和这些东非社区的精英成员有良好的关系。\n\n#EMP 增加获得改善[scheme_resistance|E]和[prowess|E]的[special_troops|E]和[character_modifiers|E]的数量和几率\n解锁$RICE_silk_road_community_east_african_decision$[decision|E]#!"
 RICE_tarim_basin_southeast_asian_contacts:0 "与东南亚[silk_road_communities_short|E]接触"
 RICE_tarim_basin_southeast_asian_contacts_desc:0 "该角色与丝绸之路上的东南亚人有联系，和这些东南亚社区的精英成员有良好的关系。\n\n#EMP 增加获得提高[travel_speed|E]、减少海洋[terrain|E][travel_danger|E]，及[health|E]、[fertility|E]和[stress|E]相关的[character_modifiers|E]礼物的数量和几率\n解锁$RICE_silk_road_community_southeast_asian_decision$[decision|E]#!"
 RICE_tarim_basin_african_contracts:0 "进口黄金和象牙"
 RICE_tarim_basin_african_contracts_desc:0 "该统治者与东非的商人进行谈判以吸引商人，希冀使其领地成为东非的主要出口物——黄金和象牙贸易中的一环，以期从丰厚的利润中分一杯羹。"
 RICE_tarim_basin_southeast_asian_shipbuilders:0 "东南亚船匠"
 RICE_tarim_basin_southeast_asian_shipbuilders_desc:0 "在东南亚的各个王国、城邦和部落中，许多人在航海、造船、海上贸易等方面经验丰富。该角色大量寻求此种人为其出谋划策。"
 RICE_tarim_basin_gift_silk_road_sea_travel_1:0 "海上丝绸之路小规模商业往来"
 RICE_tarim_basin_gift_silk_road_sea_travel_1_desc:0 "海上丝绸之路沿线的当地外国社区成员正在帮助竖立这位人物旗帜的人们能够安全、快速地出海。"
 RICE_tarim_basin_gift_silk_road_sea_travel_2:0 "海上丝绸之路沿线大规模商业往来"
 RICE_tarim_basin_gift_silk_road_sea_travel_2_desc:0 "$RICE_tarim_basin_gift_silk_road_sea_travel_1_desc$"
 RICE_tarim_basin_gift_silk_road_sea_travel_3:0 "海上丝绸之路沿线特大规模商业往来"
 RICE_tarim_basin_gift_silk_road_sea_travel_3_desc:0 "$RICE_tarim_basin_gift_silk_road_sea_travel_1_desc$"
 RICE_tarim_basin_gift_silk_road_trade_business_relationship:0 "丝路商业往来关系"
 RICE_tarim_basin_gift_silk_road_trade_business_relationship_desc:0 "该角色最近与丝绸之路上商人建立了密切联系。无论是否达成商业交易，这种关系一定会让双方受益，为双方供额外的人脉和资源。"
 RICE_community_east_african_option:0 "#Bold #V 东非#!#!\n来自遥远海岸的不同群体"
 RICE_community_east_african_option_desc:0 "多民族交融的非洲人值得我们的支持。"
 RICE_community_east_african_option_tooltip:0 "来自五湖四海的人们从东非来到这里，包括商人、冒险家、奴隶等等。是时候[GetModifier('RICE_tarim_basin_east_african_contacts').GetNameWithTooltip]！\n\n#weak 该选项会增加从本地[silk_road_communities|E]获得[special_troops|E]和[character_modifiers|E]礼物的数量和几率，这些礼物可以提高[scheme_resistance|E]和[prowess|E]，并解锁$RICE_silk_road_community_east_african_decision$[decision|E]#!"
 RICE_community_southeast_asian_option:0 "#Bold #V 东南亚#!#!\n征服印度洋的水手"
 RICE_community_southeast_asian_option_desc:0 "富有进取心和冒险精神的东南亚人值得支持。"
 RICE_community_southeast_asian_option_tooltip:0 "东南亚城市与世家在印度洋的海上网络中举足轻重，打入他们的关系网对我们受益匪浅。是时候[GetModifier('RICE_tarim_basin_southeast_asian_contacts').GetNameWithTooltip]了！\n\n#weak 该选项会增加从本地[silk_road_communities|E]获得[character_modifiers|E]礼物的数量和几率，这些[character_modifiers|E]可以提高[travel_speed|E]，降低在海上[terrain|E]中的[travel_danger|E]，也可以获得有关[health|E]、[fertility|E]，以及应对[stress|E]的修正，并解锁$RICE_silk_road_community_southeast_asian_decision$[decision|E]#!"
 RICE_silk_road_community_east_african_decision:0 "吸引黄金和象牙出口"
 RICE_silk_road_community_east_african_decision_tooltip:0 "东非是黄金、象牙和其他奢侈品的主要出口地"
 RICE_silk_road_community_east_african_decision_desc:0 "我与领地内的东非[silk_road_communities_short|E]有联系，特别是来自那里的商人，我可能想吸引他们中的一些人在我的土地进行贸易，当然，我要是能从利润中分一杯羹那更好了。"
 RICE_silk_road_community_east_african_decision_confirm:0 "召集商人！"
 RICE_silk_road_community_southeast_asian_decision:0 "聘请东南亚造船师"
 RICE_silk_road_community_southeast_asian_decision_tooltip:0 "许多民族生活在东南亚沿海和沿河地区"
 RICE_silk_road_community_southeast_asian_decision_desc:0 "通过扩大与所在的东南亚[silk_road_communities_short|E]的关系网，我接触到了许多商人、水手、木匠以及其他参与船只生产和航行的工匠。我应该利用这些人来提高领土上的贸易和海上战斗能力。"
 RICE_silk_road_community_southeast_asian_decision_confirm:0 "我们将航行在蔚蓝的印度洋上！"
 RICE_silk_road_merchant_trait_gain_tooltip:0 "#weak 你之前已获得#V [GetPlayer.MakeScope.Var('RICE_silk_road_merchant_success_count').GetValue]#!丝绸之路沿线成功的贸易交易。达成的交易越多，获得[GetTrait('RICE_silk_road_merchant').GetName( GetNullCharacter )][trait|E]的机会就越大#!"
 RICE_silk_road_number_of_successes_tooltip:0 "#weak 你之前已获得#V [GetPlayer.MakeScope.Var('RICE_silk_road_merchant_success_count').GetValue]#!丝绸之路沿线成功的贸易交易。#!"
 tarim_basin.0020.desc.east_african:0 "\n\n已经决定加强与我的领地内的东非部族的联系。在欧亚大陆和非洲纵横交错的贸易路线上，东非人有着各种各样的背景，包括商人、冒险家、奴隶等等。这些人中的任何一个都可能对我的目标有所帮助。"
 tarim_basin.0020.desc.southeast_asian:0 "\n\n已经决定加强与我的领地内的东南亚世家的联系。东南亚的陆地和海洋上有许多王国和城市，它们与海上丝绸之路紧密相连。参与这些网络可能会带来丰厚的利润。"
 tarim_basin.0020.option.east_african:0 "他们是一个多元且技能娴熟的群体。"
 tarim_basin.0020.tooltip.east_african:0 "只要你有[GetModifier('RICE_tarim_basin_east_african_contacts').GetNameWithTooltip][character_modifier|E]，你会定期收到当地东非[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，[silk_road_communities|E]给的礼物里面[special_troops|E]和[character_modifiers|E]等能提高[scheme_resistance|E]和[prowess|E]的礼物可能会更好，出现几率更大。"
 tarim_basin.0020.option.southeast_asian:0 "他们作为水手和商人的能力令人钦佩。"
 tarim_basin.0020.tooltip.southeast_asian:0 "只要你有[GetModifier('RICE_tarim_basin_southeast_asian_contacts').GetNameWithTooltip][character_modifier|E]，你会定期收到当地东南亚[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，[silk_road_communities|E]给的[character_modifiers|E]礼物里面能提高[travel_speed|E]和减少在[terrain|E]的[travel_danger|E]，或[health|E]和[fertility|E]，并减少[stress|E]可能会更好，出现几率更大。"
 RICE.silk_road_gift_quality.tooltip.east_african:0 "因为你目前正在加强与当地东非[silk_road_community_short|E]的联系，因此东非礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 RICE.silk_road_gift_quality.tooltip.southeast_asian:0 "因为你目前正在加强与当地东南亚[silk_road_community_short|E]的联系，因此东南亚礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 tarim_basin.0021.desc.east_african:0 "鉴于我最近努力与当地东非社区建立联系和加深关系，各东非裔部族向我赠送了黄金和其他贵重物品，其中许多是按照他们民族的传统美学而制作的。"
 tarim_basin.0021.desc.southeast_asian:0 "鉴于我最近努力与当地东南亚世家建立联系和加深关系，这些东方血统世家精英向我赠送了黄金和其他贵重的礼物，其中许多是以他们民族的传统风格制作的。"
 tarim_basin.0022.desc.east_african:0 "我与当地东非部族建立联系的工作已经得到回报。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润！ "
 tarim_basin.0022.desc.southeast_asian:0 "我与当地东南亚世家建立联系的工作已见成效。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润！"
 tarim_basin.0023.desc.east_african:0 "当地的东非长老们称赞我为促进与他们的密切关系所做的努力。\n\n为了庆祝近期取得的一系列成功，他们中几个最显赫的部族聚在一起，以我的名义举办了一场盛大的宴会。我们所有人都大快朵颐，品尝了他们那闻名海上丝绸之路的传统美食，如丰盛的炖肉和蔬菜，以及用来自大洋彼岸的大量香料调制的香喷喷的大米。"
 tarim_basin.0023.desc.southeast_asian:0 "当地的东南亚精英称赞我为促进与他们的密切关系所做的努力。\n\n为了庆祝近期取得的一系列成功，他们中几个最显赫的部族聚在一起，以我的名义举办了一场盛大的宴会。我们所有人都大快朵颐，品尝了他们那闻名海上丝绸之路的传统美食，如掺有椰子等配料的甜味和咸味咖喱，以及多种海鲜。"
 tarim_basin.0024.desc.east_african:0 "我通过与领地内东非部族的往来，已经成功地与他们建立良好的关系。即使是那些东非的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在东南亚的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0024.desc.southeast_asian:0 "我通过与领地内东南亚世家的往来，已经成功地与他们建立良好的关系。即使是那些东南亚的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在东南亚的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0025.desc.east_african:0 "当地东非部族的长老向我赠送了一份壮观的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教物品，像是镶嵌着珍贵宝石的雕像、美妙绝伦绘画以及其他类似物品。\n\n虽然他们社区的每个人都不一定有相同的信仰，但他们在丝绸之路上相互生活了几个世纪，有时和平，有时冲突。因此这些知名人士清楚地知道要向我赠送什么样的宗教文物，这并不令人惊讶。"
 tarim_basin.0025.desc.southeast_asian:0 "当地东南亚世家长者向我赠送了一份壮观的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教物品，像是镶嵌着珍贵宝石的雕像、美妙绝伦绘画以及其他类似物品。\n\n虽然他们社区的每个人都不一定有相同的信仰，但他们在丝绸之路上相互生活了几个世纪，有时和平，有时冲突。因此这些知名人士清楚地知道要向我赠送什么样的宗教文物，这并不令人惊讶。"
 tarim_basin.0026.desc.east_african:0 "当地东非部族长老们今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品将表明他们对我最近为加强与他们的关系所做的努力的回馈。"
 tarim_basin.0026.desc.southeast_asian:0 "当地东南亚世家的成员今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品将表明他们对我最近为加强与他们的关系所做的努力的回馈。"
 tarim_basin.0027.desc.east_african:0 "我们与当地东非部族的关系足够好，我已经能够获得一些来自这些地区的奴隶兵。据说他们只忠于我一个人，虽从遥远的国度沿着海上丝绸之路来到这里，但他们经验丰富，战斗力强悍。"
 tarim_basin.0027.desc.southeast_asian:0 "我们与当地东南亚世家的关系足够好，他们中的一些人已经向我宣誓效忠，他们提供私兵或者直接加入我的军队。其中许多人以前是雇佣兵或冒险家，他们在丝绸之路沿线追求名利，所以他们经验丰富，战斗力强悍。"
 tarim_basin.0028.desc.east_african:0 "当地东非部族的长老们敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，一直延伸到东非的港口城市、内陆部落和王国。\n\n看来，我的努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助。作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0028.desc.southeast_asian:0 "当地东南亚世家的成员敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，一直延伸到东南亚的岛屿、海岸和丛林。\n\n看来，我的努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助。作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0029.desc.east_african:0 "[local.GetFullName]，一位来自我领地内东非部族的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n东非是黄金和象牙的重要产地，该地区的商人分布广泛，形成了社区网络，任何领主都会明智地与之建立联系。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0029.desc.southeast_asian:0 "[local.GetFullName]，一位来自我领地内东南亚世家的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n东南亚是众多民族的家园，其中一些民族与海上丝绸之路的经济、文化和政治网络联系紧密。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0030.desc.east_african:0 "最近，当地东非部族长老赠送给我一批相当数量的草药和传统药物，这些草药来自们东非的多样土地中。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0030.desc.southeast_asian:0 "最近，当地东南亚世家长者赠送给我一批相当数量的草药和传统药物，这些草药来自们东南亚的海岸中。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0031.desc.east_african:0 "我为改善与当地东非部族的关系所做的努力正在取得成果。通过倾听他们的诉求，并努力改善当地条件，而他们也反过来帮助我找到引进资源用于基础设施项目的方法，而且他们的领导人经常支持我，并安抚他们内部的不满分子。"
 tarim_basin.0031.desc.southeast_asian:0 "我为改善与当地东南亚世家的关系所做的努力正在取得成果。通过倾听他们的诉求，并努力改善当地条件，而他们也反过来帮助我找到引进资源用于基础设施项目的方法，而且他们的领导人经常支持我，并安抚他们内部的不满分子。"
 tarim_basin.0032.desc.east_african:0 "一些来自当地东非部族健壮年轻人提出要成为我的护卫。这是我努力改善双方关系所得成果，他们希望通过确保我的安全来回报我的帮助。\n\n部族长老为他们的技艺和战斗经验做了担保，有些人甚至在丝绸之路沿路中做过几年雇佣兵。他们会无畏地保护我，并以绝对的忠诚为我服务。"
 tarim_basin.0032.desc.southeast_asian:0 "一些来自当地东南亚世家健壮年轻人提出要成为我的护卫。这是我努力改善双方关系所得成果，他们希望通过确保我的安全来回报我的帮助。\n\n世家长者为他们的技艺和战斗经验做了担保，有些人甚至在丝绸之路沿路中做过几年雇佣兵。他们会无畏地保护我，并以绝对的忠诚为我服务。"
 tarim_basin.0033.desc.east_african:0 "今天一些来自当地东非部族的学者拜访了我，他们打算在我的宫殿做一个有趣的讲座，介绍他们的一些传统信仰、原则、习俗、文学和历史。在丝绸之路上，思想和文化的交流毕竟不是什么新鲜事。\n\n虽然很多信息多到超出了我的想象，但我确实学到了一些有趣的东西，我希望这一经历能使我与东非部族的友谊更深入。"
 tarim_basin.0033.desc.southeast_asian:0 "今天一些来自当地东南亚世家的学者拜访了我，他们打算在我的宫殿做一个有趣的讲座，介绍他们的一些传统信仰、原则、习俗、文学和历史。在丝绸之路上，思想和文化的交流毕竟不是什么新鲜事。\n\n虽然很多信息多到超出了我的想象，但我确实学到了一些有趣的东西，我希望这一经历能使我与东南亚世家的友谊更深入。"
 tarim_basin.0034.desc.east_asian:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地东亚世家的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0034.desc.steppe:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地草原部族的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0034.desc.middle_eastern:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地中东部族的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0034.desc.himalayan:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地喜马拉雅部族的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0034.desc.indian:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地印度世家的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0034.desc.east_african:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地东非部族的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0034.desc.southeast_asian:0 "每天无穷无尽的船只沿着海上丝绸之路往返于印度洋。最近，我在当地东南亚部族的联络人告诉我，他们已经有意识地向其他地区的人们伸出援手，在留意那些打着[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]旗帜航行的船只，并在旅行时尽可能与他们合作，比如一起航行或进行共同防御。\n\n海洋可能很危险，但通过这样的合作，远近各地的人可以齐心协力，成就伟大的事业。"
 tarim_basin.0035.desc.east_asian:0 "我领地内的东亚世家有许多实力雄厚的商人，他们从遥远的东方来到这片土地经商——外人只能想象他们家乡的富饶和繁荣。"
 tarim_basin.0035.desc.steppe:0 "我领地内的草原部族中有许多实力雄厚的商人，人们可能认为草原人只知道战斗，但似乎有些人还掌握了行商和外交的技巧。"
 tarim_basin.0035.desc.middle_eastern:0 "我领地内的中东社区有许多实力雄厚的商人，鉴于他们世代在商业网络中发挥的重要作用，没有人会对此感到惊讶。"
 tarim_basin.0035.desc.himalayan:0 "我领地内的喜马拉雅世家有许多实力雄厚的商人，他们在管理和组织跨越世界屋脊的商贸联系方面，几乎无人能及。"
 tarim_basin.0035.desc.indian:0 "我领地内的印度社区有许多实力雄厚的商人，可以把他们组织起来，参与来往于领土上壮丽城市间的海陆贸易。"
 tarim_basin.0035.desc.east_african:0 "我领地内的东非部族有许多实力雄厚的商人，他们徒步或乘船远道而来从事贸易，他们是我们与东非海岸内陆其他领主和城市之间的重要纽带。"
 tarim_basin.0035.desc.southeast_asian:0 "我领地内的东南亚世家有许多实力雄厚的商人，他们是印度洋的主宰，不仅知道如何航行，还知道航行到何处以寻求冒险和贸易机会。"
 tarim_basin.0035.b:0 "让我们用[merchant.GetHerHim]作为联系人。"
 tarim_basin.0035.c:0 "转念一想，我觉得这行不通。"
 RICE_tarim_basin_is_al_Kashgari_tooltip:0 "是马哈茂德·喀什噶里"
 RICE_tarim_basin_cao_yijin_aspiration_event_troops:0 "曹议金之卫"
 RICE_tarim_basin_aspiration_cao_yijin_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('d_guasha').GetNameNoTier]和[GetTitleByKey('d_gansu').GetNameNoTier]\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('k_hexi').GetNameNoTier]或[GetTitleByKey('k_xia').GetNameNoTier]的[king|E]\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得#V 1000人#!的[special_troops|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$使用一次$RICE_tarim_basin_patronize_a_mogao_cave$[decision|E]（完成奖励：@piety_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![piety|E]）\n$EFFECT_LIST_BULLET$与一位[ruler|E]（[king|E]或者[emperor|E][rank|E]）达成[alliance|E]（完成奖励：@dynasty_prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![dynasty_prestige|E]）#!"
 RICE_tarim_basin_historical_aspiration_action_cao_yijin: "#italic 敦煌的精英家族不配领导归义军。为了恢复西域边疆的秩序，必须让你来领导归义军。#!$RICE_tarim_basin_aspiration_cao_yijin_desc$"
 RICE_tarim_basin_historical_aspiration_modifier_desc_cao_yijin: "[GetModifier('RICE_tarim_basin_aspiration_restore_order_guiyi').GetNameWithTooltip]"
 RICE_tarim_basin_aspiration_al_kashgari_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$使用$RICE_tarim_basin_compile_the_turkic_dictionary$[decision|E]并完成事件链\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_tarim_basin_is_al_kashgari_upgrade').GetNameWithTooltip][modifier|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$学习至少三种[languages|E]（完成奖励：获得你目前的[lifestyle|E]的#P 1点#![perk|E]）\n$EFFECT_LIST_BULLET$达到$PRESTIGE_LEVEL_LABEL_3$[prestige_level|E]（完成奖励：各获得#V 1点#![diplomacy_i|E]与[learning_i|E]）"
 RICE_tarim_basin_historical_aspiration_action_al_kashgari: "#italic 阿拉伯人和波斯人瞧不起突厥人，把他们视作未开化的蛮族。我希望编纂一本伟大的突厥语词典来证明他们是错的，来证明突厥语也是一种美丽、优雅的语言！#!$RICE_tarim_basin_aspiration_al_kashgari_desc$"
 RICE_tarim_basin_historical_aspiration_modifier_desc_al_kashgari: "[GetModifier('RICE_tarim_basin_is_al_kashgari').GetNameWithTooltip]"
 RICE_tarim_basin_is_al_kashgari_upgrade:0 "伟大的突厥语大词典编纂者"
 RICE_tarim_basin_is_al_kashgari_upgrade_desc:0 "马哈茂德·喀什噶里不是一个文弱学者——他走过很多地方，看过很多事物，研究过世界上的很多国家。他是一位勤奋的人，一生的目标是完成第一部全面的突厥语字典。"
 RICE_tarim_basin_aspiration_restore_order_guiyi: "[RICE_aspiration|E]：重整归义军"
 RICE_tarim_basin_aspiration_restore_order_guiyi_desc: "#italic 敦煌其他世家不配领导归义军。为了恢复西域边疆的秩序，必须让曹议金来领导归义军。#!$RICE_tarim_basin_aspiration_cao_yijin_desc$\n\n"
