 tarim_basin.0200.t:0 "喀什噶里"
 tarim_basin.0200.desc:0 "#EMP 在突厥人中，我最长于辞令，最善于清楚地表达思想，禀性极其聪慧，并出生高贵，又兼能征善战。#!\n\n总有一天，当我完成第一本突厥语词典时，这些将被写在我的巨著的开头几行。我是伟大的突厥喀喇汗王朝的皇室后裔，族人现统治着中亚的大部分地区，其腹地曾在中国治下。但我深知，我的命运在别处。\n\n我走过许多地方，学习、理解、赞叹。然而无论我走到哪里，阿拉伯人和波斯人都嘲笑[ROOT.Char.GetCulture.GetLanguage.GetName]不如他们的语言！\n\n我会证明他们是错的！我会找到时间、精力和灵感去做我必须做的事情！向世界证明我们突厥人同样有着丰富多样的文化！"
 tarim_basin.0200.a:0 "这将是我一生的激情，一生的使命！"
 tarim_basin.0200.tooltip:0 "你能在其他人之前使用$RICE_tarim_basin_compile_the_turkic_dictionary$[decision|E]。"
 tarim_basin.0200.info:0 "#emphasis 历史背景：#!马哈茂德·喀什噶里是11世纪的学者，他在公元1072‑1077年编写了第一部突厥语词典《突厥语大词典》。上面的引文直接摘自他的书的序言。\n\n在他的著作中，喀什噶里不仅提供了语言学方面的信息，还讨论了历史、地理、宗教和他的激进观点。例如，他为自己的突厥血统感到自豪，并警告他的突厥同胞不要过着定居的生活方式，因为他认为古老的游牧方式更加优越。此外他还对佛教和异教信仰表示敌意。\n\n无论如何，喀什噶里据说与喀喇汗国的统治者有亲属关系；这种关系并没有完全得到证实，但是有一定的可能性。如果他是喀喇汗国的后裔，他的祖先可能是一位名叫侯赛因或哈桑的人，他在公元992年征服了萨曼王朝的首都布哈拉。喀什噶里在11世纪末或12世纪初去世，他在突厥文化和文学史上留下了重要的印记。"
 tarim_basin.0201.t:0 "突厥人的语言"
 tarim_basin.0201.desc:0 "多年来，看到我们的[culture_scope.GetHeritage.GetName]传统被伊朗人和阿拉伯人等更“文明”的人嘲笑，我感到很痛苦。我听到他们中的许多人声称，#italic 我们的#!语言没有什么美学和文学价值。我要证明丰富的的文学和诗歌绝非“文明”人所独有，突厥人也能留下名垂千古的文化遗产！\n\n作为一名学者，我觉得我有责任为[culture_scope.GetHeritage.GetNameNoTooltip]民族的语言带来荣誉和光荣。多年来我一直在收集关于我们的语言方式、俚语等等，现在是时候让我把所有这些知识都用上了。\n\n今天我将开始编写[culture_scope.GetHeritage.GetNameNoTooltip]语言的词典。我还打算包括关于我们的历史、习俗、信仰、诗歌等各种细节，以便让世界了解我们充满活力的美丽文化。我希望在未来，通过我的努力，其他人将不再认为[culture_scope.GetHeritage.GetNameNoTooltip]民族是粗俗的野人。"
 tarim_basin.0201.a:0 "这将是一项伟大的事业，我必须完成它。"
 tarim_basin.0202.t:0 "突厥语大词典"
 tarim_basin.0202.desc:0 "终于完成了！历经数年数月的奋斗！\n\n我已经完成了第一部[culture_scope.GetHeritage.GetName]语言词典的手稿，称为《突厥语大词典》，或#bold Diwan Lughat al‑Turk#!，虽然它主要是一部词汇学作品，但也包括了许多关于[culture_scope.GetHeritage.GetNameNoTooltip]民族的历史、习俗、信仰、诗歌等方面的细节。\n\n当我开始这个项目时，我的目标是向世界展示[culture_scope.GetHeritage.GetNameNoTooltip]民族和其他民族一样的有文化有传承，而且我们也有自己的文学传统，值得骄傲。这样一个崇高的目标可能不是仅仅靠这样一本书就能完成的，但它仍然是一个重要的步骤。我将向知名人士分发几本，希望他们能够理解我的意图，我真诚地希望我的工作能够激励其他[culture_scope.GetHeritage.GetNameNoTooltip]学者和诗人。"
 tarim_basin.0202.a:0 "而现在，我可以休息一下了。"
 tarim_basin.0202.copy.liege:0 "你的[liege|E]，[liege.GetTitledFirstName]将收到该书的副本。"
 tarim_basin.0202.copy.top_liege:0 "你的[top_liege|E]，[top_liege.GetTitledFirstName]将收到该书的副本。"
 tarim_basin.0202.copy.religious_head:0 "你的[head_of_faith|E]，[religious_head.GetTitledFirstName]将收到该书的副本。"
 tarim_basin.0203.t:0 "突厥语大词典"
 tarim_basin.0203.desc:0 "我刚刚收到消息，学者[compiler.GetTitledFirstName]已经完成了第一部[culture_scope.GetHeritage.GetName]语言词典的写作，名为#bold 《突厥语大词典》#!，虽然它主要是一部词汇学著作，但也包括许多关于[culture_scope.GetHeritage.GetNameNoTooltip]民族的历史、习俗、信仰、诗歌等方面的细节。\n\n多年来，根据[compiler.GetHerHim]的说法，[culture_scope.GetHeritage.GetNameNoTooltip]民族被不公平地认为是野蛮人，与其他民族如阿拉伯人和波斯人相比来说没有自己的文化传统。因此[compiler.GetSheHe|U]望这本词典能够一劳永逸地证明，[culture_scope.GetHeritage.GetNameNoTooltip]民族在文学和文化方面也有很多值得骄傲的地方。这项学术工作对世界其他地区有多大影响，还有待观察。"
 tarim_basin.0203.desc.copy:0 "\n\n作为[compiler.GetTitledFirstName]的重要人物，[compiler.GetSheHe]为我提供了一份该书的副本，让我保存在自己的图书馆。我必须说这是一份贴心的礼物!"
 tarim_basin.0203.a:0 "[compiler.GetSheHe|U]在这方面一定下了很大功夫。"
 tarim_basin.0204.t:0 "xxxxx"
 tarim_basin.0204.desc:0 "xxxxx"
 tarim_basin.0204.a:0 "xxxxx"
 tarim_basin.0205.t:0 "突厥语大词典"
 tarim_basin.0205.desc:0 "在[compiler.GetSheHe]去世之前，我的[compiler.Custom2('RelationToMeShort', compiler_heir)]，[compiler.GetTitledFirstName]，已经花了很长时间在编纂一本[culture_scope.GetHeritage.GetName]语言的词典，名为#bold 《突厥语大词典》#!，这已经不是什么秘密。事实上，#italic 早#!在[compiler.GetSheHe]开始写这本书时就已经开始准备各种工作了，因为[compiler.GetSheHe]需要从其他来源获得大量的文本和信息，无论是[compiler.HerHis]的第一手观察还是采访其他人得到。显然他已经向世界证明[culture_scope.GetHeritage.GetName]民族和其他民族一样能言善辩、有文化，这是[compiler.HerHis]毕生的梦想。\n\n唉，我的[compiler.Custom2('RelationToMeShort', compiler_heir)]在[compiler.GetSheHe]完成这本书之前就去世了。一些看过手稿的当地学者说，不过值得庆幸的是，该书的大部分内容已经完成。因此，我决定将一些副本分发给知名人士，我希望[compiler.GetFirstName]为这本书所做的工作也能给其他[culture_scope.GetHeritage.GetNameNoTooltip]学者和诗人带来启发。"
 tarim_basin.0205.a:0 "[compiler.GetHerHis]工作不会白费。"
 tarim_basin.0206.t:0 "突厥语大词典"
 tarim_basin.0206.desc:0 "我刚刚收到消息，学者[compiler.GetTitledFirstName]最近去世了，当时他正试图完成[culture_scope.GetHeritage.GetName]语言的第一部词典的撰写，名为#bold 《突厥语大词典》#!。虽然未完成，但根据[compiler.GetTitledFirstName]手稿草稿的说法，其中大部分已经完成。它主要是一部词汇学作品，还包括许多关于[culture_scope.GetHeritage.GetNameNoTooltip]民族的历史、习俗、信仰、诗歌等方面的细节。\n\n多年来，据[compiler.GetHerHim]说，[culture_scope.GetHeritage.GetNameNoTooltip]民族被不公正地评价为文盲、不善言辞、与阿拉伯人和伊朗人等其他民族相比更低贱。尽管[compiler.GetFirstName]在[compiler.GetSheHe]完成之前就已经去世了，但是[compiler_heir.GetFirstName]还是希望这本词典将彻底证明，[culture_scope.GetHeritage.GetNameNoTooltip]民族在文学和文化方面也有很多值得自豪的地方。这项学术工作对世界其他地区有多大影响，还有待观察。"
 tarim_basin.0206.desc.copy:0 "\n\n作为[compiler.GetTitledFirstName]的重要人物，[compiler_heir.GetFirstName]为我提供了一份该书的副本，让我保存在自己的图书馆里。我必须说，这是一份贴心的礼物!"
 tarim_basin.0206.a:0 "$tarim_basin.0203.a$"
 tarim_basin.0207.t:0 "xxxxx"
 tarim_basin.0207.desc:0 "xxxxx"
 tarim_basin.0207.a:0 "xxxxx"
 tarim_basin.0208.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 tarim_basin.0208.desc:0 "不久前，我完成了我的巨著#italic 《突厥语大词典》#!，现在关于我的传闻远扬四方。\n\n周游世界的坚辛、不眠不休的写作和学习都没有白费。现在，所有人都知道突厥民族的语言和文化，以及我为所做出的努力。"
 tarim_basin.0208.a:0 "突厥语之美将流芳百世！"
 tarim_basin.0209.t:0 "xxxxx"
 tarim_basin.0209.desc:0 "xxxxx"
 tarim_basin.0209.a:0 "xxxxx"
 tarim_basin.0210.t:0 "着手准备奥达木节"
 tarim_basin.0210.desc:0 "今年我希望参加[GetGeographicalRegion('world_steppe_tarim').GetName]最大的#italic 麻札节#!，它是在[kashgar.GetNameNoTier]的[ali_arslan.GetTitledFirstName]的墓前举行的#italic 鄂尔多斯节#!。这位高贵的[ali_arslan.GetLadyLord]牺牲了[ali_arslan.GetHerHis]的生命，与[khotan.GetNameNoTier]残忍的佛教异教徒战斗并击败了他们，我们纪念这个人和其他在这场可怕的战争中死去的烈士是非常合适的。"
 tarim_basin.0210.a:0 "我#italic 将参加#!这个伟大的节日。"
 tarim_basin.0211.t:0 "奥达木节开始"
 tarim_basin.0211.desc:0 "我们的#italic 奥达木节#!！我与我的随行人员一起，来到[kashgar.GetNameNoTier]的一个地点：[ali_arslan.GetTitledFirstName]的#italic 麻札#!，向这位悲惨但英勇的烈士致敬。\n\n我看到各种各样的人慢慢地涌入城市范围，从卑微的、衣衫褴褛的农民，到乘坐驴子拉着摇摇晃晃旧车的平民，再到骑在最好的骏马上的华丽贵族，再到乘坐耀眼的马车的富裕商人。所有的人都是为了这个节日来到这里。\n\n有些人是来表达他们对[ROOT.Char.GetFaith.GetReligion.GetName]这一宗教的虔诚，并思考殉道者的精神以及怀念[ROOT.Char.GetFaith.HighGodName]的伟大。还有一些人来到这里，是想趁着这个机会进行社交活动，结交更过名贵。当然大多数人是来做这两件事的。"
 tarim_basin.0211.a:0 "很明显，我在这里主要是出于信仰。"
 tarim_basin.0211.b:0 "信仰固可贵，但现实也很重要!"
 tarim_basin.0212.t:0 "金碗"
 tarim_basin.0212.desc:0 "在#italic 奥达木节#!中，最重要的活动之一是有很多人参加的仪式性公餐。\n\n来自各行各业的人们收集各种食物，如新鲜羊肉、大米和蔬菜，并正式提交给在场的知名人士和贵族（包括我自己）\n\n然后将食物放入一个被称为“金碗”的大锅中，在那里一起烹煮，并与在场的所有人分享。"
 tarim_basin.0212.a:0 "尽管食物的气味很浓而且很好吃"
 tarim_basin.0213.t:0 "坟墓前"
 tarim_basin.0213.desc:0 "现在是#italic 奥达木节#!的高潮和主要活动的时间了，大群人举着五颜六色的旗子前往#italic 麻札#!，也就是[ali_arslan.GetFirstName]的墓穴。\n\n按照传统，在到达坟墓之前，我们要穿过几个沙丘。有些人走得很慢，但很多人走得很快，还有一些人被心中的激动和他们的虔诚感染所以跑得很快，就像在沙地上跳舞一样，他们催促我们继续前进，他们的声音充满了无拘无束的情感。\n\n当我们聚集在坟墓周围时，音乐家们敲打着他们的鼓，演奏他们的歌曲，速度越来越快，向在场的每个人展示他们的技艺。然后这些人和鼓手都完美地齐声哭泣，喊着“安拉！”许多人都加入了他们的悲鸣，有的大声，有的小声，而我也在其中。"
 tarim_basin.0213.a:0 "我们是如此怀念你！英勇的[ali_arslan.GetFirstName]！"
 tarim_basin.0214.t:0 "奥达木节结束"
 tarim_basin.0214.desc:0 "#italic 奥达木节#!落下帷幕。今年的节日也一如既往的精彩，这融合了庄严、反思的祈祷和宗教的哀悼，因为我们纪念了[ali_arslan.GetTitledFirstName]，也融合了兴奋和社交，来自各行各业的许多人聚集在一起，享受彼此的陪伴。我当然很开心，我希望能尽快再来一次!"
 tarim_basin.0214.a:0 "于是我们都回到了正常的生活中……"
 tarim_basin.0215.t:0 "歌手与诗人"
 tarim_basin.0215.desc:0 "在奥达木节期间，旅行的歌手和诗人在[kashgar.GetNameNoTier]大量聚集是很常见的。他们相聚在街道上，许多人弹奏着各种乐器，如琵琶或鼓之类的打击乐器，吟诵着从古代英雄的史诗故事到催人泪下的爱情民谣以及鼓舞人心的宗教故事。\n\n在一些人看来，这本来是一种嘈杂的噪音，但在我听着这些美妙人才汇聚的声音时，仿佛置身于一场美妙交响乐之中，尽管这是一个庄严的场合。"
 tarim_basin.0215.a:0 "这里的人太多了，有点让人不知所措！"
 tarim_basin.0216.t:0 "与孩子们玩耍"
 tarim_basin.0216.desc:0 "奥达木节的另一个重点当然是[ali_arslan.GetFirstName]的坟墓。我看到几个年轻妇女聚集在圣人的墓旁，虔诚地祈祷。我只能听清她们的几句话，但很明显她们在为孩子们祈祷，向圣人为家人祈祷并不罕见。"
 tarim_basin.0216.a:0 "愿[ROOT.Char.GetFaith.HighGodName]保佑并实现她们那小小的愿望"
 tarim_basin.0217.t:0 "年长的舞者"
 tarim_basin.0217.desc:0 "奥达木节期间，无论是长者还是青年都会聚集一起，一同庆祝也一同哀悼[ali_arslan.GetFirstName]的牺牲。我甚至发现了几位老人，他们看起来饱经沧桑，但仍充满活力地跳舞。与年轻人不同的是，他们的心情似乎更加愉悦，很明显这些老先生们正在以他们自己的方式表达对[ROOT.Char.GetFaith.HighGodName]的庄严奉献。"
 tarim_basin.0217.a:0 "一个印象深刻的画面"
 tarim_basin.0218.t:0 "会见其他人"
 tarim_basin.0218.desc:0 "奥达木节是各种人群聚集的节日，同时它也是年轻人聚集的场合，他们在更随意、更轻松的氛围中见面。据说许多人有时会在这里找到他们未来的丈夫或妻子。\n\n然而并不是每个人都赞同这种习俗。一些虔诚的人认为这种事情是不恰当的，毕竟我们在这里是为了纪念[ali_arslan.GetFirstName]，而不是进行肆意的求爱!"
 tarim_basin.0218.a:0 "我同意！我们在这里不是为了男欢女爱。"
 tarim_basin.0218.b:0 "来吧，让他们尽情享受吧！"
 tarim_basin.0218.c:0 "额...说实话我并不在意。"
 tarim_basin.0219.t:0 "殉道者的传说"
 tarim_basin.0219.desc:0 "在整个奥达木节期间，我一直在思考[ali_arslan.GetFirstName]的传奇一生，以及[ali_arslan.GetSheHe]对异教徒发动的圣战。根据关于他死亡传说的一个版本，当[ali_arslan.GetSheHe]在战斗中被杀时，残忍的异教徒将[ali_arslan.GetHerHim]斩首，并将[ali_arslan.GetHerHis]的头悬挂在[khotan.GetNameNoTier]的墙上，让任何[ROOT.Char.GetFaith.GetReligion.GetAdjective]路人心中感到恐惧。\n\n然而，[ROOT.Char.GetFaith.HighGodName]是全知全能和仁慈的，烈士的死亡只刺激了我们更加努力地战斗。很快异教徒在后来的战斗中被击溃，彻底失败了。"
 tarim_basin.0219.a:0 "[ali_arslan.GetHerHis|U]的英雄气概至今激励我们。"
 tarim_basin.0220.t:0 "殉道者之母"
 tarim_basin.0220.desc:0 "在整个奥达木节期间，我一直在思考[ali_arslan.GetFirstName]的传奇一生，以及我听到种种关于[ali_arslan.GetHerHim]的传说。事实上，围绕[ali_arslan.GetHerHis]的母亲甚至也有一些故事。\n\n例如，据说他的母亲是一位公主，是[ROOT.Char.GetFaith.HighGodName]的虔诚信徒。她的儿子[ali_arslan.GetFirstName]不是别人，正是圣吉卜利里。\n\n后来，这位勇敢的妇女亲自上阵，与异教徒作战，用来证明无论男女都可以以正义和公正的名义作战。她也在她儿子死后不久殉道，她的墓，建在据说是她死的地方，那个地方离她儿子的墓不远。"
 tarim_basin.0220.a:0 "一个如此伟大的女人。"
 tarim_basin.0221.t:0 "食物摊"
 tarim_basin.0221.desc:0 "如果在[kashgar.GetNameNoTier]的街道上看不到一排排出售各种美味的摊位，那就不是奥达木节了\n\n也许我应该在这里的这些摊位中尝些小吃？这里有很多东西，从#italic 拉条子#!到米饭、烤肉串、炖羊肉和鸡肉，再到#italic 烤包子#!"
 tarim_basin.0221.a:0 "我会买些试试"
 tarim_basin.0221.b:0 "宫殿里有更好的食物让我来吃。"
 tarim_basin.0222.t:0 "奥达木节期间的娱乐活动"
 tarim_basin.0222.desc:0 "奥达木节既是沉重的怀念节日，同时也是欢乐的庆祝节日。\n\n在[kashgar.GetNameNoTier]的整个街道上，在市场的摊位旁，人们可以看到各种街边表演和娱乐活动，从斗鸡到斗羊、摔跤和杂技表演。\n\n当然总有一些人不赞成这类娱乐活动，认为它们太过喜庆而不适合在这个节日上出现，但大多数人可能不同意。不管怎么说，这里的气氛实在是太热闹了!"
 tarim_basin.0222.a:0 "这样的气氛使我的心变得轻松起来！"
 tarim_basin.0222.b:0 "如果气氛更加庄重就好了……"
 tarim_basin.0223.t:0 "悼念"
 tarim_basin.0223.desc:0 "奥达木节期间，我路过一个由几个朝圣者组成的团体，他们由一个看起来很威严的[ROOT.Char.Custom('DefaultPriestTitle')|U]领导。他们一边抽泣着，一边唱诵着赞美[ROOT.Char.GetFaith.HighGodName]的祷文，并哀叹[ali_arslan.GetFirstName]的死亡。"
 tarim_basin.0223.a:0 "令人感动的一幕。"
 tarim_basin.0224.t:0 "麻札旁的小贩"
 tarim_basin.0224.desc:0 "奥达木节期间，我在[kashgar.GetNameNoTier]的街道上与一个小贩进行了交谈。他说包括他自己在内的一些小贩，是依靠[ali_arslan.GetFirstName]墓为生。\n\n他解释说：“即使在奥达木节不进行的时候，仍然有来自远方的朝圣者和游客，正因为如此，我总是有顾客来推销我的商品。”"
 tarim_basin.0224.a:0 "有意思……"
 tarim_basin.0225.t:0 "塔里木盆地朝圣之旅"
 tarim_basin.0225.desc:0 "今天我遇到一群人，他们来一场朝圣之旅。简而言之他们要参观整个[GetGeographicalRegion('world_steppe_tarim').GetName]的各种圣人、殉道者和其他宗教圣人的#italic 麻札#!。这是这个地区一些信奉[ROOT.Char.GetFaith.GetReligion.GetName]的人的习俗，对于许多人来说，这几乎和去麦加朝觐一样重要。\n\n总之这些朝圣者跟我谈起他们已经去过的地方，以及计划要去的地方。这个位于[kashgar.GetNameNoTier]的奥达木节不过是他们众多站点中的一个。"
 tarim_basin.0225.a:0 "我祝愿你在接下来的旅程中一切顺利。"
 tarim_basin.0226.t:0 "祝福之沙"
 tarim_basin.0226.desc:0 "在[ali_arslan.GetFirstName]的#italic 麻札#!旁，看到人们把自己埋在陵墓周围的沙子里并不是什么稀罕事。在鄂尔多斯节期间，这样做的人成倍地增加。\n\n这个地方据说是圣地，所以被赋予了治疗的力量。特别是那些生病的人或认为自己接近死亡的人，将自己埋在沙子里，以此希望康复或者长寿。"
 tarim_basin.0226.a:0 "我讨厌沙子"
 tarim_basin.0226.b:0 "愿这些人都可以得到[ROOT.Char.GetFaith.HighGodName]祝福。"
 tarim_basin.0226.c:0 "或许...我也该试试？"
