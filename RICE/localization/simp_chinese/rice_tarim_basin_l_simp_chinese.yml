 RICE_tarim_basin_fight_cattle_great_character:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_horses_great_character:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_camels_great_character:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_goats_great_character:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_cattle_good_county:0 "新年斗兽占卜预示着好事"
 RICE_tarim_basin_fight_cattle_good_character_desc:0 "该角色最近主办了一系列斗牛比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，该角色和其统治的所有土地都将迎来成功与繁荣。"
 RICE_tarim_basin_fight_horses_good_county:0 "新年斗兽占卜预示着好事"
 RICE_tarim_basin_fight_horses_good_character_desc:0 "该角色最近主办了一系列斗马比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，该角色和其统治的所有土地都将迎来成功与繁荣。"
 RICE_tarim_basin_fight_camels_good_county:0 "新年斗兽占卜预示着好事"
 RICE_tarim_basin_fight_camels_good_character_desc:0 "该角色最近主办了一系列斗骆驼比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，该角色和其统治的所有土地都将迎来成功与繁荣。"
 RICE_tarim_basin_fight_goats_good_county:0 "新年斗兽占卜预示着好事"
 RICE_tarim_basin_fight_goats_good_character_desc:0 "该角色最近主办了一系列斗山羊比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，在不久的将来，该角色和其统治的所有土地都将迎来成功与繁荣。"
 RICE_tarim_basin_fight_cattle_great_county:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_cattle_great_character_desc:0 "该角色最近主办了一系列斗牛比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，该角色和其统治的所有土地很快都将财源滚滚！"
 RICE_tarim_basin_fight_horses_great_county:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_horses_great_character_desc:0 "该角色最近主办了一系列斗马比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，该角色和其统治的所有土地很快都将财源滚滚！"
 RICE_tarim_basin_fight_camels_great_county:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_camels_great_character_desc:0 "该角色最近主办了一系列斗骆驼比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，该角色和其统治的所有土地很快都将财源滚滚！"
 RICE_tarim_basin_fight_goats_great_county:0 "新年斗兽占卜预示着伟大之事"
 RICE_tarim_basin_fight_goats_great_character_desc:0 "该角色最近主办了一系列斗山羊比赛，作为一年之初的一种占卜形式（这一传统源自塔里木盆地的一些民族）。根据比赛结果，该角色和其统治的所有土地很快都将财源滚滚！"
 RICE_tarim_basin_dunhuang_economic_bonus_greater:0 "唐廷给予商业援助"
 RICE_tarim_basin_dunhuang_economic_bonus_greater_desc:0 "唐朝虽然受到各种内忧外患的问题，但通过一些旨在增加该地区的繁荣、鼓励贸易、扶贫等方面的朝廷法令，慷慨地帮助了归义军。"
 RICE_tarim_basin_dunhuang_economic_bonus_lesser:0 "$RICE_tarim_basin_dunhuang_economic_bonus_greater$"
 RICE_tarim_basin_dunhuang_economic_bonus_lesser_desc:0 "$RICE_tarim_basin_dunhuang_economic_bonus_greater$"
 RICE_tarim_basin_dunhuang_military_bonus_greater:0 "唐廷的军事援助"
 RICE_tarim_basin_dunhuang_military_bonus_greater_desc:0 "尽管曾经强大的唐朝忙于内忧外患，无法提供许多士兵来援助归义军，但他们还是通过朝廷的法令提供了某种形式的军事援助，如派遣有才能的将军、关于外国军队的情报、一些军械等等。"
 RICE_tarim_basin_dunhuang_military_bonus_lesser:0 "$RICE_tarim_basin_dunhuang_military_bonus_greater$"
 RICE_tarim_basin_dunhuang_military_bonus_lesser_desc:0 "$RICE_tarim_basin_dunhuang_military_bonus_greater$"
 RICE_tarim_basin_dunhuang_political_bonus_greater:0 "唐廷的政治援助"
 RICE_tarim_basin_dunhuang_political_bonus_greater_desc:0 "虽然唐朝已经衰弱，但朝廷还是慷慨地授予该角色和他们的一些官员任职（虚职）以表彰他们，更重要的是给予他们关于天下局势的有用信息，这可能对他们有很大帮助。"
 RICE_tarim_basin_dunhuang_political_bonus_lesser:0 "$RICE_tarim_basin_dunhuang_political_bonus_greater$"
 RICE_tarim_basin_dunhuang_political_bonus_lesser_desc:0 "$RICE_tarim_basin_dunhuang_political_bonus_greater$"
 RICE_tarim_basin_wrote_first_turkic_dictionary:0 "编写了第一本突厥语大词典"
 RICE_tarim_basin_wrote_first_turkic_dictionary_desc:0 "这位以突厥语遗产为荣的学者，长期努力撰写了第一部突厥语词典，名为#bold 《突厥语大词典》（Diwan Lughat al‑Turk）#!。"
 RICE_tarim_basin_eight_protectors_blessing_1:0 "轻微$RICE_tarim_basin_eight_protectors_blessing_2$"
 RICE_tarim_basin_eight_protectors_blessing_2:0 "于阗八大明王的赐福"
 RICE_tarim_basin_eight_protectors_blessing_3:0 "较大$RICE_tarim_basin_eight_protectors_blessing_2$"
 RICE_tarim_basin_eight_protectors_blessing_4:0 "重大$RICE_tarim_basin_eight_protectors_blessing_2$"
 RICE_tarim_basin_silk_road_entertainer_origin:0 "丝路艺人"
 RICE_tarim_basin_silk_road_entertainer_origin_desc:0 "该角色曾经是著名丝路艺人，也许是乐师或者舞者。无论他们最初是奴隶还是自由人（通常更可能是前者），他们通常为精英们表演，而这样的精英们注意到了他们的才华并将他们提升到更高的地位。"
 RICE_tarim_basin_similar_opinions_entertainers:0 "相似的娱乐品味"
 RICE_tarim_basin_honored_entertainer:0 "荣幸地被注意到"
 RICE_tarim_basin_allowed_me_marry:0 "祝福我的爱人"
 RICE_tarim_basin_took_me_as_a_plaything_likes_guy:0 "不甘心的玩物"
 RICE_tarim_basin_protected_me_from_creep:0 "保护我不被猥亵"
 RICE_tarim_basin_took_me_as_a_plaything_didnt_like_guy:0 "$RICE_tarim_basin_took_me_as_a_plaything_likes_guy$"
 RICE_tarim_basin_took_away_my_beloved:0 "将我的爱人掳走"
 RICE_tarim_basin_prevented_me_from_marrying_beloved:0 "阻止我与我所爱的人在一起"
 RICE_tarim_basin_unwilling_marriage:0 "不愿成为妃子"
 RICE_tarim_basin_forced_to_be_consort:0 "强迫我成为一个男人的玩物"
 RICE_tarim_basin_attended_ordam_mazar:0 "最近参与奥达木节"
 RICE_tarim_basin_attended_ordam_mazar_desc:0 "该角色最近去了喀什，在奥达木节期间在他们的麻札上祭拜喀什的伟大烈士。这既是一个宗教反思和虔诚的时刻，也是一个兴奋和与来自各行各业的人交际时刻。"
 RICE_tarim_basin_inspired_by_ali_arslan:0 "喀什噶尔烈士的启示"
 RICE_tarim_basin_inspired_by_ali_arslan_mom:0 "喀什烈士之母的启示"
 RICE_tarim_basin_ordam_sands:0 "被喀什大麻札之沙所祝福"
 RICE_tarim_basin_khotan_monastic_refugee:0 "来自于阗的避难僧侣"
 RICE_tarim_basin_khotan_monastic_refugee_desc:0 "该角色在于阗出家。然而这座曾经是佛教中心的城市最近发生了一些动荡和政治变化，导致这座城市不再尊重佛教徒。因此这位僧侣当时决定逃往更安全的地方。"
 RICE_tarim_basin_khotan_noble_refugee:0 "来自于阗的流亡贵族"
 RICE_tarim_basin_khotan_noble_refugee_desc:0 "该角色原本是信仰佛教的于阗贵族。然而这个曾经作为佛教中心的城市，最近发生了一些动荡和政治变化，导致这个城市不再尊重佛教徒。因此这位贵族当时决定逃往更安全的地方。"
 RICE_tarim_basin_helped_khotan_monastic_refugees:0 "帮助于阗的避难僧侣"
 RICE_tarim_basin_helped_khotan_monastic_refugees_desc:0 "该角色最近收留了一些逃离于阗的佛教徒，于阗曾经是一个佛教的中心，但现在正经历着一些政治动荡。"
 RICE_tarim_basin_helped_khotan_noble_refugees:0 "帮助于阗的流亡贵族"
 RICE_tarim_basin_helped_khotan_noble_refugees_desc:0 "该角色最近收留了一些信仰佛教的贵族，于阗曾经是佛教的中心，但现在正经历着一些政治动荡，所以这些贵族决定逃离于阗。"
 RICE_tarim_basin_dunhuang_crescent_lake_visit:0 "参观敦煌月牙泉"
 RICE_tarim_basin_dunhuang_irrigation_experts:0 "修复古中国灌溉和运河系统"
 RICE_tarim_basin_dunhuang_irrigation_experts_desc:0 "最近来自中国的专家受雇来到这个地区，修复一些古老的运河和灌溉系统。这些水利系统已经存在了几个世纪，甚至更久。"
 RICE_tarim_basin_gift_serindian_art:0 "塞林迪亚艺术礼物"
 RICE_tarim_basin_gift_serindian_art_desc:0 "外国商人最近送给这个人各种小艺术品，这些艺术品融合了中国、印度、吐蕃、波斯和塔里木盆地等丝绸之路上的风格。"
 RICE_tarim_basin_took_monk_inheritance:0 "被不当扣押的已故僧侣的财产"
 RICE_tarim_basin_enforcing_monastic_regulations:0 "严格的寺院法律"
 RICE_tarim_basin_enforcing_monastic_regulations_desc:0 "该地区曾出现多起假僧尼事件。这些人在明面假装是僧侣，暗地里过着正常的家庭和生活。无论如何领主开始打击这种形式的逃税，引起当地民众的不满。"
 RICE_tarim_basin_lax_monastic_regulations:0 "宽松的寺院法律"
 RICE_tarim_basin_lax_monastic_regulations_desc:0 "该地区曾出现多起假僧尼事件。这些人在明面假装是僧侣，暗地里过着正常的家庭和生活。领主似乎不愿意对这种形式的逃税行为采取任何措施，但这正在减少潜在的税收。"
 RICE_tarim_basin_juicy_dunhuang_melons:0 "享用敦煌多汁的瓜果"
 RICE_tarim_basin_taking_rhubarb:0 "服用大黄药"
 RICE_tarim_basin_famous_silk_road_peddler_visits:0 "著名的丝路商人途经此地"
 RICE_tarim_basin_rejected_by_entertainer:0 "被一个卑微的艺人拒绝了"
