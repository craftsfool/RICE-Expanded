 tarim_basin.0031.desc.himalayan:0 "我为改善当地喜马拉雅部族关系所做的努力正在取得成果。通过倾听他们的诉求，并努力改善当地条件，而他们也反过来帮助我找到引进资源用于基础设施项目的方法，而且他们的领导人经常支持我，并安抚他们内部的不满分子。"
 tarim_basin.0031.desc.indian:0 "我为改善当地印度社区关系所做的努力正在取得成果。通过倾听他们的诉求，并努力改善当地条件，而他们也反过来帮助我找到引进资源用于基础设施项目的方法，而且他们的领导人经常支持我，并安抚他们内部的不满分子。"
 tarim_basin.0031.a:0 "我们将一起使这片土地变得更好、更强、更繁荣。"
 tarim_basin.0032.t:0 "新护卫"
 tarim_basin.0032.desc.east_asian:0 "一些来自当地东亚世家健壮年轻人提出要成为我的护卫。这是我努力改善双方关系所得成果，他们希望通过确保我的安全来回报我的帮助。\n\n世家长者为他们的技艺和战斗经验做了担保，有些人甚至在丝绸之路沿路中做过几年雇佣兵。他们会无畏地保护我，并以绝对的忠诚为我服务。"
 tarim_basin.0032.desc.steppe:0 "一些来自当地草原部族健壮年轻人提出要成为我的护卫。这是我努力改善双方关系所得成果，他们希望通过确保我的安全来回报我的帮助。\n\n部族长老为他们的技艺和战斗经验做了担保，有些人甚至在丝绸之路沿路中做过几年雇佣兵。他们会无畏地保护我，并以绝对的忠诚为我服务。"
 tarim_basin.0032.desc.middle_eastern:0 "一些来自当地中东社区健壮年轻人提出要成为我的护卫。这是我努力改善双方关系所得成果，他们希望通过确保我的安全来回报我的帮助。\n\n社区精英为他们的技艺和战斗经验做了担保，有些人甚至在丝绸之路沿路中做过几年雇佣兵。他们会无畏地保护我，并以绝对的忠诚为我服务。"
