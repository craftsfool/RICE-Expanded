 activity_RICE_tarim_basin_khotan_procession:0 "于阗年度画行"
 activity_RICE_tarim_basin_khotan_procession_desc:0 "现在是时候通过参加于阗的年度游行仪式来重申我们对佛门三宝的虔诚了。自从于阗成为[GetTitleByKey('c_khotan').GetNameNoTier]后，几个世纪以来游行仪式一直在庆祝，从未间断过。于阗的每个人都参与其中，从平民到僧侣再到皇室。"
 activity_RICE_tarim_basin_khotan_procession_selection_tooltip: "参加于阗年度画行\n\n$RICE_tarim_basin_khotan_procession_context_tooltip$"
 activity_RICE_tarim_basin_khotan_procession_host_desc: "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$有概率[GetModifier('RICE_tarim_basin_participated_in_khotan_procession').GetNameWithTooltip][character_modifier|E]\n$BULLET_WITH_TAB$有概率获得[eight_protectors_of_khotan|E]祝福的#P [character_modifier|E]#!，概率取决于你的[piety_level|E]和[activity_options|E]"
 activity_RICE_tarim_basin_khotan_procession_guest_desc: "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$[GetModifier('RICE_tarim_basin_participated_in_khotan_procession').GetNameWithTooltip][character_modifier|E]"
 activity_RICE_tarim_basin_khotan_procession_province_desc: "在[GetTitleByKey('b_khotan').GetNameNoTier]，只要有人记得八大明王，就会每年发生游行。"
 activity_RICE_tarim_basin_khotan_procession_destination_selection: "$activity_RICE_tarim_basin_khotan_procession_province_desc$"
 activity_RICE_tarim_basin_khotan_procession_guest_help_text: "$activity_RICE_tarim_basin_khotan_procession$"
 activity_RICE_tarim_basin_khotan_procession_predicted_cost: "这项[activity|E]的费用主要基于你的[income|E]和你选择的[activity_options|E]。"
 activity_RICE_tarim_basin_khotan_procession_conclusion_desc: "[GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName]已结束，一切尽在佛、法、僧之间！"
 RICE_tarim_basin_khotan_procession_monastery_type: "资助佛寺"
 RICE_tarim_basin_khotan_procession_monastery_type_none: "资助诸寺"
 RICE_tarim_basin_khotan_procession_monastery_type_none_desc: "$EFFECT_LIST_BULLET$在准备游行的过程中，你不会给于阗的任何大乘寺提供任何特别的捐赠。\n$EFFECT_LIST_BULLET$与其他选项相比，没有额外的加成。\n\n#weak 支持大乘寺是很重要的，但没有必要偏袒某个大乘寺，特别是在年度画行的背景下。一个适度的捐赠，分配给所有大乘寺就足够了。#!"
 RICE_tarim_basin_khotan_procession_monastery_type_other: "资助小寺"
 RICE_tarim_basin_khotan_procession_monastery_type_other_desc: "$EFFECT_LIST_BULLET$在准备游行的过程中，你将赞助于阗十四座佛寺中不太知名的一座。\n$EFFECT_LIST_BULLET$此次[activity|E]将会增加[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_tarim_basin_khotan_basic_donation_cost')]#!花费\n$EFFECT_LIST_BULLET$在[activity|E]结束后会获得[prestige_i|E]#V 50#!\n\n#weak 虽然瞿摩帝寺和麻射寺是于阗最有名的佛寺，但还有其他佛寺也参加了每年的游行活动。虽然它们没有那么突出，但是它们仍然很重要，所以我们应该支持这些佛寺中的一个!#!"
 RICE_tarim_basin_khotan_procession_monastery_type_mashe: "资助麻射寺"
 RICE_tarim_basin_khotan_procession_monastery_type_mashe_desc: "$EFFECT_LIST_BULLET$在准备游行的过程中，你将赞助给麻射寺，因为该寺与于阗的丝绸业有着传奇般的联系。\n$EFFECT_LIST_BULLET$此次[activity|E]将会增加[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_tarim_basin_khotan_mashe_donation_cost')]#!花费\n$EFFECT_LIST_BULLET$在[activity|E]结束后，获得[prestige_i|E]#V 100#!\n\n#weak 相传丝绸被带到于阗，要感谢一位中国公主，而麻射寺就建在她种植桑树的地方。因此，该寺院在该地区备受推崇，值得我们支持。#!"
 RICE_tarim_basin_khotan_procession_monastery_type_gomati: "资助瞿摩帝寺"
 RICE_tarim_basin_khotan_procession_monastery_type_gomati_desc: "$EFFECT_LIST_BULLET$在准备游行的过程中，你将赞助给伟大的瞿摩帝寺，它是于阗的佛教中心。\n$EFFECT_LIST_BULLET$此次[activity|E]将会增加[gold_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_tarim_basin_khotan_gomati_donation_cost')]#!花费\n$EFFECT_LIST_BULLET$在[activity|E]结束后获得[prestige_i|E]#V 150#!\n$EFFECT_LIST_BULLET$如果你[rank|E]是[king|E]或[emperor|E]，或者你有$piety_level_3$[piety_level|E]，那么在这个[activity|E]结束时获得#V 25#![dynasty_prestige|E]\n\n#weak 于阗国中十四大僧伽蓝（意为寺庙，而国内称之为大乘寺）中，瞿摩帝寺无疑是最伟大的。所有人都知道它的辉煌，它在于阗的年度游行中的作用是无可比拟的，我们支持它是理所当然的。#!"
 RICE_tarim_basin_khotan_procession_donation_type: "资助规模"
 RICE_tarim_basin_khotan_procession_donation_type_small: "小额"
 RICE_tarim_basin_khotan_procession_donation_type_small_desc: "$BULLET_WITH_TAB$在这个[activity|E]结束时获得[piety_i|E]#V 50#!\n$BULLET_WITH_TAB$从[eight_protectors_of_khotan|E]那里获得祝福[modifier|E]的几率降低。\n\n#weak 我们将拿出适当数量的资金和资源，捐赠给僧伽蓝。#!"
 RICE_tarim_basin_khotan_procession_donation_type_medium: "足额"
