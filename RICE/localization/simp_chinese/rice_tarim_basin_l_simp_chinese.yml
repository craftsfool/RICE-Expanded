 tarim_basin.0240.t:0 "对中国的#italic 宣称权#!"
 tarim_basin.0240.desc:0 "许多博学的[ROOT.Char.GetFaith.GetReligion.GetAdjective]学者说，中国曾经由三个版图组成：既由上秦（ 拓跋）、中秦（契丹）和下秦（喀喇汗），我现在[GetGeographicalRegion('world_steppe_tarim').GetName]拥有大量的领土，这意味着我统治了一部分中国，因此我可以得到许多荣誉称号，例如东方和中国的王、东方和中国的苏丹亦或者桃花石。\n\n在当今时代，整个[ROOT.Char.GetFaith.GetReligion.GetAdjective]世界的人们将中国视为文明社会的缩影，那块土地里面充满智慧的学者、正直的官员和熟练的工匠。如果我们声称拥有中国的宣称权，并建立了一部分中国，整个[ROOT.Char.GetFaith.GetReligion.GetAdjective]世界的人们都应该为此尊重我们，我们应该为这样一个著名的成就而感到骄傲！"
 tarim_basin.0240.a:0 "你知道，我自己就是中国的一个统治者。"
 tarim_basin.0241.t:0 "对中国的#italic 宣称权#!"
 tarim_basin.0241.desc:0 "来自[fake_china_claimer.GetDynasty.GetName]王朝中他们的一个子孙，[fake_china_claimer.GetTitledFirstName]，是[fake_china_claimer.GetHerHis]家族中第一个正式宣布[fake_china_claimer.GetHerselfHimself]成为中国统治者，并使用各种荣誉称号，如#italic Malik al‑Mashriq wa al‑Sin#!（“东方和中国的王”）、#italic Sultan al‑Sharq wa al‑Sin#!（“东方和中国的苏丹”）和#italic Tabgach Khan#!（“中国大汗”）。他们对此逻辑是，他们在[GetGeographicalRegion('world_steppe_tarim').GetName]统治着相当大的一块领土，而这块领土在此之前一直由中国统治，所以他们拥有对中国的#italic 宣称权#!\n\n在当今时代，整个[fake_china_claimer.GetFaith.GetReligion.GetAdjective]世界的人们将中国视为文明社会的缩影，那块土地里面充满智慧的学者、正直的官员和熟练的工匠。显然[fake_china_claimer.GetDynasty.GetName]王朝希望吸引充满幻想的人，用来巩固自己的形象和地位。"
 tarim_basin.0241.a:0 "天知道他们会为此宣称多少年呢？"
 tarim_basin.0242.t:0 "xxxxx"
 tarim_basin.0242.desc:0 "xxxxx"
 tarim_basin.0242.a:0 "xxxxx"
 tarim_basin.0243.t:0 "不再是中国"
 tarim_basin.0243.desc:0 "很久以前，[RICE_tarim_basin_fake_china_person.GetDynasty.GetName]家族声称自己是中国的统治者……从某种思路来说，确实有些道理，因为他们统治了[GetGeographicalRegion('world_steppe_tarim').GetName]的部分地区，这个时代许多穆斯林认为这些地区是前中国控制区的一部分。也许用他们是#italic 中国部分领土统治者#!来说更合理。\n\n现在已经没有什么论点可以支持这个可笑的骗局了。由于某种原因，[RICE_tarim_basin_fake_china_person.GetDynasty.GetName]家族的子孙们已经失去了对塔里木盆地领土的控制。现在没有人会再认真对待这种说法。"
 tarim_basin.0243.a:0 "对于[RICE_tarim_basin_fake_china_person.GetDynasty.GetName]家族来说是黑暗的一天。"
 tarim_basin.0244.t:0 "奥达木麻札"
 tarim_basin.0244.desc:0 "曾经有一段时间，[GetGeographicalRegion('world_steppe_tarim').GetName]的大部分地区被残忍无知的异教徒统治。这种情况随着[ali_arslan.GetTitledFirstName]而改变，他是[khotan.GetNameNoTier]的第一位[ordam_builder.GetFaith.GetReligion.GetAdjective]统治者。不管[ali_arslan.GetSheHe]是否是[ordam_builder.GetFaith.GetReligion.GetName]的真正信徒，不可否认的是许多[ordam_builder.GetFaith.GetReligion.GetName]的追随者对[ali_arslan.GetHerHim]的评价很高，部分原因是围绕[ali_arslan.GetHerHis]的生活作风和作为烈士而牺牲，他有许多传说。例如传说中[ali_arslan.GetSheHe]实际上是圣加百列的[ali_arslan.Custom('GetDaughterSon')]。有些传说甚至相互矛盾，有人声称[ali_arslan.GetSheHe]是被[khotan.GetNameNoTier]残忍的异教徒斩首的，而其他人则说[ali_arslan.GetSheHe]死时很平静。\n\n位于[kashgar.GetNameNoTier]的[ali_arslan.GetNamePossessive]墓地最近成了一个引人注目的朝圣地，我已经采取措施，将陵墓扩建为一个合适的#italic 麻札#!，信徒们可以在这里向这位伟大的烈士表示敬意并崇拜[ordam_builder.GetFaith.HighGodName]。"
 tarim_basin.0244.a:0 "显然诞生了一新节日在这个城市里。"
 tarim_basin.0245.t:0 "奥达木麻札"
 tarim_basin.0245.desc:0 "最近我收到消息，[ordam_builder.GetTitledFirstName]最近完成[ali_arslan.GetTitledFirstName]在[khotan.GetNameNoTier]的#italic 麻札#!上的扩建。不管[ali_arslan.GetFirstNamePossessive]在生活中成就如何，也不管[ali_arslan.GetSheHe]是否是[ordam_builder.GetFaith.GetReligion.GetName]的虔诚信徒，很多人都对认为[ali_arslan.GetSheHe]是一位真正伟大且值得尊敬的烈士，因为[ali_arslan.GetHerHis]在对抗曾经在[GetGeographicalRegion('world_steppe_tarim').GetName]占主导地位且残暴的异教徒时，有着英勇功绩。\n\n随着[ali_arslan.GetTitledFirstName]的传说不断传播和发酵，许多人都涌向[ali_arslan.GetHerHis]的坟墓，向他表示尊敬。我甚至听说现在[kashgar.GetNameNoTier]经常举行新的庆祝活动，即所谓的奥达木节，以纪念[ali_arslan.GetHerHis]作为[ordam_builder.GetFaith.GetReligion.GetName]的烈士。"
 tarim_basin.0245.a:0 "也许有一天我会去扫墓，以示敬意。"
 tarim_basin.0246.t:0 "大辽权臣"
 tarim_basin.0246.desc:0 "吾非以宽仁得跻[GetTitleByKey('e_great_liao').GetNameNoTier]要位，吾本出寒微，非纨绔膏粱之辈，杖以铁腕绝智，方得跻身青云，因而不愿子孙复蹈饥寒。\n\n而今[daozong.GetTitledFirstName]视吾若股肱，言必纳谏，指日可总揽乾纲，然[guanyin.GetFullName]，容德兼备，子嗣繁茂，实为心腹大患。\n\n吾必将除之……"
 tarim_basin.0246.a:0 "只需圣眷厌恶……"
 tarim_basin.0247.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 tarim_basin.0247.desc:0 "既垂帘听政，何须为天下主？\n\n吾操持[GetTitleByKey('e_great_liao').GetNameNoTier]国柄于帷幄之中，其途险巇，然终得少年时梦寐之权财。[daozong.GetTitledFirstName]实为吾掌中傀儡，宿敌[guanyin.GetFirstName]已殒，家资累世之积，子孙可永绝饥寒——再不复当年箪食瓢饮之困！  \n\n愚氓皆颂[guanyin.GetFirstNameNoTooltip]仁德，然仁德何用？终化冢中枯骨。惟吾以霹雳手段，方成此不世之功。"
 tarim_basin.0247.a:0 "天下都皆敬畏吾！"
 tarim_basin.0248.t:0 "xxxxx"
 tarim_basin.0248.desc:0 "xxxxx"
 tarim_basin.0248.a:0 "xxxxx"
 tarim_basin.0249.t:0 "xxxxx"
 tarim_basin.0249.desc:0 "xxxxx"
 tarim_basin.0249.a:0 "xxxxx"
 tarim_basin.0250.t:0 "寻常洞窟之旅"
 tarim_basin.0250.desc:0 "我正在参观[dunhuang.GetNameNoTier]附近的一个莫高窟，与当地的各种知名人士和僧侣会面，做一些例行的祈祷和宗教仪式。\n\n仪式结束后，我花了一些时间看了一下洞窟里面的艺术。里面主要是壁画，它描绘了洞窟最初的赞助人以及其家族。他们都穿着在当时最昂贵漂亮的服装，也许是一两个世纪以前的时尚。"
 tarim_basin.0250.a:0 "已经无法得知当年是什么样子!"
 tarim_basin.0250.b:0 "他们都是和我们一样的普通人，不是吗？"
 tarim_basin.0250.c:0 "命运无常，我们终究也会这样。"
 tarim_basin.0251.t:0 "昙花一现"
 tarim_basin.0251.desc:0 "当我去[dunhuang.GetNameNoTier]附近的莫高窟旅游，视察我祖先的一个洞窟时，我看到有人在参观其他洞窟，那个洞窟很有吸引力。"
 tarim_basin.0251.a:0 "不要理会他们，我来这里是为了精神寄托。"
 tarim_basin.0251.b:0 "走近他们进行友好的交谈。"
 tarim_basin.0252.t:0 "曾经的长城"
 tarim_basin.0252.desc:0 "我经过[GetGeographicalRegion('RICE_dunhuang_region').GetName]中的古长城的一段废墟部分。几个世纪前，这些城墙、壁垒和守卫曾经是令人印象深刻的景象，当时中国的一个王朝的士兵驻扎在这里。现在除了风化的石头、灰尘和沙子，什么都没有留下。"
 tarim_basin.0252.a:0 "这就是万事无常。"
 tarim_basin.0252.b:0 "无法想象当年是多么辉煌！"
 tarim_basin.0253.t:0 "河西走廊"
 tarim_basin.0253.desc:0 "谢天谢地！最近有几位专家从中国赶来，帮助我们维护[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]的灌溉水渠。[GetGeographicalRegion('RICE_dunhuang_region').GetName]的许多运河都很古老，有些可以追溯到汉朝时期，所以它们需要一直修缮。"
 tarim_basin.0253.a:0 "我们非常感谢他们的技术。"
 tarim_basin.0254.t:0 "西域艺术家"
 tarim_basin.0254.desc:0 "居住在该地区的一些艺术家联合起来向我赠送一些艺术作品，以表示他们对我的支持。他们送给我各种雕塑、绘画和卷轴，上面有各种风格，来自印度、中国、波斯和吐蕃艺术风格，在西域，艺术风格经常像这样同步和融合，这并不奇怪。"
 tarim_basin.0254.a:0 "这是一份很棒的礼物！"
 tarim_basin.0255.t:0 "尼姑的遗产"
 tarim_basin.0255.desc:0 "住在附近的一位著名的尼姑最近去世了。她是我的熟人，有趣的是在她的遗嘱中，她把一些世俗的财产留给了我，比如丝绸长袍或宗教卷轴。\n\n然而她的家人想对此提出异议，要求法律判决。虽然法官很可能会支持我，但这种情况可能会变得很混乱。"
 tarim_basin.0255.a:0 "那些东西是我的！我拒绝上法庭！"
 tarim_basin.0255.b:0 "他们可以拥有这些东西。我不需要它们。"
 tarim_basin.0255.c:0 "交给法律，体面的解决这事吧"
 tarim_basin.0255.d:0 "也许我们应该和解"
 tarim_basin.0256.t:0 "僧侣之愿"
 tarim_basin.0256.desc:0 "住在附近寺院的一位老和尚最近去世了。他有一些宝贵的财产，但他的遗嘱不明确，所以他的亲属正在争夺这些财产。\n\n这种情况在这里的许多佛寺中很常见。然而由于这个和尚来自一个著名的家族，鉴于他的亲属本身就很有势力，我觉得我应该干预以恢复秩序。如果他们打架，可能会引起很大的骚乱。"
 tarim_basin.0256.a:0 "我将进行干预，决定谁应该得到什么。"
 tarim_basin.0256.b:0 "我不应该干预，这是一桩私事。"
 tarim_basin.0256.c:0 "老实说，他所有的财产现在都属于国家。"
 tarim_basin.0257.t:0 "假和尚，假尼姑"
 tarim_basin.0257.desc:0 "最近该地区出现了一种趋势，即纸面上是佛教僧侣和尼姑，但实际上却过着正常的生活，有正常的工作和家庭。很明显许多人是为了逃税而去成为神职人员，因为和尚是不纳税的。\n\n我和我的许多官员一直不愿意对这个问题采取任何行动，以免激怒宗教势力。然而这是一个日益严重的问题，我不想再让它就这么过去了。"
 tarim_basin.0257.a:0 "不要理会他们的借口！ 执行法律，并对违法者进行罚款！"
 tarim_basin.0257.b:0 "让他们过去吧。我有更重要的问题要处理。"
 tarim_basin.0258.t:0 "多汁的甜瓜"
 tarim_basin.0258.desc:0 "今天，我收到了一些当地商人赠送的来自[dunhuang.GetNameNoTier]，来自敦煌的瓜果。敦煌甜瓜因其质量和味道而非常有名，大家都喜欢吃。"
 tarim_basin.0258.a:0 "非常感谢你"
 tarim_basin.0259.t:0 "失落的洞窟"
 tarim_basin.0259.desc:0 "有一个来自[dunhuang.GetNameNoTier]莫高窟的有趣的消息！在属于我管辖的一个寺院的洞窟旁边发现了一个隐蔽的，被封闭的洞窟——换句话我可以处置这个洞窟。\n\n虽然山洞里大多没有任何贵重物品，但里面有许多漂亮的房间，装饰着各种绘画和艺术品，即使有些破旧。寺院的长老建议我用一些资金来修缮山洞，这将给我带来很多功德。"
 tarim_basin.0259.a:0 "我们可以让它恢复到以前的辉煌！"
 tarim_basin.0259.b:0 "不错的消息，但是我没钱。"
 tarim_basin.0260.t:0 "前往中国的使者"
 tarim_basin.0260.desc:0 "一支来自其他王国的重要使团正经过[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]，因为这个地区是他们走向最终目的地——唐朝的一个重要站点。\n\n因为这个使节团很重要，不是普通的商队，我的一些廷臣建议我欢迎他们，而不仅仅是简单的问候，可以建立一些良好的关系，给人留下一个好印象，这并没有什么坏处，不是吗？"
 tarim_basin.0260.a:0 "为他们举办宴会，给他们提供路上的日用品。"
 tarim_basin.0260.b:0 "让外国人通过我们的土地就已经是一种礼貌了。"
 tarim_basin.0261.t:0 "丝绸之路争端"
 tarim_basin.0261.desc:0 "今天，当地社区的两个精英出现在我面前，要求我解决他们的争端。一个是来自粟特族的商人，另一个是来自于阗的[ROOT.Char.Custom('DefaultPriestTitle')]。\n\n粟特族商人声称，[ROOT.Char.Custom('DefaultPriestTitle')]没有全额支付他的商品。[ROOT.Char.Custom('DefaultPriestTitle')]声称商人欺骗了他。谁才是正确的？"
 tarim_basin.0261.a:0 "商人给出了更好的证据。"
 tarim_basin.0261.b:0 "[ROOT.Char.Custom('DefaultPriestTitle')]显然是对的"
 tarim_basin.0261.c:0 "这不关我事的，滚！"
 tarim_basin.0261.d:0 "我想只是一个误解……毕竟法律上……"
 tarim_basin.0262.t:0 "大黄"
 tarim_basin.0262.desc:0 "我最近开始服用一些[suzhou.GetNameNoTier]的大黄。根据一些医生的建议，这种草本植物被称为有助于消化，所以他们向我推荐了它。\n\n大黄最早是在[suzhou.GetNameNoTier]的[GetGeographicalRegion('RICE_dunhuang_region').GetName]种植。那里的大黄被认为是世界上质量最好的大黄。因此经常有商人穿越丝绸之路来这里出售。"
 tarim_basin.0262.a:0 "真是一个好东西。"
 tarim_basin.0263.t:0 "一个宏伟的新洞窟"
 tarim_basin.0263.desc:0 "莫高窟中靠近[dunhuang.GetNameNoTier]的一个大型石窟最近完成了工作，所有的雕刻、装饰都已完成。这是几个非宗教人士和寺院们共同努力的结果，里面拥有几尊大型佛和菩萨的泥像。\n\n因为有几位贵人参与赞助它的建设，包括一些来自我管辖的寺院僧侣，这些精英邀请我和其他几位一起参加洞窟的盛大开幕式，甚至为我支付了旅费。当我亲自来视察这个洞窟时，我不得不承认它非常令人印象深刻。这些雕像和绘画栩栩如生，激发了在场许多人的敬畏和虔诚。"
 tarim_basin.0263.a:0 "祝贺他们建造这样一个宏伟的洞窟！"
 tarim_basin.0264.t:0 "卧佛"
 tarim_basin.0264.desc:0 "在参观敦煌附近的一个莫高窟时，我遇到了一尊巨大而威严的卧佛像。这尊雕像鲜艳的色彩和巨大的尺寸让我感到惊奇。我在那里敬畏地站了一会儿，欣赏着这件艺术品。"
 tarim_basin.0264.a:0 "他们是如何雕刻出这样一个杰作的？"
 tarim_basin.0264.b:0 "双手合十，并祈祷。"
 tarim_basin.0265.t:0 "丝绸礼物"
 tarim_basin.0265.desc:0 "在[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]上，丝绸很多时候是一种常见的支付方式或常见的礼物。\n\n最近在我的领土内发生一起家族内部纠纷，导致了一些骚乱以及威胁了秩序。即使对我来说，在我试图解决整个问题的过程中，这件事也成了一个巨大的头痛问题。\n\n当一切终于尘埃落定后，该家族同意为引起这样的骚乱向我支付罚款。经过一番谈判，他们同意以丝绸的形式支付罚款。"
 tarim_basin.0265.a:0 "谢谢你的合作。#italic 请#!不要再这样做了"
 tarim_basin.0266.t:0 "著名的小饰品商"
 tarim_basin.0266.desc:0 "今天，一位知名商人的商队来到了[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]。据说这位商人在丝绸之路上很有名气，他从世界的各个角落运来各种质量上乘的小饰品。该商队会在我们的领土上做一段时间的生意，然后再继续旅行。"
 tarim_basin.0266.a:0 "这样的生意是最受欢迎的。"
 tarim_basin.0266.b:0 "也许我可以买一些小饰品？"
 tarim_basin.0267.t:0 "白马塔"
 tarim_basin.0267.desc:0 "今天，我参观了位于敦煌城中心的白马塔，即[dunhuang.GetNameNoTier]。它是几个世纪前由佛教僧侣鸠摩罗什建造的，尽管他有印度和龟兹皇家血统，但他毕生致力于将佛教文本翻译成中文。据传这座古塔是著名龟兹高僧鸠摩罗什为他的心爱坐骑白马而建，白马在鸠摩罗旅游敦煌时去世的，当地佛教信徒遂葬白马于城下，修塔以纪念，取名“白马塔”。"
 tarim_basin.0267.a:0 "这座纪念碑至今仍屹立不倒，这是多么了不起的事情啊!"
 tarim_basin.0267.b:0 "作为一个[ROOT.Char.GetFaith.GetAdherentName]，我不禁感叹万分。"
 tarim_basin.0267.c:0 "虽然我的信仰不同，但我觉得这样的故事很鼓舞人心。"
 tarim_basin.0267.d:0 "这很好，但对我这样的[ROOT.Char.GetFaith.GetAdherentName]来说，意义不大。"
 tarim_basin.0268.t:0 "莫高之旅"
 tarim_basin.0268.desc:0 "我在[GetGeographicalRegion('RICE_dunhuang_region').GetName]的领土内进行了一次短途旅行回到家中，当时我目睹了几个人在那里的佛教圣地祈祷。我问他们在做什么，他们说他们是香客商队，他们的最终目的地是敦煌莫高窟。他们想在旅途中向佛陀祈求保护。"
 tarim_basin.0268.a:0 "啊！我懂了。那么祝你旅途顺利！"
 tarim_basin.0268.b:0 "祷告是不够的。你需要金钱和智慧。"
 tarim_basin.0269.t:0 "与中国联系"
 tarim_basin.0269.desc:0 "一群艺伎今天从唐朝来访。尽管就大唐子民而言，我们处于文明的边缘，但我们仍然与他们保持着商业和文化联系。剧团是我认识的一些唐朝富豪提供的，我很高兴他们想到了我。\n\n剧团给我和我的宫廷带来了很多乐趣，之后我给了他们精美的丝绸、香料等礼物，以作为赏赐。"
 tarim_basin.0269.a:0 "一个印象极深的表演"
 tarim_basin.0270.t:0 "龟兹音乐"
 tarim_basin.0270.desc:0 "来自[kucha.GetNameNoTier]的音乐在[GetGeographicalRegion('world_steppe_tarim').GetName]周围特别流行，几个世纪以来一直如此。\n\n今天晚上我走在街头时，我遇到了一些来自[GetGeographicalRegion('world_steppe_tarim').GetName]其他地区的旅行艺人，而且他们显然擅长演奏[kucha.GetNameNoTier]的歌曲。美妙的音乐配上漂亮的伴舞娘是多么令人愉悦的。"
 tarim_basin.0270.a:0 "这是多么趣啊"
