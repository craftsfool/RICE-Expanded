 tarim_basin.0179.t:0 "一个传奇殉道者的死亡"
 tarim_basin.0179.desc:0 "最近[ali_arslan.GetTitledFirstName]的去世让中亚的许多[islam_religion.GetName]信徒感到悲痛。无论[ali_arslan.GetFirstName]是否是真正的信徒，毫无疑问，作为[khotan.GetNameNoTier]的第一位[islam_religion.GetAdjective]统治者，至少在[ali_arslan.GetSheHe]来统治这座城市时，他在塔里木盆地的宗教历史上留下浓厚的一笔。\n\n因此，许多[islam_religion.GetAdjective]当地人开始夸大[ali_arslan.GetHerHis]的成就，声称[ali_arslan.GetSheHe]是一位伟大的烈士，在战斗中打败了许多残忍的异教徒。\n\n由于种种原因，在附近的[kashgar.GetNameNoTier]刚刚修建了一座供奉[ali_arslan.GetFirstName]的小型陵墓，并迅速成为当地的一个朝圣地。也许会有雄心勃勃的当地统治者在这座陵墓的基础上进行扩建，并将其做成一些特别的东西。"
 tarim_basin.0179.a:0 "事实也是如此。"
