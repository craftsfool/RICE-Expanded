 tarim_basin.0032.desc.indian:0 "一些来自当地印度社区健壮年轻人提出要成为我的护卫。这是我努力改善双方关系所得成果，他们希望通过确保我的安全来回报我的帮助。\n\n社区精英为他们的技艺和战斗经验做了担保，有些人甚至在丝绸之路沿路中做过几年雇佣兵。他们会无畏地保护我，并以绝对的忠诚为我服务。"
 tarim_basin.0032.a:0 "我已经感觉更安全了！"
 tarim_basin.0033.t:0 "交流思想"
 tarim_basin.0033.desc.east_asian:0 "今天一些来自当地东亚世家的学者拜访了我，他们打算在我的宫殿做一个有趣的讲座，介绍他们的一些传统信仰、原则、习俗、文学和历史。在丝绸之路上，思想和文化的交流毕竟不是什么新鲜事。\n\n虽然很多信息多到超出了我的想象，但我确实学到了一些有趣的东西，我希望这一经历能使我与东方世家的友谊更深入。"
 tarim_basin.0033.desc.steppe:0 "今天一些来自当地大草原部族的学者拜访了我，他们打算在我的宫殿做一个有趣的讲座，介绍他们的一些传统信仰、原则、习俗、文学和历史。在丝绸之路上，思想和文化的交流毕竟不是什么新鲜事。\n\n虽然很多信息多到超出了我的想象，但我确实学到了一些有趣的东西，我希望这一经历能使我与大草原部族的友谊更深入。"
 tarim_basin.0033.desc.middle_eastern:0 "今天一些来自当地中东社区的学者拜访了我，他们打算在我的宫殿做一个有趣的讲座，介绍他们的一些传统信仰、原则、习俗、文学和历史。在丝绸之路上，思想和文化的交流毕竟不是什么新鲜事。\n\n虽然信息多到超出了我的想象，但我确实学到了一些有趣的东西，我希望这一经历能使我与中东社区的友谊更深入。"
