 tarim_basin.0172.t:0 "于阗佛教的末日？"
 tarim_basin.0172.desc:0 "几个世纪以来，[khotan.GetNameNoTier]是塔里木盆地的一个佛教中心，有无数的寺院和佛塔。传说中佛祖指示几位神祇，即所谓的八大明王，在城市里守护，只要人们信仰佛教就得到守护。然而佛教的核心教义之一就是万物无常，[khotan.GetNameNoTier]也不例外。很明显八大护法已经放弃了这座城城市。\n\n现在[khotan.GetNameNoTier]有了新的统治者，特别是[khotan_new_ruler.GetTitledFirstName]。无论是席卷塔里木盆地的征服者，还是皈依的本地人，[khotan_new_ruler.GetSheHe]都认为世界的真理在于[khotan_new_ruler.GetFaith.GetReligion.GetName]。转眼间这片土地和人民都发生了信仰转变，他们开始接受、尊重和崇拜[khotan_new_ruler.GetFaith.HighGodName]，而不是佛祖。尽管如此，一些仍然忠于佛教的于阗人，包括一些僧侣，已经逃到了其他地方。"
 tarim_basin.0172.a:0 "于阗的新时代开始了。"
 tarim_basin.0172.b:0 "八大明王放弃了于阗？不...不可能！"
 tarim_basin.0172.tooltip.1:0 "很明显，[eight_protectors|E]已经放弃了于阗。因此[GetModifier('RICE_tarim_basin_khotan_eight_protectors').GetNameWithTooltip][character_modifier|E]将不再授予[khotan.GetNameNoTier]的[county|E]的佛教[rulers|E]。"
 tarim_basin.0172.tooltip.2:0 "在接下来的几十年里，来自于阗的佛教难民，特别是僧侣，可能会在附近的其他佛教[realms|E]中产生（如果存在的话）。"
 tarim_basin.0173.t:0 "来自于阗的难民"
 tarim_basin.0173.desc:0 "今天，一位来自[khotan.GetNameNoTier]的难民来到我的宫殿，名字叫[khotan_refugee.GetFullName]。我们只能感叹[khotan_refugee.GetSheHe]到达这里一定经历了许多苦难。\n\n不久前，曾经是[ROOT.Char.GetFaith.GetReligion.GetName]的伟大中心，[khotan.GetNameNoTier]，被肮脏的[khotan_new_ruler.GetTitledFirstName]攫取，并被改造得面目全非；它已经无法重现曾经的辉煌了。随着所有佛寺佛塔被破坏，以及对虔诚的佛教徒迫害，人们对该地区的未来越来越感到恐惧。我甚至听说[ROOT.Char.Custom('DefaultPriestTitlePlural')]焚烧经文、雕像、遗物和其他圣物，禁止信徒来我们这里。"
 tarim_basin.0173.desc.monastic:0 "\n\n[khotan_refugee.GetFirstName]希望我能给[khotan_refugee.GetHerHim]和其他许多[ROOT.Char.Custom('DefaultPriestTitlePlural')|U]在我的土地上避难。在[khotan.GetNameNoTier]时，[khotan_refugee.GetSheHe]是[ROOT.Char.GetFaith.GetReligion.GetAdjective]的一位高僧。[khotan_refugee.GetSheHe|U]说，[khotan_refugee.GetSheHe]带着[khotan_refugee.GetHerHim]许多珍贵的经文和宗教文物前来。"
 tarim_basin.0173.desc.noble:0 "\n\n[khotan_refugee.GetFirstName]希望我能给[khotan_refugee.GetHerHim]和其他几个来自[khotan.GetNameNoTier]的贵人在我的土地上避难。在[khotan.GetNameNoTier]，[khotan_refugee.GetSheHe]是当地[ROOT.Char.GetFaith.GetReligion.GetAdjective]贵族的杰出成员。[khotan_refugee.GetSheHe|U]有一些才能，也可以作为一个廷臣为我服务。"
 tarim_basin.0173.a:0 "对信徒来说，这是一个艰难的时代。我的宫廷欢迎你！"
 tarim_basin.0173.b:0 "我帮不上什么忙，但你可以来避难。"
 tarim_basin.0174.t:0 "八大明王回归"
 tarim_basin.0174.desc:0 "笼罩[khotan.GetNameNoTier]的黑暗已经不复存在。[ROOT.Char.GetFaith.GetReligion.GetName]的威光已经回到了这座城市，而那些差点结束[ROOT.Char.GetFaith.GetReligion.GetAdjective]辉煌历史的可怕异教徒已经消失。\n\n虽然他们的破坏行为应下地狱，但值得庆幸的是，并非所有东西都被完全摧毁。最突出的是，仍然屹立不倒的是瞿摩帝寺残骸，在过去的日子里，它是[khotan.GetNameNoTier]所有寺院中最多信徒的。我与僧伽们一起工作，资助所需的资源恢复了瞿摩帝寺以前的荣光。\n\n完成这项工作后，我听到有人声称，八大明王很高兴看到[khotan.GetNameNoTier]回到了佛陀的教义中。据说这些神祇又回到了[khotan.GetNameNoTier]，再次守护城市，就像许多世纪前佛祖指示他们做的那样。"
 tarim_basin.0174.a:0 "也许八大明王确实回来了。"
 tarim_basin.0175.t:0 "八大明王回归"
 tarim_basin.0175.desc:0 "前段时间，[khotan_buddhism_restorer.GetFaith.GetReligion.GetName]的光芒似乎即将在[khotan.GetNameNoTier]熄灭，当时该城市的新统治者，他们遵循不同的信条并在该地区建立自己的信仰。佛陀的教义在那里的生存有一段时间看起来很严峻。\n\n这种情况现在正在改变。由于各种原因，[khotan_buddhism_restorer.GetFaith.GetReligion.GetName]正在回归[khotan.GetNameNoTier]。在[khotan_buddhism_restorer.GetTitledFirstName]的领导下，已努力恢复该地古老的宗教历史。特别是[khotan_buddhism_restorer.GetSheHe]为恢复瞿摩帝寺提供了资金和资源，该寺院以前是现在也是[khotan.GetNameNoTier]最著名的寺院。\n\n虔诚的佛信徒中甚至有传言说，八大明王已经回到了[khotan.GetNameNoTier]，守护于此。"
 tarim_basin.0175.a:0 "何等的美妙！"
 tarim_basin.0176.t:0 "xxxxx"
 tarim_basin.0176.desc:0 "xxxxx"
 tarim_basin.0176.a:0 "xxxxx"
 tarim_basin.0177.t:0 "于阗的伊斯兰教"
 tarim_basin.0177.desc:0 "多年来，那些信仰[ROOT.Char.GetFaith.GetReligion.GetName]的人对[khotan.GetNameNoTier]持怀疑和不屑的态度，因此该城的许多异教徒被证明是该地区[ali_arslan.GetFaith.GetReligion.GetAdjective]统治者的心头大患。\n\n现在[ali_arslan.GetTitledFirstName]已经成为[khotan.GetNameNoTier]的第一位[ali_arslan.GetFaith.GetReligion.GetAdjective]统治者，中亚的许多[ali_arslan.GetFaith.GetReligion.GetName]的虔诚信徒正在庆祝这一成就。有趣的是，关于[ali_arslan.GetSheHe]如何与可怕的、邪恶的异教徒战斗或战胜他们的传说已经开始传播，或者[ali_arslan.GetSheHe]是如何得到圣加百列本人的指引。"
 tarim_basin.0177.a:0 "这是[ROOT.Char.GetFaith.HighGodName]的意志。"
 tarim_basin.0178.t:0 "xxxxx"
 tarim_basin.0178.desc:0 "xxxxx"
