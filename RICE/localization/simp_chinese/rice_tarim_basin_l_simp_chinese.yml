 RICE_tarim_basin_gift_silk_road_infrastructure_1:0 "来自整个丝绸之路的基础设施小援助"
 RICE_tarim_basin_gift_silk_road_infrastructure_1_desc:0 "丝绸之路沿线的一个外族地方社区已经汇集了资源，协助当地开展各种项目，改善该地区的基础设施。"
 RICE_tarim_basin_gift_silk_road_infrastructure_2:0 "来自整个丝绸之路的基础设施重要援助"
