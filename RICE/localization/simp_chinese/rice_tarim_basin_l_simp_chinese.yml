 RICE_tarim_basin_ali_arslan_equivalent:0 "被塔里木盆地的异教徒所惧怕"
 RICE_tarim_basin_ordam_mazar_recently_built:0 "奥达木麻札最近建成"
 RICE_tarim_basin_reinhabit_gomati_monastery:0 "复兴瞿摩帝寺"
 RICE_tarim_basin_reinhabit_gomati_monastery_tooltip:0 "悲喜无常……"
 RICE_tarim_basin_reinhabit_gomati_monastery_desc:0 "作为一个[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，看到伟大的瞿摩帝寺成为废墟，我很心痛。这些异端分子征服于阗时，他们为什么要这样对待于阗的寺庙？为了重建这里的[ROOT.Char.GetFaith.GetReligion.GetAdjective]社区，我们必须首先修复瞿摩帝寺。也许神圣的[eight_protectors|E]会回来保护这座城市!"
 RICE_tarim_basin_reinhabit_gomati_monastery_effect_tooltip_1:0 "[GetModifier('RICE_tarim_basin_khotan_eight_protectors').GetNameWithTooltip][character_modifier|E]将再次被赋予于阗[county|E]的佛教[rulers|E]"
 RICE_tarim_basin_reinhabit_gomati_monastery_effect_tooltip_2:0 "于阗的佛教[rulers|E]和附近的其他[rulers|E]将参与和准备[GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName][activity|E]。"
 RICE_tarim_basin_reinhabit_gomati_monastery_confirm:0 "瞿摩帝寺未来掌握在我们手中！"
 RICE_tarim_basin_reinhabit_gomati_monastery_context_tooltip:0 "#emphasis 历史背景：#!在于阗作为佛教中心的全盛时期，据说王国里到处都是佛寺，其中十四大僧伽蓝（寺院之意），小者不胜其数，大部分都是大乘佛教的教派。其中瞿摩帝寺是最大的寺院之一，也是香客在同等级寺院时大都选择瞿摩帝寺，而它也经常受到于阗王室的赞助。"
 RICE_tarim_basin_construct_ordam_mazar:0 "建设奥达木麻札"
 RICE_tarim_basin_construct_ordam_mazar_tooltip:0 "我们应该记住那些为我们的信仰义无反顾地战斗的人。"
 RICE_tarim_basin_construct_ordam_mazar_desc:0 "[ROOT.Char.GetFaith.GetReligion.GetName]在伟大的烈士的努力下，才传播到[GetGeographicalRegion('world_steppe_tarim').GetName]。让我们向在这一地区与野蛮、邪恶的异教徒英勇战斗的人致敬，他目前被埋葬在喀什，这些烈士应该得到的不应该是一个简单的坟墓。"
 RICE_tarim_basin_construct_ordam_mazar_effect_tooltip_1:0 "将对[ali_arslan.GetTitledFirstName]的坟墓进行修缮，以便像[ali_arslan.GetHerHim]这样的伟大烈士有一个合适的安息之地。"
 RICE_tarim_basin_construct_ordam_mazar_effect_tooltip_2:0 "该地区的穆斯林[rulers|E]可以采取$RICE_tarim_basin_attend_ordam_mazar_festival$的[decision|E]"
 RICE_tarim_basin_construct_ordam_mazar_confirm:0 "一个烈士应有的陵墓！"
