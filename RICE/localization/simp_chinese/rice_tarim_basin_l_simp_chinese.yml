 building_type_RICE_tarim_basin_dafo_temple:0 "大佛寺"
 building_type_RICE_tarim_basin_dafo_temple_desc:0 "张掖大佛寺，原名迦叶如来寺，因寺内供奉释迦牟尼涅槃像，又名“卧佛寺”，相传西夏皇族嵬咩国师在此闻天乐而掘得北凉涅槃佛像，轰动一时，嵬名国师以此为契机，奔走呼吁，最后争取到夏崇宗——嵬名乾顺的支持，敕建卧佛寺。"
