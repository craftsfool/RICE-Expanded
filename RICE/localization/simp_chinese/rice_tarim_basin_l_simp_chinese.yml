 tarim_basin.0280.t:0 "在尘土飞扬的朝圣之路上"
 tarim_basin.0280.desc:0 "尘埃四起，路途遥远，但是[GetTitleByKey('b_bezeklik').GetNameNoTier]的古代石窟正在向我招手！\n\n几个世纪以来，生活在那里的人们在炽热的山体上开凿洞穴，敬奉[ROOT.Char.GetFaith.HighGodName]和当地的神明。以及更多的人沿着丝绸之路的蜿蜒路线来这里朝拜[ROOT.Char.GetFaith.PantheonTerm]。"
 tarim_basin.0280.a:0 "我一样也将很快到达这些古老的洞窟。"
 tarim_basin.0281.t:0 "抵达"
 tarim_basin.0281.desc:0 "我已经抵达了[GetTitleByKey('b_bezeklik').GetNameNoTier]的洞穴。显然不仅仅是[ROOT.Char.GetFaith.GetAdherentNamePlural]来到了这里：所有教派的信徒都汇集于此。\n\n我和我的随行人员将在附近的小镇休息一晚，然后明天再前往洞窟。"
 tarim_basin.0281.a:0 "现在，哪里是休息的好地方...."
 tarim_basin.0282.t:0 "祈祷与敬拜"
 tarim_basin.0282.desc:0 "今日我踏入了[GetTitleByKey('b_bezeklik').GetNameNoTier]的洞窟，尤其是那些供奉[ROOT.Char.GetFaith.PantheonTerm]的圣所。\n\n何等奇观，何等震撼！洞壁上的古老壁画虽已斑驳龟裂，颜料剥落，我却不由自主地凝神瞻仰，心中涌起深沉的敬畏。恍惚间，那些神像仿佛在岩壁上翩然起舞，召唤我以更虔诚之心礼敬[ROOT.Char.GetFaith.HighGodName]。\n\n我们在此盘桓良久，诵念祷文，行尽[ROOT.Char.GetFaith.GetAdjective]的诸般仪轨。"
 tarim_basin.0282.a:0 "礼赞[ROOT.Char.GetFaith.HighGodName]！"
 tarim_basin.0283.t:0 "结束"
 tarim_basin.0283.desc:0 "我对[GetTitleByKey('b_bezeklik').GetNameNoTier]的洞窟之行。这些古老庄严的洞窟实在是一道风景线，无疑它会世世代代继续吸引像我这样虔诚的[ROOT.Char.GetFaith.GetAdjective]游客。"
 tarim_basin.0283.a:0 "我很高兴我做到了。"
