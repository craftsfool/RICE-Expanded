 activity_RICE_tarim_basin_ordam_mazar:0 "鄂尔多斯节"
 activity_RICE_tarim_basin_ordam_mazar_desc:0 "鄂尔多斯节是在#italic 麻札#!上举行的节日！对于[GetGeographicalRegion('world_steppe_tarim').GetName]的许多穆斯林来说是一个重要的节日，主要是为了纪念将伊斯兰教带到该地区的伟大殉道者的生平、死亡和事迹。"
 activity_RICE_tarim_basin_ordam_mazar_selection_tooltip: "参加鄂尔多斯节\n\n$RICE_tarim_basin_attend_ordam_mazar_festival_context_tooltip$"
 activity_RICE_tarim_basin_ordam_mazar_host_desc: "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$有概率获得[GetModifier('RICE_tarim_basin_attended_ordam_mazar').GetNameWithTooltip][character_modifier|E]\n$BULLET_WITH_TAB$基于所选的[intent|E]而减少[stress_loss_i|E][stress|E]"
 activity_RICE_tarim_basin_ordam_mazar_guest_desc: "$activity_RICE_tarim_basin_ordam_mazar_host_desc$"
 activity_RICE_tarim_basin_ordam_mazar_province_desc: "奥达木麻札位于[GetTitleByKey('b_kashgar').GetNameNoTier]"
 activity_RICE_tarim_basin_ordam_mazar_destination_selection: "$activity_RICE_tarim_basin_ordam_mazar_province_desc$"
 activity_RICE_tarim_basin_ordam_mazar_guest_help_text: "$activity_RICE_tarim_basin_ordam_mazar$"
 activity_RICE_tarim_basin_ordam_mazar_predicted_cost: "旅行的费用主要取决于你的[income|E]。"
 activity_RICE_tarim_basin_ordam_mazar_conclusion_desc: "[GetActivityType( 'activity_RICE_tarim_basin_ordam_mazar' ).GetName]已结束。愿我们永远不要忘记那些以[GetPlayer.GetFaith.HighGodName]之名做出巨大牺牲的人！"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type: "维护坟墓"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_none: "无资助"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_none_desc: "$BULLET_WITH_TAB$在[activity|E]结束后获得[piety_i|E]#V 50#!\n\n#weak 长期以来，奥达木麻札一直由当地社区维护。他们在这项重要的工作上做得令人钦佩，所以不需要拿出任何额外的资金来帮助他们。#!"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_modest: "小额资助"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_modest_desc: "$BULLET_WITH_TAB$在[activity|E]结束后获得[piety_i|E]#V 100#!\n\n#weak 我们不能只做奥达木麻札的访客。我们应该借此机会协助当地维护它，以纪念那些牺牲的烈士。#!"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_substantial: "大额资助"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_substantial_desc: "$BULLET_WITH_TAB$在[activity|E]结束后获得[piety_i|E]#V 150#!\n\n#weak 各地的穆斯林都为我们烈士的牺牲而感到鼓舞，因此我们因尽最大努力在经济上帮助当地维护奥达木麻札，这将是正确之事#!"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type: "金碗大锅"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_small: "小份食材"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_small_desc: "$BULLET_WITH_TAB$在[activity|E]结束后获得[prestige_i|E]#V 50#!\n\n#weak 每个参加鄂尔多斯节的游客都要带一些食物，放在名为“金碗”的大锅里煮，然后大家分享食物，此番我将带来小份食材。#!"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_medium: "中份食材"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_medium_desc: "$BULLET_WITH_TAB$在[activity|E]结束后获得[prestige_i|E]#V 100#!\n\n#weak 金碗大锅是我们在鄂尔多斯节期间共同分享食物的地方，是这个活动的一个重要元素。我很高兴地这次活动，带来中份食材是不错的选择。#!"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_large: "大份食材"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_large_desc: "$BULLET_WITH_TAB$在[activity|E]结束后获得[prestige_i|E]#V 150#!\n\n#weak 远近的穆斯林都聚集在一起庆祝鄂尔多斯节，大多数人都带来了食物，在公共的金碗中分享。如果我不为大家提供大量的食物，那就太失职了！#!"
 RICE_tarim_basin_ordam_mazar_festival_phase: "节庆"
 RICE_tarim_basin_ordam_mazar_festival_phase_desc: "鄂尔多斯节正在进行中，附近的穆斯林聚集到[GetTitleByKey('b_kashgar').GetNameNoTier]。"
 RICE_tarim_basin_ordam_mazar_remembrance_intent_header: "冥思："
 RICE_tarim_basin_ordam_mazar_remembrance_intent: "冥思"
 RICE_tarim_basin_ordam_mazar_remembrance_intent_desc: "你想在鄂尔多斯节花些时间来思考问题，以此更接近[GetPlayer.GetFaith.HighGodName]。拥有[GetTrait('zealous').GetName( GetNullCharacter )|U]、[GetTrait('calm').GetName( GetNullCharacter )]、[GetTrait('humble').GetName( GetNullCharacter )]和[GetTrait('just').GetName( GetNullCharacter )]特质的角色可能失去[stress|E]。"
 RICE_tarim_basin_ordam_mazar_socialization_intent_header: "社交："
 RICE_tarim_basin_ordam_mazar_socialization_intent: "社交"
 RICE_tarim_basin_ordam_mazar_socialization_intent_desc: "鄂尔多斯节是一个与其他人见面和交流的机会，可以提升你在当地穆斯林社区的地位。拥有[GetTrait('gregarious').GetName( GetNullCharacter )|U]、[GetTrait('ambitious').GetName( GetNullCharacter )]、[GetTrait('gluttonous').GetName( GetNullCharacter )]和[GetTrait('lustful').GetName( GetNullCharacter )]特质的角色可能失去[stress|E]。"
