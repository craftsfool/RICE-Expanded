 activity_RICE_tarim_basin_bezeklik_pilgrimage:0 "宁戎寺朝圣"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_desc:0 "$b_bezeklik$是一连串山中洞穴网络的所在地，这些洞穴被用作敬奉佛陀和其他神圣之物。远近而来的虔诚者在数个世纪之中在这里祈祷与冥想。"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_selection_tooltip: "开始一场去[GetTitleByKey('b_bezeklik').GetNameNoTier]的[local_pilgrimage|E]。\n\n$activity_RICE_tarim_basin_bezeklik_pilgrimage_context_tooltip$"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_context_tooltip:0 "#emphasis 历史背景：#!柏孜克里克千佛洞（唐称：宁戎寺）是靠近吐鲁番古城的一个主要由佛教石窟组成的建筑群。这些开凿在岩石上的洞窟通常挂满了佛教壁画，与维吾尔佛教徒有着密切的联系，是主要的礼拜和朝圣中心，但也有证据表明摩尼教徒也曾使用过这些洞窟。事实上，最初的石窟可能更多地被摩尼教徒使用，在维吾尔人皈依后才被佛教徒取代。"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_host_desc: "$activity_RICE_local_pilgrimage_host_desc$"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_guest_desc: "$activity_RICE_tarim_basin_bezeklik_pilgrimage_host_desc$"
