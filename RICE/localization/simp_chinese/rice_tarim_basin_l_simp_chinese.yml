 tarim_basin.0050.t:0 "议潭过世"
 tarim_basin.0050.desc:0 "几十年前，我的叔叔[yichao.GetFullName]带领敦煌人民推翻了吐蕃统治，回归唐朝。可惜，唐朝对我们的归义军抱着怀疑态度；虽然他们授予我们#italic 归义军#!的称号，但是并没有得到实际援助。就算我的父亲[yitan.GetFirstName]入京为质也一样。\n\n尽管如此，我们仍然坚守于此。尽管唐朝内忧外患，他们无瑕顾忌我们，但我们需要与他们帮助，我们保护中原王朝的西部边疆！\n\n现在我们收到消息，我父亲已经去世了。张家失去了一个伟大的成员，也失去了一个在朝廷的归义军使者。"
 tarim_basin.0050.a:0 "继续向唐廷效忠是明智的做法吗？"
 tarim_basin.0051.t:0 "归义军的命运"
 tarim_basin.0051.desc:0 "我的叔叔[yichao.GetFirstName]决定入京为质，而我[huaishen.GetFirstName]则为留后，希望以此表达忠诚。叔叔认为我有能力做好，但我很迷茫。我的叔叔作为维系我们的粘合剂，多年来一直很好地统治着这块土地。我不知道我是否能像他那样维持和平，如果他不在，敦煌那些蠢蠢欲动的部族会怎么做？\n\n我曾建议我代替他去，但他认为如果我们这样做，唐人会不信任我们。我也提出了不派人的建议，毕竟唐朝经常忽视我们不断提出的援助请求，对我们在西部边疆报告的任何威胁都不愿意回应。我们甚至需要他们的帮助吗？"
 tarim_basin.0051.a:0 "叔父是对的……他需要去长安。"
 tarim_basin.0051.a.tooltip:0 "[yichao.GetFullName]将前往长安，从游戏中“消失”。在他在中国去世之前，唐朝每年都有很大的几率送来援助，如[special_troops|E]、[gold|E]、正面的[modifiers|E]等等。然而敦煌的每一个主要家族都会在归义军中得到一个[unpressed_claim|E]。"
 tarim_basin.0051.b:0 "我们需要叔父在这，我将入京为质。"
 tarim_basin.0051.b.tooltip:0 "[huaishen.GetFullName]将前往长安，从游戏中“消失”，而[yichao.GetFullName]将重新控制归义军。在张淮深去世之前，唐朝廷每年都有几率送来援助，如[special_troops|E]、[gold|E]、正面的[modifiers|E]等等。然而与[yichao.GetFirstName]入京为质相比，这些奖励较弱，而且次数较少。"
 tarim_basin.0051.c:0 "忘掉那些腐朽的唐朝吧，我们没有他们也行！"
 tarim_basin.0051.c.tooltip:0 "没有人会去长安，而[yichao.GetFullName]将恢复对归义军控制。虽然唐朝不能对你采取行动，但这将对归义军产生不良影响。"
 tarim_basin.0052.t:0 "归义军的命运"
 tarim_basin.0052.desc:0 "在[yichao.GetFullName]甩掉吐蕃帝国的枷锁，光复河西走廊时。他为恢复秩序、维护正义、为该地区带来繁荣所做的努力受到许多人的钦佩，然而唐朝廷对他持怀疑态度。\n\n尽管如此，[yichao.GetFirstName]还是效忠唐朝。他派他的弟弟[yitan.GetFirstName]入京为质，以表明他的诚意。然而，[yitan.GetFirstName]已经去世了。"
 tarim_basin.0052.desc.yeet_yichao:0 "\n\n[yichao.GetFirstName]既知归义之命悬于唐庭，而入朝代故兄为质，使其侄[huaishen.GetFirstName]代替他统治，认为他有能力做好。[yichao.GetFirstName]一去，再无折冲，敦煌豪强皆怀鬼胎。唯[yichao.GetFirstName]得聚河西豪强为一，然其已逾古稀。唯恐时日无多……"
 tarim_basin.0052.desc.yeet_huaishen:0 "\n\n[yichao.GetFirstName]既知归义之命悬于唐庭，而欲入朝代故兄为质，使其侄[huaishen.GetFirstName]留后。其为所说，遂更本意；[yichao.GetFirstName]虽愿效死于皇唐，然不可违人心所望，终遣[huaishen.GetFirstName]诣长安，由是唐庭忌之。唯[yichao.GetFirstName]得聚河西豪强为一，然其已逾古稀。唯恐时日无多……"
 tarim_basin.0052.desc.yeet_no_one:0 "\n\n[yichao.GetFirstName]本欲入朝代故兄为质，而使其侄[huaishen.GetFirstName]留后。其为所说，遂更本意；大唐自弃西域，既视归义如草芥，亦无力行事于中国，彼唯自力更生，方得保全。唯[yichao.GetFirstName]得聚河西豪强为一，然其已逾古稀。唯恐时日无多……"
 tarim_basin.0052.a:0 "他走后，归义军会如何呢？"
 tarim_basin.0052.tooltip.yes_hostage:0 "因为张家已经决定向唐廷派出人质，在张议潮去世之前，唐廷每年都有几率送来援助，如[special_troops|E]、[gold|E]、正面的[modifiers|E]等等。"
 tarim_basin.0053.t:0 "xxxxx"
