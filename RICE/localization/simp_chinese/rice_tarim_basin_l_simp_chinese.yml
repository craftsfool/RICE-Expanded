 RICE_tarim_basin_patronize_a_mogao_cave:0 "资助一个莫高窟"
 RICE_tarim_basin_patronize_a_mogao_cave_tooltip:0 "我们需要与这些团体建立更紧密的联系。"
 RICE_tarim_basin_patronize_a_mogao_cave_desc:0 "[mogao_caves|E]在敦煌已经存在了几个世纪。一代又一代的当地世家，虽然偶尔也有远在中国中原世家和于阗世家，不断的资助建造石窟，现在已经组成一个庞大的石窟群。我应该也为自己赞助建造一个石窟。"
 RICE_tarim_basin_patronize_a_mogao_cave_effect_tooltip_1:0 "这个石窟需要一年左右的时间来建造。完成后，你将获得[prestige|E]、[piety|E]、[dynasty_prestige|E]以及一个#P 正面的#![character_modifier|E]，这取决于石窟的规模和你选择建造的主题。#X 这个决定一生中只能做一次#!"
 RICE_tarim_basin_patronize_a_mogao_cave_effect_tooltip_2:0 "这些奖励会更好，因为你的[dynasty|E]已经解锁了[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_4').GetName][dynasty_perk|E]"
 RICE_tarim_basin_patronize_a_mogao_cave_effect_tooltip_3:0 "建造[mogao_cave|E]的成本降低了，因为你的[dynasty|E]已经解锁了[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_5').GetName][dynasty_perk|E]"
 RICE_tarim_basin_patronize_a_mogao_cave_confirm:0 "为了佛门三宝！"
 RICE_tarim_basin_patronize_a_mogao_cave_context_tooltip:0 "#emphasis 历史背景：#!莫高窟是一个由500多座洞窟、神龛和其他洞窟建筑筑组成的系统，由敦煌的山体开凿并雕刻而成，建造时间跨越十个世纪。许多洞窟是由自汉代以来一直居住在敦煌的世家赞助的，它们展示了佛教艺术在千年间的演变。20世纪，这些石窟被重新发现，对于研究该地区的历史学家来说是一个巨大的福音，因为在这些石窟中发现了大量的艺术品、实物和文献。"
 RICE_tarim_basin_patronize_a_mogao_cave_choose_type:0 "选择洞窟的主题"
 RICE_tarim_basin_mogao_cave_family_option:0 "#Bold #V 族谱#!#!\n彰显你的宗族对佛教的虔诚"
 RICE_tarim_basin_mogao_cave_family_option_desc:0 "你和你的族人将在你的石窟艺术中占绝对主体。"
 RICE_tarim_basin_mogao_cave_family_option_tooltip:0 "世界必须知道我与我那高洁血脉，以及我们为真正的道路做出了多么巨大的贡献。\n#weak 这种类型的石窟将让你获得更多的声望，而不是虔诚。#!"
 RICE_tarim_basin_mogao_cave_jataka_option:0 "#Bold #V 本生#!#!\n讲述寓言故事，倡导接受佛教道德观"
 RICE_tarim_basin_mogao_cave_jataka_option_desc:0 "你的石窟雕刻许多精彩的佛教寓言。"
 RICE_tarim_basin_mogao_cave_jataka_option_tooltip:0 "[Glossary( '《本生经》', 'JATAKA_GLOSS' )]记载释迦牟尼在成佛之前，经过了无数次轮回转生，他曾做过国王、王子、婆罗门、商人、妇人、大象、猴子、鹿等等，每一次转生，便有一个行善立德的故事，以几百个生动有趣的故事，反复说明轮回和业报的“规律”，以劝导人们止恶扬善，广积福德。\n#weak 这种类型的石窟将让你获得等量的声望和虔诚#!"
 RICE_tarim_basin_mogao_cave_deities_option:0 "#Bold #V 开悟众生#!#!\n膜拜佛陀"
 RICE_tarim_basin_mogao_cave_deities_option_desc:0 "你的洞窟将着重于描绘各种佛教神祇和圣人。"
 RICE_tarim_basin_mogao_cave_deities_option_tooltip:0 "雕刻佛陀、菩萨和其他神祇，让那些看到这个洞窟的人得到启发!\n#weak 这种类型的石窟将让你获得更多的虔诚，而不是声望#!"
 RICE_reinforce_relations_silk_road_communities:0 "加强与丝绸之路各部族的联系"
 RICE_reinforce_relations_silk_road_communities_tooltip:0 "我们需要与这些团体建立更紧密的联系。"
 RICE_reinforce_relations_silk_road_communities_desc:0 "丝绸之路上有许多不同的民族[silk_road_communities_short|E]。在我的领土上与这些[silk_road_communities_short|E]的领主和精英接触是明智的，这样我们可以相互帮助。"
 RICE_reinforce_relations_silk_road_communities_effect_tooltip_1:0 "你将获得为期十年的[character_modifier|E]，其奖励取决于你选择的社区。"
 RICE_reinforce_relations_silk_road_communities_effect_tooltip_2:0 "你选择的[silk_road_community_short|E]可能会通过随机事件和为你解锁新的[decisions|E]来长期支持你。"
 RICE_reinforce_relations_silk_road_communities_confirm:0 "是时候加强彼此之间的感情了"
 RICE_reinforce_relations_silk_road_communities_context_tooltip:0 "#emphasis 历史背景：#!所谓的“丝绸之路”沿线的土地上，过去和现在都是多种族、多宗教、多文化的融合之地。在各个城市中心，不同来源的多元社区经常在地方事务中发挥重要作用，尽管他们有着“外来”的身份。例如由中国人为主导的敦煌有一个重要的少数民族——粟特族，其中一些人升至高位，如安禄山。同时敦煌也是许多其他民族的共同家园，如藏族、犹太人和吐火罗人。"
 RICE_silk_road_communities_done_already_req:0 "尚未作出这一[decision|E]"
 RICE_no_current_silk_road_community_req:0 "你目前没有加强与[silk_road_community|E]的联系"
 RICE_silk_road_communities_dynasty_perks_req:0 "[dynasty|E]已经解锁了[GetDynastyPerk('RICE_socotra_indian_ocean_legacy_2').GetName]或[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_2').GetName][dynasty_perks|E]"
 RICE_silk_road_pick_a_community_type:0 "选择一个文化群体来建立网络"
 RICE_community_east_asian_option:0 "#Bold #V 东亚#!#!\n受人尊重的博学者"
 RICE_community_east_asian_option_desc:0 "博学、公正的东方人值得我们支持。"
 RICE_community_east_asian_option_tooltip:0 "遥远的东方人据说是博学而公正的。他们也可能与中原王朝本身有联系，你寻求他们的帮助和友谊不是很明智吗？是时候[GetModifier('RICE_tarim_basin_east_asian_contacts').GetNameWithTooltip]了！\n\n#weak 这个选项增加了从当地[silk_road_communities|E]获得[prestige|E]和[dynasty_prestige|E]的数量和机会，并解锁$RICE_silk_road_community_east_asian_decision$[decision|E]#!"
 RICE_community_steppe_option:0 "#Bold #V 大草原#!#!\n征服迂阔草原的勇者"
 RICE_community_steppe_option_desc:0 "凶猛、勇敢的游牧民战士值得我们支持。"
 RICE_community_steppe_option_tooltip:0 "北部大草原的人民是一个有争议的群体，虽然他们并不可靠的，但如果你想加强你的军队，他们作为战士和冒险家的技能是不容忽视的。是时候[GetModifier('RICE_tarim_basin_steppe_contacts').GetNameWithTooltip]了！\n\n#weak 你的领土上有草原部族，因为你的首都位于陆上丝绸之路上或附近。\n\n这个选项增加了当地[silk_road_communities|E]的[special_troops|E]和[character_modifiers|E]的强度和获得礼物的几率，这些礼物可以提高[scheme_success_chance|E]和在[battles|E]中[advantage|E]，并解锁$RICE_silk_road_community_steppe_decision$[decision|E]#!"
 RICE_community_middle_eastern_option:0 "#Bold #V 中东#!#!\n主导丝绸之路的商人"
 RICE_community_middle_eastern_option_desc:0 "熟练的、繁荣的中东商人值得我们支持。"
 RICE_community_middle_eastern_option_tooltip:0 "几个世纪以来，波斯、阿拉伯和犹太商人和旅行者一直以其积累财富而闻名。凭借他们的财富和关系，以及我们的地位和权力，你们可以一起成就伟大的事业。是时候[GetModifier('RICE_tarim_basin_middle_eastern_contacts').GetNameWithTooltip]!\n\n#weak 这个选项增加了从当地的[silk_road_communities|E]获得改善[gold|E][income|E]或[county_modifiers|E][building|E]成本和[control|E]在你的[realm_capital|E]以及[character_modifiers|E]礼物的数量和几率，并解锁$RICE_silk_road_community_middle_eastern_decision$[decision|E]#!"
 RICE_community_himalayan_option:0 "#Bold #V 喜马拉雅#!#!\n世界屋脊征服者"
 RICE_community_himalayan_option_desc:0 "适应性强的喜马拉雅民众值得我们支持。"
 RICE_community_himalayan_option_tooltip:0 "来自喜马拉雅高原的部族成员以坚韧、顽强的战士和虔诚的信仰而闻名，能够适应任何逆境。他们可以证明是有用的盟友。是时候[GetModifier('RICE_tarim_basin_himalayan_contacts').GetNameWithTooltip]！\n\n#weak 喜马拉雅部族存在于你的领土上，因为你的首都位于陆上丝绸之路上或附近。\n\n这个选项增加了从当地[silk_road_communities|E]获得改善[scheme_resistance|E]和[prowess|E]，和[health|E]、[fertility|E]和降低[stress|E]以及[character_modifiers|E]礼物的数量和几率，并解锁$RICE_silk_road_community_himalayan_decision$[decision|E]#!"
 RICE_community_indian_option:0 "#Bold #V 印度#!#!\n思想与宗教的传播者"
 RICE_community_indian_option_desc:0 "聪明的、有文化的印度人值得我们支持。"
 RICE_community_indian_option_tooltip:0 "来自印度的僧侣、思想家和商人无疑给他们所到之处的文化和社会留下了积极的印记，也许也包括你们的土地。是时候[GetModifier('RICE_tarim_basin_indian_contacts').GetNameWithTooltip]！\n\n#weak 这个选项增加了从当地[silk_road_communities|E]获得[piety|E]或[character_modifiers|E]礼物以此来改善[lifestyle_experience|E]的数量和几率，并解锁$RICE_silk_road_community_indian_decision$[decision|E]#!"
 RICE_silk_road_community_east_asian_decision:0 "引进东亚人才"
 RICE_silk_road_community_east_asian_decision_tooltip:0 "他们的学识可以给我们带来很大的帮助！"
 RICE_silk_road_community_east_asian_decision_desc:0 "现在我已经与我所在地区的东亚[silk_road_communities_short|E]建立了联系，我应该请他们帮助我从他们的家乡寻找人才来这里。从学者到工程师，从战略家到书法家，有这么多种类的专家来自远方，我可以吸纳他们为我工作！"
 RICE_silk_road_community_east_asian_decision_confirm:0 "我非常需要有才华的人。"
 RICE_silk_road_community_steppe_decision:0 "招募草原勇士"
 RICE_silk_road_community_steppe_decision_tooltip:0 "当我们可以招募他们为我们而战时，为什么要与他们战斗？"
 RICE_silk_road_community_steppe_decision_desc:0 "现在，我已经与我领地内的草原[silk_road_communities_short|E]建立了联系，我想知道他们中一些令人畏惧的战士是否愿意在我的旗帜下战斗。他们卓越的骑术、射箭、徒手格斗和战斗技能，以及他们对战略、战术和后勤的深入了解，都可以帮助我在战争中取得胜利。"
 RICE_silk_road_community_steppe_decision_confirm:0 "他们为我战斗总比反对我好。"
 RICE_silk_road_community_middle_eastern_decision:0 "引入中东商贩移民"
 RICE_silk_road_community_middle_eastern_decision_tooltip:0 "贸易是世界的血脉！"
 RICE_silk_road_community_middle_eastern_decision_desc:0 "现在我已经和我领地内的当地中东[silk_road_communities_short|E]建立了联系，我很想知道他们是否愿意帮助我吸引一些他们的同胞，特别是商人，在我的王国里定居，继续扩大现有的商业网络，以便我们都能繁荣和发展。"
 RICE_silk_road_community_middle_eastern_decision_confirm:0 "贸易和商业将蓬勃发展！"
 RICE_silk_road_community_himalayan_decision:0 "招募喜马拉雅勇士"
 RICE_silk_road_community_himalayan_decision_tooltip:0 "我想招募这些坚韧不拔的山地冠军……"
 RICE_silk_road_community_himalayan_decision_desc:0 "现在我已经与我领地里的喜马拉雅[silk_road_communities_short|E]当地人建立了联系，我打算招募他们中的一些战士为我服务。喜马拉雅高原造就他们不屈不挠的精神，这样的战士可以成为我的一笔巨大的军事资产!"
 RICE_silk_road_community_himalayan_decision_confirm:0 "他们的力量会成为我的助力。"
 RICE_silk_road_community_indian_decision:0 "引进印度工匠"
 RICE_silk_road_community_indian_decision_tooltip:0 "他们的艺术闻名于世！"
 RICE_silk_road_community_indian_decision_desc:0 "现在我已经与我领地里的当地印度[silk_road_communities_short|E]建立了联系，我想到我可以利用我的新关系，从远方雇佣一些印度工匠为我工作。印度次大陆的艺术风格对许多文明都有重大影响，这些印度工匠们无疑会提高我的威望。"
 RICE_silk_road_community_indian_decision_confirm:0 "他们的艺术会有好归宿。"
 RICE_iranian_sinicization:0 "西亚人归化"
 RICE_iranian_sinicization_tooltip:0 "我们的出生在其他地方，但我们的家在这里，在这些中国人中……"
 RICE_iranian_sinicization_desc.867:0 "中国人经常称任何祖先来自所谓西域的人为“胡人”，意为野蛮人。然而我们中的许多“胡人”世代生活在中原，采用汉人习俗、语言和思想。我们的中国朋友应该明白，我们和他们一样是有文化的人，我们与多年前那个粟特族的畜生安禄山截然不同！"
 RICE_iranian_sinicization_desc:0 "中国人经常称任何祖先来自所谓西域的人为 “胡人”，意为野蛮人。然而我们中的许多“胡人”世代生活在中原，采用汉人习俗、语言和思想。我们的中国朋友应该明白，我们和他们一样是有文化的人，这很重要！"
 RICE_iranian_sinicization_effect_tooltip_1:0 "如果你愿意，可以为自己取一个新的中文名字"
 RICE_iranian_sinicization_confirm:0 "我们现在是汉人！"
 RICE_iranian_sinicization_context_tooltip:0 "#emphasis 历史背景：#!历史上，伊朗人和吐火罗人的社区曾经大量存在，其中包括商人、佛教僧侣和翻译、奴隶、士兵、妓女等等。许多人很好地适应了中国文化，有些人甚至在中国社会中升至显赫的地位，成为将军和官员。例如发动大规模叛乱并建立一个短命的燕国、给唐朝带来永久创伤的节度使安禄山是粟特人，在他战败后，许多伊朗人为了掩盖自己的身份而改用汉人名字。另一个例子是，在汉人主导的敦煌，有几个显赫的家族，如康氏和安氏，他们的祖先是粟特人，但已经完全汉化了。"
 RICE_top_liege_or_capital_chinese_req:0 "你的[top_liege|E]或你的[realm_capital|E]是一个拥有中国[heritage|E]的[culture|E]"
 RICE_tarim_basin_stage_animal_fight:0 "舞台上斗兽占卜预测收成"
 RICE_tarim_basin_stage_animal_fight_tooltip:0 "新年将至！"
 RICE_tarim_basin_stage_animal_fight_desc:0 "[ROOT.Char.GetCulture.GetName]人习惯在每年年初举行动物比赛，作为新年庆祝活动的一部分。许多人认为这些比赛的结果可以准确地预测即将到来的收成或自己的畜群的生育能力。我希望能举办一场盛大的比赛，举办许多这样的战斗！"
 RICE_tarim_basin_stage_animal_fight_desc.not_tocharian:0 "吐火罗人和其后裔的习惯是在每年年初举行动物比赛，作为新年庆祝活动的一部分。许多人认为这些比赛的结果可以准确地预测即将到来的收成或自己的畜群的生育能力。我希望能举办一场盛大的比赛，举办许多这样的比赛！"
 RICE_tarim_basin_stage_animal_fight_effect_tooltip_1:0 "根据比赛的结果，你会获得一些[prestige|E]，并且你的[realm_capital|E]#italic 可能#!获得一个#P 正面的#![county_modifier|E]或者你#italic 可能#!获得一个#P 正面的#![character_modifier|E]"
 RICE_tarim_basin_stage_animal_fight_effect_tooltip_2:0 "你会失去[piety|E]，因为你信仰的[faith|E]有[GetTenetType('tenet_pacifism').GetBaseName]或[GetTenetType('tenet_dharmic_pacifism').GetBaseName][core_tenet|E]。因此一些[hoster.Custom('DefaultPriestTitlePlural')|U]不赞成这些违背[hoster.GetFaith.HighGodNamePossessive]教义的行为。"
 RICE_tarim_basin_stage_animal_fight_confirm:0 "是时候准备迎接新年了！"
 RICE_tarim_basin_stage_animal_fight_context_tooltip:0 "#emphasis 历史背景：#!龟兹是丝绸之路新疆段塔克拉玛干沙漠北道的重镇，其音乐、舞蹈和其他节庆活动的传统闻名于世。每到新年，龟兹的牛、马、山羊和骆驼等各种动物之间都要进行搏斗。其结果被用来预测未来的收成和畜群的繁殖力。"
 RICE_decision_stage_animal_fight_month_req:0 "月份是一月、二月或三月"
 RICE_tarim_basin_khotan_procession:0 "参加于阗年度画行活动"
 RICE_tarim_basin_khotan_procession_tooltip:0 "向佛门三宝致敬"
 RICE_tarim_basin_khotan_procession_desc:0 "现在是时候通过参加于阗的年度游行仪式来重申我们对佛门三宝的虔诚了。自从于阗成为[ROOT.Char.GetFaith.GetReligion.GetAdjective]后，几个世纪以来游行仪式一直在庆祝，从未间断过。于阗的每个人都参与其中，从平民到僧侣再到皇室。"
 RICE_tarim_basin_khotan_procession_effect_tooltip_1:0 "你将获得随机数量的[piety|E]"
 RICE_tarim_basin_khotan_procession_effect_tooltip_2:0 "你有可能被视为获得[eight_protectors_of_khotan|E]的#P 祝福#!并获得一个[character_modifier|E]，其强度取决于你的[piety_level|E]。"
 RICE_tarim_basin_khotan_procession_confirm:0 "我期待着今年的游行！"
 RICE_tarim_basin_khotan_procession_context_tooltip:0 "#emphasis 历史背景：#!在于阗作为佛教中心的全盛时期，每年春天都会举行持续两周的游行仪式，从平民到皇室都参与其中。神圣的佛像被放在马车上，每天的游行都由于阗国十四大僧伽蓝（寺院之意）组织，而于阗最重要的寺院瞿摩帝寺有幸在第一天参加。"
 RICE_decision_khotan_procession_month_req:0 "月份是一月、二月、三月或四月"
 RICE_decision_khotan_ruler_buddhist_req:0 "于阗的[ruler|E]是佛教徒"
 RICE_tarim_basin_attend_ordam_mazar_festival:0 "参加奥达木节"
 RICE_tarim_basin_attend_ordam_mazar_festival_tooltip:0 "让我们铭记阿里·阿厮兰汗王。"
 RICE_tarim_basin_attend_ordam_mazar_festival_desc:0 "我是时候前往#italic 麻札#!或阿里·阿厮兰汗王之坟墓，并参加在那里举行的奥达木节。我必须通过纪念他和哀悼他的死亡来重申我对[ROOT.Char.GetFaith.GetReligion.GetName]信仰的忠诚。"
 RICE_tarim_basin_attend_ordam_mazar_festival_effect_tooltip_1:0 "你将根据你的[piety|E]和[prestige|E]随机获得一定数量的[piety_level|E]"
 RICE_tarim_basin_attend_ordam_mazar_festival_effect_tooltip_2:0 "在各种活动中，也会有机会获得[piety|E]和[prestige|E]或者失去[stress|E]"
 RICE_tarim_basin_attend_ordam_mazar_festival_effect_tooltip_3:0 "你最后将获得[GetModifier('RICE_tarim_basin_attended_ordam_mazar').GetNameWithTooltip][character_modifier|E]"
 RICE_tarim_basin_attend_ordam_mazar_festival_confirm:0 "做好前往#italic 麻札#!的准备"
 RICE_tarim_basin_attend_ordam_mazar_festival_context_tooltip:0 "#emphasis 历史背景：#!#italic 麻札#!是伊斯兰教圣裔或著名贤者的坟墓的意思。在中亚，们经常在这些坟墓上举行节日庆典。塔里木盆地最大的节日是奥达木节，它是在喀喇汗国统治者阿里·阿厮兰汗的#italic 麻札#!举行的。回鹘传说中他率领穆斯林的喀喇汗国对于阗佛国进攻并死于战场。"
 RICE_decision_tarim_sogdia_pamir_geographical_req:0 "你拥有[GetGeographicalRegion('world_steppe_tarim').GetName]、[GetGeographicalRegion('RICE_sogdia').GetName]或者[GetGeographicalRegion('RICE_greater_pamir_region').GetName]中的一个[county|E]"
 RICE_tarim_basin_become_khan_and_sultan_of_china:0 "成为中国的大汗和苏丹"
 RICE_tarim_basin_become_khan_and_sultan_of_china_tooltip:0 "[ROOT.Char.GetDynasty.GetName]确实是一个伟大的王朝！"
 RICE_tarim_basin_become_khan_and_sultan_of_china_desc:0 "虽然中国是个不信仰伊斯兰教的国家，但许多穆斯林都钦佩中国是世界上最公正和最有文化的帝国之一。其亦曾统治过塔里木盆地，所以按照这个逻辑，如果我控制了足够多的塔里木盆地上的土地，我就可以理所当然地成为“中国”的统治者。毕竟#italic 在中国#!，一个人不需要统治中国的#italic 全部#!就可以成为中原皇帝。"
 RICE_tarim_basin_become_khan_and_sultan_of_china_effect_tooltip_1:0 "如果你家族中没有人是[fake_china_claimer.GetFaith.GetReligion.GetAdjective][ruler|E]，并且没有完全控制[GetGeographicalRegion('RICE_former_tang_western_region').GetName]中至少一个[county|E]，你的[dynasty|E]将#X 失去#![modifier|E]"
 RICE_tarim_basin_become_khan_and_sultan_of_china_confirm:0 "我当然要统治中国"
 RICE_tarim_basin_become_khan_and_sultan_of_china_context_tooltip:0 "#emphasis 历史背景：#!在中世纪的伊斯兰世界，中国被认为最初由三个地区组成：塔巴赤（即南中国）、契丹（即北中国）和巴尔汗或喀什（即塔里木盆地）。中国被视为是一个理想的社会，他们的产品深受欢迎，以至于在中东有一个制造仿冒、假冒中国产品的庞大产业。因此，许多统治塔里木盆地部分地区的喀喇汗王朝的统治者，都采用了中国的马利克、苏丹和（或）可汗的荣誉称号，以巩固他们在其他穆斯林中的地位。"
 RICE_tarim_basin_fake_china_geographical_req:0 "你的[realm|E]至少要有五个[counties|E]位于[GetGeographicalRegion('world_steppe_tarim').GetName]"
 RICE_tarim_basin_compile_the_turkic_dictionary:0 "编写第一部突厥语词典"
 RICE_tarim_basin_compile_the_turkic_dictionary_tooltip:0 "我们应该为我们的语言感到骄傲"
 RICE_tarim_basin_compile_the_turkic_dictionary_desc:0 "阿拉伯人和波斯人有着悠久的书面语言传统，他们把我们突厥人看成是不识字的乡巴佬。编纂第一部突厥语词典将在很大程度上证明我们语言的美丽，并为我赢得不朽的学者身份。该书还应该包括其他相关信息，如地理和历史。"
 RICE_tarim_basin_compile_the_turkic_dictionary_effect_tooltip_1:0 "一旦你写完#bold Diwan Lughat al‑Turk（突厥语大词典）#!，你将获得一本特殊的书籍[artifact|E]，以及一些[piety|E]和[prestige|E]"
 RICE_tarim_basin_compile_the_turkic_dictionary_effect_tooltip_2:0 "如果它们存在，你的[liege|E]、[top_liege|E]和你的[head_of_faith|E]也会收到相应副本，以提高他们对你的[opinion|E]。"
 RICE_tarim_basin_compile_the_turkic_dictionary_effect_tooltip_3:0 "这本书将需要大约一到三年才可以完成；如果你在那之前去世，你的[heir|E]得到质量较差的[artifact|E]版本。"
 RICE_tarim_basin_compile_the_turkic_dictionary_confirm:0 "终于要开始这项伟大事业了。"
 RICE_tarim_basin_compile_the_turkic_dictionary_context_tooltip:0 "#emphasis 历史背景：#!《突厥语大词典》（或称为《突厥语言汇编》）是喀喇汗王朝学者马哈茂德·喀什噶里的代表作，他可能与喀喇汗王朝的统治家族有远亲关系。该书于公元1072‑1074年编写，是以供处于塞尔柱统治下的巴格达哈里发使用的。该书不仅仅是一部词典，它还包含了从日本到埃及的世界地图，以及各种关于历史和地理的注释，和一些古突厥诗歌的例子。作为第一部突厥语词典，它是一份宝贵的历史资料。"
 RICE_tarim_basin_someone_working_on:0 "目前没有其他学者正在编纂第一部突厥语词典"
 RICE_tarim_basin_visit_crescent_lake:0 "参观敦煌月牙泉"
 RICE_tarim_basin_visit_crescent_lake_tooltip:0 "你将参观敦煌的新月泉"
 RICE_tarim_basin_visit_crescent_lake_effect_tooltip:0 "你将失去[stress|E]并获得一些[prestige|E]、[piety|E]和[GetModifier('RICE_tarim_basin_dunhuang_crescent_lake_visit').GetNameWithTooltip][character_modifier|E]"
 RICE_tarim_basin_visit_crescent_lake_desc:0 "敦煌市附近的主要地理标志之一是所谓的月牙泉。它是一个规模不小的湖泊，镶嵌在沙漠中间，位于同样著名的鸣沙山边。我希望能到这个地方去放松和享受!"
 RICE_tarim_basin_visit_crescent_lake_confirm:0 "我都等不及了！"
 RICE_tarim_basin_visit_crescent_lake_context_tooltip:0 "#emphasis 历史背景：#!在敦煌以南几英里处有一个湖，叫#italic 月牙泉#!。早在汉代，它就是一个受欢迎的娱乐场所；曾经它的周围有许多寺庙和亭子。但是由于过度使用地下水，该湖在过去几十年里以惊人的速度萎缩，尽管后面在一定程度上通过紧急措施得到了缓解。然而如果湖泊要恢复其昔日的辉煌，还需要采取更多严肃的措施。"
 tarim_basin.0001.t:0 "东方学者"
 tarim_basin.0001.desc:0 "在当今时代，丝绸之路沿线有许多人认为遥远的东方民族是行政管理的专家，擅长美术和学术。也许这样的评价是非常夸张的，是基于幻想的故事和刻板印象，但毫无疑问在那地区生活着许多有才华的人。\n\n总之由于我与当地东亚社区的联系，我接触到了一些相当有才华的人，他们在各种领域都有才花，无论是诗歌、水利、历史、农业、军事后勤等等。其中他们一些人已经同意在我的政府中为我工作。"
 tarim_basin.0001.a:0 "他们的技能将大大帮助我更好的管理我的领土。"
 tarim_basin.0002.t:0 "草原勇士"
 tarim_basin.0002.desc:0 "很少有人会怀疑来自草原的战士的凶猛和强大，他们将勇气、骑术和兵器精通以及精明的狡猾结合在一起，草原人击败许多他们的敌人。仅仅是提到他们那崩腾的骑兵，就足以让丝绸之路上的许多人心生恐惧。\n\n我很幸运，当地的草原社区认同我，而且我已经成功说服了他们中的一些人在我的军队中服役。"
 tarim_basin.0002.a:0 "我的敌人都要在我面前颤抖！"
 tarim_basin.0003.t:0 "中东商贩移民 "
 tarim_basin.0003.desc:0 "无论他们的种族或宗教出身如何，在丝绸之路的大部分地区都可以看到来自中东的商人，包含阿拉伯人、波斯人、犹太人等等。他们在主要的贸易中心建立聚居地，以扩大他们的商业网络。\n\n我已经设法说服当地中东社区的一些成员协助我从他们的家乡或沿着丝绸之路网络的其他地方招募人员，来我的土地上定居。他们可以扩大自己的网络，同时也帮助我给我的土地带来更多的贸易。"
 tarim_basin.0003.a:0 "我热切地欢迎商贩移民，这是一个双赢的局面。"
 tarim_basin.0004.t:0 "喜马拉雅勇士"
 tarim_basin.0004.desc:0 "喜马拉雅高原是一片危险、贫瘠的土地。能够忍受如此恶劣条件的人，至少从外人的角度来看，他们确实是世界上最厉害的人，他们的战士也因此被许多人认为是坚韧不拔的。\n\n在当地喜马拉雅部族生活着一些这样的战士，我长期以来一直想利用他们的能力。我已经设法说服了他们中的一些人在我的军队中服务。"
 tarim_basin.0004.a:0 "对我的军队短板来说是个很好的补充。"
 tarim_basin.0005.t:0 "印度工匠"
 tarim_basin.0005.desc:0 "印度是许多文化和信仰的发源地，这些文化和信仰影响了世界上许多地区。因此印度的艺术风格在整个丝绸之路上传播并不奇怪，也许是通过熟练的印度工匠移民到其他地区。\n\n例如，在当地的印度社区内，有许多熟练的工匠。虽然花费了一些时间和精力，我还是能够说服他们为我工作，而且我心中有各种项目，可以将他们价值发挥最大。"
 tarim_basin.0005.a:0 "这些工匠们能创造出多么威严、辉煌和神圣的东西啊!"
 tarim_basin.0006.t:0 "非洲的黄金和象牙"
 tarim_basin.0006.desc:0 "丝绸之路上交易的奢侈品多种多样，虽然从某种意义上来说，黄金、象牙并没有什么特别之处。不过，它们是东非在陆上和海上丝绸之路中最受欢迎的、最赚钱的商品。\n\n我与一些在非洲沿海商业社群建立了联系，无论本地还是外地商人，只要舍得花钱，都能采购到大量黄金和象牙。我已采取措施吸引这些商人，使我的土地成为黄金和象牙贸易中的一环，以期从中分一杯羹。"
 tarim_basin.0006.a:0 "让贸易流动起来。"
 tarim_basin.0007.t:0 "东南亚水手"
 tarim_basin.0007.desc:0 "这些居住在东南亚的海岸、岛屿和河流上的人们在连接印度洋和中国的海上贸易中扮演着重要的角色。几个世纪以来，他们以海上旅者而闻名。\n\n通过与当地东南亚世家的联系，我请来了一些水手、造船师和商人协助组建海军，保护我的海岸，以促进海上贸易，为我与人民提供海上航行的建议。"
 tarim_basin.0007.a:0 "他们对大海的了解将派上用场。"
 tarim_basin.0008.t:0 "xxxxx"
 tarim_basin.0008.desc:0 "xxxxx"
 tarim_basin.0008.a:0 "xxxxx"
 tarim_basin.0009.t:0 "xxxxx"
 tarim_basin.0009.desc:0 "xxxxx"
 tarim_basin.0009.a:0 "xxxxx"
 tarim_basin.0010.t:0 "成为汉人"
 tarim_basin.0010.desc:0 "具有[old_culture.GetName]血统的人一直生活儒家文化圈。我们中的一些人不仅学习他们的文化传统，而且在他们的社会中取得了很高的地位，比如我。我们这些家族最初来自所谓的西域的人已经证明自己可以成为将军、学者、官员等等。\n\n我们的习惯和世界观变得更加[ROOT.Char.GetCulture.GetName]，这是不可避免的。因此我命令我的家人和我正式接受他们的文化，但我也将为自己取一个新的、合适的[ROOT.Char.GetCulture.GetName]名字。"
 tarim_basin.0010.desc.867:0 "\n\n  鉴于安禄山的叛乱发生在已故的唐玄宗、唐肃宗和唐代宗统治时期，有些人就将我们与那个叛徒联系在一起，这让我们因有粟特血统而羞愧。选择一个[ROOT.Char.GetCulture.GetName]的名字，可以很好地证明我是[ROOT.Char.GetCulture.GetName]！"
 tarim_basin.0010.a:0 "没错，这是一个很好的[ROOT.Char.GetCulture.GetName]名字"
 tarim_basin.0010.b:0 "不需要一个新名字，我清楚我是谁。"
 tarim_basin.0011.t:0 "$travel_event_prefix$丝路贸易"
 tarim_basin.0011.desc:0 "通过与[merchant.GetFirstName]和[merchant.GetHerHis]商队一起旅行，我遇到了许多平时不会有的商业机会。\n\n在[ROOT.Char.GetCurrentLocation.GetName]时，我们能够与在那里遇到的商人达成有利的贸易协议。我可以照单全收，也可以冒险讨价还价，从其他商人那里得到更多的好处，但他们可能会拒绝，导致交易失败。"
 tarim_basin.0011.a:0 "我们应该坚持最初的协议。"
 tarim_basin.0012.t:0 "为[recipient.GetFirstNameNoTooltip]提供的艺人礼物"
 tarim_basin.0012.desc:0 "当像我这样有权势的[actor.GetTitleAsNameNoTooltip]想给另一个贵族留下深刻印象时，传统的丝绸、黄金或其他奢侈品的礼物是不够的。\n\n在欧亚大陆繁荣的土地上，在所谓的丝绸之路上，#italic 人#!才是更令人难忘的礼物。或者更具体地说，艺人：如音乐家、舞蹈家和杂技演员，以及美丽的奴隶和歌妓，他们可以带来进一步的视觉、愉悦的变化。当我可以通过这种方式真正显示我的财富、地位和权威时，为什么要送几件微不足道的丝绸或珠宝呢？\n\n我决定向[recipient.GetTitledFirstName]赠送一群来自[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的熟练艺人和奴隶。他们将成为[recipient.GetHerHis]宫廷的一部分，并在未来的日子里为[recipient.GetHerHim]服务。"
 tarim_basin.0012.a:0 "向[recipient.GetFirstName]表达善意……"
 tarim_basin.0013.t:0 "来自[actor.GetFirstNameNoTooltip]的艺人礼物"
 tarim_basin.0013.desc:0 "今天，一位使者从[actor.GetTitledFirstName]来到这里，随行人员众多。原来是[actor.GetSheHe]希望向我赠送一大批来自[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]的艺人和奴隶。这些人包括音乐家、舞者、杂技演员，甚至还有美丽的奴隶和歌妓。\n\n在欧亚大陆的繁荣之地和所谓的丝绸之路上，赠送技艺精湛的人是很常见的，这样展示了[actor.GetTitledFirstName]统治者的财富、地位和权威。如此厚礼自是令我欢喜，这班供人消遣的艺人会充实我的宫廷，一经吩咐便可为我的廷臣与宾客表演助兴。"
 tarim_basin.0013.a:0 "像我这样伟大的[recipient.GetTitleAsNameNoTooltip]应该得到这样一份礼物。"
 tarim_basin.0014.t:0 "龟兹艺人"
 tarim_basin.0014.desc:0 "当像我这样有权势的[actor.GetTitleAsNameNoTooltip]想给另一个贵族留下深刻印象时，传统的丝绸、黄金或其他奢侈品的礼物是不够的。现在我统治着[kucha.GetNameNoTier]，一个著名的娱乐圣地，我可以送一份更伟大的礼物。\n\n在丝绸之路上，#italic 人#!才是更令人难忘的礼物。或者更具体地说，艺人：如音乐家、舞蹈家和杂技演员，以及美丽的奴隶和歌妓，他们可以带来进一步的视觉、愉悦的变化，尤其是来自[kucha.GetNameNoTier]的艺人，他们在丝绸之路以娱乐而闻名。\n\n我决定向[recipient.GetTitledFirstName]赠送一个由来自[kucha.GetNameNoTier]的艺人和奴隶组成的剧团。他们将成为[recipient.GetHerHis]宫廷的一部分，并在未来的日子里为[recipient.GetHerHim]做好服务。"
 tarim_basin.0014.a:0 "向[recipient.GetFirstName]表达善意……"
 tarim_basin.0015.t:0 "来自[actor.GetFirstNameNoTooltip]的龟兹艺人礼物"
 tarim_basin.0015.desc:0 "今天，一位使者从[actor.GetTitledFirstName]来到这里，随行的有一大批人。原来[actor.GetSheHe]希望送给我一大批来自[kucha.GetNameNoTier]的艺人和奴隶组成的剧团。[kucha.GetNameNoTier]是著名的娱乐之城，所以没有人可以怀疑这个随行的艺人的技艺！\n\n在丝绸之路上，将技艺高超的人作为礼物是很常见的，因为他们展示了像[actor.GetTitledFirstName]这样的统治者的财富、地位和权威。我对这样的礼物感到受宠若惊，这些龟兹的艺人将成为我宫廷的重要组成部分，随时准备为我的廷臣和客人提供娱乐。"
 tarim_basin.0015.a:0 "多么奇伟壮观的礼物！"
 tarim_basin.0016.t:0 "xxxxx"
 tarim_basin.0016.desc:0 "xxxxx"
 tarim_basin.0016.a:0 "xxxxx"
 tarim_basin.0017.t:0 "罗布泊"
 tarim_basin.0017.desc:0 "几个世纪以前，罗布泊湖是楼兰国国都所在地，最近又被称为鄯善。据说尽管该湖处于沙漠之中，但它被森林和肥沃的农田所包围。\n\n不知何故，在一个多世纪前，湖水逐渐干涸，不好事情越来越多。随着该地区日益沙漠化，农业产量急剧下降，当地经济衰退，人们开始成群结队地逃离都城，剩下一座鬼城。\n\n然而，现在有了希望。湖水已经开始上涨，即使是逐渐上涨。但这也是几十年来的第一次。不幸的是有人预测这样的现象不会是永久性的，湖面会随着时间的推移而波动，所以该地区将很难恢复其以前的潜力和繁荣。"
 tarim_basin.0017.a:0 "罗布泊今后会发生什么？"
 tarim_basin.0018.t:0 "xxxxx"
 tarim_basin.0018.desc:0 "xxxxx"
 tarim_basin.0018.a:0 "xxxxx"
 tarim_basin.0019.t:0 "xxxxx"
 tarim_basin.0019.desc:0 "xxxxx"
 tarim_basin.0019.a:0 "xxxxx"
 tarim_basin.0020.t:0 "丝路团体"
 tarim_basin.0020.desc.intro:0 "不管是海上还是陆地丝绸之路，这些都是不同民族的文化大熔炉，甚至在汉、罗马或波斯等大帝国崛起之前都已经存在小规模交易网络。多亏了这些广泛的网络，让我的领土也有来自欧亚大陆的繁荣社区。如果我要实现自己的野心，与他们合作可能会有所帮助。"
 tarim_basin.0020.desc.east_asian:0 "\n\n我已经决定加强与我的领地内的东亚世家的关系。这些人中有很多来自遥远的东方，特别是东方王朝，许多人认为那里是一个充满正义和学问的地方。"
 tarim_basin.0020.desc.steppe:0 "\n\n我已经决定加强与我的领地内草原部族的联系。这些北方游牧民族有些人害怕，有些人敬佩。他们拥有强大的骑射手，而且从不失手，他们的骑兵在草原上奔腾，很少有人怀疑他们的战争能力。"
 tarim_basin.0020.desc.middle_eastern:0 "\n\n我已经决定加强与我的领地内的中东社区的联系。在整个丝绸之路上，只要有贸易往来的地方，就可以找到这些波斯、阿拉伯和犹太裔的商人网络，任何试图鼓励商业和发展的人都会寻求他们的帮助。"
 tarim_basin.0020.desc.himalayan:0 "\n\n我决定加强与我的领地内的喜马拉雅部族的联系。他们来自看似荒凉的世界屋脊，但是文明、财富和文化也能在那偏远山区找到。他们的生存能力、忍耐力和繁衍能力是无人能敌的。"
 tarim_basin.0020.desc.indian:0 "\n\n已经决定加强与我的领地内的印度社区的联系，印度次大陆以其许多美好的事物而闻名，从许多人追随的鼓舞人心的信仰，到复杂而熟练的艺术风格，再到庞大的商人网络，等等。与他们交好会让我的王国繁荣。"
 tarim_basin.0020.option.east_asian:0 "时间会证明，东方的文化知识会帮助我们！"
 tarim_basin.0020.tooltip.east_asian:0 "只要你有[GetModifier('RICE_tarim_basin_east_asian_contacts').GetNameWithTooltip][character_modifier|E]，你将定期收到当地东亚[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，[silk_road_communities|E]给的礼物里面[prestige|E]和[dynasty_prestige|E]可能会更好，出现几率更大。"
 tarim_basin.0020.option.steppe:0 "与草原部族交好意味着别人也会尊重我！"
 tarim_basin.0020.tooltip.steppe:0 "只要你拥有[GetModifier('RICE_tarim_basin_steppe_contacts').GetNameWithTooltip][character_modifier|E]，你将定期收到当地草原[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，[silk_road_communities|E]给予在[battles|E]中提高[advantage|E]和[scheme_success_chance|E]，[special_troops|E]和[character_modifiers|E]的礼物可能会更好，更容易出现"
 tarim_basin.0020.option.middle_eastern:0 "如果我们与中东人做好生意，我们肯定都能繁荣和发展。"
 tarim_basin.0020.tooltip.middle_eastern:0 "只要你拥有[GetModifier('RICE_tarim_basin_middle_eastern_contacts').GetNameWithTooltip][character_modifier|E]，你将定期收到来自中东当地[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，[silk_road_communities|E]重点于提高[gold|E][income|E]，或[county_modifiers|E][building|E]成本和[control|E]在你的[realm_capital|E]以及[character_modifiers|E]礼物，并且出现几率更高。"
 tarim_basin.0020.option.himalayan:0 "与这些坚韧之人保持友好关系是件好事。"
 tarim_basin.0020.tooltip.himalayan:0 "只要你拥有[GetModifier('RICE_tarim_basin_himalayan_contacts').GetNameWithTooltip][character_modifier|E]，你就会定期收到喜马拉雅当地[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，[silk_road_communities|E]着重于提高[scheme_resistance|E]和[prowess|E]以及[health|E]、[fertility|E]和降低[stress|E]还有[character_modifiers|E]礼物，并且更有可能出现。"
 tarim_basin.0020.option.indian:0 "这些人毕竟对我们的王国有很大的贡献。"
 tarim_basin.0020.tooltip.indian:0 "只要你拥有[GetModifier('RICE_tarim_basin_indian_contacts').GetNameWithTooltip][character_modifier|E]，你就会定期收到来自当地印度[silk_road_community_short|E]的各种礼物。与其他[silk_road_communities|E]相比，印度社区着装与[piety|E]的礼物，或改善[lifestyle_experience|E]还有[character_modifiers|E]礼物，并且也更容易出现。"
 RICE.silk_road_gift_quality.tooltip.east_asian:0 "因为你目前正在加强与当地东亚[silk_road_community_short|E]的联系，因此东亚礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 RICE.silk_road_gift_quality.tooltip.steppe:0 "因为你目前正在加强与当地大草原[silk_road_community_short|E]的联系，因此大草原礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 RICE.silk_road_gift_quality.tooltip.middle_eastern:0 "因为你目前正在加强与当地中东[silk_road_community_short|E]的联系，因此中东礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 RICE.silk_road_gift_quality.tooltip.himalayan:0 "因为你目前正在加强与当地喜马拉雅[silk_road_community_short|E]的联系，因此喜马拉雅礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 RICE.silk_road_gift_quality.tooltip.indian:0 "因为你目前正在加强与当地印度[silk_road_community_short|E]的联系，因此印度礼物的质量可能比你从其他[silk_road_communities|E]那里得到礼物更好。"
 tarim_basin.0021.t:0 "贵重的礼物"
 tarim_basin.0021.desc.east_asian:0 "鉴于我最近努力与当地东亚世家建立联系和加深关系，这些东方血统世家精英向我赠送了黄金和其他贵重的礼物，其中许多是以他们民族的传统风格制作的。"
 tarim_basin.0021.desc.steppe:0 "鉴于我最近努力与当地大草原部族建立联系和加深关系，这些大草原部族精英向我赠送了黄金和其他贵重的礼物，其中许多是以他们民族的传统风格制作的。"
 tarim_basin.0021.desc.middle_eastern:0 "鉴于我最近努力与当地中东社区建立联系和加深关系，这些中东家族精英向我提供了黄金和其他贵重的礼物，其中许多是以他们民族的传统风格制作的。"
 tarim_basin.0021.desc.himalayan:0 "鉴于我最近努力与当地喜马拉雅部族建立联系和加深关系，这些喜马拉雅部族精英向我赠送了黄金和其他贵重的礼物，其中许多是以他们民族的传统风格制作的。"
 tarim_basin.0021.desc.indian:0 "鉴于我最近努力与印度社区建立联系和加深关系，这些社区精英向我赠送了黄金和其他贵重的礼物，其中许多是以他们民族的传统美学而制作的。"
 tarim_basin.0021.a:0 "这样的礼物非常受欢迎。"
 tarim_basin.0022.t:0 "有钱途的商业交易"
 tarim_basin.0022.desc.east_asian:0 "我为当地东亚世家建立联系的工作已经得到回报。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润！"
 tarim_basin.0022.desc.steppe:0 "我为当地大草原部族建立联系的工作已经得到回报。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润！"
 tarim_basin.0022.desc.middle_eastern:0 "我为当地中东社区建立联系的工作已经得到回报。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润！"
 tarim_basin.0022.desc.himalayan:0 "我为当地喜马拉雅部族建立联系的工作已经得到回报。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润！"
 tarim_basin.0022.desc.indian:0 "我为当地印度社区建立联系的工作已经得到回报。他们最近同意与我合作，进行一些有利的商业交易。通过他们在丝绸之路上的贸易网络，我们一定会共同赚取丰厚的利润!"
 tarim_basin.0022.a:0 "丝绸、香料、奴隶、马匹、所有的贸易货物，必须在丝绸之路上流通。"
 tarim_basin.0023.t:0 "丝绸之路上的美食"
 tarim_basin.0023.desc.east_asian:0 "当地的东亚世家精英们对我加深彼此之间的关系表示感激。\n\n为了庆祝最近的一些成功，他们几个知名世家聚在一起，以我的名义举办了一场盛大的宴会。我们都品尝了在丝绸之路上闻名的传统美食，如水煮羊肉和猪肉，坚果，以及山楂果。"
 tarim_basin.0023.desc.steppe:0 "当地的草原部族精英们对我加深彼此之间的关系表示感激。\n\n为了庆祝最近的一些成功，他们几个知名部族聚在一起，以我的名义举办了一场盛大的宴会。我们都品尝了他们在丝绸之路上闻名的传统美食，如烤羊肉，熏马肠，以及马奶。"
 tarim_basin.0023.desc.middle_eastern:0 "当地的中东社区精英们对我加深彼此之间的关系表示感激。\n\n为了庆祝最近的一些成功，他们几个知名社区聚在一起，以我的名义举办了一场盛大的宴会。我们都品尝了他们在丝绸之路上闻名的传统美食，如费尔干纳葡萄酒，撒马尔罕桃，以及桑嘎克饼。"
 tarim_basin.0023.desc.himalayan:0 "当地的喜马拉雅部族精英们对我加深彼此之间的关系表示感激。\n\n为了庆祝最近的一些成功，他们几个知名部族聚在一起，以我的名义举办了一场盛大的宴会。我们都品尝了他们在丝绸之路上闻名的传统美食，如以蔬菜和肉类为馅的馍馍、糌粑粥以及酥油茶。"
 tarim_basin.0023.desc.indian:0 "当地的印度社区精英们对我加深彼此之间的关系表示感激。\n\n为了庆祝最近的一些成功，他们几个知名社区聚在一起，以我的名义举办了一场盛大的宴会。我们都品尝了他们在丝绸之路上闻名的传统美食，如塞满蔬菜的印度饼、五仁油炸饼和与混合水果的酪乳。"
 tarim_basin.0023.a:0 "一个美妙而欢乐的时刻！"
 tarim_basin.0024.t:0 "穿越丝绸之路的荣耀与名望"
 tarim_basin.0024.desc.east_asian:0 "我通过与领地内东南亚世家的往来，已经成功地与他们建立良好的关系。即使是那些东南亚的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在东南亚的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0024.desc.steppe:0 "我通过与领地内草原部族的往来，已经成功地与他们建立良好的关系。即使是那些大草原的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在大草原的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0024.desc.middle_eastern:0 "我通过与领地内中东社区的往来，已经成功地与他们建立良好的关系。即使是那些中东的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在中东的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0024.desc.himalayan:0 "我通过与领地内喜马拉雅部族的往来，已经成功地与他们建立良好的关系。即使是那些喜马拉雅的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在喜马拉雅的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0024.desc.indian:0 "我通过与领地内印度社区的往来，已经成功地与他们建立良好的关系。即使是那些印度的平民们，他们从丝绸之路的其他地方迁移到这里，也比以前更重视我。我毫不怀疑，生活在印度的人们也会听到关于我和我的家族的美誉。\n\n从长远来看，这必将使我在政治和经济上受益，并为我的宗族赢得许多荣誉和赞誉。"
 tarim_basin.0024.a:0 "让我们希望这种和平时期能持续一段时间！"
 tarim_basin.0025.t:0 "神圣的礼物"
 tarim_basin.0025.desc.east_asian:0 "当地东亚世家长者向我赠送了一份壮观的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教物品，像是镶嵌着珍贵宝石的雕像、美妙绝伦绘画以及其他类似物品。\n\n虽然他们社区的每个人都不一定有相同的信仰，但他们在丝绸之路上相互生活了几个世纪，有时和平，有时冲突。因此这些知名人士清楚地知道要向我赠送什么样的宗教文物，这并不令人惊讶。"
 tarim_basin.0025.desc.steppe:0 "当地大草原部族长老向我赠送了一份壮观的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教物品，像是镶嵌着珍贵宝石的雕像、美妙绝伦绘画以及其他类似物品。\n\n虽然他们社区的每个人都不一定有相同的信仰，但他们在丝绸之路上相互生活了几个世纪，有时和平，有时冲突。因此这些精英清楚地知道要向我赠送什么样的宗教文物，这并不令人惊讶。"
