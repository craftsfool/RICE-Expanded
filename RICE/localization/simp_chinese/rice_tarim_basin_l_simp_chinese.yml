 RICE_tarim_basin_gift_silk_road_infrastructure_3_desc:0 "$RICE_tarim_basin_gift_silk_road_infrastructure_1_desc$"
 RICE_tarim_basin_gift_silk_road_bodyguards_1:0 "丝绸之路小型护卫队"
 RICE_tarim_basin_gift_silk_road_bodyguards_1_desc:0 "丝绸之路沿线的一个外族部族的成员，其中包括一些退伍老兵，最近承诺为该角色提供忠诚的护卫服务。"
