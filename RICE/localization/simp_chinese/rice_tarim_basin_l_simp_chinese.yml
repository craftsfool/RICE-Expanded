 tarim_basin.0150.t:0 "游行准备"
 tarim_basin.0150.desc:0 "自从[ROOT.Char.GetFaith.GetReligion.GetName]来到[khotan.GetNameNoTier]后，[ROOT.Char.GetFaith.GetReligion.GetAdjective]居住在该城的信徒，在该城寺院的领导下，每年都会组织一次持续十四天的画像巡游。从无论什么阶级都会参加。\n\n传说中，当佛祖去到[khotan.GetNameNoTier]的现身时，他指示八个开悟的明王看守这座城市。据说只要城市的人们追随于佛陀的教义并认真地实践，他们就会保护这座城市。因此该地区的[ROOT.Char.GetFaith.GetAdherentNamePlural]像我一样有责任参加每年的游行等仪式，以确保[ROOT.Char.GetFaith.GetReligion.GetName]的光芒在这些土地上永不熄灭。\n\n今年我准备参加这一伟大的活动，见证[ROOT.Char.GetFaith.GetReligion.GetAdjective][khotan.GetNameNoTier]的荣光！这就是我的愿望。"
 tarim_basin.0150.a:0 "是时候让自己准备一下了。"
 tarim_basin.0151.t:0 "几乎是时候开始了"
 tarim_basin.0151.desc.intro:0 "我来得正是时候，[khotan.GetNameNoTier]的人都在忙活着呢！人们到处乱窜，为一年一度的游行做准备，因为明天整个活动就要开始了。"
 tarim_basin.0151.desc.not_khotan_ruler:0 "\n\n虽然我不属于[khotan.GetNameNoTier]的贵族，但我仍然被认为是一个重要之人，所以我和其他重要的客人受到了[khotan.GetNameNoTier]的统治者[khotan_ruler.GetTitledFirstName]的盛情欢迎。我们都简单地讨论了明天的活动安排，然后就去休息了。"
 tarim_basin.0151.desc.khotan_ruler:0 "\n\n作为[khotan.GetNameNoTier]的统治者，我将在游行活动中承担重要责任。同时我欢迎一些远道而来的重要客人参加这个场合。我们都简单地讨论了明天的活动安排，然后就过夜。"
 tarim_basin.0151.a:0 "毫无疑问，明天将是一个伟大的日子。"
 tarim_basin.0152.t:0 "一年一度的游行开始了"
 tarim_basin.0152.desc.intro:0 "我们都在等待的这一天已经到来了！一年一度的佛像游行正在[khotan.GetNameNoTier]进行中。在接下来的两个星期里，每天该地区主要寺院之一都会把佛陀和其他佛陀的圣像放在装饰精美的车上然后运进城市。"
 tarim_basin.0152.desc.not_khotan_ruler:0 "\n我和其他前来参加活动的客人一起站在城门外，凝视着第一支队伍，他们来自[khotan.GetNameNoTier]最伟大和最受尊敬的寺院戈马，带着巨大的荣誉和仪式感来到这里。在这个集会的首领是[khotan_ruler.GetTitledFirstName]，作为[khotan.GetNameNoTier]的统治者，他必须按照传统正式接待每一支队伍。\n\n车子一到门口，我们就看着[khotan_ruler.GetFirstName]赤脚向前走。[khotan_ruler.GetSheHe|U]摘下[khotan_ruler.GetHerHis]的王冠，并向神像跪拜并献上祭品，然后我们其他人也跟着跪下。之后[khotan_ruler.GetFirstNamePossessiveNoTooltip]家的妇女们站在城门上，在马车进城时用鲜花洒向马车，如同极乐圣地一般。"
 tarim_basin.0152.desc.khotan_ruler:0 "\n\n我站在城门外，与前来参加活动的客人站在一起，注视着第一支队伍，从[khotan.GetNameNoTier]最伟大和最受尊敬的寺院戈马出发，带着盛大的仪式到达。我作为[khotan.GetNameNoTier]的统治者，我的职责是正式接待每一支队伍，这是传统。\n\n车子一到门口，我就赤脚上前。我摘下王冠，向神像跪拜，并进行供奉，然后大家也跟着跪拜。之后我家族里的妇女们站在城门上，在马车进城时用撒向鲜花。"
 tarim_basin.0152.a:0 "这是一个美妙的活动开头。"
 tarim_basin.0153.t:0 "年度游行结束"
 tarim_basin.0153.desc:0 "过去的14天在欢庆中过去了，但这就是佛陀所教导的无常的本质，没有什么可以永远持续。正常生活正在回归到[khotan.GetNameNoTier]。\n\n最后一场游行已经结束，[khotan.GetNameNoTier]的喧嚣和骚动已经平息。今年的庆祝活动被认为是很成功的；像往常一样，希望我们从组织和做这些仪式中获得的功德祝福，无论是对[khotan.GetNameNoTier]本身还是对每个参与的人。"
 tarim_basin.0153.a:0 "我很高兴能参加一年一度的游行！"
 tarim_basin.0154.t:0 "八大明王"
 tarim_basin.0154.desc:0 "凡居住在或经过[khotan.GetNameNoTier]，并遵循[ROOT.Char.GetFaith.GetReligion.GetAdjective]教义的人，都听说过于阗八大明王。\n\n因此，我听说......很久以前，当佛祖访问于阗时，他预言有一天这里将成为佛法兴盛的王国。为了确保它能作为一个伟大的佛教王国继续存在和繁荣，佛祖要求八位神祇保护它。他们分别是观音、金刚手、文殊、弥勒、地藏、虚空藏、普贤、除盖。【牛奶注：八大明王出自《大妙金刚经》，由八大菩萨衍生，而于阗信仰密宗八大明王，应为同一个。】\n\n这些神祇的存在随处可见，在这一年一度的游行中也不例外。从庙宇和寺院墙壁上描绘这八位神祇的雕像和壁画，到该市所有虔诚的佛教徒口中的祈祷词，我感觉到他们正在注视着我们，无论过去还是现在。"
 tarim_basin.0154.a:0 "某种意义上，它是鼓舞人心的。"
 tarim_basin.0155.t:0 "光明之鹿"
 tarim_basin.0155.desc:0 "通过探索[khotan.GetNameNoTier]的宗教景观（尤其是在该市每年的画像游行期间），我可以参观该城的一些优秀寺院。其中最好的是#bold 瞿摩帝寺#!，其寺于阗国最大一座，可容纳几千名僧伽，其成立可追诉到传说中。\n\n传说很久以前，于阗韦加耶唯鲁雅王，有一天他看到外面有一道亮光。他来到旷野调查光的来源，发现光是从一只鹿身上发出来的。它立即化为牦牛#italic 夜叉（是于阗的八大护法之一）#!，他要求国王在那里建造一座寺院，以便他能接受几个#italic 阿罗汉#!的佛法教导！\n\n当我看到此情此景时，我只能感叹不已。"
 tarim_basin.0155.a:0 "佛法庇佑之城"
 tarim_basin.0156.t:0 "无瑕之光"
 tarim_basin.0156.desc:0 "在每年的[khotan.GetNameNoTier]画像游行中，为了激励自己做更大的功德，很多人都会复述这个城市历史上虔诚而有德行之人的故事，比如某些国王或僧侣。虽然他们中的许多人是男性，但这并不意味着没有正义的女性可以效仿，在这里最著名的是毗摩罗钵罗婆，她的崇拜随处可见。\n\n传说中毗摩罗钵罗婆实际上是一位女#italic 菩萨#!，她希望一次又一次地转生为不同的女人，在于阗需要的时候帮助于阗。最著名的是，她曾经转生为于阗公主普兰尼雅塔，当吐蕃人征服并洗劫于阗时，她流亡在外。尽管她的哥哥国王很懦弱，但这位公主还是带领她的人民获得了安全，并希望中国能来援助于阗。\n\n这样的故事清楚地告诉我们，不管是男性还是女性，任何人都可以做功德，拯救他人。"
 tarim_basin.0156.a:0 "毗摩罗钵罗婆激励我们！"
 tarim_basin.0157.t:0 "湖水消失"
 tarim_basin.0157.desc:0 "在[khotan.GetNameNoTier]的年度画像游行中，我有机会探索城市周围的一些土地。这里曾经一片沙漠绿洲，但如果传说可信的话，它并非一直如此。\n\n传说中于阗还没有建立，它还是一片空旷的荒野时，佛陀访问了这个未来城市的所在地，它曾被前几个时代的佛陀所保佑过。当时这里除了一个大湖，什么都没有。佛陀保佑了这个地区，把湖水排干，把它全部变成了现在的于阗的美丽土地。\n\n我听说过这个传说的几种变体，但基本要点依然存在。无论这个传说是真是假，但是大家都承认这个城市处于一个吉祥的位置上。"
 tarim_basin.0157.a:0 "毕竟这就是它成为一个佛教中心的原因。"
 tarim_basin.0158.t:0 "阿育王之子"
 tarim_basin.0158.desc:0 "在[khotan.GetNameNoTier]的画像游行继续进行时，我在期间思考了这个城市的一些佛教历史和传说。\n\n传说很久以前，这座城市是由印度伟大的佛教阿育王的儿子鸠那罗建立的。一个预言说这个男孩将在他父亲的活着时候成为国王时，阿育王担心他的儿子篡位，就把他抛弃在塔里木盆地。这个年幼的孩子就这样被大地养育，后来一个中国国王向佛教多闻天王祈祷求子，多闻天王将鸠那罗送去。后来鸠那罗就在这里建立于阗并领导众人。\n\n总之，这只是我所听到的关于于阗建国传说的一个版本。"
 tarim_basin.0158.a:0 "谁知道这些是不是真的？"
 tarim_basin.0159.t:0 "丝绸公主"
 tarim_basin.0159.desc:0 "在每年的画像游行中，我打算前往[khotan.GetNameNoTier]的几座主要寺院之一。我注意到其中一个是如何描绘关于丝绸公主和麻射寺（另一个重要寺院）的传说。这个传说在当地很流行，我在很多寺院都看到过它的描绘。\n\n传说几个世纪前，一位于阗国王想学习制造丝绸的秘密，但技术被中原王朝保密的很严实。当他与一位中国公主结婚时，他说服她帮助他实现目标，于是她在穿越边境时将桑葚种子和蚕卵藏在头发里。在她到达于阗市之前，她把种子和蚕卵存放在一个后来被称为麻射寺的地方。\n\n谁知道这个传说是否是真的呢？但这肯定是许多当地人认为这是有趣的事情。"
 tarim_basin.0159.a:0 "我也听说过这个故事"
 tarim_basin.0160.t:0 "高拓山"
 tarim_basin.0160.desc:0 "在[khotan.GetNameNoTier]每年的画像游行期间，我能够更好地欣赏这个城市的宗教历史和传说。据说这个城市的位置不仅受到佛祖的保佑，而且许多故事，也受到佛陀的保佑。\n\n传说在过去，有一个孩子在城里瞿摩帝寺附近迷路了。国王带领许多人在该地区寻找这个孩子，然后他们偶然发现了高塔山边的一个小山谷。他们惊奇地发现了一座#italic 窣堵坡#!，里面有过去七佛中的第六位佛陀——迦叶佛的遗物。国王认识到这一地点的神圣性，并下令建造了现在被称为高拓寺。\n\n作为于阗的主要寺院，瞿摩帝寺和高拓寺据说是许多天象和奇迹的发生地，所以它们拥有如此神奇的历史也就不足为奇了。"
 tarim_basin.0160.a:0 "在这个时代，他们仍然在这里供我们参观，这是件好事。"
 tarim_basin.0161.t:0 "神奇的飞行雕像"
 tarim_basin.0161.desc:0 "在[khotan.GetNameNoTier]到处都能听到一个神奇的、会飞的雕像故事，以至于我不确定哪些是假的，哪些是真的。\n\n传说于阗地处吉地，因此佛像和神像不时地从印度飞到于阗。其中最引人注目的是所谓的乌达雅纳雕像。年轻的国王乌达雅纳是佛信徒并且与佛陀是同时代的人，他为佛陀雕刻了一尊檀香木雕像。神奇的是这尊雕像获得了一些能力，如向佛陀行礼和与他对话。最终它飞到了于阗附近一个被称为皮摩的地方，直到今天，皮摩仍然是当地人朝拜的热门地区。\n\n在这段时间我应该也去皮摩看看。"
 tarim_basin.0161.a:0 "如果我那时还能活着看佛陀就好了。"
