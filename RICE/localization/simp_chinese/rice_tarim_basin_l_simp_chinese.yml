 RICE_tarim_basin_gift_silk_road_medicine_1:0 "丝路医学的小礼物"
 RICE_tarim_basin_gift_silk_road_medicine_1_desc:0 "该角色最近收到了来自丝绸之路的一个当地异族社区的传统药物礼物。这应该是为了帮助其改善健康状况，预防不必要的疾病。"
