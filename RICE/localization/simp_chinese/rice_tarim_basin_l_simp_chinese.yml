 tarim_basin.0090.t:0 "前往千佛洞"
 tarim_basin.0090.desc:0 "几个世纪以来，[GetTitleByKey('b_mogao').GetNameNoTier]的千佛洞一直见证着佛陀教义的荣耀与真谛。\n\n一代又一代的[GetReligionByKey('buddhism_religion').GetAdjective]将虔诚雕刻在这些洞窟的墙壁上，造福众生，让更多的施主前来朝拜、祈祷，感悟佛陀菩萨的智慧与慈悲。\n\n而我也该去千佛洞朝拜和祈祷了。"
 tarim_basin.0090.a:0 "我期待此番祭拜！"
 tarim_basin.0091.t:0 "抵达"
 tarim_basin.0091.desc:0 "我已抵达[GetTitleByKey('b_mogao').GetNameNoTier]千佛洞。看到悬崖上繁星点点的洞窟和众多虔诚的[ROOT.Char.GetFaith.GetAdherentNamePlural]如蚂蚁般匆匆忙忙地来来往往，我心中已然涌起一丝惊叹。\n\n我此刻便已感到震撼不已，我也知晓洞窟内藏着更惊人的奇观。但眼下我们需在镇上休整一夜，明日方能入窟探访。"
 tarim_basin.0091.a:0 "修整到早晨，我们就进入洞窟。"
 tarim_basin.0092.t:0 "祈祷、敬拜和惊叹"
 tarim_basin.0092.desc:0 "一进入[GetTitleByKey('b_mogao').GetNameNoTier]千佛洞，脑海里只剩下——赞叹佛陀及其教法！何其荣耀！\n\n千佛洞不愧其名，其洞窟洞与人同多，每窟皆布满各类精妙宝贝，各色新旧壁画、精雕细琢的塑像以及僧伽与访客带来的香火和供品。\n\n在这些石窟中，沐浴于启人心智的艺术之间，我祈祷、冥想，并思索佛陀关于轮回的教诲。众多洞窟待我探访，尤其令我神往的是那些描绘……"
 tarim_basin.0092.a:0 "想到很久以前雕刻它们的施主们而有所感悟"
 tarim_basin.0093.t:0 "参观我的洞窟"
 tarim_basin.0093.desc:0 "在[GetTitleByKey('b_mogao').GetNameNoTier]千佛洞中，我还决定参观很久以前我自己赞助建造的那个洞窟。\n\n再次看到这个洞窟，我不禁莞尔。这景象真是美不胜收，里面展现出来的精湛工艺和精美绝伦的美感，无不体现着对佛法与僧伽的崇敬，令人叹为观止。"
 tarim_basin.0093.a:0 "愿[ROOT.Char.GetFaith.HighGodName]指引我"
 tarim_basin.0094.t:0 "结束"
 tarim_basin.0094.desc:0 "最终，我的[GetTitleByKey('b_mogao').GetNameNoTier]石窟之行结束了。这是一次震撼人心的旅行，观赏了这么多石窟的美景，我感受到了自己的善缘，让我能够在今生学习到崇高的[ROOT.Char.GetFaith.GetAdjective]教义。这里的洞穴也许是我所见过的最能体现这些教义的地方之一。"
 tarim_basin.0094.a:0 "愿我在这里的所为能造福众生。"
