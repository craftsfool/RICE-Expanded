 game_concept_silk_road_entertainers_desc:0 "在整个丝绸之路上，向别人介绍艺人或才人是进行外交和展示自己的地位、权力和财富的一种常见方式。这些人可能包括音乐家、杂技演员、舞者、宫女、美丽的奴隶等等。\n\n这个[character_interaction|E]有两种：一个是#bold $RICE_tarim_basin_gift_entertainers$#!，另一个更强介绍是$RICE_tarim_basin_gift_kuchean_entertainers$但是必须要拥有龟兹[county|E]。如果你拥有[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_2').GetName]或者[GetDynastyPerk('RICE_socotra_indian_ocean_legacy_2').GetName][dynasty_perk|E]或者你的[culture|E]有$tradition_RICE_silk_road_name$[tradition|E]则可以解锁第一个艺人赠送，只有龟兹可以解锁[GetModifier('RICE_tarim_basin_kuchean_music').GetNameWithTooltip][county_modifier|E]。\n\n这种互动有别于单纯的[gift|E]，因为它不仅要花费更多的[gold|E]，而且只能送给其他[rulers|E]，还能给你们双方带来一些[prestige|E]、[dynasty_prestige|E]和[grandeur|E]（如果你是[king|E]或[emperor|E]）。"
