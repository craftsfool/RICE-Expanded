 tarim_basin.0033.a:0 "今天真是充实。"
 tarim_basin.0034.t:0 "安全的公海"
 tarim_basin.0034.a:0 "太好了！"
 tarim_basin.0035.t:0 "紧密的联系"
 tarim_basin.0035.desc:0 "\n\n最近，我和一个名叫[merchant.GetFullName]的[county_culture.GetName][county_faith.GetAdjective][merchant.GetWomanMan]走得很近。\n\n也许我应该与[merchant.GetFirstNameNoTooltip]建立更密切的关系。与无名小卒做生意是一回事，但与当地社区#itlaic 以及#!他们在家乡的弟兄建立私谊又是另一回事。我们可以互惠互利。"
 tarim_basin.0035.a:0 "[merchant.GetSheHe|U]可以成为一名出色的廷臣！"
