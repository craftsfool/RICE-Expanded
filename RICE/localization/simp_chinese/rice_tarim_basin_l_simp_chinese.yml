 activity_RICE_tarim_basin_crescent_lake_visit_desc:0 "敦煌附近的主要地理标志之一是月牙湖。这是一个位于沙漠中的大型湖泊，位于同样著名的鸣沙山边。许多住在附近的人都去那里放松和享受。"
