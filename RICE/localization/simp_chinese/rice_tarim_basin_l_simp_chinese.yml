 tarim_basin.0025.desc.indian:0 "当地印度社区的领导人向我赠送了一份壮观的[ROOT.Char.GetFaith.GetReligion.GetAdjective]宗教物品，像是镶嵌着珍贵宝石的雕像、美妙绝伦绘画以及其他类似物品。\n\n虽然他们社区的每个人都不一定有相同的信仰，但他们在丝绸之路上相互生活了几个世纪，有时和平，有时冲突。因此这些精英清楚地知道要向我赠送什么样的宗教文物，这并不令人惊讶。"
 tarim_basin.0025.a:0 "一件最受欢迎的礼物。"
 tarim_basin.0026.t:0 "文学作品"
 tarim_basin.0026.desc.east_asian:0 "当地东亚社区的世家成员今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品将表明他们对我最近为加强与他们的关系所做的努力的回馈。"
 tarim_basin.0026.desc.steppe:0 "当地草原部族长老们今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品将表明他们对我最近为加强与他们的关系所做的努力的回馈。"
 tarim_basin.0026.desc.middle_eastern:0 "当地中东社区精英们今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品将表明他们对我最近为加强与他们的关系所做出努力的回馈。"
 tarim_basin.0026.desc.himalayan:0 "当地喜马拉雅部族长老们今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品可以作为我最近为加强与他们的关系所做的努力的回馈。"
 tarim_basin.0026.desc.indian:0 "当地印度社区精英今天向我赠送了一份最宝贵的礼物：一份简单而优雅的手稿，上面写满了用他们语言书写的文学作品。他们认为这样一份具有文学和美学价值的作品将表明他们对我最近为加强与他们的关系所做的努力的回馈。"
 tarim_basin.0026.a:0 "太棒了！礼物是非常值得赞赏的。"
 tarim_basin.0027.t:0 "忠诚的外族士兵"
 tarim_basin.0027.desc.east_asian:0 "我们与当地东亚世家关系足够好，他们中的一些人已经向我宣誓效忠，他们提供私兵或者直接加入我的军队。其中许多人以前是雇佣兵或冒险家，他们在丝绸之路沿线追求名利，所以他们经验丰富，战斗力强悍。"
 tarim_basin.0027.desc.steppe:0 "我们与当地草原部族关系足够好，他们中的一些人已经向我宣誓效忠，他们提供私兵或者直接加入我的军队。其中许多人以前是雇佣兵或冒险家，他们在丝绸之路沿线追求名利，所以他们经验丰富，战斗力强悍。"
 tarim_basin.0027.desc.middle_eastern:0 "我们与当地中东社区关系足够好，他们中的一些人已经向我宣誓效忠，他们提供私兵或者直接加入我的军队。其中许多人以前是雇佣兵或冒险家，他们在丝绸之路沿线追求名利，所以他们经验丰富，战斗力强悍。"
 tarim_basin.0027.desc.himalayan:0 "我们与喜马拉雅部族关系足够好，他们中的一些人已经向我宣誓效忠，他们提供私兵或者直接加入我的军队。其中许多人以前是雇佣兵或冒险家，他们在丝绸之路沿线追求名利，所以他们经验丰富，战斗力强悍。"
 tarim_basin.0027.desc.indian:0 "我们与当地印度社区关系足够好，他们中的一些人已经向我宣誓效忠，他们提供私兵或者直接加入我的军队。其中许多人以前是雇佣兵或冒险家，他们在丝绸之路沿线追求名利，所以他们经验丰富，战斗力强悍。"
 tarim_basin.0027.a:0 "我非常感谢他们的支持。"
 tarim_basin.0028.t:0 "来自当地社区的鼎力支持"
 tarim_basin.0028.desc.east_asian:0 "当地东亚世家成员敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，关系一直延伸到远东的土地上，如唐朝的援助。\n\n看来，我努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助，作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0028.desc.steppe:0 "当地草原部族成员敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，关系网从中亚大草原到西伯利亚的最远处。\n\n看来，我努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助。作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0028.desc.middle_eastern:0 "当地中东社区成员敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，这些关系一直延伸至红海和黑海的海岸。\n\n看来，我努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助，作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0028.desc.himalayan:0 "当地喜马拉雅部族成员敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，一直延伸至喜马拉雅高原以及吐蕃、拉达克、青海和尼泊尔等地区。\n\n看来，我努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助，作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0028.desc.indian:0 "当地印度社区成员敏锐地意识到外部会对我们现在繁荣情况造成威胁，他们因此向我提供了一些军事物资和情报。这些物资和情报都来自于他们在丝绸之路上的关系网，一直延伸至印度次大陆的海岸和丛林。\n\n看来，我的努力没有白费！如果我们能够团结一致，共同繁荣，那么我们就会有更多的机会。如果我们要站在一起，互帮互助。作为丝绸之路上的伙伴，我们需要像这样相互信任和合作。"
 tarim_basin.0028.a:0 "我很高兴我们站在同一阵线。"
 tarim_basin.0029.t:0 "当地的"
 tarim_basin.0029.desc.east_asian:0 "[local.GetFullName]，一位来自我领地内东亚世家的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n几世纪以来，东亚人民一直为自己是世界上最有学问和文化的人而感到自豪，丝绸之路沿线的许多地方都相信这一声誉是真的。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0029.desc.steppe:0 "[local.GetFullName]，一位来自我领地内草原部族的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n虽然有些人认为这些大草原上游牧民族是野蛮人。但是在丝绸之路上草原骑兵是令人畏惧的存在。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0029.desc.middle_eastern:0 "[local.GetFullName]，一位来自我领地内中东社区的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n虽然来自中东的民族因其商业头脑而在丝绸之路沿线的许多地方变得声名狼藉，但是我也需要他们的贸易。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0029.desc.himalayan:0 "[local.GetFullName]，一位来自我领地内青藏高原部族的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n青藏高原的居民是一个粗犷、坚韧的群体，他们的勇气和力量在丝绸之路沿线的许多地方受到了重视。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0029.desc.indian:0 "[local.GetFullName]，一位来自我领地内印度社区的前途远大的[local.GetCulture.GetName][local.GetWomanMan]希望加入我的宫廷。\n\n由于印度是多个信仰的故乡，所以他们的人民被丝绸之路上的一些人视为智慧的化身，而且他们在贸易、外交和管理方面的知识也备受赞誉。不管[local.GetHerHis]的实际能力如何，我都可以通过[local.GetFirstName]建立联系。"
 tarim_basin.0029.a:0 " 太好了！欢迎你加入我们！"
 tarim_basin.0029.b:0 "一个不错的提议，但我不感兴趣。"
 tarim_basin.0030.t:0 "丝绸之路的草药和药材"
 tarim_basin.0030.desc.east_asian:0 "最近，当地东亚世家精英赠送给我一批相当数量的草药和传统药物，这些草药来自他们远东祖国的山区和森林。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0030.desc.steppe:0 "最近，当地草原部族精英赠送给我一批相当数量的草药和传统药物，这些草药来自中亚和西伯利亚的大草原。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0030.desc.middle_eastern:0 "最近，当地中东社区精英赠送给我一批相当数量的草药和传统药物，这些草药来自他们中东祖国的沙漠和河谷。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0030.desc.himalayan:0 "最近，当地喜马拉雅部族精英赠送给我一批相当数量的草药和传统药物，这些草药来自青藏高原上的高耸山脉。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0030.desc.indian:0 "最近，当地印度社区精英赠送给我一批相当数量的草药和传统药物，这些草药来自们南亚的丛林中。并跟我说，这些草药和药物在其他地方找不到，这些将帮助我健康长寿。"
 tarim_basin.0030.a:0 "我很高兴能收到这样不可思议的礼物。"
 tarim_basin.0031.t:0 "当地社区鼓励城市发展"
 tarim_basin.0031.desc.east_asian:0 "我为改善当地东亚世家关系所做的努力正在取得成果。通过倾听他们的诉求，并努力改善当地条件，而他们也反过来帮助我找到引进资源用于基础设施项目的方法，而且他们的领导人经常支持我，并安抚他们内部的不满分子。"
 tarim_basin.0031.desc.steppe:0 "我为改善当地草原部族关系所做的努力正在取得成果。通过倾听他们的诉求，并努力改善当地条件，而他们也反过来帮助我找到引进资源用于基础设施项目的方法，而且他们的领导人经常支持我，并安抚他们内部的不满分子。"
