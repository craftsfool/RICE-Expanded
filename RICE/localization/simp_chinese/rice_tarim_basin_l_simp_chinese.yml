 tarim_basin.0040.t:0 "艺人"
 tarim_basin.0040.desc:0 "大家还在谈论前段时间[actor.GetTitledFirstName]赠送我的艺人。然而其中有一位特别引人注目，[entertainer.GetFirstName]，他有[entertainer.GetCulture.GetName]的血统。\n\n“[recipient.GetTitledFirstName]，”[praiser.GetFirstName]有一天告诉我，“当我说[entertainer.GetFirstName]是一个不同于我在丝绸之路上见到的低贱艺人。如果让[entertainer.GetHerHim]作为一个普通的艺人，那将是一种浪费。不，我提议应该让[entertainer.GetHerHim]加入宫廷之中，作为[entertainer.GetSheHe]为我们提供的如此美妙享受的恩赐。”\n\n这是一个有点非正统的建议，但不算离谱。当我问跪在地上的[entertainer.GetFirstName]如何看待[entertainer.GetSheHe]时，[entertainer.GetSheHe]温顺地使用精心挑选的词语回答。“我只希望能为你的宫廷带来欢乐，无论你对我有什么要求。”"
 tarim_basin.0040.a:0 "你应该得到更多赏赐，我会让你成为一个合格的廷臣。"
 tarim_basin.0040.b:0 "低贱之人就要呆在低贱之处"
 tarim_basin.0041.t:0 "xxxxx"
 tarim_basin.0041.desc:0 "xxxxx"
 tarim_basin.0041.a:0 "xxxxx"
 tarim_basin.0042.t:0 "迷人的艺人"
 tarim_basin.0042.desc.intro:0 "大家还在谈论前段时间[actor.GetTitledFirstName]送给我的天才艺人。甚至还有八卦说[lover.GetTitledFirstName]现在迷恋其中一个艺人，一个[crush.GetCulture.GetName]名为[crush.GetFirstName]的女孩。\n\n今天，[lover.GetFirstName]向我提出了一个有趣的请求。他鞠了一躬，紧张地说道。“哦，仁慈、睿智的[recipient.GetTitledFirstName]，[crush.GetFirstName]不同于其他任何女人，她如同明月般皎洁，不应该只是一个卑微之人。我谦卑地请求你让我娶她为妃，这样我就能在余生中爱她。我知道这也是她所渴望的。”"
 tarim_basin.0042.desc.mutual:0 "\n\n我瞥了一眼跪在地上的[crush.GetFirstName]，她匆匆瞥向他，在脸颊变红并羞涩地笑了。她想让我说是吗？我从宫廷上的其他人那里听说，她能喜欢他的调情，并喜欢他的剧团，尽管很难说她是否感到真正的爱慕，或者她是否有一个不可告人的动机在里面。也或许她只是出于礼貌。"
 tarim_basin.0042.desc.one_sided:0 "\n\n我瞥了一眼跪在地上的[crush.GetFirstName]，她用恳求的眼神看着我，我看到她微微的摇头，不足以让[lover.GetFirstName]注意到。在宫殿里，我听说她不喜欢他爱慕，这已经不是什么秘密了，所以他对她的欲望是在撒谎或妄想。我不想为一个卑微之人出面，但就这样让他和她发生关系是对的吗？"
 tarim_basin.0042.desc.neutral:0 "\n我瞥了一眼跪在地上的[crush.GetFirstName]，她脸上的表情很僵硬。当我问她的想法时，她回答道：“无论你怎么决定，我的[recipient.GetLadyLord]，我都会接受。”\n其他廷臣告诉我，她对他没什么兴趣，但也不讨厌他，所以虽然他的话是谎言（也许是我的错觉），但我真的应该赏赐他吗？"
 tarim_basin.0042.a:0 "这根本不是什么事！赏赐与你。"
 tarim_basin.0042.b:0 "很好，我同意，但你欠我一次，明白吗？"
 tarim_basin.0042.c:0 "也许这位出色的女士会更喜欢#italic 我的#!剧团？"
 tarim_basin.0042.d:0 "你？她？一个低贱的婚姻也要烦我？"
 tarim_basin.0042.e:0 "我想我们应该尊重女士的意见，让她选择吧。"
 tarim_basin.0042.f:0 "请理智一点，你这是迷恋。"
 tarim_basin.0042.e.tooltip:0 "[crush.GetFirstNameNoTooltip]很感激你让她自己决定。"
 tarim_basin.0042.e.tooltip.yes:0 "她同意了[lover.GetFirstNamePossessiveNoTooltip]的提议。无论是出于真爱，还是别有用心，还是因为她受到了胁迫，谁知道呢？"
 tarim_basin.0042.e.tooltip.no:0 "她决定拒绝[lover.GetFirstNamePossessiveNoTooltip]的提议，而他必须接受被一个低贱的仆人拒绝的尴尬局面。"
 tarim_basin.0042.e.toast.no:0 "[crush.GetFirstNameNoTooltip]拒绝[lover.GetFirstNameNoTooltip]！"
 tarim_basin.0042.e.toast.yes:0 "[crush.GetFirstNameNoTooltip]同意[lover.GetFirstNameNoTooltip]！"
