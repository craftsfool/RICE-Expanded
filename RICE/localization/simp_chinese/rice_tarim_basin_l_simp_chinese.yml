 tarim_basin.0070.t:0 "莫高窟"
 tarim_basin.0070.desc.intro:0 "几个世纪以来，莫高窟一直作为佛所教导的佛法真理的见证而存在。现在我有机会通过赞助在莫高窟建造一个新洞窟来获得功德。"
 tarim_basin.0070.desc.family:0 "\n\n我已经向我雇用的工匠说明，我希望洞窟主要集中在展示我的家庭的奉献。世界必须知道我与我那高洁血脉，以及我们为真正的道路做出了多么巨大贡献。"
 tarim_basin.0070.desc.jataka:0 "\n\n我已经向我雇用的工匠说明，我希望洞窟主要集中[Glossary( '《本生经》', 'JATAKA_GLOSS' )]中的佛教寓言，这些故事已经娱乐了几代人，而且是教导大家行善积德好方法。"
 tarim_basin.0070.desc.deities:0 "\n\n我已经向我雇用的工匠说明，我希望洞窟主要集中描绘开悟的众生和神祇。有什么能比雕刻佛陀、菩萨和其他神祇，让那些看到这个洞窟的人得到启发更有价值？"
 tarim_basin.0070.desc.conclusion:0 "\n\n除了洞窟的雕刻方向，我需要确定的另一件事是成本。这将取决于我希望洞窟有多大，以及我所期望的细节和质量水平。我已经为我的洞穴预留了一些资金，但如果我想要更大更宏伟的东西，我可能要花更多钱。这个洞窟将要多大？"
 tarim_basin.0070.a:0 "一个适度的洞窟，适度花点钱"
 tarim_basin.0070.b:0 "一个相当大的洞窟，花费可观的金额"
 tarim_basin.0070.c:0 "一个巨大的洞窟——钱无所谓！"
 tarim_basin.0070.tooltip:0 "你在[mogao_cave_short|E]上花的钱越多，最后得到的奖励就越大，包括[piety|E]、[prestige|E]和正面的[character_modifiers|E]"
 tarim_basin.0071.t:0 "莫高窟完工"
 tarim_basin.0071.desc:0 "最后，经过漫长的等待，我委托的工匠在莫高窟完成了雕刻。正如我想象的那样美丽而令人惊叹，壁画上雕刻的图画看起来如此逼真。\n\n这个洞窟将与这里的其他石窟一起自豪地矗立许多个世纪，成为佛祖荣耀的见证。"
 tarim_basin.0071.a:0 "干得漂亮！"
 tarim_basin.0072.t:0 "$tarim_basin.0071.t$"
 tarim_basin.0072.desc:0 "我的前任，[deceased_mogao.GetTitledFirstName]，在他去世前不久，委托一些人在莫高窟凿出一个新洞窟。[deceased_mogao.GetHerHis|U]的死亡提醒了我们所有人，这个世界上的一切都是无常的——这就是生命和重生的轮回！\n\n尽管如此，虽然[deceased_mogao.GetSheHe]已经不在这里看到这个结果，但[deceased_mogao.GetHerHis]的善举将为他在来世赢得许多功德，这些功德肯定也会与家族的其他成员分享！"
 tarim_basin.0072.a:0 "$tarim_basin.0071.a$"
 tarim_basin.0073.t:0 "吉祥如意"
 tarim_basin.0073.desc:0 "在我委托的莫高窟工程中，有一个工匠一天晚上做了一个梦，梦见一个不知名的菩萨来拜访他。这可以说是一个吉祥的征兆。"
 tarim_basin.0073.a:0 "太好了！"
 tarim_basin.0074.t:0 "莫高窟的沙尘暴"
 tarim_basin.0074.desc:0 "当工匠在莫高窟工作时，灾难发生了。一场小型沙尘暴席卷了该地区，虽然它没有造成太大的破坏，也没有造成任何生命损失，但它破坏洞窟完成进度。"
 tarim_basin.0074.a:0 "真不幸"
 tarim_basin.0075.t:0 "匪徒袭击"
 tarim_basin.0075.desc:0 "运输用于我的莫高窟的货物和材料的商队被游牧匪徒袭击了。虽然我们没有损失所有的物资，但这是对洞窟完成进度是一个不小的打击。\n\n那些卑鄙的人肯定会因为他们邪恶行为在死后堕入地狱！"
 tarim_basin.0075.a:0 "不过，我还是要弥补这些损失。"
 tarim_basin.0076.t:0 "对石窟的援助？"
 tarim_basin.0076.desc:0 "敦煌当地的一个佛教徒组织听说了我的项目，要用我自己的力量来扩建莫高窟。他们对此印象深刻，并提供一些资金来帮助我的项目。\n\n作为交换，他们要求洞窟将需要有他们的名字，而且他们可能对洞窟的部分外观有一点发言权。"
 tarim_basin.0076.a:0 "他们将被描绘在洞穴的壁画中，并考虑到他们的想法。"
 tarim_basin.0076.b:0 "我将给他们捐款，让他们在活动中使用，以示感谢！"
 tarim_basin.0076.c:0 "说实话，我不需要他们对这个石窟的任何支持。"
 tarim_basin.0076.a.tooltip:0 "这些捐款将使我们能够扩大洞窟的原有范围，并为其增加新的元素。#EMP （这个选项将增加你在莫高窟完工后获得的奖励）#!"
 tarim_basin.0077.t:0 "僧侣拜访"
 tarim_basin.0077.desc:0 "今天，一位来自敦煌某寺院的著名高僧正在参观我的莫高窟施工现场。由于他当地声望很高，我决定陪同他到现场，带他参观。虽然这个洞窟还没有完工，仍然是一个正在进行的工作，但我希望已经存在的东西已经足够了。\n\n在我带他参观了现场后，这位僧人对正在进行的工作有很好的评价，所以我就放心了！"
 tarim_basin.0077.a:0 "在他离开之前，我给了他一些施舍。"
 tarim_basin.0078.t:0 "洞窟冲突"
 tarim_basin.0078.desc:0 "我在莫高窟的洞窟出现了一些延误。巧合的是我的洞窟在另一个正在建造的洞窟旁边，这个洞窟是由一个商人组织赞助的。\n\n不幸的是，我们的洞窟之间发生了一些冲突，甚至我们工匠之间也发生了一些混战，不过幸好没有人受到严重伤害。裁决官已经做出了对我有利的裁决，但商人们似乎仍然不高兴。"
 tarim_basin.0078.a:0 "退后，让出一些空间。我们不应该为此吵架。"
 tarim_basin.0078.b:0 "付钱给商人，这应该能安抚他们。"
 tarim_basin.0078.c:0 "忘掉那些愚蠢的商人吧！这是#italic 我的#!洞窟！"
 tarim_basin.0078.d:0 "我们为什么不把我们的努力结合起来，做一个更大洞窟呢？"
 tarim_basin.0078.d.tooltip:0 "当然，通过建造一个巨大的洞穴，我们一起可以同时尊重佛、法、僧，甚至比我们单独建造更有意义！#EMP （这个选项将增加你在莫高窟建成后获得的奖励。）#!"
 tarim_basin.0079.t:0 "一个更大更好的洞窟"
 tarim_basin.0079.desc:0 "商人们对我的举动感到惊讶，并接受了我的提议，合并我们的努力，制作一个大洞窟，而不是两个小洞窟，并利用我们之间的工匠，把他们的艺术技能结合在一起。\n\n我们都原谅了彼此的过失，并感到我们之前争吵是多么愚蠢。佛陀教导我们不要被自己的情绪所误导，因为这毕竟会造成更多的恶业。\n\n世界就是如此奇妙，一开始大家都互相有敌意，但是最后竟然出现了一件好事，现在这个洞窟将比以前更大、更有意义"
 tarim_basin.0079.a:0 "一个好结局"
 tarim_basin.0080.t:0 "一个新的商人朋友"
 tarim_basin.0080.desc:0 "在与商人组织花了一些时间来商讨我们新的联合洞穴的细节后，他们中的一个人显然决定在我的法宫廷中向我提供[merchant.GetHerHis]服务。[merchant.GetSheHe|U]是一个有才华的商人，名字叫[merchant.GetFullName]。\n\n总之在谈判和讨论中，[merchant.GetSheHe]和我相处得非常好，所以我不介意身边有[merchant.GetHerHim]这样的人帮助我。"
 tarim_basin.0080.a:0 "是的，欢迎，我的佛法朋友！"
 tarim_basin.0081.t:0 "失落的宝藏洞窟"
 tarim_basin.0081.desc:0 "在我的莫高窟工作时，工人们发现了一个古老的隐藏房间。我们在里面发现了一个已经失传了几个世纪的密封洞穴！它里面装满了无价的卷轴和其他文物。\n\n在这里挖掘新的洞窟时，这样的发现并不罕见，由于这些宝物与现存的任何家族都没有关系，所以由我来决定应该如何处理它们。"
 tarim_basin.0081.a:0 "将这些珍贵的物品捐赠给当地的寺院。"
 tarim_basin.0081.b:0 "这样的文物和卷轴在我的洞窟里会很合适。"
 tarim_basin.0081.c:0 "我想把这些东西都带回家去研究。"
 tarim_basin.0081.d:0 "卖掉这些贵重物品应该能给我带来丰厚的利润。"
 tarim_basin.0082.t:0 "外国工匠"
 tarim_basin.0082.desc:0 "负责这整个洞窟工程的主要工匠之一是一个远道而来的外国人，名叫[foreigner.GetFullName]。[foreigner.GetSheHe|U]是一位称职的工匠，为山洞的艺术带来了独特的外国艺术。\n\n话虽如此，虽然[foreigner.GetFirstName]精通[ROOT.Char.GetCulture.GetLanguage.GetName]语言，也了解我们[ROOT.Char.GetCulture.GetName]的习俗，但由于文化差异，[foreigner.GetSheHe]有时还是表现得很尴尬，难以与人沟通，现在已经开始影响[foreigner.GetHerHis]与其他人的关系。"
 tarim_basin.0082.a:0 "只要[foreigner.GetFirstName]做[foreigner.GetHerHis]的工作，对我来说就无所谓。"
 tarim_basin.0082.b:0 "如果有任何误解，我将帮助并为[foreigner.GetHerHim]担保。"
 tarim_basin.0083.t:0 "外国工匠"
 tarim_basin.0083.desc:0 "[foreigner.GetFirstName]告诉我，[foreigner.GetSheHe]很感谢我的帮助。此外还和我说，我的亲切感已经感动[foreigner.GetHerHim]，[foreigner.GetSheHe]准备在项目完成后在这里长期居住。谁知道[foreigner.GetSheHe]还能帮我做什么事情？"
 tarim_basin.0083.a:0 "太好了！"
 tarim_basin.0084.t:0 "洞窟检查"
 tarim_basin.0084.desc:0 "今天我视察了我的莫高窟项目现场。工匠们似乎都很好地完成了他们的工作，除了一个人，他比其他人工作得更慢。其他人说他很累而且最近生病了，现在才开始恢复，他平时是个好工人。"
 tarim_basin.0084.a:0 "开除他！他显然是在假装！"
 tarim_basin.0084.b:0 "那就继续你的工作吧。"
 tarim_basin.0084.c:0 "我将亲自治疗他。"
 tarim_basin.0085.t:0 "宗教仪式"
 tarim_basin.0085.desc:0 "一群来自敦煌附近的当地寺院僧人来到我正在修建的莫高窟进行一些宗教仪式、诵经和祈祷。\n\n虽然僧侣们并不经常明确要求捐款，但按照惯例，事后我要向他们提供一些东西，以示感谢，也是为了做好功德。"
 tarim_basin.0085.a:0 "我为什么要这样做？僧侣不应该这么贪婪。"
 tarim_basin.0085.b:0 "当然，我会给他们一些捐款的。"
 tarim_basin.0085.c:0 "显而易见的是，大量的捐款是他们所需要的。"
 tarim_basin.0086.t:0 "洞窟里的素食盛宴"
 tarim_basin.0086.desc:0 "对于那些遵循佛陀教义的人来说，偶尔吃点素食是我们表达信仰的方式，也是为了获得功德。当你有一天前往你的洞窟施工现场时，工匠们似乎组织了一场素食盛宴以欢迎你的到来。"
 tarim_basin.0086.a:0 "我讨厌素食，我不参与。"
 tarim_basin.0086.b:0 "一个好想法，我看情况吃饭"
 tarim_basin.0086.c:0 "素食菜肴是美味的！也是修行。"
