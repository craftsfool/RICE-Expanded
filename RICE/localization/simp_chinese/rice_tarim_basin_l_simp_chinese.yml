 RICE_tarim_basin_yelu_yixin_hook:0 "辽朝权臣"
 RICE_tarim_basin_aspiration_yelu_yixin_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('e_great_liao').GetNameNoTier]的[direct_vassal|E] \n$EFFECT_LIST_BULLET$你的金库拥有至少[gold_i|E]#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#!\n$EFFECT_LIST_BULLET$萧观音和她所有的[children|E]死亡\n$EFFECT_LIST_BULLET$确保[GetTitleByKey('e_great_liao').GetNameNoTier]的[ruler|E]对你有至少#P 25#![opinion|E]\n$EFFECT_LIST_BULLET$[prestige_level|E]达到[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]或更高\n\n#bold 奖励#!\n$EFFECT_LIST_BULLET$获得一个[diplomacy_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$获得一个[intrigue_lifestyle|E][perk|E]\n$EFFECT_LIST_BULLET$获得@prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$将[GetTrait('education_intrigue_4').GetName( GetNullCharacter )|U][trait|E]升级为[GetTrait('education_intrigue_5').GetName( GetNullCharacter )|U][trait|E]\n$EFFECT_LIST_BULLET$获得一个对[GetTitleByKey('e_great_liao').GetNameNoTier][ruler|E]的[perpetual_hook|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$亲自杀死萧观音皇后（奖励：获得一个[intrigue_lifestyle|E][perk|E]）\n$EFFECT_LIST_BULLET$拥有[dread_i|E]#V [EmptyScope.ScriptValue('high_dread')]#! [dread|E]或者更多（奖励：获得#V 1000#! $heritage_chinese_name$[special_troops|E]，包括一些[men_at_arms|E]）"
 RICE_tarim_basin_historical_aspiration_action_yelu_yixin: "#italic 耶律乙辛者，虽起于寒微，然以枭雄之姿，终总揽北院枢密使事。时朝堂如逐鹿之场，权争若角抵之戏：腐儒所诟者，公独谓之经国长策；清流所讥者，公自诩为宰辅机谋。以霹雳手段固权位，运机枢智守富贵，虽物议沸腾而不为所动。#!$RICE_tarim_basin_aspiration_yelu_yixin_desc$"
 RICE_tarim_basin_historical_aspiration_modifier_desc_yelu_yixin: "[GetModifier('RICE_tarim_basin_aspiration_corrupt_liao_official').GetNameWithTooltip]"
 RICE_tarim_basin_aspiration_corrupt_liao_official: "[RICE_aspiration|E]：作为辽朝官员，积累权力和财富"
 RICE_tarim_basin_aspiration_corrupt_liao_official_desc: "#italic 耶律乙辛者，虽起于寒微，然以枭雄之姿，终总揽北院枢密使事。时朝堂如逐鹿之场，权争若角抵之戏：腐儒所诟者，乙辛独谓之经国长策；清流所讥者，其自诩为宰辅机谋。以霹雳手段固权位，运机枢智守富贵，虽物议沸腾而不为所动。#!$RICE_tarim_basin_aspiration_yelu_yixin_desc$\n\n"
