 RICE_tarim_basin_first_turkic_dictionary_name:0 "《突厥语大词典》"
 RICE_tarim_basin_first_turkic_dictionary_desc:0 "第一部已知的突厥语综合词典，名为《突厥语大词典》，由一位名为[compiler.GetFullName]的学者撰写，他的灵感来自于证明突厥人的语言之美。虽然突厥语是其主要重点，但它也提供了关于突厥人的历史、地理、文化和宗教的信息，以及突厥语诗歌的例子。"
 RICE_tarim_basin_silk_road_scroll_east_asian_name:0 "来自东亚的卷轴"
 RICE_tarim_basin_silk_road_scroll_east_asian_desc:0 "一幅不大但很美的卷轴，其中包含一些传统东亚风格的绘画艺术，以及一些东亚语言的文字，非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话。\n\n远东地区的人民因其圣人知识和学者而闻名于整个丝绸之路，所以这个卷轴中可能有一首雄辩的诗，或哲学文献或历史文献，或其他一些深刻的知识。"
 RICE_tarim_basin_silk_road_scroll_steppe_name:0 "来自大草原的手稿"
 RICE_tarim_basin_silk_road_scroll_steppe_desc:0 "一幅朴素而美丽的卷轴，其中包含一些传统的草原游牧风格的绘画艺术，以及一些欧亚草原语言的文字，非常适合作为非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话。\n\n与我们对宿敌的刻板印象相反，一些草原民族确实有识字的传统，人们只能惊叹于用这些文字讲述的光荣战役或高贵英雄的史诗!"
 RICE_tarim_basin_silk_road_scroll_middle_eastern_name:0 "来自中东的手稿"
 RICE_tarim_basin_silk_road_scroll_middle_eastern_desc:0 "一幅不大但很美的卷轴，其中包含一些传统中东风格的绘画艺术，以及一些阿拉伯语、波斯语或犹太语的文字，非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话。\n\n人们只需看一眼就能看到这些文字的优雅、华丽的书法，这本身就是一种艺术形式，而且肯定反映了这幅卷轴中可以找到的有深度而有思想的文学作品。"
 RICE_tarim_basin_silk_road_scroll_himalayan_name:0 "来自喜马拉雅山脉的手稿"
 RICE_tarim_basin_silk_road_scroll_himalayan_desc:0 "一幅朴素而美丽的卷轴，其中包含了一些喜马拉雅传统风格的绘画艺术，以及一些喜马拉雅语言的文字，非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话。\n\n虽然喜马拉雅山在外人看来是冷寂和荒凉的，但它也是将其视为家园的人们的巨大灵感来源，再加上来自丝绸之路一带的各种文化影响，这使他们发展了一种美妙的文学传统。"
 RICE_tarim_basin_silk_road_scroll_indian_name:0 "来自印度的手稿"
 RICE_tarim_basin_silk_road_scroll_indian_desc:0 "一幅朴素而美丽的卷轴，其中包含一些传统南亚风格的绘画艺术，以及一些南亚语言的文字，非常适合作为简单的房屋装饰和阅读，如果人们知道如何阅读它的话，\n\n作为丝绸之路沿线的主要文化、学习和宗教中心之一，印度人民有着悠久的历史，创作了许多精彩的文学作品，从内容丰富的作品令人深思，再到令人流泪的感人故事。"
 RICE_tarim_basin_silk_road_legacy_track_name:0 "丝路传承"
 RICE_tarim_basin_silk_road_legacy_track_desc:0 "通过贸易、宗教、艺术和威望将整个欧亚大陆的不同民族和文化联系起来"
 RICE_tarim_basin_silk_road_legacy_1_name:1 "信仰和谐"
 RICE_tarim_basin_silk_road_legacy_2_name:1 "纵横捭阖"
 RICE_tarim_basin_silk_road_legacy_3_name:0 "商队网络"
 RICE_tarim_basin_silk_road_legacy_4_name:0 "艺术同化"
 RICE_tarim_basin_silk_road_legacy_5_name:0 "百家争鸣"
 RICE_tarim_basin_silk_road_legacy_1_effect_1:0 "解锁[decisions|E]建立翻译局并赞助重大宗教翻译项目"
 RICE_tarim_basin_silk_road_legacy_2_effect_1:0 "$RICE_reinforce_relations_silk_road_communities$[decision|E]，一生可以使用多次。"
 RICE_tarim_basin_silk_road_legacy_2_effect_2:0 "解锁[character_interaction|E]，向其他[rulers|E]推荐娴熟的[silk_road_entertainers|E]。"
 RICE_tarim_basin_silk_road_legacy_3_effect_1:0 "$RICE_reinforce_relations_silk_road_communities$[decision|E]获得的[character_modifiers|E]持续时间翻倍"
 RICE_tarim_basin_silk_road_legacy_4_effect_1:0 "增加赞助莫高窟[decision|E]的收益"
 RICE_tarim_basin_silk_road_legacy_5_effect_1:0 "采取$RICE_reinforce_relations_silk_road_communities$[decision|E]后，增加正面事件几率"
 RICE_tarim_basin_silk_road_legacy_5_effect_2:0 "资助莫高窟的[decision|E]更便宜"
 RICE_tarim_basin_silk_road_legacy_5_effect_3:0 "只要你在[GetGeographicalRegion('world_steppe_tarim').GetName]拥有领土，无论你的[heritage|E]如何，你都可以通过[decision|E]来赞助建造一个莫高窟。"
 building_type_RICE_tarim_basin_mogao_caves:0 "莫高窟"
 building_type_RICE_tarim_basin_mogao_caves_desc:0 "莫高窟，俗称千佛洞，是一个由数百个石窟组成的网络，作为专门用于佛教崇拜、祈祷和冥想的寺庙和圣地。最古老的洞窟雕刻于4世纪，从那时起来自远在中原的佛信徒和于阗的信徒们便赞助建造了各种洞窟。许多当地世家豪族都有自己的洞窟，他们已经维护了几个世纪。"
 building_RICE_tarim_basin_mogao_caves:0 "$building_type_RICE_tarim_basin_mogao_caves$"
 building_RICE_tarim_basin_mogao_caves_desc:0 "$building_type_RICE_tarim_basin_mogao_caves_desc$"
 building_type_RICE_tarim_basin_bezeklik_caves:0 "宁戎寺"
 building_type_RICE_tarim_basin_bezeklik_caves_desc:0 "宁戎寺是一个佛教石窟的，可以追溯到许多世纪。然而该遗址最近才变得更加出名，并已成为当地佛教徒的重要礼拜和朝圣场所。"
 building_RICE_tarim_basin_bezeklik_caves:0 "$building_type_RICE_tarim_basin_bezeklik_caves$"
 building_RICE_tarim_basin_bezeklik_caves_desc:0 "$building_type_RICE_tarim_basin_bezeklik_caves_desc$"
 building_type_RICE_tarim_basin_kizil_caves:0 "克孜尔千佛洞"
 building_type_RICE_tarim_basin_kizil_caves_desc:0 "千佛克孜尔石窟是由数百个佛教石窟组成的复合体，其历史可追溯至多个世纪，是当地的圣地。尽管这些石窟越来越荒废，许多石窟已年久失修，但它们仍然被用来供奉，是塔里木盆地最大的石窟，其规模和壮丽程度与莫高窟相比相形见绌。"
 building_RICE_tarim_basin_kizil_caves:0 "$building_type_RICE_tarim_basin_kizil_caves$"
 building_RICE_tarim_basin_kizil_caves_desc:0 "$building_type_RICE_tarim_basin_kizil_caves_desc$"
 building_type_RICE_tarim_basin_khotan_jade_deposits_01:0 "于阗玉矿"
 building_type_RICE_tarim_basin_khotan_jade_deposits_01_desc:0 "自古以来，玉石一直是于阗的主要出口产品之一。它因其耐用性和美观而受到青睐，尤其受到东方贵族青睐它被大量地出口到那里。在于阗，玉石有两个主要来源，一个是附近的昆仑山，另一个是玉龙喀什河的冲积层。"
 building_RICE_tarim_basin_khotan_jade_deposits_01:0 "玉矿聚居地"
 building_RICE_tarim_basin_khotan_jade_deposits_01_desc:0 "于阗附近的小城镇的居民散布在邻近的山脉和河流中，他们努力工作，提取珍贵的玉石。"
 building_RICE_tarim_basin_khotan_jade_deposits_02:0 "阇提矿"
 building_RICE_tarim_basin_khotan_jade_deposits_02_desc:1 "从于阗周围地区开采的玉石数量越来越多，定居点也越来越多，为于阗带来了更多的财富。"
 building_RICE_tarim_basin_khotan_jade_deposits_03:0 "大型阇提矿"
 building_RICE_tarim_basin_khotan_jade_deposits_03_desc:0 "于阗周边的玉石矿床被系统地开采，并由有野心勃勃的商人和当地官员管理，他们知道更远东的外国人无法拒绝这些玉石。"
 building_RICE_tarim_basin_khotan_jade_deposits_04:0 "于阗玉矿综合镇"
 building_RICE_tarim_basin_khotan_jade_deposits_04_desc:0 "作为亚洲为数不多的仍然拥有相当规模的玉石矿脉的地区之一，于阗的玉石产业现在已经成熟和发达。它是该市的财政来源之一。"
 RICE_tarim_basin_kuchean_music:0 "龟兹音乐"
 RICE_tarim_basin_kuchean_music_desc:0 "龟兹以不夜享乐城而著称，远道而来的人们梦想着参观这里的许多歌舞会所，那里有才华横溢的音乐家、舞者和娼妓。因此库车音乐在世界各地广受欢迎，甚至远至中国。\n\n#italic 只要[county_modifier|E]处于活跃状态，龟兹[county|E]的[rulers|E]就可以获得一个特殊的[character_interaction|E]#bold 熟练[kuchean_entertainers|E]#!，这是更强的#bold 熟练[silk_road_entertainers|E]#!，并且随时可用#!"
 RICE_tarim_basin_recently_sinicized:0 "最近接受儒家文化"
 RICE_tarim_basin_zhang_clan:0 "张氏血脉"
 RICE_tarim_basin_zhang_clan_desc:0 "作为起义反抗吐蕃帝国的统治，恢复唐代河西走廊的望族，敦煌张氏在敦煌的其他望族中赢得了巨大的威望，至少明面如此。"
 RICE_tarim_basin_cao_clan:0 "曹氏血脉"
 RICE_tarim_basin_cao_clan_desc:0 "敦煌曹氏声称自己是曹操后裔。尽管对这样一个说法有争议，但他们的才能、勤奋和野心是实打实的。唯一的问题是，他们的野心究竟是#italic 什么#!？"
 RICE_tarim_basin_suo_clan:0 "索氏血脉"
 RICE_tarim_basin_suo_clan_desc:0 "敦煌索氏，自汉代以来为敦煌世家之一。他们以学识和文化闻名，其中最著名的成员是晋代书法家索靖。"
 RICE_tarim_basin_li_clan:0 "陇西李氏血脉"
 RICE_tarim_basin_li_clan_desc:0 "敦煌李氏，又称陇西李氏，自称是汉族将军李广的后裔，也是道教圣人老子的后代。唐朝皇帝本身就是陇西李氏的一个分支的后裔。因此李氏在敦煌是非常有声望的，获得巨大的尊重。"
 RICE_tarim_basin_zhai_clan:0 "翟氏血脉"
 RICE_tarim_basin_zhai_clan_desc:0 "敦煌翟氏以其在知识、宗教和政治事务方面的成就而闻名，他们并不总是像敦煌望族那样拥有很大的权力，但他们善于巧妙地驾驭和适应不断变化的政治变化，知道与谁合作，与谁不合作。"
 RICE_tarim_basin_yin_clan:0 "阴氏血脉"
 RICE_tarim_basin_yin_clan_desc:0 "阴氏是敦煌望族之一，其祖先阴澹在汉朝灭亡后逃到那里。他们因与许多粟特家族的关系而闻名，而且当年也是女皇武则天的拥护者之一，据说他们见证了使女皇统治合法化的祥瑞。"
 RICE_tarim_basin_yan_clan:0 "阎氏血脉"
 RICE_tarim_basin_yan_clan_desc:0 "敦煌阎氏长袖善舞，一直善于政治，为合适的统治者工作。他们最著名的成员阎超，英勇地抵抗了吐蕃对敦煌的入侵，并能够通过谈判达成有利的投降，使敦煌城得以幸免。"
 RICE_tarim_basin_guiyi_tang_distrust:0 "遭唐廷猜忌"
 RICE_tarim_basin_guiyi_tang_distrust_desc:0 "虽然归义军名义上声称效忠于唐朝，但双方由于历史上安史之乱的原因而关系紧张，唐廷不愿对这些西域军将提供太多援助。\n\n#EMP 这个[character_modifier|E]是给在公元888年之前的归义军[ruler|E]的。"
 RICE_tarim_basin_is_zhang_yichao:0 "敦煌解放者"
 RICE_tarim_basin_is_zhang_yichao_desc:0 "伟大的张议潮是这个纷争与冲突的时代中当之无愧的英雄，出生于敦煌世家的他在公元848年率军起义驱逐吐蕃统治，并在此后的岁月里妥善治理着这个地区。"
 RICE_tarim_basin_built_mogao_cave_normal:0 "资助小型莫高窟"
 RICE_tarim_basin_built_mogao_cave_normal_desc:0 "该角色最近资助敦煌附近的[mogao_caves|E]建造一个规模不大的佛窟，这一举动肯定会为其带来无良功德。"
 RICE_tarim_basin_built_mogao_cave_big:0 "资助中型莫高窟"
 RICE_tarim_basin_built_mogao_cave_big_desc:0 "该角色最近资助敦煌附近的[mogao_caves|E]建造一个规模中等的佛窟，这佛窟十分美丽，被当地精英效仿资助同规模佛窟。"
 RICE_tarim_basin_built_mogao_cave_bigger:0 "资助大型莫高窟"
 RICE_tarim_basin_built_mogao_cave_bigger_desc:0 "该角色最近资助敦煌附近的[mogao_caves|E]建造一个大型规模的佛窟，这个佛窟是多年来建造的最辉煌、最大的佛窟之一，赢得了许多人的赞誉和钦佩。"
 RICE_tarim_basin_built_mogao_cave_biggest:0 "资助巨型莫高窟"
 RICE_tarim_basin_built_mogao_cave_biggest_desc:0 "该角色最近资助敦煌附近的[mogao_caves|E]建造一个规模巨大的佛窟，该洞是整个莫高窟遗址中最大的洞穴群之一，充满了令人眼花缭乱的壁画和令人叹为观止的艺术。"
 RICE_tarim_basin_silk_road_entertainers:0 "异国丝路艺人"
 RICE_tarim_basin_silk_road_entertainers_desc:0 "另一位统治者最近向该角色介绍了一群来自丝绸之路沿路的技艺精湛艺人，包括音乐家、杂技演员、舞蹈家、娼妓、美丽的奴隶等等。该角色宫廷的这些新成员将大大提高他们新主人的地位。"
 RICE_tarim_basin_kuchean_entertainers:0 "异国龟兹艺人"
 RICE_tarim_basin_kuchean_entertainers_desc:0 "另一位统治者最近给该角色赠送一批技艺高超龟兹艺人，包括音乐家、杂技演员、舞者、娼妓、美丽的奴隶等等。该角色宫廷的这些新成员将大大提高他们新主人地位，特别是是龟兹以其出色的音乐和艺人而闻名。"
 RICE_tarim_basin_gifted_silk_road_entertainers:0 "丝路艺人赠礼"
 RICE_tarim_basin_gifted_kuchean_entertainers:0 "龟兹艺人赠礼"
 RICE_tarim_basin_east_asian_contacts:0 "与东亚[silk_road_communities_short|E]接触"
 RICE_tarim_basin_east_asian_contacts_desc:0 "该角色与丝绸之路上的东亚或汉人有联系，他们与这些世家精英成员有良好的关系。\n\n#EMP 增加从当地[silk_road_communities|E]获得[prestige|E]和[dynasty_prestige|E]礼物的数量和机会。\n解锁$RICE_silk_road_community_east_asian_decision$[decision|E]#!"
 RICE_tarim_basin_steppe_contacts:0 "与草原的[silk_road_communities_short|E]接触"
 RICE_tarim_basin_steppe_contacts_desc:0 "该角色与生活在丝绸之路上的草原游牧民族有联系，他与这些部族精英成员有良好关系。\n\n#EMP 增加在[battles|E]中提高[scheme_success_chance|E][advantage|E]的[special_troops|E]和[character_modifiers|E]的数量和几率，解锁$RICE_silk_road_community_steppe_decision$[decision|E]#!"
 RICE_tarim_basin_middle_eastern_contacts:0 "与中东地区[silk_road_communities_short|E]接触"
 RICE_tarim_basin_middle_eastern_contacts_desc:0 "该角色与生活在丝绸之路上的阿拉伯人、波斯人和犹太人有联系，他与这些社区的精英成员有良好的关系。\n\n#EMP 增加从当地[silk_road_communities|E]获得[gold|E][income|E]或[county_modifiers|E][building|E]成本以及在你的[realm_capital|E][control|E]还有[character_modifiers|E]礼物的数量和几率。\n解锁$RICE_silk_road_community_middle_eastern_decision$[decision|E]#!"
 RICE_tarim_basin_himalayan_contacts:0 "与喜马拉雅山脉[silk_road_communities_short|E]接触"
 RICE_tarim_basin_himalayan_contacts_desc:0 "该角色与生活在丝绸之路上的喜马拉雅人有联系，他与这些社区的精英成员有良好的关系。\n\n#EMP 增加从当地[silk_road_communities|E]获得改进[scheme_resistance|E]和[prowess|E]，或[health|E]、[fertility|E]和处理[stress|E]的[character_modifiers|E]礼物的数量和几率。\n解锁$RICE_silk_road_community_himalayan_decision$[decision|E]#!"
 RICE_tarim_basin_indian_contacts:0 "与印度[silk_road_communities_short|E]接触"
 RICE_tarim_basin_indian_contacts_desc:0 "该角色与丝绸之路上印度人有联系或者留着印度血统，所以与这些印度社区的精英成员有良好的关系。\n\n#EMP 增加获得[piety|E]，或者改善[lifestyle_experience|E]的[character_modifiers|E]礼物的数量和几率\n解锁$RICE_silk_road_community_indian_decision$[decision|E]#!"
 RICE_tarim_basin_east_asian_specialists:0 "东方学者"
 RICE_tarim_basin_east_asian_specialists_desc:0 "一些来自中原王朝或其他受其文化影响的附近地区专家被招募来为该角色服务。他们专精行政、法律、公共工程、战略等相关的领域。"
 RICE_tarim_basin_merchant_settlers:0 "商贩移民"
 RICE_tarim_basin_merchant_settlers_desc:0 "最近，一些阿拉伯或波斯的商人群体在这里定居。作为所谓丝绸之路的管家，他们的存在将促进当地经济。"
 RICE_tarim_basin_indic_artisans:0 "印度工匠"
 RICE_tarim_basin_indic_artisans_desc:0 "印度艺术在世界许多地方都有影响力，因此该角色最近聘请了许多印度工匠。这些工匠的技巧肯定会有很大的用处。"
 RICE_tarim_basin_lop_nur_dry_period:0 "罗布泊的旱季"
 RICE_tarim_basin_lop_nur_dry_period_desc:0 "无论是由于气候模式和河道的变化，还是由于人为活动导致沙漠化加剧，曾经相当大的罗布泊湖已经大大缩小，将曾经郁郁葱葱的湖泊变成了严酷、荒凉的荒地。这给附近的定居点带来了压力，因为他们努力维持以前的农业水平。但是还是有许多人逃离该地区，当地经济正在遭受损失。"
 RICE_tarim_basin_lop_nur_fluctuations:0 "罗布泊湖水位波动"
 RICE_tarim_basin_lop_nur_fluctuations_desc:0 "几代人以前，曾经相当大的罗布泊湖开始大幅缩小，无论是由于气候或河道的变化，还是人为活动影响。那个漫长的“干涸期”现在已经结束，但湖面已经是它以前的影子了，因为它的湖面继续波动，并逐渐下降。当地的经济远没有达到它的辉煌时期，古老的、被遗弃的定居点的废墟散落一地。"
 RICE_tarim_basin_fake_china_dynasty:0 "中国的大汗和苏丹"
 RICE_tarim_basin_fake_china_dynasty_desc:0 "该宗族统治者统治着塔里木盆地的部分地区，他们经常授予自己与中国有关的荣誉称号，如东方和中国的王（“Malik al‑Mashriq wa al‑Sin”）、东方和中国的苏丹（“Sultan al‑Sharq wa al‑Sin”）和中国大汗（“Tabgach Khan”）。当今时代的许多穆斯林认为中国是一个模范的、理想的社会，由博学、正义的学者统治，生产精美的奢侈品。在古代，塔里木盆地长期被中国控制，如今这个王朝控制了塔里木盆地，意味着在法理上拥有中国，不是吗？\n\n#EMP 如果这个[dynasty|E]不再有任何成员是[rulers|E]，也不再拥有[GetGeographicalRegion('RICE_former_tang_western_region').GetName]中的任何领土，那么这个[modifier|E]将被#N 永久地失去#!。#!"
 RICE_tarim_basin_is_al_kashgari: "[RICE_aspiration|E]：编纂《突厥语大词典》"
 RICE_tarim_basin_is_al_kashgari_desc: "#italic 阿拉伯人和波斯人瞧不起突厥人，把他们视作未开化的蛮族。喀什噶里希望编纂一本伟大的突厥语词典来证明他们是错的，来证明突厥语也是一种美丽、优雅的语言！#!$RICE_tarim_basin_aspiration_al_kashgari_desc$\n\n"
 RICE_tarim_basin_working_on_turkic_dictionary:0 "编写第一部突厥语词典"
 RICE_tarim_basin_working_on_turkic_dictionary_desc:0 "该角色目前正致力于编纂第一部突厥语词典。他很快就会向世界证明，突厥人的语言和文学遗产与其他民族的语言和文学遗产一样值得尊敬！"
 RICE_tarim_basin_eight_protectors_blessing_1_desc:0 "他们说该角色在参加了该市一年一度的宗教游行后，得到了[eight_protectors_of_khotan|E]的祝福。传说中，佛祖指派了八位神灵保护于阗，确保其主权，并捍卫佛教教义。这八位神灵是阿帕拉吉塔、萨姆纳亚、嘎纳斯瓦拉、苏瓦纳马拉、格拉瓦塔、阿姆古萨、斯塔纳瓦蒂和维萨瓦那。"
 RICE_tarim_basin_eight_protectors_blessing_2_desc:0 "$RICE_tarim_basin_eight_protectors_blessing_1_desc$"
 RICE_tarim_basin_eight_protectors_blessing_3_desc:0 "$RICE_tarim_basin_eight_protectors_blessing_1_desc$"
 RICE_tarim_basin_eight_protectors_blessing_4_desc:0 "$RICE_tarim_basin_eight_protectors_blessing_1_desc$"
 RICE_tarim_basin_khotan_eight_protectors:0 "八大明王"
 RICE_tarim_basin_khotan_eight_protectors_desc:0 "于阗拥有无数的寺院和僧侣，几个世纪以来一直是佛教的中心。各种预言和经文讲述了佛祖如何指示[eight_protectors|E]来保护于阗。八大明王分别是孔雀明王、马头明王、不动明王、降三世明王、军荼利明王、大威德明王、金刚夜叉明王、无能胜明王。只要于阗人民仍然信仰佛教三宝，这些伟大的生命也将确保于阗的生存和繁荣。\n\n#EMP 只要是#V 佛教徒#!，于阗[county|E]的[ruler|E]就可以得到这个[character_modifier|E]并使他们和附近的佛教[rulers|E]能够参与[GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName][activity|E]。\n如果于阗[county|E]被不信奉佛教[faith|E]的人或对佛教教义有敌意的人统治，这个[character_modifier|E]将被取消，如果发生这种情况，只能通过对$RICE_tarim_basin_reinhabit_gomati_monastery$[decision|E]恢复加成#!。"
 RICE_tarim_basin_studying_mogao_artifacts:0 "研究莫高窟的古代文物和卷轴"
 RICE_tarim_basin_fight_cattle_good_character:0 "新年斗兽占卜预示着好事"
 RICE_tarim_basin_fight_horses_good_character:0 "新年斗兽占卜预示着好事"
