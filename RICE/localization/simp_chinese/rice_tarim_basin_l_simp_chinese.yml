 game_concept_silk_road_communities_short:0 "丝路团体"
 game_concept_silk_road_communities:0 "丝路团体"
 game_concept_silk_road_communities_desc:0 "[GetGeographicalRegion('RICE_silk_road_region').GetName]中，[rulers|E]可以使用$RICE_reinforce_relations_silk_road_communities$[decision|E]。选择[decision|E]可让改善与你所在区域中数个种族/文化群体的关系，分别是东亚、草原、中东、喜马拉雅、印度、东非和南亚。每个地区都会给你一个为期10年的独特[character_modifier|E]，并且可以通过决议进一步提高。\n\n当拥有[modifier|E]时，你有几率获得各种收益。这些收益通常是通过事件获得的，可以是一些[gold|E]或者[piety|E]，也可以是免费的廷臣和[special_troops|E]，而不同地区民族群体会提供不同的好处。每个社区还可以解锁一个独特的、简单的[decision|E]，可以通过决议进一步提高收益。\n\n要注意的是，这些[decision|E]一生只能执行一次，除非你的[dynasty|E]已经解锁[GetDynastyPerk('RICE_socotra_indian_ocean_legacy_3').GetName]或者[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_3').GetName][dynasty_perks|E]，或者你的[culture|E]拥有$tradition_RICE_silk_road_name$[tradition|E]"
 game_concept_mogao_cave_short:0 "洞窟"
 game_concept_mogao_caves_short:0 "洞窟群"
 game_concept_mogao_cave:0 "莫高窟"
 game_concept_mogao_caves:0 "莫高窟"
 game_concept_mogao_caves_desc:0 "$RICE_tarim_basin_patronize_a_mogao_cave$[decision|E]可由[GetGeographicalRegion('RICE_dunhuang_region').GetName]中信仰佛教的[rulers|E]来使用。\n\n莫高窟是一个壮观的宗教建筑群，从4世纪到14世纪在敦煌周围陆陆续续雕刻而成，是是世界上现存规模最大、内容最丰富的佛教艺术地。当采取[decision|E]时，你有两个选择要做。首先选择洞窟雕刻的重点：家庭、本生经或宗教人物。当事件链完成后，这些将分别获得更多的[prestige|E]，更多的[piety|E]，或两者皆有的奖励。接下来选择洞穴的大小决定了你能得到多少奖励，以及你在最后得到[character_modifier|E]的强度。\n\n有两个[dynasty_perks|E]可以对[decision|E]有帮助，分别是[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_4').GetName]会提高[decision|E]的奖励；[GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_5').GetName]可以使决议更便宜并且其他宗教的也可以使用此决议。"
 game_concept_eight_protectors_of_khotan:0 "于阗八大明王"
 game_concept_eight_protectors:0 "八大明王"
 game_concept_eight_protectors_desc:0 "根据各种于阗的传说，$game_concept_eight_protectors$是佛祖指定的八位神祇，他们看守和保卫于阗。任何信仰#V 佛教#![faith|E]的于阗[rulers|E]将获得[GetModifier('RICE_tarim_basin_khotan_eight_protectors').GetNameWithTooltip][character_modifier|E]，他们以及附近的[rulers|E]将有机会参与[GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName][activity|E]。\n\n然而如果于阗不再被佛教徒所统治，那么这个[character_modifier|E]就有可能在游戏中永远无法使用，并且永远不会再给任何其他[ruler|E]。只有当于阗的[county|E]传给一个[faith|E]不符合以下条件的[ruler|E]，并且任何[liege|E]或[top_liege|E]的[faith|E]没有以下条件，这种情况才能发生。\n\n$EFFECT_LIST_BULLET$佛教或者道教[religion|E]\n$EFFECT_LIST_BULLET$东方信仰组或者异教[religious_families|E]并具有[GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName][doctrine|E]\n$EFFECT_LIST_BULLET$拥有[GetTenetType('tenet_eastern_syncretism').GetBaseName][core_tenet|E]\n$EFFECT_LIST_BULLET$拥有[GetDoctrineType('doctrine_pluralism_pluralistic').GetBaseName][doctrine|E]\n$EFFECT_LIST_BULLET$拥有[GetDoctrineType('unreformed_faith_doctrine').GetBaseName][doctrine|E]\n\n如果佛教徒希望重新获得八大明王的加持，他们首先需要再次统治于阗，并采取$RICE_tarim_basin_reinhabit_gomati_monastery$的[decision|E]。"
