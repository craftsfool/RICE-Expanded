 tuareg.0010.t:0 "[tuareg.GetCollectiveNounNoTooltip]崛起"
 tuareg.0010.desc:0 "[tuareg_founder.GetTitledFirstName]和[tuareg_founder.GetHerHis]部落的祖先已经在撒哈拉沙漠生活了几个世纪，这些土地见证部族的频繁变化，各部落因各种原因走到一起或分裂。\n\n[tuareg_founder.GetFirstNameNoTooltip]在这一地区中发起了又一次重大变革。[tuareg_founder.GetSheHe|U]宣布[tuareg_founder.GetSheHe]和其他像[tuareg_founder.GetHerHim]这样的人是[tuareg.GetName]，是锡·海南（4世纪的$heritage_berber_name$女王）的后裔。多年来，[tuareg.GetCollectiveNoun]发展了一些习俗和价值观，使他们有别于其他文化兄弟，如他们非常尊重部落的妇女，并坚持男人必须戴面纱，特别是蓝色或靛蓝染色的#italic 面纱#!。\n\n无论如何，[tuareg.GetNameNoTooltip]的崛起无疑将改变撒哈拉的历史轨迹。"
 tuareg.0010.a:0 "[tuareg.GetCollectiveNounNoTooltip]将带来什么？"
 tuareg.0010.tooltip:0 "现在所有具有$tradition_RICE_tuareg_name$[tradition|E]的[cultures|E]可以使用$RICE_tuareg_found_empire_of_air$[decision|E]并获得[GetTitleByKey('e_air').GetName]头衔。"
 tuareg.0011.t:0 "[tuareg.GetNameNoTooltip]帝国"
 tuareg.0011.desc:0 "许多年前，[tuareg.GetCollectiveNoun]来到撒哈拉和萨赫勒交汇的地区，在开阔的沙漠和干旱的平原上为自己建立了新的家园。\n\n现在，[tuareg_unifier.GetTitledFirstName]，这些最初的先驱者的后裔之一。无论是血缘还是精神都已经将该地区的许多部落联合成一个新的强大国家——[GetTitleByKey('e_air').GetName]。\n\n目前，[GetTitleByKey('e_air').GetNameNoTierNoTooltip]已经控制了纵横撒哈拉的跨撒哈拉贸易路线的很大一部分。来自非洲各地的统治者无疑会看着[tuareg_unifier.GetFirstNameNoTooltip]和[tuareg_unifier.GetHerHis]领土的影响力和财富继续增长。\n\n最后，许多帝国将在这些沙漠沙地上兴起和衰落，所以只有时间能证明[GetTitleByKey('e_air').GetNameNoTierNoTooltip]能保持多长的霸权。"
 tuareg.0011.a:0 "撒哈拉的历史翻开了新的篇章。"
 tuareg.0012.t:0 "前往阿伊尔山"
 tuareg.0012.desc:0 "我决定前往[GetGeographicalRegion('world_africa_sahara').GetName]深处的阿伊尔山脉偏远地区。为什么有人会去这样一个地方，在这样一片干旱的土地上？当然是为了它的温泉！\n\n听说阿伊尔山脉有许多温泉，其中一些因其疗效而闻名。我特别想去的是塔法迪克温泉。"
 tuareg.0012.a:0 "我希望这段艰辛的旅程是值得的。"
 tuareg.0013.t:0 "塔法迪克的温泉"
 tuareg.0013.desc:0 "虽然旅途艰辛，但我已经到达阿伊尔山脉中著名的塔法迪克温泉。\n\n我将自己浸泡在这些水中，感到非常放松，疲劳一扫而空。也许真如他们所说，这些水具有很大的药用价值！"
 tuareg.0013.a:0 "我很欣慰！"
