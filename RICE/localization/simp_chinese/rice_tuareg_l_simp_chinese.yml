 tuareg.0050.t:0 "面纱之民"
 tuareg.0050.desc:0 "我们之中的男人所戴的#italic 面纱#!难道不是我们人民的高贵象征吗？这难道不是一种优雅地彰显一个人的部族和地位的方式吗？\n\n然而有人因此嘲弄我们。他们说[ROOT.Char.GetCulture.GetName]的男人就像女人一样，因为在他们的土地上，只有女人戴面纱"
 tuareg.0050.a:0 "荒谬！男人就应该戴面纱。"
 tuareg.0051.t:0 "谦逊寡言"
 tuareg.0051.desc:0 "作为#italic 面纱之民#!，[ROOT.Char.GetCulture.GetCollectiveNoun]人，我们非常重视#italic 谦逊寡言#!的美德，那些喜怒不形于色的人将得到尊重。\n\n最近[courtier.GetFirstName]因体现了#italic 谦逊寡言#!而闻名，我的宫廷和许多其他地方都因此称赞[courtier.GetHerHim]。"
 tuareg.0051.a:0 "我可以理解为什么每个人都那么说"
 tuareg.0052.t:0 "小麦扁面包"
 tuareg.0052.desc:0 "今天，我正享用一些美味的夹着用香料烤制的羊肉的#italic 面饼#!。一直以来这种扁平的面饼都是[ROOT.Char.GetCulture.GetName]的主食"
 tuareg.0052.a:0 "美味！"
 tuareg.0053.t:0 "内婚工匠"
 tuareg.0053.desc:0 "[county.GetNameNoTier]的#italic 内婚工匠#!最近因优秀的产品而闻名。虽然[ROOT.Char.GetCulture.GetName]人中的贵族、精英阶层，比如我，要与这些世袭的工匠、铁匠、珠宝匠等保持距离，但他们的工作无疑对我们大有裨益。"
 tuareg.0053.a:0 "很高兴听到这消息"
 tuareg.0054.t:0 "提非纳文"
 tuareg.0054.desc:0 "我在家附近，[county.GetNameNoTier]的旷野中偶遇了一些用#italic 提非纳文#!书写的古代石碑。\n\n遇到用#italic 提纳非文#!书写的碑文并不稀奇。我们的[ROOT.Char.GetCulture.GetCollectiveNoun]仍如我们的先祖那样使用它。\n\n不管如何，我发现的碑文非常破旧，难以辨认。只能去想象最初的那些雕刻者是何人，以及想表达什么。"
 tuareg.0054.a:0 "也许这很重要"
