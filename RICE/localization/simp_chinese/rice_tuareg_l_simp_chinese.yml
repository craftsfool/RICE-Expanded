 RICE_every_berber_county:0 "你的[realm|E]中的每一个[county|E]为$heritage_berber_name$[heritage|E][culture|E]"
 RICE_every_berber_courtier:0 "每个[culture|E]拥有$heritage_berber_name$[heritage|E]的[courtier|E]或[guest|E]"
 RICE_every_berber_vassal:0 "每个[culture|E]拥有$heritage_berber_name$[heritage|E]的[vassal|E]"
 e_air:0 "阿伊尔"
 e_air_adj:0 "阿伊尔"
 activity_RICE_tuareg_dream_incubation:0 "蕴梦"
 activity_RICE_tuareg_dream_incubation_desc:0 "在做出重要决定之前，我们有一个古老的习俗，就是先去拜访对我们很重要的人的坟墓并与之同睡，并进行[GetPlayer.GetFaith.GetAdjective]祈祷。当我们在这些古老的坟墓前睡觉时，先祖诸灵会托梦给我们，让我们做出正确选择！"
 activity_RICE_tuareg_dream_incubation_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，占梦，尤其是在坟墓里占梦，一直是许多阿马齐格人的习俗，直到今天在一些阿马齐格部落中仍在实行。例如，希罗多德的《历史》中说，古代利比亚的纳撒摩涅司人在做出重要决定之前会在他们祖先坟墓前睡觉，他们所做的梦会帮助他们决定。"
 activity_RICE_tuareg_dream_incubation_selection_tooltip: "前往一个坟墓，在那里睡觉，借此获得启示。\n\n$activity_RICE_tuareg_dream_incubation_context_tooltip$"
 activity_RICE_tuareg_dream_incubation_host_desc: "\n$BULLET_WITH_TAB$获得[prestige_i][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$基于你的[sins|E]、[virtues|E]、[traits|E]、[learning|E]以及[piety_level|E]，有#V [GetPlayer.MakeScope.ScriptValue('RICE_tuareg_dream_chance_value')]%#!概率获得#P 正面#![character_modifier|E]"
 activity_RICE_tuareg_dream_incubation_province_desc: "拜访当地一处长者之墓！"
 activity_RICE_tuareg_dream_incubation_destination_selection: "[GetPlayer.GetFaith.PriestNeuterPlural]说这片土地上散布着许多古墓。"
 RICE_tuareg_dream_incubation_type_personal: "个人感悟"
 RICE_tuareg_dream_incubation_type_personal_desc: "$EFFECT_LIST_BULLET$你将寻求见解，并获得关于个人事务，例如人际关系，健康，生活方式的#P 正面#![character_modifier|E]\n\n#weak 唯有梦境不受现实法则的约束，我们可以更好地了解我们的身份。#!"
 RICE_tuareg_dream_incubation_type_political: "政治洞悉"
 RICE_tuareg_dream_incubation_type_political_desc: "$EFFECT_LIST_BULLET$你将寻求见解，并获得关于政治事务，例如你的封臣、战争与声誉的#P 正面#![character_modifier|E]\n\n#weak 历史告诉我们，无数的统治者因为没有听从梦中的警告而遭受巨大的灾难。如果神灵对你所面临的威胁有建议或警告，请密切注意#!"
 RICE_tuareg_dream_incubation_type_communal: "世俗洞悉"
 RICE_tuareg_dream_incubation_type_communal_desc: "$EFFECT_LIST_BULLET$你将寻求见解，并获得关于如何治理王国与人民的#P 正面#![character_modifier|E]\n\n#weak 一个好的统治者会利用古人的智慧，无论是否以梦的形式，来引导人民前进！#!"
 RICE_tuareg_dream_incubation_tomb_type: "坟墓"
 RICE_tuareg_dream_incubation_tomb_type_random: "随机坟墓"
 RICE_tuareg_dream_incubation_tomb_type_random_desc: "$EFFECT_LIST_BULLET$前往当地知名人士的墓前睡觉。\n\n#weak 在我们之前就有很多人来过世间，其中必有我师焉。#!"
 RICE_tuareg_dream_incubation_tomb_type_ancestor: "先祖"
 RICE_tuareg_dream_incubation_tomb_type_ancestor_desc: "$EFFECT_LIST_BULLET$于[GetPlayer.GetDynasty.GetNameNoTooltip][dynasty|E]先祖的坟冢中入睡\n$EFFECT_LIST_BULLET$在[activity|E]结束时获得#V 50#![prestige_i]\n$EFFECT_LIST_BULLET$增加#V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!做梦的几率，如果[activity|E]地点在[city|E]则增加额外的#V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!\n\n#weak 据说一位非常遥远的祖先躺在这里。他们一定有很多事情希望传达给身为后人的我！#!"
 RICE_tuareg_dream_incubation_tomb_type_saint: "当地圣人"
 RICE_tuareg_dream_incubation_tomb_type_saint_desc: "$EFFECT_LIST_BULLET$于圣[GetPlayer.GetFaith.GetAdjective][GetPlayer.GetFaith.PriestNeuter]的坟冢入睡\n$EFFECT_LIST_BULLET$在[activity|E]结束时获得#V 50#![piety_i]\n$EFFECT_LIST_BULLET$增加#V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!做梦的几率，如果[activity|E]地点在[church_holding|E]则增加额外的#V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!\n\n#weak 圣人的事迹和智慧即使他们去世后也可以激励生者。#!"
 RICE_tuareg_dream_incubation_dream_phase: "蕴梦"
 RICE_tuareg_dream_incubation_dream_phase_desc: "宛如梦境……"
 RICE_insight_understanding_header: "感悟："
 RICE_insight_understanding: "感悟"
 RICE_insight_understanding_desc: "希望通过占梦来发现你所面临的问题的潜在解决方案。在[activity|E]结束时失去[stress_loss_i][stress|E]。"
 RICE_ritual_intent_header: "尊重："
 RICE_ritual_intent: "尊重"
 RICE_ritual_intent_desc: "无论你是否相信这个梦的占卜会有帮助，你都要在举行这个仪式时表现出尊重与责任。在[activity|E]结束时获得额外[piety_i|E][piety|E]与[prestige_i|E][prestige|E]"
 RICE_curiosity_intent_header: "沉浸："
 RICE_curiosity_intent: "沉浸"
 RICE_curiosity_intent_desc: "梦和来世本身比梦的占卜结果更让你着迷。你的[lifestyle|E]获得[experience|E]。"
 TRAVEL_NAME_FOR_activity_RICE_tuareg_dream_incubation:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_tuareg_dream_incubation$"
 activity_RICE_hot_springs_visit_tafadek_province_desc:0 "\n#P +++塔法迪克[hot_springs|E]是一处独特的[hot_springs|E]。#!\n\n#italic 温泉之旅将获得[GetModifier('RICE_tuareg_tafadek_springs_modifier').GetNameWithTooltip][character_modifier|E]#!"
 RICE_tuareg_tafadek_springs_modifier: "参观塔法迪克的温泉"
 RICE_tuareg_emergence_decision:0 "建立$tuareg$故土"
 RICE_tuareg_emergence_decision_tooltip:0 "我们的祖先世代在撒哈拉沙漠中流浪，但也许我们可以为自己找到一个新的家园。"
 RICE_tuareg_emergence_decision_desc:0 "我们的先祖$heritage_berber_name$流浪于撒哈拉沙漠上数代，许多生活在撒哈拉沙漠南部边缘的同胞希望为自己找到一个新的家园，在那里我们可以继续我们久经考验的游牧生活方式。"
 RICE_tuareg_emergence_decision_confirm:0 "召集氏族酋长们！"
 RICE_tuareg_emergence_decision_effect_tooltip_1:0 "该[decision|E]将启用$RICE_tuareg_found_empire_of_air$[decision|E]，其可以获得[GetTitleByKey('e_air').GetName]"
 RICE_tuareg_emergence_decision_context_tooltip:0 "#emphasis 历史背景：#!图阿雷格人是居住在撒哈拉中部和南部大部分地区的阿马齐格人（也叫“柏柏尔人”）的一个群体。虽然图阿雷格这个词最早在中世纪后期才出现，但图阿雷格人的各种祖先部族，如拉姆图纳和马苏法在更早的时候就有证据中表明图阿雷格人是阿马齐格人的后裔，他们迁徙到现在的地方，征服和融合当地。"
 RICE_tuareg_found_empire_of_air:0 "团结$tuareg_collective_noun$人"
 RICE_tuareg_found_empire_of_air_tooltip:0 "现在是时候创建一个全新且强大的帝国，横跨撒哈拉沙漠了！"
 RICE_tuareg_found_empire_of_air_desc:0 "我们$tuareg_collective_noun$人已经在撒哈拉和萨赫勒交界的地区地建立了新家园，我们对跨撒哈拉贸易的控制使我们繁荣昌盛，现在是时候通过联合起来建立一个新的[empire|E]来进一步扩大我们的影响力！而名字就叫——阿伊尔帝国！"
 RICE_tuareg_found_empire_of_air_confirm:0 "时不待我！"
 RICE_tuareg_found_empire_of_air_effect_tooltip_1:0 "四元素理应如此"
 RICE_tuareg_found_empire_of_air_context_tooltip:0 "#emphasis 历史背景：#!阿伊尔苏丹国，或称阿加德兹苏丹国，由图阿雷格人成立于十四世纪的某个时期。根据不太可信的传说，苏丹国的建立原因是当地部落在历经多年战乱后派遣一名特使前往君士坦丁堡的奥斯曼人那里，请求他们派出一名王子作为当地人的领袖。这个王国以阿加德兹城为中心，从跨撒哈拉贸易中获取财富。尽管它在十六世纪被桑海短暂征服，但直到1900年法国殖民之前都保持独立。"
