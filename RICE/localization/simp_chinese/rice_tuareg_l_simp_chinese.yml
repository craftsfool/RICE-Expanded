 tuareg.0020.t:0 "着手准备"
 tuareg.0020.desc:0 "通过在坟冢之中的梦境寻求建议并非不为人所知。几个世纪以来，在这样的坟冢中入眠已经成为了我们的一项传统；据说在那里做的梦能让人对俗世的事务产生深刻的见解。\n\n旅程结束后，我来到了[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 tuareg.0020.a:0 "我需要好好准备这场仪式"
 tuareg.0021.t:0 "坟冢"
 tuareg.0021.desc:0 "夜幕降临时分我来到位于[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]的坟冢。在接受了当地[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]的就关于如何入睡以及入睡时应该做些什么的指示后，我准备好开始这场仪式了！\n\n正当我入睡时，我在脑海中回想着生命中困扰我的问题"
 tuareg.0021.a:0 "是时候前往梦的领域了……"
 tuareg.0022.t:0 "梦"
 tuareg.0022.a:0 "现在是时候回家了"
