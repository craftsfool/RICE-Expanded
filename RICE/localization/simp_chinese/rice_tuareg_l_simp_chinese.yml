 RICE_tuareg_dream_action_33:0 "带领一支充满强大战士的军队"
 RICE_tuareg_dream_action_34:0 "在树下休息"
 RICE_tuareg_dream_action_35:0 "像鸟一样拍打手臂起飞"
 RICE_tuareg_dream_action_36:0 "看到一只会说话的猫，它声称是我仆人的父亲"
 RICE_tuareg_dream_action_37:0 "目睹一个孩子降生"
 RICE_tuareg_dream_action_38:0 "吃了一些非常非常美味的食物"
 RICE_tuareg_dream_action_39:0 "与陌生人为了无关紧要的事争论"
 RICE_tuareg_dream_action_40:0 "被[ROOT.Char.GetFaith.DevilName]掷向未来，在[ROOT.Char.GetFaith.DevilHerHis]的地方，邪恶就是法律"
 RICE_tuareg_dream_action_41:0 "像侦探一样解决谜题"
 RICE_tuareg_dream_action_42:0 "在河里游泳放松"
 RICE_tuareg_dream_action_43:0 "把石头扔进池塘"
 RICE_tuareg_dream_action_44:0 "化作鸟儿飞走"
 RICE_tuareg_dream_action_45:0 "变作某种野兽"
 RICE_tuareg_dream_action_46:0 "在夜空中的群星之间起舞"
 RICE_tuareg_dream_action_47:0 "做出淫荡的行为"
 RICE_tuareg_dream_action_48:0 "做出浪漫的行为"
 RICE_tuareg_dream_action_49:0 "与一位美人牵手"
 RICE_tuareg_dream_action_50:0 "怪哉，我这是梦中梦吗"
 tuareg.0020.desc.intro:0 "作为[ROOT.Char.GetTitleAsNameNoTooltip]，我有许多责任与担忧"
 tuareg.0020.desc.faith:0 "在那些相信[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.PantheonTerm]的人之中"
 tuareg.0020.desc.culture:0 "在[ROOT.Char.GetCulture.GetCollectiveNoun]之中"
 tuareg.0020.desc.notable:0 "据说很久以前当地的一位名人埋葬于此。"
 tuareg.0020.desc.ancestor:0 "据说我的一个远祖埋葬于此。"
 tuareg.0020.desc.saint:0 "据说[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]圣徒埋葬于此。"
 tuareg.0020.desc.personal:0 "\n\n最近有些私事严重困扰着我。我希望在这个坟冢中所做的梦能指引我在处理个人事务方面走上正确的道路。"
 tuareg.0020.desc.political:0 "\n\n政治问题一直萦绕在我的心头，无论是我的敌手、下属或是其他人，我希望在这个坟冢中所做的梦能告知我如何谨慎的对待他们。"
 tuareg.0020.desc.communal:0 "\n\n领民的幸福一直是我最关心的点。我作为领袖做了正确的事吗？还是说我需要改变目前的政策？我希望在这个坟冢中所做的梦能给我提供我所寻求的答案。"
 tuareg.0022.desc.failure:0 "当黎明来临，太阳升于天空之时，我从沉睡中醒来，感到疲惫而昏沉。很不幸，我记不清楚昨晚的梦了，当我向当地的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]描述能回想起的几个细节时，他们说看不透其中有何含义。\n\n令人遗憾，[ROOT.Char.GetFaith.PantheonTerm][ROOT.Char.GetFaith.PantheonTermHasHave]觉得我不值得获得任何建议。\n\n我想至少，我拜访了某位重要人物的坟冢。"
 tuareg.0022.desc.success:0 "当黎明来临，太阳升于天空之时，我从沉睡中醒来，感到清爽而充满活力。我清楚的记得昨夜所做的梦，并复述给了当地的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]。\n\n我能回忆起梦的内容主要是#Bold [ROOT.Char.Custom('RICE_tuareg_dream_subject')]#!，以及我#Bold [ROOT.Char.Custom('RICE_tuareg_dream_action')]#!\n\n总之，[ROOT.Char.Custom('DefaultPriestTitlePlural')]为我解释了这个梦的含义，以及[ROOT.Char.GetFaith.PantheonTerm]想要传达给我的消息。总之我得到了神圣的指引，这让我感到安心。"
 tuareg.0050.b:0 "不同的地方有不同的风俗，不是吗？"
 tuareg.0050.info:0 "#emphasis 历史背景：#!图阿雷格人以他们的#italic 面纱#!而闻名。与许多周围的文化不同，他们的传统是给男人戴面纱，而不是女人。成年男子甚至会因为向陌生人或地位较高的人露出口鼻而感到羞耻。从历史上看，这种做法在某些阿马齐格部落中得到了证实，包括一些与图阿雷格人有关的部落。在11世纪统治着大部分北非与伊比利亚的穆拉比特人就因这种习俗被他们的敌人穆瓦希德人嘲笑。"
 tuareg.0054.b:0 "也许这是灵魂所作？"
 tuareg.0054.c:0 "等等，我想我能理解……"
 RICE_tuareg_legend_new_title_name: "大撒哈拉帝国"
 RICE_tuareg_legend_new_title_desc: "在很久很久以前，有一个图阿雷格的故事，故事的发生是这样的：一位英雄，一个传奇，[founder.GetSheHe]几乎征服了整个撒哈拉。[founder.GetSheHe]是[founder.GetTitledFirstName]，伟大的[GetTitleByKey('e_air').GetName]的开创者！"
 RICE_tuareg_legend_chapter_opening_new_title: "人人都说，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]肯定是出身名门望族，不然[ROOT.Legend.GetProtagonist.GetSheHe]怎能折服撒哈拉沙漠内外那些桀骜不驯的部族！"
 RICE_tuareg_legend_chapter_motivation_new_title: "然而[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]只是广袤的撒哈拉沙漠中众多凡人之一，[ROOT.Legend.GetProtagonist.GetSheHe]志在沙漠之外，而非沙漠之中。[ROOT.Legend.GetProtagonist.GetSheHe]常常问旁人，难道他们只能满足于任由敌人摆布，只能追逐敌人的步伐？"
 RICE_tuareg_legend_chapter_famous_deed_new_title: "啊，伟大的[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]，你为你的人民指明了前进的方向，劝农经商、报复血仇，带他们走上了那光辉的大路！"
 RICE_tuareg_legend_chapter_extra_deed_new_title: "伟大的英雄啊！自远在撒哈拉以南的非洲内陆，一直到地中海沿岸，都是你的土地！你就是那万有之国，全世界的商品都涌向你来，那些桀骜不驯的部落无不臣服于你的伟大。愿你在[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]的领导下，国祚永存！"
 RICE_tuareg_legend_chapter_conclusion_new_title: "便是让那些向来有奇思妙想的人来想，他们也不敢说[ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip]人还能再出一个[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]这样的人物。也只有[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]这样不世出的英雄才能建此霸业！"
 activity_RICE_tuareg_dream_incubation_host_an_a:0 "$host_activity_a$"
