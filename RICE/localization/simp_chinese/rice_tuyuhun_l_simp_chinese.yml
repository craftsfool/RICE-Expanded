 RICE_tuyuhun_nadun_festival_festivity_phase_desc: "我们聚集在纳顿，庆祝[GetPlayer.GetFaith.HighGodName]赐予我们的希望丰收。"
 RICE_tuyuhun_nadun_festival_joy_intent_header: "享乐："
 RICE_tuyuhun_nadun_festival_joy_intent: "享乐"
 RICE_tuyuhun_nadun_festival_joy_intent_desc: "为了庆祝丰收，你希望在今年的纳顿节上有很多乐趣。因此你会失去[stress_loss_i|E][stress|E]，如果你拥有[GetTrait('gregarious').GetName( GetNullCharacter )]或[GetTrait('gluttonous').GetName( GetNullCharacter )]特质，则会失去更多。"
 RICE_tuyuhun_nadun_festival_gratitude_intent_header: "感恩："
 RICE_tuyuhun_nadun_festival_gratitude_intent: "感恩"
 RICE_tuyuhun_nadun_festival_gratitude_intent_desc: "你想对[ROOT.Char.GetFaith.HighGodName]赐予大丰收表示感恩。你将获得[prestige_i|E]#V 100#!和[piety_i|E]#V 100#!，是你在纳顿节结束时获得的两倍。如果你拥有[GetTrait('humble').GetName( GetNullCharacter )]或[GetTrait('zealous').GetName( GetNullCharacter )]特质，你也还额外失去[stress_loss_i|E][stress|E]。"
 RICE_tuyuhun_nadun_festival_coordination_intent_header: "协助："
 RICE_tuyuhun_nadun_festival_coordination_intent: "协助"
 RICE_tuyuhun_nadun_festival_coordination_intent_desc: "纳顿节是世界上最长的节日之一，你希望能在筹备中帮忙。你将在[activity|E]结束时获得[GetModifier('RICE_tuyuhun_assisted_organizing_nadun_festival').GetNameWithTooltip][character_modifier|E]来取代常规[character_modifier|E]。如果你拥有[GetTrait('lazy').GetName( GetNullCharacter )]特质，你将获得[stress_gain_i|E][stress|E]。"
