 RICE_send_qinghaicong_horses:0 "赠送青海骢马"
 RICE_send_qinghaicong_horses_desc:1 "送出一匹[qinghaicong_horses|E]作为礼物"
 game_concept_qinghaicong_horse:0 "青海骢马"
 game_concept_qinghaicong_horses:0 "青海骢马"
 game_concept_qinghaicong_horses_desc:0 "著名的$game_concept_qinghaicong_horses$起源于青海湖附近的田地，由吐谷浑人饲养，在游戏中以几种不同的方式体现。\n\n首先，伏俟和赛乾的[counties|E]得到了正面的[county_modifiers|E]。伏俟或赛乾的任何[rulers|E]也会得到相应的正面的[character_modifiers|E]。\n\n此外，伏俟或赛乾的任何[rulers|E]都可以获得一种特殊的[character_interaction|E]，称为 “青海骢礼物”。它类似于[send_gift|E]互动，但也会给你一点[prestige|E]和[dynasty_prestige|E]。但是它也会给目标一个[character_modifier|E]，让他们获得各种军事奖励，所以这个互动应该谨慎使用。\n\n最后，这些[rulers|E]（或那些拥有$tradition_RICE_xianbei_scions_name$[tradition|E]传统的[culture|E]）可以使用[GetTravelOption('RICE_tuyuhun_qinghaicong_horses_option').GetName][travel_option|E]"
 RICE_tuyuhun_qinghai_silk_road:0 "重建丝绸之路青海走道"
 RICE_tuyuhun_qinghai_silk_road_desc:0 "随着吐谷浑在这一地区的再次崛起，丝绸之路的青海走道再次繁荣起来。"
 RICE_tuyuhun_qinghaicong_horses:0 "青海骢马群"
 RICE_tuyuhun_qinghaicong_horses_desc:0 "几个世纪以来，来自青海湖地区的青海骢马以其速度和耐力闻名于整个亚洲。"
 RICE_tuyuhun_qinghaicong_horses_expanded:0 "欣欣向荣的青海骢马群"
 RICE_tuyuhun_qinghaicong_horses_expanded_desc:0 "几个世纪以来，来自青海湖地区的青海骢马以其速度和耐力闻名于整个亚洲。由于吐谷浑领主的资源投入，这些马群比以往任何时候都要繁荣昌盛。"
 RICE_tuyuhun_character_owns_qinghaicong_horses:0 "青海骢马群"
 RICE_tuyuhun_character_owns_qinghaicong_horses_desc:0 "这位统治者拥有青海湖周围的领土，那里培育着几个世纪以来著名的青海骢马。"
 RICE_tuyuhun_character_gifted_qinghaicong_horses:0 "近期已赠送过青海骢马"
 RICE_tuyuhun_recently_went_to_nadun_festival:0 "近期已参加过纳顿节"
 RICE_tuyuhun_opinion_qinghaicong_horses:0 "赠送过我青海骢马"
 RICE_tuyuhun_skilled_translators:0 "娴熟的吐谷浑译者"
 RICE_tuyuhun_skilled_translators_desc:0 "该角色有许多吐谷浑血统的译者为其工作，这些译者为自己赢得了一些名声。因为他们在历史上主导着丝绸之路的青海走道，不同的民族和文化在此自由交融，吐谷浑人则以卓越的译者而闻名于世。"
 RICE_tuyuhun_translator_school:0 "吐谷浑翻译学院"
 RICE_tuyuhun_translator_school_desc:0 "一批吐谷浑血统的译者在此定居，指导下一代译者。由于古老的吐谷浑王国位于多元丝绸之路的青海部分，多年来，吐谷浑译者以其无与伦比的语言能力而闻名，并经常被该地区的许多外国宫廷聘用。"
 RICE_tuyuhun_brick_carvings:0 "吐谷浑砖雕"
 RICE_tuyuhun_brick_carvings_desc:0 "该角色物的住所最近被翻修过，里面的砖雕是按照吐谷浑人的传统风格雕刻的。这些雕刻描绘了许多生物，从强大的龙和凤凰到像鱼和鸟这样卑微的动物，以及鲜花。"
 RICE_tuyuhun_restore_tuyuhun_kingdom:0 "重建吐谷浑王国"
 RICE_tuyuhun_restore_tuyuhun_kingdom_tooltip:0 "你将在青海地区重建吐谷浑王国。"
 RICE_tuyuhun_restore_tuyuhun_kingdom_desc:0 "吐谷浑王国曾经称霸青海地区，现在正是我让它死灰复燃的机会！"
 RICE_tuyuhun_restore_tuyuhun_kingdom_effect_tooltip_1:0 "你获得吐谷浑[kingdom|E]头衔"
 RICE_tuyuhun_restore_tuyuhun_kingdom_effect_tooltip_2:0 "一些在此地区的[duchy|E]头衔将会成为吐谷浑[kingdom|E]的[de_jure|E]一部分"
 RICE_tuyuhun_restore_tuyuhun_kingdom_confirm:0 "吐谷浑将再次崛起！"
 RICE_tuyuhun_restore_tuyuhun_kingdom_context_tooltip:0 "#emphasis 历史背景：#!吐谷浑王国最早是在公元3世纪末由鲜卑人的一位名为吐谷浑的王子所建立。它控制着青海地区丝绸之路的要道，以饲养[qinghaicong_horses|E]而闻名，但在公元7世纪被吐蕃所征服。"
 RICE_tuyuhun_attend_nadun_festival:0 "参加纳顿节"
 RICE_tuyuhun_attend_nadun_festival_tooltip:0 "你将参加本地举办的纳顿节。"
 RICE_tuyuhun_attend_nadun_festival_desc:0 "每年，吐谷浑人都会用纳顿节来庆祝丰收。我应该参加当地村庄的一个这样的节日。"
 RICE_tuyuhun_attend_nadun_festival_effect_tooltip:0 "你参加了纳顿节"
 RICE_tuyuhun_attend_nadun_festival_confirm:0 "我等不及了！"
 RICE_tuyuhun_attend_nadun_festival_context_tooltip:0 "#emphasis 历史背景：#!纳顿节是土族的传统丰收节，他们被认为是吐谷浑的后裔（如果不是全部的话，也是部分后裔）。它与蒙古那达慕节有关，但在许多方面有所不同。"
 RICE_decision_tuyuhun_nadun_month_requirement:0 "月份必须在7月至10月之间"
 tuyuhun.0000.t:0 "xxxxx"
