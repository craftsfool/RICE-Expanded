 RICE_tuyuhun_legend_new_title_name: "三兴吐谷浑"
 RICE_tuyuhun_legend_new_title_desc: "昔吐谷浑分崩，社稷沦丧。而[founder.GetTitledFirstName]诞资圣武，恢复鸿基。"
 RICE_tuyuhun_legend_chapter_opening_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]未生之际，世人皆惧[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetNameNoTooltip]，而今沦为唐蕃角力之地，以致宗庙不血食，国统濒绝。"
 RICE_tuyuhun_legend_chapter_motivation_new_title: "其慕[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetNameNoTooltip]之遗风，志存高远，欲振[ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip]之祚。"
 RICE_tuyuhun_legend_chapter_famous_deed_new_title: "经连年纵横之道，[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]竟集[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]之后裔于麾下。"
 RICE_tuyuhun_legend_chapter_extra_deed_new_title: "凡[ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip]之子民，无论其分歧若何，皆铭昔之荣光，故诚喜迎国以归。"
