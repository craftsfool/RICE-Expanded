 RICE_tuyuhun_qinghaicong_horses_option_desc:0 "这些天马举世无双，乘骑一匹天马去旅行能让你及时而从容不迫的到达目的地。"
 RICE_tuyuhun_qinghaicong_horses_option_effect_1:0 "每次你进入一个[barony|E]，都有#V [GetPlayer.MakeScope.ScriptValue('RICE_tuyuhun_qinghaicong_option_bonus_chance')]%#!的概率基于你的[diplomacy|E]和[prowess|E]获得#V 1#![prestige_i|E]到#V [EmptyScope.ScriptValue('RICE_tuyuhun_qinghaicong_option_max_value')|0]#![prestige_i|E]之间的威望"
