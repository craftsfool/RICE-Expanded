 upper_egypt.0010.t:0 "阿拉伯之路"
 upper_egypt.0010.desc:0 "阿拉伯之路是一条重要的贸易路线，延伸到我统治的领土。一路上有很多小堡垒和前哨，我决定投入一些资源来加强沿路的这些设施，这样商队和旅行者就可以在这条沙漠的路线上行走，而不必担心土匪。毕竟，我有责任确保这条路安全可靠。"
 upper_egypt.0010.a:0 "这会加强我们的贸易！"
 upper_egypt.0011.t:0 "一个全新的卢克索"
 upper_egypt.0011.desc:0 "任何访问卢克索的人都不能否认卢克索神庙的美丽和壮观，它在[qus_county.GetNameNoTier]已经矗立了几个世纪。尽管这个地方是一个完美的[ROOT.Char.GetFaith.HouseOfWorship]，但[ROOT.Char.GetFaith.GetReligion.GetAdjective]信仰的信徒并不在这里做礼拜，或者至少他们已经很久没有做礼拜了。\n\n但今天发生了变化。\n\n我带来了一些[ROOT.Char.Custom('DefaultPriestTitlePlural')]来重新奉献这个古老的圣地，所以它现在可以作为一个合适的[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]为团体服务。很快，[ROOT.Char.GetFaith.GetReligion.GetAdjective]的祈祷声将再次响彻其大厅!"
 upper_egypt.0011.a:0 "很好，很好"
 upper_egypt.0012.t:0 "前领主"
 upper_egypt.0012.desc:0 "我为[GetTitleByKey('k_egypt').GetNameNoTier]操心多年，现在一切都结束了。我身为[Glossary( '苏塔', 'SHURTA_GLOSS' )]。我平息了叛乱，维护道德与社会秩序，严格执行新变革与禁令。只因那些罪人和异教徒对此厌恶与抗议，所以我被免职了。\n\n当我被哈里发政府任命为[GetTitleByKey('k_egypt').GetNameNoTierNoTooltip]的总督时，我获得了第二次发展事业的机会。可惜好景不长，因为我被一个奴隶士兵如今的暴发户[ibn_tulun.GetFirstName]取代了。\n\n然而这可能是我开始新生活的契机……若我有此意的话。不过，我应该离开[GetTitleByKey('c_cairo').GetNameNoTier]——毕竟我在这里不那么受欢迎。"
 upper_egypt.0012.a:0 "去红海港口！"
 upper_egypt.0013.t:0 "黎凡特"
 upper_egypt.0013.desc:0 "我已抵达[GetTitleByKey('b_acre').GetNameNoTier]港口。这座城市停泊着哈里发的舰只，商人与朝圣者在这里来来往往。\n\n抵达此处后，我听闻哈里发国腹地近来政局动荡，战争和动荡在这里也造成了影响。这可能是一个担任行政官或军事指挥官的新机遇，但也存在风险。\n\n无论如何，我想暂时在[GetTitleByKey('b_acre').GetNameNoTierNoTooltip]休整片刻，再决定下一步行动。"
 upper_egypt.0013.a:0 "我该在这儿找点事情做……"
 upper_egypt.0014.t:0 "红海"
 upper_egypt.0014.desc:0 "历经艰辛穿越东部沙漠后，我终于抵达红海沿岸的[GetTitleByKey('b_qusayr').GetNameNoTier]。\n\n到达后，我便听闻这片[GetReligionByKey('islam_religion').GetName]边疆的现状。当地人谈论着途经此处的异教暴徒与嗜血军阀，但也提及虔诚且勇敢的商人与朝圣者。或许我该前往[GetTitleByKey('b_makka').GetNameNoTier]朝觐，又或者看看是否有机遇\n\n无论如何，在决定下一步行动前，我想最好先在[GetTitleByKey('b_qusayr').GetNameNoTierNoTooltip]稍作休整。"
