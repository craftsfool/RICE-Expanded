 upper_egypt.0060.t:0 "河马袭击"
 upper_egypt.0060.desc:0 "河马在[GetGeographicalRegion('RICE_nile_river_valley').GetName]上下都可以找到。虽然近年来它们的数量一直在减少，但人们仍然经常遇到它们，而且这些野兽往往很凶猛，具有攻击性。他们说远离这些河马是明智的。\n\n唉，最近有一只这样的河马在[county.GetNameNoTier]横冲直撞。它杀死了大量的人，最后被当地一些勇敢的猎人和警卫制服了。"
 upper_egypt.0060.a:0 "我明白了……真是不幸的消息。"
 upper_egypt.0060.b:0 "让我们为遇难者家属捐款。"
 upper_egypt.0061.t:0 "尼罗河沿岸的巡查"
 upper_egypt.0061.desc:0 "今天我正在沿[GetGeographicalRegion('RICE_nile_river_valley').GetName]对我的一些领土进行巡查。具体来说，我是要去看看一些城市的郊村。毕竟几个世纪以来农业一直是尼罗河沿岸生活的主要部分，已经有几千年的历史，所以我必须确保这些农场能够生产足够的食物供应。\n\n总之，我花了几个小时与农民和当地官员讨论当地灌溉网络的情况。我们需要确保这些网络始终处于良好状态，以便我们可以充分地利用每年的尼罗河泛滥。"
 upper_egypt.0061.a:0 "这是一项繁琐但必要的工作。"
 upper_egypt.0062.t:0 "基尔"
 upper_egypt.0062.desc:0 "最近在[county.GetNameNoTier]，一些游牧民搬进基尔。基尔沿尼罗河的地区，不适合农业，因为存在大量的杂草，而且缺乏当地村民的维护，无法将这种领土变成可耕地。\n\n也就是说，这些村民不使用这些土地并不意味着他们会高兴地欢迎任何人来做他们的邻居。村民和牧民之间的关系越来越紧张，我需要巧妙地处理这种情况。"
 upper_egypt.0062.a:0 "让双方自己解决吧，这与我无关。"
 upper_egypt.0062.b:0 "只要牧民不造成麻烦，我就会欢迎他们。"
 upper_egypt.0062.c:0 "如果村民愿意，他们有权将游牧民赶走。"
 upper_egypt.0062.d:0 "我会帮助双方达成一些协议。"
 upper_egypt.0063.t:0 "尼罗河的馈赠"
 upper_egypt.0063.desc:0 "我正在听一位[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitle')]的布道，他来自我的领土[GetGeographicalRegion('RICE_nile_river_valley').GetName]。\n\n在布道中，[ROOT.Char.Custom('DefaultPriestTitle')]谈到了[ROOT.Char.GetFaith.HighGodName]如何眷顾我们，这就解释了尼罗河泛滥发生的原因，以及正是由于[ROOT.Char.GetFaith.HighGodName]的恩典，我们才能享受埃及的丰饶。当我们尊敬[ROOT.Char.GetFaith.HighGodName]并遵循[ROOT.Char.GetFaith.GetAdjective]的宗教时，尼罗河泛滥会变好，当我们让[ROOT.Char.GetFaith.HighGodName]失望并犯下罪行时，我们会得到贫瘠的泛滥，祂借此提醒我们要谦虚并避免犯罪。因此如果没有[ROOT.Char.GetFaith.HighGodName]，我们在尼罗河畔就没有庄稼可以收获。"
 upper_egypt.0063.a:0 "确实如此，我们的丰收要感谢[ROOT.Char.GetFaith.HighGodName]。"
 upper_egypt.0063.b:0 "你说得对，但是丰收也要归功于每个人的辛勤工作。"
 upper_egypt.0064.t:0 "尼罗河边的祈祷"
 upper_egypt.0064.desc:0 "我在[county.GetNameNoTier]旅行，沿着[GetGeographicalRegion('RICE_nile_river_valley').GetName]，我遇到几个[ROOT.Char.Custom('DefaultPriestTitlePlural')]面对尼罗河祈祷。当我问他们在做什么时，他们解释说他们在向[ROOT.Char.GetFaith.HighGodName]祈祷，以确保下次尼罗河泛滥时我们会有一个好水量。毕竟虽然尼罗河的泛滥是可以预测的，但其泛滥的结果无法预测。"
 upper_egypt.0064.a:0 "我得走了，但我祝愿你一切顺利。"
 upper_egypt.0064.b:0 "也许我可以和你一起祈祷？"
 upper_egypt.0065.t:0 "尼罗河水位计记录"
 upper_egypt.0065.desc:0 "最近，一些学者根据在[GetGeographicalRegion('RICE_nile_river_valley').GetName]各地发现的尼罗河水位计整理出了尼罗河泛滥的历史数据。也许我应该抽出些时间研究研究这些资料，好更好地管理我在尼罗河沿岸的领土。"
 upper_egypt.0065.a:0 "享受尼罗河的赠礼，怎敢不重视之！"
 upper_egypt.0065.b:0 "我多忙了！还是让顾问忙这事吧。"
 upper_egypt.0066.t:0 "重新利用神殿"
 upper_egypt.0066.desc:0 "在[GetGeographicalRegion('RICE_nile_river_valley').GetName]沿线，古老的纪念碑和古埃及建造的宏伟建筑是常见的景象。有的规模很大，甚至在被长期遗弃后还可以重新用于各种用途。\n\n无论如何，据[county.GetNameNoTier]的一位地方官员说，那里的村民对使用这样的建筑表现出兴趣，这似乎是某种古老的寺庙群。这些村民打算在这个寺庙里建造房屋、商店和其他必要的建筑，以扩大他们的村庄。他们的想法是，利用古老寺庙的墙壁，而不是在其他地方随意建造，因为这些墙壁坚固、结实，已经持续了好几代。\n\n然而，虽然该村位于一个战略位置，但它并不是富有的聚居地，它需要一些援助才能实现这一目标。"
 upper_egypt.0066.a:0 " 我可以在财政上给予一些帮助。"
 upper_egypt.0066.b:0 "我现在不能帮助他们，但我祝他们好运。"
 upper_egypt.0067.t:0 "埃及蚕豆餐 "
 upper_egypt.0067.desc:0 "在前往[GetGeographicalRegion('RICE_nile_river_valley').GetName]沿线的一个小镇时，我正在享受一道[Glossary( '埃及焖蚕豆', 'FUL_MEDAMES_GLOSS' )]。这是一道由蚕豆与橄榄油还有各种香料混合而成的丰盛炖菜，已经风靡很久了。"
 upper_egypt.0067.a:0 "真是美味！"
