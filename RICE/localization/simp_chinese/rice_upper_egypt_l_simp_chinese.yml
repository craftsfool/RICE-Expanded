 RICE_upper_egypt_reintroduce_faith_luxor_temple_desc:0 "在上埃及，信仰[ROOT.Char.GetFaith.GetReligion.GetAdjective]的人数在增加。奇怪的是，卢克索寺目前没有被我们的[ROOT.Char.Custom('DefaultPriestTitlePlural')]用于宗教仪式。我们应该搬进去重新装修一下，让它成为一个合适的[ROOT.Char.GetFaith.GetReligion.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]。"
 RICE_upper_egypt_reintroduce_faith_luxor_temple_effect_tooltip:0 "采取这个[decision|E]将允许你利用[qus_county.GetNameNoTier]中的[special_building|E]，它目前被禁用，因为你追随的是不相容的[faith|E]。"
 RICE_upper_egypt_reintroduce_faith_luxor_temple_confirm:0 "让我们照顾好这个！"
 RICE_upper_egypt_reintroduce_faith_luxor_temple_context_tooltip:0 "#emphasis 历史背景：#!卢克索神庙最初建于公元前1400年左右，是埃及地区主要的神庙之一，与卡纳克神庙相邻。几个世纪以来，它被不同信仰的人们使用和改造；有一段时间，神庙下面甚至形成了一个类似村落的聚居地。目前，神庙的一个角落里建有一座清真寺。"
 RICE_upper_egypt_luxor_recently_changed_req:0 "在过去的 20 年里，卢克索最近没有皈依于另一种信仰"
