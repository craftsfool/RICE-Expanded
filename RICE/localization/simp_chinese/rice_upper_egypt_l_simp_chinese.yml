 activity_RICE_upper_egypt_pray_good_nile_flood_conclusion_desc:0 "我们经历了一场[GetActivityType( 'activity_RICE_upper_egypt_pray_good_nile_flood' ).GetName]。让我们希望[GetPlayer.GetFaith.HighGodName]能听到我们的祈祷！"
 RICE_upper_egypt_pray_good_nile_flood_amount_type:0 "仪式规模"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_small:0 "小型"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_small_desc:0 "$EFFECT_LIST_BULLET$举行仪式，为好的[nile_flood|E]祈祷，为坏的[nile_flood|E]忏悔。\n$EFFECT_LIST_BULLET$获得较少的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$在沿着[GetGeographicalRegion('RICE_nile_river_valley').GetName]的所有[counties|E]中，获得获得[GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip][county_modifier|E]的概率更低。\n\n#weak 恳切的忏悔就足够了，[GetPlayer.GetFaith.HighGodName]会听从我们的祈祷。#!"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_medium:0 "中型"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_medium_desc:0 "$EFFECT_LIST_BULLET$举行仪式，为好的[nile_flood|E]祈祷，为坏的[nile_flood|E]忏悔。\n$EFFECT_LIST_BULLET$获得适量的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$在沿着[GetGeographicalRegion('RICE_nile_river_valley').GetName]的所有[counties|E]中，提高获得获得[GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip][county_modifier|E]的概率。\n\n#weak 当洪水泛滥时，我们必须尽力忏悔，并向[GetPlayer.GetFaith.HighGodName]祈祷，以拯救我们。我们不能只做最基本的事情#!"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_large:0 "大型"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_large_desc:0 "$EFFECT_LIST_BULLET$举行仪式，为好的[nile_flood|E]祈祷，为坏的[nile_flood|E]忏悔。\n$EFFECT_LIST_BULLET$获得适量的[piety_i|E][piety|E]和[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$在沿着[GetGeographicalRegion('RICE_nile_river_valley').GetName]的所有[counties|E]中，大幅提高获得获得[GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip][county_modifier|E]的概率。\n\n#weak 我们的罪孽导致了尼罗河的现状。我们必须不遗余力地向[GetPlayer.GetFaith.HighGodName]证明，我们真正地、真诚地、深切地希望忏悔。#!"
