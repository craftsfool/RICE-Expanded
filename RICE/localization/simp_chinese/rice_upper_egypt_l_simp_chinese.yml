 RICE_upper_egypt_close_temple_of_kalabsha_desc:0 "位于[temples_of_aswan_city|E]的卡拉布萨神庙，多年来一直是异教崇拜的中心，但它的神庙已经很少用于这一目的了。现在是我们正式关闭它的时候了，并赶走为数不多的虔诚者。"
 RICE_upper_egypt_close_temple_of_kalabsha_effect_tooltip:0 "当异教徒前往[GetActivityType( 'activity_RICE_upper_egypt_visit_aswan_temples' ).GetName]时，卡拉布萨将不再可选。如果所有潜在神庙地点都被关闭，那么该[activity|E]将不再可用。"
 RICE_upper_egypt_close_temple_of_kalabsha_confirm:0 "现在是我们这样做的时候了。"
 RICE_upper_egypt_close_temple_of_kalabsha_context_tooltip:0 "$RICE_upper_egypt_temple_of_kalabsha_context_tooltip$"
 RICE_upper_egypt_reopen_temple_of_kalabsha:0 "正式重新开放卡拉布萨神庙"
 RICE_upper_egypt_reopen_temple_of_kalabsha_tooltip:0 "这座寺庙该有多古老的历史啊！"
 RICE_upper_egypt_reopen_temple_of_kalabsha_desc:0 "卡拉布萨神庙，[temples_of_aswan_city|E]曾经是一个异教崇拜的中心。然而，它的主庙现在被遗弃了。我们应该整修这个地方，为其配备人员，[ROOT.Char.Custom('DefaultPriestTitlePlural')]并重新开放神庙，以便所有人可以再次在里面敬畏神明。"
 RICE_upper_egypt_reopen_temple_of_kalabsha_effect_tooltip:0 "当异教徒采取[GetActivityType( 'activity_RICE_upper_egypt_visit_aswan_temples' ).GetName]时，卡拉布萨神庙现在是祈祷地点的选项之一。因为之前[aswan_county.GetNameNoTier]附近的主要寺庙都关闭了，所以[activity|E]无法使用，但是现在可以使用。"
 RICE_upper_egypt_reopen_temple_of_kalabsha_confirm:0 "让我们开始行动吧！"
