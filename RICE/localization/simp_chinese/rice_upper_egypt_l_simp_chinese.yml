 upper_egypt.0021.t:0 "尼罗河水位计"
 upper_egypt.0021.desc:0 "自法老时代以来，几个世纪以来，尼罗河水位计一直是[GetGeographicalRegion('RICE_nile_river_valley').GetName]社会的一个重要组成部分。这些仪器帮助我们测量尼罗河泛滥的高度，而这种知识可能意味着繁荣与混乱之间的区别。因此，我已下令在我统治的领土上翻新和修复几个尼罗河水位计，以便它们能够保持可靠和准确。其他的也可以根据需要进行建造。"
 upper_egypt.0021.a:0 "我希望这将在未来几年为我们带来收益。"
 upper_egypt.0022.t:0 "典礼"
 upper_egypt.0022.desc:0 "每年，尼罗河都会发洪水；自古以来生活在埃及的每个人的生命都取决于此\n\n值得庆幸的是，今年尼罗河的泛滥情况良好，尼罗河上下的农民可望在最坏的情况下获得足够的收成。很快，我们就可以开始开放埃及各地的各种运河，通过灌溉沟渠和水路将水输送到即将肥沃的农田。按照传统[ROOT.Char.GetCulture.GetName]官员会在一个正式的仪式上打开这些运河。\n\n准备工作已经在进行中"
 upper_egypt.0022.a:0 "让我们庆祝今年美好的尼罗河泛滥！"
 upper_egypt.0023.t:0 "尼罗河运河开通"
 upper_egypt.0023.desc:0 "今天是尼罗河大水过后，尼罗河运河正式开闸仪式的日子。\n\n我骑在一匹上等的骏马上，前往运河口的大坝，由官员、廷臣、士兵、贵族、[ROOT.Char.Custom('DefaultPriestTitlePlural')]和其他权贵组成的队伍跟在我后面。我们沿着尼罗河的行走，各行各业的人都挤在一起观察这个过程。\n\n在[ROOT.Char.Custom('DefaultPriestTitlePlural')]说他们的祈祷和其他仪式完成后，我得到了一根长矛，我把它扔进了大坝。一群人随后砍掉大坝上的门阀，让水淹没运河。第一艘装满聋哑人的船很快被送下运河（当然按照传统，他们以后受到我的施舍）。\n\n仪式结束后，人群中爆发出巨大的欢呼声，庆祝活动开始。"
 upper_egypt.0023.a:0 "现在，我们只需等待几个月就可以开始种植了。"
 upper_egypt.0024.t:0 "忏悔吧，忏悔吧！"
 upper_egypt.0024.desc:0 "每年，尼罗河都会发泛滥，生活在埃及的每个人的生命都取决于此。自古以来都是如此。\n\n然而有些年份却没有很好的泛滥。令所有人惊恐的是，今年就是这样一个年份。对于像我这样的[ROOT.Char.GetCulture.GetName][ROOT.Char.GetFaith.GetAdherentNamePlural]来说，像这样可怜的泛滥通常被解释为[ROOT.Char.GetFaith.PantheonTerm]对我们罪恶的惩罚。\n\n因此，为了缓解我的王国里的每个人的恐慌和沮丧，我决定组织一个盛大的祈祷仪式，并向[ROOT.Char.GetFaith.PantheonTerm]献上祭品和祈求，以请求宽恕和怜悯。希望[ROOT.Char.GetFaith.HighGodName]能听到我们真诚的忏悔，而我们在未来的日子里给予一个好泛滥。"
 upper_egypt.0024.a:0 "我们必#italic 表明#!忏悔！"
 upper_egypt.0024.tooltip:0 "你花的[gold|E]越多，仪式就越隆重，忏悔也就越容易被认为是真的。然而请注意，你的[virtues|E]、[sins|E]、[traits|E]和[piety_level|E]也会影响忏悔仪式。"
 upper_egypt.0025.t:0 "尼罗河边的忏悔"
 upper_egypt.0025.desc:0 "我和其他许多人花了几天时间组织我们在尼罗河畔的忏悔和祈祷的仪式，今天我们的计划实现了。\n\n社会各阶层，无论贫富贵贱都聚集在约定的地点。我在那里，旁边是[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.Custom('DefaultPriestTitlePlural')]，他们带领众人进行似乎无止境的轮番祈祷。\n\n随着时间的推移，我们甚至沿着尼罗河来回走动，因为呼喊和诵读的声音越来越大了。我们的声音组合成一首忏悔和祷告的交响乐，请求[ROOT.Char.GetFaith.HighGodName]听到我们的恳求，守护我们的美德和圣洁，以便未来的尼罗河泛滥可以更好。"
 upper_egypt.0025.a:0 "[ROOT.Char.GetFaith.HighGodName]会承认我们的悔改吗？"
