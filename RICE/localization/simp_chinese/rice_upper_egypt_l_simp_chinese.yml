 RICE_upper_egypt_reopen_temple_of_elephantine_desc:0 "象岛，[temples_of_aswan_city|E]曾经是一个异教崇拜的中心。然而，它的主庙现在被遗弃了。我们应该整修这个地方，为其配备[ROOT.Char.Custom('DefaultPriestTitlePlural')]，并重新开放神庙，以便所有人可以再次在里面敬畏神明。"
