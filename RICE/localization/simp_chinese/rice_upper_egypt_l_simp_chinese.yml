 upper_egypt.0001.t:0 "处于十字路口的埃及"
 upper_egypt.0001.desc:0 "[ibn_tulun.GetTitledFirstName]最近以[GetTitleByKey('d_sunni').GetHolder.GetTitledFirstName]的名义被任命为总督管理尼罗河的土地。不过[CharYouSheHe(ibn_tulun)|U]动起野心，开始集中[ibn_tulun.GetPrimaryTitle.GetNameNoTier]的权力，然而事情一开始就很不顺利。在西部，哈里发阿里之叛的残部[CharYouFirstName(al_tabataba)]和[CharYouFirstName(al_sufi)]继续威胁着和平与稳定。[ibn_tulun.GetHouse.GetName][ibn_tulun.GetGovernment.GetAdjective]手下确实有一些有能力的官员，如[CharYouFirstName(al_kan)]、[CharYouFirstName(al_madharai)]、[CharYouFirstName(al_farghani)]以及[CharMyHerHis(ibn_tulun)]的长子[ibn_tulun_son.GetFirstName]，不过有传言说后两者都有自己的残酷野心。\n\n然而[ibn_tulun.GetFirstNamePossessiveNoTooltip]主要问题是几个在埃及履历多年的老官僚们，两者之间的矛盾很大。很难说是否有误解，还是由于野心，其中最突出的是埃及的非官方情报官员[shukayr.GetFullName]；以及行政官[al_mudabbir.GetFullName]，他以[CharYourFirstNames(al_mudabbir)]诗歌和与过去[al_mudabbir.GetFaith.ReligiousHeadName]的[friendship|E]而闻名，但[Select_CString( al_mudabbir.IsLocalPlayer, '我的', '他的')]暴政及[tax|El]政策而受到民众厌恶。目前双方都在[ibn_tulun.GetFaith.ReligiousHeadTitleName|U]的宫廷里玩弄阴谋，但是#italic 有些事情#!发生只是时间问题。、"
 upper_egypt.0001.a:0 "命运对尼罗河的土地有什么安排？"
 upper_egypt.0001.tooltip.ibn_tulun:0 "#emphasis 历史背景：#!伊本·突伦，原本出身突厥奴隶兵，却在任职埃及总督的过程中，展现了卓越的治理才能。在埃及历经罗马和阿拉伯的多次征服之后，他建立了自托勒密王朝以来埃及第一个近乎独立的政权。\n\n伊本·突伦于公元884年驾崩，他所开创的突伦王朝仅存二十余年，于905年被阿拔斯王朝所灭。但他却是众多总督和军阀的先驱，为阿拔斯王朝中央集权的崩溃铺平了道路。"
 upper_egypt.0001.tooltip.al_tabataba:0 "#emphasis 历史背景：#!布哈·阿斯加尔·艾哈迈德·伊本·穆罕默德·伊本·塔巴塔是阿里派，即阿里·伊本·艾比·塔利卜的后裔，他于859年在巴尔卡附近发动了反抗阿拔斯王朝的起义。他自称哈里发，但最终被突伦王朝的军队击败，并于869年在埃及被处决。"
 upper_egypt.0001.tooltip.al_sufi:0 "#emphasis 历史背景：#!易布拉欣·伊本·穆罕默德·伊本·苏菲是阿里的后裔，也就是阿里派的一员。他在公元860年代在埃及掀起了数次反抗阿拔斯王朝的暴动，最终酿成了869年埃斯纳居民的惨案。\n\n他在被突伦王朝的军队击溃后，退守到了西部绿洲，后来又在872年图谋攻打东部沙漠的军阀欧麦尔。他再次战败后，沿途劫掠了阿斯旺，然后逃往麦加，却被擒获。伊本·突伦囚禁了他一段时间，最后才放他去麦地那。\n\n苏菲的一位追随者，阿布·鲁赫·苏昆，在873年至874年发起了一场起义。他坚持了一阵子，最终与伊本·突伦达成了休战。"
 upper_egypt.0001.tooltip.al_kan:0 "#emphasis 历史背景：#!阿布·贾法尔·穆罕默德·伊本·阿卜杜勒·坎是伊本·突伦手下的一名有颇有能力的官员，曾担任过他的宰相。他可能将创建了中世纪埃及的#italic 迪万#!（伊斯兰教国家政府管理机构的称谓，阿拉伯语音译，意为“名册”、“诗集”、“登记籍”。），并命名为#italic diwan al‑insha（书记部）#! ，负责处理与统治者的通信、请愿和法令有关的文书工作。他于公元891年去世。"
 upper_egypt.0001.tooltip.al_madharai:0 "#emphasis 历史背景：#!马达赖是埃及和叙利亚的一支显赫的官僚家族，他们在不同时期为突伦王朝、阿拔斯王朝和伊赫昔迪王朝效力。该家族最早出名的成员是阿布·贝克尔·艾哈迈德·伊本·易卜拉欣·马达赖，他于公元879年被伊本·突伦任命为财政总管。\n\n他去世后，他的儿子阿里和侯赛因分别继承了他在埃及和叙利亚的职务。阿里的儿子艾哈迈德和穆罕默德也在10世纪初期获得了高位。在他们晚年，该家族卷入了巴格达官场的阴谋，他们尤其加入了反对什叶派官员的班努·富拉特家族的派系。"
 upper_egypt.0001.tooltip.ibn_tulun_son:0 "#emphasis 历史背景：#!阿拔斯是突伦王朝创始人伊本·突伦的长子，是其父亲最初的继承人。伊本·突伦为了巩固在叙利亚的领土，于公元879年留下阿拔斯作为他在埃及的副手，然而阿拔斯被手下哄骗发动叛乱。\n\n阿拔斯最终于公元881年被伊本·突伦俘虏。在此之后，作为一种秘密的品格考验，伊本·突伦要求他的儿子挖出阴谋者的眼睛，砍掉他们的手，并期待他能拒绝。当阿拔斯毫不犹豫地照做时，伊本·突伦据说为他儿子的残忍和不可信而痛哭流涕，随后把他关进了监狱。伊本·突伦的另一个儿子和继承人胡玛拉韦赫于884年将阿拔斯处决。"
 upper_egypt.0001.tooltip.shukayr:0 "#emphasis 历史背景：#!舒卡尔·哈迪姆是伊本·突伦抵达埃及并开始担任总督时的邮政首脑。他作为阿拔斯邮政系统的首脑，负责处理与哈里发的通信，并在埃及扮演类似间谍首领的角色。\n\n伊本·突伦初到埃及时，舒卡尔和另一位令人厌恶的税务长官伊本·穆达比尔，向他献上了一万第纳尔的贿赂。他们的目的是想让伊本·突伦放任他们的权力，但伊本·突伦为了显示自己的威严而拒绝了这份贿赂。\n\n此后，伊本·突伦和这两位官员在阿拔斯法庭上展开了一场明争暗斗。最后，伊本·突伦在公元872年左右成功地将舒卡尔赶下了台，舒卡尔不久后便与世长辞。"
 upper_egypt.0001.tooltip.al_mudabbir:0 "#emphasis 历史背景：#!伊本·穆达比尔是阿拔斯哈里发国的高级行政官，可能出生于波斯。他和他的兄弟易卜拉欣都是杰出的文人，与几位哈里发有着友好的关系。在一场阴谋导致他们被对手监禁后，伊本·穆达比尔于公元861年被任命为埃及的首席税吏。他实施了一系列严酷的措施，其中许多被认为是违背古兰经的，以增加税收，但却招致了大部分人民的憎恨。\n\n伊本·突伦初到埃及时，伊本·穆达比尔和另一位官员舒卡尔向他献上了一万第纳尔的贿赂。他们的目的是想让伊本·突伦放任他们的权力，但伊本·突伦为了显示自己的威严而拒绝了这份贿赂。\n\n此后，伊本·突伦和这两位官员在阿拔斯法庭上展开了一场明争暗斗。最后，伊本·突伦在这场阴谋游戏中取得了胜利，于公元871年将伊本·穆达比尔囚禁；伊本·穆达比尔后来又被释放和多次监禁，最终于公元883年或884年死在狱中。伊本·穆达比尔的兄弟易卜拉欣则成功冲破监狱的围墙从而越狱成功，逃到了巴格达，在那里担任官吏，直到公元893年去世。"
 upper_egypt.0001.tooltip.al_farghani:0 "#emphasis 历史背景：#!穆罕默德·伊本·法拉杰·法尔干尼是突伦王朝的巴卡总督，他于公元874年或875年对伊本·突伦发动了叛乱。突伦王朝的军队对巴卡进行了艰苦的围攻，使用攻城器械成功地攻入了城市。尽管如此，伊本·突伦在后来镇压叛乱时表现出了极大的克制。"
