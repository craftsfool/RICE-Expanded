 upper_egypt.0056.desc.intro:0 "我现在在尼罗河第一瀑布的圣地，此地在昔日无论是平民还是法老都曾来过。"
 upper_egypt.0056.desc.one:0 "唉，不过是过眼云烟，现在这里只剩一座神庙开放了。"
 upper_egypt.0056.desc.multiple:0 "我能去祭拜的地方有不少，但我应该重点关注某处。"
 upper_egypt.0056.desc.philae:0 "\n\n#V 菲莱岛#!，位于第一瀑布周边，是伊希斯的主要崇拜中心，也是她的兄弟丈夫奥西里斯和他们的儿子荷鲁斯的主要崇拜中心，这三个人都是当地最重要的神祇。"
 upper_egypt.0056.desc.elephantine:0 "\n\n#V 象岛#!，位于第一瀑布的下游，长期以来一直被认为是尼罗河源头之神克努姆和他的妻子萨提特及其女儿阿努凯特的住所。"
 upper_egypt.0056.desc.kalabsha:0 "\n\n#V 卡拉布萨岛#!，位于第一瀑布的上游，是日月神曼杜利斯以及其他小神如伊姆霍特普和图图的一个重要崇拜中心。"
 upper_egypt.0056.b:0 "去象岛！"
 upper_egypt.0056.c:0 "去卡拉布萨！"
 upper_egypt.0056.d:0 "我们随便去哪个开着的神庙吧。"
