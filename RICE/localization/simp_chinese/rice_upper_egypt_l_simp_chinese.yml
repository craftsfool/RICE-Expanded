 RICE_upper_egypt_azjur_pilgrim:0 "埃及前总督"
 RICE_upper_egypt_azjur_pilgrim_desc:0 "该角色曾是埃及的总督，不过并不受欢迎，后面被艾哈迈德·伊本·突伦取代，此后其专注于精神追求。"
 RICE_upper_egypt_azjur_official:0 "$RICE_upper_egypt_azjur_pilgrim$"
 RICE_upper_egypt_azjur_official_desc:0 "该角色曾是埃及的总督，不过并不受欢迎，后面被艾哈迈德·伊本·突伦取代，此后其想用其他手段在政治上东山再起。"
 upper_egypt.0012.a.tooltip:0 "或许我该像其他虔诚的[GetReligionByKey('islam_religion').GetAdherentNamePlural]一样去朝觐"
 upper_egypt.0012.b:0 "前往黎凡特的港口"
 upper_egypt.0012.b.tooltip:0 "或许我可以回哈里发国腹地，看看那里有没有新机遇……"
 upper_egypt.0012.info:0 "\n#emphasis 历史背景：#!阿居尔·图尔基在艾哈迈德·伊本·图伦之前担任了一年埃及总督，不过历史上是868年才离任，但为了游戏性，因此突伦的统治提前至867年，但他一直是个严苛且不得人心的总督。关于图尔基之后去向，史料记载存在分歧：一说他前往麦加朝觐，另一说他回到哈里发身边并获得了另一个职位。"
 upper_egypt.0001.e:0 "我很高兴承认[ibn_tulun.GetFirstNameNoTooltip]担任总督。"
 upper_egypt.0001.f:0 "[ibn_tulun.GetFirstNameNoTooltip]总督？那可真是个蠢货！我可不会臣服！"
 RICE_upper_egypt_in_aswan_req:0 "你的[camp|E]位于[GetTitleByKey('b_aswan').GetNameNoTier]"
 nick_RICE_ibn_al_daya:1 "伊本·达亚"
 nick_RICE_ibn_al_daya_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]是一位显赫统治者或官员的乳母之子，因此以#italic 伊本·达亚#!著称。"
 nick_RICE_ibn_abd_kan:1 "伊本·阿卜杜·坎"
 nick_RICE_ibn_abd_kan_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]被称为#italic 伊本·阿卜杜·坎#!，意为“小仆人之子”，其中“阿卜杜”在阿拉伯语中意为仆人或奴隶，而“坎”是波斯语中的昵称后缀。"
 RICE_upper_egypt_every_nile_county_nilometers_desc:0 "你在[GetGeographicalRegion('RICE_nile_river_valley').GetName]中拥有的每个带有[GetModifier('RICE_nile_renovated_nilometers').GetNameWithTooltip][modifier|E]的[county|E]。"
