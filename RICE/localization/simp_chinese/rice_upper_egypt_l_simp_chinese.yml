 activity_RICE_upper_egypt_open_nile_canals_conclusion_desc:0 "我已经在正式的[GetActivityType( 'activity_RICE_upper_egypt_open_nile_canals' ).GetName]中完成了我的职责。愿尼罗河赐予我们今年的丰收！"
 RICE_upper_egypt_open_nile_canals_type_normal:0 "正常仪式"
 RICE_upper_egypt_open_nile_canals_type_normal_desc:0 "$EFFECT_LIST_BULLET$进行正常仪式，这是你的职责。\n$EFFECT_LIST_BULLET$获得[prestige_i|E][prestige|E]和[piety_i|E][piety|E]（但少于#bold 盛大仪式#!）\n\n#weak 自古以来，尼罗河每年都会泛滥，今年也不例外。#!"
 RICE_upper_egypt_open_nile_canals_type_grand:0 "盛大仪式"
 RICE_upper_egypt_open_nile_canals_type_grand_desc:0 "$EFFECT_LIST_BULLET$尼罗河运河开通准备一个盛大仪式。\n$EFFECT_LIST_BULLET$与#bold 正常仪式#!相比，额外多获得#V 50%#!的[prestige_i|E][prestige|E]和[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$获得少量的[dynasty_prestige_i|E][dynasty_prestige|E]\n\n#weak 今年的尼罗河泛滥如此之好，我们需要一个比平时更奢侈的庆祝活动！#!"
 RICE_upper_egypt_open_nile_canals_opening_phase:0 "开阀"
 RICE_upper_egypt_open_nile_canals_opening_phase_desc:0 "我们的繁荣只是因为伟大的尼罗河水。"
