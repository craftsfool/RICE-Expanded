 activity_upper_egypt_pray_good_nile_flood_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]尼罗河贫瘠泛滥后的忏悔"
 building_type_RICE_upper_egypt_temple_of_luxor_01:1 "卢克索神庙"
 building_type_RICE_upper_egypt_temple_of_luxor_01_desc:0 "埃及各地有许多伟大的纪念碑，而卢克索神庙作为古埃及辉煌工程遗产之一，已经矗立了几个世纪。\n\n卢克索神庙是法老们曾经拥有的权力的证明，因为它是一座专门用来张扬他们的王权的寺庙。虽然古老的法老早已不在人世，但他们建造的这座寺庙肯定会持续几个世纪，即使人们忘记了它最初的目的。"
 building_RICE_upper_egypt_temple_of_luxor_01:0 "卢克索神庙"
 building_RICE_upper_egypt_temple_of_luxor_01_desc:0 "$building_type_RICE_upper_egypt_temple_of_luxor_01_desc$"
 building_RICE_upper_egypt_temple_of_luxor_02:0 "卢克索神庙"
 building_RICE_upper_egypt_temple_of_luxor_02_desc:0 "许多伟大的纪念碑横亘在埃及各地，而卢克索神庙作为古埃及建筑史的辉煌一笔，它已经矗立了几个世纪。\n\n卢克索神庙是法老们的权力证明，但他们已经不在人世了；神庙的一部分已经被改造成教堂。此外虔诚的基督徒沿着神庙废墟定居，并建造各种建筑。"
 building_RICE_upper_egypt_temple_of_luxor_03:0 "卢克索清真寺"
 building_RICE_upper_egypt_temple_of_luxor_03_desc:0 "许多伟大的纪念碑横亘在埃及各地，而卢克索神庙作为古埃及建筑史的辉煌一笔，它已经矗立了几个世纪。\n\n卢克索神庙是法老们的权力证明，但他们已经不在人世了；基督教徒以前把神庙的一部分改成了教堂，穆斯林现在也这么做了，他们在里面建起了清真寺。此外虔诚的穆斯林沿着神庙废墟定居，并建造各种建筑。"
 RICE_nile_normal_flood:0 "[nile_flood|E]：正常"
 RICE_nile_normal_flood_desc:0 "尼罗河的水位涨到了十六肘尺，这是一个良好泛滥，意味着今年埃及风调雨顺。\n\n#italic 如果[cultures|E]里有#Bold $tradition_RICE_children_of_the_nile_name$#![tradition|E]则解锁[GetActivityType('activity_RICE_upper_egypt_open_nile_canals').GetName][activity|E]。#!"
 RICE_nile_high_flood:0 "[nile_flood|E]：高"
 RICE_nile_high_flood_desc:0 "尼罗河的水位涨到了十七个肘尺，这是一个良好泛滥，意味着今年埃及可能会丰收。\n\n#italic 如果[cultures|E]有#Bold $tradition_RICE_children_of_the_nile_name$#![tradition|E]则解锁[GetActivityType('activity_RICE_upper_egypt_open_nile_canals').GetName][activity|E]#!"
 RICE_nile_very_high_flood:0 "[nile_flood|E]：非常高"
 RICE_nile_very_high_flood_desc:0 "尼罗河的水位涨到了十八肘尺，这是一个良好泛滥，意味着今年埃及会大丰收。\n\n#italic 如果[cultures|E]有#Bold $tradition_RICE_children_of_the_nile_name$#![tradition|E]则解锁[GetActivityType('activity_RICE_upper_egypt_open_nile_canals').GetName][activity|E]#!"
 RICE_nile_overflooding_flood:0 "[nile_flood|E]：洪水"
 RICE_nile_overflooding_flood_desc:0 "尼罗河的水位涨到了十九肘尺甚至更多，这种危险的泛滥量很可能会淹没农业用地，毁掉埃及今年的收成。\n\n#italic 如果[cultures|E]有#Bold $tradition_RICE_children_of_the_nile_name$#![tradition|E]则解锁[GetActivityType('activity_RICE_upper_egypt_pray_good_nile_flood').GetName][activity|E]#!"
 RICE_nile_low_flood:0 "[nile_flood|E]：低"
 RICE_nile_low_flood_desc:0 "尼罗河水位只有十四或十五肘尺，这是低于平均水平的泛滥，意味着今年埃及的收成将将会下降。\n\n#italic 如果[cultures|E]有#Bold $tradition_RICE_children_of_the_nile_name$#![tradition|E]则解锁[GetActivityType('activity_RICE_upper_egypt_pray_good_nile_flood').GetName][activity|E]#!"
 RICE_nile_very_low_flood:0 "[nile_flood|E]：非常低"
 RICE_nile_very_low_flood_desc:0 "尼罗河的水位甚至没达到十四肘尺，这种令人震惊的低水位意味着今年埃及会颗粒无收！\n\n#italic 如果[cultures|E]有#Bold $tradition_RICE_children_of_the_nile_name$#![tradition|E]则解锁[GetActivityType('activity_RICE_upper_egypt_pray_good_nile_flood').GetName][activity|E]#!"
 RICE_nile_renovated_nilometers:0 "翻新后的尼罗河水位计"
 RICE_nile_renovated_nilometers_desc:0 "这个地区的几个观测站最近进行了修整，拥有可靠的水位计不过并不能防止尼罗河洪水的发生，但它们可以确保地方当局有时间准备并迅速做出反应，以尽量减少洪水造成恐慌和影响。\n\n#italic 如果这个[county_modifier|E]激活时，而[nile_flood|E]很差，那么[county|E]将获得[GetModifier('RICE_nile_mitigated_bad_flood').GetNameWithTooltip][county_modifier|E]来抵消此年的一些（无法完全消除）负面影响。#!"
 RICE_nile_mitigated_bad_flood:0 "减缓的糟糕[nile_flood|E]"
 RICE_nile_mitigated_bad_flood_desc:0 "虽然今年的尼罗河泛滥不如人意，但地区领主最近翻新和修复了当地尼罗河口岸，使其更加有效和可靠，因此官员们能够减轻泛滥造成的最坏影响，并在一定程度上减轻了平民的恐慌。"
 RICE_upper_egypt_recently_closed_philae:0 "菲莱正式关闭"
 RICE_upper_egypt_recently_closed_philae_desc:0 "靠近[temples_of_aswan_city|E]的菲莱神庙已经被废弃了一段时间，最近正式关闭。"
 RICE_upper_egypt_recently_closed_elephantine:0 "象岛正式关闭"
 RICE_upper_egypt_recently_closed_elephantine_desc:0 "靠近[temples_of_aswan_city|E]的象岛神庙已经被废弃了一段时间，最近被正式关闭。"
 RICE_upper_egypt_recently_closed_kalabsha:0 "卡拉布萨神庙正式关闭"
 RICE_upper_egypt_recently_closed_kalabsha_desc:0 "靠近[temples_of_aswan_city|E]的卡拉布萨神庙已经被废弃了一段时间，最近正式关闭。"
 RICE_upper_egypt_recently_reopened_philae:0 "菲莱重新开放"
 RICE_upper_egypt_recently_reopened_philae_desc:0 "靠近[temples_of_aswan_city|E]的菲莱神庙曾被废弃，最近刚刚正式重新开放。"
 RICE_upper_egypt_recently_reopened_elephantine:0 "象岛正式重新开放"
 RICE_upper_egypt_recently_reopened_elephantine_desc:0 "靠近[temples_of_aswan_city|E]的象岛神庙曾被废弃，最近刚刚正式重新开放。"
 RICE_upper_egypt_recently_reopened_kalabsha:0 "卡拉布萨神庙正式重新开放"
 RICE_upper_egypt_recently_reopened_kalabsha_desc:0 "靠近[temples_of_aswan_city|E]的卡拉布萨神庙被废弃，最近刚刚正式重新开放。"
 RICE_upper_egypt_worshipped_at_philae:0 "在菲莱祭拜"
 RICE_upper_egypt_worshipped_at_philae_desc:0 "该角色最近去了阿斯旺附近的菲莱神庙，向伊希斯和那里的其他几位神祇表示祭拜。"
 RICE_upper_egypt_worshipped_at_elephantine:0 "在象岛祭拜"
 RICE_upper_egypt_worshipped_at_elephantine_desc:0 "该角色最近去了阿斯旺附近的象岛神庙，向克努姆和那里的其他几位神祇祭拜。"
 RICE_upper_egypt_worshipped_at_kalabsha:0 "在卡拉布萨神庙祭拜"
 RICE_upper_egypt_worshipped_at_kalabsha_desc:0 "该角色最近去了阿斯旺附近的卡拉布萨神庙，向马努利斯和那里的其他几位神祇祭拜。"
 RICE_upper_egypt_philae_honored_isis:0 "在菲莱受到伊西斯的祝福"
 RICE_upper_egypt_philae_honored_isis_desc:0 "该角色最近去了阿斯旺附近的菲莱神庙，向伟大的母神伊西斯祭拜，据说他得到了女神的祝福。"
 RICE_upper_egypt_philae_honored_osiris:0 "在菲莱受到奥西里斯的祝福"
 RICE_upper_egypt_philae_honored_osiris_desc:0 "该角色最近去了阿斯旺附近的菲莱神庙，向轮回主宰奥西里斯祭拜，据说他得到了神的祝福。"
 RICE_upper_egypt_philae_honored_horus:0 "在菲莱受到荷鲁斯的祝福"
 RICE_upper_egypt_philae_honored_horus_desc:0 "该角色最近去了阿斯旺附近的菲莱神庙，向天空之神荷鲁斯祭拜，据说他得到了神的祝福。"
 RICE_upper_egypt_elephantine_honored_khnum:0 "在象岛受到克努姆的祝福"
 RICE_upper_egypt_elephantine_honored_khnum_desc:0 "该角色最近去了阿斯旺附近的象岛神庙，向创造之神克努姆祭拜，据说他得到了神的祝福。"
 RICE_upper_egypt_elephantine_honored_satet:0 "在象岛受到萨提特的祝福"
 RICE_upper_egypt_elephantine_honored_satet_desc:0 "该角色最近去了阿斯旺附近的象岛神庙，向医疗女神萨提特致敬，据说他得到了女神的祝福。"
 RICE_upper_egypt_elephantine_honored_anuket:0 "在象岛受到阿努凯特的祝福"
 RICE_upper_egypt_elephantine_honored_anuket_desc:0 "该角色最近去了阿斯旺附近的象岛神庙，向尼罗河女神阿努凯特致敬，据说他得到了女神的祝福。"
 RICE_upper_egypt_kalabsha_honored_mandulis:0 "在卡拉布萨神庙受到曼杜利斯的祝福"
 RICE_upper_egypt_kalabsha_honored_mandulis_desc:0 "该角色最近去了阿斯旺附近的卡拉布萨神庙，向塔尔米斯的全知之主曼杜利斯致敬，据说他得到了神的祝福。"
 RICE_upper_egypt_kalabsha_honored_imhotep:0 "在卡拉布萨神庙受到伊姆霍特普的祝福"
 RICE_upper_egypt_kalabsha_honored_imhotep_desc:0 "该角色最近去了阿斯旺附近的卡拉布沙神庙，向不朽的建筑大师和内科医生伊姆霍特普祷告，据说他得到了神的祝福。"
 RICE_upper_egypt_kalabsha_honored_tutu:0 "在卡拉布萨神庙受到图图的祝福"
 RICE_upper_egypt_kalabsha_honored_tutu_desc:0 "该角色最近去了阿斯旺附近的卡拉布萨神庙，向恶魔之主图图祷告，据说得到了神的祝福。"
 RICE_upper_egypt_reinforced_darb_al_arbain:0 "加强阿拉伯之路哨所"
 RICE_upper_egypt_reinforced_darb_al_arbain_desc:0 "阿拉伯之路，或称四十天路，是一条横跨尼罗河以西沙漠的商队路线，从埃及一直延伸到达尔富尔。地方领袖最近努力确保这条路线的重要部分和其分路线上的前哨处于良好状态，以便他们能够保护并为经过这里的商队提供庇护。"
 RICE_nile_flood_repentance:0 "为尼罗河贫瘠泛滥而进行忏悔"
 RICE_nile_flood_repentance_desc:0 "在今年尼罗河泛滥不佳的情况下，领主和神职人员组织了几次大型祈祷活动，因为许多人认为尼罗河的贫瘠泛滥是人们的罪孽所致。至少在这个伯爵领通过这些公开的祈祷活动展示防止了恐慌失控。"
 RICE_nile_opened_canal_normal:0 "开通的尼罗河运河（正常泛滥）。"
 RICE_nile_opened_canal_normal_desc:0 "该角色最近在一个盛大的仪式上庆祝尼罗河运河的正式开通，因为最近有一场不错的尼罗河泛滥。"
 RICE_nile_opened_canal_high:0 "开通的尼罗河运河（高水位泛滥）。"
 RICE_nile_opened_canal_high_desc:0 "该角色最近在一个盛大的仪式上庆祝尼罗河运河的正式开通，因为最近有一场高水位的尼罗河泛滥。"
 RICE_nile_opened_canal_very_high:0 "开通的尼罗河运河（超高水位泛滥）"
 RICE_nile_opened_canal_very_high_desc:0 "该角色最近在一个盛大的仪式上庆祝尼罗河运河的正式开通，因为最近有一场超高水位的尼罗河泛滥。"
 RICE_upper_egypt_helped_hippo_victims:0 "捐赠给河马袭击事件的受害者"
 RICE_upper_egypt_khirs_lands_tensions:0 "基尔的紧张局势"
 RICE_upper_egypt_khirs_lands_tensions_desc:0 "基尔位于尼罗河沿岸，是块杂草丛生的土地，并不适合农业生产，但对牧民民族来说是很有吸引力的地方。最近一伙游牧民搬进了这个地区的这种土地，这导致了与当地村民的紧张关系。领主在解决冲突和调解双方关系方面没有做太多工作，进一步加剧了紧张局势。"
 RICE_upper_egypt_khirs_tensions_pastoralists:0 "游牧民族迁入基尔的土地"
 RICE_upper_egypt_khirs_tensions_pastoralists_desc:0 "基尔位于尼罗河沿岸，是块杂草丛生的土地，并不适合农业生产，但对牧民民族来说是很有吸引力的地方。最近一伙游牧民搬进了这个地区的这种土地，这导致了与当地村民的紧张关系。领主站在游牧民一边，认为只要他们不造成问题，就可以留下来。"
 RICE_upper_egypt_khirs_tensions_villagers:0 "村民将游牧民赶出基尔的土地"
 RICE_upper_egypt_khirs_tensions_villagers_desc:0 "基尔位于尼罗河沿岸，是块杂草丛生的土地，并不适合农业生产，但对牧民民族来说是很有吸引力的地方。最近一伙游牧民搬进了这个地区的这种土地，这导致了与当地村民的紧张关系。领主已站在村民一边，村民很快就可以把这些游牧民们赶走。"
 RICE_upper_egypt_khirs_tensions_resolved:0 "解决了关于基尔的冲突"
 RICE_upper_egypt_khirs_tensions_resolved_desc:0 "基尔位于尼罗河沿岸，是块杂草丛生的土地，并不适合农业生产，但对牧民民族来说是很有吸引力的地方。最近一伙游牧民搬进了这个地区的这种土地，这导致了与当地村民的紧张关系。领主已设法说服双方互相妥协，使他们能够和平地并肩共存。"
 RICE_upper_egypt_studied_nilometer_records:0 "研究尼罗河水位计历史记录"
 RICE_upper_egypt_new_temple_village:0 "古庙里的新村庄"
 RICE_upper_egypt_new_temple_village_desc:0 "古代遗迹点缀着埃及的风景，人们在这些遗迹内聚集成村庄的情况并不罕见。在这个地区有一个这样的村庄出现在一座位于战略要地的古庙内。"
 RICE_upper_egypt_ate_ful_medames:0 "吃了好吃的埃及蚕豆餐"
 RICE_upper_egypt_ate_ful_medames_desc:0 "蚕豆加入孜然、柠檬汁、橄榄油炖成的美食，谁不喜欢呢？"
 RICE_upper_egypt_opinion_ruthless_egyptian_officials:0 "对冷酷埃及官员持宽容态度"
 RICE_upper_egypt_celebrate_nile_canal_opening:0 "庆祝尼罗河运河的开通"
 RICE_upper_egypt_celebrate_nile_canal_opening_tooltip:0 "今年的尼罗河泛滥趋势很好！"
 RICE_upper_egypt_celebrate_nile_canal_opening_desc:0 "因为今年埃及的[nile_flood|E]很好，我们很快就能开凿灌溉渠，以控制每年的泛滥，并更有效地在我们的农田分配水。运河的开通是一个重要的仪式，今年我会把它办得很壮观！"
 RICE_upper_egypt_celebrate_nile_canal_opening_effect_tooltip:0 "你将获得[prestige|E]、[piety|E]和一个#P 正面#!的[character_modifier|E]，其强度取决于[nile_flood|E]的结果。"
 RICE_upper_egypt_celebrate_nile_canal_opening_confirm:0 "感谢[ROOT.Char.GetFaith.HighGodName]让今年的尼罗河良好泛滥"
 RICE_upper_egypt_celebrate_nile_canal_opening_context_tooltip:0 "#emphasis 历史背景：#!自法老时代以来，埃及人修建了灌溉运河，利用尼罗河的年度泛滥来最大化农业产量。这些运河的开通——只有在尼罗河水位达到一定高度时才进行——具有象征意义，涉及各种仪式，这些仪式即使在埃及基督教化和伊斯兰化之后也一直延续。法蒂玛王朝将这些仪式发扬光大，制定了精心的庆祝活动，来赞美尼罗河泛滥。"
 RICE_upper_egypt_pray_for_a_good_nile_flood:0 "在尼罗河泛滥后忏悔"
 RICE_upper_egypt_pray_for_a_good_nile_flood_tooltip:0 "他们说我们正在因我们的罪孽而受到惩罚……"
 RICE_upper_egypt_pray_for_a_good_nile_flood_desc:0 "今年埃及的[nile_flood|E]不太理想，因为它没有达到尼罗河沿岸农田的所需最佳水量。我们需要忏悔我们的罪过，这样就不会再发生这样的事情了!"
 RICE_upper_egypt_pray_for_a_good_nile_flood_effect_tooltip_1:0 "根据你的[virtues|E]、[sins|E]、[traits|E]、[piety_level|E]以及你愿意付出的[gold|E]数目，你可能会获得一些[piety|E]和[prestige|E]，以及你拥有的[GetGeographicalRegion('RICE_nile_river_valley').GetName]沿岸的[county|E]#italic 可能#!获得[GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip][county_modifier|E]以来抵消贫瘠泛滥带来的负面影响。"
 RICE_upper_egypt_pray_for_a_good_nile_flood_effect_tooltip_2:0 "如果尼罗河没有泛滥，有一个极小的机会让[THIS.Char.GetFaith.HighGodName]可能会听到你的祈祷，然后尼罗河的水位会上涨。"
 RICE_upper_egypt_pray_for_a_good_nile_flood_confirm:0 "[ROOT.Char.GetFaith.HighGodName]，我们恳求你原谅我们！"
 RICE_upper_egypt_pray_for_a_good_nile_flood_context_tooltip:0 "#emphasis 历史背景：#!从历史上看，如果尼罗河泛滥没有达到一个合适的水位（通常在16肘【一肘约等于0.457米】左右），这将是一种危险的情况，可能导致埃及出现饥荒、社会动荡和叛乱。有中世纪的记录显示，基督徒和穆斯林的埃及人在灾年祈求上帝赐予足够的泛滥，这些记录被当时的文学作品用来证明一种信仰优于另一种信仰。"
 RICE_decision_good_nile_flood_req:0 "今年的[nile_flood|E]要么正常，要么高，要么非常高"
 RICE_decision_bad_nile_flood_req:0 "今年的[nile_flood|E]不是低，就是很低，或者是过量的泛滥"
 RICE_decision_low_nile_flood_req:0 "今年的[nile_flood|E]不是低就是非常低"
 RICE_decision_nile_valley_geographical_req:0 "你拥有一个沿着[GetGeographicalRegion('RICE_nile_river_valley').GetName]的[county|E]。"
 RICE_decision_nile_flood_month_req:0 "月份是八月、九月或十月"
 RICE_upper_egypt_renovate_local_nilometers:0 "翻新当地的尼罗河水位计"
 RICE_upper_egypt_renovate_local_nilometers_tooltip:0 "重要的是尼罗河水位计状态良好。"
 RICE_upper_egypt_renovate_local_nilometers_desc:0 "我收到报告说，我的领土中的一些尼罗河水位计需要修理和其他维护工作。我也可以利用这个机会对它们进行整修和改进。"
 RICE_upper_egypt_renovate_local_nilometers_effect_tooltip_1:0 "如果[nile_flood|E]情况不好（即低、非常低或过度泛滥），你在[GetGeographicalRegion('RICE_nile_river_valley').GetName]拥有的[counties|E]将获得[GetModifier('RICE_nile_mitigated_bad_flood').GetNameWithTooltip][county_modifier|E]以部分抵消处罚。"
 RICE_upper_egypt_renovate_local_nilometers_confirm:0 "这是一份重要工作"
 RICE_upper_egypt_renovate_local_nilometers_context_tooltip:0 "#emphasis 历史背景：#!尼罗河水位计是一种专门测量尼罗河泛滥季节水位变化的建筑。它们在古埃及、罗马和中世纪时期具有极其重要的政治、经济和宗教作用，因为它们能够帮助当局及时应对各种洪水灾害。阿拉伯人征服埃及后，开罗罗达岛上的尼罗河水位计成为埃及最重要的水位计。它由一位名叫伊本·阿比勒·拉达德的世袭官员负责管理，他每天向苏丹汇报泛滥季节的水情。"
 RICE_upper_egypt_aswan_temple_decision_choose_where_to_pray:0 "在阿斯旺选择一个圣岛"
 RICE_upper_egypt_temple_philae_option:0 "#Bold #V 菲莱#!#!\n向伊西斯、奥西里斯和荷鲁斯祈祷"
 RICE_upper_egypt_temple_philae_option_desc:0 "向伊西斯、奥西里斯和荷鲁斯祈祷"
 RICE_upper_egypt_temple_philae_option_tooltip:0 "#V 菲莱#!标志着埃及和努比亚之间的传统边界，是伟大的女神#V 伊西斯#!，以及她的兄弟丈夫奥西里斯和他们的儿子荷鲁斯的祭拜中心。\n#weak 在这里祈祷会影响你的每月的经验收益、伯爵领好感和封臣好感#!"
 RICE_upper_egypt_temple_philae_option_closed:0 "#X 菲莱神庙被遗弃并正式关闭#!"
 NOT_RICE_upper_egypt_temple_philae_option_closed:0 "#X 菲莱神庙被遗弃并正式关闭#!"
 RICE_upper_egypt_temple_elephantine_option:0 "#Bold #V 象岛#!#!\n向克努姆、萨提特和阿努凯特祭拜"
 RICE_upper_egypt_temple_elephantine_option_desc:0 "向克努姆、萨提特和阿努凯特祈祷"
 RICE_upper_egypt_temple_elephantine_option_tooltip:0 "#V 象岛#!是被认为是尼罗河神#V 克努姆#!的住所，同时象岛也是克努姆、萨提特和阿努凯特祭拜中心，他们都是尼罗河的神祇和保护者。\n#weak 在这里祈祷会影响你的税收收入、军队维护费用和生育能力#!"
 RICE_upper_egypt_temple_elephantine_option_closed:0 "#X 象岛神庙被遗弃并正式关闭#!"
 NOT_RICE_upper_egypt_temple_elephantine_option_closed:0 "#X 象岛神庙被遗弃并正式关闭#!"
 RICE_upper_egypt_temple_kalabsha_option:0 "#Bold #V 卡拉布萨神庙#!#!\n向曼杜利斯、伊姆霍特普和图图祈祷"
 RICE_upper_egypt_temple_kalabsha_option_desc:0 "向曼杜利斯、伊姆霍特普和图图祈祷"
 RICE_upper_egypt_temple_kalabsha_option_tooltip:0 "#V 卡拉布萨神庙#!是#V 曼杜利斯#!的主要圣地，它是源自努比亚的太阳和月亮神；那里的神庙还供奉着其他神祇，如智者伊姆霍特普和守护者图图。\n#weak 在这里祷告可以让你专注于名声、建筑成本和阴谋抵抗能力#!"
 RICE_upper_egypt_temple_kalabsha_option_closed:0 "#X 卡拉布萨的神庙被遗弃并正式关闭#!"
 NOT_RICE_upper_egypt_temple_kalabsha_option_closed:0 "#X 卡拉布萨的神庙被遗弃并正式关闭#!"
 RICE_upper_egypt_pray_at_a_temple_in_aswan:0 "在阿斯旺的一个神庙里祈祷"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_tooltip:0 "阿斯旺的神庙在向我召唤"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_desc:0 "几个世纪以来，尼罗河第一瀑布一直是圣地中心，也许甚至在法老时代之前就已经存在了。由于我住得不太远，我希望能去那里一趟在[temples_of_aswan|E]膜拜神明。"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_effect_tooltip:0 "你将获得随机数额的[piety|E]，以及潜在的各种#P 正面#![character_modifiers|E]，这取决于你在[aswan_county.GetNameNoTier]做出的供奉和你在哪里祈祷。"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_confirm:0 "去阿斯旺！"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_all_temples_closed:0 "#X 象岛、卡拉布萨和菲莱的寺庙都已关闭，必须重新开放才能进入。#!"
 NOT_RICE_upper_egypt_pray_at_a_temple_in_aswan_all_temples_closed:0 "#X 象岛、卡拉布萨和菲莱的寺庙都已关闭，必须重新开放才能进入。#!"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_philae_closed:0 "#X 菲莱神庙目前已正式关闭#!"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_elephantine_closed:0 "#X 象岛神庙正式关闭#!"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_kalabsha_closed:0 "#X 卡拉布萨的神庙目前已正式关闭#!"
 RICE_upper_egypt_pray_at_a_temple_in_aswan_context_tooltip:0 "#emphasis 历史背景：#!阿斯旺周围有几个岛屿，对古埃及人和努比亚人具有宗教意义，岛上建有许多受信徒和朝圣者欢迎的寺庙。在古典晚期，尽管埃及已经基督教化，这些岛屿仍然是异教崇拜的活跃场所，布伦米人的官方代表团一直到6世纪都还在造访。最终，和埃及其他地方一样，这些岛屿被废弃，建筑物被用于其他用途或作为建筑材料。"
 RICE_upper_egypt_temple_of_philae_context_tooltip:0 "#emphasis 历史背景：#!在埃及历史上的晚期法老时代和希腊罗马时期，位于阿斯旺附近的菲莱岛上的一座神庙成为了伊西斯的崇拜中心。伊西斯是埃及人和邻近的努比亚人和布伦米人所敬拜的女神。历史上最后一次已知的象形文字铭文是在公元394年由伊西斯的一位祭司内斯梅特拉赫姆在菲莱神庙上刻下的。伊西斯的祭司们也用通俗的草书体（一种从象形文字衍生出的草写文字）在神庙上留下了涂鸦，最晚的一例可以追溯到公元451年或452年。"
 RICE_upper_egypt_temple_of_elephantine_context_tooltip:0 "#emphasis 历史背景：#!象岛是古埃及重要的宗教中心，因为它被认为是克努姆的家园。克努姆是陶器、尼罗河和其源头的守护神。象形岛上有许多神庙，供奉所谓的象形岛三神，即：（1）克努姆神；（2）他的妻子萨提特——战争、狩猎和尼罗河泛滥女神；（3）阿努凯特——尼罗河本身和欲望女神，她可能是克努姆和萨提特的女儿，也可能是萨提特的姐妹，或者是克努姆的妾。到了罗马时期，象岛的地位已经衰落，被菲莱神庙所取代。"
 RICE_upper_egypt_temple_of_kalabsha_context_tooltip:0 "#emphasis 历史背景：#!卡拉布沙神庙位于阿斯旺以北不到几小时步行的一个海角上，是罗马皇帝奥古斯都1时期为纪念努比亚神祇曼杜利斯而建造的崇拜中心。曼杜利斯有两个面相：曼杜利斯长者，代表太阳；曼杜利斯童子，代表月亮。神庙里还供奉着其他几位神祇。后来，当努比亚地区基督教化后，这座神庙曾一度被改作教堂。有趣的是，这座神庙从未正式完工。"
 RICE_upper_egypt_close_temple_of_philae:0 "正式关闭菲莱神庙"
 RICE_upper_egypt_close_temple_of_philae_tooltip:0 "#italic “面对我的杰作而绝望吧”#!"
 RICE_upper_egypt_close_temple_of_philae_desc:0 "位于[temples_of_aswan_city|E]的菲莱岛，多年来一直是异教崇拜的中心，但它的神庙已经很少用于这一目的了。现在是我们正式关闭它的时候了，并赶走为数不多的虔诚者。"
 RICE_upper_egypt_close_temple_of_philae_effect_tooltip:0 "当异教徒前往[GetActivityType( 'activity_RICE_upper_egypt_visit_aswan_temples' ).GetName]时，菲莱将不再可选。如果所有潜在神庙地点都被关闭，那么该[activity|E]将不再可用。"
 RICE_upper_egypt_close_temple_of_philae_confirm:0 "现在是我们这样做的时候了。"
 RICE_upper_egypt_close_temple_of_philae_context_tooltip:0 "$RICE_upper_egypt_temple_of_philae_context_tooltip$"
 RICE_upper_egypt_reopen_temple_of_philae:0 "正式重开菲莱神庙"
 RICE_upper_egypt_reopen_temple_of_philae_tooltip:0 "这座寺庙该有多古老的历史啊！？"
 RICE_upper_egypt_reopen_temple_of_philae_desc:0 "菲莱岛，[temples_of_aswan_city|E]曾经是一个异教崇拜的中心。然而，它的主庙现在被遗弃了。我们应该整修这个地方，为其配备人员，[ROOT.Char.Custom('DefaultPriestTitlePlural')]并重新开放神庙，以便所有人可以再次在里面敬畏神明。"
 RICE_upper_egypt_reopen_temple_of_philae_effect_tooltip:0 "当异教徒采取[GetActivityType( 'activity_RICE_upper_egypt_visit_aswan_temples' ).GetName]时，菲莱现在是祈祷地点的选项之一。因为之前[aswan_county.GetNameNoTier]附近的主要寺庙都关闭了，所以[activity|E]无法使用，但是现在可以使用。"
 RICE_upper_egypt_reopen_temple_of_philae_confirm:0 "让我们开始行动吧！"
 RICE_upper_egypt_reopen_temple_of_philae_context_tooltip:0 "$RICE_upper_egypt_temple_of_philae_context_tooltip$"
 RICE_upper_egypt_close_temple_of_elephantine:0 "正式关闭象岛神殿"
 RICE_upper_egypt_close_temple_of_elephantine_tooltip:0 "#italic “面对我的杰作而绝望吧”#!"
 RICE_upper_egypt_close_temple_of_elephantine_desc:0 "位于[temples_of_aswan_city|E]的象岛多年来一直是异教崇拜的中心，但它的神庙已经很少用于这一目的了。现在是我们正式关闭它的时候了，并赶走为数不多的虔诚者。"
