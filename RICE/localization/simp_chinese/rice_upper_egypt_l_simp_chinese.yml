 activity_RICE_upper_egypt_open_nile_canals_desc:0 "自法老时代以来，开渠一直是一个重要的仪式，如果今年埃及的[nile_flood|E]情况良好，我们应该打开灌溉运河与溉渠，以利用河流泛滥，更有效地分配田间的水。"
