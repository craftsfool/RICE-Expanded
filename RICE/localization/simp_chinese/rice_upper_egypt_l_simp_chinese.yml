 activity_RICE_upper_egypt_pray_good_nile_flood:0 "尼罗河忏悔仪式"
 activity_RICE_upper_egypt_pray_good_nile_flood_desc:0 "有时，[nile_flood|E]并不理想，水量不足以灌溉沿岸农田。当这种情况发生时，我们需要忏悔们的罪过，希望再也不会发生这种事情！"
 activity_RICE_upper_egypt_pray_good_nile_flood_selection_tooltip:0 "[nile_flood|E]忏悔\n\n$RICE_upper_egypt_pray_for_a_good_nile_flood_context_tooltip$"
 activity_RICE_upper_egypt_pray_good_nile_flood_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$你在[GetGeographicalRegion('RICE_nile_river_valley').GetName]拥有的所有[counties|E]，会有概率获得[GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip][county_modifier|E]，以减轻糟糕的[nile_flood|E]负面影响。\n\n加成有效性取决于你的[traits|E]、[virtues|E]、[sins|E]和[piety_level|E]"
 activity_RICE_upper_egypt_pray_good_nile_flood_guest_desc:0 ""
