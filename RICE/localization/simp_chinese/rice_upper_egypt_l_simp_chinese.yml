 game_concept_temples_of_aswan:0 "阿斯旺神庙"
 game_concept_temple_in_aswan:0 "阿斯旺神庙"
 game_concept_temples_of_aswan_city:0 "阿斯旺"
 game_concept_temples_of_aswan_desc:0 "阿斯旺是埃及南部的一个主要城市，传统上是埃及和努比亚的边界，历史上曾有许多神庙，因为它对两个文明都具有重要的宗教意义。\n\n如果你是某些异教[faiths|E]，你可以进行[GetActivityType( 'activity_RICE_upper_egypt_visit_aswan_temples' ).GetName][local_pilgrimage|E]，并在象岛、菲莱和卡拉布萨神庙神庙中选择祈祷。每个地点都可以让你专注于崇拜三位神祇中的一位，有可能为让你获得不同收益。\n\n然而，这些[activity|E]并不总是可用的，因为这三个地方的寺庙可能被不属于这些[faiths|E]的[ruler|E]下令#bold 关闭#!。如果这三个地方都被关闭了，那么在这些地方祈祷的[activity|E]也就无法使用是它们总是可以被适当的异教[faith|E]下令#bold 重新开放#!，届时可以进入。"
 game_concept_darb_al_arbain:0 "阿拉伯之路"
 game_concept_darb_al_arbain_desc:0 "阿拉伯之路（或称四十天路）是一条重要的商队路线，位于埃及的阿苏特和努比亚南部的达尔富尔之间。它从法老时代就已经存在，直到19世纪仍在使用。\n\n通过这条道路连接的八个[counties|E]的[rulers|E]可以解锁一个[decision|E]，以#Bold $RICE_upper_egypt_reinforce_the_darb_al_arbain$#!。它允许你在四十天路沿线的[GetModifier('RICE_upper_egypt_reinforced_darb_al_arbain').GetNameWithTooltip]中[county|E]获得为期二十年的[county_modifier|E]\n\n从北到南，这八个[counties|E]分别是：\n\n$EFFECT_LIST_BULLET$埃及的艾斯尤特、哈里杰和阿斯旺\n$EFFECT_LIST_BULLET$努比亚的伊布里姆堡和赛\n$EFFECT_LIST_BULLET$达尔富尔的达尔里赫、法希尔和法拉赫泉"
