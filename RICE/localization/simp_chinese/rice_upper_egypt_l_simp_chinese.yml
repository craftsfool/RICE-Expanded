 upper_egypt.0040.t:0 "去阿斯旺！"
 upper_egypt.0040.desc.intro:0 "自古以来，[aswan_county.GetNameNoTier]城周围地区一直被许多崇拜古埃及神的人视为圣地。该城市紧邻的尼罗河第一瀑布标志着埃及和努比亚的传统边界，但边界两边的人都曾前往[aswan_county.GetNameNoTier]在其寺庙祈祷。即使是来自远方的强大的国王也派出令人印象深刻的使节团来这里向神明祷告，现在我也正计划进行这样的朝圣。"
 upper_egypt.0040.desc.philae:0 "\n\n#V 菲莱岛#!，位于第一瀑布周边，是伊希斯的主要崇拜中心，也是她的兄弟丈夫奥西里斯和他们的儿子荷鲁斯的主要崇拜中心，这三个人都是外界最重要的神祇。菲莱神庙可以同时祭祀三位神祇，将是我此行的目的地。"
 upper_egypt.0040.desc.elephantine:0 "\n\n#V 象岛#!，位于第一瀑布的下游，长期以来一直被认为是尼罗河源头之神克努姆和他的妻子萨提特及其女儿阿努凯特的住所。为纪念这些神圣的尼罗河的保护者而建造的象山神庙，将是我此行的目的地。"
 upper_egypt.0040.desc.kalabsha:0 "\n\n#V 卡拉布萨岛#!，位于第一瀑布的上游，是日月神曼杜利斯以及其他小神如伊姆霍特普和图图的一个重要崇拜中心。卡拉布萨神庙将是我此行的目的地。"
 upper_egypt.0040.a:0 "是时候去那旅行了。"
 upper_egypt.0041.t:0 "菲莱的神殿"
 upper_egypt.0041.desc:0 "我和使节团以及[ROOT.Char.Custom('DefaultPriestTitlePlural')]一起，来到了[aswan_county.GetNameNoTier]附近的菲莱神庙，向诸神致意。我们在神庙的石头上刻了一些纪念碑文后，我们被迎进了神庙。\n\n在那里，我们参加了纪念伊希斯、奥西里斯、荷鲁斯和其他神祇的仪式，特别是通过喝牛奶的方式。白色的、甜美的牛奶被倒在献给神明的祭品上，我们一边吟唱祈祷词，一边将我们的虔诚奉献给神明。\n\n在我的访问结束之前，为了表明我的虔诚，我应该特别向菲莱的一位神祇献上一份盛大的祭品。"
 upper_egypt.0041.a:0 "大母神伊西斯，其神圣的乳汁赋予了生命"
 upper_egypt.0041.b:0 "奥西里斯，冥世之主，伊西斯之乳让其复生"
 upper_egypt.0041.c:0 "天空之主荷鲁斯，其母伊西斯之乳净化了他"
 upper_egypt.0041.a.toast:0 "大母神伊西斯保佑你！"
 upper_egypt.0041.b.toast:0 "冥世之主奥西里斯保佑你！"
 upper_egypt.0041.c.toast:0 "天空之主荷鲁斯保佑你！"
 upper_egypt.0042.t:0 "象岛的神殿"
 upper_egypt.0042.desc:0 "我和使节团以及[ROOT.Char.Custom('DefaultPriestTitlePlural')]一起，来到了[aswan_county.GetNameNoTier]附近的象岛神庙，向诸神致意。我们在神庙的石头上刻了一些纪念碑文后，我们被迎进了神庙。\n\n在那里，我们参加了各种仪式来纪念克努姆、他的妻子萨提特、他们的女儿阿努凯特，这三个人守护着尼罗河，并确保其每年发生泛滥。\n\n在我的访问结束之前，为了表明我的虔诚，我应该特别向象岛的一位神祇献上一份盛大的祭品。"
 upper_egypt.0042.a:0 "克努姆，万物创造者，尼罗河源头之神"
 upper_egypt.0042.b:0 "萨提特，战争女神，尼罗河洪水女神"
 upper_egypt.0042.c:0 "阿努凯特，尼罗河的化身及尼罗河女神"
 upper_egypt.0042.a.toast:0 "创造之神克努姆保佑你！"
 upper_egypt.0042.b.toast:0 "战争女神萨提特保佑你"
 upper_egypt.0042.c.toast:0 "尼罗河女神阿努凯特保佑你！"
 upper_egypt.0043.t:0 "卡拉布萨的神庙"
 upper_egypt.0043.desc:0 "我和使节团以及[ROOT.Char.Custom('DefaultPriestTitlePlural')]一起，来到了卡拉布萨神庙附近的[aswan_county.GetNameNoTier]岛，向诸神致意。我们经过岛上不同的神庙，每座神庙都供奉着一个特定的神祇。神庙分为南北两侧，每侧都供奉不同的神祇。\n\n在那里，我们参加了纪念曼杜利斯的各种仪式来纪念日月神曼杜利斯和其他较小的神祇，如伊姆霍特普、图图等。\n\n在我的访问结束之前，为了表明我的虔诚，我应该特别向卡拉布萨的一位神祇献上一份盛大的祭品。"
 upper_egypt.0043.a:0 "曼杜利斯，全知之神，永恒之王"
 upper_egypt.0043.b:0 "伊姆霍特普，普塔神之子，半神半人的建筑师和治疗者"
 upper_egypt.0043.c:0 "图图，奈斯之子，恶魔之主"
 upper_egypt.0043.a.toast:0 "曼杜利斯，全知之神，祝福你！"
 upper_egypt.0043.b.toast:0 "伊姆霍特普，普塔神之子，祝福你！"
 upper_egypt.0043.c.toast:0 "图图，奈斯之子，祝福你！"
 upper_egypt.0044.t:0 "正式关闭菲莱神庙"
 upper_egypt.0044.desc:0 "多年来，位于[aswan_county.GetNameNoTier]附近的菲莱岛的神庙一直是这个地区异教徒的圣地。即使是住在遥远的布莱米亚和努比亚腹地的信徒，也会来这里向伊希斯和其他神祇祈祷。\n\n然而现在神庙的场地上一片寂静和荒芜。已经许久没人来菲莱，除了偶尔的流浪者或一些同情伊希斯的异教徒。\n\n现在是我们正式关闭菲莱神庙的时候了，并展示[ROOT.Char.GetFaith.GetAdjective]信仰的优越性。这个神庙太大，无法摧毁，所以我们会让它存在，并禁止任何异端崇拜在这里发生。"
 upper_egypt.0044.a:0 "也许当地人在建造建筑过程中可以用这个"
 upper_egypt.0045.t:0 "菲莱神庙现在正式关闭"
 upper_egypt.0045.desc:0 "位于[aswan_county.GetNameNoTier]附近的菲莱岛的神庙曾经为来自遥远的布莱米亚和努比亚腹地的伊希斯信徒服务。当地人已经改信，不再信仰伊希斯这样的旧神，这里已经被遗弃了。\n\n因此，[temple_ender.GetTitledFirstName]最近关闭了这座神庙，并禁止任何异端崇拜在这里进行，以显示[temple_ender.GetFaith.GetAdjective]信仰的优越性。虽然这个建筑仍然存在，但在未来的几年里，它可能会一直无人使用而荒废。"
 upper_egypt.0045.a:0 "明白了……"
 upper_egypt.0046.t:0 "正式关闭象岛神庙"
 upper_egypt.0046.desc:0 "多年来，[aswan_county.GetNameNoTier]附近的象岛上的寺庙一直是该地区异教徒的圣地。许多人认为该岛是尼罗河之神克努姆的故乡，因此认为该岛是神圣的地方。\n\n然而现在神庙的场地上一片寂静和荒芜。除了偶尔的流浪者或一些同情克努姆的异教徒，现在已经许久没人来象岛了。\n\n现在是时候了，我们正式关闭象岛的寺庙，并展示[ROOT.Char.GetFaith.GetAdjective]信仰的优越性。这些建筑太大，无法摧毁，所以我们会让它们存在，并禁止任何异端崇拜在这里发生。"
 upper_egypt.0046.a:0 "也许当地人在建造建筑过程中可以用这个"
 upper_egypt.0047.t:0 "象岛现在正式关闭"
 upper_egypt.0047.desc:0 "位于[aswan_county.GetNameNoTier]附近的象岛上的寺庙曾经为希望纪念尼罗河之神克努姆的异教徒服务。现在当地人已经改变信仰，他们不再追随像克努姆这样的旧神，所以它们实际上已经被抛弃了。\n\n因此，[temple_ender.GetTitledFirstName]最近关闭了这些神庙，并禁止任何异端崇拜在那里进行，以显示[temple_ender.GetFaith.GetAdjective]信仰的优越性。虽然这些建筑仍然存在，但在未来的几年里，它们可能会一直无人使用而荒废。"
 upper_egypt.0047.a:0 "明白了……"
 upper_egypt.0048.t:0 "正式关闭卡拉布萨神庙"
 upper_egypt.0048.desc:0 "多年来，[aswan_county.GetNameNoTier]附近的卡拉布萨岛上的神庙一直是该地区异教徒的圣地。是信仰曼杜利斯神的圣地，整个努比亚和埃及都在崇拜他。\n\n然而现在神庙的场地上一片寂静和荒芜。已经很久没有人来卡拉布萨的寺庙，除了偶尔的流浪者或一些同情曼杜利斯的异教徒。\n\n现在是我们正式关闭卡拉布沙神庙的时候了，并展示[ROOT.Char.GetFaith.GetAdjective]信仰的优越性。这座建筑太大，无法摧毁，所以我们会让它存在，并禁止任何异端崇拜在这里发生。"
 upper_egypt.0048.a:0 "也许当地人在建造建筑过程中可以用这个"
 upper_egypt.0049.t:0 "卡拉布萨神庙正式关闭"
 upper_egypt.0049.desc:0 "位于[aswan_county.GetNameNoTier]附近的卡拉布萨岛上的寺庙曾经为献给曼杜利斯神的异教徒服务。由于当地人现在已经改变信仰，不再追随曼杜利斯这样的旧神，它实际上已经被废弃了。\n\n因此，[temple_ender.GetTitledFirstName]最近关闭了这座寺庙，并禁止任何异端崇拜在这里发生，以证明[temple_ender.GetFaith.GetAdjective]信仰的优越性。虽然这个建筑仍然存在，但在未来的几年里，它可能会一直无人使用而荒废。"
 upper_egypt.0049.a:0 "明白了……"
 upper_egypt.0050.t:0 "菲莱神庙正式重新开放"
 upper_egypt.0050.desc:0 "多年以前，位于[aswan_county.GetNameNoTier]附近的菲莱岛的神庙是这个地区异教徒的圣地。即使是住在遥远的布莱米亚和努比亚腹地的信徒，也会来这里向伊希斯和其他神祇祈祷。在某些时候，一旦当地人放弃对伊希斯的崇拜，所以它被关闭。\n\n然而，现在菲莱迎来了新的一天，因为人们正在重新审视古老信仰。在一个盛大的仪式中，我已经正式采取措施，整修并重新开放该寺庙，并引入了[ROOT.Char.Custom('DefaultPriestTitlePlural')]，以确保它能再次发挥神殿的功能。"
 upper_egypt.0050.a:0 "赞美伊西斯！"
 upper_egypt.0051.t:0 "菲莱神庙正式重新开放"
 upper_egypt.0051.desc:0 "位于[aswan_county.GetNameNoTier]附近的菲莱岛上的大神庙曾经为来自遥远的布莱米亚和努比亚腹地的伊希斯的信徒服务。多年前，它被正式关闭并被遗弃，但在[temple_restorer.GetTitledFirstName]的努力下，这种情况正在改变。\n\n虔诚的[temple_restorer.GetFaith.GetAdherentName]，[temple_restorer.GetFirstName]努力将这些寺庙恢复到它以前的荣耀，并正式重新开放。伊希斯和其他神祇的信徒们正成群结队地回到这个神圣的礼拜场所进行礼拜。"
 upper_egypt.0051.a:0 "有趣的消息……"
 upper_egypt.0052.t:0 "象岛寺庙正式重新开放"
 upper_egypt.0052.desc:0 "多年前，[aswan_county.GetNameNoTier]附近象岛上的寺庙曾是这个地区异教徒的圣地。许多人认为该岛是尼罗河之神克努姆的家，因此认为该岛是神圣的地方。后来在某个时间，当地人放弃了对克努姆的崇拜，这些寺庙就被正式关闭然后被遗忘。\n\n然而，象岛现在迎来了新的一天，因为人们正在重新审视古老信仰。在一个盛大的仪式上，我已经正式采取了措施来整修和重新开放这些寺庙，并引入了[ROOT.Char.Custom('DefaultPriestTitlePlural')]，以确保它们能够再次作为礼拜场所发挥作用。"
 upper_egypt.0052.a:0 "赞美克努姆！"
 upper_egypt.0053.t:0 "象岛寺庙正式重新开放"
 upper_egypt.0053.desc:0 "位于[aswan_county.GetNameNoTier]附近象岛上的大神庙曾经为希望纪念尼罗河之神克努姆的异教徒服务。多年前，它们被正式关闭并被遗弃，但由于[temple_restorer.GetTitledFirstName]的努力，这种情况正在改变。\n\n虔诚的[temple_restorer.GetFaith.GetAdherentName]，[temple_restorer.GetFirstName]努力将这些寺庙恢复到它以前的荣耀，并正式重新开放它们。克努姆和其他神祇的信徒们正成群结队地回到这些神圣的礼拜场所进行礼拜。"
 upper_egypt.0053.a:0 "有趣的消息……"
 upper_egypt.0054.t:0 "卡拉布萨神庙正式重开"
 upper_egypt.0054.desc:0 "多年前，[aswan_county.GetNameNoTier]附近的卡拉布萨岛上的寺庙是这个地区异教徒的圣地。它在信仰曼杜利斯神的人中很受欢迎，整个努比亚和埃及都在崇拜他。在某个时候，当地人放弃对伊希斯的崇拜，它就被关闭和遗弃。\n\n现在卡拉布沙迎来了新的一天，因为人们正在重拾古老信仰。在一个盛大的仪式中，我正式采取了措施来整修和重新开放神庙，并引入了[ROOT.Char.Custom('DefaultPriestTitlePlural')]，以确保它能再次发挥礼拜堂的作用。"
 upper_egypt.0054.a:0 "赞美曼杜利斯！"
 upper_egypt.0055.t:0 "卡拉布萨神庙正式重开"
 upper_egypt.0055.desc:0 "位于[aswan_county.GetNameNoTier]附近的卡拉布萨岛上的大庙曾经为献给Mandulis神的异教徒服务。几年前它被正式关闭并被遗弃，但在[temple_restorer.GetTitledFirstName]的努力下，情况正在改变。\n\n一个虔诚的[temple_restorer.GetFaith.GetAdherentName]，[temple_restorer.GetFirstName]已经采取了努力，将寺庙恢复到它以前的荣耀，并正式重新开放。曼杜利斯和其他神祇的信徒们正成群结队地返回这个神圣的礼拜堂进行礼拜。"
 upper_egypt.0055.a:0 "有趣的消息……"
 upper_egypt.0056.t:0 "第一瀑布"
 upper_egypt.0056.a:0 "去菲莱！"
