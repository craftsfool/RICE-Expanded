 RICE_upper_egypt_reinforce_the_darb_al_arbain:0 "增援阿拉伯之路"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_tooltip:0 "这是一个重要的商业走廊，让我们确保它的安全！"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_desc:0 "[darb_al_arbain|E]是一条重要的商队路线，穿过尼罗河以西的沙漠，连接埃及和非洲其他地区。在我控制的[darb_al_arbain|E]沿线的领土上，有一些小型堡垒和前哨，旨在保持这条艰巨但有利可图的路线及其次要路线的安全。我收到报告说这些堡垒可能需要修理。"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_effect_tooltip:0 "你选择增援的[county|E]将获得[GetModifier('RICE_upper_egypt_reinforced_darb_al_arbain').GetNameWithTooltip][county_modifier|E]为期#V 20#!年"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_confirm:0 "让我们开始行动吧！"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_context_tooltip:0 "#emphasis 历史背景：#!阿拉伯之路（又称四十天之路），是一条贯穿埃及艾斯尤特和达尔富尔的科拜（或库贝）的贸易路线，沿途经过各种绿洲，如哈里杰、塞利马和敦库勒等。还有一些次要路线，将它与尼罗河沿岸的各个地点相连，例如努比亚的栋古拉和赛岛。这条艰难的路线穿越了干旱贫瘠的地形，但自法老时代以来就被用于埃及和非洲其他地区之间的黄金、奴隶、象牙和其他商品的运输和贸易。从罗马到奥斯曼时期，该地区的各国也在这条路线上修建了要塞和哨所，直到19世纪末期。"
 RICE_upper_egypt_darb_al_arbain_decision_choose_where_to_reinforce:0 "沿着达布·阿勒巴因选择一个地点"
 RICE_upper_egypt_darb_al_arbain_decision:0 "你所拥有的[darb_al_arbain|E]或其子路线沿线的地点"
 RICE_upper_egypt_darb_asyut_option:0 "#Bold #V 艾斯尤特#!#!"
 RICE_upper_egypt_darb_asyut_option_desc:0 "沿着尼罗河的阿拉伯之路的北端"
 RICE_upper_egypt_darb_asyut_option_tooltip:0 "$RICE_upper_egypt_darb_asyut_option_desc$"
 RICE_upper_egypt_darb_kharga_option:0 "#Bold #V 哈里杰绿洲#!#!"
 RICE_upper_egypt_darb_kharga_option_desc:0 "西部绿洲，通往非洲其他地区的门户"
 RICE_upper_egypt_darb_kharga_option_tooltip:0 "$RICE_upper_egypt_darb_kharga_option_desc$"
 RICE_upper_egypt_darb_aswan_option:0 "#Bold #V 阿斯旺#!#!"
 RICE_upper_egypt_darb_aswan_option_desc:0 "第一瀑布，埃及和努比亚的边界"
 RICE_upper_egypt_darb_aswan_option_tooltip:0 "$RICE_upper_egypt_darb_aswan_option_desc$"
 RICE_upper_egypt_darb_qasr_ibrim_option:0 "#Bold #V 伊布里姆堡#!#!"
 RICE_upper_egypt_darb_qasr_ibrim_option_desc:0 "连接东部沙漠中阿拉吉干河的道路"
 RICE_upper_egypt_darb_qasr_ibrim_option_tooltip:0 "$RICE_upper_egypt_darb_qasr_ibrim_option_desc$"
 RICE_upper_egypt_darb_sai_option:0 "#Bold #V 赛#!#!"
 RICE_upper_egypt_darb_sai_option_desc:0 "通往塞利马绿洲的最佳路线，塞利马绿洲是努比亚的一个主要绿洲，在阿拉伯之路上。"
 RICE_upper_egypt_darb_sai_option_tooltip:0 "$RICE_upper_egypt_darb_sai_option_desc$"
 RICE_upper_egypt_darb_dar_al_rih_option:0 "#Bold #V 达尔里赫#!#!"
 RICE_upper_egypt_darb_dar_al_rih_option_desc:0 "此处几近阿拉伯之路南端"
 RICE_upper_egypt_darb_dar_al_rih_option_tooltip:0 "$RICE_upper_egypt_darb_dar_al_rih_option_desc$"
 RICE_upper_egypt_darb_el_fasher_option:0 "#Bold #V 法希尔#!#!"
 RICE_upper_egypt_darb_el_fasher_option_desc:0 "阿拉伯之路的南端，向东看是努比亚。"
