 yazd.0020.t:0 "亚兹德的扩张和繁荣"
 yazd.0020.desc:0 "虽然[yazd_county.GetNameNoTier]位于一个干旱地区，但来自远方的外国人可能会惊讶地看到这个城市是多么的富裕。除了它基本上位于绿洲，四周都沙漠，在地理上受到保护之外，它还拥有优秀的基础设施和设备，如广泛的坎儿井水道网络，几个不同信仰的礼拜场所，等等。甚至还有改进的余地。\n\n我已决定启动几项举措，以扩大城市规模，并计划增加建筑和公共工程项目。这些项目包括进一步扩建坎儿井，建设花园，学校等等。这个城市已经有了相当的声誉，是对那些博学、有学问、有能力的定居者有吸引力，让我们把这个城市变得更加伟大，以便我们能在这里吸引更多的人才。"
 yazd.0020.a:0 "真的，亚兹德是沙漠中的一颗明珠。"
 yazd.0021.t:0 "亚兹德的扩张和繁荣"
 yazd.0021.desc:0 "一段时间以来，[yazd_county.GetNameNoTier]已经获得了学习和艺术中心的美誉。人们可能会认为一个位于沙漠中的聚居地如何能获得这样的美誉是很奇怪的。然而它的成功并没有什么秘密，因为它有优秀的基础设施，高素质的社区，并且位于绿洲，周围还是沙漠便于防守。\n\n虽然不是[yazd_county.GetNameNoTier]的第一位统治者，但[yazd_ruler.GetTitledFirstName]最近开始资助各种公共工程项目和举措，这与以前的情况不同。花园、礼拜堂、坎儿井、学校等等将被建造，以进一步改善城市的生活质量。现在来自远方的学者和有识之士对这座城市赞不绝口，许多人希望在那里定居，这进一步提升这座城市名声。"
 yazd.0021.a:0 "这对[yazd_county.GetNameNoTier]来说是好事。"
 yazd.0022.t:0 "坎儿井"
 yazd.0022.desc:0 "几个世纪以来，遥远的东方有一种奇妙的水利建筑技术名为#italic 坎儿井#!，可以将水送往远方。\n\n像我这样有地位的人也应该建造这种水利项目来彰显我的地位。而且一旦坎儿井建设完成，它将提供可靠的水源，无论是农业、饮用、洗涤，还是其他方面。\n\n现在我必须考虑我愿意为这项工作提供多少资金，以及我希望建造一个多大的坎儿井。"
 yazd.0022.a:0 "一个小型的坎儿井"
 yazd.0022.b:0 "一个中型的坎儿井"
 yazd.0022.c:0 "一个大型的坎儿井"
 yazd.0022.d:0 "一个巨型的坎儿井"
 yazd.0023.t:0 "关于[xwedodah_resolver.GetFaith.GetAdjective]血亲圣婚的议题"
 yazd.0023.desc:0 "任何受过良好教育的[ROOT.Char.GetFaith.GetAdherentName]都知道#italic 血亲圣婚#!是任何人能做的最伟大的行为之一，至有人声称，[ROOT.Char.GetFaith.DevilName]告诫[ROOT.Char.GetFaith.DevilHerHis]要避开那些进行#italic 血亲圣婚#!的人，因为他们身上有强大的圣性。\n\n长久以来，#italic 血亲圣婚#!到底是什么意思，一直存在着相当大的争议。在传统上，我们中的许多人将其理解为近亲之间的婚姻，如父母与子女，兄弟与姐妹。然而有些人对此提出异议，认为我们的解释是不对的，他们认为真正的且原始的教义是指表兄弟之间的婚姻。\n\n作为世界上更强大的[ROOT.Char.GetFaith.GetAdjective]领袖之一，我决定召开一个由各种学者和[ROOT.Char.Custom('DefaultPriestTitlePlural')]组成的讨论会来讨论这一问题。也许我们可以一劳永逸地解决这场辩论，以确保我们大家的团结。"
 yazd.0023.a:0 "让我们开始听取双方的论点。"
 yazd.0024.t:0 "关于[xwedodah_resolver.GetFaith.GetAdjective]血亲圣婚的议题"
 yazd.0024.desc:0 "自古以来，[xwedodah_resolver.GetFaith.GetAdjective]的信徒都在进行所谓的#italic 血亲圣婚#!！，或近亲结婚，他们认为这是一种神圣的行为，是一种对[xwedodah_resolver.GetFaith.HighGodName]的膜拜行为。但是其他信仰的追随者都为此嘲笑他们，嘲笑或谴责他们这些所谓的堕落的习俗。\n\n然而并不是每个[xwedodah_resolver.GetFaith.GetAdherentName]都能接受对#italic 血亲圣婚#!这种解释！。一直以来有些人认为它代表了表亲婚姻。因此，[xwedodah_resolver.GetTitledFirstName]，一位著名的[xwedodah_resolver.GetFaith.GetAdjective]统治者，召集了一个由众多知名学者和[xwedodah_resolver.Custom('DefaultPriestTitlePlural')]组成的讨论会，就#italic 血亲圣婚#!是否包含近亲结婚或表亲结婚进行辩论，并试图彻底解决这一问题。"
 yazd.0024.a:0 "事实也是如此。"
 yazd.0025.t:0 "对[ROOT.Char.GetFaith.GetAdjective]血亲圣婚问题裁决"
 yazd.0025.desc:0 "关于#italic 血亲圣婚#!到底是指近亲之间的婚姻，还是表兄弟之间的婚姻进行了一系列激烈且热烈的讨论\n\n虽然不是一致的裁决，但它得到了在场许多人的支持。虽然世界各地的[ROOT.Char.GetFaith.GetAdjective]社区需要时间来了解这里发生的事情，但希望这能一劳永逸地解决关于#italic 血亲圣婚#!的争论，以便我们可以专注于鼓励善念、善言和善行。\n\n#Bold 我们已经得出[ROOT.Char.GetFaith.HighGodName]关于#italic 血亲圣婚#!的解释#!"
 yazd.0025.a:0 "是表兄弟之间婚姻！我们误解[ROOT.Char.GetFaith.HighGodNamePossessive]的意思长达几个世纪。"
 yazd.0025.b:0 "是近亲结婚！正如[ROOT.Char.GetFaith.HighGodNamePossessive]所渴望的那样，它是指导人类的一种方式。"
 RICE_yazd_change_xwedodah_warning_tooltip:0 "#X 这个关于[xwedodah_resolver.GetFaith.GetNameNoTooltip]的来确定$doctrine_consanguinity_name$[doctrine|E]是#bold 永久的#!，且不能改变！#!"
 RICE_yazd_keep_xwedodah_tooltip_1:0 "[GetDoctrineType('doctrine_consanguinity_unrestricted').GetBaseName]继续是[xwedodah_resolver.GetFaith.GetName]的$doctrine_consanguinity_name$[doctrine|E]"
 RICE_yazd_keep_xwedodah_tooltip_2:0 "[GetTenetType('tenet_divine_marriage').GetBaseName]任然是[xwedodah_resolver.GetFaith.GetName]的[core_tenet|E]"
 yazd.0026.t:0 "关于[xwedodah_resolver.GetFaith.GetAdjective]血亲圣婚的裁决"
 yazd.0026.desc.intro:0 "最近，[xwedodah_resolver.GetTitledFirstName]召集了一批和[xwedodah_resolver.Custom('DefaultPriestTitlePlural')]来对[xwedodah_resolver.GetFaith.GetAdjective]中的#italic 血亲圣婚#!进行解释，他们争论的核心问题是，它指的是近亲之间还是表兄弟之间的婚姻习俗。其他信仰的追随者长期以来一直谴责[xwedodah_resolver.GetFaith.GetAdherentNamePlural]的做法，而这也是他们自己内部争论的问题。总之，这个讨论会最终得出了一个裁决。"
 yazd.0026.desc.no_incest:0 "\n\n根据各种证据和推理，他们认为#italic 血亲圣婚#!实际上指的是表亲婚姻。因此近亲结婚是后来造成的错误，是对[xwedodah_resolver.GetFaith.ReligiousText]和原始、早期[xwedodah_resolver.GetFaith.GetAdjective]做法的误读"
 yazd.0026.desc.yes_incest:0 "\n\n基于各种证据和推理，他们认为#italic 血亲圣婚#!确实是指近亲结婚，如父母与子女或兄弟姐妹之间的婚姻。因此目前实行的传统是准确的，符合[xwedodah_resolver.GetFaith.ReligiousText]中的教义。"
 yazd.0026.desc.conclusion:0 "\n\n虽然这一裁决不一定有约束力，也不一定是绝对的，但由于所涉人员的突出地位，它可能会被许多[xwedodah_resolver.GetFaith.GetAdherentNamePlural]所重视。"
 yazd.0026.a:0 "[xwedodah_resolver.GetFaith.GetAdjectiveNoTooltip]将如何看待这个问题？"
 yazd.0026.tooltip:0 "对[xwedodah_resolver.GetFaith.GetName]的$doctrine_consanguinity_name$[doctrine|E]的改变是#bold 永久的#!，且不可逆！"
 yazd.0027.t:0 "十二伊玛目圣陵"
 yazd.0027.desc.intro:0 "在[yazd_county.GetNameNoTier]当地什叶派群体的要求下，我汇集了一些资金，雇用了一些熟练的工匠和建筑师，建造了一个名为#italic 十二伊玛目圣陵#!虽然它不是该市最大的建筑，但仍然是一个了不起的建筑。里面有几个碑文，大部分都是引用《古兰经》；但有一个碑文的内容如下。\n\n#italic 于是下令建造这个受祝福的圆顶：崇高的[ROOT.Char.GetTitledFirstNameNoTooltip]努力争取真主的意愿并寻求他的回报#!"
 yazd.0027.desc.shiite:0 "\n\n我很高兴有这个机会支持我在什叶派群体的朋友。如果我们要在[yazd_county.GetNameNoTier]和世界其他地方实现繁荣，我们必须并肩作战。"
 yazd.0027.desc.not_shiite:0 "\n\n虽然我不是什叶派，但我认为没有理由避免与[yazd_county.GetNameNoTier]的什叶派群体建立良好关系。我希望他们理解并承认我的善意。"
 yazd.0027.a:0 "这座建筑必将为我们的城市增添一份荣耀。"
 yazd.0028.t:0 "参观储冰塔"
 yazd.0028.desc:0 "我前往[Glossary( '冰窖', 'YAKHCHAL_GLOSS' )]买了大量冰块自备来防止食物变质。当然，我也可以用它们制作像冰糕和冷饮这种美味的冷食。\n\n感谢神让这里的[culture.GetCollectiveNoun]人保留了如此多#italic 冰窖#!！也让我可以有如此多选择！"
 yazd.0028.a:0 "这些冰块我要了，谢谢。"
 yazd.0029.t:0 "xxxxx"
 yazd.0029.desc:0 "xxxxx"
 yazd.0029.a:0 "xxxxx"
 yazd.0030.t:0 "为萨德节做准备"
 yazd.0030.desc:0 "冬天回来了，空气中弥漫着一股寒意。\n\n今年，我希望举行一场盛大的萨德节，就像我们波斯先祖世世代代所做的那样。在一年中最冷的一天，在#italic 诺鲁孜节#!前五十天，我们将点燃篝火，庆祝萨德节。"
 yazd.0030.desc.chak_chak:0 "\n\n作为一个在[ROOT.Char.GetFaith.GetAdherentName]统治领土的[yazd_county.GetNameNoTier]，我可以在那里附近的查克查克圣洞庆祝萨德。据说当阿拉伯人征服伊朗时，萨珊王朝最后一位皇帝的女儿妮巴​​努逃到了查克查克村。由于[ROOT.Char.GetFaith.HighGodName]仁慈代祷，公主得以在山洞中躲避入侵者。\n\n不管怎么说，在萨德节期间会举行特殊的仪式。参观山洞对我来说是一个很好的膜拜机会，尽管这需要一些额外的计划。"
 yazd.0030.a:0 "我应该开始为今年的庆祝活动做准备。"
 yazd.0030.b:0 "我很高兴我可以在查克查克村庆祝萨德节"
 yazd.0030.c:0 "今年我不能去了，因为我忙于萨德节的其他活动。"
 yazd.0030.chak_chak.tooltip:0 "去查克查克山洞可能会触发额外的、潜在的萨德节事件，这可能会为你获得更多的[piety|E]和其他好处，但会减少你经历正常的萨德节事件概率。"
 yazd.0031.t:0 "萨德节开始了"
 yazd.0031.desc:0 "这是萨德节的某个夜晚。虽然这可能是一年中最冷的时候，但我们在彼此之间找到了温暖，我们在火旁感到温暖。在整个波斯世界，所有每个城镇和村庄都在点燃篝火，愿我们能在彼此身上找到快乐，因为我们希望春天回归！"
 yazd.0031.a:0 "我很高兴萨德节终于来了！让我们开始吧。"
 yazd.0032.t:0 "萨德节结束了"
 yazd.0032.desc:0 "就这样，萨德节结束了。每个人都玩得很开心，在这个一年中最冷的时候，我们到处点燃的篝火无疑帮助大家感到温暖。让大家坚信迟早有一天春天会来到我们身边。"
 yazd.0032.desc.no_chak_chak:0 "\n\n可惜，这样的场合一年只有一次，所以我们必须结束这个美好节日。而我开始期待着下一次的萨德节。"
 yazd.0032.desc.chak_chak:0 "\n\n可惜这样的场合一年只有一次，我必须离开查克查克村。不过我很高兴我决定在今年的萨德节期间到这里来，见证那里正在举行的仪式。这是一个很好的体验。"
 yazd.0032.a:0 "直到下次"
 yazd.0033.t:0 "篝火"
 yazd.0033.desc:0 "作为萨德节仪式的一部分，我们需要收集大量的木柴来建造篝火。无论高低贵贱都应该为建造篝火出分力，所以我做了我需要做的事情，协助收集木材，以便我们在晚些时候可以燃起大篝火。"
 yazd.0033.a:0 "我带了几根树枝。我这种身份应该不用怎么工作。"
 yazd.0033.b:0 "我为篝火搬运了相当数量的柴火。"
 yazd.0033.c:0 "我努力尽可能多地收集柴火。"
 yazd.0034.t:0 "水边的火焰"
 yazd.0034.desc:0 "根据古老的传统，在流水附近，或在坎儿井（一种古老的灌溉系统）边上点火。这是为了确保在[ROOT.Char.GetFaith.FertilityGodName]的帮助下，植物在外面不会太冷或受冻，这样春天我们将会丰收"
 yazd.0034.a:0 "这是仪式的重要组成部分！"
 yazd.0034.b:0 "我不知道这是否有帮助，但我还是这样做了。"
 yazd.0035.t:0 "反射"
 yazd.0035.desc:0 "当我站在火堆旁时，我想到萨德通常是在诺鲁孜节前五十天左右，也就是新的一年。我当然等不及新的一年开始，但它似乎离我很远！今晚很冷，谁知道下一个春天会带来什么？"
 yazd.0035.a:0 "我蜷缩着身子靠近火堆。"
 yazd.0036.t:0 "胡尚的传说"
 yazd.0036.desc:0 "关于萨德节为何出现有许多传说。我听到的一个版本是，它是为了庆祝伊朗神话中的古代英雄胡尚与一条龙搏斗的事件。当时胡尚试图向龙投掷一块石头，但他没有投中，当时这块石头击中了另一块石头，由于这两块石头都是燧石，这就引发了一场火灾。\n\n胡尚认识到这是[ROOT.Char.GetFaith.HighGodName]所为，祂向他揭示了火的秘密，他想庆祝这一重要时刻。因此萨德节诞生了。"
 yazd.0036.a:0 "我不确定事情是否是这样发生的，但这是个不错的故事。"
 yazd.0036.b:0 "我相信这个传说讲述了一些真相。"
 yazd.0037.t:0 "萨德诗歌"
 yazd.0037.desc:0 "作为冬季最寒冷的夜晚，萨德节常常激发许多人创作诗歌来描述火的光辉。我刚刚听了三个普通人朗诵他们受萨德启发的诗歌。\n\n一首诗将篝火比作精致的花朵，或树木，或整个花园在冬季景观中绽放。第二首诗将这一场合描述为[ROOT.Char.GetFaith.HighGodName]和[ROOT.Char.GetFaith.DevilName]的力量之间的冲突。最后一首诗复述了萨德节的起源，庆祝古代伊朗神话中的英雄胡桑如何杀死像龙一样可怕的怪物。\n\n我认为哪一首是最好的？"
 yazd.0037.a:0 "关于火与自然的优美诗句"
 yazd.0037.b:0 "关于善与恶的虔诚诗篇"
 yazd.0037.c:0 "关于英雄的传奇史诗"
 yazd.0038.t:0 "萨德节盛典"
 yazd.0038.desc:0 "萨德节往往是大量宴请的时候。毕竟这是一年中最冷的时候，所以除了篝火，食物以及分享食物也是取暖的好办法。今年的萨德节盛宴特别丰盛，有烤羊肉和牛肉等美味可供享用。"
 yazd.0038.a:0 "味道好极了！"
 yazd.0039.t:0 "捐赠给贫困者"
 yazd.0039.desc:0 "在萨德节期间，按照惯例，我们要在晚上点燃篝火之前给那些不太幸运的人送去食物。当然，今年我也做了这样一件事，帮助那些需要帮助和饥饿的人……"
 yazd.0039.a:0 "出于礼貌给了一点。"
 yazd.0039.b:0 "我给了他们一笔可观的救济。"
 yazd.0039.c:0 "我非常慷慨，送出了很多！"
 yazd.0040.t:0 "火爆的场面"
 yazd.0040.desc:0 "这些天来，波斯高原上的许多国王和领主都有在萨德节期间点燃鸟类和动物的习俗。简单地说，这些野兽会被赶进火里，观众们一边吃喝玩乐，一边观察这场骚动（当然是在安全距离）。\n\n所有宗教的虔诚学者和圣人，包括伊斯兰教#italic 和#!祆教都谴责这种做法是残忍的，违背了他们的信仰教义。然而......如果我们这样做的话，它#italic 可能#!会是一个壮丽的场景，我要这么做吗？"
 yazd.0040.a:0 "如果[ROOT.Char.Custom('DefaultPriestTitlePlural')]说这是残酷的，违背了[ROOT.Char.GetFaith.GetAdjective]的教义，那就不做了。"
 yazd.0040.b:0 "来嘛，我们为什么不能找点乐子？让我们看看一些动物被烧死的场景吧!"
 yazd.0040.info:0 "#emphasis 历史背景：#!中世纪时期，一些史料，如11世纪伟大的伊朗学者比鲁尼，提到了在萨德节庆祝活动中，动物被点燃的情况。比鲁尼等人谴责这种做法是残忍和非伊斯兰教的，而其他祆教学者似乎也持有相同的观点。然而，这种习俗在当时的伊朗国王中似乎很流行。有可能这种做法不仅是伊斯兰教之前的，而且也是非祆教的起源，但如果是这样的话，它的最初目的就不得而知了。"
 yazd.0041.t:0 "跳舞"
 yazd.0041.desc:0 "在萨德节期间，我们点燃巨大的篝火以抵御邪恶的寒冷。但我们不只是站在那里欣赏辉煌的火焰 我们还跳舞！我们一起围着火堆转了一大圈，然后跳舞。"
 yazd.0041.a:0 "当然，我也加入了跳舞的行列——我为什么不呢？"
 yazd.0041.b:0 "我决定坐下来，享受每个人的美好时光。"
 yazd.0042.t:0 "查克查克"
 yazd.0042.desc:0 "我没有像许多人那样在城里的大篝火中庆祝萨德节，而是趁这个机会在庆祝活动中做一些更有精神意义的事情。按照[yazd_county.GetNameNoTier]附近地区的习俗，我将去查克查克山洞，在那里渡过萨德节。\n\n虽然沿途状况并不糟糕的。但是我们必须穿过一部分沙漠才能到达那里，而且也要一天左右的路程。\n\n不过看到查克查克悬崖映入眼帘感觉一切都值得，按照习俗，一旦看到那里的寺庙，就必须下马徒步行走。此外当地村民似乎已经为萨德节做了准备。"
 yazd.0042.a:0 "是时候徒步过去了"
 yazd.0043.t:0 "圣水"
 yazd.0043.desc:0 "在查克查克洞庆祝萨德节的时候，许多笃信者会趁机喝下那里圣泉里的水。传说中该泉水是由山流下的眼泪形成的，以纪念萨珊王朝的公主妮巴​​努。"
 yazd.0043.a:0 "啜饮这些水是一种福气。"
 yazd.0044.t:0 "妮巴​​努的手杖"
 yazd.0044.desc:0 "在查克查克村的圣泉附近，有一棵古树，据说是由妮巴​​努的手杖长成的。这是一个令人印象深刻，也是一个引起人们敬畏的古树。"
 yazd.0044.a:0 "想想看，这么多年过去了，它仍然耸立在这里。"
 yazd.0045.t:0 "永恒之火"
 yazd.0045.desc:0 "查克查克洞穴内的火已经燃烧了很久，这不仅证明了它的神圣性，也是[ROOT.Char.GetFaith.HighGodName]的荣耀，而这荣耀也归于[ROOT.Char.Custom('DefaultPriestTitlePlural')]和其他日夜努力工作以确保它持续燃烧的俗人。在萨德节期间，围绕它举行特别的仪式，比如现在正在发生的事情。"
 yazd.0045.a:0 "正是因为他们，我才能在萨德节期间看到这里燃烧的火焰。"
 yazd.0046.t:0 "真是善念、善言、善行啊"
 yazd.0046.desc:0 "当我在萨德节期站在查克查克的永恒之火旁，我记得[ROOT.Char.GetFaith.GetAdjective]信仰的真谛：善念、善言和善行。只要我们都这么做，正义、公正和幸福就会永远存在于这个世界上，就像我面前的火永远燃烧着一样。"
 yazd.0046.a:0 "我必须铭记这个……"
 yazd.0047.t:0 "捐赠"
 yazd.0047.desc:0 "在我参观查克查克洞的寺庙时，我注意到摆放在一旁的托盘，这是用来接收像我一样的朝圣者和游客的捐款。这些可以帮助[ROOT.Char.Custom('DefaultPriestTitlePlural')]在这个纷乱的时代维持这个寺庙。也许我在这里的时候应该捐献一些？"
 yazd.0047.a:0 "我已经在全年帮助[ROOT.Char.Custom('DefaultPriestTitlePlural')]，现在为什么还要付出？"
 yazd.0047.b:0 "适度的捐赠就足够了"
 yazd.0047.c:0 "一个体面的捐赠就不错。"
 yazd.0047.d:0 "荣耀归于[ROOT.Char.GetFaith.HighGodName]！卷！大大滴捐赠！"
 yazd.0048.t:0 "xxxxx"
 yazd.0048.desc:0 "xxxxx"
 yazd.0048.a:0 "xxxxx"
 yazd.0049.t:0 "xxxxx"
 yazd.0049.desc:0 "xxxxx"
 yazd.0049.a:0 "xxxxx"
 yazd.0050.t:0 "亚兹德的古代宝藏"
 yazd.0050.desc:0 "在[yazd_county.GetNameNoTier]，关于宝藏的传说比比皆是，而且在该地区流传了好几代。如果这些故事是可信的，那么这些宝藏是由古代波斯王朝在几个世纪中陆陆续续埋下的。\n\n当然很少有人能够发现宝藏。比如最近有人告诉我，在我位于[yazd_county.GetNameNoTier]的领地内发现了这样一个宝藏，结果里面什么都没有"
 yazd.0050.a:0 "也许有一天我们会找到这些传说中丢失的宝藏。"
 yazd.0050.b:0 "寻找这些愚蠢的民间传说是在浪费生命，但人们一直相信它!"
 yazd.0051.t:0 "坎儿井合约"
 yazd.0051.desc:0 "多年来，[yazd_county.GetNameNoTier]的坎儿井工匠一直以其制作坎儿井的技术而闻名，他们制作的被认为是伊朗世界上最好的坎儿井之一。最近他们中有相当一部分人获得在该地区其他地方建造坎儿井的合约，这进一步提高他们的声望。"
 yazd.0051.a:0 "我为他们的成功而感到高兴。"
 yazd.0052.t:0 "学者与花园"
 yazd.0052.desc:0 "随着[yazd_county.GetNameNoTier]的不断发展，这里吸引了更多有学识、有教养的人在此定居，他们中的许多人都在称赞这座城市的花园之美。许多最著名的花园是为了纪念过去居住并捐赠了资金的知名人士而建造的。\n\n今天我参观了其中一个花园，与一些当地学者会面，就像平时那样。当我们在花园放松的时候，我们愉快地谈论了各种事情。"
 yazd.0052.a:0 "这些学者为我提供了非常有启发性的建议！"
 yazd.0052.b:0 "这是一个枯燥但必要的过程，以保持我的地位。"
 yazd.0052.c:0 "我从他们身上学到的智慧使我更接近[ROOT.Char.GetFaith.HighGodName]"
 yazd.0053.t:0 "更换神殿？"
 yazd.0053.desc:0 "[yazd_county.GetNameNoTier]曾经是祆教的中心，所以城市里有很多寺庙，祆教团体仍然在利用。然而在我的领导下，[ROOT.Char.GetFaith.GetAdherentNamePlural]的人数在[yazd_county.GetNameNoTier]不断膨胀，其中一些人要求我出资建造一个新的[ROOT.Char.GetFaith.HouseOfWorship]。\n\n在过去，我们曾经用一座新的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]来取代[yazd_county.GetNameNoTier]的祆教寺庙，以便满足不断扩大的[ROOT.Char.GetFaith.GetAdjective]团体的精神需求。我正在考虑现在就下令做这样一件事，但这样做可能会让当地的祆教徒不高兴，我们与他们的关系很紧张，但也是领主的责任。"
 yazd.0053.a:0 "拆掉旧庙，建一个[ROOT.Char.GetFaith.HouseOfWorship]，这是我们的权利。"
 yazd.0053.b:0 "我们有足够的[ROOT.Char.GetFaith.HouseOfWorshipPlural]，我们需要与我们的邻居和睦相处。"
 yazd.0054.t:0 "一个新建筑？"
 yazd.0054.desc:0 "作为#italic 著名的礼拜场所#!，[yazd_county.GetNameNoTier]以其居民的虔诚而闻名，无论其宗教信仰如何，也不管这样的名声是否真实。许多居住在该市或与该市有联系的精英，比如我，经常找到机会赞助在那里建造不同的礼拜堂。\n\n无论如何，我目前有一个赞助机会在手。城里有一个空旷的地方，可以成为一座不错的建筑，可以满足[ROOT.Char.GetFaith.GetAdjective]社区的需要。但不会是一座巨大的建筑，它甚至会有些简陋，但如果我为它的建设捐献一些资金，它可以很好地反映我虔诚和仁慈。"
 yazd.0054.a:0 "在那里建一个[ROOT.Char.GetFaith.HouseOfWorship]，供当地人敬拜和祈祷。"
 yazd.0054.b:0 "在那里建一所学校，以便年轻一代可以从[ROOT.Char.GetFaith.ReligiousText]中学习。"
 yazd.0054.c:0 "为纪念一位受欢迎的[ROOT.Char.Custom('DefaultPriestTitle')]而建造一座陵墓，以激励当地人。"
 yazd.0054.d:0 "我现在对赞助建筑项目不感兴趣。"
 yazd.0055.t:0 "亚兹德丝绸"
 yazd.0055.desc:0 "[yazd_county.GetNameNoTier]长期以来，一直是波斯丝绸生产的区域中心之一。虽然这种被称为#italic 亚兹德丝绸#!的丝绸在质量上无法与中国丝绸竞争，但它仍然能卖出一个体面的价格，是该城受欢迎的出口产品之一。\n\n最近它变得更加流行，也许是由于经济的各种变化或其他地方需求的增加。无论如何它正在为该市的商人带来更大的利润。"
 yazd.0055.a:0 "太好了！听到这真是高兴！"
 yazd.0056.t:0 "阿巴尔柏树"
 yazd.0056.desc:0 "今天我访问了离[yazd_county.GetNameNoTier]不太远的[abarquh_barony.GetNameNoTier]。途中，我经过了#italic Sarv‑e Abarkuh#!，也叫阿巴尔柏树。这棵树非常古老和雄伟，当地的祆教徒声称这棵树是琐罗亚斯德（古波斯先知，祆教创始人）本人在几百年前种下的。"
 yazd.0056.a:0 "我怀疑这并不是琐罗亚斯德亲手种的，但它是一棵好树。"
 yazd.0056.b:0 "虽然我是一个[ROOT.Char.GetFaith.GetAdherentName]，但看到这棵树，我也感到敬畏。"
 yazd.0056.c:0 "能看到这样的古树是一种荣幸！找个地方放松一下。"
 yazd.0056.d:0 "作为一个[ROOT.Char.GetFaith.GetAdherentName]，我并不太关心它。"
 yazd.0056.e:0 "这是一个神圣的地方，我应该在这里祈祷一下。"
 yazd.0057.t:0 "沙漠中的宝石"
 yazd.0057.desc:0 "我正在[yazd_county.GetNameNoTier]接待一位重要的贵宾，向他展示这个城市的神奇。他印象最深的一件事似乎是城市中存在大量的坎儿井系统和捕风塔。\n\n“真的，[yazd_county.GetNameNoTier]是沙漠中的一颗明珠，”该男子说，“它竟然有如此美妙的设施。”"
 yazd.0057.a:0 "我非常同意你的观点。这是一个真正美丽的地方！"
 yazd.0057.b:0 "如果没有当地人的辛勤工作，这是不可能的。"
 yazd.0058.t:0 "亚兹德的果仁蜜饼"
 yazd.0058.desc:0 "几个世纪以来，[yazd_county.GetNameNoTier]一直以制作全波斯最好的果仁蜜饼而闻名。我恰好拿到了一下，这是我治下的一些当地人送给我的礼物。这里在波斯制作的果仁蜜饼比其他地方的果仁蜜饼要轻一些，它的一个独特之处在于蜜饼内部是由玫瑰水和小豆蔻调制而成的。"
 yazd.0058.a:0 "美味的果仁蜜饼......太，太美味了。"
 yazd.0059.t:0 "沙漠之旅"
 yazd.0059.desc:0 "今天我需要去离[yazd_county.GetNameNoTier]不太远的一个村庄巡查。然而返程有点艰难，因为[yazd_county.GetNameNoTier]位于#italic 卡维尔盐漠#!和#italic 卢特沙漠#!之间，所以聚居地周围的荒野往往是一个炙热、干旱的地方。我汗流浃背，终于进城了，真是如释重负！[yazd_county.GetNameNoTier]的花园、坎儿井和捕风器这些设施，让行走一天的人感觉到置身于天堂之中。"
 yazd.0059.a:0 "我很高兴我做到了！"
