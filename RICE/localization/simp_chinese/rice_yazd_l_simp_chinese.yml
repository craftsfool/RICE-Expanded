 RICE_yazd_sadeh_festival_guest_memory_second_perspective:0 "你与[host.GetTitledFirstName]一同庆祝[GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]"
 RICE_yazd_sadeh_festival_guest_memory_third_perspective:0 "[owner.GetName]与[host.GetTitledFirstName]一同庆祝[GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]"
 activity_RICE_yazd_sadeh_festival:0 "萨德节"
 activity_RICE_yazd_sadeh_festival_desc:0 "冬日的寒风席卷大地，意味着波斯世界的传统冬季庆典——萨德节即将到来。"
 activity_RICE_yazd_sadeh_festival_selection_tooltip:0 "在你的[capital|E]举办一场盛大的萨德庆典。\n\n$RICE_yazd_celebrate_sadeh_festival_context_tooltip$"
 activity_RICE_yazd_sadeh_festival_host_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[GetModifier('RICE_yazd_recently_celebrated_sadeh').GetNameWithTooltip][character_modifier|E]"
 activity_RICE_yazd_sadeh_festival_guest_desc:0 "$activity_RICE_yazd_sadeh_festival_host_desc$"
 activity_RICE_yazd_sadeh_festival_province_desc:0 ""
 activity_RICE_yazd_sadeh_festival_destination_selection:0 "$activity_RICE_yazd_sadeh_festival_province_desc$"
 activity_RICE_yazd_sadeh_festival_guest_help_text:0 "$activity_RICE_yazd_sadeh_festival$"
 activity_RICE_yazd_sadeh_festival_predicted_cost:0 "温泉之旅的成本取决于你选择的[activity_options|E]。"
 activity_RICE_yazd_sadeh_festival_conclusion_desc:0 "[GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]已经结束，这是一次有趣且轻松的体验！"
 RICE_yazd_sadeh_festival_type:0 "节庆规模"
 RICE_yazd_sadeh_festival_type_modest:0 "节制庆典"
 RICE_yazd_sadeh_festival_type_modest_desc:0 "$EFFECT_LIST_BULLET$你的[court|E]将举办一场适度的、普通的萨德节。\n$EFFECT_LIST_BULLET$在其他活动奖励之外额外获得#V 50#![prestige_i|E]\n\n#weak 萨德节是一年中重要的节日，但我们应该注意在庆祝时不要太过火，要节俭。#!"
 RICE_yazd_sadeh_festival_type_grand:0 "盛大庆典"
 RICE_yazd_sadeh_festival_type_grand_desc:0 "$EFFECT_LIST_BULLET$你的[court|E]将举办一场花费更多的萨德节。\n$EFFECT_LIST_BULLET$在其他活动奖励之外额外获得#V 150#![prestige_i|E]\n\n#weak 萨德节是一年中最冷之时，为了驱逐邪恶与黑暗，必须要有真正的节日氛围！#!"
 RICE_yazd_sadeh_festival_type_chak_chak:0 "圣地庆典"
 RICE_yazd_sadeh_festival_type_chak_chak_desc:0 "$EFFECT_LIST_BULLET$你的[court|E]将前往去[GetTitleByKey('c_yazd').GetName]的查克查克附近举办萨德节。\n$EFFECT_LIST_BULLET$在其他活动奖励之外额外获得#V 150#![piety_i|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_yazd_recently_celebrated_sadeh_chak_chak').GetNameWithTooltip]而非普通[modifier|E]\n$EFFECT_LIST_BULLET$$yazd.0030.chak_chak.tooltip$\n\n#weak 特别的[GetPlayer.GetFaith.GetReligion.GetAdjective]仪式将在萨德期间于查克查克附近举行。如果可以的话，我们应当参与其中，证明我们身为[GetPlayer.GetFaith.GetAdherentNamePlural]的虔诚。#!"
 RICE_yazd_sadeh_festival_festival_phase:0 "节日"
 RICE_yazd_sadeh_festival_festival_phase_desc:0 "萨德节正在进行中!"
 RICE_yazd_sadeh_festival_fun_intent_header:0 "享乐："
 RICE_yazd_sadeh_festival_fun_intent:0 "享乐"
 RICE_yazd_sadeh_festival_fun_intent_desc:0 "你想在萨德节玩得开心，你会失去[stress|E]，如果你拥有[GetTrait('gregarious').GetName( GetNullCharacter )]或[GetTrait('gluttonous').GetName( GetNullCharacter )]特质，则会失去更多。"
 RICE_yazd_sadeh_festival_spectacle_intent_header:0 "宣威："
 RICE_yazd_sadeh_festival_spectacle_intent:0 "宣威"
 RICE_yazd_sadeh_festival_spectacle_intent_desc:0 "你想通过萨德节来彰显你的宫廷威严。拥有[GetTrait('ambitious').GetName( GetNullCharacter )|U]、[GetTrait('diligent').GetName( GetNullCharacter )]或[GetTrait('arrogant').GetName( GetNullCharacter )]特质的角色可能失去额外的[stress|E]，[king|E]和[emperor|E][rank|E]角色也将获得少量的[grandeur|E]。"
 RICE_yazd_sadeh_festival_poetry_intent_header:0 "感悟："
 RICE_yazd_sadeh_festival_poetry_intent:0 "感悟"
 RICE_yazd_sadeh_festival_poetry_intent_desc:0 "你想在萨德期间获得些许感悟并写诗，你会得到一个关于诗歌的事件，以获得一个正面[modifier|E]。你还会从这个事件中获得[prestige|E]和[piety|E]（通常不会获得）。"
 RICE_yazd_sadeh_festival_zoroastrian_intent_header:0 "扬善"
 RICE_yazd_sadeh_festival_zoroastrian_intent:0 "扬善"
 RICE_yazd_sadeh_festival_zoroastrian_intent_desc:0 "在每年这个重要的时刻，你要专注于#italic 善念，良言，佳行#!。拥有[GetTrait('zealous').GetName( GetNullCharacter )|U]、[GetTrait('just').GetName( GetNullCharacter )]或[GetTrait('honest').GetName( GetNullCharacter )]特质的角色可能失去额外[stress|E]。你也将在其他获得[piety|E]奖励的基础上额外获得[piety_i|E]#V 25#!"
 RICE_yazd_sadeh_festival_completed_log_title:0 "参加完萨德节的活动"
 RICE_yazd_sadeh_festival_completed_log:0 "[CHARACTER.GetShortUIName|U]参加完萨德节的活动"
 TRAVEL_NAME_FOR_activity_RICE_yazd_sadeh_festival:0 "[Character.GetFirstNamePossessiveNoTooltip]$activity_RICE_yazd_sadeh_festival$"
 RICE_yazd_sadeh_festival_grand_cost_amount:0 "大萨德节"
 RICE_yazd_sadeh_festival_chak_chak_cost_amount:0 "查克查克的萨德节"
 RICE_yazd_sadeh_festival_poetry_intent_req:0 "你需要有[GetTrait('lifestyle_poet').GetName( GetNullCharacter )]或[GetTrait('erudite').GetName( GetNullCharacter )][traits|E]，或者[diplomacy|E]或[learning|E]至少处于#bold [EmptyScope.ScriptValue('medium_skill_rating')|0]#!"
 NOT_RICE_yazd_sadeh_festival_poetry_intent_req:0 "$RICE_yazd_sadeh_festival_poetry_intent_req$"
 RICE_every_persian_turkic_county:0 "在[GetGeographicalRegion('world_middle_east_persia').GetName]的每个你[completely_control|E]且[culture|E]属于$heritage_turkic_name$[heritage|E]的[county|E]"
 RICE_yazd_aspiration_qawurd_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$成为[GetTitleByKey('e_persia').GetNameNoTier]的[ruler|E]\n$EFFECT_LIST_BULLET$[completely_control|E][GetTitleByKey('k_persia').GetNameNoTier]和[GetTitleByKey('k_mesopotamia').GetNameNoTier]\n$EFFECT_LIST_BULLET$[culture|E]保存$heritage_turkic_name$[heritage|E]\n\n#bold 完成奖励：#!\n$EFFECT_LIST_BULLET$获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#![prestige|E]\n$EFFECT_LIST_BULLET$获得#V 500#!名[GetMaA('horse_archers').GetName][special_troops|E]\n$EFFECT_LIST_BULLET$你所有位于[GetGeographicalRegion('world_middle_east_persia').GetName]的，且[culture|E]为拥有$heritage_turkic_name$[heritage|E]的[culture|E]的[county|E]增长@control_icon!#V [EmptyScope.ScriptValue('RICE_yazd_qawurd_aspiration_control_bonus')]#![control|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$杀死阿尔普·阿尔斯兰及其子马利克沙（奖励：杀死一人获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#!，如果你直接杀死了至少一人，则获得@prestige_icon!#V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#!）"
 RICE_yazd_historical_aspiration_action_qawurd:0 "#italic 你作为家中的长子，但却没能统治塞尔柱帝国，这无疑是一种耻辱！你渴望恢复塞尔柱人的古老传统，夺回属于你的皇位。#!$RICE_yazd_aspiration_qawurd_desc$"
 RICE_yazd_historical_aspiration_modifier_desc_qawurd:0 "[GetModifier('RICE_yazd_aspiration_claim_seljuk_throne').GetNameWithTooltip]"
 RICE_yazd_aspiration_claim_seljuk_throne:0 "[RICE_aspiration|E]：夺取塞尔柱皇位"
 RICE_yazd_aspiration_claim_seljuk_throne_desc:0 "#italic 卡乌德虽是长子，但却没能统治塞尔柱帝国，这无疑是一种耻辱。他希望让塞尔柱人回归古老的传统，夺回他合法的皇位。#!$RICE_yazd_aspiration_qawurd_desc$\n\n"
 RICE_yazd_build_a_new_qanat_effect_tooltip_5:0 "若你的[culture|E]拥有#bold $tradition_fp3_irrigation_experts_name$#![tradition|E]，你将获得更多[prestige_i|E][prestige|E]，且该[county_modifier|E]的生效时间将由10年延长为#V 15#!年"
 yazd.0009.qawurd.tooltip:0 "#bold 卡乌德的[RICE_aspiration|E]：夺取塞尔柱皇位#!$RICE_yazd_aspiration_qawurd_desc$\n"
 RICE_dynn_ibn_rusta:0 "伊本·鲁斯塔"
 RICE_dynn_yaqubi:0 "叶尔孤白"
 innovation_RICE_yakhchals:0 "冰窖"
 innovation_RICE_yakhchals_desc:0 "伊朗高原上，尤其是那些生活在干旱地区的人们自古以来就懂得利用[Glossary( '冰窖', 'YAKHCHAL_GLOSS' )]来储存冰块。这些冰窖设计巧妙，能够长时间储存冰块，用于保存食物，或者准备冰糕、冰镇酒等冷食。"
 RICE_yakhchals_decision_unlock:0 "为[capital|E]或[domicile|E]拥有该[culture|E]的[rulers|E]解锁$RICE_yazd_purchase_yakhchal_ice$[decision|E]"
 RICE_yazd_yakhchal_adventurer_modifier:0 "来自冰窖的冰"
 RICE_yazd_yakhchal_adventurer_modifier_desc:0 "该角色近期购买了来自[Glossary( '冰窖', 'YAKHCHAL_GLOSS' )]的冰。"
 RICE_yazd_yakhchal_landed_modifier:0 "$RICE_yazd_yakhchal_adventurer_modifier$"
 RICE_yazd_yakhchal_landed_modifier_desc:0 "$RICE_yazd_yakhchal_adventurer_modifier_desc$"
 RICE_yazd_purchase_yakhchal_ice:0 "从当地冰窖购买冰"
 RICE_yazd_purchase_yakhchal_ice_tooltip:0 "几个世纪以来，[GetGeographicalRegion('world_middle_east_persia').GetName]的人们一直使用[Glossary( '冰窖', 'YAKHCHAL_GLOSS' )]来储存冰块。"
 RICE_yazd_purchase_yakhchal_ice_desc:0 "我得去当地的[Glossary( '冰窖', 'YAKHCHAL_GLOSS' )]补充点冰块，好让我的食物和饮料保持新鲜。另外，我也该来点冰糕尝尝了！"
 RICE_yazd_purchase_yakhchal_ice_effect_tooltip_1:0 "该[decision|E]的效果因你是否是[adventurer|E]而异。"
 RICE_yazd_purchase_yakhchal_ice_confirm:0 "拜访当地冰窖"
 RICE_yazd_purchase_yakhchal_ice_context_tooltip:0 "#emphasis 历史背景：#![Glossary( '冰窖', 'YAKHCHAL_GLOSS' )]是伊朗用来储存冰雪的传统建筑，在炎热干旱的[GetGeographicalRegion('world_middle_east_persia').GetName]地区尤为流行。根据历史资料显示，旅行者和当地人都会从当地的冰窖购买冰块，用来保存食物或制作冰糕和冰镇酒等食品和饮品。"
 RICE_yazd_decision_yakhchal_landless_req:0 "[domicile|E]所在[county|E]的[culture|E]拥有$innovation_RICE_yakhchals$[innovation|E]"
 RICE_yazd_decision_yakhchal_landed_req:0 "[capital|E]所在[county|E]的[culture|E]拥有$innovation_RICE_yakhchals$[innovation|E]"
