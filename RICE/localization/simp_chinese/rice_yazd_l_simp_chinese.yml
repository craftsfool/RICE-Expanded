 innovation_RICE_qanats:0 "坎儿井"
 innovation_RICE_qanats_desc:0 "在中东和北非的大部分地区，都有专门的运河和地下渡槽网络，旨在将水输送到最需要的地方。这些工程壮举被称为坎儿井，自古波斯时代就已存在。"
 RICE_yazd_qanat_decision_unlock:0 "可以能采用[decision|E]决议来#V $RICE_yazd_build_a_new_qanat$#!"
 RICE_yazd_jays_al_sorat_spawn_event_troops:0 "哈里人"
 activity_yazd_sadeh_festival:0 "萨德节"
 activity_yazd_sadeh_festival_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]萨德节庆"
 activity_yazd_sadeh_festival_chak_chak:0 "萨德节上的恰克恰克（一种食物）"
 activity_yazd_sadeh_festival_chak_chak_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]萨德节上的恰克恰克（一种食物）"
 building_type_RICE_yazd_arg_e_bam_01:0 "巴姆古城"
 building_type_RICE_yazd_arg_e_bam_01_desc:0 "巴姆古城是世界上最大的土坯建筑群，也是一座气势恢宏、坚不可摧的堡垒，已经存在了几个世纪，是哈夫特瓦德的首都，他是萨珊王朝创始人阿尔达希尔一世的劲敌。堡垒由三层城墙组成，周围有一条大护城河；里面是一座独立的城市，有商店、礼拜堂和房屋。"
 building_RICE_yazd_arg_e_bam_01:0 "$building_type_RICE_yazd_arg_e_bam_01$"
 building_RICE_yazd_arg_e_bam_01_desc:0 "$building_type_RICE_yazd_arg_e_bam_01_desc$"
 RICE_yazd_saffarid_yaqub:0 "铜匠"
 RICE_yazd_saffarid_yaqub_desc:0 "雅各布·伊本·莱伊斯曾经是一名铜匠，后来成为军阀与伊朗的哈瓦利吉派信徒作战。虽然军阀和精英出身的贵族可能会嘲笑他的卑微出身，但他知道如何与普通人相处，据说他成为军阀后仍然过着相当节俭和谦虚的生活。\n\n可以采取[decision|E]决议来征召#EMP 哈里人#!单位，无论首都在哪里，即使在自己的[counties|E]不在[domain|E]也可以征召。"
 RICE_yazd_saffarid_amr:0 "骡夫与石匠"
 RICE_yazd_saffarid_amr_desc:0 "与他的兄弟们类似，阿姆尔·伊本·莱斯在登基前也是出身卑微，同样以节俭和谦虚的生活方式而闻名，据说他以前是一名骡夫或石匠，他的职业取决于何人询问。\n\n可以采取[decision|E]来征召#EMP 哈里人#!单位，无论首都在哪里，即使在自己的[counties|E]不在[domain|E]也可以征召。"
 RICE_yazd_saffarid_ali:0 "谦虚的勇士"
 RICE_yazd_saffarid_ali_desc:0 "虽然不像他的兄弟雅各布那样声名显赫，但阿里却广受许多战士的尊敬。同他的兄弟雅各布和阿姆尔一样，在他们崛起之前，他也是出身卑微，而且他的生活方式也很节俭和朴素。\n\n可以采取[decision|E]来征召#EMP 哈里人#!单位，无论首都在哪里，即使在自己的[counties|E]是[domain|E]也可以征召。"
 RICE_yazd_saffarid_yaqub_reduce_fertility:0 "动机不明的歹徒"
 RICE_yazd_saffarid_yaqub_reduce_fertility_desc:0 "有人说雅各布·本·莱伊斯·萨法尔是穆斯林笃信者，他将不惜一切代价捍卫穆斯林信仰，反对异端和异教徒。还有人说他是一个机会主义的、贪婪的军阀，就像其他许多人一样。还有人说他是一个秘密的哈瓦利吉派信徒，他的灵感完全来自对哈里发的敌意。谁知道他真正的忠诚在哪里？"
 RICE_yazd_patrons_of_avicenna:0 "伊本·西纳的赞助人"
 RICE_yazd_patrons_of_avicenna_desc:0 "伟大的卡库伊埃米尔阿拉·达乌拉·穆罕默德是伊本·西纳的最后赞助人，伊本·西纳是一位举世瞩目天才伊斯兰学者，连他的诋毁者都不得不承认他那无与伦比影响力。伊本·西纳在卡库伊王朝受到了极大的尊重，并一直担任卡库伊王朝的廷臣，直到他于公元1037年去世。卡库伊家族延续了这一传统，在他们统治的地区支持文化事业，并资助学者和艺术家。\n\n采用[decision|E]的决议来#V 扩展雅兹德基建#!并获得额外的[prestige|E]和[dynasty_prestige|E]"
 RICE_yazd_sebuk_eri:0 "扎布列斯坦的奴隶士兵"
 RICE_yazd_sebuk_eri_desc:0 "阿布·曼苏尔·苏布克特勤是被在萨曼王朝加兹尼总督阿尔普特勤对樽比勒王国的一次远征中作为奴隶被捕的。然而从那时起他已经证明自己是一个有能力的军事指挥官。然而他的野心会使他寻求更大的荣耀和权力……"
 RICE_yazd_abode_of_worship_ruler:0 "膜拜之所领主"
 RICE_yazd_abode_of_worship_ruler_desc:0 "亚兹德已被普遍称为#italic dār al‑'ibāda#!，既膜拜之所。它因吸引了许多学者而闻名，也因其居民的宗教信仰而闻名，无论他们是穆斯林、祆教徒，还是其他信仰的人。作为亚兹德的统治者，gau该角色因此从亚兹德的信仰和文化中获益匪浅。\n\n#EMP 这个[character_modifier|E]是给目前统治亚兹德之人#!"
 RICE_yazd_city_of_windcatchers:0 "捕风之城"
 RICE_yazd_city_of_windcatchers_desc:0 "由于亚兹德位于#italic 卡维尔盐漠#!的边缘，广阔无垠的沙漠带来浩浩的风沙，亚兹德则利用捕风塔来捕获和引导空气以提供自然通风和冷却，因此获得“捕风之城”的绰号。该市还以其庞大的坎儿井水道网络而闻名，总的来说，亚兹德的基础设施足以支撑一座城市舒服的居住。\n\n当亚兹德的[ruler|E]建造坎儿井在采取[decision|E]#V 资助建造坎儿井#!的时候就会减少。"
 RICE_funded_qanat_small:0 "资助建造一个小型坎儿井"
 RICE_funded_qanat_small_desc:0 "该角色最近捐赠了一些资金以便当地人能够建造一个坎儿井，一种在中东和北非无处不在的地下运水道。"
 RICE_qanat_constructed_small:0 "最近建成的小型坎儿井"
 RICE_qanat_constructed_small_desc:0 "最近一位当地的精英慷慨地赞助在这个地区建造了一条新的坎儿井通道。虽然它的规模不大，但它应该能很好地满足它所在区域的需求。"
 RICE_funded_qanat_medium:0 "资助建造一个中型坎儿井"
 RICE_funded_qanat_medium_desc:0 "$RICE_funded_qanat_small_desc$"
 RICE_qanat_constructed_medium:0 "最近建成的中型坎儿井"
 RICE_qanat_constructed_medium_desc:0 "最近一位当地的精英慷慨地赞助在这个地区建造了一条新的坎儿井通道。它的规模不小，无疑将为它所在的地区提供很多淡水。"
 RICE_funded_qanat_large:0 "资助建造一个大型坎儿井"
 RICE_funded_qanat_large_desc:0 "$RICE_funded_qanat_small_desc$"
 RICE_qanat_constructed_large:0 "最近建成的大型坎儿井"
 RICE_qanat_constructed_large_desc:0 "最近一位当地的精英慷慨地赞助在这个地区建造了一条新的坎儿井通道。这条网络相当大，将保证长期为所建地区提供可靠、良好的水供应"
 RICE_funded_qanat_grand:0 "资助建造一个巨型坎儿井"
 RICE_funded_qanat_grand_desc:0 "$RICE_funded_qanat_small_desc$"
 RICE_qanat_constructed_grand:0 "最近建成的巨型坎儿井"
 RICE_qanat_constructed_grand_desc:0 "最近一位当地的精英慷慨地赞助在这个地区建造了一条新的坎儿井通道。没有太多坎儿井能和这个坎儿井的规模相比，毫无疑问当地以这个坎儿井自豪。"
 RICE_yazd_recently_celebrated_sadeh:0 "最近萨德节庆典"
 RICE_yazd_recently_celebrated_sadeh_chak_chak:0 "最近在萨德节参观过恰克恰克"
 RICE_yazd_kakuyid_reconciled:0 "在之前的冲突之后和解了"
 RICE_yazd_shrine_of_the_twelve_imams_recently_constructed:0 "最近建造的十二伊玛目圣陵"
 RICE_yazd_shrine_of_the_twelve_imams_recently_constructed_desc:0 "十二伊玛目圣陵，是亚兹德的一座陵墓，除了运用了波斯最新的建筑创新，还相当漂亮，令人敬畏。"
 RICE_yazd_constructed_shrine_of_the_twelve_imams:0 "下令建造十二伊玛目圣陵"
 RICE_yazd_constructed_shrine_of_the_twelve_imams_desc:0 "$RICE_yazd_shrine_of_the_twelve_imams_recently_constructed_desc$"
 RICE_yazd_kerman_pistachios:0 "克尔曼的开心果农场"
 RICE_yazd_kerman_pistachios_desc:0 "著名的克尔曼开心果，生长在城市附近的农田里，是其主要出口产品之一。"
 RICE_yazd_qawurd_seljuk:0 "塞尔柱家族的长子"
 RICE_yazd_qawurd_seljuk_desc:0 "作为查格里·别哥的长子和阿尔普·阿尔斯兰的哥哥，雄心勃勃的卡乌德在塞尔柱人中备受尊敬。他被赞誉为一个公正、强大的领袖，他将塞尔柱人的统治从阿拉伯海扩展到阿曼。有传言说他把塞尔柱王位看作是自己与生俱来的权利，因为他在塞尔柱军队中相当受欢迎，也相信按资历继承王位的传统。\n\n开局拥有波斯帝国[unpressed_claim|E]。\n对阿尔普·阿尔斯兰的[opinion|E]较低，同理阿尔普·阿尔斯兰也不喜欢你"
 RICE_yazd_alp_arslan_distrust_qawurd:0 "不信任雄心勃勃的塞尔柱家族长子"
 RICE_yazd_qawurd_resent_alp_arslan:0 "对塞尔柱继承权的不满"
 RICE_yazd_treasure_reports:0 "听取传说中的亚兹德宝藏的汇报"
 RICE_yazd_qanat_makers_contracts:0 "坎儿井制造商的更多合同"
 RICE_yazd_qanat_makers_contracts_desc:0 "亚兹德的坎儿井制造商一直被认为是波斯最好的一些制造商，最近他们被雇佣在整个地区做比平时更多的工作。"
 RICE_yazd_new_yazd_mosque:0 "亚兹德的新礼拜堂"
 RICE_yazd_built_new_yazd_mosque:0 "资助一个全新的亚兹德礼拜堂"
 RICE_yazd_new_yazd_mosque_muslim_opinion:0 "在亚兹德的建造一个新的礼拜堂"
 RICE_yazd_new_yazd_mosque_zoroastrian_opinion:0 "取代亚兹德的祆教寺庙"
 RICE_yazd_built_house_of_worship:0 "在亚兹德建造的礼拜堂"
 RICE_yazd_built_house_of_worship_desc:0 "该角色最近提供了一笔资金，在亚兹德资助建造一个新的小型礼拜堂。它将满足该市虔诚居民的精神需求。"
 RICE_yazd_built_school:0 "在亚兹德建造学院"
 RICE_yazd_built_school_desc:0 "该角色最近提供了一笔资金，在亚兹德资助建造一所新的小学院。这所学院将为亚兹德培养人才。"
 RICE_yazd_built_shrine:0 "在亚兹德建造陵园"
 RICE_yazd_built_shrine_desc:0 "该角色最近提供了一笔资金，资助亚兹德为一位圣人建造一个新的小型陵墓。这位伟人的生平事迹将激励该城的人民多年。"
 RICE_yazd_silk_boom:0 "对亚兹德丝绸需求量增加"
 RICE_yazd_baklava:0 "吃亚兹德的果仁蜜饼"
 RICE_yazd_sadeh_nature_poem:0 "受萨德节上的关于自然的诗篇启发"
 RICE_yazd_sadeh_good_evil_poem:0 "受萨德节上的关于善与恶的诗句启发"
 RICE_yazd_sadeh_hero_poem:0 "受萨德节上的关于古代英雄的诗篇启发"
 RICE_yazd_sadeh_burned_animals:0 "在萨德节期间放火焚烧动物"
 RICE_yazd_sadeh_burned_animals_desc:0 "“虐待动物是一件很有趣的事！”"
 RICE_yazd_sadeh_animal_cruelty_approve:0 "焚烧动物是一种乐趣"
 RICE_yazd_sadeh_animal_cruelty_disapprove:0 "焚烧动物是残忍的行为"
 RICE_yazd_change_xwedodah:0 "解决血亲圣婚的问题"
 RICE_yazd_change_xwedodah_zurvanite:0 "$RICE_yazd_change_xwedodah$"
 RICE_yazd_change_xwedodah_tooltip:0 "为[ROOT.Char.GetFaith.GetName][faith|E]与其他人召开会议，解决围绕这一做法的争论"
 RICE_yazd_change_xwedodah_zurvanite_tooltip:0 "$RICE_yazd_change_xwedodah_tooltip$"
 RICE_yazd_change_xwedodah_desc:0 "#V 血亲圣婚#!是任何[ROOT.Char.GetFaith.GetAdherentName]能做的最伟大的事之一。虽然几个世纪以来这一直是我们无可争议的信仰，但对于它的含义一直存在争议。它是否真正指的是近亲结婚？有些人声称，它应该被定义为表亲婚姻，而不是至亲婚姻。为了一劳永逸地解决这些争论，我希望召集一些学者和[ROOT.Char.Custom('DefaultPriestTitlePlural')]。"
 RICE_yazd_change_xwedodah_effect_tooltip_1:0 "#V 重新解释#![xwedodah_resolver.GetFaith.ReligiousText]改变了[xwedodah_resolver.GetFaith.GetName]的$doctrine_consanguinity_name$[doctrine|E]，只允许表亲结婚，或者#V 强化#!传统观点，即指近亲结婚，任何一种选择都将是#V 永久生效的#!！"
 RICE_yazd_change_xwedodah_effect_tooltip_2:0 "如果在14或15世纪之前，没有任何足够强大的[xwedodah_resolver.GetFaith.GetAdjective]统治者采取这一[decision|E]，那么届时可能会通过事件随机触发变化。"
 RICE_yazd_change_xwedodah_effect_tooltip_3:0 "将[xwedodah_resolver.GetFaith.GetName]的[GetTenetType('tenet_divine_marriage').GetBaseName][core_tenet|E]改成[GetTenetType('tenet_communal_identity').GetBaseName]"
 RICE_yazd_change_xwedodah_confirm:0 "为了[ROOT.Char.GetFaith.HighGodName]的荣耀！"
 RICE_yazd_change_xwedodah_zurvanite_confirm:0 "$RICE_yazd_change_xwedodah_confirm$"
 RICE_yazd_change_xwedodah_context_tooltip:0 "#emphasis 历史背景：#!在古代波斯，除了王室之外，还有一种叫做血亲圣婚的亲属婚姻习俗。这一点在伊朗历史学者中间一般不会引起争议；有争议的是这种婚姻的范围和频率。无论如何，现代祆教徒并#italic #bold 不#!#!进行近亲婚姻，而是像大多数人一样厌恶它。血亲圣婚的解释在近代早期发生了变化，但这种态度转变的原因尚不清楚。这个决定是对这种变化的一个非历史的和象征性的表达。"
 RICE_yazd_celebrate_sadeh_festival:0 "庆祝萨德节"
 RICE_yazd_celebrate_sadeh_festival_tooltip:0 "一年中最寒冷的时节即将来临！"
 RICE_yazd_celebrate_sadeh_festival_desc:0 "冬天的寒冷席卷了整个大地，这意味着现在是萨德节期间，这是源自波斯世界的传统冬季节庆。今年我应该举办一场盛大的萨德节庆祝活动！"
 RICE_yazd_celebrate_sadeh_festival_effect_tooltip_1:0 "你庆祝萨德节，并可能获得各种收益，如获得[prestige|E]或者[piety|E]，或者失去[stress|E]"
 RICE_yazd_celebrate_sadeh_festival_effect_tooltip_2:0 "因为你控制了[yazd_county.GetNameNoTier]并遵循[THIS.Char.GetFaith.GetName][faith|E]，你可以选择额外支付@gold_icon! 25元，去拜访查克查克村，以获得额外的恩惠"
 RICE_yazd_celebrate_sadeh_festival_confirm:0 "我期待着这个！"
 RICE_yazd_celebrate_sadeh_festival_context_tooltip:0 "#emphasis 历史背景：#!萨德节是伊朗传统的冬季节日，距离诺鲁孜节还有50天。在中世纪时期，伊朗的穆斯林和祆教徒都热情地庆祝这个节日，包括一些君主。点燃大篝火是节日活动的核心内容，其中还包括（至少在中世纪时期）一种奇怪的习俗，就是把野兽和鸟类赶进火焰中烧死。无论如何，早期的伊斯兰文献将萨德节的创立归功于史诗英雄胡山，他是偶然发现了火的人，并因此希望纪念这一恩赐。"
 RICE_decision_yazd_sadeh_month_req:0 "月份是11月、12月或1月"
 RICE_yazd_build_a_new_qanat:0 "资助坎儿井的建设"
 RICE_yazd_build_a_new_qanat_tooltip:0 "当地人总是能够使用新的水源。"
 RICE_yazd_build_a_new_qanat_desc:0 "坎儿井是一种地下运河系统，几个世纪以来一直在中东大部分地区修建，为当地人提供可靠的水供应。通过资助建造一个，我可以改善当地人的生活质量。"
 RICE_yazd_build_a_new_qanat_effect_tooltip_1:0 "你的[county_modifier|E]将获得持续10年的[county_capital|E]，你将获得相应的[character_modifier|E]和一些[prestige|E]"
 RICE_yazd_build_a_new_qanat_effect_tooltip_2:0 "这些奖励的强度取决于提供多少资金#weak （最低成本：@gold_icon! 50）#!"
 RICE_yazd_build_a_new_qanat_effect_tooltip_3:0 "这些奖励的强度取决于提供多少资金#weak （最低成本：@gold_icon! 40）#!"
 RICE_yazd_build_a_new_qanat_effect_tooltip_4:0 "因为你控制了[yazd_county.GetNameNoTier]，而且它有[GetModifier('RICE_yazd_city_of_windcatchers').GetNameWithTooltip][county_modifier|E]，资助建设坎儿井的费用就会减少"
 RICE_yazd_build_a_new_qanat_confirm:0 "让我们开始施工吧！"
 RICE_yazd_build_a_new_qanat_context_tooltip:0 "#emphasis 历史背景：#!坎儿井（qanat）是一种地下水渠系统，源于伊朗高原，后来传播到中东、北非和中亚的大部分地区。在这些地区，它也有不同的名称，如北非的福加拉（foggara），中亚的卡瑞兹（karez），阿曼的法拉杰（falaj）等。几个世纪以来，甚至直到今天，它们都被用作这些地区的水源，无论是用于饮用、灌溉、降温等。它们的规模大小不一，从几个农民发起的微小工程，到由地方精英资助的宏大公共工程。"
 RICE_yazd_decision_qanat_requirement:0 "[county_capital|E]在中东、波斯、北非、撒哈拉、塔里木、伊比利亚或西西里[region|E]"
 RICE_yazd_expand_infrastructure:0 "扩大坎儿井设施和基础设施"
 RICE_yazd_expand_infrastructure_tooltip:0 "亚兹德正在繁荣发展，但它可以更加繁荣!"
 RICE_yazd_expand_infrastructure_desc:0 "亚兹德正在迅速发展，甚至正在成为著名的学习和信仰中心。然而如果我们通过建设大型公共工程项目，如坎儿井、学校、陵墓、花园等，扩大其现有的基础设施，我们可以更繁荣，以吸引有学识和有才华的人来到这个城市。"
 RICE_yazd_expand_infrastructure_effect_tooltip_1:0 "从现在开始，[yazd_county.GetNameNoTier]的[ruler|E]将永远获得[GetModifier('RICE_yazd_abode_of_worship_ruler').GetNameWithTooltip][character_modifier|E]"
 RICE_yazd_expand_infrastructure_effect_tooltip_2:0 "作为建设亚兹德学识和繁荣而闻名的#V 卡库伊宗族#!的成员，因此你做出这个[decision|E]可以获得比平时多一倍的[prestige|E]和[dynasty_prestige|E]"
 RICE_yazd_expand_infrastructure_confirm:0 "送给工程师、建筑师和工匠"
 RICE_yazd_expand_infrastructure_context_tooltip:0 "#emphasis 历史背景：#!尽管亚兹德位于沙漠中，但它却是一个绿洲山谷，在几条贸易路线上占据着战略位置。在11世纪，卡库伊王朝的统治时期，这座城市得到了显著的发展，卡库伊家族及其他当地领主建造了许多清真寺、伊斯兰学院、坎儿井和花园。从那时起，这座城市便吸引了该地区许多杰出的学者和名人来访。"
 RICE_yazd_enlist_jays_al_sorat:0 "召集哈里人军队"
 RICE_yazd_enlist_jays_al_sorat_tooltip:0 "召唤阿扎里加派为你作战"
 RICE_yazd_enlist_jays_al_sorat_desc:0 "极度嗜血，他们狂热地致力于屠杀所有教义分歧的人，哪怕是一丁点分歧。但他们仍然是人，而人是可以被说动和说服的。在我的王国里，有一些凶猛的、身经百战的阿扎里加派战士，他们对我足够尊重，可能愿意为我而战，以换取宽恕......以及适当的报酬。"
 RICE_yazd_enlist_jays_al_sorat_confirm:0 "每个人都有他的价格标签，即使是嗜血的狂热者。"
 RICE_yazd_enlist_jays_al_sorat_context_tooltip:0 "#emphasis 历史背景：#!作为最为狂热的哈瓦利吉派分支，阿扎里加派的极端行径甚至连其他哈瓦利吉派的信徒也无法接受。萨法尔王朝的创始人雅各布·伊本·莱斯在伊朗与他们进行了多次战争，从而声名远扬，权势日增。然而，他也成功地将一些阿扎里加派的信徒和平地纳入了自己的军队，组成了一个特殊的部队，称为#italic 哈里人#!。尽管如此，雅各布和他的兄弟们仍然严格地管理着他们的军队，不给哈瓦利吉派的部队留下任何宽松的余地。最终，随着时间的推移，激进的哈瓦利吉派团体在该地区逐渐衰落，被更为温和的信徒所取代，直到最后彻底消失。"
 RICE_yazd_decision_persia_req:0 "[county_capital|E]位于波斯[region|E]"
 RICE_yazd_saffarid_founder_req:0 "是萨法尔王朝开国君主雅各布或他的兄弟吗？"
 RICE_yazd_enlist_county_req:0 "拥有一个追随#V 阿扎里加派#![faith]的[county|E]，并且位于波斯[region|E]"
 RICE_yazd_construct_shrine_of_the_twelve_imams:0 "建造十二伊玛目圣陵"
 RICE_yazd_construct_shrine_of_the_twelve_imams_tooltip:0 "亚兹德将是一个建造什叶派陵墓的好地方。"
 RICE_yazd_construct_shrine_of_the_twelve_imams_desc:0 "亚兹德的什叶派社区建议我们在该市建造一座陵墓。它将被称为#italic Davāzdah Imām#!，或十二位伊玛目神殿，并利用最新的艺术和建筑创新，使其真正成为一个膜拜和冥想的场所。"
 RICE_yazd_construct_shrine_of_the_twelve_imams_effect_tooltip:0 "如果你信仰#V 什叶派#![faith|E]，[piety|E]和[prestige|E]奖励会翻倍"
 RICE_yazd_construct_shrine_of_the_twelve_imams_confirm:0 "下令建造陵墓。"
 RICE_yazd_construct_shrine_of_the_twelve_imams_context_tooltip:0 "#emphasis 历史背景：#!十二伊玛目圣陵，是位于亚兹德的一座陵墓，也是伊斯兰历史上最早的方形穹顶陵墓之一。它的建造是在公元1038年由卡库伊王朝的两位什叶派军官下令的。它具有一些开创性的建筑特征，如使用三叶形拱角（后来成为中世纪伊朗建筑的标志）和比以前的类似建筑更多地运用颜色和彩绘灰泥。"
