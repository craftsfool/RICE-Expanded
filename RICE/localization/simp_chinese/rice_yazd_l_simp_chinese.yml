 yazd.0002.t:0 "东部边疆"
 yazd.0002.desc:0 "在波斯东部那危险而多变的#italic 伊斯兰世界#!边疆，几个军阀争夺着权力——有些是出于对信仰和正义的真诚奉献，有些则不过是机会主义的强盗。\n\n目前，紧张局势已经达到了沸点，阿拔斯王朝任命的名义上的呼罗珊总督[tahirid_guy.GetTitledFirstName]和萨法尔王朝的领袖、广受欢迎但颇有争议的[yaqub_saffarid.GetTitledFirstName]之间的矛盾日益激化。[yaqub_saffarid.GetTitledFirstName]是众多#italic 游侠#!战士的首领，他们曾与异端分子中最残暴的哈瓦利吉派的一支——[bammer_guy.GetFaith.GetAdjective]作战，从而声名远扬。有人说[yaqub_saffarid.GetFirstName]是一个贪婪的背教者，利用塔希尔的无能谋取私利。也有人说他是一个虔诚、谦逊的人，他为了信仰而正义地与异教徒、异端和伪君子作战，甚至为了表明他的虔诚而放弃了肉体的诱惑。与此同时，[bammer_guy.GetFaith.GetAdjective]的残余势力虽然衰弱，但仍潜伏在[bam_county.GetNameNoTier]和[badghis_county.GetNameNoTier]的山谷中，等待着再次崛起的机会。"
 yazd.0002.a:0 "决定波斯东部霸权的战斗开始了……"
 yazd.0002.b:0 "我的故事与萨法尔家族有关。"
 yazd.0002.c:0 "我的故事与哈瓦利吉派残党有关。"
 yazd.0002.tooltip.no:0 "你将以[THIS.Char.GetTitledFirstNameNoTooltip]的身份继续游戏。"
 yazd.0002.tooltip.saffarids:0 "你将选择扮演萨法尔兄弟之一或他们的部下"
 yazd.0002.tooltip.kharijites:0 "你将选择扮演该地区的[bammer_guy.GetFaith.GetAdjective]残党之一"
 yazd.0003.t:0 "萨法尔王朝"
 yazd.0003.desc:0 "在[yaqub_saffarid.GetFirstName]等人的努力下，曾经在波斯横行无忌的[bammer_guy.GetFaith.GetAdjective]狂热分子如今已走向衰落，或被消灭，或被劝降，但总有些漏网之鱼。相比之下，阿拔斯王朝任命的呼罗珊总督[tahirid_guy.GetFirstName]），却被说成是无能和疏忽的，面对这些威胁，他更感兴趣的是罪恶和享乐。因此，许多人呼吁[yaqub_saffarid.GetFirstName]来恢复秩序，反对[tahirid_guy.GetFirstName]。\n\n有人说[yaqub_saffarid.GetFirstName]是一个贪婪的叛教者，利用塔希尔的无能谋取私利。也有人说他是一个虔诚、谦逊的人，他为了信仰而正义地与异教徒、异端和虚伪的暴君作战，甚至为了表明虔诚而放弃了肉体的诱惑。不管真相如何，决定这一地区霸权的战斗已经开始，而我的故事与……"
 yazd.0003.a:0 "[yaqub_saffarid.GetFirstName]本人相联系，他从铜匠变成了圣战士"
 yazd.0003.b:0 "[amr_saffarid.GetFirstName]，[yaqub_saffarid.GetFirstName]的兄弟相联系"
 yazd.0003.c:0 "[ali_saffarid.GetFirstName]，[yaqub_saffarid.GetFirstName]的另一个兄弟相联系"
 yazd.0003.d:0 "[sebuk_eri_guy.GetFirstName]，[yaqub_saffarid.GetFirstName]的波斯奴隶兵有关，他有自己的野心"
 yazd.0003.e:0 "[uzayr_al_sari.GetFirstName]，[yaqub_saffarid.GetFirstName]的忠诚官员相联系"
 yazd.0003.a.info:0 "\n#emphasis 历史背景：#!萨法尔王朝的创始人雅各布·伊本·莱斯，原是现今阿富汗东部的扎兰季的一名铜匠，后来加入了一群#italic 游侠#!，与侵扰伊朗东部大部分地区的阿扎里加派作战。\n\n雅各布以其禁欲主义的生活方式而闻名，他的势力足以在873年击败塔希尔王朝。阿拔斯王朝的哈里发穆塔米德出于对他日益增长的权力的恐惧，向他提供了伊朗的各种总督职位，但雅各布拒绝了，并率军进攻巴格达，结果在876年被击败。虽然雅各布的进攻历来被解释为他渴望权力、甚至不信教的表现，但也有可能他作为一名圣战士，认为穆塔米德不够资格，想要用更合适的人来取而代之。\n\n雅各布于879年去世，虽然他作为原民族主义者的身份可能有些夸张，但毫无疑问，他的一生标志着阿拔斯王朝在伊朗的权威开始瓦解，以及各种伊朗诸侯的崛起。"
 yazd.0003.b.info:0 "\n#emphasis 历史背景：#!阿姆尔·伊本·莱斯是萨法尔王朝的第二任统治者，也是雅各布的弟弟。和他的哥哥一样，他出身卑微，曾是一名石匠和骡夫，后来加入了#italic 游侠#!。\n\n雅各布一生未婚所以无子，他更希望由他的另一个弟弟阿里继承王位。然而由于一些阴谋诡计，阿姆尔最终成为第二位统治者。他早期的统治主要集中在恢复那些在雅各布分心于西方时脱离他控制的各个领土的秩序上。最终，阿姆尔和哈里发穆塔米德不得不搁置他们的分歧，因为各路伊朗军阀威胁到了他们的共同利益。\n\n萨曼王朝是终结阿姆尔的势力的人，他们在公元900年击败了他。虽然阿姆尔在盟约上是哈里发的盟友，但哈里发认为盟约只是权宜之计，后来萨曼王朝把阿姆尔用锁链锁起来送给哈里发，然后他被处决了。\n\n尽管阿姆尔的后裔幸存下来，并作为小领主统治了一个世纪，但他们再也没有到达过祖辈的权力顶峰。"
 yazd.0003.c.info:0 "\n#emphasis 历史背景：#!阿里·伊本·莱斯与他的兄弟们一样出身卑微，多年来一直在他兄弟的旗帜下战斗。879年，他的哥哥雅各布去世后，阿里本应继承他的王位，而且也得到了萨法尔麾下军队的支持，但是狡猾的阿姆尔却占了上风。两兄弟之间从未和解，阿姆尔将阿里囚禁起来，但阿里却设法逃脱，投靠了该地区与阿姆尔为敌的其他伊朗军阀。"
 yazd.0003.d.info:0 "\n#emphasis 历史背景：#!塞比克‑埃里是一名突厥奴隶兵，他在萨法尔王朝对樽比勒王朝的多次袭击中被俘。他先后为雅各布和阿姆尔效力了几年，并在某个时候被任命为法尔斯总督。\n\n901年，阿姆尔被推翻并处决后，他的继任者和孙子塔希尔发现自己受到野心勃勃的塞比克‑埃里的指控。最终，塔希尔和他的兄弟雅各布与塞比克‑埃里发生了冲突，而后者与哈里发结盟。\n\n尽管塔希尔和雅各布被击败，但塞比克‑埃里的好运并没有持续太久；当哈里发发动圣战后，他因被俘而野心破灭，并于917或918年死于哈里发的监狱中。"
 yazd.0003.e.info:0 "\n#emphasis 历史背景：#!在雅各布击败塔希尔王朝之后，据说他指责统治者穆罕默德是一个昏君，忽视了他的人民和他辖地内的哈瓦利吉派威胁。雅各布罢黜了穆罕默德，并任命他的追随者乌扎尔·伊本·萨里为内沙布尔（塔希尔王朝的首都）的总督，代表他在那里管理事务。"
 yazd.0004.t:0 "哈瓦利吉派残党"
 yazd.0004.desc:0 "[yaqub_saffarid.GetTitledFirstName]已经证明了自己是所有[bammer_guy.GetFaith.GetAdherentNamePlural]的狡猾敌人。在他发动战争后，我们的人数大大减少，只剩下该地区两个主要的哈瓦利吉派残余据点：在[bam_county.GetNameNoTier]的哈瓦利吉派领袖[bammer_guy.GetFirstName]，以及在[badghis_county.GetNameNoTier]自封为哈瓦利吉派哈里发的[abd_al_rahman_kharijite.GetFirstName]。然而，[yaqub_saffarid.GetFirstName]并没有完全敌视我们。他确实消灭了一些哈瓦利吉派的团体，但也有一些[bammer_guy.GetFaith.GetAdjective]能够与他谈判，为他效力。而他也同意了，尽管我们以不悔改的狂热分子的名声而闻名\n\n在雄心勃勃的[yaqub_saffarid.GetFirstName]和阿拔斯王朝的呼罗珊总督[tahirid_guy.GetFirstName]之间，冲突一触即发。我们可以像我们的一些同胞一样，背叛我们的价值观，向[yaqub_saffarid.GetFirstName]效忠；或者我们可以像其他人一样，抵抗这些自称是穆斯林的异教徒，希望[bammer_guy.GetFaith.HighGodName]在我们需要的时候拯救我们。"
 yazd.0004.a:0 "在这个不确定的时代，我们必须谨慎行事……"
 yazd.0004.a.info:0 "\n#emphasis 历史背景：#!巴姆是一座坚固的城堡，曾经是哈瓦利吉派的一个避难所，大约从8世纪持续到9世纪上半叶。他们最终在868年被萨法尔王朝的进攻所消灭。当时，他们的领袖据说是一个叫做伊斯玛仪·伊本·穆萨的人。"
 yazd.0004.b.info:0 "\n#emphasis 历史背景：#!赫拉特附近的土地，特别是卡鲁赫、巴德吉斯和萨卜泽瓦尔等地区，在8世纪和9世纪的大部分时间里，一直是哈瓦利吉派活动的温床，因此成为了870年至871年萨法尔王朝远征的目标。当时，该地区的哈瓦利吉派领袖是阿卜杜勒‑拉赫曼，他自称“哈瓦利吉派的哈里发”，并在那里活跃了三十年。\n\n关于阿卜杜勒‑拉赫曼的最终命运，各种来源说法不一。他可能被萨法尔王朝杀死，他的头被送到巴格达的哈里发那里，或者他可能投降并被任命为当地的总督，但后来被一位名叫易卜拉欣·伊本·阿赫达尔的不满的哈瓦利吉派信徒刺杀。如果后者发生了，那么讽刺的是，萨法尔王朝向易卜拉欣提出了类似的要约，并将他的部队纳入了自己的麾下。"
 yazd.0005.t:0 "法拉穆兹的故事"
 yazd.0005.desc:0 "几十年前，我的父亲[ala_al_dawla.GetTitledFirstName]是波斯中部的伟大军阀之一。他与白益王朝通过婚姻关系，他和他的[ROOT.Char.GetCulture.GetName]战士们最初在白益王朝衰落后控制了波斯的大部分地区，但后来他不得不在强大的伽色尼王朝和塞尔柱王朝之间周旋，以确保我们家族的自治。\n\n唉，我只能活在他的阴影下。我的统治始于不得不镇压叛逆的弟弟[abu_harb.GetFirstName]，尽管我们后来和解了。后来，我像我的另一个弟弟[garshasp.GetFirstName]一样，试图发动一场反对塞尔柱王朝的[tughril_beg.GetTitledFirstName]的叛乱。虽然对我的反叛很是愤懑，但他还是施我以宽。应我恳求之下，给了我一块以[yazd_county.GetNameNoTier]为中心的小封地。从那时起，我就一直住在这里。"
 yazd.0005.a:0 "这是我们家族的命运，由[ROOT.Char.GetFaith.HighGodName]决定。"
 yazd.0005.b:0 "我们卡库伊家族的人足智多谋，即使身处逆境亦能创造机遇。"
 yazd.0006.t:0 "统治亚兹德"
 yazd.0006.desc:0 "尽管失败是苦涩的，而年老会改变一个人的看法。我与塞尔柱人和解了，并在他们的宫廷受到了极大的尊敬。即使活在父亲的影子之下，我也继承了他对学习和文化的热爱——毕竟，他是伟大的伊本·西纳的赞助人。\n\n自从我来到[yazd_county.GetNameNoTier]，我就致力于发展它，使它成为一个值得学者和其他有修养的人居住的城市。我的儿子[kakuyid_son.GetFirstName]也在塞尔柱王朝的圈子里很有名望，是一个热爱诗歌和学问的人。\n\n总的来说，作为亚兹德的管理者，我对我的努力感到特别自豪："
 yazd.0006.a:0 "与塞尔柱人和解，成为他们信赖的代理。"
 yazd.0006.b:0 "发展亚兹德，把它变成一个伟大的、繁荣的、和平的城市。"
 yazd.0006.c:0 "继续我父亲的遗产，赞助学术和艺术。"
 yazd.0007.t:0 "逝去的一生"
 yazd.0007.desc:0 "最后，也许我们没有像我父亲曾经那样生活在追逐权力的路上并不是一件坏事。\n\n也许这是[ROOT.Char.GetFaith.HighGodName]的意愿，我们可以统治这个精致的城市，并培养艺术。尽管我最初经常失败和挫折，我不能说我的生活不成功。从某种意义上来说，当我感到死亡临近时，我意识到也许我不再处于我父亲的阴影之下。\n\n也许我也有自己的影子。"
 yazd.0007.a:0 "我的故事即将结束，新的故事即将开始。我可以感觉到它。"
 yazd.0007.info:0 "#emphasis 历史背景：#!法拉穆兹最后一次在历史记载中提及是在1063年，所以他可能在那之后不久就去世了。那时，他和他的后裔已经成为塞尔柱王朝的忠实和受尊敬的封臣，尽管他们最初的开端很动荡。例如，法拉穆兹的儿子兼继承人阿里便迎娶了阿尔斯兰可敦——阿尔普·阿尔斯兰的妹妹。\n\n日后卡库伊家族的血裔满足于对亚兹德的统治，将其改造成一个文化中心。该家族最后一位已知的统治者是一个叫做加尔沙斯普的人，他是法拉穆兹的孙子，据说他在公元1141年的卡特万战役中被喀喇契丹（或称西辽）击败而战死。\n\n亚兹德随后被封给了加尔沙斯普的女婿，一个叫做萨姆·伊本·瓦尔丹鲁兹的突厥指挥官，他建立了亚兹德的阿塔贝格王朝。作为卡库伊王朝的延续，他们在伊尔汗国的统治下一直持续到14世纪。"
 yazd.0008.t:0 "卡乌德的故事"
 yazd.0008.desc:0 "与我的父亲[chagri_beg.GetFirstName]和叔叔[tughril_beg.GetFirstName]一起，我们成功地给王朝的繁荣打下了一个地基。在他们尚留在人世的时候，我便将王朝的势力范围扩散到[kerman_duchy.GetNameNoTier]所在之地，随后跨过海洋辐射到[oman_duchy.GetNameNoTier]。从此以后，再也不会有人胆敢认为我缺少成为家族之长的能力。\n\n多年之后，作为[kerman_duchy.GetNameNoTier]和[oman_duchy.GetNameNoTier]的领主，我取得了许多成就。譬如平衡了我麾下的势力，那些到处游牧的突厥人，还有那些定居下来农民之间的利益冲突。\n\n在许多成就之中，最令我自豪的是："
 yazd.0008.a:0 "我从哈瓦利吉派亵渎者手中征服了阿曼。"
 yazd.0008.b:0 "我努力确保突厥人和当地人之间的和平。"
 yazd.0008.c:0 "我的工作是拓展贸易网和修建安全的道路。"
 yazd.0009.t:0 "大皇子的天命"
 yazd.0009.desc:0 "作为我父亲的长子和我叔叔的长侄，我期望继承他们的衣钵，成为塞尔柱人的领袖。尽管我做了这么多，当我叔叔去世时，他还是把家族的财富托付给了我的弟弟[alp_arslan.GetFirstName]。我承认我很失望，现在也是如此。\n\n我已经无法等待了。如果我们遵循传统的[ROOT.Char.GetCulture.GetName]习俗，那么在继承王位时，我将比我的侄子们更有资历，我知道我们军队中的许多军官都同意这一点。\n\n我不知道我是否会比我弟弟活得长。但如果[ROOT.Char.GetFaith.HighGodName]有此意愿，那么也许有一天我的耐心和努力会得到回报。作为最资深的塞尔柱王子，伟大的塞尔柱帝国将由我来统治！"
 yazd.0009.a:0 "这是我与生俱来的权利。"
 yazd.0009.info:0 "#emphasis 历史背景：#!尽管关系紧张，但在阿尔普·阿尔斯兰在世时，卡乌德从未企图篡夺他弟弟的王位。\n\n然而，当阿尔普·阿尔斯兰在公元1072年被一名俘虏的敌人意外杀死，由他的儿子，年轻的马利克沙继承王位时，卡乌德看到了一个为自己夺取塞尔柱皇位的机会，于是举旗造反。即使在哈马丹附近的决定性战役中，马利克沙的部队中有许多土库曼人倒戈到卡乌德的一边，马利克沙仍然取得了胜利，卡乌德被处决。\n\n尽管如此，卡乌德的两个儿子苏丹沙阿和图兰沙仍然留在克尔曼，作为马利克沙的封臣直到12世纪。"
 yazd.0010.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 yazd.0010.desc:0 "我终于实现了毕生的梦想。#italic 我#!，[qawurd.GetFirstName]，统治着强大的塞尔柱帝国。而那些不堪一击的，愚昧的晚辈？他们只配在我麾下效忠，尽心地侍奉我，因为我是宗族的长子，这个皇位本就是我的，是我与生俱来的#italic 权利#!。\n\n支持我的突厥战士和部落人民，也都欢欣鼓舞。他们对我一些亲戚渐渐背离我们的古老传统，如年长者继承法，感到忧心忡忡。他们对我充满期待，我要明智地满足他们的愿望，坚守我们的根本。\n\n无论如何，我们的宗族依旧强大。在我接管这个帝国的缰绳后，我们会变得更加强大。"
 yazd.0010.a:0 "愿[ROOT.Char.GetFaith.HighGodName]为我与我的帝国带来荣耀。"
