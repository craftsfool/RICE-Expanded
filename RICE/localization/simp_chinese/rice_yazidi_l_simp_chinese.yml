 activity_RICE_yazidi_yarsani_jam_predicted_cost:0 "这项[activity|E]的花费主要基于你的[income|E]和你选择的[activity_options|E]。"
 activity_RICE_yazidi_yarsani_jam_conclusion_desc:0 "[GetActivityType( 'activity_RICE_yazidi_yarsani_jam' ).GetName]已结束。当然，每个参与者都感受到了[GetPlayer.GetFaith.HighGodName]的存在！"
 RICE_yarsani_jam_sacrifice_size_type:0 "献祭规模"
 RICE_yarsani_jam_sacrifice_size_type_small:0 "小型"
 RICE_yarsani_jam_sacrifice_size_type_small_desc:0 "$EFFECT_LIST_BULLET$每名参加献祭的人将获得[piety_i]#V 50#![piety|E]、[prestige_i]#V 50#![prestige|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_yarsani_jam_host_small_modifier').GetNameWithTooltip][character_modifier|E]\n\n#weak 重要的是要展现我的尽职尽责。#!"
 RICE_yarsani_jam_sacrifice_size_type_medium:0 "中型"
 RICE_yarsani_jam_sacrifice_size_type_medium_desc:0 "$EFFECT_LIST_BULLET$每名参加献祭的人将获得[piety_i]#V 100#![piety|E]、[prestige_i]#V 100#![prestige|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_yarsani_jam_host_medium_modifier').GetNameWithTooltip][character_modifier|E]\n\n#weak 像这样的社群集会是展现我慷慨的绝佳机会。#!"
 RICE_yarsani_jam_sacrifice_size_type_large:0 "大型"
 RICE_yarsani_jam_sacrifice_size_type_large_desc:0 "$EFFECT_LIST_BULLET$每名参加献祭的人将获得[piety_i]#V 100#![piety|E]、[prestige_i]#V 100#![prestige|E]\n$EFFECT_LIST_BULLET$获得[GetModifier('RICE_yarsani_jam_host_large_modifier').GetNameWithTooltip][character_modifier|E]\n\n#weak 这是一次具有重要意义的精神和集体活动，只有大型献祭方能与之相对。#!"
