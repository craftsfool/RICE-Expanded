 activity_RICE_yazidi_tiwaf:0 "蒂瓦夫节"
 activity_RICE_yazidi_tiwaf_desc:0 "我们[faith|E]通常都有供奉各种圣物的神龛，并在神殿定期举行的#italic 蒂瓦夫节#!，不仅让我们团结，还加强我们的社会纽带。"
 activity_RICE_yazidi_tiwaf_selection_tooltip:0 "参加当地[GetPlayer.GetFaith.GetAdjective]村庄的蒂瓦夫节\n\n$activity_RICE_yazidi_tiwaf_context_tooltip$"
 activity_RICE_yazidi_tiwaf_context_tooltip:0 "#emphasis 历史背景：#!每个雅兹迪村庄都有一个供奉圣人的神龛，每年都会在这些神龛里举行蒂瓦夫节，以纪念圣人。除宗教功能外，这些节日也是这些村庄重申其身份和加强社会联系的重要方式。即使雅兹迪人被迫或自愿迁徙到其他地方定居，他们通常也会继续在原来的村庄举行蒂瓦夫节，以保持祖先的传统。"
 activity_RICE_yazidi_tiwaf_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$处于[activity|E]的[county|E]会根据你的[intent|E]获得[GetModifier('RICE_yazidi_tiwaf_religious_modifier').GetNameWithTooltip]或[GetModifier('RICE_yazidi_tiwaf_community_modifier').GetNameWithTooltip][county_modifier|E]"
