 activity_RICE_yazidi_tawus_geran_desc:0 "我应当将孔雀天使的桑伽可在治下的一个[counties|E]里的村庄巡游，好让当地人了解我们的[faith|E]。"
 activity_RICE_yazidi_tawus_geran_selection_tooltip:0 "将桑伽可带到你治下的一个[county|E]以提升[control|E]。\n\n$activity_RICE_yazidi_tawus_geran_context_tooltip$"
 activity_RICE_yazidi_tawus_geran_context_tooltip:0 "#emphasis 历史背景：#!孔雀游行（Tawûs Gêran）是雅兹迪人的一种仪式，其中包括#italic 桑伽可（Sanjak）#!的巡游，桑伽可是孔雀天使形状的铜灯。#italic 卡瓦尔斯（Qewals）#!是雅兹迪人世袭的圣歌吟唱者。只要是在和平时期，在确定道路安全的情况下，他们就会带上#italic 桑伽可#!前往各雅兹迪村庄。这是雅兹迪人了解其宗教信仰和展示其宗教虔诚的机会。此处描述主要基于19世纪英国传教士和东方学学者乔治·珀西·巴格的目击记录。"
 activity_RICE_yazidi_tawus_geran_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$增加举行[activity|E][county|E]的[control_i|E][control|E]\n$BULLET_WITH_TAB$你的[lifestyle|E]获得至少#V [EmptyScope.ScriptValue('medium_lifestyle_xp')]#![experience|E]"
