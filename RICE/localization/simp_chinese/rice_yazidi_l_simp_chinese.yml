 yazidi.0001.t:0 "谢赫阿迪之死"
 yazidi.0001.desc:0 "[lalish.GetNameNoTier]流传着一个伟大圣人的故事，他被称作谢赫阿迪（Sheikh Adi）。虽然他是一位虔诚的苏菲神秘主义者，喜欢独来独往，但他所展露坚定的禁欲主义、高超的智慧及所谓的“神迹”为他赢得了大批追随者。\n\n就在最近，谢赫阿迪去世了。但这不足以阻止他的追随者，这些追随者不仅有虔诚的本地穆斯林，还有那些伊朗西北古老信仰的信徒。在诋毁者看来，他的追随者对他的崇拜过度了。但当地人却宣称，谢赫阿迪是一位伟人——但不仅仅只是位伟人。\n\n现在，谢赫阿迪传授的教义与当地的习俗相融合。他对当地的影响将有多深远，我们拭目以待。"
 yazidi.0001.a:0 "有意思……"
 yazidi.0001.tooltip:0 "一个新的[faith|E]，#bold [yazidi.GetName]#!，很可能会在未来几十年内通过事件在[lalish.GetNameNoTier]的[county|E]周围出现。"
 yazidi.0002.t:0 "xxxxx"
 yazidi.0002.desc:0 "xxxxx"
 yazidi.0002.a:0 "xxxxx"
 yazidi.0003.t:0 "[yazidi.GetNameNoTooltip]兴起"
 yazidi.0003.desc:0 "多年前，一位名叫谢赫阿迪的[islam.GetAdjective]神秘主义者活跃于[lalish.GetNameNoTier]。他受到当地人的尊敬，既有信奉正统[islam.GetNameNoTooltip]的人，也有信奉伊朗西北古老信仰的人。\n\n多年来，在这与世隔绝的崎岖山谷中，这两个群体的信仰以及他们对谢赫阿迪的深深敬仰融合为一，形成了新的宗教思想和习俗。他们信仰的核心是#italic 七天使#!，祂们是真主的化身，谢赫阿迪以及孔雀天使都是其中的一员。\n\n这种被称作[yazidi.GetName]的新信仰，正在这里的一些部落中逐渐流行起来，不过原宗教的信徒最多也对他们持怀疑态度，最不友好的甚至将他们视作堕落的异教徒。"
 yazidi.0003.a:0 "有趣的消息……"
 yazidi.0003.b:0 "我也非常钦佩谢赫阿迪。"
 yazidi.0003.tooltip:0 "现在可以皈依[yazidi.GetName]。此外，在[yazidi_religion.GetName][religion|E]中创建新的[faith|E]时，现在可以使用[GetDoctrineType('rice_west_iranian_yazidi_doctrine').GetBaseName][doctrine|E]。"
 yazidi.0003.info:0 "#emphasis 历史背景：#!据推测，库尔德人以及更广泛的伊朗西北部民族拥有不同于祆教但又与之相关的古老宗教信仰；这种宗教信仰与苏菲派伊斯兰教（如谢赫阿迪宣扬的伊斯兰教）相融合，产生了雅兹德教。因此，雅兹德教以现在的形式出现在谢赫阿迪于12世纪去世后的某个时期。\n\n在中世纪和近代早期，雅兹迪人在库尔德人中的分布可能更为广泛。例如，奥斯曼人任命雅兹迪埃米尔统治他们在库尔德斯坦的一些领土，这表明雅兹迪人在当时拥有很大的政治影响力。\n\n有趣的是，雅兹迪人是魔鬼崇拜者这一臭名昭著的错误观念常常被用来迫害雅兹迪人，但直到15世纪和16世纪才得到很好的证实。这就提出了一种可能性，即他们被视为穆斯林异端，只是后来才被视为一个独立的群体，或者说他们至少在很久之后才被穆斯林和基督徒视为敌对群体。"
 yazidi.0004.t:0 "苏丹萨哈克"
 yazidi.0004.desc:0 "一个名叫苏丹萨哈克的圣人的消息不胫而走，他主要居住在[kermanshah.GetNameNoTier]附近。这些日子里，他凭借自己的智慧、学识和所谓的“神迹”吸引了众多追随者。\n\n据说苏丹萨哈克曾在中东地区著名的[islam.GetAdjective]学校接受过正规的宗教教育。尽管如此，该地区的许多人，包括追随他的人，仍然坚持一些古老的宗教习俗，因为偏僻的山区和峡谷一直是异教教派和信仰的发源地。\n\n总之，苏丹萨哈克似乎正努力改革他们的信仰，使之更加连贯，并符合亚伯拉罕教义。甚至还有人说，他的神迹证明了他不是普通的圣人，他具有神圣精华。"
 yazidi.0004.a:0 "我知道了……"
 yazidi.0004.tooltip:0 "一个新的[faith|E]，#bold [yarsani.GetName]#!，很可能会在未来几十年内通过事件在[kermanshah.GetNameNoTier]的[county|E]周围出现。"
 yazidi.0005.t:0 "xxxxx"
 yazidi.0005.desc:0 "xxxxx"
 yazidi.0005.a:0 "xxxxx"
 yazidi.0006.t:0 "[yarsani.GetNameNoTooltip]兴起"
 yazidi.0006.desc:0 "多年前，一位名叫苏丹萨哈克的圣人活跃在[kermanshah.GetNameNoTier]。他以智慧和许多神迹而闻名。虽然他已经去世，但他的教义仍在流传：这种苏菲[islam.GetName]与伊朗西北部人民古老宗教习俗的混合体吸引了许多信徒，被称为[yarsani.GetName]，或#italic 阿赫莱·哈克#!，即“遵真理者”。\n\n许多追随这一新宗教传统的人认为，苏丹萨哈克实际上是这一时代七位天神化身中的第四位，也是最伟大的一位，关于他和他的七位同伴的传说流传甚广。\n\n无论如何，虽然这个新的异端教派已经获得了许多追随者，但幸运的是，[yarsani.GetAdherentNamePluralNoTooltip]居住在相对偏僻的山区和山谷中，因为目前外人对他们还抱有戒心，有时甚至是敌意的。"
 yazidi.0006.a:0 "有趣的消息……"
 yazidi.0006.b:0 "我认为苏丹萨哈克值得尊敬。"
 yazidi.0006.tooltip:0 "现在可以皈依[yarsani.GetName]。此外，在[yazidi_religion.GetName][religion|E]中创建新的[faith|E]时，现在可以使用[GetDoctrineType('rice_west_iranian_yarsani_doctrine').GetBaseName][doctrine|E]"
 yazidi.0006.info:0 "\n#emphasis 历史背景：#!据推测，库尔德人以及更广泛的伊朗西北部民族拥有不同于祆教但又与之相关的古老宗教信仰；这种宗教信仰与苏菲派伊斯兰教（苏丹萨哈克出身于此）相融合，产生了雅赛尼派。根据苏丹萨哈克曾与帖木儿来往的传说，我们所知的雅赛尼派最早出现于14世纪左右。\n\n雅赛尼派与该地区的其他异端宗教或教派（如雅兹迪教或阿列维派）有一些相似之处。虽然大多数雅赛尼派讲库尔德语，但也有一些讲突厥语。\n\n雅赛尼派信徒也被称为阿赫莱·哈克（Ahl‑e Haqq）或卡卡伊（Kaka'i）。他们有时也被贬称为阿里·阿拉希（Ali‑Allahi），即阿里的崇拜者，相信阿里神性的人，尽管先知穆罕默德的堂弟阿里在他们的宗教中只扮演次要角色。"
 yazidi.0007.t:0 "$d_yazidi$"
 yazidi.0007.desc:0 "由于[yazidi_head.GetFaith.GetName]这一新兴信仰在美索不达米亚北部和伊朗西北部的兴起，该地的[yazidi_head.GetFaith.GetAdherentNamePluralNoTooltip]开始认可[yazidi_head.GetTitledFirstName]为他们精神上的领袖。据传，[yazidi_head.GetSheHe]是[yazidi_head.GetFaith.GetAdherentNamePluralNoTooltip]祖师苏菲派大师谢赫阿迪的后裔。\n\n[yazidi_head.GetTitledFirstName]居住在[yazidi_county.GetName]，就在谢赫阿迪之墓的不远处，那里已经成为一个重要的[yazidi_head.GetFaith.GetAdjective]朝圣地。如果我想与该地区的 [yazidi_head.GetFaith.GetAdherentNamePluralNoTooltip]保持良好关系，也许我应该将[yazidi_county.GetNameNoTier]附近的土地授予[yazidi_head.GetFirstNameNoTooltip]，这样[yazidi_head.GetSheHe]和[yazidi_head.GetHerHis]的子民就有他们的家园了。"
 yazidi.0007.a:0 "我将把[yazidi_county.GetNameNoTier]授予[yazidi_head.GetFirstNameNoTooltip]！"
 yazidi.0007.b:0 "我想知道[yazidi_head.GetSheHe]将怎样统治[yazidi_county.GetNameNoTier]……"
 yazidi.0007.c:0 "[yazidi_head.GetSheHe|U]不需要统治任何领土。"
