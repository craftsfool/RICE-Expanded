 yazidi.0034.t:0 "xxxxx"
 yazidi.0034.desc:0 "xxxxx"
 yazidi.0034.a:0 "xxxxx"
 yazidi.0035.t:0 "祭品羊肉"
 yazidi.0035.desc:0 "#italic 蒂瓦夫节#!的一部分是献祭和吃羊肉。不过，还有一个问题是，#italic 谁#!能吃到那只羊。通常，祭品羊那拿来烹饪的部分会被拍卖给在场的人们。\n\n人群欢呼雀跃，喧闹声此起彼伏，为每一块羊肉喊着价钱。也许我应该也给自己买点羊肉？"
 yazidi.0035.a:0 "是的，我想吃点肉！"
 yazidi.0035.b:0 "不，我把肉让给别人。"
 yazidi.0036.t:0 "艰苦远行"
 yazidi.0036.desc:0 "举行#italic 蒂瓦夫节#!的神龛并不总是在村里，甚至也不总是在村外。有时，这些神龛位于荒郊野岭之中。\n\n碰巧的是，我要去参加#italic 蒂瓦夫节#!的村子离神龛有一段距离，比我想的要远得多！当然，由于我现在正在参加#italic 蒂瓦夫节#!，我已经结束了我的旅程，但我开始感到肌肉酸痛。\n\n不过，置身于大自然中还是很令人振奋，看到如此秀丽的自然风光和无垠的天空，我更加欣赏[faith.HighGodName]和[faith.HighGodHerHis]的创造。"
 yazidi.0036.a:0 "#italic 这#!叫远行。"
 yazidi.0037.t:0 "社交活动"
 yazidi.0037.desc:0 "因为#italic 蒂瓦夫节#!既吸引了当地人，也吸引了像我这样的远道而来者，所以这是一个结交他人的好机会。我已经认识了许多来自其他地方的有趣之士，包括其他一些村庄的名人，我们进行了许多愉快的交谈。"
 yazidi.0037.a:0 "希望这能让我今后受益。"
 yazidi.0038.t:0 "神圣的卡沃斯"
 yazidi.0038.desc:0 "虽然像这样的#italic 蒂瓦夫节#!是一个欢快的节日，但归根结底，它们仍然是宗教节日。在所有的欢乐和喜悦中，我们仍然是来瞻仰这些神龛所供奉的圣像的。\n\n在神龛里，作为这个节日必须举行的宗教仪式的一部分，#italic 卡瓦尔斯#!聚集在一起，在神圣乐器（如#italic 达甫鼓#!和#italic 沙巴布笛#!）的伴奏下，唱响神圣的#italic 卡沃斯#!。"
 yazidi.0038.a:0 "真是鼓舞人心的一幕！"
 yazidi.0039.t:0 "xxxxx"
 yazidi.0039.desc:0 "xxxxx"
 yazidi.0039.a:0 "xxxxx"
 yazidi.0040.t:0 "准备"
 yazidi.0040.desc:0 "#italic 贾姆庆典#!是[faith.GetAdjective]社区最重要的宗教和集体活动之一。在外人看来，这听起来像是几个人的简单聚会，但事实并非如此。我们信仰的每个分支都有自己不同的仪式，这些仪式都有明确的规则，是我们更加接近[faith.HighGodNameAlternate]的一种方式。\n\n终于，我到达了举行#italic 贾姆庆典#!的地方。在找到今晚的住处之前，我记下了#italic $yarsani_house_of_worship$#!的位置——我们将聚集在这里举行仪式的神圣建筑。"
 yazidi.0040.a:0 "我已经等不及庆典开始了！"
 yazidi.0041.t:0 "进入$yarsani_house_of_worship$"
 yazidi.0041.desc:0 "终于，举办#italic 贾姆#!的日子到了！我随众人一同走进#italic $yarsani_house_of_worship$#!，匍匐在地上亲吻门槛，高呼：“昔在、今在、以后永在的全能之主！”\n\n接着，我走到主持庆典的[faith.BishopNeuter]面前，亲吻他们的手，向他们致意。然后，我绕场一周，亲吻在场所有人的手。\n\n在$yarsani_house_of_worship$，在[faith.HighGodNameAlternate]面前，人无分贵贱，无有穷富，所有人都是兄弟，都是教友！"
 yazidi.0041.a:0 "待所有人各自就位，庆典便会开始。"
 yazidi.0042.t:0 "庆典开始"
 yazidi.0042.desc:0 "#italic 贾姆庆典#!正式开始了。此时，#italic 卡德姆#!会为人们端来一盆水作净礼。人们各行净礼后，一同诵念“昔在、今在、以后永在的全能之主”！\n\n庆典上，伴随着[faith.GetAdjective]神圣乐器#italic 弹布尔#!的旋律，所有人共唱#italic 卡拉姆#!圣歌。不过，这二者并非如胶漆般难分别，不弹#italic 弹布尔#!也能唱#italic 卡拉姆#!，不唱#italic 卡拉姆#!也能弹#italic 弹布尔#!！"
 yazidi.0042.a:0 "现在，我们开始分享食物！"
 yazidi.0043.t:0 "分享食物"
 yazidi.0043.desc:0 "在主持仪式的[faith.BishopNeuter]面前铺着一块白布，上面放一个装有祭肉的盆子。[faith.BishopNeuter]把肉和骨头分开，然后将这被称作#italic 巴什#!的肉放到一种叫#italic 提里#!的薄面饼上。\n\n在场的每个人都能分到一份肉，就连参与者的孩子也不例外，他们被允许站在房间边缘，远离所有人进行观看。然后，#italic 卡德姆#!端来一碗水，供仪式的下一个部分使用，包括我在内的每个参与者都要依次从这碗水里喝一小口。\n\n此时此刻，歌声和音乐仍在继续，我们都感受到了神的临在。我们中的一些人甚至开始感到一种深深的陶醉！"
 yazidi.0043.a:0 "此时此刻，圣洁降于此处！"
 yazidi.0044.t:0 "结束"
 yazidi.0044.desc:0 "#italic 贾姆庆典#!结束了！#italic 卡德姆#!及其助手诵经带祷，并带头亲吻其他人的手。\n\n走出#italic $yarsani_house_of_worship$#!，冥冥之中，我们仿佛感受到了[faith.HighGodNameAlternate]的存在。这激励着我们精诚团结，为[faith.HighGodNameAlternate]团结奋斗！"
 yazidi.0044.a:0 "我很高兴能参与其中！"
