 yazidi.0030.t:0 "到达"
 yazidi.0030.desc:0 "每座[faith.GetAdjective]村庄中都有一座神殿，供奉着[faith.GetNameNoTooltip]众圣人之一的神龛，各村庄每年都会于神龛中庆祝#italic 蒂瓦夫节#!。此类宗教节庆是人们交朋结友、联络感情的好时机。这也是为什么我听说[location.GetNameNoTier]的这个村庄要庆祝#italic 蒂瓦夫节#!的时候就决定参加。\n\n终于，我抵达了村子，村子里逐渐热闹了起来。当地人正忙着最后的准备工作，而像我这样从各地赶来的外地人则在寻找好地方安营扎寨，欢度佳节。也许我应该在节日开始前做点什么。"
 yazidi.0030.a:0 "经过这一路的奔波，我应该放松一下。"
 yazidi.0030.b:0 "我会与参会者聊天和交流。"
 yazidi.0030.c:0 "我需要先祈祷，做好准备。"
 yazidi.0031.t:0 "节庆开始了"
 yazidi.0031.desc:0 "#italic 蒂瓦夫节#!开始了！所有参加祭祀的人，不管是本村人还是像我这样的外来人，都聚集在村里的神龛周围。\n\n在那里，我们聚集在一起，由训练有素的圣歌吟唱者#italic 卡瓦尔斯#!（俗话叫#italic 卡沃斯#!）来演唱这些圣歌，赞美[faith.HighGodName]和其他神圣的存在。\n\n虽然这是一个宗教场合，但有这么多人在场，也颇具节日气氛。从某种程度上说，这就像是一次盛大的野餐。很多人在跳舞、分享食物、聊天，尽情享受各种欢乐！"
 yazidi.0031.a:0 "这里的人群真是喜气洋洋！"
 yazidi.0032.t:0 "结束"
 yazidi.0032.desc:0 "在经历了欢乐和激动之后，#italic 蒂瓦夫节#!落下了帷幕。毫无疑问，在场的大多数人都乐在其中。\n\n生活在这里的村民为他们的神龛和村庄感到自豪，因为这个节日也是他们社区的庆典，他们很乐意与像我这样的外来客分享当地的传说和故事。毫无疑问，这项活动只会进一步巩固居住在这里的家庭之间的联系。"
 yazidi.0032.a:0 "我很高兴能参与其中。"
 yazidi.0033.t:0 "xxxxx"
