 yazidi.0060.t:0 "准备"
 yazidi.0060.desc:0 "最近，我一直在收集所需的资源，以便进行公牛献祭。\n\n在我们传统的[faith.GetAdjective]宇宙论中，在时间之初，伟大的密特拉神献祭了原始公牛。在此之前，[faith.CreatorGodName]最初创造的宇宙缺乏生命，一切都静止不动；因此，米特拉献祭公牛后，创世的第二阶段才得以开始。\n\n在其他地方，有些人，包括那些与我们有着大量共同宗教信仰和习俗的人，认为第一次献祭是一种邪恶的行为，是由邪魔所为。然而，我们不同意这种观点，献祭是必要的，且是善举。因此，我们试图通过这种宗教仪式来复现最初的公牛献祭。"
 yazidi.0060.a:0 "很快就会有一头公牛被挑选出来。"
 yazidi.0061.t:0 "再现创世"
 yazidi.0061.desc:0 "[faith.PriestNeuterPlural]已为公牛献祭选好了一头公牛，献祭的日子已经到了。在[faith.PriestNeuterPlural]吟唱各种祷词并举行各种仪式以带来纯洁和神圣之后，公牛被正式杀死。\n\n整个仪式结束后，我当然要正式感谢[faith.PriestNeuterPlural]协助我们完成这一重要的宗教仪式。"
 yazidi.0061.a:0 "我相信我们今后会做得更多！"
