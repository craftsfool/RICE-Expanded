 yazidi.0020.t:0 "准备迎接桑伽可"
 yazidi.0020.desc:0 "#italic 卡瓦尔斯#!们正打算把一个#italic 桑伽可#!（$yazidi_high_god_name$的圣洁铜像）带到[location.GetNameNoTier]的一个[faith.GetAdjective]村庄进行孔雀游行，我也打算去帮忙。\n\n众所周知，#italic 孔雀游行#!是[faith.GetName]最重要，也是最常见的几个宗教仪式之一。将#italic 桑伽可#!带到各个村庄，并让#italic 卡瓦尔斯#!帮助人们更好地了解并坚定信仰。\n\n终于，我在#italic 桑伽可#!抵达之前不久到达了村庄！村民们对我的加入感到很荣幸，并为我准备了合适的住处。"
 yazidi.0020.a:0 "我们期待着#italic 桑伽可#!的到来！"
 yazidi.0021.t:0 "桑伽可到达"
 yazidi.0021.desc:0 "今天是个好日子！训练有素的圣歌吟诵者#italic 卡瓦尔斯#!（俗话叫#italic 卡沃斯#!）终于来到了村外，#italic 孔雀游行#!开始了！村里的每个人都知道他们来了，因为震耳欲聋的乐声、笛声、铃鼓声和雷鸣般的敲鼓声充斥着整个村子。\n\n我们赶忙赶往村中大道。此时，#italic 卡瓦尔斯#!及其他宗教人员依序紧随#italic 桑伽可#!入场。一些围观者感慨万千，或喃喃祈祷，或向桑伽可铜像鞠躬致礼。一些人甚至试图吸入队伍中香炉喷出的烟雾，并将手臂和脸浸入其中。\n\n#italic 桑伽可#!在村子里绕行一段时间后，将前往村中村老家中，直到#italic 孔雀游行#!结束。"
 yazidi.0021.a:0 "我们去房子那边吧！"
 yazidi.0022.t:0 "布道"
 yazidi.0022.desc:0 "在过去的几天里，每个人——包括我自己——都在进出安置#italic 桑伽可#!的房子，参加#italic 孔雀游行#!的仪式和典礼。\n\n在举办者的一个房间里，#italic 桑伽可#!被小心翼翼地放在一个高台上，上面盖着白布，周围点着灯和蜡烛。旁边放着一壶水，供病人饮用，还有一个盘子，用于接受捐赠。\n\n当天的活动开始时，#italic 卡瓦尔斯#!会吟唱赞美诗，并进行布道，布道内容不仅包括#italic 孔雀游行#!的重要性、参加活动的好处以及为#italic 桑伽可#!捐款，还包括[faith.GetAdjective]神学和传说的其他方面。对许多人来说，这是了解我们信仰的主要场合。"
 yazidi.0022.a:0 "我们都在仔细聆听#italic 卡瓦尔斯#!的吟唱。"
 yazidi.0023.t:0 "祈祷和捐赠"
 yazidi.0023.desc:0 "#italic 卡瓦尔斯#!的布道已经进行了一段时间，但我们仍尽力保持专注。最后，当布道结束时，我们都站了起来，因为我们被号召尽己所能地捐款。\n\n在场的每个人都走近#italic 桑伽可#!，把自己捐献的钱放在盘子里。一旦我们回到原来坐的地方，我们就会膜拜#italic 桑伽可#!，念各种祷词和赞美诗，有些人甚至会锤打胸膛，以表示他们的虔诚和热忱，尤其是对孔雀天使。"
 yazidi.0023.a:0 "主啊，祢是世间之主！"
 yazidi.0024.t:0 "结束"
 yazidi.0024.desc:0 "终于，#italic 孔雀游行#!结束了。#italic 卡瓦尔斯#!和那些陪同他们的人几乎没有时间休息，他们必须去下一个村庄再做同样的事情，这是他们的职责。无论如何，我很高兴能有机会参加这次活动，并重拾我的信仰。"
 yazidi.0024.a:0 "赞美$yazidi_high_god_name$！"
