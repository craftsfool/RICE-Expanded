 yazidi.0080.t:0 "卷心菜"
 yazidi.0080.desc:0 "最近，一位小贩在附近的[ROOT.Char.GetFaith.GetAdjective]城镇试图出售一些卷心菜时引起了骚乱。因为他不是[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]，所以他要么不知道，要么忘记了，亦或者不在乎在[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]信仰中卷心菜被视为禁忌食物。\n\n总之，虽然事情没有闹得太凶，但很多当地人都很生气，要求我做点什么。"
 yazidi.0080.a:0 "虽然他很无知，但没有造成任何伤害。"
 yazidi.0080.b:0 "他需要为自己的错误公开道歉。"
 yazidi.0080.c:0 "他应该为自己的过失支付罚款。"
 yazidi.0080.info:0 "#emphasis 历史背景：#!传统上，雅兹迪人禁止食用许多食物，其中最著名的是卷心菜。关于这一禁忌的原因有很多，但其中一个比较可信的解释是，卷心菜的单词#italic khas#!是雅兹迪人对圣物或圣人的同音词。"
 yazidi.0081.t:0 "蓝色衣服"
 yazidi.0081.desc:0 "一位外国贵宾向我赠送了许多礼物，其中包括蓝色衣服。然而，在[ROOT.Char.GetFaith.GetName]传统中，蓝色衣服是忌讳要被禁止，就算不被禁止也极不受欢迎。\n\n另一方面，拒绝这份礼物也是不礼貌的……"
 yazidi.0081.a:0 "不可接受！他们应该知道蓝色是我们的禁忌。"
 yazidi.0081.b:0 "出于外交考虑，我必须接受这份礼物。"
 yazidi.0081.c:0 "我可以假装接受它，但之后就把它扔掉。"
 yazidi.0081.info:0 "#emphasis 历史背景：#!雅兹迪人一般不穿蓝色衣服。不过，由于不同文化对蓝色的定义往往大相径庭，雅兹迪人有时会穿上外人可能认为是蓝色的衣服，或者相反，拒绝穿在外人看来不是蓝色的衣服。"
 yazidi.0082.t:0 "阳光下的晨祷"
 yazidi.0082.desc:0 "今天我起得很早，所以依照[ROOT.Char.GetFaith.GetAdjective]的习俗，我花时间对着太阳的方向做晨祷。在祈祷之前，我一定要洗手洗脸，还要亲吻早晨太阳光第一次照进房间的地方。"
 yazidi.0082.a:0 "赞美[ROOT.Char.GetFaith.HighGodName]！"
 yazidi.0083.t:0 "《麦素尔》"
 yazidi.0083.desc:0 "今天，一位属于[ROOT.Char.GetFaith.GetName]宗教学者种姓#italic 皮尔（Pîr，地位仅次于谢赫种姓）#!的人造访了我的宫廷。这位#italic 皮尔#!以其对#italic 《麦素尔》#!的掌握臻于化境而闻名，书中记载了[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]各族的族谱。\n\n为他接风洗尘后，他为我们背诵了#italic 《麦素尔》#!，并着重介绍了我宫廷中的几个显赫家族，尤其是我的家族。这有助于我们记住我们的祖先，因为对[ROOT.Char.GetFaith.GetNameNoTooltip]来说，除了某些特殊家族，读写都是不被允许的。"
 yazidi.0083.a:0 "多谢前来。"
