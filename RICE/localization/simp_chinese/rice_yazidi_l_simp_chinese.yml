 activity_RICE_yazidi_yarsani_jam:0 "贾姆庆典"
 activity_RICE_yazidi_yarsani_jam_desc:0 "贾姆庆典上，所有信众相互分享食物、载歌载舞、虔心祈祷，并用#italic 弹布尔#!演奏圣洁之乐，为信众提供了一个集会团建、接近神明圣质精华的机会。"
 activity_RICE_yazidi_yarsani_jam_selection_tooltip:0 "和当地[GetPlayer.GetFaith.GetAdherentNamePlural]一起参加贾姆庆典\n\n$activity_RICE_yazidi_yarsani_jam_context_tooltip$"
 activity_RICE_yazidi_yarsani_jam_context_tooltip:0 "#emphasis 历史背景：#!贾姆庆典是伊拉克和伊朗的库尔德民族——雅赛尼派信徒以及土耳其的伊斯兰异端——阿列维派信徒举行的一种宗教仪式。这种仪式形式严谨，具有重要的精神和社会功能。"
 activity_RICE_yazidi_yarsani_jam_host_desc:0 "\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得一提升[courtiers|E]、[guests|E][vassals|E]及[liege|E]对你[opinion_i|E][opinion|E]的[character_modifier|E]"
