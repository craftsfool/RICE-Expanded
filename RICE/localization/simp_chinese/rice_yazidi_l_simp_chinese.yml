 RICE_yazidi_sheikh_adi_recently_died:0 "谢赫阿迪去世"
 RICE_yazidi_sheikh_adi_recently_died_desc:0 "谢赫阿迪，一名苏菲神秘主义者，于近期去世，安葬于此。他所展露的智慧、苦行和神迹受到当地各种信仰的人的尊敬。一些诋毁者声称当地人对他的崇拜是过度的，但也有人认为他是一位伟大的宗教人物，值得人们如此敬仰。\n\n#EMP 一个新的宗教正在这个地区成长壮大，它融合了伊斯兰教、古代伊朗信仰等元素。一个新的[faith|E]，#bold 雅兹迪#!，很可能会在未来几十年内的某个时候通过事件在这里出现！#!"
 RICE_yarsani_sultan_sahak_here:0 "苏丹萨哈克的神迹"
 RICE_yarsani_sultan_sahak_here_desc:0 "据传言，该地区是苏丹萨哈克的故乡，他是一位睿智而伟大的宗教导师。据说他宣扬的是一种独特的精神学说，是对该地区古老传统的改革。\n\n#EMP 一个新的宗教正在这个地区成长壮大，它融合了伊斯兰教、古代伊朗信仰等元素。一个新的[faith|E]，#bold 雅赛尼#!，很可能会在未来几十年内的某个时候通过事件在这里出现！#!"
