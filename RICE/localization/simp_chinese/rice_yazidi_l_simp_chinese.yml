 activity_RICE_yazidi_bull_sacrifice:0 "密特拉牛祭"
 activity_RICE_yazidi_bull_sacrifice_desc:0 "密特拉最初献祭一头公牛，促成了宇宙的诞生，让我们复现祭品牛来庆祝这一时刻吧。"
 activity_RICE_yazidi_bull_sacrifice_selection_tooltip:0 "向密特拉献祭一头公牛。\n\n$activity_RICE_yazidi_bull_sacrifice_context_tooltip$"
 activity_RICE_yazidi_bull_sacrifice_context_tooltip:0 "#emphasis 历史背景：#!有理论认为，古代伊朗西北部讲西伊朗语的人，包括库尔德人的祖先，信奉的宗教与祆教有关，但又有别于祆教。祆教是该地区雅兹德教、雅赛尼派和其他教派的宗教基础。有趣的是正统的祆教和古老的西北伊朗信仰可能同时存在。无论如何，这种宗教与正统祆教的一个主要区别是，最初的公牛献祭并不是邪魔阿赫里曼（Ahriman）的邪恶行为，而是密特拉神（Mithra）的积极创造行为。这些思想可能对罗马的密特拉崇拜产生了影响，也是贾姆庆典中公牛献祭的前身。因此，这一活动虽然有些虚构，但其基础可能是古代和中世纪早期伊朗西北部人（如库尔德人）的信仰。"
 activity_RICE_yazidi_bull_sacrifice_host_desc:0 "\n$BULLET_WITH_TAB$随机获得#V [prestige_i|E]25#!至#V [prestige_i|E]200#!的[prestige|E]\n$BULLET_WITH_TAB$随机获得#V [piety_i|E]25#!至#V [piety_i|E]200#!的[piety|E]\n$BULLET_WITH_TAB$基于[piety_level|E]，有#V [GetPlayer.MakeScope.ScriptValue('RICE_yazidi_bull_sacrifice_chance')]%#!获得#P 正面#![character_modifier|E]来提升你的[skills|E]"
 activity_RICE_yazidi_bull_sacrifice_guest_desc:0 "$activity_RICE_yazidi_bull_sacrifice_host_desc$"
