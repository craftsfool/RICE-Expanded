 yorkshire.0030.t:0 "着手准备"
 yorkshire.0030.desc:0 "我决定是时候去[beverley_location.GetNameNoTier]的贝弗利镇，去参观圣约翰墓。他是一个圣洁的人，据说他保佑许多领导人在战争和政治中获得好气。当然我的真正目的应该是去那里满足我的精神需求，仅此而已。"
 yorkshire.0030.a:0 "我将为不久后的旅行做准备！"
 yorkshire.0031.t:0 "去贝弗利"
 yorkshire.0031.desc:0 "我前往贝弗利镇的旅程从今天开始！我向圣约翰墓出发，因为我是一个谦虚而虔诚的朝圣者。"
 yorkshire.0031.a:0 "我去了贝弗利的草地和山丘！"
 yorkshire.0032.t:0 "到达贝弗利"
 yorkshire.0032.desc:0 "我已经来到了贝弗利镇。如果不是因为与圣约翰的关系，贝弗利可能只是英格兰的另一个中等规模的聚居地。圣约翰是该镇的骄傲和喜悦，据说任何侵犯该镇的人都会被圣人本人诅咒，所以我必须小心翼翼地行事，保持尊重。我将参观坟墓，但首先我将在教堂里祈祷，今晚好好休息一下。"
 yorkshire.0032.a:0 "很高兴在这里"
 yorkshire.0033.t:0 "坟墓"
 yorkshire.0033.desc:0 "我现在在圣约翰的墓前。想象一下，像他一样圣人被埋葬在这里！关于他有许多传说，其中一个常见的传说是，他是一个被魔鬼欺骗犯下严重罪行的隐士，在他成为约克主教之前，他不得不忏悔并因此忍受了许多痛苦。\n\n我特别感兴趣的是约翰的旗帜，许多人把巨大的军事力量归功于它。他们说，挥舞着这面旗帜的领主或女士总是能在战斗中获得成功！这就是约翰的旗帜。"
 yorkshire.0033.desc.banner_present:0 "\n\n我怀着好奇心观察这面旗帜。也许有一天我可以利用它，当然是以[ROOT.Char.GetFaith.GetAdjective]教会的名义，并击打我们的敌人。"
 yorkshire.0033.desc.banner_not_present:0 "\n\n目前，这面旗帜不在教堂里，因为它被借到了其他地方，但即使如此这里的许多人在谈论它时都是用虔诚的语调表示敬意，也许有一天我可以看到它。"
 yorkshire.0033.a:0 "我默默地坐着祈祷。"
 yorkshire.0033.toast:0 "你从旗帜的传说中得到了启发！"
 yorkshire.0034.t:0 "反射"
 yorkshire.0034.desc:0 "当我离开圣约翰的坟墓时，我思考了我所见证和经历的一切。我感到精神上非常平静，仿佛这位睿智而虔诚的圣人正在引导我作为[ROOT.Char.GetTitledFirstName]取得更大的成就。"
 yorkshire.0034.a:0 "访问贝弗利是一个很好的经历。"
 yorkshire.0035.t:0 "再次回家"
 yorkshire.0035.desc:0 "我终于结束贝弗利的朝圣之旅并回到了家，我在贝弗利的圣约翰墓前向他表示了敬意。大家都说这是个好决定，我觉得整个行程都是值得的。"
 yorkshire.0035.a:0 "也许有一天我还会再来拜访？"
