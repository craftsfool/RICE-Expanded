 yorkshire.0100.t:0 "谢菲尔德餐具"
 yorkshire.0100.desc:0 "一个游商在镇上，他恰好在卖来自[sheffield_barony.GetNameNoTier]的餐具。该镇作为一直出品餐具，大家都知道这种餐具的质量很高。"
 yorkshire.0100.a:0 "我对此兴趣并买一些！"
 yorkshire.0100.b:0 "不，谢谢。"
 yorkshire.0101.t:0 "斯坦福德器皿"
 yorkshire.0101.desc:0 "[stamford_barony.GetNameNoTier]是整个英格兰许多精美的陶瓷器的来源，许多瓷工在那里的窑场工作。虽然它的质量水平不一定能与欧洲大陆的同类陶瓷相比，但它也是好产品，而且英国典型陶瓷中会使用了一点银而不是锡，所以会比较独一无二。无论如何，我有机会从旅行商人购买一些。"
 yorkshire.0101.a:0 "为我的盛宴准备新杯子和新碗听起来不错！"
 yorkshire.0101.b:0 "请提供帮助我的仆人乘东西的壶和罐子。"
 yorkshire.0101.c:0 "你有美丽的陶瓷吗？我可以买来作为房子的装饰品。"
 yorkshire.0101.d:0 "我认为我暂时不需要任何陶瓷。"
 yorkshire.0102.t:0 "惠特比蛇石"
 yorkshire.0102.desc:0 "我正在拜访一位来自[whitby_barony.GetNameNoTier]的当地贵族，他正在向我展示他在那里发现的一块美丽的蛇石，这种不寻常的石头在[whitby_barony.GetNameNoTier]非常多。\n\n有人说它们是圣人和妇女将蛇变成的石头，在[whitby_barony.GetNameNoTier]，圣希尔达，一位创始修道院的院长，是其创造的这伟大奇迹。其他人如自然哲学家和学者说，这些石头很可能是自然现象的结果，如雷暴或自然岩石演变。\n\n这位贵族说他不清楚事情的真相，但他只是喜欢欣赏这些石头的几何之美，尤其是他拥有的这块。"
 yorkshire.0102.a:0 "这绝对是圣人所创造的奇迹。"
 yorkshire.0102.b:0 "我相信学者们的话，既这是一种自然现象。"
 yorkshire.0102.c:0 "你说对的，不管它如何形成，也阻止不了我们欣赏它的美丽！"
 yorkshire.0102.d:0 "我觉得它们无趣，你还有什么要给我看的？"
 yorkshire.0103.t:0 "约克河谷"
 yorkshire.0103.desc:0 "约克河谷是[york_barony.GetNameNoTier]以西的一片平坦土地，自罗马时代以来主要精于农业，肥沃土地最近提供了比其他地方更多的收获。"
 yorkshire.0103.a:0 "听到这消息真是高兴。"
 yorkshire.0104.t:0 "克努尔和斯佩尔"
 yorkshire.0104.desc:0 "一种名为克努尔和斯佩尔的游戏在约克郡越来越流行，特别是在酒馆和酒吧的平民中，甚至贵族们也开始喜欢上了它。\n\n在这个游戏中，玩家试图用一根棍子（#italic 克努尔#!）尽可能用力地打一个球（#italic 斯佩尔#!）。经过几轮比赛后，谁的球平均打得最远，谁就被宣布为胜利者。\n\n无论如何，我已经被邀请和一些熟人玩一些这种游戏，这可能是一个展示我在这类运动中能力的好时机。"
 yorkshire.0104.a:0 "这听起来可能很有趣！"
 yorkshire.0104.b:0 "我对这些琐碎的娱乐活动没有兴趣。"
 yorkshire.0104.tooltip:0 "玩一个名叫#italic 克努尔和斯佩尔#!的游戏，如果你#bold 获胜#!会让他人记忆深刻！"
 yorkshire.0104.toast.win:0 "你赢了！"
 yorkshire.0104.toast.lose:0 "你输了"
 yorkshire.0105.t:0 "温斯利代尔奶酪"
 yorkshire.0105.desc:0 "温斯利代尔是[north_riding_county.GetNameNoTier]的一个小山谷，在该地区以生产一种美味的奶酪而闻名，这种奶酪是由来自法国罗克福尔的僧侣创造的，他们很久以前就在那里定居，并将配方引入该地区。不管怎么说一些当地人向我赠送了一些这种奶酪作为礼物。"
 yorkshire.0105.a:0 "这将是任何盛宴的一个重要部分"
 yorkshire.0106.t:0 "阿尔昆"
 yorkshire.0106.desc:0 "我正在反思阿尔昆的生活和时代，这位来自约克的著名学者和僧侣成为查理曼宫廷的重要学者。他培养了那个时代的许多重要思想家，一想到我统治的领土离他出生和成长的地方不太远，我就感到有一点自豪感。我记得他的两句名言包括：\n\n“切记要爱护灵魂胜过爱护肉体，因为前者永恒后者终会消散。”\n\n“不要听那些一直说'人民的声音就是上帝的声音'的人的话，因为民众总是不理智的”"
 yorkshire.0106.a:0 "第一句话呼唤着我，我们必须考虑精神世界！"
 yorkshire.0106.b:0 "第二句话呼唤，民众充其量不过是一群不守规矩的暴徒。"
 yorkshire.0107.t:0 "卡德蒙的颂歌"
 yorkshire.0107.desc:0 "七世纪的盎格鲁‑撒克逊诗人凯德蒙曾经住在[whitby_barony.GetNameNoTier]修道院，年轻当过放牛娃后来当过修士。他最有名的作品《凯德蒙的赞美诗》今天由一位当地诗人朗诵给我听，然后他把一份手抄本送给我。\n\n#italic 现在我们必须崇拜天堂的守护者，#!\n#italic 造物神能力和祂的目的，#!\n#italic 永恒之父的工作#!\n#italic 因为祂，永恒的主，确立了每个奇迹的起源#!\n#italic 祂首先为人类的子孙创造#!\n#italic 天堂作为屋顶，圣洁的创造者。#!\n#italic 然后是人类的守护者，#!\n#italic 永恒的主，后来又指定了中间之土，#!\n#italic 全能的主，为人类指定了肥沃之地。#!"
 yorkshire.0107.a:0 "这是一首可爱的、鼓舞人心的诗！"
 yorkshire.0108.t:0 "克劳兰的圣古斯拉"
 yorkshire.0108.desc:0 "克劳兰的圣古斯拉是[lincolnshire_county.GetNameNoTier]的一位受欢迎的当地圣人。虽然他在克罗兰修道院的神龛一直是当地朝圣的热门地点，并以其治愈能力而闻名，但最近的人流比往常要大。"
 yorkshire.0108.a:0 "这应该有助于该地区的经济与精神双赢"
 yorkshire.0109.t:0 "斯韦尔河"
 yorkshire.0109.desc:0 "几世纪以来，[north_riding_county.GetNameNoTier]斯韦尔河周围地区是英格兰流速最快的河流之一，并且一直是当地的铅矿中心。最近由于该地区对铅的需求增加，这里的铅业出现了经济繁荣。"
 yorkshire.0109.a:0 "很好，很好"
 yorkshire.0110.t:0 "佩妮篱笆"
 yorkshire.0110.desc:0 "我正在听一个来自[whitby_barony.GetNameNoTier]的传说，它解释了该镇的一个传统，即#bold 佩妮篱笆#!根据传说，三个当地的贵族在附近的树林里打猎，追捕一头野猪。野猪进入了一个善良的隐士的住所，隐士拒绝让贵族通过，但贵族充满了嗜血的欲望，并对他阻挡他们的行为感到愤怒，于是杀死了隐士。之后贵族对自己在激动犯罪而后悔；当隐士躺在床上时，他告诉他们[ROOT.Char.GetFaith.HighGodName]，如果他们和他们的后代每年都进行一次仪式，就会原谅他们的罪。\n\n从那时起，惠特比的人们每年都要举行一个仪式，用木桩编织成一个短的篱笆。他们以盛大的仪式将其放置在斯韦尔河边并且必须确保它能承受三次潮涨。"
 yorkshire.0110.a:0 "这是一个有趣的小故事，但我对此表示怀疑。"
 yorkshire.0110.b:0 "一个寓教故事，好在[whitby_barony.GetNameNoTier]的人记得它。"
 yorkshire.0111.t:0 "牛与牛犊"
 yorkshire.0111.desc:0 "我正经过[west_riding_county.GetNameNoTier]，特别是一个被称为#bold 伊克拉·摩尔#!的地区！那里有一个巨大的岩石群，由于与牛相似，被当地人称之为“牛和小牛”。根据当地的传说，这两块岩石曾经是一体的，直到巨人隆博德（曾经居住在约克郡）在逃避他的妻子怒火时，在逃跑过程中不小心踩到了岩石，从而将岩石一分为二。\n\n总之这是一个美丽的景象，岩石在草地和天空的衬托下显得最为优雅。"
 yorkshire.0111.a:0 "一想到自然界中存在这样的奇迹！"
