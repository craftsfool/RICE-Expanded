 yorkshire.0010.t:0 "女中豪杰"
 yorkshire.0010.desc:0 "我出生于[GetTitleByKey('b_jerusalem').GetNameNoTier]，我的父母是虔诚的[GetReligionByKey('christianity_religion').GetAdherentNamePlural]，那时正从[GetTitleByKey('d_york').GetNameNoTier]前来朝圣，双亲去世后，我独自抚养年幼的弟弟[thomas.GetFirstName]多年，后来他在法国成为了一名修士。\n\n如今，我已长大成人，重新前往这座伟大的城市进行朝圣。或许我会给[thomas.GetFirstNameNoTooltip]捎个信——传闻[GetReligionByKey('christianity_religion').GetAdjective]与[GetReligionByKey('islam_religion').GetAdjective]大军即将在黎凡特交锋。\n\n启程朝圣时我立下誓言，即便身为女子，我也要为保卫圣地；即便恐惧，但也要为全能上帝而战，我定会战胜恐惧，成为[Glossary('维拉戈','VIRAGO_GLOSS')]。"
 yorkshire.0010.a:0 "我主耶稣，求您保护并指引我！"
 yorkshire.0011.t:0 "烹饪锅头盔"
 yorkshire.0011.desc:0 "我的朝圣之旅并不轻松，危险无处不在，我身为女子也不得不战斗。\n\n我曾遭遇强盗、异教徒和各色歹徒，最近一次混战中，我甚至不得不临时把烹饪锅当作头盔来保护自己！但有人可能会觉得这个行为可笑，但这顶“头盔”确实保护我了，也是我誓言的见证"
 yorkshire.0011.a:0 "我要把这口锅当头盔用。"
