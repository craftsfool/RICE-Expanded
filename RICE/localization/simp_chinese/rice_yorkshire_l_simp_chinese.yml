 RICE_yorkshire_grant_stourbridge_charter_fair_tooltip:0 "剑桥被授予在斯陶尔布里奇举办[charter_fair|E]的权利"
 RICE_yorkshire_grant_stourbridge_charter_fair_desc:0 "一直以来剑桥的聚居地一直在请求在斯陶尔布里奇沿线举办自己的[charter_fair|E]的权利。虽然在英国其他地方也有很多重要的展会，但我感觉斯陶尔布里奇的展会会因为其优越的地理位置而非常成功。"
 RICE_yorkshire_grant_stourbridge_charter_fair_confirm:0 "绝妙的想法！让我们开始吧！"
 RICE_yorkshire_grant_stourbridge_charter_fair_context_tooltip:0 "#emphasis 历史背景：#!斯托布里奇集市是剑桥最重要的贸易集市。事实上，它在中世纪晚期和近代早期成为了欧洲最大的贸易集市之一。它启发了#italic 《天路历程》#!中的《名利场》一章，并且还吸引了许多著名人物前来参观，如艾萨克·牛顿。它最后一次举办是在1933年，1934年正式废止。"
