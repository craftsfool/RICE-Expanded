 yorkshire.0003.t:0 "斯托尔布里奇集市"
 yorkshire.0003.desc:0 "[cambridge_barony.GetNameNoTier]和附近的一些聚居地的经济正在增长，并作为伦敦以外的英格兰中部较突出的商业区域之一。为了鼓励其持续繁荣，当地官员认为必须向该地区授予特许集市的权力。\n\n因此，剑桥附近的斯托尔布里奇被授予特许权，在每年8月或9月举行集市。有许多人说斯托尔布里奇的位置极具优势，因为它位于通往该地区几个主要聚居地（如纽马特）之间，这应该会带来更多的交通和贸易。"
 yorkshire.0003.a:0 "太好了！"
