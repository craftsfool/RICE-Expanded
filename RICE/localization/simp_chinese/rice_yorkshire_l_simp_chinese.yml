 yorkshire.0050.t:0 "斯坦福德的公牛"
 yorkshire.0050.desc:0 "我在访问[stamford_barony.GetNameNoTier]镇时，看到不远处的草地上有两头公牛在争夺一头母牛。我在安全的距离上观察着这一幕，感到有些好笑，直到[stamford_barony.GetNameNoTier]的几个当地屠夫带着他们的狗来驱赶公牛。然而这似乎只是进一步激怒了公牛\n\n公牛在居住区内狂奔，惊慌失措的镇民们争先恐后地跑来跑去。我和我的几个卫兵加入了和当地人一起安抚公牛。最后我们成功了。"
 yorkshire.0050.a:0 "虽然这很疯狂，但也相当有趣！"
 yorkshire.0051.t:0 "斯坦福德奔牛节"
 yorkshire.0051.desc:0 "[stamford_barony.GetNameNoTier]的镇民们感谢我协助他们平息公牛，并为我举行了一场小小的宴会。我非常享受，作为[stamford_barony.GetNameNoTier]的领主，我决定永久授予当地屠夫那片斗牛的草地，只要他们每年重演并庆祝这一事件，举办一场精彩的、老式的斗牛比赛。没有人会介意每年再花一天时间参加一些庆祝活动，不是吗？"
 yorkshire.0051.a:0 "我想快一点回到斯坦福德！"
 yorkshire.0051.tooltip:0 "从现在开始，[county_capital|E]的[rulers|E]如果在[stamford_barony.GetNameNoTier]附近，可以举办[GetActivityType( 'activity_RICE_yorkshire_stamford_bull_run' ).GetName][activity|E]"
 yorkshire.0052.t:0 "斯坦福德奔牛节"
 yorkshire.0052.desc:0 "关于[bull_runner.GetTitledFirstName]如何英勇地帮助[stamford_barony.GetNameNoTier]的镇民平息几头在镇上乱窜的公牛的消息正在迅速传播。之后[bull_runner.GetSheHe]要求每年用节日庆典和放牛狂奔来纪念这一事件。"
 yorkshire.0052.a:0 "也许有一天我会到斯坦福德去见证这一切。"
 yorkshire.0052.tooltip:0 "$yorkshire.0051.tooltip$"
 yorkshire.0053.t:0 "抵达斯坦福德"
 yorkshire.0053.desc.bull_runner:0 "我决定参加今年[stamford_barony.GetNameNoTier]的奔牛活动。根据传统，这项活动很早以前就开始了，当时[bull_runner.GetSheHe]协助一些当地屠夫安抚了几头公牛。虽然有些人看不起庆祝活动的喧闹、狂欢气氛，但我希望今年能看到一些令人兴奋的东西！"
 yorkshire.0053.desc.not_bull_runner:0 "我决定参加今年[stamford_barony.GetNameNoTier]的跑牛活动。我很高兴当地人同意我的建议，在前一阵子那件相当有趣的事件之后，每年都举办一次跑牛。虽然有些人看不起庆祝活动的喧闹、狂欢气氛，但我希望今年能看到一些令人兴奋的东西！"
 yorkshire.0053.a:0 "这将会是一场激烈的好戏！"
 yorkshire.0054.t:0 "时间差不多了！"
 yorkshire.0054.desc:0 "[stamford_barony.GetNameNoTier]的奔牛节就在明天！我一进城就有几个当地的小贵族和知名镇民迎接我。其中一位告诉我，屠夫作为这一传统的重要参与者，已经完成了为主要活动挑选他们能找到的最狂野、最暴力的公牛。无论如何，我期待着亲眼目睹这一奇景。\n\n在我去休息之前，我想知道我是否应该亲自参加跑牛，或者只是远远观察。一些假正经的人已经看不起我出现在这样一个喧闹、血腥的事件中，认为这是不体面、没文化且不适合像我这样有地位的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetTitleAsNameNoTooltip]，而我主动参与只会让事情看起来更糟。另一方面，这可能是一个很大的乐趣活动。"
 yorkshire.0054.a:0 "我明天会参加。"
 yorkshire.0054.b:0 "我只会远远地观察。"
 yorkshire.0055.t:0 "早晨准备"
 yorkshire.0055.desc:0 "清晨，今天可是个大日子，斯坦福德的奔牛节就要开始了! 当地[ROOT.Char.GetFaith.HouseOfWorship]的钟声被敲响，通知所有人奔牛节即将开始。然后镇上的传令官向所有的镇民宣布，他们要关闭商店的门。当每个人都聚集在一起时，许多人把“牛粪”即一种混合了泥土和公牛粪便的东西，涂在自己身上以示好运。一旦一切准备就绪，公牛被放出来，骚乱就开始了，男人、女人和孩子们都追着公牛跑！"
 yorkshire.0055.a:0 "它来了！"
 yorkshire.0056.t:0 "奔牛节"
 yorkshire.0056.desc.bull_runner:0 "当我自己追着公牛跑的时候，我经历的只有混乱。当然为了保护我，一些卫兵陪着我，但他们似乎也很享受，因为我们迷失在欢呼声、叫喊声和吵闹声中。当一个特别指定的人甚至在一个桶里滚时，我笑了。"
 yorkshire.0056.desc.not_bull_runner:0 "整个场面完全是混乱的，我观察到镇民和当地贵族在追赶公牛。许多人穿着花花绿绿的衣服，这些衣服在日常生活中是很可笑的，但却符合这里的节日气氛，目的是为了更加激怒公牛。"
 yorkshire.0056.a:0 "来吧！开始吧！"
 yorkshire.0057.t:0 "公牛被抓住了！"
 yorkshire.0057.desc:0 "最后，这头公牛被追到斯坦福德附近的所谓公牛草地上，因为在那里发生了第一次公牛奔跑，并成功地被抓住和宰杀。当屠夫们屠杀并准备好公牛的肉时，整个小镇爆发出欢快的醉人歌舞。\n\n#italic 来吧，你们这些勇敢的男孩#!\n#italic 谁喜欢诱导漂亮公牛，#!\n#italic 谁以噪音为乐，#!\n#italic 你们将吃的撑肠拄腹，#!\n#italic 在斯坦福镇的跑牛日，#!\n#italic 我们将向你展示这种正确的英勇表演；#!\n#italic 你会说，你从未见过这样的场面，#!\n#italic 就像你将在斯坦福德看到的那样。#!"
 yorkshire.0057.a:0 "我等不及想参加盛宴了。"
 yorkshire.0058.t:0 "奔牛节结束了"
 yorkshire.0058.desc:0 "一般来说，在斯坦福德奔牛节上，公牛的肉会被切开并煮熟，以供当地的穷人和有需要的人吃，以示当地贵族、镇上官员和行会的仁慈。我们都享受美食和饮料，并跳舞到深夜。"
 yorkshire.0058.a:0 "总的来说，这是很有趣的活动！"
