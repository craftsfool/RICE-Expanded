l_simp_chinese:
 RICE_decision_norman_culture_requirement:0 "你的[culture|E]来源于诺曼或与诺曼融合"
 game_concept_john_of_beverley:0 "贝弗利的约翰"
 game_concept_bishop_john:0 "约翰主教"
 game_concept_saint_john_of_beverley_short:0 "圣约翰"
 game_concept_saint_john_of_beverley:0 "贝弗利的圣约翰"
 game_concept_saint_john_of_beverley_desc:0 "$game_concept_saint_john_of_beverley$是8世纪初的约克主教，在历史于1037年被封为圣人，是中世纪英国广受尊重的圣人。\n\n在867年开局，圣约翰还没有被封为圣人。为了封圣，需要有一个[ruler|E]首先采取[decision|E]，向他#V 参谒#!。往后一百年，另一个[ruler|E]可以采取[decision|E]将其封为#V 圣人#!\n\n一旦圣约翰被封为圣徒，或者直接在1066年开局，该地区的[rulers|E]可以采取[decision|E]去#V 贝弗利朝圣#!向他表示敬意。如果作为#V 东约克郡[liege|E]#!的[king|E]或[emperor|E]至少前往一次，就可以获得#V 借用圣约翰旗帜#!的[decision|E]，该决议一生只能使用一次，但可以获得巨大的军事[character_modifier|E]增幅。事先多去朝拜一次，可以确保奖励更加强大。"
 game_concept_charter_fair:0 "特许集市"
 game_concept_charter_fairs:0 "特许集市"
 game_concept_charter_fair_desc:0 "在中世纪的英格兰，$game_concept_charter_fair$是授予一些定居点的重要特权。在游戏中，有几个定居点可以通过[decision|E]获得这一特权，并会给予他们适当的[county_modifiers|E]促进他们的经济发展。定居点分别为斯坦福德、波士顿、温彻斯特、北安普顿、斯托尔桥（在剑桥）和斯卡伯勒。\n\n前四个定居点是相互关联的，因为它们在历史上是一些比较著名的集市。一旦所有四个定居点的特许权都被授予，在升级它们的[county_modifiers|E]后的某个时间会触发一个特殊事件，之后授予剑桥的斯托尔布里奇和斯卡伯勒（因为这个著名集市启迪了歌曲《斯卡伯勒集市》）的特许权。\n\n只有在你至少是[duke|E]的情况下才能授予特许权，但如果你是[king|E]或[emperor|E]，那么要求就比较简单。如果你是一个较低的[rank|E]贵族，你需要在[king|E]或[emperor|E]的[realm|E]中，支付一定的[prestige|E]，向你的[top_liege|E]请求授予特许权。"
 building_type_RICE_yorkshire_foss_dyke:0 "福斯堤"
 building_type_RICE_yorkshire_foss_dyke_desc:0 "福斯堤是不列颠群岛上仍在运行的最古老的运河之一，其历史可能可以追溯到罗马时代，它连接了托克西的特伦特河和林肯的聚居地。"
 building_RICE_yorkshire_foss_dyke:0 "$building_type_RICE_yorkshire_foss_dyke$"
 building_RICE_yorkshire_foss_dyke_desc:0 "$building_type_RICE_yorkshire_foss_dyke_desc$"
 building_type_RICE_yorkshire_humber_ferry:0 "亨伯渡口网络"
 building_type_RICE_yorkshire_humber_ferry_desc:0 "亨伯河是一个大型河口，将林肯郡和约克郡分开。有几个聚居地被授予经营渡船的权利，渡船穿过这片水域，成为从英格兰南部进入约克郡的主要路线之一。"
 building_RICE_yorkshire_humber_ferry:0 "$building_type_RICE_yorkshire_humber_ferry$"
 building_RICE_yorkshire_humber_ferry_desc:0 "$building_type_RICE_yorkshire_humber_ferry_desc$"
 building_type_RICE_english_wool_industry_01:0 "英格兰羊毛业"
 building_type_RICE_english_wool_industry_01_desc:0 "羊毛是英国中世纪经济的支柱和推动支柱。"
 building_RICE_english_wool_industry_01:0 "牧羊场"
 building_RICE_english_wool_industry_01_desc:0 "随着欧洲大陆对羊毛需求的增加，自给自足的羊毛生产正逐渐演变成一个更加集中的产业，并得到当地和外国商人的投资支持。"
 building_RICE_english_wool_industry_02:0 "羊毛市场"
 building_RICE_english_wool_industry_02_desc:0 "在国家的支持下，羊毛产业继续在这个地区开花结果，蓬勃发展。地区城市中心对羊毛进行加工，并准备将它们出口到欧洲其他地方。"
 building_RICE_english_wool_industry_03:0 "羊毛贸易港"
 building_RICE_english_wool_industry_03_desc:0 "这个地区是不列颠群岛上主要的大型羊毛生产中心之一。商人们从世界各处涌来做生意，赚取了巨大的利润，给该地区带来了许多繁荣和财富。"
 RICE_yorkshire_scarborough_fair_modifier:0 "斯卡伯勒集市"
 RICE_yorkshire_scarborough_fair_modifier_desc:0 "海滨城市斯卡伯勒最近获得了每年8月和9月举办特许集市的特许权。虽然这不是不列颠群岛最大的交易会，但无疑将对该地区的经济和文化产生多年的积极影响。\n\n#italic 你要去斯卡伯勒集市吗？#!\n#italic 香芹、鼠尾草、迷迭香和百里香#!\n#italic 请代我问候住在那里的一个人，#!\n#italic 他/她曾经是我的真爱#!\n"
 RICE_yorkshire_scarborough_fair_patron:0 "授予斯卡伯勒市举办集市的特许权"
 RICE_yorkshire_scarborough_fair_patron_desc:0 "#italic 你要去斯卡伯勒集市吗？#!\n#italic 香芹、鼠尾草、迷迭香和百里香#!\n#italic 请代我问候住在那里的一个人#!\n#italic 他/她曾经是我的真爱#!\n\n"
 RICE_yorkshire_john_of_beverley_blessing:0 "由贝弗利约翰主教赐福"
 RICE_yorkshire_john_of_beverley_blessing_desc:0 "他们说这位大人或女士得到了贝弗利约翰的祝福，约翰是8世纪的英国主教，在约克郡特别受到尊敬，一些军事上的成功可以归功于约翰主教的精神指导。"
 RICE_yorkshire_beverley_sanctuary_timer:0 "最近建成的约翰主教圣所"
 RICE_yorkshire_beverley_sanctuary_timer_desc:0 "对贝弗利主教约翰的崇敬与日俱增，因此当地的一位领导人协助在贝弗利他的坟墓周围建造了一个相当大的圣殿，这无疑将证明对该镇的声望和经济有很大的帮助。有一些人说贝弗利的约翰被承认为圣人只是时间问题。"
 RICE_yorkshire_saint_john_banner_inspired:0 "受贝弗利的圣约翰旗帜启发"
 RICE_yorkshire_saint_johns_banner_1:0 "圣约翰的旗帜 (1)"
 RICE_yorkshire_saint_johns_banner_1_desc:0 "这位统治者目前正在借用贝弗利圣约翰的旗帜，这面旗帜通常存放在贝弗利的约翰圣殿中。许多人将巨大的神力归于这面旗帜，因为据说它能为挥舞它的人带来光荣的胜利。"
 RICE_yorkshire_saint_johns_banner_2:0 "圣约翰的旗帜 (2)"
 RICE_yorkshire_saint_johns_banner_2_desc:0 "$RICE_yorkshire_saint_johns_banner_1_desc$"
 RICE_yorkshire_saint_johns_banner_3:0 "圣约翰的旗帜 (3)"
 RICE_yorkshire_saint_johns_banner_3_desc:0 "$RICE_yorkshire_saint_johns_banner_1_desc$"
 RICE_yorkshire_saint_johns_banner_4:0 "圣约翰的旗帜 (4)"
 RICE_yorkshire_saint_johns_banner_4_desc:0 "$RICE_yorkshire_saint_johns_banner_1_desc$"
 RICE_yorkshire_charter_fair_stamford:0 "斯坦福德的特许集市"
 RICE_yorkshire_charter_fair_stamford_desc:0 "在四旬期举行的斯坦福德集市是英格兰较大的贸易集市之一，为当地带来许多贸易和繁荣。"
 RICE_yorkshire_charter_fair_boston:0 "波士顿特许集市"
 RICE_yorkshire_charter_fair_boston_desc:0 "波士顿特许集市在7月举行，是英国较大的特许集市之一，为该地带来了许多贸易和繁荣。"
 RICE_yorkshire_charter_fair_winchester:0 "温彻斯特的特许集市 "
 RICE_yorkshire_charter_fair_winchester_desc:0 "9月举行的温彻斯特特许集市是英格兰较大的特许集市之一，为该地带来了许多贸易和繁荣。"
 RICE_yorkshire_charter_fair_northampton:0 "北安普顿的特许集市"
 RICE_yorkshire_charter_fair_northampton_desc:0 "北安普顿特许集市在11月举行，是英格兰较大的特许集市之一，为该地区带来了许多贸易和繁荣。"
 RICE_yorkshire_charter_fair_stamford_upgraded:0 "斯坦福德的大型特许集市"
 RICE_yorkshire_charter_fair_stamford_upgraded_desc:0 "斯坦福德集市在四旬期举行，是英格兰最重要的贸易集市之一，因为它为该地区带来了许多贸易和繁荣。它与其他大型集市，包括波士顿、温彻斯特和北安普顿的集市，形成一个固定的时间序列。"
 RICE_yorkshire_charter_fair_boston_upgraded:0 "波士顿大型特许集市"
 RICE_yorkshire_charter_fair_boston_upgraded_desc:0 "波士顿博览会在7月举行，是英格兰最重要的贸易集市之一，因为它为该地区带来了许多贸易和繁荣。它与其他大型集市，包括斯坦福德、温彻斯特和北安普顿的集市，形成一个固定的时间序列。"
 RICE_yorkshire_charter_fair_winchester_upgraded:0 "温彻斯特的大型特许集市"
 RICE_yorkshire_charter_fair_winchester_upgraded_desc:0 "温彻斯特交易会在9月举行，是英格兰最重要的贸易集市之一，因为它为该地区带来了许多贸易和繁荣。它与其他大型集市，包括斯坦福德、波士顿和北安普顿的集市，形成一个固定的时间序列。"
 RICE_yorkshire_charter_fair_northampton_upgraded:0 "北安普顿的大型特许集市"
 RICE_yorkshire_charter_fair_northampton_upgraded_desc:0 "北安普顿博览会在11月举行，是英格兰最重要的贸易集市之一，因为它为该地区带来了许多贸易和繁荣。它与其他大型集市，包括斯坦福德、温彻斯特和波士顿的集市，形成一个固定的时间序列。"
 RICE_yorkshire_charter_fair_stourbridge:0 "斯托尔布里奇集市"
 RICE_yorkshire_charter_fair_stourbridge_desc:0 "剑桥镇获得了沿斯托尔布里奇公地举特许集市的权利。它正在成为欧洲最大的集市之一，为该地区带来许多财富和声望。"
 RICE_yorkshire_recently_granted_grand_charter_fair:0 "最近获批的特许集市"
 RICE_yorkshire_recently_granted_grand_charter_fair_desc:0 "这位统治者最近授予了英国的一个定居点举办大型特许集市的权利或者主动向他们的领主成功请愿。"
 RICE_yorkshire_participated_in_stamford_bull_run:0 "直接参与斯坦福德奔牛节事件"
 RICE_yorkshire_was_at_stamford_bull_run:0 "曾出席最近的斯坦福德奔牛活动"
 RICE_yorkshire_grant_scarborough_fair_charter:0 "授予斯卡伯勒一个特许集市"
 RICE_yorkshire_grant_scarborough_fair_charter_tooltip:0 "该给予斯卡布罗举办[charter_fair|E]的权利"
 RICE_yorkshire_grant_scarborough_fair_charter_desc:0 "海滨小镇斯卡伯勒要求获得举办自己的[charter_fair|E]的权利已经有一段时间了。虽然英国其他地方也有许多重要的集市，但斯卡伯勒镇有一些特别的、令人难忘的地方。"
 RICE_yorkshire_grant_scarborough_fair_charter_confirm:0 "欧芹、鼠尾草、迷迭香和百里香……"
 RICE_yorkshire_grant_scarborough_fair_charter_context_tooltip:0 "#emphasis 历史背景：#!1253年，英格兰国王亨利三世赐予斯卡伯勒市一份皇家特许状，赋予该市许多特权，包括举办贸易集市的权利；这一集市一直持续到1788年才结束。虽然它不是英格兰最著名的集市，但它足够引人注目，著名的英国民歌《斯卡伯勒集市》的灵感就来源于此。这首歌的歌词围绕着叙述者向他们的前任恋人提出一系列不可能完成的任务，如果他们想在斯卡伯勒集市上重燃爱火，就必须在见面之前完成这些任务。"
 RICE_yorkshire_pay_homage_to_john_of_beverley:0 "向贝弗利的约翰表示敬意"
 RICE_yorkshire_pay_homage_to_john_of_beverley_tooltip:0 "我应该去看看[john_of_beverley|E]的墓"
 RICE_yorkshire_pay_homage_to_john_of_beverley_desc:0 "近几十年来，已故约克主教[john_of_beverley|E]的声望在虔诚的基督徒中一直在上升。有一些人甚至把军事上的成功归功于他的恩赐。不仅向此人表示敬意而且在他位于贝弗利的坟墓周围建立一个圣地，也许是个好主意。"
 RICE_yorkshire_pay_homage_to_john_of_beverley_effect_tooltip:0 "在作出这个[decision|E]的一个#V 世纪#!后，[john_of_beverley|E]可以被封为圣徒，这将使#V 约克#!附近的基督教[rulers|E]使用[decision|E]#V 去贝弗利朝圣#!。"
 RICE_yorkshire_pay_homage_to_john_of_beverley_confirm:0 "去贝弗利！"
 RICE_yorkshire_pay_homage_to_john_of_beverley_context_tooltip:0 "#emphasis 历史背景：#!贝弗利的约翰是公元八世纪初期约克的主教。虽然他后来成为了中世纪英国最著名的圣人之一，但对他的崇敬活动在他于1037年被教宗封圣之前就已经持续了很长时间。根据后来的中世纪史料，埃塞尔斯坦国王在934年拜访了约翰主教的墓地，之后在战争中取得了胜利。他认为这都是多亏了约翰的庇佑，于是在贝弗利建立了一个围绕约翰墓地的圣地。这个圣地的建立可能是一个比较渐进的过程，但这个传说很好地反映了贝弗利的约翰的影响力和重要性。"
 RICE_yorkshire_secure_canonization_of_john_of_beverley:0 "追封贝弗利的约翰为圣人"
 RICE_yorkshire_secure_canonization_of_john_of_beverley_tooltip:0 "我们应该尊重和膜拜[bishop_john|E]"
 RICE_yorkshire_secure_canonization_of_john_of_beverley_desc:0 "已故约克主教[john_of_beverley|E]长期以来一直被生活在约克周围的人们尊为他们的保护者和精神导师。我们应该与当地神职人员一起努力，推动教会当局对他进行正式封圣。"
 RICE_yorkshire_secure_canonization_of_john_of_beverley_effect_tooltip:0 "#V 约克#!附近的基督徒[rulers|E]可以使用[decision|E]前往#V 贝弗利朝圣#!"
 RICE_yorkshire_secure_canonization_of_john_of_beverley_confirm:0 "这是正确的事"
 RICE_yorkshire_secure_canonization_of_john_of_beverley_context_tooltip:0 "#emphasis 历史背景：#!贝弗利的约翰在公元八世纪初担任约克主教。他于1037年被封为圣人，是中世纪英国最杰出的圣徒之一。多位英国国王都是他的崇敬者；例如，亨利五世将阿金库尔战役的胜利归功于约翰的干预。圣约翰为贝弗利带来了强大的庇佑，促进了该地在中世纪的政治特权和经济发展。"
 RICE_yorkshire_beverley_century_passed_req:0 "自从[bishop_john|E]周围的圣殿建成以来，至少已经过去了一个#V 世纪#!。"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley:0 "前往贝弗利朝圣"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley_tooltip:0 "是时候向[saint_john_of_beverley|E]表示敬意"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley_desc:0 "我想去朝圣，向[saint_john_of_beverley|E]致敬。据说有德行的统治者膜拜他会得到力量和胜利的祝福。"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley_confirm:0 "让我们做好准备！"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley_effect_tooltip:0 "完成朝圣之旅，你可以采取[decision|E]，只要你满足其他要求，就可以#V 借用贝弗利的圣约翰旗帜#!"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley_effect_2_tooltip:0 "多次参加朝圣之旅将增加#V 借用圣约翰旗帜#!的[decision|E]强化幅度"
 RICE_yorkshire_go_on_a_pilgrimage_to_beverley_context_tooltip:0 "$RICE_yorkshire_secure_canonization_of_john_of_beverley_context_tooltip$"
 RICE_yorkshire_beverley_pilgrimage_distance_req:0 "[realm_capital|E]靠近#V 贝弗利#!"
 RICE_yorkshire_beverley_pilgrimage_english_culture_req:0 "[realm_capital|E]是位于不列颠群岛、法国或低地国家。"
 RICE_yorkshire_borrow_banner_of_saint_john:0 "借用圣约翰旗帜"
 RICE_yorkshire_borrow_banner_of_saint_john_tooltip:0 "[saint_john_of_beverley_short|E]的旗帜对使用它的人来说是一个强大的圣物。"
 RICE_yorkshire_borrow_banner_of_saint_john_desc:0 "据说[saint_john_of_beverley|E]的旗帜能赋予其持有者强大的军事力量。我认为我应该拥有它，以打击[ROOT.Char.GetFaith.GetAdjective]会的敌人，当然，不是因为我觊觎世俗的权力或任何类似的东西。"
 RICE_yorkshire_borrow_banner_of_saint_john_effect_tooltip:0 "[character_modifier|E]的强度取决于你多少次[GetActivityType( 'activity_RICE_yorkshire_beverley_pilgrimage' ).GetName]"
 RICE_yorkshire_borrow_banner_of_saint_john_effect_2_tooltip:0 "#X 这个决议一生只能一次，慎重考虑！#!"
 RICE_yorkshire_st_john_banner_not_taken_req:0 "目前没有人借用[saint_john_of_beverley_short|E]的旗帜。"
 RICE_yorkshire_st_john_banner_pilgrimage_req:0 "至少去了一次[GetActivityType( 'activity_RICE_yorkshire_beverley_pilgrimage' ).GetName]"
 RICE_yorkshire_st_john_banner_east_riding_req:0 "你或者任意封臣并未拥有约克郡东区的[county|E]"
 RICE_yorkshire_borrow_banner_of_saint_john_confirm:0 "我将以[ROOT.Char.GetFaith.HighGodName]的名义挥舞旗帜!"
 RICE_yorkshire_borrow_banner_of_saint_john_context_tooltip:0 "#emphasis 历史背景：#!圣约翰旗帜在中世纪期间曾被多位英格兰统治者在不同的时刻使用过。例如，爱德华一世在1296年和1300年的苏格兰战役中就随身携带了这面旗帜。这些在数个世纪里取得的各种军事胜利，只是进一步巩固了圣人的声望。"
 RICE_yorkshire_borrow_banner_req:0 "该旗帜目前没有被任何其他[ruler|E]所拥有。"
 RICE_yorkshire_spectate_the_stamford_bull_run:0 "观赏斯坦福德奔牛节"
 RICE_yorkshire_spectate_the_stamford_bull_run_tooltip:0 "参观斯坦福德的年度奔牛节"
 RICE_yorkshire_spectate_the_stamford_bull_run_desc:0 "斯坦福德奔牛节听起来是一个有趣的活动！我应该在今年参与来看看这个活动怎么样。"
 RICE_yorkshire_spectate_the_stamford_bull_run_effect_tooltip:0 "你参观[bull_run_stamford.GetNameNoTier]，感受到一些惊心动魄且吵闹项目的乐趣。"
 RICE_decision_bull_run_month_requirement:0 "月份必须在八月至十月之间"
 RICE_decision_bull_run_distance_requirement:0 "[realm_capital|E]靠近#V 斯坦福德#!"
 RICE_yorkshire_spectate_the_stamford_bull_run_confirm:0 "激动人心的事情在等候！"
 RICE_yorkshire_spectate_the_stamford_bull_run_context_tooltip:0 "#emphasis 历史背景：#!斯坦福镇曾经每年11月13日举办一场公牛奔跑活动。最早的明确记载可以追溯到公元1389年，不过这个活动可能在那之前就已经存在了。根据一个很可能是虚构的传说，这个传统始于13世纪初，当时一个当地的诺曼领主曾帮助屠夫分开了两头为争夺母牛而打斗的公牛。他非常喜欢这个活动，于是建议每年都重演一次。尽管斯坦福镇并不是唯一举办这种活动的地方，但这个喧闹的节日却一直延续到清教徒时代之后，直到1839年因为引起了严重的公共秩序混乱而被取缔。"
 RICE_yorkshire_charter_fair_granted_recently_req:0 "在你的[realm|E]中，最近没有人作出[decision|E]，要求授予特许交易"
 RICE_yorkshire_grant_stamford_charter_fair:0 "给予斯坦福一个特许集市"
 RICE_yorkshire_grant_stamford_charter_fair_tooltip:0 "该给予斯坦福德举办[charter_fair|E]的权利"
 RICE_yorkshire_grant_stamford_charter_fair_desc:0 "#V 斯坦福德#!正在成为英格兰一个越来越重要并且极具影响力的贸易中心，当地商人和知名人士一直在请求给予该镇举办大型[charter_fair|E]的特权。"
 RICE_yorkshire_grant_stamford_charter_fair_effect_tooltip:0 "你将向你的[liege|E]请愿，授予这个聚居地拥有举办[charter_fair|E]的权利，但必须支付大量的[prestige|E]。"
 RICE_yorkshire_grant_stamford_charter_fair_confirm:0 "看来它已经完成"
 RICE_yorkshire_grant_stamford_charter_fair_context_tooltip:0 "#emphasis 历史背景：#!特许集市是英格兰王室特许设立的年度街头市场；许多始于中世纪时期，虽然或许有更早的先例。一些特许集市——特别是斯坦福、波士顿、温彻斯特和北安普顿的——非常著名，并形成了一套固定的顺序，中间还夹杂着一些小型的集市。虽然没有香槟集市那么大，英格兰的特许集市仍然吸引了来自欧洲各地的众多商人。"
