 charter_fair_granted_others_tooltip:0 "一旦[stamford_barony.GetNameNoTier]、[boston_barony.GetNameNoTier]、[winchester_barony.GetNameNoTier]和[northampton_barony.GetNameNoTier]都获得了特许集市，以后某个时间会随机触发一个特殊事件，并升级他们的[county_modifiers|E]。"
 yorkshire.0070.t:0 "斯坦福德的特许集会"
 yorkshire.0070.desc:0 "[stamford_barony.GetNameNoTier]的当地居民和小贵族们一直吵着要授予该聚居地举行盛大特许集市的权利已有一段时间了。我已经决定给予他们这样的特权。从现在开始每年的四旬期中该镇都会举办一次这样的集市，当然不是普通的集市，盛大的集市！"
 yorkshire.0070.a:0 "这应大大促进当地经济。"
 yorkshire.0071.opening:0 "[charter_granter.Custom2('AppropriateGreeting', ROOT.Char)][ROOT.Char.GetTitledFirstName]："
 yorkshire.0071.desc:0 "由于[stamford_barony.GetNameNoTier]目前属于你的管辖范围，我答应当地一些市民和小贵族的要求，我已经授予[stamford_barony.GetNameNoTier]每年在四月中旬左右举行大型特许集市的权利，这应大大促进当地经济。"
 yorkshire.0071.a:0 "好消息！"
 yorkshire.0072.t:0 "斯坦福德的特许集会"
 yorkshire.0072.desc:0 "[stamford_barony.GetNameNoTier]的当地市民和小贵族们一直吵着要求授予该定居点举行盛大特许集市的权利已有一段时间了。作为一个普通的[ROOT.Char.GetTitleAsNameNoTooltip]我没有权力授予特许集市举办权，但我可以向这片土地的[charter_granter.GetTitleAsNameNoTooltip]请愿，[charter_granter.GetTitledFirstName]，让他这样做。然而这需要我付出一些努力以说服他们相信这样做的好处。"
 yorkshire.0072.a:0 "让我们希望我的请愿能被批准吧"
 yorkshire.0073.opening:0 "[stamford_owner.Custom2('AppropriateGreeting', ROOT.Char)][ROOT.Char.GetTitledFirstName]"
 yorkshire.0073.desc:0 "我希望这封信能让你感到愉快。[stamford_barony.GetNameNoTier]的当地居民和小贵族请求授予他们每年的四月中旬举行一次盛大的特许集市，这样做会大大促进当地的经济。而举办特许集市需要你批准，我恳请你能答应这些微不足道的请求。"
 yorkshire.0073.a:0 "很好，这将被批准。"
 yorkshire.0074.opening:0 "[charter_granter.Custom2('AppropriateGreeting', ROOT.Char)][ROOT.Char.GetTitledFirstName]："
 yorkshire.0074.desc:0 "我仔细考虑了你的请求，这是一个很好的想法，我不得不赞扬你的建议，我授予[stamford_barony.GetNameNoTier]每年在四月中旬左右举行盛大特许权交易会的权力。我特此授予[stamford_barony.GetNameNoTier]这种特权。现在让我们希望这能给该地区带来更多的繁荣!"
 yorkshire.0074.a:0 "我很高兴这一切都解决了！"
 yorkshire.0075.t:0 "波士顿的特许集市"
 yorkshire.0075.desc:0 "[boston_barony.GetNameNoTier]当地居民和小贵族们一直吵着要授予该聚居地举行盛大特许集市的权利已有一段时间了。我已经决定给予他们这样的特权。从现在开始每年的七月左右该镇都会举办一次这样的集市，当然不是普通的集市，一个规模相当的集市！"
 yorkshire.0075.a:0 "这应大大促进当地经济。"
