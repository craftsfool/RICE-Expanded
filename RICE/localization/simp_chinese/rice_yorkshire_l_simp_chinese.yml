 yorkshire.0001.t:0 "你要去斯卡伯勒集市吗？"
 yorkshire.0001.desc:0 "一段时间以来，[scarborough_barony.GetNameNoTier]的人们要求授予该镇一个特许集市。为了鼓励它的持续繁荣，官员认为有必要授予该地区特许集市。\n\n因此，斯托尔布里奇已经获得了每年8月和9月举行集市的特许权。即使它不会像英国其他地方的特许展销会那样引人注目，但它肯定会吸引远道而来的旅行者和商人，为该地区的经济做出贡献。"
 yorkshire.0001.a:0 "欧芹、鼠尾草、迷迭香和百里香！"
