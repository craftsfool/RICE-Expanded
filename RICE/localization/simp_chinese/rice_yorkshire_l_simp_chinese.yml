 yorkshire.0084.a:0 "我很高兴这一切都解决了！"
 yorkshire.0085.t:0 "北安普顿的特许集市"
 yorkshire.0085.desc:0 "[northampton_barony.GetNameNoTier]的当地居民和小贵族们一直吵着要授予该聚居地举行盛大特许集市的权利已有一段时间了。我已经决定给予他们这样的特权。从现在开始每年的十二月该镇都会举办一次这样的集市，当然不是普通的集市，而是一个规模相当的集市！"
 yorkshire.0085.a:0 "这应大大促进当地经济。"
 yorkshire.0086.opening:0 "[charter_granter.Custom2('AppropriateGreeting', ROOT.Char)][ROOT.Char.GetTitledFirstName]"
 yorkshire.0086.desc:0 "由于[northampton_barony.GetNameNoTier]目前属于你的管辖范围，我答应当地一些市民和小贵族的要求，我已经授予[northampton_barony.GetNameNoTier]每年在十二月左右举行大型特许集市的权利，这应大大促进当地经济。"
 yorkshire.0086.a:0 "好消息！"
 yorkshire.0087.t:0 "北安普顿的特许集市"
 yorkshire.0087.desc:0 "[northampton_barony.GetNameNoTier]的当地市民和小贵族们一直吵着要求授予该定居点举行盛大特许集市的权利已有一段时间了。作为一个普通的[ROOT.Char.GetTitleAsNameNoTooltip]我没有权力授予特许集市举办权，但我可以向这片土地的[charter_granter.GetTitleAsNameNoTooltip]请愿，[charter_granter.GetTitledFirstName]，让他这样做。然而这需要我付出一些努力以说服他们相信这样做的好处。"
 yorkshire.0087.a:0 "让我们希望我的请愿能被批准吧"
 yorkshire.0088.opening:0 "[northampton_owner.Custom2('AppropriateGreeting', ROOT.Char)][ROOT.Char.GetTitledFirstName]"
 yorkshire.0088.desc:0 "我希望这封信能让你感到愉快。[northampton_barony.GetNameNoTier]的当地居民和小贵族请求授予他们每年的十二月举行一次盛大的特许集市，这样做会大大促进当地的经济。而举办特许集市需要你批准，我恳请你能答应这些微不足道的请求。"
 yorkshire.0088.a:0 "很好，这将被批准。"
 yorkshire.0089.opening:0 "[charter_granter.Custom2('AppropriateGreeting', ROOT.Char)][ROOT.Char.GetTitledFirstName]"
 yorkshire.0089.desc:0 "我仔细考虑了你的请求，这是一个很好的想法，我不得不赞扬你的建议，我授予[northampton_barony.GetNameNoTier]每年在十二月举行特许权交易会的权力。我特此授予[northampton_barony.GetNameNoTier]这种特权。现在让我们希望这能给该地区带来更多的繁荣!"
 yorkshire.0089.a:0 "我很高兴这一切都解决了！"
 yorkshire.0090.t:0 "xxxxx"
 yorkshire.0090.desc:0 "xxxxx"
 yorkshire.0090.a:0 "xxxxx"
 yorkshire.0091.t:0 "英格兰的特许集市"
 yorkshire.0091.desc:0 "多年来，整个英格兰、威尔士和康沃尔的各个城市都被皇家授予举办特许集市的特权。这些年度集市一直是许多聚居地繁荣的重要来源，并且有些集市在吸引更多生意方面高于其他集市。\n\n最近有几个集市最为突出的，如四月中旬在[stamford_barony.GetNameNoTier]的集市，七月在[boston_barony.GetNameNoTier]的集市，九月在[winchester_barony.GetNameNoTier]的集市，以及十一月在[northampton_barony.GetNameNoTier]的集市。这些集市已经形成了一个时间序列，并在当地商人和远道而来的商人中备受欢迎，其他地方的次要集市则充斥其间。"
 yorkshire.0091.a:0 "当地的经济正在蓬勃发展！"
