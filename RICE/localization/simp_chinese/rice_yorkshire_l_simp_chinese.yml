 yorkshire.0020.t:0 "贝弗利的约翰主教"
 yorkshire.0020.desc:0 "早在8世纪，约克郡的主教是天主教最圣洁和虔诚的人，其名叫贝弗利的约翰。近年来他已经成为当地人崇敬的对象，他们将许多奇迹归功于他。甚至我必须认识到自己是这种奇迹的潜在受益者之一。在我请求上帝帮助时，我的军队一些事件好像收到约翰的影响。\n\n因此今天我决定亲自向这位伟人表示敬意，在他建立的贝弗利镇（位于[beverley_location.GetNameNoTier]）拜谒他的坟墓。我已承诺在他的坟墓周围建造一个相当大的神殿，以便当地纪念他。"
 yorkshire.0020.a:0 "有人说，有一天他将成为圣人，但谁知道呢？"
 yorkshire.0020.tooltip:0 "大约一个世纪后，东赖丁的统治者可以采取[decision|E]，支持将贝弗利的圣约翰封圣。"
 yorkshire.0021.t:0 "贝弗利的约翰主教"
 yorkshire.0021.desc:0 "最近[homage_person.GetTitledFirstName]访问了位于贝弗利的约翰墓，该墓位于[beverley_location.GetNameNoTier]。这位8世纪的教士曾是约克的主教，被认为是一个圣洁和虔诚的人，多年来一直受到当地人的敬仰。\n\n已故的约翰主教因在一些军务中为[homage_person.GetTitledFirstName]提供了无法解释的奇迹而受到赞叹。正因为如此[homage_person.GetSheHe]已经下令在约翰主教的坟墓周围建造一个相当大的圣殿。如果约翰主教的传说继续被口口相传，我们是否有一天能看到他被封为圣人？"
 yorkshire.0021.a:0 "只有时间才能够回答……"
 yorkshire.0021.tooltip:0 "大约一个世纪后，东赖丁的统治者可以采取[decision|E]，支持将贝弗利的圣约翰封圣。"
 yorkshire.0022.t:0 "贝弗利的圣约翰"
 yorkshire.0022.desc:0 "贝弗利的约翰是8世纪的约克主教，他的传奇事迹随着时间的推移而不断增加。因为有很多的神迹归功于他，所以该地区有很多人一直在请求将他封圣。\n\n[ROOT.Char.GetFaith.GetAdjective]教会似乎也对此表示赞同，在派了几个[ROOT.Char.Custom('DefaultPriestTitlePlural')]对贝弗利的约翰的神迹和生活做了调查后，他们正式宣布他为圣人。\n\n贝弗利这个他所援助建立的小镇，无疑将因他的坟墓而获得巨大的声望和荣誉。随着圣约翰的正式封圣，我们可以期待看到更多的朝圣者前来，这无疑将使该聚居地虔钱双收。"
 yorkshire.0022.a:0 "不错。"
 yorkshire.0022.tooltip:0 "贝弗利附近的统治者现在可以[GetActivityType( 'activity_RICE_yorkshire_beverley_pilgrimage' ).GetName]，到[saint_john_of_beverley_short|E]的墓前朝圣，也可以借用他的旗帜。"
 yorkshire.0023.t:0 "贝弗利的圣约翰"
 yorkshire.0023.desc:0 "多年来，英格兰北部的许多人请求[john_of_beverley_canonizer.GetFaith.GetAdjective]教会承认8世纪约克主教贝弗利的圣人身份，并给予他圣人地位。部分归功于由[john_of_beverley_canonizer.GetTitledFirstName]领导的当地神职人员和领导人的努力，这一点终于实现了。\n\n贝弗利这个他所生活的小镇，无疑将因他的坟墓而获得巨大的声望和荣誉。随着圣约翰的正式封圣，我们可以期待看到更多的朝圣者前来，这无疑将使该聚居地获得精神与金钱双收"
 yorkshire.0023.a:0 "有趣的消息！"
 yorkshire.0023.tooltip:0 "贝弗利附近的统治者现在可以[GetActivityType( 'activity_RICE_yorkshire_beverley_pilgrimage' ).GetName]，也可以借用他的旗帜。"
 yorkshire.0024.t:0 "拜那"
 yorkshire.0024.desc:0 "在与贝弗利的当地神职人员见面，进行了一些寒暄之后，他们拿出了传说中的贝弗利的圣约翰旗帜。根据传说，这个神圣遗物曾为许多英勇的领主带来军事上的胜利。我很荣幸保存它的修士们接受了我的请求，允许我带着它上战场。我发誓，我一定会用它来对付基督教的敌人，以及所有善良和正义的敌人。"
 yorkshire.0024.a:0 "当然"
 yorkshire.0024.tooltip:0 "如果你死亡或失去所有的[titles|E]，这面旗帜将不会传给你的[heir|E]，它将被送回贝弗利的圣约翰圣殿。"
