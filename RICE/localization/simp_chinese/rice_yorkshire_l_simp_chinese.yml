 RICE_yorkshire_margaret_helmet_name:0 "烹饪锅头盔"
 RICE_yorkshire_margaret_helmet_desc:0 "[margaret.GetDynasty.GetName][margaret.GetFirstName]是[GetGeographicalRegion('custom_england').GetName]女性，她在[margaret.GetFaith.GetReligion.GetAdjective]朝圣途中立下誓言，而与与异教徒的战斗中，她用烹饪锅当了头盔使用，虽然有人认为这很奇怪，但也有人对此很是欣赏，认为是女中豪杰，是[margaret.GetFirstNamePossessiveNoTooltip]英勇与热忱的象征。"
 RICE_yorkshire_margaret_of_beverley_modifier:0 "女中豪杰"
 RICE_yorkshire_margaret_of_beverley_modifier_desc:0 "尽管害怕战争和苦难，但还是立下誓言，必要时会拿起武器做出英雄事迹，是个[Glossary( '维拉戈', 'VIRAGO_GLOSS' )]般的女子。"
 yorkshire.0010.info:0 "#emphasis 历史背景：#!贝弗利的玛格丽特是一位英格兰朝圣者，也是历史上罕见有记载参与十字军东征的女性，她参加了1187年耶路撒冷围城战和1188年萨拉丁军队对安条克的围攻。经历多年旅途与冒险后，她在法国一座修道院退隐成为修女。关于她生平的主要记载来自其弟皮卡第地区的修士——托马斯，这位托马斯修士曾是坎特伯雷大主教托马斯·贝克特的家庭成员。"
 yorkshire.0011.b:0 "把烹饪锅当头盔戴听起来荒谬可笑。"
 yorkshire.0011.info:0 "#emphasis 历史背景：#!贝弗利的玛格丽特的弟弟托马斯所述，在1187年萨拉丁围攻耶路撒冷期间，玛格丽特参与了城市防御战，甚至临时将一口煮锅当作头盔使用。这一事件是否真实发生尚不确定，也可能是虚构细节，但它也反映了中世纪对女性战士的奇异描述，可能包涵讽刺或取笑的意味。"
