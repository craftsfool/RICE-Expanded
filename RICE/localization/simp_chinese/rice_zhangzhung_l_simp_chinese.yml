 zhangzhung.0130.t:0 "[rinchen_zangpo.GetDynasty.GetNameNoTooltip]世家"
 zhangzhung.0130.desc:0 "我们多年在高原上支持[GetReligionByKey('buddhism_religion').GetName]，让[rinchen_zangpo.GetDynasty.GetName]世家在[GetTitleByKey('k_guge').GetNameNoTier]中小有名气。\n\n而[rinchen_zangpo.GetDynasty.GetNameNoTooltip]世家的[rinchen_zangpo.GetHouse.GetName]支[rinchen_zangpo.GetFirstNameNicknamed]更是让世人知晓[rinchen_zangpo.GetHerHis|U]身为[GetReligionByKey('buddhism_religion').GetAdjective]大师的身份，而且[rinchen_zangpo.GetHerHis|U]还在[GetGeographicalRegion('world_tibet').GetName]传播[GetReligionByKey('buddhism_religion').GetAdjective]正法，修建寺庙。\n\n因此，我们在这个地区拥有巨大的影响力，无论是世俗还是精神世界，而我们也将继续发展这些关系……"
 zhangzhung.0130.a:0 "法脉永续，家族昌隆！"
 zhangzhung.0130.info:0 "#emphasis 历史背景：#!#italic [rinchen_zangpo.GetDynasty.GetNameNoTooltip]#!是中世纪吐蕃地区最显赫的世家之一，当时吐蕃由古格王朝统治，其成员包括玉扎家族仁钦桑波（11世纪藏传佛教最著名的翻译家和学者之一） 。他们是佛教的主要捐助者，吐蕃地区各个寺院的壁画和碑文中经常出现或提及他们，例如托林寺和塔波寺，这两座寺院是西藏现存最古老、具有历史意义的寺院。"
