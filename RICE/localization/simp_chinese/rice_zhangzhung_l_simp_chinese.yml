 nick_RICE_guru_rinpoche:0 "珍贵的上师"
 nick_RICE_guru_rinpoche_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]被许多[GetFaithByKey('lamaism').GetAdherentNamePlural]尊崇为释迦牟尼佛——即历史上的佛陀——的化身，他帮助将密宗教法传播至[GetGeographicalRegion('world_tibet').GetName]。因此，[CHARACTER.GetSheHe|U]被称为#italic 古鲁仁波切#!，意为“珍贵的上师”。[CHARACTER.GetSheHe|U]也被称为#italic [GetTitleByKey('b_oddiyana').GetNameNoTier]的莲花生#!。"
