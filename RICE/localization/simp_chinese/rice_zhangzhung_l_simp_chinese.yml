 activity_RICE_zhangzhung_kinnaur_flower_festival_conclusion_desc:0 "[GetActivityType( 'activity_RICE_zhangzhung_kinnaur_flower_festival' ).GetName]已经结束。这是一次多么鼓舞人心的旅行啊！"
 RICE_zhangzhung_kinnaur_flower_festival_sacrifice_amount_type:0 "献花数量"
 RICE_zhangzhung_kinnaur_flower_festival_sacrifice_amount_small:0 "少量"
 RICE_zhangzhung_kinnaur_flower_festival_sacrifice_amount_small_desc:0 "$EFFECT_LIST_BULLET$获得基本加成，[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_base_piety_small')]#![piety|E]和[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_base_prestige_small')]#![prestige|E]\n$EFFECT_LIST_BULLET$有#V [EmptyScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_oracle_chance_low')]%#!概率获得神谕[modifier|E]\n\n#weak 除了采花外，我们还会向当地神灵提供基本的祭祀和供品。#!"
