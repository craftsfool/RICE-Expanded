 zhangzhung.0022.t:0 "[padmasambhava.GetNicknameNoTooltip]之梦"
 zhangzhung.0022.t.bon:0 "梦见敦巴辛饶"
 zhangzhung.0022.desc:0 "大最近家都在谈论[nyangral.GetTitledFirstName]梦见[padmasambhava.GetFirstName]之事，为此我传唤[nyangral.GetHerHim]来讲述这个梦境。\n\n“太神奇了！”[nyangral.GetSheHe]囔囔道，“一大群人骑着骏马来到我面前，而领头的正是[padmasambhava.GetNickname]，[padmasambhava.GetSheHe]在我眼前展示了许多奇迹，他们举行了一场盛大的宴会，里面皆是乘满甘露的大花瓶。肯定是我的[Glossary( '因缘', 'KARMIC_CONDITIONS_GLOSS' )]结果，这是一个吉兆。”\n\n一些认识[nyangral.GetFirstNameNoTooltip]的[ROOT.Char.GetFaith.GetAdherentNamePlural]现在相信[nyangral.GetSheHe]可能是[padmasambhava.GetFirstNamePossessiveNoTooltip]弟子的转世！是潜在的[Glossary( '伏藏师', 'TERTON_GLOSS' )]，可以揭开那些伟大的[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0022.desc.bon:0 "大最近家都在谈论[nyangral.GetTitledFirstName]梦见许多神灵和尊者，为此我传唤[nyangral.GetFirstNameNoTooltip]来讲述这个梦境。\n\n“太神奇了！”[nyangral.GetSheHe]囔囔道，“一大群人骑着骏马来到我面前，而领头的正是敦巴辛饶，[padmasambhava.GetSheHe]在我眼前展示了许多奇迹，他们举行了一场盛大的宴会，里面皆是乘满甘露的大花瓶。。肯定是我的[Glossary( '因缘', 'KARMIC_CONDITIONS_GLOSS' )]结果，这是一个吉兆。”\n\n一些认识[nyangral.GetFirstNameNoTooltip]的[ROOT.Char.GetFaith.GetAdherentNamePlural]现在相信[nyangral.GetSheHe]是潜在的[Glossary( '伏藏师', 'TERTON_GLOSS' )]，可以揭开很久以前苯教被迫害时隐藏的[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0022.desc.self:0 "昨夜，我竟得了一个[padmasambhava.GetFirstName][padmasambhava.GetHerselfHimself]殊胜梦境，真是简直难以置信。但我心中亦存疑虑，深知[ROOT.Char.GetFaith.DevilName]常以幻象惑乱人心。故此，我召来几位[ROOT.Char.GetFaith.PriestNeuterPlural]，开解迷惑。\n\n我向他们详述梦中所见，浩浩荡荡的人群皆乘骏马，由[padmasambhava.GetNickname]亲自率领，向我而来。随后，竟是一场盛大的筵席，琼浆玉液盛于巨宝瓶之中，  [padmasambhava.GetSheHe]更在我眼前展显种种神通，不可思议。听罢我的叙述，众位[ROOT.Char.GetFaith.PriestNeuterPlural]纷纷赞叹不已，其中一位说道，“此必为吉祥之兆，正是您[Glossary( '因缘', 'KARMIC_CONDITIONS_GLOSS' )]结果！”\n\n如今，更有[ROOT.Char.GetFaith.GetAdherentNamePlural]认为，我或许是[padmasambhava.GetFirstNamePossessiveNoTooltip]弟子的转世化身！难道我真有可能是[Glossary( '伏藏', 'TERTON_GLOSS' )]吗？我可否有缘发[Glossary( '伏藏', 'TERMA_GLOSS' )]呢？"
 zhangzhung.0022.desc.self_bon:0 "昨夜，我竟得了一个敦巴辛饶的殊胜梦境，真是简直难以置信。但我心中亦存疑虑，深知[ROOT.Char.GetFaith.DevilName]常以幻象惑乱人心。故此，我召来几位[ROOT.Char.GetFaith.PriestNeuterPlural]，开解迷惑。\n\n我向他们详述梦中所见，浩浩荡荡的人群皆乘骏马，由敦巴辛饶亲自率领，向我而来。随后，竟是一场盛大的筵席，琼浆玉液盛于巨宝瓶之中，  他更在我眼前展显种种神通，不可思议。听罢我的叙述，众位[ROOT.Char.GetFaith.PriestNeuterPlural]纷纷赞叹不已，  其中一位说道，“此必为吉祥之兆，正是您[Glossary( '因缘', 'KARMIC_CONDITIONS_GLOSS' )]结果！”\n\n如今，更有[ROOT.Char.GetFaith.GetAdherentNamePlural]认为我是[padmasambhava.GetFirstNamePossessiveNoTooltip]弟子的转世化身，能够发现很久以前苯教被迫害时隐藏的[Glossary( '伏藏', 'TERMA_GLOSS' )]！"
 zhangzhung.0022.a:0 "这样的梦揭示了一个人伟大命运……"
 zhangzhung.0022.a.tooltip:0 "[nyangral.GetUIName]在将来有可能成为[RICE_terton|E]发现[RICE_terma|E]并获得#bold [GetTrait('RICE_terton').GetName( GetNullCharacter )]#![trait|E]"
 zhangzhung.0022.b:0 "“这或许只是一个普通宗教梦罢了。”"
 zhangzhung.0022.info:0 "#emphasis 历史背景：#!在藏传佛教的伏藏师传记中，他们经祥瑞梦境后开始寻宝生涯并不罕见。这些梦通常与莲花生大士有关，他是来自[GetTitleByKey('b_oddiyana').GetNameNoTier]的尊者，他在吐蕃弘扬佛法中发挥大作用。莲花生大士在吐蕃各地散布隐藏许多伏藏。这个事件中的梦基于酿敦尼玛沃色10岁时的梦，他是最早和最重要的#italic 伏藏师#!之一，这个梦启发了他走上佛教之路。"
 zhangzhung.0023.t:0 "赞助伏藏师"
 zhangzhung.0023.desc:0 "并非所有[ROOT.Char.GetFaith.GetAdherentName]都相信[Glossary( '伏藏', 'TERMA_GLOSS' )]这一说法，但我相信伏藏确切是许久之前隐秘的珍宝，只待有缘的[Glossary( '伏藏师', 'TERTON_GLOSS' )]去寻得。\n\n因此我计划今天开始资助这些[Glossary( '因缘', 'KARMIC_CONDITIONS_GLOSS' )]之人前去寻得伏藏，从而造化众生。"
 zhangzhung.0023.a:0 "愿更多伏藏被揭晓。"
 zhangzhung.0024.t:0 "寻找伏藏"
 zhangzhung.0024.desc.intro.not_terton:0 "虽然我曾经历幻象或梦境，暗示有一天我会成为[Glossary( '伏藏师', 'TERTON_GLOSS' )]，但我并不保证我会发现更多[Glossary( '伏藏', 'TERMA_GLOSS' )]。有时，这样的幻象或梦境不会产生任何结果，甚至被认为是妄想。"
 zhangzhung.0024.desc.intro.terton:0 "我虽是一位知名的[Glossary( '伏藏师', 'TERTON_GLOSS' )]，也有发现过伏藏，但我并不保证能发现更多[Glossary( '伏藏', 'TERMA_GLOSS' )]，甚至有些著名的伏藏师终其一生也只发现一个伏藏。"
 zhangzhung.0024.desc:0 "\n\n我发愿为众生发掘更多伏藏。\n\n为识别伏藏位置的幻象，我经常祈祷，并将精力集中在可能存在且有希望的迹象上。"
 zhangzhung.0024.a:0 "愿大慈大悲[GetPlayer.Custom('RICE_tibet_deities_type')]帮我实现愿望！"
