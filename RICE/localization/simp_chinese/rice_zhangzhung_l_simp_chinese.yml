 activity_RICE_zhangzhung_kinnaur_flower_festival_province_mountains_desc:0 "\n#P ++这里的山上遍布着美丽的草地。#!\n\n#italic 在[activity|E]结束时将获得[prestige_i|E][prestige|E]和[piety_i|E][piety|E]。#! "
