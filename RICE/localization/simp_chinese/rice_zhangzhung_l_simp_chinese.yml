 RICE_terma_medicine_modifier:0 "伏藏（药物）"
 RICE_terma_medicine_modifier_desc:0 "该角色服用了一处[Glossary( '地伏藏', 'SATER_GLOSS' )]发现的珍贵药丸[Glossary( '伏藏', 'TERMA_GLOSS' )]，据说吞食不仅具有治疗作用，还能带来福气，使得天人合一。"
 RICE_terma_county_modifier_1:0 "发现宗教建造"
 RICE_terma_county_modifier_1_desc:0 "一位[RICE_terton|E]最近在这里发现了一处[RICE_terma|E]，在发现之前世人并不知其是一座宗教建筑。"
