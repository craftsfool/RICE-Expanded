 zhangzhung.0010.t:0 "金刚时轮柱"
 zhangzhung.0010.desc.upper_tibet:0 "[GetGeographicalRegion('RICE_upper_tibet').GetName]上散落着神秘而古老的石柱。有人说它们是在寰宇之初即存；有人说它们是为了控制灵魂而建；还有人说这些纪念碑是为了纪念逝去之人。\n\n"
 zhangzhung.0010.desc.outside_upper_tibet:0 "[GetGeographicalRegion('RICE_upper_tibet').GetName]上散落着神秘而古老的石柱。有人说它们是在寰宇之初即存；有人说它们是为了控制灵魂而建；还有人说这些纪念碑是为了纪念逝去之人，不过[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]中的石碑并不完全相同，但很可能起源相似。\n\n"
 zhangzhung.0010.desc:0 "神秘而古老的金刚时轮柱遍布[GetPlayer.Custom('RICE_tibet_deities_type')]，通常，人们因惧怕其伟力而避开它们，然而，我们有时会祈求与之相关的[GetPlayer.Custom('RICE_tibet_deities_type')]，以获得祂们的青睐和庇护。\n\n我在[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]也造访这些柱子。在[ROOT.Char.GetFaith.PriestNeuterPlural]进行一些祈祷后，我留下水晶、酥油、香和其他珍贵祭品，准备向[GetPlayer.Custom('RICE_tibet_deities_type')]寻求帮助……"
 zhangzhung.0010.a:0 "我想知道，#bold 我的威望#!和与他人关系"
 zhangzhung.0010.b:0 "我想知道，#bold 军队事务#!和如何战胜外敌"
 zhangzhung.0010.c:0 "我想知道，#bold 如何获得财富与资源#!"
 zhangzhung.0010.d:0 "我想知道，#bold 如何保全自身#!"
 zhangzhung.0010.e:0 "我想知道，如何提升#bold 才智#!和精神成长"
 RICE_zhangzhung_pillars_bad:0 "[GetPlayer.Custom('RICE_tibet_deities_type')]对你的祈求感到不满！"
 RICE_zhangzhung_pillars_bad_short:0 "#N 坏兆头#!"
 RICE_zhangzhung_pillars_good:0 "[GetPlayer.Custom('RICE_tibet_deities_type')]对你的祈求感到满意！"
 RICE_zhangzhung_pillars_good_short:0 "#P 好兆头#!"
 RICE_zhangzhung_pillars_neutral_short:0 "无事发生"
 zhangzhung.0011.t:0 "寻盐队出发"
 zhangzhung.0011.desc:0 "在[GetGeographicalRegion('RICE_western_northern_tibet').GetName]高地，有许多盐湖和盐田，这些盐贸易利润丰厚，我决定资助一支[Glossary( '卓巴人', 'DROKPA_GLOSS' )]寻盐队，去那里采盐。\n\n现在我雇的#italic 卓巴人#!已经准备好出发了，但我要先和他们的首领谈谈，毕竟那些有盐的地方通常都是圣地，是[ROOT.Char.GetFaith.HighGodName]有神佛守护的地方。而且这一趟，寻盐队成员必须谨言慎行，向这些[GetPlayer.Custom('RICE_tibet_deities_type')]神灵祈祷和上香。\n\n也许我可以为他们提供帮助，为他们祈祷和祭祀，毕竟是#italic 我们#!请求[GetPlayer.Custom('RICE_tibet_deities_type')]允许进入其中……"
 zhangzhung.0011.a:0 "我已经给这些#italic 卓巴人#!足够的帮助。"
 zhangzhung.0011.a.tooltip:0 "成功率约为#V [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_success_chance')|0]%#!"
 zhangzhung.0011.b:0 "更多的供奉也许会有帮助。"
 zhangzhung.0011.b.tooltip:0 "成功率提高#V 5%#!，目前为#V [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_success_chance_small_piety_boost_value')|0]%#!"
 zhangzhung.0011.c:0 "多多祭品！神灵眷顾！"
 zhangzhung.0011.c.tooltip:0 "成功率提高#V 10%#!，目前为#V [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_success_chance_large_piety_boost_value')|0]%#!"
 zhangzhung.0011.general.tooltip:0 "这次寻盐将需要1至3个月才能完成。"
 zhangzhung.0012.t:0 "寻盐队归来"
 zhangzhung.0012.desc:0 "我雇佣的[Glossary( '卓巴人', 'DROKPA_GLOSS' )]寻盐队从[GetGeographicalRegion('RICE_western_northern_tibet').GetName]归来。\n\n"
 zhangzhung.0012.desc.success:0 "寻盐队队长高兴地报告了他们的成功，在他们得到了神灵的祝福，收集了大量盐。\n\n"
 zhangzhung.0012.desc.failure:0 "寻盐队队长失望地报告了他们的失败，语气有些沮丧……\n\n显然，[GetPlayer.Custom('RICE_tibet_deities_type')]可能对#italic 卓巴人#!的言行或供奉感到不满，因此遭到厄运。\n\n不管是什么原因，这次收益不佳，而所收获的也不得不用来抵消开支。"
 zhangzhung.0012.desc.low:0 "寻盐队并没有取得多大成果，领队提醒我。他们运气不佳，这无疑是因为[GetPlayer.Custom('RICE_tibet_deities_type')]觉得我们对祂们不够尊敬，采集的盐数量比我们想的要少，但应该足以回本。"
 zhangzhung.0012.desc.medium:0 "寻盐队队长告诉我们，尽管这不是有史以来收获的最大一笔，但大赚肯定没问题。显然，[GetPlayer.Custom('RICE_tibet_deities_type')]对#italic 卓巴人#!的言行或供奉感到满意，从中协助一番。[Glossary( '喜迎盐队宴会', 'TSAW_BVI_NANG_SKYID_GLOSS' )]将很快举行，以庆祝他们的归来。"
 zhangzhung.0012.desc.high:0 "这次寻盐队收获比平均要多得多，我们将从中获利颇丰！显然，[GetPlayer.Custom('RICE_tibet_deities_type')]对#italic 卓巴人#!的言行或供奉非常满意，从中协助一番。一场盛大的[Glossary( '喜迎盐队宴会', 'TSAW_BVI_NANG_SKYID_GLOSS' )]将很快举行，以庆祝他们的归来。"
 zhangzhung.0012.a.failure:0 "难道我们让[GetPlayer.Custom('RICE_tibet_deities_type')]失望了吗？"
 zhangzhung.0012.a.low:0 "总比没有好，我觉得。"
 zhangzhung.0012.a.medium:0 "很高兴一切顺利。"
 zhangzhung.0012.a.high:0 "赞美神灵！"
 zhangzhung.0013.t:0 "[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]的复兴"
 zhangzhung.0013.desc:0 "[GetGeographicalRegion('RICE_upper_tibet').GetName][GetTitleByKey('e_zhangzhung').GetNameNoTier]人有着悠久的成就和历史。但[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]的最后一位统治者[last_zhangzhung.GetFirstName]迎娶[GetTitleByKey('e_tibet').GetNameNoTier][songtsen_gampo.GetFirstName]皇帝妹妹时，这一切都变了，[songtsen_gampo.GetFirstNameNoTooltip]声称他的妹夫侮辱和虐待了他的妹妹，对此进行宣战，并在战斗中击败并杀死了[last_zhangzhung.GetFirstNameNoTooltip]。\n\n有些人仍记得那次背叛，[zhangzhung_reviver.GetFirstName]就是其中一人。然而时代再次改变，[zhangzhung.GetCollectiveNoun]的后裔[zhangzhung_reviver.GetFirstNameNoTooltip]已经统一了吐蕃大部分地区，并宣告了古老的[GetTitleByKey('e_zhangzhung').GetNameNoTooltip]新生。\n\n"
 zhangzhung.0013.desc.bon:0 "许多[zhangzhung_reviver.GetFaith.GetAdherentNamePlural]认为[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]覆灭与宗教衰落息息相关，现在他们相信，[last_zhangzhung.GetFirstNameNoTooltip]雪恨得以复仇，而且古老信仰正在回归，[zhangzhung.GetNameNoTooltip]的黄金时代准备开始。"
 zhangzhung.0013.desc.non_bon:0 "虽然旧有习俗可能无法复兴，而随着[zhangzhung.GetCollectiveNoun]后裔接受了新信仰和思想，但他们仍然相信恢复[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]将会回归曾经荣耀并为[last_zhangzhung.GetFirstNameNoTooltip]报仇，[zhangzhung.GetNameNoTooltip]的黄金时代准备开始。"
 zhangzhung.0013.a:0 "[GetGeographicalRegion('world_tibet').GetNameNoTooltip]的历史又翻开了新篇章。"
 zhangzhung.0014.t:0 "新琼隆银城"
 zhangzhung.0014.desc:0 "在传说中，古[GetTitleByKey('e_zhangzhung').GetNameNoTier]的统治者在[GetGeographicalRegion('RICE_upper_tibet').GetName]高原的#italic 琼隆银城#!里进行统治。\n\n可惜没有人确切知道这个古都在哪里，根据当地民间传说，[GetGeographicalRegion('RICE_upper_tibet').GetNameNoTooltip] 上有一些古代遗址可能是#italic 琼隆银城#!，但可信度都不高。\n\n如今[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]新生，我认为我们建立一个新#italic 琼隆银城#!！我们现在的首都[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]将成为喜马拉雅地区最大的城市和堡垒，也将成为贸易、学习和军事中心，所有人都将再次怀着敬畏和崇敬之情谈论[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]！"
 zhangzhung.0014.a:0 "我们只会越来越强！"
 zhangzhung.0015.t:0 "神迹洞寺"
 zhangzhung.0015.desc:0 "[milarepa.GetFirstName]在冈仁波齐峰上与苯教导师斗法，从而确立[GetReligionByKey('buddhism_religion').GetName]尊贵地位，据说他的奇迹之一是开辟#italic 神迹洞#!。胜利后，他在这里进行冥想和进修。\n\n从那时起，神迹洞一直存在，我认为它应该变成一个真正的寺庙，应该有一座建筑和[ROOT.Char.GetFaith.PriestNeuterPlural]来管理它。\n\n因此，我与当地合作，确保在洞穴周围建造一座规模可观的寺院。现在，前往冈仁波齐峰的[GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip]朝圣者可以更轻松地追随[milarepa.GetFirstNameNoTooltip]。"
 zhangzhung.0015.a:0 "愿此法富济众生！"
 zhangzhung.0016.t:0 "第一代伏藏师"
 zhangzhung.0016.desc:0 "[langdarma.GetTitledFirstName]身死后，[GetTitleByKey('e_tibet').GetNameNoTier]分崩离析，兵革不休，动荡不安，[GetReligionByKey('buddhism_religion').GetAdjective]和[GetReligionByKey('bon_religion').GetAdjective]蒙尘。\n\n但若真想学此佛法之人，还有希望，据说很久之前，[padmasambhava.GetFirstName]等其他大师预见此等灾祸，以[Glossary( '伏藏', 'TERMA_GLOSS' )]形式掩埋交易和圣物。只有[Glossary( '因缘', 'KARMIC_CONDITIONS_GLOSS' )]成熟之际，人们才能发现这些[Glossary( '伏藏', 'TERMA_GLOSS' )]。\n\n据说[GetGeographicalRegion('world_tibet').GetName]出现了许多[Glossary( '伏藏', 'TERMA_GLOSS' )]，被[GetFaithByKey('lamaism').GetName]#italic 宁玛派#!和[GetFaithByKey('bon').GetAdherentNamePlural]大师发掘，不过一些[GetReligionByKey('buddhism_religion').GetAdherentNamePluralNoTooltip]对此纷纷质疑，但越来越多的伏藏被发现，人们也慢慢接受这些。"
 zhangzhung.0016.a:0 "这些#italic 伏藏师#!能发现什么#italic 伏藏#!呢？"
 zhangzhung.0016.b:0 "听上去是迷信的胡话！"
 zhangzhung.0016.tooltip.1:0 "[culture|E]属于$heritage_tibetan_name$[heritage|E]，且信奉[GetReligionByKey('buddhism_religion').GetAdjective][faith|E]，或信奉带有[GetDoctrineType('rice_bon_deities_new_doctrine').GetBaseName][doctrine|E]的[GetReligionByKey('bon_religion').GetAdjective][faith|E]的角色，现在可以遇到与[RICE_tertons|E]及发现[RICE_termas|E]有关的[decisions|E]和事件。"
 zhangzhung.0016.tooltip.2:0 "[RICE_tertons|E]会相对稀少，成功率也较低，直到未来它们成为一种更被接受、更为普遍的现象。"
 zhangzhung.0016.tooltip.3:0 "[court|E]中没有[RICE_terton|E]或[GetModifier('RICE_terton_candidate').GetNameWithTooltip]的[rulers|E]将无法采用#bold $RICE_zhangzhung_patronize_tertons$#![decision|E]"
 zhangzhung.0016.info:0 "#emphasis 历史背景：#!$TERTON_GLOSS$"
 zhangzhung.0017.t:0 "伏藏师崛起"
 zhangzhung.0017.desc:0 "[GetTitleByKey('e_tibet').GetNameNoTier]帝国的崩溃导致[GetReligionByKey('buddhism_religion').GetAdjective]和[GetReligionByKey('bon_religion').GetAdjective]衰落，如今[GetGeographicalRegion('world_tibet').GetName]正开始恢复过去荣光。\n\n一些复兴[GetGeographicalRegion('world_tibet').GetNameNoTooltip][GetReligionByKey('bon_religion').GetAdjective]和[GetReligionByKey('buddhism_religion').GetName]大师中，一些人自称[Glossary( '伏藏师', 'TERTON_GLOSS' )]，专门发现[Glossary( '伏藏', 'TERMA_GLOSS' )]，虽然一些人滥竽充数，但#italic 伏藏#!在各地都发现，这让当地的许多[GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip]认可这种，其中[GetFaithByKey('lamaism').GetName]#italic 宁玛派#!和[GetFaithByKey('bon').GetName]大师最为擅长。\n\n现在[padmasambhava.GetFirstName]等大师在几个世纪前隐藏的伏藏，正等着人发掘。为[GetGeographicalRegion('world_tibet').GetNameNoTooltip]上[GetReligionByKey('buddhism_religion').GetAdjective]和[GetReligionByKey('bon_religion').GetAdjective]复兴做准备。"
 zhangzhung.0017.a:0 "正法流传！"
 zhangzhung.0017.b:0 "哈哈！这些骗子对[ROOT.Char.GetFaith.HighGodName]的正道一无所知。"
 zhangzhung.0017.tooltip.1:0 "与以前相比，[RICE_termas|E]将不再那么稀有，而且找到[RICE_tertons|E]概率也更高，因为他们现在是一个被广泛接受的现象。"
 zhangzhung.0017.tooltip.2:0 "符合条件的[rulers|E]均可采用#bold $RICE_zhangzhung_patronize_tertons$#![decision|E]，无论其[court|E]中是否有[RICE_terton|E]或[GetModifier('RICE_terton_candidate').GetNameWithTooltip]。"
 zhangzhung.0017.tooltip.3:0 "成功发现[RICE_termas|E]会增加[piety_i|E][piety|E]加成"
 zhangzhung.0017.info:0 "#emphasis 历史背景：#!$TERTON_GLOSS$"
 zhangzhung.0018.t:0 "[ROOT.Char.GetFaith.GetNameNoTooltip]在[GetGeographicalRegion('world_tibet').GetNameNoTooltip]的传播"
 zhangzhung.0018.desc:0 "[GetTitleByKey('e_tibet').GetName]覆灭，使喜马拉雅地区陷入混乱，人们进入了黑暗时代，不知道正道何方。\n\n现在，[GetGeographicalRegion('world_tibet').GetName]的重建，人民都在寻求正法。关于[GetFaithByKey('old_bon').GetAdjective]神灵如何被大师驯服为[GetPlayer.Custom('RICE_tibet_deities_type')]来保护追随者和教义的故事正在流传，我也皈依"
 zhangzhung.0018.desc.lamaism:0 "[GetFaithByKey('lamaism').GetName]。\n\n$Songtsen_Gampo$和莲花生大士将[GetReligionByKey('buddhism_religion').GetName]带到了[GetGeographicalRegion('world_tibet').GetNameNoTooltip]，如今佛法再次传遍了整个国家。让佛陀值得赞颂！佛法战胜嗔痴！僧伽永远繁荣！"
 zhangzhung.0018.desc.new_bon:0 "[GetFaithByKey('bon').GetName]。\n\n[GetReligionByKey('buddhism_religion').GetAdherentNamePlural]认为旧[GetReligionByKey('bon_religion').GetAdjective]是邪恶的，是对正道曲解模仿，但事实恰恰相反。经过几个世纪的迫害，我们才刚刚开始重新认识和学习敦巴辛饶的教义——愿我们新发现为众生带来福报！"
 zhangzhung.0018.desc.mahayana:0 "[GetFaithByKey('mahayana').GetName]。\n\n几个世纪前[GetGeographicalRegion('world_tibet').GetNameNoTooltip]中不同[GetReligionByKey('buddhism_religion').GetAdjective]徒之间发生了一场大辩论，据说[GetFaithByKey('mahayana').GetNameNoTooltip]落了下乘失败了，但我知道他们实际上赢了，现在[GetFaithByKey('mahayana').GetNameNoTooltip]正道已然回归。愿大乘佛法为所有众生普渡慈悲！"
 zhangzhung.0018.desc.vajrayana:0 "[GetFaithByKey('vajrayana').GetName]。\n\n几个世纪前，[GetGeographicalRegion('world_tibet').GetNameNoTooltip]地区的[GetReligionByKey('buddhism_religion').GetAdjective]各派信徒之间展开了一场大辩论，最终[GetFaithByKey('vajrayana').GetNameNoTooltip]获胜。然而，[GetReligionByKey('buddhism_religion').GetAdherentNamePluralNoTooltip]却陷入嗔痴，我们必须让密乘指引我们，破除妄念，战胜孽障，走向觉悟！"
 zhangzhung.0018.desc.manichean:0 "[GetFaithByKey('manichean').GetName]。\n\n摩尼所教导的道路——光明之路，与[GetFaithByKey('old_bon').GetAdjective]和[GetReligionByKey('buddhism_religion').GetAdjective]更为契合。诚然，摩尼是新佛，是光明之佛，祂的教义是唯一真正的救赎之路。"
 zhangzhung.0018.desc.shaivism:0 "[GetFaithByKey('shaivism').GetName]。\n\n[GetFaithByKey('old_bon').GetName]中的神灵与[GetReligionByKey('hinduism_religion').GetName]神灵有相似之处，因此我们自然而然地会特别倾向于[GetFaithByKey('shaivism').GetNameNoTooltip]。湿婆滋养和养育所有众生，给予我们如阳光般的祝福，将照亮我们前进的道路。"
 zhangzhung.0018.desc.zhengyi:0 "[GetFaithByKey('zhengyi').GetName]。\n\n虽然几个世纪以来，我们与东方大国关系起伏不定，但我们一直进行商品和思想交流。如果他们的宗教哲学适合我们，我们为什么不采纳呢？正所谓千[Glossary( '里', 'LI_GLOSS' )]之行始于足下，这正是我们迈向新时代、美好时代的第一步。[Glossary( '里', 'LI_GLOSS' )]"
 zhangzhung.0018.desc.nestorian:0 "[GetFaithByKey('nestorian').GetName]。\n\n[GetReligionByKey('christianity_religion').GetAdjective]教会传播万里，如今也传到我们这里。我们通过基督的福音，可以找到平安和救赎。愿荣耀归于基督！愿上帝洗净罪孽！重新洗礼[GetGeographicalRegion('world_tibet').GetNameNoTooltip]！"
 zhangzhung.0018.desc.maturidi:0 "[GetRiteByKey('hanafi').GetName]。\n\n[GetReligionByKey('islam_religion').GetName]强调正义和真善，非常有吸引力，在[GetGeographicalRegion('world_tibet').GetNameNoTooltip]永远赞美真主安拉，除了真主之外别无真主，穆罕默德是真主的使者！"
 zhangzhung.0018.desc.khurmazta:0 "[GetFaithByKey('khurmazta').GetName]。\n\n[GetFaithByKey('old_bon').GetName]的神灵与东方[GetReligionByKey('zoroastrianism_religion').GetName]的神灵有相似之处，那我们天生就亲和[GetFaithByKey('khurmazta').GetNameNoTooltip]。现在，圣火熊熊燃烧，温暖常年寒冷的[GetGeographicalRegion('world_tibet').GetNameNoTooltip]山区的心灵——愿我们都致力于善思，善言，善行！"
 zhangzhung.0018.a:0 "整个[GetGeographicalRegion('world_tibet').GetNameNoTooltip]将传颂[ROOT.Char.GetFaith.GetNameNoTooltip]之名！"
