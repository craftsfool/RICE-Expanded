 dharma_festivals.060.t:0 "洛萨节开始了！"
 dharma_festivals.060.desc:0 "仆人们通知我们新年庆典开始，每个人无论大小都会打扫房间，此外仆人们已经开始[Glossary( '古突', 'GUTHUK_GLOSS' )]和其他食物。"
 dharma_festivals.060.clean:0 "我等如今所作诸事业，一切障难恼害悉消泯！"
 dharma_festivals.061.t:0 "洛萨日"
 dharma_festivals.061.desc:0 "今天是洛萨节的第一天！\n\n在这一天，人们向上师和尊者致敬，并礼拜[ROOT.Char.GetFaith.HouseOfWorshipPlural]。现在我参观着当地的[ROOT.Char.GetFaith.GetAdjective][ROOT.Char.GetFaith.HouseOfWorship]，我看到一些农民在自家的神龛前祭拜，祈求新的一年有好收成。"
 dharma_festivals.061.guru:0 "扎西德勒！(意为吉祥如意)"
 dharma_festivals.062.t:0 "洛萨王日"
 dharma_festivals.062.desc:0 "今天是洛萨节的第二天——洛萨王日！\n\n在这一天，廷臣与仆人会来拜会我，我坐在宫殿里接待着客人，其中有些人甚至带着礼物来见我！"
 dharma_festivals.062.king:0 "洛萨，扎西德勒！(意为新年快乐)"
 dharma_festivals.063.t:0 "给平民的礼物"
 dharma_festivals.063.desc:0 "我这种高贵之人，不单会在洛萨节的第二天收到礼物，也要送出礼物给平民，作为仁慈和慷慨的展示，即可展现我的伟大，还可以积累功德。"
 dharma_festivals.063.large:0 "我要给他们一份大礼！"
 dharma_festivals.063.medium:0 "我要给他们一份常规礼物！"
 dharma_festivals.063.small:0 "给这些平民小份额的礼物即可"
 dharma_festivals.064.t:0 "拜祭洛萨日"
 dharma_festivals.064.desc:0 "今天是洛萨节的第三天，也是拜祭的日子。\n\n在这一天，人们会去[ROOT.Char.GetFaith.HouseOfWorshipPlural]向[ROOT.Char.GetFaith.HighGodName]、[ROOT.Char.GetFaith.random_GoodGodNames]和其他神灵祈祷，人们在宫殿和[ROOT.Char.GetFaith.HouseOfWorshipPlural]周围挂上经幡，还会焚香祈求来年兴旺发达。"
 dharma_festivals.064.prayers:0 "扎西德勒！(意为吉祥如意)"
 dharma_festivals.065.t:0 "舞蹈与演奏"
 dharma_festivals.065.desc:0 "在洛萨节期间，去[ROOT.Char.GetFaith.HouseOfWorshipPlural]祈祷和拜祭之后，就会有舞蹈和表演。人们戴着精致的面具和服装跳舞来讲述故事。\n\n这些故事与过去史诗、神话、传说和历史融为一体，我们都了解古代国王、战士和[ROOT.Char.GetFaith.PriestNeuterPlural]在面对邪魔势力时所面临的斗争。"
 dharma_festivals.065.dance:0 "真是精彩！"
 dharma_festivals.066.t:0 "与家人和宫廷一起享用盛宴"
 dharma_festivals.066.desc:0 "在 [ROOT.Char.GetFaith.HouseOfWorship]的舞蹈节目后，按照传统，要与家人和宫廷成员一起享用一顿盛宴。\n\n现在许多人聚集在宫廷里参加盛宴，仆人们端来古突，啤酒和各种美味佳肴，上面有[Glossary( '麻森', 'DRESI_GLOSS' )]、[Glossary( '苏卡帕汤面', 'THUKPA_GLOSS' )]和[Glossary( '馍馍', 'MOMO_GLOSS' )]，还有黄油茶、饼干、肉、水果、面包等等。"
 dharma_festivals.066.feast:0 "“祝大家繁荣昌盛、好运连连！”"
 dharma_festivals.067.t:0 "结束"
 dharma_festivals.067.desc:0 "洛萨节终于结束了，欢乐气氛还会持续好几天。可惜，万事无常，一切美好的事物也终有结束的时候。"
 dharma_festivals.067.home:0 "庆典活动已结束。"
 RICE_glacier_grafting_activity_unlock:1 "在[GetTerrain( 'mountains' ).GetName]或[GetTerrain( 'desert_mountains' ).GetName]解锁[GetActivityType( 'activity_RICE_glacier_marriage' ).GetName][activity|E]"
 activity_RICE_glacier_marriage_host_an_a:0 "$host_activity_a$"
 activity_RICE_glacier_marriage:0 "冰川嫁接"
 activity_RICE_glacier_marriage_desc:0 "通过将雌雄冰川在典礼中以类似某种婚姻仪式嫁接，便能在山间嫁接出新冰川，为下方山谷丘陵提供额外的灌溉水源。"
 activity_RICE_glacier_marriage_selection_tooltip:0 "协助当地人举办冰川嫁接仪式。\n\n$activity_RICE_glacier_marriage_context_tooltip$"
 activity_RICE_glacier_marriage_context_tooltip:0 "#emphasis 历史背景：#!在兴都库什山脉和喜马拉雅山脉西部，存在一种通过仪式嫁接（呈现灰褐色的雄冰川与色泽纯净的雌冰川结合）来“培育”冰川用于灌溉的传统。据传说，中世纪时期圣人们为抵御入侵者（有蒙古人、吐蕃人或喀什统治者等不同说法）而教导当地人用此法构筑天然屏障。"
 activity_RICE_glacier_marriage_host_desc:0 "\n$BULLET_WITH_TAB$获得[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$获得[piety_i|E][piety|E]\n$BULLET_WITH_TAB$举行[activity|E]的[county|E]获得#P 正面#![county_modifier|E|E]，奖励[development_i|E][development|E]和[gold_i|E][taxes|E]"
 activity_RICE_glacier_marriage_guest_desc:0 "$activity_RICE_glacier_marriage_host_desc$"
 activity_RICE_glacier_marriage_province_desc:0 ""
 activity_RICE_glacier_marriage_destination_selection:0 "$activity_RICE_glacier_marriage_province_desc$"
 activity_RICE_glacier_marriage_guest_help_text:0 "$activity_RICE_glacier_marriage$"
 activity_RICE_glacier_marriage_predicted_cost:0 "[activity|E]的成本取决于你选择的[activity_options|E]。"
 activity_RICE_glacier_marriage_conclusion_desc:0 "我们的[GetActivityType( 'activity_RICE_glacier_marriage' ).GetName]已经完成，一个新的冰川诞生了！"
 RICE_glacier_marriage_sacrifice_amount:0 "献祭"
 RICE_glacier_marriage_sacrifice_amount_small:0 "小份"
