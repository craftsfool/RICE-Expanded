 zhangzhung.0120.t:0 "前勃律领主"
 zhangzhung.0120.desc:0 "年轻时，我被任命为[Glossary( '勃律', 'BRUSHA_GLOSS' )]领主，这是一片荒凉之地，附近全是崇拜邪魔的嗜血狂徒，四面八方届是蛮族，他们常常袭击我们，让我们向东部山谷撤退，目前已经安全，而我也为[odetsen.GetTitledFirstName]效劳多年。\n\n如今前途不明，不单是我，更是[GetTitleByKey('k_guge').GetNameNoTier]，如今我贵为#italic 勃律之主#!，我该重点放在……"
 zhangzhung.0120.a:0 "把[ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip][ROOT.Char.GetFaith.HouseOfWorshipPlural]建得遍地开花。"
 zhangzhung.0120.b:0 "与当地人培养关系。"
 zhangzhung.0120.c:0 "巩固山口的防御。"
 zhangzhung.0120.d:0 "享受领主生活"
 zhangzhung.0121.t:0 "$zhangzhung.0120.t$"
 zhangzhung.0121.desc:0 "我大半生担任[GetTitleByKey('k_guge').GetNameNoTier]官员，自[GetTitleByKey('e_tibet').GetNameNoTier]帝国崩溃后，我目睹历代君主为恢复秩序和弘扬[GetReligionByKey('buddhism_religion').GetAdjective]教义做了很多工作。\n\n经年累月的效命生涯，不仅深刻影响着我一生，更让我的[ROOT.Char.GetDynasty.GetName]宗族，在岁月中经历了诸多变故……"
 zhangzhung.0121.a:0 "多年来我把重心放在事业上，而较少关注家族。"
 zhangzhung.0121.a.tooltip:0 "你将#X 不会#!从现有的[family|E]开局，并且没有[heirs|E]"
 zhangzhung.0121.b:0 "我养育一个大家庭提高了我们的地位。"
 zhangzhung.0121.b.tooltip:0 "你将从一个现大[family|E]开局，其中包括至少一个[spouse|E]和[child|E]"
 zhangzhung.0122.t:0 "$zhangzhung.0120.t$"
 zhangzhung.0122.desc:0 "可如今我年岁已老，但我还是觉得并没有枉费一生，甚至最近，在[GetTitleByKey('c_purig').GetNameNoTier]不远的地方立了一块有我名字的碑文，歌颂我多年身为[Glossary( '勃律', 'BRUSHA_GLOSS' )]领主的功绩。\n\n我很高兴知道我所做之事人们会记住，然而，还有很多工作要做，也许我还可以为领地照看几年，在一切终结之事，我应该把重点放在……"
 zhangzhung.0122.a:0 "保卫领地。"
 zhangzhung.0122.b:0 "休养生息。"
 zhangzhung.0122.c:0 "支持[GetReligionByKey('buddhism_religion').GetAdjective]寺庙"
 zhangzhung.0122.info:0 "#emphasis 历史背景：#!#bold 班迪色拉#!是古格王国的一位领主，在11世纪早期至中期曾担任边境省份[Glossary( '勃律', 'BRUSHA_GLOSS' )]的领主，他是鲁姆家族的成员，该家族在古格很显赫，在王国各地拥有庄园，尤其是在斯皮提和金瑙尔。在拉达克的普里发现了一块纪念他和他的事迹的铭文，但我们对他知之甚少，因此游戏中他的事件链大部分是虚构的，只是让玩家进行一些角色扮演，填补他的生活空白。"
