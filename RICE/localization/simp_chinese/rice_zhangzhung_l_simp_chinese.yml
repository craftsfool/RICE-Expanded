 zhangzhung.0150.t:0 "美丽的唐卡"
 zhangzhung.0150.desc:0 "今日我前往[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]参观一座较小[ROOT.Char.GetFaith.GetAdjective]寺。那里的[ROOT.Char.GetFaith.PriestNeuterPlural]举行了一些法事，祈求我长寿，并成为[ROOT.Char.GetFaith.GetReligion.GetName]的护法。\n\n结束后，我花时间欣赏法事所用墙壁上一幅巨大且美丽的彩绘[Glossary( '唐卡', 'THANGKA_GLOSS' )]，上面画的是[GetPlayer.Custom('RICE_random_tibetan_buddhist_figure')]，周围环绕着其他[GetPlayer.Custom('RICE_tibet_deities_type')]和[Glossary( '空行母', 'DAKINI_GLOSS' )]。\n\n[chaplain.GetCouncilTitle][chaplain.GetTitledFirstName]陪同我出席了此次法事，并说，“这是寺庙最古老的#italic 唐卡#!。通常很少拿出如此珍贵的宝物，更不用说向外人展示。显然[ROOT.Char.GetFaith.PriestNeuterPlural]一定认为您的到来是一种莫大的荣幸。”"
 zhangzhung.0150.a:0 "“他们应该的，毕竟我是[ROOT.Char.GetTitleAsNameNoTooltip]！”"
 zhangzhung.0150.b:0 "“我真庆幸有幸看到这一幕。”"
 zhangzhung.0150.c:0 "我必须向这个寺院捐赠以表达感激之情。"
 zhangzhung.0151.t:0 "[padmasambhava.GetFirstNameNoTooltip]之洞"
 zhangzhung.0151.desc:0 "[county.GetNameNoTier]有一个洞穴，里面流传着许多故事和传说。据当地人说许多年前，伟大的[padmasambhava.GetNickname]曾用这个洞穴进行冥想修炼，因为[padmasambhava.GetHerselfHimself]出现在一些人的梦中。\n\n为此大量当地人涌向该山洞，寻求在那里获得[padmasambhava.GetFirstNameNoTooltip]的赐福。"
 zhangzhung.0151.a:0 "真是有趣！"
 zhangzhung.0151.b:0 "“真的吗？我可不信。”"
 zhangzhung.0152.t:0 "$travel_event_prefix$传奇岩石印记"
 zhangzhung.0152.desc:0 "在路过一块大石头时，我看到一些当地的[culture.GetCollectiveNoun]人正在祈祷，定眼一瞧看到上面有一只巨大的脚印。\n\n当地人说，很久以前，一位[faith.GetAdjective][ROOT.Char.GetFaith.PriestNeuter]飞升开悟，在天空中翱翔并追逐一只鸽子形状的[Glossary( '空行母', 'DAKINI_GLOSS' )]，也因此留下了各种印记，如今人们将这些脚印视为一种[faith.GetAdjective]宗教显圣。"
 zhangzhung.0152.a:0 "我也该在这里做一些祷告？"
 zhangzhung.0152.b:0 "为什么[ROOT.Char.GetFaith.PriestNeuter]会浪费时间追逐一个空行母？"
 zhangzhung.0152.info:0 "#emphasis 历史背景：#!这一事件是嘉华戈仓巴（1189年至1258年，主巴噶举上师，密勒日巴的化现）的传说，据说他曾经追逐过一只鸽子形状的空行母，然后在一块石头上留下了脚印，使得这块石头充满了灵力。"
 zhangzhung.0153.t:0 "邪魔要塞"
 zhangzhung.0153.desc:0 "根据当地民间传说和学者讲述的一些古代文献，[county.GetNameNoTier]中的一座废弃堡垒废墟内有邪魔不断。\n\n然而邪魔被一位高明的[ROOT.Char.GetFaith.GetReligion.GetAdjective]大师与一位正义领主联手降服。\n\n但当地人仍然出于恐惧而避开这个地方，相信邪魔留存的邪法仍然存在。我曾考虑夺回这座堡垒，因为它占据着战略要地，但其他人试图说服我重新考虑。"
 zhangzhung.0153.a:0 "无论有无邪法，我们都需要在那里建一座堡垒。"
 zhangzhung.0153.b:0 "“说得对，这确实邪气森森的……”"
 zhangzhung.0153.info:0 "#emphasis 历史背景：#!在喜马拉雅部分地区，某些古老的防御工事遗址在当地民间有时候会与邪魔联系在一起，尤其是在吐蕃西部和拉达克地区，那里在佛教之前是象雄文明的发源地，其建筑风格与后来的吐蕃艺术大相径庭。例如10世纪古格王国的建立是因为佛教在此降服邪魔并占领了早已消失的象雄王国旧都，此外邪魔也可能被降服为护法神。"
 zhangzhung.0154.t:0 "与神同乐"
 zhangzhung.0154.desc:0 "最近[county.GetNameNoTier]的一位平民少女生了孩子，但没有人知道孩子的父亲，据她说，不久前，她前往山间附近湖泊朝圣时遇到了山神[GetPlayer.Custom('RICE_tibet_deities_type')]，而后与亲热……\n\n整个[GetGeographicalRegion('RICE_greater_himalayan_region').GetName]确实流传着这样的传说——[GetPlayer.Custom('RICE_tibet_deities_type')]会与当地女性亲热。所以这种事情再次发生并非不可能……"
 zhangzhung.0154.a:0 "“那么她的孩子有圣洁血脉！”"
 zhangzhung.0154.b:0 "显然她想隐藏真正父亲的身份。"
 zhangzhung.0155.t:0 "喜马拉雅盗墓者"
 zhangzhung.0155.desc:0 "今天，一些平民赠送我一些珍贵物品，像金银金属制品或圣石之类。他们说这些都是最近从[county.GetNameNoTier]的古墓中偷来的。\n\n前往墓穴中寻找宝藏并不是什么新鲜事，甚至在[GetGeographicalRegion('world_tibet').GetName]的某些人中相当普遍，甚至某些点选也认可，这些[ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural]坚信这些墓中宝物具有巨大的精神力量。\n\n而且依据习俗，若是墓穴的主人或家人不明，找到物品的人可以保留它们，话虽如此……但接受这样的礼物总让人感到不安。"
 zhangzhung.0155.a:0 "一个小礼物罢了，“谢谢你！”"
 zhangzhung.0155.b:0 "把这些物品放回墓穴。"
 zhangzhung.0155.info:0 "#emphasis 历史背景：#!自中世纪以来，在西藏高原的古墓中寻找宝藏的历史记载就已存在。人们相信在这些古墓中发现的物品具有力量，或者至少有价值，当然也可以当成传家宝。"
 zhangzhung.0156.t:0 "山中安息庭"
 zhangzhung.0156.desc:0 "当地一位显赫的[ROOT.Char.GetFaith.GetAdjective]贵族最近去世了，其家人按照传统在山口竖立了一处安息庭作为纪念，在那里，人们可以留下礼物，让死者安息。\n\n当地人问我是否愿意为这处安息庭捐赠。"
 zhangzhung.0156.a:0 "我很乐意能提供帮助。"
 zhangzhung.0156.b:0 "“这与我无关。”"
 zhangzhung.0156.info:0 "#emphasis 历史背景：#!在金瑙尔，人们习惯在山口建造安息庭来纪念逝者，并在里面放置冥物，大多是生活中必需的物品，因为人们相信这些东西会在来世被死者使用，这样他们的灵魂就能安息。"
 zhangzhung.0157.t:0 "[ROOT.Char.GetHouse.GetNameNoTooltip]家族金什"
 zhangzhung.0157.desc:0 "每位[ROOT.Char.GetFaith.GetAdherentNamePlural]的家族里都会有一个单独的#italic 金什#!，祂们会关照其家人，因此必须定期在厨房里祈祷。\n\n本周，我们获悉神谕，我们应该供奉[ROOT.Char.GetHouse.GetName]家族的#italic 金什#!，并祈祷，来确保繁荣兴旺。\n\n正是如此，我带领为#italic 我们的金什#!祈祷，还奉上各种美味珍馐和珍贵宝物。"
 zhangzhung.0157.a:0 "愿尊贵金什继续保佑我们。"
 zhangzhung.0158.t:0 "[padmasambhava.GetNicknameNoTooltip]的出生"
 zhangzhung.0158.desc:0 "[GetGeographicalRegion('world_tibet').GetName]的许多[ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural]崇拜[padmasambhava.GetFirstNameNicknamed]，他多代以前来到这里，以密宗形式传播佛陀的教义。\n\n随着时间的推移，许多关于他的丰功伟绩和奇特故事广为流传，其中一些故事甚至相互矛盾。现在[courtier_1.GetFirstName]和[courtier_2.GetFirstName]恰好在争论[padmasambhava.GetNickname]的出生。\n\n“他出生自有异像！”[courtier_1.GetFirstNameNoTooltip]说着，“他从莲花中自然诞生，这是许多[Glossary( '伏藏', 'TERMA_GLOSS' )]里的说法，我等凡夫，怎敢否认其真实性？”\n\n[courtier_2.GetFirstNameNoTooltip]反驳道，“宗教学者和大师流传下来经证实的文本，清楚地表明他是由一位凡人母亲所生。他是一位伟大的尊师，而不是什么神。”"
 zhangzhung.0158.a:0 "“像他这样神人，其诞生一定伴有异像！”"
 zhangzhung.0158.b:0 "“从学术资料来看，他出生于凡人。”"
 zhangzhung.0158.info:0 "莲花生大士身为藏传佛教的主要奠基者，其传说有很多种，包括他的诞生。当代藏学家安妮·玛丽·布隆多曾指出莲花生大士诞生的故事主要有两种，一种是#italic “化生”#!，把他描述为从莲花中诞生，因为莲花是重生和纯洁的象征。这些故事经常出现[Glossary( '伏藏内的典籍', 'TERMA_GLOSS' )]中，在这些典籍中有着很多神话元素。另一种故事强调自然的#italic “胎生”#!，通常出现在更传统的书籍作品中，这些作品更喜欢对现象进行科学解释。"
 zhangzhung.0159.t:0 "[county.GetNameNoTierNoTooltip]的麝香业"
 zhangzhung.0159.desc:0 "用喜马拉雅麝腺制成的麝香是[GetGeographicalRegion('world_tibet').GetName]地区主要出口产品之一，世界各地有很多人都听说过、称赞过并重视这种麝香。\n\n近来，[county.GetNameNoTier]出产的麝香因其品质而闻名四方，商人也从中赚取很多。"
 zhangzhung.0159.a:0 "“太好了！”"
 zhangzhung.0159.info:0 "#emphasis 历史背景：#!与其他地区主要出口产品（如金属原料）不同，麝香是西藏最大的出口产品之一，其名气甚至可以让波斯和阿拉伯资料都把麝香与西藏联系在一起，虽然这些资料中关于西藏的信息往往不准确（例如，他们认为西藏人是也门人的后裔）。"
 zhangzhung.0160.t:0 "污秽的外人"
 zhangzhung.0160.desc:0 "[ROOT.Char.GetFaith.GetAdjective]强调纯洁的重要性，这意味着来外来者及所有物和地点皆为不净，甚至按照传统，即使是从国外旅行回国，也需要进行净化仪式。\n\n最近，[county.GetNameNoTier]的客商与当地村庄的关系变得紧张。当地人说，客商拒绝进行适当的净化仪式，这是对他们习俗的不尊重；然而客商认为当地人是带有歧视不让他们通过，并认为无论他们做什么都是不洁的。"
 zhangzhung.0160.a:0 "“让这些商人通过吧，他们尽力了。”"
 zhangzhung.0160.b:0 "给商人施压，迫使他们进行更多净化仪式。"
 zhangzhung.0160.c:0 "调解双方"
 zhangzhung.0160.c.failure:0 "双方未能达成妥协"
 zhangzhung.0160.c.success:0 "双方达成妥协"
 zhangzhung.0160.info:0 "#emphasis 历史背景：#!在帕米尔高原和喜马拉雅山脉西部的达尔德人，在游戏中是以[GetReligionByKey('peristani_religion').GetAdjective][religion|E]为主，他们观念里纯洁是极其重要的，外来的人或物品即使进行适当的净化仪式也可能被拒绝进入村庄。有时，根据村庄或部落的不同，仅在一年中的某些时间会如此要求，例如在重要仪式期间。"
 zhangzhung.0161.t:0 "圣山湖泊"
 zhangzhung.0161.desc:0 "[GetGeographicalRegion('RICE_upper_tibet').GetName]高原上分布着许多大湖，许多传统的[ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural]相信这些大湖蕴藏神圣，甚至认为其中一些湖泊是各种生育和财富女神的家园。\n\n恰好，离我住的地方不远的地方就有一个这样的湖泊，当地人很喜欢它，他们时不时地会来这里向当地的女神祈求生育和财富。也许我应该去那里向这位女神祈祷，并向祂献上祭品？"
 zhangzhung.0161.a:0 "我也应该过去表达敬意。"
 zhangzhung.0161.b:0 "“我现在不需要这个。”"
 zhangzhung.0162.t:0 "$travel_event_prefix$浏览传奇湖泊"
 zhangzhung.0162.desc:0 "路过[ROOT.Char.GetCurrentLocation.GetName]上方一处山间小湖时，我与一些当地朝圣者聊天。\n\n正当我们聊天时，我看到湖里有一些鱼，话题就顺着到鱼身上。一位朝圣者告诉我，在这里可以看到巨大的金鱼和龙，虽然很少见，但在[GetGeographicalRegion('world_tibet').GetName]也绝非不可能。"
 zhangzhung.0162.a:0 "多么神奇，多么吉祥！"
 zhangzhung.0162.b:0 "听起来有点荒谬。"
 zhangzhung.0162.info:0 "#emphasis 历史背景：#!在[GetGeographicalRegion('world_tibet').GetName]偏远的高原上，各种鱼类已经适应了那里极端条件，然而，当地的民间传说中却提到了更大的动物，这些动物尚未得到科学证实，比如巨型金鱼和龙。"
 zhangzhung.0163.t:0 "$travel_event_prefix$邪魔湖"
 zhangzhung.0163.desc:0 "我们在[ROOT.Char.GetCurrentLocation.GetName]的一处村庄歇脚时，村民向警告我们前方有一些咸水浅，里面各种[GetGeographicalRegion('world_tibet').GetName]邪魔横生。\n\n“最好绕道而行，”村长告诉我。“或在湖边后献上一些祭品，这样邪魔就不会来骚扰你了，若是没东西上供，那最好还是推迟一下行程，这些邪魔麻烦的狠。”"
 zhangzhung.0163.a:0 "我们绕湖而行，避开邪魔。"
 zhangzhung.0163.b:0 "我会在湖边献上一些祭品。"
 zhangzhung.0163.c:0 "“谁他妈在意这些邪魔？”"
 zhangzhung.0163.c.message:0 "然而邪魔们却非常在意你的不尊重"
 zhangzhung.0164.t:0 "大鹏金翅鸟"
 zhangzhung.0164.desc:0 "昨晚我梦见了一只#italic 大鹏金翅鸟#!在保护着我，引导着我，让我能够穿越到奇怪的梦境中。\n\n我知道古代文献中说#italic 大鹏金翅鸟#!是古代[GetTitleByKey('e_zhangzhung').GetNameNoTier]统治者和祭司的象征，而这些他们通常与[GetGeographicalRegion('world_tibet').GetName]中强大且仁慈的[GetPlayer.Custom('RICE_tibet_deities_type')]有关。\n\n这个梦是一个好兆头吗？"
 zhangzhung.0164.a:0 "这不是说明我作为[ROOT.Char.GetTitleAsNameNoTooltip]做的很好？！"
 zhangzhung.0164.b:0 "这#italic 大鹏金翅鸟#!定是护法。"
 zhangzhung.0164.info:0 "#emphasis 历史背景：#!#italic 琼鸟#!（大鹏金翅鸟）是西藏本土传说中的一种生物，随着佛教传入西藏，它与印度神话中的#italic 迦楼罗鸟#!相混淆，后者是长着人类手臂和身体的鹰。最早的西藏文献中可以找到对#italic 琼鸟#!的提及，在西藏各地发现的岩石铭文可能早于此类文献，其中描绘了#italic 琼鸟#!。"
