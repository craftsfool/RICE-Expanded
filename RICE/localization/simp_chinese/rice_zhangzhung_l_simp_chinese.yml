 RICE_zhangzhung_kinnaur_flower_festival_sacrifice_amount_medium_desc:0 "$EFFECT_LIST_BULLET$获得基本加成，[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_base_piety_medium')]#![piety|E]和[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_base_prestige_medium')]#![prestige|E]\n$EFFECT_LIST_BULLET$有#V [EmptyScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_oracle_chance_medium')]%#!概率获得神谕[modifier|E]\n\n#weak 拜祭神灵应该供奉的更多，而不仅仅是简单的祭祀和基本的供品！#!"
 RICE_zhangzhung_kinnaur_flower_festival_sacrifice_amount_large:0 "大量"
 RICE_zhangzhung_kinnaur_flower_festival_sacrifice_amount_large_desc:0 "$EFFECT_LIST_BULLET$获得基本加成，[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_base_piety_large')]#![piety|E]和[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_base_prestige_large')]#![prestige|E]\n$EFFECT_LIST_BULLET$有#V [EmptyScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_oracle_chance_high')]%#!概率获得神谕[modifier|E]\n\n#weak 我们必须向当地神灵提供大量的祭祀和供品。#!"
