 nick_RICE_great_translator_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]在[GetFaithByKey('lamaism').GetName]追随者中被尊称为#italic 大译者#!，其中一些人甚至认为[CHARACTER.GetSheHe]拥有超凡脱俗的力量。[CHARACTER.GetHerHis|U]因前往[GetGeographicalRegion('world_india').GetName]学习[GetReligionByKey('buddhism_religion').GetName]而声名远扬，并前往[GetGeographicalRegion('world_tibet').GetName]建立寺庙，弘扬佛法。"
 nick_RICE_lesser_translator:0 "小译者"
 nick_RICE_lesser_translator_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]人称“小译者”，但其实[CHARACTER.GetSheHe]也是一位伟大的翻译家，是更著名、更受尊敬的“大译者”$rinchen_zangpo$的堂兄。[CHARACTER.GetSheHe|U]曾陪同$rinchen_zangpo$前往[GetGeographicalRegion('world_india').GetName]寻求[GetReligionByKey('buddhism_religion').GetAdjective]法，以带回[GetGeographicalRegion('world_tibet').GetName]。"
