 RICE_zhangzhung_hrugs_wer_modifier:0 "仁钦桑布家族"
 RICE_zhangzhung_hrugs_wer_modifier_desc:0 "该家族内出了仁钦桑布，他是在古格国王资助下的10世纪至11世纪的翻译家，被尊为“大译师”，该家族在历史上因资助佛教和佛教艺术而闻名。"
 RICE_zhangzhung_governor_of_brusha:0 "前勃律领主"
 RICE_zhangzhung_governor_of_brusha_desc:0 "在古格王国完全控制帕米尔的[Glossary( '勃律', 'BRUSHA_GLOSS' )]地区时，该角色曾是当地领主，为当地抵御敌人。"
 RICE_zhangzhung_brusha_governor_inscription:0 "赞颂勃律领主碑"
 RICE_zhangzhung_brusha_governor_inscription_desc:0 "一块巨石上最近雕刻铭文，赞颂了古格国封臣兼[Glossary( '勃律', 'BRUSHA_GLOSS' )]前领主$dpal_dus_sgra$，其保卫古格国西部边境免受敌人侵扰，铭文中包含各种佛教符号和元素。"
 RICE_zhangzhung_avenger_of_ligmikya:0 "雪耻$Likmigyal$饮恨"
 RICE_zhangzhung_avenger_of_ligmikya_desc:0 "该宗族复兴了喜马拉雅高原的象雄古国，自象雄王$Likmigyal$被吐蕃人征服后，苯教遭受打压，但如今为$Likmigyal$雪耻饮恨，再兴苯教。"
 RICE_zhangzhung_restorer_of_bon:0 "苯教复兴者"
 RICE_zhangzhung_restorer_of_bon_desc:0 "该宗族复兴了喜马拉雅高原的象雄古国。象雄曾是繁荣的苯教与学术中心，但在被吐蕃人征服后，苯教遭受打压。如今，苯教重获新生，回归应有之位。"
 RICE_zhangzhung_new_silver_palace:0 "琼隆银城"
 RICE_zhangzhung_new_silver_palace_desc:0 "随着象雄国再兴，旧都琼隆银城的位置早已不为人知，但象雄国在这里建立新都琼隆银城，无论是否曾经是旧都位置，但不可否认的是，其已经成为喜马拉雅山西部的文化和经济中心。"
 RICE_milarepa_modifier:0 "大瑜珈士"
 RICE_milarepa_modifier_desc:0 "虽然密勒日巴早年因家产被占据，习咒造恶，报复仇人，但他对自己的行为感到后悔，随后顶礼玛尔巴[Glossary( 'Lotsawa', 'LOTSAWA_GLOSS' )]，尊其为师，苦行消业。现在他自己是一位有成就的瑜珈士，有些人认为他拥有超然之力，他花时间教导他人在洞窟中静修。"
 RICE_zhangzhung_zuthulpuk_monastery_recently_built:0 "最近建成神迹洞寺"
 RICE_zhangzhung_zuthulpuk_monastery_recently_built_desc:0 "传说中，大瑜珈士密勒日巴在冈仁波齐峰与苯教大师斗法时，通过奇迹开辟了神迹洞。无论是否属实，当地领主已将此地改造成一座真正的寺院，吸引远近佛教徒。"
 RICE_zhangzhung_built_zuthulpuk_monastery:0 "修建神迹洞寺"
 RICE_zhangzhung_built_zuthulpuk_monastery_desc:0 "正是这角色将神迹洞改造成了一座真正的寺院。据说这座建筑是大瑜珈士密勒日巴通过奇迹开辟而成，显然，这角色与米拉日巴有着深厚的因缘，才得以赞助这样一个项目。"
 RICE_terton_candidate:0 "潜在伏藏师"
 RICE_terton_candidate_desc:0 "该角色曾有过梦境、幻象等其他类型吉兆，这意味着其可能是潜在的[Glossary( '伏藏师', 'TERTON_GLOSS' )]，将来可能发现[Glossary( '伏藏', 'TERMA_GLOSS' )]\n\n#italic 只要该[character_modifier|E]存在，且拥有对应[faith|E]，其就有概率成为[RICE_tibet_treasure_revealer|E]并每年发现 [RICE_tibet_hidden_treasures|E]。#!"
 RICE_zhangzhung_patronizing_tertons:0 "赞助伏藏师"
 RICE_zhangzhung_patronizing_tertons_desc:0 "该角色正在赞助其领土上的[Glossary( '伏藏师', 'TERTON_GLOSS' )]，提供物质和精神资助从而更好的发现[Glossary( '伏藏', 'TERMA_GLOSS' )]。\n\n#italic 只要该[character_modifier|E]存在，现有的[RICE_tibet_treasure_revealers|E]每年发现[RICE_tibet_hidden_treasures|E]的概率就会更高，角色[courtiers|E]获得[GetModifier('RICE_terton_candidate').GetNameWithTooltip][character_modifier|E]的概率也会更高。#!"
 RICE_zhangzhung_searching_for_termas:0 "寻找伏藏"
 RICE_zhangzhung_searching_for_termas_desc:0 "该角色知晓[Glossary( '伏藏', 'TERMA_GLOSS' )]位置的预兆，因此较少参与日常事务，更专注于预兆后的真相。\n\n#italic 只要该[character_modifier|E]存在，每年发现[RICE_termas|E]和[RICE_minor_termas|E]的概率就会增加。#!"
 RICE_zhangzhung_discovering_termas:0 "揭示伏藏"
 RICE_zhangzhung_discovering_termas_desc:0 "该角色曾有过梦境、幻象等其他类型吉兆，知晓[Glossary( '伏藏', 'TERMA_GLOSS' )]的潜在位置，如今想将其揭晓于世间。"
 RICE_zhangzhung_kinnaur_oracle_county_modifier_1:0 "吉兆"
 RICE_zhangzhung_kinnaur_oracle_county_modifier_1_desc:0 "最近在这里举行的鲜花节期间，当地神灵降下吉兆，居住在此的人们将会得到好运。"
