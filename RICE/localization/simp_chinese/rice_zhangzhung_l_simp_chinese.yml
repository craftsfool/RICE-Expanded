 game_concept_RICE_tibet_treasure_revealers:0 "寻宝师"
 game_concept_RICE_tibet_treasure_revealer:0 "寻宝师"
 game_concept_RICE_tertons:0 "伏藏师"
 game_concept_RICE_terton:0 "伏藏师"
 game_concept_RICE_terton_desc:0 "[Glossary( '伏藏师', 'TERTON_GLOSS' )]是藏传佛教（尤其是宁玛派）和苯教的寻宝师，他们出去寻得隐藏的秘宝[RICE_termas]。因此在游戏中，有$bon_religion_adj$有[GetDoctrineType('rice_bon_deities_new_doctrine').GetBaseName][doctrine|E]、有吐蕃文化[heritage|E]的佛教徒都可以使用[RICE_termas]机制\n\n[courtiers|E]和[rulers|E]（极低概率）可以通过事件获得$RICE_terton_candidate$[modifier|E]来成为伏藏师，此后这些角色会获得[GetTrait('RICE_terton').GetName( GetNullCharacter )][trait|E]\n\n伏藏师或潜在伏藏师每年都有概率发现[RICE_termas|E]或[RICE_minor_termas|E]，但概率取决于你是否有伏藏师，以及是否使用$RICE_zhangzhung_search_for_termas$或$RICE_zhangzhung_patronize_tertons$[decisions|E]"
 game_concept_RICE_tibet_hidden_treasures:0 "伏藏"
 game_concept_RICE_tibet_hidden_treasure:0 "伏藏"
 game_concept_RICE_termas:0 "伏藏"
 game_concept_RICE_terma:0 "伏藏"
 game_concept_RICE_terma_desc:0 "[Glossary( '伏藏', 'TERMA_GLOSS' )]是一种隐藏秘宝，可由[RICE_tertons|E]发现。\n\n每年具有[GetTrait('RICE_terton').GetName( GetNullCharacter )][trait|E]或 $RICE_terton_candidate$[modifier|E]的角色可以发现[RICE_terma|E]或[RICE_minor_terma|E]，概率取决于你是否有伏藏师，以及是否使用$RICE_zhangzhung_search_for_termas$或$RICE_zhangzhung_patronize_tertons$[decisions|E]\n\n当一处[RICE_terma|E]被发现时，人们会对其产生质疑、接受或推崇这#bold 三种态度#!，然后提供从[artifacts|E]、[gold_i|E][gold|E]到[character_modifiers|E]不等的加成。"
 game_concept_RICE_minor_termas:0 "小伏藏"
 game_concept_RICE_minor_terma:0 "小伏藏"
 game_concept_RICE_minor_terma_desc:0 "小[Glossary( '伏藏', 'TERMA_GLOSS' )]是一种隐藏秘宝，不过其没有[RICE_tertons|E]那么多的加成，只会提供少量[piety_i|E][piety|E]和[prestige_i|E][prestige|E]。\n\n每年具有[GetTrait('RICE_terton').GetName( GetNullCharacter )][trait|E]或 $RICE_terton_candidate$[modifier|E]的角色可以发现[RICE_minor_terma|E]，概率取决于你是否有伏藏师，以及是否使用$RICE_zhangzhung_search_for_termas$或$RICE_zhangzhung_patronize_tertons$[decisions|E]"
 RICE_terma_intro_desc:0 "此[terton.GetFaith.GetAdjective][RICE_terma|E]是[terton.GetFullName][RICE_terton|E]于[location.GetName]揭示，此前[terton.GetSheHe]曾得见种种祥瑞异象、梦境，并通过其寻得此物。\n\n"
 RICE_terma_intro_questioned_desc:0 "显然，这是一处#bold 令人怀疑的#![RICE_terma|E]，不少人对其真实性表示怀疑，而不信[RICE_terton|E]的外人更是质疑。"
 RICE_terma_intro_accepted_desc:0 "显然，这是一处#bold 可以接受#![RICE_terma|E]，虽外人不相信[RICE_terton|E]，但本地人却是深信不疑。"
 RICE_terma_intro_venerated_desc:0 "显然，这是一处#bold 令人推崇的#![RICE_terma|E]，哪怕是不信[RICE_terton|E]的外人都对此赞叹有加。"
 RICE_terma_statue_name:0 "[terton.GetFaith.GetAdjectiveNoTooltip]像"
 RICE_terma_statue_desc:0 "这[RICE_terma|E]是一尊[GetPlayer.Custom('RICE_random_tibetan_buddhist_figure')]像，面目慈悲，以冥想姿势盘坐。"
 RICE_terma_statue_questioned_desc:0 "$RICE_terma_intro_desc$$RICE_terma_intro_questioned_desc$"
 RICE_terma_statue_accepted_desc:0 "$RICE_terma_intro_desc$$RICE_terma_statue_desc$\n\n$RICE_terma_intro_accepted_desc$"
 RICE_terma_statue_venerated_desc:0 "$RICE_terma_intro_desc$$RICE_terma_statue_desc$\n\n$RICE_terma_intro_venerated_desc$"
 RICE_terma_sacred_image_name:0 "[terton.GetFaith.GetAdjectiveNoTooltip]圣像"
 RICE_terma_sacred_image_desc:0 "这[RICE_terma|E]是一副[GetPlayer.Custom('RICE_random_tibetan_buddhist_figure')]绘本，里面有着其他各种人物，他们以各种冥想或宗教姿势安详地注视着观看者。"
 RICE_terma_sacred_image_questioned_desc:0 "$RICE_terma_intro_desc$$RICE_terma_sacred_image_desc$\n\n$RICE_terma_intro_questioned_desc$"
 RICE_terma_sacred_image_accepted_desc:0 "$RICE_terma_intro_desc$$RICE_terma_sacred_image_desc$\n\n$RICE_terma_intro_accepted_desc$"
