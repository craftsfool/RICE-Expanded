 zhangzhung.0002.t:0 "[milarepa.GetFirstNameNicknamedNoTooltip]于冈仁波齐峰"
 zhangzhung.0002.desc:0 "[GetReligionByKey('buddhism_religion').GetAdjective][milarepa.GetFirstNameNicknamed]和[GetFaithByKey('bon').GetAdjective][naro_bonchung.GetFirstName]两位大师在[GetGeographicalRegion('world_tibet').GetName]上斗法之事，迅速在[GetTitleByKey('c_purang').GetNameNoTier]附近传播开来。\n\n并非所有人将[GetReligionByKey('buddhism_religion').GetName]与本土的[GetReligionByKey('bon_religion').GetName]视为仇敌，一些大能者甚至对两者皆有所贡献，然而这场在冈仁波齐峰上的奇迹对决，是两个教派竞争的缩影，而谁赢，谁将争夺圣山。"
 zhangzhung.0002.a:0 "然后呢？发生了什么？"
 zhangzhung.0003.t:0 "$zhangzhung.0002.t$"
 zhangzhung.0003.desc:0 "据说，[milarepa.GetFirstNameNicknamed]赢得了与[naro_bonchung.GetFirstName]的斗法，最终较量是看谁先登上山峰。据说，当[naro_bonchung.GetFirstNameNoTooltip]盘坐魔鼓飞上山顶时，[milarepa.GetFirstNameNoTooltip]什么也没做，只是静坐冥想，然而，就在[naro_bonchung.GetFirstNameNoTooltip]即将到达山顶时，[milarepa.GetFirstNameNoTooltip]踏上了一缕阳光，即在山顶显现了自己。\n\n关于具体发生了什么，人们议论纷纷，但[GetReligionByKey('buddhism_religion').GetAdherentNamePluralNoTooltip]宣称这是战胜本地[GetReligionByKey('bon_religion').GetAdjective]的胜利，还说[milarepa.GetFirstNameNoTooltip]在显现伟力之后，在凯冈仁波齐峰周围静修一段时间。"
 zhangzhung.0003.a:0 "愿[milarepa.GetFirstNamePossessiveNoTooltip]得胜为众生带来福报。"
 zhangzhung.0003.b:0 "傻瓜们把“奇迹行者”与修行者混为一谈！"
 zhangzhung.0003.c:0 "难道他们不知道冈仁波齐峰对[ROOT.Char.GetFaith.GetAdherentNamePlural]来说也是圣山吗？"
 zhangzhung.0003.d:0 "虽说你我分属不同[GetReligionByKey('buddhism_religion').GetAdjective]法脉，但能听到这个消息还是很高兴！"
 zhangzhung.0003.e:0 "我想……这很有趣吧？"
 zhangzhung.0003.tooltip:0 "控制[GetTitleByKey('c_purang').GetNameNoTier]的[GetReligionByKey('buddhism_religion').GetAdjective][rulers|E]现在可以在冈仁波齐峰附近执行#bold $RICE_zhangzhung_zuthulpuk_monastery_decision$#![decision|E]。"
