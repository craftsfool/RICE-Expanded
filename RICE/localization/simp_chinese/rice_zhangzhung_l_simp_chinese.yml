 zhangzhung.0031.t:0 "伏藏的景象"
 zhangzhung.0031.desc.intro.great_terton:0 "[terton.GetTitledFirstName]被尊为我们时代最著名的[Glossary( '伏藏师', 'TERTON_GLOSS' )]之一，发现了许多[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0031.desc.intro.terton:0 "[terton.GetTitledFirstName]过去身为[Glossary( '伏藏师', 'TERTON_GLOSS' )]取得小有名气，发现了一些[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0031.desc.intro.not_terton:0 "不久前，[terton.GetTitledFirstName]有过幻象和梦境，预示着[terton.GetSheHe]将来可能成为[Glossary( '伏藏师', 'TERTON_GLOSS' )]，并发现[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0031.desc.middle:0 "\n\n如今，[terton.GetSheHe]又做了一些不寻常的梦，梦里"
 zhangzhung.0031.desc.buddhism:0 "出现[padmasambhava.GetFirstName]，"
 zhangzhung.0031.desc.not_buddhism:0 "出现古代苯教导师，"
 zhangzhung.0031.desc:0 "并告诉[terton.GetHerHim]秘宝的地点。\n\n如果这些梦是真的，它似乎指向[target_province.GetName]某处，先前就有过伏藏。尽管[terton.GetFirstNameNoTooltip]对此心存疑虑，但还是考虑前往那里，看看是否真的有伏藏等待被发现。"
 zhangzhung.0031.a:0 "带着我的祝福出发吧！"
 zhangzhung.0031.a.tooltip:0 "[terton.GetUIName]将[travel|E]到[target_province.GetName]寻找[RICE_terma|E]。如果有伏藏，你将在[terton.GetSheHe]抵达目的地时获得通知。"
 zhangzhung.0031.b:0 "我仍有疑虑，我也需要你在这里。"
 zhangzhung.0032.t:0 "xxxxx"
 zhangzhung.0032.desc:0 "xxxxx"
 zhangzhung.0032.a:0 "xxxxx"
 zhangzhung.0033.t:0 "发现伏藏"
 zhangzhung.0033.desc.intro:0 "我们得知[terton.GetFirstName]找到了[Glossary( '伏藏', 'TERMA_GLOSS' )]，正如[terton.GetHerHis]梦见那样，"
 zhangzhung.0033.desc.intro.failure:0 "据说[terton.GetFirstName]已抵达[location.GetName]，正如[terton.GetHerHis]梦见那样，然而，[terton.GetSheHe]到达后一定出了问题，现在找不到[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0033.desc.intro.bon:0 "由古代苯教导师隐藏起来，以在[location.GetName]遭受迫害时期保护他们。\n\n"
 zhangzhung.0033.desc.intro.buddhist:0 "早就被[padmasambhava.GetFirstName]隐藏了，就像[padmasambhava.GetSheHe]藏于[location.GetName]那样。"
 zhangzhung.0033.desc.teachings_physical:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏是一卷卷轴，里面写着[terton.GetFaith.GetAdjective]教义。"
 zhangzhung.0033.desc.teachings_internal:0 "于[GetPlayer.Custom('RICE_random_terton_location')|U]发现的伏藏是意伏藏，是其前世得到[terton.GetFaith.GetAdjective]教义的教诲。"
 zhangzhung.0033.desc.artifact_statue:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏是一尊[terton.GetFaith.GetAdjective]像。"
 zhangzhung.0033.desc.artifact_sacred_image:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏是一副传统[terton.GetFaith.GetAdjective]画像。"
 zhangzhung.0033.desc.artifact_ritual_instrument:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏是一具[terton.GetFaith.GetAdjective]仪式器具。"
 zhangzhung.0033.desc.religious_building:0 "[terton.GetFirstNameNoTooltip]看向[GetPlayer.Custom('RICE_random_terton_location')]，不知怎么的，一座[terton.GetFaith.GetAdjective]佛塔突然出现。"
 zhangzhung.0033.desc.riches:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏内藏有金银珠宝。"
 zhangzhung.0033.desc.artifact_scholarly_texts:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏是一卷卷轴，里面阐述学术。"
 zhangzhung.0033.desc.medicine:0 "于[GetPlayer.Custom('RICE_random_terton_location')]发现的伏藏内藏珍贵宝物，可以搓成药丸。"
 zhangzhung.0033.desc.middle.failure:0 "\n\n无论[terton.GetSheHe]做什么，都没有任何东西显现，也没有更多的幻象，到底发生了什么？是[terton.GetFirstNameNoTooltip]灵性不足，因缘不够？还是[terton.GetSheHe]没有进行正确的仪式和祈祷？还是惹恼守护伏藏的护法神灵不满？亦或邪魔妖法惑乱人心？"
 zhangzhung.0033.desc.middle:0 "[terton.Custom('RICE_random_terton_occurence_time')][terton.GetFirstNameNoTooltip][terton.Custom('RICE_random_terton_occurence')]是个吉兆！\n\n"
 zhangzhung.0033.desc.questioned:0 "然而，有些人认为这个伏藏是#bold 可信度存疑#!。总有[terton.GetFaith.GetReligion.GetAdjective]怀疑论者和原教旨主义者质疑[Glossary( '伏藏', 'TERMA_GLOSS' )]的可信度，但它肯定是真实的！"
 zhangzhung.0033.desc.accepted:0 "然而，有些人认为这个伏藏是#bold 可以接受的#!。总有[terton.GetFaith.GetReligion.GetAdjective]怀疑论者和原教旨主义者质疑[Glossary( '伏藏', 'TERMA_GLOSS' )]的可信度，但没什么争议。"
 zhangzhung.0033.desc.venerated:0 "大部分人认为这个伏藏是#bold 毋容置疑且令人推崇的#!。哪怕是[terton.GetFaith.GetReligion.GetAdjective]怀疑论者和原教旨主义者质疑都没有质疑[Glossary( '伏藏', 'TERMA_GLOSS' )]的真实。"
 zhangzhung.0033.a:0 "我一定会保留如此吉祥之物！"
 zhangzhung.0033.b:0 "您这种大师值得拥有这件珍宝的荣誉。"
 zhangzhung.0033.c:0 "让我们将此等珍宝捐赠给当地的[ROOT.Char.GetFaith.HouseOfWorship]。"
 zhangzhung.0033.d:0 "真不幸。"
