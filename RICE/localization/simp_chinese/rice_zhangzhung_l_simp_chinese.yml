 RICE_special_guest_flower_collector:0 "寻花人"
 RICE_special_guest_flower_collector_for_host:0 "$RICE_special_guest_flower_collector$"
 RICE_special_guest_flower_collector_desc:0 "每个家庭选出一位自己的成员成为$RICE_special_guest_flower_collector$。这些人将有幸进入深山寻找能取悦众神的美丽花朵，而被选中的[guest|E]将获得[piety_i|E][piety|E]和[prestige_i|E][prestige|E]，并增加对你的[opinion|E]。\n\n#N 要成为$RICE_special_guest_flower_collector$的客人，必须是主办方的近亲或[family|E]的远亲。#!"
