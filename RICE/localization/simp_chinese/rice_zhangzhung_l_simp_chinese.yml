 zhangzhung.0100.t:0 "前往神圣高地"
 zhangzhung.0100.desc:0 "秋夏交际之时预示着[ROOT.Char.GetInvolvedActivity.GetShortName]的到来，这是[ROOT.Char.GetFaith.GetAdjective]传统采花庆祝活动。\n\n我正前往[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]的一个村庄。据说那高地蕴藏着许多神圣的能量，所以我希望参加当地纪念山神的庆祝活动。"
 zhangzhung.0100.a:0 "该迎来鲜花节了！"
 zhangzhung.0101.t:0 "进入山区"
 zhangzhung.0101.desc:0 "我已抵达[location.GetName]的高地村庄，这里将举办鲜花节。我凝视着周围原始纯净的山峦，内心深受震撼，多么神圣而洁净的地方啊。\n\n村民们早已开始筹备庆典，采花队伍即将深入荒野，采集山地野花，这是备受尊崇的使命。其余人则举行各种仪式，向逝去的亲人和祖先敬献祭品。"
 zhangzhung.0101.desc.flower_collector:0 "\n\n我一定会在[flower_collector.GetFirstName]加入其他采花队伍之前送别[flower_collector.GetSheHe]，而且我相信[flower_collector.GetSheHe]参与采花会给我们家族带来荣誉！"
 zhangzhung.0101.a:0 "我们现在必须等待采花者回来。"
 zhangzhung.0102.t:0 "寻花人归来"
 zhangzhung.0102.desc.intro:0 "采花人从山地带回一捆捆的野花，上面神圣纯洁气息让众人知晓。采花人开始诉说他们如何在高地的洞穴里过夜的，并确保举行适当的仪式，以免侮辱山神。"
 zhangzhung.0102.desc.flower_collector:0 "我也要祝贺[flower_collector.GetFirstName]在山上的辛勤劳动。"
 zhangzhung.0102.desc.no_flower_collector:0 "我也要祝贺他们在山上的辛勤劳动。"
 zhangzhung.0102.desc:0 "我敢肯定，乡间神祇一定很高兴！\n\n随后，人们分发鲜花，抬着载有神像的轿子在村子里游行，一路敲锣打鼓以及舞蹈。人们制作花束和花环来装饰整个村子，有些则作为祭品献给祖先，其中包括我在内的许多人也在头上或帽子上戴上一些鲜花。"
 zhangzhung.0102.a:0 "又到了向乡间神祇举行祭祀的时候了。"
 zhangzhung.0103.t:0 "祭祀"
 zhangzhung.0103.desc:0 "神轿及神像已用鲜花装饰，被带到了村里的集市上。节日里最重要的祭祀活动将在这里举行，据说不久后神谕将能够预测将来会发生什么\n\n"
 zhangzhung.0103.desc.old_bon:0 "祭祀是用自古以来的山羊祭品，因为山羊是山上的神圣动物。随着越来越多的鲜花分发给每个人，山羊被带到神像前割开喉咙，鲜血开始流出。"
 zhangzhung.0103.desc.new_bon:0 "古时候，我们用山羊来祭祀神灵，但司祭告诉我们，旧的祭祀既残忍也没有必要，虽然有些人仍然相信神灵需要真正的祭祀，不过如今我们用面团和其他神圣的材料制成动物形状的“祭品”。"
 zhangzhung.0103.a:0 "一定能让乡间神祇满意的祭品！"
 zhangzhung.0104.t:0 "神谕者"
 zhangzhung.0104.desc:0 "我眼前满是鲜花，每个人头发衣服都戴上鲜花，建筑也被鲜花点缀，地上天上神像上都是鲜花。\n\n我们围着神像欢歌载舞时，神谕者进入恍惚状态，准备对来年做出预言。很快，神谕就被说出来了！"
 zhangzhung.0104.a:0 "会是吉兆吗？"
 zhangzhung.0105.t:0 "欢宴"
 zhangzhung.0105.desc:0 "祭祀和聆听神谕后，神轿被抬回寺庙。\n\n我们回到那里，我们向世世代代守护村庄神像鞠躬祈祷，表达敬意，然后狂欢，唱歌跳舞，大口喝酒。"
 zhangzhung.0105.a:0 "大家度过了一段欢乐的时光。"
 zhangzhung.0106.t:0 "结束"
 zhangzhung.0106.desc:0 "鲜花节终于结束了，想必当地村神无疑会高兴，当地人也欢庆不止，到处都是许多美丽圣洁的山野花，让这片地区看起来十分赏心悦目。\n\n经过如此欢乐的庆典，也该打道回府了，离开前，我捡起一朵野花，在手中把玩。"
 zhangzhung.0106.a:0 "这些花真美丽……"
