 RICE_festival_losar_gift_medium_desc:0 "$EFFECT_LIST_BULLET$[capital|E]获得[GetModifier('RICE_losar_medium_gift_modifier').GetNameWithTooltip][county_modifier|E]\n$EFFECT_LIST_BULLET$获得额外的[prestige_i|E]#V [EmptyScope.ScriptValue('minor_prestige_gain')]#![prestige|E]\n\n#weak 洛萨节期间，我们有责任做更多的事情，而不是做最起码的事情，应给平民送上一份体面的礼物，#!"
 RICE_festival_losar_gift_large:0 "大份"
 RICE_festival_losar_gift_large_desc:0 "$EFFECT_LIST_BULLET$[capital|E]获得[GetModifier('RICE_losar_large_gift_modifier').GetNameWithTooltip][county_modifier|E]\n$EFFECT_LIST_BULLET$获得额外的[prestige_i|E]#V [EmptyScope.ScriptValue('medium_prestige_gain')]#![prestige|E]\n\n#weak 洛萨节期间给平民送上一份大礼，这种善因必将结成善果！#!"
