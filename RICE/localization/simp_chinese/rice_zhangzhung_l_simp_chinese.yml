 innovation_RICE_netsang_relationships:1 "庇护关系"
 innovation_RICE_netsang_relationships_desc:1 "喜马拉雅高原的游牧家庭常与喜马拉雅南部的其他家庭建立称为“尼仓”的非血缘亲属关系。这种延续数代人的关系相互给予对方贸易特权，并在彼此领地互访时成为东道主。"
