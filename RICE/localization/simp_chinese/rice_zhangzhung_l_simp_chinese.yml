 building_type_RICE_zhangzhung_tsaparang_fortress:0 "札布让堡垒"
 building_type_RICE_zhangzhung_tsaparang_fortress_desc:0 "札布让堡垒和宫殿坐落在岩石之上，是当地统治者权力的象征，其由众多寺庙、修道院、洞穴、隧道和其他建筑组成，在宫殿上方还有一座夏宫。"
 building_RICE_zhangzhung_tsaparang_fortress:0 "$building_type_RICE_zhangzhung_tsaparang_fortress$"
 building_RICE_zhangzhung_tsaparang_fortress_desc:0 "$building_type_RICE_zhangzhung_tsaparang_fortress_desc$"
 building_type_RICE_zhangzhung_lake_dangra:0 "当惹湖"
 building_type_RICE_zhangzhung_lake_dangra_desc:0 "当地人认为当惹湖那清澈的湖水是万物众生之源，湖边土地肥沃，适合耕种，据说这里是古代象雄王国的都城。"
 building_RICE_zhangzhung_lake_dangra:0 "$building_type_RICE_zhangzhung_lake_dangra$"
 building_RICE_zhangzhung_lake_dangra_desc:0 "$building_type_RICE_zhangzhung_lake_dangra_desc$"
 building_type_RICE_zhangzhung_tabo_monastery:0 "达波寺"
 building_type_RICE_zhangzhung_tabo_monastery_desc:0 "达波寺位于干旱寒冷的斯皮提山谷，是当地佛教宗教和学习中心，内有数座寺庙、洞穴和佛塔，上面描绘各种华丽的神佛壁画，以及佛教民间传说故事。"
 building_RICE_zhangzhung_tabo_monastery:0 "$building_type_RICE_zhangzhung_tabo_monastery$"
 building_RICE_zhangzhung_tabo_monastery_desc:0 "$building_type_RICE_zhangzhung_tabo_monastery_desc$"
 building_type_RICE_zhangzhung_kangra_fort:0 "建伽罗堡"
 building_type_RICE_zhangzhung_kangra_fort_desc:0 "建伽罗堡位于曼吉河和邦根加河之间的一座小山丘上，是喜马拉雅地区最大的堡垒之一。其历史据说可以追溯到几个世纪以前，它还因内部宝藏以及各种美丽的当地神灵雕像而闻名。"
 building_RICE_zhangzhung_kangra_fort:0 "$building_type_RICE_zhangzhung_kangra_fort$"
 building_RICE_zhangzhung_kangra_fort_desc:0 "$building_type_RICE_zhangzhung_kangra_fort_desc$"
 building_type_RICE_zhangzhung_phuktal_monastery:0 "普克塔寺"
 building_type_RICE_zhangzhung_phuktal_monastery_desc:0 "普克塔尔寺位于偏远的罗那迦山谷，附近最近定居点来此也需要一天的路程。据说几个世纪以来，许多开悟者包括佛陀直系弟子都曾居住在这个洞穴中。"
 building_RICE_zhangzhung_phuktal_monastery:0 "$building_type_RICE_zhangzhung_phuktal_monastery$"
 building_RICE_zhangzhung_phuktal_monastery_desc:0 "$building_type_RICE_zhangzhung_phuktal_monastery_desc$"
 building_type_RICE_zhangzhung_alchi_monastery:0 "阿济寺"
 building_type_RICE_zhangzhung_alchi_monastery_desc:0 "位于拉达克山区的阿济寺建筑群是一处佛学宗教中心。其寺院建筑中留存着精美的艺术作品，展现了吐蕃与印度艺术风格及宗教传统在此地的交融。"
 building_RICE_zhangzhung_alchi_monastery:0 "$building_type_RICE_zhangzhung_alchi_monastery$"
 building_RICE_zhangzhung_alchi_monastery_desc:0 "$building_type_RICE_zhangzhung_alchi_monastery_desc$"
 building_type_RICE_sacred_rocks_of_hunza:0 "洪札灵岩"
 building_type_RICE_sacred_rocks_of_hunza_desc:0 "洪札河流域是横跨播密高原和兴都库什山脉的重要通道之一，为丝绸之路沿线的贸易和旅行提供了便利。这些巨大的岩石上雕刻的岩刻已经有很长时间了，但这一块分为上下两部分的岩石可能是所有中最引人注目的。它们几个世纪以来由不同文化和信仰的旅行者所雕刻，证明了这个地区人民和思想的伟大交流。"
 building_RICE_sacred_rocks_of_hunza:0 "洪札灵岩"
 building_RICE_sacred_rocks_of_hunza_desc:0 "洪札河流域是横跨播密高原和兴都库什山脉的重要通道之一，为丝绸之路沿线的贸易和旅行提供了便利。这些巨大的岩石上雕刻的岩刻已经有很长时间了，但这一块分为上下两部分的岩石可能是所有中最引人注目的。它们几个世纪以来由不同文化和信仰的旅行者所雕刻，证明了这个地区人民和思想的伟大交流。"
 trait_RICE_terton:0 "伏藏师"
 trait_RICE_terton_desc:0 "该角色是一位[RICE_tibet_treasure_revealer|E]，其发现源自吐蕃宗教中的重要古代经文或[Glossary( '伏藏', 'TERMA_GLOSS' )] 。"
 trait_RICE_terton_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是一位[RICE_tibet_treasure_revealer|E]，其发现源自吐蕃宗教中的重要古代经文或[Glossary( '伏藏', 'TERMA_GLOSS' )] 。"
 trait_RICE_terton_2:0 "大伏藏师"
 trait_RICE_terton_2_desc:0 "该角色是一位著名的[RICE_tibet_treasure_revealer|E]，其发现了许多[Glossary( '伏藏', 'TERMA_GLOSS' )]，这些典籍对于吐蕃的宗教非常重要，因此受到尊重。"
 trait_RICE_terton_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]是一位著名的[RICE_tibet_treasure_revealer|E]，其发现了许多[Glossary( '伏藏', 'TERMA_GLOSS' )]，这些典籍对于吐蕃的宗教非常重要，因此受到尊重。"
 trait_RICE_terton_3:0 "伏藏王"
 trait_RICE_terton_3_desc:0 "该角色因发现众多[Glossary( '伏藏', 'TERMA_GLOSS' )]而被尊为当代最伟大的[RICE_tibet_treasure_revealer|E]之一。"
 trait_RICE_terton_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]因发现众多[Glossary( '伏藏', 'TERMA_GLOSS' )]而被尊为当代最伟大的[RICE_tibet_treasure_revealer|E]之一。"
