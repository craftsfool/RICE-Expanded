 activity_RICE_festival_losar:0 "洛萨庆典"
 activity_RICE_festival_losar_desc:0 "洛萨是藏历中的新年庆祝活动，也是藏族人民最受欢迎的庆祝活动之一。"
 activity_RICE_festival_losar_selection_tooltip:0 "让我们迎接新年的到来！\n\n$RICE_festival_losar_desc_context_tooltip$"
 activity_RICE_festival_losar_host_desc:0 "\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$获得[piety_i][piety|E]\n$BULLET_WITH_TAB$获得[prestige_i][prestige|E]\n$BULLET_WITH_TAB$获得随机金币礼物，最高可达到[gold_i|E]#V [EmptyScope.ScriptValue('RICE_losar_gift_amount')]#![gold|E]\n$BULLET_WITH_TAB$你的[capital|E]获得#P 正面#![county_modifiers|E]"
