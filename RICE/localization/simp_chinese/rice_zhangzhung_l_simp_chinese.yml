 activity_RICE_zhangzhung_kinnaur_flower_festival:0 "鲜花节"
 activity_RICE_zhangzhung_kinnaur_flower_festival_desc:0 "秋天来临预示鲜花盛开，人们前往高地采摘盛开的野花，并将它们献给当地的神灵，同时也缅怀故人，祈求预言。"
 activity_RICE_zhangzhung_kinnaur_flower_festival_selection_tooltip:0 "参加当地鲜花节\n\n$activity_RICE_zhangzhung_kinnaur_flower_festival_context_tooltip$"
 activity_RICE_zhangzhung_kinnaur_flower_festival_context_tooltip:0 "#emphasis 历史背景：#!#italic 鲜花节#!是今印度喜马偕尔邦[GetTitleByKey('d_kinnaur').GetNameNoTier]山谷的传统庆典。该节日主要围绕采集山花献给当地神灵，同时也是缅怀家人并寻求神谕的节日。"
 activity_RICE_zhangzhung_kinnaur_flower_festival_host_desc:0 "\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[piety_i|E][piety|E]\n$BULLET_WITH_TAB$失去[stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$根据预言的结果，你将有概率获得#P 正面#!的[character_modifiers|E]或[county_modifiers|E]（仅举行[activity|E]的[county|E]）\n$BULLET_WITH_TAB$被指定为#bold 寻花人#!的家庭成员可能会获得额外加成"
 activity_RICE_zhangzhung_kinnaur_flower_festival_guest_desc:0 "$activity_RICE_zhangzhung_kinnaur_flower_festival_host_desc$"
 activity_RICE_zhangzhung_kinnaur_flower_festival_province_desc:0 ""
