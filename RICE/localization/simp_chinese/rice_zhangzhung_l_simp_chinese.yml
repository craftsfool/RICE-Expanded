 RICE_random_terton_occurence_time_10:0 "发现后的第二天，"
 RICE_random_terton_occurence_01:0 "看见[Glossary( '空行母', 'DAKINI_GLOSS' )]在天空中翩翩起舞。"
 RICE_random_terton_occurence_02:0 "浸入幻境，看见[Glossary( '空行母', 'DAKINI_GLOSS' )]，并告知[Glossary( '伏藏师', 'TERTON_GLOSS' )]不能对发现过于兴奋或傲慢，因为追求世俗乃虚伪之行。"
 RICE_random_terton_occurence_03:0 "看见附近的巨石上出现了之前神隐的咒语。"
 RICE_random_terton_occurence_04:0 "听到远处不知何方传来仙乐。"
 RICE_random_terton_occurence_05:0 "闻到整个区域都弥漫着一股令人愉悦的芳香气味。"
 RICE_random_terton_occurence_06:0 "不知何故就倒下失去意识，但不久后就恢复了。"
 RICE_random_terton_occurence_07:0 "看到一道道光芒，似乎笼罩了整个区域。"
 RICE_random_terton_occurence_08:0 "看到天空中出现了一道绚丽的彩虹。"
 RICE_random_terton_occurence_09:0 "看到了前世幻象，预言这个伏藏将在未来被发现。"
 RICE_random_terton_occurence_10:0 "失去了意识片刻，做了一个美梦，梦中见到了许多强大而仁慈的神灵。"
 RICE_random_terton_occurence_11:0 "陷入了一场巨大的风暴中，在向[ROOT.Char.Custom('RICE_random_tibetan_buddhist_figure')]祈祷之后，风暴奇迹般地消失了。"
 RICE_random_terton_occurence_12:0 "见无数的菩萨盘踞天空，如同夜晚的星光，照耀着四方。"
 RICE_random_terton_occurence_13:0 "看到前世死亡幻象，不久后便发誓在来世要恢复这个伏藏。"
 RICE_random_terton_occurence_14:0 "不知为何，喜极而泣。"
 RICE_random_terton_occurence_15:0 "情不自禁地呼喊着[ROOT.Char.Custom('RICE_random_tibetan_buddhist_figure')]的名字，仿佛受到了更强大力量的驱使。"
 RICE_random_terton_occurence_16:0 "看到守护伏藏护法的愤怒且表达敬意景象，并说是时候了。"
 RICE_random_terton_occurence_17:0 "看到愤怒的护法守护着伏藏并向[ROOT.Char.Custom('RICE_random_tibetan_buddhist_figure')]祈祷的景象。"
 RICE_random_terton_occurence_18:0 "看到了愤怒的护法保护着伏藏，并变成了[ROOT.Char.Custom('RICE_random_tibetan_buddhist_figure')]。"
 RICE_random_terton_occurence_19:0 "发生了一次短暂的地震——但奇迹般地，没有任何东西和人受到损坏和受伤。"
