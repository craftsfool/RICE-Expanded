 RICE_zhangzhung_kinnaur_flower_festival_collection_phase:0 "采花"
 RICE_zhangzhung_kinnaur_flower_festival_collection_phase_desc:0 "当地人前往高原采集美丽的花朵。"
 RICE_zhangzhung_kinnaur_flower_festival_offerings_phase:0 "拜祭"
 RICE_zhangzhung_kinnaur_flower_festival_offerings_phase_desc:0 "把采好的鲜花献给当地的神灵。"
 RICE_zhangzhung_kinnaur_flower_festival_respect_intent_header:0 "追悼："
 RICE_zhangzhung_kinnaur_flower_festival_respect_intent:0 "追悼"
 RICE_zhangzhung_kinnaur_flower_festival_respect_intent_desc:0 "你希望追悼家人并祭拜神灵。获得[dynasty_prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_zhangzhung_kinnaur_flower_festival_dynasty_prestige_gain')]#![dynasty_prestige|E]。[GetTrait('zealous').GetName( GetNullCharacter )|U]和[GetTrait('diligent').GetName( GetNullCharacter )]特质角色将失去额外的[stress_loss_i|E][stress|E]。"
 RICE_zhangzhung_kinnaur_flower_festival_divination_intent_header:0 "占卜："
 RICE_zhangzhung_kinnaur_flower_festival_divination_intent:0 "占卜"
 RICE_zhangzhung_kinnaur_flower_festival_divination_intent_desc:0 "你祈求神灵预示未来，增加#V 10%#!概率获得#P 好运#![modifier|E]。[GetTrait('ambitious').GetName( GetNullCharacter )|U]和[GetTrait('humble').GetName( GetNullCharacter )]特质角色将额外失去[stress_loss_i|E][stress|E]"
 RICE_zhangzhung_kinnaur_flower_festival_rejoicement_intent_header:0 "庆祝："
 RICE_zhangzhung_kinnaur_flower_festival_rejoicement_intent:0 "庆祝"
 RICE_zhangzhung_kinnaur_flower_festival_rejoicement_intent_desc:0 "你将与他人共同庆祝，排忧解压。所有参与者对你获得[opinion_i|E]#P +10#![opinion|E]，[GetTrait('gregarious').GetName( GetNullCharacter )|U]和[GetTrait('generous').GetName( GetNullCharacter )]特质角色额外失去[stress_loss_i|E][stress|E]。"
