 zhangzhung.0090.t:0 "着手准备"
 zhangzhung.0090.desc:0 "[county.GetNameNoTier]的[culture.GetName]人多年前就知道用#bold 冰川嫁接#!在高山上培育新冰川，通过这种方式，他们确保了田地和作物能在未来多年获得稳定的灌溉水源。\n\n我即将启程前往[location.GetName]，亲眼见证由我本人资助的一场冰川嫁接。大家都期盼着这座新冰川能在未来岁月里为当地居民带来丰饶。"
 zhangzhung.0090.a:0 "去山里！"
 zhangzhung.0091.t:0 "冰川性别"
 zhangzhung.0091.desc:0 "我抵达[location.GetName]时，正好赶上冰川嫁接开始。\n\n附近村庄的强壮[ROOT.Char.Custom('WomenMenPeople_GenderPreference')]们进山采集碎片。雄冰川颜色偏棕灰，夹杂更多碎石；雌冰川则更纯白和蓝色。\n\n采集完成后，这些[ROOT.Char.Custom('WomenMenPeople_GenderPreference')]会用填满干草和木炭的特殊篮子保存，确保保持低温，最后将冰川运往新地点。在此期间，我们其他人会进行各种[ROOT.Char.GetFaith.GetAdjective]仪式祈祷与献祭，祈愿这两座冰川嫁接保证丰饶。"
 zhangzhung.0091.a:0 "我希望这将是一次成功的嫁接！"
 zhangzhung.0092.t:0 "新冰川的诞生"
 zhangzhung.0092.desc:0 "我们已在新建冰川位置，遇见了几天前出发去采集冰川碎片的[ROOT.Char.Custom('WomenMenPeople_GenderPreference')]。他们小心翼翼地搬运着这些碎片，确保它们不接触地面，并全程念诵着[ROOT.Char.GetFaith.GetAdjective]祷词。\n\n我们目睹了冰川碎片在现场与水、木炭、锯末、布条及麦壳混合的过程。当地人告诉我，这些物质能帮助新冰川保持低温。\n\n又一轮祈祷和仪式结束后，嫁接便完成了。几年后，我们只能祈愿这里将逐年形成一座壮丽的冰川——为下方山谷与丘陵源源不断地提供水资源！"
 zhangzhung.0092.a:0 "希望它能成为一座雄伟壮观的巨大冰川。"
