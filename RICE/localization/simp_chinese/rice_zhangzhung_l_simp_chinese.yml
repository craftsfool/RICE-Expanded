 RICE_zhangzhung_padmasambhava_cave:0 "莲花生大士造访之处"
 RICE_zhangzhung_padmasambhava_cave_desc:0 "该地区的一个洞穴最近变得相当出名，因为印度密宗莲花生大士在梦中拜访了当地人，向他们证明他多年前曾在这个洞穴冥想修炼，如今这里变成当地朝圣者和信徒的热门目的地。"
 RICE_zhangzhung_demon_fortress:0 "重新占领邪魔要塞"
 RICE_zhangzhung_demon_fortress_desc:0 "根据当地民间传说，这里有一座俯瞰着战略要地的堡垒遗址，曾被邪魔占领，但祂最终被击败。现在，这座堡垒已被近来的统治者重新占领，这违背了当地民众的意愿，他们害怕这个地方散发出的所谓邪法。"
 RICE_zhangzhung_religious_argument_opinion:0 "宗教争论"
 RICE_zhangzhung_musk_county_modifier:0 "藏区麝香产业蓬勃发展"
 RICE_zhangzhung_impure_merchants:0 "不纯洁的商人"
 RICE_zhangzhung_impure_merchants_desc:0 "由于宗教信仰，该地区的人们对陌生人很谨慎，认为外人不洁，特别是外人在进入村庄前没有进行正确的仪式来净化自己。当地领主强迫村民接受外国商人的存在，虽然贸易增加，但局势也紧张许多。"
 RICE_zhangzhung_xenophobic_locals:0 "当地排外"
 RICE_zhangzhung_xenophobic_locals_desc:0 "由于宗教信仰，该地区的人们对陌生人很谨慎，认为外人不洁，特别是外人在进入村庄前没有进行正确的仪式来净化自己，甚至当地领主也是如此认为，对进入该地区进行贸易或旅行的外国人有偏见。"
 RICE_zhangzhung_prosperous_village_trade:0 "村庄贸易繁荣"
 RICE_zhangzhung_prosperous_village_trade_desc:0 "由于宗教信仰，该地区的人们对陌生人很谨慎，认为外人不洁，特别是外人在进入村庄前没有进行正确的仪式来净化自己，然而当地领主认为双方互相尊重，因此温和地鼓励这些村庄与外国商人进行贸易。"
 RICE_zhangzhung_mountain_lake_goddess_prayer:0 "向山湖女神祈祷"
 RICE_zhangzhung_brackish_lake_demons:0 "咸水湖邪魔诅咒"
 RICE_zhangzhung_brackish_lake_demons_desc:0 "该角色路过一处据说有邪魔扎根的咸水湖，其并没有表示任何尊重以及拜祭，因此有人认为邪魔诅咒了这个不幸的家伙。"
 RICE_zhangzhung_khyung_royal:0 "大鹏庇护"
 RICE_zhangzhung_khyung_royal_desc:0 "该角色做了一个梦，梦中只见一只大鹏鸟守护其左右，并肯定其地位，大多数藏族人都认为这是一个好兆头。"
 RICE_zhangzhung_khyung_spiritual:0 "大鹏庇护"
 RICE_zhangzhung_khyung_spiritual_desc:0 "该角色做了一个梦，梦中只见一只大鹏鸟守护其左右，并给予宗教指引，大多数藏族人都认为这是一个好兆头。"
 RICE_zhangzhung_adopt_new_tibetan_faith:0 "为吐蕃寻找新信仰"
 RICE_zhangzhung_adopt_new_tibetan_faith_tooltip:0 "是时候，为这片土地寻找新的精神道路了。"
 RICE_zhangzhung_adopt_new_tibetan_faith_desc:0 "没有什么是永恒的，吐蕃帝国的崩溃让喜马拉雅高原进入混乱的时代。我们必须抛弃或改革我们旧的[GetFaithByKey('old_bon').GetAdjective]信仰和制度，但哪条路才是正道呢？"
 RICE_zhangzhung_adopt_new_tibetan_faith_effect_tooltip_1:0 "这才是正道！"
 RICE_zhangzhung_adopt_new_tibetan_faith_confirm:0 "这才是正道！"
 RICE_zhangzhung_adopt_new_tibetan_faith_context_tooltip:0 "#emphasis 历史背景：#!吐蕃帝国的覆灭让吐蕃进入一段黑暗时期，直到#italic 后弘期#!佛苯二教于十世纪末传遍整个吐蕃地区才结束，如今许多证据表明许多传统的西藏信仰（游戏中以[GetFaithByKey('old_bon').GetName]出现）一直延续到中世纪甚至更久，尽管佛教和改革后的苯教在民间广泛传播，但旧信仰依旧广泛存在。"
 RICE_ADOPT_NEW_TIBETAN_FAITH_PICK_ACTION_TYPE:0 "为众生！"
 choose_nangchos_name:0 "[GetFaithByKey('lamaism').GetName]"
 choose_nangchos_desc:0 "[GetFaithByKey('lamaism').GetNameNoTooltip]"
 choose_nangchos_tooltip:0 "通过像$Songtsen_Gampo$国王和莲花生大士这样的博学大师努力，[GetGeographicalRegion('world_tibet').GetName]的神祇成为佛教护法，而[GetReligionByKey('buddhism_religion').GetName]也以[GetFaithByKey('lamaism').GetName]的形式发展，尽管有时它与[GetFaithByKey('old_bon').GetName]的关系紧张，但[GetFaithByKey('lamaism').GetNameNoTooltip]的道路表明，我们既可以保持古老的精神修行方式，也可以遵循佛陀的教诲。"
 choose_new_bon_name:0 "[GetFaithByKey('bon').GetName]"
 choose_new_bon_desc:0 "[GetFaithByKey('bon').GetNameNoTooltip]"
 choose_new_bon_tooltip:0 "[GetFaithByKey('old_bon').GetAdherentNamePlural]曾经遍布[GetGeographicalRegion('world_tibet').GetName]各地，但惨遭[GetReligionByKey('buddhism_religion').GetAdjective]分子迫害而衰落。不过聪明的[Glossary( '伏藏师', 'TERTON_GLOSS' )]正在发掘先祖所隐藏的教义，这都预示着[GetFaithByKey('bon').GetName]的兴起。无论[GetReligionByKey('buddhism_religion').GetAdherentNamePlural]对我们态度如何，这些发现都证明了我们也与他们一样走向正道通往觉悟，甚至有过之而无不及。"
 choose_mahayana_name:0 "[GetFaithByKey('mahayana').GetName]"
 choose_mahayana_desc:0 "[GetFaithByKey('mahayana').GetNameNoTooltip]"
 choose_mahayana_tooltip:0 "传说，在$Trisong_Detsen$统治期间，[GetFaithByKey('vajrayana').GetName]和[GetFaithByKey('mahayana').GetName]僧伽之间进行了一场大辩论，从而确定[GetReligionByKey('buddhism_religion').GetName]哪一派能在[GetGeographicalRegion('world_tibet').GetName]扎根，据说前者获胜，从而诞生了[GetFaithByKey('lamaism').GetName]。但也有人声称是[GetFaithByKey('mahayana').GetAdherentNamePluralNoTooltip]胜利了，如今[GetFaithByKey('mahayana').GetNameNoTooltip]佛法弘扬四方，或许它才是正道……"
 choose_vajrayana_name:0 "[GetFaithByKey('vajrayana').GetName]"
 choose_vajrayana_desc:0 "[GetFaithByKey('vajrayana').GetNameNoTooltip]"
 choose_vajrayana_tooltip:0 "传说，在$Trisong_Detsen$统治期间，[GetFaithByKey('vajrayana').GetName]和[GetFaithByKey('mahayana').GetName]僧伽之间进行了一场大辩论，从而确定[GetReligionByKey('buddhism_religion').GetName]哪一派能在[GetGeographicalRegion('world_tibet').GetName]扎根，据说前者获胜，从而诞生了[GetFaithByKey('lamaism').GetName]。虽然前者获胜，但有些人认为，[GetFaithByKey('lamaism').GetName]吸纳了[GetFaithByKey('old_bon').GetAdjective]的思想，偏离正道。现在是传播[GetFaithByKey('vajrayana').GetAdjective]教义的时候了，这样我们才能回归正道。"
 choose_manichean_name:0 "[GetFaithByKey('manichean').GetName]"
 choose_manichean_desc:0 "[GetFaithByKey('manichean').GetNameNoTooltip]"
 choose_manichean_tooltip:0 "[GetReligionByKey('buddhism_religion').GetName]能在严酷的[GetGeographicalRegion('world_tibet').GetName]山区传播，那[GetFaithByKey('manichean').GetName]为何不能呢？[GetFaithByKey('manichean').GetAdherentNamePluralNoTooltip]声称他们的创始人也是佛佗，也许摩尼教倡导的光明之路更符合我们古老的[GetFaithByKey('old_bon').GetAdjective]方式，也许它能让我们的土地实现精神圆满？"
 choose_shaivism_name:0 "[GetFaithByKey('shaivism').GetName]"
 choose_shaivism_desc:0 "[GetFaithByKey('shaivism').GetNameNoTooltip]"
 choose_shaivism_tooltip:0 "[GetGeographicalRegion('world_india').GetName]是许多宗教的发源地，其中的[GetReligionByKey('buddhism_religion').GetName]更是传播到[GetGeographicalRegion('world_tibet').GetName]。在这两个地区的交界处，甚至有一些人认为他们的本土神灵与[GetReligionByKey('hinduism_religion').GetName]的神灵同源，尤其是那些信奉[GetFaithByKey('shaivism').GetAdjective]的人。或许我们采用[GetFaithByKey('shaivism').GetNameNoTooltip]才是更好的正道？这使我们能够尊重我们古老的方式，并与我们强大而博学的南方邻居建立联系。"
 choose_zhengyi_name:0 "[GetFaithByKey('zhengyi').GetName]"
 choose_zhengyi_desc:0 "[GetFaithByKey('zhengyi').GetNameNoTooltip]"
 choose_zhengyi_tooltip:0 "中原人与[GetGeographicalRegion('world_tibet').GetName]人有着悠久的交往历史，我们都知道他们的哲学家，如孔子这般，我甚至崇拜，即然如初那适应他们的信仰和思想，如[GetFaithByKey('zhengyi').GetNameNoTooltip]的哲学和思想，就这么难吗？现在我们这样做不仅能让我们的进步，还能与东方邻国建立联系。"
 choose_nestorian_name:0 "[GetFaithByKey('nestorian').GetName]"
 choose_nestorian_desc:0 "[GetFaithByKey('nestorian').GetNameNoTooltip]"
 choose_nestorian_tooltip:0 "[GetReligionByKey('buddhism_religion').GetName]能在严酷的[GetGeographicalRegion('world_tibet').GetName]山区传播，那[GetFaithByKey('nestorian').GetName]为何不能呢？[GetFaithByKey('nestorian').GetNameNoTooltip]已经传播到许多周边地区，他们那救赎和神的教义对某些人很有吸引力。也许这才是正道，甚至还可以帮助我们找到同样相信基督的盟友。"
 choose_RICE_maturidi_name:0 "[GetRiteByKey('hanafi').GetName]"
 choose_RICE_maturidi_desc:0 "[GetRiteByKey('hanafi').GetNameNoTooltip]"
 choose_RICE_maturidi_tooltip:0 "[GetGeographicalRegion('world_middle_east_persia').GetName]地区的商人和旅行者偶尔会来到我们的土地上进行贸易，其中一些人信奉[GetReligionByKey('islam_religion').GetName]。尽管他们对真主的信仰与我们的传统信仰不同，但他们对正义和向善奉献的理念令人钦佩，采纳其中的教义可能更为正道，同时我们能够与西方邻国建立联系。"
 choose_khurmazta_name:0 "[GetFaithByKey('khurmazta').GetName]"
 choose_khurmazta_desc:0 "[GetFaithByKey('khurmazta').GetNameNoTooltip]"
 choose_khurmazta_tooltip:0 "[GetGeographicalRegion('world_middle_east_persia').GetName]地区的商人和旅行者偶尔会来到我们的土地上进行贸易，其中一些人信奉[GetReligionByKey('zoroastrianism_religion').GetName]的教义。我们的信仰与他们的信仰有一些相似之处，在伊朗东部地区一些零星教派也认为存在着需要敬畏的神灵，这与我们的信仰并无二致。或许采纳其中的教义可能更为正道，同时我们能够与西方邻国建立联系，又能尊重我们的古老方式。"
 RICE_zhangzhung_title_decision:0 "再兴象雄"
 RICE_zhangzhung_title_decision_tooltip:0 "喜马拉雅山将见证我们再次崛起！"
 RICE_zhangzhung_title_decision_desc:0 "很久以前，[GetTitleByKey('e_zhangzhung').GetNameNoTier]是喜马拉雅高原上最强大的王国，但狡猾的雅砻家族无耻地毁灭了它，然而，我们的先辈留下的遗产仍在当地中流传。我们能复兴这个古老的王国，化传说为现实？"
 RICE_zhangzhung_title_decision_confirm:0 "象雄国必将再兴！"
 RICE_zhangzhung_title_decision_effect_tooltip_1:0 "[GetTitleByKey('e_zhangzhung').GetNameNoTier]持有者可以采用#bold $RICE_zhangzhung_rebuild_the_silver_castle$#![decision|E]"
 RICE_zhangzhung_title_decision_context_tooltip:0 "#emphasis 历史背景：#!象雄古国至少在4000年前即形成，在7世纪前达到鼎盛，直到被吐蕃帝国征服。象雄没有纸面历史记载，因此大部分资料是从考古遗址和他们消亡数百年后得出。西藏本土宗教苯教认为象雄曾经是一个强大的王国，是他们宗教的源头。不过学界对此的看法分歧很大，一些人认为象雄国只是一群部落；另一些人认为象雄确实存在，但可能更像是一个联邦。无论如何，象雄文化被同化到了现代藏族中，并在吐蕃地区留下了持久的影响。"
 RICE_zhangzhung_rebuild_the_silver_castle:0 "重建银城"
 RICE_zhangzhung_rebuild_the_silver_castle_tooltip:0 "不单象雄国要复兴，它的古都——银城也应重生！"
 RICE_zhangzhung_rebuild_the_silver_castle_desc:0 "[GetTitleByKey('e_zhangzhung').GetNameNoTier]古国有一个传奇的首都，名为#italic 琼隆银城#!。现在我们复兴了[GetTitleByKey('e_zhangzhung').GetNameNoTierNoTooltip]，我们应该找到合适地方，建立一个新的#italic 琼隆银城#!作为喜马拉雅山脉的政治、文化和经济中心。"
 RICE_zhangzhung_rebuild_the_silver_castle_effect_tooltip_1:0 "[county_modifier|E]一旦出现就无法移除！"
 RICE_zhangzhung_rebuild_the_silver_castle_confirm:0 "准备祭品！"
 RICE_zhangzhung_rebuild_the_silver_castle_context_tooltip:0 "#emphasis 历史背景：#!据传说，象雄国首都位于琼隆银城，而喜马拉雅山西部高原上有许多可追溯到象雄国时期的古代防御工事遗址，根据这些考古遗址，现代学者提出了几个不同的地点，从而假设这样一个地方确实存在。"
 RICE_zhangzhung_supplicate_ancient_pillars:0 "向金刚时轮柱祈祷"
 RICE_zhangzhung_supplicate_ancient_pillars_tooltip:0 "[GetGeographicalRegion('RICE_upper_tibet').GetName]上遍布神秘的金刚时轮柱，据说蕴含伟力。"
 RICE_zhangzhung_supplicate_ancient_pillars_desc:0 "神秘而古老的金刚时轮柱遍布[GetGeographicalRegion('RICE_upper_tibet').GetName]，甚至会位于远离文明的荒凉地区。通常，人们因惧怕其伟力而避开它们，然而，我们有时会祈求与之相关的[GetPlayer.Custom('RICE_tibet_deities_type')]，以获得祂们的青睐和庇护。"
 RICE_zhangzhung_supplicate_ancient_pillars_effect_tooltip_1:0 "你将根据[traits|E]和[piety_level|E]获得#P 正面#!或#N 负面#!的[character_modifiers|E]从而加减[skills|E]以及其他修正"
 RICE_zhangzhung_supplicate_ancient_pillars_confirm:0 "准备好酥油和香！"
 RICE_zhangzhung_supplicate_ancient_pillars_context_tooltip:0 "#emphasis 历史背景：#!在 [GetGeographicalRegion('RICE_upper_tibet').GetName] 中，金刚时轮柱是佛教进驻以前，最引人注目的一部分。它们可能是为了宗教或政治目的而建造的，但在公元7或8世纪左右吐蕃征服象雄之后，它们就不再出现。当地有各种各样的传说来解释它们存在的原因，比如人们相信它们在史前时代就神奇地出现了；或者是由昔日统治者建造；或者是作为墓碑来供人崇拜。而且人们相信这些石柱被神灵赋予了特殊的力量，所以人们一般会避开它们，除非有人打算向神灵祈祷。\n\n牛奶注：金刚时轮柱（原文：sridpa chak‑pai​ doring，根据藏文意译）出自弗吉尼亚大学西藏研究中心和瑞士伯尔尼大学高级研究员，约翰·文森特·贝勒扎，于2014年所所著的《西藏黎明：世界屋脊上的古代文明》一书，但出处过于孤立，并没有找到更多学术资料对应。"
 RICE_zhangzhung_western_tibet_salt_decision:0 "资助喜马拉雅寻盐"
 RICE_zhangzhung_western_tibet_salt_decision_tooltip:0 "在[GetGeographicalRegion('RICE_western_northern_tibet').GetName]采盐是一项困难且暴利的项目。"
 RICE_zhangzhung_western_tibet_salt_decision_desc:0 "[Glossary( '卓巴人', 'DROKPA_GLOSS' )]有时会前往[GetGeographicalRegion('RICE_western_northern_tibet').GetName]采盐，因为他们熟悉这片恶劣的地形，也知晓在这神圣的地方采盐所需的仪式。而我也可以资助一次采盐探险，从而分的一杯羹。"
 RICE_zhangzhung_western_tibet_salt_decision_effect_tooltip_1:1 "你有#V [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_success_chance')|0]%#!的成功几率，这受你的[traits|E]和[skills|E]影响，特别是[stewardship|E]，而且你的[piety_i|E][piety_level|E]也会有所影响。"
 RICE_zhangzhung_western_tibet_salt_decision_effect_tooltip_2:1 "在采盐开始时，你可以额外花费[piety_i|E][piety|E]来增加成功概率。"
 RICE_zhangzhung_western_tibet_salt_decision_effect_tooltip_3:1 "如果成功，你将获得[prestige_i|E|E][prestige|E]（#bold 最多#!获得#V [prestige_i|E][GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_max_prestige_display_value')|0]#!）和[gold_i|E][gold|E]（#bold 最多#!获得#V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_max_gold_display_value')|0]#!）"
 RICE_zhangzhung_western_tibet_salt_decision_effect_tooltip_4:1 "因为[THIS.Char.GetCulture.GetName][culture|E]有$tradition_RICE_changthang_nomads_name$[tradition|E]，所以采盐成功几率增加了#P 25%#!"
 RICE_zhangzhung_western_tibet_salt_decision_confirm:0 "招募对此感兴趣的#italic 卓巴人#!！"
 RICE_zhangzhung_western_tibet_salt_decision_context_tooltip:0 "#emphasis 历史背景：#!几个世纪以来，吐蕃人一直在羌塘高原各种湖泊盐池中采盐。而[Glossary( '卓巴人', 'DROKPA_GLOSS' )]习惯于此间恶劣的气候，因此经常参与这些工作，与此同时，这些采盐还带有宗教色彩，因为人们通常认为发现盐的地方是各种神灵或觉者家园。因此采盐过程视为仪式，里面包括祈祷、仪式行为，以及神秘的“盐语”。"
 RICE_zhangzhung_zuthulpuk_monastery_decision:0 "神迹洞供奉"
 RICE_zhangzhung_zuthulpuk_monastery_decision_tooltip:0 "据说密勒日巴在冈仁波齐峰附近奇迹般地建造了一座寺庙，我们能用它做些什么吗？"
 RICE_zhangzhung_zuthulpuk_monastery_decision_desc:0 "冈仁波齐峰是多个[religions|E]圣地，其中包括[GetReligionByKey('buddhism_religion').GetName]。[GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip]瑜伽士#bold 密勒日巴#!在一场斗法中击败了传统[GetReligionByKey('bon_religion').GetAdjective]修行者时，让这座圣山重新引起了人们的兴趣。他的奇迹之一是在那里建造了一座神迹洞寺庙，也许我们可以把它变成一个合适的建筑。"
 RICE_zhangzhung_zuthulpuk_monastery_decision_effect_tooltip_1:0 "如果你是[GetReligionByKey('buddhism_religion').GetAdjective][faith|E]且有[GetDoctrineType('rice_vajrayana_canon_doctrine').GetBaseName][doctrine|E]，将获得额外的[piety_i|E][piety|E]"
 RICE_zhangzhung_zuthulpuk_monastery_decision_effect_tooltip_2:0 "如果你的[culture|E]属于$heritage_tibetan_name$[heritage|E]则获得[prestige_i|E][prestige|E]"
 RICE_zhangzhung_zuthulpuk_monastery_decision_confirm:0 "密勒日巴尊者，让我等凡夫皈依佛法！"
 RICE_zhangzhung_zuthulpuk_monastery_decision_context_tooltip:0 "#emphasis 历史背景：#!神迹洞位于冈仁波齐峰附近的一个洞穴旁，冈仁波齐峰是佛教、苯教、印度教和耆那教共同圣地之一，据说吐蕃瑜伽士密勒日巴曾在此地与苯教大师那罗本琼斗法，而后密勒日巴在这里建出神迹洞，作为他所创造的一个奇迹。"
 RICE_zhangzhung_patronize_tertons:0 "赞助伏藏师"
 RICE_zhangzhung_patronize_tertons_tooltip:0 "增加在领地上[RICE_tertons|E]出现或发现[RICE_termas|E]的概率"
 RICE_zhangzhung_patronize_tertons_desc:0 "有很多[Glossary( '伏藏师', 'TERTON_GLOSS' )]正在努力寻找[ROOT.Char.GetFaith.GetAdjective][Glossary( '伏藏', 'TERMA_GLOSS' )]，我应该在经济、物质和政治上支持那些真诚寻求真理之人。"
 RICE_zhangzhung_patronize_tertons_effect_tooltip_1:0 "只要[GetModifier('RICE_zhangzhung_patronizing_tertons').GetNameWithTooltip][character_modifier|E]存在：\n$EFFECT_LIST_BULLET$你[court|E]内的[RICE_tertons|E]每年会有更高的概率发现[RICE_termas|E]\n$EFFECT_LIST_BULLET$你的某个[courtiers|E]有更大概率获得[GetModifier('RICE_terton_candidate').GetNameWithTooltip][character_modifier|E]\n$EFFECT_LIST_BULLET$在年初，你有#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_chance')|0]%#!概率从小[RICE_termas|E]中获得介于[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_min_piety')|0]#!至[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_max_piety')|0]#!的[piety_i|E][piety|E]和介于[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_min_prestige')|0]#!至[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_max_prestige')|0]#!的[prestige_i|E][prestige|E]，\n$EFFECT_LIST_BULLET$获得的加成以及概率受到[piety_level|E]和[traits|E]的影响"
 RICE_zhangzhung_patronize_tertons_confirm:0 "他们行径是无价的！"
 RICE_zhangzhung_patronize_tertons_context_tooltip:0 "#emphasis 历史背景：#!$TERTON_GLOSS$"
 RICE_zhangzhung_search_for_termas:0 "寻找伏藏"
 RICE_zhangzhung_search_for_termas_tooltip:0 "寻找[RICE_termas|E]位置的线索。"
 RICE_zhangzhung_search_for_termas_desc:0 "我坚信得到吉兆，让我知道[ROOT.Char.GetFaith.GetAdjective][Glossary( '伏藏', 'TERMA_GLOSS' )]藏在哪里，我应该集中精力，从幻象中辨别是否属实，以及指向何处。"
 RICE_zhangzhung_search_for_termas_effect_tooltip_1:0 "只要[GetModifier('RICE_zhangzhung_searching_for_termas').GetNameWithTooltip][character_modifier|E]存在：\n$EFFECT_LIST_BULLET$你每年都有概率发现[RICE_termas|E]\n$EFFECT_LIST_BULLET$在年初，你有#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_self_chance')|0]%#!概率从小[RICE_termas|E]中获得介于[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_min_piety')|0]#!至[piety_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_max_piety')|0]#!的[piety_i|E][piety|E]和介于[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_min_prestige')|0]#!至[prestige_i|E]#V [GetPlayer.MakeScope.ScriptValue('RICE_yearly_minor_terma_max_prestige')|0]#!的[prestige_i|E][prestige|E]，\n$EFFECT_LIST_BULLET$获得的加成以及概率受到[piety_level|E]和[traits|E]的影响"
 RICE_zhangzhung_search_for_termas_confirm:0 "愿能帮助所有众生！"
 RICE_zhangzhung_search_for_termas_context_tooltip:0 "#emphasis 历史背景：#!$TERTON_GLOSS$"
