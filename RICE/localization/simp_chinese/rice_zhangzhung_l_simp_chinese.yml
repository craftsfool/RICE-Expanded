 RICE_zhangzhung_kinnaur_flower_festival_collector_returns_log:0 "[CHARACTER.GetShortUIName|U]和其他寻花人一起带着许多山间野花回来了。"
 RICE_zhangzhung_kinnaur_flower_festival_collector_sacrifice_log_title:0 "祭祀表演"
 RICE_zhangzhung_kinnaur_flower_festival_collector_sacrifice_log:0 "人们在当地神灵面前举行祭祀。"
