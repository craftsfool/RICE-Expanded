 RICE_festival_losar_gift_small:0 "小份"
 RICE_festival_losar_gift_small_desc:0 "$EFFECT_LIST_BULLET$[capital|E]获得[GetModifier('RICE_losar_small_gift_modifier').GetNameWithTooltip][county_modifier|E]\n$EFFECT_LIST_BULLET$获得额外的[prestige_i|E]#V [EmptyScope.ScriptValue('miniscule_prestige_gain')]#![prestige|E]\n\n#weak 洛萨节期间，给平民送上一份小礼物即可。#!"
