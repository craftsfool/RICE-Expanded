 zhangzhung.0040.t:0 "$zhangzhung.0031.t$"
 zhangzhung.0040.desc.intro.great_terton:0 "有些人尊我为这个时代最著名的[Glossary( '伏藏师', 'TERTON_GLOSS' )]之一，只因我发现了许多[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0040.desc.intro.terton:0 "我过去身为[Glossary( '伏藏师', 'TERTON_GLOSS' )]取得小有名气，发现了一些[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0040.desc.intro.not_terton:0 "不久前，我有过幻象和梦境，预示着我将来可能成为[Glossary( '伏藏师', 'TERTON_GLOSS' )]，并发现[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0040.desc.middle:0 "\n\n如今，我又做了一些不寻常的梦，梦里"
 zhangzhung.0040.desc.buddhism:0 "$zhangzhung.0031.desc.buddhism$"
 zhangzhung.0040.desc.not_buddhism:0 "$zhangzhung.0031.desc.not_buddhism$"
 zhangzhung.0040.desc:0 "并告诉我秘宝的地点。\n\n如果这些梦是真的，它似乎指向[target_province.GetName]某处，先前就有过伏藏。虽然我对此心存疑虑，但我还是想前往那里，看看是否真的有伏藏等待被发现。"
 zhangzhung.0040.a:0 "若我使命如此，我定将寻得！"
 zhangzhung.0040.a.tooltip:0 "你将[travel|E]到[target_province.GetName]寻找[RICE_terma|E]。"
 zhangzhung.0040.b:0 "尽管心存疑虑，但我还有更要紧的事。"
 zhangzhung.0041.t:0 "$zhangzhung.0033.t$"
 zhangzhung.0041.desc.intro:0 "我抵达幻象显现的地方，并成功找到[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0041.desc.intro.failure:0 "我最终抵达[location.GetName]，正如梦见那样，然而一定出了问题，我现在找不到[Glossary( '伏藏', 'TERMA_GLOSS' )]。"
 zhangzhung.0041.desc.middle.failure:0 "\n\n无论我做什么，都没有任何东西显现，也没有更多的幻象，到底发生了什么？是我灵性不足，因缘不够？还是没有进行正确的仪式和祈祷？还是惹恼守护伏藏的护法神灵不满？亦或邪魔妖法惑乱人心？"
 zhangzhung.0041.desc.middle:0 "[terton.Custom('RICE_random_terton_occurence_time')]我[terton.Custom('RICE_random_terton_occurence')]是个吉兆！\n\n"
 zhangzhung.0041.a:0 "$zhangzhung.0033.a$"
 zhangzhung.0041.b:0 "$zhangzhung.0033.c$"
 zhangzhung.0041.c:0 "令人失望……"
