 dinka_pagan_desc:0 "世界由伟大的天空之神、至关重要的雨水之主尼亚拉克创造并掌控。祂创造了母神阿布克与笞魔加朗，以及众多次级神灵。尼亚拉克的信徒定期向祂献祭动物，祈求赐福、生育或消除禁忌。与尼亚拉克同在天上的还有祖灵雅克，它们遍布我们周围；另有自由之灵雅克，它们如同加朗般既能带来好运，亦会施加折磨。"
