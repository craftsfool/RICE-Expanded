 building_type_RICE_red_sea_walled_city_of_shibam_desc:0 "The mudbrick towers of Shibam rise into the sky, attaining an impressive height. The buildings have to be constantly maintained with new, fresh layers of mud, but are otherwise an excellent defensive structure for its inhabitants."
