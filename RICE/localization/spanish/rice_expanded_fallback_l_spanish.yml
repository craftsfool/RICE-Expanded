 culture_parameter_rice_better_meeting_houses:0 "The [decision|E] to #V $RICE_oceania_meeting_houses_decision_palauan$#! gives better outcomes without needing to pay extra [gold_i|E] [gold|E], and instead offer different options for supporting male or female [Glossary( 'ranked clubs', 'CHELDEBECHEL_GLOSS' )]"
