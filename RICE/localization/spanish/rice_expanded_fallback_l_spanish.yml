 dharmaguptaka:0 "Dharmaguptaka"
 dharmaguptaka_adherent:0 "Dharmaguptakan"
 dharmaguptaka_adherent_plural:0 "Dharmaguptakans"
 dharmaguptaka_adj:0 "Dharmaguptaka"
 dharmaguptaka_desc:0 "The Dharmaguptaka sect traces its heritage to the legendary Dharmagupta, a fervent follower of Buddha's disciple Maudgalyayana. They are based in Gandhara, but have had an impact across Central Asia and beyond. Their teachings include the belief that the Four Noble Truths are to be observed simultaneously, and that the path of a sravaka and of a Boddhisattva are separate."
 e_zhangzhung:0 "Zhangzhung"
 egyptian_pagan:0 "Kemetism"
 egyptian_pagan_adherent:0 "Kemite"
 egyptian_pagan_adherent_plural:0 "Kemites"
 egyptian_pagan_adj:0 "Kemetic"
 egyptian_pagan_desc:0 "The religion of the Pharaohs stretches back thousands of years. An innumerable group of deities are present in the world and daily life, which they control without question. Ritual prayers, offerings, celebrations, and construction of elaborate temples and monuments are needed to gain their favor and maintain Ma'at, the cosmic order."
 egyptian_pagan_old:0 "Old Kemetism"
 egyptian_pagan_old_adherent:0 "Old Kemite"
 egyptian_pagan_old_adherent_plural:0 "Old Kemites"
 egyptian_pagan_old_adj:0 "Old Kemetic"
 galicia.0001.desc.christian:0 "Greatest of these legends are those related to Saint James, his disciples, and the once pagan Queen Lupa.\n\nRegardless, I turn to face the direction of the mountain, and I begin my prayers to Saint James by reciting:"
 galicia.0001.desc.conclusion:0 "\n\n#EMP “Pico Sacro, Pico Sacro, cure me of this sickness that I bear!”#!"
 galicia.0001.desc.other:0 "Its spiritual qualities are unquestionable.\n\nRegardless, I turn to face the direction of the mountain, and I begin my prayers to [ROOT.Char.GetFaith.HighGodName] by reciting:"
 galicia.0002.desc.christian:0 "Among [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], there are many stories connecting the mountain to Saint James the Apostle and Queen Lupa, for instance."
 galicia.0002.desc.conclusion:0 "This chapel will undoubtedly tie these stories to more orthodox forms of [ROOT.Char.GetFaith.GetAdjective] worship.\n\nIn doing so, the “superstitions” surrounding Pico Sacro will become even more acceptable to devotees of various [GetReligionFamily('rf_abrahamic').GetName] religions."
 galicia.0002.desc.non_christian:0 "Even [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] living there have several legends about why the mountain is sacred."
 galicia.0017.desc.christian:0 "\n\nThe springs are also located on the #italic Camino Sanabrés#! route of the Way of St James, so it is a popular resting place for pilgrims. Perhaps seeing some will inspire me...."
 galicia.0018.desc.christian:0 "\n\nI do, of course, notice the number of [GetReligionByKey('christianity_religion').GetAdjective] pilgrims using the thermal springs as well. Most are likely traveling the Way of Saint James, and their presence is an inspiration to the devout."
 game_concept_yazata_desc:0 "The Yazatas are those who are worthy of worship or veneration in $zoroastrianism_religion$. To some, they are distinct deities; to others, they are emanations of the supreme god.\n\n$zoroastrianism_religion_adj$ [faiths|E] can have different [doctrines|E] representing the set of Yazatas that have been important to them due to reasons of history, culture, geography, and contact with nearby belief systems.\n\nExcept for those whose [faith|E] has the $rice_zoroastrian_no_yazatas_doctrine_name$ [doctrine|E], all $zoroastrianism_religion_adj$ [rulers|E] have access to a [decision|E] to $RICE_khwarezm_worship_yazata$, which gives you a temporary [character_modifier|E] with benefits based on which Yazata you choose. The available Yazatas depends on your Yazata [doctrine|E].\n\nCertain Yazata [doctrines|E] even grant you access to a [decision|E] to Establish a [zoroastrian_cult_center|E], which provide further benefits for worshipping Yazatas."
 granada.0006.a.julius_caesar:0 "You are inspired by Julius Caesar"
 granada.0006.a.normal:0 "You relax normally"
 holy_site_cagliari_effect_name:0 "From [holy_site|E] #weak ($holy_site_cagliari_name$)#!"
 holy_site_cagliari_name:0 "Caralis"
 innovation_RICE_placeholder_01:0 "Atarazanas"
 innovation_RICE_placeholder_01_desc:0 "Shipyards are found around the world wherever there is water, but due to Iberia's unique strategic location and political struggle, rulers have found ways to support the growth of the shipwright industry in the peninsula's own shipyards, or [Glossary( 'atarazanas', 'ATARAZANA_GLOSS' )], for economic and military reasons."
 karen_pagan:0 "K'larism"
 karen_pagan_adherent:0 "K'larist"
 karen_pagan_adherent_plural:0 "K'larists"
 karen_pagan_adj:0 "K'larist"
 karen_pagan_desc:0 "The traditional beliefs of the Karen peoples revolves around maintaining balance with the spirits of the world, and each person, when alive, is embodied by thirty-seven of these spirits, known as the K'lar."
 karen_pagan_old:0 "Old K'larism"
 karen_pagan_old_adherent:0 "Old K'larist"
 karen_pagan_old_adherent_plural:0 "Old K'larists"
 karen_pagan_old_adj:0 "Old K'larist"
 karen_pagan_old_desc:0 "$karen_pagan_desc$"
 kushitism_pagan_desc:0 "Though connected to the ancient polythestic cults of Egypt and Meroe, the Northeast Sudanic peoples like the Nubians have rejected the Meroitic priestly traditions in favor of their own forms of worship, influenced somewhat by the Abrahamic religions to the north."
