l_french:
 CAUC_derbent_guards_decision:0 "Recruter une garde rus’ à $c_derbent$"
 CAUC_derbent_guards_decision_desc:0 "Une troupe rus’ propose ses services à la porte. Son capitaine promet sa fidélité, mais les prédicateurs de la ville s’opposent à ce que des hommes d’une autre religion gardent ma maisonnée. J’entendrai les deux parties avant de fixer la place de ces gardes."
 CAUC_derbent_guards_decision_tooltip:0 "Rencontrer un capitaine rus’ slave et recruter 500 soldats. Un poste libre permet d’en faire un excellent garde du corps ; sinon, seule la compagnie est engagée."
 CAUC_derbent_guards_decision_context:0 "En 989–990, le prédicateur Musa al-Tusi exigea que Maymun de Derbent livre ses gardes rus’ pour qu’ils se convertissent ou soient mis à mort. Maymun refusa ; un siège et son départ suivirent. Ce récit adapte le différend sans recréer ses protagonistes."
 CAUC_derbent_guards_decision_confirm:0 "Réunir les parties"
 CAUC.0100.t:0 "Un serment à la porte"
 CAUC.0100.desc:0 "[CAUC_rus_speaker.GetFirstName] dépose à mes pieds un bouclier balafré. Cinq cents Rus ont suivi ce capitaine par les routes de la Caspienne. Il jure encore par les dieux slaves : « Votre or nourrira mes hommes ; ma lance gardera votre porte. » Je peux le prendre dans ma maisonnée, ou engager sa compagnie sans lui confier ma chambre."
 CAUC.0100.a:0 "Vous serez mon garde du corps ; vos hommes rejoindront mon armée."
 CAUC.0101.t:0 "L’exigence du prédicateur"
 CAUC.0101.desc:0 "Un prédicateur rassemble la foule devant les casernes. « Un infidèle sera-t-il plus proche de notre souverain que nous ? » [CAUC_rus_speaker.GetFirstName] refuse de renier sa foi sous la menace de l’épée. Ses soldats sont engagés ; le différend porte désormais sur son serment et son accès à ma maisonnée."
 CAUC.0101.a:0 "Je répondrai de son serment."
 CAUC.0101.b:0 "Qu’il écoute librement nos maîtres, sans conversion forcée."
 CAUC.0101.c:0 "La compagnie garde son contrat ; son capitaine n’aura aucun privilège religieux."
 CAUC.0102.t:0 "La réponse de la ville"
 CAUC.0102.desc:0 "Les postes de garde sont établis, mais le capitaine attend une réponse publique. Ses hommes se souviendront de ma présence lorsque la foule criait. Les accueillir coûte des provisions ; un ordre sec ne coûte rien et promet peu."
 CAUC.0102.a:0 "Partagez ma table ; ma parole ne laissera aucun doute."
 CAUC.0102.b:0 "Votre compagnie a ses ordres."
 CAUC_rus_protected:0 "Troupe rus’ protégée"
 CAUC_rus_protected_desc:0 "Le dirigeant protège les gardes étrangers malgré les objections religieuses locales."
 CAUC_rus_instructed:0 "Instruction de la troupe"
 CAUC_rus_instructed_desc:0 "Une instruction religieuse et de nouvelles conditions de service retiennent une partie de la troupe étrangère."
 CAUC_rus_dismissed:0 "Privilèges rus’ limités"
 CAUC_rus_dismissed_desc:0 "La compagnie conserve son contrat militaire, sans garantie de privilèges religieux distincts pour son capitaine."
 CAUC_lori_council_decision:0 "Entendre les Églises de $c_lori$"
 CAUC_lori_council_decision_desc:0 "Les monastères ne s’accordent pas sur les propositions de rapprochement avec les Églises voisines. Certains craignent d’y perdre leur liturgie et l’autorité sur leurs maisons. Je peux accueillir une discussion et décider des garanties ou du soutien à offrir."
 CAUC_lori_council_decision_tooltip:0 "Choisir entre l’autonomie monastique, le dialogue ecclésiastique et des garanties pour les deux parties. Une discussion en trois étapes aboutit à une politique de cinq ans."
 CAUC_lori_council_decision_context:0 "Lors des négociations d’union arméno-byzantines des années 1170, les responsables de Sanahin et de Haghpat s’opposèrent aux concessions et n’assistèrent pas au concile de Hromkla, daté de 1178 ou 1179. Ce différend local est une adaptation fictive, non le concile lui-même."
 CAUC_lori_council_decision_confirm:0 "Réunir les parties"
 CAUC.0110.t:0 "Les conditions des abbés"
 CAUC.0110.desc:0 "[CAUC_abbot_speaker.GetFirstName] repousse l’accord sur ma table. À ses côtés, [CAUC_envoy_speaker.GetFirstName] ouvre un manuscrit grec. L’abbé refuse qu’un traducteur négocie les prières de sa communauté. L’envoyé demande qui lira les passages contestés avec lui."
 CAUC.0110.a:0 "Abbé, restez ici défendre les prières de votre communauté."
 CAUC.0110.b:0 "L’envoyé apprendra à mes savants à lire l’original."
 CAUC.0110.c:0 "Les deux seront entendus ; je financerai une traduction indépendante."
 CAUC.0111.t:0 "Des mots dans la marge"
 CAUC.0111.desc:0 "Le second manuscrit arrive avec une note furieuse : le mot traduit par « accord » peut aussi signifier soumission. [CAUC_abbot_speaker.GetFirstName] me demande de lire le passage à voix haute. [CAUC_envoy_speaker.GetFirstName] propose de m’instruire ; retirer le texte éviterait aux deux une signature humiliante."
 CAUC.0111.a:0 "Apprenez-moi ces mots avant que j’y appose mon sceau."
 CAUC.0111.b:0 "Retirez cette formulation ; nul ne signera sous la contrainte."
 CAUC.0112.t:0 "Le compte rendu de la discussion"
 CAUC.0112.desc:0 "Les deux parties conservent leurs Églises, mais leurs arguments remplissent un nouveau volume. [CAUC_abbot_speaker.GetFirstName] l’apporte enveloppé de lin. Je peux l’accueillir dans ma bibliothèque ou donner à ses auteurs une place durable parmi mes savants."
 CAUC.0112.a:0 "Reliez la dispute pour ma bibliothèque."
 CAUC.0112.b:0 "L’abbé restera comme mon maître."
 CAUC_lori_autonomy:0 "Autonomie monastique"
 CAUC_lori_autonomy_desc:0 "Les monastères locaux conservent l’autorité sur leur liturgie et leurs maisons."
 CAUC_lori_rapprochement:0 "Dialogue ecclésiastique"
 CAUC_lori_rapprochement_desc:0 "Les traductions et les discussions favorisent les études, mais les opposants locaux se méfient des propositions."
 CAUC_lori_guarantees:0 "Rites locaux garantis"
 CAUC_lori_guarantees_desc:0 "Un accord financé protège les usages locaux tout en permettant le dialogue."
 CAUC_ani_sanctuary_decision:0 "Régler l’usage de la cathédrale d’Ani"
 CAUC_ani_sanctuary_decision_desc:0 "La cathédrale a changé de mains et sa communauté actuelle redoute un nouveau changement. Les requérants apportent des actes, des souvenirs et des droits issus de la conquête. Je peux fixer l’usage du bâtiment et décider de la protection accordée à la communauté déplacée."
 CAUC_ani_sanctuary_decision_tooltip:0 "Consigner l’usage du sanctuaire, régler les revendications et protéger un autre lieu de culte. La foi du comté restera inchangée."
 CAUC_ani_sanctuary_decision_context:0 "La cathédrale d’Ani fut transformée en mosquée après la conquête de 1064, puis rendue au culte chrétien en 1124. Son usage initial suit ces dates ; les choix ultérieurs restent enregistrés dans cette partie. Les requêtes et le règlement sont fictifs."
 CAUC_ani_sanctuary_decision_confirm:0 "Réunir les parties"
 CAUC_ani_church_use:0 "La cathédrale est enregistrée comme église."
 CAUC_ani_mosque_use:0 "La cathédrale est enregistrée comme mosquée."
 CAUC.0120.t:0 "Un bâtiment, deux revendications"
 CAUC.0120.desc:0 "[CAUC_warden_speaker.GetFirstName] dépose les clefs de la cathédrale auprès d’un acte de consécration usé. [CAUC_imam_speaker.GetFirstName] présente le titre accordé à la mosquée. Leurs fidèles attendent dehors. Les perdants auront besoin d’un lieu de prière ; les deux hommes exigent un jugement qu’ils pourront annoncer dans la rue."
 CAUC.0120.a:0 "Rendez les clefs au gardien chrétien."
 CAUC.0120.b:0 "Confirmez le titre et la dotation de la mosquée."
 CAUC.0120.c:0 "La communauté actuelle garde les clefs ; nul ne chassera l’autre."
 CAUC.0121.t:0 "Les clefs et les actes"
 CAUC.0121.desc:0 "Le jugement divise la rue. [CAUC_warden_speaker.GetFirstName] et [CAUC_imam_speaker.GetFirstName] demandent qui protégera le chemin des fidèles. Je peux les recevoir à ma cour pour négocier ou poster une garde pendant que leurs communautés trouvent des salles séparées."
 CAUC.0121.a:0 "Les deux représentants négocieront sous mon toit."
 CAUC.0121.b:0 "Payez une garde pour protéger les fidèles."
 CAUC.0122.t:0 "Un lieu pour prier"
 CAUC.0122.desc:0 "Les clefs ont trouvé leur gardien. L’autre communauté a dégagé une salle dont le toit fuit. [CAUC_warden_speaker.GetFirstName] et [CAUC_imam_speaker.GetFirstName] reviennent ensemble, l’un avec son titre, l’autre avec une liste de bois. Mon jugement peut laisser un lieu de prière utilisable, ou seulement une porte close."
 CAUC.0122.a:0 "Réparez le toit de la communauté déplacée."
 CAUC.0122.b:0 "Que les deux gardiens administrent ensemble ces garanties."
 CAUC_ani_church_restored:0 "Cathédrale restaurée"
 CAUC_ani_church_restored_desc:0 "La cathédrale a été rendue au culte chrétien malgré les revendications concurrentes."
 CAUC_ani_mosque_endowed:0 "Mosquée dotée"
 CAUC_ani_mosque_endowed_desc:0 "Une dotation soutient la mosquée malgré les revendications concurrentes sur le bâtiment."
 CAUC_ani_existing_use:0 "Lieux de culte protégés"
 CAUC_ani_existing_use_desc:0 "Le sanctuaire conserve son usage actuel et les autres communautés bénéficient d’une protection."
 CAUC_alan_mission_decision:0 "Recevoir des missionnaires en Alanie"
 CAUC_alan_mission_decision_desc:0 "Des envoyés chrétiens demandent des terres et un passage sûr. Les anciens craignent pour les sanctuaires où leurs familles se réunissent depuis longtemps. J’entendrai les envoyés et déciderai de soutenir leur mission, de la limiter ou de leur ordonner de partir."
 CAUC_alan_mission_decision_tooltip:0 "Rencontrer un missionnaire orthodoxe et un ancien alain ; engager un maître ou des cavaliers, régler leur frontière et décider d’un baptême personnel."
 CAUC_alan_mission_decision_context:0 "Al-Masudi rapporte l’expulsion de clercs chrétiens d’Alanie en 932. L’ampleur de ce recul reste incertaine et la conversion fut progressive. Ce récit évoque les sanctuaires locaux sans projeter les noms divins de l’Ossétie moderne dans le IXe siècle."
 CAUC_alan_mission_decision_confirm:0 "Réunir les parties"
 CAUC.0130.t:0 "La demande de la mission"
 CAUC.0130.desc:0 "[CAUC_missionary_speaker.GetFirstName] ouvre un évangile devant les anciens. [CAUC_elder_speaker.GetFirstName] l’arrête avant qu’il ne choisisse l’emplacement de son église : « Ce sol porte les serments de nos familles. » Le missionnaire propose un maître pour ma maisonnée ; l’ancien offre des cavaliers connaissant chaque col du nord."
 CAUC.0130.a:0 "Le missionnaire enseignera à ma cour, sur les terres que je lui accorde."
 CAUC.0130.b:0 "Les deux resteront pour se répondre."
 CAUC.0130.c:0 "Ancien, amenez vos cavaliers. La mission ne recevra aucune terre."
 CAUC.0131.t:0 "Un serment au sanctuaire"
 CAUC.0131.desc:0 "[CAUC_elder_speaker.GetFirstName] apporte une borne brisée. Quelqu’un l’a déplacée dans la nuit ; les élèves du missionnaire ont été vus près d’elle. [CAUC_missionary_speaker.GetFirstName] nie l’avoir ordonné. Quelques pas de terre peuvent déclencher une vendetta. Je dois exiger réparation ou maintenir ma concession."
 CAUC.0131.a:0 "Rétablissez la borne à mes frais."
 CAUC.0131.b:0 "La mission doit céder le terrain contesté."
 CAUC.0132.t:0 "Ce que les familles retiennent"
 CAUC.0132.desc:0 "La frontière est fixée. [CAUC_missionary_speaker.GetFirstName] attend ma réponse personnelle à son enseignement. [CAUC_elder_speaker.GetFirstName] demeure à la porte, refusant de prier en mon nom. Accepter le baptême sera mon choix, non un décret convertissant toutes les familles d’Alanie."
 CAUC.0132.a:0 "Je recevrai le baptême dans la foi du missionnaire."
 CAUC.0132.b:0 "Restez comme maître ; la foi ne se commande pas."
 CAUC_alan_mission_supported:0 "Mission chrétienne soutenue"
 CAUC_alan_mission_supported_desc:0 "La mission reçoit des terres et une protection, mais les familles locales contestent son influence."
 CAUC_alan_old_rites_protected:0 "Sanctuaires locaux protégés"
 CAUC_alan_old_rites_protected_desc:0 "Les rites locaux restent protégés et les missionnaires peuvent enseigner dans les limites convenues."
 CAUC_alan_mission_dismissed:0 "Missionnaires renvoyés"
 CAUC_alan_mission_dismissed_desc:0 "Le départ de la mission renforce la position des anciens, mais met fin à son soutien."
 CAUC_tondrakian_inquiry_decision:0 "Entendre les prédicateurs tondrakiens"
 CAUC_tondrakian_inquiry_decision_desc:0 "Les villages signalent des assemblées qui rejettent les images saintes et contestent les droits du clergé aux loyers et aux dîmes. Les autorités ecclésiastiques exigent une enquête. J’entendrai les prédicateurs, examinerai les revendications foncières et déciderai de les protéger, de les réprimer ou de les rejoindre."
 CAUC_tondrakian_inquiry_decision_tooltip:0 "Commencer une enquête en cinq étapes sur le rite de Smbat Zarehavantsi. Les dirigeants apostoliques arméniens peuvent le rejoindre pour 500 Piété, avec Apahunik. Les enquêtes ultérieures entendent un disciple vivant si le fondateur est mort."
 CAUC_tondrakian_inquiry_decision_context:0 "Des communautés tondrakiennes sont attestées en Arménie du IXe au XIe siècle. Une grande partie des témoignages vient d’auteurs ecclésiastiques hostiles, dont Grigor Magistros. Les principes $tenet_aniconism_name$, $tenet_communal_possessions_name$ et $tenet_unrelenting_faith_zandik_name$, ainsi que l’égalité des sexes du rite, constituent une interprétation choisie pour cette extension."
 CAUC_tondrakian_inquiry_decision_confirm:0 "Réunir les parties"
 CAUC.0140.t:0 "Une assemblée sans images"
 CAUC.0140.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Les visiteurs décrivent une assemblée sans images saintes. Hommes et femmes prennent la parole à tour de rôle ; aucun prêtre héréditaire ne revendique d’autorité sur eux. Un envoyé de l’Église y voit du désordre et me demande de fermer l’assemblée. Avant de juger, je dois fixer les conditions de l’enquête."
 CAUC.0140.a:0 "Entendre les villageois sous ma protection."
 CAUC.0140.b:0 "Laisser d’abord l’Église présenter ses accusations."
 CAUC.0140.c:0 "Payer des clercs pour consigner les deux récits."
 CAUC.0141.t:0 "Qui a le droit de parler ?"
 CAUC.0141.desc:0 "[CAUC_representative_speaker.GetFirstName] sort du groupe des disciples de Smbat. L’envoyé lui ordonne de se taire, mais elle pose elle-même les comptes sur ma table. « Si je peux faire vivre ces champs, je peux parler pour ceux qui les cultivent. » L’entendre donnera aux assemblées une représentante dans ma maisonnée."
 CAUC.0141.a:0 "Elle parlera devant ma cour."
 CAUC.0141.b:0 "Suivre la procédure de l’Église pour cette audience."
 CAUC.0142.t:0 "Des champs détenus en commun"
 CAUC.0142.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Le récit de l’assemblée se tourne vers la terre. Plusieurs familles cultivent ensemble des champs et demandent que la récolte nourrisse leurs foyers avant qu’un seigneur n’en prélève le loyer. L’Église présente un acte de propriété. Le différend dépasse désormais le culte : il faut décider qui peut percevoir le grain."
 CAUC.0142.a:0 "Faire arpenter les terres avant de percevoir les loyers."
 CAUC.0142.b:0 "Suspendre les loyers contestés jusqu’à mon jugement."
 CAUC.0142.c:0 "Maintenir les perceptions pendant l’enquête."
 CAUC.0143.t:0 "Le jugement du dirigeant"
 CAUC.0143.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. J’ai entendu les accusations et les réponses des villageois. Ils demandent des assemblées sans images, des biens communs et le droit de résister à ceux qui les oppriment. Leurs porte-parole insistent sur l’égalité des hommes et des femmes. Je peux protéger la communauté, appliquer l’interdiction de l’Église ou adopter moi-même leur rite."
 CAUC.0143.a:0 "Protéger leurs assemblées sans adopter le rite."
 CAUC.0143.b:0 "Fermer les assemblées et maintenir l’interdiction."
 CAUC.0143.c:0 "Je me tiendrai à leurs côtés comme tondrakien."
 CAUC.0144.t:0 "Après le jugement"
 CAUC.0144.desc:0 "[CAUC_tondrakian_speaker.GetFullName] parle au nom des assemblées. Mon jugement est parvenu aux villages. La décision sur les assemblées, les loyers et l’autorité religieuse déterminera leurs relations avec mes officiers. Un clerc propose de consigner les conditions et les témoignages afin qu’un prochain différend n’efface pas les promesses."
 CAUC.0144.a:0 "Consigner l’égalité des femmes et des hommes."
 CAUC.0144.b:0 "Consigner le règlement et les témoignages."
 CAUC.0144.c:0 "Mes officiers feront respecter le jugement."
 CAUC_tondrakian_refuge:0 "Assemblées tondrakiennes protégées"
 CAUC_tondrakian_refuge_desc:0 "Le dirigeant protège la communauté, mais ses opposants contestent ses assemblées et ses biens communs."
 CAUC_tondrakian_suppressed:0 "Assemblées tondrakiennes réprimées"
 CAUC_tondrakian_suppressed_desc:0 "Les autorités religieuses saluent l’interdiction, mais son application trouble les villages."
 CAUC_tondrakian_assembly:0 "Assemblée commune tondrakienne"
 CAUC_tondrakian_assembly_desc:0 "Le dirigeant et le comté adoptent le rite tondrakien, soutenant la participation égale et les biens communs."
 CAUC_tondrakian_rite:0 "Rite tondrakien"
 CAUC_tondrakian_rite_adj:0 "tondrakienne"
 CAUC_tondrakian_rite_adherent:0 "tondrakien"
 CAUC_tondrakian_rite_adherent_plural:0 "tondrakiens"
 CAUC_smbat_zarehavantsi_name:0 "Smbat Zarehavantsi"
 CAUC_tondrakian_rite_desc:0 "Un rite apostolique arménien associé aux assemblées de Tondrak. $generic_rite_focus_tenet_aniconism$"
 CAUC_tondrakian_rite_founded_desc:0 "[ROOT.Rite.GetNameNoTooltip] a été fondé par [GetGlobalVariable('CAUC_tondrakian_founder').Char.GetFullName] à [GetGlobalVariable('CAUC_tondrakian_origin').Title.GetNameNoTier] en [GetGlobalVariable('CAUC_tondrakian_founding_year').GetValue|0], au sein de la foi [ROOT.Rite.GetFaith.GetAdjective]. [ROOT.Rite.Custom('GetGenericRiteTenetSentence')]"
 CAUC_rus_event_army:0 "Compagnie rus’"
 CAUC_scholarly_book_modifier:0 "Manuscrit savant"
 CAUC_scholarly_book_modifier_desc:0 "L’œuvre d’un savant du Caucase."
 CAUC_lori_book:0 "La Dispute de Lori"
 CAUC_lori_book_desc:0 "Arguments et traductions des Églises de Lori, conservés aux frais du mécène."
 CAUC_gelati_book:0 "Études de Koutaïssi"
 CAUC_gelati_book_desc:0 "Un volume relié composé par les maîtres des environs de Koutaïssi."
 CAUC_tondrakian_book:0 "Témoignage des assemblées"
 CAUC_tondrakian_book_desc:0 "Le témoignage des disciples de Smbat, dont les femmes entendues à l’audience."
 CAUC.0100.b:0 "J’engage les cinq cents soldats."
 CAUC.0121.c:0 "Leurs anciens maintiendront la paix."
 CAUC.0131.c:0 "Ma concession demeure. Adressez votre plainte à mes officiers."
 CAUC.0132.c:0 "Je chevaucherai avec les anciens et garderai ma foi."
 CAUC_alan_event_army:0 "Cavaliers des cols du nord"
 CAUC.0150.t:0 "Un nouveau rite à Tondrak"
 CAUC.0150.desc:0 "[CAUC_tondrakian_speaker.GetFullName] prêche dans les villages arméniens près de Tondrak. Ses disciples se réunissent sans images, partagent leurs biens et affirment l’égalité des hommes et des femmes devant Dieu. L’Église exige son silence. Son rite porte désormais un nom ; les dirigeants d’Apahunik peuvent entendre ses disciples, les protéger, les emprisonner ou les rejoindre."
 CAUC.0150.b:0 "Je rejoindrai ce rite arménien."
 CAUC.0150.a:0 "La nouvelle de ces assemblées se répandra."
 CAUC.0001.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. Mon contremaître me présente les comptes des réparations de la route et des murailles. Les marchands demandent davantage de place pour leurs caravanes. La garnison réclame des provisions, tandis que les villages voisins souhaitent que je fixe leurs obligations. Mes fonds ne suffiront à soutenir qu’une seule proposition pour les années à venir."
 CAUC.0001.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0002.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Les moines m’apportent la liste de leurs besoins : du parchemin pour les copies, une aide aux élèves et des réparations dans leurs salles de travail. Mon don ne suffira qu’à une seule entreprise. Ils me demandent de choisir avant d’engager les fonds."
 CAUC.0002.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0003.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Les familles ont envoyé des représentants pour discuter des réparations. Certaines peuvent fournir de la main-d’œuvre ; d’autres préfèrent apporter du grain ou des pierres. Mon intendant souhaite une règle commune, mais les représentants me demandent de tenir compte des moyens de chaque famille."
 CAUC.0003.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0004.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Les maîtres demandent des fonds pour acquérir des livres et permettre à leurs élèves de poursuivre leurs études. Un copiste propose aussi un volume qui porterait mon nom comme mécène. Je dois décider quelle part de mon don servira ma réputation."
 CAUC.0004.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0010.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. Mon contremaître a découvert des dégâts sur un mur de soutènement le long de la route de $c_derbent$. Les ouvriers peuvent le réparer dès maintenant, mais il leur faut un paiement supplémentaire. Reporter les travaux épargnerait mon trésor et laisserait les familles voisines faire face aux dégâts."
 CAUC.0010.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0011.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. Une caravane est arrivée à $c_derbent$. Ses marchands se plaignent de l’étroitesse de l’espace réservé à leurs bêtes et proposent de payer pour obtenir plus de place. Mon intendant m’avertit que leur accorder cette faveur gênerait les habitants qui utilisent le même terrain."
 CAUC.0011.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0012.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. L’officier chargé du passage me montre les réserves restantes. Elles suffisent pour la garde actuelle, mais guère pour une affectation plus longue. Je peux acheter des provisions ou réduire la durée du service des hommes."
 CAUC.0012.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0013.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. Deux villages se disputent l’entretien d’un tronçon de route près de $c_derbent$. Chacun affirme que l’autre a davantage profité des réparations de l’an dernier. Leurs représentants m’apportent leurs comptes et me demandent de fixer la répartition du travail."
 CAUC.0013.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0014.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. Mes officiers m’annoncent qu’un petit groupe de visiteurs souhaite emprunter le passage de $c_derbent$. Munis de lettres de recommandation, ils demandent de l’aide pour trouver une escorte. Je peux confier ces arrangements à ma maisonnée ou les laisser se débrouiller en ville."
 CAUC.0014.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0015.desc:0 "[CAUC_overseer_speaker.GetFirstName] me soumet cette affaire. Des chutes de pierres ont obstrué une partie de la route de $c_derbent$. Les voyageurs peuvent passer, mais les chariots doivent attendre que les ouvriers dégagent la voie. Le contremaître réclame des fonds pour terminer avant l’arrivée de la prochaine caravane."
 CAUC.0015.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0020.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Les copistes de $c_lori$ ont utilisé plus de parchemin que leur don ne permettait d’en acheter. Ils me demandent de financer une nouvelle réserve ou de les autoriser à reporter une partie de leur travail."
 CAUC.0020.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0021.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Un maître de $c_lori$ m’écrit au sujet d’un élève dont la famille ne peut plus financer les études. Il juge cet élève capable et me demande d’en couvrir les frais."
 CAUC.0021.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0022.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Un savant de $c_lori$ m’a envoyé deux lectures d’un passage d’un ouvrage théologique. Les copistes ne s’accordent pas sur celle qui doit figurer dans leur nouveau volume. Le savant m’invite à examiner les arguments."
 CAUC.0022.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0023.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Un copiste propose de mentionner ma maison dans la dédicace d’un nouveau livre. Les autres mécènes ont déjà financé une grande partie du travail. Je peux revendiquer la place d’honneur ou demander au copiste de consigner leurs contributions aux côtés de la mienne."
 CAUC.0023.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0024.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Un toit endommagé a laissé la pluie pénétrer dans une salle de travail à $c_lori$. Les savants ont déplacé les livres, mais il leur faut de l’aide pour réparer la pièce avant d’y reprendre leurs copies."
 CAUC.0024.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0025.desc:0 "[CAUC_scholar_speaker.GetFirstName] me soumet cette affaire. Un savant m’apporte un volume achevé à $c_lori$ et propose de me l’expliquer à ma table. Mes serviteurs me rappellent que d’autres affaires attendent. Je peux les remettre à plus tard et consacrer l’après-midi à la lecture."
 CAUC.0025.d:0 "Commander un manuscrit relié pour ma bibliothèque."
 CAUC.0030.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Les représentants de $c_svaneti$ se disputent pour savoir quelles familles devront fournir des ouvriers aux prochaines réparations. L’une a déjà fourni de la main-d’œuvre à deux reprises ; une autre rappelle qu’elle a livré des pierres au lieu d’envoyer des ouvriers."
 CAUC.0030.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0031.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Un maçon de $c_svaneti$ propose de réparer l’étage supérieur d’une tour. La famille peut fournir les matériaux, mais elle me demande de payer son travail."
 CAUC.0031.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0032.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Le contremaître de $c_svaneti$ veut convoquer des ouvriers pour les réparations. Plusieurs familles lui demandent d’attendre la fin de leur récolte. Je dois choisir entre achever les travaux et leur laisser le temps de travailler leurs champs."
 CAUC.0032.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0033.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Les représentants de $c_svaneti$ se sont réunis pour comparer leurs contributions aux réparations. Ils m’invitent à écouter les comptes et à confirmer les obligations qu’ils proposent pour l’année à venir."
 CAUC.0033.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0034.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Des voyageurs ont demandé refuge à une famille de $c_svaneti$ en attendant une amélioration du temps. La famille n’a guère de réserves et me demande des provisions."
 CAUC.0034.d:0 "Offrir une place à ma cour à ce représentant compétent."
 CAUC.0035.desc:0 "[CAUC_mason_speaker.GetFirstName] me soumet cette affaire. Les hommes qui montent la garde près des tours de $c_svaneti$ demandent des réparations à leur abri et une réserve de grain. Leur porte-parole présente cette demande comme une part de l’entretien que j’ai promis de financer."
 CAUC.0035.d:0 "Offrir une place à ma cour à ce représentant compétent."
