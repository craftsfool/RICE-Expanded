l_simp_chinese:
 CAUC_derbent_guards_decision:0 "在$c_derbent$招募罗斯近卫"
 CAUC_derbent_guards_decision_desc:0 "一队罗斯战士来到城门前，愿意为我效力。队长承诺忠诚，城里的传教士却反对让异教徒守在我身旁。我将听取双方的意见，再决定近卫的地位。"
 CAUC_derbent_guards_decision_tooltip:0 "招募近卫，并通过三阶段事件处理宗教争端。最终政策持续五年。"
 CAUC_derbent_guards_decision_context:0 "989—990年，传教士穆萨·图西要求杰尔宾特的迈蒙交出罗斯近卫，让他们改信，否则处死。迈蒙拒绝，随后遭到围城，并带着近卫离开。本事件改编这一争端，不重现当时的人物。"
 CAUC_derbent_guards_decision_confirm:0 "召集众人"
 CAUC.0100.t:0 "城门前的誓言"
 CAUC.0100.desc:0 "罗斯队长宣誓效忠。他的人将听从我的军官调遣，由我的府库支付军饷。一位传教士问，不与我们同奉一种信仰的人，如何受这一誓言约束。我答应先举行听证，再对近卫提出要求。"
 CAUC.0100.a:0 "记下誓言，召来传教士。"
 CAUC.0101.t:0 "传教士的要求"
 CAUC.0101.desc:0 "传教士要求近卫接受教导，改信我们的宗教。队长回答，他们是来效力的，不是来放弃自身信仰的。城中长老提醒我，争执已经引来围观的人群。我必须决定，以自己的权威保障哪一方的承诺。"
 CAUC.0101.a:0 "他们的效忠值得我的保护。"
 CAUC.0101.b:0 "提供教导，并向愿意接受的人支付军饷。"
 CAUC.0101.c:0 "付清遣散费，让近卫离开。"
 CAUC.0102.t:0 "城里的回应"
 CAUC.0102.desc:0 "长老们带来了有关我决定的请愿。有的赞成明确处置，有的要求我重新考虑。军官们请求拨款，在城里适应新安排的期间保障值守。我可以花钱稳住局面，也可以让他们照现有安排办事。"
 CAUC.0102.a:0 "拨款，并确认处置。"
 CAUC.0102.b:0 "处置照旧，不再增拨款项。"
 CAUC_rus_protected:0 "受保护的罗斯近卫"
 CAUC_rus_protected_desc:0 "统治者不顾当地宗教人士的反对，保护异教近卫。"
 CAUC_rus_instructed:0 "近卫的宗教教导"
 CAUC_rus_instructed_desc:0 "宗教教导与新的效力条件使部分外来近卫留下。"
 CAUC_rus_dismissed:0 "外来近卫遣散"
 CAUC_rus_dismissed_desc:0 "近卫已经离开；当地宗教领袖欢迎这一决定。"
 CAUC_lori_council_decision:0 "听取$c_lori$教会的争论"
 CAUC_lori_council_decision_desc:0 "修道院对与邻近教会加强联系的提议意见不一。有些人担心，和解会使他们失去自身礼仪与修道院的自主权。我可以主持讨论，决定给予何种保障或资助。"
 CAUC_lori_council_decision_tooltip:0 "在修道院自主、教会对话与双方保障之间作出选择。三阶段讨论将形成持续五年的政策。"
 CAUC_lori_council_decision_context:0 "1170年代亚美尼亚与拜占庭商议教会合一时，萨纳欣与哈格帕特的领袖反对妥协，并缺席赫罗姆克拉会议；该会议有1178或1179年两种定年。本地争论是游戏改编，不是会议本身。"
 CAUC_lori_council_decision_confirm:0 "召集众人"
 CAUC.0110.t:0 "院长们的条件"
 CAUC.0110.desc:0 "院长们愿意讨论和解，但请求我承诺：在他们审议之前，不强行推行任何协议。使者则说，拖延会冒犯邻近教会。我可以保护修道院的自主，支持加强联系，或要求双方先作出保障。"
 CAUC.0110.a:0 "让各修道院自行审议本身的礼仪。"
 CAUC.0110.b:0 "资助对话，并翻译各项提议。"
 CAUC.0110.c:0 "先保障当地礼仪，再商议协议。"
 CAUC.0111.t:0 "页边的批注"
 CAUC.0111.desc:0 "一份译出的提议送到了抄写员手中。一位读者认为，措辞保留了当地习惯；另一位却从页边批注中发现了隐藏的妥协。院长们请求再作一份译文，然后继续讨论。这需要时间，也需要钱。"
 CAUC.0111.a:0 "出钱，请他们重新审读。"
 CAUC.0111.b:0 "搁置这项提议，保留现有保障。"
 CAUC.0112.t:0 "讨论的记录"
 CAUC.0112.desc:0 "讨论结束了，教会并未合并成一个机构。抄写员记下了各方论据，我向修道院作出的承诺也仍然有效。他们问，我是否愿意出钱传抄这份记录，还是只将它留在各院的藏书中。"
 CAUC.0112.a:0 "让其他学者也读到这些讨论。"
 CAUC.0112.b:0 "将记录留在修道院。"
 CAUC_lori_autonomy:0 "修道院自主"
 CAUC_lori_autonomy_desc:0 "当地修道院保有自身礼仪与院务的自主权。"
 CAUC_lori_rapprochement:0 "教会对话"
 CAUC_lori_rapprochement_desc:0 "翻译与讨论促进学术，但当地反对者仍不信任这些提议。"
 CAUC_lori_guarantees:0 "当地礼仪保障"
 CAUC_lori_guarantees_desc:0 "有经费支持的协议保障当地习俗，同时允许开展对话。"
 CAUC_ani_sanctuary_decision:0 "裁定阿尼主教座堂的用途"
 CAUC_ani_sanctuary_decision_desc:0 "主教座堂曾易手，如今的会众害怕它再次改换用途。请愿者带来了契据、往事和征服所得的主张。我将裁定这座建筑的用途，并决定如何安置被迫离开的会众。"
 CAUC_ani_sanctuary_decision_tooltip:0 "记录圣所用途，裁定双方主张，并保障另一处礼拜场所。此事不会改变全县信仰。"
 CAUC_ani_sanctuary_decision_context:0 "阿尼主教座堂在1064年被征服后改作清真寺，1124年恢复教堂用途。初始用途参照这两个年代，此后保存玩家的决定。请愿与裁决情节为游戏创作。"
 CAUC_ani_sanctuary_decision_confirm:0 "召集众人"
 CAUC_ani_church_use:0 "主教座堂现记为教堂。"
 CAUC_ani_mosque_use:0 "主教座堂现记为清真寺。"
 CAUC.0120.t:0 "一座建筑，两方主张"
 CAUC.0120.desc:0 "请愿者在我面前摊开文书。一方追溯主教座堂的祝圣，另一方援引征服后授予的权利。改换用途需要修缮与新的捐产。无论如何裁定，被迫离开的会众都请求一处不受干扰的礼拜场所。"
 CAUC.0120.a:0 "恢复主教座堂的基督教礼拜。"
 CAUC.0120.b:0 "为清真寺用途拨付捐产。"
 CAUC.0120.c:0 "确认现有用途，保障其他社群礼拜。"
 CAUC.0121.t:0 "钥匙与契据"
 CAUC.0121.desc:0 "建筑用途已经入册。如今，书记们还要划定捐产，为诉求未获准的会众安排另一处礼拜场所。请愿者又对租金与出入权发生争执。勘查需要花钱；直接依旧契执行更快，却难免招怨。"
 CAUC.0121.a:0 "出钱请测量员厘清界址。"
 CAUC.0121.b:0 "依现有契据执行。"
 CAUC.0122.t:0 "礼拜之所"
 CAUC.0122.desc:0 "两个社群都收到了裁决副本。主教座堂的用途继续记在册中，另一方的礼拜场所也得到了保护承诺。书记们问，我是否愿意资助那里的修缮，还是交给会众自行维护。"
 CAUC.0122.a:0 "向另一方会众拨付修缮款。"
 CAUC.0122.b:0 "保护已有保障，维护由他们负责。"
 CAUC_ani_church_restored:0 "恢复礼拜的主教座堂"
 CAUC_ani_church_restored_desc:0 "主教座堂已恢复基督教礼拜，但仍有另一方的权利争议。"
 CAUC_ani_mosque_endowed:0 "获拨捐产的清真寺"
 CAUC_ani_mosque_endowed_desc:0 "捐产支持清真寺运作，但建筑仍有另一方的权利争议。"
 CAUC_ani_existing_use:0 "礼拜场所保障"
 CAUC_ani_existing_use_desc:0 "圣所维持现有用途，其他会众也得到保护。"
 CAUC_alan_mission_decision:0 "接见阿兰传教士"
 CAUC_alan_mission_decision_desc:0 "基督教使者请求土地与通行保障。当地长老担心，他们家族世代聚会的圣所将受威胁。我将接见使者，决定资助传教、划定界限，还是令其离开。"
 CAUC_alan_mission_decision_tooltip:0 "通过三阶段争论处理传教与地方仪式的关系。政策持续五年，不强制全县改宗。"
 CAUC_alan_mission_decision_context:0 "马苏第记载，932年阿兰驱逐了基督教教士。这一反弹的范围仍不明确，改宗也并非一蹴而就。本事件使用地方圣所的叙事，不将近现代奥塞梯的神名直接倒推至九世纪。"
 CAUC_alan_mission_decision_confirm:0 "召集众人"
 CAUC.0130.t:0 "传教使团的请求"
 CAUC.0130.desc:0 "使者带来了书籍，请求一处房舍用于教导。长老回答，各家族早已有自己的聚会场所与誓约。他担心，新教堂既要占地，也要禁止这些仪式。我必须给使者明确答复。"
 CAUC.0130.a:0 "提供土地与房舍，支持教导。"
 CAUC.0130.b:0 "允许教导，但须保障地方圣所。"
 CAUC.0130.c:0 "护送传教士离开我的领地。"
 CAUC.0131.t:0 "圣所前的誓约"
 CAUC.0131.desc:0 "地方圣所的一次聚会引发了争执。长老要求尊重他们的誓约，传教的支持者则怀疑，这样的聚会是否能与基督教教导并存。军官们请求公开听证，免得争论演变成家族仇杀。"
 CAUC.0131.a:0 "资助听证，记下双方的界限。"
 CAUC.0131.b:0 "依我先前的决定处置。"
 CAUC.0132.t:0 "家族记得的事"
 CAUC.0132.desc:0 "长老与传教的支持者都收到了我的条款，但双方并未忘记争执。书记愿意记下各项地方约定，免得下次请愿又从众说纷纭的往事谈起。我可以资助他，也可以让各家族保留自己的说法。"
 CAUC.0132.a:0 "以文书保存约定。"
 CAUC.0132.b:0 "由各自的见证人记住约定。"
 CAUC_alan_mission_supported:0 "获资助的基督教传教"
 CAUC_alan_mission_supported_desc:0 "传教使团得到土地与保护，当地家族却对其影响存有异议。"
 CAUC_alan_old_rites_protected:0 "地方圣所保障"
 CAUC_alan_old_rites_protected_desc:0 "地方仪式受到保护，传教士可在约定界限内教导。"
 CAUC_alan_mission_dismissed:0 "传教士被送走"
 CAUC_alan_mission_dismissed_desc:0 "使团离开后，长老的地位得到巩固，传教带来的资助也随之终止。"
 CAUC_tondrakian_inquiry_decision:0 "听取通基拉德派的讲道"
 CAUC_tondrakian_inquiry_decision_desc:0 "村庄传来消息：有人聚会反对圣像，并质疑教士收租与征收什一税的权利。教会要求调查。我将听取讲道者，查明地产争执，再决定庇护、镇压，或加入他们。"
 CAUC_tondrakian_inquiry_decision_tooltip:0 "开始对斯姆巴特·扎雷哈万齐所创礼制的五阶段调查。亚美尼亚使徒教会统治者可花费500虔诚加入，并使阿帕胡尼克改奉礼制。创立者去世后的调查由在世追随者出面。"
 CAUC_tondrakian_inquiry_decision_context:0 "九至十一世纪的亚美尼亚已有通基拉德社群记录。许多材料来自反对他们的教会作者，包括格里戈尔·马吉斯特罗斯。本拓展采用$tenet_aniconism_name$、$tenet_communal_possessions_name$、$tenet_unrelenting_faith_zandik_name$与男女平等，作为此次指定的游戏建模。"
 CAUC_tondrakian_inquiry_decision_confirm:0 "召集众人"
 CAUC.0140.t:0 "没有圣像的聚会"
 CAUC.0140.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。来客描述了一场没有圣像的聚会。男女轮流发言，没有世袭教士宣称有权管辖他们。教会使者称之为乱象，要求我取缔聚会。作出裁决前，我须决定如何调查。"
 CAUC.0140.a:0 "由我保护村民，听取他们的陈述。"
 CAUC.0140.b:0 "先让教会提出指控。"
 CAUC.0140.c:0 "出钱请书记记录双方说法。"
 CAUC.0141.t:0 "谁有权发言？"
 CAUC.0141.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。聚会中的一名女子请求亲自回应指控。使者坚持，教义问题只能由受圣秩的男子发言。村民回答，信仰不会让男女有不同的价值。这场听证将接纳她的证词，或遵循使者的程序。"
 CAUC.0141.a:0 "让她在我的宫廷发言。"
 CAUC.0141.b:0 "此次听证依教会程序进行。"
 CAUC.0142.t:0 "共同持有的田地"
 CAUC.0142.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。聚会的陈述转到了土地问题。几个家族共同耕种田地，请求收成先供养各户，再由领主收租。教会出示契据，声称这些田地归它所有。争论已不只关乎礼拜：必须有人裁定谁有权收粮。"
 CAUC.0142.a:0 "征租前先行勘查。"
 CAUC.0142.b:0 "裁决前暂停有争议的租赋。"
 CAUC.0142.c:0 "调查期间照旧征收。"
 CAUC.0143.t:0 "统治者的裁决"
 CAUC.0143.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。指控与村民的答辩，我都已听过。他们要求不设圣像的聚会、共同财产，以及反抗压迫者的权利。代表们坚持，男女必须平等。我可以庇护这一社群、执行教会禁令，或亲自改奉他们的礼制。"
 CAUC.0143.a:0 "保护聚会，但不改奉礼制。"
 CAUC.0143.b:0 "取缔聚会，维持禁令。"
 CAUC.0143.c:0 "我将作为通基拉德派与他们站在一起。"
 CAUC.0144.t:0 "裁决之后"
 CAUC.0144.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。裁决已经传到村庄。聚会、租赋与宗教权威的处置，将影响村民与我的官员打交道的方式。书记愿意记录条款与听证证词，免得下次争论抹去今日的承诺。"
 CAUC.0144.a:0 "记下男女平等的地位。"
 CAUC.0144.b:0 "写下处置与听证证词。"
 CAUC.0144.c:0 "由我的官员执行裁决。"
 CAUC_tondrakian_refuge:0 "获庇护的通基拉德聚会"
 CAUC_tondrakian_refuge_desc:0 "统治者庇护这一社群，但反对者仍质疑其聚会与共同财产。"
 CAUC_tondrakian_suppressed:0 "通基拉德聚会受镇压"
 CAUC_tondrakian_suppressed_desc:0 "宗教权威欢迎禁令，但执行镇压使村庄不安。"
 CAUC_tondrakian_assembly:0 "通基拉德共同聚会"
 CAUC_tondrakian_assembly_desc:0 "统治者与本县改奉通基拉德礼制，支持平等参与和共同财产。"
 CAUC_tondrakian_rite:0 "通基拉德礼制"
 CAUC_tondrakian_rite_adj:0 "通基拉德派"
 CAUC_tondrakian_rite_adherent:0 "通基拉德派信徒"
 CAUC_tondrakian_rite_adherent_plural:0 "通基拉德派信徒"
 CAUC_smbat_zarehavantsi_name:0 "斯姆巴特·扎雷哈万齐"
 CAUC_tondrakian_rite_desc:0 "与通德拉克聚会社群相关的亚美尼亚使徒教会分支礼制。$generic_rite_focus_tenet_aniconism$"
 CAUC_tondrakian_rite_founded_desc:0 "[ROOT.Rite.GetNameNoTooltip]由[GetGlobalVariable('CAUC_tondrakian_founder').Char.GetFullName]于[GetGlobalVariable('CAUC_tondrakian_founding_year').GetValue|0]年在[GetGlobalVariable('CAUC_tondrakian_origin').Title.GetNameNoTier]创立，是[ROOT.Rite.GetFaith.GetAdjective]信仰的分支礼制。[ROOT.Rite.Custom('GetGenericRiteTenetSentence')]"
