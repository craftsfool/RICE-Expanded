l_simp_chinese:
 CAUC_derbent_guards_decision:0 "在$c_derbent$招募罗斯近卫"
 CAUC_derbent_guards_decision_desc:0 "一队罗斯战士来到城门前，愿意为我效力。队长承诺忠诚，城里的传教士却反对让异教徒守在我身旁。我将听取双方的意见，再决定近卫的地位。"
 CAUC_derbent_guards_decision_tooltip:0 "接见一名斯拉夫信仰的罗斯队长，招募500名事件兵。若有空缺，可聘为极佳称职度的贴身护卫；也可只雇用战团。"
 CAUC_derbent_guards_decision_context:0 "989—990年，传教士穆萨·图西要求杰尔宾特的迈蒙交出罗斯近卫，让他们改信，否则处死。迈蒙拒绝，随后遭到围城，并带着近卫离开。本事件改编这一争端，不重现当时的人物。"
 CAUC_derbent_guards_decision_confirm:0 "召集众人"
 CAUC.0100.t:0 "城门前的誓言"
 CAUC.0100.desc:0 "[CAUC_rus_speaker.GetFirstName]将一面伤痕累累的盾牌放在我脚边。五百名罗斯战士随这位队长沿里海商路而来。他依旧向斯拉夫诸神起誓：“你的钱养活我的人，我的矛便守住你的门。”我可以将他聘入内廷，也可以只雇用战团，不让他守在我的寝室旁。"
 CAUC.0100.a:0 "你来做我的贴身护卫，你的人加入我的军队。"
 CAUC.0101.t:0 "传教士的要求"
 CAUC.0101.desc:0 "传教士在营房外聚起人群：“一个异教徒，竟要站得比我们更靠近统治者？”[CAUC_rus_speaker.GetFirstName]拒绝在刀剑逼迫下改宗。战士们已经受雇，现在争的是队长的誓言，以及他能否进入我的内廷。"
 CAUC.0101.a:0 "我为他的誓言担保。"
 CAUC.0101.b:0 "让他自由听取教导，不强迫改宗。"
 CAUC.0101.c:0 "战团照约效力，队长不享宗教特权。"
 CAUC.0102.t:0 "城里的回应"
 CAUC.0102.desc:0 "值守已经安排妥当，队长却仍在等一个公开的答复。人群叫嚷时，我是否站在他们身旁，战士们都会记住。亲自款待需要粮食与酒；一纸命令不花钱，也给不了多少保证。"
 CAUC.0102.a:0 "来我的桌前同饮，我的承诺无需猜疑。"
 CAUC.0102.b:0 "你的战团已有命令。"
 CAUC_rus_protected:0 "受保护的罗斯近卫"
 CAUC_rus_protected_desc:0 "统治者不顾当地宗教人士的反对，保护异教近卫。"
 CAUC_rus_instructed:0 "近卫的宗教教导"
 CAUC_rus_instructed_desc:0 "宗教教导与新的效力条件使部分外来近卫留下。"
 CAUC_rus_dismissed:0 "罗斯特权受限"
 CAUC_rus_dismissed_desc:0 "战团仍按军约效力，但队长未获另享宗教特权的保障。"
 CAUC_lori_council_decision:0 "听取$c_lori$教会的争论"
 CAUC_lori_council_decision_desc:0 "修道院对与邻近教会加强联系的提议意见不一。有些人担心，和解会使他们失去自身礼仪与修道院的自主权。我可以主持讨论，决定给予何种保障或资助。"
 CAUC_lori_council_decision_tooltip:0 "在修道院自主、教会对话与双方保障之间作出选择。三阶段讨论将形成持续五年的政策。"
 CAUC_lori_council_decision_context:0 "1170年代亚美尼亚与拜占庭商议教会合一时，萨纳欣与哈格帕特的领袖反对妥协，并缺席赫罗姆克拉会议；该会议有1178或1179年两种定年。本地争论是游戏改编，不是会议本身。"
 CAUC_lori_council_decision_confirm:0 "召集众人"
 CAUC.0110.t:0 "院长们的条件"
 CAUC.0110.desc:0 "[CAUC_abbot_speaker.GetFirstName]把协议推回桌子另一端。[CAUC_envoy_speaker.GetFirstName]在他身旁摊开希腊语手稿。院长不肯让译者拿本院的祷文作交易，使者则问，谁愿意与他一起读清那些有争议的字句？"
 CAUC.0110.a:0 "院长，你留下，为本院的祷文辩护。"
 CAUC.0110.b:0 "请使者教我的学者读原文。"
 CAUC.0110.c:0 "双方都可发言，我出钱另译一份。"
 CAUC.0111.t:0 "页边的批注"
 CAUC.0111.desc:0 "第二份手稿送来了，页边写着愤怒的批注：被译成“和议”的一个词，也可能意味着臣服。[CAUC_abbot_speaker.GetFirstName]请我把那一段读出来。[CAUC_envoy_speaker.GetFirstName]愿意教我；若撤回提议，两人便都不必在屈辱的文书上签名。"
 CAUC.0111.a:0 "先教我读懂这些字句，再让我盖印。"
 CAUC.0111.b:0 "撤回这一措辞，不准强迫任何人签字。"
 CAUC.0112.t:0 "讨论的记录"
 CAUC.0112.desc:0 "双方仍各守自己的教会，但论辩已写满了一册新书。[CAUC_abbot_speaker.GetFirstName]用亚麻布包好，送到我面前。我可以把这份记录收入藏书，也可以让编写者留在内廷，从此为我讲学。"
 CAUC.0112.a:0 "将论辩装订成册，收入我的藏书。"
 CAUC.0112.b:0 "院长留下，做我的老师。"
 CAUC_lori_autonomy:0 "修道院自主"
 CAUC_lori_autonomy_desc:0 "当地修道院保有自身礼仪与院务的自主权。"
 CAUC_lori_rapprochement:0 "教会对话"
 CAUC_lori_rapprochement_desc:0 "翻译与讨论促进学术，但当地反对者仍不信任这些提议。"
 CAUC_lori_guarantees:0 "当地礼仪保障"
 CAUC_lori_guarantees_desc:0 "有经费支持的协议保障当地习俗，同时允许开展对话。"
 CAUC_ani_sanctuary_decision:0 "裁定阿尼主教座堂的用途"
 CAUC_ani_sanctuary_decision_desc:0 "主教座堂曾易手，如今的会众害怕它再次改换用途。请愿者带来了契据、往事和征服所得的主张。我将裁定这座建筑的用途，并决定如何安置被迫离开的会众。"
 CAUC_ani_sanctuary_decision_tooltip:0 "记录圣所用途，裁定双方主张，并保障另一处礼拜场所。此事不会改变全县信仰。"
 CAUC_ani_sanctuary_decision_context:0 "阿尼主教座堂在1064年被征服后改作清真寺，1124年恢复教堂用途。初始用途参照这两个年代，此后保存玩家的决定。请愿与裁决情节为游戏创作。"
 CAUC_ani_sanctuary_decision_confirm:0 "召集众人"
 CAUC_ani_church_use:0 "主教座堂现记为教堂。"
 CAUC_ani_mosque_use:0 "主教座堂现记为清真寺。"
 CAUC.0120.t:0 "一座建筑，两方主张"
 CAUC.0120.desc:0 "[CAUC_warden_speaker.GetFirstName]把主教座堂的钥匙放在一份磨损的祝圣文书旁。[CAUC_imam_speaker.GetFirstName]拿出了清真寺获授的契据。两人的会众都在门外等候。失去建筑的一方需要新的礼拜之所，两人也都要求一个能向街上人群交代的裁决。"
 CAUC.0120.a:0 "把主教座堂钥匙交还基督徒管理人。"
 CAUC.0120.b:0 "确认清真寺的契据与捐产。"
 CAUC.0120.c:0 "钥匙留在现有会众手里，双方都不得驱逐对方。"
 CAUC.0121.t:0 "钥匙与契据"
 CAUC.0121.desc:0 "裁决令街上的人群分成了两派。[CAUC_warden_speaker.GetFirstName]与[CAUC_imam_speaker.GetFirstName]追问：谁来保证信徒能平安前往礼拜？我可以把两人请入宫廷继续协商，或派人值守，让会众各自寻找房舍。"
 CAUC.0121.a:0 "两位代表都在我的屋檐下协商。"
 CAUC.0121.b:0 "出钱派人保护双方会众。"
 CAUC.0122.t:0 "礼拜之所"
 CAUC.0122.desc:0 "钥匙已有归属。另一方会众清出了一间空屋，屋顶却在漏雨。[CAUC_warden_speaker.GetFirstName]与[CAUC_imam_speaker.GetFirstName]一同回来，一个拿着契据，一个拿着木料清单。我的裁决可以留下能用的礼拜房舍，也可能只剩一扇锁上的门。"
 CAUC.0122.a:0 "为迁出的会众修好屋顶。"
 CAUC.0122.b:0 "让两位管理人一起兑现这些承诺。"
 CAUC_ani_church_restored:0 "恢复礼拜的主教座堂"
 CAUC_ani_church_restored_desc:0 "主教座堂已恢复基督教礼拜，但仍有另一方的权利争议。"
 CAUC_ani_mosque_endowed:0 "获拨捐产的清真寺"
 CAUC_ani_mosque_endowed_desc:0 "捐产支持清真寺运作，但建筑仍有另一方的权利争议。"
 CAUC_ani_existing_use:0 "礼拜场所保障"
 CAUC_ani_existing_use_desc:0 "圣所维持现有用途，其他会众也得到保护。"
 CAUC_alan_mission_decision:0 "接见阿兰传教士"
 CAUC_alan_mission_decision_desc:0 "基督教使者请求土地与通行保障。当地长老担心，他们家族世代聚会的圣所将受威胁。我将接见使者，决定资助传教、划定界限，还是令其离开。"
 CAUC_alan_mission_decision_tooltip:0 "接见正教传教士与阿兰长老，延请教师或招募北方骑手，裁定土地争执，并决定自己是否受洗。"
 CAUC_alan_mission_decision_context:0 "马苏第记载，932年阿兰驱逐了基督教教士。这一反弹的范围仍不明确，改宗也并非一蹴而就。本事件使用地方圣所的叙事，不将近现代奥塞梯的神名直接倒推至九世纪。"
 CAUC_alan_mission_decision_confirm:0 "召集众人"
 CAUC.0130.t:0 "传教使团的请求"
 CAUC.0130.desc:0 "[CAUC_missionary_speaker.GetFirstName]在长老面前打开福音书。还没说出教堂的选址，[CAUC_elder_speaker.GetFirstName]就打断了他：“那片土地维系着我们各家的誓约。”传教士愿为我的内廷提供教师，长老则许诺派来熟悉北方每一条山道的骑手。"
 CAUC.0130.a:0 "传教士在我的宫廷讲学，我来提供土地。"
 CAUC.0130.b:0 "双方都留下，彼此答辩。"
 CAUC.0130.c:0 "长老，带你的骑手来；使团不会得到拨地。"
 CAUC.0131.t:0 "圣所前的誓约"
 CAUC.0131.desc:0 "[CAUC_elder_speaker.GetFirstName]带来了一根断裂的界桩。有人夜里挪动了它，传教士的学生曾在附近出现。[CAUC_missionary_speaker.GetFirstName]否认下过命令。几步宽的土地就可能引发仇杀；我必须要求赔偿，或坚持先前的拨地。"
 CAUC.0131.a:0 "由我出钱恢复界桩。"
 CAUC.0131.b:0 "使团必须让出争议土地。"
 CAUC.0132.t:0 "家族记得的事"
 CAUC.0132.desc:0 "界线已经裁定。[CAUC_missionary_speaker.GetFirstName]请我亲自回应他的教导。[CAUC_elder_speaker.GetFirstName]等在门口，不愿代我作出信仰的承诺。若我接受洗礼，那是我自己的选择，并非命令阿兰所有家族一同改宗。"
 CAUC.0132.a:0 "我将受洗，接受传教士的信仰。"
 CAUC.0132.b:0 "留下做教师，信仰不可强求。"
 CAUC_alan_mission_supported:0 "获资助的基督教传教"
 CAUC_alan_mission_supported_desc:0 "传教使团得到土地与保护，当地家族却对其影响存有异议。"
 CAUC_alan_old_rites_protected:0 "地方圣所保障"
 CAUC_alan_old_rites_protected_desc:0 "地方仪式受到保护，传教士可在约定界限内教导。"
 CAUC_alan_mission_dismissed:0 "传教士被送走"
 CAUC_alan_mission_dismissed_desc:0 "使团离开后，长老的地位得到巩固，传教带来的资助也随之终止。"
 CAUC_tondrakian_inquiry_decision:0 "听取通德拉基派的讲道"
 CAUC_tondrakian_inquiry_decision_desc:0 "村庄传来消息：有人聚会反对圣像，并质疑教士收租与征收什一税的权利。教会要求调查。我将听取讲道者，查明地产争执，再决定庇护、镇压，或加入他们。"
 CAUC_tondrakian_inquiry_decision_tooltip:0 "开始对斯姆巴特·扎雷哈万齐所创礼制的五阶段调查。亚美尼亚使徒教会统治者可花费500虔诚加入，并使阿帕胡尼克改奉礼制。创立者去世后的调查由在世追随者出面。"
 CAUC_tondrakian_inquiry_decision_context:0 "九至十一世纪的亚美尼亚已有通德拉基社群记录。许多材料来自反对他们的教会作者，包括格里戈尔·马吉斯特罗斯。本拓展采用$tenet_aniconism_name$、$tenet_communal_possessions_name$、$tenet_unrelenting_faith_zandik_name$与男女平等，作为此次指定的游戏建模。"
 CAUC_tondrakian_inquiry_decision_confirm:0 "召集众人"
 CAUC.0140.t:0 "没有圣像的聚会"
 CAUC.0140.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。来客描述了一场没有圣像的聚会。男女轮流发言，没有世袭教士宣称有权管辖他们。教会使者称之为乱象，要求我取缔聚会。作出裁决前，我须决定如何调查。"
 CAUC.0140.a:0 "由我保护村民，听取他们的陈述。"
 CAUC.0140.b:0 "先让教会提出指控。"
 CAUC.0140.c:0 "出钱请书记记录双方说法。"
 CAUC.0141.t:0 "谁有权发言？"
 CAUC.0141.desc:0 "[CAUC_representative_speaker.GetFirstName]从斯姆巴特的追随者中走出。使者命令她闭嘴，她却亲手把租赋账册放到我桌上：“我能让田地养活众人，也能替耕种的人说话。”允许她答辩，就意味着给聚会社群一位能在我的内廷发言的代表。"
 CAUC.0141.a:0 "让她在我的宫廷发言。"
 CAUC.0141.b:0 "此次听证依教会程序进行。"
 CAUC.0142.t:0 "共同持有的田地"
 CAUC.0142.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。聚会的陈述转到了土地问题。几个家族共同耕种田地，请求收成先供养各户，再由领主收租。教会出示契据，声称这些田地归它所有。争论已不只关乎礼拜：必须有人裁定谁有权收粮。"
 CAUC.0142.a:0 "征租前先行勘查。"
 CAUC.0142.b:0 "裁决前暂停有争议的租赋。"
 CAUC.0142.c:0 "调查期间照旧征收。"
 CAUC.0143.t:0 "统治者的裁决"
 CAUC.0143.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。指控与村民的答辩，我都已听过。他们要求不设圣像的聚会、共同财产，以及反抗压迫者的权利。代表们坚持，男女必须平等。我可以庇护这一社群、执行教会禁令，或亲自改奉他们的礼制。"
 CAUC.0143.a:0 "保护聚会，但不改奉礼制。"
 CAUC.0143.b:0 "取缔聚会，维持禁令。"
 CAUC.0143.c:0 "我将作为通德拉基派与他们站在一起。"
 CAUC.0144.t:0 "裁决之后"
 CAUC.0144.desc:0 "[CAUC_tondrakian_speaker.GetFullName]为聚会众人发言。裁决已经传到村庄。聚会、租赋与宗教权威的处置，将影响村民与我的官员打交道的方式。书记愿意记录条款与听证证词，免得下次争论抹去今日的承诺。"
 CAUC.0144.a:0 "记下男女平等的地位。"
 CAUC.0144.b:0 "写下处置与听证证词。"
 CAUC.0144.c:0 "由我的官员执行裁决。"
 CAUC_tondrakian_refuge:0 "获庇护的通德拉基聚会"
 CAUC_tondrakian_refuge_desc:0 "统治者庇护这一社群，但反对者仍质疑其聚会与共同财产。"
 CAUC_tondrakian_suppressed:0 "通德拉基聚会受镇压"
 CAUC_tondrakian_suppressed_desc:0 "宗教权威欢迎禁令，但执行镇压使村庄不安。"
 CAUC_tondrakian_assembly:0 "通德拉基共同聚会"
 CAUC_tondrakian_assembly_desc:0 "统治者与本县改奉通德拉基礼制，支持平等参与和共同财产。"
 CAUC_tondrakian_rite:0 "通德拉基礼制"
 CAUC_tondrakian_rite_adj:0 "通德拉基派"
 CAUC_tondrakian_rite_adherent:0 "通德拉基派信徒"
 CAUC_tondrakian_rite_adherent_plural:0 "通德拉基派信徒"
 CAUC_smbat_zarehavantsi_name:0 "斯姆巴特·扎雷哈万齐"
 CAUC_tondrakian_rite_desc:0 "与通德拉克聚会社群相关的亚美尼亚使徒教会分支礼制。$generic_rite_focus_tenet_aniconism$"
 CAUC_tondrakian_rite_founded_desc:0 "[ROOT.Rite.GetNameNoTooltip]由[GetGlobalVariable('CAUC_tondrakian_founder').Char.GetFullName]于[GetGlobalVariable('CAUC_tondrakian_founding_year').GetValue|0]年在[GetGlobalVariable('CAUC_tondrakian_origin').Title.GetNameNoTier]创立，是[ROOT.Rite.GetFaith.GetAdjective]信仰的分支礼制。[ROOT.Rite.Custom('GetGenericRiteTenetSentence')]"
 CAUC_rus_event_army:0 "罗斯战团"
 CAUC_scholarly_book_modifier:0 "学术手稿"
 CAUC_scholarly_book_modifier_desc:0 "高加索学者的著述。"
 CAUC_lori_book:0 "《洛里论辩录》"
 CAUC_lori_book_desc:0 "由赞助者出资保存的洛里教会论据与译文。"
 CAUC_gelati_book:0 "《库塔伊西学记》"
 CAUC_gelati_book_desc:0 "库塔伊西附近教师编写的装订书册。"
 CAUC_tondrakian_book:0 "《聚会见证录》"
 CAUC_tondrakian_book_desc:0 "斯姆巴特追随者的见证，包括听证中发言的女子。"
 CAUC.0100.b:0 "我只雇用这五百名战士。"
 CAUC.0121.c:0 "由各自长老维持秩序。"
 CAUC.0131.c:0 "拨地照旧，将申诉交给我的官员。"
 CAUC.0132.c:0 "我与长老同骑，保留自己的信仰。"
 CAUC_alan_event_army:0 "北方山道骑手"
 CAUC.0150.t:0 "通德拉克的新礼制"
 CAUC.0150.desc:0 "[CAUC_tondrakian_speaker.GetFullName]已在通德拉克附近的亚美尼亚村庄讲道。追随者不设圣像、共同持有财产，并否认男女在上帝面前有不同地位。教会要求他噤声。他的礼制如今已有名称；阿帕胡尼克的统治者可以听取追随者的陈述，决定庇护、囚禁，或加入他们。"
 CAUC.0150.b:0 "我将加入这一亚美尼亚礼制。"
 CAUC.0150.a:0 "这些聚会的消息会传开。"
 CAUC.0001.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。监工呈上了道路与城墙修缮的账目。商人希望有更多地方安置商队，驻军请求补充物资，附近的聚落则希望我明确各自的义务。未来几年，我的资金只够支持其中一项提议。"
 CAUC.0001.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0002.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。修士带来了一份清单：抄书用的羊皮纸、学生的资助，还有他们工作房间的修缮费用。我的拨款只够完成其中一项。他们希望我先作出选择，再安排这笔钱的用途。"
 CAUC.0002.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0003.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。各户派来代表商议修缮事宜。有的愿意出劳力，有的宁愿提供粮食或石料。财政总管希望所有人都遵守同一套规定，代表们却请求我考虑各户的余力。"
 CAUC.0003.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0004.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。教师们请求拨款购书，好让学生继续求学。一名抄写员还提议编成一部书，在其中注明我这位赞助人的名字。我必须决定，拨款中有多少该用来为我扬名。"
 CAUC.0004.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0010.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。监工发现，通往$c_derbent$的道路旁有一段挡土墙受损。工人现在就能修好，但需要额外的工钱。推迟修缮能省下这笔开支，却得让附近各户自行应付损坏带来的麻烦。"
 CAUC.0010.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0011.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。一支商队抵达$c_derbent$，商人们抱怨，分给他们安置牲畜的地方太过拥挤。他们愿意出钱换取更多空间。财政总管提醒我，答应这一请求，会给使用同一片场地的居民带来不便。"
 CAUC.0011.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0012.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。负责守卫通道的军官向我展示了剩余的储备。这些物资足以维持眼下的值守，却撑不了太久。我可以购置补给，也可以缩短士兵的驻守期限。"
 CAUC.0012.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0013.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。两个聚落为$c_derbent$附近一段道路的养护争执不下。双方都声称，对方从去年的修缮中获益更多。他们的代表带来了账目，请求我裁定该如何分担工作。"
 CAUC.0013.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0014.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。官员禀报，有一小队访客希望经由$c_derbent$通行。他们带着引荐信，请求帮忙寻找护卫。我可以让家臣替他们安排，也可以让他们自行去城里张罗。"
 CAUC.0014.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0015.desc:0 "[CAUC_overseer_speaker.GetFirstName]来到我面前，陈述此事。落石堵住了通往$c_derbent$的一部分道路。行人尚能通过，马车却得等工人清出通路。监工请求拨款，好在下一支商队抵达前完成清理。"
 CAUC.0015.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0020.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。$c_lori$的抄写员耗用的羊皮纸超出了拨款所能负担的数量。他们请求我再买一批，或允许他们推迟部分抄写工作。"
 CAUC.0020.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0021.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。$c_lori$的一位教师来信，说有名学生家中无力承担继续求学的费用。教师认为这名学生颇有才干，请求我负担开销。"
 CAUC.0021.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0022.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。一位来自$c_lori$的学者送来了某部神学著作中一段文字的两种读法。抄写员们争论该将哪一种收入新抄本。学者邀请我听听双方的依据。"
 CAUC.0022.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0023.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。一名抄写员提议在新书的献辞中记下我的家族。其他赞助人已经负担了大半费用。我可以要求将自己的家族列在首位，也可以请他一并记下所有人的贡献。"
 CAUC.0023.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0024.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。$c_lori$一间书房的屋顶破损，雨水漏了进来。学者们已经搬走书籍，但需要帮助修好房间，才能在那里继续抄写。"
 CAUC.0024.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0025.desc:0 "[CAUC_scholar_speaker.GetFirstName]来到我面前，陈述此事。一位学者从$c_lori$带来了一部抄写完成的书，愿意在我的案前为我讲解。侍从提醒我，还有其他事务等着处理。我可以先将它们搁置，用整个下午读书。"
 CAUC.0025.d:0 "请学者编成手稿，收入我的藏书。"
 CAUC.0030.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。$c_svaneti$的代表们争论，下次修缮该由哪些人家出工。一户已经出过两次劳力，另一户则声称，自己上次提供了石料来代替出工。"
 CAUC.0030.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0031.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。$c_svaneti$的一名石匠提议修缮一座塔楼的上层。那户人家能提供材料，却请求我支付石匠的工钱。"
 CAUC.0031.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0032.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。$c_svaneti$的监工想召集工人进行修缮。几户人家请求他等到庄稼收完再动工。我必须决定，是尽快完成修缮，还是让他们有时间照料田地。"
 CAUC.0032.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0033.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。$c_svaneti$的代表们聚在一起，核对各户为修缮提供的劳力与物资。他们邀请我听取账目，并确认来年的分担安排。"
 CAUC.0033.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0034.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。一队旅人请求在$c_svaneti$的一户人家借宿，等待天气好转。这户人家余粮不多，请求我从储备中拨些粮食。"
 CAUC.0034.d:0 "请这位能干的代表到我的宫廷效力。"
 CAUC.0035.desc:0 "[CAUC_mason_speaker.GetFirstName]来到我面前，陈述此事。在$c_svaneti$塔楼附近值守的人请求修缮住处，并补充粮食。他们的代表说，这些都属于我曾答应资助的养护事务。"
 CAUC.0035.d:0 "请这位能干的代表到我的宫廷效力。"
